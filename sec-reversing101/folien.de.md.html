<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="vorerfahrungen"><h2>Vorerfahrungen?</h2><ul class="incremental-list simple"><li><p>Wer hat schon einmal Software or Hardware Reverse Engineering betrieben?</p></li><li><p>Wer kennt Java Bytecode?</p></li><li><p>Wer hat Erfahrung mit Python?</p></li></ul></ld-topic>
<ld-topic id="reverse-engineering"><h2>Reverse Engineering</h2><p>Reverse Engineering ist die Analyse von Systemen mit dem Ziel, ihren Aufbau und ihre Funktionsweise zu verstehen.</p><ld-supplemental embed-in-document-flow=""><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung: Reverse Engineering vs Reengineering</span></p><p>Vom Reverse Engineering ist das Reengineering zu unterscheiden. Im Fall von letzteren geht es „nur“ darum die Funktionalität eines bestehenden Systems mit neuen Techniken wiederherzustellen.</p></aside></ld-supplemental><div class="compound incremental"><p>Typische Anwendungsfälle:</p><ul class="incremental simple"><li><p>die Rekonstruktion (von Teilen) des Quellcodes von Programmen, die nur als Binärabbild vorliegen.</p></li><li><p>die Analyse von Kommunikationsprotokollen proprietärer Software</p></li></ul></div></ld-topic>
<ld-topic id="zweck-von-reverse-engineering"><h2>Zweck von Reverse Engineering</h2><ul class="incremental-list simple"><li><p>Herstellung von Interoperabilität</p></li><li><p>Untersuchung auf Schwachstellen</p></li><li><p>Untersuchung auf Copyrightverletzungen</p></li><li><p>Untersuchung auf Backdoors</p></li><li><p>Analyse von Viren, Würmern etc.</p></li><li><p>Umgehung von ungerechtfertigten(?) Schutzmaßnahmen (z. B. bei Malware)</p></li></ul></ld-topic>
<ld-topic id="bootrom-lucke"><h2>Bootrom Lücke</h2><blockquote class="epigraph"><p><strong>CPU-Lücke macht Malware-Infektionen nahezu unumkehrbar</strong></p><p>Die Schwachstelle verschafft Angreifern Zugang zu einer der höchsten Privilegienstufen heutiger PC-Systeme. Schadsoftware entzieht sich damit jeglicher Erkennung.</p><p>[...] Gegenüber Wired erklärten die Forscher, per Sinkclose ließen sich etwa Bootkits installieren, die für das Betriebssystem und gängige Antivirensoftware unsichtbar seien, während Angreifer einen Vollzugriff auf das Zielsystem erhielten.</p><p class="attribution">—August, 2024 - <a class="reference external" href="https://www.golem.de/news/sinkclose-trifft-amd-cpu-luecke-macht-malware-infektionen-nahezu-unumkehrbar-2408-187913.html">Golem.de</a> (<a class="reference external" href="https://www.amd.com/en/resources/product-security/bulletin/amd-sb-7014.html">AMD CVE</a>)</p></blockquote></ld-topic>
<ld-topic id="backdoor-in-16-d-link-routern"><h2>Backdoor in 16 D-Link Routern<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></h2><ul class="simple"><li><p>Angreifer können aus dem lokalen Netzwerk heraus den Telnet-Dienst betroffener D-Link-Router durch Angabe einer bestimmten Ziel URL aktivieren.</p></li><li><p>Die Admin-Zugangsdaten sind in der Firmware hinterlegt.</p></li><li><p>Vermutlich ursprünglich für werksseitige Tests.</p></li><li><p><em>CVSS Base Score</em>: 8.8 (hoch)</p></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://www.golem.de/news/d-link-versteckte-backdoor-in-16-routermodellen-entdeckt-2406-186277.html">20. Juni 2024; Marc Stöckel; Golem.de</a></p></aside></aside></ld-topic>
<ld-topic id="reverse-engineering-grundlegende-schritte"><h2>Reverse Engineering - grundlegende Schritte</h2><ol class="arabic incremental-list dhbw simple"><li><p>Informationsgewinnung zur Gewinnung aller relevanten Informationen über das Produkt.</p></li><li><p>Modellierung mit dem Ziel der (Wieder-)Gewinnung eines (abstrakten) Modells der relevanten Funktionalität.</p></li><li><p>Überprüfung (<span class="eng">review</span>) des Modells auf seine Richtigkeit und Vollständigkeit.</p></li></ol></ld-topic>
<ld-topic id="informationsgewinnung-beispiel"><h2>Informationsgewinnung - Beispiel</h2><p>Gegeben sei eine App zum Ver- und Entschlüsseln von Dateien sowie ein paar verschlüsselte Dateien. Mögliche erste Schritte vor der Analyse von Binärcode:</p><ld-deck><ld-card><ul><li><p>Die ausführbare Datei ggf. mit <span class="docutils literal">file</span> (oder sogar mit <span class="docutils literal">binwalk</span>) überprüfen (z. B. wie wurde die Datei kompiliert und für welches Betriebssystem und Architektur)</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name function">file</span> /usr/bin/openssl
</code><small class="ln">2</small><code data-lineno="2">/usr/bin/openssl: Mach-O universal binary with <span class="literal number integer">2</span> archi<span class="punctuation">..</span>.
</code><small class="ln">3</small><code data-lineno="3">/usr/bin/openssl <span class="punctuation">(</span>for architecture x86_64<span class="punctuation">)</span>:     Mach-O <span class="literal number integer">64</span>-bit
</code><small class="ln">4</small><code data-lineno="4">/usr/bin/openssl <span class="punctuation">(</span>for architecture arm64e<span class="punctuation">)</span>:     Mach-O <span class="literal number integer">64</span>-bit</code></pre></aside></li></ul></ld-card><ld-card class="incremental"><ul><li><p>Die Dateien mit einem (guten) Hexeditor auf Auffälligkeiten untersuchen.</p><img class="align-center" src="pictures/hexeditor.webp" alt="Hexeditor mit Dateninterpretation"><blockquote><ld-supplemental><p>In diesem Falle wurde Hex Fiend (Mac) verwendet. Es erlaubt durch die Anlage von Templates eine einfache Interpretation von Daten.</p></ld-supplemental></blockquote></li></ul></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="caution"><p class="admonition-title" data-theme="caution-header">Vorsicht!</p><p>Die Datei ggf. auf (bekannte) Viren und Malware überprüfen.</p></aside></ld-card><ld-card class="incremental"><ul><li><p>Eine Datei mit einem bekannten Inhalt verschlüsseln und danach vergleichen.</p><aside class="admonition incremental" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Ist die verschlüsselte Datei gleich groß wie die Originaldatei?</p></aside><aside class="admonition incremental" data-theme="answer"><p class="admonition-title" data-theme="answer-header"><span>Antwort</span></p><p>Falls ja, dann werden keine Metainformationen gespeichert und das Passwort kann (ggf.) nicht (leicht) verifiziert werden; da es nicht <em>direkt</em> in der Datei gespeichert sein kann.</p></aside></li></ul></ld-card><ld-card class="incremental"><ul><li><p>Eine Datei mit verschiedenen Passworten verschlüsseln.</p><aside class="admonition incremental" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Sind die Dateien gleich?</p></aside><aside class="admonition incremental" data-theme="answer"><p class="admonition-title" data-theme="answer-header"><span>Antwort</span></p><p>Falls ja, dann ist die Verschlüsselung von einem <em>konstanten Schlüssel</em> abhängig.</p></aside><aside class="admonition incremental" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Gibt es Gemeinsamkeiten?</p></aside><aside class="admonition incremental" data-theme="answer"><p class="admonition-title" data-theme="answer-header"><span>Antwort</span></p><p>Falls ja, dann wäre es möglich, dass das Passwort (gehasht) in der Datei gespeichert wird.</p></aside></li></ul></ld-card><ld-card class="incremental"><ul class="simple"><li><p>Eine Datei mit einem wohldefinierten Muster verschlüsseln, um ggf. den „Mode of Operation“ (insbesondere ECB) zu identifizieren.</p></li></ul></ld-card><ld-card class="incremental"><ul><li><p>Mehrere verschiedene Dateien mit dem gleichen Passwort verschlüsseln</p><aside class="admonition incremental" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Gibt es Gemeinsamkeiten?</p></aside><aside class="admonition incremental" data-theme="answer"><p class="admonition-title" data-theme="answer-header"><span>Antwort</span></p><p>Falls ja, dann wäre es möglich, dass die entsprechenden Teile direkt vom Passwort abgeleitet werden/damit verschlüsselt werden.</p></aside></li></ul></ld-card><ld-card class="incremental"><ul class="simple"><li><p>...</p></li></ul></ld-card><ld-card class="incremental"><ul class="simple"><li><p>Reverse Engineering der App durchführen.</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="rechtliche-aspekte-des-reverse-engineering"><h2>Rechtliche Aspekte des Reverse Engineering</h2><aside class="admonition" data-theme="caution"><p class="admonition-title" data-theme="caution-header">Vorsicht!</p><p>Die Gesetzgebungen unterscheiden sich von Land zu Land teils signifikant.</p></aside><ul class="incremental-list simple"><li><p>Die Rechtslage hat sich in Deutschland mehrfach geändert.</p></li><li><p>Umgehung von Kopierschutzmechanismen ist im Allgemeinen verboten.</p></li><li><p>Lizenzen verbieten das Reverse Engineering häufig; es stellt sich aber die Frage nach der Rechtmäßigkeit der Klauseln.</p></li></ul><aside class="admonition incremental" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Bevor Sie Reverse Engineering von Systemen betreiben, erkundigen sie sich erst über mögliche rechtliche Konsequenzen.</p></aside></ld-topic>
<ld-topic class="new-section transition-scale" id="software-reverse-engineering"><h2>Software Reverse Engineering</h2></ld-topic>
<ld-topic id="ansatze"><h2>Ansätze</h2><ld-story><dl class="incremental-list field-list"><dt>statische Analyse<span class="colon">:</span></dt><dd><p>Studieren des Programms ohne es auszuführen; typischerweise mittels eines Disassemblers oder eines Decompilers.</p></dd><dt>dynamische Analyse<span class="colon">:</span></dt><dd><p>Ausführen des Programms; typischerweise unter Verwendung eines Debuggers oder eines instrumentations Frameworks (z. B. <a class="reference external" href="https://frida.re">Frida</a>).</p></dd><dt>hybride Analyse<span class="colon">:</span></dt><dd><p>Kombination aus statischer und dynamischer Analyse.</p><p>Ansätze wie <a class="reference external" href="https://www.unicorn-engine.org">Unicorn</a>, welches auf <a class="reference external" href="https://www.qemu.org">QEmu</a> aufbaut, erlaubt zum Beispiel die Ausführung von (Teilen von) Binärcode auf einer anderen Architektur als der des Hosts.</p><p>Ein Beispiel wäre die Ausführung einer Methode, die im Code verschlüsselte hinterlegte Strings entschlüsselt (<span class="eng">deobfuscation</span>), um die Analyse zu vereinfachen.</p></dd></dl><div class="compound incremental"><p>Ggf. müssen für Teile des Codes, die die Hostfunktionalität nutzen, Stubs/Mocks bereitgestellt werden.</p></div></ld-story></ld-topic>
<ld-topic id="disassembler"><h2>Disassembler</h2><p>Überführt (maschinenlesbaren) Binärcode in Assemblercode</p><p>Kommandozeilenwerkzeuge (exemplarisch):</p><ul class="simple"><li><p><span class="docutils literal">objdump -d</span></p></li><li><p><span class="docutils literal">gdb</span></p></li><li><p><span class="docutils literal">radare</span></p></li><li><p><span class="docutils literal">javap (für Java)</span></p></li></ul><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Für einfache Programme ist es häufig möglich direkt den gesamten Assemblercode mittels der entsprechenden Werkzeuge zu erhalten. Im Falle komplexer Binärdateien (z. B. im ELF (Linux) und PE (Windows) Format) gilt dies nicht und erfordert ggf. manuelle Unterstützung zum Beispiel durch das Markieren von Methodenanfängen.</p><p>Im Fall von Java <span class="docutils literal">.class</span> ist die Disassemblierung immer möglich.</p></aside></ld-topic>
<ld-topic id="decompiler"><h2>Decompiler</h2><p>Überführt (maschinenlesbarem) Binärcode <em>bestmöglich</em> in Hochsprache (meist C ähnlich oder Java).</p><ld-deck><ld-card><p>Eine <em>kleine</em> Auswahl von verfügbaren Werkzeugen:</p><ul class="simple"><li><p>Hex-Rays IDAPro (kommerziell)</p></li><li><p><a class="reference external" href="https://ghidra-sre.org/">Ghidra</a> (unterstützt fast jede Platform; die Ergebnisse sind sehr unterschiedlich.)</p></li><li><p>JadX (Androids <span class="docutils literal">.dex</span> Format)</p></li><li><p>CFR (Java <span class="docutils literal">.class</span> Dateien)</p></li><li><p>IntelliJ</p></li></ul></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Decompiler sind generell sehr hilfreich, aber gleichzeitig auch fehlerbehaftet. Vieles, dass im Binärcode möglich ist, hat auf der Ebene des Sourcecodes keine Entsprechung. Durch den Einsatz von KI lassen sich ggf. die Ergebnisse verbessern.</p><p>Zum Beispiel unterstützt Java Bytecode beliebige Sprünge. Solcher Code wird aber durch normale Programme, die z. B. in Java, Kotlin, Scala oder Clojure geschrieben wurden, nicht erzeugt. Decompiler kommen deswegen mit solchem Code in der Regel nicht (gut) zurecht.</p></aside></ld-card></ld-deck><ld-supplemental><p>Mittels Decompiler ist es ggf. möglich Code, der zum Beispiel ursprünglich in Kotlin oder Scala geschrieben und für die JVM kompiliert wurde, als Java Code zurückzubekommen.</p><p>Die Ergebnisse sind für Analysezwecke zwar häufig ausreichend gut – von funktionierendem Code jedoch ggf. (sehr) weit entfernt.</p><p><a class="reference external" href="https://decompiler.com">decompiler.com</a> unterstützt eine große Anzahl ausführbaren Dateien.</p></ld-supplemental></ld-topic>

<ld-topic id="debugger"><h2>Debugger</h2><p>Dient der schrittweisen Ausführung des zu analysierenden Codes oder Hardware; ermöglichen zum Beispiel Speicherinspektion und Manipulation.</p><ul class="simple"><li><p>gdb</p></li><li><p>lldb</p></li><li><p>x64dbg (Windows, Open-Source)</p></li><li><p>jdb (Java Debugger)</p></li></ul><ld-supplemental><p class="rubric">Hardware Debugger</p><p>Für das Debuggen von Hardware gibt es entsprechende Werkzeuge, z. B.
<a class="reference external" href="https://www.lauterbach.com">Lauterbach Hardware Debugger</a> (kommerziell und sehr teuer).</p><p>Mittels solcher Werkzeuge ist es möglich die Ausführung von Hardware Schritt für Schritt (<span class="eng">single step mode</span>) zu verfolgen und den Zustand der Hardware (Speicher und Register) zu inspizieren. Dies erfordert jedoch häufig eine JTAG Schnittstelle oder etwas Vergleichbares.</p></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-fade" id="erschwerung-des-reverse-engineering"><h2>Erschwerung des Reverse Engineering</h2></ld-topic>
<ld-topic class="new-subsection" id="obfuscation-verschleierung"><h2>Obfuscation (<span class="ger">Verschleierung</span>)</h2></ld-topic>
<ld-topic id="obfuscation-fur-menschen-unverstandlich-code"><h2>Obfuscation → für Menschen unverständlich Code</h2><ld-story><ul class="incremental-list simple"><li><p>Techniken, die dazu dienen das Reverse Engineering zu erschweren.</p></li><li><p>Häufig eingesetzt ...</p><ul class="incremental-list simple"><li><p>von Malware</p></li><li><p>Adware (im Kontext von Android ein häufig beobachtetes Phänomen)</p></li><li><p>zum Schutz geistigen Eigentums</p></li><li><p>für DRM / Durchsetzung von Kopierrechten</p></li><li><p>zur Prävention von „Cheating“ (insbesondere im Umfeld von Online Games)</p></li><li><p>Wenn das Programm als Source Code vertrieben wird bzw. vertrieben werden muss (JavaScript)</p></li></ul></li><li><p>Arbeiten auf Quellcode oder Maschinencode Ebene</p></li><li><p>Grenze zwischen <em>Code Minimization</em>, <em>Code Optimization</em> und <em>Code Obfuscation</em> ist fließend.</p></li><li><p>Mögliche Werkzeuge (ohne Wertung der Qualität/Effektivität):</p><ul class="simple"><li><p>[Java] Proguard / Dexguard</p></li><li><p>[C/C++] <a class="reference external" href="https://www.star-force.com/products/starforce-crypto/">Star Force</a></p></li></ul></li></ul></ld-story><ld-supplemental><p>Gerade im Umfeld von klassischen <em>Binaries</em> für Windows, Mac und Linux erhöhen Compiler Optimierungen, z. B. von C/C++ und Rust Compilern (<span class="docutils literal">-O2 / -O3</span>), bereits den Aufwand, der notwendig ist den Code zu verstehen, erheblich.</p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Einen ambitionierten und entsprechend ausgestatteten Angreifer wird <strong>Code Obfuscation</strong> bremsen, aber sicher nicht vollständig ausbremsen und das Vorhaben verteilen.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="obfuscation-techniken-auszug"><h2>Obfuscation - Techniken (Auszug)</h2><ld-story><ul class="incremental-list"><li><p><span class="peripheral">entfernen aller Debug-Informationen</span></p></li><li><p>Das Kürzen aller möglichen Namen (insbesondere Methoden und Klassennamen).</p></li><li><p>Das Verschleiern von Konstanten durch den Einsatz vermeintlich komplexer Berechnungen zu deren Initialisierung.</p><pre class="code java copy-to-clipboard literal-block"><code><span class="operator">~</span><span class="punctuation">(</span><span class="punctuation">(</span><span class="punctuation">(</span><span class="keyword">int</span><span class="punctuation">)</span><span class="name class">Math</span><span class="punctuation">.</span><span class="name constant">PI</span><span class="punctuation">)</span> <span class="operator">^</span> <span class="name class">Integer</span><span class="punctuation">.</span><span class="name constant">MAX_VALUE</span> <span class="operator">&gt;&gt;</span> <span class="literal number integer">16</span><span class="punctuation">)</span><span class="operator">+</span><span class="name class">Short</span><span class="punctuation">.</span><span class="name constant">MAX_VALUE</span></code></pre><pre class="code java incremental literal-block"><code><span class="operator">=</span> <span class="literal number integer">2</span></code></pre></li><li><p>Die Verwendung von Unicode Codepoints für Strings oder die Verschleierung von Strings mittels <a class="reference external" href="https://cryptii.com/pipes/rot13-decoder">rot13</a> Verschlüsselung.</p><pre class="code C copy-to-clipboard literal-block"><code><span class="comment single">/* ??? */</span> <span class="name function">printf</span><span class="punctuation">(</span><span class="literal string">"\x48"</span><span class="literal string">"e\154l\x6F"</span><span class="literal string">" \127o\x72"</span><span class="literal string">"l\144!"</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre><pre class="code C incremental literal-block"><code><span class="comment single">/*  =  */</span> <span class="name function">printf</span><span class="punctuation">(</span><span class="literal string">"Hello World!"</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre></li><li><p>Das Umstellen von Instruktionen, um das Dekompilieren zu erschweren.</p></li><li><p>Das Hinzufügen von totem Code.</p></li><li><p>Den relevanten Teil der Anwendung komprimieren und verschlüsseln und erst bei Verwendung entpacken und entschlüsseln.</p></li><li><p>...</p></li></ul></ld-story><ld-supplemental><p>Obfuscation auf Source Code Ebene:
<a class="reference external" href="https://www.ioccc.org/">International Obfuscated C Code Contest</a></p><p><strong>Umstellen von Instruktionen</strong></p><p>Das Umstellen von Instruktionen erschwert die Analyse, da viele Werkzeuge zum Dekompilieren auf die Erkennung von bestimmten Mustern im Code angewiesen sind und ansonsten nur sehr generischen (Spagetti Code) oder gar unsinnigen Code zurückgeben.</p><p><strong>Verschleierung von Strings</strong></p><p>Das Verschleiern von Strings kann insbesondere das Reversen von Binärcode erschweren, da ein Angreifer häufig „nur“ an einer ganz bestimmten Funktionalität interessiert ist und dann Strings ggf. einen sehr guten Einstiegspunkt für die weitergehende Analyse bieten.</p><p>Stellen Sie sich eine komplexe Java Anwendung vor, in der alle Namen von Klassen, Methoden und Attributen durch einzelne oder kurze Sequenzen von Buchstaben ersetzt wurden und sie suchen danach wie von der Anwendung Passworte verarbeitet werden. Handelt es sich um eine GUI Anwendung, dann wäre zum Beispiel die Suche nach Text, der in den Dialogen vorkommt (z. B. <span class="docutils literal">"Password"</span>) z. B. ein sehr guter Einstiegspunkt.</p></ld-supplemental></ld-topic>
<ld-topic class="new-subsection" id="verschlusselung-von-bytecode-und-java-class-loader"><h2>Verschlüsselung von Bytecode und Java Class Loader</h2></ld-topic>
<ld-topic id="classloader"><h2><span class="docutils literal">ClassLoader</span></h2><ul class="incremental-list list-with-explanations"><li><p><span class="docutils literal">ClassLoader</span> dienen dazu Klassen dynamisch zu laden. D. h. eine Klasse wird erst dann von der JVM geladen, wenn sie benötigt bzw. angefordert wird.</p></li><li><p>Jeder <span class="docutils literal">ClassLoader</span> spannt seinen eigenen Namensraum auf.</p><p>Zwei Instanzen der gleichen Klasse (d. h. mit demselben Bytecode) sind nicht gleich (Referenzgleichheit), wenn zwei verschiedene <span class="docutils literal">ClassLoader</span> genutzt wurden.</p></li><li><p><span class="docutils literal">ClassLoader</span> stehen in einer Hierarchie.</p></li><li><p><span class="docutils literal">ClassLoader</span> können genutzt werden, um:</p><ul class="simple"><li><p>ein Programm dynamisch zu erweitern (Plug-ins)</p></li><li><p>um Klassen zu laden, die zur Laufzeit generiert wurden</p></li><li><p>um den Bytecode zu manipulieren, bevor er von der JVM ausgeführt wird.</p></li></ul></li></ul></ld-topic>
<ld-topic id="ein-eigener-classloader"><h2>Ein eigener ClassLoader</h2><pre class="code Java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">static</span> <span class="keyword">class</span> <span class="name class">MyClassLoader</span> <span class="keyword">extends</span> <span class="name class">ClassLoader</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">  <span class="keyword">public</span> <span class="name class">MyClassLoader</span><span class="punctuation">(</span><span class="name class">ClassLoader</span> parent<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">super</span><span class="punctuation">(</span>parent<span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">
</code><small class="ln"> 4</small><code data-lineno=" 4">  <span class="punctuation">@Override</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">  <span class="keyword">protected</span> <span class="name class">Class</span><span class="punctuation">&lt;</span><span class="operator">?</span><span class="punctuation">&gt;</span> <span class="name function">findClass</span><span class="punctuation">(</span><span class="keyword">final</span> <span class="name class">String</span> name<span class="punctuation">)</span> <span class="keyword">throws</span> <span class="name class">ClassNotFoundException</span> <span class="punctuation">{</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">try</span> <span class="punctuation">(</span><span class="keyword">final</span> <span class="keyword">var</span> in <span class="operator">=</span> <span class="keyword">super</span><span class="punctuation">.</span><span class="name function">getResourceAsStream</span><span class="punctuation">(</span>name<span class="punctuation">)</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">      <span class="keyword">final</span> <span class="keyword">var</span> classBytes <span class="operator">=</span> <span class="keyword">new</span> <span class="keyword">byte</span><span class="punctuation">[</span>in<span class="punctuation">.</span><span class="name function">available</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">]</span><span class="punctuation">;</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">      <span class="keyword">final</span> <span class="keyword">var</span> readBytes <span class="operator">=</span> in<span class="punctuation">.</span><span class="name function">read</span><span class="punctuation">(</span>classBytes<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">      <span class="keyword">if</span> <span class="punctuation">(</span>readBytes <span class="operator">!=</span> classBytes<span class="punctuation">.</span>length<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">10</small><code data-lineno="10">         <span class="keyword">throw</span> <span class="keyword">new</span> <span class="name class">IOException</span><span class="punctuation">(</span><span class="literal string">"failed reading class file: "</span> <span class="operator">+</span> name<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">11</small><code data-lineno="11">      <span class="punctuation">}</span>
</code><small class="ln">12</small><code data-lineno="12">      <span class="keyword">return</span> <span class="name function">defineClass</span><span class="punctuation">(</span>name<span class="punctuation">,</span>classBytes<span class="punctuation">,</span> <span class="literal number integer">0</span><span class="punctuation">,</span> classBytes<span class="punctuation">.</span>length<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">13</small><code data-lineno="13">    <span class="punctuation">}</span> <span class="keyword">catch</span> <span class="punctuation">(</span><span class="name class">IOException</span> ioe<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">14</small><code data-lineno="14">       <span class="keyword">throw</span> <span class="keyword">new</span> <span class="name class">ClassNotFoundException</span><span class="punctuation">(</span><span class="literal string">"failed loading "</span> <span class="operator">+</span> name<span class="punctuation">,</span> ioe<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">15</small><code data-lineno="15"><span class="punctuation">}</span> <span class="punctuation">}</span> <span class="punctuation">}</span></code></pre></ld-topic>
<ld-topic id="classloading-example"><h2>ClassLoading - Example</h2><ld-story><div class="compound"><p class="rubric">Ein Singleton</p><pre class="code Java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">public</span> <span class="keyword">class</span> <span class="name class">MySingleton</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">private</span> <span class="keyword">static</span> <span class="name class">MySingleton</span> instance <span class="operator">=</span> <span class="keyword">null</span><span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="keyword">private</span> <span class="name class">MySingleton</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span><span class="punctuation">}</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">public</span> <span class="keyword">static</span> <span class="keyword">synchronized</span> <span class="name class">MySingleton</span> <span class="name function">instance</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">        <span class="keyword">if</span> <span class="punctuation">(</span>instance <span class="operator">==</span> <span class="keyword">null</span><span class="punctuation">)</span> instance <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">MySingleton</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">        <span class="keyword">return</span> instance<span class="punctuation">;</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="punctuation">}</span>
</code><small class="ln">10</small><code data-lineno="10"><span class="punctuation">}</span></code></pre></div><div class="compound incremental"><p class="rubric">Gleichheit von Instanzen</p><pre class="code Java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">Object</span> a <span class="operator">=</span> <span class="name class">MySingleton</span><span class="punctuation">.</span><span class="name function">instance</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name class">Object</span> b <span class="operator">=</span> <span class="name class">MySingleton</span><span class="punctuation">.</span><span class="name function">instance</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>a <span class="operator">==</span> b<span class="punctuation">)</span><span class="punctuation">;</span></code></pre><pre class="code Text literal-block"><code>Ergebnis: true</code></pre></div><div class="incremental"><p class="rubric">Verwendung des SystemClassLoader</p><pre class="code Java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name class">ClassLoader</span> cl1 <span class="operator">=</span> <span class="name class">ClassLoader</span><span class="punctuation">.</span><span class="name function">getSystemClassLoader</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="name class">Class</span><span class="punctuation">&lt;</span><span class="operator">?</span><span class="punctuation">&gt;</span> clazz1 <span class="operator">=</span> cl1<span class="punctuation">.</span><span class="name function">loadClass</span><span class="punctuation">(</span><span class="literal string">"demo.MySingleton"</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="name class">Object</span> a <span class="operator">=</span> clazz1
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="punctuation">.</span><span class="name function">getDeclaredMethod</span><span class="punctuation">(</span><span class="literal string">"instance"</span><span class="punctuation">,</span> <span class="keyword">new</span> <span class="name class">Class</span><span class="punctuation">&lt;</span><span class="operator">?</span><span class="punctuation">&gt;</span><span class="punctuation">[</span><span class="punctuation">]</span> <span class="punctuation">{</span><span class="punctuation">}</span><span class="punctuation">)</span>

<ld-topic class="new-section transition-fade" id="eine-sehr-kurze-einfuhrung-in-java-bytecode"><h2>Eine sehr kurze Einführung in Java Bytecode</h2></ld-topic>
<ld-topic id="die-java-virtual-machine"><h2>Die Java Virtual Machine</h2><ul class="incremental-list simple"><li><p><strong>Java Bytecode</strong> ist die Sprache, in der Java (oder Scala, Kotlin, ...) Programme auf der Java Virtual Machine (JVM) <a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a> ausgeführt werden.</p></li><li><p><span class="peripheral">In den meisten Fällen arbeiten Java Decompiler so gut, dass ein tiefgehendes Verständnis von Java Bytecode selten notwendig ist.</span></p></li><li><p>Java Bytecode kann — muss aber nicht — interpretiert werden. (Z. B. können „virtuelle Methodenaufrufe“ in Java schneller sein als in C++.)</p></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-2" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-2">2</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://docs.oracle.com/javase/specs/jvms/se21/html/index.html">Java Bytecode Spezifikation</a></p></aside></aside></ld-topic>
<ld-topic id="java-bytecode-stackbasierte-virtuelle-maschine"><h2>Java Bytecode - stackbasierte virtuelle Maschine</h2><div class="smaller"><p>Die JVM ist eine stackbasierte virtuelle Maschine.</p><p>Die getypten Operanden eines Befehls werden auf einem Stack abgelegt und die Operationen arbeiten auf den obersten Elementen des Stacks. Jeder Thread hat seinen eigenen Stack.</p><blockquote><ld-grid class="incremental default-layout"><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">Instruktionen</p><pre class="code java literal-block"><code>nop
bipush <span class="literal number integer">100</span>               → <span class="keyword">int</span>

bipush  <span class="literal number integer">50</span>               → <span class="keyword">int</span>


iadd        ← <span class="literal number integer">2</span> ⨉ <span class="keyword">int</span>    → <span class="keyword">int</span></code></pre></ld-cell><ld-cell class="width-50 incremental" style="align-self:auto;"><p class="rubric">Veränderung des Stacks</p><pre class="code java literal-block"><code>└─────┘
│ <span class="literal number integer">100</span> │
└─────┘
│  <span class="literal number integer">50</span> │
│ <span class="literal number integer">100</span> │
└─────┘
│ <span class="literal number integer">150</span> │
└─────┘</code></pre></ld-cell></ld-grid></blockquote></div><ld-supplemental><p>Eine Methode muss einen Stack begrenzter Höhe aufweisen. Code, für den die Stackhöhe nicht berechenbar ist, wird vom Compiler abgelehnt. (Zum Beispiel ein <span class="docutils literal">bipush</span> in einer Endlosschleife.)
Die benötigte Höhe des Stacks wird vom Compiler berechnet und von der JVM überprüft.</p></ld-supplemental></ld-topic>
<ld-topic id="java-bytecode-methodenaufrufe-und-lokale-variablen"><h2>Java Bytecode - Methodenaufrufe und lokale Variablen</h2><ul class="incremental-list simple"><li><p>Die Java Virtual Machine verwendet lokale Variablen zur Übergabe von Parametern beim Methodenaufruf.</p></li><li><p>Beim Aufruf von <em>Klassenmethoden</em> (<code class="java"><span class="keyword">static</span></code>) werden alle Parameter in aufeinanderfolgenden lokalen Variablen übergeben, beginnend mit der lokalen Variable 0.
D. h. in der aufrufenden Methode werden die Parameter vom Stack geholt und in lokalen Variablen gespeichert.</p></li><li><p>Beim Aufruf von <em>Instanzmethoden</em> wird die lokale Variable 0 dazu verwendet, um die Referenz (<code class="java"><span class="keyword">this</span></code>) auf das Objekt zu übergeben, auf dem die Instanzmethode aufgerufen wird.
Anschließend werden alle Parameter in aufeinanderfolgenden lokalen Variablen übergeben, beginnend mit der lokalen Variable 1.</p></li></ul><ld-supplemental><p>Die Anzahl der benötigten lokalen Variablen wird vom Compiler berechnet und von der JVM überprüft.</p></ld-supplemental></ld-topic>
<ld-topic id="beispiel-default-constructor-in-java-bytecode"><h2>Beispiel: <em>Default Constructor</em> In Java Bytecode</h2><p>Ein <em>Constructor</em> welcher keine expliziten Parameter hat und nur den super Konstruktor aufruft.</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="comment single">// Method descriptor ()V</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="comment single">// Stack: 1, Locals: 1</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="keyword">public</span> <span class="name class">Main</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="literal number integer">0</span>  aload_0 <span class="punctuation">[</span><span class="keyword">this</span><span class="punctuation">]</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="literal number integer">1</span>  invokespecial <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Object</span><span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">6</small><code data-lineno="6">    <span class="literal number integer">4</span>  <span class="keyword">return</span></code></pre><p>Die Zeilennummern und die Informationen über die lokalen Variablen sind optional und werden nur für Debugging Zwecke benötigt.</p><pre class="code java literal-block"><code><span class="name class">Line</span> numbers<span class="operator">:</span>         <span class="punctuation">[</span>pc<span class="operator">:</span> <span class="literal number integer">0</span><span class="punctuation">,</span> line<span class="operator">:</span> <span class="literal number integer">9</span><span class="punctuation">]</span>
<span class="name class">Local</span> variable table<span class="operator">:</span> <span class="punctuation">[</span>pc<span class="operator">:</span> <span class="literal number integer">0</span><span class="punctuation">,</span> pc<span class="operator">:</span> <span class="literal number integer">5</span><span class="punctuation">]</span>  local<span class="operator">:</span> <span class="keyword">this</span>
                                      index<span class="operator">:</span> <span class="literal number integer">0</span>
                                      type<span class="operator">:</span>  <span class="name class"><span class="name namespace">de<span class="punctuation">.</span>dhbw<span class="punctuation">.</span>simplesecurepp<span class="punctuation">.</span></span>Main</span></code></pre><ld-supplemental><p>Es gibt weitere Metainformationen, die „nur“ für Debugging-Zwecke benötigt werden, z. B. Informationen über die ursprünglich Quelle des Codes oder die sogenannte "Local Variable Type Table" in Hinblick auf generische Typinformationen. Solche Informationen werden häufig vor Auslieferung entfernt bzw. nicht hineinkompiliert.</p></ld-supplemental></ld-topic>
<ld-topic id="beispiel-aufruf-einer-komplexeren-methode"><h2>Beispiel: Aufruf einer komplexeren Methode</h2><pre class="code java literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="comment single">// Method descriptor ([Ljava/lang/String;)V</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="comment single">// Stack: 5, Locals: 8</span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">public</span> <span class="keyword">static</span> <span class="keyword">void</span> <span class="name function">main</span><span class="punctuation">(</span><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>String</span><span class="punctuation">[</span><span class="punctuation">]</span> args<span class="punctuation">)</span> <span class="keyword">throws</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="literal number integer">0</span>  aload_0 <span class="punctuation">[</span>args<span class="punctuation">]</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="literal number integer">1</span>  arraylength
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="literal number integer">2</span>  iconst_2
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="literal number integer">3</span>  if_icmpeq <span class="literal number integer">74</span>                <span class="comment single">// integer comparison for equality</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="literal number integer">6</span>  getstatic <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>System</span><span class="punctuation">.</span>err <span class="operator">:</span> <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>io<span class="punctuation">.</span></span>PrintStream</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="literal number integer">9</span>  ldc <span class="operator">&lt;</span><span class="name class">String</span> <span class="literal string">"SimpleSecure++"</span><span class="operator">&gt;</span>
</code><small class="ln">10</small><code data-lineno="10">    <span class="literal number integer">11</span>  invokevirtual <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>io<span class="punctuation">.</span></span>PrintStream</span><span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>String</span><span class="punctuation">)</span> <span class="operator">:</span> <span class="keyword">void</span>
</code><small class="ln">11</small><code data-lineno="11">    <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span></code></pre></ld-topic>
<ld-topic class="new-section transition-scale" id="verschlusselung-von-daten"><h2>Verschlüsselung von Daten</h2></ld-topic>
<ld-topic id="alternativen-zur-speicherung-von-passwortern"><h2>Alternativen zur Speicherung von Passwörtern</h2><p>In einigen Anwendungsgebieten ist es möglich auf das explizite Speichern von Passwörtern ganz zu verzichten<a class="brackets" href="#footnote-3" id="footnote-reference-3" role="doc-noteref"><span class="fn-bracket">[</span>*<span class="fn-bracket">]</span></a>.</p><div class="incremental"><p>Stattdessen wird z. B. einfach versucht das Ziel zu entschlüsseln und danach evaluiert ob das Passwort (vermutlich) das Richtige war.</p></div><div class="incremental"><p>Kann darauf verzichtet werden zu überprüfen ob das Passwort korrekt war, dann sind keine Metainformationen notwendig und die verschlüsselte Datei kann genauso groß sein wie die unverschlüsselte Datei.</p></div><aside class="footnote-list brackets">
<aside class="footnote brackets" id="footnote-3" role="doc-footnote">
<span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-3">*</a><span class="fn-bracket">]</span></span>
<p>Bei einer Verschlüsselung mit OpenSSL wird das Passwort nicht gespeichert.</p>
</aside>
</aside></ld-topic>

    <span class="name variable">-in</span> Poem.txt <span class="name variable">-out</span> Poem.enc</code></pre></dd><dt>Datei<span class="colon">:</span></dt><dd><p><a class="reference external" href="./exercise/securepp/Poem.enc">Poem.enc</a></p></dd></dl><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Reversing Secure++"><p class="ld-exercise-title rubric"><span>Reversing Secure++</span></p><p>Entschlüsseln Sie die Datei Poem.enc, die mit Secure++ verschlüsselt wurde.</p><ld-supplemental><p>Sie können zum Beispiel das Programm über ein Shellscript oder ein anderes Java Programm ansprechen, um zu versuchen das Passwort zu Bruteforcen.</p><p>Alternativ oder ergänzend können Sie versuchen mittels Reverse Engineering herauszufinden wie die Verschlüsselung implementiert wurde und ob sich daraus effizientere/andere Möglichkeiten ergeben.</p><p>Selbstverständlich können Sie versuchen die Entschlüsselung ggf. auch in (z. B.) Python nachbauen.</p><p>Die Password-Policy, die dem Passwort zugrunde liegt ist die folgende:</p><ul class="simple"><li><p>mind. 16 Zeichen</p></li><li><p>mind. 4 Ziffern</p></li><li><p>mind. 2 Großbuchstaben</p></li><li><p>mind. 2 Kleinbuchstaben</p></li><li><p>mind. 4 verschiedene Sonderzeichen aus dem Zeichensatz: -!$?#@</p></li><li><p>Es dürfen nicht alle Sonderzeichen hintereinander vorkommen; d. h. es muss mindestens zwei Blöcke von Sonderzeichen geben; ein Block kann ein oder mehrere Sonderzeichen enthalten.</p></li></ul><p>Darüber hinaus sei Ihnen bekannt, dass die Person in seinen Passworten sehr gerne  die Namen der Orte verwendet, die er bereits bereist hat. Ihnen sei außerdem bekannt, dass die Person zwischen einer großen Anzahl von Großstädten in Westeuropa unterwegs war. Darüber hinaus trennt er die Namen der Städte in bekannten Passwörtern häufig mit “.”, “_" oder “-“. Weiterhin sei Ihnen bekannt, dass er oft das Datum bzw. Jahr verwendet an denen er die Städte in den letzten Jahren besucht hat. Ansonsten verhält er sich augenscheinlich recht typisch was das Anfügen von Zahlen und Sonderzeichen betrifft. Beides ist in bestehenden Passwörtern am häufigsten in entsprechenden Blöcken am Ende zu finden.</p></ld-supplemental><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:/SqTGQgJdsCLWftMC0DQxxY0gTW0oRsAyQzgfbBERD8=:uF9a/jSHQl/7XxuW:Zdjlu4INsUOj4YiCBo5Wp32YXJdZCJO4Sy98HuwUWBSOFpuXIlE9s9ckA34ME+br+TLabmkFfGOambZGhhAA6xTnYQ5e/4MGAQRIfCLDRPuRQ48Wo0UK83mm4KVYRPnIMldBFEHsZVzBZwqK1zpl4NO2XkNOGUIAj8O1+J4rJINwS+J985V1+nM18VFqk3AAkydd1t2x5c3QjMVjaU/du3MY6YHpO1JMn1R369vLYmwesHk2XY2y1zfbD25/hzlpnp2s0VqyW/pdPdZmD+XCQtF6OSvZHw1t3tdcFLCt4pf7DKR3RuxHAhalXxbbORJYsjEIsEVxvOKc0TSYIq4/pAXDWnF3Iet/kh/nTu2ZC+dGpeIzo17mh5TjUCFOflkPp5KKCYEoWUOvT/+S9dV4LXbYsM+clyJlrysOTy0M8UGaFolCzdJLhNsj5cgUVEJpYGJ5po0QNHVNyeMaQV336bxkX9wNVR6ZSbXec/Zec1enICn4TQsX9NKX+ZIT1N3pigvdXMEV37lNM6ZHqpJCwlmhMNJYM1IDT4MdNeW5BYSoSmWT4q/h6fxD+mTXLDE9jiLa9kE7VrNSeqF8qksqbx557r49EzJ8Al1ZkzL8zC0Obl/rK3aAJww3dQ7dxYPZ3aVHGtJ2+No7c0Au2vge2nPrEs2JnPEkVWsH6zFN6t0KTVV0dIUJioHBO1QHSnQbWMMd2ukDQc1k+vM/K4CSHT8m2pTKo3mKrONE9Mg1aKPXIWQ4mbzHE6Mi7kNHTIjpuHE4YcE1xdfzu1AFgRL42x8BlH9qEHydGbjk4vB8MILFP/frZU6V9h0nciLYu0NgTVlJgT6w2iPd10t7aWpQUEerbZsxN/yOJSE6g+0ub88PXzV54x6ehdWRZEZ28ctd/rsm7HgNRdorwjaDMPiAEGWjKHSARxuAThGAaOihACmEWMeZF7N7mjcGCKFjhzDve1XFErQ7gqaBiTHMIDjIqtYtd/IMT7sPDBUf5CORddKuflFuHJ0IO/Wajrez1dKeC9uSyaGW96RccE/JUGEX2RnWPcC1CDYgygPUrfHkNI125X1Hvc6Vk91o2wN4YzQbpuTm1U6TMJU3F6CZXeK7oRvy30CZ4vHZqzjZExXL5vtbGAG+VjVvklWG5L11fnHRS2ni1NDwPibwKMgGHT6/SNYdTYNrs/afli9tMQefBAS7t+yn5Ip6LEnwI3uNGm25MflnN9TMgLOixTJ1I/jrbok6m/Vo4ieIBvn9sPUKY7+q8Qxtbvi/Zv5FWnid8Q2HVILoagKerTxQ0LFAQLn6Hh/pChCPPLxiOZrIO8PmryNRc2RFX6Yt4vdWDlX1H/zmg8PVBGs10w1n2Dh1I8zT2yJeb8UrM9KR0LMzmuSKPLrJY2Q3fnWkmOttOH8ENaemvqa/TuyJK7Os+JXRlyDyc+1pXfNWtlas3QqmgXcG7gpVq14YTYCsghLrIf6mrNjZBB6WsOGU6jAnyPbpvCmQdyUjwnZAj0MECPs3nqqZWbt6Fz/Qr950azEoxVfI/qKPA3I7oSIZvaOK5xJS7cQM4j4lwv9TUA73EhhIo7WLwrtAIcIJaKz/Y2sW7BfxMxS0F4mfkiqS6V5PVZZ0wcmS0/TnvtKv/fd3UGJ+1XA7
