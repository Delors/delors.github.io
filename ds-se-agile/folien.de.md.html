<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="lecture-ds-agile-for-distributed-systems"><h1 class="title">Agile Softwareentwicklung und Ihre Bedeutung für verteilte Anwendungsarchitekturen</h1><dl class="docinfo"><dt class="dozent">Dozent<span class="colon">:</span></dt><dd class="dozent"><a class="reference external" href="https://delors.github.io/cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></dd><dt class="contact">Kontakt<span class="colon">:</span></dt><dd class="contact"><a class="reference external" href="mailto:michael.eichberg@dhbw.de">michael.eichberg@dhbw.de</a></dd><dt class="version">Version<span class="colon">:</span></dt><dd class="version">1.0.0.1</dd></dl><ld-supplemental><dl class="field-list"><dt>Folien<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/ds-se-agile/folien.de.md.html">https://delors.github.io/ds-se-agile/folien.de.md.html</a></p><p><a class="reference external" href="https://delors.github.io/ds-se-agile/folien.de.md.html.pdf">https://delors.github.io/ds-se-agile/folien.de.md.html.pdf</a></p></dd><dt>Fehler melden<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://github.com/Delors/delors.github.io/issues">https://github.com/Delors/delors.github.io/issues</a></p></dd></dl><dl class="field-list simple"><dt>KI Verwendung<span class="colon">:</span></dt><dd><p>Bei der Erstellung der Unterlagen wurden KI Assistenten (insbesondere Claude

<ld-topic id="agiles-manifest-agile-manifesto-martin2003"><h2><a class="reference external" href="http://agilemanifesto.org/2001">Agiles Manifest</a> (<span class="eng">Agile Manifesto</span>) <a class="citation-reference" href="#martin2003" id="citation-reference-1" role="doc-biblioref">[Martin2003]</a></h2><blockquote><p>„Wir erschließen bessere Wege, Software zu entwickeln, indem wir es selbst tun und anderen dabei helfen. Durch diese Tätigkeit haben wir diese Werte zu schätzen gelernt:</p><ul class="simple"><li><p>Individuen und Interaktionen sind wichtiger als Prozesse und Werkzeuge</p></li><li><p>Funktionierende Software ist wichtiger als umfassende Dokumentationen</p></li><li><p>Zusammenarbeit mit dem Kunden ist wichtiger als Vertragsverhandlungen</p></li><li><p><strong>Reagieren auf Veränderung ist wichtiger als das Befolgen eines Plans</strong></p></li></ul><p>Das heißt, obwohl wir die Werte auf der rechten Seite wichtig finden, schätzen wir die Werte auf der linken Seite höher ein.“</p></blockquote><ld-supplemental><p>Agile Methoden bauen auf iterativen Ansätzen auf, die es schon viel früher gab.</p><p>Die Notwendigkeit auf Veränderungen reagieren zu können ist essentiell, da sich die Anforderungen an die Software bzw. die auftauchenden Probleme sich während der Entwicklung verändern können bzw. im Normalfall bei Projektstart noch nicht vollständig verstanden sind.</p><p>Es ist dennoch essentiell zentrale Anforderungen, die ggf. eine massive Auswirkung auf den Entwurf haben, am Anfang zu erfassen: eine neue Anforderung auch die Titel der Kunden zu erfassen ist ggf. „immer“ umsetzbar. Eine Anforderung wie zum Beispiel Mandantenfähigkeit oder Anforderungen an die Skalierbarkeit sind dagegen anders zu bewerten.</p></ld-supplemental></ld-topic>
<ld-topic id="agile-softwareentwicklung"><h2>Agile Softwareentwicklung</h2><p><strong>Schlüsselaspekte mit Relevanz für Softwarearchitekturen</strong>:</p><ul class="incremental-list list-with-explanations"><li><p>kleine Gruppen von Entwicklern (<span class="info">3</span>-<span class="info">10</span> Personen), die über alle notwendigen Kompetenzen verfügen (technische und geschäftliche)</p></li><li><p>inkrementelle Entwicklung</p><p>Jede ausgelieferte Version der Software ist nutzbar und implementiert relevante neue Aspekte für die Nutzer.</p></li><li><p>iterative Entwicklung</p><p>Die Entwicklung erfolgt iterativ und erlaubt explizit die Wiederholung von Softwareentwicklungstätigkeiten; die einzelnen Iterationen sind strukturiert entlang einer Serie von inkrementellen Schritten mit einer fixen Länge.</p></li></ul><ld-supplemental><p>Große Teams haben sich im Allgemeinen als nicht-effektiv erwiesen.</p></ld-supplemental></ld-topic>
<ld-topic id="aspekte-agiler-prozessmodelle-mit-bezug-zu-softwarearchitekturen"><h2>Aspekte Agiler Prozessmodelle mit Bezug zu Softwarearchitekturen</h2><ul class="simple"><li><p>eXtreme Programming</p><ul class="simple"><li><p>kurze Releasezyklen</p></li><li><p>Test-driven Development (TDD)</p></li><li><p>Continuous Integration (CI)</p></li><li><p>einfaches/schlichtes Design (<em>YAGNI</em>, <em>Once and only once</em>)</p></li></ul></li><li><p>SCRUM</p><ul class="simple"><li><p>“kurze” Sprints</p></li></ul></li><li><p>Continuous Delivery (CD) (Continuous Deployment)</p></li></ul><ld-supplemental><dl class="field-list simple"><dt>YAGNI<span class="colon">:</span></dt><dd><p>You ain't gonna need it</p></dd><dt>Once and only once<span class="colon">:</span></dt><dd><p>Jede Funktionalität wird nur einmal implementiert und dann wiederverwendet.</p></dd></dl><p>TDD erfordert modulare Softwarearchitekturen, die es erlauben einzelne Komponenten zu testen.</p><p>Kurze Releasezyklen sind notwendig, um das Verständnis der Anforderungen bzw. Problemdomäne zu verbessern.</p></ld-supplemental></ld-topic>
<ld-topic id="anforderungsermittlung-in-agilen-prozessen"><h2>Anforderungsermittlung in agilen Prozessen</h2><p><strong>Anforderung</strong></p><blockquote class="epigraph"><p>Eine Bedingung oder Fähigkeit, die ein Benutzer benötigt, um ein Problem zu lösen oder ein Ziel zu erreichen.</p><p class="attribution">—IEEE Standard Glossary of Software Engineering Terminology</p></blockquote></ld-topic>
<ld-topic id="anforderungsermittlung-mittels-domain-driven-design-ddd-evans2004"><h2>Anforderungsermittlung mittels Domain-driven Design (DDD) <a class="citation-reference" href="#evans2004" id="citation-reference-2" role="doc-biblioref">[Evans2004]</a></h2><p><strong>Hauptaspekte von Domain-driven Design</strong>:</p><ul class="simple"><li><p>Das Ziel des Softwareentwurfs liegt darauf die Fachlichkeit und die Fachlogik der realen Welt bestmöglich zu repräsentieren.</p></li><li><p>Das Domänenmodell ist die Grundlage für den Entwurf komplexer fachlicher Zusammenhänge in der Anwendungsdomäne.</p></li></ul><ld-supplemental><p>Häufig wird DDD in Kombination mit <em>User Stories</em> eingesetzt, um die Anforderungen zu ermitteln und zu dokumentieren.</p><p>Zur Erinnerung: <em>User Stories</em> beschreiben was erreicht werden soll und nicht wie. Das Ziel muss klar sein, aber der Weg nicht! (Ggf. können User Stories noch das warum adressieren.)</p></ld-supplemental></ld-topic>
<ld-topic id="ausgewahlte-konzepte-des-domain-driven-design-ddd-evans2004"><h2>Ausgewählte Konzepte des Domain-driven Design (DDD) <a class="citation-reference" href="#evans2004" id="citation-reference-3" role="doc-biblioref">[Evans2004]</a></h2><dl class="field-list simple"><dt>Ubiquitäre Sprache (<span class="eng">Ubiquitous Language</span>)<span class="colon">:</span></dt><dd><p>Die Sprache, welche in allen Bereichen der Softwareerstellung verwendet werden sollte (Fachlichkeit, Domänenmodell, Methoden, Klassen, …)</p></dd><dt>Aggregate<span class="colon">:</span></dt><dd><p>Repräsentation eines atomaren Konzeptes der DomäneEine Entität/transaktionale Einheit, die als einziges Zugriff auf die dahinterliegende, zusammengefassten Entitäten erlaubt.</p></dd><dt>Kontextgrenzen (<span class="eng">Bounded Context</span>)<span class="colon">:</span></dt><dd><p>Repräsentation einer Organisationsgrenze</p></dd></dl><ld-supplemental><ul><li><p>Aggregate (aggregates)</p><ul class="simple"><li><p>Zusammenfassungen von Entitäten und Wertobjekten und deren Assoziationen untereinander zu einer gemeinsamen transaktionalen Einheit.</p></li><li><p>definieren genau eine Entität als einzigen Zugriff auf das gesamte Aggregat. Alle anderen Entitäten und Wertobjekte dürfen von außerhalb nicht statisch referenziert werden. Damit wird garantiert, dass alle Invarianten des Aggregats und der einzelnen Bestandteile des Aggregats sichergestellt werden können.</p></li></ul></li><li><p>Kontextgrenzen (bounded context)</p><p>Beschreiben die Grenzen jedes Kontexts in vielfältiger Hinsicht wie beispielsweise Teamzuordnung, Verwendungszweck, dahinter liegende Datenbankschemata. Somit wird klar, wo ein Kontext seine Gültigkeit verliert und potentiell ein anderer Kontext seinen Platz einnimmt.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="devops"><h2>DevOps</h2><p>Ergänzen bestehende agile Methoden.</p><object class="align-center" data="drawings/dev-ops.svg" type="image/svg+xml" role="img" width="1440px" height="797px"></object><ld-supplemental><p>DevOps integriert und automatisiert die Arbeit von Softwareentwicklung (Dev) und IT-Betrieb (Ops) als Mittel zur Verbesserung und Verkürzung des Lebenszyklus der Systementwicklung.</p><p>DevOps Prinzipien:</p><ul class="simple"><li><p>gemeinsame Verantwortung</p></li><li><p>Automatisierung der Arbeitsabläufe</p></li><li><p>und schnelles Feedback.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="wie-erreichen-wir-dass-unsere-softwareentwicklung-agil-ist"><h2>Wie erreichen wir, dass unsere Softwareentwicklung agil ist?</h2><p>Um Agilität zu erreichen, müssen wir…</p><ul class="simple"><li><p><span class="peripheral">Verfahrensweisen anwenden, die die notwendige Disziplin und Rückmeldung bieten</span></p></li><li><p><strong>Entwurfsprinzipien anwenden</strong>, die unsere Software flexibel und wartbar machen</p></li><li><p>die <strong>Entwurfsmuster kennen</strong>, die gezeigt haben, dass sie für einen Ausgleich zwischen den Prinzipien sorgen</p></li></ul></ld-topic>
