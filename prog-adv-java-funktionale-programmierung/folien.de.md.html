<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic class="new-section" id="einfuhrung-in-die-funktionale-programmierung"><h2>Einführung in die Funktionale Programmierung</h2></ld-topic>
<ld-topic id="grundlagen-funktionaler-programmierung"><h2>Grundlagen funktionaler Programmierung</h2><ld-deck><ld-card><ul class="incremental-list simple"><li><p>Programmierparadigma, bei dem Funktionen im Mittelpunkt stehen</p></li><li><p>Vermeidet veränderliche Zustände (<span class="eng">Mutable State</span>)</p></li><li><p>Fördert deklarativen Code statt imperativem Code</p></li></ul></ld-card><ld-card class="incremental"><aside class="admonition incremental" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Wie unterscheidet sich dieses Paradigma von der objektorientierten Programmierung?</p></aside><aside class="admonition incremental margin-top-1em" data-theme="answer"><p class="admonition-title" data-theme="answer-header"><span>Antwort</span></p><ul class="simple"><li><p>Methoden ohne Seiteneffekte</p></li><li><p>Daten sind standardmäßig unveränderlich</p></li><li><p>Fokus auf Funktionsanwendungen und -komposition</p></li></ul></aside></ld-card><ld-card class="incremental"><p class="rubric">Wichtige Konzepte</p><ul class="incremental-list simple"><li><p>Funktionen Höherer Ordnung</p></li><li><p>Lambda-Ausdrücke</p></li><li><p>Funktionskomposition</p></li><li><p>Currying und Partielle Anwendung</p></li></ul><ld-supplemental><p>Beim Currying wird eine Funktion mit n Argumenten in eine Kette von n Funktionen umgewandelt, die jeweils genau ein Argument entgegennehmen: f(a,b,c) wird zu f(a)(b)(c).</p><p>Bei der partiellen Anwendung wird eine Funktion nur mit einem Teil ihrer Argumente aufgerufen. Das Ergebnis ist eine neue Funktion, die die weiteren Parameter entgegennimmt und erst dann die Originalfunktion aufruft.</p></ld-supplemental></ld-card></ld-deck></ld-topic>
<ld-topic class="new-section" id="funktionale-programmierung-in-java"><h2>Funktionale Programmierung in Java</h2></ld-topic>
<ld-topic id="lambdas"><h2>Lambdas</h2><ld-deck><ld-card><dl class="field-list"><dt>Lambda (auch Closure)<span class="colon">:</span></dt><dd><p>Ein Ausdruck, dessen Wert eine Funktion ist.</p><p>Solche Ausdrücke sind sehr nützlich, mussten in Java aber vor Version 8 mit anonymen inneren Klassen emuliert werden.</p></dd></dl></ld-card><ld-card class="incremental"><p class="rubric">Eine einfache Personenklasse</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">Person</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">private</span> <span class="name class">String</span> name<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">private</span> <span class="keyword">int</span> age<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="keyword">public</span> <span class="name class">Person</span><span class="punctuation">(</span><span class="name class">String</span> name<span class="punctuation">,</span> <span class="keyword">int</span> age<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="keyword">this</span><span class="punctuation">.</span>name <span class="operator">=</span> name<span class="punctuation">;</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">        <span class="keyword">this</span><span class="punctuation">.</span>age <span class="operator">=</span> age<span class="punctuation">;</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="punctuation">}</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="keyword">public</span> <span class="name class">String</span> <span class="name function">getName</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">return</span> name<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">10</small><code data-lineno="10">    <span class="keyword">public</span> <span class="keyword">int</span> <span class="name function">getAge</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">return</span> age<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">11</small><code data-lineno="11">    <span class="keyword">public</span> <span class="name class">String</span> <span class="name function">toString</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">return</span> <span class="literal string">"Person["</span> <span class="operator">+</span> name <span class="operator">+</span> <span class="literal string">", "</span> <span class="operator">+</span> age <span class="operator">+</span> <span class="literal string">"]"</span><span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">12</small><code data-lineno="12"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Sortieren von Personen nach Alter</p><p>Angenommen wir haben eine Klasse Person und eine Liste von Personen, die nach Alter sortiert werden soll. Dazu muss eine Vergleichsfunktion übergeben werden. In Java &#x3C;8 kommt dazu nur ein Objekt in Frage.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">Person</span><span class="punctuation">&gt;</span> persons <span class="operator">=</span> <span class="name class">Arrays</span><span class="punctuation">.</span><span class="name function">asList</span><span class="punctuation">(</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">new</span> <span class="name class">Person</span><span class="punctuation">(</span><span class="literal string">"Hugo"</span><span class="punctuation">,</span> <span class="literal number integer">55</span><span class="punctuation">)</span><span class="punctuation">,</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">new</span> <span class="name class">Person</span><span class="punctuation">(</span><span class="literal string">"Amalie"</span><span class="punctuation">,</span> <span class="literal number integer">15</span><span class="punctuation">)</span><span class="punctuation">,</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">new</span> <span class="name class">Person</span><span class="punctuation">(</span><span class="literal string">"Anelise"</span><span class="punctuation">,</span> <span class="literal number integer">32</span><span class="punctuation">)</span> <span class="punctuation">)</span><span class="punctuation">;</span></code></pre><ld-deck><ld-card><p class="rubric">Traditionelle Lösung</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">Collections</span><span class="punctuation">.</span><span class="name function">sort</span><span class="punctuation">(</span>persons<span class="punctuation">,</span> <span class="keyword">new</span> <span class="name class">Comparator</span><span class="punctuation">&lt;</span><span class="name class">Person</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">public</span> <span class="keyword">int</span> <span class="name function">compare</span><span class="punctuation">(</span><span class="name class">Person</span> p1<span class="punctuation">,</span> <span class="name class">Person</span> p2<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">        <span class="keyword">return</span> p1<span class="punctuation">.</span><span class="name function">getAge</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">-</span> p2<span class="punctuation">.</span><span class="name function">getAge</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Lösung ab Java 8+</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">Collections</span><span class="punctuation">.</span><span class="name function">sort</span><span class="punctuation">(</span>
</code><small class="ln">2</small><code data-lineno="2">    persons<span class="punctuation">,</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="punctuation">(</span>p1<span class="punctuation">,</span> p2<span class="punctuation">)</span> <span class="operator">-&gt;</span> <span class="punctuation">{</span> <span class="keyword">return</span> p1<span class="punctuation">.</span><span class="name function">getAge</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">-</span> p2<span class="punctuation">.</span><span class="name function">getAge</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="punctuation">)</span><span class="punctuation">;</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Lösung ab Java 8 (kürzer)</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">Collections</span><span class="punctuation">.</span><span class="name function">sort</span><span class="punctuation">(</span>persons<span class="punctuation">,</span> <span class="punctuation">(</span>p1<span class="punctuation">,</span> p2<span class="punctuation">)</span> <span class="operator">-&gt;</span> p1<span class="punctuation">.</span><span class="name function">getAge</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">-</span> p2<span class="punctuation">.</span><span class="name function">getAge</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre></ld-card></ld-deck></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Object</span></code> ist zwar der Basistyp aller Referenztypen,
der Typ eines Lambdas ist jedoch der Typ eines funktionalen Interfaces und dieser Typ muss explizit angegeben werden. Andernfalls wäre der Compiler nicht in der Lage  den Typ aus dem Kontext zu ermitteln.</p><p>Funktionale Interfaces deklarieren genau eine abstrakte Methode. Für viele Standardfälle sind Interfaces in <code class="java">java<span class="punctuation">.</span>util<span class="punctuation">.</span>function</code> vordefiniert.</p></aside><ld-deck><ld-card><p><strong>Instanzen von anonymen inneren Klassen können immer Variablen vom Typ</strong> <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Object</span></code> <strong>zugewiesen werden:</strong></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">Object</span> actionListener <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">ActionListener</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="punctuation">@Override</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">public</span> <span class="keyword">void</span> <span class="name function">actionPerformed</span><span class="punctuation">(</span><span class="name class">ActionEvent</span> e<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">4</small><code data-lineno="4">        <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>text<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="punctuation">}</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="punctuation">}</span><span class="punctuation">;</span></code></pre></ld-card><ld-card class="incremental"><p><strong>Illegale Zuweisung:</strong></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">Object</span> actionListener <span class="operator">=</span> <span class="punctuation">(</span>e<span class="punctuation">)</span> <span class="operator">-&gt;</span> <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>text<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2">
</code><small class="ln">3</small><code data-lineno="3"><span class="comment single">// Error: The target type of this expression must be a functional interface</span></code></pre></ld-card><ld-card class="incremental"><p><strong>Zuweisung an ein funktionales Interface:</strong></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">ActionListener</span> actionListener <span class="operator">=</span> <span class="punctuation">(</span>e<span class="punctuation">)</span> <span class="operator">-&gt;</span> <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>text<span class="punctuation">)</span><span class="punctuation">;</span></code></pre></ld-card></ld-deck></ld-card><ld-card class="incremental"><p class="rubric">Selbstdefinierte funktionale Interfaces</p><dl class="field-list"><dt>Functional Interface / SAM-Interface (Single Abstract Method Interface)<span class="colon">:</span></dt><dd><p>Ein <em>Functional Interface</em> ist ein Interface das genau eine abstrakte Methode enthält.</p><p>Um die intendierte Verwendung explizit zu machen, kann optional  die Annotation <code class="java"><span class="punctuation">@FunctionalInterface</span></code> hinzugefügt werden. In diesem Fall wird durch den Compiler auch die Einhaltung der Anforderungen an funktionale Interfaces überprüft.</p></dd></dl><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="punctuation">@FunctionalInterface</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">interface</span> <span class="name class">MyActionListener</span> <span class="keyword">extends</span> <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>awt<span class="punctuation">.</span>event<span class="punctuation">.</span></span>ActionListener</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="comment single">/*final static*/</span> <span class="keyword">int</span> <span class="name constant">MAGIC_NUMBER</span> <span class="operator">=</span> <span class="literal number integer">42</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5">
</code><small class="ln">6</small><code data-lineno="6"><span class="name class">MyActionListener</span> actionListener <span class="operator">=</span>
</code><small class="ln">7</small><code data-lineno="7">        <span class="punctuation">(</span>e<span class="punctuation">)</span> <span class="operator">-&gt;</span> <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>text <span class="operator">+</span> <span class="name class">MyActionListener</span><span class="punctuation">.</span><span class="name constant">MAGIC_NUMBER</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre></aside></ld-card><ld-card class="incremental"><p class="rubric">Vordefinierte Funktionsinterfaces</p><p><code class="java">java<span class="punctuation">.</span>util<span class="punctuation">.</span>function</code> enthält viele vordefinierte Funktionsinterfaces, die in der funktionalen Programmierung häufig verwendet werden.</p><p><em>Beispiele sind:</em></p><ul class="incremental-list simple"><li><p><code class="java"><span class="name class">Function</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">,</span><span class="name class">R</span><span class="punctuation">&gt;</span></code>: Eine Funktion, die ein Argument vom Typ <code class="java"><span class="name class">T</span></code> entgegennimmt und ein Ergebnis vom Typ <code class="java"><span class="name class">R</span></code> zurückgibt.</p></li><li><p><code class="java"><span class="name class">Predicate</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code>: Eine Funktion, die ein Argument vom Typ <code class="java"><span class="name class">T</span></code> entgegennimmt und ein Ergebnis vom Typ <code class="java"><span class="keyword">boolean</span></code> zurückgibt.</p></li><li><p><code class="java"><span class="name class">Consumer</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code>: Eine Funktion, die ein Argument vom Typ <code class="java"><span class="name class">T</span></code> entgegennimmt und kein Ergebnis zurückgibt.</p></li><li><p><code class="java"><span class="name class">Supplier</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code>: Eine Funktion, die kein Argument entgegennimmt und ein Ergebnis vom Typ <code class="java"><span class="name class">T</span></code> zurückgibt.</p></li></ul></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p><code class="java"><span class="name class">Predicate</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code></p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">static</span> <span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> <span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> <span class="name function">filterList</span><span class="punctuation">(</span><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> l<span class="punctuation">,</span> <span class="name class">Predicate</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> pred<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> res <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">LinkedList</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">for</span> <span class="punctuation">(</span><span class="name class">T</span> x <span class="operator">:</span> l<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">        <span class="keyword">if</span> <span class="punctuation">(</span>pred<span class="punctuation">.</span><span class="name function">test</span><span class="punctuation">(</span>x<span class="punctuation">)</span><span class="punctuation">)</span> <span class="punctuation">{</span> res<span class="punctuation">.</span><span class="name function">add</span><span class="punctuation">(</span>x<span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="punctuation">}</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">return</span> res<span class="punctuation">;</span>
</code><small class="ln"> 7</small><code data-lineno=" 7"><span class="punctuation">}</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9"><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">Integer</span><span class="punctuation">&gt;</span> l <span class="operator">=</span> <span class="name class">Arrays</span><span class="punctuation">.</span><span class="name function">asList</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">,</span> <span class="literal number integer">2</span><span class="punctuation">,</span> <span class="literal number integer">3</span><span class="punctuation">,</span> <span class="literal number integer">4</span><span class="punctuation">,</span> <span class="literal number integer">5</span><span class="punctuation">,</span> <span class="literal number integer">6</span><span class="punctuation">,</span> <span class="literal number integer">7</span><span class="punctuation">,</span> <span class="literal number integer">8</span><span class="punctuation">,</span> <span class="literal number integer">9</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10"><span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="name function">filterList</span><span class="punctuation">(</span>l<span class="punctuation">,</span> x <span class="operator">-&gt;</span> x <span class="operator">%</span> <span class="literal number integer">2</span> <span class="operator">==</span> <span class="literal number integer">0</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre><div class="incremental"><p><em>Ausgabe:</em> <code class="console"><span class="punctuation">[</span><span class="literal number integer">2</span>, <span class="literal number integer">4</span>, <span class="literal number integer">6</span>, <span class="literal number integer">8</span><span class="punctuation">]</span></code></p></div></aside></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p><code class="java"><span class="name class">Consumer</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code></p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">WorkerOnList</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> <span class="keyword">implements</span> <span class="name class">Consumer</span><span class="punctuation">&lt;</span><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span><span class="punctuation">&gt;</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">private</span> <span class="name class">Consumer</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> action<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">public</span> <span class="name class">WorkerOnList</span><span class="punctuation">(</span><span class="name class">Consumer</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> action<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">this</span><span class="punctuation">.</span>action <span class="operator">=</span> action<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="punctuation">@Override</span> <span class="keyword">public</span> <span class="keyword">void</span> <span class="name function">accept</span><span class="punctuation">(</span><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> l<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="keyword">for</span> <span class="punctuation">(</span><span class="name class">T</span> x <span class="operator">:</span> l<span class="punctuation">)</span> action<span class="punctuation">.</span><span class="name function">accept</span><span class="punctuation">(</span>x<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 7</small><code data-lineno=" 7"><span class="punctuation">}</span>   <span class="punctuation">}</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9"><span class="name class">WorkerOnList</span><span class="punctuation">&lt;</span><span class="name class">Integer</span><span class="punctuation">&gt;</span> worker <span class="operator">=</span>
</code><small class="ln">10</small><code data-lineno="10">        <span class="keyword">new</span> <span class="name class">WorkerOnList</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span> <span class="punctuation">(</span>i<span class="punctuation">)</span> <span class="operator">-&gt;</span> <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>i<span class="operator">*</span><span class="literal number integer">10</span><span class="punctuation">)</span> <span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">11</small><code data-lineno="11">worker<span class="punctuation">.</span><span class="name function">accept</span><span class="punctuation">(</span><span class="name class">Arrays</span><span class="punctuation">.</span><span class="name function">asList</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">,</span><span class="literal number integer">2</span><span class="punctuation">,</span><span class="literal number integer">3</span><span class="punctuation">,</span><span class="literal number integer">4</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre><div class="incremental-list"><p><em>Ausgabe:</em> <code class="console"><span class="literal number integer">10</span> <span class="literal number integer">20</span> <span class="literal number integer">30</span> <span class="literal number integer">40</span></code></p></div></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="lambdas-method-references"><h2>Lambdas - Method References</h2><ld-deck><ld-card class="referenzen auf methoden"><p>Als Implementierung eines funktionalen Interfaces (als „Lambda“) können auch Methoden verwendet werden.</p></ld-card><ld-card class="incremental"><ld-deck><ld-card><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p class="rubric">Referenz auf statische Methode</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">ListMethods</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">static</span> <span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> <span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> <span class="name function">filterList</span><span class="punctuation">(</span><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> l<span class="punctuation">,</span> <span class="name class">Predicate</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> pred<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">        <span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> res <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">LinkedList</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">        <span class="keyword">for</span> <span class="punctuation">(</span><span class="name class">T</span> x <span class="operator">:</span> l<span class="punctuation">)</span> <span class="keyword">if</span> <span class="punctuation">(</span>pred<span class="punctuation">.</span><span class="name function">test</span><span class="punctuation">(</span>x<span class="punctuation">)</span><span class="punctuation">)</span> <span class="punctuation">{</span> res<span class="punctuation">.</span><span class="name function">add</span><span class="punctuation">(</span>x<span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">        <span class="keyword">return</span> res<span class="punctuation">;</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="punctuation">}</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="keyword">static</span> <span class="keyword">boolean</span> <span class="name function">isEven</span><span class="punctuation">(</span><span class="keyword">int</span> x<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">return</span> x <span class="operator">%</span> <span class="literal number integer">2</span> <span class="operator">==</span> <span class="literal number integer">0</span><span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 8</small><code data-lineno=" 8"><span class="punctuation">}</span>

<ld-topic class="exercises" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Erste Implementierung von Funktionen höherer Ordnung"><p class="ld-exercise-title rubric"><span>Erste Implementierung von Funktionen höherer Ordnung</span></p><p>Schreiben Sie eine Klasse <code class="java"><span class="name class">Tuple2</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code>; d. h. eine Variante von <code class="java"><span class="name class">Pair</span></code> bei der beide Werte vom gleichen Typ <code class="java"><span class="name class">T</span></code> sein müssen. Die Klasse soll Methoden haben, um die beiden Werte zu setzen und zu lesen. Weiterhin soll die Klasse um folgende Methoden ergänzt werden:</p><ul class="simple"><li><p><code class="java"><span class="keyword">void</span> <span class="name function">forEach</span><span class="punctuation">(</span><span class="name class">Consumer</span><span class="punctuation">&lt;</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">&gt;</span> action<span class="punctuation">)</span></code>: Führt die Aktion für jedes Element in dem <code class="java"><span class="name class">Tuple</span></code> aus.</p></li><li><p><code class="java"><span class="keyword">void</span> <span class="name function">replaceAll</span><span class="punctuation">(</span><span class="name class">UnaryOperator</span><span class="punctuation">&lt;</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">&gt;</span> operator<span class="punctuation">)</span></code>: Ersetzt alle Elemente im <code class="java"><span class="name class">Tuple</span></code> durch das Ergebnis der Anwendung des Operators auf das Element.</p></li></ul><p>Schreiben Sie Tests für die neuen Methoden; verwenden Sie dafür Closures bzw. Lambda-Funktionen. Stellen Sie 100% <em>Statementcoverage</em> sicher.</p><ld-supplemental><p>Die Java Dokumentation finden Sie hier:</p><ul><li><p>Übersicht: <a class="reference external" href="https://docs.oracle.com/en/java/javase/25/docs/api/help-doc.html">https://docs.oracle.com/en/java/javase/25/docs/api/help-doc.html</a></p></li><li><p>API Dokumentation: <a class="reference external" href="https://docs.oracle.com/en/java/javase/25/docs/api/allclasses-index.html">https://docs.oracle.com/en/java/javase/25/docs/api/allclasses-index.html</a></p><p>(Hier der Link auf die Dokumentation der Klasse <code class="java"><span class="name class">UnaryOperator</span></code>: <a class="reference external" href="https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/function/UnaryOperator.html">https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/function/UnaryOperator.html</a>)</p></li></ul></ld-supplemental><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><ul class="simple"><li><p>Sorgen Sie ggf. vorher dafür, dass Sie eine angemessene Projektstruktur haben.</p></li><li><p>Passen Sie ggf. die <span class="docutils literal">pom.xml</span> von ihren anderen Projekten an.</p></li></ul></aside><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:xTCDodMQzQV/CBQAVjf2eGqSZvqYMGdcED8Ad+3gqQY=:oYhCmTHnVaWJkemf:i/ZrYGX3xUq5xccqH6FGWs9H/plpjZ/x4sVt9jtj+5vFaY64wHCzJjB6RQdOSA3xnXyyHVNOkxSMqcIG3sZ4061tjBFCW2t2dCz94H+3p/sVVkmMMdPn0ovj2yoL+dRpNKdiyDhRf+P2N4VC5h5acXZvqRvISHDnaxQza+sPU37E0KkJyGaddMlRDiGHqZbbvOxDaFFxUlV7dge+Om47Pyr2MRV/tE3eTRnc/owAoElwMDS25vu/AvNOh4FPgUGbgJ1BXwFAta+gpsTb9fblybuMn2rtTBTLpJFiXGgZ9Tfpa9LoUCFsqFyfI9U1AwWIeTsnjNVqTpqaOjiQt26D3CJ0/qF55EBpSX9xoa2ernP/x9k7pm9FCXWkQCJh6HdKgmCz0E+QL0vATmXgSVDTWIhoG4xN7/bVpluoAqovYxxMhK7pdISfu7DOJgYxJzlOmDJAhERrGcwjJKWlQ4UDrtnqzBQtPEgFh2HbH1q9yNN+PBCmKQUWD7TEqcEtJe5Gxjr+wRyL2xkxZy8edXuaViD <ld-topic class="repetition" id="warteschlangen"><h2>Warteschlangen</h2><p>Eine Warteschlange ist eine einfache Datenstruktur bei der die Elemente in der Reihenfolge entfernt werden in der diese hinzugefügt wurden (<span class="eng">First-in-First-out (FiFo)</span>).</p><p>Zentrale Methoden einer Warteschlange <code class="java"><span class="name class">Queue</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code> sind:</p><ul class="simple"><li><p><code class="java"><span class="keyword">void</span> <span class="name function">enqueue</span><span class="punctuation">(</span><span class="name class">T</span> item<span class="punctuation">)</span></code> (auch <code class="java"><span class="keyword">boolean</span> <span class="name function">offer</span><span class="punctuation">(</span><span class="name class">T</span> item<span class="punctuation">)</span></code> bzw. <code class="java"><span class="keyword">void</span> <span class="name function">add</span><span class="punctuation">(</span><span class="name class">T</span> item<span class="punctuation">)</span></code>): Fügt ein Element hinzu.</p></li><li><p><code class="java"><span class="name class">T</span> <span class="name function">dequeue</span><span class="punctuation">(</span><span class="punctuation">)</span></code> oder <code class="java"><span class="name class">T</span> <span class="name function">poll</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Entfernt das älteste Element und gibt es zurück.</p></li><li><p><code class="java"><span class="keyword">boolean</span> <span class="name function">isEmpty</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Gibt an ob die Warteschlange leer ist.</p></li></ul></ld-topic>
<ld-topic class="repetition" id="verkettete-listen"><h2>Verkettete Listen</h2><aside class="admonition" data-theme="remember"><p class="admonition-title" data-theme="remember-header"><span>Zur Erinnerung</span></p><p>Die Verwendung eines Arrays, um Listen zu speichern, hat den Nachteil, dass sie eine feste Größe haben und nicht effizient vergrößert werden können.</p></aside><p>Eine verkettete Liste ist eine alternative Implementierungstechnik, die flexibler ist als ein Array und dynamisch wachsen kann. Jedes Element in einer verketteten Liste enthält eine Referenz auf das nächste Element in der Liste.</p><object class="light-image align-center" data="images/chainedlist.svg" type="image/svg+xml" role="img" aria-label="Verkettete Liste"></object><ld-supplemental><p class="rubric">Wann sollte welche Implementierung für eine Liste verwendet werden?</p><p>Sind die minimale und die maximale Größe einer Liste sehr gut abschätzbar, und liegen diese beiden Werte <em>hinreichend</em> nah beieinander, dann ist die Verwendung eines Arrays allein aus speichertechnischer Sicht effizienter als eine verkettete Liste, da der Overhead pro Element geringer ist. Weiterhin ist der Zugriff auf die Elemente effizienter.</p><p>Sollten jedoch auch Operationen wie Einfügen oder Löschen <em>häufig</em> vorkommen - insbesondere wenn diese nicht am Ende der Liste vorgenommen werden -  ist eine detaillierte Analyse notwendig. Im Zweifelsfall ist meist eine Arraylist die bessere Wahl, da die Cache-Effizienz ggf. besser ist und auch der wahlfreie Zugriff auf die Elemente effizienter ist.</p></ld-supplemental></ld-topic>
<ld-topic id="java-optionals"><h2>Java <code class="java"><span class="name class">Optional</span></code>s</h2><p>Instanzen der Klasse <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Optional</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code> (bzw. <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>OptionalInt</span></code> etc.) <em>repräsentieren Werte die vorhanden sind oder
auch nicht</em>.</p><p>Insbesondere <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Optional</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code> kann/sollte anstelle von <code class="java"><span class="keyword">null</span></code> verwendet werden, in Fällen in denen unter bestimmten Umständen kein sinnvoller Wert angegeben werden kann.</p><ld-deck><ld-card><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Es gibt moderne Programmiersprachen, die auf <code class="java"><span class="keyword">null</span></code> komplett verzichten und stattdessen immer auf <span class="docutils literal">Optionals</span> oder ähnliche Konstrukte setzen.</p></aside></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">static</span> <span class="name class">Optional</span><span class="punctuation">&lt;</span><span class="name class">Integer</span><span class="punctuation">&gt;</span> <span class="name function">min</span><span class="punctuation">(</span><span class="keyword">int</span><span class="punctuation">[</span><span class="punctuation">]</span> a <span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">if</span><span class="punctuation">(</span>a <span class="operator">==</span> <span class="keyword">null</span> <span class="operator">||</span> a<span class="punctuation">.</span>length <span class="operator">==</span> <span class="literal number integer">0</span><span class="punctuation">)</span>
</code><small class="ln">3</small><code data-lineno="3">        <span class="keyword">return</span> <span class="name class">Optional</span><span class="punctuation">.</span><span class="name function">empty</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">
</code><small class="ln">5</small><code data-lineno="5">    <span class="keyword">int</span> min <span class="operator">=</span> a<span class="punctuation">[</span><span class="literal number integer">0</span><span class="punctuation">]</span><span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6">    <span class="keyword">for</span><span class="punctuation">(</span><span class="keyword">int</span> x<span class="operator">:</span> a<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">if</span> <span class="punctuation">(</span>x <span class="operator">&lt;</span> min<span class="punctuation">)</span> <span class="punctuation">{</span> min <span class="operator">=</span> x<span class="punctuation">;</span> <span class="punctuation">}</span> <span class="punctuation">}</span>
</code><small class="ln">7</small><code data-lineno="7">    <span class="keyword">return</span> <span class="name class">Optional</span><span class="punctuation">.</span><span class="name function">of</span><span class="punctuation">(</span>min<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">8</small><code data-lineno="8"><span class="punctuation">}</span></code></pre></aside></ld-card></ld-deck></ld-topic>
<ld-topic class="exercises" id="ubung-1"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-3" data-exercise-id="3" data-exercise-title="3 - Implementierung einer Warteschlange mittels verketteter Liste"><p class="ld-exercise-title rubric"><span>Implementierung einer Warteschlange mittels verketteter Liste</span></p><p>Implementieren Sie eine Warteschlange (<code class="java"><span class="name class">Queue</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code>) basierend auf einer verketteten Liste. Ihre Klasse <code class="java"><span class="name class">LinkedQueue</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code> soll das folgende Interface <code class="java"><span class="name class">Queue</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code> implementieren.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">public</span> <span class="keyword">interface</span> <span class="name class">Queue</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">void</span> <span class="name function">enqueue</span><span class="punctuation">(</span><span class="name class">T</span> item<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="name class">Optional</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> <span class="name function">dequeue</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="keyword">boolean</span> <span class="name function">isEmpty</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>

<ld-topic class="summary" id="zusammenfassung"><h2>Zusammenfassung</h2><p class="rubric">Funktionale Programmierung</p><ul class="incremental-list simple"><li><p>Lambdas sind Ausdrücke, die (anonyme) Funktionen repräsentieren.</p></li><li><p>Es sind sowohl Referenzen auf statische Methoden als auch Instanzmethoden und sogar Konstruktoren möglich.</p></li><li><p>Currying wird nicht direkt unterstützt, aber durch die Verwendung von Funktionskomposition und partieller Anwendung kann es simuliert werden.</p></li><li><p>Anstelle von <code class="java"><span class="keyword">null</span></code> als Rückgabewert sollte man <code class="java"><span class="name class">Optional</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code> bevorzugen, um klar zu kommunizieren, dass es auch keinen Rückgabewert geben kann.</p></li></ul></ld-topic>
