<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic class="motivation" id="probleme-bei-der-verwendung-von-sockets"><h2>Probleme bei der Verwendung von Sockets</h2><p>Wir müssen uns kümmern um …</p><ul class="incremental-list negative-list list-with-explanations"><li><p>… die Einrichtung eines Kanals und alle Fehler, die während dieses Prozesses auftreten können.</p></li><li><p>… die Festlegung eines Protokolls.</p><p>Wer sendet was, wann, in welcher Reihenfolge und welche Antwort wird erwartet?</p></li><li><p>… Nachrichtenformate</p><p>Umwandlung von Daten der Anwendungsebene in Bytes, die über das Netz übertragen werden können.</p></li></ul></ld-topic>
<ld-topic id="middleware-als-programmierabstraktion"><h2>Middleware als Programmierabstraktion</h2><ld-supplemental><ul class="simple"><li><p>Eine Softwareschicht oberhalb des Betriebssystems und unterhalb des Anwendungsprogramms, die eine gemeinsame Programmierabstraktion in einem verteilten System bietet.</p></li><li><p>Ein Baustein auf höherer Ebene als die vom Betriebssystem bereitgestellten APIs (z. B. Sockets)</p></li></ul></ld-supplemental><object class="light-image align-center" data="drawings/middleware.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="middleware-als-programmierabstraktion-1"><h2>Middleware als Programmierabstraktion</h2><p>Die von Middleware angebotenen Programmierabstraktionen verbergen einen Teil der Heterogenität und bewältigen einen Teil der Komplexität, mit der Programmierer einer verteilten Anwendung umgehen müssen:</p><ul class="incremental-list positive-list simple"><li><p>Middleware maskiert immer die Heterogenität der zugrundeliegenden Netzwerke und Hardware.</p></li><li><p>Middleware maskiert meistens die Heterogenität von Betriebssystemen und/oder Programmiersprachen.</p></li><li><p><span class="peripheral">Manche Middleware maskiert sogar die Heterogenität zwischen den Implementierungen des gleichen Middleware-Standards durch verschiedene Hersteller</span>.</p></li></ul><ld-supplemental><p>Alte Middlewarestandards – wie zum Beispiel CORBA – waren sehr komplex und die Implementierungen verschiedener Hersteller meist nicht vollständig kompatibel.</p></ld-supplemental></ld-topic>
<ld-topic id="transparenzziele-von-middleware-aus-sicht-der-programmierung"><h2>Transparenzziele von Middleware aus Sicht der Programmierung</h2><p>Middleware bietet (beim Programmieren) Transparenz in Bezug auf eine oder mehrere der folgenden Dimensionen:</p><ul class="simple"><li><p>Standort</p></li><li><p>Nebenläufigkeit</p></li><li><p>Replikation</p></li><li><p>Ausfälle (bedingt)</p></li></ul><div class="assessment margin-top-2em"><p>Middleware ist die Software, die ein verteiltes System (DS) programmierbar macht.</p></div></ld-topic>
<ld-topic id="middleware-als-infrastruktur"><h2>Middleware als Infrastruktur</h2><ul class="incremental-list list-with-explanations"><li><p>Hinter Programmierabstraktionen steht eine komplexe Infrastruktur, die diese Abstraktionen implementiert</p><p>Middleware-Plattformen können sehr komplexe Softwaresysteme sein.</p></li><li><p>Da die Programmierabstraktionen immer höhere Ebenen erreichen, muss die zugrunde liegende Infrastruktur, die die Abstraktionen implementiert, entsprechend wachsen.</p></li><li><p>Zusätzliche Funktionalität wird fast immer durch zusätzliche Softwareschichten implementiert.</p></li><li><p>Die zusätzlichen Softwareschichten erhöhen den Umfang und die Komplexität der für die Nutzung der neuen Abstraktionen erforderlichen Infrastruktur.</p></li></ul><ld-supplemental><p>Seit Jahrzehnten kann beobachtet werden, dass Middleware immer komplexer wird bzw. wurde bis zu dem Punkt an dem die Komplexität kaum mehr beherrschbar war. Zu diesen Zeitpunkten wurden dann häufig neue Ansätze entwickelt, die die Komplexität reduzierten bis diese wiederum Eingang in komplexere Middleware-Produkten Eingang fand.</p><p>Ansätze, wie z. B. REST, haben sich als recht erfolgreich erwiesen stellen aber Entwickler vor neue Herausforderungen.</p></ld-supplemental></ld-topic>
<ld-topic id="middleware-und-nicht-funktionale-anforderungen"><h2>Middleware und nicht-funktionale Anforderungen</h2><p>Die Infrastruktur kümmert sich um nicht-funktionale Eigenschaften, die normalerweise von Datenmodellen, Programmiermodellen und Programmiersprachen ignoriert werden:</p><ul class="simple"><li><p>Performance</p></li><li><p>Verfügbarkeit</p></li><li><p>Ressourcenmanagement</p></li><li><p>Zuverlässigkeit</p></li><li><p>usw.</p></li></ul></ld-topic>
<ld-topic id="middleware-als-infrastruktur-1"><h2>Middleware als Infrastruktur</h2><p>Middleware unterstützt zusätzliche Funktionen die die Entwicklung, Wartung und Überwachung einfacher und kostengünstiger machen (Auszug):</p><ul class="incremental-list"><li><p>Protokollierung (<span class="eng">Logging</span>)</p></li><li><p>Wiederherstellung (<span class="eng">Recovery</span>)</p></li><li><p>Sprachprimitive für transaktionale Abgrenzung</p><p>(<span class="peripheral">Bzw. fortgeschrittene Transaktionsmodelle (z. B. transaktionale RPC) oder transaktionale Dateisysteme</span>)</p></li></ul></ld-topic>
<ld-topic id="middleware-konzeptionelle-historisch"><h2>Middleware - konzeptionelle (historisch)<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></h2><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Darstellung nach: Alonso; Web services: Concepts, Architectures and Applications; Springer, 2004</p></aside></aside><object class="light-image align-center" data="drawings/historische-middleware-konzeptuell.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>Insbesondere die explizite Erzeugung von Stubs und Skeletons durch einen IDL Compiler erfolgt so in der heutigen Zeit nicht mehr. Die Erzeugung von Stubs und Skeletons - wenn überhaupt erforderlich - erfolgt heute automatisch durch die Middleware.</p></ld-supplemental></ld-topic>
<ld-topic class="vertical-title" id="historische-entwicklung-von-middleware"><h2>Historische Entwicklung von Middleware</h2><object class="light-image align-center" data="drawings/historic_middleware_technologies.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="entwicklung-von-middleware"><h2>Entwicklung von Middleware</h2><ul class="simple"><li><p>Middleware beabsichtigt die Details der Hardware, der Netze und der Verteilung auf niedriger Ebene zu verbergen.</p></li><li><p>Anhaltender Trend zu immer leistungsfähigeren Primitiven (<em>Events</em>), die zusätzliche Eigenschaften haben oder eine flexiblere Nutzung des Konzepts ermöglichen.</p></li><li><p>Die Entwicklung und das Erscheinungsbild für den Programmierer wird von den Trends in den Programmiersprachen diktiert:</p><ul class="simple"><li><p>RPC und C</p></li><li><p>CORBA und C++</p></li><li><p>RMI (Corba) und Java</p></li><li><p>„Klassische“ Webservices und XML</p></li><li><p>RESTful Webservices und JSON</p></li></ul></li></ul></ld-topic>
<ld-topic class="no-title center-content transition-fade" id="middleware-high-level-view"><h2>Middleware - High-level View</h2><div class="accentuate"><p>Eine Middleware stellt eine umfassende Plattform für die Entwicklung und den Betrieb komplexer verteilter Systeme zur Verfügung.</p></div></ld-topic>
<ld-topic class="new-section transition-scale" id="middleware-technologien"><h2>Middleware-Technologien</h2></ld-topic>
<ld-topic class="new-subsection transition-move-left" id="remote-procedure-calls-rpcs"><h2>Remote Procedure Calls (RPCs)</h2></ld-topic>
<ld-topic id="remote-procedure-call-rpc"><h2>Remote Procedure Call (RPC)</h2><div class="accentuate"><p>Schwerpunkt: verstecken der Netzkommunikation.</p></div><div class="incremental"><p>Ein Prozess kann eine Prozedur aufrufen deren Implementierung sich auf einem entfernten Rechner befindet:</p><ul class="simple"><li><p>Programmierer von verteilten Systemen müssen sich nicht mehr um alle Details der Netzwerkprogrammierung kümmern (d. h. keine „expliziten“ Sockets mehr).</p></li><li><p>Überbrückung der konzeptionellen Lücke zwischen dem Aufruf lokaler Funktionalität über Prozeduren und dem Aufruf entfernter Funktionalität über Sockets.</p></li></ul></div></ld-topic>
<ld-topic id="rpcs-konzeptionell-synchrone-kommunikation"><h2>RPCs konzeptionell (synchrone Kommunikation)</h2><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><ul class="simple"><li><p>Ein Server ist ein Programm, das bestimmte Dienste implementiert.</p></li><li><p>Cients möchten diese Dienste in Anspruch nehmen:</p><ul class="incremental-list simple"><li><p>Die Kommunikation erfolgt durch das Senden von Nachrichten (kein gemeinsamer Speicher, keine gemeinsamen Festplatten usw.)</p></li><li><p>Einige minimale Garantien müssen gegeben werden (Behandlung von Fehlern, Aufrufsemantik, usw.)</p></li></ul></li></ul></ld-cell><ld-cell class="width-40" style="align-self:auto;"><object class="light-image align-center" data="drawings/rpc_konzeptionell.svg" type="image/svg+xml" role="img"></object></ld-cell></ld-grid></ld-topic>
<ld-topic id="rpcs-zentrale-fragestellungen-und-herausforderungen"><h2>RPCs - zentrale Fragestellungen und Herausforderungen</h2><ld-deck><ld-card><p>Sollen entfernte Aufrufe transparent oder nicht transparent für den Entwickler sein?</p><blockquote><p>Ein entfernter Aufruf ist etwas völlig anderes als ein lokaler Aufruf; sollte sich der Programmierer dessen bewusst sein?</p></blockquote></ld-card><ld-card class="incremental"><p>Wie können Daten zwischen Maschinen ausgetauscht werden, die möglicherweise unterschiedliche Darstellungen für verschiedene Datentypen verwenden?</p></ld-card><ld-card class="incremental"><p>Komplexe Datentypen müssen linearisiert werden:</p><dl class="field-list simple"><dt><strong>Marshalling</strong><span class="colon">:</span></dt><dd><p>der Prozess des Aufbereitens der Daten in eine für die Übermittlung in einer Nachricht geeignete Form.</p></dd><dt><strong>Unmarshalling</strong><span class="colon">:</span></dt><dd><p>der Prozess der Wiederherstellung der Daten bei ihrer Ankunft am Zielort, um eine originalgetreue Repräsentation zu erhalten.</p></dd></dl></ld-card><ld-card class="incremental"><p>Wie findet und bindet man den Dienst, den man tatsächlich will, in einer potenziell großen Sammlung von Diensten und Servern?</p><p>Das Ziel ist, dass der Kunde nicht unbedingt wissen muss, wo sich der Server befindet oder sogar welcher Server den Dienst anbietet (Standorttransparenz).</p></ld-card><ld-card class="incremental"><p>Wie geht man mehr oder weniger elegant mit Fehlern um:</p><ul class="simple"><li><p>Server ist ausgefallen</p></li><li><p>Kommunikation ist gestört</p></li><li><p>Server beschäftigt</p></li><li><p>doppelte Anfragen ...</p></li></ul></ld-card></ld-deck><ld-supplemental><p>Je nach System ist die Reihenfolge der Bytes unterschiedlich:</p><ul class="simple"><li><p>Intel-CPUs sind Little-Endian.</p></li><li><p>PowerPC ist Big-Endian.</p></li><li><p>ARM kann beides und ist meistens Little-Endian.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic class="smaller" id="high-level-view-auf-rpc"><h2>High-level View auf RPC</h2><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Für Programmierer sieht ein „entfernter“ Prozeduraufruf fast identisch aus wie ein „lokaler“ Prozeduraufruf und funktioniert auch so - auf diese Weise wird Transparenz erreicht.</p></aside><div class="incremental"><p>Um Transparenz zu erreichen, führte RPC viele Konzepte von Middleware-Systemen ein:</p><ul class="incremental-list list-with-explanations"><li><p><em>Interface Description Language</em> (IDL)</p></li><li><p>Verzeichnis- und Benennungsdienste</p></li><li><p>Dynamische Bindung</p></li><li><p>Marshalling und Unmarshalling</p></li><li><p><em>Opaque References</em>, um bei verschiedenen Aufrufen auf dieselbe Datenstruktur oder Entität auf dem Server zu verweisen.</p><p>(Der Server ist für die Bereitstellung dieser undurchsichtigen Referenzen verantwortlich.)</p></li></ul></div></ld-topic>
<ld-topic id="rpc-call-semantics"><h2>RPC - Call Semantics</h2><p>Nehmen wir an, ein Client stellt eine RPC-Anfrage an einen Dienst eines bestimmten Servers.
Nachdem die Zeitüberschreitung abgelaufen ist, beschließt der Client die Anfrage erneut zu senden. Das finale Verhalten hängt von der Semantik des Aufrufs (<span class="eng">Call Semantics</span>) ab:</p><ld-deck><ld-card><p class="rubric">Maybe (vielleicht; keine Garantie)</p><p>Die Zielmethode kann ausgeführt worden sein und die Antwortnachricht(en) ging(en) verloren oder die Methode wurde gar nicht erst ausgeführt da die Anfrage verloren ging.</p><div class="peripheral"><p><span class="docutils literal">XMLHTTPRequests</span> und <span class="docutils literal">fetch()</span> in Webbrowsern verwenden diese Semantik.</p></div></ld-card><ld-card class="incremental"><p class="rubric">At least once (mindestens einmal)</p><p>Die Prozedur wird ausgeführt werden solange der Server nicht endgültig versagt.</p><p>Es ist jedoch möglich, dass sie mehr als einmal ausgeführt wird wenn der Client die Anfrage nach einer Zeitüberschreitung erneut gesendet hatte.</p></ld-card><ld-card class="incremental"><p class="rubric">At most once (höchstens einmal)</p><p>Die Prozedur wird entweder einmal oder gar nicht ausgeführt. Ein erneutes Senden der Anfrage führt nicht dazu, dass die Prozedur mehrmals ausgeführt wird.</p></ld-card><ld-card class="incremental"><p class="rubric">Exactly once (genau einmal)</p><p>Das System garantiert die gleiche Semantik wie bei lokalen Aufrufen unter der Annahme, dass ein abgestürzter Server irgendwann wieder startet.</p><p>Verwaiste Aufrufe, d. h. Aufrufe auf abgestürzten Server-Rechnern, werden nachgehalten, damit sie später von einem neuen Server übernommen werden können.</p></ld-card></ld-deck></ld-topic>
<ld-topic id="asynchrones-rpc"><h2>Asynchrones RPC</h2><ld-grid class="default-layout"><ld-cell class="fade-out width-30" style="align-self:auto;"><p>Die Verbindung zwischen Client und Server in einem traditionellen RPC. Der Client wird blockiert und wartet.</p></ld-cell><ld-cell style="align-self:auto;"><object class="light-image align-center" data="drawings/rpcs/synchronous_rpc.svg" type="image/svg+xml" role="img"></object></ld-cell></ld-grid><hr><ld-grid class="default-layout"><ld-cell class="fade-out width-30" style="align-self:auto;"><p>Die Verbindung zwischen Client und Server bei einem asynchronen RPC. Der Client wird nicht blockiert.</p></ld-cell><ld-cell style="align-self:auto;"><object class="light-image align-center" data="drawings/rpcs/asynchronous_rpc.svg" type="image/svg+xml" role="img"></object></ld-cell></ld-grid><ld-supplemental><p>Ein normaler Aufruf mittels <code class="javascript">XMLHTTPRequest</code> oder <code class="javascript">fetch</code> (JavaScript) ist auch immer asynchron.</p></ld-supplemental></ld-topic>
<ld-topic id="rpc-bewertung"><h2>RPC - Bewertung</h2><ul class="incremental-list positive-list simple"><li><p>RPC bietet einen Mechanismus, um verteilte Anwendungen auf einfache und effiziente Weise zu implementieren.</p></li><li><p>RPC ermöglicht den modularen und hierarchischen Aufbau großer verteilter Systeme:</p><ul class="simple"><li><p>Client und Server sind getrennte Einheiten</p></li><li><p>Der Server kapselt und verbirgt die Details der Backend-Systeme (wie z. B. Datenbanken)</p></li></ul></li></ul><ul class="incremental-list negative-list simple"><li><p>RPC ist kein Standard, sondern wurde auf viele verschiedene Arten umgesetzt.</p></li><li><p>RPC ermöglicht Entwicklern den Aufbau verteilter Systeme, löst aber nur ausgewählte Aspekte.</p></li></ul><ld-supplemental><p>Wenn man moderne Ansätze wie RESTful WebServices mit RPC vergleicht, dann fällt auf, dass RPC eine deutlich bessere Tranzparenz bietet.</p></ld-supplemental><div class="incremental"><p>Das Network File System (NFS) und SMB sind bekannte RPC-basierte Anwendungen.</p></div><ld-presenter-note encrypted="">MTAwMDAw:yz3OIDMzPPyWSTotFxnBNZhUZh4On9YnuTS2B1yjHK0=:upvq6d3StUtkY6k/:EUKtNtlysXOV13k+VK8uWhLTezwhS6NISSqWMB6EVSkalHJIP3dNNCkMHUK7CaCfTfy3fiJokve3cyBWuc6yvr101LfUQnGGe+r3zVrBYmpFiBVEQoprZ/jXMrcaXeGfd3QOhZTqfxjzS5PJG8zFLykmBg7Q1W4e4RjiKyPQebz/5K8UYLhK9gDhBMrn4T9LOFVyQrH7ENM2mHw9tOrA1T3IF17wG7NlLeEdEO7V0C8VzrQiKGY138Mrvi68bTHm0pDQ0DszBcshVd0iGVfN9lc03Wk/uwk29dRpxVVP7mU=</ld-presenter-note></ld-topic>
<ld-topic class="new-subsection transition-fade" id="java-remote-method-invocation-rmi"><h2>Java Remote Method Invocation (RMI)</h2></ld-topic>
<ld-topic id="java-rmi-remote-method-invocation"><h2>Java RMI (Remote Method Invocation)</h2><div class="accentuate"><p>Ermöglicht es einem Objekt, das in einer Java Virtual Machine (VM) läuft, Methoden eines Objekts aufzurufen, das in einer anderen Java VM läuft.</p></div><ul class="incremental-list simple"><li><p>Entfernte Objekte können ähnlich wie lokale Objekte behandelt werden.</p></li><li><p>Übernimmt das Marshalling, den Transport und die Garbage Collection der entfernten Objekte.</p></li><li><p>Teil von Java seit JDK 1.1</p></li></ul></ld-topic>
<ld-topic id="java-rmi-vs-rpc"><h2>Java RMI vs. RPC</h2><object class="light-image align-center" data="drawings/rpc_vs_rmi.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>Java RMI ist eine spezielle Form von RPC, die in Java implementiert wurde. Der Unterschied ergibt sich im Prinzip aus dem Unterschied zwischen einem
Prozeduraufruf und einem Methodenaufruf auf ein Objekt</p></ld-supplemental></ld-topic>
<ld-topic id="java-rmi-implementiert-ein-distributed-object-model"><h2>Java RMI implementiert ein <em>Distributed Object Model</em></h2><object class="light-image align-center" data="drawings/java_rmi-distributed-object-model.svg" type="image/svg+xml" role="img"></object><ld-supplemental><ul><li><p>Jeder Prozess enthält sowohl Objekte die entfernte Aufrufe empfangen können als auch solche, die nur lokale Aufrufe empfangen können.</p><p>(Objekte die entfernte Aufrufe empfangen können, werden <em>Remote Objects</em> genannt).</p></li><li><p>Objekte müssen die Remote-Objektreferenz eines Objekts in einem anderen Prozess kennen, um dessen Methoden aufrufen zu können (Remote Method Invocation; Remote Object References)</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="anatomie-eine-java-rmi-aufrufs"><h2>Anatomie eine Java RMI Aufrufs</h2><object class="light-image align-center" data="drawings/rmi_anatomy/rmi_anatomy.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>Der Proxy versteckt für den Client, dass es sich um einen entfernten Aufrufe handelt.  Er implementiert die Remote-Schnittstelle und kümmert sich um das Marshalling und Unmarshalling der Parameter und des Ergebnisses.</p><p>Der Skeleton ist für die Entgegennahme der Nachrichten verantwortlich und leitet die Nachricht an das eigentliche Objekt weiter. Er sorgt für die Transparenz auf Serverseite.</p><p>Referenzen auf <em>Remote Objects</em> sind systemweit eindeutig und können frei zwischen Prozessen weitergegeben werden (z. B. als Parameter). Die Implementierung der entfernten Objektreferenzen wird von der Middleware verborgen (<em>Opaque-Referenzen</em>).</p></ld-supplemental></ld-topic>
<ld-topic id="rmi-protocol-stack"><h2>RMI Protocol Stack</h2><object class="align-center" data="drawings/rmi_anatomy/rmi_protocol_stack.svg" type="image/svg+xml" role="img"></object><ld-supplemental><ul class="simple"><li><p><em>Remote Reference Layer</em>: RMI-spezifische Kommunikation über TCP/IP, Verbindungsinitialisierung, Serverstandort, Verarbeitung serialisierter Daten</p></li><li><p><em>RMI Transport Layer (TCP)</em>: Verbindungsverwaltung, Bereitstellung einer zuverlässigen Datenübertragung zwischen Endpunkten</p></li><li><p>Internetprotokoll in IP-Paketen enthaltene Datenübertragung (unterste Ebene)</p></li></ul></ld-supplemental></ld-topic>

<ld-topic id="java-rmi-tidbits"><h2>Java RMI - Tidbits</h2><ul class="list-with-explanations"><li><p>RMI verwendet einen referenzzählenden Garbage-Collection-Algorithmus. Netzwerkprobleme können dann zu einer verfrühten GC führen was wiederum bei Aufrufen zu Ausnahmen führen kann.</p></li><li><p>Die Aufrufsemantik (<em>Call Semantics</em>) von RMI ist <em>at most once</em>.</p></li><li><p>(Un)Marshalling ist in Java RMI automatisch und verwendet Java Object Serialization.</p><p>Der Overhead kann leicht ~25%-50% der Zeit für einen entfernten Aufruf ausmachen.</p></li></ul></ld-topic>
<ld-topic class="new-subsection transition-fade" id="klassische-web-services-und-soap"><h2>Klassische Web Services und SOAP</h2></ld-topic>
<ld-topic id="integration-von-unternehmensanwendungen"><h2>Integration von Unternehmensanwendungen</h2><p>Die Probleme unternehmensübergreifende Punkt-zu-Punkt-Integration zu ermöglichen führten zur Entwicklung der nächsten Generation von Middleware-Technologien.</p><object class="light-image align-center" data="drawings/web_services-vs-message_brokers/message-brokers_and_adapters.svg" type="image/svg+xml" role="img"></object><div class="footer-left"><p>Darstellung nach <em>Web Services - Concepts, Architectures and Applications; Alonso et al.; Springer 2004</em></p></div><ld-supplemental><p>Jedes Unternehmen verwendet(e) seinen eigenen „konkreten“` Message-Broker - wenn wir mit mehreren Unternehmen kommunizieren wollen, müssen wir mehrere Adapter/Lösungen implementieren und pflegen.</p></ld-supplemental></ld-topic>
<ld-topic class="no-title center-content" id="web-services"><h2>Web Services</h2><blockquote class="epigraph"><p>Webservices are self-contained, modular business applications that have open, internet-oriented, standards-based interfaces.</p><p class="attribution">—UDDI Konsortium</p></blockquote></ld-topic>
<ld-topic id="web-services-konzeptionell"><h2>Web Services - konzeptionell</h2><object class="light-image align-center" data="drawings/web_services-vs-message_brokers/webservices_vision.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="web-services-wesentliche-bestandteile"><h2>Web Services - wesentliche Bestandteile</h2><ld-deck><ld-card><object class="light-image align-center" data="drawings/web_services-vs-message_brokers/komponenten.svg" type="image/svg+xml" role="img"></object><ld-supplemental embed-in-document-flow=""><ul class="simple"><li><p><em>Service Provider</em>: Die Einheit, die den Dienst implementiert und anbietet ihn im Namen des Anforderers auszuführen.</p></li><li><p><em>Service Requestor</em>: Der potenzielle Nutzer eines Dienstes.</p></li><li><p><em>Service Registry</em>: Auflistung der verfügbaren Dienste.</p></li></ul></ld-supplemental></ld-card><ld-card class="s-overlay center-content backdrop-blur incremental"><aside class="admonition" data-theme="assessment"><p class="admonition-title" data-theme="assessment-header"><span>Bewertung</span></p><p>Konzeptionell hat sich somit im Vergleich zur RPC-Welt nicht viel geändert.</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="web-services-protokoll-stack"><h2>Web Services - Protokoll Stack</h2><object class="light-image align-center" data="drawings/ws-protocol_stack.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="soap"><h2>SOAP</h2><ul class="incremental-list list-with-explanations simple"><li><p>SOAP ist das Protokoll klassischer Web Services und ermöglicht die Kommunikation zwischen Anwendungen.</p></li><li><p>SOAP umfasst die folgenden Teile:</p><ul class="simple"><li><p>Ein Nachrichtenformat, das beschreibt, wie eine Nachricht in ein XML-Dokument verpackt werden kann (Umschläge, Header, Body...)</p></li><li><p>Ein Satz von Kodierungsregeln für Daten</p></li><li><p>Eine Beschreibung wie eine SOAP-Nachricht mit dem zugrundeliegenden Transportprotokoll (HTTP oder SMTP) transportiert werden sollte. Wie eine SOAP-Nachricht in eine HTTP-Anfrage oder in eine E-Mail (SMTP) eingebettet werden kann.</p></li><li><p>Eine Reihe von Regeln, die bei der Verarbeitung einer SOAP-Nachricht zu befolgen sind, und die an dieser Verarbeitung beteiligten Stellen; welche Teile der Nachrichten von wem gelesen werden sollten und welche Maßnahmen diese Stellen ergreifen sollten, wenn sie den Inhalt nicht verstehen.</p></li></ul></li></ul><ld-supplemental><p>SOAP ist eine Weiterentwicklung von XML-RPC und stand ursprünglich für Simple Object Access Protocol.</p><p>SOAP (ab Version 1.2) ist ein Standard des W3C.</p></ld-supplemental></ld-topic>
<ld-topic id="aufbau-einer-soap-nachricht"><h2>Aufbau einer SOAP-Nachricht</h2><ld-grid class="default-layout"><ld-cell class="width-40" style="align-self:auto;"><object class="light-image align-center" data="drawings/soap_message.svg" type="image/svg+xml" role="img"></object></ld-cell><ld-cell class="width-60" style="align-self:auto;"><p>Nachrichten sind Umschläge, in die die Nutzdaten der Anwendung eingeschlossen werden.</p><p>Eine Nachricht hat zwei Hauptbestandteile:</p><dl class="field-list simple"><dt>Header (optional)<span class="colon">:</span></dt><dd><p>Für infrastrukturelle Daten wie Sicherheit oder Zuverlässigkeit vorgesehen.</p></dd><dt>Body (obligatorisch)<span class="colon">:</span></dt><dd><p>Für Daten auf Anwendungsebene vorgesehen. Jeder Teil kann in Blöcke unterteilt werden.</p></dd></dl></ld-cell></ld-grid></ld-topic>

<ld-topic class="new-section transition-move-to-top" id="messaging-und-message-oriented-communication-middleware"><h2>Messaging und Message-oriented Communication/Middleware</h2></ld-topic>
<ld-topic id="zeromq"><h2>ZeroMQ</h2><ul class="incremental-list simple"><li><p>ZeroMQ ist eine Messaging-Infrastruktur ohne explizite Server („Broker“).</p></li><li><p>ZeroMQ unterstützt verbindungsorientierte aber asynchrone Kommunikation.</p></li><li><p>ZeroMQ basiert auf klassischen Sockets, fügt aber neue Abstraktionen hinzu, um folgende Messaging Patterns zu ermöglichen:</p><ul class="simple"><li><p><em>request-reply</em></p></li><li><p><em>pub-sub</em> (<span class="eng">publish-subscribe</span>)</p></li><li><p>pipeplining (<span class="ger">parallele Verarbeitung</span>)</p></li></ul></li><li><p>ZeroMQ ermöglicht N-zu-N Kommunikation.</p></li><li><p>ZeroMQ unterstützt sehr viele Programmiersprachen; der Nutzer ist für das passend Marshalling bzw. Unmarshalling verantwortlich.</p></li></ul><ld-supplemental><p>Sollte zum Beispiel der Server in Java und der Client in C geschrieben sein, dann ist ggf. das Verständnis darüber wie ein String übertragen wird unterschiedlich (z. B. mit <span class="docutils literal">null</span> terminiert oder mit einer Länge versehen).</p></ld-supplemental></ld-topic>
<ld-topic id="zeromq-messaging-patterns"><h2>ZeroMQ - Messaging Patterns</h2><ld-scrollable><object class="light-image align-center" data="drawings/zeromq/client-server.svg" type="image/svg+xml" role="img"></object><object class="light-image align-center" data="drawings/zeromq/pub-sub.svg" type="image/svg+xml" role="img"></object><object class="light-image align-center" data="drawings/zeromq/pipeline.svg" type="image/svg+xml" role="img"></object></ld-scrollable><ld-supplemental><dl class="field-list simple"><dt><em>Client-Server</em><span class="colon">:</span></dt><dd><p>Ermöglicht die „übliche“ Kommunikation zwischen einem Client und einem Server. Allerdings findet ggf. eine Pufferung statt, wenn der Server nicht erreichbar ist.</p></dd><dt><em>Publish-Subscribe</em><span class="colon">:</span></dt><dd><p>Ermöglicht es den Clients, sich für ein bestimmtes Thema zu registrieren und dann alle Nachrichten zu erhalten, die zu diesem Thema veröffentlicht werden. Ein Nachricht mit einem bestimmten Thema wird an alle dafür registrierten Clients gesendet.</p></dd><dt><em>Pipeline</em><span class="colon">:</span></dt><dd><p>Ermöglicht die Versendung einer Aufgabe an genau einen beliebigen Worker aus einer Menge von (homogenen) Workern.</p></dd></dl></ld-supplemental></ld-topic>

<ld-topic id="mom-message-oriented-middleware"><h2>MOM - Message Oriented Middleware</h2><ul class="incremental list-with-explanations"><li><p>MOM bzw. Message-queueing Systems unterstützen persistente asynchrone Kommunikation.</p></li><li><p>Sehr große Nachrichten werden unterstützt.</p></li><li><p>Es wird nur die Garantie gegeben, dass Nachrichten letztendlich in die Warteschlange des Empfängers gelegt werden und die Nachrichten in der richtigen Reihenfolge ankommen.</p><p>(Insbesondere wird keine Garantie gegeben, dass die Nachricht gelesen wird.)</p></li><li><p>Der Sender und Empfänger sind nicht notwendigerweise gleichzeitig aktiv.</p></li><li><p>Nachrichten haben immer einen eindeutigen Empfänger und quasi beliebigen Inhalt.</p></li></ul></ld-topic>
<ld-topic id="mom-grundlegendes-interface"><h2>MOM - Grundlegendes Interface</h2><table class="accentuated-header zebra highlight-row-on-hover"><colgroup><col style="width: 16.7%"><col style="width: 83.3%"></colgroup><thead><tr><th class="head"><p>Operation</p></th><th class="head"><p>Beschreibung</p></th></tr></thead><tbody><tr><td><p>PUT</p></td><td><p>Legt eine Nachricht in eine bestimmte Warteschlange.</p></td></tr><tr><td><p>GET</p></td><td><p>Blockiert an einer bestimmten Warteschlange bis eine Nachricht verfügbar ist. Entfernt die erste Nachricht.</p></td></tr><tr><td><p>POLL</p></td><td><p>Prüft, ob eine Nachricht in einer bestimmten Warteschlange verfügbar ist. Entfernt ggf.  die erste Nachricht. POLL blockiert niemals</p></td></tr><tr><td><p>NOTIFY</p></td><td><p>Registriert einen Handler (<em>Callback</em>) der aufgerufen wird, wenn eine Nachricht einer bestimmten Warteschlange hinzugefügt wird.</p></td></tr></tbody></table></ld-topic>
<ld-topic id="mom-queue-managers"><h2>MOM - Queue Managers</h2><object class="light-image align-center" data="drawings/message-queueing.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p><em>Queue Managers</em> sind der zentrale Baustein von Message-queueing Systemen. Im Allgemeinen gibt es (mindestens konzeptionell) einen lokalen <em>Queue Manager</em> pro Prozess. Ein <em>Queue Manager</em> ist ein Prozess, der Nachrichten in Warteschlangen speichert und verwaltet. Bei Bedarf kann er mehrere Warteschlangen verwalten und an andere <em>Queue Manager</em> weiterleiten.</p></ld-supplemental></ld-topic>
<ld-topic class="exercises" id="ubung-java"><h2>Übung - Java</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Asynchrone, verbindungsorientierte Kommunikation"><p class="ld-exercise-title rubric"><span>Asynchrone, verbindungsorientierte Kommunikation</span></p><p>Entwickeln Sie einen Client für einen „Logging Server“, der Lognachrichten (Strings) an den Server sendet. Im Fehlerfall, z. B. wenn der Server nicht verfügbar ist oder es zu einer Netzwerkpartitionierung kam, sollen die Nachrichten zwischengepuffert werden und bei Serververfügbarkeit wieder zugestellt werden. Mit anderen Worten: Im Fehlerfall soll der Client nicht blockieren, sondern weiter funktionieren. Der Client stellt stattdessen die Nachrichten dann zu, wenn der Server wieder verfügbar wird.</p><p>Stellen Sie sicher, dass Nachrichten immer in der richtigen Reihenfolge am Server ankommen. D. h. stellen Sie zum Beispiel sicher, dass eine gepufferte Nachricht nie nach einer neueren Nachricht ankommt.</p><p>Verwenden Sie den Code im Anhang als Schablone.</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:mhsLfHwBiUMZN0VB3kvCUpxG3VEXa3m5vqSUSi5RCqU=:YUxTsFT/GwGiYvUy:DqVq6livFaCqmsd9+U3XBWenUf8E8E5baxvN+nKTtds+IVDSEy7qdSwLn2fyTfxag3Iep93W7g2nqI26Jc7SN5aeWlk2Jl5lIsQDf5lM1lMVotwOYMOd7XM2G/6X/wc+IAYa6CnXPDzPmBS0Mw/Zn1xxy+4jPsJCw+j1JAy2+U2V0jcg5z+37KEcRXZEoX9w6p3LA/cRwrD0ZzTc80wvGTbRtlBwDupblerG/a+XlVQiaAxOFRjk9NjA5JB170C58MIqnrgcqOO2GsPDyhC4fsgnbgLmjGZssqcRaHvFHiJWwJwh+Ko+Ybm7iURkK0Jt5yI/4ux26z4/vssuPeX4vuH94r1oLw34AurSvpbfc8GDlyxkE86koK2tgaelgMGeEbGOWor0j4651yB+YtbkYTUx5KsmqQOW7HKGkp/f+pJkRYScV4DQdenkt/SEyWgTBpqlXICPhqYrZERRg82ht+cvRqk1V8K//AfsZSWUm6VfNcXrj/sL4X3dYb3bE9DysjAxZ3xOUi9gw0yfNCimKZVQz/qW62sAjqrDwQYK21OeJSqmF2spxVaf79AJUrn56LSrfu2GM0HfnuaeLPvIseRbHhEMmoz8S+eBXG1CfPQ1Zm2oqqvpRr0AwstECzxsq2VuoJq9WzmQzV5+KYSNvHuPOazUmI+IqK2EkRhDuCP6G+YV0n8efJNgSvEY+K2pkF1FIcVLR3q40DY+uPwfl1ozVxLjc8WjQbP1bzEcFL8oz1sj1tBXDZkl2dYfKK5DHpFIACvCMfB4KjtuT2/vngE63         server<span class="punctuation">.</span><span class="name function">close</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>

    <span class="punctuation">}</span>
  <span class="punctuation">}</span>

<ld-topic class="exercises" id="ubung-python"><h2>Übung - Python</h2><ld-scrollable><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Asynchrone, verbindungsorientierte Kommunikation"><p class="ld-exercise-title rubric"><span>Asynchrone, verbindungsorientierte Kommunikation</span></p><p>Entwickeln Sie sowohl einen Client (bzw. eine Clientkomponente) als auch einen Server für das zentralisierte Loggen von Nachrichten.</p><p>Im Fehlerfall, z. B. wenn der Server nicht verfügbar ist oder es zu einer Netzwerkpartitionierung kam, sollen die Nachrichten, die der Client an den Server senden will/wollte, zwischengepuffert werden und bei Serververfügbarkeit wieder zugestellt werden. Mit anderen Worten: die Methode des Clients zum senden von Nachrichten sollte nicht blockieren, sondern immer weiter funktionieren - auch im Fehlerfall.</p><p><strong>Anforderungen</strong></p><ul class="simple"><li><p>Stellen Sie sicher, dass Nachrichten immer in der richtigen Reihenfolge am Server ankommen. D. h. stellen Sie zum Beispiel sicher, dass eine gepufferte Nachricht nie nach einer neueren Nachricht ankommt.</p></li><li><p>Der Client nimmt (hier) die Nachrichten über die Konsole entgegen und sendet sie direkt an den Server. Der Server sollte diese dann sofort ausgeben!</p></li><li><p>Stellen Sie sicher, dass keine Nachrichten verloren gehen, wenn der Server unkontrolliert beendet wird.</p></li><li><p>Bevor Sie versuchen eine Nachricht wieder zu versenden, warten Sie X Sekunden (z. B. 5 Sekunden).</p></li></ul><p><strong>Hinweise</strong></p><ul class="simple"><li><p>Orientieren Sie sich an dem Code auf den Folien.</p></li><li><p>Nutzen Sie ggf. die Möglichkeit Sockets in <span class="docutils literal">File</span>-Objekte zu verwandeln, um die Nachrichten zu senden. Vergessen Sie ggf. nicht <span class="docutils literal">flush()</span> aufzurufen, damit die Nachricht auch wirklich versendet wird.</p></li><li><p>Prüfen Sie explizit, dass - wenn Sie
