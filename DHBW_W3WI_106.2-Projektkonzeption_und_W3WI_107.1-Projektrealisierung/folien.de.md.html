<ld-topic id="project-w3wi_106.2-107.1-projektkonzeption_und_projektrealisierung"><h1 class="title">Projektkonzeption und -realisierung</h1><p><em>W3WI_106.2 und W3WI_107</em></p><dl class="field-list simple"><dt>Dozent<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></p></dd><dt>Kontakt<span class="colon">:</span></dt><dd><p><a class="reference external" href="mailto:michael.eichberg@dhbw-mannheim.de">michael.eichberg@dhbw-mannheim.de</a>, Raum 149B</p></dd><dt>Version<span class="colon">:</span></dt><dd><p>24SEA - 27. August 2026</p></dd></dl></ld-topic>
<ld-topic class="transition-fade" id="einfuhrung"><h2>Einführung</h2><ol class="arabic incremental-list simple"><li><p>Allgemeines</p><ol class="arabic incremental-list simple"><li><p>Teaser des Projekts</p></li><li><p>Vorstellung des Ablaufs der Projektkonzeption</p></li><li><p>Zusammenfinden in Teams</p></li><li><p>Kurze Wiederholung von relevanten Themen</p></li></ol></li><li><p>Start der Projektkonzeption</p></li></ol></ld-topic>
<ld-topic class="transition-fade" id="das-projekt"><h2>Das Projekt</h2><p>Weiterentwicklung eines AppStores für Apps zum Deployment auf OpenStack.</p><dl class="field-list simple"><dt>Webseite<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://dhbw-appstore.petko-rutesic-at-dhbw-de.users.dhbw.site/login?returnUrl=/">https://dhbw-appstore.petko-rutesic-at-dhbw-de.users.dhbw.site/login?returnUrl=/</a></p></dd><dt>Sourcecode<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://github.com/DHBW-AppStore">https://github.com/DHBW-AppStore</a></p></dd><dt>Credentials<span class="colon">:</span></dt><dd><p>Siehe Moodle.</p></dd></dl><aside class="admonition admonition-ziel"><p class="admonition-title">Ziel</p><p>Dozenten können - ohne tiefergehende Kenntnisse von OpenStack etc. - vorkonfigurierte, anpassbare Virtuelle Maschinen auf der OpenStack Platform deployen, die dann durch Studierende im Rahmen von Lehrveranstaltungen genutzt werden können.</p><p>Den Dozenten soll eine einfache Administrierbarkeit der Anwendungen ermöglicht werden.</p><p>Den Administratoren ist es stets möglich Dozenten zu unterstützen.</p></aside><!--HINWEIS: Gruppenbenotung -> Einzelbenotung nur auf explizitem Wunsch hin--></ld-topic>
<ld-topic id="beispielanwendungen"><h2>Beispielanwendungen</h2><ld-story><ul class="incremental-list list-with-explanations simple"><li><p>Eine einfache VM mit NodeJS für Studierende bzw. Gruppen von Studierenden
(ggf. inkl. Quotas und Porteinschränkungen)</p></li><li><p>VMs für Pentesting Zwecke:</p><ul class="simple"><li><p>VMs die als Angriffsziele dienen</p></li><li><p>VMs mit Angriffswerkzeugen</p></li><li><p>ggf. in einem zugangsgeschützten virtuellen Netzwerk</p></li></ul></li><li><p>Ein Gitlabserver für das Verwalten von Projekten eines bestimmten Kurses</p></li><li><p>Ein Jenkins Server für das Durchführen von Continuous Integration</p></li><li><p>Ein Jupyter Notebook Server für die Durchführung von Übungen</p></li><li><p>Eine vollständige Netzwerkinfrastruktur</p></li><li><p>Eine OpenStack Umgebung für Lehrveranstaltungen im Bereich Cloud Computing</p></li><li><p>Ein Kubernetes Cluster für das Deployment von Microservices</p></li><li><p>Ein Kubernetes Cluster für KI Anwendungen</p></li><li><p>Eine vorkonfigurierte Entwicklungsumgebung für die Programmierung
(z.B. in Java mit Eclipse Theia)</p></li><li><p>Projektmanagementsoftware (z. B. OpenProject)</p></li><li><p>Ein Datenbankserver mit passenden Accounts (z. B. MySQL, PostgreSQL)</p></li><li><p>...</p></li></ul></ld-story></ld-topic>
<ld-topic class="transition-move-to-top" id="anforderungen-bzw-herausforderungen"><h2>Anforderungen bzw. Herausforderungen</h2><ld-story><h3>Funktionale Anforderungen an den AppStore</h3><ul class="incremental-list simple"><li><p>Es soll sowohl sowohl vorgefertigte Anwendungen (bzw. Anwendungstemplates)  geben, die einfach deployt werden können, als auch möglich sein dem App Store eigene (private) Anwendungen hinzuzufügen.</p></li><li><p>Beim Deployment von Anwendungen werden die notwendigen Konfigurationsschritte (möglichst)automatisiert durchgeführt:</p><ul class="simple"><li><p>Anlegen der entsprechenden Anzahl an VMs</p></li><li><p>Anlegen von Nutzeraccounts bzw. Gruppenaccounts (ggf. basierend auf CSV Dateien, manuell oder von einem LDAP Server); alternativ Konfiguration von SSH Keys</p></li><li><p>Einrichten von Netzwerkkonfigurationen (ggf. inkl. Erzeugung von Zertifikaten)</p></li><li><p>Konfiguration von DNS.</p></li><li><p>...</p></li></ul></li><li><p>Es ist dem Dozenten ggf. möglich (einzelne) Anwendungen neu zu starten bzw. neu zu konfigurieren (z. B. wenn Anwendungen nicht mehr reagieren weil zum Beispiel im Rahmen des Pentesting die ZielVMs abgestürzt sind).</p></li><li><p>Anwendungen können in unterschiedlichen Versionen vorliegen.</p></li><li><p>Anwendungen können einfach aktualisiert werden (z. B. können die Anwendungen in einem GIT liegen und ein Dozent bzw. Administrator kann darüber Aktualisierungen durchführen).</p></li><li><p>Jedem Dozenten stehen nur begrenzte Ressourcen zur Verfügung (z. B. nur 10 VMs). Es kann ggf. sinnvoll sein, mehrere Instanzen einer Anwendung in einer VM zu deployen.</p></li></ul><h3 class="incremental">Nicht-funktionale Anforderungen</h3><ul class="incremental-list list-with-explanations"><li><p>Der App-Store ist eine eigenständige Webanwendung, der die öffentlichen Schnittstellen von OpenStack verwendet.</p><p>(D.h. er ist kein Plug-in.)</p></li><li><p>Der Technologiestack sollte überschaubar sein, damit das Projekt ggf. später weiterentwickelt/übernommen werden kann.</p><p>(Dies ist Lizenz und Ergebnisabhängig.)</p><ld-supplemental><p>Das entwickelt Projekt steht unter der <em>Apache License 2.0</em>, wenn Sie nicht unter dieser Lizenz weiterentwickeln möchten, dann melden Sie sich sehr zeitnahe bei mir, damit wir eine Lösung für Sie finden können.</p><p><strong>Die Benotung des Projekts ist unabhängig von der Lizenzfrage.</strong></p></ld-supplemental></li><li><p>Wartbarkeit und Qualität sind primäre Ziele.</p></li></ul><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Die Features bzw. Anforderungen, die für die Weiterentwicklung gelten, legen wir gemeinsam in den folgenden Wochen im Rahmen von <em>Requirements Workshops</em> fest.</p><p>Die oben genannten Anforderungen stellen nur den initialen, groben Rahmen dar.</p></aside></ld-story></ld-topic>
<ld-topic class="transition-scale" id="benotungsgrundlage-projektkonzeption-50p"><h2>Benotungsgrundlage - Projektkonzeption (50P)</h2><p>Abgaben:</p><ul class="simple"><li><p>[<strong>6P</strong>] Produkteinarbeitung</p></li><li><p>[<strong>42P</strong>] Produktvorführung, Dokumentationen, Präsentationen <a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></p></li><li><p>[<strong>2P</strong> je Person] Selbstbezogener Reflexionsbericht</p></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://delors.github.io/allg-vortraege/folien.de.md.html?ld-slide-no=1">Vorträge: Hinweise und Bewertungskriterien</a></p></aside></aside></ld-topic>
<ld-topic id="teamaufteilung-fur-die-konzeption-und-die-realisierung"><h2>Teamaufteilung (für die Konzeption und die Realisierung)</h2><ul class="simple"><li><p>3 Gruppen</p></li><li><p>wesentliche Teilprojekte:</p><ul class="simple"><li><p>Weiterentwicklung des Backends</p></li><li><p>Weiterentwicklung des Frontends (Standalone bzw. Integration in Moodle)</p></li><li><p>App Templates</p></li></ul></li></ul><p><span class="emph">Die Aufteilung muss dokumentiert und gelebt werden.</span></p><p>Darüber hinaus sind im Verlauf des Projekts mind. folgende Aufgaben zu verteilen:</p><ul class="simple"><li><p>Projektmanagement</p></li><li><p>Infrastrukturmanagement</p></li><li><p>Qualitätsmanagement: Buildautomation, Testmanagement, Testautomatisierung, Codequalität, UX</p></li><li><p>Dokumentation: Entwicklerdokumentation, Administratordokumentation, Nutzerdokumentation</p></li></ul></ld-topic>

<ld-topic id="projektkonzeption-04-09-2026-online"><h2>2. Projektkonzeption - 04.09.2026 [Online]</h2><dl class="field-list simple"><dt>BBB<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://bbb.dhbw.de/mannheim/eic-uue-f52-6xb">https://bbb.dhbw.de/mannheim/eic-uue-f52-6xb</a></p></dd></dl><p>Gruppenindividuelle Unterstützung und Beantwortung von Rückfragen.</p><p>Je Gruppe:</p><ul class="simple"><li><p>Vertraut machen mit der bestehenden Anwendung</p></li><li><p>Prototyping / Entwicklung eines Spike</p></li><li><p>Ausarbeitung der initialen Präsentation und der Abgabe</p></li></ul><ld-supplemental><p>Ein gutes Video zum Thema Architekturdiagramme ist hier zu finden:</p><p><a class="reference external" href="https://www.youtube.com/watch?v=3Gc5pN9sGzw">Visualising software architecture with the C4 model</a></p></ld-supplemental></ld-topic>
<ld-topic id="projektkonzeption-11-09-2026"><h2>3. Projektkonzeption - 11.09.2026</h2><ld-scrollable><h3>Teil 1 - Präsentation und Vorführung</h3><p>(<em>Je Gruppe max. 45 Minuten</em>)</p><p><strong>Vorführung</strong></p><ul class="simple"><li><p>[<strong>1P</strong>] Moodle</p></li><li><p>[<strong>5P</strong>] App Store inkl. Deployment</p></li><li><p>[<strong>2P</strong>] Identifizierte Dokumentationslücken</p></li></ul><p><strong>Präsentation</strong></p><dl class="dd-margin-left-3em field-list"><dt>Bewertete Bestandteile<span class="colon">:</span></dt><dd><ul><li><p>[<strong>4P</strong>] Projektorganisation: Teamname, Teamaufteilung, Zuständigkeiten, Kommunikationswege/-technologien, Meetingstruktur, Stakeholdermanagement, Hardware-Ressourcen, ...</p></li><li><p>[<strong>4P</strong>] Risikomanagement: d. h. identifizierte Risiken und Maßnahmen zur Risikominimierung/-vermeidung</p></li><li><p>[<strong>4P</strong>] Welche Qualitätsziele wurden als primäre Ziele identifiziert und warum? Welche Qualitätsmaßnahmen werden geplant und wie durchgeführt.</p><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Nehmen Sie umbeding die Stakeholder-Perspektive ein!</p></aside></li><li><p>[<strong>2P</strong>] Initiale Architektur im Hinblick auf die Integration in Moodle (LTI) und die allgemeine Authentifizierung.</p></li><li><p>[<strong>2P</strong>] Diskussion des Deployments und der Konfiguration von Windows VM.</p></li><li><p>[<strong>1P</strong>] Qualifizierte Bewertung der vorgefundenen Codebasis.</p></li></ul></dd></dl><p><strong>Abgaben</strong> (zum 11.09.2026, 7:00Uhr über Moodle)</p><ul class="list-with-explanations"><li><p>Es ist ein Dokument (PDF) abzugeben, dass <em>die obigen bewerteten Punkte abdeckt</em>.</p><p>Aus dem Dokument muss der Teamname und der Hauptansprechpartner für die Projektleitung/Administratoren klar ersichtlich sein. Diese Person muss garantieren, dass sie - sobald Sie die offizielle OpenStack Umgebung nutzen im zweiten Teil des Projekts - auch für Rückfragen zur Verfügung steht. Die Reaktionszeit auf Mails sollte max. 24 Stunden an Werktagen betragen.</p></li><li><p>Die Präsentation (PDF)</p></li></ul><p>Die Anzahl der erreichten Punkte ergibt sich aus der Präsentation und dem Dokument zusammen.</p><h3>Teil 2 - gemeinsame Verfeinerung der User Stories</h3></ld-scrollable></ld-topic>
<ld-topic id="projektkonzeption-18-11-2026-online"><h2>4. Projektkonzeption - 18.11.2026 [Online]</h2><p>Gruppenindividuelle Unterstützung und Beantwortung von Rückfragen.</p><dl class="field-list simple"><dt>BBB<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://bbb.dhbw.de/rooms/eic-dx8-r7g-ioa/">https://bbb.dhbw.de/rooms/eic-dx8-r7g-ioa/</a> (Optional)</p></dd></dl><p>Je Gruppe:</p><ul class="simple"><li><p>Verfeinerung der initialen Architektur</p></li><li><p>Fortsetzen des Prototypings</p></li><li><p>Ausarbeitung der Abschlusspräsentation und der Endabgabe</p></li></ul></ld-topic>
<ld-topic id="projektkonzeption-21-09-2026"><h2>5. Projektkonzeption - 21.09.2026</h2><ld-scrollable><h3>Teil 1 - Abschluss der Konzeptionsphase</h3><p>(Je Gruppe max. 45 Minuten zzgl. Diskussion/Rückfragen.)</p><p><strong>Vorführung</strong></p><ul class="simple"><li><p>[<strong>...P</strong>] Aktueller Prototyp des App Stores</p></li></ul><p><strong>Präsentation</strong></p><p><em>(Sie können die Reihenfolge der folgenden Punkte bei der Präsentation anpassen.)</em></p><ul class="simple"><li><p>[<strong>...P</strong>] TODO</p></li><li><p>[<strong>...P</strong>] <em>Harness</em> für die KI (<span class="eng">Harness Engineering</span>)</p></li></ul><p><strong>Abgaben</strong> (<span class="danger">zum 21.09.2026, 7:00Uhr über Moodle</span>)</p><ul class="simple"><li><p>Präsentation (PDF)</p></li><li><p>Vollständige Dokumentation (PDF)</p></li><li><p>Dokumentierte Zeitaufwände (PDF)</p></li><li><p>[<strong>2P</strong> je Person]: Reflexionsbericht mit max. 2 Seiten (PDF): Was lieft gut, was lief schlecht, was sollte im weiteren Verlauf beachtet werden, was habe ich persönlich gelernt, wie werde ich zukünftig versuchen den Projekterfolg sicherzustellen. Geben Sie auf dem Reflexionsbericht bitte auch den Namen der Gruppe und Ihre wesentliche Rolle(n) im Projekt an. Bei Verdacht auf KI Einsatz, wird die Abgabe mit 0 Punkten bewertet. Eine Korrektur des verfassten Textes mit KI ist zulässig.</p></li></ul><h3>Teil 2 - Übergang zum Projekt</h3><p><strong>Je Gruppe</strong>: Planung und Präsentation der nächsten Schritte</p></ld-scrollable></ld-topic>
<ld-topic id="todos"><h2>Todos</h2><ul class="simple"><li><p>Jedes Team meldet sich bei mir mit einer Liste mit:
Klarnamen (Vor- und Nachname) inkl. S-Emailadressen</p></li><li><p>Team mit Herrn Prof. Martin koordinieren, damit er einen Einblick in die Infrastruktur gibt, um das Deployment weiter zu vereinfachen</p></li><li><p>Projekt aufsetzen</p></li><li><p>(Fake-)Moodle aufsetzen, um eine Moodleintegration prototypen zu können.</p></li><li><p>Anbindung des Keycloaks von Herrn Rutesic</p></li></ul></ld-topic>
<ld-topic id="features"><h2>Features</h2><ul class="simple"><li><p>IPv6 durchgehend unterstützen (App Store und Templates); hier ist unklar was zu tun ist!</p></li><li><p>App Deployments mit mehreren Instanzen erlauben (Zum Beispiel eine App haben, die eine DB-VM und eine Web-App-VM bereitstellt)</p></li><li><p>Anbindung an den Role-Provider-Service (Moodle, Keycloak ( - zum Teil schon passiert))</p></li><li><p>Anbindung an einen E-Mail Service</p></li><li><p>App Deployments erlauben, die mehrere Instanzen unterstützen, die alle in einem virtuellen Netz sind und durch einen Zugangsrechner geschützt sind (d.h. Zugriff auf das Netz ist nur möglich, nachdem sich auf dem Frontend-Server "korrekt" angemeldet hat)</p></li><li><p>mehr Apps (insbesondere auch Windows(!))</p></li><li><p>besseres Monitoring - how many apps are deployed, which apps were deployed, how many VMs are actually running</p></li><li><p>verbessertes Deployment des App Stores - Fixen von Beschreibung</p></li></ul></ld-topic>
