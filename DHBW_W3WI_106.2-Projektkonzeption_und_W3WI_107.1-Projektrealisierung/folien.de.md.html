<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>
</head>
<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="project-w3wi_106.2-107.1-projektkonzeption_und_projektrealisierung"><h1 class="title">Projektkonzeption und -realisierung</h1><p><em>W3WI_106.2 und W3WI_107</em></p><dl class="field-list simple"><dt>Dozent<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></p></dd><dt>Kontakt<span class="colon">:</span></dt><dd><p><a class="reference external" href="mailto:michael.eichberg@dhbw-mannheim.de">michael.eichberg@dhbw-mannheim.de</a>, Raum 149B</p></dd><dt>Version<span class="colon">:</span></dt><dd><p>24SEA - 11.09.2026</p></dd></dl></ld-topic>
<ld-topic class="transition-fade" id="einfuhrung"><h2>Einführung</h2><ol class="arabic incremental-list simple"><li><p>Allgemeines</p><ol class="arabic incremental-list simple"><li><p>Teaser des Projekts</p></li><li><p>Vorstellung des Ablaufs der Projektkonzeption</p></li><li><p>Zusammenfinden in Teams</p></li><li><p>Kurze Wiederholung von relevanten Themen</p></li></ol></li><li><p>Start der Projektkonzeption</p></li></ol></ld-topic>
<ld-topic class="transition-fade" id="das-projekt"><h2>Das Projekt</h2><p>Weiterentwicklung eines AppStores für Apps zum Deployment auf OpenStack.</p><dl class="field-list simple"><dt>Webseite<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://dhbw-appstore.petko-rutesic-at-dhbw-de.users.dhbw.site/login?returnUrl=/">https://dhbw-appstore.petko-rutesic-at-dhbw-de.users.dhbw.site/login?returnUrl=/</a></p></dd><dt>Sourcecode<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://github.com/DHBW-AppStore">https://github.com/DHBW-AppStore</a></p></dd><dt>Credentials<span class="colon">:</span></dt><dd><p>Siehe Moodle.</p></dd></dl><aside class="admonition admonition-ziel"><p class="admonition-title">Ziel</p><p>Dozenten können - ohne tiefergehende Kenntnisse von OpenStack etc. - vorkonfigurierte, anpassbare Virtuelle Maschinen auf der OpenStack Platform deployen, die dann durch Studierende im Rahmen von Lehrveranstaltungen genutzt werden können.</p><p>Den Dozenten soll eine einfache Administrierbarkeit der Anwendungen ermöglicht werden.</p><p>Den Administratoren ist es stets möglich Dozenten zu unterstützen.</p></aside><!--HINWEIS: Gruppenbenotung -> Einzelbenotung nur auf explizitem Wunsch hin--></ld-topic>
<ld-topic id="beispielanwendungen"><h2>Beispielanwendungen</h2><ld-story><ul class="incremental-list list-with-explanations"><li><p>Eine einfache VM mit NodeJS für Studierende bzw. Gruppen von Studierenden
(ggf. inkl. Quotas und Porteinschränkungen)</p></li><li><p>VMs für Pentesting Zwecke:</p><ul class="simple"><li><p>VMs die als Angriffsziele dienen</p></li><li><p>VMs mit Angriffswerkzeugen</p></li><li><p>ggf. in einem zugangsgeschützten virtuellen Netzwerk</p></li></ul></li><li><p>Ein Gitlabserver für das Verwalten von Projekten eines bestimmten Kurses</p></li><li><p>Ein Jenkins Server für das Durchführen von Continuous Integration</p></li><li><p>Ein Jupyter Notebook Server für die Durchführung von Übungen</p></li><li><p>Eine vollständige Netzwerkinfrastruktur</p></li><li><p>Eine OpenStack Umgebung für Lehrveranstaltungen im Bereich Cloud Computing</p></li><li><p>Ein Kubernetes Cluster für das Deployment von Microservices</p></li><li><p>Ein Kubernetes Cluster für KI Anwendungen</p></li><li><p>Eine vorkonfigurierte Entwicklungsumgebung für die Programmierung</p><p>(z.B. in Java mit Eclipse Theia)</p></li><li><p>Projektmanagementsoftware (z. B. OpenProject)</p></li><li><p>Ein Datenbankserver mit passenden Accounts (z. B. MySQL, PostgreSQL)</p></li><li><p>...</p></li></ul></ld-story></ld-topic>
<ld-topic class="transition-move-to-top" id="anforderungen-bzw-herausforderungen"><h2>Anforderungen bzw. Herausforderungen</h2><ld-story><h3>Funktionale Anforderungen an den AppStore</h3><ul class="incremental-list simple"><li><p>Es soll sowohl sowohl vorgefertigte Anwendungen (bzw. Anwendungstemplates)  geben, die einfach deployt werden können, als auch möglich sein dem App Store eigene (private) Anwendungen hinzuzufügen.</p></li><li><p>Beim Deployment von Anwendungen werden die notwendigen Konfigurationsschritte (möglichst)automatisiert durchgeführt:</p><ul class="simple"><li><p>Anlegen der entsprechenden Anzahl an VMs</p></li><li><p>Anlegen von Nutzeraccounts bzw. Gruppenaccounts (ggf. basierend auf CSV Dateien, manuell oder von einem LDAP Server); alternativ Konfiguration von SSH Keys</p></li><li><p>Einrichten von Netzwerkkonfigurationen (ggf. inkl. Erzeugung von Zertifikaten)</p></li><li><p>Konfiguration von DNS.</p></li><li><p>...</p></li></ul></li><li><p>Es ist dem Dozenten ggf. möglich (einzelne) Anwendungen neu zu starten bzw. neu zu konfigurieren (z. B. wenn Anwendungen nicht mehr reagieren weil zum Beispiel im Rahmen des Pentesting die ZielVMs abgestürzt sind).</p></li><li><p>Anwendungen können in unterschiedlichen Versionen vorliegen.</p></li><li><p>Anwendungen können einfach aktualisiert werden (z. B. können die Anwendungen in einem GIT liegen und ein Dozent bzw. Administrator kann darüber Aktualisierungen durchführen).</p></li><li><p>Jedem Dozenten stehen nur begrenzte Ressourcen zur Verfügung (z. B. nur 10 VMs). Es kann ggf. sinnvoll sein, mehrere Instanzen einer Anwendung in einer VM zu deployen.</p></li></ul><h3 class="incremental">Nicht-funktionale Anforderungen</h3><ul class="incremental-list list-with-explanations"><li><p>Der App-Store ist eine eigenständige Webanwendung, der die öffentlichen Schnittstellen von OpenStack verwendet.</p><p>(D.h. er ist kein Plug-in.)</p></li><li><p>Der Technologiestack sollte überschaubar sein, damit das Projekt ggf. später weiterentwickelt/übernommen werden kann.</p><p>(Dies ist Lizenz und Ergebnisabhängig.)</p><ld-supplemental><p>Das entwickelt Projekt steht unter der <em>Apache License 2.0</em>, wenn Sie nicht unter dieser Lizenz weiterentwickeln möchten, dann melden Sie sich sehr zeitnahe bei mir, damit wir eine Lösung für Sie finden können.</p><p><strong>Die Benotung des Projekts ist unabhängig von der Lizenzfrage.</strong></p></ld-supplemental></li><li><p>Wartbarkeit und Qualität sind primäre Ziele.</p></li></ul><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Die Features bzw. Anforderungen, die für die Weiterentwicklung gelten, legen wir gemeinsam in den folgenden Wochen im Rahmen von <em>Requirements Workshops</em> fest.</p><p>Die oben genannten Anforderungen stellen nur den initialen, groben Rahmen dar.</p></aside></ld-story></ld-topic>
<ld-topic class="transition-scale" id="benotungsgrundlage-projektkonzeption-50p"><h2>Benotungsgrundlage - Projektkonzeption (50P)</h2><p>Abgaben:</p><ul class="simple"><li><p>[<strong>6P</strong>] Produkteinarbeitung</p></li><li><p>[<strong>42P</strong>] Produktvorführung, Dokumentationen, Präsentationen <a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></p></li><li><p>[<strong>2P</strong> je Person] Selbstbezogener Reflexionsbericht</p></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://delors.github.io/allg-vortraege/folien.de.md.html?ld-slide-no=1">Vorträge: Hinweise und Bewertungskriterien</a></p></aside></aside></ld-topic>
<ld-topic id="teamaufteilung-fur-die-konzeption-und-die-realisierung"><h2>Teamaufteilung (für die Konzeption und die Realisierung)</h2><ul class="simple"><li><p>3 Gruppen</p></li><li><p>wesentliche Teilprojekte:</p><ul class="simple"><li><p>Weiterentwicklung des Backends</p></li><li><p>Weiterentwicklung des Frontends (Standalone bzw. Integration in Moodle)</p></li><li><p>App Templates</p></li></ul></li></ul><p><span class="emph">Die Aufteilung muss dokumentiert und gelebt werden.</span></p><p>Darüber hinaus sind im Verlauf des Projekts mind. folgende Aufgaben zu verteilen:</p><ul class="simple"><li><p>Projektmanagement</p></li><li><p>Infrastrukturmanagement</p></li><li><p>Qualitätsmanagement: Buildautomation, Testmanagement, Testautomatisierung, Codequalität, UX</p></li><li><p>Dokumentation: Entwicklerdokumentation, Administratordokumentation, Nutzerdokumentation</p></li></ul></ld-topic>

<ld-topic id="projektkonzeption-erganzung-08-09-2026-online"><h2>2. Projektkonzeption - Ergänzung - 08.09.2026 [Online]</h2><dl class="field-list simple"><dt>Inhalt<span class="colon">:</span></dt><dd><p>Treffen mit Prof. Pfisterer - Entwickler und Maintainer des Self-service Stores, Mitglied im BWCloud Projekt</p></dd><dt>Anwesenheit<span class="colon">:</span></dt><dd><p>Pro Team zwei bis drei Personen.</p></dd><dt>Scheduled<span class="colon">:</span></dt><dd><ol class="arabic simple" start="8"><li><p>Sep 2026 von 17:00 bis (max.) 18:00</p></li></ol></dd><dt>BBB<span class="colon">:</span></dt><dd><p>https://bbb.dhbw.de/mannheim/eic-uue-f52-6xb</p></dd></dl></ld-topic>
<ld-topic id="projektkonzeption-11-09-2026"><h2>3. Projektkonzeption - 11.09.2026</h2><ld-scrollable><h3>Teil 1 - Präsentation und Vorführung</h3><p>(<em>Je Gruppe max. 45 Minuten</em>)</p><p><strong>Vorführung</strong></p><ul class="simple"><li><p>[<strong>1P</strong>] Moodle</p></li><li><p>[<strong>5P</strong>] App Store inkl. Deployment</p></li><li><p>[<strong>2P</strong>] Identifizierte Dokumentationslücken</p></li></ul><p><strong>Präsentation</strong></p><dl class="dd-margin-left-3em field-list"><dt>Bewertete Bestandteile<span class="colon">:</span></dt><dd><ul><li><p>[<strong>4P</strong>] Projektorganisation: Teamname, Teamaufteilung, Zuständigkeiten, Kommunikationswege/-technologien, Meetingstruktur, Stakeholdermanagement, Hardware-Ressourcen, ...</p></li><li><p>[<strong>4P</strong>] Risikomanagement: d. h. identifizierte Risiken und Maßnahmen zur Risikominimierung/-vermeidung</p></li><li><p>[<strong>4P</strong>] Welche Qualitätsziele wurden als primäre Ziele identifiziert und warum? Welche Qualitätsmaßnahmen werden geplant und wie durchgeführt.</p><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Nehmen Sie umbeding die Stakeholder-Perspektive ein!</p></aside></li><li><p>[<strong>2P</strong>] Initiale Architektur im Hinblick auf die Integration in Moodle (LTI) und die allgemeine Authentifizierung.</p></li><li><p>[<strong>2P</strong>] Diskussion des Deployments und der Konfiguration von Windows VM.</p></li><li><p>[<strong>1P</strong>] Qualifizierte Bewertung der vorgefundenen Codebasis.</p></li></ul></dd></dl><p><strong>Abgaben</strong> (zum 11.09.2026, 7:00Uhr über Moodle)</p><ul class="list-with-explanations"><li><p>Es ist ein Dokument (PDF) abzugeben, dass <em>die obigen bewerteten Punkte abdeckt</em>.</p><p>Aus dem Dokument muss der Teamname und der Hauptansprechpartner für die Projektleitung/Administratoren klar ersichtlich sein. Diese Person muss garantieren, dass sie - sobald Sie die offizielle OpenStack Umgebung nutzen im zweiten Teil des Projekts - auch für Rückfragen zur Verfügung steht. Die Reaktionszeit auf Mails sollte max. 24 Stunden an Werktagen betragen.</p></li><li><p>Die Präsentation (PDF)</p></li></ul><p>Die Anzahl der erreichten Punkte ergibt sich aus der Präsentation und dem Dokument zusammen.</p><h3>Teil 2 - gemeinsame Verfeinerung der User Stories</h3></ld-scrollable></ld-topic>
<ld-topic id="projektkonzeption-18-11-2026-online"><h2>4. Projektkonzeption - 18.11.2026 [Online]</h2><p>Gruppenindividuelle Unterstützung und Beantwortung von Rückfragen.</p><dl class="field-list simple"><dt>BBB<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://bbb.dhbw.de/rooms/eic-dx8-r7g-ioa/">https://bbb.dhbw.de/rooms/eic-dx8-r7g-ioa/</a> (Optional)</p></dd></dl><p>Je Gruppe:</p><ul class="simple"><li><p>Verfeinerung der initialen Architektur</p></li><li><p>Fortsetzen des Prototypings</p></li><li><p>Ausarbeitung der Abschlusspräsentation und der Endabgabe</p></li></ul></ld-topic>
<ld-topic id="projektkonzeption-21-09-2026"><h2>5. Projektkonzeption - 21.09.2026</h2><ld-scrollable><h3>Teil 1 - Abschluss der Konzeptionsphase</h3><p>(Je Gruppe max. 45 Minuten zzgl. Diskussion/Rückfragen.)</p><p><strong>Vorführung bzw. Darstellung (soweit möglich)</strong></p><ul><li><p>[<strong>5P</strong>] Aktueller Entwicklungstand des App Stores bzgl.</p><ul class="simple"><li><p>Integration mit Moodle (insbesondere im Hinblick auf die verschiedenen Sichten: Dozenten, Studierende)</p></li><li><p>Deployment einer Windows-App</p></li><li><p>Integration mit verschiedenen Identityprovidern</p></li><li><p>Refactoring der bestehenden Codebasis</p></li></ul></li><li><p>[<strong>2P</strong>] Deploymentprozess für den App-Store</p><p><span class="peripheral">(D.h. nicht für Apps, sondern für den Store als Ganzes nach einer Codeänderung; es muss insbesondere dargestellt werden welche Schritte automatisiert und welche manuell erfolgen (müssen/sollen).)</span></p></li></ul><p><strong>Präsentation</strong></p><ul><li><p>Überarbeitet QS</p></li><li><p>[<strong>1P</strong>] Aktualisierte Architektur im Hinblick auf die Integration des Self-service Portals und bzgl. der Moodle/LTI-Integration</p></li><li><p>[<strong>5P</strong>] User Stories</p><ul><li><p>Anforderungen an Weiterentwicklungen des App-Stores aus Diskussionen aufnehmen und verschriftlichen!</p><p>(z. B. Kontakt zu Herrn Rutesic, Herrn Prof. Pfisterer und Herrn Prof. Martin aufnehmen.)</p></li><li><p>Anforderungen an verschiedene Apps.</p><p>(für verschiedene Arten von benötigten Anwendungen; ggf. Dozenten befragen; z. B. Kontakt zu Herrn Prof. Pfisterer, Herrn Prof. Pagnia und Herrn Prof. Martin aufnehmen - Sie dürfen gerne auch weitere Professoren/Dozenten befragen!)</p></li></ul></li><li><p>[<strong>10P</strong>] <em>Harness</em> für die agenzentrierte Entwicklung (<span class="eng">Harness Engineering</span>); darzustellen ist der aktuelle Stand und das Ziel, dass sie verfolgen. Achten Sie insbesondere darauf, dass dieser im Rahmen dieses Projektes umsetzbar ist!</p><p>(Konzeptionelles Ziel ist es, dass nach der Spezifikation einer Anforderung der Agent eingeständig losläuft und diese qualitätsgesichert umsetzt und in den Einsatz bringt ohne, dass die Codebasis degradiert. Der Agent sollte diesbezüglich Zugriff auf Tools zum Entwickeln, Debuggen, Qualitätssichern und Deployment bekommen.)</p><p>Aspekte sind diesbezüglich:</p><ul class="simple"><li><p>Wo wird was dokumentiert?</p></li><li><p>Welche Tools stehen (welchem?) Agenten wie zur Verfügung?</p></li><li><p>Welche Anfoderungen werden an den Agenten gestellt?</p></li></ul></li></ul><p><strong>Abgaben</strong> (<span class="danger">zum 21.09.2026, 7:00Uhr über Moodle</span>)</p><ul class="simple"><li><p>Präsentation (PDF)</p></li><li><p>Vollständige Dokumentation (PDF)</p></li><li><p>Dokumentierte Zeitaufwände (PDF)</p></li><li><p>[<strong>2P</strong> je Person]: Reflexionsbericht mit max. 2 Seiten (PDF): Was lieft gut, was lief schlecht, was sollte im weiteren Verlauf beachtet werden, was habe ich persönlich gelernt, wie werde ich zukünftig versuchen den Projekterfolg sicherzustellen. Geben Sie auf dem Reflexionsbericht bitte auch den Namen der Gruppe und Ihre wesentliche Rolle(n) im Projekt an. Bei Verdacht auf KI Einsatz, wird die Abgabe mit 0 Punkten bewertet. Eine Korrektur des verfassten Textes mit KI ist zulässig.</p></li></ul><h3>Teil 2 - Übergang zum Projekt</h3><p><strong>Je Gruppe</strong>: Planung und Präsentation der nächsten Schritte</p></ld-scrollable></ld-topic>
<ld-topic class="new-section transition-dice-left" id="projektrealisierung"><h2>Projektrealisierung</h2></ld-topic>
<ld-topic id="benotungsgrundlage"><h2>Benotungsgrundlage</h2><ld-story><p>Abgaben:</p><ul class="simple"><li><p>[<strong>17P</strong>] Zwischenpräsentation und aktualisierte Dokumentation (am Ende des ersten Semesters)</p></li><li><p>[<strong>82P</strong>] das Produkt (am Ende des nächsten Semesters/des Projekts ist das Produkt als solches vorzuführen und abzugeben)</p></li><li><p>[<strong>10P</strong>] die qualitätsgesicherte Entwickler- und Administratordokumentation</p></li><li><p>[<strong>2P</strong>] die qualitätsgesicherte Nutzerdokumentation (gerne auch in Form eines (Video-)Tutorials)</p></li><li><p>[<strong>5P</strong>] Entwicklervideo (Erklärung der Struktur des Projekts und des Code, um den Nachfolgern den Einstieg zu erleichtern)</p></li><li><p>[<strong>4P</strong> je Person] Selbstbezogener Reflexionsbericht (Achtung: wenn die klare Perspektive zum Projekt und zu persönlichen Erfahrungen und <em>Lessons-learned</em> nicht vorhanden ist, dann wird der Bericht mit 0 Punkten bewertet.)</p></li></ul><aside class="admonition incremental" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>Jedes Team bzw. Teammitglied muss protokollieren <em>an welchem Teil des Projekts wer wie viel zum Ergebnis beigetragen hat</em>. Dies ist notwendig, um am Ende des Projekts eine individuelle Benotung zu ermöglichen, wenn dies erforderlich ist. Hierfür werden die Protokolle herangezogen. Stellen Sie sicher, dass jeder im Team in etwa gleich viel Arbeit an entsprechend bewerteten Teilen des Projekts investiert hat bzw. investieren konnte.</p><p>Sollten Sie als Team bewertet werden wollen, so ist dies auch möglich, dann brauche ich jedoch von jedem Teammitglied eine entsprechende individuelle Bestätigung, dass die Benotung auf Teamebene gewünscht ist. Die individuelle Protokollierung der Arbeitszeiten ist jedoch weiterhin erforderlich. Bitte vermerken Sie dies explizit im Reflexionsbericht.</p><p><em>Der Reflexionsbericht ist individuell zu verfassen und wird individuell benotet.</em></p></aside></ld-story></ld-topic>

<ld-topic id="projektrealisierung-02-10-2026-online"><h2>1. Projektrealisierung - 02.10.2026 (Online)</h2><ul class="simple"><li><p>Jede Gruppe:</p><ul class="simple"><li><p>Kurze Vorstellung des Standes (erledigte User Stories, nächste User Stories, etc.)</p></li></ul></li><li><p>Ggf. (gruppenindividuelle) Unterstützung bei der Projektrealisierung und Beantwortung von Rückfragen.</p></li></ul></ld-topic>
<ld-topic id="projektrealisierung-05-10-2026"><h2>2. Projektrealisierung - 05.10.2026</h2><ul class="simple"><li><p>Jede Gruppe:</p><ul class="simple"><li><p>kurze Vorführung des Entwicklungsstandes</p></li><li><p>Kurze Vorstellung des Standes (erledigte User Stories, nächste User Stories, Build-Prozess, QS-Stand)</p></li></ul></li><li><p>Ggf. (gruppenindividuelle) Unterstützung bei der Projektrealisierung und Beantwortung von Rückfragen.</p></li></ul></ld-topic>
<ld-topic id="projektrealisierung-16-10-2026-online"><h2>3. Projektrealisierung - 16.10.2026 (online)</h2><ul><li><p>Jede Gruppe:</p><ul class="list-with-explanations"><li><p>Präsentation des aktuellen Projektfortschritts</p><p>(Umgesetzte User Stories; geplanter und tatsächlicher Aufwand; Entwicklung der Story Points)</p></li><li><p>Präsentation der Ressourcenplanung (zur Verfügung stehende Arbeitszeit pro Person) für nächste Iteration</p></li></ul></li><li><p>Besprechen der nächsten Anforderungen/User Stories.</p></li></ul></ld-topic>
<ld-topic id="projektrealisierung-23-10-2026"><h2>4. Projektrealisierung - 23.10.2026</h2><ul class="simple"><li><p>Jede Gruppe:</p><ul class="simple"><li><p>kurze Vorführung des Entwicklungsstandes</p></li><li><p>Kurze Vorstellung des Standes (erledigte User Stories, nächste User Stories, Build-Prozess, QS-Stand)</p></li></ul></li><li><p>Anforderungen an die Zwischenpräsentation klären.</p></li><li><p>Ggf. (gruppenindividuelle) Unterstützung bei der Projektrealisierung und Beantwortung von Rückfragen.</p></li></ul></ld-topic>
<ld-topic id="projektrealisierung-30-10-2026"><h2>5. Projektrealisierung - 30.10.2026</h2><ld-scrollable><p class="rubric">Abschluss der ersten Projektrealisierungsphase</p><ul class="simple"><li><p>Zwischenpräsentation je Gruppe ca. 45 Minuten inkl. Diskussion/Rückfragen.</p></li><li><p>17 Punkte der Endnote ergeben sich aus der Zwischenpräsentation in Verbindung mit den abzugebenden Dokumenten. Bitte denken Sie daran, alle relevanten Links in die Dokumentation aufzunehmen. Bitte denken Sie auch daran, dass Dokument mit Seitenzahlen zu versehen und ein Inhaltsverzeichnis zu erstellen. In diesem Rahmen sollten Sie auch sicherstellen, dass alle Abschnitte nummeriert sind.</p></li></ul><p><strong>Vorführung</strong></p><ul class="simple"><li><p>[<strong>3P</strong>] Aktueller Prototyp des App Stores</p></li><li><p>[<strong>3P</strong>] Prototypen <strong>zweier neuer Apps</strong> (mind. 1 x Windows) inkl. Deployment auf OpenStack; d.h. es sollen zwei unterschiedliche Anwendungen deployed werden können. Welche Anwendungen dies sind, können Sie selbst entscheiden, sie sollten jedoch einen konkreten Bedarf abdecken. (Zum Beispiel eine Windows VM mit einer spezifischen Software oder eine Linux VM bei der die Studierenden Root-Rechte haben, um Linux-Administration zu üben.)</p></li></ul><p><strong>Präsentation</strong></p><ul class="list-with-explanations"><li><p>[<strong>2P</strong>] Aktueller Stand der statischen und dynamischen Architektur des App-Stores</p><p>Dies sollte im Wesentlichen über Abbildungen erfolgen <span class="peripheral">und kann ggf. auch die Darstellung eines Datenbankschemas beinhalten</span>.</p></li><li><p>[<strong>2P</strong>] aktualisierter Technologiestack des App-Stores und der Apps. D. h. Sie können im Wesentlichen die Dokumentation aus der Konzeptionsphase übernehmen und ggf. anpassen.</p></li><li><p>[<strong>2P</strong>] Build-Prozess</p><p>Es sollen alle Schritte dargelegt werden; inkl. Konfiguration und Zielen. Es muss klar ersichtlich sein, welche Schritte manuell und welche automatisiert durchgeführt werden. Für manuelle Schritte ist ggf. zu begründen warum diese nicht automatisiert wurden bzw. werden können.</p><p>Benennen Sie ggf. die genauen Standards, die sie durchsetzen. Ggf. können Sie einen Anhang erstellen aus dem die genauen Konfigurationen hervorgehen.</p></li><li><p>[<strong>2P</strong>] Stand der QS</p><p>Stellen Sie für ein von Ihnen gewähltes QS-Ziel dar, wie sie die geplanten Maßnahmen bisher umgesetzt haben.</p><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Den Prozess für die QS Ziele müssen Sie auch im nächsten Semester noch leben und am Ende des Projekts auch nachweisen.</p><p>Ich empfehle, dass Sie mich bzgl. der Nachweise frühzeitig im nächsten Semester kontaktieren, damit Sie wissen was ich als Nachweis akzeptiere.</p></aside></li><li><p>[<strong>3P</strong>] Backlog</p><p>D. h. erledigte User Stories, noch offene User Stories, neue User Stories.</p></li></ul><p><strong>Abgaben</strong> (<span class="danger">zum 30.10.2026 (siehe Moodle)</span>)</p><ul><li><p>Aktualisierte Projektdokumentation (PDF)</p><p>Dies umfasst ggf. auch die Teile, die im Rahmen der Projektkonzeption abgegeben wurden. Insbesondere sind folgende Punkte zu aktualisieren:</p><ul class="simple"><li><p>Dokumentation für die relevanten QS-Ziele und QS Maßnahmen (d.h. wer macht was wann und warum und wie stellt dies die Erreichung des Qualitätsziel sicher?)</p></li><li><p>Architektur</p></li><li><p>Technologiestack</p></li><li><p>(aktualisierte ) Installations- und Konfigurationsanleitung</p></li><li><p>aktualisiertes Backlog mit erledigten und offenen User Stories. inkl. Akzeptanzkriterien.</p></li></ul></li><li><p>Präsentation (PDF)</p></li><li><p>dokumentierte Aufwände (PDF)</p></li></ul></ld-scrollable></ld-topic>
