<ld-topic class="new-section" id="einfuhrung-in-e-a-i-o-in-java"><h2>Einführung in E/A (<span class="eng">I/O</span>) in Java</h2></ld-topic>
<ld-topic id="architektur-von-java-i-o"><h2>Architektur von Java I/O</h2><ul class="incremental-list"><li><p>Verschiedene Quellen/Senken für die Daten</p><ul class="simple"><li><p>Tastatureingabe („Standard I/O“)</p></li><li><p>Datei(en) auf dem lokalen Rechner („File I/O“)</p></li><li><p>Datei(en)/Prozess(e) im Netzwerk („Network I/O“)</p></li><li><p>Hauptspeicher („Memory I/O“)</p></li></ul></li><li><p>Um einheitlich Daten auf unterschiedliche „Datenbehälter“ ein-/auszugeben, verwendet Java das Konzept der „Streams“ (Ströme): Eingabe- und Ausgabeströme (E/A, <span class="eng">I/O</span>)</p></li><li><p>Datenströme als eine Abstraktion von I/O „Geräten“</p><ul class="incremental list-with-explanations"><li><p>Verstecken Details über die Implementierung / Funktionsweise der einzelnen I/O-Geräte vor dem Java Programmierer</p><p>(D. h. ob die Eingabe zum Beispiel eine Tastatur, Datei, anderes Programm, Netz, Hauptspeicher, … ist.)</p></li><li><p>Stellen Java-Programmen einheitliche Schnittstellen zum Lesen bzw. Schreiben von Daten zur Verfügung</p></li></ul></li></ul></ld-topic>
<ld-topic id="i-o-strome-in-java"><h2>I/O-Ströme in Java</h2><div class="compound"><p class="rubric">Lesen von Daten</p><p>Um Daten von einer externen Datenquelle zu lesen, öffnet ein Java-Programm einen Eingabestrom und liest die Daten <em>seriell</em> (nacheinander) ein:</p></div><div class="compound incremental"><p class="rubric">Schreiben von Daten</p><p>Um Daten in eine externe Senke zu schreiben, öffnet ein Java-Programm einen Ausgabestrom und schreibt die Daten <em>seriell</em>.</p></div></ld-topic>
<ld-topic id="klassifizierung-von-datenstromen"><h2>Klassifizierung von Datenströmen</h2><ld-deck class="dd-margin-left-2em"><ld-card><dl class="field-list"><dt>Nach Datentyp<span class="colon">:</span></dt><dd><dl class="incremental-list field-list"><dt>Zeichenströme<span class="colon">:</span></dt><dd><p>lesen / schreiben.</p><div class="incremental peripheral"><p><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>io<span class="punctuation">.</span></span>Reader</span></code>/<code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>io<span class="punctuation">.</span></span>Writer</span></code> stellen die Schnittstelle und eine partielle Implementierung von Zeichenströmen zur Verfügung.</p><p>Subklassen von <code class="java"><span class="name class">Reader</span></code>/<code class="java"><span class="name class">Writer</span></code> fügen neues Verhalten hinzu bzw. ändern dieses.</p></div></dd><dt>Byteströme<span class="colon">:</span></dt><dd><p>lesen / schreiben <code class="java"><span class="keyword">byte</span></code>s (8-bit).</p><p>Werden zum Lesen bzw. Schreiben von Binärdaten, z.B. Bildern, benutzt.</p><div class="incremental peripheral"><p><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>io<span class="punctuation">.</span></span>InputStream</span></code>/<code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>io<span class="punctuation">.</span></span>OutputStream</span></code>: gemeinsame Schnittstelle und partielle Implementierung für alle Ströme zum Lesen bzw. Schreiben von Bytes.</p><p>Alle anderen Byteströme sind Unterklassen davon.</p></div></dd></dl></dd></dl></ld-card><ld-card class="incremental"><dl class="field-list"><dt>Nach Struktur der Ströme<span class="colon">:</span></dt><dd><dl class="incremental-list field-list"><dt>Datensenkeströme<span class="colon">:</span></dt><dd><p>Daten werden direkt von „physikalischer“ Datenquelle gelesen bzw. auf „physikalische“ Datensenke geschrieben</p></dd><dt>Prozessströme<span class="colon">:</span></dt><dd><p>Daten werden von anderen Strömen gelesen bzw. auf andere Ströme geschrieben</p><p>Daten werden nach dem Lesen bzw. vor dem Schreiben gefiltert, gepuffert, bearbeitet, usw.</p></dd></dl></dd></dl></ld-card></ld-deck></ld-topic>
<ld-topic id="hierarchie-der-zeichenstrome-fur-i-o"><h2>Hierarchie der Zeichenströme für I/O</h2><div class="float-right scale-up-on-hover"><object class="light-image align-center" data="images/readers_and_writers/legend.svg" type="image/svg+xml" role="img"></object></div><ld-deck><ld-card><object class="light-image align-center" data="images/readers_and_writers/readers.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="incremental"><object class="light-image align-center" data="images/readers_and_writers/writers.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="incremental"><object class="light-image align-center" data="images/input_and_output/input.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="incremental"><object class="light-image align-center" data="images/input_and_output/output.svg" type="image/svg+xml" role="img"></object></ld-card></ld-deck></ld-topic>
<ld-topic id="allgemeines-vorgehen-beim-lesen-schreiben-von-dateien"><h2>Allgemeines Vorgehen beim Lesen/Schreiben von Dateien</h2><dl class="incremental-list field-list"><dt>Lesen<span class="colon">:</span></dt><dd><ol class="arabic incremental-list list-with-explanations"><li><p>Öffne einen Strom</p><p>Ströme werden beim Erzeugen automatisch geöffnet</p></li><li><p>Lese Daten, solange nötig und es noch Daten gibt</p></li><li><p>Schließe den Strom</p><p>Beim Beenden des Lesens ist der Strom durch <code class="java"><span class="name function">close</span><span class="punctuation">(</span><span class="punctuation">)</span></code> zu schließen.</p></li></ol></dd><dt>Schreiben<span class="colon">:</span></dt><dd><ol class="arabic incremental-list list-with-explanations"><li><p>Öffne einen Strom</p></li><li><p>Solange es noch Daten gibt, schreibe Daten</p></li><li><p>Schließe den Strom</p><p>Beim Beenden des Schreibens ist der Strom durch <code class="java"><span class="name function">close</span><span class="punctuation">(</span><span class="punctuation">)</span></code> zu schließen.</p></li></ol></dd></dl><aside class="admonition incremental" data-theme="remember"><p class="admonition-title" data-theme="remember-header"><span>Zur Erinnerung</span></p><p>Lesen/Schreiben von/auf Strömen haben unabhängig von Datentyp und Quelle bzw. Senke die gleiche Form.</p></aside></ld-topic>
<ld-topic id="schreiben-und-lesen-von-daten"><h2>Schreiben und Lesen von Daten</h2><ld-deck><ld-card><div class="compound"><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">public</span> <span class="keyword">interface</span> <span class="name class">InputStream</span> <span class="punctuation">{</span>

</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span></code></pre></div><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Es gilt immer zu überprüfen ob auch die erwartete Anzahl an Bytes/Zeichen gelesen wurde.</p></aside></ld-card><ld-card class="incremental"><div class="compound"><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">public</span> <span class="keyword">interface</span> <span class="name class">OutputStream</span> <span class="punctuation">{</span>

<ld-topic id="dateistrome-in-java"><h2>Dateiströme in Java</h2><ld-deck><ld-card><ul class="incremental-list list-with-sublists simple"><li><p>Dateiströme sind Ein-/Ausgabe-Ströme, deren Quellen/Senken Dateien im Dateisystem sind:</p></li><li><p><code class="java"><span class="name class">FileReader</span></code> / <code class="java"><span class="name class">FileWriter</span></code> für Lesen / Schreiben von Zeichen aus/in Dateien</p></li><li><p><code class="java"><span class="name class">FileInputStream</span></code> / <code class="java"><span class="name class">FileOutputStream</span></code> für Lesen / Schreiben von Bytes von/in Dateien</p></li><li><p>Ein Dateistrom kann erzeugt werden, indem man die Quelle- bzw. Senke-Datei durch eines der folgenden Objekte als Parameter des Strom-Konstruktors übergibt:</p><ul class="simple"><li><p>Dateiname  (<code class="java"><span class="name class">String</span></code>)</p></li><li><p>Datei-Objekt (<code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>io<span class="punctuation">.</span></span>File</span></code>)</p></li><li><p>Dateibeschreibung (<code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>io<span class="punctuation">.</span></span>FileDescriptor</span></code>)</p></li></ul></li><li><p>Die Klasse <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>nio<span class="punctuation">.</span>file<span class="punctuation">.</span></span>Files</span></code> bietet weitere Methoden (z. B. <code class="java"><span class="name function">newInputStream</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code>, <code class="java"><span class="name function">newBufferedWriter</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code>) zum Lesen und Schreiben von Dateien als Streams an.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Einfaches (ineffizientes) Beispiel</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">void</span> <span class="name function">print</span><span class="punctuation">(</span><span class="name class">String</span> fileName<span class="punctuation">)</span> <span class="keyword">throws</span> <span class="name class">IOException</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">try</span> <span class="punctuation">(</span><span class="name class">FileReader</span> in <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">FileReader</span><span class="punctuation">(</span>fileName<span class="punctuation">)</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">        <span class="keyword">int</span> b<span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">        <span class="keyword">while</span> <span class="punctuation">(</span><span class="punctuation">(</span>b <span class="operator">=</span> in<span class="punctuation">.</span><span class="name function">read</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span> <span class="operator">!=</span> <span class="operator">-</span><span class="literal number integer">1</span><span class="punctuation">)</span> <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">print</span><span class="punctuation">(</span>b<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="punctuation">}</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="punctuation">}</span></code></pre></ld-card></ld-deck></ld-topic>
<ld-topic id="prozessstrome"><h2>Prozessströme</h2><ld-deck><ld-card><ul class="list-with-explanations"><li><p>Ein Prozess-Strom enthält einen anderen (Daten- oder Prozess-)Strom</p><p>Dieser dient als Quelle bzw. Senke.</p></li></ul><ul class="incremental-list list-with-sublists simple"><li><p>Prozess-Ströme ändern Daten oder bieten Funktionalität:</p><ul class="incremental-list simple"><li><p>Zwischenspeichern (Puffern) von Daten</p></li><li><p>Zählen der gelesenen/geschriebenen Zeilen</p></li><li><p>Konvertierung zwischen Byte und Zeichen</p></li><li><p>Kompression, …</p></li></ul></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Pufferströme</p><ul class="incremental-list list-with-sublists simple"><li><p>Ein Pufferstrom (z. B. <code class="java"><span class="name class">BufferedInputStream</span></code> oder <code class="java"><span class="name class">BufferedOutputStream</span></code>) kapselt einen anderen Datenstrom und einen internen Puffer</p></li><li><p>Beim ersten Lesen wird der Puffer vollständig gefüllt</p><ul class="simple"><li><p>Weitere Lese-Operationen liefern Bytes vom Puffer zurück, ohne vom unterliegenden Strom tatsächlich zu lesen.</p></li><li><p>Bei leerem Puffer wird erneut vom unterliegenden Strom gelesen</p></li></ul></li><li><p>Beim Schreiben werden die Daten zuerst in dem internen Puffer gespeichert, bevor sie in den unterliegenden Strom geschrieben werden.</p><ul class="simple"><li><p>Nur wenn der Puffer voll ist, wird auf den unterliegenden Strom geschrieben</p></li><li><p>Sowie bei explizitem Aufruf der Methode <code class="java"><span class="name function">flush</span><span class="punctuation">(</span><span class="punctuation">)</span></code> oder <code class="java"><span class="name function">close</span><span class="punctuation">(</span><span class="punctuation">)</span></code>.</p></li></ul></li></ul><aside class="admonition incremental" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>Die richtige Puffergröße kann die Geschwindigkeit beim Lesen und Schreiben von Dateien <strong>erheblich</strong> beeinflussen (5-10x). Die richtige Puffergröße ist von vielen Faktoren abhängig liegt aber vermutlich zwischen 8KB und 64KB.</p></aside></ld-card><ld-card class="incremental"><p class="rubric">Einfaches Beispiel</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">try</span><span class="punctuation">(</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name class">FileOutputStream</span> fos <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">FileOutputStream</span><span class="punctuation">(</span><span class="literal string">"Test.tmp"</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="name class">BufferedOutputStream</span> bos <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">BufferedOutputStream</span><span class="punctuation">(</span>fos<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="name class">DataOutputStream</span> out <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">DataOutputStream</span><span class="punctuation">(</span>bos<span class="punctuation">)</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">6</small><code data-lineno="6">    out<span class="punctuation">.</span><span class="name function">writeInt</span><span class="punctuation">(</span><span class="literal number integer">9</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">7</small><code data-lineno="7">    out<span class="punctuation">.</span><span class="name function">writeDouble</span><span class="punctuation">(</span><span class="name class">Math</span><span class="punctuation">.</span><span class="name constant">PI</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">8</small><code data-lineno="8">    out<span class="punctuation">.</span><span class="name function">writeBoolean</span><span class="punctuation">(</span><span class="keyword constant">true</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">9</small><code data-lineno="9"><span class="punctuation">}</span></code></pre><pre class="code console incremental literal-block"><small class="ln">1</small><code data-lineno="1">$ hexdump Test.tmp
</code><small class="ln">2</small><code data-lineno="2">0000000 0000 0900 0940 fb21 <span class="literal number integer">4454</span> 182d 0001</code></pre></ld-card></ld-deck></ld-topic>
<ld-topic id="architektur-der-i-o-api"><h2>Architektur der I/O API</h2><ld-deck><ld-card><p>Ströme können ineinander verschachtelt werden.</p><p><span class="peripheral">Abstraktionsebenen, bei denen unterliegende „primitive“ Ströme von umschließenden („höheren“, komfortableren) Strömen benutzt werden („Prozessströme“).</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="comment single">// erzeugt gepufferten, komprimierenden Dateiausgabestrom</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name class">OutputStream</span> out <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">FileOutputStream</span><span class="punctuation">(</span><span class="punctuation">&lt;</span>filename<span class="punctuation">&gt;</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="keyword">var</span> bout <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">BufferedOutputStream</span><span class="punctuation">(</span>out<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="keyword">var</span> zout <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">ZipOutputStream</span><span class="punctuation">(</span>bout<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="comment single">// … mehr Eigenschaften koennen dynamisch hinzugefuegt werden</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="comment single">// Die Stromeigenschaften sind unsichtbar fuer Klienten</span></code></pre></ld-card><ld-card class="incremental"><p>Die Technik, mit der erreicht wird, dass Ströme beliebig zur Laufzeit kombiniert werden können, ist nicht nur im Kontext von Strömen von Interesse. Es handelt sich um eine generelle Technik, um Objekte dynamisch mit Features zu erweiterten.</p><div class="incremental"><p>In der Softwaretechnik werden solche Techniken in der Form so genannter <em>Design Patterns</em> (<span class="ger">Entwurfsmuster</span>) dokumentiert; d. h. wiederverwendbare, dokumentierte Designideen.</p></div><div class="incremental"><p>Die oben genannte Technik bei Streams ist als „Decorator Pattern“ bekannt.</p></div></ld-card></ld-deck></ld-topic>

<ld-topic class="new-section" id="java-streams-und-i-o"><h2>Java <code class="java"><span class="name class">Stream</span></code>s und I/O</h2></ld-topic>
<ld-topic id="java-nio-file-files"><h2><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>nio<span class="punctuation">.</span>file<span class="punctuation">.</span></span>Files</span></code></h2><p>Neben den traditionellen I/O-Klassen (seit Java 1.x) gibt es auch die Möglichkeit Dateien als Streams zu lesen und zu schreiben (<code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>nio<span class="punctuation">.</span>file<span class="punctuation">.</span></span>Files</span></code>).</p><pre class="code java literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">package</span> <span class="name namespace">java<span class="punctuation">.</span>nio<span class="punctuation">.</span>file</span><span class="punctuation">;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">public</span> <span class="keyword">class</span> <span class="name class">Files</span> <span class="punctuation">{</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="comment single">/** Read all lines from a file as a Stream. */</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="keyword">static</span> <span class="name class">Stream</span><span class="punctuation">&lt;</span><span class="name class">String</span><span class="punctuation">&gt;</span> <span class="name function">lines</span><span class="punctuation">(</span><span class="name class">Path</span> path<span class="punctuation">)</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="comment single">/** Read all lines from a file as a Stream. */</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="keyword">static</span> <span class="name class">Stream</span><span class="punctuation">&lt;</span><span class="name class">String</span><span class="punctuation">&gt;</span> <span class="name function">lines</span><span class="punctuation">(</span><span class="name class">Path</span> path<span class="punctuation">,</span> <span class="name class">Charset</span> cs<span class="punctuation">)</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">
</code><small class="ln">10</small><code data-lineno="10">    <span class="comment single">// ...</span>
</code><small class="ln">11</small><code data-lineno="11"><span class="punctuation">}</span></code></pre><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Diese Streams müssen explizit geschlossen werden (<code class="java"><span class="name function">close</span><span class="punctuation">(</span><span class="punctuation">)</span></code>), da sie Ressourcen verbrauchen.</p></aside></ld-topic>

<ld-topic class="exercises" id="ubung-2"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-3" data-exercise-id="3" data-exercise-title="3 - Durchsuchen von Dateien"><p class="ld-exercise-title rubric"><span>Durchsuchen von Dateien</span></p><p>Schreiben Sie ein Programm (Sie können die JShell benutzen), dass alle Textdateien (z. B. \*.rxt, \*.md oder \*.java) eines Verzeichnisses in Hinblick auf das Vorkommen eines bestimmten Wortes (z. B. Java) durchsucht. Geben Sie den Namen der Datei und eine Zeilennummer aus, in der das Wort vorkommt. Parallelisieren (<code class="java"><span class="name function">parallel</span><span class="punctuation">(</span><span class="punctuation">)</span></code>) Sie die Suche wenn möglich.</p><p>Relevante API: <code class="java"><span class="name class">Files</span><span class="punctuation">.</span>walk</code>, <code class="java"><span class="name class">File</span><span class="punctuation">.</span><span class="name function">toPath</span><span class="punctuation">(</span><span class="punctuation">)</span></code>, <code class="java"><span class="name class">Files</span><span class="punctuation">.</span>isRegularFile</code>, <code class="java"><span class="name class">Files</span><span class="punctuation">.</span>lines</code>, <code class="java"><span class="name class">Stream</span><span class="punctuation">.</span>filter</code>, <code class="java"><span class="name class">Stream</span><span class="punctuation">.</span>map</code>, <code class="java"><span class="name class">Stream</span><span class="punctuation">.</span>findAny</code>, <code class="java"><span class="name class">Optional</span><span class="punctuation">.</span>isPresent</code>, <code class="java"><span class="name class">Optional</span><span class="punctuation">.</span>get</code>, <code class="java"><span class="name class">Optional</span><span class="punctuation">.</span>empty</code></p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Sie müssen ggf. <code class="java"><span class="name class">IOException</span></code>s explizit behandeln und in solchen Fällen zum Beispiel <code class="java"><span class="name class">Optional</span><span class="punctuation">.</span><span class="name function">empty</span><span class="punctuation">(</span><span class="punctuation">)</span></code> zurückgeben.</p></aside><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Es ist eine sehr gute Übung das Handling der IOException in einen eigenen Gatherer zu verlagern. Weiterhin könnte es sich anbieten die Assoziation von Zeilennummern mit der Zeile in einen eigenen Gatherer zu verlagern.</p></aside><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:Yu2jYJp9ej+cw2NEsobf2I8XYx7YBNSZ7CPjqokxjSE=:T3T8aCHTlZbcdZDo:A+pAoGiJga3g3G/LZeOyDqTzTPJTa7lDhp5V7MxkRJzEEJVGb6ZL2D0tBbno1VnpEJxKgY7f9K9v372ZYitsQ5rYQIOoH83XGrt8CP9F6NH2KAa5aJy4uuedOLNvpEaDOs0EybCgQYo+F8aKpOSiVoHQRmMkVn/UpnTIEqSg8EJi8YD5yQuFD2aw226K4uMLkT33mT0W7yyREGNnErMNrZKDeL1NrvYeOUxxUGZ7/jViJYlflsLkdf4LPBaSnncM5mxSNwpZuK7I09M/rL+QjNz77QQCwKc2Tp738wLMZFS2LH2fOW7Xg4tZIi8JZ5/WnCxIw9w/GUbLrt0DTybha+ckZA1FGBlrouQFuHGijIjX6LM8jGhVxOwH3TPOlvWRm5PoMT2aohLNf4Ux0s13xaha1QgpNsscWbsuF471BmuII7/1d9Xjfhix86w86Uh3htgN0OOSrDD2DtotDUxe2TzR95yl8rA8DA9wjbTfauBPE3WDYEGU70V0ZNnHrQLH3GMu+VjHvxI/LntWByacT19RBL8aGoShzU7nSMd4zGe2eZ6cDanqnY+ZiyzXJI9YDcg+WQMwFqMZ2pwhITEL08f5C9BVe392+h/pqj6ChrDXGYkz4qqbuftzCUmuRjZhCLAr76LFambMZpAVzC1RwVykqcWVjhxcuItgR71Lzm7TXu4Yc9N0WOZb5M7Gt7WzeNuHF1r4bBjR1o8lAnA2hIoDhNbjO8BfvmDVZa5gBB1tl+r4/KBLkgTYp8qet2ueXwmW89QreSAxrLvD9ZDDuW/bQVYZ5m4t5QRPgfwvh5OtA1DyAxRK71zL3pqnE3TQl1nyZwo4zSzjJhz7p+lB6Q8uF+XQgFFIj7991vmiBBnZNJoJWYLknGdvLY/wEFIgVuzmdHdq1AQdmGP5SwtvNMtHs4IbGR8aVrLiteTyPQ8hVEtf6cXzMOMAk42VUJXVkkg/1Xlywue2rx0tKIKs3Tz2S2E1zg63suhMumY8XEi7fWF5x4i3RCzmFNMWAtG6HOE5ebPdeNceH+/a0nn9MSr/6Pzmvi5acMa+6VhQ9rZ5lAHc3PTef1mjW14hYtQQk/YdyXpYsWK+Kx1Vbo
