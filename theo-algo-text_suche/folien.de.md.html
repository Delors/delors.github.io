<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

Frage ist hier das Finden von Textsequenzen im Text.</p><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel: Gesucht ist "labore"</span></p><blockquote class="epigraph"><p>Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod tempor invidunt ut labore et dolore magna aliquyam erat, sed diam voluptua. At vero eos et accusam et justo duo dolores et ea rebum. Stet clita kasd gubergren, no sea takimata sanctus est Lorem ipsum dolor sit amet. Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod tempor invidunt ut labore et dolore magna aliquyam erat, sed diam voluptua. At vero eos et accusam et justo duo dolores et ea rebum. Stet clita kasd gubergren, no sea takimata sanctus est Lorem ipsum dolor sit amet.</p><p class="attribution">—<a class="reference external" href="https://www.loremipsum.de">loremipsum.de</a></p></blockquote></aside></ld-topic>
<ld-topic id="einfache-textsuche"><h2>Einfache Textsuche</h2><!--To generate strike-through unicode letters: https://yaytext.com/strike/--><ld-deck><ld-card><aside class="admonition width-40 incremental" data-theme="note"><p class="admonition-title" data-theme="note-header">Bemerkung</p><p>Die Laufzeit der einfachen Textsuche kann asymptotisch durch O(n·m) abgeschätzt werden.</p></aside><pre class="code pascal copy-to-clipboard incremental-code literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">function</span> NaiveTextSearch<span class="punctuation">(</span>text<span class="punctuation">,</span>needle<span class="punctuation">)</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    n <span class="operator">:=</span> length<span class="punctuation">(</span>text<span class="punctuation">)</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    m <span class="operator">:=</span> length<span class="punctuation">(</span>needle<span class="punctuation">)</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="keyword">for</span> i <span class="operator">:=</span> <span class="literal number integer">1</span><span class="punctuation">,</span><span class="operator">..</span><span class="punctuation">.</span><span class="punctuation">,</span>n<span class="operator">-</span>m <span class="operator">+</span> <span class="literal number integer">1</span> <span class="keyword">do</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">        j <span class="operator">:=</span> <span class="literal number integer">0</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="keyword">while</span> text<span class="punctuation">[</span>i <span class="operator">+</span> j<span class="punctuation">]</span> <span class="operator">=</span><span class="operator">=</span> needle<span class="punctuation">[</span>j <span class="operator">+</span> <span class="literal number integer">1</span><span class="punctuation">]</span> <span class="keyword">do</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">            j <span class="operator">:=</span> j <span class="operator">+</span> <span class="literal number integer">1</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">            <span class="keyword">if</span> j <span class="operator">=</span><span class="operator">=</span> m <span class="keyword">then</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">                return i <span class="comment single">// Found at i</span>
</code><small class="ln">10</small><code data-lineno="10">    return <span class="keyword">nil</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Beispiel bei einfacher Suche nach <span class="docutils literal">aaab</span> in <span class="docutils literal">aaaaaaaab</span>:</p><div class="monospaced"><pre class="literal-block"><code>a a a a a a a a b
⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯
a a a b̶
  a a a b̶
    a a a b̶
      a a a b̶
        a a a b̶
          a a a b</code></pre></div><div class="incremental"><p>Sind so viele Vergleiche notwendig?</p></div></ld-card></ld-deck></ld-topic>
<ld-topic class="new-section" id="knuth-morris-pratt-kmp-verfahren"><h2>Knuth-Morris-Pratt (KMP) Verfahren</h2></ld-topic>
<ld-topic id="grundlagen"><h2>Grundlagen</h2><!--Use the jshell to generate combined characters: (https://www.compart.com/en/unicode/combining/220)
    Example: \u0305 = Combining Overline
             \u0332 = Combining Low Line
             a̲̅ = "a\u0305\u0332"
             a̅ = "a\u0305"
             a̲ = "a\u0332"
             n̲ = "n\u0332"
             n̅ = "n\u0305"--><ld-deck><ld-card><p>Das Verfahren von Knuth-Morris-Pratt vermeidet unnötige Vergleiche, da es zunächst die Suchwortteile auf den größten Rand, also das größte Präfix, das auch Postfix ist, untersucht.</p><aside class="admonition incremental" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Präfix, Postfix und Rand</span></p><p>Für ein Wort <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo>=</mo><mo stretchy="false">(</mo><msub><mi>w</mi><mn>1</mn></msub><mo separator="true">,</mo><mi mathvariant="normal">.</mi><mi mathvariant="normal">.</mi><mi mathvariant="normal">.</mi><mo separator="true">,</mo><msub><mi>w</mi><mi>n</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">w = (w_1,...,w_n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0269em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">...</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0269em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span> mit <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn><mo>≤</mo><mi>k</mi><mo>≤</mo><mi>n</mi></mrow><annotation encoding="application/x-tex">0 \leq  k \leq  n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7804em;vertical-align:-0.136em;"></span><span class="mord">0</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8304em;vertical-align:-0.136em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span></span>. sind:</p><ul class="simple"><li><p>die Präfixe <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>p</mi><mrow><mo stretchy="false">(</mo><mi>k</mi><mo stretchy="false">)</mo></mrow></msup><mo>=</mo><mo stretchy="false">(</mo><msub><mi>w</mi><mn>1</mn></msub><mo separator="true">,</mo><mi mathvariant="normal">.</mi><mi mathvariant="normal">.</mi><mi mathvariant="normal">.</mi><mo separator="true">,</mo><msub><mi>w</mi><mi>k</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p^{(k)} = (w_1,...,w_k )</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.0824em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.888em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mopen mtight">(</span><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span><span class="mclose mtight">)</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0269em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span cla tex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7335em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span></span> werden <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>p</mi><mrow><mo stretchy="false">(</mo><mi>k</mi><mo stretchy="false">)</mo></mrow></msup></mrow><annotation encoding="application/x-tex">p^{(k)}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.0824em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.888em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mopen mtight">(</span><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span><span class="mclose mtight">)</span></span></span></span></span></span></span></span></span></span></span></span></span> und <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>q</mi><mrow><mo stretchy="false">(</mo><mi>k</mi><mo stretchy="false">)</mo></mrow></msup></mrow><annotation encoding="application/x-tex">q^{(k)}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.0824em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">q</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.888em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mopen mtight">(</span><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span><span class="mclose mtight">)</span></span></span></span></span></span></span></span></span></span></span></span></span> auch echte Prä- und Postfixe genannt.</p></aside></ld-card><ld-card class="incremental"><p class="rubric">Beispiel/Idee</p><pre class="literal-block"><code>Text              010110101
Gesucht/Muster    010101
Übereinstimmung   ✓✓✓✓✗</code></pre><div class="incremental margin-top-1em"><p><strong>Beobachtungen:</strong></p><ol class="arabic simple"><li><p>Wir haben an Stelle 5 ein Mismatch.</p></li><li><p>Wenn wir im Text das Muster um eine Stelle nach rechts verschoben suchen, so haben wir wieder ein Mismatch.</p></li></ol><aside class="admonition question far-smaller incremental"><p class="admonition-title">Frage</p><p>Wie weit kann man also das Muster im Allgemeinen verschoben werden ohne ein Vorkommen zu übersehen?</p></aside></div></ld-card><ld-card class="incremental"><p class="rubric">Beispiel/Idee</p><pre class="literal-block"><code>                    1.                    2.
Text                01101100              0102111
Gesucht/Muster      01100                 010201
Übereinstimmungen   ✓✓✓✓✗                 ✓✓✓✓✗</code></pre><ld-presenter-note encrypted="">MTAwMDAw:QsSA5wryLv2PeaB/pT91Q/fhYFXwLT1UqgeKwgJcfIQ=:M+p5DtRcWgCRdFpH:NL0lhJFAcM1C9GVUbJxfViHbxY9zfna9VmrylHR2g9WutTpDmiMqZz2vHzAxwMHSoxk8ipYQnsL3hUsIMmtvKDUp0FvXjKxpl9B0ahAaEk2/3tapU8GcLtsR4UP1xF1K97zNk4Kx9vMPGsKvcrnNjwT0G1AuETX6MS5fRBGJJ+++hMpG/96qKlbvxuFmzpI0qN/Op0YPwwdVQbk62W9wPLKpq9gbVbGAcVaC/V+WR3UA7mCaTUIqZzQ+wOTVNJmEg1PHkw9m4fvLm54JWdyAPKrSA1Jgj1PJsfrUqctS1FrQHbEl7MkzPFkQTF/AcZHlBRHT/5Lm8uNCGAKak156tgkVYd+iaXurKBMczkP9PxShL5d8FEG3vYMOuf8b0kOgYnBL3+VjlkCKk2QdcmvRrYSDx3fAHEut46laahZKTvWMBWpTIFpfd59iy/RNm5vqPjavtb5oIa+sctJo40ZsxgZ7t6kdELLFUN+v1OPMHKpvyVyShAWav+KeoiiwUMdUJDhilLMGuB1WN/JOSG/qy+g/7EytoVO9N88pOjhks8EpLbdLELvVFMB9ijKzJ25DNp0wY1F/u2aKIRdw9fu/hEMwHfpywQTPfBRe9VpozSeUlCVj6TzRgkDRduwlYClwU3mczG3UDXuCp69rTo6B9p95APIrTI8hdghf6n8=</ld-presenter-note><div class="incremental"><p><strong>Beobachtungen bzgl.:</strong></p><ol class="arabic incremental-list list-with-explanations"><li><p>Beim Mismatch an Stelle 5 kann das Muster „nur“ um 3 Stellen nach rechts verschoben werden.</p><p><span class="incremental">(Wir haben 4 Übereinstimmungen und einen Rand von 1 für den Teil mit den Übereinstimmungen. Daraus ergibt sich eine Verschiebung von 4 - 1 = 3!)</span></p></li><li><p>Beim Mismatch an Stelle 5 kann das Muster um 4 Stellen nach rechts verschoben werden.</p></li></ol><div class="incremental"><p>Wie weit wir das Muster verschieben können, hängt also vom Rand des Teils des Musters ab, der bereits übereinstimmt.</p><ld-supplemental embed-in-document-flow=""><p>Bei einem Mismatch betrachtet man die Anzahl j der bereits übereinstimmenden Zeichen (das gematchte Präfix des Musters) und bestimmt dessen längsten echten Rand der Länge b. Das Muster wird dann um j − b Stellen nach rechts verschoben; der Textzeiger bleibt auf dem Mismatch-Zeichen, und der Vergleich wird ab Position b im Muster fortgesetzt, da die b Randzeichen bereits übereinstimmen. Gibt es keinen Rand (b = 0), verschiebt man entsprechend um j Stellen und vergleicht das Mismatch-Zeichen erneut mit dem Musteranfang.</p></ld-supplemental></div></div></ld-card><ld-card class="incremental"><p class="rubric">Beispiel</p><p>Das Wort <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi><mi>u</mi><mi>f</mi><mi>k</mi><mi>a</mi><mi>u</mi><mi>f</mi></mrow><annotation encoding="application/x-tex">aufkauf</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span></span></span></span></span> hat die <em>echten</em> Präfixe und Postfixe:</p><blockquote><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">{</mo><msup><mi>p</mi><mrow><mo stretchy="false">(</mo><mi>k</mi><mo stretchy="false">)</mo></mrow></msup><mo>:</mo><mn>0</mn><mo>≤</mo><mi>k</mi><mo>&lt;</mo><mi>n</mi><mo stretchy="false">}</mo><mo>=</mo><mo stretchy="false">{</mo><mi>ε</mi><mo separator="true">,</mo><mi>a</mi><mo separator="true">,</mo><mi>a</mi><mi>u</mi><mo separator="true">,</mo><mi>a</mi><mi>u</mi><mi>f</mi><mo separator="true">,</mo><mi>a</mi><mi>u</mi><mi>f</mi><mi>k</mi><mo separator="true">,</mo><mi>a</mi><mi>u</mi><mi>f</mi><mi>k</mi><mi>a</mi><mo separator="true">,</mo><mi>a</mi><mi>u</mi><mi>f</mi><mi>k</mi><mi>a</mi><mi>u</mi><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{p^{(k)} : 0 \leq  k &lt;n\}=\{ε,a,au,auf,aufk,aufka,aufkau\}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.138em;vertical-align:-0.25em;"></span><span class="mopen">{</span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.888em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mopen mtight">(</span><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span><span class="mclose mtight">)</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">:</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7804em;vertical-align:-0.136em;"></span><span class="mord">0</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7335em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">n</span><span class="mclose">}</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">{</span><span class="mord mathnormal">ε</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">a</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mord mathnormal">a</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mclose">}</span></span></span></span></span></p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">{</mo><msup><mi>q</mi><mrow><mo stretchy="false">(</mo><mi>k</mi><mo stretchy="false">)</mo></mrow></msup><mo>:</mo><mn>0</mn><mo>≤</mo><mi>k</mi><mo>&lt;</mo><mi>n</mi><mo stretchy="false">}</mo><mo>=</mo><mo stretchy="false">{</mo><mi>ε</mi><mo separator="true">,</mo><mi>f</mi><mo separator="true">,</mo><mi>u</mi><mi>f</mi><mo separator="true">,</mo><mi>a</mi><mi>u</mi><mi>f</mi><mo separator="true">,</mo><mi>k</mi><mi>a</mi><mi>u</mi><mi>f</mi><mo separator="true">,</mo><mi>f</mi><mi>k</mi><mi>a</mi><mi>u</mi><mi>f</mi><mo separator="true">,</mo><mi>u</mi><mi>f</mi><mi>k</mi><mi>a</mi><mi>u</mi><mi>f</mi><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{q^{(k)} : 0 \leq k &lt;n\}=\{ε,f,uf,auf,kauf,fkauf,ufkauf\}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.138em;vertical-align:-0.25em;"></span><span class="mopen">{</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">q</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.888em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mopen mtight">(</span><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span><span class="mclose mtight">)</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">:</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7804em;vertical-align:-0.136em;"></span><span class="mord">0</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7335em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">n</span><span class="mclose">}</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">{</span><span class="mord mathnormal">ε</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mclose">}</span></span></span></span></span></p></blockquote><p>und die Ränder:</p><blockquote><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">{</mo><msup><mi>r</mi><mrow><mo stretchy="false">(</mo><mi>k</mi><mo stretchy="false">)</mo></mrow></msup><mo>:</mo><mn>0</mn><mo>≤</mo><mi>k</mi><mo>&lt;</mo><mi>n</mi><mo stretchy="false">}</mo><mo>=</mo><mo stretchy="false">{</mo><mi>ε</mi><mo separator="true">,</mo><mi>a</mi><mi>u</mi><mi>f</mi><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\{r^{(k)} : 0 \leq k &lt;n\}= \{ε,auf\}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.138em;vertical-align:-0.25em;"></span><span class="mopen">{</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0278em;">r</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.888em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mopen mtight">(</span><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span><span class="mclose mtight">)</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">:</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7804em;vertical-align:-0.136em;"></span><span class="mord">0</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7335em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">n</span><span class="mclose">}</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">{</span><span class="mord mathnormal">ε</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mclose">}</span></span></span></span></span>.</p></blockquote><p>Das bedeutet, dass wenn <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi><mi>u</mi><mi>f</mi><mi>k</mi><mi>a</mi><mi>u</mi><mi>f</mi></mrow><annotation encoding="application/x-tex">aufkauf</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span></span></span></span></span> erkannt wurde, die letzten drei Buchstaben schon den nächsten Treffer einleiten können, wie beispielsweise in <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi><mi>u</mi><mi>f</mi><mi>k</mi><mi>a</mi><mi>u</mi><mi>f</mi><mi>k</mi><mi>a</mi><mi>u</mi><mi>f</mi></mrow><annotation encoding="application/x-tex">aufkaufkauf</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mord mathnormal">a</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span></span></span></span></span>.</p></ld-card><ld-card class="incremental"><p>Das KMP-Verfahren fängt nicht immer von vorne an, sondern prüft, ob <em>ein Rand eines Präfixes</em> (ohne das leere Wort ε) ausgenutzt werden kann. Dazu werden die entsprechenden größten Ränder bestimmt.</p><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">Beispiel: ananas</p><table class="highlight-row-on-hover incremental-table-cells" style="width: 100%;"><thead><tr><th class="head"><p>Präfixe <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>∖</mo><mo stretchy="false">{</mo><mi>ε</mi><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\setminus \{ε\}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">∖</span><span class="mopen">{</span><span class="mord mathnormal">ε</span><span class="mclose">}</span></span></span></span></span></p></th><th class="head"><p>Größter Rand</p></th><th class="head"><p>Länge des Randes</p></th></tr></thead><tbody><tr><td><p>a</p></td><td><p>ε</p></td><td><p>0</p></td></tr><tr><td><p>an</p></td><td><p>ε</p></td><td><p>0</p></td></tr><tr><td><p>a̲na̅</p></td><td><p>a</p></td><td><p>1</p></td></tr><tr><td><p>a̲n̲a̅n̅</p></td><td><p>an</p></td><td><p>2</p></td></tr><tr><td><p>a̲n̲a̲̅n̅a̅</p></td><td><p>ana</p></td><td><p>3</p></td></tr><tr><td><p>ananas</p></td><td><p>ε</p></td><td><p>0</p></td></tr></tbody></table></ld-cell><ld-cell class="width-50 incremental" style="align-self:auto;"><p class="rubric">Beispiel: axaaxax</p><table class="highlight-row-on-hover incremental-table-cells" style="width: 100%;"><thead><tr><th class="head"><p>Präfixe <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>∖</mo><mo stretchy="false">{</mo><mi>ε</mi><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\setminus \{ε\}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">∖</span><span class="mopen">{</span><span class="mord mathnormal">ε</span><span class="mclose">}</span></span></span></span></span></p></th><th class="head"><p>Größter Rand</p></th><th class="head"><p>Länge des Randes</p></th></tr></thead><tbody><tr><td><p>a</p></td><td><p>ε</p></td><td><p>0</p></td></tr><tr><td><p>ax</p></td><td><p>ε</p></td><td><p>0</p></td></tr><tr><td><p>a̲xa̅</p></td><td><p>a</p></td><td><p>1</p></td></tr><tr><td><p>a̲xaa̅</p></td><td><p>a</p></td><td><p>1</p></td></tr><tr><td><p>a̲x̲aa̅x̅</p></td><td><p>ax</p></td><td><p>2</p></td></tr><tr><td><p>a̲x̲a̲a̅x̅a̅</p></td><td><p>axa</p></td><td><p>3</p></td></tr><tr><td><p>a̲x̲aaxa̅x̅</p></td><td><p>ax</p></td><td><p>2</p></td></tr></tbody></table></ld-cell></ld-grid></ld-card></ld-deck><ld-supplemental><p>Die Idee ist also, dass wir beim Musterabgleich nach einem Mismatch, wenn der übereinstimmende
Teil einen Rand hat, beim Abgleich des Musters an einer späteren Stelle - basierend auf der Größe des Randes - weitermachen können. Wir müssen also nicht immer das ganze Muster von vorne anfangen zu vergleichen.</p></ld-supplemental></ld-topic>

<ld-topic id="beispiel-fur-eine-kmp-textsuche"><h2>Beispiel für eine KMP-Textsuche</h2><p>Gesucht wird <span class="docutils literal">ananas</span> in <span class="docutils literal">saansanananas</span></p><div class="far-smaller monospaced"><pre class="literal-block"><code>   s a a n s a n a n a n a s
i  ⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯
1  a̶
...
3    a n̶
...
5      a n a̶
...                          Hinweise zum Algorithmus:
11           a n a n a s̶     Beim Auftreten des Mismatch (Zeile 7) ist
...                          q=5 und wird auf p[5]=3 (Zeile 8) gesetzt
13               a n a n a s</code></pre></div><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Dargestellt sind die Fälle, in denen ein Mismatch auftritt. <span class="docutils literal">i</span> ist der Index des aktuellen Zeichen im Text, das mit dem Muster verglichen wird.</p></aside></ld-topic>
<ld-topic id="algorithmus"><h2>Algorithmus</h2><ld-deck><ld-card><pre class="code pascal copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">function</span> ComputePrefixFunction<span class="punctuation">(</span>needle<span class="punctuation">)</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    m <span class="operator">:=</span> length<span class="punctuation">(</span>needle<span class="punctuation">)</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    sei B<span class="punctuation">[</span><span class="literal number integer">1</span><span class="operator">..</span><span class="punctuation">.</span>m<span class="punctuation">]</span> ein <span class="keyword">Array</span>  <span class="comment single">// Array für die Längen der Ränder der Teilworte</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    B<span class="punctuation">[</span><span class="literal number integer">1</span><span class="punctuation">]</span> <span class="operator">:=</span> <span class="literal number integer">0</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    j <span class="operator">:=</span> <span class="literal number integer">0</span>                  <span class="comment single">// j ist die Länge des echten Randes</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">for</span> i <span class="operator">:=</span> <span class="literal number integer">2</span><span class="punctuation">,</span><span class="operator">..</span><span class="punctuation">.</span><span class="punctuation">,</span>m <span class="keyword">do</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">        j <span class="operator">:=</span> j <span class="operator">+</span> <span class="literal number integer">1</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">        <span class="keyword">while</span> j <span class="operator">&gt;</span> <span class="literal number integer">0</span> <span class="operator">and</span> needle<span class="punctuation">[</span>j<span class="punctuation">]</span> ≠ needle<span class="punctuation">[</span>i<span class="punctuation">]</span> <span class="keyword">do</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">            <span class="keyword">if</span> j <span class="operator">&gt;</span> <span class="literal number integer">1</span> <span class="keyword">then</span>
</code><small class="ln">10</small><code data-lineno="10">                j <span class="operator">:=</span> B<span class="punctuation">[</span>j<span class="operator">-</span><span class="literal number integer">1</span><span class="punctuation">]</span> <span class="operator">+</span> <span class="literal number integer">1</span>
</code><small class="ln">11</small><code data-lineno="11">            <span class="keyword">else</span>
</code><small class="ln">12</small><code data-lineno="12">                j <span class="operator">:=</span> <span class="literal number integer">0</span>
</code><small class="ln">13</small><code data-lineno="13">        B<span class="punctuation">[</span>i<span class="punctuation">]</span> <span class="operator">:=</span> j
</code><small class="ln">14</small><code data-lineno="14">    return B</code></pre><ld-supplemental embed-in-document-flow=""><p>Die Funktion <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi><mi>o</mi><mi>m</mi><mi>p</mi><mi>u</mi><mi>t</mi><mi>e</mi><mi>P</mi><mi>r</mi><mi>e</mi><mi>f</mi><mi>i</mi><mi>x</mi><mi>F</mi><mi>u</mi><mi>n</mi><mi>c</mi><mi>t</mi><mi>i</mi><mi>o</mi><mi>n</mi></mrow><annotation encoding="application/x-tex">ComputePrefixFunction</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mord mathnormal">o</span><span class="mord mathnormal">m</span><span class="mord mathnormal">p</span><span class="mord mathnormal">u</span><span class="mord mathnormal">t</span><span class="mord mathnormal">e</span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mord mathnormal" style="margin-right:0.0278em;">r</span><span class="mord mathnormal">e</span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mord mathnormal">i</span><span class="mord mathnormal">x</span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mord mathnormal">u</span><span class="mord mathnormal">n</span><span class="mord mathnormal">c</span><span class="mord mathnormal">t</span><span class="mord mathnormal">i</span><span class="mord mathnormal">o</span><span class="mord mathnormal">n</span></span></span></span></span> berechnet die größten Werte der Präfixe für das Suchwort <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mi>e</mi><mi>e</mi><mi>d</mi><mi>l</mi><mi>e</mi></mrow><annotation encoding="application/x-tex">needle</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord mathnormal">n</span><span class="mord mathnormal">ee</span><span class="mord mathnormal">d</span><span class="mord mathnormal" style="margin-right:0.0197em;">l</span><span class="mord mathnormal">e</span></span></span></span></span> der Länge <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span></span> und gibt diese als Array <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>B</mi></mrow><annotation encoding="application/x-tex">B</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span></span></span></span></span> zurück.
Das Array <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>B</mi></mrow><annotation encoding="application/x-tex">B</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span></span></span></span></span> enthält somit die größten Ränder der Präfixe <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mi>e</mi><mi>e</mi><mi>d</mi><mi>l</mi><mi>e</mi><mo stretchy="false">[</mo><mn>1</mn><mo separator="true">,</mo><mi mathvariant="normal">.</mi><mi mathvariant="normal">.</mi><mi mathvariant="normal">.</mi><mo separator="true">,</mo><mi>i</mi><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">needle[1,...,i]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">n</span><span class="mord mathnormal">ee</span><span class="mord mathnormal">d</span><span class="mord mathnormal" style="margin-right:0.0197em;">l</span><span class="mord mathnormal">e</span><span class="mopen">[</span><span class="mord">1</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">...</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">i</span><span class="mclose">]</span></span></span></span></span>.</p><p>(Der Wert von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>B</mi><mo stretchy="false">[</mo><mn>1</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">B[1]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mopen">[</span><span class="mord">1</span><span class="mclose">]</span></span></span></span></span> ist immer 0, da es keinen Rand gibt.)</p><!--? Die grundlegende Idee ist, dass der Rand des Präfixes :math:`needle[1,...,i]` der Rand des Präfixes :math:`needle[1,...,i-1]` ist, wenn :math:`needle[i] = needle[j]` ist.--></ld-supplemental><p>Komplexität: O(m)</p></ld-card><ld-card class="incremental"><pre class="code pascal literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">function</span> KMP<span class="punctuation">(</span>text<span class="punctuation">,</span>needle<span class="punctuation">)</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    n <span class="operator">:=</span> length<span class="punctuation">(</span>text<span class="punctuation">)</span><span class="punctuation">,</span> m <span class="operator">:=</span> length<span class="punctuation">(</span>needle<span class="punctuation">)</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    B <span class="operator">:=</span> ComputePrefixFunction<span class="punctuation">(</span>needle<span class="punctuation">)</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    q <span class="operator">:=</span> <span class="literal number integer">0</span>               <span class="comment single">// Anzahl der übereinstimmenden Zeichen</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    R <span class="operator">:=</span> <span class="punctuation">[</span><span class="punctuation">]</span>              <span class="comment single">// Ergebnisliste der Indizes der Übereinstimmungen</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">for</span> i <span class="operator">:=</span> <span class="literal number integer">1</span><span class="punctuation">,</span><span class="operator">..</span><span class="punctuation">.</span><span class="punctuation">,</span>n <span class="keyword">do</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">        <span class="keyword">while</span> q <span class="operator">&gt;</span> <span class="literal number integer">0</span> <span class="operator">and</span> needle<span class="punctuation">[</span>q <span class="operator">+</span> <span class="literal number integer">1</span><span class="punctuation">]</span> ≠ text<span class="punctuation">[</span>i<span class="punctuation">]</span> <span class="keyword">do</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">            q <span class="operator">:=</span> B<span class="punctuation">[</span>q<span class="punctuation">]</span>    <span class="comment single">// ... die nächsten Zeichen stimmen nicht überein</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">        <span class="keyword">if</span> needle<span class="punctuation">[</span>q <span class="operator">+</span> <span class="literal number integer">1</span><span class="punctuation">]</span> <span class="operator">=</span><span class="operator">=</span> text<span class="punctuation">[</span>i<span class="punctuation">]</span> <span class="keyword">then</span>
</code><small class="ln">10</small><code data-lineno="10">            q <span class="operator">:=</span> q <span class="operator">+</span> <span class="literal number integer">1</span>   <span class="comment single">// Übereinstimmung</span>
</code><small class="ln">11</small><code data-lineno="11">        <span class="keyword">if</span> q <span class="operator">=</span><span class="operator">=</span> m <span class="keyword">then</span>
</code><small class="ln">12</small><code data-lineno="12">            R append <span class="punctuation">(</span>i <span class="operator">-</span> m <span class="operator">+</span> <span class="literal number integer">1</span><span class="punctuation">)</span>
</code><small class="ln">13</small><code data-lineno="13">            q <span class="operator">:=</span> B<span class="punctuation">[</span>q<span class="punctuation">]</span>    <span class="comment single">// Suche nach nächster Übereinstimmung</span>
</code><small class="ln">14</small><code data-lineno="14">    return R</code></pre><p>Komplexität: O(n+m)</p></ld-card></ld-deck><ld-supplemental><p class="rubric">Implementierung in Java (0-basiert)</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">static</span> <span class="keyword">int</span><span class="punctuation">[</span><span class="punctuation">]</span> <span class="name function">computePrefixFunction</span><span class="punctuation">(</span><span class="name class">String</span> needle<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">int</span> m <span class="operator">=</span> needle<span class="punctuation">.</span><span class="name function">length</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">int</span><span class="punctuation">[</span><span class="punctuation">]</span> b <span class="operator">=</span> <span class="keyword">new</span> <span class="keyword">int</span><span class="punctuation">[</span>m<span class="punctuation">]</span><span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    b<span class="punctuation">[</span><span class="literal number integer">0</span><span class="punctuation">]</span> <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="keyword">int</span> j <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="keyword">for</span> <span class="punctuation">(</span><span class="keyword">int</span> i <span class="operator">=</span> <span class="literal number integer">1</span><span class="punctuation">;</span> i <span class="operator">&lt;</span> m<span class="punctuation">;</span> i<span class="operator">++</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">        j<span class="operator">++</span><span class="punctuation">;</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">        <span class="keyword">while</span> <span class="punctuation">(</span>j <span class="operator">&gt;</span> <span class="literal number integer">0</span> <span class="operator">&amp;&amp;</span> needle<span class="punctuation">.</span><span class="name function">charAt</span><span class="punctuation">(</span>j <span class="operator">-</span> <span class="literal number integer">1</span><span class="punctuation">)</span> <span class="operator">!=</span> needle<span class="punctuation">.</span><span class="name function">charAt</span><span class="punctuation">(</span>i<span class="punctuation">)</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">10</small><code data-lineno="10">            <span class="keyword">if</span> <span class="punctuation">(</span>j <span class="operator">&gt;</span> <span class="literal number integer">1</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">11</small><code data-lineno="11">                j <span class="operator">=</span> b<span class="punctuation">[</span>j <span class="operator">-</span> <span class="literal number integer">2</span><span class="punctuation">]</span> <span class="operator">+</span> <span class="literal number integer">1</span><span class="punctuation">;</span>
</code><small class="ln">12</small><code data-lineno="12">            <span class="punctuation">}</span> <span class="keyword">else</span> <span class="punctuation">{</span>
</code><small class="ln">13</small><code data-lineno="13">                j <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span>
</code><small class="ln">14</small><code data-lineno="14">            <span class="punctuation">}</span>
</code><small class="ln">15</small><code data-lineno="15">        <span class="punctuation">}</span>
</code><small class="ln">16</small><code data-lineno="16">        b<span class="punctuation">[</span>i<span class="punctuation">]</span> <span class="operator">=</span> j<span class="punctuation">;</span>
</code><small class="ln">17</small><code data-lineno="17">    <span class="punctuation">}</span>
</code><small class="ln">18</small><code data-lineno="18">    <span class="keyword">return</span> b<span class="punctuation">;</span>
</code><small class="ln">19</small><code data-lineno="19"><span class="punctuation">}</span></code></pre></ld-supplemental></ld-topic>

<ld-topic class="new-section transition-move-to-top" id="boyer-moore-algorithmus-vereinfacht"><h2>Boyer-Moore-Algorithmus (vereinfacht)</h2></ld-topic>
<ld-topic id="grundlagen-1"><h2>Grundlagen</h2><ld-deck><ld-card><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>Häufig ist das Alphabet des Textes größer als das des Musters.</p></aside><ul class="incremental-list list-with-explanations"><li><p>Der Algorithmus vergleicht das Muster (Pattern) von rechts nach links mit dem Text.</p><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Viele andere Algorithmen führen die Vergleiche von links nach rechts durch.</p></aside></li><li><p>Der Boyer-Moore-Algorithmus nutzt dies aus, indem er die Verschiebung des Musters anhand des letzten Zeichens des Musters und des Textes vornimmt.</p></li></ul></ld-card><ld-card class="incremental"><p>Wird beispielsweise das Wort</p><p><span class="docutils literal">Banane</span></p><p>im Text</p><p><span class="docutils literal">Orangen,␣Ananas␣und␣Bananen</span></p><p>gesucht, so wird zunächst die Sprungtabelle für das verwendete Alphabet in Bezug auf das Suchwort (<span class="docutils literal">Banane</span> mit Länge 6) bestimmt:</p><table class="highlight-on-hover"><thead><tr><th class="stub head"><p>Zeichen im Text</p></th><th class="head"><p>␣</p></th><th class="head"><p>,</p></th><th class="head"><p>A</p></th><th class="head"><p>B</p></th><th class="head"><p>O</p></th><th class="head"><p>a</p></th><th class="head"><p>d</p></th><th class="head"><p>e</p></th><th class="head"><p>g</p></th><th class="head"><p>n</p></th><th class="head"><p>r</p></th><th class="head"><p>s</p></th><th class="head"><p>u</p></th></tr></thead><tbody><tr><th class="stub"><p>Sprung</p></th><td><p>6</p></td><td><p>6</p></td><td><p>6</p></td><td><p>5</p></td><td><p>6</p></td><td><p>2</p></td><td><p>6</p></td><td><p>0</p></td><td><p>6</p></td><td><p>1</p></td><td><p>6</p></td><td><p>6</p></td><td><p>6</p></td></tr></tbody></table></ld-card><ld-card class="incremental"><!--combinbing strike through: \u0336; combining underline: \u0332--><pre class="literal-block"><code>O r a n g̲ e̲ n , ␣ A n̲ a̲ n a̲ s ␣̲ u n d ␣ B̲ a̲ n̲ a̲ n̲ e̲ n̲
B a n a n̶̲ e̶̲
          B a n a n e̶̲
            B a n a n e̶̲
                B a n a n e̶̲
                    B a n a n e̶̲
                                B a n a n e̶̲
                                    B a n a n e̶̲
                                        B̲ a̲ n̲ a̲ n̲ e̲
                                          B a n a n e̶̲</code></pre><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Unterschrichen sind die durchgeführten Vergleiche. Die Verschiebung des Musters erfolgt anhand des letzten Zeichens des Musters und des Textes, dass nicht übereinstimmt. Dabei ist die Verschiebung durch das Zeichen des Textes gegeben, das nicht mit dem Muster übereinstimmt.</p></aside></ld-card><ld-card class="incremental"><p class="rubric">Komplexität</p><p>Im guten und häufigen Fall erreicht das Verfahren <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mfrac><mi>n</mi><mi>m</mi></mfrac><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\frac{n}{m})</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.095em;vertical-align:-0.345em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.6954em;"><span style="top:-2.655em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">m</span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.394em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.345em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mclose">)</span></span></span></span></span>, aber in speziellen Fällen ist auch <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>n</mi><mo>⋅</mo><mi>m</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(n\cdot m)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">m</span><span class="mclose">)</span></span></span></span></span> möglich.</p></ld-card></ld-deck><ld-supplemental><p>Bei der Sprungtabelle handelt es sich um eine Tabelle, die <em>für jedes Zeichen des Alphabets des Textes</em> die Verschiebung des Musters angibt, wenn das Zeichen im Text mit dem Muster nicht übereinstimmt. Die Zeichen <code class="java"><span class="name class">A</span></code>, <code class="java"><span class="name class">O</span></code>, <code class="java">d</code>, <code class="java">g</code>, <code class="java">r</code>, <code class="java">s</code>, <code class="java">u</code>, <code class="java"><span class="punctuation">,</span></code> und das Leerzeichen haben die größte Verschiebung, da sie nicht im Muster vorkommen. Das Zeichen <code class="java">e</code> hat die kleinste Verschiebung, da es das letzte Zeichen des Musters ist. Das Zeichen <code class="java">n</code> hat eine Verschiebung von 1, da es im Muster  als vorletztes Zeichen vorkommt, das Zeichen <code class="java">a</code> hat eine Verschiebung von 2, da das späteste Vorkommen an drittletzer Stelle ist, und das Zeichen <code class="java"><span class="name class">B</span></code> hat eine Verschiebung von 5, da es nur einmal vorkommt und das erste Zeichen des Musters ist.</p></ld-supplemental></ld-topic>
