<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 57 17.4" font-size="1.2">
    <!-- Kommerzielles VPN: Der Nutzer tunnelt seinen Verkehr zum
         Anbieter, der ihn über seine Firewall ins Internet weiterleitet.

         Gestaltung:
         - Rechner im internen Netz: ld-success
         - einzelne Server ld-info (die Server sind nicht homogen), 
         - Gate/Bastion Host: ld-info,
         - Router/Firewall: ld-muted
         - blockierter Verkehr: ld-danger.
         
         Symbole #net-…: shared/svgs/net-symbols.svg. -->

    <!-- === Nutzer === -->
    <g class="ld-success">
        <use href="#net-laptop" x="1.5" y="8.6"/>
    </g>
    <!-- === VPN-Anbieter mit Firewall === -->
    <g class="ld-info">
        <use href="#net-server" x="49" y="8"/>
    </g>
    <text class="ld-label" x="52" y="16.6" text-anchor="middle" font-size="1">VPN-Anbieter</text>
    <g>
        <path class="ld-line" d="M 52 8 L 52 2.5 L 42.7 2.5"/>
        <path class="ld-line" d="M 41.3 2.5 L 27 2.5 L 27 9.62"/>
    </g>
    <g class="ld-muted">
        <rect class="ld-cell" x="40.5" y="0.5" width="3" height="7.6" rx="1.2" stroke="currentColor" stroke-width="0.22"/>
    </g>
    <circle cx="42" cy="2.5" r="0.7" stroke="currentColor" stroke-width="0.12" fill="var(--background-color)"/>
    <use href="#net-flame" x="42" y="5.6"/>

    <!-- === Internet === -->
    <use href="#net-cloud" x="25" y="12.1"/>
    <text class="ld-label" x="25" y="14.2" text-anchor="middle" font-weight="bold">Internet</text>

    <!-- === VPN-Tunnel vom Nutzer zum Anbieter === -->
    <g class="ld-accent">
        <rect class="ld-panel ld-dashed" x="9.8" y="10.7" width="39" height="1.4" rx="0.7"
              stroke="currentColor" stroke-width="0.12"/>
    </g>
    <line class="ld-line" x1="9.8" y1="11.4" x2="49" y2="11.4"/>
</svg>
