<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 26" font-size="1.2">
    <!-- Unabhängiges Netz ("ideale Situation"): ein vollständig abgeschottetes
         Netz ohne Verbindung nach außen. Rechner im internen Netz: ld-success, einzelne Server ld-info (die
         Server sind nicht homogen), Gate/Bastion Host: ld-info,
         Router/Firewall: ld-muted, blockierter Verkehr: ld-danger.
         Symbole #net-…: shared/svgs/net-symbols.svg. -->

    <!-- === Abgeschottetes Netz: rundum geschlossene Grenze === -->
    <g class="ld-muted">
        <path class="ld-cell" fill-rule="evenodd" stroke="currentColor" stroke-width="0.12"
              d="M 1.5 0.5 H 38.5 A 1 1 0 0 1 39.5 1.5 V 24.5 A 1 1 0 0 1 38.5 25.5 H 1.5 A 1 1 0 0 1 0.5 24.5 V 1.5 A 1 1 0 0 1 1.5 0.5 Z
                 M 2.6 2 H 37.4 A 0.6 0.6 0 0 1 38 2.6 V 23.4 A 0.6 0.6 0 0 1 37.4 24 H 2.6 A 0.6 0.6 0 0 1 2 23.4 V 2.6 A 0.6 0.6 0 0 1 2.6 2 Z"/>
    </g>
    <use href="#net-flame" x="2.2" y="23.3"/>

    <!-- === Netz: Client oben, Server unten am Bus === -->
    <g>
        <line class="ld-line" x1="20" y1="9.8" x2="20" y2="12.5"/>
        <line class="ld-line" x1="7" y1="12.5" x2="33" y2="12.5"/>
        <line class="ld-line" x1="7" y1="12.5" x2="7" y2="15"/>
        <line class="ld-line" x1="15" y1="12.5" x2="15" y2="15"/>
        <line class="ld-line" x1="25" y1="12.5" x2="25" y2="15"/>
        <line class="ld-line" x1="33" y1="12.5" x2="33" y2="15"/>
    </g>
    <g class="ld-success">
        <use href="#net-laptop" x="16.3" y="4"/>
        <use href="#net-server" x="4" y="15"/>
        <use href="#net-server" x="12" y="15"/>
        <use href="#net-server" x="22" y="15" class="ld-info"/>
        <use href="#net-server" x="30" y="15"/>
    </g>
</svg>
