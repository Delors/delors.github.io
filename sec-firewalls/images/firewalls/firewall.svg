<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 35.2" font-size="1.2">
    <!-- Firewall als Schutzschicht zwischen internem Netz und Internet.
         Rechner im internen Netz: ld-success, einzelne Server ld-info (die
         Server sind nicht homogen), Gate/Bastion Host: ld-info,
         Router/Firewall: ld-muted, blockierter Verkehr: ld-danger.
         Symbole #net-…: shared/svgs/net-symbols.svg. -->

    <!-- === Internes Netz === -->
    <g>
        <line class="ld-line" x1="21" y1="6.8" x2="21" y2="9"/>
        <line class="ld-line" x1="5" y1="9" x2="36.5" y2="9"/>
        <line class="ld-line" x1="5" y1="9" x2="5" y2="11"/>
        <line class="ld-line" x1="12.5" y1="9" x2="12.5" y2="11"/>
        <line class="ld-line" x1="23.5" y1="9" x2="23.5" y2="11"/>
        <line class="ld-line" x1="36.5" y1="9" x2="36.5" y2="11"/>
    </g>
    <g class="ld-success">
        <use href="#net-laptop" x="17.3" y="1"/>
        <use href="#net-server" x="2" y="11"/>
        <use href="#net-server" x="9.5" y="11"/>
        <use href="#net-server" x="20.5" y="11" class="ld-info"/>
        <use href="#net-server" x="33.5" y="11"/>
    </g>

    <!-- === Verbindungen durch die Firewall ins Internet === -->
    <g>
        <line class="ld-line" x1="18" y1="9" x2="18" y2="20.8"/>
        <line class="ld-line" x1="18" y1="22.2" x2="18" y2="29.83"/>
        <line class="ld-line" x1="29" y1="9" x2="29" y2="20.8"/>
        <line class="ld-line" x1="29" y1="22.2" x2="26.3" y2="28.47"/>
    </g>

    <!-- === Firewall: Schutzschicht zwischen internem und externem Netz === -->
    <g class="ld-muted">
        <rect class="ld-cell" x="0.5" y="19.5" width="43" height="4" rx="1" stroke="currentColor" stroke-width="0.22"/>
        <use href="#net-vents" x="2" y="20.6"/>
        <use href="#net-vents" x="2" y="22.4"/>
        <use href="#net-vents" x="40.4" y="20.6"/>
        <use href="#net-vents" x="40.4" y="22.4"/>
    </g>
    <use href="#net-flame" x="5.6" y="21.5"/>
    <g stroke="currentColor" stroke-width="0.12" fill="var(--background-color)">
        <circle cx="18" cy="21.5" r="0.7"/>
        <circle cx="29" cy="21.5" r="0.7"/>
    </g>

    <!-- === Internet === -->
    <use href="#net-cloud" x="23.5" y="31"/>
    <text class="ld-label" x="23.5" y="31.9" text-anchor="middle" font-weight="bold" font-size="1.4">Internet</text>

    <!-- === Angriffe aus dem Internet werden an der Firewall abgewehrt === -->
    <g class="ld-danger">
        <line class="ld-connector ld-dashed" x1="18.83" y1="28.59" x2="10.32" y2="24.18"/>
        <use href="#net-blocked" x="9" y="23.5"/>
        <line class="ld-connector ld-dashed" x1="23.5" y1="27.66" x2="23.5" y2="24.99"/>
        <use href="#net-blocked" x="23.5" y="23.5"/>
        <line class="ld-connector ld-dashed" x1="27.53" y1="28.92" x2="36.68" y2="24.18"/>
        <use href="#net-blocked" x="38" y="23.5"/>
    </g>
</svg>
