<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 23 31" font-size="1.2">
    <!-- Dual-homed Host: ein Rechner mit zwei Netzwerkkarten trennt internes
         Netz und Internet. Rechner im internen Netz: ld-success, einzelne Server ld-info (die
         Server sind nicht homogen), Gate/Bastion Host: ld-info,
         Router/Firewall: ld-muted, blockierter Verkehr: ld-danger.
         Symbole #net-…: shared/svgs/net-symbols.svg. -->

    <!-- === Internes Netz === -->
    <g>
        <line class="ld-line" x1="4" y1="7.8" x2="4" y2="10"/>
        <line class="ld-line" x1="15" y1="7.8" x2="15" y2="10"/>
        <line class="ld-line" x1="4" y1="10" x2="15" y2="10"/>
        <line class="ld-line" x1="9.5" y1="10" x2="9.5" y2="13"/>
        <line class="ld-line" x1="9.5" y1="19.8" x2="9.5" y2="23.66"/>
    </g>
    <g class="ld-success">
        <use href="#net-server" x="1" y="1"/>
        <use href="#net-laptop" x="11.3" y="2"/>
    </g>

    <!-- === Dual-homed Host: zwei Netzwerkkarten (intern / extern) === -->
    <g class="ld-info">
        <use href="#net-server" x="6.5" y="13"/>
        <g fill="var(--background-color)" stroke="currentColor" stroke-width="0.14">
            <circle cx="9.5" cy="13" r="0.55"/>
            <circle cx="9.5" cy="19.8" r="0.55"/>
        </g>
    </g>
    <use href="#net-flame" x="12.9" y="18.6"/>
    <g class="ld-label">
        <text x="14.6" y="15.4">Dual-homed</text>
        <text x="14.6" y="16.9">Host</text>
    </g>

    <!-- === Internet === -->
    <use href="#net-cloud" x="9.5" y="27"/>
    <text class="ld-label" x="9.5" y="27.9" text-anchor="middle" font-weight="bold" font-size="1.4">Internet</text>
</svg>
