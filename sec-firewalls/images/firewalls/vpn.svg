<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 25" font-size="1.2">
    <!-- VPN: zwei Firmennetze sind über einen verschlüsselten Tunnel
         (ld-accent) zwischen ihren Firewalls durch das Internet verbunden.
         Rechner im internen Netz: ld-success, einzelne Server ld-info (die
         Server sind nicht homogen), Gate/Bastion Host: ld-info,
         Router/Firewall: ld-muted, blockierter Verkehr: ld-danger.
         Symbole #net-…: shared/svgs/net-symbols.svg. -->

    <!-- === Linkes Firmennetz mit Firewall === -->
    <g>
        <line class="ld-line" x1="7" y1="6.8" x2="7" y2="9"/>
        <line class="ld-line" x1="3.5" y1="9" x2="24.8" y2="9"/>
        <line class="ld-line" x1="3.5" y1="9" x2="3.5" y2="11"/>
        <line class="ld-line" x1="11" y1="9" x2="11" y2="11"/>
        <line class="ld-line" x1="18.5" y1="9" x2="18.5" y2="11"/>
    </g>
    <g class="ld-success">
        <use href="#net-laptop" x="3.3" y="1"/>
        <use href="#net-server" x="0.5" y="11"/>
        <use href="#net-server" x="8" y="11" class="ld-info"/>
        <use href="#net-server" x="15.5" y="11"/>
    </g>
    <g class="ld-muted">
        <rect class="ld-cell" x="24" y="0.5" width="3" height="24" rx="1.2" stroke="currentColor" stroke-width="0.22"/>
    </g>
    <use href="#net-flame" x="25.5" y="21.8"/>
    <circle cx="25.5" cy="9" r="0.7" stroke="currentColor" stroke-width="0.12" fill="var(--background-color)"/>

    <!-- === Rechtes Firmennetz mit Firewall === -->
    <g>
        <line class="ld-line" x1="63" y1="6.8" x2="63" y2="9"/>
        <line class="ld-line" x1="66.5" y1="9" x2="45.2" y2="9"/>
        <line class="ld-line" x1="66.5" y1="9" x2="66.5" y2="11"/>
        <line class="ld-line" x1="59" y1="9" x2="59" y2="11"/>
        <line class="ld-line" x1="51.5" y1="9" x2="51.5" y2="11"/>
    </g>
    <g class="ld-success">
        <use href="#net-laptop" x="59.3" y="1"/>
        <use href="#net-server" x="63.5" y="11" class="ld-info"/>
        <use href="#net-server" x="56" y="11"/>
        <use href="#net-server" x="48.5" y="11"/>
    </g>
    <g class="ld-muted">
        <rect class="ld-cell" x="43" y="0.5" width="3" height="24" rx="1.2" stroke="currentColor" stroke-width="0.22"/>
    </g>
    <use href="#net-flame" x="44.5" y="21.8"/>
    <circle cx="44.5" cy="9" r="0.7" stroke="currentColor" stroke-width="0.12" fill="var(--background-color)"/>

    <!-- === Internet === -->
    <use href="#net-cloud" x="35" y="10.4"/>
    <text class="ld-label" x="35" y="12.4" text-anchor="middle" font-weight="bold">Internet</text>

    <!-- === VPN-Tunnel zwischen den Firewalls (verschlüsselt) === -->
    <g class="ld-accent">
        <rect class="ld-panel ld-dashed" x="26.2" y="8.3" width="17.6" height="1.4" rx="0.7"
              stroke="currentColor" stroke-width="0.12"/>
    </g>
    <g>
        <line class="ld-line" x1="26.2" y1="9" x2="43.8" y2="9"/>
    </g>
</svg>
