<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 35.4" font-size="1.2">
    <!-- Screened Subnet: Ein interner und ein externer Router umschließen das
         äußere Netz (DMZ) mit dem Gate. Rechner im internen Netz: ld-success, einzelne Server ld-info (die
         Server sind nicht homogen), Gate/Bastion Host: ld-info,
         Router/Firewall: ld-muted, blockierter Verkehr: ld-danger.
         Symbole #net-…: shared/svgs/net-symbols.svg. -->

    <!-- === Firewall-System: interner Router, äußeres Netz (DMZ), Gate, externer Router === -->
    <g class="ld-muted">
        <rect class="ld-panel" x="0.5" y="9.8" width="45" height="17.8" rx="0.6"/>
    </g>
    <use href="#net-flame" x="2.4" y="25.4"/>

    <!-- === Inneres Netz === -->
    <g>
        <line class="ld-line" x1="6" y1="7.3" x2="6" y2="11"/>
        <line class="ld-line" x1="20.2" y1="7.3" x2="20.2" y2="11"/>
    </g>
    <g class="ld-success">
        <use href="#net-server" x="3" y="0.5"/>
        <use href="#net-laptop" x="16.5" y="1.5"/>
    </g>
    <text class="ld-label" x="13.1" y="8.9" text-anchor="middle">inneres Netz</text>

    <!-- === Interner Router === -->
    <g class="ld-muted">
        <rect class="ld-cell" x="2" y="11" width="22" height="4.5" rx="1.12" stroke="currentColor" stroke-width="0.22"/>
        <use href="#net-vents" x="3.5" y="12.1"/>
        <use href="#net-vents" x="3.5" y="14.4"/>
        <use href="#net-vents" x="20.9" y="12.1"/>
        <use href="#net-vents" x="20.9" y="14.4"/>
    </g>
    <text class="ld-label" x="13" y="13.7" text-anchor="middle">interner Router</text>

    <!-- === Äußeres Netz (DMZ) mit Gate === -->
    <g>
        <path class="ld-line" d="M 8 15.5 L 8 20.5 L 40 20.5 L 40 18.8"/>
        <line class="ld-line" x1="32" y1="20.5" x2="32" y2="22.2"/>
    </g>
    <text class="ld-label" x="20" y="19.9" text-anchor="middle">äußeres Netz</text>
    <g class="ld-info">
        <use href="#net-server" x="37" y="12"/>
    </g>
    <text class="ld-label" x="36.2" y="15.8" text-anchor="end">Gate</text>

    <!-- === Externer Router === -->
    <g class="ld-muted">
        <rect class="ld-cell" x="21" y="22.2" width="22" height="4.5" rx="1.12" stroke="currentColor" stroke-width="0.22"/>
        <use href="#net-vents" x="22.5" y="23.3"/>
        <use href="#net-vents" x="22.5" y="25.6"/>
        <use href="#net-vents" x="39.9" y="23.3"/>
        <use href="#net-vents" x="39.9" y="25.6"/>
    </g>
    <text class="ld-label" x="32" y="24.9" text-anchor="middle">externer Router</text>
    <line class="ld-line" x1="32" y1="26.7" x2="32" y2="28.06"/>

    <!-- === Internet === -->
    <use href="#net-cloud" x="32" y="31.4"/>
    <text class="ld-label" x="32" y="32.3" text-anchor="middle" font-weight="bold" font-size="1.4">Internet</text>
</svg>
