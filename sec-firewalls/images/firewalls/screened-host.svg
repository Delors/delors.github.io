<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 43 42" font-size="1.2">
    <!-- Screened Host: Der Screening Router lässt nur Verkehr von / zum Gate
         durch; logische Verbindungen (ld-success, gestrichelt) laufen über
         das Gate. Rechner im internen Netz: ld-success, einzelne Server ld-info (die
         Server sind nicht homogen), Gate/Bastion Host: ld-info,
         Router/Firewall: ld-muted, blockierter Verkehr: ld-danger.
         Symbole #net-…: shared/svgs/net-symbols.svg. -->

    <!-- === Firewall-System: Router und Gate === -->
    <g class="ld-muted">
        <path class="ld-panel" d="M 21.3 4.3 H 33 V 30 H 5.5 V 20.3 H 21.3 Z"/>
    </g>
    <use href="#net-flame" x="31.7" y="28.1"/>

    <!-- === Internes Netz (physische Verbindungen) === -->
    <g>
        <line class="ld-line" x1="4" y1="12.8" x2="4" y2="16"/>
        <line class="ld-line" x1="13.7" y1="12.8" x2="13.7" y2="16"/>
        <line class="ld-line" x1="26" y1="12.8" x2="26" y2="16"/>
        <line class="ld-line" x1="4" y1="16" x2="26" y2="16"/>
        <line class="ld-line" x1="18" y1="16" x2="18" y2="22"/>
        <line class="ld-line" x1="18" y1="26.5" x2="18" y2="34.66"/>
    </g>
    <g class="ld-success">
        <use href="#net-server" x="1" y="6"/>
        <use href="#net-laptop" x="10" y="7"/>
    </g>
    <g class="ld-info">
        <use href="#net-server" x="23" y="6"/>
    </g>
    <text class="ld-label" x="29.4" y="9.9">Gate</text>

    <!-- === Screening Router === -->
    <g class="ld-muted">
        <rect class="ld-cell" x="7" y="22" width="23" height="4.5" rx="1.12" stroke="currentColor" stroke-width="0.22"/>
        <use href="#net-vents" x="8.5" y="23.1"/>
        <use href="#net-vents" x="8.5" y="25.4"/>
        <use href="#net-vents" x="26.9" y="23.1"/>
        <use href="#net-vents" x="26.9" y="25.4"/>
    </g>
    <text class="ld-label" x="18.5" y="24.7" text-anchor="middle">Router</text>

    <!-- === Internet === -->
    <use href="#net-cloud" x="18" y="38"/>
    <text class="ld-label" x="18" y="38.9" text-anchor="middle" font-weight="bold" font-size="1.4">Internet</text>

    <!-- === Logische Verbindungen: nur über das Gate === -->
    <g class="ld-success">
        <path class="ld-connector ld-dashed" d="M 14.9 6.6 C 15.6 1.2, 24.3 0.9, 25.2 5.62"/>
        <path class="ld-connector ld-dashed" d="M 26.8 5.8 C 26.2 -0.4, 13.4 -0.2, 12.9 6.62"/>
        <line class="ld-connector" x1="25" y1="12.8" x2="25" y2="21.82"/>
        <line class="ld-connector" x1="27" y1="22" x2="27" y2="12.98"/>
        <line class="ld-connector" x1="21.7" y1="26.5" x2="21.7" y2="35.52"/>
        <line class="ld-connector" x1="23.3" y1="38.01" x2="23.3" y2="26.68"/>
    </g>

    <!-- === Blockiert: direkter Verkehr von / zu internen Rechnern === -->
    <g class="ld-danger">
        <line class="ld-connector ld-dashed" x1="15.6" y1="12.8" x2="15.6" y2="20.51"/>
        <use href="#net-blocked" x="15.6" y="22"/>
        <line class="ld-connector ld-dashed" x1="12.5" y1="36.83" x2="12.5" y2="27.99"/>
        <use href="#net-blocked" x="12.5" y="26.5"/>
    </g>

    <!-- === Legende === -->
    <g class="ld-success">
        <line class="ld-connector ld-dashed" x1="34.5" y1="20" x2="41.32" y2="20"/>
    </g>
    <g class="ld-label" text-anchor="middle" font-size="1">
        <text x="38" y="21.8">logische</text>
        <text x="38" y="23.1">Verbindung</text>
    </g>
</svg>
