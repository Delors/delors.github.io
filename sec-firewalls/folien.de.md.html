<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg">
<defs>

    <!-- Gemeinsame Symbole für Netzwerk-Diagramme (Rechner, Server, Internet,
         Firewall, …) aller Foliensätze. Präfix "net-".

         Einbinden im Frontmatter eines Foliensatzes:
             ld:
               include-globals:
                 - ../shared/svgs/net-symbols.svg

         Verwendung: <use href="#net-…" x="…" y="…"/>.

         Farbe: Alle Formen verwenden currentColor; die Farbe folgt also
         color. Eine Gruppe setzt sie (class="ld-success"), eine einzelne
         Instanz kann sie mit einer Farbklasse am <use> ändern:
             <use href="#net-server" class="ld-info" x="…" y="…"/>
         CSS-Selektoren greifen nicht in den Shadow-Tree eines <use>, vererbte
         Eigenschaften (color, Custom Properties) dagegen schon. Die Formen
         verwenden deshalb Deckkraft-Attribute statt der ld-Klassen
         (fill-opacity 0.1 = ld-panel, 0.3 = ld-cell).

         Anpassung: Custom Properties, jeweils mit Standardwert im var(); sie
         werden am <use> (style="--net-…: …") oder an einer umgebenden Gruppe
         bzw. am <svg> gesetzt. Übersicht:
             --net-server-stroke-width       (0.18)
             --net-server-slot-stroke-width  (0.08)
             --net-server-frame-color        (currentColor)
             --net-cloud-stroke-width        (0.16)
             --net-flame-color               (#f97316)
             --net-flame-core-color          (#facc15)

         Keine viewBox: x/y des <use> verschieben das Symbol, die Koordinaten
         entsprechen denen der Diagramme. overflow="visible", weil ein
         <symbol> sonst an seinem Viewport abschneidet. -->

    <!-- Server: 6 × 6,8, Ursprung oben links.
         --net-server-stroke-width       Rahmen                  (0.18)
         --net-server-slot-stroke-width  Einschübe               (0.08)
         --net-server-frame-color        Farbe des Rahmens       (currentColor)
         Ein dunklerer Rahmen: --net-server-frame-color:
         oklch(from currentColor calc(l * 0.5) c h). -->
    <symbol id="net-server" overflow="visible">
        <rect x="0" y="0" width="6" height="6.8" rx="0.6"
              fill="currentColor" fill-opacity="0.1"
              style="stroke: var(--net-server-frame-color, currentColor);
                     stroke-width: var(--net-server-stroke-width, 0.18);"/>
        <g fill="currentColor" fill-opacity="0.3" stroke="currentColor"
           style="stroke-width: var(--net-server-slot-stroke-width, 0.08);">
            <rect x="0.7" y="0.7" width="4.6" height="1.5" rx="0.25"/>
            <rect x="0.7" y="2.5" width="4.6" height="1.5" rx="0.25"/>
            <rect x="0.7" y="4.3" width="4.6" height="1.5" rx="0.25"/>
        </g>
        <g fill="currentColor">
            <circle cx="1.4" cy="1.45" r="0.22"/>
            <circle cx="1.4" cy="3.25" r="0.22"/>
            <circle cx="1.4" cy="5.05" r="0.22"/>
        </g>
    </symbol>

    <!-- Laptop (Client mit Browser): Bildschirm 0,2 … 7,2 × 0 … 4,8,
         Tastatur -0,7 … 8,1 × 4,8 … 5,8; Mitte x = 3,7. -->
    <symbol id="net-laptop" overflow="visible">
        <rect x="0.2" y="0" width="7" height="4.8" rx="0.4"
              fill="currentColor" fill-opacity="0.1"
              stroke="currentColor" stroke-width="0.18"/>
        <rect x="0.7" y="0.5" width="6" height="1" rx="0.2"
              fill="none" stroke="currentColor" stroke-width="0.08"/>
        <g fill="currentColor">
            <circle cx="1.1" cy="1" r="0.13"/>
            <circle cx="1.55" cy="1" r="0.13"/>
            <circle cx="2" cy="1" r="0.13"/>
        </g>
        <g fill="currentColor" fill-opacity="0.3">
            <rect x="2.7" y="0.75" width="3.6" height="0.5" rx="0.25"/>
            <rect x="0.8" y="2" width="4.6" height="0.45" rx="0.2"/>
            <rect x="0.8" y="2.9" width="5.6" height="0.45" rx="0.2"/>
            <rect x="0.8" y="3.8" width="3.4" height="0.45" rx="0.2"/>
        </g>
        <path d="M 0.1 4.8 L 7.3 4.8 L 8.1 5.8 L -0.7 5.8 Z"
              fill="currentColor" fill-opacity="0.3"
              stroke="currentColor" stroke-width="0.18" stroke-linejoin="round"/>
    </symbol>

    <!-- Internet-Wolke: ca. 12,8 × 7,4, Ursprung in der Mitte
         (x -6,6 … 6,2, y -3,7 … 3,7). Die Beschriftung steht im Diagramm. -->
    <symbol id="net-cloud" overflow="visible">
        <path d="M -3.67 3.21 C -5.08 3.21 -6.09 2.10 -5.89 0.78
                 C -6.59 0.38 -6.39 -1.03 -5.23 -1.23
                 C -5.18 -2.54 -3.72 -3.30 -2.51 -2.54
                 C -1.75 -3.65 0.82 -3.70 1.67 -2.39
                 C 3.44 -2.94 5.05 -1.83 4.55 -0.32
                 C 6.16 -0.02 6.21 2.20 4.70 2.80
                 C 4.30 3.51 2.38 3.71 1.47 3.11 L -3.67 3.21 Z"
              fill="var(--background-color)" stroke="currentColor"
              style="stroke-width: var(--net-cloud-stroke-width, 0.16);"/>
    </symbol>

    <!-- Firewall-Flamme: 2,2 × 3,6, Ursprung in der Mitte. Feste Farben,
         weil sie Bedeutung tragen und auf Hell und Dunkel lesbar sind. -->
    <symbol id="net-flame" overflow="visible">
        <path d="M 0 -1.8 C -0.8 -1 -1.1 -0.4 -1.1 0.2 C -1.1 1.2 -0.4 1.8 0 1.8
                 C 0.4 1.8 1.1 1.2 1.1 0.2 C 1.1 -0.3 0.8 -0.7 0.5 -1.1
                 C 0.6 -0.5 0.3 -0.1 0 -0.1 C -0.2 -0.1 -0.3 -0.3 -0.2 -0.6
                 C -0.1 -1 0 -1.4 0 -1.8 Z"
              style="fill: var(--net-flame-color, #f97316);"/>
        <path d="M 0 0 C -0.3 0.3 -0.4 0.6 -0.4 0.9 C -0.4 1.3 -0.2 1.5 0 1.5
                 C 0.2 1.5 0.4 1.3 0.4 0.9 C 0.4 0.5 0.2 0.3 0 0 Z"
              style="fill: var(--net-flame-core-color, #facc15);"/>
    </symbol>

    <!-- Lüftungsschlitze eines Geräts: drei Punkte, 1,6 breit, Ursprung am
         ersten Punkt. -->
    <symbol id="net-vents" overflow="visible">
        <g fill="currentColor">
            <circle cx="0" cy="0" r="0.16"/>
            <circle cx="0.8" cy="0" r="0.16"/>

    <!-- Plaketten "blockiert" / "erlaubt": Kreis mit Radius 1,1, Ursprung in

        <line x1="-0.78" y1="0.78" x2="0.78" y2="-0.78"

        <path d="M -0.65 0 L -0.2 0.5 L 0.7 -0.6" fill="none"
              stroke="currentColor" stroke-width="0.32"

    </symbol>

</defs>

        <use href="#net-server" x="4" y="15"/>
        <use href="#net-server" x="12" y="15"/>
        <use href="#net-server" x="22" y="15" class="ld-info"/>
        <use href="#net-server" x="30" y="15"/>
    </g>
</svg>
</div><dl class="incremental-list field-list simple"><dt>Vorteile<span class="colon">:</span></dt><dd><ul class="simple"><li><p>keinerlei Angriffsmöglichkeiten von außen</p></li></ul></dd><dt>Nachteile<span class="colon">:</span></dt><dd><ul class="simple"><li><p>kein Schutz gegen Insider</p></li><li><p>kein Zugang zum Internet</p></li></ul></dd></dl><ld-supplemental embed-in-document-flow=""><p>Wie bereits diskutiert gibt es auch Angriffsmuster gegen Air-Gapped-Systeme. Ein Beispiel ist der Stuxnet-Wurm, der sich initial über USB-Sticks verbreitet.</p><p>Wenn man kein Zugang zum Internet hat ist das Einspielen von Updates ist nur über Umwege möglich. Aber man hat zum Beispiel auch keinen Zugriff auf externe Dienste wie NTP.</p></ld-supplemental></ld-topic>
<ld-topic id="von-der-notwendigkeit-des-schutzes-von-rechnern"><h2>Von der Notwendigkeit des Schutzes von Rechnern</h2><blockquote class="epigraph"><p>[...] Züger und sein Team hätten [...] erst kürzlich ein Experiment durchgeführt, [...]. Sie hätten einen Computer "ohne jeglichen Schutz" mit dem Internet verbunden, um zu sehen, wie lange es dauere, bis er befallen sei. Konkrete Details zur Konfiguration dieses Systems werden zwar nicht genannt, angeblich war der Rechner aber schon nach 20 Minuten infiltriert.</p><p class="attribution">—<a class="reference external" href="https://www.golem.de/news/iot-hacker-missbrauchen-zahnbuersten-fuer-ddos-angriffe-2402-181921.html">Golem.de 6.2.2024</a></p></blockquote></ld-topic>
<ld-topic id="schutzschicht-zwischen-internem-und-externem-netz"><h2>Schutzschicht zwischen internem und externem Netz</h2><ld-supplemental embed-in-document-flow=""><p>Eine Firewall schafft zwischen verbundenen Netzen Sicherheitsdomänen mit unterschiedlichem Schutzbedarf. Eine wichtige Teilaufgabe ist das Ausarbeiten von Sicherheitsrichtlinien.</p></ld-supplemental><div class="align-center" style="width: 34ch; height: 27.2ch;" aria-label="Schutzschicht zwischen internem und externem Netz"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 35.2" font-size="1.2">

<ld-topic id="realisierung-von-virtual-private-networks-vpn"><h2>Realisierung von Virtual Private Networks (VPN)</h2><div class="align-center" style="width: 66ch; height: 23.57ch;" aria-label="Realisierung von Virtual Private Networks (VPN)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 25" font-size="1.2">

<ld-topic id="kommerzielle-vpns-fur-endnutzer"><h2>Kommerzielle VPNs für Endnutzer</h2><div class="align-center" style="width: 48ch; height: 14.65ch;" aria-label="Einsatz von Virtual Private Networks (VPN) für Privatnutzer"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 57 17.4" font-size="1.2">

         Gestaltung:

         - Gate/Bastion Host: ld-info,
         - Router/Firewall: ld-muted
         - blockierter Verkehr: ld-danger.
         
         Symbole #net-…: shared/svgs/net-symbols.svg. -->

    <g>
        <path class="ld-line" d="M 52 8 L 52 2.5 L 42.7 2.5"/>

    <!-- === VPN-Tunnel vom Nutzer zum Anbieter === -->
    <g class="ld-accent">

    </g>

</div><ld-supplemental><p><strong>Motivation</strong></p><ul class="simple"><li><p>Schutz der Privatsphäre; der ISP kennt nicht mehr die Webseiten, die man aufruft.</p></li><li><p>Die IP-Adresse des Nutzers ist den aufgerufenen Webseiten nicht mehr bekannt und kann deswegen der Umgehung von Geo-Blocking dienen.</p></li></ul><p><strong>Nachteile?</strong></p><ul class="simple"><li><p>Vertrauen in den VPN-Anbieter muss vorhanden sein. Insbesondere, beim Einsatz zum Stärken der Privatsphäre, muss der VPN-Anbieter vertrauenswürdig sein und sollte ein so genannter „no-log“ Anbieter sein.</p></li><li><p>Es gibt auch (scheinbar kostenlose) VPN-Anbieter, die die Daten der Nutzer dann aber verkaufen (ehemals: <a class="reference external" href="https://techcrunch.com/2019/02/21/facebook-removes-onavo/?guccounter=1&#x26;guce_referrer=aHR0cHM6Ly93d3cuZ29vZ2xlLmNvbS8&#x26;guce_referrer_sig=AQAAAGVIppEgEOd9Z0FoMbmk2TCleRmD9wCMWDmIzGYEjIo1c7Cmz8NpiSoibthFG5IZQzmZ-kiJq-5Wj1bj21byh7YUrC_aSJJk1Bapwz80GSgzLFS-LHCF2OOetUYLSKwEG7W75znuqJJBJcNTTbtJ1UGB95Yu90saK9aIIkEywcRq">Facebook Onavo</a>).</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="schutz-auf-den-schichten-des-tcp-ip-stacks"><h2>Schutz auf den Schichten des TCP/IP Stacks</h2><p>Zentraler Schutz des gesamten internen Netzwerks durch:</p><ul class="incremental-list"><li><p>Paket Filter (<span class="eng">Packet Filtering</span>)</p><ul class="list-with-explanations"><li><p>Blockieren bestimmter IP-Empfänger-Adressen (extern / intern)</p></li><li><p>Blockieren bestimmter IP-Absender-Adressen (extern / intern)</p><p>(z. B. aus dem Internet mit internen IP-Absender-Adressen)</p></li><li><p>Blockieren bestimmter Dienste; ggf. nur für bestimmte IP-Adressen</p></li></ul></li><li><p>Filter auf Anwendungsebene (<span class="eng">Application-level Filtering</span>)</p><ul class="list-with-explanations"><li><p>inhaltsbezogene Filterung der Verkehrsdaten eines Dienstes</p><p>(z. B. Virenfilter oder Spamfilter)</p></li><li><p>wirkungslos bei verschlüsselten Verkehrsdaten</p></li></ul></li><li><p>Protokollierungsmöglichkeit der Kommunikation von / nach extern</p></li></ul><ld-supplemental><p>Firewalls (alleine) können die Struktur des Netzwerks nicht verbergen.</p></ld-supplemental></ld-topic>
<ld-topic id="dos-attacke-auf-anwendungsebene"><h2>DoS Attacke auf Anwendungsebene</h2><blockquote class="epigraph"><p>[...] Angriff auf die Kleinen</p><p>Waren bei früheren Spamangriffen massenhaft Accounts auf der größten Mastodon-Instanz <span class="docutils literal">mastodon.social</span> angelegt worden, die dann von dort ihre Inhalte verbreiteten, trifft es nun nicht die größte, sondern die kleinsten. Automatisiert werden dabei Instanzen ausgesucht, auf denen eine Registrierung ohne Überprüfung und sogar ohne ein Captcha möglich ist. Das können etwa solche mit wenigen Accounts sein, die von Enthusiasten etwa für eine Gemeinde betrieben werden. Waren die Verantwortlichen in den vergangenen Tagen nicht aufmerksam, wurden diese Instanzen dann regelrecht überrannt. Die Spam-Accounts verschickten massenhaft Nachrichten mit einem Bild des namensgebenden Frühstücksfleischs und Links zu Discord-Servern, die wohl lahmgelegt werden sollten.</p><p class="attribution">—<a class="reference external" href="https://www.heise.de/news/Mastodon-Spamwelle-zeigt-Schwaechen-auf-und-weckt-Sorge-vor-schlimmerer-Methode-9632055.html">Mastodon: Spamwelle zeigt Schwächen auf [...]</a></p></blockquote></ld-topic>
<ld-topic id="realisierungsmoglichkeiten-von-firewalls"><h2>Realisierungsmöglichkeiten von Firewalls</h2><ul class="incremental-list simple"><li><p>Hardware-Firewall</p><ul class="simple"><li><p>Screening Router</p></li><li><p>Application Gateway (auch Bastion Host)</p><ul class="simple"><li><p>(Reverse-)Proxy-Server für bestimmte Dienste</p></li><li><p>Endpunkt aus Sicht von Client-Software (HTTP-Browser, E-Mail, ...)</p></li><li><p>spezialisierte Server-Software</p></li></ul></li></ul></li><li><p>Software-Firewall (<em>Personal Firewall</em>)</p></li></ul><ld-supplemental embed-in-document-flow=""><p>Im Falle eines <span class="eng">Bastion Host</span>, ist dies der einzige unmittelbar aus dem Internet erreichbare Rechner.</p></ld-supplemental></ld-topic>
<ld-topic id="dual-homed-host"><h2>Dual-Homed Host</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><div class="align-center" style="width: 15.5ch; height: 20.89ch;" aria-label="Dual-Homed Host"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 23 31" font-size="1.2">

         Symbole #net-…: shared/svgs/net-symbols.svg. -->

        <use href="#net-server" x="1" y="1"/>

    <!-- === Dual-homed Host: zwei Netzwerkkarten (intern / extern) === -->
    <g class="ld-info">
        <use href="#net-server" x="6.5" y="13"/>
        <g fill="var(--background-color)" stroke="currentColor" stroke-width="0.14">
            <circle cx="9.5" cy="13" r="0.55"/>
            <circle cx="9.5" cy="19.8" r="0.55"/>
        </g>

    <g class="ld-label">
        <text x="14.6" y="15.4">Dual-homed</text>

    <!-- === Internet === -->

</div></ld-cell><ld-cell style="align-self:auto;"><p><strong>Aufbau</strong></p><ul class="simple"><li><p>zwei Netzwerkkarten: ggf. private interne Adressen</p></li><li><p>Screening Router &#x26; Gate: Packet Filter und Application-Level Filter</p></li><li><p>Proxy-Dienste installieren</p></li><li><p>Benutzer-Logins von extern</p></li></ul></ld-cell></ld-grid><aside class="admonition incremental" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>Bei der Konfiguration der Netzwerkkarten gilt:</p><p><em>IP-Pakete nicht automat. weiterleiten</em></p></aside></ld-topic>
<ld-topic id="screening-router"><h2>Screening Router</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><strong>Aufbau</strong></p><p>Programmierbarer Hardwarerouter mit simplen Filterfunktionen:</p><ul class="simple"><li><p>nur Paket-Header prüfen</p></li><li><p>schnelle Auswertung ermöglicht hohen Durchsatz</p></li><li><p>Realisierung eines Packet Filters</p></li></ul><aside class="admonition incremental-10" data-theme="assessment"><p class="admonition-title" data-theme="assessment-header"><span>Bewertung</span></p><ul class="columns simple"><li><ul class="positive-list incremental simple"><li><p>einfach und billig</p></li><li><p>flexibel</p></li></ul></li><li><ul class="negative-list incremental simple"><li><p>schwer zu testen</p></li><li><p>Protokollierung</p></li><li><p>Fernwartung</p></li><li><p>keine Inhaltsfilterung</p></li></ul></li></ul></aside></ld-cell><ld-cell class="width-50 incremental-1 fade-in" style="align-self:auto;"><div style="width: 12lh; height: 14.55lh;" aria-label="Screening Router"><svg xmlns="http://www.w3.org/2000/svg" viewBox="4.5 0.5 31 37.6" font-size="1.2">

    <!-- === Schritt 0: internes Netz (LAN), sofort sichtbar === -->

        <line class="ld-line" x1="25.5" y1="8" x2="25.5" y2="13"/>
        <line class="ld-line" x1="11" y1="13" x2="25.5" y2="13"/>
    </g>

    <!-- === Schritt 1: das (nicht vertrauenswürdige) Internet === -->
    <g class="incremental fade-in">
        <use href="#net-cloud" x="20" y="33.3"/>
        <text class="ld-label" x="20" y="34.199999999999996" text-anchor="middle" font-weight="bold" font-size="1.4">Internet</text>
    </g>

    <!-- === Schritt 2: Router / Firewall zwischen LAN und Internet === -->
    <g class="incremental fade-in">
        <line class="ld-line" x1="20" y1="13" x2="20" y2="18"/>
        <line class="ld-line" x1="20" y1="23" x2="20" y2="29.96"/>
        <g class="ld-muted">
            <rect class="ld-cell" x="5" y="18" width="30" height="5" rx="1.2" stroke="currentColor" stroke-width="0.22"/>

</div><p><strong>Aufbau</strong></p><ul class="simple"><li><p>Screening Router blockiert:</p><ul class="simple"><li><p>Pakete von / an interne Rechner (nicht Gate)</p></li><li><p>Source-Routed Pakete</p></li></ul></li><li><p>von extern nur Gate sichtbar</p></li><li><p>Pakete von intern nur via Gate</p></li><li><p>Gate bietet Proxy-Server (z. B. für E-Mail)</p></li></ul><ld-supplemental><p><em>Source-Routed Pakete</em> sind Pakete, die den Weg durch das Netzwerk explizit angeben. (<em>Source-routing</em> wird auch als <em>Path Addressing</em> bezeichnet und wird im Allgemeinen als Sicherheitsproblem angesehen.)</p><p>Gibt es für eine bestimmte Anwendung kein Application-level Proxy, dann kann auf einen für TCP/UDP generischen Proxy zurückgegriffen werden. Dieser arbeitet auf dem Session Layer und kann nur die Header-Informationen auswerten. Es handelt sich dann um ein <span class="eng">Circuit-level Proxy/Gateway</span>. Im Vergleich zu einem Application-level Proxy ist die Sicherheit geringer, da der Circuit-level Proxy nicht in der Lage ist, die Daten zu interpretieren.</p><p>Ein allgemeines Problem ist, dass viele Anwendungen auf generische Protokolle wie HTTP aufsetzen. Weiterhin betreiben einige Anwendungen „Port Hopping“, d. h. sie wechseln den Port wenn der Standardport nicht offen ist.</p><p>Eine Anforderung an „Next-generation Firewalls“ ist, dass diese die Analyse von den Daten einer Anwendung unabhängig vom Port und Protokoll ermöglichen.</p></ld-supplemental></ld-topic>
<ld-topic id="konfiguration-eines-gateways"><h2>Konfiguration eines Gateways</h2><p>Das Ziel der Konfiguration muss eine minimale angreifbare Oberfläche sein.</p><ul class="incremental-list simple"><li><p>Abschalten aller nicht-benötigten Netzdienste</p></li><li><p>Löschen aller nicht benötigter Programme</p></li><li><p>Rechte von <span class="docutils literal">/bin/sh</span> auf 500 setzen</p></li><li><p>Rechte aller Systemverzeichnisse auf 711 setzen</p></li><li><p>keine regulären Benutzerkennungen</p></li><li><p>root-Login mit Einmal-Passwortsystem bzw. 2-Faktor Authentifizierung</p></li><li><p>setzen von Platten- und Prozess-Quotas</p></li><li><p>volle Protokollierung, möglichst auf Hardcopy-Gerät</p></li><li><p>möglichst sichere, stabile und regelmäßig aktualisierte Betriebssystemversion einsetzen</p></li></ul><ld-supplemental><p>Die Rechte von <span class="docutils literal">/bin/sh</span> auf 500 setzen bedeutet, dass nur der Eigentümer (root) es ausführen kann.</p><p>Default:</p><pre class="code sh literal-block"><code>$ <span class="name function">ls</span> <span class="name variable">-al</span> /bin/sh
-rwxr-xr-x  <span class="literal number integer">1</span> root  wheel  <span class="literal number integer">101232</span> Oct  <span class="literal number integer">1</span> 06:10 /bin/sh</code></pre></ld-supplemental></ld-topic>

<ld-topic class="new-section transition-fade" id="intrusion-detection-systeme-ids"><h2>Intrusion Detection Systeme (IDS)</h2></ld-topic>
<ld-topic id="intrusion-detection-systeme-ids"><h2>Intrusion Detection Systeme (IDS)</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>Ein IDS ist ein Gerät (meist ein speziell konfigurierter Rechner), das vielfältige Techniken zur Erkennung von Angriffen anwendet und Angriffe meldet und ggf. abwehrt, in dem (z. B.) die Firewall automatisch umkonfiguriert wird.</p></aside><div class="compound incremental"><p><strong>Motivation</strong></p><ul class="incremental-list simple"><li><p>Firewalls alleine sind zu statisch und deswegen häufig nicht ausreichend</p></li><li><p>bessere Aufzeichnung und flexiblere Erkennung notwendig</p></li><li><p>angepasste Reaktion notwendig</p></li></ul></div><div class="compound incremental"><p><strong>Umsetzung</strong></p><p>An verschiedenen, neuralgischen Stellen werden spezielle Sensoren platziert, die (hier) den Netzwerkverkehr überwachen und verdächtige Aktivitäten melden.</p></div><ld-supplemental><p>Miteinander verwandt bzw. typischerweise in einem Produkt zu finden:</p><ul class="simple"><li><p>Intrusion Detection (IDS)</p></li><li><p>Intrusion Response (IRS)</p></li><li><p>Intrusion Prevention (IPS)</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="ids-erkennungstechniken"><h2>IDS-Erkennungstechniken</h2><ul class="incremental-list simple"><li><p>Signaturerkennung</p></li><li><p>statistische Analyse</p></li><li><p>Anomalieerkennung</p></li></ul><aside class="admonition incremental"><p class="admonition-title">Probleme</p><ul class="simple"><li><p>Fälschlicherweise gemeldete Angriffe (false positives)</p></li><li><p>nicht gemeldete Angriffe (false negatives) (insbesondere bei neuartigen Angriffen)</p></li><li><p>Echtzeitanforderung, insbesondere bei Hochgeschwindigkeitsnetzen</p></li><li><p>Aufzeichnung bei Netzwerken mit Switches ( ⇒ spez. SPAN Port)</p></li><li><p>Sensoren sollen unbeobachtbar sein (<em>stealth</em>)</p></li></ul></aside><ld-supplemental><p>SPAN (<span class="eng">Switched Port Analyzer</span>) Ports sind spezielle Ports auf Switches, die bestimmten Verkehr (z. B. bestimmte Pakete) die über ein Switch gehen, an einen definierten Port weiterleiten können. An diesem Port kann dann eine Analyse des Verkehrs durchgeführt werden / ein Sensor angeschlossen werden.</p></ld-supplemental></ld-topic>
<ld-topic class="exercises transition-move-left" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Firewalls"><p class="ld-exercise-title rubric"><span>Firewalls</span></p><ol class="arabic simple"><li><p>Was sind Vorteile eines Dual Homed Host gegenüber einem Paketfilter? Was sind die Nachteile?</p></li><li><p>Benennen Sie zwei konzeptionelle Grenzen von Firewalls. D. h. zwei Szenarien gegen die Firewalls nicht schützen können.</p></li><li><p>Für welche der folgenden Cybersicherheitsstrategien können Firewalls eingesetzt werden:</p><ol class="arabic simple"><li><p>Angriffe vermeiden</p></li><li><p>Angriffe erkennen</p></li><li><p>Angriffe abwehren/Angriffen entgegenwirken</p></li><li><p>Reaktion auf Angriffe</p></li></ol></li><li><p>Sie werden beauftragt die Firewall so einzurichten, dass Mails mit Schadsoftware nicht durchgelassen werden. Wie reagieren Sie?</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:ZXLGKmcfPGQ//lwS3Jx0/u8sUq6vDusXGcVXtZoBhGE=:2AzUx/JJt+ugYXEN:DVtReeDZpxxKNrU/fdV6J8kX3Xk8L6J00hcO2JC6/phrgs44HlBTvF2mjI+lDbdJ5VrbG2lZkUToJBtcyCcbZ1GozT6TkYxBnYAwQOAHxnAf82kp78XvgFfq9R7OUVT/BN/QONswIUnLHDvXoX0Xze/Owy52cXiMWdO4kLuZhD/R3XZpQKFDQg/o0V8HN8X923vOz5CA+rc4mX+N6mWolRQ2bhkt2QV5OJ+OX976vrubaQWvhuOEIXKwC2rloiocCL2jOKTj48wlwFPanyVsaNe6Oy13m7ccAaHHgp1RBlGmjNBYJlAGWHt3c1l4UaoJSKDGeqfeUvJOkEpEPQe2PGsUhbfLptbYOVOeMM88saBxtmKvyEmPkE+YQN4+jenWdK13FJ9mOSWuLmmcaQCBxPtc/BJTTLwvaeLv3GHOs2COx7Ajzmj2yrhBFX5chwtIDvFBYFl26rJGOofKOS63NsVGU37Qys3JZZ/8hbq1Ds2uXlcfJ20DOGvxNAm3/ghO2lkw4waNXcpSNuwd6dqGnevNt6cxX0dgYGhrttCeyRk9xlQ1Ghff8CKRBas/qvhPs/Pt0NZAwbx3U+XD/S+Yk1XZxO+JdzobinzmDOGsE+Och0aPBZWCZqiy6lemNMlJl24uCD8AwT2oVlAUD0rkKmpk896HszKe7G9bfZP3tW+0+YHoWMCEFxnLObU7v2Mf3Z5Uvpz3G38Z+ukz5dVL9h9InoAX/VCrMcyHUm/xtP1dzuUmKGOXzaa1jS3rzGsCJZjL83dH5jx3z59TWaVnMfzhUJK0LLX6C0MdA4H0d3PtQ3E5Ev5U4Z+aguJ9JVtrYIbE6Hf74bBJKY1INk26L2ZATJ0g1DlcgZ2CBPKjDgYFV4KCHEPMn/J/2C8lkYLC8ww+LB+tDaR7RDyguLWXbanAyxX
