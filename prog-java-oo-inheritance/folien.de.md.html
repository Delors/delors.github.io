<ld-topic class="exercises transition-move-to-top" id="ubung-3"><h2>Übung</h2><ld-scrollable><div class="ld-exercise" id="ld-exercise-4" data-exercise-id="4" data-exercise-title="4 - Vererbung, Exceptions und Abstrakte Klassen"><p class="ld-exercise-title rubric"><span>Vererbung, Exceptions und Abstrakte Klassen</span></p><p>Wir möchten mathematische Ausdrücke repräsentieren, um darauf verschiedene Operationen auszuführen.</p><p>Erstellen Sie eine abstrakte Klasse <code class="java"><span class="name class">Term</span></code>, die eine Methode <code class="java"><span class="keyword">int</span> <span class="name function">evaluate</span><span class="punctuation">(</span><span class="punctuation">)</span></code> deklariert. Die Methode <code class="java">evaluate</code> soll eine <em>Checked Exception</em> vom neu anzulegenden Typ <code class="java"><span class="name class">MathException</span></code> werfen, wenn die Auswertung nicht möglich ist. Die abstrakte Klasse <code class="java"><span class="name class">Term</span></code> hat ein privates Attribut mit der Priorität des Terms (als <code class="java"><span class="keyword">int</span></code> Wert), welcher bei der Initialisierung gesetzt wird. Implementieren Sie eine passende finale Methode <code class="java"><span class="keyword">int</span> <span class="name function">getPriority</span><span class="punctuation">(</span><span class="punctuation">)</span></code> in der abstrakten Klasse. Die Priorität eines Terms ist relevant, wenn man einen Ausdruck ausgeben möchte und die Klammern minimieren möchte.</p><p>Erstellen Sie dann die Klassen <code class="java"><span class="name class">Number</span></code>, <code class="java"><span class="name class">Plus</span></code> und <code class="java"><span class="name class">Division</span></code>, die von <code class="java"><span class="name class">Term</span></code> erben und ggf. Referenzen auf weitere Terme halten. <code class="java"><span class="name class">Number</span></code> repräsentiert eine Zahl, <code class="java"><span class="name class">Plus</span></code> eine Addition und <code class="java"><span class="name class">Division</span></code> eine Division. Implementieren Sie die Methode <code class="java"><span class="keyword">int</span> <span class="name function">evaluate</span><span class="punctuation">(</span><span class="punctuation">)</span></code> in den Subklassen. Legen Sie für jede Klasse einen passenden Konstruktor an. Werfen Sie ggf. eine <code class="java"><span class="name class">MathException</span></code>, wenn die Auswertung nicht möglich ist.</p><p>Implementieren Sie für jede konkrete Klasse eine Methode <code class="java"><span class="keyword">public</span> <span class="name class">String</span> <span class="name function">toString</span><span class="punctuation">(</span><span class="punctuation">)</span></code>, die den Term als <code class="java"><span class="name class">String</span></code> zurückgibt und Klammerung durchführt <em>wenn notwendig</em>. Die Methode <code class="java"><span class="name function">toString</span><span class="punctuation">(</span><span class="punctuation">)</span></code> soll die Klammern so setzen, dass der Ausdruck korrekt ist. D. h. <code class="java"><span class="punctuation">(</span><span class="literal number integer">1</span> <span class="operator">+</span> <span class="literal number integer">2</span><span class="punctuation">)</span> <span class="operator">*</span> <span class="literal number integer">3</span></code> soll als <code class="java"><span class="punctuation">(</span><span class="literal number integer">1</span> <span class="operator">+</span> <span class="literal number integer">2</span><span class="punctuation">)</span> <span class="operator">*</span> <span class="literal number integer">3</span></code> und nicht als <code class="java"><span class="literal number integer">1</span> <span class="operator">+</span> <span class="literal number integer">2</span> <span class="operator">*</span> <span class="literal number integer">3</span></code> ausgegeben werden. Weiterhin soll ein Ausdruck wie <code class="java"><span class="literal number integer">1</span> <span class="operator">+</span> <span class="literal number integer">2</span> <span class="operator">+</span> <span class="literal number integer">3</span></code> als <code class="java"><span class="literal number integer">1</span> <span class="operator">+</span> <span class="literal number integer">2</span> <span class="operator">+</span> <span class="literal number integer">3</span></code> und nicht als <code class="java"><span class="literal number integer">1</span> <span class="operator">+</span> <span class="punctuation">(</span><span class="literal number integer">2</span> <span class="operator">+</span> <span class="literal number integer">3</span><span class="punctuation">)</span></code> oder <code class="java"><span class="punctuation">(</span><span class="literal number integer">1</span> <span class="operator">+</span> <span class="literal number integer">2</span><span class="punctuation">)</span> <span class="operator">+</span> <span class="literal number integer">3</span></code> ausgegeben werden.</p><p>Schreiben Sie eine <code class="java">main</code> Methode und testen Sie mit verschiedenen Termen die Auswertung und die Ausgabe.</p><p>Achten Sie darauf, dass im Falle einer Exception eine passende Fehlermeldung ausgegeben wird.</p><ld-supplemental><p class="rubric">Beispiele für die Verwendung</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">new</span> <span class="name class">Division</span><span class="punctuation">(</span>
</code><small class="ln">3</small><code data-lineno="3">        <span class="keyword">new</span> <span class="name class">Number</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">,</span>
</code><small class="ln">4</small><code data-lineno="4">        <span class="keyword">new</span> <span class="name class">Plus</span><span class="punctuation">(</span>
</code><small class="ln">5</small><code data-lineno="5">            <span class="keyword">new</span> <span class="name class">Plus</span><span class="punctuation">(</span><span class="keyword">new</span> <span class="name class">Number</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">,</span><span class="keyword">new</span> <span class="name class">Number</span><span class="punctuation">(</span><span class="literal number integer">2</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">,</span>
</code><small class="ln">6</small><code data-lineno="6">            <span class="keyword">new</span> <span class="name class">Number</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre><p>Ausgabe:</p><pre class="literal-block"><code>1 / (1 + 2 + 1)</code></pre></aside><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">new</span> <span class="name class">Plus</span><span class="punctuation">(</span>
</code><small class="ln">3</small><code data-lineno="3">        <span class="keyword">new</span> <span class="name class">Number</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">,</span>

<ld-topic class="new-section" id="definition-und-verwendung-von-schnittstellen-in-java"><h2>Definition und Verwendung von Schnittstellen in Java</h2></ld-topic>
<ld-topic id="java-interfaces"><h2>Java <code class="java"><span class="keyword">interface</span></code>s</h2><ld-deck class="dd-margin-left-3em"><ld-card><p>Schnittstellen (Interfaces) werden ähnlich wie Klassen deklariert, spezifizieren aber nur Methoden-Schnittstellen (abstrakte Methoden und <code class="java"><span class="keyword">default</span></code> Methoden) und öffentliche statische finale Attribute.</p><dl class="incremental field-list"><dt>Syntax<span class="colon">:</span></dt><dd><pre class="code java literal-block"><code><span class="punctuation">&lt;</span><span class="keyword">public</span><span class="punctuation">&gt;</span><span class="operator">?</span> <span class="keyword">interface</span> <span class="punctuation">&lt;</span><span class="name class">Schnittstellenname</span><span class="punctuation">&gt;</span><span class="punctuation">{</span>
    <span class="comment single">// statische, finale Attribute</span>
    <span class="comment single">// Methodendeklarationen und "default" Methoden</span>
<span class="punctuation">}</span></code></pre></dd></dl></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p class="rubric">Saeugetier.java</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">interface</span> <span class="name class">Saeugetier</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">int</span><span class="punctuation">[</span><span class="punctuation">]</span> <span class="name function">getAnzahlZitzen</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">default</span> <span class="keyword">int</span> <span class="name function">getAnzahlNachkommen</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">4</small><code data-lineno="4">        <span class="keyword">int</span> durchschnittlicheZitzenAnzahl <span class="operator">=</span> 
</code><small class="ln">5</small><code data-lineno="5">            <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Arrays</span><span class="punctuation">.</span><span class="name function">stream</span><span class="punctuation">(</span><span class="name function">getAnzahlZitzen</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">.</span><span class="name function">sum</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">/</span> <span class="literal number integer">2</span><span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6">        <span class="keyword">return</span> durchschnittlicheZitzenAnzahl <span class="operator">/</span> <span class="literal number integer">2</span><span class="punctuation">;</span>
</code><small class="ln">7</small><code data-lineno="7">    <span class="punctuation">}</span>
</code><small class="ln">8</small><code data-lineno="8"><span class="punctuation">}</span></code></pre><p class="rubric">Haustier.java</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">interface</span> <span class="name class">Haustier</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">int</span> <span class="name constant">MAXIMALES_ALTER</span> <span class="operator">=</span> <span class="literal number integer">100</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">public</span> <span class="keyword">abstract</span> <span class="name class">String</span> <span class="name function">getRufname</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5"></code></pre></aside></ld-card><ld-card class="incremental"><dl class="field-list simple"><dt>Details<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Von Schnittstellen können keine Objekte erzeugt werden.</p></li><li><p>Schnittstellen können aber als statischer Typ eines Objektes verwendet werden.</p></li><li><p>Die Angabe von <code class="java"><span class="keyword">public</span> <span class="keyword">abstract</span></code> bei Methoden ist optional.</p></li><li><p>Die Angabe von <code class="java"><span class="keyword">public</span> <span class="keyword">final</span> <span class="keyword">static</span></code> bei Attributen ist optional.</p></li></ul></dd></dl></ld-card><ld-card class="incremental"><p class="rubric">Implementierung von Schnittstellen</p><p>Eine Klasse kann mehrere Schnittstellen implementieren. Die Methoden der Schnittstellen müssen in der Klasse implementiert werden.</p><p class="rubric">Katze.java</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">public</span> <span class="keyword">class</span> <span class="name class">Katze</span> <span class="keyword">implements</span> <span class="name class">Haustier</span><span class="punctuation">,</span> <span class="name class">Saeugetier</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">private</span> <span class="name class">String</span> rufname<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">public</span> <span class="name class">Katze</span><span class="punctuation">(</span><span class="name class">String</span> rufname<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">this</span><span class="punctuation">.</span>rufname <span class="operator">=</span> rufname<span class="punctuation">;</span> <span class="punctuation">}</span>

    <span class="keyword">extends</span> <span class="punctuation">&lt;</span><span class="name class">Schnittstelle</span><span class="punctuation">&gt;</span> <span class="punctuation">(</span><span class="punctuation">,</span> <span class="punctuation">&lt;</span><span class="name class">Schnittstelle</span><span class="punctuation">&gt;</span><span class="punctuation">)</span><span class="operator">*</span> <span class="punctuation">{</span>
    <span class="comment single">//...</span>
<span class="punctuation">}</span></code></pre></dd></dl><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Schnittstellenvererbung</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">interface</span> <span class="name class">Carnivora</span> <span class="comment single">/*Raubtiere*/</span> <span class="keyword">extends</span> <span class="name class">Saeugetier</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name class">Tier</span> <span class="name function">bevorzugteJagdBeute</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="punctuation">}</span></code></pre></aside></ld-card><ld-card class="incremental"><p><strong>Statischer Typ</strong></p><ul class="simple"><li><p>Schnittstellen können (wie Klassen) als statischer Typ von Objekten(Referenzvariablen) verwendet werden.</p></li><li><p>Klassen, die eine Schnittstelle implementieren, sind typkonform zu der Schnittstelle und können implizit in diese konvertiert werden.</p></li><li><p>Referenzvariablen (mit dem statischen Datentyp einer Schnittstelle) können an den gewohnten Stellen verwendet werden.</p></li></ul></ld-card></ld-deck><ld-supplemental><p>Es ist nicht möglich Interfaces mit Methoden mit inkompatiblen Signaturen zu implementieren. Es ist aber möglich, dass eine Klasse mehrere Interfaces implementiert, die Methoden mit gleichen Signaturen haben. In diesem Fall muss die Klasse die Methode nur einmal implementieren.</p><dl class="field-list"><dt>Beispiel<span class="colon">:</span></dt><dd><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">interface</span> <span class="name class">Foo</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">int</span> <span class="name function">m</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="punctuation">}</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5"><span class="keyword">interface</span> <span class="name class">Bar</span> <span class="punctuation">{</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">default</span> <span class="keyword">double</span> <span class="name function">m</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">{</span><span class="keyword">return</span> <span class="literal number integer">1</span><span class="punctuation">;</span><span class="punctuation">}</span>
</code><small class="ln"> 7</small><code data-lineno=" 7"><span class="punctuation">}</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9"><span class="keyword">class</span> <span class="name class">FooBar</span> <span class="keyword">implements</span> <span class="name class">Bar</span><span class="punctuation">,</span> <span class="name class">Foo</span> <span class="punctuation">{</span>
</code><small class="ln">10</small><code data-lineno="10">    <span class="keyword">public</span> <span class="keyword">int</span> <span class="name function">m</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="comment single">/* Main.java:10: error: m() in Main.FooBar </span>
</code><small class="ln">11</small><code data-lineno="11"><span class="comment single">                                             cannot implement m() in Bar</span>
</code><small class="ln">12</small><code data-lineno="12"><span class="comment single">                                             public int m() {</span>
</code><small class="ln">13</small><code data-lineno="13"><span class="comment single">                                                        ^</span>
</code><small class="ln">14</small><code data-lineno="14"><span class="comment single">                                             return type int is not compatible </span>
</code><small class="ln">15</small><code data-lineno="15"><span class="comment single">                                             with double */</span>
</code><small class="ln">16</small><code data-lineno="16">        <span class="keyword">return</span> <span class="literal number integer">2</span><span class="punctuation">;</span>
</code><small class="ln">17</small><code data-lineno="17">    <span class="punctuation">}</span>
</code><small class="ln">18</small><code data-lineno="18"><span class="punctuation">}</span>
</code><small class="ln">19</small><code data-lineno="19">
</code><small class="ln">20</small><code data-lineno="20"><span class="keyword">void</span> <span class="name function">main</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">21</small><code data-lineno="21">    <span class="name class">FooBar</span> fb <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">FooBar</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">22</small><code data-lineno="22">    <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>fb<span class="punctuation">.</span><span class="name function">m</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">+</span> <span class="literal string">" "</span> <span class="operator">+</span> <span class="punctuation">(</span><span class="punctuation">(</span><span class="name class">Bar</span><span class="punctuation">)</span>fb<span class="punctuation">)</span><span class="punctuation">.</span><span class="name function">m</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">23</small><code data-lineno="23"><span class="punctuation">}</span></code></pre></dd></dl></ld-supplemental></ld-topic>
<ld-topic class="exercises transition-move-to-top" id="ubung-4"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-5" data-exercise-id="5" data-exercise-title="5 - Ausdrücke vergleichen (Schnittstellen, instanceof, Type Casts)"><p class="ld-exercise-title rubric"><span>Ausdrücke vergleichen (Schnittstellen, instanceof, Type Casts)</span></p><p>Erweitern Sie die Lösung der vorhergehenden Übung wie folgt.</p><p>Definieren Sie eine Schnittstelle <code class="java"><span class="name class">Comparable</span></code>, die eine Methode <code class="java"><span class="keyword">boolean</span> <span class="name function">equal</span><span class="punctuation">(</span><span class="name class">Term</span> t<span class="punctuation">)</span></code> deklariert. Implementierungen der Methode sollen den aktuellen Term vergleichen mit dem Übergebenen und <code class="java"><span class="keyword constant">true</span></code> zurückgeben, wenn der aktuelle Term (<code class="java"><span class="keyword">this</span></code>) identisch zum übergebenen Term (<code class="java">t</code>) ist. Beachten Sie das Kommutativgesetz beim Vergleich; d. h. <code class="java">a <span class="operator">+</span> b</code> ist gleich <code class="java">b <span class="operator">+</span> a</code>.</p><p>Die abstrakten Klasse <code class="java"><span class="name class">Term</span></code> soll die Schnittstelle implementieren. Die Implementierungen der Methoden müssen natürlich in den Subklassen erfolgen.</p><ld-supplemental><p class="rubric">Beispiel</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>

<ld-topic class="exercises transition-move-to-top" id="ubung-5"><h2>Übung</h2><ld-scrollable><div class="ld-exercise" id="ld-exercise-6" data-exercise-id="6" data-exercise-title="6 - Modellierung einer Autoteile-Hierarchie"><p class="ld-exercise-title rubric"><span>Modellierung einer Autoteile-Hierarchie</span></p><p>Ein Kfz-Ersatzteilhändler möchte sein Warenwirtschaftssystem um eine objektorientierte Verwaltung von Autoteilen erweitern.</p><ol class="arabic simple"><li><p>Erstellen Sie eine Klasse <code class="java"><span class="name class">Autoteil</span></code>, die die gemeinsamen Attribute und Methoden aller Autoteile definiert. Jedes Autoteil hat eine eindeutige <code class="java"><span class="name class">Teilenummer</span></code> (als <code class="java"><span class="name class">String</span></code>) und eine <code class="java"><span class="name class">Bezeichnung</span></code> (als <code class="java"><span class="name class">String</span></code>). Implementieren Sie einen passenden Konstruktor und entsprechende Getter. Achten Sie auf sauberer Kapselung.</p></li><li><p>Es wurde entschieden als primäre Dimension bei der objektorientierten Modellierung die Unterscheidung der Autoteile nach Fahrzeugbaugruppen zu wählen. Diesbezüglich soll zwischen den Teilen, die zum Antrieb, und denen, die zum Fahrwerk gehören, unterschieden werden. Zur Bauteilgruppe des Fahrwerks gehören insbesondere auch die <code class="java"><span class="name class">Reifen</span></code>. Reifen sollen immer einen Reifenluftdruck und eine maximale Laufleistung besitzen. Bilden Sie diese Beziehungen durch eine Vererbungshierarchie ab. Achten Sie auch auf eine angemessene Bezeichnung der Klassen.</p></li><li><p>Orthogonal zur Vererbungshierarchie sollen die Autoteile nach der Sicherheitsrelevanz und der Einstufung als Verschleißteil unterschieden werden. Erweitern Sie Ihre Klassenhierarchie durch passende Schnittstellen. Verschleißteile sind insbesondere <code class="java"><span class="name class">Reifen</span></code>. Für Verschleißteile soll die Anzahl der Kilometer, die das Teil mindestens halten sollte, abfragbar sein. Bei sicherheitsrelevanten Teilen soll die Information über die zugrundeliegende Norm abrufbar sein.</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:1lEVKZfBwgSUtcrsLB41f93l+6mszhFBkmmX3Am4wnk=:G7bloD+zyRFVox0q:Pwqf1lbx/bUoCj1JIt99XDOF0nROofBAVtzseULMkFQU/ovZnLjXBJB7qa8Fk6K50DMx+ou23PumzDRdoH9Qo98fG+oV77QmiNwVb7FN4yVNjMoudu72+VrR+NdwB3UZ6/pq+1N2v8fRd3KofGXHzfH/rOMEW32+UbAAMpTHXb5XeOKWNw6R0p4FdJFzN1ApMV72cb+/Z5xJsDgOymPlrxLAgD7jgl9YMOSfpmtLgl72LXreIdpIz/PkvGFDbkO1ndj3ddG9AUYQLegLBfbmGtnBfhzx9EFDNjL1jcT5KoRlcmbLPNuIlhWXB0iJWwJmkNwaOL2gqnEGh4LA38K79J6jsrZj+Hv47w6RqSb+Xin6us5UAtJZZgXpfVEPF8jFXhAkU/fiSyw0TWm5GKYLo4JMcMXiYJapWBm0S6qw1uriJk4vTLwajBI5zdGFVoYP+gJC8MAelZ/hqoUMxn7J8609xAzOL+/SmcTKbcWZLVmJSrj+Hg6BKqVPlUiD7PFJjHK/5+lrAkc3WW4e9NDqJaC++bQUsh698z0aDSr+SDPuaJruCTLfYtcZbfOOZQTV3BeC61lw+RHCO9MIl98YlqKieSA8oAuhgSSmvrd3OxcGrs03Ui0lz0AZIygtaXq8B4g2ZekHr+wYqGPIp/FR/n5R6Zeo5WO8gIaZtfp2H8VydUCdlZkz2V5acnZgQjDqia7/3w6r8uzoD2Ki4xuFu1oA8/p0gLRG/ZnUIbdu9PSDakkGoDTfh/zzF7vmt6uTDGlNhcIWb8Z9EYOOy4TGBSUqyEA9eQOvRCdOA8hJ1xOBnePRglr4RfDh0+h2e4p6amJu5TFhealV/6TXVBsJncTUr+Jcf5qJmPj+SjVcRlKVGxEvl0xHppVLko5PbhONrCnPXtUbyJabzVvkTvP4xBB0Ebn/4nrl2uUFXwCMsYO2IYfBr7FajXOf0n2cWLZRMO1DZ/LDub+sAbnnSV5SkHZtLZNEp5rgvcMXwOZmQAHeVJrmwKJrM0FGOS5sbfkXEVXtTAmj5/rUgrEk0PSQMWhSD9Nziwji1EKMuyscHFbpT/8kjkWqCYV6rXsoV2MJ7Ap7XfC6oEQUYLMHrF01TkHpH3YdFbewVQo8MGR7fpcy7WVBnUIWNJ/swJyiI9ZKYM7nI2luQ3870sk+AKMC4EoReIThM+WBghvzxHYJBSGzEEfqLkOP1Gx9jdVUYfEE2616e4SnHORICICMn2yEA9sQOnFfIDdVR+o7isKPmIJydQViXNH3U1RzWPgvQRlKkFwk25xtbrvWwnI6rx/Ln81UOAMcskjiybLMqGhNGxv6LpUISnvIuMVWnjeaLpWhQ/uik+UgzzW7CYeK1n8PBXEq7640KUhVxbD7eSfDIdFXBmif3QM/Ss94cytRjkiKMseNUftYh+xSFKWU2z1RyUiC317zpWlywg3hSd3kVj6EvPSz7V9RfPHeNJ18jZ2Mkk2420xupPNJUhJ4cBSGsq3uZyZxdfqQiZaW+GoXJSfXca/I6iblKOswbdeLIz1oBFaQZ7q9DYVEu4Ljbugfpi85hKIWQFj/VYX0ccAYp6iILbdx7AK9C1q8ZYXrkjpJTtXGa+WjqLmbXg09yhGkIvByRH6
