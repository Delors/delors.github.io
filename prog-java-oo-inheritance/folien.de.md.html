<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

</code><small class="ln">15</small><code data-lineno="15"><span class="punctuation">}</span></code></pre></ld-cell></ld-grid><div class="incremental"><p class="rubric">Identifikation der Gemeinsamkeiten und Modellierung einer allgemeinen Klasse</p><object class="margin-top-1em align-center" data="images/raumverwaltung.svg" type="image/svg+xml" role="img" aria-label="Raumverwaltung" width="1440px"></object></div><div class="incremental"><p>Klassen können durch eine <strong>Vererbungshierarchie</strong> in <em>Oberklassen</em> (<em>Superklassen</em>) (hier: <code class="java"><span class="name class">Raum</span></code>) und <em>Unterklassen</em> (Subklassen) (hier: <code class="java"><span class="name class">Vorlesungsraum</span></code>, <code class="java"><span class="name class">Buero</span></code>, <code class="java"><span class="name class">Teekueche</span></code>, ...) eingeteilt werden.</p></div></ld-story><ld-supplemental><p>Unterklassen <em>spezialisieren</em> eine Oberklasse: Die Oberklasse definiert gemeinsame Attribute und Methoden. Eine Unterklasse kann neue Attribute und Methoden hinzufügen bzw. überschreiben. Dabei ist darauf zu achten, dass die Unterklasse sich verhaltenskonform zur Oberklasse verhält.</p></ld-supplemental></ld-topic>
<ld-topic id="vererbung-inheritance"><h2>Vererbung (<span class="eng">Inheritance</span>)</h2><ld-deck class="dd-margin-left-3em"><ld-card><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>Erlaubt es, eine Klasse von einer anderen abzuleiten und deren Eigenschaften und Methoden zu erben.</p></aside><dl class="field-list simple"><dt>Vorteile<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Wiederverwendbarkeit des Codes / keine Code-Duplikation</p></li><li><p>Erweiterbarkeit</p></li><li><p>Hierarchische Strukturierung</p></li></ul></dd></dl></ld-card><ld-card class="incremental"><p>Klassen werden in Vererbungshierarchien eingeteilt.</p><dl class="field-list"><dt>Syntax<span class="colon">:</span></dt><dd><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">class</span> <span class="punctuation">&lt;</span><span class="name class">Subklassenname</span><span class="punctuation">&gt;</span>
</code><small class="ln">2</small><code data-lineno="2">        <span class="keyword">extends</span> <span class="punctuation">&lt;</span><span class="name class">Superklassenname</span><span class="punctuation">&gt;</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="punctuation">}</span></code></pre></dd></dl><dl class="incremental field-list"><dt>Beispiel<span class="colon">:</span></dt><dd><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">Auto</span> <span class="punctuation">{</span>                            <span class="comment single">// Basisklasse</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="name class">String</span> marke<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">void</span> <span class="name function">fahren</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="literal string">"Das Auto fährt."</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 4</small><code data-lineno=" 4"><span class="punctuation">}</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">
</code><small class="ln"> 6</small><code data-lineno=" 6"><span class="keyword">class</span> <span class="name class">Elektroauto</span> <span class="keyword">extends</span> <span class="name class">Auto</span> <span class="punctuation">{</span>        <span class="comment single">// Abgeleitete Klasse</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="keyword">int</span> batteriestand<span class="punctuation">;</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="keyword">void</span> <span class="name function">aufladen</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">        <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="literal string">"Das Elektroauto wird aufgeladen."</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10"><span class="punctuation">}</span>   <span class="punctuation">}</span></code></pre></dd></dl></ld-card><ld-card class="incremental"><ul class="simple"><li><p>Eine Unter- bzw. Subklasse erbt alle Attribute und Methoden der Super- bzw. Oberklasse.</p></li></ul><ul class="incremental-list list-with-explanations"><li><p>Auf <code class="java"><span class="keyword">public</span></code> und <code class="java"><span class="keyword">protected</span></code> Attribute und Methoden der Superklassen kann direkt zugegriffen werden.</p></li><li><p>Auf <code class="java"><span class="keyword">private</span></code> Attribute und Methoden kann nicht zugegriffen werden</p><p>(Bei Attributen häufig indirekt nur über entsprechende öffentliche (<code class="java"><span class="keyword">public</span></code>) <code class="java">get</code>- und <code class="java">set</code>-Methoden, welche auch als <em>Getter</em> und <em>Setter</em> bezeichnet werden.)</p></li><li><p>Zyklen in der Vererbungshierarchie sind nicht erlaubt</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Zugriff auf Methoden und Attribute von Superklassen</p><p>Mittels <code class="java"><span class="keyword">super</span></code> ist der direkte Zugriff auf die Attribute und Methoden der Superklasse (wenn diese <code class="java"><span class="keyword">protected</span></code> oder <code class="java"><span class="keyword">public</span></code> sind) möglich.</p><ul class="simple"><li><p>Dies ist notwendig, wenn die Elternklasse Attribute bzw. Methoden mit gleichem Namen enthält (ansonsten kann man <code class="java"><span class="keyword">super</span></code> auch weglassen).</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Verwendung von <code class="java"><span class="keyword">super</span></code> für Aufruf der Methode der Superklasse</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">Person</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="name class">String</span> name<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">int</span> age<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="keyword">void</span> <span class="name function">display</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">        <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">print</span><span class="punctuation">(</span><span class="literal string">"Name: "</span> <span class="operator">+</span> name <span class="operator">+</span> <span class="literal string">" Age: "</span> <span class="operator">+</span> age<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="punctuation">}</span>   
</code><small class="ln"> 7</small><code data-lineno=" 7"><span class="punctuation">}</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9"><span class="keyword">class</span> <span class="name class">Kind</span> <span class="keyword">extends</span> <span class="name class">Person</span> <span class="punctuation">{</span>
</code><small class="ln">10</small><code data-lineno="10">    <span class="name class">String</span> hobby<span class="punctuation">;</span>
</code><small class="ln">11</small><code data-lineno="11">    <span class="keyword">void</span> <span class="name function">display</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">12</small><code data-lineno="12">        <span class="keyword">super</span><span class="punctuation">.</span><span class="name function">display</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> 
</code><small class="ln">13</small><code data-lineno="13">        <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">print</span><span class="punctuation">(</span><span class="literal string">" Hobby: "</span> <span class="operator">+</span> hobby<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">14</small><code data-lineno="14">    <span class="punctuation">}</span>
</code><small class="ln">15</small><code data-lineno="15"><span class="punctuation">}</span>
</code><small class="ln">16</small><code data-lineno="16">
</code><small class="ln">17</small><code data-lineno="17"></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Initialisierung von Superklassen</p><ul class="simple"><li><p>Wird ein Objekt erzeugt (mittels <code class="java"><span class="keyword">new</span></code>), so wird automatisch auch Speicher für die Attribute der Superklasse reserviert und initialisiert.</p></li><li><p>Mittels eines <code class="java"><span class="keyword">super</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code> Aufrufs ist es möglich einen bestimmten Konstruktor der Superklasse (innerhalb des Konstruktors der Subklasse) aufzurufen.</p></li><li><p>Ruft der Konstruktor nicht explizit einen Konstruktor mit <code class="java"><span class="keyword">super</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code> auf, dann wird der parameterlose Konstruktor <code class="java"><span class="keyword">super</span><span class="punctuation">(</span><span class="punctuation">)</span></code> implizit aufgerufen, wenn keiner explizit definiert wurde.</p></li><li><p>Die Initialisierung startet immer bei der Superklasse und arbeitet sich dann rekursiv durch die Vererbungshierarchie nach unten.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Verwendung von <code class="java"><span class="keyword">super</span></code> während der Initialisierung</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">Angestellter</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">private</span> <span class="name class">String</span> name<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="name class">Angestellter</span><span class="punctuation">(</span><span class="name class">String</span> name<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">this</span><span class="punctuation">.</span>name <span class="operator">=</span> name<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="name class">String</span> <span class="name function">getName</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">return</span> name<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 5</small><code data-lineno=" 5"><span class="punctuation">}</span>
</code><small class="ln"> 6</small><code data-lineno=" 6"><span class="keyword">class</span> <span class="name class">Professor</span> <span class="keyword">extends</span> <span class="name class">Angestellter</span> <span class="punctuation">{</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="keyword">private</span> <span class="name class">String</span> fachgebiet<span class="punctuation">;</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="name class">Professor</span><span class="punctuation">(</span><span class="name class">String</span> name<span class="punctuation">,</span> <span class="name class">String</span> fachgebiet<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">        <span class="keyword">super</span><span class="punctuation">(</span>name<span class="punctuation">)</span><span class="punctuation">;</span>                <span class="comment single">// Aufruf des Konstruktors der Superklasse      </span>
</code><small class="ln">10</small><code data-lineno="10">        <span class="keyword">this</span><span class="punctuation">.</span>fachgebiet <span class="operator">=</span> fachgebiet<span class="punctuation">;</span>
</code><small class="ln">11</small><code data-lineno="11">    <span class="punctuation">}</span>
</code><small class="ln">12</small><code data-lineno="12">    <span class="keyword">public</span> <span class="name class">String</span> <span class="name function">toString</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">13</small><code data-lineno="13">        <span class="keyword">return</span>  <span class="literal string">"Professor { name = "</span> <span class="operator">+</span> <span class="keyword">super</span><span class="punctuation">.</span><span class="name function">getName</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="comment single">// super hier optional</span>
</code><small class="ln">14</small><code data-lineno="14">                <span class="operator">+</span> <span class="literal string">", fachgebiet = "</span> <span class="operator">+</span> fachgebiet <span class="operator">+</span> <span class="literal string">" }"</span><span class="punctuation">;</span>
</code><small class="ln">15</small><code data-lineno="15"><span class="punctuation">}</span>   <span class="punctuation">}</span>
</code><small class="ln">16</small><code data-lineno="16">
</code><small class="ln">17</small><code data-lineno="17"></code></pre></ld-card><ld-card class="incremental"><p class="rubric"><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Object</span></code></p><ul><li><p>Jede Klasse in Java erbt von der Klasse <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Object</span></code>.</p></li><li><p>Die Klasse <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Object</span></code> definiert allgemein relevante Methoden wie <code class="java"><span class="name function">toString</span><span class="punctuation">(</span><span class="punctuation">)</span></code>, <code class="java"><span class="name function">equals</span><span class="punctuation">(</span><span class="punctuation">)</span></code> und <code class="java"><span class="name function">hashCode</span><span class="punctuation">(</span><span class="punctuation">)</span></code>.</p></li><li><p>Die Methode <code class="java"><span class="name function">toString</span><span class="punctuation">(</span><span class="punctuation">)</span></code> gibt eine String-Repräsentation des Objekts zurück und wird aufgerufen, wenn ein Objekt in einem String-Kontext verwendet wird.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1">
</code><small class="ln">2</small><code data-lineno="2">
</code><small class="ln">3</small><code data-lineno="3"><span class="keyword">void</span> <span class="name function">main</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="name constant">IO</span><span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="literal string">"Mein Prof.: "</span> <span class="operator">+</span> <span class="keyword">new</span> <span class="name class">Professor</span><span class="punctuation">(</span><span class="literal string">"Max Mustermann"</span><span class="punctuation">,</span> <span class="literal string">"Informatik"</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span></code></pre></li><li><p>Die Methode <code class="java"><span class="name function">getClass</span><span class="punctuation">(</span><span class="punctuation">)</span></code> erlaubt den Zugriff auf die Klasse eines Objekts und ermöglicht <code class="java"><span class="name class">Reflection</span></code>. <span class="peripheral">Thema für spätere Vorlesung(en).</span></p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Methoden überschreiben</p><ul class="list-with-explanations incremental-list"><li><p>Eine Methode in einer Subklasse kann eine Methode in der Superklasse überschreiben.</p></li><li><p><span class="danger">Eine Methode, die eine Methode in der Superklasse überschreibt, hat den Kontrakt der Superklasse immer einzuhalten!</span></p><p>D. h. Vorbedingungen können in der Subklassen „entspannt“ und Nachbedingungen „verschärft“ werden, aber nie umgekehrt.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Einfach- vs. Mehrfachvererbung</p><dl class="field-list simple"><dt>Einfachvererbung<span class="colon">:</span></dt><dd><p>Jede Klasse kann nur eine Superklasse in der Vererbungshierarchie besitzen</p></dd><dt>Mehrfachvererbung<span class="colon">:</span></dt><dd><p>Jede Klasse kann mehrere Superklassen in der Vererbungshierarchie besitzen</p></dd></dl><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Java unterstützt nur Einfachvererbung bei Klassen.</p><p>Mehrfachvererbung wird nur bei Schnittstellen (<code class="java"><span class="keyword">interface</span></code>) unterstützt. Hier spricht man jedoch in der Regel davon, dass eine Klasse mehrere Schnittstellen <em>implementiert</em> und nicht von Mehrfachvererbung.</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="vererbung-und-typkonvertierungen-kompatibilitat"><h2>Vererbung und Typkonvertierungen/-kompatibilität</h2><ld-deck class="dd-margin-left-3em"><ld-card><p>Im Folgenden gehen wir von der folgenden Vererbungshierarchie aus:</p><object class="align-center" data="images/konten.svg" type="image/svg+xml" role="img" aria-label="Konten" height="750px"></object><p>Alle Attribute und Klassen sein <code class="java"><span class="keyword">public</span></code>.</p></ld-card><ld-card class="incremental"><p class="rubric">Statischer und Dynamischer Typ</p><ul><li><p>Eine Referenzvariable (für ein Objekt) hat einen statischen und einen dynamischen Typ.</p></li><li><p>Der statische Typ ist durch die Deklaration der Referenzvariablen gegeben.</p><p>Beispiel: <code class="java"><span class="name class">Konto</span> k<span class="punctuation">;</span> <span class="comment single">//Statischer Typ "Konto"</span></code></p></li><li><p>Der dynamische Typ hängt vom konkreten Objekt ab; es ist der Typ der Klasse, von der das Objekt instanziiert wurde mittels <code class="java"><span class="keyword">new</span></code>.</p><p>Beispiel: <code class="java">k <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Sparkonto</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// Dynamischer Typ "Sparkonto“</span></code></p></li></ul></ld-card><ld-card class="incremental"><ul><li><p>Der dynamische Typ muss von einer (nicht echten) Unterklasse des statischen Typs sein (z. B. „Sparkonto“ als dynamischer und „Konto“ als statischer Typ.)</p></li><li><p>Über die Referenzvariable sind nur die sichtbaren Attribute und Methoden des statischen Typs ansprechbar.</p><blockquote><p>Im Fall von <code class="java"><span class="name class">Konto</span> k <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Sparkonto</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span><span class="punctuation">;</span></code> kann nicht auf <code class="java">sparzins</code> zugegriffen werden.</p></blockquote></li></ul><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Der dynamische Typ bestimmt die Methode, die ausgeführt wird.</p><div class="incremental"><p>D. h. eine Methode, die in der Subklasse überschrieben wurde, wird auch dann ausgeführt, wenn die Referenzvariable den statischen Typ der Oberklasse hat.</p></div></aside></ld-card><ld-card class="incremental"><p class="rubric">Implizite Typkonvertierung</p><ul class="list-with-explanations"><li><p>Eine implizite Typkonvertierung (ohne cast-Operator) ist in der Vererbungshierarchie aufwärts möglich (Upcast).</p><p>Beispiel: Ein Tagesgeldkonto kann immer in ein Sparkonto konvertiert werden. Nach der Konvertierung sind über die Referenzvariable nur noch Attribute und Methoden des statischen Typs Sparkonto „sichtbar“.</p></li><li><p>Das Objekt selbst wird bei einer impliziten Konvertierung nicht geändert, nur die sichtbaren Attribute und Methoden unterscheiden sich.</p></li><li><p>Die implizite Typkonvertierung ist sicher; es kann kein Fehler bei der Typkonvertierung entstehen.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Explizite Typkonvertierung</p><ul><li><p>Typkonvertierung in der Vererbungshierarchie abwärts (Downcast) ist nur durch explizite Typkonvertierung (mit cast-Operator) möglich</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Ein Konto kann „möglicherweise“ in ein Sparkonto konvertiert werden:</p><p><code class="java"><span class="name class">Sparkonto</span> sk <span class="operator">=</span> <span class="punctuation">(</span><span class="name class">Sparkonto</span><span class="punctuation">)</span> konto</code>;</p></aside></li><li><p>Nach der Konvertierung sind über die Referenzvariable die Attribute und Methoden des statischen Typs Sparkonto „sichtbar“.</p></li><li><p>Das Objekt selbst wird bei einer expliziten Konvertierung nicht verändert!</p></li><li><p>Die Typkonvertierung ist nicht sicher; es kann ein Fehler bei der Typkonvertierung entstehen. Eine sogenannte <em>Typecast Exception</em> ist dann die Folge.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Typkonvertierung - Details</p><ul><li><p>Eine explizite Konvertierung eines Objektes ist nur dann möglich wenn der dynamische Typ des Objektes gleich der Ziel-Klasse ist bzw. der dynamische Typ des Objektes eine Subklasse der Ziel-Klasse ist.</p><p>Beispiele:</p><ul class="simple"><li><p>Ein Objekt wird als Festgeldkonto angelegt und implizit in ein Konto konvertiert (d. h. der dynamische Typ ist Festgeldkonto). Eine explizite Konvertierung in ein Sparkonto ist möglich.</p></li><li><p>Wird allerdings ein Objekt als Sparkonto angelegt, dann kann es nicht explizit in ein Tagesgeldkonto konvertiert werden.</p></li></ul></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Typtest mit <code class="java"><span class="keyword">instanceof</span></code></p><ul><li><p>Der <code class="java"><span class="keyword">instanceof</span></code>-Operator testet ob ein Objekt kompatibel zu einer Klasse ist (d. h. ob das Objekt in die Klasse konvertierbar ist). Der Operator gibt <code class="java"><span class="keyword constant">true</span></code> oder <code class="java"><span class="keyword constant">false</span></code> zurück:</p><dl class="field-list simple"><dt>Syntax<span class="colon">:</span></dt><dd><p><code class="java"><span class="punctuation">&lt;</span><span class="name class">Objekt</span><span class="punctuation">&gt;</span> <span class="keyword">instanceof</span> <span class="punctuation">&lt;</span><span class="name class">Klasse</span><span class="punctuation">&gt;</span></code></p></dd><dt>Beispiel<span class="colon">:</span></dt><dd><p><code class="java">k <span class="keyword">instanceof</span> <span class="name class">Sparkonto</span></code> testet ob das Objekt <code class="java">k</code> in ein Sparkonto explizit konvertiert werden kann. Hier nur möglich, wenn <code class="java">k</code> den dynamischen Typ Sparkonto, Festgeldkonto oder Tagesgeldkonto hat.</p></dd></dl><p>Sollte <code class="java">k</code> <code class="java"><span class="keyword">null</span></code> sein, dann ist das Ergebnis immer <code class="java"><span class="keyword constant">false</span></code>.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Beispiele</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1">    <span class="name class">Konto</span> k1 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Festgeld</span> <span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">,</span> <span class="literal string">"Matt"</span><span class="punctuation">,</span> <span class="literal number integer">100</span><span class="punctuation">,</span> <span class="literal number integer">2.5</span><span class="punctuation">,</span> <span class="literal number integer">36</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2">
</code><small class="ln">3</small><code data-lineno="3">    <span class="comment single">// Test der Typkompatibilität mit instanceof Festgeld</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">if</span><span class="punctuation">(</span>k1 <span class="keyword">instanceof</span> <span class="name class">Festgeld</span><span class="punctuation">)</span><span class="punctuation">{</span>
</code><small class="ln">5</small><code data-lineno="5">        <span class="comment single">// Explizite Konvertierung ist jetzt sicher:</span>
</code><small class="ln">6</small><code data-lineno="6">        <span class="name class">Festgeld</span> k2 <span class="operator">=</span> <span class="punctuation">(</span><span class="name class">Festgeld</span><span class="punctuation">)</span>k1<span class="punctuation">;</span>
</code><small class="ln">7</small><code data-lineno="7">        <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>k2<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">8</small><code data-lineno="8">    <span class="punctuation">}</span></code></pre></ld-card></ld-deck><ld-supplemental><p>Bzgl. des Zugriffs auf Methoden mit <em>Default</em> Sichtbarkeit gelten die Standardregeln.</p><p>Neben der klassischen Einfach- und Mehrfachvererbung gibt es noch viele weitere Konstrukte (z. B. traits, mixins, ...), die in anderen Programmiersprachen verwendet werden und ähnliche Konzepte ermöglichen.</p><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Die Klasse <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Object</span></code> definiert eine Reihe von Methoden, die als veraltet markiert sind. Diese sollten <em>nicht verwendet werden</em> und wir gehen hier auch nicht weiter auf diese ein!</p></aside></ld-supplemental></ld-topic>
<ld-topic id="polymorphie-polymorphism"><h2>Polymorphie (Polymorphism)</h2><ld-deck class="dd-margin-left-3em"><ld-card><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>Eine Referenzvariable mit einem statischen Typ kann auf Objekte mit unterschiedlichem dynamischen Typ verweisen.</p></aside><dl class="field-list simple"><dt>Verwendung<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Überschreiben von Methoden ({eng}`Runtime Polymorphism``)</p></li><li><p>Parameter und Rückgabewerte: Methoden können als Parameter Objekte einer beliebigen Subklasse übergeben bekommen bzw. zurückgeben.</p></li><li><p>ein Array kann Objekte jeder Subklasse enthalten (z. B. ein Array mit dem Datentyp <code class="java"><span class="name class">Konto</span><span class="punctuation">[</span><span class="punctuation">]</span></code> kann alle Subklassen enthalten.)</p></li></ul></dd></dl></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Arrays und Polymorphie:</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">Festgeld</span> k1 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Festgeld</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">,</span> <span class="literal string">"Matt"</span><span class="punctuation">,</span> <span class="literal number integer">100</span><span class="punctuation">,</span> <span class="literal number integer">2.5</span><span class="punctuation">,</span> <span class="literal number integer">36</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name class">Sparkonto</span> k2 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Sparkonto</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">,</span> <span class="literal string">"Michael"</span><span class="punctuation">,</span> <span class="literal number integer">100</span><span class="punctuation">,</span> <span class="literal number integer">3</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">
</code><small class="ln">4</small><code data-lineno="4"><span class="comment single">// Objekte mit unterschiedlichem dynamischen Typ in einem Array</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="name class">Konto</span><span class="punctuation">[</span><span class="punctuation">]</span> konten <span class="operator">=</span> <span class="punctuation">{</span>k1<span class="punctuation">,</span> k2<span class="punctuation">}</span><span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="keyword">for</span><span class="punctuation">(</span><span class="keyword">int</span> i <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span> i <span class="operator">&lt;</span> konten<span class="punctuation">.</span>length<span class="punctuation">;</span> <span class="operator">++</span>i<span class="punctuation">)</span><span class="punctuation">{</span>
</code><small class="ln">7</small><code data-lineno="7">    <span class="name function">println</span><span class="punctuation">(</span>konten<span class="punctuation">[</span>i<span class="punctuation">]</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">8</small><code data-lineno="8"><span class="punctuation">}</span></code></pre></aside></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Methode <code class="java">fahren</code> wird in verschiedenen Klassen unterschiedlich implementiert:</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">Auto</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">void</span> <span class="name function">fahren</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">        <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="literal string">"Das Auto fährt."</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="punctuation">}</span>
</code><small class="ln"> 5</small><code data-lineno=" 5"><span class="punctuation">}</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">
</code><small class="ln"> 7</small><code data-lineno=" 7"><span class="keyword">class</span> <span class="name class">Elektroauto</span> <span class="keyword">extends</span> <span class="name class">Auto</span> <span class="punctuation">{</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="keyword">void</span> <span class="name function">fahren</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="comment single">// Überschreiben der Methode</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">        <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="literal string">"Das Elektroauto fährt leise."</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10">    <span class="punctuation">}</span>
</code><small class="ln">11</small><code data-lineno="11"><span class="punctuation">}</span></code></pre><p>Wir sprechen hier vom überschreiben (<span class="eng">overriding</span>) von Methoden.</p></aside></ld-card><ld-card class="incremental"><p>Methoden überschreiben:</p><ul class="incremental-list list-with-explanations"><li><p>Deklaration einer Methode mit der gleichen Schnittstelle (Name, Rückgabetyp, Parameter) aber ggf. mit neuem Methodenrumpf.</p></li><li><p>Eine Methode kann in einer Subklasse eine erhöhte Sichtbarkeit haben, aber keine einschränkendere!</p></li><li><p>Methoden die <code class="java"><span class="keyword">final</span></code> sind können in Subklassen nicht überschrieben werden.</p></li><li><p>Methoden die <code class="java"><span class="keyword">private</span></code> sind, sind in Subklassen nicht sichtbar und können daher nicht überschrieben werden.</p><p>Wenn die Subklasse eine Methode mit dem gleichen Namen und den gleichen Parametern definiert, dann handelt es sich um eine neue Methode und nicht um eine Überschreibung. Ob diese neue Methode auch (wieder) <code class="java"><span class="keyword">private</span></code> ist, ist nicht weiter von belang!</p></li></ul></ld-card></ld-deck><ld-supplemental><p>overriding und Overloading sind zwei verschiedene Konzepte. Bei Overloading wird eine Methode mit dem gleichen Namen aber unterschiedlichen Parametertypen definiert. Bei Overriding wird eine Methode mit dem gleichen Namen und den gleichen Parametertypen in einer Subklasse neu definiert.</p></ld-supplemental></ld-topic>
<ld-topic id="zusammenfassung-und-vorteile-von-objekt-orientierter-programmierung"><h2>Zusammenfassung und Vorteile von Objekt-orientierter Programmierung<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></h2><dl class="dd-margin-left-3em incremental-list field-list simple"><dt>Kapselung<span class="colon">:</span></dt><dd><p>Schützt die Daten und kontrolliert den Zugriff.</p></dd><dt>Abstraktion<span class="colon">:</span></dt><dd><p>Vereinfacht die Komplexität des Codes.</p></dd><dt>Vererbung<span class="colon">:</span></dt><dd><p>Ermöglicht Code-Wiederverwendung und Hierarchien.</p></dd><dt>Polymorphie<span class="colon">:</span></dt><dd><p>Erlaubt flexiblen Code durch unterschiedliche Implementierungen.</p></dd></dl><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Diese Vorteile gelten im Wesentlichen für alle objektorientierten Programmiersprachen.</p></aside></aside></ld-topic>
<ld-topic class="exercises transition-move-to-top" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Meine Erste Klassenhierarchie"><p class="ld-exercise-title rubric"><span>Meine Erste Klassenhierarchie</span></p><p>Erstelle eine einfache <code class="java"><span class="name class">Tier</span></code>-Klasse mit einem Attribut <code class="java">decibel</code> vom Typ <code class="java"><span class="keyword">float</span></code> und einer Methode <code class="java"><span class="name function">lautGeben</span><span class="punctuation">(</span><span class="punctuation">)</span></code>, die den Laut des Tieres auf der Konsole ausgibt und einer Methode <code class="java">decibel</code>, die die Lautstärke als <code class="java"><span class="name class">String</span></code> zurückgibt. Erstelle dann die Klassen <code class="java"><span class="name class">Hund</span></code> und <code class="java"><span class="name class">Katze</span></code>, die <code class="java"><span class="name class">Tier</span></code> erweitern bzw. von <code class="java"><span class="name class">Tier</span></code> erben. Überschreibe die Methode <span class="docutils literal">lautGeben()</span> mit unterschiedlichen Ausgaben.</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:XEYRUyYMCCZiMUr3y+9H69nIlXC0PXxmOcU8kPUQGUw=:hUZR5uZ9HZNn71an:VMGteJLyTzFaBvAiaB4B3eEQO1Ak9bk74egkqO/GicJm3bos3zgw4mqXK3n8gQrcpjyaHfeBlUXos8QljYI58dUubqdBZPKGo8ZWGzaPJC88c7SFfB8BXPlDEV/3e/rvs14XPJWrWVw4s4p1X/efC1H2weqnhG/8XQgCcPhCQWx7L/GAkBeM226P56mMwIcYm741HKzdpTZz1LmK8uiPsQ/l11xHrVMQK0H9C96LEgx/8JXE4wQljLXObGCqHuUixIzcFaejG5iLrchRPBVdiAxImhgupq7T+NicvXRSZi5AhwpzkWw98GDQE0CtqZ3E8JIvnEUZiwlEOuQ7W+f1YYZBfTCIqUJmwl+3hvRh06smSHymEDJO43Va8K7KnO8jpIySP/Hp8w0yOjZvf6mLRc2jlU+fwhgcTGqLRjg0TvSTUdOXfyKq8wRnJ2i2qZ6bhmKtExbSlBArn1hr7nJLds8zSdWYTgUCQGlvLRRGj+Bk8EzuaE9Dpf4lhQF3rRerX5VjmSzu5W+Q/sNjWfvQl/BUsd9VJAlZsJHfWm3TBiMe1CBz7+nN6D9TtCqgBGJ4mY+DV7FRqIQDeOBgR <ld-topic class="new-section" id="fehlerbehandlung-in-java"><h2>Fehlerbehandlung in Java</h2></ld-topic>
<ld-topic id="fehlerbehandlung-exceptions-ausnahmen"><h2>Fehlerbehandlung (<span class="eng">Exceptions</span>, <span class="ger">Ausnahmen</span>)</h2><ld-deck><ld-card><ul class="list-with-sublists simple"><li><p>Die Fehlerbehandlung in Java erfolgt mittels Exceptions.</p></li><li><p>Exceptions sind Objekte, die eine Fehlermeldung und den <em>Stacktrace</em> enthalten.</p></li><li><p>Exceptions erben direkt oder indirekt von <code class="java"><span class="name class">Throwable</span></code>.</p></li><li><p>Exceptions können geworfen (mit <code class="java"><span class="keyword">throw</span></code>) und gefangen (mit <code class="java"><span class="keyword">try</span></code> und <code class="java"><span class="keyword">catch</span></code>) werden.</p></li><li><p>Exceptions können <em>checked</em> oder <em>unchecked</em> sein:</p><ul class="simple"><li><p><em>Checked Exceptions</em> (Klassen, die von <code class="java"><span class="name class">Throwable</span></code> erben aber nicht von <code class="java"><span class="name class">RuntimeException</span></code> oder <code class="java"><span class="name class">Error</span></code> ) müssen gefangen oder deklariert werden.</p></li><li><p><em>Unchecked Exceptions</em> (Exceptions, die von <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>RuntimeException</span></code> erben) können im Code ignoriert werden; d. h. müssen nicht explizit beachtet werden. Sollten/müssen aber nicht.</p></li></ul></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Exceptions Typhierearchie</p><object class="align-center" data="images/exceptions.svg" type="image/svg+xml" role="img" aria-label="Exceptions" height="750px"></object></ld-card><ld-card class="incremental"><p class="rubric">Einige ausgewählte typische Exceptions</p><p><strong>Unchecked Exceptions</strong>:</p><ul class="simple"><li><p><code class="java"><span class="name class">ArithmeticException</span></code>: Division durch <span class="docutils literal">0</span>.</p></li><li><p><code class="java"><span class="name class">NullPointerException</span></code>: Ein Objekt wird verwendet, obwohl es <code class="java"><span class="keyword">null</span></code> ist.</p></li><li><p><code class="java"><span class="name class">ArrayIndexOutOfBoundsException</span></code>: Ein ungültiger Index wird verwendet.</p></li><li><p><code class="java"><span class="name class">IllegalArgumentException</span></code>: Ein ungültiges Argument wird übergeben.</p></li></ul><p><strong>Checked Exceptions</strong>:</p><ul class="simple"><li><p><code class="java"><span class="name class">IOException</span></code>: Fehler beim Lesen oder Schreiben von Dateien.</p></li><li><p><code class="java"><span class="name class">FileNotFoundException</span></code>: Datei nicht gefunden.</p></li><li><p><code class="java"><span class="name class">ParseException</span></code>: Fehler beim Parsen von Strings.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Handling von <em>Unchecked Exceptions</em> (<code class="java"><span class="keyword">try</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="keyword">catch</span> <span class="punctuation">(</span><span class="name class">E</span> e<span class="punctuation">)</span></code>)</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">import</span> <span class="keyword">static</span> <span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span><span class="name class">System</span><span class="punctuation">.</span>err<span class="punctuation">;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">void</span> <span class="name function">main</span><span class="punctuation">(</span><span class="name class">String</span><span class="punctuation">[</span><span class="punctuation">]</span> args<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">try</span> <span class="punctuation">{</span>

</code><small class="ln"> 5</small><code data-lineno=" 5">        <span class="keyword">int</span> j <span class="operator">=</span> <span class="name class">Integer</span><span class="punctuation">.</span><span class="name function">parseInt</span><span class="punctuation">(</span>args<span class="punctuation">[</span><span class="literal number integer">1</span><span class="punctuation">]</span><span class="punctuation">)</span><span class="punctuation">;</span>

</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">try</span> <span class="punctuation">{</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">        <span class="keyword">int</span> i <span class="operator">=</span> <span class="name class">Integer</span><span class="punctuation">.</span><span class="name function">parseInt</span><span class="punctuation">(</span>args<span class="punctuation">[</span><span class="literal number integer">0</span><span class="punctuation">]</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">        <span class="keyword">int</span> j <span class="operator">=</span> <span class="name class">Integer</span><span class="punctuation">.</span><span class="name function">parseInt</span><span class="punctuation">(</span>args<span class="punctuation">[</span><span class="literal number integer">1</span><span class="punctuation">]</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="keyword">try</span> <span class="punctuation">{</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">            <span class="name constant">IO</span><span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>i <span class="operator">/</span> j<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">        <span class="punctuation">}</span> <span class="keyword">catch</span> <span class="punctuation">(</span><span class="name class">ArithmeticException</span> e<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">            err<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="literal string">"Division durch 0 nicht erlaubt."</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10">        <span class="punctuation">}</span>
</code><small class="ln">11</small><code data-lineno="11">    <span class="punctuation">}</span> <span class="keyword">catch</span> <span class="punctuation">(</span><span class="name class">NumberFormatException</span> <span class="operator">|</span> <span class="name class">ArrayIndexOutOfBoundsException</span> e<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">12</small><code data-lineno="12">        err<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="literal string">"Argumente falsch."</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">13</small><code data-lineno="13"><span class="punctuation">}</span>   <span class="punctuation">}</span></code></pre><div class="minor incremental far-smaller"><p>Es wäre auch möglich gewesen die gemeinsame Superklasse zu nehmen (<code class="java"><span class="name class">RuntimeException</span></code>). Dies würde jedoch dazu führen, dass man Ausnahmen fängt, die man gar nicht fangen will!</p></div></ld-card><ld-card class="incremental"><p class="rubric">Deklaration, dass eine <em>Checked Exceptions</em> geworfen werden könnte (<code class="java"><span class="keyword">throws</span></code>)</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">import</span> <span class="name namespace">java<span class="punctuation">.</span>text<span class="punctuation">.</span></span><span class="name class">DateFormat</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">import</span> <span class="name namespace">java<span class="punctuation">.</span>text<span class="punctuation">.</span></span><span class="name class">ParseException</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">
</code><small class="ln">4</small><code data-lineno="4"><span class="keyword">void</span> <span class="name function">main</span><span class="punctuation">(</span><span class="name class">String</span><span class="punctuation">[</span><span class="punctuation">]</span> args<span class="punctuation">)</span> <span class="keyword">throws</span> <span class="name class">ParseException</span> <span class="punctuation">{</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="name class">DateFormat</span> df <span class="operator">=</span> <span class="name class">DateFormat</span><span class="punctuation">.</span><span class="name function">getDateInstance</span><span class="punctuation">(</span><span class="name class">DateFormat</span><span class="punctuation">.</span><span class="name constant">SHORT</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6">        <span class="name constant">IO</span><span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="literal string">"Thats the day: "</span> <span class="operator">+</span> df<span class="punctuation">.</span><span class="name function">parse</span><span class="punctuation">(</span>args<span class="punctuation">[</span><span class="literal number integer">0</span><span class="punctuation">]</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">7</small><code data-lineno="7"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric"><em>Try-with-Resources</em> (<code class="java"><span class="keyword">try</span><span class="punctuation">(</span><span class="keyword">var</span> i <span class="operator">=</span> <span class="punctuation">&lt;</span><span class="name class">Ressource</span><span class="punctuation">&gt;</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span></code>)</p><p>Stellt sicher, dass eine Ressource (z. B. eine Datei) immer geschlossen wird, auch wenn eine Exception auftritt.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">import</span> <span class="keyword">static</span> <span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span><span class="name class">System</span><span class="punctuation">.</span>err<span class="punctuation">;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">void</span> <span class="name function">main</span><span class="punctuation">(</span><span class="name class">String</span> <span class="punctuation">[</span><span class="punctuation">]</span>args<span class="punctuation">)</span><span class="punctuation">{</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="keyword">try</span> <span class="punctuation">(</span><span class="keyword">var</span> in <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">BufferedReader</span><span class="punctuation">(</span><span class="keyword">new</span> <span class="name class">FileReader</span><span class="punctuation">(</span>args<span class="punctuation">[</span><span class="literal number integer">0</span><span class="punctuation">]</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">        <span class="name class">String</span> line<span class="punctuation">;</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="keyword">while</span> <span class="punctuation">(</span><span class="punctuation">(</span>line <span class="operator">=</span> in<span class="punctuation">.</span><span class="name function">readLine</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span> <span class="operator">!=</span> <span class="keyword">null</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="name function">println</span><span class="punctuation">(</span>line<span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span>   
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="punctuation">}</span> <span class="keyword">catch</span> <span class="punctuation">(</span><span class="name class">IOException</span> e<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">        err<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="literal string">"Error: "</span> <span class="operator">+</span> e<span class="punctuation">.</span><span class="name function">getMessage</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="punctuation">}</span>
</code><small class="ln">10</small><code data-lineno="10"><span class="punctuation">}</span>
</code><small class="ln">11</small><code data-lineno="11"></code></pre><p>Der explizite Exceptionhandler wird nach dem Schließen der Ressource aufgerufen.</p></ld-card></ld-deck><ld-supplemental><p>Exceptions können selbstverständlich auch selbst definiert werden. Im Allgemeinen empfiehlt es sich aber, die Standard-Exceptions zu verwenden, da diese von anderen Entwicklern erkannt und verstanden werden.</p><p><code class="java"><span class="name class">Errors</span></code> sind Exceptions, die nicht gefangen werden sollten. Sie sind für den Programmierer nicht vorhersehbar und können im ganz Allgemeinen nicht sinnvoll behandelt werden.  Sie signalisieren zum Beispiel Fehlerzustände der virtuellen Maschine. Ein Beispiel ist der <code class="java"><span class="name class">OutOfMemoryError</span></code>.</p></ld-supplemental></ld-topic>
<ld-topic class="exercises transition-move-to-top" id="ubung-1"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Einfache Fehlerbehandlung"><p class="ld-exercise-title rubric"><span>Einfache Fehlerbehandlung</span></p><p>Erweitern Sie Ihre Methoden zum Berechnen der Kubikwurzel und zur Berechnung der Fibonacci-Zahlen um Fehlerbehandlung. D. h. testen Sie die Parameter auf Gültigkeit und werfen Sie ggf. eine <code class="java"><span class="name class">IllegalArgumentException</span></code>.</p><p>Deklarieren Sie in der Methodensignatur, dass eine <code class="java"><span class="name class">IllegalArgumentException</span></code> geworfen werden könnte.</p><p>Bedenken Sie bei der Berechnung der Methode für die Kubikwurzel, dass Double Werte auch Spezialwerte wie <code class="java"><span class="name class">Double</span><span class="punctuation">.</span><span class="name constant">POSITIVE_INFINITY</span></code> und <code class="java"><span class="name class">Double<span class="punctuation">.</span>NaN</span></code> haben können!</p><p>Ändern Sie Ihre <code class="java">main</code> Methode so, dass sie die Exceptions fängt und eine entsprechende Fehlermeldung ausgibt und dann sauber das Program beendet.</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:VROZoX22rW2Qq4jPOvJg9mB+5S1wK6DGSyGddqNbNJk=:EWURrRSh4+f85Nke:Rne2ImG6uhOipIbbOsJQoJXfYw4N8NNpcjicuvJZAnQMljIbNTDDtxiv0y0Q5bQUJi77eko/PY6sqb0saytQ0T/NyuQNJW5pvVdl2oYeu5uINlDUmqmI5V5v2BpYbe4HW30qOS7ob1QbqhcZYW2Z0k5tyK22+fjCUbLssiQm1VjWthXdq0YRva5SLNahT+P/jX8gJMis3h3tKvrNj3G9IOACH8e1T/bGIUA2BXC1Ko4ySrACYrVNmRkUZzexna5BiWXzNiqHKjPjcAMpfYWI7qlF73dGu1a7wVLklUfIb8RCnOl1IPRtN+bArEPNapKq2+O4Z7GWG0UplIe+kyxpmo8XO1uaSg27MVZdXkt0wWUMzLd2y5JW4ytEypJPu2jx4X6aMuRYeGxN1e06OqvieOL/2aNDw4fYU4u8vdQMFlZbdr5j4rF/UIrcK37HVt3kYgeyW0RmHNtxEcH11znkiEdL/JlVGohd7JabxRJk6Xr1xlD68cpvfUYWR8yTNmKP1WSZAO0gLBjdowWQVR6FENaSEXGEWZEz1dHXruQSWe3IKZkqLIqAQZUPCRiTN5zWQqzfVn8f1unp+hgXrHRAf <ld-topic class="exercises transition-move-to-top" id="ubung-2"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-3" data-exercise-id="3" data-exercise-title="3 - Nicht-leere Zeilen zählen"><p class="ld-exercise-title rubric"><span>Nicht-leere Zeilen zählen</span></p><p>Schreiben Sie eine Methode (<code class="java">countNonEmptyLines</code>), die die Anzahl der nicht-leeren Zeilen in einem Datenstrom zählt und zurückgibt. Eine Zeile wird als leer angesehen, wenn diese keine Zeichen oder nur Leerzeichen enthält. Verwenden Sie dazu die Klasse <code class="java"><span class="name class">BufferedReader</span></code> und die Methode <code class="java"><span class="name function">readLine</span><span class="punctuation">(</span><span class="punctuation">)</span></code> (siehe Beispiel in den Folien). Die Methode soll sich nicht um  Fehlerbehandlung kümmern.</p><p>Schreiben Sie eine <code class="java">main</code> Methode, die die Methode verwendet und sich um jegliche Fehlerbehandlung kümmert. D. h. die <code class="java">main</code> Methode soll bei allen Fehlern eine <em>passende Fehlermeldung</em> ausgeben und das Programm sauber beenden. Verwenden Sie ggf. ein <code class="java"><span class="keyword">try</span><span class="operator">-</span><span class="keyword">with</span><span class="operator">-</span>ressource</code> Statement.</p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Studieren Sie die Dokumentation der Klasse <code class="java"><span class="name class">String</span></code> in Hinblick auf Methoden, die es Ihnen einfacher machen zu erkennen ob eine Zeile gemäß obiger Definition leer ist.</p></aside><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:2IX1tFsVaFi1lu1EEQAQO8vCmR5v++sok/KrQ5XigjA=:mxWGyNXrV2rPKQXB:tY6TTvvSH8mjlyUveqb4cL6/pvD75S0T9S2Yg44YaTbXsr9LtAjdMXQkra+mW1f0CzCT8eCeevZFLfteHf1mDHgTq22IheiOr92enHP1hUmexUHPlnJ3xuuGWXRKDBCcV1gS6uxfjhNIyJC1mg78bUWsaAaC0nOFGLVXWYoO <ld-topic class="new-section" id="abstrakte-klassen-und-finale-klassen-methoden"><h2>Abstrakte Klassen und finale Klassen/Methoden</h2></ld-topic>
<ld-topic id="abstrakte-klassen"><h2>Abstrakte Klassen</h2><ld-deck><ld-card><ul class="incremental-list simple"><li><p>Abstrakte Klassen deklarieren ein Grundgerüst einer Klasse von der keine Objekte erzeugt werden können.</p></li><li><p>Abstrakte Klassen können abstrakte Methoden enthalten, die nur die Schnittstelle einer Methode definieren, aber auch implementierte Methoden.</p></li><li><p>Abstrakte Klassen und abstrakte Methoden werden durch den Modifizierer <code class="java"><span class="keyword">abstract</span></code> gekennzeichnet.</p></li><li><p>Nicht abstrakte Subklassen einer abstrakten Klasse müssen <em>alle</em> abstrakten Methoden der Elternklasse implementieren.</p></li></ul></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Eine <span class="docutils literal">Form</span>-Klasse, die über verschiedene Unterklassen wie <span class="docutils literal">Kreis</span>, <span class="docutils literal">Quadrat</span> und <span class="docutils literal">Dreieck</span> abstrahiert. Alle Formen bieten eine Möglichkeit zur Berechnung der Fläche.</p><pre class="code java copy-to-clipboard incremental literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">public</span> <span class="keyword">abstract</span> <span class="keyword">class</span> <span class="name class">EinfacheForm</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">protected</span> <span class="keyword">double</span> hoehe<span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">abstract</span> <span class="keyword">double</span> <span class="name function">berechneFlaeche</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">double</span> <span class="name function">berechneVolumen</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">5</small><code data-lineno="5">        <span class="keyword">return</span> <span class="name function">berechneFlaeche</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">*</span> hoehe<span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="punctuation">}</span>   <span class="punctuation">}</span></code></pre><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">class</span> <span class="name class">Kreis</span> <span class="keyword">extends</span> <span class="name class">EinfacheForm</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">double</span> r <span class="operator">=</span> <span class="literal number integer">0.0</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">double</span> <span class="name function">berechneFlaeche</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">4</small><code data-lineno="4">        <span class="keyword">return</span> <span class="name class">Math</span><span class="punctuation">.</span><span class="name constant">PI</span> <span class="operator">*</span> r <span class="operator">*</span> r<span class="punctuation">;</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span>   <span class="punctuation">}</span></code></pre></ld-cell><ld-cell style="align-self:auto;"><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">class</span> <span class="name class">Quadrat</span> <span class="keyword">extends</span> <span class="name class">EinfacheForm</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">double</span> seite <span class="operator">=</span> <span class="literal number integer">0.0</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">double</span> <span class="name function">berechneFlaeche</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">4</small><code data-lineno="4">        <span class="keyword">return</span> seite <span class="operator">*</span> seite<span class="punctuation">;</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span>   <span class="punctuation">}</span></code></pre></ld-cell></ld-grid></aside></ld-card><ld-card class="incremental"><p class="rubric">Abstrakte Methoden (<code class="java"><span class="keyword">abstract</span></code>)</p><ul class="incremental-list simple"><li><p>Abstrakte Methoden, dürfen nicht <code class="java"><span class="keyword">private</span></code>, <code class="java"><span class="keyword">final</span></code> oder <code class="java"><span class="keyword">static</span></code> sein.</p></li><li><p>Abstrakte Methoden können von nicht-abstrakten Methoden aufgerufen werden.</p></li><li><p>Abstrakte Klassen können von anderen (auch nicht-abstrakten) Klassen erben.</p></li><li><p>Konkrete Subklassen müssen alle abstrakten Methoden implementieren.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Statischer Typ</p><ul class="simple"><li><p>Abstrakte Klassen können als statischer Typ von Referenzvariablen verwendet werden.</p></li><li><p>Klassen, die von einer abstrakten Klasse erben, sind typkonform zu der abstrakten Klasse und können implizit in diese konvertiert werden.</p></li><li><p>Referenzvariablen (Abstrakte Klassen) können an den gewohnten Stellen verwendet werden.</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="finale-klassen-und-methoden-der-final-modifikator"><h2>Finale Klassen und Methoden (der <code class="java"><span class="keyword">final</span></code> Modifikator)</h2><ld-deck><ld-card><ul class="simple"><li><p>Durch den Modifikator <code class="java"><span class="keyword">final</span></code> kann das Überschreiben von Methoden bzw. ganzen Klassen verhindert werden.</p></li><li><p>Methoden, die durch den Modifikator <code class="java"><span class="keyword">final</span></code> gekennzeichnet sind, können in Subklassen nicht überschrieben werden.</p></li><li><p>Von Klassen, die durch den Modifikator <code class="java"><span class="keyword">final</span></code> gekennzeichnet sind, können keine Subklassen abgeleitet werden</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Konto.java</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">public</span> <span class="keyword">class</span> <span class="name class">Konto</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">private</span> <span class="name class">String</span> name<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">protected</span> <span class="keyword">double</span> saldo<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="keyword">public</span> <span class="keyword">final</span> <span class="keyword">double</span> <span class="name function">getSaldo</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">{</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="keyword">return</span> saldo<span class="punctuation">;</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="punctuation">}</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
