<ld-topic id="lecture-prog-java-oo-kontrollfragen"><h1 class="title">Kontrollfragen: Objekt-orientierte Programmierung - Vererbung und Polymorphie</h1><dl class="docinfo"><dt class="dozent">Dozent<span class="colon">:</span></dt><dd class="dozent"><a class="reference external" href="https://delors.github.io/cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></dd><dt class="contact">Kontakt<span class="colon">:</span></dt><dd class="contact"><a class="reference external" href="mailto:michael.eichberg@dhbw.de">michael.eichberg@dhbw.de</a>
, Raum 149B</dd><dt class="version">Version<span class="colon">:</span></dt><dd class="version">1.0.2.1</dd></dl><ld-supplemental><dl class="field-list simple"><dt>KI Verwendung<span class="colon">:</span></dt><dd><p>Bei der Erstellung der Unterlagen wurden KI Assistenten (insbesondere Claude
aber ggf. auch ChatGPT, Ollama mit Gemma/LLama/Qwen oder OpenCode mit
Kimi/Qwen/Deepseek...) unterstützend eingesetzt.
Dies erfolgte insbesondere zur Unterstützung bei der Generierung von Grafiken
(d. h. SVG Dateien), oder um sich Übersichtstabellen generieren zu lassen.
Weiterhin wurde KI zur allgemeinen Qualitätssicherung eingesetzt.
Inhalte, die ggf. von der KI vorgeschlagen wurden, wurden im Falle der
Übernahme explizit validiert und angepasst.</p></dd></dl></ld-supplemental></ld-topic>

<ld-topic class="exercises" id="kontrollfragen"><h2>Kontrollfragen</h2><ld-deck><ld-card><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Ober- und Unterklassen"><p class="ld-exercise-title rubric"><span>Ober- und Unterklassen</span></p><ol class="arabic incremental-list"><li><p><code class="java"><span class="keyword">class</span> <span class="name class">X</span> <span class="keyword">extends</span> <span class="name class">Y</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span></code></p><p>Welches ist die Oberklasse und welches die Unterklasse?</p></li><li><p><code class="java"><span class="keyword">class</span> <span class="name class">Z</span> <span class="keyword">extends</span> <span class="name class">Y</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span></code></p><p>Ist <code class="java"><span class="name class">Z</span></code> eine Unterklasse von <code class="java"><span class="name class">X</span></code>?</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:ck51CORLGcRCZcRROtc8haMUtbZxu9BTaVv64bvueq8=:eXS7jmDaHlT/qCNc:1+4lInv6ywrC1lAHQ3VhwS8k9dJl3faNyYW9YLHMMlVglDrgBlXmRa1JQntBAZITCvqOebJ7nyD1YtbWHukWy938Eb9UaYsn4JfUqYqP5112RsW9UMsNRweJmIkhrbuiTJ6IM+/RnJ/9zR5myhrou2kXvAfkdtCWoE1WyQH0ucMjiIcw92orRO54mqctlQpYHRWGUqgey1VevoPLDqo=</div></div></ld-card><ld-card class="incremental"><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Statischer und dynamischer Typ"><p class="ld-exercise-title rubric"><span>Statischer und dynamischer Typ</span></p><ld-grid class="default-layout"><ld-cell class="width-25" style="align-self:auto;"><p>Gegeben sei folgender Code:</p></ld-cell><ld-cell class="width-75" style="align-self:auto;"><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">class</span> <span class="name class">X</span> <span class="keyword">extends</span> <span class="name class">Y</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">class</span> <span class="name class">Z</span> <span class="keyword">extends</span> <span class="name class">Y</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="name class">Y</span> y <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">X</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre></ld-cell></ld-grid><ol class="arabic incremental-list simple"><li><p>Welches ist der statische und welches der dynamische Typ von <code class="java">y</code>?</p></li><li><p>Kann ich <code class="java">y</code> auch mit einem Objekt vom Typ <code class="java"><span class="name class">Z</span></code> initialisieren?</p></li><li><p>Kann ich einer Referenzvariablen <code class="java"><span class="name class">Z</span> z<span class="punctuation">;</span></code> ein Objekt vom Typ <code class="java"><span class="name class">X</span></code> zuweisen?</p></li><li><p>Kann ich einer Referenzvariablen <code class="java"><span class="name class">Z</span> z<span class="punctuation">;</span></code> ein Objekt vom Typ <code class="java"><span class="name class">Y</span></code> zuweisen?</p></li><li><p>Wie teste ich, wenn ich eine Referenzvariable <code class="java"><span class="name class">Y</span> y<span class="punctuation">;</span></code> habe, ob das Objekt, auf das <code class="java">y</code> zeigt, vom Typ <code class="java"><span class="name class">X</span></code> ist?</p></li><li><p>Was passiert wenn meine Referenzvariable vom Typ <code class="java"><span class="name class">Y</span> y</code> mit <code class="java"><span class="keyword">null</span></code> initialisiert ist, und ich einen Typtest auf <code class="java"><span class="name class">X</span></code> durchführe?</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:iKmu5VYDpikeA39mTdtx80UQ98U12WLhG8yx/GtMuYQ=:Lq3TP6McJWF+pq7Z:Mj5f3e16fM4A1y+XRUQ4q9fp/C8NFnjwy+AQa0MQov+rKnayHqtTE+NgaZ7OsKB/4dZ+f6sKoFAyqhv8OfA1oGJhIfWut+qNlV6VWh/D/ehnnn3ODGOmyVERqgCgRW4mylaMOIpKhDieXVTStn7+ctfNJCPL6zcYp1tSLuOhrL </code><small class="ln">2</small><code data-lineno="2"><span class="keyword">class</span> <span class="name class">X</span> <span class="keyword">extends</span> <span class="name class">Y</span> <span class="punctuation">{</span> <span class="keyword">void</span> <span class="name function">p</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">{</span><span class="name constant">IO</span><span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="literal string">"X.p"</span><span class="punctuation">)</span><span class="punctuation">;</span><span class="punctuation">}</span> <span class="punctuation">}</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="keyword">class</span> <span class="name class">Z</span> <span class="keyword">extends</span> <span class="name class">Y</span> <span class="punctuation">{</span>
</code><small class="ln">4</small><code data-lineno="4">   <span class="keyword">void</span> <span class="name function">p</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">{</span><span class="name constant">IO</span><span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="literal string">"Z.p"</span><span class="punctuation">)</span><span class="punctuation">;</span><span class="punctuation">}</span>
