<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

}

}
marker {

}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>

<marker
id="arrow"

</marker>
</defs></svg>
</ld-globals>

<ld-topic class="new-section transition-move-to-top" id="einfuhrung"><h2>Einführung</h2></ld-topic>
<ld-topic id="interpreter"><h2>Interpreter</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>Ein Interpreter ist ein Programm, das ein Programm einer bestimmten Programmiersprache direkt ausführt.</p></aside><p>Arbeitsweise eines Interpreters:</p><div class="peripheral"><p>(<code class="java">inpExpr</code> sei der aktueller Ausdruck des auszuführenden Programms)</p></div><ol class="arabic simple"><li><p>Syntaktische Analyse von <code class="java">inpExpr</code></p></li><li><p>Überführung von <code class="java">inpExpr</code> in eine Befehlsfolge der Maschinensprache, oder der Sprache, in der das Interpreterprogramm selbst geschrieben ist (<code class="java">outExpr</code>)</p></li><li><p>Ausführung von <code class="java">outExpr</code></p></li><li><p>Wiederholung der Schritte (1) bis (3) für die nächste Anweisung.</p></li></ol></ld-topic>
<ld-topic id="compiler"><h2>Compiler</h2><ld-deck><ld-card><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>Ein Übersetzer (Compiler) ist ein Programm, das Programme aus einer Programmiersprache A in eine Programmiersprache B übersetzt</p></aside><div style="width:70ch; height:8.4ch;">
<svg viewBox="0 0 50 6"
    font-size="1"
    version="1.1"
    xmlns="http://www.w3.org/2000/svg">

    <!-- Quellprogramm P1 -->
    <rect x="0.1" y="0.1" rx=".5" ry=".5" width="11" height="2.75" />
    <text x="1" y="1.2">Programm in</text>
    <text x="1" y="2.5">der Sprache A</text>
    <text class="subtext" x="1" y="4.5">Quellprogramm P1</text>

    <g class="incremental">
    <!-- Übersetzer -->
    <line x1="11" y1="1.25" x2="15" y2="1.25" marker-end="url(#arrow)" />
    <rect x="15" y="0.5" rx=".5" ry=".5" width="8" height="1.5" />
    <text x="16.35" y="1.7">Übersetzer</text>
    </g>

    <g class="incremental">
    <!-- Zielprogramm P2 -->
    <line x1="23" y1="1.25" x2="36" y2="1.25" marker-end="url(#arrow)" />
    <rect x="27" y="0.1" width="11" rx="0.5" ry=".5" height="2.75" />
    <text x="28.35" y="1.2">Programm in</text>
    <text x="28.35" y="2.5">der Sprache B</text>
    <text class="subtext" x="28.35" y="4.5">Zielprogramm P2</text>
    </g>

    <g class="incremental">
        <!-- Ausführung -->
        <line x1="38" y1="1.25" x2="43" y2="1.25" marker-end="url(#arrow)" />
        <text x="43" y="1.6" style="font-style:italic">Ausführung</text>
    </g>
</svg>
</div><aside class="admonition" data-theme="legend"><p class="admonition-title" data-theme="legend-header"><span>Legende</span></p><p>A ist die Ausgangssprache und B die Zielsprache.</p></aside><div class="incremental"><p><strong>Wesentlicher Aspekt ist die semantische Korrektheit:</strong> Jedem Quellprogramm P1 in A wird genau ein Zielprogramm P2 in B zugeordnet. Das dem Quellprogramm P1 zugeordnete Zielprogramm P2 muss die gleiche Bedeutung (Semantik) wie P1 besitzen.</p></div></ld-card><ld-card class="incremental"><div class="float-right width-50"><figure class="align-center"><img class="picture" src="images/hopper.jpeg" alt="Konteradmiral Grace Hopper"><figcaption><p>Fotograf: Lynn Gilbert, 1978; Lizenz: Creative Commons <a class="reference external" href="https://creativecommons.org/licenses/by-sa/4.0/deed.en">Attribution-Share Alike 4.0 International</a></p></figcaption></figure></div><p>Mutmaßlich erfunden von Konteradmiral Grace Murray Hopper (1906–1992)</p><p>Nach eigener Aussage hat sie den Compiler aus Faulheit erfunden, und weil sie hoffte, dass „Programmierer wieder Mathematiker werden“ könnten.</p></ld-card></ld-deck></ld-topic>
<ld-topic id="compiler-ubersetzungsphasen"><h2>Compiler - Übersetzungsphasen</h2><dl class="incremental-list field-list simple"><dt>Lexikalische Analyse<span class="colon">:</span></dt><dd><p>Quellprogramm wird in eine Folge von Worten zerlegt</p></dd><dt>Syntaktische Analyse<span class="colon">:</span></dt><dd><p>Testet, ob das Quellprogramm den Syntaxregeln der Quellsprache entspricht. Strukturiert Worte in gültige Sätze.</p></dd><dt>Semantische Analyse<span class="colon">:</span></dt><dd><p>Testet, ob alle im Quellprogramm benutzten Namen deklariert wurden und ihrem Typ entsprechend verwendet werden, usw.</p></dd><dt>Code-Generierung<span class="colon">:</span></dt><dd><p>Zielprogramm wird erzeugt.</p></dd></dl></ld-topic>

</div><div class="incremental"><p>D. h. der Quelltext in Sprache A wird meinem spezialisierten Compiler für Sprache A und Zielplattform X in ein ausführbares Programm für X übersetzt.</p></div><ul class="incremental-list positive-list simple"><li><p>Performance/Effizienz: Optimale Ausnutzung der jeweiligen Prozessoreigenschaften und hohe Abarbeitungsgeschwindigkeit der übersetzten Programme.</p></li></ul><ul class="incremental-list negative-list simple"><li><p>Plattformabhängigkeit: Ein Programm, das in einer höheren Programmiersprache geschrieben ist, kann - bei Verfügbarkeit eines Compilers - auf jeder Maschine laufen.</p></li></ul></ld-topic>
<ld-topic id="interpreter-vor-und-nachteile"><h2>Interpreter - Vor- und Nachteile</h2><ul class="incremental-list positive-list simple"><li><p>es lassen sich relativ schnell lauffähige Programmversionen erstellen (Prototyping)</p></li><li><p>Schnelle Änderbarkeit: geänderte Anweisungen / Deklarationen des Quellprogramms sind sofort ausführbar</p></li><li><p>Neuübersetzung nicht notwendig</p></li></ul><ul class="incremental-list negative-list simple"><li><p>Längere Ausführungszeit</p></li><li><p>Werden Anweisungen des Quellprogramms k-mal verwendet (z.B. bei Schleifen), werden sie k-mal analysiert und überführt</p></li><li><p>Bei Zugriffen auf Variablen müssen die zugeordneten Adressen immer wieder bestimmt werden.</p></li></ul><aside class="admonition incremental" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Auch heute gibt es noch <em>reine</em> Interpreter, aber Programmiersprachen wie Python und Java etc. setzen schon lange auf hybride Ansätze, die versuchen das Beste aus allen Welten vereinen.</p></aside></ld-topic>
<ld-topic id="virtuelle-maschinen"><h2>Virtuelle Maschinen</h2><ld-deck><ld-card><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>Eine virtuelle Maschine ist ein Programm, das die Arbeit eines Prozessors in Software simuliert</p></aside><ul class="incremental-list simple"><li><p>Programme einer höheren Sprache werden in eine Assembler-ähnliche Zwischensprache übersetzt.</p></li><li><p>Der simulierte Hardware-Prozessor nutzt diese Zwischensprache und besitzt einige Software-Register</p></li><li><p>Die Anweisungen der Zwischensprache nennt man auch Byte-Code.</p></li><li><p>Die Zwischensprache wird von der Virtuellen Maschine interpretiert.</p></li><li><p>Eine virtuelle Maschine versteckt die spezifischen Eigenschaften eines konkreten Prozessors. Wir haben somit eine neue Abstraktionsschicht auf der Hardware-Ebene!</p></li></ul></ld-card><ld-card class="incremental"><div class="center-content">

</div></ld-card><ld-card class="incremental"><p>Eine VM verdeckt die speziellen Eigenschaften des jeweiligen Prozessortyps und dient somit als Abstraktionsschicht!</p><ul class="incremental-list positive-list simple"><li><p>Übersetzte Programme einer Sprache laufen auf allen Prozessortypen, für die es einen Byte-Code Interpreter(VM) gibt.</p></li><li><p>Es wird nur ein Compiler benötigt und die Sprache wird plattformunabhängig.</p></li></ul><ld-supplemental><p>Natürlich braucht man eine VM pro Prozessortyp und Platform. Aber das ist ein geringerer Aufwand als für jede Sprache einen eigenen Compiler zu schreiben.</p></ld-supplemental><ul class="incremental-list negative-list"><li><p>Byte-Code Programme sind langsamer als Maschinenprogramme</p><div class="incremental peripheral"><p>Just-in-time-compiler (JIT) versuchen diesen Nachteil aufzulösen. Sie Übersetzen den Byte-Code in ein Objekt-Programm für einen speziellen Prozessortyp sobald es geladen wird, oder nach einer gewissen Anzahl an Ausführungen.</p></div></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="struktur-eines-java-programms"><h2>Struktur eines Java-Programms</h2><p>Ein Java-Programm kann aus beliebig vielen Klassen bestehen, von denen mindestens eine die <code class="java">main</code>-Operation besitzen muss (Hauptprogrammklasse).</p><div class="compound incremental"><p class="rubric">Aufgaben von <code class="java">main</code></p><ul class="incremental-list list-with-explanations"><li><p>Objekterzeugung; d. h. der Aufbau einer anfangs minimalen Welt</p></li><li><p>Aufruf der ersten Operation</p></li><li><p>Sollte in der Regel keinen weitergehenden Kontrollfluss des Java-Programms enthalten</p><p>Der Kontrollfluss wird innerhalb der Objektoperationen realisiert.</p></li><li><p><code class="java">main</code> wird mit Hilfe des Java-Interpreters gestartet und ausgeführt</p></li></ul></div></ld-topic>
<ld-topic id="java-laufzeitumgebung"><h2>Java-Laufzeitumgebung</h2><ld-story><dl class="incremental-list dd-margin-left-4em field-list"><dt>Java Interpreter<span class="colon">:</span></dt><dd><p>Programm zur Ausführung des Java-Bytecodes auf dem konkreten Rechner.</p></dd><dt>Just-In-Time-Compiler (JIT-Compiler)<span class="colon">:</span></dt><dd><p>Klassen bzw. Methoden werden bei Bedarf in  Code der jeweiligen Maschine übersetzt. Ggf. auf verschiedenen Optimierungsstufen.</p></dd><dt>Runtime-System<span class="colon">:</span></dt><dd><p>Stellt einem Java-Programm wichtige Ressourcen zur Verfügung.</p></dd><dt>Bytecode Verifier<span class="colon">:</span></dt><dd><p>Überprüft, ob die geladenen Bytecodes der JVM-Spezifikation entsprechen.</p><p>Klassen können über das Netz oder aus dem lokalen Dateisystem zur Laufzeit einer Java-Anwendung in das Laufzeitsystem nachgeladen werden</p><p>Ein Teil der Sicherheitsmaßnahmen wird durch den Bytecode Verifier realisiert.</p></dd></dl><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Die Sicherheit, die der Bytecode-Verifier und Java als solches bietet - ist nicht ausreichend, um die Sicherheit des Systems zu gewährleisten.</p></aside><aside class="admonition incremental" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Führen Sie (Java) Programme oder auch Bibliotheken (Stichwort: <em>Supply-Chain Attacken</em>), denen Sie nicht vertrauen, niemals aus. Überzeugen Sie sich, dass die Bibliotheken, die sie verwenden legitim sind.</p></aside></ld-story></ld-topic>
<ld-topic id="java-ubersetzung"><h2>Java-Übersetzung</h2><ul class="simple"><li><p>Die Eingabe für <code class="console">javac</code> sind ein oder mehrere Java-Dateien, die jeweils die eine oder mehrere Klassendefinitionen enthalten.</p></li><li><p>Eine derartige Datei nennt man eine Übersetzungseinheit.</p></li><li><p>Die Ausgabe ist pro Klasse X genau eine Datei X.class, die den Bytecode der Klasse enthält.</p></li></ul><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><ld-deck><ld-card><p class="rubric">HelloWorld.java (im Default Package)</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1">
