<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>
</head>
<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic class="new-section" id="sicherheitsprinzipien-von-jerome-saltzer-und-michael-schroeder-1975"><h2>Sicherheitsprinzipien von Jerome Saltzer und Michael Schroeder, 1975 <a class="citation-reference" href="#saltzerschroeder75" id="citation-reference-1" role="doc-biblioref">[SaltzerSchroeder75]</a></h2></ld-topic>
<ld-topic id="die-sicherheitsprinzipien-von-saltzer-schroeder-hintergrund"><h2>Die Sicherheitsprinzipien von Saltzer &#x26; Schroeder – Hintergrund</h2><ul class="list-with-explanations"><li><p>Saltzer und Schroeder forschten 1975 hauptsächlich im Bereich Betriebssysteme</p><p>Insbesondere <a class="reference external" href="https://de.wikipedia.org/wiki/Multics">Multics.</a> <a class="citation-reference" href="#saltzer73" id="citation-reference-2" role="doc-biblioref">[Saltzer73]</a>, <a class="citation-reference" href="#saltzer74" id="citation-reference-3" role="doc-biblioref">[Saltzer74]</a></p></li><li><p>Die Prinzipien sind vielfach direkt aus der Entwicklung von Betriebssystemen abgeleitet</p></li></ul></ld-topic>
<ld-topic id="die-acht-sicherheitsprinzipien-von-saltzer-schroeder"><h2>Die acht Sicherheitsprinzipien von Saltzer &#x26; Schroeder</h2><ld-story><dl class="incremental-list dd-margin-left-4em field-list"><dt><em>Economy of Mechanism</em> (auch bekannt unter <em>Principle of Simplicity</em>)<span class="colon">:</span></dt><dd><p>Das Design der Sicherheitsmechanismen sollte so einfach wie möglich sein.</p><ld-supplemental embed-in-document-flow=""><p>Das Ziel ist es, die Korrektheit des Designs/der Implementierung zu fördern, da dieses dann schneller verstanden wird und auch einfacher getestet werden kann. Weiterhin reduziert es die Angriffsfläche.</p><p>(Hintergrund: Der <em>Happy-Path</em> ist typischerweise gut getestet und selten ein Sicherheitsproblem, jedoch gibt es in komplexer Software häufig Pfade, die nicht (vollständig) getestet/analysiert wurden und dann ein Problem sind.)</p><blockquote><p>Beispiele:</p><ul class="simple"><li><p>das Unix-Dateirechtesystem</p></li><li><p>Mailbox-Kommunikation zwischen Systemen und Komponenten</p></li><li><p>...</p></li></ul></blockquote></ld-supplemental><ld-presenter-note encrypted="">MTAwMDAw:yss+uionwTfVM5bZc+UU0p7nJOlaU5lxZy65HCQEg8U=:cKvHKuRd4JLL4kdG:w+/i2AgkLq3bVZknk2g4YQ/Y/UMA26OHRNiq8JHYeHiTIk48i4U0Xojt7s2P61pz5ROJbIddaQLz3VsTnqRkSKmFeWLZe8r1nupA6QeoT5Ykghal5Srv5hPN4/ulP0mktHT5BDtQEAt2fhF4MU0zCfBCtYP19T9Uy+nWy5TvSMj91kDZaT0IG7J59xfRt8rM/kDAW17u</ld-presenter-note></dd><dt><em>Fail-Safe Defaults</em><span class="colon">:</span></dt><dd><p>Standardmäßig sollte der Zugriff auf Ressourcen (durch Prozesse/Programme) verweigert werden.</p><ld-supplemental embed-in-document-flow=""><p>Es ist gefordert, dass Zugriffsrechte auf (expliziter) Erlaubnis beruhen und nicht auf (explizitem) Ausschluss.
Der gegenteilige Ansatz – „Alles ist erlaubt, solange es nicht explizit verboten ist“ – ist nicht tragfähig. Ein fehlendes Recht fällt normalerweise während der Nutzung unmittelbar auf; ein überflüssiges Recht hingegen verursacht keinerlei Probleme und fällt deswegen im Normalbetrieb nicht auf.</p></ld-supplemental></dd><dt><em>Complete Mediation</em><span class="colon">:</span></dt><dd><p>Zugriffsanfragen eines Subjekts auf ein Objekt werden <em>jedes Mal</em> vollständig auf ihre Zulässigkeit hin überprüft.</p><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Bei modernen Zero-Trust-Ansätzen wird konzeptionell jeder Zugriff – unabhängig vom Netzwerkstandort – erneut authentifiziert und autorisiert. Dies ist grundsätzlich eine Anwendung des <em>Principle of Complete Mediation</em>. Zu unterscheiden sind jedoch Ansätze, die das Ergebnis einer Autorisierungsentscheidung mit fester Ablaufzeit zwischenspeichern (z. B. Authorization-Tokens), und solche, bei denen Rechteänderungen aktiv an alle Durchsetzungspunkte übermittelt werden. Im ersten Fall bleiben entzogene Rechte bis zum Ablauf gültig – das Prinzip wird hier zugunsten von Performance und Skalierbarkeit nur eingeschränkt umgesetzt.</p><p>Dieses Prinzip wurde 2012 von Smith<a class="citation-reference" href="#smith2012" id="citation-reference-4" role="doc-biblioref">[Smith2012]</a> für obsolet erklärt; wie sich jedoch zeigt (Zero-Trust-Ansätze), sind grundlegende Sicherheitsprinzipien von Dauer.</p></aside><ld-supplemental embed-in-document-flow=""><p>Bei der Entwicklung einer Serveranwendung besagt das <em>Principle of Complete Mediation</em> somit, dass bei jeder Anfrage zu überprüfen ist, ob der Nutzer die entsprechenden Rechte besitzt.</p></ld-supplemental></dd><dt><em>Open Design</em><span class="colon">:</span></dt><dd><p>Das Prinzip besagt, dass die Sicherheit eines Mechanismus nicht von der Geheimhaltung seines Designs oder seiner Implementierung abhängen sollte.</p><p>(Vgl. Kerckhoffs-Prinzip: Die Sicherheit eines Kryptosystems sollte nur von der Geheimhaltung des Schlüssels abhängen.)</p></dd><dt><em>Separation of Privilege</em><span class="colon">:</span></dt><dd><p>Ein Sicherheitsmechanismus sollte – wenn möglich – nur dann Zugriff gewähren bzw. eine Ausführung erlauben, wenn <strong>mehrere unabhängige Bedingungen zutreffen</strong>. D. h. sollte eine Bedingung kompromittiert sein (z. B. ein abgegriffenes Passwort), dann hat der Angreifer dennoch keinen Zugriff.</p><ld-supplemental embed-in-document-flow=""><p>Dieses Prinzip wird dann eingehalten, wenn ein Angreifer, der eine Bedingung überwunden hat, nicht die Rechte erhält, um Zugriff auf das System zu erlangen. Zum Beispiel ist es für Geldüberweisungen notwendig, diese auf zwei verschiedene Arten zu autorisieren. Im Allgemeinen ist 2-Faktor-Authentifizierung eine Anwendung dieses Prinzips.</p><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p><em>Privilege Separation</em> (für Programme) sollte nicht mit dem hier beschriebenen Prinzip verwechselt werden. <em>Privilege Separation</em> liegt zum Beispiel dann vor, wenn ein Programm in zwei Teile aufgeteilt ist und ein Teil – zum Beispiel zum Zugriff auf Betriebssystemressourcen wie Sockets oder bestimmte Dateien – höhere Rechte benötigt als der Rest des Programms. In diesem Fall erfolgt dann der Austausch zwischen den beiden Teilen über eine wohldefinierte, minimale Schnittstelle, die genau festlegt, was der unprivilegierte Teil vom privilegierten Teil anfordern darf. Somit sind die Rechte des unprivilegierten Teils auf das notwendige Minimum beschränkt.</p></aside></ld-supplemental></dd><dt><em>Least Privilege</em> (auch bekannt als <em>Principle of Least Authority</em>)<span class="colon">:</span></dt><dd><p>Jedes Programm und jeder Benutzer sollte nur die für seine Aufgabe unbedingt notwendigen Rechte besitzen.</p><ld-supplemental embed-in-document-flow=""><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel: Rechte eines Webservers</span></p><p>D. h. ein Nutzer (zum Beispiel „der Nutzer“, unter dem der Webserver läuft) sollte nach dem Einrichten keine Rechte haben, existierende Dateien, die für den Systembetrieb relevant sind, zu manipulieren, oder solche die sicherheitskritische Informationen beinhalten, zu lesen. Diese Rechte müssen – wenn begründet benötigt – erst explizit gewährt werden.</p></aside><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel: Eingeschränkte Rechte zum Öffnen von Ports</span></p><p>Ein normaler Nutzer darf auf einem Linux-basierten System keine privilegierten Ports öffnen.</p></aside></ld-supplemental></dd><dt><em>Least Common Mechanism</em><span class="colon">:</span></dt><dd><p>Die Sicherheitsmechanismen sollten über Nutzer (insbesondere aber auch Programme, die andere Programme nutzen) hinweg möglichst wenige gemeinsame (Laufzeit-)Abhängigkeiten haben.</p><ld-supplemental embed-in-document-flow=""><p>(~ <span class="ger">Grundsatz des kleinsten gemeinsamen Mechanismus</span>)</p><p><strong>Beispiel</strong></p><p>Das Prinzip besagt zum Beispiel, dass die Mechanismen, die von mehreren Benutzern verwendet werden oder von denen mehrere Nutzer abhängen, minimiert werden sollten.</p><p>Das Prinzip kann/sollte auf ganz verschiedenen Ebenen angewendet werden:</p><ul><li><p>Z. B. sollten keine gemeinsamen Speicherbereiche verwendet werden, in denen möglicherweise sicherheitsrelevantes Material vorgehalten wird; es ist deswegen z. B. sinnvoll – wenn möglich – auf Implementierungen im Kernel zu verzichten und stattdessen auf User-Space-Implementierungen zu setzen.</p><p>TCP-Connection–Hijacking-Angriffe werden bzw. wurden z. B. durch die direkte Implementierung des TCP-Stacks im Linux-Kernel ermöglicht.</p></li><li><p>Z. B. wird derselbe (physikalische) Speicher von mehreren Programmen (von verschiedenen Nutzern) genutzt, so gab es in der Vergangenheit mehrere erfolgreiche Angriffe, die es erlaubt haben, aus dem Speicher Information auszulesen, der logisch anderen Programmen zugeordnet war – ggf. sogar über die Grenzen von virtuellen Maschinen hinweg. (Rowhammer, Meltdown/Spectre)</p></li></ul></ld-supplemental></dd><dt><em>Psychological Acceptability</em><span class="colon">:</span></dt><dd><p>Die Sicherheitsmechanismen sollten einfach zu verstehen und zu benutzen sein.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel: Komplexe Passwortrichtlinien</span></p><p>Komplexe Passwortrichtlinien erweisen sich in der Praxis häufig als kontraproduktiv, da Menschen dann auf vorhersagbare Muster und häufig verwendete Konstruktionsschemata zurückgreifen.</p></aside></dd></dl></ld-story></ld-topic>
<ld-topic class="new-section transition-fade" id="weiterfuhrende-sicherheits-prinzipien"><h2>Weiterführende (Sicherheits-)Prinzipien</h2></ld-topic>
<ld-topic id="ausgewahlte-erganzende-prinzipien-mit-sicherheitsbezug"><h2>Ausgewählte ergänzende Prinzipien mit Sicherheitsbezug</h2><ld-story><dl class="incremental-list field-list"><dt><em>Isolation</em><span class="colon">:</span></dt><dd><p>Die Sicherheitsmechanismen sollten so entworfen sein, dass Fehler in einem Teil des Systems nicht die Sicherheit des gesamten Systems gefährden; d. h. die einzelnen Komponenten sollten möglichst unabhängig voneinander sein und nur über wohldefinierte Schnittstellen miteinander kommunizieren und entsprechende Sicherheitsüberprüfungen durchführen.</p><ld-supplemental><p><strong>Beispiel</strong></p><ol class="arabic simple"><li><p>Virtuelle Maschinen können genutzt werden, um Anwendungen in einer isolierten Umgebung auszuführen. Einem Angreifer, der eine Anwendung kompromittiert hat, ist es somit deutlich erschwert, auf andere Anwendungen oder das Betriebssystem zuzugreifen.</p></li><li><p>Typischerweise kommuniziert zum Beispiel ein Basebandchip (LTE, 5G, ...) mit dem Betriebssystem über eine minimale Schnittstelle, über die nur Nachrichten übermittelt werden können, die leicht auf ihre Korrektheit überprüft werden können. Insbesondere sollte kein direkter Zugriff auf den Speicher des Betriebssystems erfolgen.</p></li></ol><p>Einen Angreifer ist es somit ggf. möglich den Basebandchip anzugreifen und ggf. zu kompromittieren, aber er kann nicht direkt auf das Betriebssystem zugreifen und Nachrichten, die bereits auf Betriebssystem oder Anwendungsebene verschlüsselt werden, sind weiterhin sicher.</p></ld-supplemental></dd><dt>Modularity<span class="colon">:</span></dt><dd><p>Die Sicherheitsmechanismen sollten so entworfen sein, dass sie unabhängig voneinander implementiert und geprüft werden können.</p><ld-supplemental><p>Hier gibt es Überschneidungen bzw. Anknüpfungspunkte mit dem <em>Principle of Economy of Mechanism</em>.</p></ld-supplemental></dd><dt>Layering<span class="colon">:</span></dt><dd><p>Die Sicherheitsmechanismen sollten in Schichten organisiert sein.</p><p>(Heutzutage spricht man auch von <em>Defense in Depth</em> – versagt eine Schicht, greift die nächste.)</p><ld-supplemental><p>Beispiel für ein Schutzsystem für Netzwerke, das mehrere Schichten verwendet:</p><ul class="simple"><li><p>einfache (und effiziente) zustandslose Paketfilter auf unterster Ebene</p></li><li><p>zustandsbehaftete Paketfilter</p></li><li><p>Application-Level-Gateway</p></li></ul></ld-supplemental></dd><dt>Principle of Least Astonishment<span class="colon">:</span></dt><dd><p>Die Sicherheitsmechanismen sollten so entworfen sein, dass sie keine Überraschungen für die Benutzer bereithalten.</p></dd></dl></ld-story></ld-topic>
<ld-topic class="exercises" id="ubung"><h2>Übung</h2><ld-story><div class="ld-exercise incremental" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Principle of Open Design"><p class="ld-exercise-title rubric"><span><em>Principle of Open Design</em></span></p><p>Benennen Sie ein historisches Verschlüsselungsverfahren, das gegen das <em>Principle of Open Design</em> verstoßen hat.</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:PCB7dauE0lTzDenggW/EpsQ0cBO7ZJEGn0YUxZSwgR0=:xpvxX0Ab9Q6P9qC5:gRMtthwO563JzMJ3QSXYUfhnw81w0HFm6yU6KDCus+TO3K5AYNaHSGLEcrRbslMC6efUJ5ncz8XyR9t/NtmoN0ycTTcjSksKcYKY+kRXXiWtEfQpu1Ks+JaEVjd35n/cOqDzS9ekejdHpjdfE1tfSSxxE8AuNvPdgcEmUUP6QZ8n93sqEurzlGa7bOeC8VYf5YuDBuNJ1yIuTTor//3oM2NvKJx5DP8WtLGkyvKLOO4M66gDtMJv0YqQKAdyC1tGFXfG21HkbmdkMyPg60dZfrdsC3wBiS0lgqyt/9S33BOnzWlgjKyEI5UQ8iQ/NKfYBA4mtZcYH3q/hDTUO1DqLclzf9oxOa9I9pY3NVgcLxc3wDHe1PVC</div></div><div class="ld-exercise incremental" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - PINs als Sicherheitsmechanismus"><p class="ld-exercise-title rubric"><span>PINs als Sicherheitsmechanismus</span></p><p>Stellen Sie sich vor, dass Sie als PIN (z. B. für ein Tablet) folgende Zahl verwenden wollen, diese aber abgelehnt wird (Leerzeichen dienen nur der Lesbarkeit):</p><p><span class="docutils literal">3671 1197 4769</span></p><p>Während als PIN das folgende Passwort akzeptiert wird:</p><p><span class="docutils literal">1364 7964 1364</span></p><p>Wie bewerten Sie dies?</p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Schauen Sie sich ggf. ein PIN-Pad an.</p></aside><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:lkRkPu2z5qRzMrTpZPiwkmXh9XQFjVTZ/O+LNz3aqok=:btuvERPz8Wd4FGMs:LV58gkSDFC8aIk7HVK+BhinSX3WGNm3b5D67Vl38Bq2DcrsHodSttcA2R+w10WIK8O/oc5fIbU45RNv04QHOWEXhInMBe47S6E37I8iyxF/XxSbLyl/0svaoc4RoFVqJcCzV9M0O8WV0YDkQN2vv5LNcGaEZCeK5VX1yTwRZPmBNlXWhbcj9+HCJMkTFERlB5SCo6Ng40fY1X <ld-topic class="exercises" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-3" data-exercise-id="3" data-exercise-title="3 - Browser"><p class="ld-exercise-title rubric"><span>Browser</span></p><p>Der Chrome-Browser (zum Beispiel) unterstützt die so genannte <a class="reference external" href="https://support.google.com/chrome/a/answer/7581529?hl=de">Isolierung von besuchten Websites</a>.
Bei dieser werden Seiten von verschiedenen Websites in unterschiedliche Prozesse aufgeteilt.</p><p>Welches Prinzip bzw. welche Prinzipien wird/werden hier umgesetzt?</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:+NZdWbeQkYmd3M0rpJ5cRFrba+pue6tM/HFM6krMZi8=:n7J67D/HJuxb9roi:YgV5p2F7JICkpkLqkgmipj9iIk0/lB/xbGp1OGvFgJtkH1qLl370A0+UUZi4FDzhpq0tyA20XsgzGhXp6xaOhTwaJeSsnBNJUd7rXkYW0+u9lMLFFUtiDFAXIqmt0rqwoNIsAw1z9vjdg7Z0u2JVQcAkOg04rv/qciqUAe0GriBoBYPwJY9bwLwppiVayfQhnr2cfYLTbAklQ8xRVcjr1Yjo8/m0ayqzQolhC1iVdyecQzc9B+nNmMWBK0RrvC6mOg2DMznCWQvQmxjDPeLT8SrfbFKpwuZMBZKZu5VU0qqhYw0W7wV1LS3bTkM9AFS+d3aTgRHU1ifMzumtwZPAkr9mMdt9ZKTatYhbBRXPfPaqersd39jkvg3Ex7DtVQhMwWFGkc+F4fonWfDxsTaho8fcbZe69GFq3W02z+kIzQfFCrrCHrl6uY7tCZmJ92gp/K55B0sbs962XwevqSOeac2amCXc5+UnMfF7F8NTW+nP/tby+cJ0olKIWdbm4Cdg0PaIRi0UKSDnJ82+DmcEa6AHMX+QWOC0PYYvbJNP7OQXw85ZhR1lJi233paXtqvn6CD94rat0Sw6</div></div><div class="ld-exercise incremental" id="ld-exercise-4" data-exercise-id="4" data-exercise-title="4 - Post-Quanten-Kryptografie"><p class="ld-exercise-title rubric"><span>Post-Quanten-Kryptografie</span></p><p>Algorithmen und Signaturverfahren, insbesondere solche, die auch im Zeitalter der Quantencomputer noch sicher sein sollen (ML-KEM, ML-DSA und SLH-DSA), wurden bereits im Rahmen von offenen Wettbewerben entwickelt bzw. ausgesucht. Wie bewerten Sie dieses Vorgehen?</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:2UoV1iFTokDUHrKFLf+bUHUyqEdcu6R/eYKiNedvmYY=:VrcdMFDjBGsk5BIJ:N/ZqtinkBDGeXqQ1Ev1kTWANmiFvjTMZiXiUyj4yU+T9GLOzYv++EoEexyoM+2WWxWJLOkX7Oyt+MkkGXNYgffwqFw10qDBVnQxF/WUN0PYbr4V+QawThRdrh40VydkBjLm9v4uq9VvuhLj9uWBIE85YmLrSzEfFDq5r5eEzM5ERZf92T1M5bgZN9nQhVaW0Aitus4L9aXkPe7yjh6saTpUF0qRsXaB4m45roFInRXlVeVKhpmmN8GGRvrAQDEk05OhtfO56NZqjnw96eUQBukfNiR1F0P3e6QXTtSeBBnmH69dMOrdzqoeUAAM60W4BVFdKTgfU4P3PlqlChqeOz4uiU3QYZWVrAUzcmRLIGO3fuPYtmGPmUCBbKkigpxBewwiVKLx9rldhHYGfW0DmdV1LDL/KX4nGodMFfI2SnJjkYRQi6a1ptH01LN/tnreC8cmg0N0bt32dEcxZK0I3hKYYH7zZzz9dXCow2xSi5G4p9HQY1Vsl <ld-topic class="exercises" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-5" data-exercise-id="5" data-exercise-title="5 - Rechte von im Hintergrund laufenden Prozessen auf Servern"><p class="ld-exercise-title rubric"><span>Rechte von im Hintergrund laufenden Prozessen auf Servern</span></p><p>Es ist üblich, dass für Prozesse, die auf Servern im Hintergrund laufen, eigene Nutzerkonten eingerichtet werden.</p><ul class="simple"><li><p>Warum ist dies so?</p></li><li><p>Welche Rechte sollten diese „Nutzer“ bekommen?</p></li><li><p>Was sollte weiterhin beachtet werden?</p></li></ul><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:WbpQyWw1lEBrsM85qQpCcbzqxlb/dwaAAu/rfyFv5VU=:tw3gWlMfML/CfYrb:htnqE8BJGvYlvoyRTHrDwehAmysgXUa2rGbodb8cu9I7MY6Y4sf6K3MEwit6fB/iHFNhrUeSBr7Cae8Mz/5MZ9Sj7Ca15bEmzYwjn+arhF1St1yJftx74y4I/2Eyk4sNvqtio+8W2cQmvIfGlax8K7TBfewvsniVI79uHW6gtecfz/J/tOGqO88aJQSprCCtkz9p6WG1IcrWlH9pO9nqj97ZWIli/Cj20z4Jj7Hp+0McsgCRbkxAL0ux8cNuWS9bpkNV9lS76VPUOVhMUB3iAHnwe+fHJzqhmWXxbroaQDaPcQXGKINa/ffqXhxiYFeheMUOb8pSIyuKZR7VoVdPGNd9D75vCaDeEvDNVGAfEBRyJ4txk1nUrr5P6uwAtvwR5kYx3nl1n0FXYkXWEkgvp6kaQNIYVENGjGX5XxG3s29kDlWa7U3vBzrmeBbJW34jPHRoCgKLN6/A/1z0R/z7Qe9LDha8HkTxpjGaAzwMgGW/rAVs1haIh9xve7WPkBXH375stZrViJrZom5dY/TM+jhYHsNNOA23yEdzKSQeNbMYtZxpnO37WSzqbTAcxYmHWOPwuqtXY4TnQo0I8F98Ti2pog1nBAxRg4xK9+wJQXxQk62ikFMNPfALtQvSsQ4dFd2Zecd9dzDMxWVJrBfp6vi9SmLiH+dqaI8dFipR/g==</div></div></ld-topic>
