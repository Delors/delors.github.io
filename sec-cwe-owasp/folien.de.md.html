Dies erfolgte insbesondere zur Unterstützung bei der Generierung von Grafiken
(d. h. SVG Dateien), oder um sich Übersichtstabellen generieren zu lassen.
Weiterhin wurde KI zur allgemeinen Qualitätssicherung eingesetzt.
Inhalte, die ggf. von der KI vorgeschlagen wurden, wurden im Falle der
Übernahme explizit validiert und angepasst.</p></dd></dl></ld-supplemental></ld-topic>

<ld-topic class="new-subsection transition-move-to-top" id="cwe-79-improper-neutralization-of-input-during-web-page-generation-cross-site-scripting-or-xss"><h2>CWE-79: Improper Neutralization of Input During Web Page Generation (<em>Cross-site Scripting</em> or <em>XSS</em>)</h2><div class="section-subtitle"><p class="rubric">CWE Rank</p><table class="booktabs table-data-align-left table-header-align-left" style="width: 100%;"><colgroup><col style="width: 40.0%"><col style="width: 60.0%"></colgroup><thead><tr><th class="head"><p>Jahr</p></th><th class="head"><p>Position</p></th></tr></thead><tbody><tr><td><p>2024</p></td><td><p>#1</p></td></tr><tr><td><p>2023</p></td><td><p>#2</p></td></tr></tbody></table></div></ld-topic>
<ld-topic id="cwe-79-cross-site-scripting"><h2>CWE-79: <em>Cross-site Scripting</em></h2><dl class="field-list simple"><dt>Kurzbeschreibung<span class="colon">:</span></dt><dd><p>Nutzereingaben werden nicht oder falsch bereinigt, bevor sie in die Ausgabe eingefügt werden, die als Webseite für andere Benutzer verwendet wird.</p></dd></dl><!--The product does not neutralize or incorrectly neutralizes user-controllable input before it is placed in output that is used as a web page that is served to other users.--><dl class="field-list simple"><dt>Wahrscheinlichkeit des Missbrauchs<span class="colon">:</span></dt><dd><p>Hoch</p></dd><dt>Technische Auswirkungen<span class="colon">:</span></dt><dd><p>Speichermodifikation; DoS: Crash, Beendigung oder Neustart; Ausführen von nicht autorisiertem Code oder Befehlen</p></dd><dt>Betrifft<span class="colon">:</span></dt><dd><p>Zugriffskontrolle, Vertraulichkeit</p></dd><dt>Typen<span class="colon">:</span></dt><dd><p>Stored XSS (Typ 2), Reflected XSS (Typ 1), DOM-based XSS (Typ 0)</p></dd></dl><ld-supplemental><p>Durch eine XSS Lücke werden häufig Informationen abgegriffen (z. B. Session Cookies). Allerdings ist es ggf. auch möglich, dass der Angreifer die Session des Nutzers übernimmt und sich als dieser ausgibt.</p></ld-supplemental></ld-topic>
<ld-topic id="cwe-79-cross-site-scripting-stored-xss-typ-2"><h2>CWE-79: <em>Cross-site Scripting</em>: Stored XSS (Typ 2)</h2><object class="align-center" data="images/xss/stored-xss.svg" type="image/svg+xml" role="img" aria-label="Stored XSS"></object></ld-topic>
<ld-topic id="cwe-79-cross-site-scripting-reflected-xss-typ-1"><h2>CWE-79: <em>Cross-site Scripting</em>: Reflected XSS (Typ 1)</h2><object class="align-center" data="images/xss/reflected-xss.svg" type="image/svg+xml" role="img" aria-label="Reflected XSS"></object><ld-supplemental><p>Reflected XSS ist häufig schwerer auszunutzen, da der Angreifer den Nutzer dazu bringen muss, einen Link zu klicken, der den Angriffsvektor enthält. Bei Stored XSS ist dies nicht notwendig, da der Angriffsvektor bereits auf dem Server gespeichert ist.</p></ld-supplemental></ld-topic>
<ld-topic id="cwe-79-cross-site-scripting-dom-based-xss-typ-0"><h2>CWE-79: <em>Cross-site Scripting</em>: Dom-based XSS (Typ 0)</h2><object class="align-center" data="images/xss/dom-based-xss.svg" type="image/svg+xml" role="img" aria-label="Dom-based XSS"></object><ld-supplemental><p>Dom-based XSS ist am schwersten Auszunutzen, da der Angreifer den Nutzer dazu bringen muss den Schadcode in die Informationen einzubringen, die von dem Script verarbeitet werden (z. B. durch das Eingeben in ein Formular).</p></ld-supplemental></ld-topic>

<ld-topic id="cwe-79-cross-site-scripting"><h2>CWE-79: <em>Cross-site Scripting</em>:</h2><h3>Abhilfemaßnahmen, Erkennung und Abwehr</h3><ld-deck class="incremental"><ld-card><h4>Eingabevalidierung</h4><aside class="admonition text-align-center" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>Prüfe jeden Input!</p><pre class="literal-block"><code></code></pre></aside><div class="incremental"><p>Prüfung, dass alle auf dem Client durchgeführten Prüfungen auch auf dem Server vorgenommen werden.</p></div></ld-card><ld-card class="incremental"><h4>Cookies Verwendung</h4><ul class="simple"><li><p>Verringerung der Angriffsfläche mit dem Ziel möglichst wenig Daten in Cookies etc. zu speichern.</p></li><li><p>Verwendung von HttpOnly Cookies (d. h. Cookies, die nicht über JavaScript ausgelesen werden können).</p></li></ul></ld-card><ld-card class="incremental"><h4>Entwicklungszeit</h4><ul class="simple"><li><p>Beherzigen von Best Practices (<a class="reference external" href="https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html">XSS Prevention Cheat Sheet</a>)</p></li><li><p>Verwendung von geprüften/sicheren APIs</p></li><li><p>Statische Analyse Werkzeuge</p></li></ul></ld-card><ld-card class="incremental"><h4>Setzen der CSP (Content Security Policy)<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></h4><div style="width: 71ch; height: 25.47ch;"><svg viewBox="48 68 1104 396" xmlns="http://www.w3.org/2000/svg">

    <!-- Definition Section -->
    <g id="definition">
        <rect x="50" y="70" width="1100" height="140" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="8"/>
        <text x="70" y="100" font-size="20" font-weight="bold" fill="#1565c0">
        1. Definition der CSP
        </text>

        <!-- HTTP Header -->
        <rect x="70" y="120" width="500" height="70" fill="#fff" stroke="#64b5f6" stroke-width="2" rx="4"/>
        <text x="90" y="145" font-size="16" font-weight="bold" fill="#0d47a1">HTTP Header:</text>
        <text x="90" y="165" font-size="14" font-family="monospace" fill="#424242">
        Content-Security-Policy:
        </text>
        <text x="90" y="183" font-size="14" font-family="monospace" fill="#1976d2">
        default-src 'self'; script-src 'self'
        </text>

        <!-- Meta Tag -->
        <rect x="600" y="120" width="500" height="70" fill="#fff" stroke="#64b5f6" stroke-width="2" rx="4"/>
        <text x="620" y="145" font-size="16" font-weight="bold" fill="#0d47a1">HTML Meta-Tag:</text>

        &lt;meta http-equiv="Content-Security-Policy"
        </text>

        content="default-src 'self'"&gt;
        </text>

</svg></div><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p><span class="peripheral">(Dies löst nicht das Problem, minimiert aber ggf. die Auswirkungen!)</span></p></aside></aside><ld-supplemental><p class="rubric">CSP</p><ul><li><p>CSP erlaubt die Kontrolle darüber, welche Ressourcen, insbesondere auch JavaScript-Ressourcen, ein Dokument laden darf.</p></li><li><p>Auswirkungen &#x26; Schutz</p><ul class="positive-list"><li><p>Schutz vor XSS: Blockiert unerlaubte Inline-Scripts und externe Scripts von nicht-vertrauenswürdigen Quellen.</p></li><li><p>Data Injection Prevention: Verhindert Einschleusung von bösartigen Inhalten durch strikte Kontrolle erlaubter Ressourcen-Quellen.</p></li><li><p>Clickjacking-Schutz: <code class="http">frame-ancestors</code> kontrolliert, wo die Seite in Frames eingebettet werden darf.</p><pre class="code http literal-block"><code>Content-Security-Policy<span class="punctuation">:</span> frame-ancestors 'none'</code></pre></li><li><p>Violation Reporting: <span class="s">report-uri oder</span> report-to: Verstöße werden an definierte Endpunkte gemeldet.</p></li><li><p>HTTPS-Erzwingung: <code class="http">Content-Security-Policy<span class="punctuation">:</span> upgrade-insecure-requests</code>: HTTP wird automatisch zu HTTPS aufgewertet.</p></li></ul></li><li><p>Empfehlung: Starten Sie mit <code class="http">report-only</code> Mode, um Auswirkungen zu testen.</p><pre class="code http literal-block"><code>Content-Security-Policy-Report-Only<span class="punctuation">:</span> &lt;policy&gt;</code></pre></li></ul></ld-supplemental></ld-card></ld-deck></ld-topic>
<ld-topic class="new-subsection transition-move-to-top" id="cwe-89-improper-neutralization-of-special-elements-used-in-an-sql-command-sql-injection"><h2>CWE-89: Improper Neutralization of Special Elements used in an SQL Command (<em>SQL Injection</em>)</h2><div class="section-subtitle"><p class="rubric">CWE Rank</p><table class="booktabs table-data-align-left table-header-align-left" style="width: 100%;"><colgroup><col style="width: 40.0%"><col style="width: 60.0%"></colgroup><thead><tr><th class="head"><p>Jahr</p></th><th class="head"><p>Position</p></th></tr></thead><tbody><tr><td><p>2024</p></td><td><p>#3</p></td></tr><tr><td><p>2023</p></td><td><p>#3</p></td></tr></tbody></table></div></ld-topic>
<ld-topic id="cwe-89-sql-injection"><h2>CWE-89: <em>SQL Injection</em></h2><ld-deck><ld-card><dl class="field-list simple"><dt>Kurzbeschreibung<span class="colon">:</span></dt><dd><p>Ein SQL-Befehl wird ganz oder teilweise unter Verwendung extern beeinflusster Eingaben von einer vorgelagerten Komponente erzeugt. Dabei werden aber spezielle Elemente nicht oder falsch bereinigt, die den beabsichtigten SQL-Befehl verändern könnten, wenn er an eine nachgelagerte Komponente gesendet wird.</p></dd><dt>Wahrscheinlichkeit des Missbrauchs<span class="colon">:</span></dt><dd><p>Hoch</p></dd><dt>Technologie<span class="colon">:</span></dt><dd><p>Datenbanken</p></dd><dt>Betrifft<span class="colon">:</span></dt><dd><p>Zugriffskontrolle, Vertraulichkeit, Integrität</p></dd></dl></ld-card><ld-card class="incremental"><div class="ld-exercise" id="ld-exercise-9" data-exercise-id="9" data-exercise-title="9 - MS SQL"><p class="ld-exercise-title rubric"><span>MS SQL</span></p><pre class="code sql literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">SELECT</span> ITEM<span class="punctuation">,</span>PRICE
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">FROM</span> PRODUCT
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">WHERE</span> ITEM_CATEGORY<span class="operator">=</span><span class="literal string">'$user_input'</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">ORDER</span> <span class="keyword">BY</span> PRICE</code></pre><aside class="admonition incremental" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>MS SQL hat eine eingebaute Funktion, die es erlaubt Shell Befehle auszuführen. Diese Funktion kann auch in einem SQL Statement verwendet werden.</p></aside><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:Ysk3pZ7nth3Qr53/T4ULtKq91FVy52Qxzj0Sn0YNHRc=:RBUVscMP89Yamq5F:ugQAL32o5C+XrUeoyZrF6sKf/iSnAusFIcfR1f5IakdimxNGbyh8wV+JOQ/kOjUqMGT8Us4NN+f01Cwul83a7H36PH1EiJPUUkTpBgDC5hX/bcXyIlFARrNfBNGkQDNLWZL3yVDuExxsb/gmEIylBRJJlO+b3E0HccjtDHmJs6+f1AIBny8rfJu5HOTndW9/wC/QcNBI</div></div></ld-card><ld-card class="incremental"><div class="ld-exercise" id="ld-exercise-10" data-exercise-id="10" data-exercise-title="10 - PHP"><p class="ld-exercise-title rubric"><span>PHP</span></p><pre class="code php literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name variable">$id</span> <span class="operator">=</span> <span class="name variable">$_COOKIE</span><span class="punctuation">[</span><span class="literal string">"mid"</span><span class="punctuation">]</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name function">mysql_query</span><span class="punctuation">(</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="literal string">"SELECT MessageID, Subject FROM messages WHERE MessageID = '<span class="name variable">$id</span>'"</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="punctuation">)</span><span class="punctuation">;</span></code></pre><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:9n8y1buRj/p//LNvbinxaeMLCoclbWuJjfs1FwEplTc=:zT0cXhTh+BeYL1bY:+R/c1R254ghlJKtZp7qTGcvaaGKgPqM050p1bmpNFYIUvfbj/VhYN9Orud8KleRaN6VPomVlBhh1tTQvaUmmLHODlJHvKet7LIgOri8uMJArSc/Zt3xhnWSt13WUrddIKgqpeOFCGqLe13v6ov+Y/LTIRylN7tlWau5aJJHR3l4Pup6Dl28Ejh9iTkstmJigY6kB0+d1GrTqZ5IkYaaBxnHXCr7yFOlUNZXH5LuZP3h5d9nxNgXf0fTFBS6K5qB3ObXesIIC0JMU6JITrWD5KZL0gmkUH0Juogsr3U08eluc7+4oYomISb0sV08gfve4pVcCEXR4US9nkIVJDOEUca5lVojokpPmbwQoUgaWkkoAhh8Dog0Lo/yLL3dCB6UumbY8wxG8yCu5zbYa0PELI+W2DxoYhuAsc3mOr6pLZ6SUQeN5Ury7F1jMYesqWbHYk2nVOHQ2Tc16ymOGJWqwvqRq+HAIsd4TLKav1CmengrfFQbt5y8n+Rb1rsLq3H0=</div></div></ld-card><ld-card class="incremental"><p class="rubric">Abhilfemaßnahmen und Erkennung</p><ul class="incremental-list list-with-explanations"><li><p>Verwendung von geprüften/sicheren APIs</p></li><li><p>Verwendung von <em>Prepared Statements</em></p></li><li><p>Datenbank nur mit den notwendigen Rechten betreiben</p><p>(<em>Principle of Least Privilege</em>)</p></li><li><p>Sollte es notwendig sein einen dynamischen SQL Befehl zu erstellen, dann sollten geprüfte Escapefunktionen verwendet werden</p></li><li><p>Statische Analyse Werkzeuge</p></li><li><p>ggf. Application-level Firewall einsetzen</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic class="new-subsection transition-move-to-top" id="cwe-416-use-after-free-uaf"><h2>CWE-416: Use After Free (UAF)</h2><div class="section-subtitle"><p class="rubric">CWE Rank</p><table class="booktabs table-data-align-left table-header-align-left" style="width: 100%;"><colgroup><col style="width: 40.0%"><col style="width: 60.0%"></colgroup><thead><tr><th class="head"><p>Jahr</p></th><th class="head"><p>Position</p></th></tr></thead><tbody><tr><td><p>2024</p></td><td><p>#8</p></td></tr><tr><td><p>2023</p></td><td><p>#4</p></td></tr></tbody></table></div></ld-topic>
<ld-topic id="cwe-416-use-after-free"><h2>CWE-416: Use After Free</h2><ld-deck><ld-card><dl class="field-list simple"><dt>Kurzbeschreibung<span class="colon">:</span></dt><dd><p>Referenzierung von Speicher nach der Freigabe kann dazu führen, dass ein Programm abstürzt, unerwartete Werte verwendet oder Code ausführt.</p></dd><dt>Wahrscheinlichkeit des Missbrauchs<span class="colon">:</span></dt><dd><p>Hoch</p></dd><dt>Programmiersprachen<span class="colon">:</span></dt><dd><p>C, C++</p></dd><dt>Betrifft<span class="colon">:</span></dt><dd><p>Verfügbarkeit, Vertraulichkeit, Integrität</p></dd></dl></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code C literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">char</span><span class="operator">*</span> ptr <span class="operator">=</span> <span class="punctuation">(</span><span class="keyword">char</span><span class="operator">*</span><span class="punctuation">)</span><span class="name function">malloc</span> <span class="punctuation">(</span>SIZE<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">if</span> <span class="punctuation">(</span>err<span class="punctuation">)</span> <span class="punctuation">{</span> abrt <span class="operator">=</span> <span class="literal number integer">1</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">           <span class="name function">free</span><span class="punctuation">(</span>ptr<span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span></code></pre><pre class="code C incremental literal-block"><small class="ln">1</small><code data-lineno="1"><span class="comment single">// ... Somewhere else in the code:</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">char</span><span class="operator">*</span> otherPtr <span class="operator">=</span> <span class="punctuation">(</span><span class="keyword">char</span><span class="operator">*</span><span class="punctuation">)</span><span class="name function">malloc</span> <span class="punctuation">(</span>SIZE<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">otherPtr<span class="operator">*</span> <span class="operator">=</span> <span class="operator">&lt;</span>HACKER CONTROLLED VALUE<span class="operator">&gt;</span><span class="punctuation">;</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span></code></pre><pre class="code C incremental literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">if</span> <span class="punctuation">(</span>abrt<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="comment single">// Next: use of ptr after free which uses the hacker controlled value</span>
</code><small class="ln">2</small><code data-lineno="2">            <span class="name function">logError</span><span class="punctuation">(</span><span class="literal string">"operation aborted before commit"</span><span class="punctuation">,</span> ptr<span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span></code></pre><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Ziel ist es im Allgemeinen eine Referenz auf einen interessanten Speicherbereich zu erhalten, der bereits freigegeben wurde und dann den Inhalt dieses Speicherbereichs auszulesen bzw. zu manipulieren, um die nächste Verwendung zu kontrollieren.</p></aside></aside></ld-card><ld-card class="incremental"><div class="ld-exercise" id="ld-exercise-11" data-exercise-id="11" data-exercise-title="11 - *Memoryallocation* in C"><p class="ld-exercise-title rubric"><span>*Memoryallocation* in C</span></p><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><pre class="code C literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name attribute">#<span class="keyword">include</span> <span class="literal string">&lt;stdlib.h&gt;</span></span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="name attribute">#<span class="keyword">include</span> <span class="literal string">&lt;stdio.h&gt;</span></span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="name attribute">#<span class="keyword">include</span> <span class="literal string">&lt;string.h&gt;</span></span>
</code><small class="ln"> 4</small><code data-lineno=" 4"><span class="name attribute">#<span class="keyword">define</span> BUFSIZER1 <span class="literal number integer">512</span></span>
</code><small class="ln"> 5</small><code data-lineno=" 5"><span class="keyword">int</span> <span class="name function">main</span><span class="punctuation">(</span><span class="keyword">int</span> argc<span class="punctuation">,</span> <span class="keyword">char</span> <span class="operator">*</span><span class="operator">*</span>argv<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">char</span> <span class="operator">*</span>buf1R1<span class="punctuation">,</span> <span class="operator">*</span>buf2R1<span class="punctuation">,</span> <span class="operator">*</span>buf2R2<span class="punctuation">;</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    buf2R1 <span class="operator">=</span> <span class="punctuation">(</span><span class="keyword">char</span> <span class="operator">*</span><span class="punctuation">)</span> <span class="name function">malloc</span><span class="punctuation">(</span>BUFSIZER1<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="name function">printf</span><span class="punctuation">(</span><span class="literal string">"buf2R1     -&gt; %p\n"</span><span class="punctuation">,</span>buf2R1<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="name function">free</span><span class="punctuation">(</span>buf2R1<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10">    <span class="name function">printf</span><span class="punctuation">(</span><span class="literal string">"[FREED]       %p\n"</span><span class="punctuation">,</span>buf2R1<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">11</small><code data-lineno="11">    buf2R2 <span class="operator">=</span> <span class="punctuation">(</span><span class="keyword">char</span> <span class="operator">*</span><span class="punctuation">)</span> <span class="name function">malloc</span><span class="punctuation">(</span>BUFSIZER1<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">12</small><code data-lineno="12">    <span class="name function">strncpy</span><span class="punctuation">(</span>buf2R2<span class="punctuation">,</span> argv<span class="punctuation">[</span><span class="literal number integer">1</span><span class="punctuation">]</span><span class="punctuation">,</span> BUFSIZER1<span class="operator">-</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">13</small><code data-lineno="13">    <span class="name function">printf</span><span class="punctuation">(</span><span class="literal string">"buf2R2     -&gt; %p\n"</span><span class="punctuation">,</span>buf2R2<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">14</small><code data-lineno="14">    <span class="name function">printf</span><span class="punctuation">(</span><span class="literal string">"buf2R2     =  %s\n"</span><span class="punctuation">,</span>buf2R2<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">15</small><code data-lineno="15">    <span class="name function">printf</span><span class="punctuation">(</span><span class="literal string">"!!! buf2R1 =  %s\n"</span><span class="punctuation">,</span>buf2R1<span class="punctuation">)</span><span class="punctuation">;</span>

<ld-topic id="cwe-78-os-command-injection"><h2>CWE-78: <em>OS Command Injection</em></h2><ld-deck><ld-card><dl class="field-list simple"><dt>Kurzbeschreibung<span class="colon">:</span></dt><dd><p>Alles oder zumindest ein Teil eines Betriebssystembefehls hängt von extern beeinflussten Eingaben ab. Es erfolgt jedoch keine Bereinigung spezieller Elemente, die den beabsichtigten Betriebssystembefehl verändern könnten.</p></dd></dl><!--The product constructs all or part of an OS command using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify the intended OS command when it is sent to a downstream component.--><dl class="field-list simple"><dt>Wahrscheinlichkeit des Missbrauchs<span class="colon">:</span></dt><dd><p>Hoch</p></dd><dt>Betrifft<span class="colon">:</span></dt><dd><p>Verfügbarkeit, Vertraulichkeit, Integrität</p></dd><dt>Arten<span class="colon">:</span></dt><dd><ol class="arabic simple"><li><p>Ein bestimmtes Program wird ausgeführt und die Nutzerdaten werden als Parameter übergeben.</p></li><li><p>Die Anwendung bestimmt basierend auf den Nutzerdaten welches Program mit welchen Parametern ausgeführt wird.</p></li></ol></dd></dl></ld-card><ld-card class="incremental"><div class="ld-exercise" id="ld-exercise-13" data-exercise-id="13" data-exercise-title="13 - OS Command Injection in Java"><p class="ld-exercise-title rubric"><span>OS Command Injection in Java</span></p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span>

<ld-topic class="new-subsection transition-move-to-top" id="cwe-20-improper-input-validation"><h2>CWE-20: Improper Input Validation</h2><div class="section-subtitle"><p class="rubric">CWE Rank</p><table class="booktabs table-data-align-left table-header-align-left" style="width: 100%;"><colgroup><col style="width: 40.0%"><col style="width: 60.0%"></colgroup><thead><tr><th class="head"><p>Jahr</p></th><th class="head"><p>Position</p></th></tr></thead><tbody><tr><td><p>2024</p></td><td><p>#12</p></td></tr><tr><td><p>2023</p></td><td><p>#6</p></td></tr></tbody></table></div></ld-topic>
<ld-topic id="cwe-20-improper-input-validation"><h2>CWE-20: Improper Input Validation</h2><ld-deck><ld-card><dl class="field-list simple"><dt>Kurzbeschreibung<span class="colon">:</span></dt><dd><p>Empfangene Eingaben oder Daten werden nicht nicht oder falsch validiert in Hinblick darauf, dass die Eingaben die Eigenschaften haben, die für eine sichere und korrekte Verarbeitung der Daten erforderlich sind.</p></dd></dl><!--The product receives input or data, but it does not validate or incorrectly validates that the input has the properties that are required to process the data safely and correctly.--><dl class="field-list simple"><dt>Wahrscheinlichkeit des Missbrauchs<span class="colon">:</span></dt><dd><p>Hoch</p></dd><dt>Betrifft<span class="colon">:</span></dt><dd><p>Verfügbarkeit, Vertraulichkeit, Integrität</p></dd><dt>Anwendungsbereiche<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Rohdaten - Strings, Zahlen, Parameter, Dateiinhalte, etc.</p></li><li><p>Metadaten - Information über die Rohdaten, wie zum Beispiel <em>Header</em> oder Größe</p></li></ul></dd></dl></ld-card><ld-card class="incremental"><p class="rubric">Zu verifizierende Werte und Eigenschaften</p><dl class="incremental-list dd-margin-left-6em field-list simple"><dt>Größen<span class="colon">:</span></dt><dd><p>Z. B. Länge, Häufigkeit, Preis, Rate, Anzahl der Vorgänge, Zeit usw.</p></dd><dt>Implizite oder abgeleitete Größen<span class="colon">:</span></dt><dd><p>Z. B. die tatsächliche Größe einer Datei anstelle einer angegebenen Größe.</p></dd><dt>Indizes*<span class="colon">:</span></dt><dd><p>Offsets oder Positionen in komplexeren Datenstrukturen.</p></dd><dt>Schlüssel<span class="colon">:</span></dt><dd><p>Z. B. von Hashtabellen oder assoziativen Feldern.</p></dd><dt>Syntaktische Korrektheit<span class="colon">:</span></dt><dd><p>Übereinstimmung mit der erwarteten Syntax.</p></dd><dt>Konsistenz<span class="colon">:</span></dt><dd><p>Z. B. zwischen den Rohdaten und Metadaten oder zwischen Referenzen.</p></dd><dt>Semantische Korrektheit<span class="colon">:</span></dt><dd><p>Z. B. Konformität mit domänenspezifischen Regeln, z. B. Geschäftslogik.</p></dd><dt>Authentizität<span class="colon">:</span></dt><dd><p>Z. B. von kryptografischen Signaturen.</p></dd></dl></ld-card><ld-card class="incremental"><p class="rubric">O'Reilly ist keine SQL Injection</p><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>Ein Name wie <span class="docutils literal">O'Reily</span> stellt ein Problem dar, wenn er in ein SQL Statement eingefügt wird, sollte jedoch von der Anwendung verarbeitet werden können und die Eingabevalidierung passieren.</p></aside><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Die Validierung muss immer in Hinblick auf den Kontext erfolgen.</p></aside></ld-card><ld-card class="incremental"><div class="ld-exercise" id="ld-exercise-14" data-exercise-id="14" data-exercise-title="14 - Partielle Validierung in C"><p class="ld-exercise-title rubric"><span>Partielle Validierung in C</span></p><pre class="code c literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name attribute">#<span class="keyword">define</span> MAX_DIM <span class="literal number integer">100</span></span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">int</span> m<span class="punctuation">,</span>n<span class="punctuation">,</span> error<span class="punctuation">;</span> <span class="comment single">/* m,n = board dimensions */</span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="name class">board_square_t</span> <span class="operator">*</span>board<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4"><span class="name function">printf</span><span class="punctuation">(</span><span class="literal string">"Please specify the board height: \n"</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">error <span class="operator">=</span> <span class="name function">scanf</span><span class="punctuation">(</span><span class="literal string">"%d"</span><span class="punctuation">,</span> <span class="operator">&amp;</span>m<span class="punctuation">)</span><span class="punctuation">;</span>

<ld-topic id="cwe-125-out-of-bounds-read"><h2>CWE-125: Out-of-bounds Read</h2><ld-deck><ld-card><dl class="field-list simple"><dt>Kurzbeschreibung<span class="colon">:</span></dt><dd><p>Daten vor oder nach einem Puffer werden gelesen.</p></dd></dl><!--The product reads data past the end, or before the beginning, of the intended buffer.--><dl class="field-list simple"><dt>Wahrscheinlichkeit des Missbrauchs<span class="colon">:</span></dt><dd><p>Hoch</p></dd><dt>Programmiersprachen<span class="colon">:</span></dt><dd><p>C, C++</p></dd><dt>Betrifft<span class="colon">:</span></dt><dd><p>Vertraulichkeit</p></dd><dt>Auswirkungen<span class="colon">:</span></dt><dd><p>Umgehung von Schutzmaßnahmen; Lesen von Speicher</p></dd></dl><ld-supplemental><p>Die Ausnutzung dieser Schwachstelle ist häufig schwierig, da nicht immer bekannt ist welche und wie viele Daten gelesen werden können. Es kann allerdings möglich sein Speicheradressen auszulesen. Dies kann ggf. genutzt werden, um Mechanismen wie ASLR zu umgehen.</p></ld-supplemental></ld-card><ld-card class="incremental"><div class="ld-exercise" id="ld-exercise-15" data-exercise-id="15" data-exercise-title="15 - Partielle Validierung in C"><p class="ld-exercise-title rubric"><span>Partielle Validierung in C</span></p><pre class="code C literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">int</span> <span class="name function">getValueFromArray</span><span class="punctuation">(</span><span class="keyword">int</span> <span class="operator">*</span>array<span class="punctuation">,</span> <span class="keyword">int</span> len<span class="punctuation">,</span> <span class="keyword">int</span> index<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">int</span> value<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="comment single">// check that the array index is less than the maximum length of the array</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="keyword">if</span> <span class="punctuation">(</span>index <span class="operator">&lt;</span> len<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="comment single">// get the value at the specified index of the array</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">        value <span class="operator">=</span> array<span class="punctuation">[</span>index<span class="punctuation">]</span><span class="punctuation">;</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="punctuation">}</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="comment single">// if array index is invalid then output error message</span>
</code><small class="ln">10</small><code data-lineno="10">    <span class="comment single">// and return value indicating error</span>
</code><small class="ln">11</small><code data-lineno="11">    <span class="keyword">else</span> <span class="punctuation">{</span>
</code><small class="ln">12</small><code data-lineno="12">        <span class="name function">printf</span><span class="punctuation">(</span><span class="literal string">"Value is: %d\n"</span><span class="punctuation">,</span> array<span class="punctuation">[</span>index<span class="punctuation">]</span><span class="punctuation">)</span><span class="punctuation">;</span>

</code><small class="ln">15</small><code data-lineno="15">    <span class="keyword">return</span> value<span class="punctuation">;</span>

<ld-topic id="cwe-22-path-traversal"><h2>CWE-22: <em>Path Traversal</em></h2><ld-deck><ld-card><dl class="field-list simple"><dt>Kurzbeschreibung<span class="colon">:</span></dt><dd><p>Externe Eingaben werden für die Konstruktion eines Pfadnamens verwendet, der eine Datei oder ein Verzeichnis identifizieren soll, das sich unterhalb eines eingeschränkten übergeordneten Verzeichnisses befindet. Eine Bereinigung spezieller Elemente innerhalb des Pfadnamens erfolgt jedoch nicht ordnungsgemäß, was dazu führen kann, dass der Pfadname zu einem Ort außerhalb des eingeschränkten Verzeichnisses aufgelöst wird.</p></dd></dl><!--The product uses external input to construct a pathname that is intended to identify a file or directory that is located underneath a restricted parent directory, but the product does not properly neutralize special elements within the pathname that can cause the pathname to resolve to a location that is outside of the restricted directory.--><dl class="field-list simple"><dt>Wahrscheinlichkeit des Missbrauchs<span class="colon">:</span></dt><dd><p>Hoch</p></dd><dt>Betrifft<span class="colon">:</span></dt><dd><p>Vertraulichkeit, Integrität, Verfügbarkeit</p></dd></dl></ld-card><ld-card class="incremental"><div class="ld-exercise" id="ld-exercise-16" data-exercise-id="16" data-exercise-title="16 - Path Traversal aufgrund fehlender Validierung"><p class="ld-exercise-title rubric"><span><em>Path Traversal</em> aufgrund fehlender Validierung</span></p><p><strong>PHP</strong></p><pre class="code php literal-block"><small class="ln">1</small><code data-lineno="1">&lt;?php

</code><small class="ln">13</small><code data-lineno="13"><span class="comment single"># do something with file_data</span></code></pre></ld-cell><ld-cell class="incremental" style="align-self:auto;"><blockquote class="epigraph"><p><strong>Dokumentation os.path.join</strong></p><p>Join one or more path components intelli- gently. The return value is the concatenation of path and any members of \*paths with ex- actly one directory separator following each non-empty part except the last, meaning that the result will only end in a separator if the last part is empty.                     <em>If a component is an absolute path [...], all previous components are thrown away and joining continues from the absolute path component.</em></p><p class="attribution">—<a class="reference external" href="https://docs.python.org/3.11/library/os.path.html#os.path.join">Python 3.11.7</a></p></blockquote></ld-cell></ld-grid><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-2" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-2">2</a><span class="fn-bracket">]</span></span><p>Verwirrende APIs gibt es in praktischen allen Sprachen!</p></aside></aside></ld-card><ld-card class="incremental"><p class="rubric">Abhilfemaßnahmen und Erkennung</p><ul class="incremental-list simple"><li><p>Eingabe vollständig validieren; zum Beispiel über kanonische Pfade</p></li><li><p>Sandboxen</p></li><li><p>Umgebung härten</p></li><li><p>Bei Fehlerausgaben darauf achten, dass keine Informationen über das Dateisystem preisgegeben werden</p></li><li><p>den Code mit minimalen Rechten ausführen</p></li></ul></ld-card></ld-deck></ld-topic>

<ld-topic id="cwe-352-cross-site-request-forgery"><h2>CWE-352: Cross-Site Request Forgery</h2><ld-deck><ld-card><dl class="field-list"><dt>Kurze Beschreibung<span class="colon">:</span></dt><dd><p>Die Webanwendung prüft nicht bzw. kann nicht prüfen, ob eine Anfrage absichtlich von dem Benutzer gestellt wurde, von dessen Browser sie übermittelt wurde.</p><p>D. h. eine CSRF Schwachstelle nutzt das Vertrauen aus, das eine Webseite in den Browser eines Nutzers hat. Bei einem CSRF-Angriff wird ein legitimer Nutzer von einem Angreifer dazu gebracht, ohne sein Wissen eine Anfrage zu übermitteln, die er nicht beabsichtigt hat und auch nicht bemerkt.</p></dd><dt>Missbrauchswahrscheinlichkeit<span class="colon">:</span></dt><dd><p>Mittel</p></dd><dt>Auswirkung<span class="colon">:</span></dt><dd><p>Hängt von den Nutzerrechten ab</p></dd><dt>Ausmaß<span class="colon">:</span></dt><dd><p>Vertraulichkeit, Integrität, Verfügbarkeit</p></dd></dl></ld-card><ld-card class="incremental"><p class="rubric">Ursprüngliche Form</p><object class="align-center" data="images/csrf.svg" type="image/svg+xml" role="img" aria-label="Cross-Site Request Forgery (CSRF) - ursprüngliche Form"></object><ld-supplemental><p class="rubric">Hintergrundwissen</p><p>Ursprünglich (d. h. für Cookies ohne modernes SameSite Attribut) war es so, dass ein Browser, immer wenn auf einen Seite zugegriffen wurde (z. B. mittels POST/GET Requests oder Fetch Zugriffe), dieser alle aktuellen Cookies bzgl. der Zieldomain mitgesendet hat. Dies galt unabhängig vom Browsertab/der Website aus dem der Zugriff heraus erfolgte. Dies konnte eine Angreiferwebseite im Rahmen von Cross-Site Request Forgery Attacken ausnutzen, um  authentifizierte Aktionen im Namen des Opfers auszuführen.</p></ld-supplemental></ld-card><ld-card class="incremental"><p class="rubric">Cross-Site Request Forgery (CSRF) in 2023</p><blockquote class="epigraph"><p>Fiber ist ein von Express inspiriertes Web-Framework, das in Go geschrieben wurde. In der Anwendung wurde eine Cross-Site Request Forgery (CSRF)-Schwachstelle entdeckt, die es einem Angreifer ermöglicht, beliebige Werte zu injizieren und bösartige Anfragen im Namen eines Benutzers zu fälschen. Diese Schwachstelle kann es einem Angreifer ermöglichen, beliebige Werte ohne Authentifizierung einzuschleusen oder verschiedene böswillige Aktionen im Namen eines authentifizierten Benutzers durchzuführen, wodurch die Sicherheit und Integrität der Anwendung gefährdet werden kann. Die Schwachstelle wird durch eine unsachgemäße Validierung und Durchsetzung von CSRF-Tokens innerhalb der Anwendung verursacht.</p><p class="attribution">—<a class="reference external" href="https://nvd.nist.gov/vuln/detail/CVE-2023-45128">CVE-2023-45128</a> (übersetzt mit DeepL)</p></blockquote><ld-supplemental><p class="rubric"><a class="reference external" href="https://nvd.nist.gov/vuln/detail/CVE-2023-45128">CVE-2023-45128</a></p><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Identifizierte Schwachstellen: <em>CWE-20</em> Improper Input Validation, <em>CWE-807</em> Reliance on Untrusted Inputs in a Security Decision, <em>CWE-565</em> Reliance on Cookies without Validation and Integrity Checking, <em>CWE-352</em> Cross-Site Request Forgery</p></aside></ld-supplemental></ld-card><ld-card class="incremental"><p class="rubric">Standardtechniken, die CSRF in 2023 verhindern <em>sollen</em></p><ul class="incremental-list simple"><li><p>Same-site Cookies (für Authentifizierung)</p></li><li><p>CSRF-Tokens, wenn diese die folgenden Eigenschaften haben:</p><ul class="simple"><li><p>Einmalig pro Nutzersession</p></li><li><p>Geheim</p></li><li><p>nicht vorhersagbar (z. B. eine sehr große, sicher erzeugte Zufallszahl)</p></li></ul></li><li><p>Validierung des Referer-Header</p></li><li><p>Custom Request Header, da diese nur vom JavaScript Code gesetzt werden können, der den gleichen Ursprung hat (siehe <em>Same Origin Policy</em> (SOP)).</p></li></ul><div class="incremental foundations"><p>Auch diese Techniken lassen sich ggf. (alle zusammen) aushebeln, <a class="reference external" href="https://portswigger.net/web-security/csrf">wenn die Anwendung weitere Schwachstellen aufweist</a>. So gibt/gab es Anwendungen, die Anfragen, die nur über ein POST request gestellt werden sollten, auch bei einem GET akzeptiert haben.</p></div><ld-supplemental><p>In allen Browsern wird in der Zwischenzeit für Cookies die Same-site Policy angewandt mit dem Wert <code>Lax</code>. Dieser Wert hat zur Folge, dass Cookies nur dann gesendet werden, wenn der Nutzer explizit auf einen Link klickt oder sich innerhalb derselben Seite befindet.</p></ld-supplemental></ld-card></ld-deck></ld-topic>
<ld-topic class="new-subsection transition-move-to-top" id="cwe-434-unrestricted-upload-of-file-with-dangerous-type"><h2>CWE-434: Unrestricted Upload of File with Dangerous Type</h2><div class="section-subtitle"><p class="rubric">CWE Rank</p><table class="booktabs table-data-align-left table-header-align-left" style="width: 100%;"><colgroup><col style="width: 40.0%"><col style="width: 60.0%"></colgroup><thead><tr><th class="head"><p>Jahr</p></th><th class="head"><p>Position</p></th></tr></thead><tbody><tr><td><p>2024</p></td><td><p>#10</p></td></tr><tr><td><p>2023</p></td><td><p>#10</p></td></tr></tbody></table></div></ld-topic>
<ld-topic id="cwe-434-unrestricted-upload-of-file-with-dangerous-type"><h2>CWE-434: Unrestricted Upload of File with Dangerous Type</h2><ld-deck><ld-card><dl class="field-list simple"><dt>Kurze Beschreibung<span class="colon">:</span></dt><dd><p>Es ist möglich potentiell gefährliche Dateien hochzuladen bzw. zu transferieren, die von der Anwendung automatisch im Kontext der Anwendung verarbeitet werden.</p></dd><dt>Missbrauchswahrscheinlichkeit<span class="colon">:</span></dt><dd><p>Mittel</p></dd><dt>Auswirkung<span class="colon">:</span></dt><dd><p>Bis hin zur Ausführung von beliebigen Befehlen</p></dd><dt>Ausmaß<span class="colon">:</span></dt><dd><p>Vertraulichkeit, Integrität, Verfügbarkeit</p></dd></dl></ld-card><ld-card class="incremental"><div class="ld-exercise" id="ld-exercise-18" data-exercise-id="18" data-exercise-title="18 - Unrestricted Uploads in PHP"><p class="ld-exercise-title rubric"><span>Unrestricted Uploads in PHP</span></p><p>HTML:</p><pre class="code HTML literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>form</span> <span class="name attribute">action</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>upload_picture.php<span class="punctuation">"</span></span> <span class="name attribute">method</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>post<span class="punctuation">"</span></span> <span class="name attribute">enctype</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>multipart/form-data<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">2</small><code data-lineno="2">    Choose a file to upload:
</code><small class="ln">3</small><code data-lineno="3">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>input</span> <span class="name attribute">type</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>file<span class="punctuation">"</span></span> <span class="name attribute">name</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>filename<span class="punctuation">"</span></span><span class="punctuation">/&gt;</span></span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>br</span><span class="punctuation">/&gt;</span></span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>input</span> <span class="name attribute">type</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>submit<span class="punctuation">"</span></span> <span class="name attribute">name</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>submit<span class="punctuation">"</span></span> <span class="name attribute">value</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>Submit<span class="punctuation">"</span></span><span class="punctuation">/&gt;</span></span>
</code><small class="ln">6</small><code data-lineno="6"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>form</span><span class="punctuation">&gt;</span></span></code></pre><p>PHP:</p><pre class="code PHP literal-block"><small class="ln">1</small><code data-lineno="1"><span class="comment single">// Define the target location where the picture being</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="comment single">// uploaded is going to be saved.</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="name variable">$target</span> <span class="operator">=</span> <span class="literal string">"pictures/"</span> <span class="operator">.</span> <span class="name function">basename</span><span class="punctuation">(</span><span class="name variable">$_FILES</span><span class="punctuation">[</span><span class="literal string">'uploadedfile'</span><span class="punctuation">]</span><span class="punctuation">[</span><span class="literal string">'name'</span><span class="punctuation">]</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">
</code><small class="ln">5</small><code data-lineno="5"><span class="comment single">// Move the uploaded file to the new location.</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="name function">move_uploaded_file</span><span class="punctuation">(</span><span class="name variable">$_FILES</span><span class="punctuation">[</span><span class="literal string">'uploadedfile'</span><span class="punctuation">]</span><span class="punctuation">[</span><span class="literal string">'tmp_name'</span><span class="punctuation">]</span><span class="punctuation">,</span> <span class="name variable">$target</span><span class="punctuation">)</span></code></pre><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:5C2Y2EAIv5TNGsGRxjDZFgYlEcIVTQGU0p13d0G9zYQ=:K/R8T0Wcf0Rq4Wvy:lX8xqY4AumVbQ5y0fLd/L3ntITiizewoDx27WYqrT7nxrRURGByLC+z9h75pAPCD5KtrRkCDuyH/jjbl+wA5qefxi7vmnOR5CneGZ7lGDswIKTwz1AREtOhoYeqHVpgB7c8Z8JNum3rdoZ4+FI6Co0CWpTd1N8kG1hQfy0M7V79HEavQx5VNOpG3+eHzU0k/QoaNYBphBND2NZJlU6l83/6I+1NjGLQeypzFfZXpVHukOz3VLtgUJhNclRA3LlGPMtsj5DwS7Q+JTTa+v55xPWY7J4NwiGSAF6FmYiOdTFkcd1CM/X1fhX1sB/SKhmkx9XjticWXcIjanL4klVyfxPy3tnFvhfJXsMWXZjjaMqY+xbh3lorMj+Fxwh+JhnUppiSH+lFv0m0N5v56BKD2EbKpDW5CrlP0xEXAroAxLXhDuVXyJ5INC5P2/2fO9+a1DwpP8LHDNYWTWBFaZz8/gqOFmYV7c8c7TF9ZxIcTIxyUgWWfP8EVXhWTzUwzcD0j/Jw5Py15MDTNTFR6fe7ZwyWdOWO2Zju21pv57OJZkvfWxU2b4srhjHGK3dugduGbbk4K0tVu23C1YsqEZLa6dildFQl3FAICF5H283KHFvJDvurzIqmbKKJthDCNwWAOYDb1hvMsNCIaV+ZrGHJnPurRqTTTuKvtc4MTeEsNr2cp2RqPe6lEoGzMqdsDSStDSHuOBshySRAgvMmSkfRxokluj6rkHmAUKxolNm7zfcRzG8IYMo3SZFZdGZb/LxX1ixjBqnAd55ZEuxCSScJl8qLBVaOonXq8QcEB3Bs7IJitcZVQLsHmFtppEO2yR89PhJ/R08h4bhOBEVfFl+se0/gFIAvui73lACghOinnwjHM/KbD4at1LAtCSqA3tY8kLiLfrkaPwZRoRNfDBrvz2hxWkS8rjAGgJUkiqmdDxnInOXEYRaereyy7goj7V+MZZq4FOIWu9wU6eexvcAshEjN082+Eb/0Tf6yveVNUFIw6n5pYX9Bip6fFJ4Yd7FfNpUmrqIHldPiDMs6SwLw10dSVLNSEHeaLcuVMjVEztaOQwXatG/yANc9RaFhlpyJ4ox/OaF1NUkMTtsP7hAGct1Od07NIqcwEQ4Dw93JqwzNd+QA/KjVi1dhFO9Lh3jUeZF+fdcdc5i0TdxEmfkWRFLJqWrhScgAdowKR4mkLPzR3igjhCF999XEkf6mCJerNcA==</div></div></ld-card><ld-card class="incremental"><p class="rubric">Abhilfemaßnahmen und Erkennung</p><ul class="incremental-list simple"><li><p>Beim Speichern von Dateien niemals den ursprünglichen Dateinamen verwenden sondern einen vom Server generierten.</p></li><li><p>Speicher die Daten nicht im Kontext der Webanwendung sondern außerhalb des Webroots.</p></li><li><p>Prüfe die Dateiendung. Prüfe den Inhalt der Datei gegen die Erwartung.</p></li><li><p>Ausführen der Webanwendung mit minimalen Rechten.</p></li><li><p>Sandbox.</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic class="new-subsection transition-move-to-top" id="cwe-122-heap-based-buffer-overflow"><h2>CWE-122: Heap-based Buffer Overflow</h2><div class="section-subtitle"><p class="rubric">CWE Rank</p><table class="booktabs table-data-align-left table-header-align-left" style="width: 100%;"><colgroup><col style="width: 40.0%"><col style="width: 30.0%"><col style="width: 30.0%"></colgroup><thead><tr><th class="head"><p>Jahr</p></th><th class="head"><p>Position in CWE</p></th><th class="head"><p>Position in KEV</p></th></tr></thead><tbody><tr><td><p>2024</p></td><td><p>(Nicht in den Top 25)</p></td><td><p>(Nicht in den Top 10)</p></td></tr><tr><td><p>2023</p></td><td><p>(Nicht in den Top 25)</p></td><td><p>#2</p></td></tr></tbody></table></div></ld-topic>
<ld-topic id="cwe-122-heap-based-buffer-overflow"><h2>CWE-122: Heap-based Buffer Overflow</h2><ld-deck><ld-card><dl class="field-list simple"><dt>Kurze Beschreibung<span class="colon">:</span></dt><dd><p>Ein Pufferüberlauf, bei dem der Puffer, der überschrieben wird, auf dem Heap alloziiert wurde, was im Allgemeinen bedeutet, dass der Puffer mit einer Routine wie <code class="c"><span class="name function">malloc</span><span class="punctuation">(</span><span class="punctuation">)</span></code> allloziiert wurde.</p></dd><dt>Missbrauchswahrscheinlichkeit<span class="colon">:</span></dt><dd><p>Hoch</p></dd><dt>Sprachen<span class="colon">:</span></dt><dd><p>C/C++</p></dd><dt>Auswirkung<span class="colon">:</span></dt><dd><p>Bis hin zur Ausführung von beliebigen Befehlen</p></dd><dt>Ausmaß<span class="colon">:</span></dt><dd><p>Vertraulichkeit, Integrität, Verfügbarkeit, Zugriffskontrolle</p></dd></dl></ld-card><ld-card class="incremental"><div class="ld-exercise" id="ld-exercise-19" data-exercise-id="19" data-exercise-title="19 - Heap-based Buffer Overflow: „Basisbeispiel“ in C"><p class="ld-exercise-title rubric"><span>Heap-based Buffer Overflow: „Basisbeispiel“ in C</span></p><pre class="code C literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name attribute">#<span class="keyword">define</span> BUFSIZE <span class="literal number integer">256</span></span>
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">int</span> <span class="name function">main</span><span class="punctuation">(</span><span class="keyword">int</span> argc<span class="punctuation">,</span> <span class="keyword">char</span> <span class="operator">*</span><span class="operator">*</span>argv<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">char</span> <span class="operator">*</span>buf<span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">    buf <span class="operator">=</span> <span class="punctuation">(</span><span class="keyword">char</span> <span class="operator">*</span><span class="punctuation">)</span><span class="name function">malloc</span><span class="punctuation">(</span><span class="keyword">sizeof</span><span class="punctuation">(</span><span class="keyword">char</span><span class="punctuation">)</span><span class="operator">*</span>BUFSIZE<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="name function">strcpy</span><span class="punctuation">(</span>buf<span class="punctuation">,</span> argv<span class="punctuation">[</span><span class="literal number integer">1</span><span class="punctuation">]</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="punctuation">}</span></code></pre><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:9vcDAQdY+48adil2sY6B7y/MRlP4QpxZHVRaCfPDKSo=:7l/ydbnOpN0reDxZ:UQQz61hWV54ahus2fUZ2aKobQJ/t/2B1KfTqlNknAWLguxUVFY5f6Ej+WhNGaK7VeHWlCRXC6cpwHOrSdlfi3CLZCGbRtFhMWRSXL3WcgPc2fWtlTEVADIy4ELjlkrlo9L43gSsi6R5sEIRosNFD48mPK0cwSHh14tKjjoLAI/3ewLQpS41dF1doi93USNQQP+VC</div></div></ld-card><ld-card class="incremental"><p class="rubric">Abhilfemaßnahmen und Erkennung</p><ul class="simple"><li><p>Verwendung einer sicheren Programmiersprache</p></li><li><p>Verwendung von sicheren APIs</p></li><li><p>Kompilierung unter Verwendung entsprechender Schutzmechanismen (Position-Independent Executables (PIE), Canaries, ...)</p></li><li><p>Härtung der Umgebung (z. B. ASLR)</p></li><li><p>Statische Analyse Werkzeuge</p></li><li><p>Fuzzing</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic class="new-subsection transition-move-to-top" id="cwe-502-deserialization-of-untrusted-data"><h2>CWE-502: Deserialization of Untrusted Data</h2><div class="section-subtitle"><p class="rubric">CWE Rank</p><table class="booktabs table-data-align-left table-header-align-left" style="width: 100%;"><colgroup><col style="width: 40.0%"><col style="width: 30.0%"><col style="width: 30.0%"></colgroup><thead><tr><th class="head"><p>Jahr</p></th><th class="head"><p>Position in CWE</p></th><th class="head"><p>Position in KEV</p></th></tr></thead><tbody><tr><td><p>2024</p></td><td><p>16</p></td><td><p><a class="reference external" href="https://cwe.mitre.org/top25/archive/2024/2024_kev_list.html">#5</a></p></td></tr><tr><td><p>2023</p></td><td><p>15</p></td><td><p><a class="reference external" href="https://cwe.mitre.org/top25/archive/2023/2023_kev_list.html">#6</a></p></td></tr></tbody></table></div></ld-topic>
<ld-topic id="cwe-502-deserialization-of-untrusted-data"><h2>CWE-502: Deserialization of Untrusted Data</h2><ld-deck><ld-card><dl class="field-list simple"><dt>Kurze Beschreibung<span class="colon">:</span></dt><dd><p>Nicht vertrauenswürdige Daten werden deserialisiert ohne - <em>je nach Bibliothek notwendige vorhergehende</em> - Prüfung, dass die Daten die erwarteten Eigenschaften haben.</p></dd><dt>Missbrauchswahrscheinlichkeit<span class="colon">:</span></dt><dd><p>Mittel</p></dd><dt>Sprachen<span class="colon">:</span></dt><dd><p>Java, Ruby, Python, PHP, JavaScript, ...</p></dd><dt>Ausmaß<span class="colon">:</span></dt><dd><p>Insbesondere: Integrität und Verfügbarkeit (DoS); weitere Effekte sind vom Kontext abhängig.</p></dd><dt>Alternative Begriffe<span class="colon">:</span></dt><dd><p>(Un-)Marshalling, (Un-)Pickling</p></dd></dl><ld-supplemental><p>Bei der Serialisierung werden programminterne Objekte so verpackt, dass die Daten extern gespeichert und/oder übertragen werden können. Die Deserialisierung kehrt diesen Prozess um.</p></ld-supplemental></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel: Java</span></p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">File</span> file <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">File</span><span class="punctuation">(</span><span class="literal string">"object.obj"</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">try</span> <span class="punctuation">(</span> <span class="name class">FileInputStream</span> fin <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">FileInputStream</span><span class="punctuation">(</span>file<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="name class">ObjectInputStream</span> oin <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">ObjectInputStream</span><span class="punctuation">(</span>fin<span class="punctuation">)</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="name class"><span class="name namespace">javax<span class="punctuation">.</span>swing<span class="punctuation">.</span></span>JButton</span> button <span class="operator">=</span> <span class="punctuation">(</span><span class="name class"><span class="name namespace">javax<span class="punctuation">.</span>swing<span class="punctuation">.</span></span>JButton</span><span class="punctuation">)</span> oin<span class="punctuation">.</span><span class="name function">readObject</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6">    <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span>
</code><small class="ln">7</small><code data-lineno="7"><span class="punctuation">}</span></code></pre></aside><ld-supplemental><p>Im Java Beispiel wird ein Objekt aus einer Datei gelesen und in eine Variable vom Typ <code class="java"><span class="name class"><span class="name namespace">javax<span class="punctuation">.</span>swing<span class="punctuation">.</span></span>JButton</span></code> geschrieben. Der Typ des Objekts wird nicht geprüft. Es ist möglich, dass die Datei ein Objekt enthält, welches vom Typ <code class="java"><span class="name class"><span class="name namespace">javax<span class="punctuation">.</span>swing<span class="punctuation">.</span></span>JButton</span></code> ist, aber nicht die Eigenschaften hat, die ein Button haben sollte. In diesem Fall wird keine Exception geworfen, aber das Objekt kann nicht wie erwartet verwendet werden bzw. es kommt zur Ausführung von beliebigem Code.</p></ld-supplemental></ld-card><ld-card class="incremental"><div class="ld-exercise" id="ld-exercise-20" data-exercise-id="20" data-exercise-title="20 - Deserialization of Untrusted Data in Python"><p class="ld-exercise-title rubric"><span>Deserialization of Untrusted Data in Python</span></p><pre class="code Python literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">ExampleProtocol</span><span class="punctuation">(</span>protocol<span class="punctuation">.</span>Protocol<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">def</span> <span class="name function">dataReceived</span><span class="punctuation">(</span>self<span class="punctuation">,</span> data<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">        <span class="comment single"># ... parse the incoming data and</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">        <span class="comment single"># after receiving headers, call confirmAuth() to authenticate</span>

</code><small class="ln"> 8</small><code data-lineno=" 8">        <span class="keyword">try</span><span class="punctuation">:</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">            token <span class="operator">=</span> cPickle<span class="punctuation">.</span>loads<span class="punctuation">(</span>base64<span class="punctuation">.</span>b64decode<span class="punctuation">(</span>headers<span class="punctuation">[</span><span class="literal string">'AuthToken'</span><span class="punctuation">]</span><span class="punctuation">)</span><span class="punctuation">)</span>
</code><small class="ln">10</small><code data-lineno="10">            <span class="keyword">if</span> <span class="keyword">not</span> check_hmac<span class="punctuation">(</span>token<span class="punctuation">[</span><span class="literal string">'signature'</span><span class="punctuation">]</span><span class="punctuation">,</span> token<span class="punctuation">[</span><span class="literal string">'data'</span><span class="punctuation">]</span><span class="punctuation">,</span> getSecretKey<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln">11</small><code data-lineno="11">                <span class="keyword">raise</span> AuthFail
</code><small class="ln">12</small><code data-lineno="12">            self<span class="punctuation">.</span>secure_data <span class="operator">=</span> token<span class="punctuation">[</span><span class="literal string">'data'</span><span class="punctuation">]</span>
</code><small class="ln">13</small><code data-lineno="13">        <span class="keyword">except</span><span class="punctuation">:</span>
</code><small class="ln">14</small><code data-lineno="14">            <span class="keyword">raise</span> AuthFail</code></pre><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:Mvf6Z9C+gwrPVhvMDOHoPSXUyH49SIsu2P47LRKenOc=:34UHF0joWw5pEcO6:QuQberA0PU1PxHIp3kr3Y2NVgiHv3FRFL7xkFbrj0SxFUx3u58nis38dpEMH2wk1vGCCUxD/DX8tF4YUdtJIrSZ3BB++JAm7bM29KKEw79qruURpWYAcFSfAGHuq3Serw1hfc+4SrOqbJ57gkhr5u/jwt9KKpez17vJOHQfj3wWmuWzpvUjxZejZQiiaZUdDaaPnPKW1FX/J0i2HVBP47o7hTtSOYe6LpjEtMzQBs+3Yra92Swqi8lrfRwqoYDzVtk16gscSJ707bcxZ+Y7uPnuLnJUGMVMOIsY1iPR1k7dUDvM4D5yBlL6q1j2IbAQV3dc1nw5Pu3p0DHQDUD6dfyxavJfNkhc+xK+WcWEHLwBDftODgVMZTxsb4Ho+oN3TiBszAYWI0nxWcpH5pmx5tjZVHkOrXS6MuN5T5T7d75C/ZmcLG5zhr0ztmdcMjhJ7iPbo8fMXoRQFH+glELMR/suafO/JHjW8AqoLQDintNPlC2y8BQVwULYMcIn34n6alPS28D7rR5ZG6HN4bETjMLkNHTExrW8BoPvgWq+NEx1q64cFiZTKIgfMKJNSENIyOk4NyE03KWRTTzXY/fcguajnibqn0c4zgwI/SNdEpYBozihR7fxvslNvGvYtKJYqLRLwfuvTUNID09LglR2fcwvWfY7tNYBe9YPm8PkeTbIU7Ugwnwo6Hsfskys2JESoaYYkz7haf+DOZWQPbIZtygKCX3v2ZbmS4Y7QB+KjXOnlv+O72zQyidTqQydSvc+Rx1RVPRS65J22xluz1AjGAjw/huPY/N9/KqH2CcIV4iv1Rnb9VhlvaLQuWJCeZWaHE/UryGZjDSEyWq98Yt78IJQUZ8kAROY6+LYgB1irz7v4TtEG5RPVzFHP+5C17+fTdAVSBXKUOwnuS4wSz0S1ZQTdNUIsLUNwCe1nTwa8WtKHOfPWGCG8z0myJrjuJQOK/TIGHuLfBwGwkyZCnwtRLv+9UVam3RI=</div></div></ld-card><ld-card class="incremental"><p class="rubric">Abhilfemaßnahmen und Erkennung</p><ul class="simple"><li><p>ggf. Einsatz von Signaturen, um sicherzustellen, dass der serialisierte Code nicht manipuliert wurde</p></li><li><p>Serialisiere nur Daten, die auch wirklich serialisiert werden müssen</p></li><li><p>Verwendung von sicheren Formaten (z. B. JSON)</p></li><li><p>statische Analyse</p></li></ul><ld-supplemental><p>Empfohlene Lektüre: <a class="reference external" href="https://portswigger.net/web-security/deserialization">Deserialization Vulnerabilities</a></p></ld-supplemental></ld-card></ld-deck></ld-topic>
<ld-topic class="new-subsection transition-move-to-top" id="cwe-918-server-side-request-forgery-ssrf"><h2>CWE-918: Server-Side Request Forgery (SSRF)<a class="brackets" href="#footnote-3" id="footnote-reference-3" role="doc-noteref"><span class="fn-bracket">[</span>3<span class="fn-bracket">]</span></a></h2><div class="section-subtitle"><p class="rubric">CWE Rank</p><table class="booktabs table-data-align-left table-header-align-left" style="width: 100%;"><colgroup><col style="width: 40.0%"><col style="width: 30.0%"><col style="width: 30.0%"></colgroup><thead><tr><th class="head"><p>Jahr</p></th><th class="head"><p>Position in CWE</p></th><th class="head"><p>Position in KEV</p></th></tr></thead><tbody><tr><td><p>2024</p></td><td><p>19</p></td><td><p>(nicht in den Top 10)</p></td></tr><tr><td><p>2023</p></td><td><p>19</p></td><td><p><a class="reference external" href="https://cwe.mitre.org/top25/archive/2023/2023_kev_list.html">#7</a></p></td></tr></tbody></table></div><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-3" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-3">3</a><span class="fn-bracket">]</span></span><p>≈ <span class="ger">Serverseitige Anfragefälschung</span></p></aside></aside></ld-topic>
<ld-topic id="cwe-918-server-side-request-forgery"><h2>CWE-918: Server-Side Request Forgery</h2><ld-deck><ld-card><dl class="field-list simple"><dt>Kurze Beschreibung<span class="colon">:</span></dt><dd><p>Der Webserver erhält eine URL oder eine ähnliche Anfrage und ruft den Inhalt dieser URL ab, stellt aber nicht sicher, dass die Anfrage an das erwartete Ziel gesendet wird.</p></dd><dt>Technologien<span class="colon">:</span></dt><dd><p>Webserver</p></dd><dt>Ausmaß<span class="colon">:</span></dt><dd><p>Vetraulichkeit, Integrität</p></dd></dl></ld-card><ld-card class="incremental"><object class="align-center" data="images/ssrf.svg" type="image/svg+xml" role="img" aria-label="Server-Side Request Forgery (SSRF)"></object></ld-card><ld-card class="id incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel: CVE-2002-1484</span></p><dl class="field-list simple"><dt>Beschreibung<span class="colon">:</span></dt><dd><p>Wenn der DB4Web-Server so konfiguriert ist, dass er ausführliche Debug-Meldungen verwendet, können entfernte Angreifer DB4Web als Proxy verwenden und über eine Anfrage an eine URL, die die Ziel-IP-Adresse und den Port angibt, TCP-Verbindungen zu anderen Systemen (Port-Scan) versuchen, was einen Verbindungsstatus in der resultierenden Fehlermeldung erzeugt.</p></dd></dl><dl class="incremental-list field-list"><dt>PoC<span class="colon">:</span></dt><dd><p><a class="reference external" href="http://127.0.0.1/DB4Web/172.31.93.30:22/foo">http://127.0.0.1/DB4Web/172.31.93.30:22/foo</a></p></dd><dt>Workaround<span class="colon">:</span></dt><dd><p>Um die Ausnutzung dieses Features zu verhindern, muss die Standardfehlerseite durch eine benutzerdefinierte ersetzt werden.</p><div class="peripheral"><p>Der Hersteller betrachtet die Funktionalität nicht als Fehler, sondern als Feature für Entwickler.</p></div></dd></dl></aside></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel: Unicode Handling Fehler <a class="brackets" href="#footnote-4" id="footnote-reference-4" role="doc-noteref"><span class="fn-bracket">[</span>4<span class="fn-bracket">]</span></a> im JavaScript NodeJS Framework</span></p><pre class="code JavaScript literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">var</span> base <span class="operator">=</span> <span class="literal string">"http://orange.tw/sandbox/"</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">var</span> path <span class="operator">=</span> req<span class="punctuation">.</span>query<span class="punctuation">.</span>path<span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="keyword">if</span> <span class="punctuation">(</span>path<span class="punctuation">.</span><span class="name function">indexOf</span><span class="punctuation">(</span><span class="literal string">".."</span><span class="punctuation">)</span> <span class="operator">==</span> <span class="operator">-</span><span class="literal number integer">1</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="comment single">// check for no directory traversal</span>
</code><small class="ln">4</small><code data-lineno="4">    http<span class="punctuation">.</span><span class="name function">get</span><span class="punctuation">(</span>base <span class="operator">+</span> path<span class="punctuation">,</span> callback<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span></code></pre><div class="incremental"><p>Beispiel URL (<em>U+FF2E Full width Latin capital letter N</em>):</p><pre class="code restructuredtext incremental literal-block"><code>http://orange.tw/sandbox/ＮＮ/passwd</code></pre><pre class="code restructuredtext incremental literal-block"><code>≙ http://orange.tw/sandbox/\xFF\x2E\xFF\x2E/passwd</code></pre><pre class="code restructuredtext incremental literal-block"><code>≙ http://orange.tw/sandbox/\x2E\x2E/passwd</code></pre><pre class="code restructuredtext incremental literal-block"><code>≙ http://orange.tw/sandbox/../passwd</code></pre></div><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-4" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-4">4</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://www.blackhat.com/docs/us-17/thursday/us-17-Tsai-A-New-Era-Of-SSRF-Exploiting-URL-Parser-In-Trending-Programming-Languages.pdf">Exploiting URL Parsers</a></p></aside></aside></aside></ld-card><ld-card class="incremental"><p class="rubric">URL Parser vs. Abfrage der URL in PHP (> 7.0.13):</p><pre class="code javascript literal-block"><small class="ln">1</small><code data-lineno="1">$url <span class="operator">=</span> <span class="literal string">'http://foo@127.0.0.1⬜@google.com:11211/'</span><span class="punctuation">;</span> <span class="comment single">// ⬜ is "just" a space</span>
</code><small class="ln">2</small><code data-lineno="2">$parsed <span class="operator">=</span> <span class="name function">parse_url</span><span class="punctuation">(</span>$url<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="name function">var_dump</span><span class="punctuation">(</span>$parsed<span class="punctuation">[</span>host<span class="punctuation">]</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// string(10) "google.com"</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="name function">var_dump</span><span class="punctuation">(</span>$parsed<span class="punctuation">[</span>port<span class="punctuation">]</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// int(11211)</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="name function">curl</span><span class="punctuation">(</span>$url<span class="punctuation">)</span><span class="punctuation">;</span></code></pre><p>Ergebnis:</p><ul class="incremental-list simple"><li><p><span class="docutils literal">curl</span> fragt die URL <span class="docutils literal">127.0.0.1:11211</span> ab.</p></li><li><p>D. h. <span class="docutils literal">curl</span> und php interpretieren die URL unterschiedlich.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Variante: Blind SSRF</p><p>Bei *Blind SSRF*-Schwachstellen werden auch Back-End-HTTP-Anfragen an eine bereitgestellte URL gestellt, die Antwort der Back-End-Anfrage jedoch nicht an die Front-End-Antwort der Anwendung zurückgegeben.</p><ld-supplemental><p>Empfohlene Lektüre: <a class="reference external" href="https://portswigger.net/web-security/ssrf/blind">Blind Server-Side Request Forgery (SSRF)</a></p></ld-supplemental></ld-card><ld-card class="incremental"><p class="rubric">Abhilfemaßnahmen und Erkennung</p><ul class="simple"><li><p>keine (Wieder-)Verwendung der Eingabe URL</p></li><li><p>sichere APIs</p></li><li><p>statische Analyse (insbesondere Datenflußanalysen)</p></li><li><p>Behandlung von Zugriffen von lokalen Maschinen sollte mit der gleichen sorgfalt überprüft werden wie Zugriffe von externen Maschinen; andernfalls können kritische SSRF Angriffe durchgeführt werden</p></li><li><p>Firewall/Network Policy, um Zugriff auf interne Systeme zu verhindern</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic class="new-subsection transition-move-to-top" id="cwe-843-access-of-resource-using-incompatible-type-type-confusion"><h2>CWE-843: Access of Resource Using Incompatible Type (<em>Type Confusion</em>)</h2><div class="section-subtitle"><p class="rubric">CWE Rank</p><table class="booktabs table-data-align-left table-header-align-left" style="width: 100%;"><colgroup><col style="width: 40.0%"><col style="width: 30.0%"><col style="width: 30.0%"></colgroup><thead><tr><th class="head"><p>Jahr</p></th><th class="head"><p>Position in CWE</p></th><th class="head"><p>Position in KEV</p></th></tr></thead><tbody><tr><td><p>2024</p></td><td><p>(nicht in den Top 25)</p></td><td><p><a class="reference external" href="https://cwe.mitre.org/top25/archive/2024/2024_kev_list.html">#2</a></p></td></tr><tr><td><p>2023</p></td><td><p>(nicht in den Top 25)</p></td><td><p><a class="reference external" href="https://cwe.mitre.org/top25/archive/2023/2023_kev_list.html">#8</a></p></td></tr></tbody></table></div></ld-topic>
<ld-topic id="cwe-843-type-confusion"><h2>CWE-843: <em>Type Confusion</em></h2><ld-deck><ld-card><dl class="field-list simple"><dt>Beschreibung<span class="colon">:</span></dt><dd><p>Eine Anwendung initialisiert eine Ressource mit einem bestimmten Typ (z. B. Zeiger (<span class="eng">Pointer</span>), Objekt, etc.). Später wird auf die Ressource (Variable) dann mit einem anderen Typ zugegriffen.</p></dd><dt>Sprachen<span class="colon">:</span></dt><dd><p>insbesondere (aber nicht ausschließlich) C/C++; im Prinzip in jeder Sprache, die automatische Typkonvertierungen durchführt.</p></dd><dt>Ausmaß<span class="colon">:</span></dt><dd><p>Integrität, Verfügbarkeit, Vertraulichkeit</p></dd></dl></ld-card><ld-card class="incremental"><div class="ld-exercise" id="ld-exercise-21" data-exercise-id="21" data-exercise-title="21 - Type Confusion in C"><p class="ld-exercise-title rubric"><span>Type Confusion in C</span></p><pre class="code c literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name attribute">#<span class="keyword">define</span> NAME_TYPE <span class="literal number integer">1</span></span>
</code><small class="ln"> 2</small><code data-lineno=" 2">
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">struct</span> <span class="name class">MessageBuffer</span> <span class="punctuation">{</span> <span class="keyword">int</span> msgType<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">                       <span class="keyword">union</span> <span class="punctuation">{</span> <span class="keyword">char</span> <span class="operator">*</span>name<span class="punctuation">;</span> <span class="keyword">int</span> nameID<span class="punctuation">;</span> <span class="punctuation">}</span><span class="punctuation">;</span> <span class="punctuation">}</span><span class="punctuation">;</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">
</code><small class="ln"> 6</small><code data-lineno=" 6"><span class="keyword">int</span> <span class="name function">main</span> <span class="punctuation">(</span><span class="keyword">int</span> argc<span class="punctuation">,</span> <span class="keyword">char</span> <span class="operator">*</span><span class="operator">*</span>argv<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="keyword">struct</span> <span class="name class">MessageBuffer</span> buf<span class="punctuation">;</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="keyword">char</span> <span class="operator">*</span>defaultMessage <span class="operator">=</span> <span class="literal string">"Hello World"</span><span class="punctuation">;</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    buf<span class="punctuation">.</span>msgType <span class="operator">=</span> NAME_TYPE<span class="punctuation">;</span>

<ld-topic id="cwe-306-missing-authentication-for-critical-function"><h2>CWE-306: Missing Authentication for Critical Function</h2><ld-deck><ld-card><dl class="field-list simple"><dt>Beschreibung<span class="colon">:</span></dt><dd><p>Eine Anwendung führt eine kritische Funktion aus, ohne die Identität des Nutzers zu überprüfen. Kritische Funktionen sind solche, die entweder signifikante Ressourcen verbrauchen oder nur von privilegierten Nutzern ausgeführt werden sollten.</p></dd><dt>Sprachen<span class="colon">:</span></dt><dd><p>"alle"</p></dd></dl></ld-card><ld-card class="incremental"><p class="rubric">Abhilfemaßnahmen und Erkennung</p><ul class="incremental-list simple"><li><p>manuelle Code Reviews</p></li><li><p>statische Analyse (Binärcode und/oder Quellcode)</p></li></ul></ld-card></ld-deck></ld-topic>

<ld-topic class="exercises" id="ubung-schwachstelle-n"><h2>Übung: Schwachstelle(n)</h2><div class="ld-exercise" id="ld-exercise-24" data-exercise-id="24" data-exercise-title="24 - REST API"><p class="ld-exercise-title rubric"><span>REST API</span></p><p>Eine REST API verhält sich wie folgt, wenn man einem Blog einen Kommentar hinzufügt:</p><pre class="code HTTP literal-block"><small class="ln">1</small><code data-lineno="1">POST /post/comment HTTP/1.1
</code><small class="ln">2</small><code data-lineno="2">Host<span class="punctuation">:</span> important-website.com

</code><small class="ln">4</small><code data-lineno="4">

</code><small class="ln">2</small><code data-lineno="2">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>name<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>Karl Gustav<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>

</code><small class="ln">11</small><code data-lineno="11">InjectedHeader: Injected</code></pre><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Es ist somit den Angreifern gelungen HTTP POST Requests durchzuführen!</p></aside></ld-card><ld-card class="incremental"><p><strong>Analyse</strong></p><p>Der Angreifer kann beliebige Requests durchführen. Weiterhin ist der Angreifer in der Lage HTTP persistent connections zu nutzen (bisher nicht gezeigt; siehe finale Anfrage), was die Erkennungsmöglichkeiten weiter erschwert.</p></ld-card></ld-deck><ld-supplemental><p>CRLF Injection im Zusammenhang mit einem SSRF kann eine Möglichkeit sein, Header und Parameter einzufügen, die sonst über die URL nicht kontrollierbar wären.</p></ld-supplemental></ld-card><ld-card class="incremental"><p class="rubric"><ol class="arabic simple" start="3"><li><p>Authentication Filter Bypass</p></li></ol></p><ld-deck><ld-card><p class="rubric">Ausgangssituation</p><p>Eine typische Oracle E-Business Suite-Bereitstellung macht den Kern der Anwendung innerhalb eines HTTP-Dienstes zugänglich, der lokal an Port 7201/TCP gebunden ist über eine private IP Adresse (nicht <span class="docutils literal">localhost</span>).</p><aside class="admonition" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Wie kommt man an diese IP Adresse?</p></aside><aside class="admonition incremental" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Oracle EBS hat immer den folgenden Eintrag in der /etc/hosts Datei:</p><p>::</p><p># cat /etc/hosts
172.31.28.161   apps.example.com        apps</p><p>Die lokale IP ist somit an apps.example.com gebunden.</p></aside></ld-card><ld-card class="incremental"><p><strong>Analyse</strong></p><p>Wir können somit Anfragen an <code class="http">http<span class="punctuation">:</span>//apps.example.com:7201</code> stellen und erhalten Zugriff auf zahlreiche jsps und servlets.</p><div class="compound incremental"><p>Die Exploit-Kette nutzt als nächstes ein <em>Path Traveral</em>, um den Java-App-Filter zu umgehen, da der Pfad /help/ keine Authentifizierung erfordert. Durch Anhängen von ../ und der Zieldatei/dem Ziel-Servlet an eine an /OA_HTML/help/ gesendete HTTP-Anfrage kann die Exploit-Kette die Authentifizierungs-Whitelist umgehen.</p></div></ld-card></ld-deck></ld-card><ld-card class="incremental"><p class="rubric"><ol class="arabic simple" start="4"><li><p>XSL Transformation (XSLT)</p></li></ol></p><ld-deck><ld-card><p>Zielservlet: <span class="docutils literal">/OA_HTML/help/../ieshostedsurvey.jsp</span></p><p>Der Code erstellt aus dem eingehenden <code class="http">Host:</code> Header eine Remote-URL, wodurch der Java-Code /<span class="docutils literal">ieshostedsurvey.xsl</span> vom Server des Angreifers herunterlädt.</p><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Da die XSLT-Verarbeitung in Java Templates und Erweiterungsfunktionen aufrufen kann, ermöglicht dies ein nicht vertrauenswürdiges Stylesheet zu laden und erlaubt dem Angreifer Remote Code Execution.</p></aside></ld-card></ld-deck></ld-card><ld-card class="incremental"><p><strong>Vollständiger Request zum Triggern der Schwachstelle</strong></p><ld-scrollable data-height="50%"><pre class="code http literal-block"><small class="ln"> 1</small><code data-lineno=" 1">POST /OA_HTML/configurator/UiServlet HTTP/1.1
