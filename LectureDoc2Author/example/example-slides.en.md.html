<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic class="transition-zoom" id="scrollables-with-explicit-height"><h2>Scrollables with explicit height!<a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a></h2><p>A scrollable can have an explicit height that will be used for the slide view.</p><ld-scrollable class="margin-bottom-1em" data-height="300px"><pre class="code javascript copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="comment single">/**</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"> <span class="operator">*</span> Adds an event listener to the scrollable element that fires when the element
</code><small class="ln"> 3</small><code data-lineno=" 3"> <span class="operator">*</span> is scrolled<span class="punctuation">.</span> In that <span class="keyword">case</span><span class="punctuation">,</span> the event is sent to the specified channel to
</code><small class="ln"> 4</small><code data-lineno=" 4"> <span class="operator">*</span> make secondary windows aware <span class="keyword">of</span> the scrolling event <span class="keyword">in</span> the primary window<span class="punctuation">.</span>
</code><small class="ln"> 5</small><code data-lineno=" 5"> <span class="operator">*</span>
</code><small class="ln"> 6</small><code data-lineno=" 6"> <span class="operator">*</span> The data is sent using the <span class="punctuation">{</span>@link postMessage<span class="punctuation">}</span> method where the msg is the event title
</code><small class="ln"> 7</small><code data-lineno=" 7"> <span class="operator">*</span> and the data is a two element array where the first element is the id <span class="keyword">of</span> the
</code><small class="ln"> 8</small><code data-lineno=" 8"> <span class="operator">*</span> element that is being scrolled and the second element is the current scrollTop<span class="punctuation">.</span>
</code><small class="ln"> 9</small><code data-lineno=" 9"> <span class="operator">*</span>
</code><small class="ln">10</small><code data-lineno="10"> <span class="operator">*</span> The primary window is always the window that user interacts <span class="keyword">with</span><span class="punctuation">.</span> The secondary
</code><small class="ln">11</small><code data-lineno="11"> <span class="operator">*</span> is every other window showing the same site<span class="punctuation">.</span>
</code><small class="ln">12</small><code data-lineno="12"> <span class="operator">*</span>
</code><small class="ln">13</small><code data-lineno="13"> <span class="operator">*</span> @param <span class="punctuation">{</span>Channel<span class="punctuation">}</span> channel <span class="operator">-</span> The channel that will be used to send the event<span class="punctuation">.</span>
</code><small class="ln">14</small><code data-lineno="14"> <span class="operator">*</span> @param <span class="punctuation">{</span>string<span class="punctuation">}</span> eventTitle <span class="operator">-</span> The title <span class="keyword">of</span> the event that will be sent to the channel<span class="punctuation">.</span> The
</code><small class="ln">15</small><code data-lineno="15"> <span class="operator">*</span>                            title has to be unique w<span class="punctuation">.</span>r<span class="punctuation">.</span>t<span class="punctuation">.</span> to the channel<span class="punctuation">.</span>
</code><small class="ln">16</small><code data-lineno="16"> <span class="operator">*</span> @param <span class="punctuation">{</span>HTMLElement<span class="punctuation">}</span> scrollableElement <span class="operator">-</span> The element that is being scrolled<span class="punctuation">.</span>
</code><small class="ln">17</small><code data-lineno="17"> <span class="operator">*</span> @param <span class="punctuation">{</span>string<span class="punctuation">}</span> id <span class="operator">-</span> The id <span class="keyword">of</span> the element that is being scrolled<span class="punctuation">.</span>
</code><small class="ln">18</small><code data-lineno="18"> <span class="operator">*</span><span class="operator">/</span>
</code><small class="ln">19</small><code data-lineno="19"><span class="keyword">export</span> <span class="keyword">function</span> <span class="name function">addScrollingEventListener</span><span class="punctuation">(</span><span class="name variable">channel<span class="punctuation">,</span> eventTitle<span class="punctuation">,</span> scrollableElement<span class="punctuation">,</span> id</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">20</small><code data-lineno="20">    <span class="comment single">// We will relay a scroll event to a secondary window, when there was no</span>
</code><small class="ln">21</small><code data-lineno="21">    <span class="comment single">// more scrolling for at least TIMEOUTms. Additionally, if there is already an</span>
</code><small class="ln">22</small><code data-lineno="22">    <span class="comment single">// event handler scheduled, we will not schedule another one.</span>
</code><small class="ln">23</small><code data-lineno="23">    <span class="comment single">//</span>
</code><small class="ln">24</small><code data-lineno="24">    <span class="comment single">// If we would directly relay the event, it may be possible that it will</span>
</code><small class="ln">25</small><code data-lineno="25">    <span class="comment single">// result in all kinds of strange behaviors, because we cannot easily</span>
</code><small class="ln">26</small><code data-lineno="26">    <span class="comment single">// distinguish between a programmatic and a user initiated scroll event.</span>
</code><small class="ln">27</small><code data-lineno="27">    <span class="comment single">// (Using window blur and focus events didn't work reliably.)</span>
</code><small class="ln">28</small><code data-lineno="28">    <span class="comment single">// This could result in a nasty ping-pong effect where scrolling between</span>
</code><small class="ln">29</small><code data-lineno="29">    <span class="comment single">// two different position would happen indefinitely.</span>
</code><small class="ln">30</small><code data-lineno="30">    <span class="keyword">const</span> <span class="name constant">TIMEOUT</span> <span class="operator">=</span> <span class="literal number integer">50</span><span class="punctuation">;</span>
</code><small class="ln">31</small><code data-lineno="31">    <span class="keyword">let</span> lastEvent <span class="operator">=</span> <span class="keyword">undefined</span><span class="punctuation">;</span>
</code><small class="ln">32</small><code data-lineno="32">    <span class="keyword">let</span> eventHandlerScheduled <span class="operator">=</span> <span class="keyword constant">false</span><span class="punctuation">;</span>
</code><small class="ln">33</small><code data-lineno="33">    scrollableElement<span class="punctuation">.</span><span class="name function">addEventListener</span><span class="punctuation">(</span><span class="literal string">"scroll"</span><span class="punctuation">,</span> <span class="punctuation">(</span><span class="name variable">event</span><span class="punctuation">)</span> <span class="operator">=&gt;</span> <span class="punctuation">{</span>
</code><small class="ln">34</small><code data-lineno="34">        lastEvent <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Date</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">.</span><span class="name function">getTime</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">35</small><code data-lineno="35">        <span class="keyword">function</span> <span class="name function">scheduleEventHandler</span><span class="punctuation">(</span><span class="name variable">timeout</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">36</small><code data-lineno="36">            <span class="name function">setTimeout</span><span class="punctuation">(</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">=&gt;</span> <span class="punctuation">{</span>
</code><small class="ln">37</small><code data-lineno="37">                <span class="keyword">const</span> currentTime <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Date</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">.</span><span class="name function">getTime</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">38</small><code data-lineno="38">                <span class="keyword">if</span> <span class="punctuation">(</span>currentTime <span class="operator">-</span> lastEvent <span class="operator">&lt;</span> <span class="name constant">TIMEOUT</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">39</small><code data-lineno="39">                    <span class="name function">scheduleEventHandler</span><span class="punctuation">(</span><span class="name constant">TIMEOUT</span> <span class="operator">-</span> <span class="punctuation">(</span>currentTime <span class="operator">-</span> lastEvent<span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">40</small><code data-lineno="40">                    <span class="keyword">return</span><span class="punctuation">;</span>
</code><small class="ln">41</small><code data-lineno="41">                <span class="punctuation">}</span>
</code><small class="ln">42</small><code data-lineno="42">                <span class="name function">postMessage</span><span class="punctuation">(</span>channel<span class="punctuation">,</span> eventTitle<span class="punctuation">,</span> <span class="punctuation">[</span>id<span class="punctuation">,</span> event<span class="punctuation">.</span>target<span class="punctuation">.</span>scrollTop<span class="punctuation">]</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">43</small><code data-lineno="43">                <span class="comment single">// console.log(eventTitle + " " + id + " " + event.target.scrollTop);</span>
</code><small class="ln">44</small><code data-lineno="44">                eventHandlerScheduled <span class="operator">=</span> <span class="keyword constant">false</span><span class="punctuation">;</span>
</code><small class="ln">45</small><code data-lineno="45">            <span class="punctuation">}</span><span class="punctuation">,</span> timeout<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">46</small><code data-lineno="46">        <span class="punctuation">}</span><span class="punctuation">;</span>
</code><small class="ln">47</small><code data-lineno="47">        <span class="keyword">if</span><span class="punctuation">(</span><span class="operator">!</span>eventHandlerScheduled<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">48</small><code data-lineno="48">            eventHandlerScheduled <span class="operator">=</span> <span class="keyword constant">true</span><span class="punctuation">;</span>
</code><small class="ln">49</small><code data-lineno="49">            <span class="name function">scheduleEventHandler</span><span class="punctuation">(</span><span class="name constant">TIMEOUT</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">50</small><code data-lineno="50">        <span class="punctuation">}</span>
</code><small class="ln">51</small><code data-lineno="51">    <span class="punctuation">}</span><span class="punctuation">,</span><span class="punctuation">{</span>passive<span class="operator">:</span> <span class="keyword constant">true</span><span class="punctuation">}</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">52</small><code data-lineno="52"><span class="punctuation">}</span></code></pre></ld-scrollable><hr><ld-scrollable class="margin-top-1em" data-height="-100px"><p>This is a scrollable that extends to the bottom of the slide -100px to leave

<ld-topic class="transition-dice-left" id="simple-column-based-layouts"><h2>Simple column-based Layouts</h2><p>One way to create a very simple multi-column layout consists of a list with the class <span class="docutils literal">columns</span>.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Example</span></p><p><strong>Default layout:</strong></p><ul class="columns simple"><li><p>The first column.</p><ol class="arabic simple"><li><p>a nested list.</p></li></ol></li><li><p>The second column.</p><ol class="arabic simple"><li><p>a nested list.</p></li></ol></li></ul><p><strong>Left-aligned layout:</strong></p><ul class="columns left-aligned simple"><li><p>The first column.</p><ol class="arabic simple"><li><p>a nested list.</p></li></ol></li><li><p>The second column.</p><ol class="arabic simple"><li><p>a nested list.</p></li></ol></li></ul><p><strong>Evenly-spaced layout:</strong></p><ul class="columns evenly-spaced simple"><li><p>The first column.</p><ol class="arabic simple"><li><p>a nested list.</p></li></ol></li><li><p>The second column.</p><ol class="arabic simple"><li><p>a nested list.</p></li></ol></li></ul></aside></ld-topic>

<ld-topic id="math"><h2>Math</h2><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><p>Adding math (e.g. <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><msup><mi>c</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">a^2+b^2=c^2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8974em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord mathnormal">a</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8141em;"></span><span class="mord"><span class="mord mathnormal">b</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8141em;"></span><span class="mord"><span class="mord mathnormal">c</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span></span>) to a slide is done using the math directive or role.</p><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>e</mi><mo>=</mo><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">e = mc^2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">e</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8641em;"></span><span class="mord mathnormal">m</span><span class="mord"><span class="mord mathnormal">c</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span></span></div><p>Alternatively, it is often possible to use Unicode symbols:</p><p>Poor Man's Math:  e = mc².</p></ld-cell><ld-cell style="align-self:auto;"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Example</span></p><pre class="code myst literal-block"><code>Adding math (e.g. $a^2+b^2=c^2$)
to a slide is done using the math
directive or role.

$$
e = mc^2
$$

Poor Man's Math: e = mc².</code></pre></aside></ld-cell></ld-grid></ld-topic>
