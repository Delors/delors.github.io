<ld-topic id="lecture-prog-java-domain-modeling-and-records"><h1 class="title">Domain Modeling sowie Java Records und Enums</h1><p>Eine kurze Einführung, um das Entwickeln von kleinen Projekten zu erleichtern.</p><dl class="field-list simple"><dt>Dozent<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></p></dd><dt>Kontakt<span class="colon">:</span></dt><dd><p><a class="reference external" href="mailto:michael.eichberg@dhbw.de">michael.eichberg@dhbw.de</a>, Raum 149B</p></dd><dt>Version<span class="colon">:</span></dt><dd><p>1.0.2.3</p></dd></dl><ld-supplemental><dl class="field-list"><dt>Kontrollfragen<span class="colon">:</span></dt><dd><p><a class="reference external" href="./kontrollfragen.de.md.html">kontrollfragen.de.md.html</a></p></dd><dt>Folien<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/prog-adv-java-domain-modeling/folien.de.md.html">https://delors.github.io/prog-adv-java-domain-modeling/folien.de.md.html</a></p><p><a class="reference external" href="https://delors.github.io/prog-adv-java-domain-modeling/folien.de.md.html.pdf">https://delors.github.io/prog-adv-java-domain-modeling/folien.de.md.html.pdf</a></p></dd><dt>Fehler melden<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://github.com/Delors/delors.github.io/issues">https://github.com/Delors/delors.github.io/issues</a></p></dd></dl><dl class="field-list simple"><dt>KI Verwendung<span class="colon">:</span></dt><dd><p>Bei der Erstellung der Unterlagen wurden KI Assistenten (insbesondere Claude
aber ggf. auch ChatGPT, Ollama mit Gemma/LLama/Qwen oder OpenCode mit
Kimi/Qwen/Deepseek...) unterstützend eingesetzt.

<ld-topic class="new-section" id="implementierung-einer-einfachen-domanenklasse"><h2>Implementierung einer einfachen Domänenklasse</h2><div class="section-subtitle"><p>Wiederholung etablierter Konzepte</p></div></ld-topic>
<ld-topic class="exercises" id="ubung"><h2>Übung</h2><ld-scrollable><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Implementieren einer Klasse für einfache Telefonbucheinträge"><p class="ld-exercise-title rubric"><span>Implementieren einer Klasse für einfache Telefonbucheinträge</span></p><ol class="arabic simple"><li><p>Entwickeln Sie eine Klasse <code class="java"><span class="name class">Telefonbucheintrag</span></code> mit den Attributen:</p><ol class="arabic simple"><li><p><code class="java"><span class="name class">Integer</span> telefonnummer</code></p></li><li><p><code class="java"><span class="name class">String</span> vorname</code></p></li><li><p><code class="java"><span class="name class">String</span> nachname</code></p></li></ol></li></ol><p>sowie geeigneten Konstruktoren und allen passenden <em>get</em>- und <em>set</em>-Methoden. Setzen Sie strikte <em>Encapsulation</em> um.</p><ol class="arabic" start="2"><li><p>Implementieren Sie weiterhin eine Methode <code class="java"><span class="keyword">public</span> <span class="name class">String</span> <span class="name function">toString</span><span class="punctuation">(</span><span class="punctuation">)</span></code>, die den Eintrag in der Form „Vorname Nachname, Telefonnummer“ zurückgibt.</p></li><li><p>Implementieren Sie eine Methode <code class="java"><span class="keyword">public</span> <span class="keyword">boolean</span> <span class="name function">equals</span><span class="punctuation">(</span><span class="name class">Object</span> obj<span class="punctuation">)</span></code>, die zwei Einträge (d. h. zwei Objekte mit dem dynamischen Typ <code class="java"><span class="name class">Telefonbucheintrag</span></code>) als gleich betrachtet, wenn die Telefonnummern gleich sind.</p><p>Prüfen Sie - durch das Studium der <a class="reference external" href="https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html#equals(java.lang.Object)">Dokumentation</a> der Methode <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Object</span><span class="punctuation">.</span><span class="name function">equals</span><span class="punctuation">(</span><span class="punctuation">)</span></code> - ob Sie die Methode korrekt implementiert haben.</p></li><li><p>Implementieren Sie eine Methode <code class="java"><span class="keyword">public</span> <span class="keyword">int</span> <span class="name function">hashCode</span><span class="punctuation">(</span><span class="punctuation">)</span></code>, die einen <code class="java"><span class="keyword">int</span></code> Wert zurückgibt und einen Eintrag halbwegs sinnvoll repräsentiert. Prüfen Sie ob Ihre Implementierung dem <a class="reference external" href="https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Object.html#hashCode()">Kontrakt</a> der Methode <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Object</span><span class="punctuation">.</span><span class="name function">hashCode</span><span class="punctuation">(</span><span class="punctuation">)</span></code> entspricht.</p></li><li><p>Schreiben Sie ein Methode, die drei <code class="java"><span class="name class">Telefonbucheintrag</span></code>-Objekte erzeugt. Zwei davon sollen die gleichen Inhalte haben. Prüfen Sie dann, ob die Methoden <code class="java"><span class="name function">equals</span><span class="punctuation">(</span><span class="punctuation">)</span></code> und <code class="java"><span class="name function">hashCode</span><span class="punctuation">(</span><span class="punctuation">)</span></code> korrekt implementiert sind.</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:hdkA430J6M5LPZakbw7hJBEJoqQkqi0SLEzUi66V7nY=:Hcp7r+DR48BQqUyP:pw2BtPSlG <ld-topic class="new-section transition-fade" id="domain-modeling-larman2001"><h2>(Domain) Modeling <a class="citation-reference" href="#larman2001" id="citation-reference-1" role="doc-biblioref">[Larman2001]</a></h2></ld-topic>
<ld-topic id="was-ist-domain-modeling"><h2>Was ist Domain Modeling?</h2><dl class="field-list simple"><dt>Warum<span class="colon">:</span></dt><dd><p>Die Domänenmodellierung hilft uns, die relevanten Konzepte und Ideen einer Domäne zu identifizieren.</p></dd><dt>Wann<span class="colon">:</span></dt><dd><p>Immer dann, wenn wir die (weiteren) Konzepte in einem Bereich verstehen müssen.</p></dd><dt>Beteiligte<span class="colon">:</span></dt><dd><p>Entwickler, Domänenexperten(<span class="peripheral">, Anwender</span>)</p></dd><dt>Leitlinie<span class="colon">:</span></dt><dd><p>Erstellen Sie nur für die anstehenden Aufgaben ein Domänenmodell.</p></dd></dl><ld-supplemental><p>Domain Model ≘ <span class="ger">Analysemodell oder  auch Konzeptmodell</span></p></ld-supplemental></ld-topic>
<ld-topic class="no-title center-content" id="curtis-gesetz"><h2>Curtis' Gesetz</h2><blockquote class="epigraph"><p>Curtis’law: […] Good designs require deep application knowledge.<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></p><p class="attribution">—<a class="citation-reference" href="#endresrombach2003" id="citation-reference-2" role="doc-biblioref">[EndresRombach2003]</a></p></blockquote><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Sinngemäß: „Ein guter Entwurf benötigt ein tiefgreifendes Verständnis des Einsatzgebiets der zu entwickelnden Software.“</p></aside></aside></ld-topic>
<ld-topic id="das-domanenmodell"><h2>Das Domänenmodell</h2><ul class="incremental-list list-with-explanations"><li><p>Das Domänenmodell wird erstellt, um die Domäne in Konzepte oder Objekte in der realen Welt aufzuschlüsseln.</p></li><li><p>Das Modell sollte die Menge der konzeptionellen Klassen identifizieren.</p><p>(Das Domänenmodell wird iterativ vervollständigt.)</p></li><li><p><em>Es ist die Grundlage für den Entwurf der Software</em>.</p></li></ul></ld-topic>
<ld-topic id="erstellen-eines-domanenmodells"><h2>Erstellen eines Domänenmodells</h2><aside class="admonition" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Was sind die relevanten Konzepte/Objekte der Domäne?</p></aside><div class="incremental"><p class="rubric">Vorgehen</p><ol class="arabic incremental-list list-with-explanations"><li><p>Identifizieren Sie die relevanten Konzepte/Objekte.</p><p>(Dies kann zum Beispiel durch das Studieren von existierenden Modellen passieren<a class="citation-reference" href="#fowler1997" id="citation-reference-3" role="doc-biblioref">[Fowler1997]</a> oder durch die Analyse von fachlichen Dokumenten, die die Domäne beschreiben.)</p></li><li><p>Identifizieren Sie die Attribute der Konzepte/Objekte.</p></li><li><p>Identifizieren Sie die Beziehungen zwischen den Konzepten/Objekten.</p></li><li><p>Erstellen Sie ein Klassendiagramm.</p></li></ol></div><aside class="admonition incremental" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>Verwenden Sie das Vokabular der Domäne; z. B. sollte ein Modell für eine Bibliothek Namen wie „Ausleiher“ anstelle von „Kunde“ verwenden.</p></aside></ld-topic>
<ld-topic id="modellierungsaspekte"><h2>Modellierungsaspekte</h2><ld-story><ol class="arabic dhbw incremental-list"><li><aside class="admonition" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Wann sollte ich etwas als Attribut oder als Klasse modellieren?</p></aside><aside class="admonition incremental" data-theme="answer"><p class="admonition-title" data-theme="answer-header"><span>Antwort</span></p><p><em>Faustregel</em>: Wenn wir uns ein Konzept X in der realen Welt nicht als Zahl, Datum oder Text vorstellen können, dann sollte X wahrscheinlich mit Hilfe einer Klasse modelliert werden und ist kein Attribut.</p></aside></li><li><p>Die Attribute in einem Domänenmodell sollten vorzugsweise „primitive“ Datentypen in Bezug auf die Domäne sein.</p><p>Sehr häufige Datentypen sind: Booleans, Datum, Zahl, Zeichen, String, Adresse, Farbe, Telefonnummer,...</p></li><li><p>Erwägen Sie die Modellierung von Mengen als Klassen, um Einheiten zuordnen zu können.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Der Datentyp des Attributs „Betrag“ einer Zahlung sollte auch die Währung angeben.</p></aside></li></ol></ld-story></ld-topic>
<ld-topic class="exercises" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Domänenmodell für ein Kassensystem"><p class="ld-exercise-title rubric"><span>Domänenmodell für ein Kassensystem</span></p><p>Erstellen Sie ein Domänenmodell (d. h. ein UML Klassendiagramm) für ein einfaches Kassensystem basierend auf der folgenden Beschreibung und Ihrem Domänenwissen:</p><blockquote><p>Verkauf abwickeln: Ein Kunde kommt an der Kasse an und möchte einen Artikel kaufen. Der Kassierer verwendet das Kassensystem, um jeden Artikel zu erfassen. Das System zeigt eine laufende Summe und Details zu den einzelnen Positionen an. Der Kunde gibt die Zahlungsinformationen ein, die das System prüft und aufzeichnet. Das System aktualisiert den Warenbestand. Der Kunde erhält eine Quittung vom System und verlässt dann das Geschäft mit den Artikeln.</p></blockquote><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Denken Sie daran, dass wir im Domänenmodell nur die relevanten Konzepte modellieren sollten; d. h. Klassen und deren Attribute und Beziehungen. Methoden sind hier nicht relevant.</p></aside><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:SGjS3+sowqTW5aJlwQrXyfrwtvPfQ8v2WXkGYRdynU8=:wieXEshQLBpAsq/j:4taerM6QD8HP2Z3srhYK1e4ApbT6UaPw9D+aEmOTmXHe1as3dCOIbuOacsyoC9BhPu4BiZjYfzAykbLmIaehNtVvHYAy0hoJbFzmbXBSLIX4qZ1qOKuOZzngvq2UWZVd4xstYnumfAhog+nZ+b6NdzQV/4QJFYpue1s3tKTmzneDogby7dFPrLdazosJ8SGKuLij/jMcp6euEEa53WUNk6I7JG8UVB/On/6SqXsJHkdYxdxPL/PmuR3KBbjdHX/q8Dxw+jekdKzSd4y4mZAkfEURwmgtgdi7pEFfaolgUxSRzA==</div></div></ld-topic>
<ld-topic class="new-section" id="java-recordsjep395"><h2>Java records<a class="citation-reference" href="#jep395" id="citation-reference-4" role="doc-biblioref">[JEP395]</a></h2></ld-topic>
<ld-topic id="java-records-uberblick"><h2>Java Records - Überblick</h2><ul class="simple"><li><p>Java Records sind eine spezielle Form von Klassen, die dazu dienen, unveränderliche Daten zu modellieren.</p></li><li><p>Java Records sind häufig hervorragend geeignet, um Klassen aus Domänenmodellen, die insbesondere der Datenhaltung dienen, zu modellieren.</p></li><li><p>Java Records sind seit Java 16 verfügbar.</p></li></ul></ld-topic>

</code><small class="ln">8</small><code data-lineno="8"><span class="keyword constant">true</span></code></pre></ld-card></ld-deck><ld-supplemental><p>Die Getter und Setter heissen bei Records <em>Component Methods</em>. Ein direkter Zugriff auf die Attribute ist nicht möglich:</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1">jshell<span class="operator">&gt;</span> p<span class="punctuation">.</span>x

</code><small class="ln">4</small><code data-lineno="4"><span class="operator">|</span>  p<span class="punctuation">.</span>x
</code><small class="ln">5</small><code data-lineno="5"><span class="operator">|</span>  <span class="operator">^</span><span class="operator">-</span><span class="operator">^</span></code></pre></ld-supplemental></ld-topic>
<ld-topic id="java-records-technische-besonderheiten"><h2>Java Records - Technische Besonderheiten</h2><ul class="simple"><li><p>Java Records erben immer von <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Record</span></code>.</p></li><li><p>Die Klasse ist (implizit) <code class="java"><span class="keyword">final</span></code> (und notwendigerweise nicht abstrakt).</p></li><li><p>Die Felder, die die Komponenten eines Records sind, sind <code class="java"><span class="keyword">final</span></code> und <code class="java"><span class="keyword">private</span></code>.</p></li><li><p>Ein Record kann keinen weiteren (veränderlichen) Zustand haben.</p></li><li><p>Verschachtelte/Lokale Records sind möglich sind jedoch immer <code class="java"><span class="keyword">static</span></code>.</p></li><li><p>Records sind <em>serializable</em>.</p></li><li><p>Sie haben eine <em>equals()</em>- und <em>hashCode()</em>-Methode, die auf allen Attributen basiert.</p></li><li><p>Sie haben eine <em>toString()</em>-Methode, die alle Attribute ausgibt.</p></li><li><p>Sie haben <em>getter</em>-Methoden für alle Attribute.</p></li><li><p>Sie haben einen Konstruktor, der alle Attribute initialisiert.</p></li><li><p>Sie können <em>static</em> und <em>non-static</em> Methoden haben.</p></li><li><p>Sie können <em>interfaces</em> implementieren.</p></li><li><p>Sie können <em>annotations</em> haben.</p></li></ul></ld-topic>
<ld-topic id="konstruktoren-von-record-klassen"><h2>Konstruktoren von Record Klassen</h2><ld-story><ul class="list-with-explanations simple"><li><p>Ein Record hat immer einen kanonischen Konstruktor, der alle Attribute initialisiert.</p></li></ul><p>(Ein Record hat nie einen parameterlosen Standardkonstruktor.)</p><ul class="incremental-list"><li><p>Ein Record kann weitere Konstruktoren haben, die jedoch den kanonischen Konstruktor aufrufen müssen.</p><aside class="admonition margin-top-1em" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">record</span> <span class="name class">Point</span><span class="punctuation">(</span><span class="keyword">int</span> x<span class="punctuation">,</span> <span class="keyword">int</span> y<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">public</span> <span class="name class">Point</span><span class="punctuation">(</span><span class="keyword">int</span> x<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">this</span><span class="punctuation">(</span>x<span class="punctuation">,</span>x<span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="punctuation">}</span></code></pre></aside></li><li><p>Es ist möglich einen kompakten kanonischen Konstruktor zu definieren. Der Code zur Initialisierung der Attribute (z. B. <code class="java"><span class="keyword">this</span><span class="punctuation">.</span>x <span class="operator">=</span> x<span class="punctuation">;</span></code>) wird dann implizit am Ende generiert.</p><aside class="admonition margin-top-1em" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">record</span> <span class="name class">Point</span><span class="punctuation">(</span><span class="keyword">int</span> x<span class="punctuation">,</span> <span class="keyword">int</span> y<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">public</span> <span class="name class">Point</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">        <span class="keyword">if</span> <span class="punctuation">(</span>x <span class="operator">&lt;</span> <span class="literal number integer">0</span> <span class="operator">||</span> y <span class="operator">&lt;</span> <span class="literal number integer">0</span><span class="punctuation">)</span>
</code><small class="ln">4</small><code data-lineno="4">            <span class="keyword">throw</span> <span class="keyword">new</span> <span class="name class">IllegalArgumentException</span><span class="punctuation">(</span>
</code><small class="ln">5</small><code data-lineno="5">                <span class="literal string">"Negative Koordinaten sind nicht erlaubt."</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6">    <span class="punctuation">}</span>
</code><small class="ln">7</small><code data-lineno="7"><span class="punctuation">}</span></code></pre></aside></li><li><p>Der primäre Zweck von zusätzlichen Konstruktoren ist es, die Validierung oder Normalisierung der Attribute zu ermöglichen.</p></li></ul></ld-story></ld-topic>

</code><small class="ln"> 2</small><code data-lineno=" 2">          <span class="keyword">case</span> <span class="name constant">FREITAG</span> <span class="operator">-&gt;</span> <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="literal string">"gleich ist Wochenende"</span><span class="punctuation">)</span><span class="punctuation">;</span>

<ld-topic id="java-enums-technische-besonderheiten"><h2>Java <code class="java"><span class="keyword">enum</span></code>s - Technische Besonderheiten</h2><ul class="incremental-list list-with-explanations"><li><p>Enums sind <code class="java"><span class="keyword">final</span></code> oder <code class="java"><span class="keyword">sealed</span></code> (falls es innere Klassen gibt)</p></li><li><p>geschachtelte Enums sind (implizit) <code class="java"><span class="keyword">static</span></code></p></li><li><p>der Supertyp alle Enums ist <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Enum</span></code></p><p>(<code class="java"><span class="keyword">extends</span></code> wird für Enums nicht unterstützt.)</p></li><li><p>Klonen von Enums (<code class="java"><span class="name function">clone</span><span class="punctuation">(</span><span class="punctuation">)</span></code>) ist nicht möglich.</p></li><li><p>Es können keine Instanzen der Enum Klasse (z. B. der Klassen Wochentag erzeugt werden.)</p></li></ul></ld-topic>
<ld-topic class="exercises" id="ubung-java-enums"><h2>Übung - Java Enums</h2><div class="ld-exercise" id="ld-exercise-4" data-exercise-id="4" data-exercise-title="4 - Enum für Währungen"><p class="ld-exercise-title rubric"><span>Enum für Währungen</span></p><p>Deklarieren Sie eine Enum (<code class="java"><span class="name class">Currency</span></code>) für Währungen (Euro, Pfund etc.).</p><p>Es soll möglich sein für eine Währung, das Währungssymbol zu erhalten.</p><p>Für jede Währung soll es weiterhin möglich sein, die verfügbaren Stückelungen (<span class="eng">denominations</span>) zu erhalten.</p><p>Schreiben Sie eine kleine <code class="java"><span class="name function">main</span><span class="punctuation">(</span><span class="punctuation">)</span></code>-Methode, um Ihr Enum zu testen.</p><aside class="admonition margin-top-1em" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Falls Sie die Stückelungen in einem Array zwischenspeichern sollten, dann stellen Sie sicher, dass das Array nicht verändert werden kann, wenn der Nutzer die verfügbaren Stückelungen abfragt.</p></aside><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:KIpSlBFa4uE7cSPPr6P1KD2hGePTgeGZjxbOm9/aVDM=:fwwdkhhklEKMdhSZ:kWpZSj9U9V5cQtW3JAK3FC0vZpWJITkA9m7Ykp3m9ZEZd4oXL1lvNPH+AEZy9Jn/jqdkkOmLF5R8IjR6t0IDg8jwa4YzgLuAPR5RY9fEIhPhY5iwoX8zDtAvW/TEg66lAaUJN8R7hmOwph19kuaKAifk2nyU7U4vgpM42klMtO8Er8IAAyo226qibjyFUq13ssbgF8a1vpflSC3BIByM+LYkCINEzassZcWMLHc1lqXzaMHntJZAzfkFGFE6ow8oIeF1ezolT8xNOpYEpttGroMoeVvzHmAVLxkC46sjwsQDTT9XqLZg4XYYBvWlF5hMIN1q4A6AEnl1r6ds5YOvDEbWHN++TuUWfjM5CV+lKtUwpcgr1jp/akLO0o2Gr+X5xmYE2+rdfAtFX5BnqfGDj0I1hAioOquN6ZlqBh/FuZS4PBnFBxUDX7a2BioR6LzP45bmvQKIqvVnJke4hHOVgI7r4m6KmWpMSMgPwlSNRmYxVC47066aMZu/9Uk1oXRMQ125jccqlz8OUeQq4Z/paRp8IGrRE0F9Fmplb9VseWC3Hw2KPWdPyuwVC1CaISzq3cSi9CB81sNef08OQZC+ZW9inxChzQRG9cu/W6uFM1hlMT/Ck2tyGddoeEms+P2zxfRvsneckuFSEDLEMBJlCNqZcYoZHvvE+RolVqa9gdr0+EejbDjCl8Sb7RUTBkNgOPe7Wp7uetXcstM
