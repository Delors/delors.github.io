<ld-topic id="2025_05-linux-shell-erste-schritte"><h1 class="title">Die Linux Shell</h1><dl class="docinfo"><dt class="dozent">Dozent<span class="colon">:</span></dt><dd class="dozent"><a class="reference external" href="https://delors.github.io/cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></dd><dt class="contact">Kontakt<span class="colon">:</span></dt><dd class="contact"><a class="reference external" href="mailto:michael.eichberg@dhbw.de">michael.eichberg@dhbw.de</a></dd><dt class="version">Version<span class="colon">:</span></dt><dd class="version">1.2.2</dd></dl><p>Eine kurze Wiederholung / Einführung.</p><ld-supplemental><dl class="field-list"><dt>Folien<span class="colon">:</span></dt><dd><p>[HTML] <a class="reference external" href="https://delors.github.io/lab-shell/folien.de.md.html">https://delors.github.io/lab-shell/folien.de.md.html</a></p><p>[PDF] <a class="reference external" href="https://delors.github.io/lab-shell/folien.de.md.html.pdf">https://delors.github.io/lab-shell/folien.de.md.html.pdf</a></p></dd><dt>Fehler melden<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://github.com/Delors/delors.github.io/issues">https://github.com/Delors/delors.github.io/issues</a></p></dd></dl><dl class="field-list simple"><dt>KI Verwendung<span class="colon">:</span></dt><dd><p>Bei der Erstellung der Unterlagen wurden KI Assistenten (insbesondere Claude
aber ggf. auch ChatGPT, Ollama mit Gemma/LLama/Qwen oder OpenCode mit
Kimi/Qwen/Deepseek...) unterstützend eingesetzt.
Dies erfolgte insbesondere zur Unterstützung bei der Generierung von Grafiken
(d. h. SVG Dateien), oder um sich Übersichtstabellen generieren zu lassen.
Weiterhin wurde KI zur allgemeinen Qualitätssicherung eingesetzt.
Inhalte, die ggf. von der KI vorgeschlagen wurden, wurden im Falle der
Übernahme explizit validiert und angepasst.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic class="new-section" id="erste-schritte"><h2>Erste Schritte</h2></ld-topic>
<ld-topic id="einloggen-auf-einem-server"><h2>Einloggen auf einem Server</h2><ld-supplemental embed-in-document-flow=""><p>SSH ist die Secure Shell und ein allg. etabliertes Werkzeug im Bereich der Administration von (Server-)Systemen, IoT Geräten etc.</p><p>Im professionellen Umfeld würde man zur Authentifizierung mittels SSH auf Zertifikate setzen. Für diese erste Übung verzichten wir darauf.</p></ld-supplemental><p><strong>Ablauf</strong></p><ol class="arabic peripheral simple" start="0"><li><p>Starten Sie ggf. den CISCO Secure Client, wenn Sie auf interne Server der DHBW Mannheim zugreifen wollen. Dies ist ggf. auch aus dem WLan der DHBW heraus notwendig!</p></li></ol><ol class="arabic incremental-list"><li><p>Starten Sie eine Shell (z. B. Terminal oder iTerm auf MacOS bzw. Linux; cmd oder Powershell unter Windows.)</p></li><li><p>Verwenden Sie SSH, um sich auf dem Server einzuloggen. Sollte Ihr Accountname zum Beispiel <span class="docutils literal">mueller</span> sein und der Server z. B. unter der IP <span class="docutils literal">141.72.12.103</span> erreichbar sein, dann können Sie sich wie folgt auf dem Server einloggen <em>wenn passwort-basierte Authentifizierung möglich ist</em><a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a>:</p><pre class="code bash copy-to-clipboard literal-block"><code><span class="name function">ssh</span> <span class="name variable">-l</span> mueller <span class="literal number integer">141.72</span>.12.103</code></pre><ld-supplemental><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Im professionellen Umfeld ist es bei der Verwendung von SSH üblich, sich mittels Public-Key-Authentifizierung zu authentifizieren.</p></aside></ld-supplemental></li></ol><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Erhalten Sie eine Meldung, dass eine Passwort basierte Authentifizierung nicht erlaubt ist, dannn müssen Sie sich an Ihren Administrator wenden.</p></aside></aside></ld-topic>
<ld-topic id="dateisysteme-auf-unix-ahnlichen-betriebssytemen"><h2>Dateisysteme auf Unix-ähnlichen Betriebssytemen</h2><ld-story><ul class="incremental-list"><li><p>Die Verzeichnisstruktur in Unix-ähnlichen Systemen ist hierarchisch aufgebaut und beginnt bei der Wurzel (<span class="docutils literal">/</span>).</p></li><li><p>Alle Dateien und Verzeichnisse sind Unterknoten dieses Wurzelverzeichnisses.</p><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>In Unixoiden Betriebssystemen trennt <span class="docutils literal">/</span> auch Verzeichnisse.</p></aside><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p><span class="docutils literal">/Users/administrator/.zsh_history</span> ist der Pfad der Datei .zsh_history im Verzeichnis <span class="docutils literal">administrator</span>, welches wiederum im Verzeichnis <span class="docutils literal">Users</span> zu finden ist. <span class="docutils literal">Users</span> ist ein direktes Kindverzeichnis des Wurzelverzeichnisses <span class="docutils literal">/</span>.</p></aside></li><li><p>Im Regelfall sind Datei- und Verzeichnisnamen <em>Case-sensitive</em>.</p><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Es ist möglich zwei Dateien <span class="docutils literal">Test.txt</span> und <span class="docutils literal">test.txt</span> gleichzeitig zu haben, die sich nur in der Groß-Kleinschreibung unterscheiden.</p></aside><ld-supplemental><p>Ist ein Dateisystem nur <em>Case-preserving</em> (Standard unter Windows und MacOS), dann ist es zwar möglich z. B. eine Datei Test.txt anzulegen, aber nicht gleichzeitig auch eine Datei test.txt, die sich nur in der Kapitalisierung der Buchstaben unterscheidet.</p></ld-supplemental></li><li><p>Geräte (wie zum Beispiel Festplatten, USB Sticks, Zufallszahlengeneratoren ...) können an <em>fast beliebiger Stelle</em> eingehängt werden.</p><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Mittels <code class="console"><span class="name function">mount</span></code> kann man sich anzeigen lassen welche Geräte wo eingehängt sind:</p><pre class="code systemd literal-block"><small class="ln">1</small><code data-lineno="1">/dev/vda2 on / type ext4 (rw,relatime)
</code><small class="ln">2</small><code data-lineno="2">/dev/vda1 on /boot/efi type vfat (rw,relatime,...)</code></pre></aside></li><li><p>Systeminformationen sind auch direkt über spezielle Verzeichnisse verfügbar</p><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Ausgabe von detaillierten Informationen über die CPU:</p><pre class="code console literal-block"><code><span class="name function">more</span> /proc/cpuinfo</code></pre><p>Ausgabe der Log-level Konfiguration des Kernels:</p><pre class="code console literal-block"><code><span class="name function">cat</span> /proc/sys/kernel/printk</code></pre></aside></li><li><p>Die Systemkonfiguration kann direkt über das Schreiben in spezialisierte Dateien erfolgen (meist sind Administratorrechte notwendig)</p><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code console literal-block"><code><span class="name class">echo</span> <span class="literal number integer">7</span> <span class="operator">&gt;</span> /proc/sys/kernel/printk</code></pre><p>Setzt den Logging-level für das Kernel Logging auf den Debug-Level, in dem der Wert 7 in die Datei <span class="docutils literal">printk</span> geschrieben wird.</p></aside></li></ul></ld-story><ld-supplemental><p><span class="docutils literal">cat</span>, <span class="docutils literal">more</span> oder auch <span class="docutils literal">less</span> sind ganz generische Programme zum Lesen von jeder Art von Text-basierten Dateien.</p></ld-supplemental></ld-topic>
<ld-topic id="wichtige-verzeichnisse"><h2>Wichtige Verzeichnisse</h2><p>Die wichtigsten Verzeichnisse - insbesondere unter Linux Betriebssystemen - sind:</p><ld-story><table class="incremental-table-rows booktabs zebra"><thead><tr><th class="head"><p>Verzeichnis</p></th><th class="head"><p>Bedeutung / Inhalt</p></th></tr></thead><tbody><tr><td><p>/</p></td><td><p>Wurzelverzeichnis – Ausgangspunkt aller Pfade</p></td></tr><tr><td><p>/bin</p></td><td><p>Wichtige Systemprogramme (z. B. <span class="docutils literal">ls</span>, <span class="docutils literal">cp</span>, <span class="docutils literal">mv</span>)</p></td></tr><tr><td><p>/dev</p></td><td><p>Gerätedateien (z. B. Festplatten: <span class="docutils literal">/dev/sda</span>, Terminals: <span class="docutils literal">/dev/tty</span>)</p></td></tr><tr><td><p>/etc</p></td><td><p>Systemweite Konfigurationsdateien</p></td></tr><tr><td><p>/home</p></td><td><p>Persönliche Benutzerverzeichnisse (z. B. <span class="docutils literal">/home/alex</span>)</p></td></tr><tr><td><p>/lib</p></td><td><p>Wichtige Systembibliotheken</p></td></tr><tr><td><p>/media</p></td><td><p>Einhängepunkte für Wechseldatenträger</p></td></tr><tr><td><p>/mnt</p></td><td><p>Temporärer Einhängepunkt für Administratoren</p></td></tr><tr><td><p>/root</p></td><td><p>Heimatverzeichnis des Superusers <span class="docutils literal">root</span></p></td></tr><tr><td><p>/sbin</p></td><td><p>Systemprogramme für den Administrator</p></td></tr><tr><td><p>/tmp</p></td><td><p>Temporäre Dateien</p></td></tr><tr><td><p>/usr</p></td><td><p>Sekundäres Hierarchiesystem für Benutzerprogramme</p></td></tr><tr><td><p>/var</p></td><td><p>Veränderliche Dateien (z. B. Logs, Mails, Spool-Dateien)</p></td></tr><tr><td></td><td></td></tr><tr><td><p>~</p></td><td><p>Alias für das Homedirectory des aktuellen Nutzer.</p></td></tr></tbody></table></ld-story></ld-topic>
<ld-topic id="grundlegendes"><h2>Grundlegendes</h2><ld-deck><ld-card><p class="rubric">Verzeichnis Operationen</p><dl class="incremental-list dd-margin-left-4em field-list"><dt><code class="console"><span class="name function">ls</span></code><span class="colon">:</span></dt><dd><p>Gibt Informationen über eine Datei/Verzeichnis aus. Ermöglicht es insbesondere den Inhalt eines Verzeichnisses aufzulisten. <code class="console"><span class="name function">ls</span> <span class="name variable">-al</span></code> gibt weitergehende Informationen aus. Insbesondere alle versteckten Dateien und Verzeichnisse sowie die Größe der Dateien und die Rechte.</p></dd><dt><code class="console"><span class="name class">cd</span></code><span class="colon">:</span></dt><dd><p>(<span class="eng">change directory</span>)</p><p>Wechsel des Verzeichnisses. Wechsel zu einem bestimmten Verzeichnis erfolgt durch Angabe des Names (<code class="console"><span class="name class">cd</span> Test</code>).             Wechsel zum Elternverzeichnis erfolgt über: <code class="console"><span class="name class">cd</span> <span class="punctuation">..</span></code> (<code class="console"><span class="punctuation">..</span></code> steht immer für das Elternverzeichnis).
Wechsel zum Wurzelverzeichnis erfolgt über: <code class="console"><span class="name class">cd</span> /</code></p></dd><dt><code class="console"><span class="name function">mkdir</span></code><span class="colon">:</span></dt><dd><p>Anlegen eines Verzeichnisses (<code class="console"><span class="name function">mkdir</span> Test</code>)</p></dd><dt><code class="console"><span class="name function">rmdir</span></code><span class="colon">:</span></dt><dd><p>Löschen eines <em>leeren</em> Verzeichnisses (<code class="console"><span class="name function">rmdir</span> Test</code>)</p></dd><dt><code class="console"><span class="name function">rm</span></code><span class="colon">:</span></dt><dd><p>(<span class="eng">remove</span>) Löschen einer Datei (<code class="console"><span class="name function">rm</span> Hello.txt</code>)</p></dd></dl></ld-card><ld-card class="incremental"><p class="rubric">Allgemeines</p><ul class="incremental-list simple"><li><p>Wenn man in Linux/MacOS ein Stern benutzt, dann wird dies zu den Namen aller nicht-versteckten Dateien/Verzeichnisse im aktuellen Verzeichnis aufgelöst und diese werden an das Programm übergeben! Zum Beispiel löscht <code class="console"><span class="name function">rm</span> *</code> alle Dateien im aktuellen Verzeichnis.</p></li><li><p>Verfügbarer Speicher auf der Festplatte: <code class="console"><span class="name function">df</span> <span class="name variable">-h</span></code></p></li><li><p>Benutzer Speicher (eines Verzeichnisses): <code class="console"><span class="name function">du</span> <span class="name variable">-h</span> <span class="name variable">-s</span> ~</code></p></li><li><p>Inhalt einer Datei editieren ist (zum Beispiel) mit <span class="docutils literal">pico</span> möglich. Alternative kann mit Hilfe von <span class="docutils literal">echo</span> ein Text in eine Datei umgeleitet werden (<code class="console"><span class="name class">echo</span> <span class="literal string">"Hello"</span> <span class="operator">&gt;</span> Hello.txt</code>).</p></li><li><p>Inhalt einer Datei ansehen: <span class="docutils literal">cat</span>, <span class="docutils literal">less</span>, <span class="docutils literal">more</span>, ...</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="hilfe-bekommen"><h2>Hilfe bekommen</h2><p>In unixoiden Betriebssystemen gibt es für Kommandozeilentools Insbesondere die folgenden <em>eingebauten</em> Hilfemöglichkeiten:</p><ul class="simple"><li><p>Hilfe des Programms (typischerweise <code class="console"><span class="name variable">--help</span></code> oder einfach starten).</p></li><li><p><strong>Manpages</strong> (mittels <code class="console"><span class="name function">man</span> <span class="operator">&lt;</span>Name des Programms<span class="operator">&gt;</span></code>)</p></li><li><p>Infopages (mittels <code class="console">info <span class="operator">&lt;</span>Name des Programms<span class="operator">&gt;</span></code>)</p></li></ul><aside class="admonition incremental" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Manpages exisitieren für praktisch alle Kommandozeilenwerkzeuge.</p><p>Nicht bei allen Programmen erhält man über über <code class="console"><span class="name variable">--help</span></code> eine erste Hilfe.</p><p>Je nach Anwendung kann das Starten der Anwendung ohne Parameter dazu führen, dass das Programm auf Eingaben wartet (z. B. <code class="console"><span class="name function">cat</span></code>).</p></aside></ld-topic>
<ld-topic id="kommandozeilenprogrammen-beenden"><h2>Kommandozeilenprogrammen beenden</h2><dl class="incremental-list field-list simple"><dt>&#x3C;ctrl>+c<span class="colon">:</span></dt><dd><p>Programm abbrechen (ggf. unkontrolliert)</p></dd><dt>&#x3C;ctrl>+d<span class="colon">:</span></dt><dd><p>Eingabe abschließen bzw. Ende der Eingabe</p></dd><dt><code class="console"><span class="name function">kill</span> <span class="operator">&lt;</span>PID<span class="operator">&gt;</span></code><span class="colon">:</span></dt><dd><p>Mittels des Befehls <code class="console"><span class="name function">kill</span></code> lässt sich das Programm auch beenden. Erfordert ggf. dass man einen zweiten Terminal startet um die PID zu ermitteln (zum Beispiel mittels <code class="console"><span class="name function">top</span></code> oder <code class="console"><span class="name function">ps</span></code>):</p></dd></dl></ld-topic>
<ld-topic class="exercises" id="ubung-mit-einem-server-verbinden"><h2>Übung - mit einem Server verbinden</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Unix - Erste Schritte"><p class="ld-exercise-title rubric"><span>Unix - Erste Schritte</span></p><ol class="arabic incremental-list list-with-explanations simple"><li><p>Loggen Sie sich auf dem Server unter Verwendung der passenden Zugangsdaten ein.</p></li><li><p>Ändern Sie Ihr Passwort mit Hilfe von <span class="docutils literal">passwd</span>.</p></li></ol></div></ld-topic>
<ld-topic class="exercises" id="ubung-mit-einem-server-uber-keys-verbinden"><h2>Übung - mit einem Server über Keys verbinden<a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a></h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Unix - Einloggen mittels SSHKey"><p class="ld-exercise-title rubric"><span>Unix - Einloggen mittels SSHKey</span></p><p><strong>Im professionellen Umfeld ist die Authentifizierung über SSH-Keys üblich.</strong> SSH-Keys sind eine sicherere Alternative zu Passwörtern, da keine Passwörter übertragen werden.</p><ol class="arabic incremental-list list-with-explanations"><li><p>Erstellen Sie <strong>lokal</strong> - auf Ihrem Clientrechner - einen SSH Key-Paar mittels ssh-keygen. Nutzen Sie den <span class="docutils literal">ed25519</span> Algorithmus.</p><p>Sollten Sie bereits ein SSH Key-Paar haben, dann können Sie diesen verwenden. Ansonten erstellen Sie das Schlüsselpaar im lokalen Verzeichnis.</p></li><li><p>Kopieren Sie den <strong>öffentlichen Schlüssel</strong> auf den Server mittels <code class="console">ssh-copy-id</code>.</p><p>Der öffentliche Schlüssel ist in der <span class="docutils literal">.pub</span> Datei. Diese Datei ist das <em>identity file</em>, dass der Server benötigt/verwendet.</p></li><li><p>Testen Sie ob Sie sich beim Server anmelden können ohne Paswort!</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:tx+0uT7HMB1PTHzihkbxuWT+VrTNpR9oPfiETV6Mhgo=:oVScOJW+iVMcc45P:isByBvYqmVUtgdZeFK3yPigkVNA/ixiwjMu28zwBB9M0Tn7gptZ9Fr2FeBs0tTv4q4CaySSYvsTNECQnWRIBvQFnpYNdhdMWHJYp7wSQ5mpag9igp/3NA1Rh5gd6vVcEMP9mVhWMlOFHFHGMl6JeQp/fG5wEAzAXcbweirzCldkKhiEePzp5CCYiqF5tDzPRhyaF43fgByo463Z0il2W3MFPMnRT9/cdm5ATbR7i49B6ZYumWX7bLFbGm/wBu6Hn8K625qUXdNOIfiG6GYrJ5GvINWL3EDXJa1JH/uzvYVP+tquhbK8BU9PCLUCWyeZv9Q4N72ehFwZyJ8wDoVJrcJqt732ZufiCk6fN+IcdN4gUuPhP5YnKmwMGtAXKybDIYMq8+xL+t <ld-topic class="exercises" id="ubung-starten-eines-kleinen-webservers"><h2>Übung - Starten eines kleinen WebServers</h2><div class="ld-exercise" id="ld-exercise-3" data-exercise-id="3" data-exercise-title="3 - Unix - Grundlegende Operationen"><p class="ld-exercise-title rubric"><span>Unix - Grundlegende Operationen</span></p><ol class="arabic incremental-list list-with-explanations"><li><p>Erzeugen Sie ein Verzeichnis mit Ihrem Nachnamen (z.B. "eichberg")</p></li><li><p>Legen Sie in dem Verzeichnis eine rundimentäre <span class="docutils literal">index.html</span> Datei an.</p><p>(Sie können zum Beispiel <span class="docutils literal">pico</span>, <span class="docutils literal">vim</span> oder <span class="docutils literal">echo</span> verwenden!)</p></li><li><p>Starten Sie einen Webserver mit dem gerade angelegten Verzeichnis als Wurzel. Wählen Sie eine zufälligen Port XXXX > 1024 aus.</p><ld-supplemental embed-in-document-flow=""><h3>IPv4</h3><p>Zum Beispiel können Sie den bereits installierten Webserver mittels <span class="docutils literal">http-server</span> wie folgt starten. Im Folgenden ist der Port <span class="docutils literal">XXXX</span> und das Wurzelverzeichnis für Ihre Webseiten "<span class="docutils literal">eichberg</span>":
<code class="console">http-server <span class="name variable">-p</span> XXXX eichberg</code>.</p><h3>IPv6</h3><p>Zum Beispiel können Sie den bereits installierten Webserver mittels <span class="docutils literal">http-server</span> wie folgt starten. Im Folgenden ist der Port <span class="docutils literal">XXXX</span> und das Wurzelverzeichnis für Ihre Webseiten "<span class="docutils literal">eichberg</span>":
<code class="console">http-server <span class="name variable">-a</span> ::0 <span class="name variable">-p</span> XXXX eichberg</code>.</p><h3>Auf Server zugreifen:</h3><p>Entweder wie gewohnt: <span class="docutils literal">http://&#x3C;URL>:&#x3C;PORT>/index.html</span> oder falls der Server nur IPv6 spricht und keinen Hostnamen hat: <span class="docutils literal">http://[&#x3C;IPv6>]:&#x3C;PORT>/index.html</span> (z.B. <span class="docutils literal">http://[2001:7c0:1b20:c913:1::3d8]:3333</span>) - die eckigen Klammern sind obligatorisch!</p></ld-supplemental></li><li><p>Wechseln Sie in Ihren Browser und öffnen sie die entsprechende Webseite.</p><p>(Denken Sie daran, dass dieser Server nur http und nicht https unterstützt.)</p></li><li><p>Beenden Sie den WebServers</p></li><li><p>Löschen Sie das gerade angelegte Verzeichnis.</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:RVzZmvbtMY/W017zGOp3hFbh8S9KjgRVZUJ025qcri0=:5NtjpBuwpUnCr1MJ:YFE0tvs5dw097/ezg52XzNguDy85qsi/mnnGQImTh52OpQXTYiqrDF+vTZ8s4Kn3ApNtv/EsS3/+TTkj35MJyKn3lSEAcM7y0YDUnT/VMrolvcev64f1ci49wvM3lnXF8KIK33vUrGZsVFbnC5Bsi/ffLgi89+ojtpo+XcXMYZTatyD0dYNcrF1pJ4+mICFG+Szc2HcM7TBtCSGVwtnJSb2riA9VvTttoD33qmRNl4OiZ5c1o7sZDt19H0CJq/63rd3l0rRACI/TQgXDcJcUJPlxw+p8JthIhhyN3JqMdB0Wa/5Hjm06GmQZ2WbtttuL9J3Zl7Ud+/e8vARhFvvs/7GV2ccleVQ4cg9uVq8yejPy89Pa2BuWHXmeALGZQZ+PdiaaLmw9zhUOsR/Dv3pjxfsW18OwgsKORuIHxj8DAKiMMl4HjBxNckf/49I/8pY1YiCQjAxCEyB04sUAAVjogn3Qs2/gzux71OfeIwNvaI7/ZS0h6Btd6gghc2UtZXtm44tZJv/AF/AGf4gr684g6vodYRSpVGf7vnaVnkpuAkrbnJtfEOwDBS6i7shu3O63T6R6QWEGFKcLHovxWVyXCWofe7CzIZATdDxAfVUsAKcOKLvdk5BE3oniUawWb8r/8Yju9vUJNHiRzjyPANHADvtECneO0TxnqK61SWJCbXuqPSJ+SiYRPtdRzQWBjQhfaYxGfS4EWlY3vkj2bZXmXcT18sdp82eZv9Oe9wvU+OkEplK53YiurvQGcJvvaZu478Ek88Q3yE9DiKJbQ/asFNdywmYjPYmt5qMVRyhxhs+pJsje5h8xs80euxbqMX9Wr2ANwP4fsjylkGymAMoHeCdtrFmaE5MEklEeOr3lQ+AsWQKivXR+7G+4bmjslxhVcx3JChD6gR3PuMBQNmJqkq5aqy2GjikZYl8pa/vXXKivs05acsw9vFO2+0zH/d6kL+Fi86/E+7W022H6ez/TSDGoflb3ZVARdqflYWuR8sUmDR3CBfGuABg747hB <ld-topic class="exercises" id="ubung-starten-des-servers-im-hintergrund"><h2>Übung - Starten des Servers im Hintergrund</h2><div class="ld-exercise" id="ld-exercise-4" data-exercise-id="4" data-exercise-title="4 - nohup"><p class="ld-exercise-title rubric"><span>nohup</span></p><ol class="arabic"><li><p>Starten Sie den Webserver im Hintergrund und leiten Sie die Ausgaben in eine Log-Datei um. Nutzen Sie <span class="docutils literal">nohup</span> als Tool.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p><code class="console"><span class="name function">nohup</span> http-server <span class="name variable">-p</span> <span class="literal number integer">8888</span> eichberg <span class="operator">&gt;</span> web.log <span class="operator">2&gt;</span>&amp;1 <span class="operator">&amp;</span></code></p></aside></li><li><p>Überprüfen Sie, ob der Server im Hintergrund läuft. D. h. loggen sie sich aus und rufen Sie danach wieder die Webseite auf.</p></li><li><p>Loggen Sie sich wieder ein und beenden Sie den Server mittels <span class="docutils literal">kill</span> Befehl. Die PID können Sie mittels <code class="console"><span class="name function">ps</span> <span class="name variable">-aux</span> <span class="operator">|</span> <span class="name function">grep</span> http-server</code> herausfinden.</p></li></ol></div></ld-topic>
<ld-topic class="exercises" id="ubung-installation-von-software-als-normaler-nutzer"><h2>Übung - Installation von Software als normaler Nutzer</h2><div class="ld-exercise" id="ld-exercise-5" data-exercise-id="5" data-exercise-title="5 - NVM installieren"><p class="ld-exercise-title rubric"><span>NVM installieren</span></p><p>Installieren Sie nvm (Node Version Manager), um im zweiten Schritt eine aktuelle Version von node.js zu installieren.</p><p><a class="reference external" href="https://github.com/nvm-sh/nvm?tab=readme-ov-file#installing-and-updating">https://github.com/nvm-sh/nvm?tab=readme-ov-file#installing-and-updating</a></p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:jGsme1jO2TkeBx9YI7cjZb6JmTgl5QKEQVcMs2vkvw0=:fvh+15dfcCV00dsR:UN82NqeYnXAirK/0Tmy4ZwGgL89hah0u3hDYFjXF2Mo7hEJV8vnasMhYko8zuDzNWnceGLzB5NQtBJSx8JCswnimj4JsmS1plueyDJL6ChGeS/CErUL/LhbR/aRy/MEK+O0ZX3WCxzfGsBRBss19BKxjfoXg6F323zYncbELH8YxNUDICNEhwd0zT27yAOan5RDNLRnM6xA3goN9debGfTUTAMuuNQzJ21PL3lsHq+Naj9+FxrpQl5hfbNlYVLq1sbgHjFVKt48abVOd8wXKOcN42NQAcHgS+BSzu1IVWJEwc9abn8etHkxivSeoco8pWHvenEFclHYeWcN3LG37/kW6D+opM300velHZcrR51N5WCp+sOqZ62gFLFQ5dM0FOr/EebS7Q+m3BQGtELHeSrpsKz8LPxF6vKVZ5WvIadw5xV3bQGbstz4iGoQOJa1PpnKtqqg6UG78ShQWsknxX85SSDyvQjG55qJMATbHZWjT6+0LEklbRvJSp8ou/X+1PfYPVJbon/gnj58tkRP/pZFOCcP4suPRtusmOR3sIfi2nyzr68/qcViAgiriA4OgQ3kzwTnJ9lScpNzfYpb3NUtzFI5N62brW2D/3k8IbWmXGDVwAmbansl4Do6NGt5BbkMjsO1WlcI9TWUEweaIGgnc99Rak3wBXqqbNV1kMsKhvy1NRalnO6lHVa6GRQflw20ABWnKjEE6VGcarwd97vESoWbm2lzTXK73WAa8vFmLLssLlcLn</div></div></ld-topic>
<ld-topic class="exercises" id="ubung-daten-transferieren"><h2>Übung - Daten transferieren</h2><div class="ld-exercise" id="ld-exercise-6" data-exercise-id="6" data-exercise-title="6 - Secure Copy (scp) nutzen zum Kopieren"><p class="ld-exercise-title rubric"><span>Secure Copy (<code class="console"><span class="name function">scp</span></code>) nutzen</span></p><p>Nutzen Sie das Programm <code class="console"><span class="name function">scp</span></code>, um eine HTML Datei von Ihrem lokalen Rechner auf den Zielserver zu kopieren.</p><ol class="arabic simple"><li><p>Nutzen Sie die Hilfe zu <code class="console"><span class="name function">scp</span></code>, um herauszufinden wie Sie eine Datei auf den Server in das richtige Verzeichnis kopieren können.</p></li><li><p>Öffnen Sie Ihren Browser, um zu prüfen, dass Sie auf die kopierte Webseite zugreifen können.</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:i5zJDfFBthl4DKeAU4ESawrT0JvrXrVup4ZfBjNwCGU=:ulWP3LTZmQTxYIIq:3kapPmPDdM9uAMCb0ofXChkO3cWODHG63XaXfMWdlQHnO3zxlitL6tkmjvl72uUMXtEUzuRdGRfgQh8Yt9v7SVpjy0DmJIdX2VlMrsdbUnVIjmDLJk7IMnzuVdeTmE27vbic5zCOKnickBT/mlESOAYpas99U1xz/OFzUwkPt+XosdqLqq9y1DJCph3niJmRBGkhIVgmbTgBOpf9VonRLZ3XUiGHybN/ZDIEspHFN61WaVk/5qfyOA7BJSY0BfIwqNHwYZvxKNgUV85GmgNBYAKCWXoAzSp8wjOG+zo8IzCvjzTjejZ4Ac90BKOLC2CE/oaCD1M26TEQIold8Mf4vDXRFYgZ4I1nQPL9P1EAY4UtYIdpZBmcxwliEDsy1eZ4mLLSIikHUMWu04Dovf/DIsLOxc63seH3jAL53gcNUR5hXxUiF+JrEeJ7e2e5tnvEUXFnZZDXdChNGe7I4eNefBuwP1fX7RfU8GivoFB/0choy0rDIl7nOrqSrnzZg7AjfBwkdhyerAtVJVyh4ezQyiPqTf5lPIsSAVpQl7rQXsgQ6Ct0dWBlytR48eA9eKJer/QJPDP7VSOlxsGNUfYQmJlSiynXzWnsG0f8VEBI+1ymRUac7APKVl+uipM2eiYWaOP1SwK344OAttPOT1UhWBapPMSjnjSkUjdjudXsKqFDLJRyolsWPWtce5xzFKLIp8f65Yj/aJZsTbxuz5Y+vdRhPYPNJGcux2hrepoVzOk2+7tu7VxdCQki1FOh2uKWLMyHgO2VcgSdhDAstjY5pwqqiV1jbxCrVcDGGj9GDxYLnFxuX517l1nV8BTa7zu3NiVN6rjb8fYFC75M4kd9MKzhZ0PAqvYv4qB6lyEFLOolqjBAP2hNrEJMqVZFQ5i1IW2Qq5bfyRk=</div></div></ld-topic>
<ld-topic class="new-section transition-move-to-top" id="text-dateien-und-ihre-bearbeitung"><h2>(Text-)Dateien und Ihre Bearbeitung</h2></ld-topic>
<ld-topic id="die-grundlegenden-datenstrome"><h2>Die grundlegenden Datenströme</h2><p>Jedes Programm hat immer Zugriff auf die drei Standarddatenströme:</p><ul class="simple"><li><p><span class="docutils literal">stdin</span> - Eingabedatenstrom.</p></li><li><p><span class="docutils literal">stdout</span> - Ausgabedatenstrom für „normale“ Nachrichten.</p></li><li><p><span class="docutils literal">stderr</span> - Ausgabedatenstrom für Fehlernachrichten.</p></li></ul><div class="incremental"><p>Diese Datenströme sind (auch nur) Dateien, mit einem festgelegten Dateideskriptor (<span class="eng">file descriptor</span>):</p><dl class="field-list simple"><dt>0<span class="colon">:</span></dt><dd><p><span class="docutils literal">stdin</span></p></dd><dt>1<span class="colon">:</span></dt><dd><p><span class="docutils literal">stdout</span></p></dd><dt>2<span class="colon">:</span></dt><dd><p><span class="docutils literal">stderr</span></p></dd></dl></div></ld-topic>
<ld-topic id="umleitung-von-stdin-in-dateien"><h2>Umleitung von <span class="docutils literal">stdin</span> in Dateien</h2><p><span class="docutils literal">></span> leitet die Ausgabe eines Programmes/Kommandos in eine Datei um; löscht bzw. legt die Zieldatei bei Bedarf an.</p><p class="incremental"><span class="docutils literal">>></span> leitet die Ausgabe eines Programmes/Kommandos in eine Datei um; hängt die Ausgabe an das Ende einer bestehenden Datei an bzw. legt die Zieldatei bei Bedarf an.</p><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Erzeugen einer Datei <span class="docutils literal">tmp/0s.txt</span>, die 1024 mal den Wert 0 in Base64 Kodierung enthält.</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name function">dd</span> if<span class="operator">=</span>/dev/zero bs<span class="operator">=</span><span class="literal number integer">1</span> count<span class="operator">=</span><span class="literal number integer">1024</span> <span class="operator">|</span> base64 <span class="punctuation">\</span> <span class="comment single"># 1024 * "0" in base64</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="operator">&gt;</span>                                        <span class="punctuation">\</span> <span class="comment single"># Umleitung der Ausgabe</span>
</code><small class="ln">3</small><code data-lineno="3">/tmp/0s.txt                                <span class="comment single"># in /tmp/0s.txt</span></code></pre><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Der <span class="docutils literal">\</span> am Zeilenende wird dazu verwendet, lange Shellkommandos über mehrere Zeilen schreiben zu können; # leitet ein "End-of-line Comment" ein.</p></aside></aside></ld-topic>
<ld-topic id="umleiten-von-bestimmten-ausgaben-an-dateien"><h2>Umleiten von bestimmten Ausgaben an Dateien</h2><p>Beim Umleiten von Ausgaben an eine Datei, kann der Dateideskriptor angegeben werden: <span class="docutils literal">[FD]>&#x3C;Ziel></span></p><div class="incremental"><p><span class="docutils literal">2></span> leitet z. B. die Fehlerausgaben (<span class="eng">stderr</span>) eines Programmes/Kommandos in eine Datei um; löscht bzw. legt die Zieldatei bei Bedarf an.</p></div><div class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Finden von bestimmten Dateien; aber Fehlerausgaben während des Suchprozesses ignorieren.</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name function">find</span> / <span class="name variable">-iname</span> <span class="literal string">"*txt*"</span> <span class="name variable">-type</span> f <span class="punctuation">\</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="operator">2&gt;</span>/dev/null           <span class="comment single"># Umleitung aller Fehler nach /dev/null</span></code></pre></aside></div></ld-topic>
<ld-topic id="grundlegende-prinzipien-lesen-aus-einer-datei"><h2>Grundlegende Prinzipien: Lesen aus einer Datei</h2><p><span class="docutils literal">&#x3C;</span> liest den Inhalt einer Datei und leitet diesen an das Programm/Kommando weiter; d. h. stellt den Inhalt über stdin zur Verfügung.</p><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Finden aller Städte, die mit "B" beginnen.<a class="brackets" href="#footnote-3" id="footnote-reference-3" role="doc-noteref"><span class="fn-bracket">[</span>3<span class="fn-bracket">]</span></a></p><pre class="code zsh copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1">grep B \             # filtert alle Zeilen, die ein "B" enthalten
</code><small class="ln">2</small><code data-lineno="2">   &lt; Big\ Cities.txt # der Inhalt von Big Cities.txt wird über stdin
</code><small class="ln">3</small><code data-lineno="3">                     # zur Verfügung gestellt</code></pre></aside><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-3" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-3">3</a><span class="fn-bracket">]</span></span><p>In diesem Fall könnte die Datei (<span class="docutils literal">Big Cities.txt</span>) auch direkt als Parameter an <span class="docutils literal">grep</span> übergeben werden. In anderen Fällen ist dies aber nicht möglich.</p></aside></aside></ld-topic>
<ld-topic id="linux-shell-grundlegendes-design-pattern-pipes-and-filters"><h2>Linux Shell - Grundlegendes Design-Pattern: <strong>Pipes and Filters</strong></h2><ul class="simple"><li><p>Grundlegendes Konzept bzw. Entwurfsmuster (<span class="eng">Design-Pattern</span>) in Unix-basierten Betriebssystemen.</p></li><li><p>Ermöglicht die effiziente Verkettung von Befehlen. Die „Pipes-and-Filter“ Architektur erlaubt es komplexe Verarbeitungsoperationen mit Hilfe der Kombination von einfachen Befehlen durchzuführen.</p></li></ul><p class="incremental"><span class="docutils literal">|</span>: Verbindet den Ausgabestrom (<span class="docutils literal">stdout</span>) des vorhergehenden Befehls mit dem Eingabestrom (<span class="docutils literal">stdin</span>) des nachfolgenden Befehls.</p><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Konvertierung des Wortes <span class="docutils literal">Test</span> in Base64 Kodierung.</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">echo</span> <span class="name variable">-n</span> <span class="literal string">"Test"</span> <span class="punctuation">\</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="operator">|</span>              <span class="punctuation">\</span> <span class="comment single"># Weiterleitung der Ausgabe von echo an base64.</span>
</code><small class="ln">3</small><code data-lineno="3">base64</code></pre></aside><ld-supplemental><p>„Filter“: Kommandos/Programme, die von <span class="docutils literal">stdin</span> lesen und nach <span class="docutils literal">stdout</span> schreiben.</p></ld-supplemental></ld-topic>
<ld-topic id="wichtige-linux-kommandozeilenwerkzeuge-fur-die-verarbeitung-von-passwortkandidaten"><h2>Wichtige Linux Kommandozeilenwerkzeuge für die Verarbeitung von Passwortkandidaten</h2><ld-story><dl class="incremental-list field-list"><dt>cat<span class="colon">:</span></dt><dd><p>Dateien verketten.</p></dd><dt>sed<span class="colon">:</span></dt><dd><p>Strom Editor.</p></dd><dt>grep<span class="colon">:</span></dt><dd><p>Mustersuche auf Dateien.</p></dd><dt>tr<span class="colon">:</span></dt><dd><p>Ersetzung und Löschung von Zeichen.</p></dd><dt>uniq<span class="colon">:</span></dt><dd><p>Filtert wiederholte aufeinanderfolgende Zeilen in einer Datei.</p></dd><dt>sort<span class="colon">:</span></dt><dd><p>Sortiert Dateien.</p></dd><dt>echo<span class="colon">:</span></dt><dd><p>Schreibt Argumente auf <em>Standard Out</em> (<span class="docutils literal">stdout</span>).</p></dd><dt>wc<span class="colon">:</span></dt><dd><p>Zählt die Zeichen, Wörter, Zeilen einer Datei.</p></dd><dt>comm<span class="colon">:</span></dt><dd><p>Vergleicht sortierte Listen und filtert entsprechend.</p></dd><dt>find<span class="colon">:</span></dt><dd><p>Auswertung eines Ausdrucks für jede Datei während eines rekusiven Abstiegs über den Verzeichnisbaum.</p></dd><dt>awk<span class="colon">:</span></dt><dd><p>Muster-orientierte Verarbeitung der Zeilen einer Eingabedatei.</p></dd><dt>base64<span class="colon">:</span></dt><dd><p>(De-)Kodierung von Daten in Base64 Kodierung.</p></dd><dt>rev<span class="colon">:</span></dt><dd><p>Dreht die Reihenfolge der Zeichen einer Zeile um.</p></dd><dt>head<span class="colon">:</span></dt><dd><p>Zeigt die ersten (<span class="docutils literal">-n</span>) Zeilen einer Datei an.</p></dd><dt>tail<span class="colon">:</span></dt><dd><p>Zeigt die letzten (<span class="docutils literal">-n</span>) Zeilen einer Datei an.</p><p>(<span class="docutils literal">-f</span> folgt der Datei, d. h. wartet auf weitere Daten, die der Datei hinzugefügt werden.)</p></dd></dl></ld-story><ld-supplemental><p><strong>Anwendungsfälle</strong></p><p>Typischerweise werden diese Werkzeuge bei der Verarbeitung von Leaks/Aufbereitung von Wörterbüchern im Vorfeld gebraucht - vor dem eigentlichen Versuch das Passwort wiederherzustellen.</p></ld-supplemental></ld-topic>
<ld-topic id="echo"><h2>echo</h2><ul class="simple"><li><p>Universell eingesetzt, um Inhalte in Dateien zu schreiben bzw. anzuhängen.</p></li><li><p><span class="docutils literal">-n</span> um das automatische Anhängen von Zeilenumbrüchen zu unterdrücken.
<span class="peripheral">(Besonders dann wichtig, wenn man Hashes für Testdaten generieren will.)</span></p></li><li><p>Entweder ein explizites Programm oder ein in die Shell eingebautes Kommando.</p></li></ul><div class="incremental"><aside class="admonition width-30" data-theme="note"><p class="admonition-title" data-theme="note-header">Bemerkung</p><p>Der hier zu sehende Befehl <span class="docutils literal">shasum -a 256</span> ist unter einigen Linuxdistributionen einfach <span class="docutils literal">sha256sum</span>.</p></aside><p><strong>Anwendungsfall</strong>: Programmatisch Daten nach <span class="docutils literal">stdout</span> schreiben.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="name variable">-n</span> <span class="literal string">"TestPasswort"</span>
</code><small class="ln">2</small><code data-lineno="2">  <span class="operator">|</span> shasum <span class="name variable">-a</span> <span class="literal number integer">256</span>
</code><small class="ln">3</small><code data-lineno="3">  <span class="operator">|</span> <span class="name function">sed</span> <span class="name variable">-E</span> <span class="literal string">'s/  -$//'</span>
</code><small class="ln">4</small><code data-lineno="4">2214db3d6fca761041242b9fc41fdcca
</code><small class="ln">5</small><code data-lineno="5">f0b2c7f556b80c0a91cfe6994437d807</code></pre></div></ld-topic>
<ld-topic id="cat"><h2>cat</h2><ul><li><p>Liest alle Dateien sequentiell ein und schreibt diese auf <span class="docutils literal">Standard Out</span> (stdout).</p></li><li><p>"<span class="docutils literal">-</span>" repräsentiert <span class="docutils literal">Standard In</span> (stdin); dies ermöglicht die Verwendung von cat mitten in einer Verarbeitungskette.</p></li><li><p>Liest (ggf.) von <span class="docutils literal">stdin</span> bis zur EOF <span class="eng">End-of-File</span> Markierung.</p><p>(Das Einlesen von der Kommandozeile kann mit <span class="docutils literal">CTR+D</span> beendet werden.)</p></li></ul><div class="incremental"><p><strong>Anwendungsfall</strong>: Mehrere Teilwörterbücher sollen zusammengefügt werden.</p><p>Inhalt von Test1.txt: <span class="docutils literal">Test1</span></p><p>Inhalt von Test2.txt: <span class="docutils literal">Test2</span></p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">"Test3"</span> <span class="operator">|</span> <span class="name function">cat</span> Test1.txt Test2.txt -
</code><small class="ln">2</small><code data-lineno="2">Test1
</code><small class="ln">3</small><code data-lineno="3">Test2
</code><small class="ln">4</small><code data-lineno="4">Test3</code></pre></div></ld-topic>
<ld-topic id="tr"><h2>tr</h2><ul class="simple"><li><p>Kopiert die Eingabe von <span class="docutils literal">stdin</span> nach <span class="docutils literal">stdout</span> und führt dabei Substitutionen und Löschungen durch.</p></li></ul><div class="incremental"><p><strong>Anwendungsfall</strong>: bestimmte Buchstaben - zum Beispiel Sonderzeichen - sollen gelöscht werden.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="name variable">-n</span> <span class="literal string">'ab.cd_12!'</span> <span class="operator">|</span> <span class="name function">tr</span> <span class="name variable">-dc</span> <span class="literal string">'[:alnum:]'</span>  <span class="comment single"># -dc = delete complement</span>
</code><small class="ln">2</small><code data-lineno="2">abcd12</code></pre></div><div class="incremental"><p><strong>Anwendungsfall</strong>: Groß- in Kleinbuchstaben verwandeln.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="name variable">-n</span> <span class="literal string">'STARK'</span> <span class="operator">|</span> <span class="name function">tr</span> <span class="literal string">'[:upper:]'</span> <span class="literal string">'[:lower:]'</span>
</code><small class="ln">2</small><code data-lineno="2">stark</code></pre></div></ld-topic>
<ld-topic id="uniq"><h2>uniq</h2><ul class="simple"><li><p>vergleicht nebeneinanderliegende Zeilen und schreibt jede einzigartige Zeile einmal nach <span class="docutils literal">stdout</span>. Nicht-nebeneinanderliegende Wiederholungen werden nicht erkannt.</p></li><li><p><span class="docutils literal">-c</span> erlaubt es die Anzahl der Wiederholungen zu zählen.</p></li></ul><div class="incremental"><p><strong>Anwendungsfall</strong>: Wir möchten eine alphabetisch sortierte Liste nach der Häufigkeit des Vorkommens eines Wortes sortieren.</p><p>Mittels <span class="docutils literal">uniq</span> kann die Häufigkeit gezählt werden.</p><p><span class="peripheral">Die Sortierung - zum Beispiel angefangen mit den am häufigsten vorkommenden Einträgen - kann danach im Nachgang erfolgen</span>.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">"Test<span class="name entity">\n</span>Test<span class="name entity">\n</span>Schlaraffenland<span class="name entity">\n</span>Test"</span> <span class="operator">|</span> <span class="name function">uniq</span> <span class="name variable">-c</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="literal number integer">2</span> Test
</code><small class="ln">3</small><code data-lineno="3"><span class="literal number integer">1</span> Schlaraffenland
</code><small class="ln">4</small><code data-lineno="4"><span class="literal number integer">1</span> Test</code></pre></div></ld-topic>
<ld-topic id="awk"><h2>awk</h2><ul><li><p>Muster-orientierte Verarbeitung der Zeilen einer Eingabedatei.</p></li><li><p>Jede Zeile wird segmentiert (Standardmäßig basierend auf Leerzeichen), die einzelnen Segmente werden mit <span class="docutils literal">$1</span>, <span class="docutils literal">$2</span>, ... bezeichnet. <span class="docutils literal">$0</span> steht für die ganze Zeile.</p></li><li><p>Die Verarbeitung erfolgt durch Muster-Handlungsanweisungen der Form:</p><pre class="code awk literal-block"><code>pattern <span class="punctuation">{</span> action <span class="punctuation">}</span></code></pre><p>ist das Muster (<span class="eng">pattern</span>) leer, dann wird die Zeile immer verarbeitet; ist keine Handlungsanweisung (<span class="eng">action</span>) angegeben, dann wird die Zeile ausgegeben.</p></li></ul><div class="incremental"><p><strong>Anwendungsfall</strong>: Die Einträge einer Datei sollen nach länge sortiert werden. In diesem Fall, kann mit Hilfe von awk jede Zeile mit der Länge ausgegeben werden. <span class="peripheral">Danach kann die Liste entsprechend sortiert werden.</span></p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">"Test<span class="name entity">\n</span>Schlaraffenland"</span> <span class="operator">|</span>  <span class="name function">awk</span> <span class="literal string">'{print length " " $1}'</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="literal number integer">4</span> Test
</code><small class="ln">3</small><code data-lineno="3"><span class="literal number integer">15</span> Schlaraffenland</code></pre></div></ld-topic>
<ld-topic id="sort"><h2>sort</h2><ul class="simple"><li><p>Sortiert eine Liste gemäß der entsprechenden Felder.</p></li><li><p><span class="docutils literal">-r</span> sortiert in absteigender Reihenfolge.</p></li><li><p><span class="docutils literal">-n</span> der Wert des ersten Feldes wird als numerischer Wert interpretiert.</p></li><li><p><span class="docutils literal">-k</span> spezifiziert das Feld, nach dem sortiert werden soll. (z. B. -k 3)</p></li><li><p><span class="docutils literal">-t</span> spezifiziert das Trennzeichen, das die Felder trennt. (z. B. -t ',')</p></li></ul><div class="incremental"><p><strong>Anwendungsfall</strong>: Sortiere eine Liste nach Häufigkeit des Vorkommens eines Wortes.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">"abc<span class="name entity">\n</span>xyz<span class="name entity">\n</span>uvw<span class="name entity">\n</span>xyz"</span> <span class="punctuation">\</span>
</code><small class="ln">2</small><code data-lineno="2">  <span class="operator">|</span> <span class="name function">sort</span> <span class="punctuation">\</span>                  <span class="comment single"># alphabetische Sortierung</span>
</code><small class="ln">3</small><code data-lineno="3">  <span class="operator">|</span> <span class="name function">uniq</span> <span class="name variable">-c</span> <span class="punctuation">\</span>               <span class="comment single"># zähle Häuigkeit des Vorkommens einer Zeile</span>
</code><small class="ln">4</small><code data-lineno="4">  <span class="operator">|</span> <span class="name function">sort</span> <span class="name variable">-nr</span> <span class="punctuation">\</span>              <span class="comment single"># absteigende Sortierung</span>
</code><small class="ln">5</small><code data-lineno="5">  <span class="operator">|</span> <span class="name function">sed</span> <span class="name variable">-E</span> <span class="literal string">'s/ *[0-9]+ *//'</span> <span class="comment single"># entferne den Zähler</span>
</code><small class="ln">6</small><code data-lineno="6">xyz
</code><small class="ln">7</small><code data-lineno="7">uvw
</code><small class="ln">8</small><code data-lineno="8">abc</code></pre></div><ld-supplemental><p><strong>Komplexes Beispiel</strong></p><p>Sortierung einer Liste von Worten in absteigender Reihenfolge bzgl. (1) der Häufigkeit und (2) Länge.</p><pre class="code bash literal-block"><small class="ln"> 1</small><code data-lineno=" 1">$ <span class="name class">printf</span> <span class="literal string">'%s'</span> <span class="literal string">"abc<span class="name entity">\n</span>uvw<span class="name entity">\n</span>xyz<span class="name entity">\n</span>lmnop<span class="name entity">\n</span>xyz<span class="name entity">\n</span>uvw"</span> <span class="punctuation">\</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">       <span class="literal string">"<span class="name entity">\n</span>lmnop<span class="name entity">\n</span>lmnop<span class="name entity">\n</span>xyz<span class="name entity">\n</span>cd<span class="name entity">\n</span>cd<span class="name entity">\n</span>cd"</span> <span class="punctuation">\</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">  <span class="operator">|</span> <span class="name function">awk</span> <span class="literal string">'{print length " " $1}'</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">  <span class="operator">|</span> <span class="name function">sort</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">  <span class="operator">|</span> <span class="name function">uniq</span> <span class="name variable">-c</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">  <span class="operator">|</span> <span class="name function">sort</span> <span class="name variable">-nr</span> <span class="name variable">-k</span> <span class="literal number integer">1</span> <span class="name variable">-k</span> <span class="literal number integer">2</span>
</code><small class="ln"> 7</small><code data-lineno=" 7"><span class="literal number integer">3</span> <span class="literal number integer">5</span> lmnop
</code><small class="ln"> 8</small><code data-lineno=" 8"><span class="literal number integer">3</span> <span class="literal number integer">3</span> xyz
</code><small class="ln"> 9</small><code data-lineno=" 9"><span class="literal number integer">3</span> <span class="literal number integer">2</span> <span class="name class">cd</span>
</code><small class="ln">10</small><code data-lineno="10"><span class="literal number integer">2</span> <span class="literal number integer">3</span> uvw
</code><small class="ln">11</small><code data-lineno="11"><span class="literal number integer">1</span> <span class="literal number integer">3</span> abc</code></pre><p>Sortierung einer Liste von Worten in absteigender Reihenfolge bzgl. (1) der Häufigkeit und (2) aufsteigend bzgl. der Länge.</p><pre class="code bash literal-block"><small class="ln"> 1</small><code data-lineno=" 1">$ <span class="name class">echo</span> <span class="literal string">"abc<span class="name entity">\n</span>"</span> <span class="literal string">"uvw<span class="name entity">\n</span>"</span> <span class="literal string">"xyz<span class="name entity">\n</span>"</span> <span class="literal string">"lmnop<span class="name entity">\n</span>"</span> <span class="literal string">"xyz<span class="name entity">\n</span>"</span> <span class="literal string">"uvw<span class="name entity">\n</span>"</span> <span class="punctuation">\</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">       <span class="literal string">"lmnop<span class="name entity">\n</span>"</span> <span class="literal string">"lmnop<span class="name entity">\n</span>"</span> <span class="literal string">"xyz<span class="name entity">\n</span>"</span> <span class="literal string">"cd<span class="name entity">\n</span>"</span> <span class="literal string">"cd<span class="name entity">\n</span>"</span> <span class="literal string">"cd"</span> <span class="punctuation">\</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">  <span class="operator">|</span> <span class="name function">awk</span> <span class="literal string">'{print length " " $1}'</span> <span class="punctuation">\</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">  <span class="operator">|</span> <span class="name function">sort</span> <span class="operator">|</span> <span class="name function">uniq</span> <span class="name variable">-c</span> <span class="punctuation">\</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">  <span class="operator">|</span> <span class="name function">sort</span>  <span class="name variable">-k1nr</span> <span class="name variable">-k2n</span>
</code><small class="ln"> 6</small><code data-lineno=" 6"><span class="literal number integer">3</span> <span class="literal number integer">3</span> <span class="name class">cd</span>
</code><small class="ln"> 7</small><code data-lineno=" 7"><span class="literal number integer">3</span> <span class="literal number integer">4</span> xyz
</code><small class="ln"> 8</small><code data-lineno=" 8"><span class="literal number integer">3</span> <span class="literal number integer">6</span> lmnop
</code><small class="ln"> 9</small><code data-lineno=" 9"><span class="literal number integer">2</span> <span class="literal number integer">4</span> uvw
</code><small class="ln">10</small><code data-lineno="10"><span class="literal number integer">1</span> <span class="literal number integer">3</span> abc</code></pre></ld-supplemental></ld-topic>
<ld-topic id="base64"><h2>base64</h2><p>Base64 kodierte Werte bestehen nur noch aus gültigen ASCII Zeichen und können als "Text" gespeichet/übermittelt werden kann.</p><aside class="admonition width-40" data-theme="note"><p class="admonition-title" data-theme="note-header">Bemerkung</p><p>Je nach Betriebssystem/Konfiguration ist der Befehl unter Umständen etwas anders benannt. Grundlegend gibt es den Befehl auf allen Unixoiden.</p></aside><div class="incremental"><p><strong>Anwendungsfall</strong>: In vielen Fällen können gehashte Passworte nicht roh (d. h. als Binärdaten) gespeichert werden, sondern müssen <a class="reference external" href="https://datatracker.ietf.org/doc/html/rfc4648#section-4">Base64</a> (oder vergleichbar) kodiert werden.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1"><span class="comment single"># Codierung</span>
</code><small class="ln">2</small><code data-lineno="2">$ <span class="name class">echo</span> <span class="literal string">"Dies_ist_ein_test"</span> <span class="operator">|</span> base64
</code><small class="ln">3</small><code data-lineno="3">RGllc19pc3RfZWluX3Rlc3QK
</code><small class="ln">4</small><code data-lineno="4">$ <span class="name class">echo</span> <span class="literal string">'Dies_ist_ein_test!'</span> <span class="operator">|</span> base64
</code><small class="ln">5</small><code data-lineno="5">RGllc19pc3RfZWluX3Rlc3QhCg<span class="operator">==</span>
</code><small class="ln">6</small><code data-lineno="6">
</code><small class="ln">7</small><code data-lineno="7"><span class="comment single"># Dekodierung</span>
</code><small class="ln">8</small><code data-lineno="8">$ <span class="name class">echo</span> REhCVyBNYW5uaGVpbQ<span class="operator">==</span> <span class="operator">|</span> base64 <span class="name variable">--decode</span>
</code><small class="ln">9</small><code data-lineno="9">DHBW Mannheim</code></pre></div></ld-topic>
<ld-topic id="grep"><h2>grep</h2><ul class="simple"><li><p>Selektiert Zeilen, die einem gegebenen Muster entsprechen.</p></li><li><p><span class="docutils literal">-o</span> gibt nur den Teil einer Zeile aus, der dem Muster entspricht.</p></li><li><p><span class="docutils literal">-v</span> selektiert Zeilen für die kein Teil der Zeile dem Muster entspricht.</p></li><li><p><span class="docutils literal">-E</span> erlaubt die Spezifikation von Mustern mit Hilfe von regulären Ausdrücken.</p></li><li><p><span class="docutils literal">-i</span> ignoriert Groß-/Kleinschreibung (in Verbindung mit -E mgl. verwirrend).</p></li><li><p><span class="docutils literal">-P</span> Perl kompatible Ausdrücke</p></li></ul><div class="incremental"><p><strong>Anwendungsfall</strong>: Alle Textfragmente in einem Leak finden<span class="peripheral">, um danach mit Regeln neue Passwortkandidaten zu bilden</span>.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">"Test123<span class="name entity">\n</span>michael@dhbw.de<span class="name entity">\n</span>345Test@dhbw.de<span class="name entity">\n</span>Ende__"</span> <span class="punctuation">\</span>
</code><small class="ln">2</small><code data-lineno="2">  <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"[a-zA-Z]{3,}"</span> <span class="operator">|</span> <span class="name function">sort</span> <span class="name variable">-u</span>
</code><small class="ln">3</small><code data-lineno="3">Ende
</code><small class="ln">4</small><code data-lineno="4">Test
</code><small class="ln">5</small><code data-lineno="5">dhbw
</code><small class="ln">6</small><code data-lineno="6">michael</code></pre></div></ld-topic>
<ld-topic id="sed-stromeditor"><h2>sed - Stromeditor</h2><ul class="simple"><li><p>modifiziert die Eingabe gemäß der spezifizierten Kommandos in der angegebenen Reihenfolge.</p></li><li><p><span class="docutils literal">-E</span> zur Verwendung moderner regulärer Ausdrücke</p></li><li><p>Standardform: <span class="docutils literal">Funktion[Agrumente]</span></p></li><li><p>Substitutionen: <span class="docutils literal">s/Regulärer Ausdruck/Ersatz/[Kennzeichen]</span>; das Kennzeichen "<span class="docutils literal">g</span>" z. B. bewirkt, dass jedes Vorkommen ersetzt wird; sonst nur das erste Vorkommen.</p></li></ul><ld-deck class="incremental"><ld-card><p><strong>Anwendungsfall</strong>: Löschen des ersten Sonderzeichens in einer Zeile.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">'ab_cd!_ef?'</span> <span class="operator">|</span> <span class="name function">sed</span> <span class="name variable">-E</span>  <span class="literal string">'s/[^a-zA-Z0-9]//'</span>
</code><small class="ln">2</small><code data-lineno="2">abcd<span class="operator">!</span>_ef?</code></pre></ld-card><ld-card class="incremental"><p><strong>Anwendungsfall</strong>: Analyse der Struktur eines Leaks durch das Abbilden <strong>aller</strong> Buchstaben auf die Repräsentanten: <span class="docutils literal">l</span>(lower) <span class="docutils literal">u</span>(upper) <span class="docutils literal">d</span>(digits) <span class="docutils literal">s</span>(special).</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">'aB_c1d!_ef?'</span> <span class="operator">|</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name function">sed</span> <span class="name variable">-E</span> -e<span class="literal string">'s/[a-z]/l/g'</span> -e<span class="literal string">'s/[A-Z]/u/g'</span> -e<span class="literal string">'s/[0-9]/d/g'</span> <span class="name variable">-e</span> <span class="literal string">'s/[^lud]/s/g'</span>
</code><small class="ln">3</small><code data-lineno="3">lusldlsslls</code></pre></ld-card></ld-deck><ld-supplemental><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p><span class="docutils literal">sed</span> auf dem Mac (BSD) und <span class="docutils literal">sed</span> unter Linux (GNU) unterscheiden sich teilweise deutlich.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="find"><h2>find</h2><ul class="simple"><li><p>durchläuft den Dateibaum ab einer angegebenen Stelle und evaluiert dabei Ausdrücke.</p></li><li><p><span class="docutils literal">-iname</span> Testet ob der Verzeichniseintrag - unabhängig von der Groß- und Kleinschreibung - dem gegebenen Muster entspricht.</p></li><li><p><span class="docutils literal">-exec ... {} ... \;</span> ermöglicht es für jede gefilterte Datei <span class="docutils literal">{}</span> einen Befehl auszuführen.</p></li></ul><div class="incremental"><p><strong>Anwendungsfall</strong>: Feststellen wie lange die Hashes sind.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name function">find</span> <span class="name class">.</span> <span class="name variable">-iname</span> <span class="literal string">"*hash*"</span> <span class="name variable">-exec</span> <span class="name function">wc</span> <span class="name variable">-c</span> <span class="punctuation">{</span><span class="punctuation">}</span> <span class="punctuation">\</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="literal number integer">33</span> ./saltedmd5/hash.md5
</code><small class="ln">3</small><code data-lineno="3"><span class="literal number integer">38</span> ./saltedmd5/saltedhash.md5
</code><small class="ln">4</small><code data-lineno="4"><span class="literal number integer">129</span> ./scenario5/hash.sha125
</code><small class="ln">5</small><code data-lineno="5"><span class="literal number integer">65</span> ./scenario6/hash.sha256
</code><small class="ln">6</small><code data-lineno="6"><span class="literal number integer">65</span> ./scenario7/hash.sha256
</code><small class="ln">7</small><code data-lineno="7"><span class="literal number integer">65</span> ./scenario9/hash.sha256</code></pre></div></ld-topic>
<ld-topic id="software-nachinstallieren"><h2>Software nachinstallieren</h2><ul class="simple"><li><p>Auf allen Linux und BSD Distributionen können Softwarepakete durch den Paketmanager des Betriebssystems nachinstalliert werden, z. B.:</p><ul class="simple"><li><p><span class="docutils literal">apt</span> (Debian, Ubuntu, Kali Linux, ...)</p></li></ul><ul class="peripheral simple"><li><p><span class="docutils literal">yum</span> (RedHat, CentOS, ...)</p></li><li><p><span class="docutils literal">pacman</span> (Arch Linux, ...)</p></li><li><p><span class="docutils literal">brew</span> oder <span class="docutils literal">macports</span> (MacOS) <a class="brackets" href="#footnote-4" id="footnote-reference-4" role="doc-noteref"><span class="fn-bracket">[</span>4<span class="fn-bracket">]</span></a></p></li></ul></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-4" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-4">4</a><span class="fn-bracket">]</span></span><p>Beide sind in diesem Fall nicht Teil des Betriebssystems, sondern müssen erst nachinstalliert werden, bevor damit weitere Software nachinstalliert werden kann.</p></aside></aside><div class="incremental"><p><strong>Anwendungsfall</strong>: Installieren von <span class="docutils literal">ent</span> (ein Programm, das die Entropie von Dateien berechnet):</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name function">sudo</span> <span class="name function">apt</span> <span class="name function">install</span> ent</code></pre></div><aside class="admonition incremental" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Die meiste Software (z. B. Laufzeitumgebungen wie NodeJs) lassen sich auch als normaler Nutzer für die eigene Nutzung installieren.</p></aside></ld-topic>
<ld-topic id="shellprogrammierung"><h2>Shellprogrammierung</h2><ul class="simple"><li><p>Jede Shell (insbesondere: <span class="docutils literal">zsh</span> (auf Mac und Kali Linux) und <span class="docutils literal">bash</span> (Debian, Ubuntu, ...)) erlaubt es prozedurale Programme zu schreiben.</p></li></ul><div class="incremental"><p><strong>Anwendungsfall</strong>: Berechnung der Entropie für jede Datei in einer Liste.</p><pre class="code zsh copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1">#!/usr/bin/zsh                   # Shebang zur Spezifikation der Shell
</code><small class="ln"> 2</small><code data-lineno=" 2">IFS=$'\n'                        # IFS = Internal Field Separator
</code><small class="ln"> 3</small><code data-lineno=" 3">                                 # (Nur Zeilenumbrüche sind Trennzeichen)
</code><small class="ln"> 4</small><code data-lineno=" 4">rm Files.list.assessed           # Lösche die Ausgabedatei
</code><small class="ln"> 5</small><code data-lineno=" 5">for i in $(cat Files.list); do   # Iteriere über die Zeilen in Files.list
</code><small class="ln"> 6</small><code data-lineno=" 6">    echo "Processing: ""$i"
</code><small class="ln"> 7</small><code data-lineno=" 7">    ent -t "$i" | \              # Berechne die Entropie
</code><small class="ln"> 8</small><code data-lineno=" 8">    grep -E "^1" | \             # Selektiere die Zeile mit der Entropie
</code><small class="ln"> 9</small><code data-lineno=" 9">    tr -d '\n' | \               # Lösche den Zeilenumbruch
</code><small class="ln">10</small><code data-lineno="10">    cat - &lt;(echo ",""$i") \      # Füge den Dateinamen hinzu
</code><small class="ln">11</small><code data-lineno="11">        &gt;&gt; Files.list.assessed ; # Schreibe das Ergebnis
</code><small class="ln">12</small><code data-lineno="12">done;</code></pre></div></ld-topic>
