<ld-topic class="repetition" id="ip"><h2>IP</h2><p>Die Vermittlungsschicht (Internet Layer)</p><ul class="simple"><li><p>übernimmt das Routing</p></li><li><p>realisiert Ende-zu-Ende-Kommunikation</p></li><li><p>überträgt Pakete</p></li><li><p>ist im Internet durch IP realisiert</p></li><li><p>löst folgende Probleme:</p><ul class="simple"><li><p>Sender und Empfänger erhalten netzweit eindeutige Bezeichner (⇒ IP-Adressen)</p></li><li><p>die Pakete werden durch spezielle Geräte (⇒ Router) weitergeleitet</p></li></ul></li></ul></ld-topic>
<ld-topic class="repetition" id="tcp-und-udp"><h2>TCP und UDP</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">Transmission Control Protocol (TCP), RFC 793</p><ul class="simple"><li><p>verbindungsorientierte Kommunikation</p></li><li><p>ebenfalls Konzept der Ports</p></li><li><p>Verbindungsaufbau zwischen zwei Prozessen (Dreifacher Handshake, Full-Duplex-Kommunikation)</p><ul class="simple"><li><p>geordnete Kommunikation</p></li><li><p>zuverlässige Kommunikation</p></li><li><p>Flusskontrolle</p></li><li><p>hoher Overhead ⇒ eher langsam</p></li><li><p>nur Unicasts</p></li></ul></li></ul></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">User Datagram Protocol (UDP), RFC 768</p><ul class="simple"><li><p>verbindungslose Kommunikation</p><ul class="simple"><li><p>unzuverlässig ⇒ keine Fehlerkontrolle</p></li><li><p>ungeordnet ⇒ beliebige Reihenfolge</p></li><li><p>wenig Overhead ⇒ schnell</p></li></ul></li><li><p>Größe der Nutzdaten ist 65507 Byte</p></li><li><p>Anwendungsfelder:</p><ul class="simple"><li><p>Anw. mit vorwiegend kurzen Nachrichten (z. B. NTP, RPC, NIS)</p></li><li><p>Anw. mit hohem Durchsatz, die gel. Fehler tolerieren (z. B. Multimedia)</p></li><li><p>Multicasts sowie Broadcasts</p></li></ul></li></ul></ld-cell></ld-grid><ld-supplemental><p>UDP nutzt für die Kommunikation "Datagramme" (Pakete). In der Praxis sin die Nutzdaten meist deutlich kleiner und orientieren sich an der Größe für IP-Pakete.</p></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-scale" id="hypertext-transfer-protocol-http"><h2>Hypertext Transfer Protocol (HTTP)</h2></ld-topic>
<ld-topic id="http"><h2>HTTP</h2><ul class="simple"><li><p><a class="reference external" href="http://www.ietf.org/rfc/rfc7230.txt">RFC 7230</a> – 7235: HTTP/1.1 (redigiert im Jahr 2014; urspr. 1999 RFC 2626)</p></li><li><p>RFC 7540: HTTP/2 (seit Mai 2015 standardisiert)</p></li><li><p>Eigenschaften:</p><ul class="simple"><li><p>Client / Server (Browser / Web-Server)</p></li><li><p>basierend auf TCP, i. d. R. Port 80</p></li><li><p>Server (meist) zustandslos</p></li><li><p>seit HTTP/1.1 auch persistente Verbindungen und Pipelining</p></li><li><p>abgesicherte Übertragung (Verschlüsselung) möglich mittels Secure Socket Layer (SSL) bzw. Transport Layer Security (TLS)</p></li></ul></li></ul></ld-topic>
<ld-topic id="konzeptioneller-ablauf"><h2>Konzeptioneller Ablauf</h2><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><object class="align-center" data="drawings/http/http.svg" type="image/svg+xml" role="img"></object></ld-cell><ld-cell style="align-self:auto;"><p class="rubric">HTTP-Kommandos</p><p>(„Verben“)</p><ul class="simple"><li><p>HEAD</p></li><li><p>GET</p></li><li><p>POST</p></li><li><p>PUT</p></li><li><p>PATCH</p></li><li><p>DELETE</p></li><li><p>OPTIONS</p></li><li><p>TRACE</p></li><li><p>CONNECT</p></li><li><p>...</p></li></ul></ld-cell></ld-grid></ld-topic>
<ld-topic id="protokolldefinition"><h2>Protokolldefinition</h2><p>Aufbau der Dokumentenbezeichner <em>Uniform Resource Locator (URL)</em></p><div class="accentuate"><p><span class="docutils literal">scheme://host[:port][abs_path[?query][#anchor]]</span></p></div><ld-deck><ld-card><dl class="field-list simple"><dt><span class="docutils literal">scheme</span><span class="colon">:</span></dt><dd><p>Protokoll (case-insensitive) (z. B. <span class="docutils literal">http</span>, <span class="docutils literal">https</span> oder <span class="docutils literal">ftp</span>)</p></dd><dt><span class="docutils literal">host</span><span class="colon">:</span></dt><dd><p>DNS-Name (oder IP-Adresse) des Servers (case-insensitive)</p></dd><dt><span class="docutils literal">port</span><span class="colon">:</span></dt><dd><p>(optional) falls leer, 80 bei <span class="docutils literal">http</span> und 443 bei <span class="docutils literal">https</span></p></dd><dt><span class="docutils literal">abs_path</span><span class="colon">:</span></dt><dd><p>(optional) Pfadausdruck relativ zum Server-Root (case-sensitive)</p></dd><dt><span class="docutils literal">?query</span><span class="colon">:</span></dt><dd><p>(optional) direkte Parameterübergabe (case-sensitive) (<span class="docutils literal">?from=…&#x26;to=…</span>)</p></dd><dt><span class="docutils literal">#anchor</span><span class="colon">:</span></dt><dd><p>(optional) Sprungmarke innerhalb des Dokuments</p></dd></dl></ld-card><ld-card class="incremental"><p>Uniform Resource Identifier (URI) sind eine Verallgemeinerung von URLs.</p><ul><li><p>definiert in RFC 1630 (im Jahr 1994)</p></li><li><p>entweder URL (Location) oder URN (Name) (z. B. <span class="docutils literal">urn:isbn:1234567890</span>)</p></li><li><p>Beispiele von URIs, die keine URL sind, sind <em>XML Namespace Iidentifiers</em></p><pre class="code XML literal-block"><code><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>svg</span> <span class="name attribute">version</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>1.1<span class="punctuation">"</span></span> <span class="name attribute">xmlns</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>http://www.w3.org/2000/svg<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>...<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>svg</span><span class="punctuation">&gt;</span></span></code></pre></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="das-get-kommando"><h2>Das GET Kommando</h2><ld-deck><ld-card><ul><li><p>Dient dem Anfordern von HTML-Daten vom Server (Request-Methode).</p></li><li><p>Minimale Anfrage:</p><dl class="field-list"><dt>Anfrage<span class="colon">:</span></dt><dd><pre class="code http literal-block"><small class="ln">1</small><code data-lineno="1">GET &lt;Path&gt; HTTP/1.1
</code><small class="ln">2</small><code data-lineno="2">Host<span class="punctuation">:</span> &lt;Hostname&gt;
</code><small class="ln">3</small><code data-lineno="3">Connection<span class="punctuation">:</span> close
</code><small class="ln">4</small><code data-lineno="4">&lt;Leerzeile (CRLF)&gt;</code></pre></dd><dt>Optionen<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Client kann zusätzlich weitere Infos über die Anfrage sowie sich selbst senden.</p></li><li><p>Server sendet Status der Anfrage sowie Infos über sich selbst und ggf. die angeforderte HTML-Datei.</p></li></ul></dd></dl></li><li><p>Fehlermeldungen werden ggf. vom Server ebenfalls als HTML-Daten verpackt und als Antwort gesendet.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Beispiel Anfrage des Clients</p><pre class="code http literal-block"><code>GET /web/web.php HTTP/1.1
Host<span class="punctuation">:</span> archive.org
**CRLF**</code></pre><p class="rubric">Beispiel Antwort des Servers</p><pre class="code http literal-block"><code>HTTP/1.1 200 OK
Server<span class="punctuation">:</span> nginx/1.25.1
Date<span class="punctuation">:</span> Thu, 22 Feb 2024 19:47:11 GMT
Content-Type<span class="punctuation">:</span> text/html; charset=UTF-8
Transfer-Encoding<span class="punctuation">:</span> chunked
Connection<span class="punctuation">:</span> close
**CRLF**
&lt;!DOCTYPE html&gt;
…
&lt;/html&gt;**CRLF**</code></pre></ld-card></ld-deck></ld-topic>
<ld-topic class="new-section transition-scale" id="sockets"><h2>Sockets</h2></ld-topic>
<ld-topic id="sockets-in-java"><h2>Sockets in Java</h2><p><strong>Sockets sind Kommunikationsendpunkte.</strong></p><ul><li><p>Sockets werden adressiert über die IP-Adresse (InetAddress-Objekt) und eine interne Port-Nummer (int-Wert).</p></li><li><p>Sockets gibt es bei TCP und auch bei UDP, allerdings mit unterschiedlichen Eigenschaften:</p><dl class="field-list simple"><dt>TCP<span class="colon">:</span></dt><dd><p>verbindungsorientierte Kommunikation über <em>Streams</em></p></dd><dt>UDP<span class="colon">:</span></dt><dd><p>verbindungslose Kommunikation mittels <em>Datagrams</em></p></dd></dl></li><li><p>Das Empfangen von Daten ist in jedem Fall blockierend, d. h. der empfangende Thread bzw. Prozess wartet, falls keine Daten vorliegen.</p></li></ul></ld-topic>
<ld-topic id="tcp-sockets"><h2>TCP Sockets</h2><object class="align-center" data="drawings/http/tcp_sockets.svg" type="image/svg+xml" role="img"></object><ld-supplemental><ol class="arabic simple"><li><p>Der Server-Prozess wartet an dem bekannten Server-Port.</p></li><li><p>Der Client-Prozess erzeugt einen privaten Socket.</p></li><li><p>Der Socket baut zum Server-Prozess eine Verbindung auf – falls der Server die Verbindung akzeptiert.</p></li><li><p>Die Kommunikation erfolgt Strom-orientiert: Für beide Parteien wird je ein Eingabestrom und ein Ausgabestrom eingerichtet, über den nun Daten ausgetauscht werden können.</p></li><li><p>Wenn alle Daten ausgetauscht wurden, schließen im Allg. beide Parteien die Verbindung.</p></li></ol></ld-supplemental></ld-topic>

<ld-topic id="austausch-von-daten"><h2>Austausch von Daten</h2><ul class="incremental-list simple"><li><p>Nach erfolgtem Verbindungsaufbau können zwischen Client und Server mittels des Socket-InputStream und Socket-OutputStream Daten ausgetauscht werden.</p></li><li><p>Hierzu leitet man die rohen Daten am besten durch geeignete Filter-Streams, um eine möglichst hohe semantische Ebene zu erreichen.</p><ul class="simple"><li><p>Beispiele: <span class="docutils literal">PrintWriter</span>, <span class="docutils literal">BufferedReader</span>, <span class="docutils literal">BufferedInputStream</span>, <span class="docutils literal">BufferedOutputStream</span></p></li><li><p>Die Netzwerkkommunikation kann dann ggf. bequem über wohlbekannte und komfortable Ein- und Ausgabe-Routinen (z. B. <span class="docutils literal">readLine</span> oder <span class="docutils literal">println</span>) durchgeführt werden.</p></li><li><p>Filter-Streams werden auch für den Zugriff auf andere Geräte und Dateien verwendet.</p></li></ul></li></ul><ld-supplemental><p>Durch die Verwendung des <em>Decorater-Patterns</em> können die Filter-Streams beliebig geschachtelt werden und vielfältig verwendet werden. Dies macht die Anwendungsprogrammierung  einfacher und erlaubt zum Beispiel das einfache Umwandeln von Zeichenketten, Datenkomprimierung, Verschlüsselung, usw.</p></ld-supplemental></ld-topic>
<ld-topic id="schachtelung-von-streams-ein-einfacher-echo-dienst"><h2>(Schachtelung von Streams) Ein einfacher Echo-Dienst</h2><ld-deck><ld-card><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">import</span> <span class="name namespace">java<span class="punctuation">.</span>net<span class="punctuation">.</span></span><span class="operator">*</span><span class="punctuation">;</span> <span class="keyword">import</span> <span class="name namespace">java<span class="punctuation">.</span>io<span class="punctuation">.</span></span><span class="operator">*</span><span class="punctuation">;</span>

</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">public</span> <span class="keyword">class</span> <span class="name class">EchoClient</span> <span class="punctuation">{</span>

<ld-topic class="exercises transition-fade" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Ein einfacher HTTP-Client"><p class="ld-exercise-title rubric"><span>Ein einfacher HTTP-Client</span></p><ol class="loweralpha list-with-explanations"><li><p>Schreiben Sie einen HTTP-Client, der den Server <span class="docutils literal">www.michael-eichberg.de</span> kontaktiert, die Datei <span class="docutils literal">/index.html</span> anfordert und die Antwort des Servers auf dem Bildschirm ausgibt.</p><p>Verwenden Sie HTTP/1.1 und eine Struktur ähnlich dem in der Vorlesung vorgestellten Echo-Client.</p><p>Senden Sie das GET-Kommando, die Host-Zeile sowie eine Leerzeile als Strings an den Server.</p></li><li><p>Modifizieren Sie Ihren Client, so dass eine URL als Kommandozeilenparameter akzeptiert wird.</p><p>Verwenden Sie die (existierende) Klasse URL, um die angegebene URL zu zerlegen.</p></li><li><p>Modifizieren Sie Ihr Programm, so dass die Antwort des Servers als lokale Datei abgespeichert wird. Laden Sie die Datei zum Anzeigen in einen Browser.</p><p>Nutzen Sie die Klasse <span class="docutils literal">FileOutputStream</span> oder <span class="docutils literal">FileWriter</span> zum Speichern der Datei.</p><p>Kann Ihr Programm auch Bilddateien (z. B. "/exercises/star.jpg") korrekt speichern?</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:sd/4t5cuM08QTt7/WREwX4xUHMUE09EFVHu30yMOVy0=:HMUwbeufBMxMeG8U:o8FO7tfX6aYYIqW/bFL19Qv0uIvmDJe/E89U+WVPWmJsCqbEh3i012z9TxdBI4/oDMrOQWw3ZqyunDVcCyl14v83/w7V0b9lOLUFX002aUBtzVAIVSjedz1ckYotXGcLq4+Rj/0W6qYSBlOGUayQbc18kqjrH7OwHaYGegw5A4wAlTsb+MGyo0InPndoUlEHjmFKe/Sl7VSbjSmLvW9TuOEd4th72EhodHx2MUOtxEIO/az/esKngGvK8cketq+LEGFxsowBtYMvALJJv+6QIovIyUdV+a5vL4BaNK60LT9DTAcz8Btiuyl0eSO6R2E/yxJJtKXMsKOs4OPjo0YcWHYW4DEMYYhxjo/LtBkNlCYuBahb198q37NHMBV6mH1abOg9HVDdRc+dBM85wTsbm7kLQoJo+Rly5BWx9eNHuWk45hHGUiUN8jwoLoVcET6a7V+nJtHhErOg40WLecptePa5FHVpJQNa3
