<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic class="repetition" id="ip"><h2>IP</h2><p>Die Vermittlungsschicht (Internet Layer)</p><ul class="simple"><li><p>übernimmt das Routing</p></li><li><p>realisiert Ende-zu-Ende-Kommunikation</p></li><li><p>überträgt Pakete</p></li><li><p>ist im Internet durch IP realisiert</p></li><li><p>löst folgende Probleme:</p><ul class="simple"><li><p>Sender und Empfänger erhalten netzweit eindeutige Bezeichner (⇒ IP-Adressen)</p></li><li><p>die Pakete werden durch spezielle Geräte (⇒ Router) weitergeleitet</p></li></ul></li></ul></ld-topic>
<ld-topic class="repetition" id="tcp-und-udp"><h2>TCP und UDP</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">Transmission Control Protocol (TCP), RFC 793</p><ul class="simple"><li><p>verbindungsorientierte Kommunikation</p></li><li><p>ebenfalls Konzept der Ports</p></li><li><p>Verbindungsaufbau zwischen zwei Prozessen (Dreifacher Handshake, Full-Duplex-Kommunikation)</p><ul class="simple"><li><p>geordnete Kommunikation</p></li><li><p>zuverlässige Kommunikation</p></li><li><p>Flusskontrolle</p></li><li><p>hoher Overhead ⇒ eher langsam</p></li><li><p>nur Unicasts</p></li></ul></li></ul></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">User Datagram Protocol (UDP), RFC 768</p><ul class="simple"><li><p>verbindungslose Kommunikation</p><ul class="simple"><li><p>unzuverlässig ⇒ keine Fehlerkontrolle</p></li><li><p>ungeordnet ⇒ beliebige Reihenfolge</p></li><li><p>wenig Overhead ⇒ schnell</p></li></ul></li><li><p>Größe der Nutzdaten ist 65507 Byte</p></li><li><p>Anwendungsfelder:</p><ul class="simple"><li><p>Anw. mit vorwiegend kurzen Nachrichten (z. B. NTP, RPC, NIS)</p></li><li><p>Anw. mit hohem Durchsatz, die gel. Fehler tolerieren (z. B. Multimedia)</p></li><li><p>Multicasts sowie Broadcasts</p></li></ul></li></ul></ld-cell></ld-grid><ld-supplemental><p>UDP nutzt für die Kommunikation "Datagramme" (Pakete). In der Praxis sin die Nutzdaten meist deutlich kleiner und orientieren sich an der Größe für IP-Pakete.</p></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-scale" id="hypertext-transfer-protocol-http"><h2>Hypertext Transfer Protocol (HTTP)</h2></ld-topic>
<ld-topic id="http"><h2>HTTP</h2><ul class="simple"><li><p><a class="reference external" href="http://www.ietf.org/rfc/rfc7230.txt">RFC 7230</a> – 7235: HTTP/1.1 (redigiert im Jahr 2014; urspr. 1999 RFC 2626)</p></li><li><p>RFC 7540: HTTP/2 (seit Mai 2015 standardisiert)</p></li><li><p>Eigenschaften:</p><ul class="simple"><li><p>Client / Server (Browser / Web-Server)</p></li><li><p>basierend auf TCP, i. d. R. Port 80</p></li><li><p>Server (meist) zustandslos</p></li><li><p>seit HTTP/1.1 auch persistente Verbindungen und Pipelining</p></li><li><p>abgesicherte Übertragung (Verschlüsselung) möglich mittels Secure Socket Layer (SSL) bzw. Transport Layer Security (TLS)</p></li></ul></li></ul></ld-topic>
<ld-topic id="konzeptioneller-ablauf"><h2>Konzeptioneller Ablauf</h2><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><object class="align-center" data="drawings/http/http.svg" type="image/svg+xml" role="img"></object></ld-cell><ld-cell style="align-self:auto;"><p class="rubric">HTTP-Kommandos</p><p>(„Verben“)</p><ul class="simple"><li><p>HEAD</p></li><li><p>GET</p></li><li><p>POST</p></li><li><p>PUT</p></li><li><p>PATCH</p></li><li><p>DELETE</p></li><li><p>OPTIONS</p></li><li><p>TRACE</p></li><li><p>CONNECT</p></li><li><p>...</p></li></ul></ld-cell></ld-grid></ld-topic>
<ld-topic id="protokolldefinition"><h2>Protokolldefinition</h2><p>Aufbau der Dokumentenbezeichner <em>Uniform Resource Locator (URL)</em></p><div class="accentuate"><p><span class="docutils literal">scheme://host[:port][abs_path[?query][#anchor]]</span></p></div><ld-deck><ld-card><dl class="field-list simple"><dt><span class="docutils literal">scheme</span><span class="colon">:</span></dt><dd><p>Protokoll (case-insensitive) (z. B. <span class="docutils literal">http</span>, <span class="docutils literal">https</span> oder <span class="docutils literal">ftp</span>)</p></dd><dt><span class="docutils literal">host</span><span class="colon">:</span></dt><dd><p>DNS-Name (oder IP-Adresse) des Servers (case-insensitive)</p></dd><dt><span class="docutils literal">port</span><span class="colon">:</span></dt><dd><p>(optional) falls leer, 80 bei <span class="docutils literal">http</span> und 443 bei <span class="docutils literal">https</span></p></dd><dt><span class="docutils literal">abs_path</span><span class="colon">:</span></dt><dd><p>(optional) Pfadausdruck relativ zum Server-Root (case-sensitive)</p></dd><dt><span class="docutils literal">?query</span><span class="colon">:</span></dt><dd><p>(optional) direkte Parameterübergabe (case-sensitive) (<span class="docutils literal">?from=…&#x26;to=…</span>)</p></dd><dt><span class="docutils literal">#anchor</span><span class="colon">:</span></dt><dd><p>(optional) Sprungmarke innerhalb des Dokuments</p></dd></dl></ld-card><ld-card class="incremental"><p>Uniform Resource Identifier (URI) sind eine Verallgemeinerung von URLs.</p><ul><li><p>definiert in RFC 1630 (im Jahr 1994)</p></li><li><p>entweder URL (Location) oder URN (Name) (z. B. <span class="docutils literal">urn:isbn:1234567890</span>)</p></li><li><p>Beispiele von URIs, die keine URL sind, sind <em>XML Namespace Identifiers</em></p><pre class="code XML literal-block"><code><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>svg</span> <span class="name attribute">version</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>1.1<span class="punctuation">"</span></span> <span class="name attribute">xmlns</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>http://www.w3.org/2000/svg<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>...<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>svg</span><span class="punctuation">&gt;</span></span></code></pre></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="das-get-kommando"><h2>Das GET Kommando</h2><ld-deck><ld-card><ul><li><p>Dient dem Anfordern von HTML-Daten vom Server (Request-Methode).</p></li><li><p>Minimale Anfrage:</p><dl class="field-list"><dt>Anfrage<span class="colon">:</span></dt><dd><pre class="code http literal-block"><small class="ln">1</small><code data-lineno="1">GET &lt;Path&gt; HTTP/1.1
</code><small class="ln">2</small><code data-lineno="2">Host<span class="punctuation">:</span> &lt;Hostname&gt;
</code><small class="ln">3</small><code data-lineno="3">Connection<span class="punctuation">:</span> close
</code><small class="ln">4</small><code data-lineno="4">&lt;Leerzeile (CRLF)&gt;</code></pre></dd><dt>Optionen<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Client kann zusätzlich weitere Infos über die Anfrage sowie sich selbst senden.</p></li><li><p>Server sendet Status der Anfrage sowie Infos über sich selbst und ggf. die angeforderte HTML-Datei.</p></li></ul></dd></dl></li><li><p>Fehlermeldungen werden ggf. vom Server ebenfalls als HTML-Daten verpackt und als Antwort gesendet.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Beispiel Anfrage des Clients</p><pre class="code http literal-block"><code>GET /web/web.php HTTP/1.1

**CRLF**</code></pre><p class="rubric">Beispiel Antwort des Servers</p><pre class="code http literal-block"><code>HTTP/1.1 200 OK
Server<span class="punctuation">:</span> nginx/1.25.1
Date<span class="punctuation">:</span> Thu, 22 Feb 2024 19:47:11 GMT
Content-Type<span class="punctuation">:</span> text/html; charset=UTF-8
Transfer-Encoding<span class="punctuation">:</span> chunked
Connection<span class="punctuation">:</span> close
**CRLF**
&lt;!DOCTYPE html&gt;
…
&lt;/html&gt;**CRLF**</code></pre></ld-card></ld-deck></ld-topic>
<ld-topic class="new-section transition-scale" id="sockets"><h2>Sockets</h2></ld-topic>
<ld-topic id="sockets-in-java"><h2>Sockets in Java</h2><p><strong>Sockets sind Kommunikationsendpunkte.</strong></p><ul><li><p>Sockets werden adressiert über die IP-Adresse (InetAddress-Objekt) und eine interne Port-Nummer (int-Wert).</p></li><li><p>Sockets gibt es bei TCP und auch bei UDP, allerdings mit unterschiedlichen Eigenschaften:</p><dl class="field-list simple"><dt>TCP<span class="colon">:</span></dt><dd><p>verbindungsorientierte Kommunikation über <em>Streams</em></p></dd><dt>UDP<span class="colon">:</span></dt><dd><p>verbindungslose Kommunikation mittels <em>Datagrams</em></p></dd></dl></li><li><p>Das Empfangen von Daten ist in jedem Fall blockierend, d. h. der empfangende Thread bzw. Prozess wartet, falls keine Daten vorliegen.</p></li></ul></ld-topic>
<ld-topic id="tcp-sockets"><h2>TCP Sockets</h2><object class="align-center" data="drawings/http/tcp_sockets.svg" type="image/svg+xml" role="img"></object><ld-supplemental><ol class="arabic simple"><li><p>Der Server-Prozess wartet an dem bekannten Server-Port.</p></li><li><p>Der Client-Prozess erzeugt einen privaten Socket.</p></li><li><p>Der Socket baut zum Server-Prozess eine Verbindung auf – falls der Server die Verbindung akzeptiert.</p></li><li><p>Die Kommunikation erfolgt Strom-orientiert: Für beide Parteien wird je ein Eingabestrom und ein Ausgabestrom eingerichtet, über den nun Daten ausgetauscht werden können.</p></li><li><p>Wenn alle Daten ausgetauscht wurden, schließen im Allg. beide Parteien die Verbindung.</p></li></ol></ld-supplemental></ld-topic>

<ld-topic id="austausch-von-daten"><h2>Austausch von Daten</h2><ul class="incremental-list simple"><li><p>Nach erfolgtem Verbindungsaufbau können zwischen Client und Server mittels des Socket-InputStream und Socket-OutputStream Daten ausgetauscht werden.</p></li><li><p>Hierzu leitet man die rohen Daten am besten durch geeignete Filter-Streams, um eine möglichst hohe semantische Ebene zu erreichen.</p><ul class="simple"><li><p>Beispiele: <span class="docutils literal">PrintWriter</span>, <span class="docutils literal">BufferedReader</span>, <span class="docutils literal">BufferedInputStream</span>, <span class="docutils literal">BufferedOutputStream</span></p></li><li><p>Die Netzwerkkommunikation kann dann ggf. bequem über wohlbekannte und komfortable Ein- und Ausgabe-Routinen (z. B. <span class="docutils literal">readLine</span> oder <span class="docutils literal">println</span>) durchgeführt werden.</p></li><li><p>Filter-Streams werden auch für den Zugriff auf andere Geräte und Dateien verwendet.</p></li></ul></li></ul><ld-supplemental><p>Durch die Verwendung des <em>Decorator-Patterns</em> können die Filter-Streams beliebig geschachtelt werden und vielfältig verwendet werden. Dies macht die Anwendungsprogrammierung  einfacher und erlaubt zum Beispiel das einfache Umwandeln von Zeichenketten, Datenkomprimierung, Verschlüsselung, usw.</p></ld-supplemental></ld-topic>

<ld-topic class="exercises transition-fade" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Ein einfacher HTTP-Client"><p class="ld-exercise-title rubric"><span>Ein einfacher HTTP-Client</span></p><ol class="loweralpha list-with-explanations"><li><p>Schreiben Sie einen HTTP-Client, der den Server <span class="docutils literal">www.michael-eichberg.de</span> kontaktiert, die Datei <span class="docutils literal">/index.html</span> anfordert und die Antwort des Servers auf dem Bildschirm ausgibt.</p><p>Verwenden Sie HTTP/1.1 und eine Struktur ähnlich dem in der Vorlesung vorgestellten Echo-Client.</p><p>Senden Sie das GET-Kommando, die Host-Zeile sowie eine Leerzeile als Strings an den Server.</p></li><li><p>Modifizieren Sie Ihren Client, so dass eine URL als Kommandozeilenparameter akzeptiert wird.</p><p>Verwenden Sie die (existierende) Klasse URL, um die angegebene URL zu zerlegen.</p></li><li><p>Modifizieren Sie Ihr Programm, so dass die Antwort des Servers als lokale Datei abgespeichert wird. Laden Sie die Datei zum Anzeigen in einen Browser.</p><p>Nutzen Sie die Klasse <span class="docutils literal">FileOutputStream</span> oder <span class="docutils literal">FileWriter</span> zum Speichern der Datei.</p><p>Kann Ihr Programm auch Bilddateien (z. B. "/exercises/star.jpg") korrekt speichern?</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:9sir0pevrVaTYAzFl5XhbwjaotvpDXawD07zXKwKNrM=:/yCtBWhqJgNEqPYa:HtmGi/b9O3J8L8mL+q8+fD91mO38gkr/k/NWL82HQuqo3vbmN+nFAGSRXS23N6yUEqo9rLq4IMPdpe37dRoC/69/tApmiAW+JWv1mo1+2orpYkdhb/dhFnIaMqLhs0I2uSLR8QAy/64PIXpsjfezPLUSKutGuUaAJIGnBXbmdqvy9b7LI4QQmdMcvlTEGqtHQSkFQGzamwEx9kkmu2bSxh/0q+uRAIB37leifKs3DvHcC+unDo4EuPObrbgma71GILq3Frzq4TqUiqi1OTfKP3l3XhAdboT/s3eBEUMGKg1Kj12uhByEh7T/CeiYcCWXsZH55g3vxZuyGg0oyJPyLMOeccXpUnxwGXn6Vu8XsgKffPbHHHgPBD8vnMZnmLQDc4hPpQNXlbAWgw6jX1Txz3vuDQUArgvViIdOn76xbBF+wOpR+btykAdnALvwGVEj4g9vI0D5AgnSM8fWClbx8UfmfzSbp0X2u
