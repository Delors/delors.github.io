<ld-topic class="new-section" id="einfuhrung"><h2>Einführung</h2></ld-topic>
<ld-topic id="zentrale-begriffe"><h2>Zentrale Begriffe</h2><ld-story><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Klartext (<span class="eng">Plaintext</span>)</span></p><p>Die Originalnachricht, die verschlüsselt werden soll.</p></aside><aside class="admonition incremental" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Geheimtext oder Chiffretext (<span class="eng">Ciphertext</span>)</span></p><p>Die kodierte/verschlüsselte Nachricht.</p><p><span class="peripheral">(Im Deutschen gelegentlich auch Kryptogramm genannt.)</span></p></aside><aside class="admonition incremental" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Verschlüsselung (<span class="eng">Encryption</span>)</span></p><p>Der Prozess der Umwandlung von Klartext in Geheimtext.</p></aside><aside class="admonition incremental" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Entschlüsselung (<span class="eng">Decryption</span>)</span></p><p>Der Prozess der Wiederherstellung des Klartextes aus dem Geheimtext.</p></aside><aside class="admonition incremental" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Kryptographie (<span class="eng">Cryptography</span>)</span></p><p>Das Studiengebiet der Verschlüsselungsschemata.</p></aside><aside class="admonition incremental" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Kryptoanalyse (<span class="eng">Cryptanalysis</span>)</span></p><p>Methoden und Techniken, die zur Gewinnung von Informationen aus einer verschlüsselten Nachricht dienen.</p><p>Analyse von kryptographischen Verfahren.</p></aside><aside class="admonition incremental" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Kryptologie (<span class="eng">Cryptology</span>)</span></p><p>Die Bereiche Kryptographie und Kryptoanalyse.</p></aside></ld-story></ld-topic>
<ld-topic id="vereinfachtes-modell-der-symmetrischen-verschlusselung"><h2>Vereinfachtes Modell der symmetrischen Verschlüsselung</h2><object class="light-image align-center" data="drawings/symmetrische_verschluesselung/simplified_model.svg" type="image/svg+xml" role="img" aria-label="Vereinfachtes Modell der symmetrischen Verschlüsselung"></object></ld-topic>
<ld-topic id="symmetrisches-verschlusselungsmodell"><h2>Symmetrisches Verschlüsselungsmodell</h2><p>Es gibt zwei Voraussetzungen für die sichere Verwendung der herkömmlichen Verschlüsselung:</p><ol class="arabic incremental-list simple"><li><p>Ein starker Verschlüsselungsalgorithmus.</p></li><li><p>Effektive Schlüsselverwaltung:</p><ol class="loweralpha incremental-list simple"><li><p>Sender und Empfänger müssen Kopien des geheimen Schlüssels auf sichere Weise erhalten haben und</p></li><li><p>den Schlüssel sicher aufbewahren.</p></li></ol></li></ol></ld-topic>
<ld-topic id="modell-eines-symmetrischen-kryptosystems"><h2>Modell eines symmetrischen Kryptosystems</h2><object class="light-image align-center" data="drawings/symmetrische_verschluesselung/model.svg" type="image/svg+xml" role="img" aria-label="Modell eines symmetrischen Kryptosystems"></object></ld-topic>
<ld-topic id="kryptografische-systeme-konnen-entlang-dreier-unabhangiger-dimensionen-charakterisiert-werden"><h2>Kryptografische Systeme können entlang dreier unabhängiger Dimensionen charakterisiert werden</h2><aside class="admonition width-30" data-theme="note"><p class="admonition-title" data-theme="note-header">Bemerkung</p><p>Eine Permutation ist eine Folge von Vertauschungen.</p></aside><ol class="arabic incremental-list"><li><p>Die Art der Operation, die zur Umwandlung von Klartext in Chiffretext verwendet wird:</p><ul class="incremental-list simple"><li><p>Substitution</p></li><li><p>Transposition (Vertauschungen)</p></li></ul></li><li><p>Die Anzahl der verwendeten Schlüssel.</p><dl class="incremental-list field-list simple"><dt>Symmetrisch<span class="colon">:</span></dt><dd><p>Ein-Schlüssel bzw. <strong>Secret-Key</strong>- (<em>konventionelle Verschlüsselung</em>)</p></dd><dt>Asymmetrisch<span class="colon">:</span></dt><dd><p>Zwei-Schlüssel bzw. <strong>Public-Key</strong>-Verschlüsselung</p></dd></dl></li><li><p>Die Art und Weise, in der der Klartext verarbeitet wird:</p><ul class="incremental-list simple"><li><p>Blockchiffre</p></li><li><p>Stromchiffre</p></li></ul></li></ol></ld-topic>
<ld-topic id="klassifizierung-von-angriffen"><h2>Klassifizierung von Angriffen</h2><ld-story><table class="accentuated-header zebra incremental-table-rows sticky-header" style="width: 100%;"><colgroup><col style="width: 20.0%"><col style="width: 80.0%"></colgroup><thead><tr><th class="stub head"><p>Art des Angriffs</p></th><th class="head"><p>dem Kryptoanalytiker bekannt</p></th></tr></thead><tbody><tr><th class="stub"><p>Ciphertext Only</p></th><td><ul class="simple"><li><p>Verschlüsselungsalgorithmus und Chiffretext</p></li></ul></td></tr><tr><th class="stub"><p>Known Plaintext</p></th><td><ul class="simple"><li><p>Verschlüsselungsalgorithmus und Chiffretext</p></li><li><p><em>ein oder mehrere Klartext-Chiffretext-Paare, die mit dem geheimen Schlüssel verschlüsselt wurden</em></p></li></ul></td></tr><tr><th class="stub"><p>Chosen Plaintext</p></th><td><ul class="simple"><li><p>Verschlüsselungsalgorithmus und Chiffretext</p></li><li><p><em>Klartextnachricht, die vom Kryptoanalytiker gewählt wurde, zusammen mit dem zugehörigen Chiffretext, der mit dem geheimen Schlüssel verschlüsselt wurde.</em></p></li></ul></td></tr><tr><th class="stub"><p>Chosen Ciphertext</p></th><td><ul class="simple"><li><p>Verschlüsselungsalgorithmus und Chiffretext</p></li><li><p><em>Chiffretext, der vom Kryptoanalytiker gewählt wurde, zusammen mit dem zugehörigen entschlüsselten Klartext, der mit dem geheimen Schlüssel entschlüsselt wurde.</em></p></li></ul></td></tr><tr><th class="stub"><p>Chosen Text</p></th><td><ul class="simple"><li><p>Verschlüsselungsalgorithmus und Chiffretext</p></li><li><p><em>vom Kryptoanalytiker gewählte Klartextnachricht, zusammen mit dem zugehörigen Chiffretext, der mit dem geheimen Schlüssel verschlüsselt wurde.</em></p></li><li><p><em>vom Kryptoanalytiker gewählter Chiffretext zusammen mit dem entsprechenden entschlüsselten Klartext, der mit dem geheimen Schlüssel erzeugt wurde.</em></p></li></ul></td></tr></tbody></table></ld-story><ld-supplemental><p>Das Ziel ist es immer den Schlüssel zu ermitteln, damit man weitere Kommunikation effektiv entschlüsseln kann.</p></ld-supplemental></ld-topic>
<ld-topic id="sicherheit-von-verschlusselungsschemata"><h2>Sicherheit von Verschlüsselungsschemata</h2><div><p class="rubric">Bedingungslos Sicher (<span class="eng">Unconditionally Secure</span>)</p><ul class="simple"><li><p>Unabhängig davon wie viel Zeit ein Gegner hat, ist es ihm unmöglich, den Geheimtext zu entschlüsseln, weil die erforderlichen Informationen nicht vorhanden sind.</p></li></ul></div><div class="incremental"><p class="rubric">Rechnerisch Sicher (<span class="eng">Computationally Secure</span>)</p><ul class="simple"><li><p>Die Kosten für das Brechen der Chiffre übersteigen den Wert der verschlüsselten Informationen.</p></li><li><p>Die zum Knacken der Chiffre benötigte Zeit übersteigt die Lebensdauer der Informationen.</p></li></ul></div><aside class="admonition incremental" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Wie lange könnte der Nutzen einer bestimmten Information andauern?</p></aside></ld-topic>
<ld-topic id="kryptoanalyse"><h2>Kryptoanalyse</h2><div><p><strong>Kryptoanalyse</strong></p><ul class="simple"><li><p>Der Angriff beruht auf den Eigenschaften des Algorithmus und einer gewissen Kenntnis der allgemeinen Merkmale des Klartextes.</p></li><li><p>Der Angriff nutzt die Eigenschaften des Algorithmus aus, um zu versuchen, einen bestimmten Klartext zu entschlüsseln oder den verwendeten Schlüssel zu ermitteln.</p></li></ul></div></ld-topic>
<ld-topic id="brute-force-angriff"><h2>Brute-Force Angriff</h2><ul class="incremental-list"><li><p>Es werden alle möglichen Schlüssel ausprobiert, bis eine verständliche Übersetzung des Chiffriertextes in Klartext erreicht wird.</p></li><li><p>Im Durchschnitt muss die Hälfte aller möglichen Schlüssel ausprobiert werden, um Erfolg zu haben.</p></li><li><p>Zur Durchführung des Brute-Force-Ansatzes ist ein gewisses Maß an Wissen über den zu erwartenden Klartext erforderlich. Es werden Mittel zur automatischen Unterscheidung von Klartext und „Müll“ benötigt.</p><aside class="admonition" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Was bedeuted somit <em>bis eine verständliche Übersetzung des Chiffriertextes in Klartext erreicht wird</em>?</p><p><span class="incremental">Wie können Sie feststellen ob Sie erfolgreich entschlüsselt haben, wenn der Klartext zum Beispiel ein Bild, ein Video oder ein Computerprogramm ist?</span></p><p><span class="incremental">Wie können Sie feststellen, ob Sie erfolgreich entschlüsselt haben, wenn die Datei zweifach (d. h. mit zwei verschiedenen Schlüsseln) verschlüsselt wurde?</span></p></aside></li></ul></ld-topic>
<ld-topic class="new-section transition-fade" id="substitutions-chiffren"><h2>Substitutions-Chiffren</h2></ld-topic>
<ld-topic id="substitutionsverfahren-allgemeine-vorgehensweise"><h2>Substitutionsverfahren - Allgemeine Vorgehensweise</h2><ul class="simple"><li><p>Bei der Substitution werden die Buchstaben des Klartextes durch andere Buchstaben oder durch Zahlen oder Symbole ersetzt.</p></li><li><p>Wenn der Klartext als eine Folge von Bits betrachtet wird, beinhaltet die Substitution das Ersetzen von Bitmustern des Klartextes durch Bitmuster des Geheimtextes.</p></li></ul></ld-topic>
<ld-topic id="casar-chiffre"><h2>Cäsar-Chiffre</h2><ul class="simple"><li><p>Einfachste und früheste bekannte Verwendung einer Substitutions-Chiffre; verwendet von Julius Cäsar.</p></li></ul><div class="incremental"><ul><li><p>Dabei wird jeder Buchstabe des Alphabets durch einen Buchstaben ersetzt, der drei Stellen weiter hinten im Alphabet steht.</p></li><li><p>Am Ende des Alphabets wird wieder am Anfang begonnen. Somit folgt auf den Buchstabe Z der Buchstabe A.</p><dl class="field-list simple"><dt>unverschlüsselt<span class="colon">:</span></dt><dd><p><span class="docutils literal">meet me after the toga party</span></p></dd></dl><dl class="incremental field-list simple"><dt>verschlüsselt<span class="colon">:</span></dt><dd><p><span class="docutils literal">PHHW PH DIWHU WKH WRJD SDUWB</span></p></dd></dl></li></ul></div></ld-topic>
<ld-topic id="casar-chiffre-historische-verwendung"><h2>Cäsar-Chiffre: historische Verwendung</h2><p>Die Transformation kann mit folgender Tabelle ausgedrückt werden:</p><table class="compact table-data-monospaced text-align-center highlight-cell-on-hover" style="width: 100%;"><thead><tr><th class="head"><p>a</p></th><th class="head"><p>b</p></th><th class="head"><p>c</p></th><th class="head"><p>d</p></th><th class="head"><p>e</p></th><th class="head"><p>f</p></th><th class="head"><p>g</p></th><th class="head"><p>h</p></th><th class="head"><p>i</p></th><th class="head"><p>j</p></th><th class="head"><p>k</p></th><th class="head"><p>l</p></th><th class="head"><p>m</p></th><th class="head"><p>n</p></th><th class="head"><p>o</p></th><th class="head"><p>p</p></th><th class="head"><p>q</p></th><th class="head"><p>r</p></th><th class="head"><p>s</p></th><th class="head"><p>t</p></th><th class="head"><p>u</p></th><th class="head"><p>v</p></th><th class="head"><p>w</p></th><th class="head"><p>x</p></th><th class="head"><p>y</p></th><th class="head"><p>z</p></th></tr></thead><tbody><tr><td><p>D</p></td><td><p>E</p></td><td><p>F</p></td><td><p>G</p></td><td><p>H</p></td><td><p>I</p></td><td><p>J</p></td><td><p>K</p></td><td><p>L</p></td><td><p>M</p></td><td><p>N</p></td><td><p>O</p></td><td><p>P</p></td><td><p>Q</p></td><td><p>R</p></td><td><p>S</p></td><td><p>T</p></td><td><p>U</p></td><td><p>V</p></td><td><p>W</p></td><td><p>X</p></td><td><p>Y</p></td><td><p>Z</p></td><td><p>A</p></td><td><p>B</p></td><td><p>C</p></td></tr></tbody></table><div class="incremental"><p>Mathematisch, wenn wir jedem Buchstaben einen Wert zuweisen:</p><table class="compact table-data-monospaced text-align-center highlight-cell-on-hover" style="width: 100%;"><colgroup><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"><col style="width: 3.8%"></colgroup><thead><tr><th class="head"><p>a</p></th><th class="head"><p>b</p></th><th class="head"><p>c</p></th><th class="head"><p>d</p></th><th class="head"><p>e</p></th><th class="head"><p>f</p></th><th class="head"><p>g</p></th><th class="head"><p>h</p></th><th class="head"><p>i</p></th><th class="head"><p>j</p></th><th class="head"><p>k</p></th><th class="head"><p>l</p></th><th class="head"><p>m</p></th><th class="head"><p>n</p></th><th class="head"><p>o</p></th><th class="head"><p>p</p></th><th class="head"><p>q</p></th><th class="head"><p>r</p></th><th class="head"><p>s</p></th><th class="head"><p>t</p></th><th class="head"><p>u</p></th><th class="head"><p>v</p></th><th class="head"><p>w</p></th><th class="head"><p>x</p></th><th class="head"><p>y</p></th><th class="head"><p>z</p></th></tr></thead><tbody><tr><td><p>0</p></td><td><p>1</p></td><td><p>2</p></td><td><p>3</p></td><td><p>4</p></td><td><p>5</p></td><td><p>6</p></td><td><p>7</p></td><td><p>8</p></td><td><p>9</p></td><td><p>10</p></td><td><p>11</p></td><td><p>12</p></td><td><p>13</p></td><td><p>14</p></td><td><p>15</p></td><td><p>16</p></td><td><p>17</p></td><td><p>18</p></td><td><p>19</p></td><td><p>20</p></td><td><p>21</p></td><td><p>22</p></td><td><p>23</p></td><td><p>24</p></td><td><p>25</p></td></tr></tbody></table><p>Der Algorithmus zur Verschlüsselung ist dann (p sei der Wert des zu verschlüsselnden Buchstabens):</p><p>Y = E(3,p) = (p + 3) mod 26</p></div></ld-topic>
<ld-topic id="verallgemeinerter-casar-chiffre-algorithmus"><h2>Verallgemeinerter Cäsar-Chiffre-Algorithmus</h2><p>Eine Verschiebung (k) kann beliebig groß sein, so dass der allgemeine Cäsar-Algorithmus lautet:</p><p>Y = E(k,p) = (p + k) mod 26</p><p>Wobei k einen Wert im Bereich von 1 bis 25 annimmt; der Entschlüsselungsalgorithmus ist einfach:</p><p>p = D(k,Y) = (Y - k) mod 26</p></ld-topic>

<ld-topic id="monoalphabetische-chiffren"><h2>Monoalphabetische Chiffren</h2><ul><li><p>Eine Permutation einer endlichen Menge von Elementen S ist eine geordnete Folge aller Elemente von S, wobei jedes Element genau einmal vorkommt.</p><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><table class="table-data-monospaced table-header-align-center table-data-align-center s-font-size-90 ultra-compact borderless" style="width: 100%;"><colgroup><col style="width: 18.8%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"><col style="width: 3.1%"></colgroup><thead><tr><th class="stub head"><p>Zeichen</p></th><th class="head"><p>a</p></th><th class="head"><p>b</p></th><th class="head"><p>c</p></th><th class="head"><p>d</p></th><th class="head"><p>e</p></th><th class="head"><p>f</p></th><th class="head"><p>g</p></th><th class="head"><p>h</p></th><th class="head"><p>i</p></th><th class="head"><p>j</p></th><th class="head"><p>k</p></th><th class="head"><p>l</p></th><th class="head"><p>m</p></th><th class="head"><p>n</p></th><th class="head"><p>o</p></th><th class="head"><p>p</p></th><th class="head"><p>q</p></th><th class="head"><p>r</p></th><th class="head"><p>s</p></th><th class="head"><p>t</p></th><th class="head"><p>u</p></th><th class="head"><p>v</p></th><th class="head"><p>w</p></th><th class="head"><p>x</p></th><th class="head"><p>y</p></th><th class="head"><p>z</p></th></tr></thead><tbody><tr><th class="stub"><p>Ersetzung</p></th><td><p>d</p></td><td><p>f</p></td><td><p>v</p></td><td><p>e</p></td><td><p>n</p></td><td><p>k</p></td><td><p>i</p></td><td><p>b</p></td><td><p>s</p></td><td><p>p</p></td><td><p>t</p></td><td><p>q</p></td><td><p>l</p></td><td><p>w</p></td><td><p>u</p></td><td><p>c</p></td><td><p>x</p></td><td><p>r</p></td><td><p>j</p></td><td><p>g</p></td><td><p>z</p></td><td><p>m</p></td><td><p>a</p></td><td><p>h</p></td><td><p>y</p></td><td><p>o</p></td></tr></tbody></table></aside><ld-supplemental><p class="rubric">Erzeugung einer beliebigen Permutation der 26 Buchstaben mit Python</p><pre class="code python copy-to-clipboard literal-block"><code><span class="keyword">from</span> random <span class="keyword">import</span> shuffle
alphabet<span class="operator">=</span><span class="punctuation">[</span><span class="literal string">"a"</span><span class="punctuation">,</span><span class="literal string">"b"</span><span class="punctuation">,</span><span class="literal string">"c"</span><span class="punctuation">,</span><span class="literal string">"d"</span><span class="punctuation">,</span><span class="literal string">"e"</span><span class="punctuation">,</span><span class="literal string">"f"</span><span class="punctuation">,</span><span class="literal string">"g"</span><span class="punctuation">,</span><span class="literal string">"h"</span><span class="punctuation">,</span><span class="literal string">"i"</span><span class="punctuation">,</span><span class="literal string">"j"</span><span class="punctuation">,</span><span class="literal string">"k"</span><span class="punctuation">,</span><span class="literal string">"l"</span><span class="punctuation">,</span><span class="literal string">"m"</span><span class="punctuation">,</span><span class="literal string">"n"</span><span class="punctuation">,</span><span class="literal string">"o"</span><span class="punctuation">,</span><span class="literal string">"p"</span><span class="punctuation">,</span><span class="literal string">"q"</span><span class="punctuation">,</span><span class="literal string">"r"</span><span class="punctuation">,</span><span class="literal string">"s"</span><span class="punctuation">,</span><span class="literal string">"t"</span><span class="punctuation">,</span><span class="literal string">"u"</span><span class="punctuation">,</span><span class="literal string">"v"</span><span class="punctuation">,</span><span class="literal string">"w"</span><span class="punctuation">,</span><span class="literal string">"x"</span><span class="punctuation">,</span><span class="literal string">"y"</span><span class="punctuation">,</span><span class="literal string">"z"</span><span class="punctuation">]</span>
shuffle<span class="punctuation">(</span>alphabet<span class="punctuation">)</span>
<span class="keyword">print</span><span class="punctuation">(</span>alphabet<span class="punctuation">)</span></code></pre></ld-supplemental></li></ul><ul class="incremental simple"><li><p>Wenn die „Chiffre“-Zeile (siehe Cäsar-Chiffre) eine beliebige Permutation der 26 alphabetischen Zeichen sein kann, dann gibt es 26! (<em>26 Fakultät</em>) oder mehr als 4 · 10²⁶ mögliche Schlüssel.</p><ul class="simple"><li><p>Dies ist um 10 Größenordnungen größer als der Schlüsselraum des Verschlüsselungsalgorithmus DES!</p></li><li><p>Der Ansatz wird als monoalphabetische Substitutions-Chiffre bezeichnet, da pro Nachricht ein einziges Chiffre-Alphabet verwendet wird.</p></li></ul></li></ul></ld-topic>

<ld-topic id="angriffe-auf-monoalphabetische-chiffren"><h2>Angriffe auf Monoalphabetische Chiffren</h2><p>Sie sind leicht zu knacken, da sie die Häufigkeitsdaten des ursprünglichen Alphabets wiederspiegeln.</p><div class="compound incremental"><p>Die Gegenmaßnahme besteht darin, mehrere Substitute (Homophone) für einen einzigen Buchstaben anzubieten.</p></div></ld-topic>
<ld-topic id="playfair-cipher"><h2>Playfair Cipher</h2><p>Erfunden vom britischen Wissenschaftler Sir Charles Wheatstone im Jahr 1854.</p><aside class="admonition width-30" data-theme="note"><p class="admonition-title" data-theme="note-header">Bemerkung</p><p><em>Digram</em></p><ul class="simple"><li><p>Zwei-Buchstaben-Kombination</p></li><li><p>am häufigsten im Englischen: "<em>th</em>"</p></li></ul><p><em>Trigram</em></p><ul class="simple"><li><p>Drei-Buchstaben-Kombination</p></li><li><p>am häufigsten im Englischen: "<em>the</em>"</p></li></ul></aside><ul class="incremental-list simple"><li><p>Bekannteste Chiffrierung mit mehreren Buchstaben.</p></li><li><p>Behandelt Digramme im Klartext als einzelne Einheiten und übersetzt diese Einheiten in Digramme des Geheimtextes.</p></li><li><p>Basiert auf der Verwendung einer 5 x 5 Buchstabenmatrix, die mit Hilfe eines Schlüsselworts konstruiert wird.</p></li><li><p>Wurde von der britischen Armee im Ersten Weltkrieg und von der US-Armee und anderen alliierten Streitkräften im zweiten Weltkrieg als Standardfeldsystem verwendet.</p></li></ul></ld-topic>
<ld-topic id="playfair-key-matrix"><h2>Playfair Key Matrix</h2><p>Füllen Sie die Buchstaben des Schlüsselworts (abzüglich der Duplikate) von links nach rechts und von oben nach unten aus, dann füllen Sie den Rest der Matrix mit den restlichen Buchstaben in alphabetischer Reihenfolge aus. Die Buchstaben I und J zählen als ein Buchstabe.</p><p>Sei das Schlüsselwort MONARCHY:</p><table class="highlight-cell-on-hover align-center"><tbody><tr><td><p><em>M</em></p></td><td><p><em>O</em></p></td><td><p><em>N</em></p></td><td><p><em>A</em></p></td><td><p><em>R</em></p></td></tr><tr><td><p><em>C</em></p></td><td><p><em>H</em></p></td><td><p><em>Y</em></p></td><td><p>B</p></td><td><p>D</p></td></tr><tr><td><p>E</p></td><td><p>F</p></td><td><p>G</p></td><td><p>I/J</p></td><td><p>K</p></td></tr><tr><td><p>L</p></td><td><p>P</p></td><td><p>Q</p></td><td><p>S</p></td><td><p>T</p></td></tr><tr><td><p>U</p></td><td><p>V</p></td><td><p>W</p></td><td><p>X</p></td><td><p>Z</p></td></tr></tbody></table></ld-topic>
<ld-topic id="playfair-verschlusselung"><h2>Playfair Verschlüsselung</h2><p>Die Verschlüsselung wird für jedes Buchstabenpaar des Klartextes durchgeführt.</p><div class="compound width-25 float-right"><table class="highlight-cell-on-hover align-center"><tbody><tr><td><p>M</p></td><td><p>O</p></td><td><p>N</p></td><td><p>A</p></td><td><p>R</p></td></tr><tr><td><p>C</p></td><td><p>H</p></td><td><p>Y</p></td><td><p>B</p></td><td><p>D</p></td></tr><tr><td><p>E</p></td><td><p>F</p></td><td><p>G</p></td><td><p>I/J</p></td><td><p>K</p></td></tr><tr><td><p>L</p></td><td><p>P</p></td><td><p>Q</p></td><td><p>S</p></td><td><p>T</p></td></tr><tr><td><p>U</p></td><td><p>V</p></td><td><p>W</p></td><td><p>X</p></td><td><p>Z</p></td></tr></tbody></table></div><ol class="arabic incremental-list simple"><li><p>Wenn beide Buchstaben gleich sind (oder nur ein Buchstabe übrig ist), fügen Sie ein <span class="docutils literal">X</span> hinter dem ersten Buchstaben ein. Verschlüsseln Sie das neue Paar und fahren Sie fort (z. B. würde <span class="docutils literal">ballon</span> als <span class="docutils literal">ba lX lo nX</span> verschlüsselt werden).</p></li><li><p>Wenn die Buchstaben in der gleichen Zeile stehen, ersetzen Sie sie durch die Buchstaben unmittelbar rechts davon (ggf. umbrechen) (z. B. wird <span class="docutils literal">ar</span> als <span class="docutils literal">RM</span> verschlüsselt).</p></li><li><p>Tauchen die Buchstaben in derselben Spalte auf, so sind sie durch die unmittelbar darunter liegenden Buchstaben zu ersetzen (ggf. umbrechen) (z. B. wird <span class="docutils literal">mu</span> als <span class="docutils literal">CM</span> verschlüsselt).</p></li><li><p>Befinden sich die Buchstaben nicht in derselben Zeile oder Spalte, so werden sie durch die Buchstaben in derselben Zeile bzw. in dem anderen Paar von Ecken des durch das ursprüngliche Paar definierten Rechtecks ersetzt (z. B. <span class="docutils literal">hs</span> → <span class="docutils literal">BP</span>; <span class="docutils literal">ea</span> → <span class="docutils literal">IM</span>).</p></li></ol></ld-topic>
<ld-topic id="hill-chiffre"><h2>Hill Chiffre</h2><p>Entwickelt von dem Mathematiker Lester Hill im Jahr 1929.</p><ul class="simple"><li><p>Die Stärke ist, dass die Häufigkeit von einzelnen Buchstaben vollständig ausgeblendet wird.</p><ul class="simple"><li><p>Durch die Verwendung einer größeren Matrix werden mehr Frequenzinformationen verborgen.</p></li><li><p>Eine 3 x 3 Hill-Chiffre verbirgt nicht nur die Häufigkeiten einzelner Buchstaben sondern auch von Digrammen.</p></li></ul></li><li><p>Stark gegen einen einen Angriff auf den Geheimtext, aber leicht zu brechen sobald ein Klartext vorliegt (<em>known plaintext attack</em>).</p></li></ul></ld-topic>
<ld-topic id="polyalphabetische-chiffren"><h2>Polyalphabetische Chiffren</h2><aside class="admonition width-40" data-theme="note"><p class="admonition-title" data-theme="note-header">Bemerkung</p><p><strong>Alle diese Techniken haben die folgenden Merkmale gemeinsam:</strong></p><ul class="simple"><li><p>Es wird ein Satz verwandter monoalphabetischer Substitutionsregeln verwendet.</p></li><li><p>Ein Schlüssel bestimmt, welche bestimmte Regel für eine bestimmte Umwandlung gewählt wird.</p></li></ul></aside><p>Polyalphabetische Substitutions-Chiffren verbessern einfache monoalphabetische Chiffren, indem sie verschiedene monoalphabetische Substitutionen verwenden, während man die Klartextnachricht verschlüsselt.</p></ld-topic>
<ld-topic id="vigenere-chiffre"><h2>Vigenère Chiffre</h2><ul class="simple"><li><p>Die bekannteste und eine der einfachsten polyalphabetischen Substitutions-Chiffren.</p></li><li><p>In diesem Schema besteht die Menge der verwandten monoalphabetischen Substitutionsregeln aus den 26 Cäsar-Chiffren mit Verschiebungen von 0 bis 25.</p></li><li><p>Jede Chiffre wird durch einen Schlüsselbuchstaben identifiziert, der den Klartextbuchstaben durch den Chiffretextbuchstaben ersetzt.</p></li></ul></ld-topic>

<ld-topic id="beispiel-einer-vigenere-verschusselung"><h2>Beispiel einer Vigenère-Verschüsselung</h2><ul class="simple"><li><p>Um eine Nachricht zu verschlüsseln, wird ein Schlüssel benötigt, der so lang ist wie die Nachricht.</p></li><li><p>In der Regel ist der Schlüssel ein sich wiederholendes Schlüsselwort.</p></li></ul><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Wenn das Schlüsselwort <span class="docutils literal">deceptive</span> ist, wird die Nachricht: <span class="docutils literal">We are discovered save yourself</span>, wie folgt verschlüsselt:</p><dl class="field-list simple"><dt>Schlüssel<span class="colon">:</span></dt><dd><p><span class="docutils literal">DECEPTIVEDECEPTIVEDECEPTIVE</span></p></dd><dt>Klartext<span class="colon">:</span></dt><dd><p><span class="docutils literal">wearediscoveredsaveyourself</span></p></dd><dt>Geheimtext<span class="colon">:</span></dt><dd><p><span class="docutils literal">ZICVTWQNGRZGVTWAVZHCQYGLMGJ</span></p></dd></dl></aside></ld-topic>
<ld-topic id="vigenere-autokey-system"><h2>Vigenère <em>Autokey System</em></h2><p>Ein Schlüsselwort wird mit dem Klartext selbst verkettet, um einen laufenden Schlüssel zu erhalten.</p><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><dl class="field-list simple"><dt>Schlüssel<span class="colon">:</span></dt><dd><p><span class="docutils literal">DECEPTIVEwearediscoveredsav</span></p></dd><dt>Klartext<span class="colon">:</span></dt><dd><p><span class="docutils literal">wearediscoveredsaveyourself</span></p></dd><dt>Geheimtext<span class="colon">:</span></dt><dd><p><span class="docutils literal">ZICVTWQNGKZEIIGASXSTSLVVWLA</span></p></dd></dl></aside><div class="incremental"><p>Auch dieses Verfahren ist anfällig für eine Kryptoanalyse, da der Schlüssel und der Klartext die gleiche Häufigkeitsverteilung der Buchstaben aufweisen und eine statistische Technik angewendet werden kann.</p></div></ld-topic>
<ld-topic id="vernam-chiffre"><h2>Vernam Chiffre</h2><object class="light-image align-center" data="drawings/vernam_cipher.svg" type="image/svg+xml" role="img" aria-label="Vernam Cipher"></object></ld-topic>
<ld-topic id="one-time-pad"><h2>One-Time Pad</h2><ul class="incremental-list simple"><li><p>Verbesserung der Vernam-Chiffre, vorgeschlagen von dem Offizier Joseph Mauborgne des Army Signal Corp.</p></li><li><p>Verwendung eines Zufallsschlüssels, der so lang wie die Nachricht ist, so dass der Schlüssel nicht wiederholt werden muss.</p></li><li><p>Der Schlüssel wird zum Ver- und Entschlüsseln einer einzigen Nachricht verwendet und dann verworfen.</p></li><li><p>Jede neue Nachricht erfordert einen neuen Schlüssel mit der gleichen Länge wie die neue Nachricht.</p></li><li><p>Das Schema ist nachweislich nicht zu knacken.</p><ul class="incremental-list simple"><li><p>Erzeugt eine zufällige Ausgabe, die in keinem statistischen Zusammenhang mit dem Klartext steht.</p></li><li><p>Da der Chiffriertext keinerlei Informationen über den Klartext enthält, gibt es keine Möglichkeit, den Code zu knacken.</p></li></ul></li></ul></ld-topic>
<ld-topic id="schwierigkeiten-von-one-time-pads"><h2>Schwierigkeiten von One-Time-Pads</h2><ul class="incremental-list"><li><p>Das One-Time-Pad bietet vollständige Sicherheit, hat aber in der Praxis zwei grundlegende Schwierigkeiten:</p><ol class="arabic incremental-list list-with-explanations"><li><p>Es gibt das praktische Problem der Herstellung großer Mengen von Zufallsschlüsseln.</p><p>Jedes stark genutzte System würde regelmäßig Millionen von zufälligen Zeichen benötigen.</p></li><li><p>Ein „gigantisches“ Schlüsselverteilungsproblem</p><p>Für jede zu übermittelnde Nachricht benötigen Sender und Empfänger einen gleich langen Schlüssel.</p></li></ol></li><li><p>Aufgrund dieser Schwierigkeiten ist das One-Time-Pad nur von begrenztem Nutzen; es eignet sich vor allem für Kanäle mit geringer Bandbreite, die eine sehr hohe Sicherheit erfordern.</p></li><li><p>Das One-Time-Pad ist das einzige Kryptosystem, das eine perfekte Geheimhaltung bietet.</p></li></ul></ld-topic>
<ld-topic class="new-section transition-fade" id="transpositions-chiffren"><h2>Transpositions-Chiffren</h2></ld-topic>
<ld-topic id="rail-fence-chiffre"><h2>Rail Fence Chiffre</h2><ul class="simple"><li><p>Einfachste Transpositions-Chiffre (d. h. Chiffre basierend auf <span class="docutils literal">Vertauschung</span>).</p></li><li><p>Der Klartext wird als eine Folge von Diagonalen aufgeschrieben und dann als eine Folge von Zeilen abgelesen.</p></li></ul><aside class="admonition incremental-1" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Um die Nachricht: „Meet me after the Toga-Party“ mit einer Rail Fence Chiffre der Tiefe 2 (Schlüssel) zu verschlüsseln, würden wir schreiben:</p><div class="pre monospaced"><p><span class="incremental-2">m</span> <span class="incremental-4">e</span> <span class="incremental-6">m</span> <span class="incremental-8">a</span> <span class="incremental-10">t</span> <span class="incremental-12">r</span> <span class="incremental-14">h</span> <span class="incremental-16">t</span> <span class="incremental-18">g</span> <span class="incremental-20">p</span> <span class="incremental-22">r</span> <span class="incremental-24">y</span></p><p> <span class="incremental-3">e</span> <span class="incremental-5">t</span> <span class="incremental-7">e</span> <span class="incremental-9">f</span> <span class="incremental-11">e</span> <span class="incremental-13">t</span> <span class="incremental-15">e</span> <span class="incremental-17">o</span> <span class="incremental-19">a</span> <span class="incremental-21">a</span> <span class="incremental-23">t</span></p></div><p>Die verschlüsselte Nachricht ist: MEMATRHTGPRYETEFETEOAAT</p></aside><ld-supplemental embed-in-document-flow=""><p>Um die Nachricht zu entschlüsseln, konstruieren Sie eine <em>Railfence</em> mit der entsprechenden Tiefe und Länge des Chiffretexts. Danach können Sie die Nachricht direkt ablesen.</p><p>Geben Sie die folgende Nachricht: <span class="docutils literal">voeodrgy</span> und der Schlüssel sei 4.</p><table class="table-data-monospaced"><tbody><tr><th class="stub"><p>Nachricht</p></th><td><p>v</p></td><td><p>o</p></td><td><p>e</p></td><td><p>o</p></td><td><p>d</p></td><td><p>r</p></td><td><p>g</p></td><td><p>y</p></td></tr><tr><th class="stub"><p>Index</p></th><td><p>1</p></td><td><p>2</p></td><td><p>3</p></td><td><p>4</p></td><td><p>5</p></td><td><p>6</p></td><td><p>7</p></td><td><p>8</p></td></tr></tbody></table><ol class="arabic simple"><li><p>Railfence der Tiefe 4 für eine Nachricht der Länge 8.</p></li></ol><pre class="literal-block"><code>-     -
 -   - -
  - -
   -</code></pre><ol class="arabic simple" start="2"><li><p>Daraus ergibt sich unmittelbar welcher Buchstabe an welcher Stelle im Chriffretext gelandet ist (wir numerieren einfach die Platzhalter zeilenweise durch):</p></li></ol><pre class="literal-block"><code>-     -     ⇒   1     2
 -   - -         3   4 5
  - -             6 7
   -               8</code></pre><ol class="arabic simple" start="3"><li><p>Ersetzen des Index mit dem Buchstaben aus der verschlüsselten Nachricht:</p></li></ol><pre class="literal-block"><code>-     -       1 ⇒ v            2 ⇒ o
 -   - -         3 ⇒ e      4 ⇒ o   5 ⇒ d
  - -               6 ⇒ r  7 ⇒ g
   -                    8 ⇒ y</code></pre><p>Plaintext = very good</p></ld-supplemental></ld-topic>
<ld-topic id="skytale"><h2>Skytale</h2><ul class="simple"><li><p>Ältestes bekannte (militärische) Verschlüsselungsverfahren.</p></li><li><p>Vor mehr als 2500 Jahren (vermutlich) von den Spartanern entwickelt.</p></li><li><p>Die Verschlüsselung erfolgte mit einen (Holz-)Stab mit einem bestimmten Durchmesser („Schlüssel“) (Skytale).</p></li></ul><object class="align-right" data="drawings/skytale.svg" type="image/svg+xml" role="img" aria-label="Skytale"></object></ld-topic>
<ld-topic id="zeilenverschiebungs-chiffre"><h2>Zeilenverschiebungs-Chiffre</h2><ld-story><ul class="simple"><li><p>Ist eine komplexere Transposition.</p></li><li><p>Vorgehen: Schreiben Sie die Nachricht zeilenweise in ein Rechteck mit wohldefinierter Breite und lesen Sie die Nachricht spaltenweise ab, aber vertauschen Sie die Reihenfolge der Spalten.</p></li><li><p>Die Reihenfolge der Spalten ist dann der Schlüssel.</p></li></ul><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel: Verschlüsselung von: <span class="docutils literal">attack postponed until two am</span></span></p><dl class="field-list"><dt>Schlüssel<span class="colon">:</span></dt><dd><p><span class="docutils literal">4312567</span></p></dd><dt>Klartext<span class="colon">:</span></dt><dd><div class="monospaced"><p>attackp</p><p>ostpone</p><p>duntilt</p><p>woamxyz</p></div></dd><dt>Geheimtext<span class="colon">:</span></dt><dd><p><span class="docutils literal">TTNA APTM TSUO AODW COIX KNLY PETZ</span></p></dd><dt>Spalte<span class="colon">:</span></dt><dd><p><span class="docutils literal">3--- 4--- 2--- 1--- 5--- 6--- 7---</span></p></dd></dl></aside></ld-story><ld-supplemental><ul><li><p>Zeilenverschiebungs-Chiffre ≘ <span class="eng">Row Transposition Cipher</span></p></li><li><p>Wenn der Schlüssel <span class="docutils literal">4312567</span> ist, dann wird:</p><ul class="simple"><li><p>die erste Spalte wird als die <em>vierte</em> (<span class="docutils literal">4</span>),</p></li><li><p>die zweite Spalte als die <em>dritte</em> (<span class="docutils literal">3</span>),</p></li><li><p>die dritte Spalte als die <em>erste</em> (<span class="docutils literal">1</span>),</p></li><li><p>...</p></li></ul><p>geschrieben</p></li><li><p>Beim Entschlüsseln ergibt sich die Anzahl der Reihen trivial aus der Länge der Nachricht (28 Zeichen) und der Länge des Schlüssels (7 Zeichen); 28/7 = 4.</p></li><li><p><span class="docutils literal">xyz</span> am Ende der Nachricht sind nur Platzhalter (<em>Padding</em>), um die letzte Zeile zu füllen, damit die Nachricht in ein Rechteck passt. Sie werden bei der Entschlüsselung einfach ignoriert.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-fade" id="steganografie"><h2>Steganografie</h2></ld-topic>
<ld-topic id="text-basierte-steganografie"><h2>Text-basierte Steganografie</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Entschlüsseln"><p class="ld-exercise-title rubric"><span>Entschlüsseln</span></p><pre class="code Text copy-to-clipboard literal-block"><code>Dear Friend ; We know you are interested in receiving cutting-edge

<ld-topic id="auswahl-anderer-steganographie-techniken"><h2>Auswahl anderer Steganographie-Techniken</h2><dl class="incremental-list field-list simple"><dt>Zeichenmarkierung<span class="colon">:</span></dt><dd><p>Ausgewählte Buchstaben eines gedruckten oder maschinengeschriebenen Textes werden mit Bleistift überstrichen. Die Markierungen sind nur sichtbar, wenn das Papier schräg in helles Licht gehalten wird.</p></dd><dt>Unsichtbare Tinte<span class="colon">:</span></dt><dd><p>Es gibt eine Reihe von Substanzen, die zum Schreiben verwendet werden können, aber keine sichtbaren Spuren hinterlassen, solange das Papier nicht erhitzt oder mit einer chemischen Substanz behandelt wird.</p></dd><dt>Nadelstiche<span class="colon">:</span></dt><dd><p>Kleine Nadelstiche auf ausgewählten Buchstaben sind normalerweise nicht sichtbar, es sei denn, das Papier wird vor ein Licht gehalten.</p></dd><dt>Sehr helle Tinte<span class="colon">:</span></dt><dd><p>Druckerhersteller drucken winzige Punktmuster in sehr hellen Farben auf die Seiten. Dies erlaubt es Dokumente zu dem Drucker zurückzuverfolgen, auf dem sie gedruckt wurden.</p></dd></dl></ld-topic>
<ld-topic id="steganographie-vs-verschlusselung"><h2>Steganographie vs. Verschlüsselung</h2><ul class="simple"><li><p>Steganografie hat eine Reihe von <em>Nachteilen</em> im Vergleich zur Verschlüsselung:</p><ul class="incremental-list negative-list simple"><li><p>Es erfordert einen hohen Overhead, um relativ wenige Bits an Informationen zu verbergen.</p></li><li><p>Sobald das System entdeckt wird, wird es praktisch wertlos.</p></li></ul></li></ul><ul class="incremental simple"><li><p>Der <em>Vorteil</em> der Steganografie:</p><ul class="incremental-list positive-list simple"><li><p>Sie kann von Parteien eingesetzt werden, die etwas zu verlieren haben, wenn allein die Tatsache ihrer geheimen Kommunikation (unabhängig vom Inhalt) entdeckt wird.</p></li><li><p>Verschlüsselung kennzeichnet den Verkehr als wichtig oder geheim oder kann den Sender oder Empfänger als jemanden identifizieren, der etwas zu verbergen hat.</p></li></ul></li></ul></ld-topic>
