<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>
</head>
<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic class="transition-fade new-section" id="grundlegende-architekturen"><h2>Grundlegende Architekturen</h2></ld-topic>
<ld-topic id="architekturstile-architectural-styles"><h2>Architekturstile (<span class="eng">Architectural Styles</span>)</h2><p>Ein Architekturstil wird formuliert in Form von</p><ul class="incremental-list simple"><li><p>(austauschbare) Komponenten mit klar definierten Schnittstellen</p></li><li><p>der Art und Weise, wie die Komponenten miteinander verbunden sind</p></li><li><p>die zwischen den Komponenten ausgetauschten Daten</p></li><li><p>der Art und Weise, wie diese Komponenten und Verbindungen gemeinsam zu einem System konfiguriert werden System.</p></li></ul><ld-supplemental><p class="rubric">Konnektor</p><p>Ein Mechanismus, der die Kommunikation, Koordination oder Kooperation zwischen Komponenten vermittelt. Beispiel: Einrichtungen für (entfernte) Prozeduraufrufe (RPC), Nachrichtenübermittlung oder Streaming.</p></ld-supplemental></ld-topic>
<ld-topic id="schichtenarchitekturen"><h2>Schichtenarchitekturen</h2><ul class="columns incremental-list"><li><object class="align-center" data="drawings/common_application_architectures/n-layered_architectures.svg" type="image/svg+xml" role="img"></object></li><li><object class="align-center" data="drawings/common_application_architectures/n-layered_architectures-jump_over_layers.svg" type="image/svg+xml" role="img"></object></li><li><object class="align-center" data="drawings/common_application_architectures/n-layered_architectures-and-callbacks.svg" type="image/svg+xml" role="img"></object></li></ul></ld-topic>
<ld-topic id="beispiel-einer-3-schichtenarchitektur"><h2>Beispiel einer 3-Schichtenarchitektur</h2><object class="align-center" data="drawings/common_application_architectures/3-layered-example.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="klassische-architekturen"><h2>Klassische Architekturen</h2><object class="align-center" data="drawings/common_application_architectures/common_architectures.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p class="rubric">Traditionelle Dreischichtenarchitektur</p><p>Diese Architektur findet sich in vielen verteilten Informationssystemen mit traditioneller Datenbanktechnologie und zugehörigen Anwendungen.</p><ul class="simple"><li><p>Die Präsentationsschicht stellt die Schnittstelle zu Benutzern oder externen Anwendungen dar.</p></li><li><p>Die Verarbeitungsschicht implementiert die Geschäftslogik.</p></li><li><p>Die Persistenz-/Datenschicht ist für die Datenhaltung verantwortlich.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic class="smaller" id="publish-and-subscribe-architekturen"><h2><em>Publish and Subscribe</em> Architekturen</h2><p>Abhängigkeiten zwischen den Komponenten werden durch das <em>Publish and Subscribe</em> Paradigma realisiert mit dem Ziel der loosen Kopplung.</p><ld-deck class="incremental"><ld-card><p><strong>Taxonomie der Koordinierungsansätze in Hinblick auf Kommunikation und Koordination:</strong></p><table class="highlight-on-hover fake-header-column fake-header-row smaller"><colgroup><col style="width: 13.0%"><col style="width: 43.5%"><col style="width: 43.5%"></colgroup><tbody><tr><td></td><td><p>Zeitlich gekoppelt</p></td><td><p>Zeitlich entkoppelt</p></td></tr><tr><td><p><span class="meta">Referentiell gekoppelt</span></p></td><td><p><span class="meta">Direkt Koordination</span></p></td><td><p><span class="meta">Mailboxkoordination</span></p></td></tr><tr><td><p>Referentiell entkoppelt</p></td><td><p>ereignisbasierte Koordination</p><p>(<span class="eng">Event-based Coordination</span>)</p></td><td><p>gemeinsam genutzter Datenspeicher</p><p>(<span class="eng">Shared Data Space</span>)</p></td></tr></tbody></table></ld-card><ld-card class="incremental"><p class="rubric">Ereignisbasierte Koordination</p><object class="light-image align-center" data="drawings/pubsub/event-based.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="incremental"><p class="rubric"><em>Shared Data Space</em></p><object class="light-image align-center" data="drawings/pubsub/shared-data-space.svg" type="image/svg+xml" role="img"></object></ld-card></ld-deck><div class="incremental"><p>Häufig wird die <em>ereignisbasierte Koordination</em> in Kombination mit <em>Shared Data Space</em> zur Realisierung von <em>Publish and Subscribe</em> Architekturen.</p></div><ld-supplemental><p class="rubric">Direkte Koordination</p><p>Ein Prozess interagiert unmittelbar (⇒ zeitliche Kopplung) mit genau einem anderen wohl-definierten Prozess (⇒ referentielle Kopplung).</p><p class="rubric">Mailboxkoordination</p><p>Die miteinander kommunizierenden Prozesse interagieren nicht direkt miteinander, sondern über eine eindeutige Mailbox (⇒ referentielle Kopplung). Dies ermöglicht es, dass die Prozesse nicht zeitgleich verfügbar sein müssen.</p><p class="rubric">Ereignisbasierte Koordination</p><p>Ein Prozess löst Ereignisse aus, auf die <em>irgendein</em> anderer Prozesse direkt reagiert. Ein Prozess, der zum Zeitpunkt des Auftretens des Ereignisses nicht verfügbar ist, sieht das Ereignis nicht.</p><p class="rubric">Gemeinsam genutzter Datenspeicher</p><p>Prozesse kommunizieren über Tuples, die in einem gemeinsam genutzten Datenspeicher hinterlegt werden. Ein Prozess, der zum Zeitpunkt des Schreibens nicht verfügbar ist, kann das Tuple später lesen. Prozesse definieren Muster in Hinblick auf die Tuples, die sie lesen wollen.</p></ld-supplemental><!--TODO Baue die Diskussion vo PubSub Architekturen weiter aus.--></ld-topic>
<ld-topic id="aufbau-von-cloud-computing-anwendungen"><h2>Aufbau von Cloud Computing Anwendungen</h2><object class="light-image align-center" data="drawings/cloud.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>Es können vier Schichten unterschieden werden:</p><ul class="list-with-explanations"><li><p>Hardware: Prozessoren, Router, Stromversorgungs- und Kühlsysteme.</p><p>Für Kunden normalerweise vollkommen transparent.</p></li><li><p>Infrastruktur: Einsatz von Virtualisierungstechniken zum Zwecke der  Zuweisung und Verwaltung virtueller Speichere und virtueller Server.</p></li><li><p>Plattformen: Bietet Abstraktionen auf höherer Ebene für Speicher und dergleichen.</p><p>Beispiel: Das Amazon S3-Speichersystem bietet eine API für (lokal erstellte) Dateien, die in sogenannten Buckets organisiert und gespeichert werden können.</p></li><li><p>Anwendung: Tatsächliche Anwendungen, wie z. B. Office-Suiten (Textverarbeitungsprogramme, Tabellenkalkulationsprogramme, Präsentationsanwendungen).</p><p>Vergleichbar mit der Suite von Anwendungen, die mit Betriebssystemen ausgeliefert werden.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-fade" id="microservices-newman2021"><h2>Microservices <a class="citation-reference" href="#newman2021" id="citation-reference-1" role="doc-biblioref">[Newman2021]</a></h2></ld-topic>
<ld-topic class="no-title" id="microservice-mit-rest-schnittstelle"><h2>Microservice mit REST Schnittstelle</h2><ul class="columns"><li><p class="rubric">Microservices</p><p>Ein einfacher Microservice, der eine REST Schnittstelle anbietet und Ereignisse auslöst.</p><div class="incremental question smaller"><p>Wo liegen hier die Herausforderungen?</p></div></li><li><object class="align-center" data="drawings/microservices/basisbeispiel.svg" type="image/svg+xml" role="img"></object></li></ul><ld-supplemental><p>Eine große Herausforderung ist das Design der Schnittstellen. Um wirkliche Unabhängigkeit zu erreichen, müssen die Schnittstellen sehr gut definiert sein. Sind die Schnittstellen nicht klar definiert oder unzureichend, dann kann das zu viel Arbeit und Koordination zwischen den Teams führen, die eigentlich unerwünscht ist!</p></ld-supplemental></ld-topic>
<ld-topic id="schlusselkonzepte-von-microservices"><h2>Schlüsselkonzepte von Microservices</h2><ul class="incremental-list list-with-explanations"><li><p>können unabhängig bereitgestellt werden (<span class="eng">independently deployable</span>)</p><p>und werden unabhängig entwickelt</p></li><li><p>modellieren eine Geschäftsdomäne</p><p>Häufig entlang einer Kontextgrenze (eng. Bounded Context) oder eines Aggregats aus DDD</p></li><li><p>verwalten Ihren eigenen Zustand</p><p>d. h. keine geteilten Datenbanken</p></li><li><p>sind klein</p><p>Klein genug, um durch (max.) ein Team entwickelt werden zu können</p></li><li><p>flexibel bzgl. Skalierbarkeit, Robustheit, eingesetzter Technik</p></li><li><p>erlauben das Ausrichten der Architektur an der Organisation (vgl. Conway's Law)</p></li></ul></ld-topic>
<ld-topic id="microservices-und-conway-s-law"><h2>Microservices und Conway's Law</h2><ul class="columns incremental-list"><li><p class="rubric">Traditionelle Schichtenarchitektur</p><object class="align-center" data="drawings/microservices/aenderungen-bei-klassischer-architektur.svg" type="image/svg+xml" role="img"></object></li><li><p class="rubric">Microservices Architektur</p><object class="align-center" data="drawings/microservices/aenderungen-bei-microservices-architektur.svg" type="image/svg+xml" role="img"></object></li></ul></ld-topic>
<ld-topic id="microservices-und-technologieeinsatz"><h2>Microservices und Technologieeinsatz</h2><p>Microservices sind flexibel bzgl. des Technologieeinsatzes und ermöglichen den Einsatz „der geeignetsten“ Technologie.</p><object class="align-center" data="drawings/microservices/technologische-flexibilitaet.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic class="vertical-title" id="aktuelle-standardtechnologien"><h2>Aktuelle Standardtechnologien</h2><ld-deck><ld-card><img class="align-center" src="screenshots/tiobe_2012-04.webp" height="900"><p>Quelle: TIOBE Programming Community Index - April 2012</p></ld-card><ld-card class="incremental"><img class="align-center" src="screenshots/tiobe_2024-02.webp" height="900"><p>Quelle: <a class="reference external" href="https://www.tiobe.com/tiobe-index/">TIOBE Programming Community Index - Feb. 2024</a></p></ld-card></ld-deck></ld-topic>
<ld-topic id="microservices-und-skalierbarkeit"><h2>Microservices und Skalierbarkeit</h2><p>Sauber entworfene Microservices können sehr gut skaliert werden.</p><object class="align-center" data="drawings/microservices/skalierbarkeit.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="implementierung-einer-langlebigen-transaktion"><h2>Implementierung einer langlebigen Transaktion?</h2><object class="align-center" data="drawings/sagas/transaktion.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>Die Implementierung von Transaktionen ist eine der größten Herausforderungen bei der Entwicklung von Microservices.</p></ld-supplemental></ld-topic>
<ld-topic id="aufteilung-einer-langlebigen-transaktion-mit-sagas"><h2>Aufteilung einer langlebigen Transaktion mit Sagas</h2><object class="align-center" data="drawings/sagas/transaktion-mit-saga.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>Eine <em>Saga</em> ist eine Sequenz von Aktionen, die ausgeführt werden, um eine langlebige Transaktion zu implementieren.</p><p>Sagas können keine Atomizität garantieren. Jedes System für sich kann jedoch ggf. Atomizität garantieren (z. B. durch die Verwendung traditioneller Datenbanktransaktionen).</p><p>Sollte ein Abbruch der Transaktion notwendig sein, dann kann kein traditioneller <em>Rollback</em> erfolgen. Die Saga muss dann entsprechende kompensierende Transaktionen durchführen, die alle bisher erfolgreich durchgeführten Aktionen rückgängig machen.</p></ld-supplemental></ld-topic>
<ld-topic class="s-vertical-title" id="minimierung-von-mgl-rollbacks"><h2>Minimierung von mgl. <em>Rollbacks</em></h2><object class="align-center" data="drawings/sagas/transaktion-mit-saga-mit-weniger-rollbacks.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>Die Abarbeitungsreihenfolge der Aktionen kann so optimiert werden, dass die Wahrscheinlichkeit von <em>Rollbacks</em> minimiert wird. In diesem Falle ist die Wahrscheinlichkeit, dass es zu einem <em>Rollback</em> während des Schritts „Versand der Bestellung“ kommt, wesentlich höher als beim Schritt „Kundenbonus gutschreiben“.</p></ld-supplemental></ld-topic>
<ld-topic id="langlebige-transaktionen-mit-orchestrierten-sagas"><h2>Langlebige Transaktionen mit orchestrierten Sagas</h2><object class="align-center" data="drawings/sagas/orchestrierte-saga.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>Die orchestrierte Saga ist eine Möglichkeit, um langlebige Transaktionen zu implementieren.</p><ul class="positive-list simple"><li><p>Mental einfach</p></li></ul><ul class="negative-list list-with-explanations"><li><p>Hoher Grad an <em>Domain Coupling</em></p><p>Da es sich im Wesentlichen um fachlich getriebene Kopplung handelt, ist diese Kopplung häufig akzeptabel. Die Kopplung erzeugt keine technischen Schulden (<span class="eng">technical debt</span>).</p></li><li><p>Hoher Grad an <em>Request-Response</em> Interaktionen</p></li><li><p>Gefahr, dass Funktionalität, die besser in den einzelnen Services (oder ggf. neuen Services) unterzubringen wäre, in den Bestellung Service wandert.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="langlebige-transaktionen-mit-choreografierten-sagas"><h2>Langlebige Transaktionen mit choreografierten Sagas</h2><object class="align-center" data="drawings/sagas/choreographierte-saga.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>Ein großes Problem bei choreografierten Sagas ist es den Überblick über den aktuellen Stand zu behalten. Durch die Verwendung einer "Korrelations-ID" kann diese Problem gemindert werden.</p></ld-supplemental></ld-topic>
<ld-topic id="dual-write-problem"><h2><em>Dual-write Problem</em></h2><ld-deck><ld-card><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><object class="align-center" data="drawings/dual-write/no-crash-no-problem.svg" type="image/svg+xml" role="img"></object></ld-cell><ld-cell style="align-self:auto;"><p>An welcher Stelle könnte es zu einem Problem kommen?</p><aside class="admonition incremental" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Das „Schreiben“ auf zwei unterschiedliche Systeme (hier: Datenbank und Event-processing Middleware) erfordert immer einen transaktionalen Kontext.</p><p>Kann dieser nicht hergestellt werden, dann kann es zu Inkonsistenzen kommen (<span class="eng">Dual-write Problem</span>).</p></aside></ld-cell></ld-grid></ld-card><ld-card class="incremental"><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><object class="align-center" data="drawings/dual-write/crash.svg" type="image/svg+xml" role="img"></object></ld-cell><ld-cell style="align-self:auto;"><p class="rubric">Lösungsideen</p><ul class="incremental-list negative-list simple"><li><p>2PC ist im Kontext von Microservices keine Option (zu langsam, zu komplex)</p></li><li><p>Änderung der Reihenfolge der Aktionen (1. <em>publish</em> dann 2. <em>update</em>) führt noch immer zu Inkonsistenzen</p></li><li><p>die Event Processing Middleware (synchron) zu notifizieren - d. h. als Teil des Datenbankupdates - ist auch keine Option:</p><ul class="negative-list simple"><li><p>Was passiert, wenn die Middleware nicht erreichbar ist?</p></li><li><p>Was passiert, wenn das Event nicht verarbeitet werden kann?</p></li></ul></li></ul><div class="incremental assessment"><p>Strikte Konsistenz ist nicht erreichbar.</p></div></ld-cell></ld-grid></ld-card></ld-deck></ld-topic>
<ld-topic id="dual-write-problem-outbox-pattern"><h2><em>Dual-write Problem</em> - Outbox Pattern</h2><object class="align-center" data="drawings/dual-write/outbox-pattern.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p class="rubric"><em>(eine) Lösung: Outbox Pattern</em></p><ul class="simple"><li><p>Die Aktionen werden (zusätzlich) in einer Outbox-Tabelle gespeichert und dann <strong>asynchron</strong> verarbeitet.</p></li><li><p>Damit kann <em>Eventual Consistency</em> erreicht werden.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic class="no-title center-content transition-fade" id="die-wahl-der-richtigen-architektur-ist-ein-tradeoff"><h2>Die Wahl der richtigen Architektur ist ein Tradeoff!</h2><div class="accentuate"><p>Die Wahl der Softwarearchitektur ist immer eine Abwägung von vielen Tradeoffs!</p></div><ld-supplemental><p>Weitere Aspekte, die berücksichtigt werden können/müssen:</p><ul class="simple"><li><p>Cloud (und ggf. Serverless)</p></li><li><p>Mechanical Sympathy</p></li><li><p>Testen und Deployment von Mircoservices (Stichwort: <em>Canary Releases</em>)</p></li><li><p>Monitoring und Logging</p></li><li><p>Service Meshes</p></li><li><p>...</p></li></ul></ld-supplemental></ld-topic>
