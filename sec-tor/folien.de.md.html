<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg">
<defs>

    <!-- Gemeinsame Symbole für Netzwerk-Diagramme (Rechner, Server, Internet,
         Firewall, …) aller Foliensätze. Präfix "net-".

         Einbinden im Frontmatter eines Foliensatzes:
             ld:
               include-globals:
                 - ../shared/svgs/net-symbols.svg

         Verwendung: <use href="#net-…" x="…" y="…"/>.

         Farbe: Alle Formen verwenden currentColor; die Farbe folgt also
         color. Eine Gruppe setzt sie (class="ld-success"), eine einzelne
         Instanz kann sie mit einer Farbklasse am <use> ändern:
             <use href="#net-server" class="ld-info" x="…" y="…"/>
         CSS-Selektoren greifen nicht in den Shadow-Tree eines <use>, vererbte
         Eigenschaften (color, Custom Properties) dagegen schon. Die Formen
         verwenden deshalb Deckkraft-Attribute statt der ld-Klassen
         (fill-opacity 0.1 = ld-panel, 0.3 = ld-cell).

         Anpassung: Custom Properties, jeweils mit Standardwert im var(); sie
         werden am <use> (style="--net-…: …") oder an einer umgebenden Gruppe
         bzw. am <svg> gesetzt. Übersicht:
             --net-server-stroke-width       (0.18)
             --net-server-slot-stroke-width  (0.08)
             --net-server-frame-color        (currentColor)
             --net-cloud-stroke-width        (0.16)
             --net-flame-color               (#f97316)
             --net-flame-core-color          (#facc15)

         Keine viewBox: x/y des <use> verschieben das Symbol, die Koordinaten
         entsprechen denen der Diagramme. overflow="visible", weil ein
         <symbol> sonst an seinem Viewport abschneidet. -->

    <!-- Server: 6 × 6,8, Ursprung oben links.
         --net-server-stroke-width       Rahmen                  (0.18)
         --net-server-slot-stroke-width  Einschübe               (0.08)
         --net-server-frame-color        Farbe des Rahmens       (currentColor)
         Ein dunklerer Rahmen: --net-server-frame-color:
         oklch(from currentColor calc(l * 0.5) c h). -->
    <symbol id="net-server" overflow="visible">
        <rect x="0" y="0" width="6" height="6.8" rx="0.6"
              fill="currentColor" fill-opacity="0.1"
              style="stroke: var(--net-server-frame-color, currentColor);
                     stroke-width: var(--net-server-stroke-width, 0.18);"/>
        <g fill="currentColor" fill-opacity="0.3" stroke="currentColor"
           style="stroke-width: var(--net-server-slot-stroke-width, 0.08);">
            <rect x="0.7" y="0.7" width="4.6" height="1.5" rx="0.25"/>
            <rect x="0.7" y="2.5" width="4.6" height="1.5" rx="0.25"/>
            <rect x="0.7" y="4.3" width="4.6" height="1.5" rx="0.25"/>
        </g>
        <g fill="currentColor">
            <circle cx="1.4" cy="1.45" r="0.22"/>
            <circle cx="1.4" cy="3.25" r="0.22"/>
            <circle cx="1.4" cy="5.05" r="0.22"/>
        </g>
    </symbol>

    <!-- Laptop (Client mit Browser): Bildschirm 0,2 … 7,2 × 0 … 4,8,
         Tastatur -0,7 … 8,1 × 4,8 … 5,8; Mitte x = 3,7. -->
    <symbol id="net-laptop" overflow="visible">
        <rect x="0.2" y="0" width="7" height="4.8" rx="0.4"
              fill="currentColor" fill-opacity="0.1"
              stroke="currentColor" stroke-width="0.18"/>
        <rect x="0.7" y="0.5" width="6" height="1" rx="0.2"
              fill="none" stroke="currentColor" stroke-width="0.08"/>
        <g fill="currentColor">
            <circle cx="1.1" cy="1" r="0.13"/>
            <circle cx="1.55" cy="1" r="0.13"/>
            <circle cx="2" cy="1" r="0.13"/>
        </g>
        <g fill="currentColor" fill-opacity="0.3">
            <rect x="2.7" y="0.75" width="3.6" height="0.5" rx="0.25"/>
            <rect x="0.8" y="2" width="4.6" height="0.45" rx="0.2"/>
            <rect x="0.8" y="2.9" width="5.6" height="0.45" rx="0.2"/>
            <rect x="0.8" y="3.8" width="3.4" height="0.45" rx="0.2"/>
        </g>
        <path d="M 0.1 4.8 L 7.3 4.8 L 8.1 5.8 L -0.7 5.8 Z"
              fill="currentColor" fill-opacity="0.3"
              stroke="currentColor" stroke-width="0.18" stroke-linejoin="round"/>
    </symbol>

    <!-- Internet-Wolke: ca. 12,8 × 7,4, Ursprung in der Mitte
         (x -6,6 … 6,2, y -3,7 … 3,7). Die Beschriftung steht im Diagramm. -->
    <symbol id="net-cloud" overflow="visible">
        <path d="M -3.67 3.21 C -5.08 3.21 -6.09 2.10 -5.89 0.78
                 C -6.59 0.38 -6.39 -1.03 -5.23 -1.23
                 C -5.18 -2.54 -3.72 -3.30 -2.51 -2.54
                 C -1.75 -3.65 0.82 -3.70 1.67 -2.39
                 C 3.44 -2.94 5.05 -1.83 4.55 -0.32
                 C 6.16 -0.02 6.21 2.20 4.70 2.80
                 C 4.30 3.51 2.38 3.71 1.47 3.11 L -3.67 3.21 Z"
              fill="var(--background-color)" stroke="currentColor"
              style="stroke-width: var(--net-cloud-stroke-width, 0.16);"/>
    </symbol>

    <!-- Firewall-Flamme: 2,2 × 3,6, Ursprung in der Mitte. Feste Farben,
         weil sie Bedeutung tragen und auf Hell und Dunkel lesbar sind. -->
    <symbol id="net-flame" overflow="visible">
        <path d="M 0 -1.8 C -0.8 -1 -1.1 -0.4 -1.1 0.2 C -1.1 1.2 -0.4 1.8 0 1.8
                 C 0.4 1.8 1.1 1.2 1.1 0.2 C 1.1 -0.3 0.8 -0.7 0.5 -1.1
                 C 0.6 -0.5 0.3 -0.1 0 -0.1 C -0.2 -0.1 -0.3 -0.3 -0.2 -0.6
                 C -0.1 -1 0 -1.4 0 -1.8 Z"
              style="fill: var(--net-flame-color, #f97316);"/>
        <path d="M 0 0 C -0.3 0.3 -0.4 0.6 -0.4 0.9 C -0.4 1.3 -0.2 1.5 0 1.5
                 C 0.2 1.5 0.4 1.3 0.4 0.9 C 0.4 0.5 0.2 0.3 0 0 Z"
              style="fill: var(--net-flame-core-color, #facc15);"/>
    </symbol>

    <!-- Lüftungsschlitze eines Geräts: drei Punkte, 1,6 breit, Ursprung am
         ersten Punkt. -->
    <symbol id="net-vents" overflow="visible">
        <g fill="currentColor">
            <circle cx="0" cy="0" r="0.16"/>
            <circle cx="0.8" cy="0" r="0.16"/>
            <circle cx="1.6" cy="0" r="0.16"/>
        </g>
    </symbol>

    <!-- Plaketten "blockiert" / "erlaubt": Kreis mit Radius 1,1, Ursprung in
         der Mitte. Ein Pfeil, der die Plakette berühren soll, endet
         1,1 + 1,5 × stroke-width vor der Mitte. -->
    <symbol id="net-blocked" overflow="visible">
        <circle r="1.1" fill="var(--background-color)"
                stroke="currentColor" stroke-width="0.32"/>
        <line x1="-0.78" y1="0.78" x2="0.78" y2="-0.78"
              stroke="currentColor" stroke-width="0.32"/>
    </symbol>
    <symbol id="net-allowed" overflow="visible">
        <circle r="1.1" fill="var(--background-color)"
                stroke="currentColor" stroke-width="0.32"/>
        <path d="M -0.65 0 L -0.2 0.5 L 0.7 -0.6" fill="none"
              stroke="currentColor" stroke-width="0.32"
              stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

</defs>
</svg>

Übernahme explizit validiert und angepasst.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic class="new-section" id="grundlagen"><h2>Grundlagen</h2></ld-topic>
<ld-topic id="tor-the-onion-router"><h2>Tor (The Onion Router)</h2><p>Anwendungsunabhängiger <strong>low-latency Anonymisierungsdienst für TCP-Verbindungen</strong>, der den Standort und die IP des Nutzers verschleiert.</p><ul class="incremental-list simple"><li><p>Typische Anwendung: anonymes Surfen im Internet und Instant Messaging (z. B. Briar)</p></li><li><p>Frei und Open Source</p></li><li><p>gegründet 2002, öffentlich nutzbar seit 2003, Code seit 2004 frei verfügbar</p></li><li><p>Baut ein <em>Overlay-Netzwerk</em> auf</p></li><li><p>Grundlegendes Prinzip: Onion Routing</p></li></ul><ld-supplemental><dl class="field-list simple"><dt><em>low-latency</em><span class="colon">:</span></dt><dd><p>Die Verzögerung durch die Anonymisierung ist so gering, dass Tor für Instant Messaging und das Surfen im Internet verwendet werden kann.</p></dd><dt>Overlay-Netzwerk<span class="colon">:</span></dt><dd><p>Tor baut ein eigenes Netzwerk auf, welches auf dem Internet aufsetzt. Die Verbindungen zwischen den Tor-Knoten werden von Tor zusätzlich verschlüsselt.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic id="tor-verwendung"><h2>Tor – Verwendung</h2><ul class="incremental-list list-with-explanations"><li><p>legale/intendierte Nutzungen: Nutzer mit allg. Datenschutzbedürfnissen, <em>Whistleblowers</em>, Dissidenten, Journalisten, ...</p></li><li><p>illegale Zwecke (<strong>Darknet</strong>)</p><div class="incremental"><p>Marktplatz für illegale Waren und Dienstleistungen, z. B. Drogen, Waffen, gefälschte Dokumente, ... (z. B. <a class="reference external" href="https://en.wikipedia.org/wiki/Silk_Road_(marketplace)">Silk Road</a>, oder <a class="reference external" href="https://en.wikipedia.org/wiki/CyberBunker">CyberBunker</a> als Hosting-Provider für illegale Dienst)</p></div><div class="incremental"><p>Es wird geschätzt, dass etwa 80% des Datenverkehrs im Zusammenhang mit dem Zugriff auf Kinderpornografie steht. Solche Schätzungen sind allerdings mit Vorsicht zu genießen!</p></div></li></ul><ld-supplemental><p>Wir können unterscheiden zwischen:</p><dl class="field-list simple"><dt><em>Surface Web</em><span class="colon">:</span></dt><dd><p>Das frei-verfügbare Internet. (Auch als <em>Clear Web</em> bezeichnet.)</p></dd><dt><em>Deep Web</em><span class="colon">:</span></dt><dd><p>Das Internet, das durch Zugriffsbeschränkungen nicht öffentlich zugänglich ist.</p></dd><dt><em>Dark Web</em><span class="colon">:</span></dt><dd><p>Das Internet, das nicht indiziert ist und nur über spezielle Software (z. B. Tor) erreichbar ist. Häufig – aber nicht ausschließlich – wird das Dark Web für illegale Aktivitäten genutzt und ist meist zusätzlich durch Zugriffsbeschränkungen geschützt.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic class="new-section" id="sicherheit"><h2>Sicherheit</h2></ld-topic>
<ld-topic id="tor-potentielle-sicherheitslucken"><h2>Tor – potentielle Sicherheitslücken</h2><ul class="simple"><li><p><span class="peripheral">DoS Attacken</span></p></li></ul><div class="incremental"><ul class="simple"><li><p>Identifikation von <em>Onion Services</em> (aka <em>Hidden Services</em>)</p></li></ul></div><div class="incremental"><ul class="simple"><li><p>Deanonymisierungsattacken</p></li></ul></div><div class="incremental"><p><a class="reference external" href="https://github.com/Attacks-on-Tor/Attacks-on-Tor#correlation-attacks">Aufstellung von Angriffen auf Tor</a>.</p></div></ld-topic>
<ld-topic id="tor-deanonymisierungsattacke-2013"><h2>Tor – Deanonymisierungsattacke 2013</h2><blockquote class="epigraph"><p>Wenn ein einzelner Nutzer Tor über einen längeren Zeitraum [3 bis 6-Monate, abhängig von einigen Faktoren] regelmäßig nutzt, ist es fast sicher, dass er <em>de-anonymisiert</em> werden kann.</p><p>[Übersetzt mit DeepL.]</p><p class="attribution">—2013: <a class="reference external" href="https://www.infosecurity-magazine.com/news/tor-is-not-as-safe-as-you-may-think/">Tor is not as safe as you may think</a></p></blockquote></ld-topic>
<ld-topic id="tor-deanonymisierungsattacke-2024"><h2>Tor – Deanonymisierungsattacke 2024</h2><blockquote class="epigraph"><p>Strafverfolgungsbehörden haben offenbar einen Weg gefunden, Nutzer des Tor-Netzwerkes gezielt zu deanonymisieren. Möglich sein soll dies [...] durch sogenannte Timing-Analysen, die bisher als praktisch nicht umsetzbar galten. Dadurch sei es aufgrund der verschlüsselten Datenpakete zwar nicht möglich zu sehen, was Nutzer verschickten, dass sie überhaupt kommunizierten, sei aber sichtbar.</p><div class="incremental"><p>[...] ist dafür allerdings eine teils jahrelange Überwachung einzelner Tor-Nodes erforderlich. [...]</p></div><p class="attribution">—2024: <a class="reference external" href="https://www.golem.de/news/deanonymisierung-von-nutzern-behoerden-unterwandern-tor-netzwerk-2409-189076.html">Behörden unterwandern Tor</a></p></blockquote></ld-topic>
<ld-topic id="tor-hintergrund"><h2>Tor – Hintergrund</h2><ul class="incremental-list simple"><li><p>Die grundlegende Idee ist es eine Trennung zwischen der Quelle und dem Ziel des Datenverkehrs zu schaffen.</p></li><li><p>Der Datenverkehr wird über <em>mehrere Knoten</em> (<em>Relays</em>) umgeleitet, die jeweils nur den vorherigen und den nächsten Knoten kennen. Der Weg den ein Datenpaket nimmt, wird als <em>Circuit</em> oder <em>Path</em> bezeichnet.</p></li><li><p>Der Pfad wird dazu vorher ausgewählt und der gesamte Datenverkehr entsprechend des Pfades verschlüsselt.</p></li><li><p>Tor bietet Anonymität auch für die Serverseite durch <em>Onion Services</em> (auch <em>Hidden Services</em>), die nur über eine von Tor vergebene Onion-Adresse erreicht werden können.</p></li></ul></ld-topic>
<ld-topic id="tor-bedrohungsmodell"><h2>Tor – Bedrohungsmodell</h2><p>Tor bietet Schutz vor folgenden Angreifern: Einem Angreifer dem es gelingt ...</p><ul class="simple"><li><p>einen Teil der Kommunikation zu beobachten und</p></li><li><p>nur einen Teil der Tor-Knoten zu kontrollieren, indem er entweder einen eigenen Tor-Knoten (<em>Relay</em>; früher <em>Onion-Router</em>) betreibt oder einen bereits laufenden Knoten kompromittiert.</p></li></ul><aside class="admonition incremental" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Folgendes Szenario ist nicht abgedeckt: Ein Angreifer, der beide Enden der Kommunikation, den <span class="docutils literal">Entry Guard</span> und den <span class="docutils literal">Exit Node</span> überwachen kann.</p><p>Gegen solche Angreifer bietet Tor keine Anonymität.</p></aside></ld-topic>

</div><ld-supplemental embed-in-document-flow=""><p><a class="reference external" href="https://spec.torproject.org">Spezifikation</a></p><dl class="field-list"><dt>Tor-Knoten<span class="colon">:</span></dt><dd><p>Rechner, die das Tor-Netzwerk bilden. Es gibt drei Arten von Tor-Knoten:</p><ul class="simple"><li><p><em>Entry Nodes</em> (auch <em>Guard Nodes</em>): Diese Knoten sind die ersten Knoten in der Kette. Sie kennen die IP-Adresse des Clients. Sie können den Datenverkehr nicht entschlüsseln. Sie können aber sehen, dass der Datenverkehr von einem bestimmten Client kommt.</p></li><li><p><em>Middle Nodes</em>: Diese Knoten sind die mittleren Knoten in der Kette. Sie kennen weder die IP-Adresse des Clients noch die IP-Adresse des Ziels. Sie können den Datenverkehr nicht entschlüsseln. Sie können aber sehen, dass der Datenverkehr von einem bestimmten Entry Node kommt und an einen bestimmten Exit Node geht.</p></li><li><p><em>Exit Nodes</em>: Diese Knoten sind die letzten Knoten in der Kette. Sie kennen die IP-Adresse des Ziels. Sie können den Datenverkehr entschlüsseln. Sie können aber nicht sehen, von welchem Entry Node der Datenverkehr kommt.</p></li><li><p><em>Bridge Nodes</em>: Diese Knoten sind <em>Entry Nodes</em>, die nicht bzw. nicht vollständig öffentlich bekannt. Diese dienen ggf. dazu in Ländern, in denen Tor blockiert wird, den Zugang zu Tor zu ermöglichen. Sollte eine Verbindung zu einer Bridge nicht hergestellt werden können, aufgrund der Struktur der Nachrichten – zum Beispiel aufgrund der Verwendung von <em>Deep Packet Inspection</em> – dann ist es möglich diese mit Hilfe von <em>Pluggable Transports</em> zu verschleiern.</p></li></ul></dd><dt>Tor-Netzwerk<span class="colon">:</span></dt><dd><p>besteht aus mehreren tausend Tor-Knoten. Viele Knoten sind freiwillig betriebene Knoten.</p></dd><dt>Circuit/Path<span class="colon">:</span></dt><dd><p>Ein Circuit besteht typischerweise aus drei Knoten: <em>Entry Node</em>, <em>Middle Node</em> und <em>Exit Node</em>. Mehr Knoten sind möglich, haben jedoch nur einen geringen Einfluss auf die Sicherheit. Die Übertragung der Daten zwischen diesen Knoten erfolgt verschlüsselt. In welcher Form die Daten vom <em>Exit Node</em> zum Ziel übertragen werden, ist nicht Teil von Tor. Hat der Client eine verschlüsselte Verbindung initiiert (HTTPS), dann ist auch der Datenverkehr zwischen dem Exit Node und dem Ziel (noch) verschlüsselt ansonsten nicht und der Exit Node kann den Datenverkehr lesen.</p></dd><dt>Directory Authority<span class="colon">:</span></dt><dd><p>Knoten, die die Liste der aktiven Tor-Knoten verwalten. Diese Liste wird von allen Tor-Knoten regelmäßig in Hinblick auf das <em>Consensus Document</em> bzgl. der Knoten und deren Eigenschaften sowie Zustand abgefragt. Das <em>Consensus Document</em> wird von den <em>Directory Authorities</em> einmal pro Stunde gemeinsam erstellt und beschreibt die relevanten Eigenschaften jedes Tor-Knotens. Die Authentizität des <em>Consensus Document</em> wird durch die Signaturen der <em>Directory Authorities</em> nachgewiesen.</p><p>Es gibt (Stand 2023) 9 <em>Directory Authorities</em>.</p></dd><dt><span class="eng">Onion Routing</span><span class="colon">:</span></dt><dd><p>bedeutet, dass die Datenpakete mehrfach verschlüsselt werden. Jeder Tor-Knoten kann nur die Verschlüsselungsschicht entfernen, für die er den Schlüssel hat. Die Schlüssel werden mit dem Client während des Aufbaus des Circuits ausgehandelt. Es gibt für jeden Tor-Knoten einen eigenen Schlüssel und die Nachrichten werden in umgekehrter Reihenfolge der Tor-Knoten entlang des Pfades verschlüsselt. d. h. die Verschlüsselung für den Entry Node wird als letztes angewendet, da diese als erstes entfernt wird.</p></dd><dt>Cells<span class="colon">:</span></dt><dd><p>sind die Datenpakete, die zwischen den Tor-Knoten ausgetauscht werden. Cells sind immer 512Byte groß, um es unmöglich zu machen anhand der Größe der Datenpakete Rückschlüsse auf die Daten zu ziehen.</p></dd></dl><aside class="admonition admonition-hinweis"><p class="admonition-title">Hinweis</p><p>In älteren Dokumenten wird der <em>Client</em> auch als <em>Onion Proxy (OP)</em> bezeichnet und die Tor-Knoten als <em>Onion Router (OR)</em>. Die Tor-Knoten (<span class="eng">Nodes</span>) werden auch als <em>Onion Relay</em> bezeichnet.</p></aside></ld-supplemental></ld-topic>
<ld-topic class="s-vertical-title" id="initiierung-eines-circuits-konzeptionell"><h2>Initiierung eines Circuits (konzeptionell)</h2><div class="align-center" style="width: 64ch; height: 38.4ch;" aria-label="Initiierung eines Circuits"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" font-size="1.8"
     text-anchor="middle">
    <!-- Aufbau eines Circuits über zwei Tor-Knoten (konzeptionell).
         Lebenslinien bei x = 10 (Client), 38 (OR 1), 66 (OR 2),
         91 (Server); Nachrichten enden mit der Pfeilspitze auf der Lebenslinie.
         Symbole #net-…: shared/svgs/net-symbols.svg. Farben wie in
         tor-netzwerk.svg: Entry Guard ld-info, Exit Node ld-success; was erst
         später folgt: ld-muted.
         Teilnehmer, Lebenslinien und Hintergrund sind sofort sichtbar; jede
         Nachricht ist ein eigener Schritt (incremental). -->

    <!-- === Tor-Netzwerk (Hintergrund) === -->
    <rect class="ld-panel" x="24" y="0" width="56" height="60" rx="1"/>

</div><ld-supplemental embed-in-document-flow=""><p>Jeder Tor-Knoten verfügt über mehrere Keys. Für den Aufbau der Verbindung werden die <em>Onion Keys</em> verwendet. Mit Hilfe dieser werden die initialen Datenpakete mittels Public-Key Kryptografie verschlüsselt. Dies wird benötigt, um den AES Key – einer pro Knoten – der für den eigentlichen Versand benötigt wird, auszuhandeln und sicher zu übertragen.</p><p>In der Grafik wird der Aufbau eines Circuits mit zwei Tor-Knoten dargestellt. Der Client kennt die Onion Keys der Tor-Knoten (<span class="docutils literal">OR1</span> und <span class="docutils literal">OR2</span>). Die Onion Keys werden verwendet, um die <em>Create</em> Zelle zu verschlüsseln. Der Entry Node verwendet diese Onion Keys um die <em>Create</em> Zelle zu entschlüsseln und den gemeinsamen Schlüssel zu erzeugen. Um einen längeren Pfad aufzubauen, muss der Client ggf. einfach mehrere <span class="docutils literal">Extend</span> Nachrichten versenden. Erhält ein Knoten eine Relay Nachricht, dann kann der Knoten diese mit dem mit ihm ausgehandelten AES Key entschlüsseln und die Nachricht weiterleiten. Er kann den Inhalt (zum Beispiel eine weitere Relay Nachricht oder eine Extend Nachricht) nicht lesen.</p></ld-supplemental></ld-topic>
<ld-topic id="tor-relays-in-deutschland-https-metrics-torproject-org"><h2>Tor Relays in Deutschland (<a class="reference external" href="https://metrics.torproject.org">https://metrics.torproject.org</a>)</h2><img class="screenshot center-content align-center" src="images/tor-metrics-relays.webp" alt="Tor Relays gelistet von Tor Metrics Oct. 2026" width="1820px"><ld-supplemental embed-in-document-flow=""><p><strong>Flags</strong></p><p>Beschreibung jedes Tor-Knotens in Hinblick auf die Rolle des Knotens im Tor-Netzwerk. Zum Beispiel: kann der Knoten als Entry Node verwendet werden? Ist der Knoten schnell genug um als Exit Node verwendet zu werden?</p><p>Auszug wichtiger <em>Flags</em>:</p><dl class="field-list simple"><dt>HSDir<span class="colon">:</span></dt><dd><p>Ein Router ist ein <em>v2 Hidden Service Directory</em></p></dd><dt>Running<span class="colon">:</span></dt><dd><p>Eine Authority konnte sich innerhalb der letzten 45 Minuten mit dem Router verbinden.</p></dd><dt>Stable<span class="colon">:</span></dt><dd><p>die gewichtete Zeit zwischen zwei Fehlern (<em>weighted MTBF</em>) ist größer als 7 Tage oder größer als der Median aller aktiven Router.</p></dd><dt>Valid<span class="colon">:</span></dt><dd><p>eine Version von Tor wird ausgeführt, die von den Authorities als aktuell angesehen wird und keine bekannten Schwachstellen aufweist.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic id="informationen-uber-tor-relays"><h2>Informationen über Tor Relays</h2><img class="screenshot align-right" src="images/tor-relay-snorlax.webp" alt="Tor Relay Snorlax"><div class="incremental width-40 float-left"><ld-deck><ld-card><ul class="simple"><li><p>Viele Tor Relays werden von Freiwilligen betrieben</p></li><li><p>In Deutschland gibt es viele Relays</p></li><li><p>Hetzner ist diesbezüglich beliebt...</p></li></ul><div class="incremental"><p>... und deswegen steht Hetzner auf der Liste der zu <a class="reference external" href="https://community.torproject.org/relay/community-resources/good-bad-isps/">vermeidenden Hoster</a> (Stand Okt. 2026).</p></div></ld-card><ld-card class="incremental"><p>Ein Tor-Knoten wird als <span class="docutils literal">schnell</span> (<em>fast</em>) eingestuft, wenn er aktiv ist und eine Bandbreite von mindestens 100KB/s hat oder unter den Top 7/8tel aller bekannten aktiven Router ist.</p><p>Zum Vergleich: Die durchschnittliche Bandbreite in Deutschland ist 80Mbit/s (cf. <a class="reference external" href="https://www.statista.com/statistics/1338657/average-internet-speed-germany/">Statista</a>).</p><p>(Stand Jan. 2024)</p></ld-card></ld-deck></div><ld-supplemental><p>Pfade, die über die ganze Welt gehen, verhindern, dass der <span class="docutils literal">Entry-</span> und <span class="docutils literal">Exit-node</span> beim gleichen Anbieter liegen.</p><img class="screenshot align-center" src="images/tor-circuit.webp" alt="Tor-Circuit"><p><strong>Okt. 2026 – zu vermeidende Hoster</strong>:</p><pre class="code text literal-block"><code>Frantech / Ponynet / BuyVM (AS53667)
OVH SAS / OVHcloud (AS16276)
Online S.A.S. / Scaleway (AS12876)
Hetzner Online GmbH (AS24940)
IONOS SE (AS8560)
netcup GmbH (AS197540)
Psychz Networks (AS40676)
1337 Services GmbH / RDP.sh (AS210558)</code></pre></ld-supplemental></ld-topic>
<ld-topic id="tor-exit-nodes"><h2>Tor Exit Nodes</h2><p>Die Anzahl der <em>Exit Nodes</em> ist deutlich kleiner (Okt. 2026: ca. 2600 Einträge) als die Anzahl der Knoten.</p><ld-deck><ld-card><p>Dies liegt daran, dass die technischen Anforderungen höher sind (z. B. stabile IP Adressen) und insbesondere daran, dass die Betreiber der <em>Exit Nodes</em> darauf vorbereitet sein müssen ggf. (zahlreiche) Anfragen von den Behörden zu bekommen.<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></p><img class="screenshot align-center" src="images/tor-german-exit-node.webp" alt="Deutscher Tor *Exit Node* von der TU Berlin"></ld-card><ld-card class="incremental"><p>Weiterhin erlauben einige Hoster nicht das Betreiben von <em>Exit Nodes</em>.<a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a></p><img class="screenshot align-center" src="images/tor-provider-exit-node-policy.webp" alt="*Exite Node Policy* eines französichen Providers"></ld-card></ld-deck><ld-supplemental embed-in-document-flow=""><p>Reverse IP Lookup für 130.149.80.199 durchgeführt mit <a class="reference external" href="https://www.iplocation.net/ip-lookup">IP Location Service</a>.</p><p>Die (aktuell) geringe Anzahl an Exit Nodes ist ein (steigendes?) Problem, da es dadurch ggf. einfach(er) ist den Datenverkehr zu überwachen.</p></ld-supplemental><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://community.torproject.org/relay/community-resources/tor-exit-guidelines/">Tor - Exit Node Guidelines</a></p></aside><aside class="footnote brackets" id="footnote-2" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-2">2</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://community.torproject.org/relay/community-resources/good-bad-isps/">Tor - Good and Bad ISPs</a></p></aside></aside></ld-topic>
<ld-topic id="tor-relays-exit-policy"><h2>Tor Relays: <em>Exit Policy</em></h2><p>Jeder <em>Node</em> legt in seiner <em>Exit Policy</em> genau fest welchen Datenverkehr weiterleiten möchte:</p><ul class="simple"><li><p>Es gibt offene Exit Nodes, die alle Anfragen weiterleiten.</p></li><li><p>Es gibt Knoten, die die Daten nur an weitere Tor-Knoten weiterleiten.</p></li><li><p>Es gibt Knoten, die nur bestimmte Dienste (z. B. HTTPs) weiterleiten.</p></li><li><p>Es gibt „<em>private Exit Nodes</em>“, die nur zu einem bestimmten Netz Verbindungen aufbauen.</p></li></ul></ld-topic>
<ld-topic id="bedeutung-von-bridge-nodes-hier-webtunnel-bridges"><h2>Bedeutung von Bridge Nodes (hier: WebTunnel bridges)</h2><ld-deck><ld-card><blockquote class="epigraph"><p>The Tor Project has put out an urgent call to the privacy community asking volunteers to help deploy 200 new WebTunnel bridges by the end of the year to fight government censorship.</p><p>Currently, the Tor Project operates 143 WebTunnel bridges, which help users in heavily censored regions bypass internet access restrictions and website blocks.</p><p>This comes in response to increasing censorship in Russia, which Tor says currently impacts the browser's built-in censorship circumvention mechanisms, including obfs4 connections and Snowflake</p><p class="attribution">—28.11.2024 <a class="reference external" href="https://www.bleepingcomputer.com/news/security/tor-needs-200-new-webtunnel-bridges-to-fight-censorship/">Tor needs 200 new WebTunnel bridges to fight censorship</a></p></blockquote></ld-card><ld-card class="incremental"><blockquote class="epigraph"><p><em>How WebTunnels help bypass blocks</em></p><p>WebTunnels are a new type of bridge introduced by the Tor Project in March 2024,  specifically designed to blend Tor traffic with regular web traffic, making it harder for censors to detect and block.</p><p>The system achieves this by running over a web server with a valid SSL/TLS certificate, disguising Tor traffic as regular HTTPS traffic.</p><p>Contrary to standard Tor bridges that use specific protocols, like obfs4, which makes their identification easier, WebTunnel bridges "hide in plain sight." This allows them to be resistant to aggressive censorship.</p><p class="attribution">—28.11.2024 <a class="reference external" href="https://www.bleepingcomputer.com/news/security/tor-needs-200-new-webtunnel-bridges-to-fight-censorship/">Tor needs 200 new WebTunnel bridges to fight censorship</a></p></blockquote></ld-card><ld-card class="incremental"><blockquote class="epigraph"><p>Today, Tor launched a new campaign that runs until March 10, 2025, calling on volunteers to set up and maintain new WebTunnel bridges.</p><p>The requirements for participation are the following:</p><ul class="simple"><li><p>One WebTunnel bridge per IPv4; subdomains or distinct domains allowed.</p></li><li><p>Provide a valid email for confirmation.</p></li><li><p>Keep bridges running for at least 1 year.</p></li><li><p>Ensure near 24/7 uptime; reboots for updates allowed.</p></li><li><p><strong>Avoid hosting with Hetzner.</strong></p></li></ul><p class="attribution">—28.11.2024 <a class="reference external" href="https://www.bleepingcomputer.com/news/security/tor-needs-200-new-webtunnel-bridges-to-fight-censorship/">Tor needs 200 new WebTunnel bridges to fight censorship</a></p></blockquote></ld-card></ld-deck></ld-topic>
<ld-topic id="onion-services-hidden-services"><h2>Onion Services/Hidden Services<a class="brackets" href="#footnote-3" id="footnote-reference-3" role="doc-noteref"><span class="fn-bracket">[</span>3<span class="fn-bracket">]</span></a></h2><ld-deck><ld-card><ul class="incremental-list list-with-explanations"><li><p>Server, die Anfragen nur aus dem Tor-Netzwerk annehmen, werden als <em>Onion Services</em> (bzw. <em>Hidden Services</em>) bezeichnet.</p></li><li><p><span class="docutils literal">.onion</span> ist eine <em>Pseudo</em>-Top-Level-Domain, die für Onion Services verwendet wird.</p></li><li><p>Die Adresse eines Onion Services basiert auf dem öffentlichen Schlüssel des Servers.</p><p>Beispiel: Die Onion-Adresse <span class="docutils literal">https://duckduckgogg42xjoc72x3sjasowoarfbgcmvfimaftt6twagswzczad.onion/</span> gehört zu DuckDuckGo. Der öffentliche Schlüssel ist somit: <span class="docutils literal">duckduckgogg42xjoc72x3sjasowoarfbgcmvfimaftt6twagswzczad</span>.</p></li><li><p>Onion Services können nur über das Tor-Netzwerk erreicht werden.</p></li><li><p>Liste von öffentlichen Onion-Adressen: <a class="reference external" href="https://community.torproject.org/onion-services/#featured-onions">https://community.torproject.org/onion-services/#featured-onions</a></p><ld-supplemental><p>Onion-Adresse der EFF im Tor Netzwerk (Tor-Browser notwendig): <a class="reference external" href="https://www.iykpqm7jiradoeezzkhj7c4b33g4hbgfwelht2evxxeicbpjy44c7ead.onion/">https://www.iykpqm7jiradoeezzkhj7c4b33g4hbgfwelht2evxxeicbpjy44c7ead.onion</a></p></ld-supplemental></li><li><p>Sicher vor Person-in-the-Middle-Angriffen zwischen Client und Onion Service</p><ld-supplemental embed-in-document-flow=""><p>Normalerweise sind <em>Person-in-the-Middle</em>-Angriffe gegen HTTPS abgesicherte Verbindungen nicht möglich; so genannte <em>State-sponsored Actors</em> können jedoch in bestimmten Szenarien die Infrastruktur (<em>Certificate Authorities</em> (CAs)) zur Zertifikatsausstellung und Validierung kompromittieren und damit solche Angriffe durchführen. Bei Onion Services ist dies nicht in gleicher Weise möglich, da die Adresse des Onion Services auf dem öffentlichen Schlüssel basiert.</p></ld-supplemental></li></ul></ld-card><ld-card class="incremental"><!--added Jan 27, 2026:--><p><strong>Funktionsweise von Onion Services (Registrierung von Onion Services)</strong></p><ol class="arabic incremental-list list-with-explanations"><li><p>Der Onion Service generiert ein Schlüsselpaar (privat/öffentlich) und erstellt daraus seine Onion-Adresse.</p></li><li><p>Der Onion Service veröffentlicht seinen öffentlichen Schlüssel und einige <em>Introduction Points</em> (3 Stück) im Tor-Netzwerk.</p><p><em>Introduction Points</em> sind Tor-Knoten, die als Vermittler für Verbindungsanfragen dienen. Die Verbindungen zwischen dem Onion Service und den <em>Introduction Points</em> sind langlebig und werden im Directory des Tor-Netzwerks veröffentlicht.</p><ld-supplemental><p>Die Verbindungen zwischen Onion Service und <em>Introduction Point</em> gehen über das Tor-Netzwerk (drei Hops) und sind deshalb anonymisiert.</p></ld-supplemental></li></ol></ld-card><ld-card class="incremental"><!--added Jan 27, 2026:--><p><strong>Funktionsweise von Onion Services (Verbindung zu Onion Services)</strong></p><ol class="arabic incremental-list list-with-explanations simple" start="3"><li><p>Ein Client, der eine Verbindung zum Onion Service herstellen möchte, nutzt den öffentlichen Schlüssel des Onion Services und schlägt im Directory die Introduction Points nach und wählt einen <em>Rendezvous Point</em> aus (einen Tor-Knoten).</p></li><li><p>Der Client sendet eine Nachricht an den Onion Service über einen <em>Introduction Point</em>, in der er den ausgewählten <em>Rendezvous Point</em> angibt.</p></li><li><p>Der Onion Service sendet eine Nachricht an den <em>Rendezvous Point</em>, um die Verbindung mit dem Client herzustellen.</p></li><li><p>Der Client und der Onion Service kommunizieren.</p></li></ol></ld-card><ld-card class="incremental"><!--added Jan 27, 2026:--><p><strong>Sicherheit von Onion Services</strong></p><ul class="simple"><li><p>Die Trennung von Introduction Points und Rendezvous Points sorgt dafür, dass  der <em>Introduction Point</em> keine langlaufende Traffic-Analyse durchführen kann, um den Onion Service zu identifizieren.</p></li></ul></ld-card></ld-deck><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-3" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-3">3</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://community.torproject.org/onion-services/overview/">How Onion Services Work</a></p></aside></aside></ld-topic>
<ld-topic id="tor-browser"><h2>Tor-Browser</h2><p>Standardanwendung für den Zugriff auf das Tor-Netzwerk.</p><ld-deck><ld-card><img class="screenshot align-center" src="images/tor-onion-service-nyt.webp" alt="Tor-Browser mit New-York-Times (01.01.2024)"></ld-card><ld-card class="incremental"><p class="rubric">Sicherheitseinstellungen des Tor-Browsers</p><dl class="field-list simple"><dt>Standard<span class="colon">:</span></dt><dd><p>alle Browserfunktionen sind aktiviert.</p></dd><dt>Sicherer<span class="colon">:</span></dt><dd><p>JavaScript ist auf Nicht-HTTPS-Seiten deaktiviert. Wenn JavaScript aktiviert ist, dann sind die Leistungsoptimierungen deaktiviert. Audio und Video (HTML5-Medien) sowie WebGL werden nur nach Mausklick abgespielt.</p></dd><dt>Sicher<span class="colon">:</span></dt><dd><p>(zusätzlich) JavaScript ist immer deaktiviert. Einige Schriftarten, Symbole, mathematische Symbole und Bilder sind deaktiviert.</p></dd></dl></ld-card></ld-deck><ld-supplemental><p>Das Tor-Netzwerk erlaubt ggf. das Setzen des <em>Exit Nodes</em>, um zum Beispiel geografische Sperren zu umgehen. Entsprechende Dienstanbieter können dies jedoch leicht erkennen, da die Knoten des Tor Netzwerkes bekannt sind (<a class="reference external" href="https://check.torproject.org/torbulkexitlist">https://check.torproject.org/torbulkexitlist</a>) und verweigern dann den Zugriff.</p></ld-supplemental></ld-topic>
<ld-topic id="tor"><h2>Tor</h2><ul class="positive-list incremental list-with-explanations"><li><p>Schützt vor der Analyse des Datenverkehrs.</p><p>Von <a class="reference external" href="https://securedrop.org/">SecureDrop</a> wird zum Beispiel für Whistleblower empfohlen sich mit dem SecureDrop Service über Tor zu verbinden und erst dann Dokumente hochzuladen.</p></li><li><p>Der Tor-Browser schützt relativ effektiv vor Website-Fingerprinting.</p></li></ul><ul class="negative-list incremental simple"><li><p>Teilweise sehr langsam (insbesondere bei Onion Services).</p></li><li><p>Monitoring des Netzwerks ist an den Grenzen möglich.</p></li><li><p>Ende-zu-Ende Korrelation von Datenverkehr ist möglich.</p></li><li><p>Die Anonymität hängt auch von der Anzahl der Nutzer ab.</p></li></ul><ld-supplemental><p><em>Website Fingerprinting</em></p><p>Website Fingerprinting ermöglicht es die besuchten Websites anhand des Datenverkehrs zu identifizieren. Dabei wird nicht der Inhalt der Datenpakete analysiert, sondern die statistischen Eigenschaften des Datenverkehrs. Wie groß sind die Datenpakete (d. h. die ausgelieferten Dateien)? Wie viele Datenpakete werden wann verschickt? Wie lange dauert es bis ein Datenpaket verschickt wird (d. h. Geschwindigkeit der Webseite)? Wie lange dauert es bis ein Datenpaket ankommt?</p><p><em>(Cross-)Browser Fingerprinting</em></p><p>Durch das Sammeln vieler (auch kleiner) Informationen über den/die Browser und das Betriebssystem kann ein für praktische Zwecke hinreichend eindeutiger Fingerabdruck erstellt werden. Dieser kann dann zur Identifikation des Nutzers verwendet werden.</p><p>Kleiner Auszug aus den möglichen Informationen:</p><ul class="simple"><li><p>System Fonts</p></li><li><p>Werden Cookies unterstützt?</p></li><li><p>Betriebssystem</p></li><li><p>Betriebssystem Sprache</p></li><li><p>Keyboard layout</p></li><li><p>Art/Version des Browsers</p></li><li><p>verfügbare Sensoren: Beschleunigungssensor, Näherungssensor, Gyroskop</p></li><li><p>verfügbare Browser Plugins</p></li><li><p>HTTP-Header Eigenschaften</p></li><li><p>CPU Klasse</p></li><li><p>HTML 5 Canvas Fingerprinting</p></li><li><p>Unterstützung von Multitouch</p></li></ul><p><em>Monitoring des Netzwerks an den Grenzen</em></p><p>Hat in der Vergangenheit dazu geführt, dass Nutzer von Tor-Netzwerken identifiziert werden konnten.</p><p><em>Ende-zu-Ende Korrelation von Datenverkehr</em></p><p>Auch als <em>Traffic Confirmation</em> bekannt. Diese Art von Attacke ist möglich, wenn <em>Relays</em> am Anfang und am Ende der Verbindung kontrolliert werden. Die Angreifer können dann den Datenverkehr an beiden Enden beobachten und die Datenpakete korrelieren z. B. basierend auf statistischen Informationen über die Zeitpunkte und Volumen von Datenflüssen.</p></ld-supplemental></ld-topic>
