<ld-topic class="new-section transition-move-to-top" id="objekt-orientierte-programmierung-mit-java"><h2>Objekt-orientierte Programmierung mit Java</h2></ld-topic>
<ld-topic id="was-ist-objektorientierte-programmierung"><h2>Was ist Objektorientierte Programmierung?</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>Objektorientierte Programmierung (OOP) ist ein Programmierparadigma, das auf den Konzepten von Klassen und <strong>Objekten</strong> basiert, die Daten und Funktionen kapseln.</p></aside><dl class="incremental field-list simple"><dt>Hauptziele<span class="colon">:</span></dt><dd><p>Code <strong>erweiterbar</strong>, <strong>strukturierter</strong> und wiederverwendbar gestalten.</p></dd></dl><dl class="incremental field-list simple"><dt>Hauptprinzipien<span class="colon">:</span></dt><dd><ul class="simple"><li><p><strong>Kapselung</strong> (<span class="eng">Encapsulation</span>)</p></li><li><p><strong>Abstraktion</strong> (<span class="eng">Abstraction</span>)</p></li><li><p><strong>Vererbung</strong> (<span class="eng">Inheritance</span>) <span class="peripheral">(nächster Foliensatz)</span></p></li><li><p><strong>Polymorphie</strong> (<span class="eng">Polymorphism</span>) („vielerlei Gestalt“) <span class="peripheral">(nächster Foliensatz)</span></p></li></ul></dd></dl><ld-supplemental><p>Während es in der Anfangszeit Programmiersprachen gab, die neben der prozeduralen Programmierung insbesondere auch die objektorientierte Programmierung unterstützten, unterstützen heute fast alle Programmiersprachen auch weitere Paradigmen. Insbesondere die funktionale Programmierung.</p></ld-supplemental></ld-topic>
<ld-topic id="klassen"><h2>Klassen</h2><ld-story><dl class="field-list"><dt>Klasse<span class="colon">:</span></dt><dd><p>Ein Bauplan für Objekte, der beschreibt, welche Daten bzw. Attribute und Methoden ein Objekt haben kann.</p></dd><dt>Syntax<span class="colon">:</span></dt><dd><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="punctuation">&lt;</span><span class="name class">Modifikator</span><span class="punctuation">&gt;</span><span class="operator">*</span> <span class="keyword">class</span> <span class="punctuation">&lt;</span><span class="name class">Klassenname</span><span class="punctuation">&gt;</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">  <span class="punctuation">(</span><span class="punctuation">&lt;</span><span class="name class">Attributdeklarationen</span><span class="punctuation">&gt;</span><span class="operator">|</span><span class="punctuation">&lt;</span><span class="name class">Methodendeklarationen</span><span class="punctuation">&gt;</span><span class="punctuation">)</span><span class="operator">*</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="punctuation">}</span></code></pre></dd></dl><p class="incremental"><strong>Beispiele:</strong></p><ld-deck class="incremental"><ld-card><p class="rubric"><code class="java"><span class="name class">Auto</span></code> ist eine Klasse.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">Auto</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="comment single">// Attribute (gel. auch Felder (bzw. Fields) genannt)</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">private</span> <span class="name class">String</span> marke<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="keyword">private</span> <span class="keyword">int</span> geschwindigkeit<span class="punctuation">;</span> <span class="comment single">// _aktuelle_ Geschwindigkeit</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="comment single">// Methoden</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="keyword">void</span> <span class="name function">beschleunigen</span><span class="punctuation">(</span><span class="keyword">int</span> wert<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">        geschwindigkeit <span class="operator">+=</span> wert<span class="punctuation">;</span> <span class="comment single">// Zugriff auf das Attribut des Objektes</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="punctuation">}</span>
</code><small class="ln">10</small><code data-lineno="10"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric"><code class="java"><span class="name class">Button</span></code> (bei der Modellierung grafischer Benutzeroberflächen) ist eine Klasse.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">class</span> <span class="name class">Button</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">private</span> <span class="name class">String</span> text<span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">private</span> <span class="keyword">int</span> state<span class="punctuation">;</span> <span class="comment single">// 0: normal, 1: pressed, 2: disabled</span>
</code><small class="ln">4</small><code data-lineno="4">
</code><small class="ln">5</small><code data-lineno="5">    <span class="keyword">void</span> <span class="name function">registerListener</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric"><code class="java"><span class="name class">BigDecimal</span></code> (zur Repräsentation von Dezimalzahlen mit „beliebiger“ Präzision) ist eine Klasse.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">class</span> <span class="name class">BigDecimal</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">private</span> <span class="keyword">int</span> scale<span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">private</span> <span class="keyword">int</span> precision<span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">void</span> <span class="name function">add</span><span class="punctuation">(</span><span class="name class">BigDecimal</span> b<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric"><code class="java"><span class="name class">File</span></code> (zum Zugriff auf Dateien) ist eine Klasse.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">class</span> <span class="name class">File</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">private</span> <span class="name class">String</span> name<span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">private</span> <span class="keyword">long</span> size<span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">void</span> <span class="name function">read</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><div class="accentuate"><p>Klassen ermöglichen es uns über konkrete Objekte zu <strong>abstrahieren</strong>: Klassen sind eine Beschreibung vieler Objekte mit gleichen Eigenschaften und Verhalten.</p></div></ld-card><ld-card class="incremental"><div class="accentuate"><p>Durch die Verwendung von Sichtbarkeiten (insbesondere <code class="java"><span class="keyword">private</span></code> und ggf. <code class="java"><span class="keyword">protected</span></code>) ist der Zugriff auf die Attribute und Methoden einer Klasse von außen kontrollierbar. Wir sprechen hier von <strong>Kapselung</strong>.</p><p><span class="peripheral">Die privaten Daten eines Objekts (und ggf. einiger Methoden) sind also geschützt und können nur über die Methoden der Klasse manipuliert werden. Dabei können alle Objekte einer Klasse auf die Attribute eines anderen Objektes derselben Klasse zugreifen.</span></p></div></ld-card></ld-deck></ld-story><ld-supplemental><p>Pro Java Datei (Datei mit der Endung .java), darf nur eine Klasse mit dem Modifikator <code class="java"><span class="keyword">public</span></code> enthalten sein. Die Datei muss den Namen der Klasse haben.</p></ld-supplemental></ld-topic>
<ld-topic id="objekte"><h2>Objekte</h2><p>Sichtweisen:</p><ul class="simple"><li><p>Objekte sind Instanzen von Klassen, die durch den Bauplan der Klasse definiert sind und durch spezifische Werte der Attribute charakterisiert werden.</p></li><li><p>Objekte haben eine Identität und einen konkreten, eigenen Zustand.</p></li></ul></ld-topic>
<ld-topic id="objekterzeugung-instanziierung-einer-java-klasse"><h2>Objekterzeugung/Instanziierung einer Java Klasse</h2><ld-story><p>Um ein Objekt zu erzeugen bzw. eine Klasse zu instanziiern, wird der <code class="java"><span class="keyword">new</span></code> Operator verwendet. Der <code class="java"><span class="keyword">new</span></code> Operator ...</p><ul class="incremental-list"><li><p>reserviert den benötigten Speicher für die Attribute, und stellt sicher, dass alle Attribute mit dem Defaultwert initialisiert sind.</p></li><li><p>ruft dann den <em>Konstruktor</em> der Klasse auf.</p><p>Der Konstruktor ist eine spezielle Methode, die einmalig beim Erzeugen eines Objekts aufgerufen wird und der Initialisierung des Objekts dient.</p></li></ul><dl class="incremental-list field-list simple"><dt>Syntax<span class="colon">:</span></dt><dd><p><code class="java"><span class="keyword">new</span> <span class="punctuation">&lt;</span><span class="name class">Klassenname</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">&lt;</span><span class="name class">Parameter</span><span class="punctuation">&gt;</span><span class="punctuation">)</span></code></p></dd></dl><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p><code class="java">meinAuto</code> referenziert ein Objekt der Klasse <code class="java"><span class="name class">Auto</span></code>.</p><pre class="code java fade-out copy-to-clipboard literal-block"><code><span class="keyword">class</span> <span class="name class">Auto</span> <span class="punctuation">{</span>
    <span class="name class">String</span> marke<span class="punctuation">;</span>           <span class="comment single">// der Standardwert ist null</span>
    <span class="keyword">int</span> geschwindigkeit<span class="punctuation">;</span>    <span class="comment single">// der Standardwert ist 0</span>

    <span class="keyword">void</span> <span class="name function">beschleunigen</span><span class="punctuation">(</span><span class="keyword">int</span> wert<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span>
<span class="punctuation">}</span></code></pre><pre class="code java copy-to-clipboard literal-block"><code><span class="keyword">var</span> meinAuto <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Auto</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// Aufruf des impliziten Konstruktors</span></code></pre></aside></ld-story><ld-supplemental><p>Der Konstruktor ist eine spezielle Methode, die nur beim Erzeugen eines Objekts aufgerufen wird. Wird kein Konstruktor explizit definiert, wird ein (impliziter) Standardkonstruktor verwendet.</p><p>Der implizite Konstruktor ist ein Konstruktor, der automatisch vom Java compiler generiert wird, wenn kein Konstruktor explizit definiert wurde. Der implizite Konstruktor hat keine Parameter und initialisiert die Attribute mit Standardwerten.</p></ld-supplemental></ld-topic>
<ld-topic id="variablen-die-auf-objekte-verweisen"><h2>Variablen, die auf Objekte verweisen</h2><ld-deck><ld-card><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Deklaration und Initialisierung einer Objektvariablen.</p><pre class="code java fade-out copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">class</span> <span class="name class">Rectangle</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">int</span> width<span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">int</span> height<span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">int</span> x<span class="punctuation">;</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="keyword">int</span> y<span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="punctuation">}</span></code></pre><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">Rectangle</span> a <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Rectangle</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre><p>bzw.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">var</span> b <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Rectangle</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre></aside></ld-card><ld-card class="incremental"><ul><li><p>Objektvariablen sind <em>Referenzvariablen</em> und werden durch den Klassennamen gefolgt von einem Variablennamen deklariert.</p><dl class="incremental field-list simple"><dt>Syntax<span class="colon">:</span></dt><dd><p><code class="java"><span class="punctuation">&lt;</span><span class="name class">Klassenname</span><span class="punctuation">&gt;</span> <span class="punctuation">&lt;</span><span class="name class">Variablenname</span><span class="punctuation">&gt;</span></code></p></dd></dl></li></ul><ul class="incremental simple"><li><p>Die Referenzvariable speichert eine Referenz (wie bei Feldern/Arrays) auf ein Objekt der Klasse.</p></li><li><p>Bei Objekten gelten die gleichen Regeln beim Kopieren und Vergleichen wie bei Arrays (z. B. bzgl. des <code class="java"><span class="operator">==</span></code> Operators).</p></li><li><p>Objektvariablen können überall dort deklariert werden, wo auch andere Variablen (für primitive Datentypen) deklariert werden können.</p></li><li><p>Wie bei Arrays ist der Standardwert für Objektvariablen <code class="java"><span class="keyword">null</span></code> und bedeutet, dass diese Variable auf <em>kein</em> Objekt verweist.</p></li></ul></ld-card><ld-card class="incremental"><ul class="simple"><li><p>Der Typ der Variablen ist durch die Klasse bestimmt.</p></li><li><p>Der Name des Typs ist somit der Klassenname.</p></li><li><p>Überall, wo ein primitiver Typ verwendet werden kann, kann auch der Typ eines Objektes verwendet werden.</p></li></ul><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">boolean</span> <span class="name function">compare</span><span class="punctuation">(</span><span class="name class">Rectangle</span> a<span class="punctuation">,</span> <span class="name class">Rectangle</span> b<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">}</span> <span class="comment single">// Parameter</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name class">Person</span> <span class="name function">copy</span><span class="punctuation">(</span><span class="name class">Person</span> a<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">}</span>                     <span class="comment single">// Rückgabetyp</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="keyword">double</span> <span class="name function">sum</span><span class="punctuation">(</span><span class="name class">Rectangle</span><span class="punctuation">[</span><span class="punctuation">]</span> rectangles<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">}</span>        <span class="comment single">// Arrays</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="keyword">double</span> <span class="name function">intersect</span><span class="punctuation">(</span><span class="name class">Circle</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> circles<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">}</span>       <span class="comment single">// Varags</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="keyword">class</span> <span class="name class">Student</span> <span class="punctuation">{</span> <span class="keyword">private</span> <span class="name class">String</span> s<span class="punctuation">;</span> <span class="punctuation">}</span>           <span class="comment single">// Attribute</span>
</code><small class="ln">6</small><code data-lineno="6">
</code><small class="ln">7</small><code data-lineno="7"><span class="name class">Car</span> c <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Car</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">8</small><code data-lineno="8"><span class="name class">Rectangle</span><span class="punctuation">[</span><span class="punctuation">]</span> rs <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Rectangle</span><span class="punctuation">[</span><span class="literal number integer">10</span><span class="punctuation">]</span><span class="punctuation">;</span>
</code><small class="ln">9</small><code data-lineno="9"><span class="name class">Rectangle</span><span class="punctuation">[</span><span class="punctuation">]</span> rs <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Rectangle</span><span class="punctuation">[</span><span class="punctuation">]</span><span class="punctuation">{</span><span class="keyword">new</span> <span class="name class">Rectangle</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">,</span> <span class="keyword">new</span> <span class="name class">Rectangle</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">}</span><span class="punctuation">;</span></code></pre></aside></ld-card><ld-card class="incremental"><p class="rubric">Exemplarische Speicherbelegung</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">Rectangle</span> a <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Rectangle</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name class">Rectangle</span> b <span class="operator">=</span> a<span class="punctuation">;</span></code></pre><object class="align-center" data="images/objekte.svg" type="image/svg+xml" role="img" aria-label="Objekte im Speicher" width="1800px"></object></ld-card></ld-deck></ld-topic>
<ld-topic id="bereinigung-von-objekten"><h2>Bereinigung von Objekten</h2><p>Verweist keine Referenzvariable mehr auf ein Objekt im Speicher, dann wird es automatisch vom <em>Garbage Collector</em> aus dem Speicher entfernt, d. h. der Entwickler muss sich nicht explizit um die Speicherbereinigung kümmern.</p><p>Es ist insbesondere nicht notwendig, Referenzvariablen auf <code class="java"><span class="keyword">null</span></code> zu setzen.</p><div class="accentuate"><p>Java unterstützt automatische <em>Garbage Collection</em>.</p></div></ld-topic>
<ld-topic id="objekte-und-die-selbstreferenz-this"><h2>Objekte und die Selbstreferenz <span class="docutils literal">this</span></h2><ld-story><dl class="field-list simple"><dt>Objekt<span class="colon">:</span></dt><dd><p>Eine Instanz einer Klasse.</p></dd><dt>Definition<span class="colon">:</span></dt><dd><p><code class="java"><span class="keyword">this</span></code> ist eine Referenz auf das aktuelle Objekt. Es wird verwendet, um auf die Attribute und Methoden des aktuellen Objekts zuzugreifen.</p></dd></dl><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">Auto</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="name class">String</span> marke<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">int</span> geschwindigkeit<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="keyword">void</span> <span class="name function">beschleunigen</span><span class="punctuation">(</span><span class="keyword">int</span> wert<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="keyword">this</span><span class="punctuation">.</span>geschwindigkeit <span class="operator">+=</span> wert<span class="punctuation">;</span> <span class="comment single">// this. ist hier optional</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="punctuation">}</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="name class">String</span> <span class="name function">alsString</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">        <span class="keyword">return</span> <span class="literal string">"Auto: "</span> <span class="operator">+</span> <span class="keyword">this</span><span class="punctuation">.</span>marke <span class="operator">+</span> <span class="literal string">" "</span> <span class="operator">+</span> <span class="comment single">/*this.*/</span>geschwindigkeit<span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10">    <span class="punctuation">}</span>
</code><small class="ln">11</small><code data-lineno="11"><span class="punctuation">}</span>
</code><small class="ln">12</small><code data-lineno="12"></code></pre></aside></ld-story><ld-supplemental><p>Wenn es keine Zweideutigkeit gibt, dann kann auf die Angabe von <code class="java"><span class="keyword">this</span></code> verzichtet werden.
(Lokale Parameter und Variable überschatten ggf. Attribute der Klasse mit dem gleichen Namen.)</p></ld-supplemental></ld-topic>
<ld-topic id="explizite-konstruktoren"><h2>Explizite Konstruktoren</h2><ld-deck><ld-card><p>Ein Konstruktor hat immer den Namen der Klasse und kann Parameter enthalten. Ein Konstruktor hat keinen Rückgabewert.</p><dl class="field-list simple"><dt>Syntax<span class="colon">:</span></dt><dd><p><code class="java"><span class="punctuation">&lt;</span><span class="name class">Klassenname</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">&lt;</span><span class="name class">Parameter</span><span class="punctuation">&gt;</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span></code></p></dd></dl><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">Auto</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="name class">String</span> marke<span class="punctuation">;</span>           <span class="comment single">// der Standardwert ist null</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">int</span> geschwindigkeit<span class="punctuation">;</span>    <span class="comment single">// der Standardwert ist 0</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="name class">Auto</span><span class="punctuation">(</span><span class="name class">String</span> marke<span class="punctuation">,</span> <span class="keyword">int</span> geschwindigkeit<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="comment single">// ⚠️ "this." ist notwendig,</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">        <span class="comment single">//   zur Unterscheidung von Parameter und Attribut</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">        <span class="keyword">this</span><span class="punctuation">.</span>marke <span class="operator">=</span> marke<span class="punctuation">;</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">        <span class="keyword">this</span><span class="punctuation">.</span>geschwindigkeit <span class="operator">=</span> geschwindigkeit<span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10">    <span class="punctuation">}</span>
</code><small class="ln">11</small><code data-lineno="11"><span class="punctuation">}</span></code></pre><pre class="code java incremental copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">var</span> meinAuto <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Auto</span><span class="punctuation">(</span><span class="literal string">"BMW"</span><span class="punctuation">,</span><span class="literal number integer">0</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// Aufruf des Konstruktors</span></code></pre></aside></ld-card><ld-card class="incremental"><p>Ein Konstruktor kann auch andere Konstruktoren der Klasse aufrufen.  Der „Methodenname“ der anderen Konstruktoren ist in diesem Fall <code class="java"><span class="keyword">this</span></code>.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">Auto</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="name class">String</span> marke<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">int</span> geschwindigkeit<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="name class">Auto</span><span class="punctuation">(</span><span class="name class">String</span> marke<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">this</span><span class="punctuation">.</span>marke <span class="operator">=</span> marke<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="name class">Auto</span><span class="punctuation">(</span><span class="name class">String</span> marke<span class="punctuation">,</span> <span class="keyword">int</span> geschwindigkeit<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">        <span class="keyword">this</span><span class="punctuation">(</span>marke<span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// Aufruf des anderen Konstruktors</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">
</code><small class="ln">10</small><code data-lineno="10">        <span class="keyword">this</span><span class="punctuation">.</span>geschwindigkeit <span class="operator">=</span> geschwindigkeit<span class="punctuation">;</span>
</code><small class="ln">11</small><code data-lineno="11">    <span class="punctuation">}</span>
</code><small class="ln">12</small><code data-lineno="12"><span class="punctuation">}</span></code></pre><pre class="code java incremental copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">void</span> <span class="name function">main</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>  <span class="keyword">new</span> <span class="name class">Auto</span><span class="punctuation">(</span><span class="literal string">"VW"</span><span class="punctuation">,</span> <span class="literal number integer">0</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span></code></pre></aside></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Die Anzahl der Dinge, die vor dem Aufruf eines Konstruktors gemacht werden können, ist sehr begrenzt, damit eine konsistente Initialisierung gewährleistet ist.</p><p>Es ist zum Beispiel nicht möglich andere Methoden des Objekts aufzurufen (d. h. Aufrufe auf <code class="java"><span class="keyword">this</span></code> sind nicht möglich).</p></aside><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Erst seit Java 22 ist es überhaupt möglich, dass vor dem Aufruf eines anderen Konstruktors Code ausgeführt werden darf.</p></aside></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel: (seit Java 22)</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">Auto</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="name class">String</span> marke<span class="punctuation">;</span> <span class="keyword">int</span> geschwindigkeit<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="name class">Auto</span><span class="punctuation">(</span><span class="name class">String</span> marke<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">this</span><span class="punctuation">.</span>marke <span class="operator">=</span> marke<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="name class">Auto</span><span class="punctuation">(</span><span class="name class">String</span> marke<span class="punctuation">,</span> <span class="keyword">int</span> geschwindigkeit<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">        <span class="keyword">if</span> <span class="punctuation">(</span>geschwindigkeit <span class="operator">&lt;</span> <span class="literal number integer">0</span><span class="punctuation">)</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">            <span class="keyword">throw</span> <span class="keyword">new</span> <span class="name class">IllegalArgumentException</span><span class="punctuation">(</span><span class="literal string">"Geschw. &lt; 0"</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">        <span class="keyword">this</span><span class="punctuation">.</span>geschwindigkeit <span class="operator">=</span> geschwindigkeit<span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10">        <span class="keyword">this</span><span class="punctuation">(</span>marke<span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// Aufruf des anderen Konstruktors</span>
</code><small class="ln">11</small><code data-lineno="11">    <span class="punctuation">}</span>
</code><small class="ln">12</small><code data-lineno="12"><span class="punctuation">}</span></code></pre></aside></ld-card><ld-card class="incremental"><p class="rubric">Initialisierungsfolge</p><ol class="arabic simple"><li><p>Initialisierung der Attribute mit Standardwerten</p></li></ol><ol class="arabic incremental list-with-explanations" start="2"><li><p>Aufruf des Konstruktors des expliziten Konstruktors, wenn angegeben sonst des impliziten Konstruktors.</p><p>(Dies führt ggf. zu weiteren Konstruktoraufrufen.)</p></li></ol></ld-card></ld-deck></ld-topic>
<ld-topic id="verwendung-eines-objektes"><h2>Verwendung eines Objektes</h2><p>Auf sichtbare Attribute und Methoden eines beliebigen Objektes kann über den <strong>Punktoperator</strong> zugegriffen werden.</p><dl class="field-list simple"><dt>Syntax<span class="colon">:</span></dt><dd><p><code class="java"><span class="punctuation">&lt;</span><span class="name class">Objektinstanz</span><span class="punctuation">&gt;</span><span class="punctuation">.</span>&lt;<span class="name class">Attribut</span><span class="operator">/</span><span class="name class">Methode</span><span class="operator">&gt;</span></code></p></dd></dl><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p><span class="docutils literal">meinAuto</span> referenziert ein Objekt der Klasse <span class="docutils literal">Auto</span>.</p><pre class="code java fade-out literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">class</span> <span class="name class">Auto</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name class">String</span> marke<span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">int</span> geschwindigkeit<span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">void</span> <span class="name function">beschleunigen</span><span class="punctuation">(</span><span class="keyword">int</span> wert<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span></code></pre><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">var</span> meinAuto <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Auto</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2">meinAuto<span class="punctuation">.</span>marke <span class="operator">=</span> <span class="literal string">"BMW"</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">meinAuto<span class="punctuation">.</span><span class="name function">beschleunigen</span><span class="punctuation">(</span><span class="literal number integer">10</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre></aside></ld-topic>
<ld-topic id="kapselung-encapsulation"><h2>Kapselung (<span class="eng">Encapsulation</span>)<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></h2><dl class="dd-margin-left-4em field-list"><dt>Ziel<span class="colon">:</span></dt><dd><p>Daten eines Objekts vor direktem Zugriff von außen schützen.</p><p>Best Practice: Zugriff auf Daten erfolgt über öffentliche <strong>Getter</strong> (Methoden, die mit <code class="java">get</code> anfangen) und <strong>Setter</strong> (Methoden, die mit <code class="java">set</code> anfangen). Alle Attribute (außer Konstanten) sollten <strong>privat</strong> sein.</p></dd></dl><dl class="dd-margin-left-4em incremental field-list"><dt>Vorteile<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Schutz der Datenintegrität</p></li><li><p>Kontrollierter Zugriff auf die Daten; fördert die Wartbarkeit</p></li></ul><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">class</span> <span class="name class">Auto</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">private</span> <span class="keyword">int</span> geschwindigkeit<span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">public</span> <span class="keyword">int</span> <span class="name function">getGeschwindigkeit</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">return</span> geschwindigkeit<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">public</span> <span class="keyword">void</span> <span class="name function">setGeschwindigkeit</span><span class="punctuation">(</span><span class="keyword">int</span> geschwindigkeit<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">5</small><code data-lineno="5">        <span class="keyword">if</span> <span class="punctuation">(</span>geschwindigkeit <span class="operator">&gt;=</span> <span class="literal number integer">0</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">6</small><code data-lineno="6">            <span class="keyword">this</span><span class="punctuation">.</span>geschwindigkeit <span class="operator">=</span> geschwindigkeit<span class="punctuation">;</span>
</code><small class="ln">7</small><code data-lineno="7"><span class="punctuation">}</span>   <span class="punctuation">}</span>   <span class="punctuation">}</span></code></pre></aside></dd></dl><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Kapselung dient vor allem dem Programming-in-the-Large.</p></aside></aside><ld-supplemental><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Die Benennung von Gettern und Setter - wie dargestellt - ist umbedingt einzuhalten. Dies ist eine so etablierte Konvention, dass sie in den meisten modernen IDEs und vielen Tools automatisch unterstützt wird und auch von erweiterten Sprachkonstrukten genutzt wird.</p></aside><p>Die Unterstützung von Sichtbarkeitskonzepten variieren von Programmiersprache zu Programmiersprache sehr stark. Sprachen wie zum Beispiel Python bieten diesbezüglich zum Beispiel deutlich weniger oder gar keine Konzepte. Obwohl fast alle Sprachen zumindest grundlegende Mechanismen für die Unterscheidung zwischen privaten und öffentlichen Daten und Methoden bieten. Sprachen wie Scala bieten jedoch noch weit ausgefeiltere Konzepte.</p></ld-supplemental></ld-topic>
<ld-topic class="exercises transition-move-to-top" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Bibliothek - Grundgerüst"><p class="ld-exercise-title rubric"><span>Bibliothek - Grundgerüst</span></p><p>Entwickeln Sie die Klassen <code class="java"><span class="name class">Buch</span></code>, <code class="java"><span class="name class">Exemplar</span></code>, <code class="java"><span class="name class">Benutzer</span></code>, <code class="java"><span class="name class">Bibliothek</span></code>.</p><div class="dd-margin-left-8em"><p>Die Klassen haben die folgenden Attribute:</p><dl class="field-list simple"><dt>Bücher<span class="colon">:</span></dt><dd><p>Titel, ISBN, Jahr, Autoren</p></dd><dt>Exemplare<span class="colon">:</span></dt><dd><p>Exemplar-Nummer, Regal, Position</p></dd><dt>Benutzer<span class="colon">:</span></dt><dd><p>Benutzer-Nummer, Vorname, Nachname</p></dd><dt>Bibliotheken<span class="colon">:</span></dt><dd><p>Name der zugehörigen Institution, Standort</p></dd></dl><p>Es soll weiterhin gelten:</p><ul class="simple"><li><p>Ein Buch hat max. 10 Exemplare.</p></li><li><p>Ein Exemplar kann durch max. einen Benutzer ausgeliehen sein.</p></li><li><p>Eine Bibliothek hat max. 100 Bücher und max. 20 Benutzer.</p></li></ul></div><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:W37ZvYv7GioaklrlUh5Uq1B2SB80vXXTYFivgiRszfo=:mq5DfLkvaBtJtaQe:p/HoXe4vSDvZXMTKOCX22tg8Zzg3x9rPE3tGlSYqsaoK3/Bt/xCOGv78r5gs8OVqAbLk6OMvm9agc9VkjOYkkYpeV+6KnPCvzrKLpG6Q6wvSciLMkUOzkHkL53TlUIv9bx3Kor2pKW0UkEPAyJ9hrCXwj/XTu/M93Y79kwknWsZzFBdFaAHZfAYPfyouMyF6w0Z2k8vGyKJNpOxJaanJAA4vynEUVbBg2qsi1pv1rCc//ZE5Mxy74GH6mAUHkWet8v3jl1rjm8oAhU1spYbPKS8NspdoBX4welU543tc3ZXPAIceBhmqGRxFQTCnKMPrLU4+MaC9tzkXzpdVICM+CDRo26M4GOs25ZCRfZpNt/sb3Zu2L1ca7ux2Eg8XR6fxEwo5DgpQSqmrK8u25wrfdOL1JU1c5dbHJeqG0RpMuQmvHP0EQVOTJ7gWsDPC94CAtA3hlOGwqqK4Nx1La9fpM8EKWW6rRL4VaoTCZ3jsjiXQGufKLKAD3V6zYkrl7WSE7vJ+t6HKHi0BV+lMgRaI0CfDfbaX3fqhu <ld-topic class="exercises transition-move-to-top" id="ubung-1"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Bibliothek"><p class="ld-exercise-title rubric"><span>Bibliothek</span></p><ul><li><p>Entwickeln Sie Konstruktoren und folgende Methoden für die jeweiligen Klassen:</p><dl class="dd-margin-left-8em field-list simple"><dt>Buch<span class="colon">:</span></dt><dd><p><code class="java"><span class="name function">addExemplar</span><span class="punctuation">(</span><span class="name class">Exemplar</span> ex<span class="punctuation">)</span></code>, um ein Exemplar hinzuzufügen</p></dd><dt>Exemplar<span class="colon">:</span></dt><dd><p><code class="java"><span class="name function">verleihe</span><span class="punctuation">(</span><span class="name class">Benutzer</span> b<span class="punctuation">)</span></code>, um ein Buch auszuleihen</p></dd><dt>Biblitohek<span class="colon">:</span></dt><dd><p><code class="java"><span class="name function">addBenutzer</span><span class="punctuation">(</span><span class="name class">Benutzer</span> b<span class="punctuation">)</span></code>, <code class="java"><span class="name function">addBuch</span><span class="punctuation">(</span><span class="name class">Buch</span> b<span class="punctuation">)</span></code></p></dd><dt>Alle Klassen<span class="colon">:</span></dt><dd><p><code class="java"><span class="name function">print</span><span class="punctuation">(</span><span class="punctuation">)</span></code>, um alle Attribute auf der Kommandozeile auszugeben</p></dd></dl></li><li><p>Entwickeln Sie eine <code class="java"><span class="name function">main</span><span class="punctuation">(</span><span class="punctuation">)</span></code>-Methode, die eine Bibliothek der DHBW Mannheim erzeugt mit dem Standort Coblitzallee. Der Bibliothek sollen mindestens zwei Bücher und zwei Benutzer und jedem Buch mindestens ein Exemplar zugeordnet werden. Jeweils ein Exemplar ist an ei <ld-topic class="exercises transition-move-to-top" id="ubung-2"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-3" data-exercise-id="3" data-exercise-title="3 - Patientenakte - die Klasse Patient"><p class="ld-exercise-title rubric"><span>Patientenakte - die Klasse Patient</span></p><ul class="simple"><li><p>Die Klasse Patient hat folgende Attribute das Geburtsdatum (<code class="java"><span class="name class">String</span> geburtsdatum</code>), einen <code class="java"><span class="name class">Namen</span> <span class="punctuation">(</span><span class="name class">String</span> name<span class="punctuation">)</span></code>, ein Gewicht in Kilogramm (<code class="java"><span class="keyword">double</span> gewicht</code>) und eine Größe in Zentimetern (<code class="java"><span class="keyword">int</span> groesse</code>).</p></li><li><p>Definieren Sie einen Konstruktor, der es ermöglicht einen Patienten wie folgt zu erzeugen: <code class="java"><span class="keyword">new</span> <span class="name class">Patient</span><span class="punctuation">(</span><span class="literal string">"24.12.2024"</span><span class="punctuation">,</span> <span class="literal string">"Max Müller"</span><span class="punctuation">,</span> <span class="literal number integer">180</span><span class="punctuation">,</span> <span class="literal number integer">80d</span><span class="punctuation">)</span></code></p></li><li><p>In einer (externen) <code class="java">main</code> Methode:</p><ul class="simple"><li><p>Legen Sie mehrere Patienten an und speichern Sie diese in einem Array <code class="java">patienten</code>.</p></li><li><p>Schreiben Sie eine Methode, die die Durchschnittsgröße aller Patienten berechnet. Rufen Sie die Methode auf und geben Sie das Ergebnis aus.</p></li></ul></li></ul><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:G0FuO4v9Z1Bc0geT901G2biXaNtOv6f5GIWqpVDoM1Q=:pkuUXcg/ZPaB4Ssz:n/epDEwxlhFYVtCcRXB4qxx8Xr2BCnOCW1nW4oIyQ7v9n/IJC3un7mv7og3JfzpUMyj3kAa8sogA5W4 <ld-topic class="exercises transition-move-to-top" id="ubung-4"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-5" data-exercise-id="5" data-exercise-title="5 - Patient und Arzt"><p class="ld-exercise-title rubric"><span>Patient und Arzt</span></p><ul class="list-with-explanations"><li><p>Legen Sie eine Klasse Arzt an, die ein privates Attribut vom Typ Array („Feld“) von Patienten hat.</p></li><li><p>Fügen Sie der Klasse Arzt eine Methode <code class="java">addPatient</code> hinzu, die ein neues Array erzeugt, das alle bisherigen Patienten des Arztes und den neuen Patienten enthält. Stellen Sie sicher, dass der Patient nur einmal hinzugefügt wird. Sollte der Patient schon in der Liste sein, dann passiert nichts.</p><p>(Gehen Sie für diese Aufgabe davon aus, dass jeder echte Patient immer nur durch genau ein Objekt repräsentiert wird.)</p></li><li><p>Verschieben Sie die Methode zur Berechnung der Durschnittsgröße in die Klasse Arzt, um die Durschnittsgröße aller Patienten des Arztes zu berechnen.</p></li></ul><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:hc7ImLiOIgaR0a134Sv3+Nt2+SuESBRmipnkb5Ys/Ww=:rYMmfOy4lCL0JSHL:yL0AMEPvsjDf422RbmB75FSj8asBUlT7+DxL5YDPlVcpxBuF+N9sgpec3POoaFDcuHx0dLujxK21jCflb7IE9q5ziREVR4Gr2EL3C1Hhs+wcVv7WJ7onFY3zAwPZsV/sKIyGbu5/VEjsH5nzuWEsvUB3FU0UZ6LCv17LawlCvuFmzO1KfIOSaRyAlt0S0RN5p4cSYUh5h5fGy0Zdjw3AGfBe7PesQjtQDvrktraUkeoLW02DS3uaCYrd7k+i2dArrKwpDJRITf4jtvq6vDPI2076wUR1g6aSpkhQzs0wEtaVY/LT9Sp6UavbwZFf1FiOF9YLKmoKP5nxn63bq1WgzJqXkTby88YP0+F4iblNySPIoKW4j4KcOql1BFVUA3RtX4tKNlz2N27TvRuttgtBigAzkefzmMxBbdUdAZHB3GwTcyjhTYyH1DhB2aOpTtFjkSMU2SRYiJINfjGzRr3hrTeQDnXmrT8Lx5Y5HjlUAZoERqAYAvceTvdoOVDIeg6gKkZWL7AlHjr+dgY1JL/8IdVTUHwISqe4usGQg/vfcCj3qh1bFsD5luz0u95rlNIOtWS3mZuvFjctkcb1VPSi+8nDam8Z6uVwE81A0BIaFLlJIoncnEoAj+mTzsOWP2gopGGfgN4osqQjR8s6iHlrjO9QVxVNq/9S47e0WAsBwI2uHrS95gn1Kq9xOjXFgOA+LrR3oxTnWEtiCwXqGIx62qNQdEI7vMuCSrrBC2hFd+zQURViuCwrFJ0TmzUFz5AZvQx7eYNYio8yX+rtnfmA9Xc39ipXU5HvaEbkwVkA47lWbJaVHuhQI+oiLshnv6qes61gVCbLih
