<ld-topic id="kerninhalte-gem-mhb"><h2>Kerninhalte gem. MHB</h2><ul class="simple"><li><p>Terminologie, Konzepte, Architekturen, Anforderungsprofile und Architekturmodelle für verteilte Systeme</p></li><li><p>Entwurfs- und Implementierungsansätze</p></li><li><p>Vergleich unterschiedlicher Middleware-Konzepte</p></li><li><p>Synchrone und asynchrone Kommunikation, entfernter Methodenaufruf</p></li><li><p>Asynchrone Kommunikation und Messaging-Systeme</p></li><li><p>Sicherheitsaspekte in verteilten Systemen</p></li></ul></ld-topic>
<ld-topic id="prufungsleistung-portfolio"><h2>Prüfungsleistung - Portfolio</h2><aside class="admonition admonition-hintergrund"><p class="admonition-title">Hintergrund</p><ul class="simple"><li><p>das Modul hat 55 VL</p></li><li><p>Verteilte Systeme hat 22VL</p></li><li><p>Die verteilte Systeme geht mit <strong>50</strong> von 120 Modulpunkten ein</p></li></ul></aside><ul class="simple"><li><p>2 Bestandteile:</p><ol class="arabic dhbw simple"><li><p>Vorträge - max. 15 Punkte - 20 Minuten pro Person</p></li><li><p>Programmieraufgabe - max. 35 Punkte</p></li></ol></li></ul><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Personen, die gemeinsam einen Vortrag halten, sollten bei der Programmieraufgabe nicht im selben Team sein.</p></aside></ld-topic>
<ld-topic id="vortrage-rahmenbedingungen"><h2>Vorträge - Rahmenbedingungen</h2><ul class="list-with-explanations"><li><p>Die Präsentationen sollen sich insbesondere mit den Kerninhalten der Vorlesung beschäftigen und insbesondere konzeptioneller Natur sein.</p><p>D. h. nach der Darstellung des Anwendungszweckes gilt es die Architektur darzustellen, wie mit Fehlern umgegangen wird, welche Services angeboten werden, welche Garantien/Sicherheitsaspekte umgesetzt werden, wie wird die Skalierbarkeit erreicht, etc.</p><p>Keine Werbevorträge!</p></li><li><p>Die Präsentationen sind am Abend vor dem ausgemachten Termin hochzuladen in Moodle.</p></li><li><p>Die Vortragenden sollten während des Vortrags nicht mehrfach rotieren.</p><p>D. h. gefordert ist, dass erst der erste Vortragende seinen Teil vollständig vorträgt, dann der zweite, usw.. Dies ist für die Notenfindung erforderlich.</p></li></ul></ld-topic>
<ld-topic id="vortrage-themen"><h2>Vorträge - Themen</h2><ld-presenter-note encrypted="">MTAwMDAw:hpP5FnCkvdWnAZuRMpcjuCj/DHi/8HCxwvLT2bU89vM=:H9QSPTMqYc/K6vuT:QNf78pDfvJVtkae2O81yimdp2WaXaPhlVjvSNrLVGY+cWlrkPC7z7uVN7+VYs+9bSpbaIBBp36vabE4nFeatoVXwjqTN2j/VMmqc+o+0JN5f80S+5o93X7QPVUmdnfOOq57oqhGkUC6Y75OpCSvU0jTaYXekM2HFoOzpdK/TO0fy9xsWVtaAf7P04Y58eqsn4WDUg8PFHsivZKqOw/vz8MlGckbm58cKxm/QXno5MYau6SePkIJk1j8cfBnQzPSA8qAcoSImkZONUjnGWucfaqjsWYdbXP5f4xF3H7KCRbjh1SXpHIQKoHpvFZ2WIQUfxhkNDsOMu/J2lQmC39CeCLwcYWcKOvAAVytp</ld-presenter-note><ld-story><p class="rubric">Themen, die zu besetzen sind</p><table class="booktabs incremental-table-rows" style="width: 100%;"><colgroup><col style="width: 70.0%"><col style="width: 30.0%"></colgroup><thead><tr><th class="head"><p>Thema</p></th><th class="head"><p>Anzahl Stud.</p></th></tr></thead><tbody><tr><td><p><strong>Byzantine faults</strong> <a class="reference external" href="https://en.wikipedia.org/wiki/Byzantine_fault">🔗</a></p></td><td><p>1 Stud.</p></td></tr><tr><td><p><strong>LDAP</strong> <a class="reference external" href="https://www.rfc-editor.org/rfc/rfc4511.txt">🔗</a></p></td><td><p>2 - 3 Stud.</p></td></tr><tr><td><p><strong>Backend Subsetting and connection churn</strong> <a class="reference external" href="https://queue.acm.org/detail.cfm?id=3570937">🔗</a></p></td><td><p>1 Stud.</p></td></tr><tr><td><p><strong>Virtualization</strong>: Ziel dieser Präsentation ist es, einen Überblick über die verschiedenen Virtualisierungstechnologien zu geben und die Gemeinsamkeiten und Unterschiede zwischen ihnen zu erläutern. Es ist auch möglich, einige der Unterschiede anhand konkreter Produkte zu demonstrieren.</p><p><span class="peripheral">ausgewählte Schlüsselworte: Containers (e. g., Docker, Linux), Firecracker, Hypervisors (KVM, Xen, Hyper-V)</span></p></td><td><p>3 - 5 Stud.</p></td></tr><tr><td><p><strong>Real time system monitoring with eBPF</strong> <a class="reference external" href="https://queue.acm.org/detail.cfm?id=3178371">🔗</a></p></td><td><p>2 Stud. (mit Interesse an Linux)</p></td></tr><tr><td><p><strong>HTTP/3 and QUIC or HTTP over QUIC</strong> <a class="reference external" href="https://en.wikipedia.org/wiki/HTTP/3">🔗</a></p></td><td><p>2 Stud.</p></td></tr></tbody></table><p class="incremental rubric">Themen, die vorgetragen werden können</p><table class="booktabs incremental-table-rows" style="width: 100%;"><colgroup><col style="width: 70.0%"><col style="width: 30.0%"></colgroup><tbody><tr><td><p><strong>Paxos</strong> <a class="reference external" href="https://en.wikipedia.org/wiki/Paxos_(computer_science)">🔗</a></p></td><td><p>2 Stud.</p></td></tr><tr><td><p><strong>Raft Consensus Algorithm</strong> <a class="reference external" href="https://raft.github.io">🔗</a></p></td><td><p>2 Stud.</p></td></tr><tr><td><p><strong>Gossip Protokoll</strong> <a class="reference external" href="https://highscalability.com/gossip-protocol-explained/">🔗</a></p></td><td><p>2 Stud.</p></td></tr><tr><td><p><strong>gRPC</strong> <a class="reference external" href="https://grpc.io">🔗</a></p></td><td><p>2 Stud.</p></td></tr><tr><td><p><strong>Web and Distributed Application Testing</strong></p><p>Client und serverseitiges Testen sollen diskutiert werden.</p></td><td><p>4 Stud.</p></td></tr><tr><td><p><strong>Neo4J</strong> <a class="reference external" href="https://neo4j.com">🔗</a></p></td><td><p>2 Stud.</p></td></tr></tbody></table></ld-story><ld-supplemental><p><span class="eng">connection churn</span> ≘ <span class="ger">Verbindungsabbruch</span></p></ld-supplemental><!--Nicht mehr vergeben:
