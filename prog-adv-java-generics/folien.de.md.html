</code><small class="ln">3</small><code data-lineno="3">lo<span class="punctuation">.</span><span class="name function">add</span><span class="punctuation">(</span><span class="keyword">new</span> <span class="name class">Object</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="name class">String</span> s <span class="operator">=</span> ls<span class="punctuation">.</span><span class="name function">get</span><span class="punctuation">(</span><span class="literal number integer">0</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre><aside class="admonition incremental" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Wo können hier Probleme auftreten?</p></aside><aside class="admonition incremental" data-theme="answer"><p class="admonition-title" data-theme="answer-header"><span>Antwort</span></p><p>Die Zuweisung in Zeile 2 ist nicht erlaubt, da <code class="java"><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">String</span><span class="punctuation">&gt;</span></code> und <code class="java"><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">Object</span><span class="punctuation">&gt;</span></code> nicht kompatibel sind. Obwohl String ein Subtype von Object ist, ist <code class="java"><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">String</span><span class="punctuation">&gt;</span></code> kein Subtyp von <code class="java"><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">Object</span><span class="punctuation">&gt;</span></code>. Wäre dies erlaubt, dann könnte man in Zeile 3 ein Objekt vom Typ <code class="java"><span class="name class">Object</span></code> einer Liste von Strings hinzufügen!</p></aside><aside class="admonition incremental" data-theme="summary"><p class="admonition-title" data-theme="summary-header"><span>Zusammenfassung</span></p><p>Generics sind in Java <em>invariant</em>.</p></aside></ld-topic>
<ld-topic id="wildcards"><h2>Wildcards</h2><ld-story><ld-deck><ld-card><aside class="admonition" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Wie können wir eine Methode schreiben, die auch mit Subtypen von generischen Typen arbeiten kann?</p></aside></ld-card><ld-card class="incremental"><p>Eine einfache Methode zum Ausgeben eines Stacks:</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">static</span> <span class="keyword">void</span> <span class="name function">printAll</span><span class="punctuation">(</span><span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="name class">Object</span><span class="punctuation">&gt;</span> stack<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">for</span> <span class="punctuation">(</span><span class="keyword">int</span> i <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span> i <span class="operator">&lt;</span> stack<span class="punctuation">.</span><span class="name function">size</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> i<span class="operator">++</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">        <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">print</span><span class="punctuation">(</span>stack<span class="punctuation">.</span><span class="name function">get</span><span class="punctuation">(</span>i<span class="punctuation">)</span> <span class="operator">+</span> <span class="literal string">" "</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="punctuation">}</span></code></pre><ld-deck><ld-card><p>Diese Methode definiert einen Parameter vom Typ <code class="java"><span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="name class">Object</span><span class="punctuation">&gt;</span></code>. Das bedeutet, dass nur <code class="java"><span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="name class">Object</span><span class="punctuation">&gt;</span></code>-Objekte übergeben werden können.</p><p>Die Implementierung funktioniert aber auch mit Listen von Subtypen von <code class="java"><span class="name class">Object</span></code> wie <code class="java"><span class="name class">String</span></code> oder <code class="java"><span class="name class">Integer</span></code>.</p></ld-card><ld-card class="incremental"><p>Ein Aufruf mit einem <code class="java"><span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="name class">Integer</span><span class="punctuation">&gt;</span></code>-Objekt führt zu einem Compilerfehler:</p><pre class="code java literal-block"><code><span class="name function">printAll</span><span class="punctuation">(</span><span class="keyword">new</span> <span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="name class">Integer</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span>
<span class="operator">|</span>  <span class="name class">Error</span><span class="operator">:</span>
<span class="operator">|</span>  incompatible types<span class="operator">:</span>
<span class="operator">|</span>       <span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Integer</span><span class="punctuation">&gt;</span>
<span class="operator">|</span>       cannot be converted <span class="keyword">to</span>
<span class="operator">|</span>       <span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>String</span><span class="punctuation">&gt;</span></code></pre></ld-card><ld-card class="incremental"><p>Eine Lösung ist die Verwendung von Wildcards:</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">static</span> <span class="keyword">void</span> <span class="name function">printAll</span><span class="punctuation">(</span><span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="operator">?</span><span class="punctuation">&gt;</span> stack<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">for</span> <span class="punctuation">(</span><span class="keyword">int</span> i <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span> i <span class="operator">&lt;</span> stack<span class="punctuation">.</span><span class="name function">size</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> i<span class="operator">++</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">        <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">print</span><span class="punctuation">(</span>stack<span class="punctuation">.</span><span class="name function">get</span><span class="punctuation">(</span>i<span class="punctuation">)</span> <span class="operator">+</span> <span class="literal string">" "</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="punctuation">}</span></code></pre><p>Durch die Verwendung von <code class="java"><span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="operator">?</span><span class="punctuation">&gt;</span></code> kann die Methode mit allen Subtypen von <code class="java"><span class="name class">Object</span></code> aufgerufen werden.</p></ld-card></ld-deck></ld-card></ld-deck><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Durch die Verwendung eines Wildcards ist es nicht mehr möglich Elemente hinzuzufügen, da der konkrete Typ des Stacks nicht bekannt ist.</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="operator">?</span><span class="punctuation">&gt;</span> stack <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="name class">Integer</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2">stack<span class="punctuation">.</span><span class="name function">add</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// Compilerfehler</span></code></pre></aside></ld-story><ld-supplemental><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1">        <span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="name class">String</span><span class="punctuation">&gt;</span> infix <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">        <span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="name class">Double</span><span class="punctuation">&gt;</span> ops <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">        <span class="keyword">for</span> <span class="punctuation">(</span><span class="name class">String</span> arg <span class="operator">:</span> args<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">            <span class="keyword">switch</span> <span class="punctuation">(</span>arg<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">                <span class="keyword">case</span> <span class="literal string">"+"</span><span class="operator">:</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">                    ops<span class="punctuation">.</span><span class="name function">push</span><span class="punctuation">(</span>ops<span class="punctuation">.</span><span class="name function">pop</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">+</span> ops<span class="punctuation">.</span><span class="name function">pop</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">                    infix<span class="punctuation">.</span><span class="name function">push</span><span class="punctuation">(</span><span class="literal string">"("</span> <span class="operator">+</span> infix<span class="punctuation">.</span><span class="name function">pop</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">+</span> <span class="literal string">" + "</span> <span class="operator">+</span> infix<span class="punctuation">.</span><span class="name function">pop</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">+</span> <span class="literal string">")"</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">                    <span class="keyword">break</span><span class="punctuation">;</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">                <span class="keyword">case</span> <span class="literal string">"*"</span><span class="operator">:</span>
</code><small class="ln">10</small><code data-lineno="10">                    ops<span class="punctuation">.</span><span class="name function">push</span><span class="punctuation">(</span>ops<span class="punctuation">.</span><span class="name function">pop</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">*</span> ops<span class="punctuation">.</span><span class="name function">pop</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">11</small><code data-lineno="11">                    infix<span class="punctuation">.</span><span class="name function">push</span><span class="punctuation">(</span><span class="literal string">"("</span> <span class="operator">+</span> infix<span class="punctuation">.</span><span class="name function">pop</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">+</span> <span class="literal string">" * "</span> <span class="operator">+</span> infix<span class="punctuation">.</span><span class="name function">pop</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">+</span> <span class="literal string">")"</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">12</small><code data-lineno="12">                    <span class="keyword">break</span><span class="punctuation">;</span>
</code><small class="ln">13</small><code data-lineno="13">                <span class="keyword">default</span><span class="operator">:</span>
</code><small class="ln">14</small><code data-lineno="14">                    infix<span class="punctuation">.</span><span class="name function">push</span><span class="punctuation">(</span>arg<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">15</small><code data-lineno="15">                    ops<span class="punctuation">.</span><span class="name function">push</span><span class="punctuation">(</span><span class="name class">Double</span><span class="punctuation">.</span><span class="name function">parseDouble</span><span class="punctuation">(</span>arg<span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">16</small><code data-lineno="16">            <span class="punctuation">}</span>
</code><small class="ln">17</small><code data-lineno="17">        <span class="punctuation">}</span></code></pre></aside></ld-supplemental></ld-topic>
<ld-topic id="beschrankte-wildcards"><h2>Beschränkte Wildcards</h2><ld-deck><ld-card><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">abstract</span> <span class="keyword">class</span> <span class="name class">Shape</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">  <span class="keyword">abstract</span> <span class="keyword">void</span> <span class="name function">draw</span><span class="punctuation">(</span><span class="name class">Canvas</span> c<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="punctuation">}</span>
</code><small class="ln"> 4</small><code data-lineno=" 4"><span class="keyword">class</span> <span class="name class">Circle</span> <span class="keyword">extends</span> <span class="name class">Shape</span> <span class="punctuation">{</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">  <span class="keyword">void</span> <span class="name function">draw</span><span class="punctuation">(</span><span class="name class">Canvas</span> c<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="comment single">/*...*/</span> <span class="punctuation">}</span>
</code><small class="ln"> 6</small><code data-lineno=" 6"><span class="punctuation">}</span>
</code><small class="ln"> 7</small><code data-lineno=" 7"><span class="keyword">class</span> <span class="name class">Rectangle</span> <span class="keyword">extends</span> <span class="name class">Shape</span> <span class="punctuation">{</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">  <span class="keyword">void</span> <span class="name function">draw</span><span class="punctuation">(</span><span class="name class">Canvas</span> c<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="comment single">/*...*/</span> <span class="punctuation">}</span>
</code><small class="ln"> 9</small><code data-lineno=" 9"><span class="punctuation">}</span>
</code><small class="ln">10</small><code data-lineno="10">
</code><small class="ln">11</small><code data-lineno="11"><span class="keyword">class</span> <span class="name class">Canvas</span> <span class="punctuation">{</span>
</code><small class="ln">12</small><code data-lineno="12">  <span class="keyword">void</span> <span class="name function">draw</span><span class="punctuation">(</span><span class="name class">Shape</span> s<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">13</small><code data-lineno="13">    s<span class="punctuation">.</span><span class="name function">draw</span><span class="punctuation">(</span><span class="keyword">this</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">14</small><code data-lineno="14"><span class="punctuation">}</span> <span class="punctuation">}</span></code></pre><p><strong>Aufgabe</strong>: Definition einer Methode <code class="java"><span class="name function">drawAll</span><span class="punctuation">(</span><span class="punctuation">&lt;</span>list of shapes<span class="punctuation">&gt;</span><span class="punctuation">)</span></code> für <code class="java"><span class="name class">Canvas</span></code>, die eine Liste von Formen zeichnet?</p></ld-cell><ld-cell class="width-50" style="align-self:auto;"><ul class="incremental-list negative-list simple"><li><p><code class="java"><span class="name function">drawAll</span><span class="punctuation">(</span><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">Shape</span><span class="punctuation">&gt;</span> shapes<span class="punctuation">)</span></code> würde nur mit Listen von <code class="java"><span class="name class">Shape</span></code>-Objekten funktionieren.</p></li><li><p><code class="java"><span class="name function">drawAll</span><span class="punctuation">(</span><span class="name class">List</span><span class="punctuation">&lt;</span><span class="operator">?</span><span class="punctuation">&gt;</span> shapes<span class="punctuation">)</span></code> würde alle Listen von <code class="java"><span class="name class">Shape</span></code>-Objekten und allen Subtypen von <code class="java"><span class="name class">Shape</span></code> funktionieren, aber auch Listen von anderen Typen.</p></li></ul><div class="incremental"><p>Wir müssen den Type der Liste auf <code class="java"><span class="name class">Shape</span></code> und Subtypen von <code class="java"><span class="name class">Shape</span></code> beschränken. Dies erreichen wir mit einem <em>beschränkten Wildcard</em>:</p><p><code class="java"><span class="name function">drawAll</span><span class="punctuation">(</span><span class="name class">List</span><span class="punctuation">&lt;</span><span class="operator">?</span> <span class="keyword">extends</span> <span class="name class">Shape</span><span class="punctuation">&gt;</span> shapes<span class="punctuation">)</span></code> funktioniert mit Listen von <code class="java"><span class="name class">Shape</span></code>-Objekten und allen Subtypen von <code class="java"><span class="name class">Shape</span></code>.</p></div></ld-cell></ld-grid><ld-supplemental><p><code class="java"><span class="operator">?</span> <span class="keyword">extends</span> <span class="name class">X</span></code> bedeutet:</p><ul class="simple"><li><p>Wir kennen den exakten Typ nicht („?“)</p></li><li><p>Aber wir wissen, dass der Typ zu <code class="java"><span class="name class">X</span></code> konform sein muss</p></li><li><p><code class="java"><span class="name class">X</span></code> ist die „obere Schranke“ der Wildcard</p></li></ul></ld-supplemental></ld-card><ld-card class="incremental"><p>Wo ist das Problem bei folgender Methode?</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">void</span> <span class="name function">addRectangle</span><span class="punctuation">(</span><span class="name class">List</span><span class="punctuation">&lt;</span><span class="operator">?</span> <span class="keyword">extends</span> <span class="name class">Shape</span><span class="punctuation">&gt;</span> shapes<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    shapes<span class="punctuation">.</span><span class="name function">add</span><span class="punctuation">(</span><span class="literal number integer">0</span><span class="punctuation">,</span> <span class="keyword">new</span> <span class="name class">Rectangle</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="punctuation">}</span></code></pre><div class="incremental"><p>Das Problem ist, dass wir nicht wissen, welcher konkrete Typ von <code class="java"><span class="name class">List</span></code> übergeben wird. Es könnte auch eine <code class="java"><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">Circle</span><span class="punctuation">&gt;</span></code> sein, die keine Rechtecke aufnehmen kann.</p><p>Die Methode <code class="java">addRectangle</code> würde also nicht mit einer <code class="java"><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">Circle</span><span class="punctuation">&gt;</span></code> funktionieren.</p></div><div class="incremental"><p>Die Lösung ist die Spezifikation einer unteren Schranke. Dies ist mittels der  Verwendung von <em>super</em> möglich.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">void</span> <span class="name function">addRectangle</span><span class="punctuation">(</span><span class="name class">List</span><span class="punctuation">&lt;</span><span class="operator">?</span> <span class="keyword">super</span> <span class="name class">Rectangle</span><span class="punctuation">&gt;</span> shapes<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    shapes<span class="punctuation">.</span><span class="name function">add</span><span class="punctuation">(</span><span class="literal number integer">0</span><span class="punctuation">,</span> <span class="keyword">new</span> <span class="name class">Rectangle</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="punctuation">}</span></code></pre></div><ld-supplemental><p><code class="java"><span class="operator">?</span> <span class="keyword">super</span> <span class="name class">X</span></code> bedeutet:</p><ul class="simple"><li><p>Wir kennen den exakten Typ nicht („?“)</p></li><li><p>Aber wir wissen, dass <code class="java"><span class="name class">X</span></code> von dem unbekannten Typ abgeleitet sein muss</p></li><li><p><code class="java"><span class="name class">X</span></code> ist die „untere Schranke“ der Wildcard</p></li></ul></ld-supplemental></ld-card></ld-deck></ld-topic>
<ld-topic id="generische-methoden"><h2>Generische Methoden</h2><ld-deck><ld-card><p>Zusätzlich zu generischen Klassen können auch generische Methoden definiert werden. Bei diesen Methoden wird der generische Typ vor dem Rückgabetyp spezifiziert.</p></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">public</span> <span class="keyword">class</span> <span class="name class">Tuple2</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">public</span> <span class="keyword">final</span> <span class="name class">T</span> first<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">public</span> <span class="keyword">final</span> <span class="name class">T</span> second<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="keyword">public</span> <span class="name class">Tuple2</span><span class="punctuation">(</span><span class="name class">T</span> first<span class="punctuation">,</span> <span class="name class">T</span> second<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">        <span class="keyword">this</span><span class="punctuation">.</span>first <span class="operator">=</span> first<span class="punctuation">;</span> <span class="keyword">this</span><span class="punctuation">.</span>second <span class="operator">=</span> second<span class="punctuation">;</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="punctuation">}</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="keyword">public</span> <span class="name class">String</span> <span class="name function">toString</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">return</span> <span class="literal string">"("</span> <span class="operator">+</span> first <span class="operator">+</span> <span class="literal string">", "</span> <span class="operator">+</span> second <span class="operator">+</span> <span class="literal string">")"</span><span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="keyword">public</span> <span class="punctuation">&lt;</span><span class="name class">X</span><span class="punctuation">&gt;</span> <span class="name class">Tuple2</span><span class="punctuation">&lt;</span><span class="name class">X</span><span class="punctuation">&gt;</span> <span class="name function">map</span><span class="punctuation">(</span><span class="name class">Function</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">,</span><span class="name class">X</span><span class="punctuation">&gt;</span> mapper<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">10</small><code data-lineno="10">        <span class="keyword">return</span> <span class="keyword">new</span> <span class="name class">Tuple2</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span>mapper<span class="punctuation">.</span><span class="name function">apply</span><span class="punctuation">(</span>first<span class="punctuation">)</span><span class="punctuation">,</span> mapper<span class="punctuation">.</span><span class="name function">apply</span><span class="punctuation">(</span>second<span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">11</small><code data-lineno="11">    <span class="punctuation">}</span>
</code><small class="ln">12</small><code data-lineno="12"><span class="punctuation">}</span></code></pre><p class="rubric">Verwendung</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="comment single">/*Tuple2&lt;String&gt; ts =*/</span> <span class="keyword">new</span> <span class="name class">Tuple2</span><span class="punctuation">&lt;</span><span class="name class">Integer</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">,</span><span class="literal number integer">2</span><span class="punctuation">)</span><span class="punctuation">.</span><span class="name function">map</span><span class="punctuation">(</span>e <span class="operator">-&gt;</span> <span class="literal string">"value: "</span> <span class="operator">+</span> e<span class="punctuation">)</span></code></pre></aside><ld-supplemental><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">public</span> <span class="keyword">interface</span> <span class="name class">Function</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">,</span><span class="name class">R</span><span class="punctuation">&gt;</span> <span class="punctuation">{</span>

</code><small class="ln">4</small><code data-lineno="4">

</code><small class="ln">6</small><code data-lineno="6"><span class="punctuation">}</span></code></pre></ld-supplemental></ld-card></ld-deck></ld-topic>
<ld-topic class="summary" id="statische-typisierung"><h2>Statische Typisierung</h2><ul class="simple"><li><p>Statische Typsysteme sind (noch immer) Gegenstand der Forschung.</p></li><li><p>Java-ähnliche Typsysteme sind begrenzt, aber im Allgemeinen können Typsysteme sehr mächtig und ausdrucksstark sein - aber auch sehr kompliziert.</p></li><li><p>Manche Programmierer sehen statische Typsysteme als eine Begrenzung ihrer Freiheit (<em>„ich weiß, was ich tue“</em>).</p></li><li><p>Andere Programmierer denken, dass statische Typsysteme nicht nur viele Fehler erkennen, sondern auch eine gute Struktur im Code erzwingen (<em>„erst denken, dann schreiben“</em>).</p></li><li><p>In der Praxis zeigt sich, dass fast alle großen Projekte auf statische Typsysteme setzen.</p></li></ul></ld-topic>
<ld-topic class="exercises" id="ubung-5"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-6" data-exercise-id="6" data-exercise-title="6 - Wildcards"><p class="ld-exercise-title rubric"><span>Wildcards</span></p><ol class="arabic list-with-details"><li><p>Fügen Sie Ihrer generischen Klasse <code class="java"><span class="name class">Pair</span><span class="punctuation">&lt;</span><span class="name class">U</span><span class="punctuation">,</span><span class="name class">V</span><span class="punctuation">&gt;</span></code> eine Methode <code class="java"><span class="name function">addToMap</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code> hinzu, die die Elemente des Pairs in einer <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Map</span></code> speichert (siehe Beispiel). D. h. der erste Wert eines Pairs wird als Schlüssel und der Zweite als Value verwendet. Die Methode muss auch Maps von Supertypen von <code class="java"><span class="name class">U</span></code> und <code class="java"><span class="name class">V</span></code> akzeptieren.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">Pair</span><span class="punctuation">&lt;</span><span class="name class">Integer</span><span class="punctuation">,</span><span class="name class">Integer</span><span class="punctuation">&gt;</span> p <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Pair</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">,</span> <span class="literal number integer">2</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Map</span><span class="punctuation">&lt;</span><span class="name class">Object</span><span class="punctuation">,</span><span class="name class">Integer</span><span class="punctuation">&gt;</span> map <span class="operator">=</span> <span class="keyword">new</span> <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>HashMap</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">p<span class="punctuation">.</span><span class="name function">addToMap</span><span class="punctuation">(</span>map<span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// D.h. dem Key "1" ist nur der Wert "2" zugewiesen.</span></code></pre></aside></li><li><p>Schreiben Sie eine Methode die die Werte eine <code class="java"><span class="name class">Pair</span></code>s aktualisiert basierend auf den Werten eines anderen Paares. Achten Sie darauf, dass die Methode auch mit Subtypen von <code class="java"><span class="name class">U</span></code> und <code class="java"><span class="name class">V</span></code> arbeitet.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">Pair</span><span class="punctuation">&lt;</span><span class="name class">Integer</span><span class="punctuation">,</span><span class="name class">Integer</span><span class="punctuation">&gt;</span> pIntegers <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Pair</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">,</span> <span class="literal number integer">2</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name class">Pair</span><span class="punctuation">&lt;</span><span class="name class">Object</span><span class="punctuation">,</span><span class="name class">Object</span><span class="punctuation">&gt;</span> pObjects <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Pair</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="literal string">"a"</span><span class="punctuation">,</span><span class="keyword">new</span> <span class="name class">Object</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
