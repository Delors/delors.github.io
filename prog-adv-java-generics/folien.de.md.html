<ld-topic class="new-section" id="einfache-nicht-generische-datenstrukturen"><h2>Einfache nicht-generische Datenstrukturen</h2><div class="section-subtitle"><p>Wiederholung von allg. Programmierkonzepten und Motivation für Generics.</p></div></ld-topic>
<ld-topic class="exercises" id="ubung"><h2>Übung</h2><ld-scrollable><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Speichern von Wertepaaren"><p class="ld-exercise-title rubric"><span>Speichern von Wertepaaren</span></p><ol class="arabic simple"><li><p>Implementieren Sie die Datenstruktur <code class="java"><span class="name class">Pair</span></code> die zwei Werte (vom Typ <code class="java"><span class="name class">Object</span></code>) speichern kann. Die Klasse soll folgende Methoden bereitstellen:</p></li></ol><ul class="simple"><li><p><code class="java"><span class="name class">Pair</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">,</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code>: Konstruktor zum Erzeugen eines <code class="java"><span class="name class">Pair</span></code>s.</p></li><li><p><code class="java"><span class="name function">getFirst</span><span class="punctuation">(</span><span class="punctuation">)</span></code> und <code class="java"><span class="name function">getSecond</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Liefert den ersten/zweiten Wert zurück</p></li><li><p><code class="java"><span class="keyword">void</span> <span class="name function">setFirst</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code> und <code class="java"><span class="keyword">void</span> <span class="name function">setSecond</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code>: Setzt den ersten/zweiten Wert</p></li><li><p><code class="java"><span class="name function">toString</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Liefert eine String-Repräsentation des Paares</p></li></ul><ol class="arabic simple" start="2"><li><p>Erzeugen Sie ein <code class="java"><span class="name class">Pair</span></code>-Objekt mit zwei Integer-Werten (z. B. 1 und 2).</p></li><li><p>Nutzen Sie die Methoden der Klasse, um die Werte abzufragen und zu addieren.</p></li><li><p>Speichern Sie das Ergebnis an zweiter Stelle im <code class="java"><span class="name class">Pair</span></code>-Objekt als <code class="java"><span class="name class">String</span></code>.</p></li><li><p>Geben Sie den zweiten Wert auf der Konsole aus.</p></li><li><p>Was wäre bei der Addition passiert, wenn an zweiter Stelle ein <code class="java"><span class="name class">String</span></code> gespeichert gewesen wäre? Wann wäre das Verhalten aufgefallen?</p></li><li><p>Welchen statischen Typ hat der Wert, den die Methode <code class="java"><span class="name function">getFirst</span><span class="punctuation">(</span><span class="punctuation">)</span></code> zurückgibt?</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:8DoDpUrpoO3+ezGF5+TZQ1DNykO3ifxxXGSh5/R9RWE=:a616rMO4qW3Cjq3E:b7TqwMmSY9k+u6bY26uRGqMbqHfsstL3Hcj6t1nKpncul8QYh6sHYziXhnna0w/epqXT3GELBd+hPI55LilSwF451wkeGJSbNvCXFS/hgLYrvP0lkP+cnxiXJaQzyQ0gimOKne80+dwAcR+hdeoxA3CyJsCniqfryc35ziNBn6kGYseVSFLLSSHNU2CkN1V03Cn8G8zLEVhJf+MgcQCxZzKupRGKzVbtYVht1fZSuqwrg72K8DgeoVl6ppswTKtLfQwRM3q/oE/xzWbSoFWka8MhTSTsiSf+4cRUumtsN9g9J4dgTMoqV4MRhn+HO20RKtM8jwxPfS67gepoqoWiNurCrBhCdNghWaC73t3k/VXMw+sT28fBNgyWyOce2upJsNOgWdJAC+hVdQ3Uno3E+wx+b4yH3JTIxxSk9f4DzoOilShKLda/1ErW9IArfwbFwnYggsH5RIbQmfIevVHH1FwjOhX1UfqVGDbRB9Kx6njsX4gh5V5Tgoy4wBhscim2It27kuoJS6D3M7o3xgZJaI8u+nt8gYWysdRINI02pgtpChonI1g1JyFJKme+7N+7vOVXJNHiDdgQAKItSOQ9Dyq5o2gZ/ZjHDqYPwUmyvSzxTh6gMb0fkBAGEdOyFLjv187D5/limF4NjYhWjaYJVlhky+LZmyXdZNSf/aqD9deg1SwiUtoJBl9ChwVz5V <ld-topic class="exercises" id="ubung-1"><h2>Übung</h2><ld-scrollable><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Datenstruktur zum Speichern von ganz vielen Werten"><p class="ld-exercise-title rubric"><span>Datenstruktur zum Speichern von ganz vielen Werten</span></p><ol class="arabic"><li><p>Implementieren Sie eine Datenstruktur <code class="java"><span class="name class">List</span></code> zum Speichern beliebig vieler Werte im Package <span class="docutils literal">ds</span>. Die Klasse soll folgende Methoden bereitstellen:</p><ul class="simple"><li><p><code class="java"><span class="name class">List</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Konstruktor</p></li><li><p><code class="java"><span class="name class">List</span><span class="punctuation">(</span><span class="keyword">int</span> size<span class="punctuation">)</span></code>: Konstruktor</p></li><li><p><code class="java"><span class="keyword">void</span> <span class="name function">add</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code>: Fügt ein Element hinzu</p></li><li><p>eine <em>Varargs</em> Methode <code class="java"><span class="keyword">void</span> <span class="name function">addAll</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code>:, die alle übergebenen Werte hinzufügt.</p></li><li><p><code class="java"><span class="keyword">int</span> <span class="name function">size</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Liefert die Anzahl der Elemente zurück</p></li><li><p><code class="java"><span class="name class">Object</span> <span class="name function">get</span><span class="punctuation">(</span><span class="keyword">int</span> index<span class="punctuation">)</span></code>: Liefert das Element an der Stelle <code class="java">index</code> zurück oder wirft eine <code class="java"><span class="name class">IndexOutOfBoundsException</span></code>, wenn der Index ungültig ist</p></li><li><p><code class="java"><span class="keyword">void</span> <span class="name function">set</span><span class="punctuation">(</span><span class="keyword">int</span> index<span class="punctuation">,</span> <span class="name class">Object</span> value<span class="punctuation">)</span></code>: Setzt das Element an der Stelle <code class="java">index</code> auf den Wert <code class="java">value</code> oder wirft eine <code class="java"><span class="name class">IndexOutOfBoundsException</span></code>, wenn der Index ungültig ist</p></li><li><p><code class="java"><span class="name class">String</span> <span class="name function">toString</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Liefert eine String-Repräsentation der Liste</p></li><li><p><code class="java"><span class="keyword">void</span> <span class="name function">remove</span><span class="punctuation">(</span><span class="keyword">int</span> index<span class="punctuation">)</span></code>: Entfernt das Element an der Stelle <code class="java">index</code> oder wirft eine <code class="java"><span class="name class">IndexOutOfBoundsException</span></code>, wenn der Index ungültig ist</p></li><li><p><code class="java"><span class="keyword">void</span> <span class="name function">clear</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Entfernt alle Elemente</p></li></ul><p>Nutzen Sie als zugrunde liegende Datenstruktur ein Array. D. h. speichern Sie die Elemente in einem Array und vergrößern Sie das Array, wenn es voll ist. Wenn das Array zu groß ist, verkleinern Sie es. Eine Vergrößerung soll das Array verdoppeln aber um nicht mehr als 1000 Elemente. Eine Verkleinerung soll das Array halbieren, wenn weniger als ein Viertel des Arrays belegt ist. Die Mindestgröße des Arrays soll 16 Elemente betragen.</p><p>Nutzen Sie <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>System</span><span class="punctuation">.</span><span class="name function">arraycopy</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code> zum Vergrößern/Verkleinern des zugrunde liegenden Arrays.</p></li><li><p>Schreiben Sie eine Klasse <code class="java"><span class="name class">ListTest</span></code>, die die Klasse <code class="java"><span class="name class">List</span></code> testet. Die Klasse soll jede der Methoden der Klasse <code class="java"><span class="name class">List</span></code> <em>testen</em>; d. h. mindestens einmal aufrufen.</p><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Denken Sie an die Modellierung von Sichtbarkeiten.</p><p>Modellieren Sie alle Ausnahmen. Stellen Sie sicher, dass alle Methoden die Bedingungen einhalten.</p></aside></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:EGDp5uoXhd7ZwNnTtot3asPiA5zW+2fs66O+9+CgZW8=:wyCEC6Lks3Noek5P:RaAq3nG9rlwlB7/nSs0DLDULnseUxm4RXzjQBSBpmlIcOY9mxJkeMOtn3wRVtNJvWyNJSHE8Q0dNB9jUrKIgyqx8DzxgnIAtTsaLmn49fcez0vPylbtA4kYeN+qR+fEVQQzQ63JDyuG2pNWignu5Cn+bbxnYpcQUsZ4dRj4MInQrRsOGJ1FzF6gB2DLTx4o5B2t/ebTAsmpbWQKEy5pI1z/ir9B0CW3UJ9IiCkC9GjRbHzySP4OU3R1gs6wdApupi2NXI74ivtPWr3I+D8Scb1/nqHPZgQBY8xx4T+FSNfDmK6NQKll2pQeB+lXcE3nFvY86c5MdRtXkMMjfI6DpqnHXTHGSibUV6VKrhyFax85PEr+3EYseWJ4tofaX2kOaFbr98KGhgabD04VvsUg1vCu30vF7yWRmgf/KLfDuk2PAM0gkFcvhWIVxT/W7lJiNcPbc4Pmf5uAm+4bxzPYJgplMMJMsykZkq1lFAPDgqHoCyvh2xwY99q3Cqg+vck2KNE0vuHNN24ZFsrQMohYB5f0UAsy+1epPSwOJoCrR1HpJScmZk/5og5MUtMjdar6+0zCSOhkRsd2wprM3aYYiqx <ld-topic class="exercises" id="ubung-2"><h2>Übung</h2><ld-scrollable><div class="ld-exercise" id="ld-exercise-3" data-exercise-id="3" data-exercise-title="3 - Klasse List erweitern"><p class="ld-exercise-title rubric"><span><code class="java"><span class="name class">List</span></code> erweitern</span></p><ol class="arabic"><li><p>Schreiben Sie eine Klasse <code class="java"><span class="name class">Stack</span></code> im Package <span class="docutils literal">ds</span>, die Ihre Klasse <code class="java"><span class="name class">List</span></code> erweitert; d. h. von <code class="java"><span class="name class">List</span></code> erbt. Die Klasse soll folgende Methoden bereitstellen:</p><ul class="simple"><li><p><code class="java"><span class="name class">Stack</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Konstruktor</p></li><li><p><code class="java"><span class="keyword">void</span> <span class="name function">push</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> value<span class="punctuation">)</span></code>: Legt ein Element auf den Stack</p></li><li><p><code class="java"><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="name function">pop</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Entfernt das oberste Element vom Stack und liefert es zurück oder wirft eine <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>NoSuchElementException</span></code>, wenn der Stack leer ist</p></li><li><p><code class="java"><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="name function">peek</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Liefert das oberste Element zurück, ohne es zu entfernen oder wirft eine <code class="java"><span class="name class">NoSuchElementException</span></code>, wenn der Stack leer ist</p></li></ul></li><li><p>Schreiben Sie eine Klasse RPN (im <em>Default Package</em>), die einen String von der Kommandozeile übernimmt (als einzelne "args") und diesen als <em>umgekehrte polnische Notation</em> interpretiert (d. h. erst kommen die Operanden, dann ein Operator) und berechnet.</p><p>Beispielinteraktion:</p><pre class="code console literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name function">java</span> RPN <span class="literal number integer">1</span> <span class="literal number integer">2</span> <span class="literal string">"+"</span> <span class="literal number integer">3</span> <span class="literal string">"*"</span>

<ld-topic class="summary" id="zusammenfassung"><h2>Zusammenfassung</h2><ul class="positive-list simple"><li><p>wir haben zwei grundlegende Datenstrukturen kennen gelernt sowie mögliche Implementierungen dafür:</p><ol class="arabic simple"><li><p>Listen basierend auf Arrays</p></li><li><p>Stacks basierend auf Listen</p></li></ol></li></ul><ul class="negative-list simple"><li><p>wir haben gesehen, dass die Verwendung von Datenstrukturen, die nichts über den Typ der gespeicherten Elemente wissen, zu Problemen führen kann (Fehler zur Laufzeit und nicht zur Compilezeit). Weiterhin sind viele explizite Typumwandlungen notwendig, die den Code unübersichtlich machen.</p></li></ul></ld-topic>
<ld-topic class="new-section transition-scale" id="generics-erste-einfuhrung"><h2>Generics - erste Einführung</h2></ld-topic>
<ld-topic id="generics-motivation"><h2>Generics - Motivation</h2><ld-deck><ld-card><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><ul class="incremental-list list-with-explanations"><li><p>Eine Collection wie <code class="java"><span class="name class">Pair</span></code> oder <code class="java"><span class="name class">List</span></code> sollte zu mehr als einem Typ passen.</p></li><li><p>Eine Implementierung sollte für verschiedene Zwecke ausreichend sein.</p></li><li><p>Das allgemeine Verhalten der Collection hängt nicht vom Elementtyp ab.</p></li><li><p>Zusätzlich wollen wir einen spezifischen Elementtyp garantiert haben.</p><p>Angenommen, wir nutzen eine Collection nur für <span class="docutils literal">Person</span> Instanzen, dann wollen wir auch <span class="docutils literal">Person</span> Objekte verwenden können und nicht immer mit <span class="docutils literal">Object</span> arbeiten müssen.</p></li></ul></aside></ld-card><ld-card class="incremental"><p>Generics erlauben die Definition generischer und typsicherer Datentypen, die über die Typen der Elemente abstrahieren.</p><p>D. h. wir können zum Beispiel angeben, dass wir nur Elemente vom statischen Typ <code class="java"><span class="name class">Person</span></code> speichern wollen. Dies hat folgende Vorteile:</p><ul class="positive-list incremental-list simple"><li><p>Kompakterer / besser wartbarer Code</p></li><li><p>Fehler, die sonst erst zur Laufzeit auftreten würden, können zur Compilezeit erkannt werden (z. B. das versehentliche Speichern eines <code class="java"><span class="name class">String</span></code>s in einer Liste für <code class="java"><span class="name class">Integer</span></code> Werte.)</p></li></ul></ld-card></ld-deck></ld-topic>

</code><small class="ln">13</small><code data-lineno="13">        <span class="punctuation">}</span></code></pre><ld-supplemental><p>In diesem Beispiel würden wir insbesondere gerne auf die Casts (2- mal in Zeile 5 und 2-mal in Zeile 8) verzichten wollen. Dies Casts sind nicht nur unschön, sondern können auch (in komplexeren Fällen) zu Laufzeitfehlern führen.</p></ld-supplemental></ld-card><ld-card class="incremental"><p class="rubric">Verwendung eines <code class="java"><span class="name class">Stack</span></code>s für Double Werte</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1">        <span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="name class">Double</span><span class="punctuation">&gt;</span> stack <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// &lt;- Typ der Elemente ist Double</span>

<ld-topic id="einfache-generische-klassen-aus-java"><h2>Einfache generische Klassen aus Java</h2><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">public</span> <span class="keyword">interface</span> <span class="name class">Collection</span><span class="punctuation">&lt;</span><span class="name class">E</span><span class="punctuation">&gt;</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">void</span> <span class="name function">add</span><span class="punctuation">(</span><span class="name class">E</span> x<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="name class">Iterator</span><span class="punctuation">&lt;</span><span class="name class">E</span><span class="punctuation">&gt;</span> <span class="name function">iterator</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>

</code><small class="ln">5</small><code data-lineno="5">

</code><small class="ln">7</small><code data-lineno="7">    <span class="keyword">int</span> <span class="name function">compareTo</span><span class="punctuation">(</span><span class="name class">T</span> o<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">8</small><code data-lineno="8"><span class="punctuation">}</span></code></pre><p>Mittels <code class="java"><span class="punctuation">&lt;</span><span class="name class">E</span><span class="punctuation">&gt;</span></code> oder <code class="java"><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code> in der Klassendefinition deklarieren wird einen formalen Typparameter <code class="java"><span class="name class">E</span></code> bzw. <code class="java"><span class="name class">T</span></code>.</p><p>Dieser kann dann in der Klasse als Typ genutzt werden. Wenn wir dann eine Instanz der Klasse erzeugen, müssen wir den konkreten Typ für den Typparameter <code class="java"><span class="name class">E</span></code> bzw. <code class="java"><span class="name class">T</span></code> angeben.</p></ld-topic>
<ld-topic id="generics-instanziierung"><h2>Generics: Instanziierung</h2><ld-story><ul><li><p>Bei der Instanziierung von Generics muss für alle generischen Typen ein konkreter Datentyp (z.B. <code class="java"><span class="name class">Integer</span></code>) definiert werden:</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p><code class="java"><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">Integer</span><span class="punctuation">&gt;</span> v1 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">Integer</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span></code></p></aside></li></ul><ul class="incremental-list"><li><p>Der konkrete Datentyp muss eine Klasse sein, d. h. es darf kein primitiver Datentyp (z.B. <code class="java"><span class="keyword">int</span></code>) sein.</p></li><li><p>Der konkrete Datentyp kann allerdings auch bei der Verwendung weggelassen werden (dann spricht man von Raw-Types).</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p><code class="java"><span class="name class">List</span> v1 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">ArrayList</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span></code></p></aside><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p><strong>Raw-Types sollten vermieden werden</strong>, Sie wurden kurz nach der Einführung von Generics verwendet, um bestehenden Code zu migrieren.</p></aside></li><li><p>Wenn ein generischer Datentyp instanziiert wird, und direkt einer entsprechend getypten Variable zugewiesen wird, dann kann der konkrete Datentyp weggelassen werden (es muss aber der <em>Diamond Operator</em> <code class="java"><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span></code> verwendet werden).</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p><code class="java"><span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="name class">Double</span><span class="punctuation">&gt;</span> stack <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Stack</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span></code></p><p>oder</p><p><code class="java"><span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">Integer</span><span class="punctuation">&gt;</span> v1 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">ArrayList</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span></code></p><p>oder</p><p><code class="java"><span class="name class">Pair</span><span class="punctuation">&lt;</span><span class="name class">Integer</span><span class="punctuation">,</span><span class="name class">Integer</span><span class="punctuation">&gt;</span> p1 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Pair</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="literal number integer">36462828</span><span class="punctuation">,</span> <span class="literal number integer">50</span><span class="punctuation">)</span><span class="punctuation">;</span></code></p><p><code class="java"><span class="name class">Pair</span><span class="punctuation">&lt;</span><span class="name class">String</span><span class="punctuation">,</span><span class="name class">Integer</span><span class="punctuation">&gt;</span> p2 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Pair</span><span class="punctuation">&lt;</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="literal string">"Michael"</span><span class="punctuation">,</span> <span class="literal number integer">2023</span><span class="punctuation">)</span><span class="punctuation">;</span></code></p></aside></li></ul></ld-story></ld-topic>
<ld-topic class="exercises" id="ubung-3"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-4" data-exercise-id="4" data-exercise-title="4 - Pair mit Typparametern"><p class="ld-exercise-title rubric"><span>Pair mit Typparametern</span></p><p>Erweitern Sie Ihre Klasse Pair um zwei generische Typparameter <code class="java"><span class="name class">U</span></code> und <code class="java"><span class="name class">V</span></code> für die beiden Werte, die gespeichert werden sollen.</p><p>Nutzen Sie dann die entsprechenden Typen <code class="java"><span class="name class">U</span></code> und <code class="java"><span class="name class">V</span></code> für die entsprechenden Attribute der Klasse und ggf. auch für Methodenparameter/-rückgabewerte und lokale Variablen.</p><p>Passen Sie auch die <code class="java">main</code> Methode entsprechend an.</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:zHDOq2EfD3vYkzKmtY2sftUjrbvf9RuXyK9r/2iXmjk=:DssWNJLREJk6qAw4:7MpcSII5b6aCNCVTJFNqjfpciJHVsiiJfoGqu1jGuJudjgaKbiRMLLAFPK+AeMKDO3UTk65RF9zZdc5TA8oNraVRjVoekLh4J/v7wEhWlHL1jUoXbKMt/wJwfrme4ADDb83M4osVBlASYUiKlQblY8uiITYmcuTzhbejqS+0KRJQAC7YpdOZqBim1gZLdmCfPYwvCA1bmuGyty6TD9fmga0DJLSrYqFmHnuIUOBtai8+Je9XumZMvKyfJJd3HmnG5+O5cvJEiItKZI7ATecYRjzFxkC3nwpcltnYTpZop7r1mSWhb8bZqPqCJctyl5/Q872XKRw8D4PXaRAYMVNbBhQ69+OvyL/K+mrKs31mS9Wq7AYQHqLLlVC7EtmtxrVOspeEGgOYjEtfRwoeON5inQbcidRufP9OK3f7zebDC2KjoDvT6Pcv4W6hP8I75OQ4tIAVkYO7elJcsVM2Iq2chcwUNQ1FBXuj21ANSoDKn8WBx4YCbmdepYuRU6i7VR7sCzCxKMe6+EiBN4OKqfAwH3XffEnOLONZw8aHo+YKm5h2XNKhxWkiDx1fnigAleEAMSyLNCi3X0ZHFSJiqszg2+gC9aEq/dMde91FRZMuNzeObH7vmh/Cu+kUpfRPaL+I8AK79DUVP2dpy8djRbNXHgW7SuQR7GsKmD9IyJ5TwAKpPJ5SIc656ii4oed97NOlvhDbmNhUB9lW7RGXSUFvkqZxXRfofiGPL4Ppcp2nRMP2zx5ZlVvCf2CBc8jFEj0hCvF4fHIU+tQG7OfySJTAQIpZ7XsaYYBpp9gtz6GxBlJWa3lif0ljKDEtJSVQGbMWOtcftmAAfc7kl2ocQ7siE6B8jRVXI/WMZwYvgNDF7ow35f+ZsHWLNYhlPHF1RVcBngn5OarRZhWkvUVt3cW7ACBbaHrJbMM6DdmIN5T3zORhRAFiriBdfMTj3/cbqXWGC+SgeICVleGuJziUhCHYBGUpZ/ZLeMh3WlPNbDLdEbyxBxXiQ1pFY <ld-topic class="new-section transition-scale" id="eine-kurz-einfuhrung-in-das-java-collections-framework"><h2>Eine kurz Einführung in das Java Collections Framework</h2></ld-topic>
<ld-topic id="collections-d-h-sammlungen-von-objekten"><h2>Collections (d. h. Sammlungen von Objekten)</h2><ul class="incremental-list simple"><li><p>Eine häufig benötigte Form von Datenstrukturen ist eine Collection (Sammlung), die unterschiedliche Datenelemente speichert.</p><ul class="simple"><li><p>entweder genau der gleiche Typ</p></li><li><p>oder der gleiche Typ; ggf. mit Subtypen</p></li><li><p><span class="peripheral">oder gemischte Typen (eher selten)</span></p></li></ul></li><li><p>Abhängig vom geplanten Gebrauch kann eine Collection…</p><ul class="simple"><li><p>schnellen Zugriff auf die einzelnen Elemente unterstützen.</p></li><li><p>die Sortierung der Elemente unterstützen.</p></li><li><p>die Möglichkeit zum Zugriff auf bestimmte Elemente geben.</p></li><li><p>bei Bedarf wachsen.</p></li><li><p>usw.</p></li></ul></li></ul></ld-topic>
<ld-topic id="wrapper-klassen-und-auto-un-boxing"><h2>Wrapper-Klassen und Auto(un)boxing</h2><ld-story><aside class="admonition" data-theme="repetition"><p class="admonition-title" data-theme="repetition-header"><span>Wiederholung</span></p><ul class="list-with-explanations"><li><p>wir unterscheiden Werte und Referenzen</p></li><li><p>primitive Datentypen sind keine Referenztypen</p><p>Sie werden nicht von Object abgeleitet und besitzen keine Methoden.</p></li></ul></aside><aside class="admonition incremental" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>Wie wir gesehen haben ist es möglich primitive Datentypen in Datenstrukturen wie Listen zu speichern obwohl diese eigentlich nur Objekte speichern können.</p></aside><div class="compound incremental"><p>Wenn primitive Werte an Stellen verwendet werden, die eigentlich Objekte verlangen (z. B. Collections), dann werden automatisch die jeweiligen passenden Wrapperklassen verwendet; d. h. die primitiven Datentypen werden in Objekte umgewandelt und entsprechend behandelt:</p><pre class="code java literal-block"><code><span class="keyword">int</span>     <span class="operator">-&gt;</span> <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Integer</span>
<span class="keyword">float</span>   <span class="operator">-&gt;</span> <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Float</span>
<span class="keyword">double</span>  <span class="operator">-&gt;</span> <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Double</span>
<span class="keyword">char</span>    <span class="operator">-&gt;</span> <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Character</span>
<span class="keyword">boolean</span> <span class="operator">-&gt;</span> <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Boolean</span>
<span class="keyword">byte</span>    <span class="operator">-&gt;</span> <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Byte</span>
<span class="keyword">short</span>   <span class="operator">-&gt;</span> <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Short</span>
<span class="keyword">long</span>    <span class="operator">-&gt;</span> <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Long</span></code></pre></div><aside class="admonition incremental" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Dieses so genannte <em>Autoboxing</em> hat jedoch ggf. erhebliche Laufzeitkosten und sollte daher vermieden werden.</p></aside></ld-story></ld-topic>
<ld-topic id="grundlegende-klassen-des-collections-frameworks"><h2>Grundlegende Klassen des Collections Frameworks</h2><div class="float-right scale-up-on-hover backdrop-blur"><object class="light-image align-center" data="images/collections/collections.svg" type="image/svg+xml" role="img" aria-label="Collections Framework - Übersicht"></object></div><ul class="list-with-sublists simple"><li><p>Das Hauptinterface ist <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Collection</span></code></p><ul class="simple"><li><p>es definiert grundlegende Methoden für Sammlungen von Objekten.</p></li><li><p>es definiert keine Restriktionen / Garantien bezüglich:</p><ul class="simple"><li><p>Duplikate</p></li><li><p>Ordnung</p></li><li><p>Sortierung</p></li><li><p>usw.</p></li></ul></li></ul></li><li><p><code class="java"><span class="name class">List</span></code> (hat die Implementierungen <code class="java"><span class="name class">ArrayList</span></code>, <code class="java"><span class="name class">LinkedList</span></code>, …)</p><ul class="simple"><li><p>Objekte sind sortiert</p></li><li><p>kann Duplikate enthalten</p></li><li><p>direkter Zugriff auf Objekte über Index</p></li></ul></li><li><p><code class="java"><span class="name class">Set</span></code> (hat die Implementierung <code class="java"><span class="name class">HashSet</span></code>)</p><ul class="simple"><li><p>keine Einschränkung bzgl. der Sortierung</p></li><li><p>Objekt kann nur einmal enthalten sein</p></li></ul></li><li><p><code class="java"><span class="name class">SortedSet</span></code> (hat die Implementierung <code class="java"><span class="name class">TreeSet</span></code>)</p><ul class="simple"><li><p>Ein Set, aber geordnet bzgl. einer spezifischen Vergleichsstrategie.</p></li></ul></li></ul></ld-topic>
<ld-topic class="new-subsection" id="collections-fur-einen-typ-von-werten"><h2>Collections für einen Typ von Werten</h2></ld-topic>
<ld-topic class="no-title center-content" id="collections-vom-typ-e"><h2>Collections vom Typ „E“</h2><p>Im Folgenden betrachten wir Collections die Element vom Typ „E“ verwalten; dieser Typ ist durch „passende“ Typen ersetzbar.</p></ld-topic>
<ld-topic id="java-util-list"><h2><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>List</span></code></h2><ld-story><div class="compound"><p><strong>Das Interface bietet folgende Methoden</strong>:</p><ul class="incremental-list simple"><li><p><code class="java"><span class="keyword">boolean</span> <span class="name function">add</span><span class="punctuation">(</span><span class="name class">E</span> e<span class="punctuation">)</span></code>: Anhängen des Elements <code class="java">e</code> an die Liste</p></li><li><p><code class="java"><span class="keyword">void</span> <span class="name function">add</span><span class="punctuation">(</span><span class="keyword">int</span> pos<span class="punctuation">,</span> <span class="name class">E</span> e<span class="punctuation">)</span></code>: Einfügen des Elements <code class="java">e</code> an Position <code class="java">pos</code>; verschiebt alle Elemente ab Position <code class="java">pos</code> um eine Position nach hinten</p></li><li><p><code class="java"><span class="keyword">boolean</span> <span class="name function">addAll</span><span class="punctuation">(</span><span class="name class">Collection</span> c<span class="punctuation">)</span></code>: Anhängen aller Elemente der Collection <code class="java">c</code> an die Liste</p></li><li><p><code class="java"><span class="keyword">boolean</span> <span class="name function">addAll</span><span class="punctuation">(</span><span class="keyword">int</span> pos<span class="punctuation">,</span> <span class="name class">Collection</span> c<span class="punctuation">)</span></code>: Einfügen aller Elemente der Collection <code class="java">c</code> an Position <code class="java">pos</code> (s.o.)</p></li><li><p><code class="java"><span class="keyword">void</span> <span class="name function">clear</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Löscht alle Elemente der Liste</p></li><li><p><code class="java"><span class="keyword">boolean</span> <span class="name function">contains</span><span class="punctuation">(</span><span class="name class">Object</span> o<span class="punctuation">)</span></code>: Liefert true, wenn sich Objekt <code class="java">o</code> in der Liste befindet</p></li><li><p><code class="java"><span class="keyword">boolean</span> <span class="name function">containsAll</span><span class="punctuation">(</span><span class="name class">Collection</span> c<span class="punctuation">)</span></code>: Liefert true, falls alle Objekte der Collection <code class="java">c</code> in der Liste sind</p></li><li><p><code class="java"><span class="name class">E</span> <span class="name function">get</span><span class="punctuation">(</span><span class="keyword">int</span> pos<span class="punctuation">)</span></code>: Liefert das Element an Position <code class="java">pos</code> der Liste</p></li><li><p><code class="java"><span class="keyword">int</span> <span class="name function">indexOf</span><span class="punctuation">(</span><span class="name class">Object</span> o<span class="punctuation">)</span></code>: Liefert die erste Position, an der sich <code class="java">o</code> in der Liste befindet, sonst -1. Gegenstück: <code class="java"><span class="keyword">int</span> <span class="name function">lastIndexOf</span><span class="punctuation">(</span><span class="name class">Object</span> o<span class="punctuation">)</span></code></p></li><li><p><code class="java"><span class="keyword">boolean</span> <span class="name function">isEmpty</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Liefert true wenn die Liste leer ist</p></li><li><p><code class="java"><span class="name class">E</span> <span class="name function">remove</span><span class="punctuation">(</span><span class="keyword">int</span> pos<span class="punctuation">)</span></code>: Entfernt das Objekt an Position <code class="java">pos</code> und liefert es zurück</p></li><li><p><code class="java"><span class="keyword">boolean</span> <span class="name function">remove</span><span class="punctuation">(</span><span class="name class">Object</span> <span class="name class">O</span><span class="punctuation">)</span></code>: Versucht Objekt <code class="java">o</code> aus der Liste zu entfernen; true bei Erfolg</p></li><li><p><code class="java"><span class="keyword">int</span> <span class="name function">size</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Liefert die Größe der Liste</p></li><li><p><code class="java"><span class="name class">Object</span><span class="punctuation">[</span><span class="punctuation">]</span> <span class="name function">toArray</span><span class="punctuation">(</span><span class="punctuation">)</span></code>: Liefert ein Array, das alle Elemente der Liste umfasst</p></li></ul></div><div class="compound incremental"><p><strong>Für Konstruktoren in den Erbenklassen gilt</strong>:</p><ul class="simple"><li><p>es gibt immer Parameterlose Konstruktoren (Konvention)</p></li><li><p>Konstruktoren mit <code class="java"><span class="name class">Collection</span></code> als Parameter kopieren alle Werte in die Liste</p></li><li><p><span class="peripheral">Spezialfälle (siehe entsprechende Dokumentation)</span></p></li></ul></div><div class="compound incremental"><p><strong>Konkrete Implementierungen (Auswahl)</strong>:</p><p><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>LinkedList</span></code> fügt folgende Methoden hinzu (Auswahl):</p><ul class="simple"><li><p><code class="java"><span class="keyword">void</span> <span class="name function">addFirst</span><span class="punctuation">(</span><span class="name class">E</span><span class="punctuation">)</span></code></p></li><li><p><code class="java"><span class="keyword">void</span> <span class="name function">addLast</span><span class="punctuation">(</span><span class="name class">E</span><span class="punctuation">)</span></code></p></li><li><p><code class="java"><span class="name class">E</span> <span class="name function">getFirst</span><span class="punctuation">(</span><span class="punctuation">)</span></code></p></li><li><p><code class="java"><span class="name class">E</span> <span class="name function">getLast</span><span class="punctuation">(</span><span class="punctuation">)</span></code></p></li></ul><p><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>ArrayList</span></code> speichert die Elemente in einem Array und fügt folgende Methoden hinzu (Auswahl):</p><ul class="simple"><li><p><code class="java"><span class="keyword">void</span> <span class="name function">ensureCapacity</span><span class="punctuation">(</span><span class="keyword">int</span> minCapacity<span class="punctuation">)</span></code> - falls die Liste weniger Elemente als <code class="java">minCapacity</code> fassen kann, wird das Array vergrößert</p></li><li><p><code class="java"><span class="keyword">void</span> <span class="name function">trimToSize</span><span class="punctuation">(</span><span class="punctuation">)</span></code> - verkleinert das Array auf die Listengröße</p></li><li><p><code class="java"><span class="name class">ArrayList</span><span class="punctuation">(</span><span class="keyword">int</span> initialCapacity<span class="punctuation">)</span></code> Neuer Konstruktor, für die Spezifikation der Größe</p></li></ul></div></ld-story></ld-topic>
<ld-topic id="java-util-set"><h2><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Set</span></code></h2><ld-story><ul class="list-with-explanations"><li><p>Ein Set repräsentiert eine mathematische Menge</p><p>D. h. ein gegebenes Objekt ist nur maximal einmal vorhanden und das Einfügen scheitert, wenn das Objekt schon vorhanden ist.</p></li><li><p>Umfasst die meisten der schon bekannten Methoden</p><pre class="code java literal-block"><code><span class="keyword">boolean</span> <span class="name function">add</span><span class="punctuation">(</span><span class="name class">E</span> e<span class="punctuation">)</span>
<span class="keyword">boolean</span> <span class="name function">addAll</span><span class="punctuation">(</span><span class="name class">Collection</span> c<span class="punctuation">)</span>
<span class="keyword">void</span> <span class="name function">clear</span><span class="punctuation">(</span><span class="punctuation">)</span>
<span class="keyword">boolean</span> <span class="name function">contains</span><span class="punctuation">(</span><span class="name class">Object</span> <span class="name class">O</span><span class="punctuation">)</span>
<span class="keyword">boolean</span> <span class="name function">containsAll</span><span class="punctuation">(</span><span class="name class">Collection</span> c<span class="punctuation">)</span>
<span class="keyword">boolean</span> <span class="name function">isEmpty</span><span class="punctuation">(</span><span class="punctuation">)</span>
<span class="keyword">boolean</span> <span class="name function">remove</span><span class="punctuation">(</span><span class="name class">Object</span> <span class="name class">O</span><span class="punctuation">)</span>
<span class="keyword">boolean</span> <span class="name function">removeAll</span><span class="punctuation">(</span><span class="name class">Collection</span> c<span class="punctuation">)</span>
<span class="keyword">int</span> <span class="name function">size</span><span class="punctuation">(</span><span class="punctuation">)</span>
<span class="name class">Object</span><span class="punctuation">[</span><span class="punctuation">]</span> <span class="name function">toArray</span><span class="punctuation">(</span><span class="punctuation">)</span></code></pre></li></ul><div class="compound incremental"><p><strong>Konkrete Implementierungen (Auswahl)</strong>:</p><ul class="simple"><li><p><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>HashSet</span></code>: verwaltet die Daten in einer Hashtabelle (sehr effizienter Zugriff)</p></li><li><p><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>TreeSet</span></code>: verwaltet die Daten in einem Baum mit Zugriffszeiten in O(log n)<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a>.</p></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Die Komplexität von Algorithmen diskutieren wir in einem späteren Abschnitt detailliert.</p></aside></aside></div></ld-story></ld-topic>
<ld-topic class="new-subsection" id="collections-fur-paare-von-werten-schlussel-und-wert"><h2>Collections für Paare von Werten (Schlüssel und Wert)</h2></ld-topic>
<ld-topic class="no-title center-content" id="map-mit-typparametern"><h2>Map mit Typparametern</h2><p>Im folgenden wird der Typ „K“ für den Typ des Schlüssels und der Typ "V" für den Typ des Wertes verwendet; diese Typen sind durch „passende“ Typen ersetzbar.</p></ld-topic>
<ld-topic id="java-util-map"><h2><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Map</span></code></h2><ld-story><div class="float-right scale-up-on-hover backdrop-blur"><object class="light-image align-center" data="images/collections/maps.svg" type="image/svg+xml" role="img" aria-label="Collections Framework - Maps"></object></div><p>Wenn Objekte nicht über einen numerischen Index, sondern über einen Schlüssel (einzigartiger, aber sonst zufälliger Wert) auffindbar sein sollen, z.B. eine Telefonnummer mit „Nachname + Vorname“.</p><div class="compound incremental"><p><strong>Das Interface bietet folgende Methoden</strong>:</p><ul class="incremental-list simple"><li><p><code class="java"><span class="name class">Object</span> <span class="name function">put</span><span class="punctuation">(</span><span class="name class">K</span> key<span class="punctuation">,</span> <span class="name class">V</span> value<span class="punctuation">)</span></code>	speichert "value" zum Auffinden mit "key"</p></li><li><p><code class="java"><span class="name class">Object</span> <span class="name function">get</span><span class="punctuation">(</span><span class="name class">Object</span> key<span class="punctuation">)</span></code>	findet das Objekt gespeichert unter "key"</p></li><li><p><code class="java"><span class="keyword">boolean</span> <span class="name function">containsKey</span><span class="punctuation">(</span><span class="name class">Object</span> key<span class="punctuation">)</span></code>	beantwortet, ob ein Objekt unter "key" liegt</p></li><li><p><code class="java"><span class="keyword">boolean</span> <span class="name function">containsValue</span><span class="punctuation">(</span><span class="name class">Object</span> value<span class="punctuation">)</span></code> beantwortet, ob "value" in der HashMap ist</p></li><li><p><code class="java"><span class="name class">Object</span> <span class="name function">remove</span><span class="punctuation">(</span><span class="name class">Object</span> key<span class="punctuation">)</span></code>	löscht "key" und die assoziierten Objekte</p></li></ul><ld-supplemental><p>Wir werden später klären warum nur die Parameter der Methode <code class="java">put</code> einen generischen Typ (<code class="java"><span class="name class">K</span></code> für <em>Key</em> (<span class="ger">Schlüssel</span>) und <code class="java"><span class="name class">V</span></code> für <em>Value</em> (<span class="ger">Wert</span>)) haben.</p></ld-supplemental></div><div class="compound incremental"><p><strong>Konkrete Implementierungen (Auswahl)</strong>:</p><p><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>HashMap</span></code></p><p>Erlaubt Zugriff auf Elemente durch einen berechneten Schlüssel, z. B. wird ein Schlüssel bestend aus „Nachname + Vorname“ in einen numerischen Index (Hashwert<a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a>) konvertiert und für effizienten Zugriff genutzt.</p><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-2" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-2">2</a><span class="fn-bracket">]</span></span><p>Hashing diskutieren wir später detailliert.</p></aside></aside></div></ld-story></ld-topic>
<ld-topic class="new-subsection" id="iterieren-uber-collections-bzw-laufen-uber-die-elemente-eine-collection"><h2>Iterieren über Collections bzw. Laufen über die Elemente eine Collection</h2></ld-topic>
<ld-topic id="java-util-iterator"><h2><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Iterator</span></code></h2><ld-story><ul class="list-with-explanations"><li><p>Java nutzt einen <code class="java"><span class="name class">Iterator</span></code>, um über Elemente in einer Collection zu laufen („zu iterieren“).</p><p>Normalerweise erhält man den Iterator durch den Aufruf von <code class="java"><span class="name function">iterator</span><span class="punctuation">(</span><span class="punctuation">)</span></code> auf der Collection.</p><ul class="simple"><li><p>Das gilt für alle Subklassen des Collection Interface</p></li><li><p>Für eine <code class="java"><span class="name class">HashMap</span></code> nutzt man <code class="java"><span class="name function">keys</span><span class="punctuation">(</span><span class="punctuation">)</span></code> und darauf <code class="java"><span class="name function">iterator</span><span class="punctuation">(</span><span class="punctuation">)</span></code></p></li><li><p><code class="java"><span class="name function">iterator</span><span class="punctuation">(</span><span class="punctuation">)</span></code> liefert eine Instanz von <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Iterator</span></code></p></li></ul></li></ul><p>\</p><ul class="incremental-list"><li><p>Ein Iterator bietet die Operationen:</p><ul class="list-with-explanations"><li><p><code class="java"><span class="keyword">boolean</span> <span class="name function">hasNext</span><span class="punctuation">(</span><span class="punctuation">)</span></code> – gibt es noch weitere Elemente?</p></li><li><p><code class="java"><span class="name class">Object</span> <span class="name function">next</span><span class="punctuation">(</span><span class="punctuation">)</span></code> – liefert das nächste Element, falls eines existiert;
sonst wird eine NoSuchElementException geworfen.</p><p>Prüfen Sie vorher die Existenz mit <code class="java"><span class="name function">hasNext</span><span class="punctuation">(</span><span class="punctuation">)</span></code>!</p></li><li><p><code class="java"><span class="keyword">void</span> <span class="name function">remove</span><span class="punctuation">(</span><span class="punctuation">)</span></code> – entfernt das zuletzt gelieferte Element; häufig nicht unterstützt. In diesem Fall wird eine <code class="java"><span class="name class">UnsupportedOperationException</span></code> geworfen.</p></li></ul></li></ul><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">final</span> <span class="name class">List</span><span class="punctuation">&lt;</span><span class="name class">Integer</span><span class="punctuation">&gt;</span> l <span class="operator">=</span> <span class="name class">Arrays</span><span class="punctuation">.</span><span class="name function">asList</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">,</span> <span class="literal number integer">2</span><span class="punctuation">,</span> <span class="literal number integer">3</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// Liste anlegen</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">int</span> r <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="keyword">final</span> <span class="keyword">var</span> it <span class="operator">=</span> l<span class="punctuation">.</span><span class="name function">iterator</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// Iterator holen</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="keyword">while</span><span class="punctuation">(</span>it<span class="punctuation">.</span><span class="name function">hasNext</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span> <span class="comment single">// weiter, solange Elemente da</span>
</code><small class="ln">5</small><code data-lineno="5">    r <span class="operator">+=</span> it<span class="punctuation">.</span><span class="name function">next</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// Element zur Summe addieren</span></code></pre><p>Sollte aufgrund von Domänenwissen bekannt sein, dass die Liste niemals leer ist, kann die Schleife auch so geschrieben werden:</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">do</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    r <span class="operator">+=</span> it<span class="punctuation">.</span><span class="name function">next</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// Element zur Summe addieren</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="punctuation">}</span> <span class="keyword">while</span><span class="punctuation">(</span>it<span class="punctuation">.</span><span class="name function">hasNext</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// weiter, solange Elemente da</span></code></pre></aside><div class="compound incremental"><p>Weiterhin gibt es eine besondere <code class="java"><span class="keyword">for</span></code>-Schleife (<span class="eng">foreach-loop</span>), die die Iteration über eine <code class="java"><span class="name class">Collection</span></code>, die das Interface <code class="java"><span class="name class">Iterable</span></code> implementiert vereinfacht:</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">for</span> <span class="punctuation">(</span><span class="name class">Integer</span> i <span class="operator">:</span> l<span class="punctuation">)</span> <span class="comment single">// für jedes Element in der Liste</span>
</code><small class="ln">2</small><code data-lineno="2">    r <span class="operator">+=</span> i<span class="punctuation">;</span> <span class="comment single">// Element zur Summe addieren</span></code></pre></aside><p><code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Iterable</span></code> definiert dabei lediglich das Protokoll zur Erzeugung eines <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Iterator</span></code>s.</p></div></ld-story></ld-topic>
<ld-topic id="das-iterator-design-pattern"><h2>Das Iterator-Design Pattern</h2><p>Die Implementation von <em>Iterator</em>\ s ist ein Beispiel für die Umsetzung des <em>Design Pattern</em> (<span class="ger">Entwurfsmuster</span>) „Iterator“.</p><object class="light-image align-center" data="images/iterator.svg" type="image/svg+xml" role="img" aria-label="Iterator Design Pattern"></object><ld-supplemental><p>Es ist hier festzustellen, dass in Java die Methode <code class="java"><span class="name function">hasNext</span><span class="punctuation">(</span><span class="punctuation">)</span></code> an die Stelle der Methode <code class="java"><span class="name function">isDone</span><span class="punctuation">(</span><span class="punctuation">)</span></code> rückt. die Methode <code class="java"><span class="name function">next</span><span class="punctuation">(</span><span class="punctuation">)</span></code> das Fortschalten des Iterators und die Rückgabe des nächsten Elements kombiniert. In anderen Sprachen bzw. im Textbuch sind diese beiden Operationen getrennt. Eine Design Pattern stellt auch immer nur eine Blaupause dar, die in der konkreten Umsetzung angepasst werden kann bzw. soll.</p></ld-supplemental></ld-topic>
<ld-topic class="exercises" id="ubung-4"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-5" data-exercise-id="5" data-exercise-title="5 - Iterables"><p class="ld-exercise-title rubric"><span>Iterables</span></p><ol class="arabic"><li><p>Implementieren Sie das Interface <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Iterable</span></code> für Ihre ursprüngliche Klasse <code class="java"><span class="name class">Pair</span></code>. D. h. schreiben Sie eine Methode <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Iterator</span> <span class="name function">iterator</span><span class="punctuation">(</span><span class="punctuation">)</span></code>, die einen Iterator für die Elemente des Paares zurückgibt.</p><p>Dazu ist es erforderlich, dass Sie eine Klasse <code class="java"><span class="name class">PairIterator</span></code> implementieren, die das Interface <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Iterator</span></code> implementiert. Diese Klasse führt dann die eigentliche Iteration durch. Die Erzeugung der Instanz von <code class="java"><span class="name class">PairIterator</span></code> erfolgt in der Methode <code class="java"><span class="name function">iterator</span><span class="punctuation">(</span><span class="punctuation">)</span></code>.</p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Die Klasse <code class="java"><span class="name class">PairIterator</span></code> benötigt einen Konstruktur, der eine Referenz auf das Pair bekommt, über das iteriert werden soll.</p></aside></li><li><p>Implementieren Sie einen generischen <code class="java"><span class="keyword">record</span></code> <code class="java"><span class="name class">Pair</span><span class="punctuation">&lt;</span><span class="name class">T</span><span class="punctuation">&gt;</span></code>, der einen Typparameter <code class="java"><span class="name class">T</span></code> definiert, der über beide Werte abstrahiert. Dieser <code class="java"><span class="keyword">record</span></code> soll <code class="java"><span class="name class">Iterable</span></code> so implementieren, dass die Werte bei der Iteration vom Typ <code class="java"><span class="name class">T</span></code> sind.</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:5In0wCa168Qf7E71buaSRQOkmmnpIrF+F0uooS7a1v0=:HWdMy4ot4jct0w2k:IdFM6JrE/aW/ge+WP709ZIlntJV2td3TYKthX8PnZoC6Neq3bGgk+o3vhNSeAn9tAoiZp7JocrxR5SLQ/BrA71qkV6NQvmkC3e+FADHuGlObqiOz7GqEjqHRJN+bQ3ymgkmvmtHlnTvZ9ydtSgMlikBaq1uUrkxjhTuqqYS+s28fwLjR0ETF41dOpPuBAANORKEr7M4gMJu5m2XUqD92I1p+cJdMTm5fDE4gtJ8+JF7Hx4BbeUaIH73Yeu6wjrh6G2fJMpXq6sMbo5r405hpiXv1Kv0sJrqK+ZeiHR6XYKbAUQvwSQW6TUAcsCklixAbvo+Mq9dXvZObQrDnxMqy6pGt/vp7MTSv/zherTYYuvi74e2YCAUI8hynciK5t0FfJgChwjs9vD7RqErqsSRx2H0qbaLwGKjRUIkhJZpT5cFuFpqcBsK1XdeBmJPSGTLKmBexAtPlCajN3pUaJh8+ak6bl4puddwYIiDbTueLlPV+tMVHK3UTFX9YJJPuSgpG396suZWYJhlDplY9ftt7lcSF5Dqnqaiz9uiRuyZU95nNvP2yarJMXehPhFt1hkbr1L44N0YQsQbt/fuvxGa0h+NXpxZGd4Zdy/toRqeMTftA1YEQ0PW70Jos7lPED+KugqjFzF2YJmSV0joleBeVP29Scf2lQKzyeW4IjdOsYxpzS6lXOoxuIGbBLXKCQKI45ZbvdYXbj8Mu6Ly0cI1UWW1rgCm6yMkkE3FfyxmZdB48wQyOcgc/kjvOXPP+oCZ2sT7ixCYG47JOL+aGomPNIVJGDJ6Fo01A4EDCVh3tu5wWA2BT6HeUrZBRWi928mvLbWHwbN0RUuuwJ3lR4Es+1ar7JzJlhWZDS/5Zgy5OeZF2YAn8VVEEg8WbYJyh/iCl0HXvfNqftOkf/+07pogW1I1OJw9PFeKow/KX19K3dNm8we6qKGEpMgg7dYMITdZvVKpl080dhOjNr2hM0oRlE7+TrjKUUqXQibXXBQ8UXv0KftuvuX8xnAMe1Gm6vB1mFTyFHO8/N6pM+WxDN9RHh0qD8WZBJJtwjFNR39ldZRJHPlADwJ2ojFj2SQGMu9NfPfKtZnyIR97i25fAoOoG/MX6yIBJCvOgCMOF6OSBQPAzIMG72RWu7/9rb8VYX5IDVSt+xnZJuGXDEhRjrQ46zdaQNhCRq7FvCPiZUU2olcP24Rhff2ocyofOaX7lHUjdMzoQbNyijPeFT/4KnBJBPkZUKlHGNxMPu/dQm4+NKdA7kFz0UnhHVPs
