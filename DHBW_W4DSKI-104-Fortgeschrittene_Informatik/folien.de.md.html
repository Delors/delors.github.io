<ld-topic id="lecture-w3dski_10-fortgeschrittene_informatik"><h1 class="title">W4DSKI 104 - Fortgeschrittene Informatik</h1><dl class="docinfo"><dt class="dozent">Dozent<span class="colon">:</span></dt><dd class="dozent"><a class="reference external" href="https://delors.github.io/cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></dd><dt class="contact">Kontakt<span class="colon">:</span></dt><dd class="contact"><a class="reference external" href="mailto:michael.eichberg@dhbw.de">michael.eichberg@dhbw.de</a>
, Raum 149B</dd><dt class="version">Version<span class="colon">:</span></dt><dd class="version">MA-WDSKI24A</dd></dl><ld-supplemental><dl class="field-list simple"><dt>KI Verwendung<span class="colon">:</span></dt><dd><p>Bei der Erstellung der Unterlagen wurden KI Assistenten (insbesondere Claude
aber ggf. auch ChatGPT, Ollama mit Gemma/LLama/Qwen oder OpenCode mit
Kimi/Qwen/Deepseek...) unterstützend eingesetzt.
Dies erfolgte insbesondere zur Unterstützung bei der Generierung von Grafiken
(d. h. SVG Dateien), oder um sich Übersichtstabellen generieren zu lassen.
Weiterhin wurde KI zur allgemeinen Qualitätssicherung eingesetzt.
Inhalte, die ggf. von der KI vorgeschlagen wurden, wurden im Falle der
Übernahme explizit validiert und angepasst.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic id="verteilte-systeme-kerninhalte-gem-mhb"><h2>Verteilte Systeme - Kerninhalte gem. MHB</h2><ul class="simple"><li><p>Terminologie, Konzepte, Architekturen, Anforderungsprofile und Architekturmodelle für verteilte Systeme</p></li><li><p>Synchrone und asynchrone Kommunikation und entfernter Methodenaufruf (RMI, RPC, Web-Services, ...), Übertragungsprotokolle und APIs zwischen Client und Server (z.B. HTTP, HTTPS, WebSockets, Fetch API, etc.), Einführung in das RESTful API-Design</p></li><li><p>Herausforderungen in verteilten Systemen</p></li><li><p>High Performance Computing und Distributed Computing</p></li><li><p>Sicherheitsaspekte bei der Verarbeitung von verteilten Anwendungen; Authentifizierung, Autorisierung, Rollenkonzepte</p></li><li><p>Grundlagen Ubiquitous Computing, Internet der Dinge, MQTT, Edge Computing, Streaming &#x26; Messaging</p></li></ul></ld-topic>
<ld-topic id="web-entwicklung-kerninhalte-gem-mhb"><h2>Web-Entwicklung  - Kerninhalte gem. MHB</h2><ul class="simple"><li><p>Frontend-Technologien, HTML, CSS, JavaScript</p></li><li><p>Konzepte, Entwurfsmuster und Werkzeuge für die Entwicklung von Web-Anwendungen - Entwurf und Umsetzung von Responsive Web-Design und zustandsbehafteten Web-Anwendungen</p></li><li><p>Abgrenzung client-side und Server-Side-Rendering</p></li></ul><div class="compound accentuate"><p class="rubric">Labor Web Projekt</p><p>Die theoretischen Inhalte sollen jeweils auch mit aktuellen Technologien beispielhaft umgesetzt werden. Es soll eine übergreifende Anwendung entwickelt werden anhand derer das Zusammenspiel deutlich wird.</p></div></ld-topic>
<ld-topic id="prufungsleistung-portfolio"><h2>Prüfungsleistung - Portfolio</h2><ld-deck><ld-card><p class="rubric">Hintergrund</p><ul class="simple"><li><p>Das Modul hat 5 ECTS</p></li><li><p>Insgesamt gibt es max. 120 Punkte</p></li></ul><p class="rubric">Bewertung</p><ul class="simple"><li><p>Kurztest 25%</p></li><li><p>Portfolioaufgabe 75% in Teams von 5 bis 6 Studierenden. Die Aufgabe umfasst Präsentationen, Code Reviews und die Entwicklung eines Projekts.</p></li></ul></ld-card><ld-card class="incremental"><p>Gegenstand der Portfolioaufgabe ist die Entwicklung eines verteilten Web-Spiels für mehrere Spieler. Die Wahl des Spieles ist weitgehend frei.</p><p>Folgende Anforderungen sind zu erfüllen:</p><ul class="incremental-list"><li><p>Ihr Projekt muss am Ende spielbar sein in dem Sinne, dass alle Kursteilnehmer die Möglichkeit haben gleichzeitig zu spielen; ggf. in mehreren Kleingruppen gegeneinander.</p></li><li><p>Das Spiel muss rundenbasiert sein.</p><ld-supplemental><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Echtzeitspiele sind aufgrund der damit verbundenen Komplexität ausgeschlossen.</p></aside></ld-supplemental></li><li><p>Sie können sich von klassischen Brettspielen oder Kartenspielen inspirieren lassen.</p></li><li><p>Die Entwicklung erfolgt in Gruppen von 5 bis 6 Personen und muss immer einen Webclient und eine Serverkomponente umfassen.</p></li><li><p>Die eingesetzten Technologien sind auf JavaScript, CSS und HTML sowie ggf. Python für die Serverseite beschränkt. Frameworks, um ggf. die Kommunikation zwischen Web-Client und Server zu vereinfachen, dürfen eingesetzt werden.</p></li><li><p>Die Webanwendung muss responsive sein und braucht nur auf den neuesten Browsern laufen: Safari, Chrome und Firefox. Es sollten also die neuesten Web-Technologien verwendet werden.</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="termine-1-block"><h2>Termine - 1. Block</h2><p>(Klassische Vorlesungen und Übungen)</p><ul class="simple"><li><p>7. May 2025 von 09:30 bis 12:45 und 13:15 bis 16:30, CEST</p></li><li><p>12. May 2025 von 09:30 bis 12:45, CEST</p></li><li><p>19. May 2025 von 09:30 bis 12:45, CEST</p></li></ul></ld-topic>
<ld-topic id="termine-2-block"><h2>Termine - 2. Block</h2><ld-deck><ld-card><p>(Vorlesungen und Übungen zusätzlich zur Begleitung des Projekts sowie ein Test.)</p></ld-card><ld-card class="incremental"><p class="rubric">18. Jun 2025 von 09:30 bis 12:45 und 13:30 bis 16:45, CEST</p><p><strong>Ablauf</strong></p><ol class="arabic"><li><p>Vorstellung der Projekte</p><p>(8-10 Minuten pro Gruppe - 1 Personen)</p><ld-supplemental><p>An dem Tag muss das Spielkonzept weitgehend fertig sein und auch das Design der Oberfläche muss weitestgehend fertig sein.</p><p><span class="peripheral">Die eigentliche Spiellogik, insbesondere die Interaktion mit dem Server - muss weder angefangen noch fertig sein!</span></p></ld-supplemental></li><li><p>Durchführung eines Code Reviews (HTML und CSS) eines anderen Projektes (2 * 45 Minuten)</p><ld-supplemental><p>Die Code Reviews erfolgen in zwei Runden, damit jede Gruppe ein Review bekommmt!</p><p>Welche Gruppe welche andere Gruppe reviewt wird <em>nach</em> den Vorträgen bekannt gegeben.</p></ld-supplemental><ld-presenter-note encrypted="">MTAwMDAw:geLHbxOx7iZOWbtA82AcxQvnsbGGvAHP5mAO6cDdz8U=:TIPIx2O4Bw/E5y/I:nW2TRtacaiwhKxysOa3G1f5OWkyBR3fymWKR0L1ztkMIXUAg9twrd3J4NSb1ddma4DLwTRKtw+SzCnP322Rqh5XOOrJeG370agupTyIQ9C8fL46FWxDqV62hWirHBk6/8q7UNSwSqM4xW1hYdwqPJDB536QMYUjkYasOSJLdy4j0otFjLxGnSE64/yWTl66TrD6veu3tHIa+/P4Pd63YY7PpEJFTuNqdyynYthNEVTwKV3jLyVgj6KAebaa9YXXc4BcanvGrgIBmW1zMxLaOvdCfXcp9ppvQSy/TW1Ym4b7Qt9IxtwiB73beXgLkEVuwTRxP+mWWGQlNL0IGPRLvtNWrODoujfgeZofrgs9+AYmpYdKEkrwqNpWK2/5bK6TW0N18FT8MFYD/vA7qxg6T/QV6+Z7hR4W28/7kV5CL6eNQow2GdM7Hj9LLicK5SAThGmxXnmDGLC12uqo8hlPS9aQp0+g+QqQ8PE0rAwdy2aUmXz9YoTZdQyj1GdMyRrZ9okYT1/G9CpJNTUujHoUscPIvB952B2+4v9eH9Er9doXJWGatlLaC6az42rhRbd71uEtKE8ov1of4W2P8AumvgAcUGHdG1cIQY9yrEv/JXqs8H9Gj1zuvXXR/wHUQm17hA/XTZtnGGYTIuWLQycTzyNm9wPFIsY6iOR53giepo6yYWKh/yxMj3/W6XjyR1BE6I+rfz5ZGopJuQWb7qIlyefF+nCNHJIbzvJNdxKvFHW/dY/pRu8QcjNOJDVwQl5kYC8Jtgvz1nQ+PQqb6u1Bi7vucLof4T9Z6SM8m3O4Py4/DOHoeyaGcDg5OIHsAnr/AyM1QhJx5sQeyr5 <ld-topic id="prufungsleistungsbestandteile"><h2>Prüfungsleistungsbestandteile</h2><table class="incremental-table-rows booktabs highlight-cell-and-row-on-hover" style="width: 100%;"><thead><tr><th class="head"><p>Bestandteil</p></th><th class="head"><p>Benotung</p></th><th class="head"><p>Punkte</p></th></tr></thead><tbody><tr><td><p>ein bewerteter Kurztest</p></td><td><p>Individualnote</p></td><td><p>30</p></td></tr><tr><td><p>initiale Projektpräsentation</p></td><td><p>Gruppennote</p></td><td><p>05</p></td></tr><tr><td><p>Qualität des Reviews (d.h. des Reports)</p></td><td><p>Gruppennote</p></td><td><p>15</p></td></tr><tr><td><p>zweite Projektpräsentation</p></td><td><p>Gruppennote</p></td><td><p>05</p></td></tr><tr><td><p>Qualität des Reviews (d.h. des Reports)</p></td><td><p>Gruppennote</p></td><td><p>20</p></td></tr><tr><td><p>Spielbarkeit (inkl. Abschlusspräsentation)</p></td><td><p>Gruppennote</p></td><td><p>10</p></td></tr><tr><td><p>Projekt</p></td><td><p>Gruppennote</p></td><td><p>35</p></td></tr></tbody></table></ld-topic>
<ld-topic id="abgabe-erganzt-am-14-juli-2025"><h2>Abgabe (Ergänzt am 14. Juli 2025)</h2><ld-story><ul><li><p>Abgabe des Projekts am 3.8.2025 bis 23:59 Uhr per Moodle.</p><p>(Die Abgabemöglichkeit ist breits eingerichtet und bis zur Deadline jederzeit möglich.)</p></li><li><p>Abzugeben sind:</p><ul class="incremental-list list-with-explanations"><li><p><strong>die vollständigen Sourcen des Projekts</strong>; sollten externe Libraries verwendet worden sein, so ist eine entsprechende <span class="docutils literal">package.json</span> bzw. <span class="docutils literal">requirements.txt</span> Datei beizulegen, die alle Abhängigkeiten des Projekts enthält.</p></li><li><p>eine Beschreibung der Architektur in Hinblick auf den Nachrichtenaustausch.</p><p>D. h. wann werden welche Nachrichten vom Client zum Server und wieder zurück zum Client gesendet. Wie ist das Datenformat der Nachrichten. Neben einer Überblicksdarstellung ist eine exemplarische Darstellung der Nachrichten anzugeben.</p></li><li><p>das Projekt muss eine <strong>License.txt</strong> enthalten, die die Lizenzbedingungen des Projekts beschreibt. (Für eine Opensourcelizenz: <a class="reference external" href="https://opensource.org/licenses">https://opensource.org/licenses</a>)</p></li><li><p>das Projekt muss eine <strong>README.md</strong> enthalten, die beschreibt wie der Server zu konfigurieren und zu starten ist.</p></li><li><p>ein kures Dokument, dass besagt <strong>wer an welchem Teil gearbeitet hat</strong></p></li><li><p>eine kurze <strong>Erklärung welche KI Tools wo und wie verwendet wurden</strong>.</p><p>Das bezieht alle Aspekte ein: Generierung von Code, Icons, Musik und Dokumentation.</p></li></ul></li></ul></ld-story></ld-topic>
<ld-topic id="benotungsgrundlage-fur-das-projekt-erganzt-am-14-juli-2025"><h2>Benotungsgrundlage für das Projekt (Ergänzt am 14. Juli 2025)</h2><ul><li><p>(max. 25 Punkte) die Qualität des Sourcecodes (HTML, CSS, JavaScript und ggf. Python)</p><p>Hierbei werden insbesondere die Kriterien beachtet, die auch bei den Reviews Gegenstand waren. Darüber hinaus wird auf die Verständlichkeit der Netzwerkkommunikation geachtet.</p></li><li><p>(max. 10 Punkte) die Qualität der Dokumentation (Readme und Architektur)</p></li><li><p>die anderen Dokumente (License.txt, Erklärung bzgl. KI Tools, Beteiligung an der Entwicklung) führen ggf. zum Aufschub der Notenmeldung</p></li></ul></ld-topic>
