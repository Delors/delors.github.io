<ld-topic class="new-section transition-move-to-top" id="einfuhrung"><h2>Einführung</h2></ld-topic>
<ld-topic class="repetition" id="was-ist-ein-algorithmus"><h2>Was ist ein Algorithmus?</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>Ein Algorithmus ist eine endliche, wohl-definierte Abfolge von Anweisungen, die zur Lösung eines Problems führen.</p></aside><ld-deck><ld-card><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><ul class="incremental-list simple"><li><p>Berechnen / Arithmetik</p></li><li><p>Suchen</p></li><li><p>Sortieren</p></li><li><p>Planen</p></li><li><p>Simulieren</p></li><li><p>Visualisieren und Interagieren</p></li></ul></aside></ld-card><ld-card class="incremental"><p>Die Spezifikation eines Algorithmus kann erfolgen...</p><ul class="incremental-list simple"><li><p>in einer Programmiersprache (z. B. Java, Python)</p></li><li><p>in einer formalen Sprache (z. B. Z3, Alloy)</p></li><li><p>in einer natürlichen Sprache (z. B. Deutsch, Englisch)</p></li><li><p>in einer graphischen Sprache (Diagramme, z. B. UML)</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic class="repetition" id="was-ist-eine-datenstruktur"><h2>Was ist eine Datenstruktur?</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>Eine Datenstruktur beschreibt eine Möglichkeit...</p><!--class: incremental-list--><ul class="simple"><li><p>Daten zu organisieren,</p></li><li><p>Daten zu verwalten und</p></li><li><p>Daten zu speichern,</p></li><li><p>um sie effizient zu nutzen.</p></li></ul></aside><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><ul class="incremental-list simple"><li><p><em>Primitive</em></p></li><li><p>Arrays</p></li><li><p>Listen</p></li><li><p>Bäume</p></li><li><p>Graphen</p></li><li><p>...</p></li></ul></aside></ld-topic>
<ld-topic class="new-section transition-move-to-top" id="algorithmen"><h2>Algorithmen</h2></ld-topic>
<ld-topic id="algorithmus-beispiel"><h2>Algorithmus: Beispiel</h2><aside class="admonition admonition-aufgabe"><p class="admonition-title">Aufgabe</p><p>Gegeben ein nicht-sortiertes Array X mit N Integer Elementen. Was ist das größte Element?</p></aside><ld-deck class="incremental"><ld-card><p class="rubric">Algorithmus - natürlich sprachlich</p><ol class="arabic incremental-list simple"><li><p>Nehme an, das erste Element ist das Maximum</p></li><li><p>Vergleiche das nächste Element des Arrays mit dem bisherigen Maximum.</p></li><li><p>Wenn es größer ist, aktualisiere das Maximum auf dieses Element</p></li><li><p>Wiederhole 2 und 3 bis wir am Ende des Arrays angelangt sind</p></li></ol></ld-card><ld-card class="incremental"><p class="rubric"><img class="icon" style="height:0.75em" src="/LectureDoc2/dist/ext/icons/duke.svg" alt="Java" /> Algorithmus</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">public</span> <span class="keyword">int</span> <span class="name function">max</span><span class="punctuation">(</span><span class="keyword">int</span><span class="punctuation">[</span><span class="punctuation">]</span> x<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">int</span> max <span class="operator">=</span> x<span class="punctuation">[</span><span class="literal number integer">0</span><span class="punctuation">]</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">for</span> <span class="punctuation">(</span><span class="keyword">int</span> i <span class="operator">=</span> <span class="literal number integer">1</span><span class="punctuation">;</span> i <span class="operator">&lt;</span> x<span class="punctuation">.</span>length<span class="punctuation">;</span> i<span class="operator">++</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">4</small><code data-lineno="4">        <span class="keyword">if</span> <span class="punctuation">(</span>x<span class="punctuation">[</span>i<span class="punctuation">]</span> <span class="operator">&gt;</span> max<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">5</small><code data-lineno="5">            max <span class="operator">=</span> x<span class="punctuation">[</span>i<span class="punctuation">]</span><span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6">        <span class="punctuation">}</span>
</code><small class="ln">7</small><code data-lineno="7">    <span class="punctuation">}</span>
</code><small class="ln">8</small><code data-lineno="8">    <span class="keyword">return</span> max<span class="punctuation">;</span>
</code><small class="ln">9</small><code data-lineno="9"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric"><img class="icon" style="height:0.75em" src="/LectureDoc2/dist/ext/icons/python-logo-only.svg" alt="Python" /> Algorithmus</p><pre class="code python copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">def</span> <span class="name function">max</span><span class="punctuation">(</span>x<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name builtin">max</span> <span class="operator">=</span> x<span class="punctuation">[</span><span class="literal number integer">0</span><span class="punctuation">]</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">for</span> i <span class="keyword">in</span> <span class="name builtin">range</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">,</span> <span class="name builtin">len</span><span class="punctuation">(</span>x<span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln">4</small><code data-lineno="4">        <span class="keyword">if</span> x<span class="punctuation">[</span>i<span class="punctuation">]</span> <span class="operator">&gt;</span> <span class="name builtin">max</span><span class="punctuation">:</span>
</code><small class="ln">5</small><code data-lineno="5">            <span class="name builtin">max</span> <span class="operator">=</span> x<span class="punctuation">[</span>i<span class="punctuation">]</span>
</code><small class="ln">6</small><code data-lineno="6">    <span class="keyword">return</span> <span class="name builtin">max</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Analyse (aller drei Implementierungen)</p><dl class="incremental-list dd-margin-left-12em field-list simple"><dt>Zeitkomplexität<span class="colon">:</span></dt><dd><p><span class="incremental">hängt direkt von der Anzahl der Elemente ab</span></p></dd><dt>Speicherkomplexität<span class="colon">:</span></dt><dd><p><span class="incremental">eine Variable für das Maximum</span></p></dd><dt>deterministisch<span class="colon">:</span></dt><dd><p><span class="incremental">ja</span></p></dd><dt>endliche Ausführung<span class="colon">:</span></dt><dd><p><span class="incremental">ja</span></p></dd></dl></ld-card></ld-deck></ld-topic>
<ld-topic class="exercises" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Mehrheitselement finden"><p class="ld-exercise-title rubric"><span>Mehrheitselement finden</span></p><ol class="arabic simple"><li><p>Schreiben Sie einen Algorithmus, um das <em>Mehrheitselement</em> in einem unsortierten Array von Integer Werten zu finden. Das <em>Mehrheitselement</em> ist das Element, das <strong>mehr als</strong> <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">⌊</mo><mi>n</mi><mi mathvariant="normal">/</mi><mn>2</mn><mo stretchy="false">⌋</mo></mrow><annotation encoding="application/x-tex">⌊n/2⌋</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">⌊</span><span class="mord mathnormal">n</span><span class="mord">/2</span><span class="mclose">⌋</span></span></span></span></span> mal vorkommt. Sie können davon ausgehen, dass das Mehrheitselement immer vorhanden ist.</p></li><li><p>Wie schnell ist Ihr Algorithmus? Wovon hängt dies maßgeblich ab? (Best- und Worst-Case)</p></li><li><p>Wie viel Speicherplatz benötigt Ihr Algorithmus?</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:nHrd7IaKjsKB4aJGwE2dciZVS5BVGA1KSTQCPpoUHx4=:bpgRnd2WVeqPM5lW:O5yquxsxMSbh12lx2EODylXQNTxuWQYq0nfm1J1d/BMrWzbFU8RK7yZAJAKPIn9nkYNIDxFxO7PXrs7zapvyEyfdUF3lN6DwXMjDveFiRexXMNrDjZuH0/LOIiIatJFNjhNiYu/MKrAE1hXD0l/BaWIfc2OyaO+v5gvUSclmYvnq74pA4q3MH+tOkTwOoRfogXI6RZ9aWwtzSZoZAh3zMvaMX2J0gq6xLihkxX/zsH0GRNTqAPEA4FcrtOeUl0Rdbl361v2Sb5bipou8HZrv1KdsQMJ3N3NRrjPpguTnSzBV7KrfzT8Arm7BafNULJ7nBI/iD61Mb5g4+FAi66N2PTQf2mpwV6nEAKaj94LJ4dwOjMfwvr5OXx+ZqDV9DoE6OPVllaZCO0X0XyLN3zKbdFrFPPca3j4AbWZL5jyraxEPaBdRDQBVRP8X1yy6Rv9Qoda3t7D++xHqe8KyZBMBW9nGAES9H8Fui7q6WWDoP1fqFcPevtOPR <span class="incremental">d. h. zusammenhängenden Speicherbereich speichert.</span></p></aside><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard incremental literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">var</span> myIntArray <span class="operator">=</span> <span class="keyword">new</span> <span class="keyword">int</span><span class="punctuation">[</span><span class="literal number integer">5</span><span class="punctuation">]</span> <span class="punctuation">{</span><span class="literal number integer">1</span><span class="punctuation">,</span><span class="literal number integer">2</span><span class="punctuation">,</span><span class="literal number integer">3</span><span class="punctuation">,</span><span class="literal number integer">9</span><span class="punctuation">,</span><span class="operator">-</span><span class="literal number integer">5</span><span class="punctuation">}</span><span class="punctuation">;</span></code></pre><pre class="code java copy-to-clipboard incremental literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">var</span> myBooleanArray <span class="operator">=</span> <span class="keyword">new</span> <span class="keyword">boolean</span><span class="punctuation">[</span><span class="literal number integer">2</span><span class="punctuation">]</span> <span class="punctuation">{</span><span class="keyword constant">true</span><span class="punctuation">,</span><span class="keyword constant">false</span><span class="punctuation">}</span><span class="punctuation">;</span></code></pre><pre class="code java copy-to-clipboard incremental literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">var</span> myDoubleArray <span class="operator">=</span> <span class="keyword">new</span> <span class="keyword">double</span><span class="punctuation">[</span><span class="literal number integer">2</span><span class="punctuation">]</span> <span class="punctuation">{</span><span class="literal number integer">1.0</span><span class="punctuation">,</span><span class="operator">-</span><span class="literal number integer">3</span><span class="punctuation">}</span><span class="punctuation">;</span></code></pre></aside><aside class="admonition incremental" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><ul class="incremental-list simple"><li><p>Wie groß ist der Speicherplatz, den ein Array mit N Elementen benötigt?</p></li><li><p>Wie schnell ist der Zugriff auf ein Element (n)?</p></li></ul></aside></ld-topic>
<ld-topic id="dynamische-arrays"><h2>Dynamische Arrays</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>Ein dynamisches Array (Liste) ist eine Datenstruktur, die eine
Sammlung von Elementen gleicher Größe in einem kontinuierlichen,
d. h. zusammenhängenden Speicherbereich speichert <span class="incremental">und erweiterbar ist.</span></p><ul class="incremental-list list-with-explanations"><li><p>Ein dynamisches Array ist ein Array, das die Größe anpassen kann.</p><p>Typischwerweise wird ein neues Array mit doppelter Größe erstellt, wenn der Speicherplatz erschöpft ist. Die Elemente des alten Arrays werden dann in das neue Array kopiert.</p></li><li><p>dynamische Arrays werden basierend auf (statischen) Arrays implementiert</p></li></ul></aside><aside class="admonition incremental" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><ul class="incremental-list simple"><li><p>Wie schnell ist das Einfügen eines neuen Elements?</p></li><li><p>Wie schnell ist das Löschen eines Elements?</p></li></ul></aside></ld-topic>
<ld-topic id="verkettete-listen"><h2>Verkettete Listen</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>Eine verkettete Liste ist eine Datenstruktur, die eine
Sammlung von Elementen in Knoten speichert.</p><ul class="incremental-list list-with-explanations simple"><li><p>Jeder Knoten enthält einen Zeiger auf das nächste Element und speichert den aktuellen Wert.</p></li><li><p>Im Falle einer doppelt verketteten Liste enthält jeder Knoten auch einen Zeiger auf das vorherige Element.</p></li><li><p>Verkettete Listen sind dynamisch und können beliebig wachsen.</p></li><li><p>Verkettete Listen sind nicht auf einen festen Speicherplatz angewiesen.</p></li></ul></aside></ld-topic>
<ld-topic class="exercises" id="ubung-verkette-listen"><h2>Übung - Verkette Listen</h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Einfach verkettete Liste"><p class="ld-exercise-title rubric"><span>Einfach verkettete Liste</span></p><ol class="arabic simple"><li><p>Modellieren Sie die Klassen und Ihre Beziehungen mit Hilfe eines UML Klassendiagramms.</p></li><li><p>Implementieren Sie eine generische, einfach verkettete Liste in Java.</p><ul class="list-with-expanations simple"><li><p>Implementieren Sie die Klasse für die Knoten als innere Klasse, der Klasse <code class="java"><span class="name class">LinkedList</span></code>.</p></li><li><p>Implementieren Sie folgende Methoden: <code class="java"><span class="name function">isEmpty</span><span class="punctuation">(</span><span class="punctuation">)</span></code>, <code class="java"><span class="name function">prepend</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code>, <code class="java"><span class="name function">head</span><span class="punctuation">(</span><span class="punctuation">)</span></code> und <code class="java"><span class="name function">deleteHead</span><span class="punctuation">(</span><span class="punctuation">)</span></code>.</p></li><li><p>Achten Sie darauf, dass Ihr Programm immer aussagekräftige Ausnahmen wirft.</p></li><li><p>Implementieren Sie die notwendigen Interfaces, um eine foreach Schleife nutzen zu können, um über die Liste zu iterieren.</p></li></ul></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:YL0vqHgqca2eZpoKTSKSGun/zxxMwJalmRFM0Cugrb8=:hgLK2/1M1jLdW1cn:tjjROgXGd0d4cLBX668U7OSoJg3sbMqMYNhYwfOcxwpU1AzDeAhhIA4VlRMgWgiYFcmlK4y5Jvykd3KgEpU6ncW7F+SEus8imKCQaq+e05iDZ03K4Q6IkzpEtYvm9L/2oW80JH4Y8Jeh8AlkZtWZw8sYnzpNH3avMbA40bSF4rS6FaIy6uIUTdoxuL83/mxWOH9Ge9w3+hh22vhH6sCAyb2/yA1XyUzBj7pNa4uErOGCQAh892oZ6JkhebNdAB95LnfGynw5q <ld-topic class="exercises" id="ubung-verkette-listen-1"><h2>Übung - Verkette Listen</h2><div class="ld-exercise" id="ld-exercise-3" data-exercise-id="3" data-exercise-title="3 - Doppelt verkettete Liste"><p class="ld-exercise-title rubric"><span>Doppelt verkettete Liste</span></p><ol class="arabic list-with-explanations"><li><p>Implementieren Sie eine generische, doppelt verkettete Liste in Java. Der generische Typparameter sei <code class="java"><span class="name class">T</span></code>.</p><p>Orientieren Sie sich ggf. an der Implementierung für eine einfach verkettete Liste.</p></li></ol><ol class="arabic list-with-sublists simple" start="2"><li><p>Implementieren Sie die folgenden Methoden.  Bestimmen Sie das <em>worst-case</em> verhalten der Operationen (Laufzeit) in Abhängigkeit von der Anzahl der Elemente N, die bereits in der Liste gespeichert sind.</p><ul class="simple"><li><p>Einfügen eines neuen Wertes (am Ende der Liste; d. h. <span class="docutils literal">append</span>)</p></li><li><p>Einfügen eines neuen Wertes (am Anfang der Liste; d. h. <span class="docutils literal">prepend</span>)</p></li><li><p>Löschen eines Wertes (d. h. <code class="java"><span class="name function">remove</span><span class="punctuation">(</span><span class="name class">T</span> value<span class="punctuation">)</span></code>)</p></li><li><p>Überprüfen ob ein Wert vorhanden ist</p></li><li><p>eine Funktion (<code class="java">forEachReverse</code>), um von hinten nach vorne durch die Liste zu iterieren</p></li></ul></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:kw5Yw0fQ7RgM0Q7sJQNBChZoRmTWVjnxCVOPTuQQFLM=:iZjQxiZxbwA2o3tp:WJo0M2S+AOZb+D1FdkhOqmTEDa+XbDI94wkOtsmBZC/k+52Zsk+sk4J73qesTcWC/ajKyzp51FgWPna6UjquPLp1oPNa2T8Ut6O3hVCV4WY0nd6UrW2B5/jH5u75RQ7WIBTK5//m31H/dedseexiCfJLf+9VuKjeMLqdOO68O6+IzwnyFEeyIAIYw7iK7PVgPc4sJAGvZk9VD/sOp9lINwC5OyH/01NQMyfuJGEnm+lKs/Bzcd1tFqYSVuzANWfZ7TLeLmXbv3xZKVDdVh7NiY/Lh6s6MRxNAIXTHbwAIBpu+Tou9+OHXG7Wh7GBs7Ju84zeeF+8KiNVucXlO
