<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg">
<defs>

    <!-- Gemeinsame Symbole für Netzwerk-Diagramme (Rechner, Server, Internet,
         Firewall, …) aller Foliensätze. Präfix "net-".

         Einbinden im Frontmatter eines Foliensatzes:
             ld:
               include-globals:
                 - ../shared/svgs/net-symbols.svg

         Verwendung: <use href="#net-…" x="…" y="…"/>.

         Farbe: Alle Formen verwenden currentColor; die Farbe folgt also
         color. Eine Gruppe setzt sie (class="ld-success"), eine einzelne
         Instanz kann sie mit einer Farbklasse am <use> ändern:
             <use href="#net-server" class="ld-info" x="…" y="…"/>
         CSS-Selektoren greifen nicht in den Shadow-Tree eines <use>, vererbte
         Eigenschaften (color, Custom Properties) dagegen schon. Die Formen
         verwenden deshalb Deckkraft-Attribute statt der ld-Klassen
         (fill-opacity 0.1 = ld-panel, 0.3 = ld-cell).

         Anpassung: Custom Properties, jeweils mit Standardwert im var(); sie
         werden am <use> (style="--net-…: …") oder an einer umgebenden Gruppe
         bzw. am <svg> gesetzt. Übersicht:
             --net-server-stroke-width       (0.18)
             --net-server-slot-stroke-width  (0.08)
             --net-server-frame-color        (currentColor)
             --net-cloud-stroke-width        (0.16)
             --net-flame-color               (#f97316)
             --net-flame-core-color          (#facc15)

         Keine viewBox: x/y des <use> verschieben das Symbol, die Koordinaten
         entsprechen denen der Diagramme. overflow="visible", weil ein
         <symbol> sonst an seinem Viewport abschneidet. -->

    <!-- Server: 6 × 6,8, Ursprung oben links.
         --net-server-stroke-width       Rahmen                  (0.18)
         --net-server-slot-stroke-width  Einschübe               (0.08)
         --net-server-frame-color        Farbe des Rahmens       (currentColor)
         Ein dunklerer Rahmen: --net-server-frame-color:
         oklch(from currentColor calc(l * 0.5) c h). -->
    <symbol id="net-server" overflow="visible">
        <rect x="0" y="0" width="6" height="6.8" rx="0.6"
              fill="currentColor" fill-opacity="0.1"
              style="stroke: var(--net-server-frame-color, currentColor);
                     stroke-width: var(--net-server-stroke-width, 0.18);"/>
        <g fill="currentColor" fill-opacity="0.3" stroke="currentColor"
           style="stroke-width: var(--net-server-slot-stroke-width, 0.08);">
            <rect x="0.7" y="0.7" width="4.6" height="1.5" rx="0.25"/>
            <rect x="0.7" y="2.5" width="4.6" height="1.5" rx="0.25"/>
            <rect x="0.7" y="4.3" width="4.6" height="1.5" rx="0.25"/>
        </g>
        <g fill="currentColor">
            <circle cx="1.4" cy="1.45" r="0.22"/>
            <circle cx="1.4" cy="3.25" r="0.22"/>
            <circle cx="1.4" cy="5.05" r="0.22"/>
        </g>
    </symbol>

    <!-- Laptop (Client mit Browser): Bildschirm 0,2 … 7,2 × 0 … 4,8,
         Tastatur -0,7 … 8,1 × 4,8 … 5,8; Mitte x = 3,7. -->
    <symbol id="net-laptop" overflow="visible">
        <rect x="0.2" y="0" width="7" height="4.8" rx="0.4"
              fill="currentColor" fill-opacity="0.1"
              stroke="currentColor" stroke-width="0.18"/>
        <rect x="0.7" y="0.5" width="6" height="1" rx="0.2"
              fill="none" stroke="currentColor" stroke-width="0.08"/>
        <g fill="currentColor">
            <circle cx="1.1" cy="1" r="0.13"/>
            <circle cx="1.55" cy="1" r="0.13"/>
            <circle cx="2" cy="1" r="0.13"/>
        </g>
        <g fill="currentColor" fill-opacity="0.3">
            <rect x="2.7" y="0.75" width="3.6" height="0.5" rx="0.25"/>
            <rect x="0.8" y="2" width="4.6" height="0.45" rx="0.2"/>
            <rect x="0.8" y="2.9" width="5.6" height="0.45" rx="0.2"/>
            <rect x="0.8" y="3.8" width="3.4" height="0.45" rx="0.2"/>
        </g>
        <path d="M 0.1 4.8 L 7.3 4.8 L 8.1 5.8 L -0.7 5.8 Z"
              fill="currentColor" fill-opacity="0.3"
              stroke="currentColor" stroke-width="0.18" stroke-linejoin="round"/>
    </symbol>

    <!-- Internet-Wolke: ca. 12,8 × 7,4, Ursprung in der Mitte
         (x -6,6 … 6,2, y -3,7 … 3,7). Die Beschriftung steht im Diagramm. -->
    <symbol id="net-cloud" overflow="visible">
        <path d="M -3.67 3.21 C -5.08 3.21 -6.09 2.10 -5.89 0.78
                 C -6.59 0.38 -6.39 -1.03 -5.23 -1.23
                 C -5.18 -2.54 -3.72 -3.30 -2.51 -2.54
                 C -1.75 -3.65 0.82 -3.70 1.67 -2.39
                 C 3.44 -2.94 5.05 -1.83 4.55 -0.32
                 C 6.16 -0.02 6.21 2.20 4.70 2.80
                 C 4.30 3.51 2.38 3.71 1.47 3.11 L -3.67 3.21 Z"
              fill="var(--background-color)" stroke="currentColor"
              style="stroke-width: var(--net-cloud-stroke-width, 0.16);"/>
    </symbol>

    <!-- Firewall-Flamme: 2,2 × 3,6, Ursprung in der Mitte. Feste Farben,
         weil sie Bedeutung tragen und auf Hell und Dunkel lesbar sind. -->
    <symbol id="net-flame" overflow="visible">
        <path d="M 0 -1.8 C -0.8 -1 -1.1 -0.4 -1.1 0.2 C -1.1 1.2 -0.4 1.8 0 1.8
                 C 0.4 1.8 1.1 1.2 1.1 0.2 C 1.1 -0.3 0.8 -0.7 0.5 -1.1
                 C 0.6 -0.5 0.3 -0.1 0 -0.1 C -0.2 -0.1 -0.3 -0.3 -0.2 -0.6
                 C -0.1 -1 0 -1.4 0 -1.8 Z"
              style="fill: var(--net-flame-color, #f97316);"/>
        <path d="M 0 0 C -0.3 0.3 -0.4 0.6 -0.4 0.9 C -0.4 1.3 -0.2 1.5 0 1.5
                 C 0.2 1.5 0.4 1.3 0.4 0.9 C 0.4 0.5 0.2 0.3 0 0 Z"
              style="fill: var(--net-flame-core-color, #facc15);"/>
    </symbol>

    <!-- Lüftungsschlitze eines Geräts: drei Punkte, 1,6 breit, Ursprung am
         ersten Punkt. -->
    <symbol id="net-vents" overflow="visible">
        <g fill="currentColor">
            <circle cx="0" cy="0" r="0.16"/>
            <circle cx="0.8" cy="0" r="0.16"/>
            <circle cx="1.6" cy="0" r="0.16"/>
        </g>
    </symbol>

    <!-- Plaketten "blockiert" / "erlaubt": Kreis mit Radius 1,1, Ursprung in
         der Mitte. Ein Pfeil, der die Plakette berühren soll, endet
         1,1 + 1,5 × stroke-width vor der Mitte. -->
    <symbol id="net-blocked" overflow="visible">
        <circle r="1.1" fill="var(--background-color)"
                stroke="currentColor" stroke-width="0.32"/>
        <line x1="-0.78" y1="0.78" x2="0.78" y2="-0.78"
              stroke="currentColor" stroke-width="0.32"/>
    </symbol>
    <symbol id="net-allowed" overflow="visible">
        <circle r="1.1" fill="var(--background-color)"
                stroke="currentColor" stroke-width="0.32"/>
        <path d="M -0.65 0 L -0.2 0.5 L 0.7 -0.6" fill="none"
              stroke="currentColor" stroke-width="0.32"
              stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

</defs>
</svg>

<ld-topic class="new-section" id="tcp-grundlagen"><h2>TCP Grundlagen</h2><div class="section-subtitle"><p>Eine Wiederholung</p></div></ld-topic>
<ld-topic id="tcp"><h2>TCP</h2><ul class="incremental-list simple"><li><p>Protokoll der Schicht 4 (Transport Layer) basiert auf IP</p></li><li><p>verbindungsorientierte Kommunikation zweier Rechner im Internet zuverlässig und geordnet:</p><ul class="incremental-list simple"><li><p>Verwerfen von Duplikaten und fehlerhaft übertragener Pakete</p></li><li><p>automatisches Wiederversenden fehlender Pakete</p></li><li><p>Nachrichtenpuffer: Daten werden in korrekter Reihenfolge an Applikation zugestellt</p></li></ul></li><li><p>Verbindungsaufbau immer zwischen zwei Sockets (Socket-Adresse: IP Adresse und 16 Bit-Port-Nummer)</p></li></ul><ld-supplemental embed-in-document-flow=""><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung: TCP/IP Referenzmodell nach Tannenbaum</span></p><table class="borderless zebra table-header-align-left" style="width: 100%;"><thead><tr><th class="head"><p>Schicht</p></th><th class="head"><p>Name/Aufgabe</p></th></tr></thead><tbody><tr><td><p>5</p></td><td><p><em>Application Layer</em> (Anwendungsschicht - z. B. Email)</p></td></tr><tr><td><p>4</p></td><td><p><em>Transport Layer</em> (TCP)</p></td></tr><tr><td><p>3</p></td><td><p><em>Network Layer</em> (IP Layer)</p></td></tr><tr><td><p>2</p></td><td><p><em>Medium Access Control Layer</em> (Wer darf wann senden?)</p><p><em>Data Link Layer</em> (Fehler-/Flußkontrolle)</p></td></tr><tr><td><p>1</p></td><td><p><em>Physical Layer</em> (Übertragung von Bits auf Hardwareebene)</p></td></tr></tbody></table></aside></ld-supplemental></ld-topic>
<ld-topic id="aufbau-einer-tcp-verbindung"><h2>Aufbau einer TCP Verbindung</h2><p>Dreifacher Handshake:</p><ld-supplemental embed-in-document-flow=""><p><strong>Terminologie</strong>:</p><dl class="dd-margin-left-3em field-list simple"><dt>SYN<span class="colon">:</span></dt><dd><p><span class="eng">synchronize (session establishment)</span></p></dd><dt>ACK<span class="colon">:</span></dt><dd><p><span class="eng">acknowledge</span></p></dd><dt>RST<span class="colon">:</span></dt><dd><p><span class="eng">reset</span></p></dd></dl><p><strong>Verbindungsaufbau - Ablauf</strong>:</p><ol class="arabic simple"><li><p>Client sendet SYN Paket mit initialer Sequenznummer (hier) 1000 an den Server.</p></li><li><p>Server sendet ein SYN-ACK Paket mit seiner initialen Sequenznummer (hier) 2000 und ein ACK mit der Sequenznummer 1001 (initiale Sequenznummer des Clients +1) an den Client</p></li><li><p>Client sendet ein ACK Paket mit Sequenznummer 2001 (initiale Sequenznummer des Servers +1) an den Server; danach ist die Verbindung aufgebaut.</p></li></ol><p>Das Betriebssystem sollte die initialen Sequenznummern zufällig wählen, so dass ein Angreifer diese nicht leicht vorhersagen kann. Beide Seiten haben eigene Sequenznummern, die unabhängig voneinander sind.</p><p>Bei einer laufenden Verbindung werden die Sequenznummern inkrementiert und es ist nicht (mehr) erkennbar wer die Verbindung aufgebaut hat.</p></ld-supplemental><div class="center-child-elements"><div style="width: 76ch; height: 40ch"; container-type:size;">
<svg viewBox="100 0 1140 600" font-size="36" version="1.1" xmlns="http://www.w3.org/2000/svg" fill="currentColor">

    <text x="125" y="75" style="font-weight: bolder">Client</text>
    <line x1="200" y1="100" x2="200" y2="400" stroke="currentColor" style="stroke-width:3" />
    <text x="925" y="75" style="font-weight: bolder">Server</text>
    <line x1="1000" y1="100" x2="1000" y2="400" stroke="currentColor" style="stroke-width:3" />
    <line x1="200" y1="400" x2="200" y2="550" stroke="currentColor" stroke-dasharray="5,5" style="stroke-width:3" />
    <line x1="1000" y1="400" x2="1000" y2="550" stroke-dasharray="5,5" stroke="currentColor" style="stroke-width:3" />

    <text x="500" y="65" transform="rotate(6.6)">SYN(1000)</text>
    <line x1="200" y1="110" x2="1000" y2="190" stroke="currentColor" style="stroke-width:3" marker-end="url(#arrow)"/>

    <g class="incremental">
        <text x="270" y="300" transform="rotate(-6.6)">SYN(2000), ACK(1001)</text>
        <line x1="1000" y1="200" x2="200" y2="290" stroke="currentColor" style="stroke-width:3" marker-end="url(#arrow)"/>
    </g>

    <g class="incremental">
        <text x="555" y="315" transform="rotate(6.6)">ACK(2001)</text>
        <line x1="200" y1="300" x2="1000" y2="390" stroke="currentColor" style="stroke-width:3" marker-end="url(#arrow)"/>
    </g>
</svg>
</div></div></ld-topic>
<ld-topic id="ports-bei-tcp"><h2>Ports bei TCP</h2><ul class="incremental-list simple"><li><p>Port-Nummern werden für die Kommunikation zwischen zwei Diensten/Prozessen verwendet</p></li><li><p>Ports sind 16 Bit Zahlen (0-65535)</p></li><li><p>(Unix) Ports &#x3C; 1024 sind privilegiert (nur root kann diese öffnen)</p></li><li><p>einige Port-Nummern sind Standarddiensten zugeordnet</p></li></ul></ld-topic>
<ld-topic id="port-nummern-einiger-standarddienste"><h2>Port-Nummern einiger Standarddienste <a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></h2><p><strong>Ungeschützte Dienste</strong> (Kommunikation findet ohne Verschlüsselung statt.)</p><table class="highlight-row-on-hover incremental fade-in" style="width: 100%;"><colgroup><col style="width: 20.0%"><col style="width: 60.0%"><col style="width: 20.0%"></colgroup><thead><tr><th class="head"><p>Protokoll</p></th><th class="head"><p>Dienst</p></th><th class="head"><p>Portnummer</p></th></tr></thead><tbody><tr><td><p><span class="s">ftp</span></p></td><td><p>Dateitransfer</p></td><td><p>21</p></td></tr><tr><td><p><span class="s">smtp</span></p></td><td><p>Simple Mail Transfer Protocol</p></td><td><p>25</p></td></tr><tr><td><p><strong>dns</strong></p></td><td><p>Domain Name System</p></td><td><p>53</p></td></tr><tr><td><p>http</p></td><td><p>Hypertext Transfer Protocol</p></td><td><p>80</p></td></tr></tbody></table><p><strong>Geschützte Dienste</strong> (Die Kommunikation ist verschlüsselt.)</p><table class="highlight-row-on-hover incremental fade-in" style="width: 100%;"><colgroup><col style="width: 20.0%"><col style="width: 60.0%"><col style="width: 20.0%"></colgroup><thead><tr><th class="head"><p>Protokoll</p></th><th class="head"><p>Dienst</p></th><th class="head"><p>Portnummer</p></th></tr></thead><tbody><tr><td><p>ssh</p></td><td><p>Secure Shell</p></td><td><p>22</p></td></tr><tr><td><p>https</p></td><td><p>HTTP über Secure Socket Layer</p></td><td><p>443</p></td></tr><tr><td><p>smtps</p></td><td><p>SMTP über Secure Socket Layer</p></td><td><p>465</p></td></tr><tr><td><p>imaps</p></td><td><p>IMAP über Secure Socket Layer</p></td><td><p>993</p></td></tr><tr><td><p>pop3s</p></td><td><p>POP3 über Secure Socket Layer</p></td><td><p>995</p></td></tr></tbody></table><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://www.iana.org/assignments/service-names-port-numbers">Port numbers assigned by IANA</a></p></aside></aside></ld-topic>
<ld-topic class="new-section" id="angriffe-auf-tcp"><h2>Angriffe auf TCP</h2></ld-topic>
<ld-topic id="angriffe-auf-tcp-motivation"><h2>Angriffe auf TCP - Motivation</h2><ul class="incremental-list list-with-explanations"><li><p>Netzwerkprogrammierung mit TCP ist relativ komfortabel.</p></li><li><p>Viele Dienste sind mit TCP implementiert.</p><p>Insbesondere in der Anfangszeit hatten viele TCP Dienste sowohl technische als auch konzeptionelle Schwachstellen. Einige dieser Schwachstellen sind bis heute nicht behoben.</p></li><li><p>Das Auffinden von angreifbaren Diensten kann mit Hilfe von Port Scans systematisch erfolgen.</p><p>Server haben heutzutage im Allgemeinen alle nicht verwendeten Dienste geschlossen.</p></li></ul></ld-topic>
<ld-topic id="port-scans-tcp-connect-scan"><h2>Port Scans: TCP Connect Scan</h2><ld-grid class="incremental default-layout"><ld-cell class="width-40" style="align-self:auto;"><h3>Vorgehen</h3><p>Aufbau vollständiger Verbindungen zu allen bzw. zu ausgewählten Ports.</p></ld-cell><ld-cell class="width-60 center-content" style="align-self:auto;"><div style="width:42ch; height:25.2ch; container-type:size;">
<svg viewBox="100 0 1000 600" font-size="48" fill="currentColor" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <text x="200" text-anchor="middle" y="75" style="font-weight: bolder">Scanner</text>
    <line x1="200" y1="100" x2="200" y2="450" stroke="currentColor" style="stroke-width:3" />
    <text x="1000" y="75" text-anchor="middle" style="font-weight: bolder">Server</text>
    <line x1="1000" y1="100" x2="1000" y2="450" stroke="currentColor" style="stroke-width:3" />
    <line x1="200" y1="450" x2="200" y2="550" stroke-dasharray="5,5" stroke="currentColor" style="stroke-width:3" />
    <line x1="1000" y1="450" x2="1000" y2="550" stroke-dasharray="5,5" stroke="currentColor" style="stroke-width:3" />

    <text x="500" y="65" transform="rotate(6.6)">SYN</text>
    <line x1="200" y1="110" x2="1000" y2="190" stroke="currentColor" style="stroke-width:3" marker-end="url(#arrow)"/>

    <text x="390" y="300" transform="rotate(-6.6)">SYN / ACK</text>
    <line x1="1000" y1="200" x2="200" y2="290" stroke="currentColor" style="stroke-width:3" marker-end="url(#arrow)"/>

    <text x="555" y="315" transform="rotate(6.6)">ACK</text>
    <line x1="200" y1="300" x2="1000" y2="390" stroke="currentColor" style="stroke-width:3" marker-end="url(#arrow)"/>
</svg>
</div></ld-cell></ld-grid><aside class="admonition incremental" data-theme="assessment"><p class="admonition-title" data-theme="assessment-header"><span>Bewertung</span></p><ul class="simple"><li><p>simpelster Port Scan</p></li><li><p>große Entdeckungsgefahr (Scan selbst ist kein Angriff)</p></li><li><p>mögliche Verbesserung: zwischen dem Scannen mehrerer Ports Pausen einstreuen (Wie lange?)</p></li></ul></aside></ld-topic>
<ld-topic id="port-scans-tcp-syn-scan"><h2>Port Scans: TCP SYN Scan</h2><ld-grid class="default-layout"><ld-cell class="width-40 incremental" style="align-self:auto;"><h3>Vorgehen</h3><ol class="arabic simple"><li><p>Senden eines TCP-Segments mit gesetztem SYN-Flag an einen Port</p></li><li><p>falls der <em>Port offen</em> ist, kommt SYN/ACK zurück danach RST senden</p></li><li><p>falls der <em>Port nicht offen</em> ist, kommt RST (oder nichts) zurück</p></li></ol></ld-cell><ld-cell class="widh-60" style="align-self:auto;"><div style="width:42ch; height:25.2ch; container-type:size;">
<svg viewBox="100 0 1000 600" font-size="48" fill="currentColor" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <text x="200" text-anchor="middle" y="75" style="font-weight: bolder">Scanner</text>
    <line x1="200" y1="100" x2="200" y2="300" stroke="currentColor" style="stroke-width:3" />
    <text x="1000" text-anchor="middle" y="75" style="font-weight: bolder">Server</text>
    <line x1="1000" y1="100" x2="1000" y2="400" stroke="currentColor" style="stroke-width:3" />

    <line x1="200" y1="300" x2="200" y2="550" stroke-dasharray="5,5" stroke="currentColor" style="stroke-width:3" />
    <line x1="1000" y1="300" x2="1000" y2="550" stroke-dasharray="5,5" stroke="currentColor" style="stroke-width:3" />

    <text x="500" y="65" transform="rotate(6.6)">SYN</text>
    <line x1="200" y1="110" x2="1000" y2="190" stroke="currentColor" style="stroke-width:3" marker-end="url(#arrow)"/>

    <text x="390" y="300" transform="rotate(-6.6)">SYN / ACK</text>
    <line x1="1000" y1="200" x2="200" y2="290" stroke="currentColor" style="stroke-width:3" marker-end="url(#arrow)"/>

    <text x="555" y="315" transform="rotate(6.6)">RST</text>
    <line x1="200" y1="300" x2="1000" y2="390" stroke="currentColor" style="stroke-width:3" marker-end="url(#arrow)"/>
</svg>
</div></ld-cell></ld-grid><aside class="admonition incremental" data-theme="assessment"><p class="admonition-title" data-theme="assessment-header"><span>Bewertung</span></p><ul class="simple"><li><p>kein vollständiger Verbindungsaufbau</p></li><li><p>meist nicht protokolliert</p></li><li><p>geringe(re) Entdeckungsgefahr</p></li></ul></aside></ld-topic>
<ld-topic id="port-scans-stealth-scans"><h2>Port Scans: Stealth Scans</h2><h3>Vorgehen</h3><p>Versenden eines für den Verbindungsaufbau ungültigen TCP-Segments an einen Port:</p><ul class="incremental-list simple"><li><p>NULL-Scan (keine Flags)</p></li><li><p>ACK-Scan (ACK-Flag)</p></li><li><p>FIN-Scan (FIN-Flag)</p></li><li><p>XMAS-Scan (alle Flags)</p></li></ul><div class="incremental"><p>Laut RFC kommt RST zurück, falls der Port offen ist. (Reaktion ist de-facto aber abhängig vom Betriebssystem und oft kommt keine Antwort zurück.)</p></div><aside class="admonition incremental" data-theme="assessment"><p class="admonition-title" data-theme="assessment-header"><span>Bewertung</span></p><ul class="simple"><li><p>Zugriff wird meist nicht protokolliert</p></li><li><p>Scan bleibt unbemerkt</p></li></ul></aside><ld-supplemental><p><strong>XMAS-Scan</strong>:</p><p>Bei diesem Scan sind alle Flags gesetzt; ein XMAS-Scan wird auch als Christmas-Tree-Scan bezeichnet, da das Paket erleuchtet ist wie ein Weihnachtsbaum.</p></ld-supplemental></ld-topic>
<ld-topic id="port-scans-idle-scan"><h2>Port Scans: Idle Scan <a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a></h2><p>Bei allen bisher betrachteten Scans kann der Scanner prinzipiell identifiziert werden. Unter Verwendung eines sog. Zombies geht es auch anders:</p><ld-supplemental embed-in-document-flow=""><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Zombie</span></p><p>Ein Rechner (Computer, Drucker oder anderes IoT Gerät) im Internet <em>möglichst ohne eigenen Netzverkehr</em> und mit <em>altem</em> Betriebssystem, bei dem die IP ID in vorhersehbarer Weise inkrementiert wird. (Bei modernen Betriebssystemen ist die IP ID zufällig, <strong>konstant</strong> oder sogar <span class="docutils literal">null</span>.)</p></aside></ld-supplemental><ld-deck><ld-card><p>Sondiere IP ID des Zombies:</p><div class="align-center" style="width: 38ch; height: 32.718ch;" aria-label="Idle Scan - Schritte 1 und 2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 31" font-size="1.2"
     style="--net-server-frame-color: oklch(from currentColor calc(l * 0.5) c h); --net-server-slot-stroke-width: 0.18;">
    <!-- Idle Scan (Schritt 1). Alle drei Dateien teilen viewBox und Anordnung,
         damit sie beim Übereinanderlegen nicht springen.

         Zombie: ld-muted. Pakete des Scanners: ld-danger.
         Symbole #net-…: shared/svgs/net-symbols.svg. -->

    <!-- === Beteiligte === -->
    <g text-anchor="middle" class="ld-label">
        <text x="6" y="2.2">Scanner</text>
        <text x="29" y="2.2">Server</text>
        <text x="29" y="30">Zombie</text>
    </g>

    <!-- Scanner (Angreifer) -->
    <g class="ld-danger">
        <use href="#net-laptop" x="2.3" y="3.4"/>
    </g>
    <!-- Server (Ziel) -->
    <g class="ld-success">
        <use href="#net-server" x="26" y="2.8"  style="--net-server-stroke-width: 0.04; --net-server-slot-stroke-width: 0.04;"/>
    </g>
    <!-- Zombie -->
    <g class="ld-muted">
        <use href="#net-laptop" x="25.3" y="22"/>
    </g>

    <!-- === (1): Scanner → Zombie === -->
    <g class="ld-danger incremental">
        <line class="ld-connector" x1="9.95" y1="10.63" x2="23.95" y2="22.03"/>
        <text class="ld-label" text-anchor="middle"
              transform="translate(15.82 17.72) rotate(39.16)">(1) SYN/ACK</text>
    </g>

    <!-- === (2): Zombie → Scanner (RST verrät die aktuelle IP ID) === -->
    <g class="incremental">
        <line class="ld-connector" x1="24.65" y1="21.17" x2="10.65" y2="9.77"/>
        <text class="ld-label" text-anchor="middle"
              transform="translate(17.99 15.05) rotate(39.16)">(2) RST</text>
    </g>
</svg>
</div></ld-card><ld-card class="incremental"><p>Starte Scan:</p><div class="align-center" style="width: 38ch; height: 32.718ch;" aria-label="Idle Scan - Schritte 3-5"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 31" font-size="1.2"
     style="--net-server-frame-color: oklch(from currentColor calc(l * 0.5) c h); --net-server-slot-stroke-width: 0.18;">
    <!-- Idle Scan (Schritt 2). Alle drei Dateien teilen viewBox und Anordnung,
         damit sie beim Übereinanderlegen nicht springen.

         Zombie: ld-muted. Pakete des Scanners: ld-danger.

    <!-- === Beteiligte === -->
    <g text-anchor="middle" class="ld-label">

        <text x="29" y="2.2">Server</text>
        <text x="29" y="30">Zombie</text>
    </g>

    <!-- Scanner (Angreifer) -->
    <g class="ld-danger">
        <use href="#net-laptop" x="2.3" y="3.4"/>
    </g>
    <!-- Server (Ziel) -->
    <g class="ld-success">
        <use href="#net-server" x="26" y="2.8"/>
    </g>
    <!-- Zombie -->
    <g class="ld-muted">
        <use href="#net-laptop" x="25.3" y="22"/>
    </g>

    <!-- === (3): Scanner → Server, mit gefälschter Absenderadresse des Zombies === -->
    <g class="ld-danger" text-anchor="middle">
        <line class="ld-connector" x1="10.4" y1="6.2" x2="25.4" y2="6.2"/>
        <text class="ld-label" x="17.9" y="5.3">(3) SYN</text>
        <text class="ld-label" x="17.9" y="7.9">mit Adresse von Z</text>

    <!-- === (4): Server → Zombie (Port offen) === -->
    <g class="incremental">

    </g>
</svg>
</div></ld-card><ld-card class="incremental"><p>Sondiere IP ID des Zombies das zweite Mal:</p><div class="align-center" style="width: 38ch; height: 32.718ch;" aria-label="Idle Scan - Schritte 6 und 7"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 31" font-size="1.2"

    <!-- Idle Scan (Schritt 3). Alle drei Dateien teilen viewBox und Anordnung,

    <!-- === Beteiligte === -->
    <g text-anchor="middle" class="ld-label">
        <text x="6" y="2.2">Scanner</text>

    <g class="ld-muted">

    </g>

    <!-- === (6): Scanner → Zombie === -->
    <g class="ld-danger">
        <line class="ld-connector" x1="9.95" y1="10.63" x2="23.95" y2="22.03"/>

    <g class="incremental">

    </g>
</svg>
</div></ld-card></ld-deck><ld-supplemental embed-in-document-flow=""><p>Grundlegender Mechanismus: Der Zombie sendet ein RST Paket zurück, da er kein SYN gesendet hat und kein SYN/ACK erwarte. Dadurch erfährt der Angreifer die aktuelle IP ID des Zombies. Über diesen Seitenkanal - d. h. die Veränderung der IP ID des Zombies - kann der Angreifer nun den Zustand des Ports auf dem Zielrechner ermitteln.</p><p><strong>Ablauf</strong></p><ol class="arabic"><li><p>Angreifer sendet SYN/ACK Paket an Zombie</p></li><li><p>der Zombie antwortet mit RST und enthüllt seine IP ID (<span class="eng">IP Fragment Identification Number</span>).</p></li><li><p>Angreifer sendet SYN („mit IP vom Zombie“ (IP-Spoofing)) an Port des Servers:</p><p>[<strong>Port offen</strong>] Der Zielrechner antwortet mit SYN/ACK an den Zombie, wenn der Port offen ist. Der Zombie antwortet darauf mit RST an den Server, da er kein SYN gesendet hat und kein SYN/ACK erwartet und <em>erhöht seine IP ID</em>.</p><p>[<strong>Port geschlossen</strong>] Der Zielrechner antwortet mit RST an den Zombie, wenn der Port geschlossen ist. Dies wird vom Zombie ignoriert.</p></li><li><p>Der Angreifer sendet <em>wieder</em> ein SYN/ACK an den Zombie, um die IP ID zu erfahren.</p><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Mit einem IDLE Scan kann nicht unterschieden werden, ob der Port geschlossen oder gefiltert ist.</p></aside></li></ol><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Sollte ein Intrusion Detection System vorhanden sein, so wird dieses den Zombie als Angreifer identifizieren.</p></aside><h3>Hintergrund - IP ID</h3><p>Das Feld <em>IP Identifikation (IP ID)</em> dient der Identifizierung einer Gruppe von Fragmenten eines einzelnen IP-Datagramms.</p><figure class="align-center"><object class="light-image" data="images-external/IPv4_Packet-en.svg" type="image/svg+xml" role="img" aria-label="IPv4 Packetaufbau"></object><figcaption><p><a class="reference external" href="https://commons.wikimedia.org/w/index.php?curid=79949694">Michel Bakni - Postel, J. (September 1981) RFC 791, IP Protocol, DARPA Internet Program Protocol Specification, p. 1 DOI: 10.17487/RFC0791., CC BY-SA 4.0</a></p></figcaption></figure></ld-supplemental><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-2" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-2">2</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://nmap.org/book/idlescan.html">NMap Book</a></p></aside></aside></ld-topic>
<ld-topic id="port-scans-mit-nmap"><h2>Port Scans mit nmap</h2><ul class="incremental-list simple"><li><p>alle Arten von Port-Scans möglich</p></li><li><p>auch OS fingerprinting</p></li><li><p>u. U. sogar Ermittlung der Versionsnummern von Diensten</p></li></ul><pre class="code bash incremental literal-block"><code>$ nmap <span class="literal number integer">192.168</span>.178.121 <span class="name variable">-Pn</span>
Starting Nmap <span class="literal number integer">7.94</span> <span class="punctuation">(</span> https://nmap.org <span class="punctuation">)</span> at <span class="literal number integer">2023</span>-12-14 <span class="literal number integer">13</span>:16 PST
Nmap scan report <span class="keyword">for</span> Michaels-MacBook-Pro <span class="punctuation">(</span><span class="literal number integer">192.168</span>.178.121<span class="punctuation">)</span>
Host is up <span class="punctuation">(</span><span class="literal number integer">0</span>.0056s latency<span class="punctuation">)</span>.
Not shown: <span class="literal number integer">995</span> filtered tcp ports <span class="punctuation">(</span>no-response<span class="punctuation">)</span>
PORT     STATE SERVICE
<span class="literal number integer">53</span>/tcp   <span class="name function">open</span>  domain
<span class="literal number integer">88</span>/tcp   <span class="name function">open</span>  kerberos-sec
<span class="literal number integer">445</span>/tcp  <span class="name function">open</span>  microsoft-ds
<span class="literal number integer">5000</span>/tcp <span class="name function">open</span>  upnp
<span class="literal number integer">7000</span>/tcp <span class="name function">open</span>  afs3-fileserver</code></pre><ld-supplemental><p><strong>OS-Fingerprinting</strong></p><p>Beim OS-Fingerprinting werden Datenpakete analysiert, die aus einem Netzwerk stammen, um Informationen für spätere Angriffe zu gewinnen. Durch die Erkennung des Betriebssystems, mit dem ein Netzwerk arbeitet, haben Hacker es leichter, Schwachstellen zu finden und auszunutzen. OS-Fingerprinting kann auch Konfigurationsattribute von entfernten Geräten sammeln. Diese Art von Aufklärungsangriff ist in der Regel (einer) der erste(n) Schritt(e).</p><p>Es gibt zwei Arten von OS-Fingerprinting: (1) Aktiv und (2) passiv.</p><blockquote><ol class="arabic simple"><li><p>Bei einem aktiven OS-Fingerprinting-Versuch senden die Angreifer ein Paket an das Zielsystem und warten auf eine Antwort, um den Inhalt des TCP-Pakets zu analysieren.</p></li><li><p>Bei einem passiven Versuch agieren die Angreifer eher als "Schnüffler", der keine absichtlichen Änderungen oder Aktionen im Netzwerk vornimmt. Passives OS-Fingerprinting ist ein unauffälligerer, aber wesentlich langsamerer Prozess.</p></li></ol></blockquote></ld-supplemental></ld-topic>
<ld-topic id="port-knocking"><h2>Port Knocking</h2><ul class="incremental-list list-with-explanations"><li><p>Ein Knock-Daemon versteckt offene Ports auf dem Server.</p></li><li><p>Zugriffe auf alle Ports werden im Log-File protokolliert.</p></li><li><p>Knock-Daemon beobachtet das Log-File.</p></li><li><p>Erst nach Erkennen einer vordefinierten (Einmal-)Klopfsequenz öffnet der Knock-Daemon den gewünschten Port für diesen Client.</p></li><li><p>Client kann nun die Verbindung aufbauen.</p></li><li><p>Weiterentwicklung: TCP Stealth</p><p>In diesem Fall werden offene Ports dadurch versteckt, dass sie nur auf spezielle SYN-Pakete mit bestimmten Sequenznummern reagieren. Die Sequenznummern sind ggf. kryptografisch abgesichert und basieren auf vorher ausgetauschten Schlüsseln.</p></li></ul><ld-supplemental><p><strong>Weiterführend</strong></p><p>Alternativen zu einer Knock-Sequenz ist zum Beispiel, dass der Port nur dann als offen gilt, wenn die IP ID eine bestimmte Sequenznummer aufweist.</p><p>M.Krzywinski: Port Knocking: Network Authentication Across Closed Ports in SysAdmin Magazine 12: 12-17. (2003)</p></ld-supplemental></ld-topic>
<ld-topic id="connection-hijacking"><h2>Connection Hijacking</h2><p>Angreifer übernimmt eine bestehende - zum Beispiel eine bereits durch (Einmal-)Passwort authentisierte - Verbindung.</p><div class="align-center" style="width: 44ch; height: 33ch;" aria-label="Connection Hijacking (einfache Variante)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 33" font-size="1.2"
     style="--net-server-frame-color: oklch(from currentColor calc(l * 0.5) c h); --net-server-slot-stroke-width: 0.18;">
    <!-- Connection Hijacking (einfache Variante). Symbole und Farben wie beim
         Idle Scan, DRDoS- und Smurf-Angriff: Mallory (Angreifer): ld-danger,
         Bob (Server): ld-success, Alice (legitimer Client): currentColor.
         Pakete von Mallory: ld-danger.
         Symbole #net-…: shared/svgs/net-symbols.svg. -->

    <!-- === Beteiligte === -->
    <g text-anchor="middle" class="ld-label">
        <text x="6" y="2.2">Alice</text>
        <text x="38.5" y="2.2">Bob</text>
        <text x="22.2" y="32.2">Mallory</text>
    </g>

    <!-- Alice (legitimer Client) -->
    <use href="#net-laptop" x="2.3" y="3.4"/>
    <!-- Bob (Server) -->
    <g class="ld-success">
        <use href="#net-server" x="35.5" y="2.8"/>
    </g>
    <!-- Mallory (Angreifer) -->
    <g class="ld-danger">
        <use href="#net-laptop" x="18.5" y="24.2"/>
    </g>

    <!-- === Verbindungsaufbau und Datenaustausch zwischen Alice und Bob === -->
    <g class="ld-label" text-anchor="middle">
        <line class="ld-connector" x1="10.2" y1="4.4" x2="35.12" y2="4.4"/>
        <text x="22.8" y="3.8">SYN(1000)</text>
        <line class="ld-connector" x1="35.3" y1="6.8" x2="10.38" y2="6.8"/>
        <text x="22.8" y="6.2">SYN(50)/ACK(1001)</text>
        <line class="ld-connector" x1="10.2" y1="9.2" x2="35.12" y2="9.2"/>
        <text x="22.8" y="8.6">ACK(51), data</text>
    </g>

    <!-- === Mallory liest die Sequenznummern mit === -->
    <g class="ld-danger incremental unroll-down">
        <line class="ld-connector ld-dotted" x1="21" y1="9.8" x2="21" y2="23.42"/>
        <text class="ld-label" x="20.4" y="17" text-anchor="end" font-size="1">liest mit</text>
    </g>

    <!-- === Mallory schickt (später) ein passendes Paket an Bob ===
         Die gepunktete Linie vom ACK(51)-Paket zum Paket von Mallory zeigt,
         dass dieses erst zu einem späteren Zeitpunkt der Verbindung kommt. -->
    <g class="incremental unroll-up">
        <line class="ld-line ld-dotted" x1="27" y1="9.8" x2="31.27" y2="15.65"/>
        <g class="ld-danger">
            <line class="ld-connector" x1="25.4" y1="23.6" x2="35.19" y2="10.35"/>
            <text class="ld-label" text-anchor="middle"
                  transform="translate(30.3 16.98) rotate(-53.54)" y="1.8">ACK(57), data</text>
        </g>
    </g>
</svg>
</div><ld-supplemental><p>TCP/IP-Hijacking ist eine Form eines Person-in-the-Middle-Angriffs. Der Angreifer bestimmt erst die IP-Adressen der beiden Sitzungsteilnehmer.</p><p>Danach gibt es mehrere Möglichkeiten:</p><ul><li><p>Der Angreifer schickt („in einer Pause“) ein Paket mit der passenden Sequenznummer an den Server.</p><p><em>(Dies kann dann in einem ACK-Storm enden, was ggf. unterbunden werden muss (zum Beispiel durch das Senden eines RSTs), oder ignoriert werden kann.)</em></p></li><li><p>Der Angreifer macht einen Client mit einem DoS-Angriff unerreichbar, um sich dann mit dem Anderen zu verbinden, indem er die Netzwerk-ID des ausgeschalteten Clients nutzt.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="denial-of-service-dos-angriffe"><h2>Denial-of-Service (DoS) Angriffe</h2><p>Ziel des Angreifers: Lahmlegen eines Dienstes oder des ganzen Systems ...</p><ul class="simple"><li><p>durch Ausnutzen von Schwachstellen (<span class="eng">vulnerabilities</span>) wie z. B. Buffer Overflows</p></li><li><p>durch Generierung von Überlast (Ausschöpfen von RAM, CPU, Netzwerkbandbreite, ...)</p></li></ul><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p class="rubric">Ping-of-Death</p><p>(Historisch: aus dem Jahr 1997)</p><p>Ein <span class="docutils literal">ping</span> (vgl. Internet Control Message Protocol (ICMP)) verwendet üblicherweise kleine Nachrichten, aber die verwendete Länge ist einstellbar.</p><p>Falls die Länge zu groß ist ⇒ Buffer Overflow ⇒ Systemabsturz!</p><p>Variante: mittels Fragmentierung ließen sich generell übergroße IP-Pakete (>65,536 Byte) erstellen.</p></aside></ld-topic>
<ld-topic id="denial-of-service-syn-flooding-angriff"><h2>Denial-of-Service: SYN-flooding Angriff</h2><ul class="incremental-list"><li><p>Angriff auf Design</p></li><li><p>Angreifer sendet eine Verbindungsaufbauanforderung (gesetztes SYN-Flag) an Zielmaschine</p></li><li><p>Server generiert eine halboffene TCP-Verbindung</p></li><li><p>Angreifer wiederholt in schneller Folge dieses erste Paket zum Verbindungsaufbau</p><p>⇒ vollständiges Füllen der internen Systemtabelle</p><p>⇒ Anfragen normaler Benutzer werden zurückgewiesen</p></li><li><p>Angreifer verwendet i. Allg. IP-Spoofing weswegen Firewalls wirkungslos sind.</p></li><li><p>Abwehr: SYN-Cookies</p></li></ul></ld-topic>
<ld-topic id="syn-cookies-d-j-bernstein"><h2><a class="reference external" href="https://cr.yp.to/syncookies.html">SYN-Cookies - D J. Bernstein</a></h2><p>SYN-Cookies sind speziell konstruiert initiale Sequenznummern.</p><ld-deck><ld-card><div style="width:72ch;height:27ch">
<svg viewBox="100 0 1600 600" font-size="36" version="1.1" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
    <text x="150" y="75" style="font-weight: bolder">Client</text>
    <line x1="200" y1="100" x2="200" y2="450" stroke="currentColor" style="stroke-width:3" />
    <line x1="200" y1="450" x2="200" y2="550" stroke-dasharray="5,5" stroke="currentColor" style="stroke-width:3" />

    <text x="1450" y="75" style="font-weight: bolder">Server</text>
    <line x1="1500" y1="100" x2="1500" y2="450"  stroke="currentColor" style="stroke-width:3" />
    <line x1="1500" y1="450" x2="1500" y2="550" stroke-dasharray="5,5"  stroke="currentColor" style="stroke-width:3" />

    <text x="500" y="75" transform="rotate(4.25)">SYN(1000)</text>
    <line x1="200" y1="110" x2="1500" y2="190"  stroke="currentColor" style="stroke-width:3" marker-end="url(#arrow)"/>
</svg>
</div></ld-card><ld-card class="overlay incremental"><div style="width:72ch;height:27ch">
<svg viewBox="100 0 1600 600" font-size="36"  version="1.1" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
    <text x="270" y="290" transform="rotate(-4.25)">SYN(with cookie), ACK(1001)</text>
    <line x1="1500" y1="200" x2="200" y2="290"  stroke="currentColor" style="stroke-width:3" marker-end="url(#arrow)"/>
</svg>
</div><p>Der Cookie ermöglicht es, dass keine Informationen im Speicher gehalten werden müssen. Der Cookie encodiert die Informationen, die der Server benötigt, um die Verbindung aufzubauen: Client IP, time window, etc.</p></ld-card><ld-card class="overlay incremental"><div style="width:72ch;height:27ch">
<svg  viewBox="100 0 1600 600" font-size="36"  version="1.1" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
    <text x="555" y="325" transform="rotate(4.2)">ACK(with cookie(+1))</text>
    <line x1="200" y1="300" x2="1500" y2="390"  stroke="currentColor" style="stroke-width:3" marker-end="url(#arrow)"/>

    <text x="1515" y="340" >Validierung</text>
    <text x="1515" y="390" >des Cookie</text>
    <line x1="1600" y1="400" x2="1600" y2="455" stroke="currentColor" style="stroke-width:3" marker-end="url(#arrow)"/>
    <text x="1515" y="490" >ggf. </text>
    <text x="1515" y="540" >Verbindungs-</text>
    <text x="1515" y="590" >aufbau</text>
</svg>
</div></ld-card></ld-deck></ld-topic>
<ld-topic id="distributed-denial-of-service-ddos-angriff"><h2>Distributed Denial-of-Service (DDoS) Angriff</h2><p>Opfer wird von sehr vielen Angreifern mit Nachrichten überflutet.</p><div class="incremental"><p>Ein Beispiel: Smurf-Angriff:</p><div class="align-center" style="width: 57ch; height: 33ch;" aria-label="Smurf Angriff"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 57 33" font-size="1.2"

<ld-topic id="distributed-denial-of-service-ddos-angriff-1"><h2>Distributed Denial-of-Service (DDoS) Angriff</h2><ul class="incremental-list simple"><li><p>Bot-Netze (Botnetze) werden verwendet, um DDoS-Angriffe durchzuführen.</p></li><li><p>Bot-Netze können viele 10.000 Rechner umfassen.</p></li><li><p>IoT Geräte sind besonders beliebt (z. B. IP-Kameras, Smart-TVs, Smart-Home Geräte, ...), da diese oft nicht ausreichend geschützt sind und trotzdem permanent mit dem Internet verbunden sind.</p></li><li><p>Beliebte Ziele:</p><ul class="simple"><li><p>Onlinespieleserver</p></li><li><p>Banking-Portale</p></li><li><p>politische Webseiten</p></li></ul></li><li><p>Firewalls und Intrusion Detection Systeme sind meist wirkungslos, da die Angriffe von vielen verschiedenen IP-Adressen kommen.</p></li></ul></ld-topic>
<ld-topic id="distributed-reflected-denial-of-service-angriff"><h2>Distributed-Reflected-Denial-of-Service Angriff</h2><ld-deck><ld-card><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p>Idee eines (DRDoS) Angriffs</p><ul class="incremental-list list-with-explanations"><li><p>Es wird eine Anfrage an einen Server gesendet, die eine große Antwort auslöst.</p><ld-supplemental><p>Z. B. hat(te) der NTP Monlist Befehl eine Antwort, die ca. 200 Fach größer ist als die Anfrage!</p></ld-supplemental></li><li><p>Mittels IP-Spoofing wird die IP-Adresse des Opfers als Absenderadresse verwendet.</p></li><li><p>Es werden insbesondere Dienste basierend auf UDP verwendet, da hier keine Verbindung aufgebaut werden muss.</p></li></ul></ld-cell><ld-cell class="width-50" style="align-self:auto;"><div class="align-center" style="width: 36ch; height: 31ch;" aria-label="DRDoS Angriff"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 31" font-size="1.2"
     style="--net-server-frame-color: oklch(from currentColor calc(l * 0.5) c h); --net-server-slot-stroke-width: 0.18;">
    <!-- DRDoS-Angriff. Anordnung und Symbole wie beim Idle Scan

         Pakete von Mallory: ld-danger.
         Symbole #net-…: shared/svgs/net-symbols.svg. -->

    <!-- === Beteiligte === -->
    <g text-anchor="middle" class="ld-label">
        <text x="6" y="2.2">Mallory</text>
        <text x="29" y="2.2">Opfer</text>
        <text x="29" y="30.4">NTP-Server</text>
    </g>

    <!-- Mallory (Angreifer) -->
    <g class="ld-danger">
        <use href="#net-laptop" x="2.3" y="3.4"/>
    </g>
    <!-- Opfer (Ziel) -->
    <g class="ld-success">
        <use href="#net-server" x="26" y="2.8"/>
    </g>
    <!-- NTP-Server (Reflektor) -->
    <g class="ld-muted">
        <use href="#net-server" x="26" y="21.8"/>

    <!-- === (1): Mallory → NTP-Server: kleine Anfrage mit gefälschter Absenderadresse === -->

        <line class="ld-connector" x1="9.95" y1="10.63" x2="24.2" y2="22.23"/>

            <text y="-0.6">(1) NTP Monlist</text>

    </g>

    <!-- === (2): NTP-Server → Opfer: ca. 200-fach größere Antwort === -->
    <g class="incremental-3">
        <path class="ld-cell" d="M 28 21.2 L 28 13.4 L 26.6 13.4 L 29 10.2 L 31.4 13.4 L 30 13.4 L 30 21.2 Z"
              stroke="currentColor" stroke-width="0.12" stroke-linejoin="round"/>
        <g class="ld-label" text-anchor="end">
            <text x="26" y="13.4">(2) Antwort</text>
            <text x="26" y="14.8" font-size="1">≈ 200 × größer</text>
        </g>
    </g>
</svg>
</div></ld-cell></ld-grid></ld-card><ld-card class="incremental"><ul class="simple"><li><p>Nehmen einen signifikanten Teil aller DDoS-Angriffe ein.</p></li><li><p>Die Tatsache, dass die Sender legitime Server sind, erschwert die Abwehr.</p></li><li><p><span class="eng">Egress Filtering</span> kann helfen, die Verwendung von IP-Spoofing zu verhindern.</p></li></ul></ld-card></ld-deck><ld-supplemental><p>Bereits im Jahr 2018 wurde ein Angriff mit einer Bandbreite von 1,7 TBit/s beobachtet.</p><dl class="field-list simple"><dt>Egress Filtering<span class="colon">:</span></dt><dd><p>Der Router verwirft alle Pakete, die eine Absenderadresse verwenden, die nicht aus dem eigenen Netzwerk stammt.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic id="distributed-denial-of-service-angriffe-ddos"><h2>Distributed-Denial-of-Service-Angriffe (DDoS)</h2><ld-deck><ld-card><blockquote class="epigraph"><p>[...] Google's DDoS Response Team has observed the trend that distributed denial-of-service (DDoS) attacks are <strong>increasing exponentially in size</strong>. Last year, we blocked the largest DDoS attack recorded at the time. This August [2023], we stopped an even larger DDoS attack — 7½ times larger — that also used new techniques to try to disrupt websites and Internet services.</p><p>This new series of DDoS attacks reached <strong>a peak of 398 million requests per second (rps)</strong>, and relied on a novel HTTP/2 “Rapid Reset” technique based on stream multiplexing that has affected multiple Internet infrastructure companies. By contrast, last year's largest-recorded DDoS attack peaked at 46 million rps.</p><p class="attribution">—<a class="reference external" href="https://cloud.google.com/blog/products/identity-security/google-cloud-mitigated-largest-ddos-attack-peaking-above-398-million-rps">Okt. 2023 - DDoS Attack with 398 Million RPS</a></p></blockquote></ld-card><ld-card class="incremental"><blockquote class="epigraph"><p>Cloudflare hat Mitte Mai den "größten jemals registrierten" Denial-of-Service-Angriff (DDoS) mit [...] 7,3 Terabit pro Sekunde (TBit/s) blockiert. [...] Diese Attacke war demnach rund 12 Prozent größer als der vorherige Rekord und lieferte ein massives Datenvolumen von 37,4 Terabyte in nur 45 Sekunden. [...]</p><p>Stellen Sie sich vor, Sie könnten mit Ihrem Smartphone 12,5 Millionen hochauflösende Fotos schießen und hätten nie einen vollen Speicherplatz." Und das alles in 45 Sekunden.</p><p>[...] Mitgewirkt hätten über 122.145 Quell-IP-Adressen, die sich über 5433 autonome Netzwerksysteme in 161 Ländern erstreckten.</p><p class="attribution">—<a class="reference external" href="https://www.heise.de/news/Junk-Traffic-Flut-Rekord-DDoS-Angriff-auf-Provider-mit-7-3-TBit-s-10455216.html">22.06.2025 Heise.de - Rekord DDoS Angriff</a></p></blockquote></ld-card><ld-card class="incremental"><blockquote class="epigraph"><p>[...] Der letzte rekordverdächtige Überlastungsangriff ist noch gar nicht so lange her, da vermeldet Cloudflare schon den nächsten beobachteten Spitzenwert. Am Montag erreichte ein Distributed-Denial-of-Service-Angriff (DDoS) in der Spitze eine Last von 11,5 Terabit pro Sekunde. Das entspricht umgerechnet mehr als 1,4 Terabyte je Sekunde oder dem Inhalt von 184 randvollen DVDs.</p><p>[...] Dabei sendeten die Angreifer 5,1 Milliarden Pakete pro Sekunde (Bpps). Bei letzterer handelte es sich demnach um eine UDP-Flood-Attacke, die ihren Ausgangspunkt hauptsächlich in der Google-Cloud hatte. Die Zeitspanne, die der Höchstlast-Angriff einnahm, war etwa 35 Sekunden lang, schreibt Cloudflare weiter.</p><p class="attribution">—<a class="reference external" href="https://www.heise.de/news/Ueberlastungsattacke-erreicht-11-5-TBit-pro-Sekunde-10630141.html">03.09.2025 - Heise.de: Überlastungsattacke erreicht 11,5 TBit pro Sekunde</a></p></blockquote></ld-card><ld-card class="incremental"><blockquote class="epigraph"><p><strong>Microsoft Mitigates Record 15.72 Tbps DDoS Attack Driven by AISURU Botnet</strong></p><p>Microsoft on Monday disclosed that it automatically detected and neutralized a distributed denial-of-service (DDoS) attack targeting a single endpoint in Australia that measured 15.72 terabits per second (Tbps) and nearly 3.64 billion packets per second (pps).</p><p>The tech giant said it was the largest DDoS attack ever observed in the cloud, and that it originated from a TurboMirai-class Internet of Things (IoT) botnet known as AISURU. It's currently not known who was targeted by the attack.</p><p>"The attack involved extremely high-rate UDP floods targeting a specific public IP address, launched from over 500,000 source IPs across various regions," Microsoft's Sean Whalen said. [...]</p><p class="attribution">—Nov 18, 2025 <a class="reference external" href="https://thehackernews.com/2025/11/microsoft-mitigates-record-572-tbps.html">The Hacker News</a></p></blockquote></ld-card></ld-deck></ld-topic>
<ld-topic id="distributed-denial-of-service-angriffe-beispiele"><h2>Distributed Denial-of-Service Angriffe - Beispiele</h2><ul class="simple"><li><p><strong>TCP Stack Attacks</strong> SYN, FIN, RST, ACK, SYN-ACK, URG-PSH, other combinations of TCP Flags, slow TCP attacks</p></li><li><p><strong>Application Attacks</strong>:HTTP GET/POST Floods, slow HTTP Attacks, SIP Invite Floods, DNS Attacks, HTTPS Protocol Attacks</p></li><li><p><strong>SSL/TLS Attacks</strong>: Malformed SSL Floods, SSL Renegotiation, SSL Session Floods</p></li><li><p><strong>DNS Cache Poisoning</strong></p></li><li><p><strong>Reflection Amplification Flood Attacks</strong>: TCP, UDP, ICMP, DNS, mDNS, SSDP, NTP, NetBIOS, RIPv1, rpcbind, SNMP, SQL RS, Chargen, L2TP, Microsoft SQL Resolution Service</p></li><li><p><strong>Fragmentation Attacks</strong>: Teardrop, Targa3, Jolt2, Nestea</p></li><li><p><strong>Vulnerability Attacks</strong></p></li><li><p><strong>Resource Exhaustion Attacks</strong>: Slowloris, Pyloris, LOIC, etc.</p></li><li><p><strong>Flash Crowd Protection</strong></p></li><li><p><strong>Attacks on Gaming Protocols</strong></p></li></ul></ld-topic>
<ld-topic id="schutz-vor-ddos-angriffen-on-site-masznahmen"><h2>Schutz vor DDoS-Angriffen: On-Site Maßnahmen</h2><ul class="incremental-list list-with-sublists simple"><li><p>Aufrüsten der Ressourcen (z. B. Bandbreite, CPU, RAM, ...)</p></li><li><p>Exemplarische Sofortmaßnahmen bei aktivem Angriff:</p><ul class="incremental-list simple"><li><p>Whitelisting von IP-Adressen von besonders wichtigen Clients</p></li><li><p>Blacklisting von IP-Adressen aus bestimmten Bereichen</p></li><li><p>Captchas</p></li><li><p>Überprüfung der Browser-Echtheit</p></li></ul></li><li><p>Anti-DDoS Appliances</p></li></ul><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Diese Maßnahmen sind häufig teuer und ggf. begrenzt effektiv; wenn der Angriff die verfügbare Bandbreite übersteigt, sind diese Maßnahmen darüber hinaus wirkungslos.</p></aside></ld-topic>
<ld-topic id="schutz-vor-ddos-angriffen-off-site-masznahmen"><h2>Schutz vor DDoS-Angriffen: Off-Site Maßnahmen</h2><ul class="incremental-list list-with-explanations"><li><p>Einbinden des ISP</p></li><li><p>Einbinden spezialisierter Dienstleister</p><p>(Im Angriffsfall wird mittels BGP-Rerouting der Traffic an den Dienstleister umgeleitet, der dann die DDoS Attacke filtert.)</p></li><li><p>Content-Delivery-Networks (CDNs) für statische Inhalte (z. B. Cloudflare, Akamai, ...)</p></li><li><p>Distributed Clouds</p></li></ul></ld-topic>

     Phishing E-Mails im Umlauf

     Hallo Michael Eichberg,

     wir möchten Sie darüber informieren, dass derzeit betrügerische Phishing E-Mails im Umlauf sind.

     Diese E-Mails behaupten, dass mit der Kamera Ihres Geräts kompromittierende Aufnahmen von Ihnen gemacht wurden und Ihr Gerät durch einen Virus oder Trojaner infiziert ist. Die Absender fordern daraufhin eine Zahlung in Bitcoin und bauen durch Folgemails zusätzlichen Druck auf.

     Oftmals erwecken diese Nachrichten mit einer Absenderadresse unter Ihrer Domain den Eindruck, von STRATO oder sogar von Ihrer eigenen E-Mail-Adresse versendet worden zu sein – das ist jedoch nicht der Fall. Bitte ignorieren Sie diese betrügerischen E-Mails.

     Um Sie vor solchen Angriffen zu schützen, haben wir die DMARC-Einstellungen für Ihre Domains aktiviert. Dies sorgt dafür, dass unautorisierte E-Mails von Ihren Domains abgelehnt werden und somit gar nicht erst zugestellt werden können. Falls Sie das nicht wünschen, können Sie dies unter den DNS Einstellungen Ihrer Domain jederzeit durch einen Klick auf "Eigene DMARC-Regel" wieder rückgängig machen. Eine Anleitung dazu finden Sie in unserem FAQ-Artikel.

     Tipp: Wenn Sie eine E-Mail von STRATO erhalten haben und unsicher sind, ob diese echt ist, nutzen Sie unseren STRATO Validierungsservice, um sofort herauszufinden, ob es sich um einen Phishing-Versuch handelt.

     Bei Fragen stehen wir Ihnen gerne zur Verfügung. Sie erreichen uns wie gewohnt über unseren Hilfe & Kontakt-Bereich.

     Mit freundlichen Grüßen
     Ihr STRATO Team--></ld-topic>
