<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 31" font-size="1.2"
     style="--net-server-frame-color: oklch(from currentColor calc(l * 0.5) c h); --net-server-slot-stroke-width: 0.18;">
    <!-- DRDoS-Angriff. Anordnung und Symbole wie beim Idle Scan
         (images/idle-scan/). Mallory (Angreifer): ld-danger,
         Opfer (Ziel): ld-success, NTP-Server (Reflektor): ld-muted.
         Pakete von Mallory: ld-danger.
         Symbole #net-…: shared/svgs/net-symbols.svg. -->

    <!-- === Beteiligte === -->
    <g text-anchor="middle" class="ld-label">
        <text x="6" y="2.2">Mallory</text>
        <text x="29" y="2.2">Opfer</text>
        <text x="29" y="30.4">NTP-Server</text>
    </g>

    <!-- Mallory (Angreifer) -->
    <g class="ld-danger">
        <use href="#net-laptop" x="2.3" y="3.4"/>
    </g>
    <!-- Opfer (Ziel) -->
    <g class="ld-success">
        <use href="#net-server" x="26" y="2.8"/>
    </g>
    <!-- NTP-Server (Reflektor) -->
    <g class="ld-muted">
        <use href="#net-server" x="26" y="21.8"/>
    </g>

    <!-- === (1): Mallory → NTP-Server: kleine Anfrage mit gefälschter Absenderadresse === -->
    <g class="ld-danger incremental-2">
        <line class="ld-connector" x1="9.95" y1="10.63" x2="24.2" y2="22.23"/>
        <g class="ld-label" text-anchor="middle" transform="translate(17.08 16.43) rotate(39.16)">
            <text y="-0.6">(1) NTP Monlist</text>
            <text y="1.7" font-size="1">mit Adresse des Opfers</text>
        </g>
    </g>

    <!-- === (2): NTP-Server → Opfer: ca. 200-fach größere Antwort === -->
    <g class="incremental-3">
        <path class="ld-cell" d="M 28 21.2 L 28 13.4 L 26.6 13.4 L 29 10.2 L 31.4 13.4 L 30 13.4 L 30 21.2 Z"
              stroke="currentColor" stroke-width="0.12" stroke-linejoin="round"/>
        <g class="ld-label" text-anchor="end">
            <text x="26" y="13.4">(2) Antwort</text>
            <text x="26" y="14.8" font-size="1">≈ 200 × größer</text>
        </g>
    </g>
</svg>
