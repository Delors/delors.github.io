<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 57 33" font-size="1.2"
     style="--net-server-frame-color: oklch(from currentColor calc(l * 0.5) c h); --net-server-slot-stroke-width: 0.18;">
    <!-- Smurf-Angriff. Symbole und Farben wie beim Idle Scan und beim
         DRDoS-Angriff: Mallory (Angreifer): ld-danger, Opfer (Ziel):
         ld-success, Rechner im Subnetz (Reflektoren): ld-muted.
         Pakete von Mallory: ld-danger.
         Symbole #net-…: shared/svgs/net-symbols.svg. -->

    <!-- === Beteiligte === -->
    <g text-anchor="middle" class="ld-label">
        <text x="6" y="18.4">Mallory</text>
        <text x="34.2" y="32.4">Opfer</text>
    </g>

    <!-- Subnetz mit den Reflektoren -->
    <rect class="ld-panel ld-muted" x="12.4" y="10" width="44" height="8.2" rx="0.6"/>
    <text class="ld-label ld-muted" x="55.8" y="17.9" text-anchor="end" font-size="0.9">Subnetz</text>

    <!-- Mallory (Angreifer) -->
    <g class="ld-danger">
        <use href="#net-laptop" x="2.3" y="11"/>
    </g>
    <!-- Rechner im Subnetz -->
    <g class="ld-muted">
        <use href="#net-laptop" x="14" y="11"/>
        <use href="#net-laptop" x="24" y="11"/>
        <use href="#net-laptop" x="37" y="11"/>
        <use href="#net-laptop" x="47" y="11"/>
        <text class="ld-label" x="33.5" y="14.4" text-anchor="middle">…</text>
    </g>
    <!-- Opfer (Ziel) -->
    <g class="ld-success">
        <use href="#net-server" x="31.2" y="24"/>
    </g>

    <!-- === (1): Mallory → Broadcast-Adresse des Subnetzes, mit gefälschter Absenderadresse === -->
    <g class="ld-danger incremental unroll-right unroll-down">
        <path class="ld-line" d="M 6 10.6 V 6.4 H 50.7"/>
        <line class="ld-connector" x1="17.7" y1="6.4" x2="17.7" y2="10.52"/>
        <line class="ld-connector" x1="27.7" y1="6.4" x2="27.7" y2="10.52"/>
        <line class="ld-connector" x1="40.7" y1="6.4" x2="40.7" y2="10.52"/>
        <line class="ld-connector" x1="50.7" y1="6.4" x2="50.7" y2="10.52"/>
        <g class="ld-label" text-anchor="middle">
            <text x="31" y="2.6">(1) ein Ping an <tspan class="ld-mono">192.168.1.255</tspan> (Broadcast-Adresse von <tspan class="ld-mono">192.168.1.0/24</tspan>)</text>
            <text x="31" y="4.4" font-size="1">erreicht jeden Rechner – mit Adresse des Opfers</text>
        </g>
    </g>

    <!-- === (2): alle Rechner antworten dem Opfer (Ping-Antwort) === -->
    <g class="incremental unroll-down">
        <line class="ld-connector" x1="17.7" y1="17.2" x2="31.94" y2="23.73"/>
        <line class="ld-connector" x1="27.7" y1="17.2" x2="33.38" y2="23.66"/>
        <line class="ld-connector" x1="40.7" y1="17.2" x2="35.02" y2="23.66"/>
        <line class="ld-connector" x1="50.7" y1="17.2" x2="36.46" y2="23.73"/>
        <line class="ld-connector ld-dotted" x1="33.5" y1="15.3" x2="34.19" y2="23.62"/>
        <text class="ld-label" x="24.4" y="21.4" text-anchor="end">(2) Ping-Antworten</text>
    </g>
</svg>
