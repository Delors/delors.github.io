<ld-topic class="new-section" id="hashfunktionen-grundlagen"><h2>Hashfunktionen - Grundlagen</h2></ld-topic>
<ld-topic id="hashfunktionen"><h2>Hashfunktionen</h2><ul class="incremental-list simple"><li><p>Eine Hashfunktion H akzeptiert eine beliebig lange Nachricht M als Eingabe und gibt einen Wert fixer Größe zurück: h = H(M).</p></li><li><p>Wird oft zur Gewährleistung der Datenintegrität verwendet. Eine Änderung eines beliebigen Bits in M sollte mit hoher Wahrscheinlichkeit zu einer Änderung des Hashwerts h führen.</p></li><li><p>Kryptographische Hashfunktionen werden für Sicherheitsanwendungen benötigt. Mögliche Anwendungen:</p><ul class="simple"><li><p>Authentifizierung von Nachrichten</p></li><li><p>Digitale Signaturen</p></li><li><p>Speicherung von Passwörtern</p></li></ul></li></ul></ld-topic>
<ld-topic id="beispiel-berechnung-von-hashwerten-mittels-md5"><h2>Beispiel: Berechnung von Hashwerten mittels MD5</h2><div class="monospaced"><p>md5("Hello0") = 5ed715782191ee6041cb4d66f29b1121</p><p>md5("Hello1") = 5<strong>ac</strong>7<strong>8c81d</strong>1<strong>b3c28c8db48f57dd2</strong>b<strong>90b3</strong></p></div><hr><div class="monospaced"><p>md5("Dieses Passwort ist wirklich total sicher
und falls Du es mir nicht glaubst, dann
tippe es zweimal hintereinander blind
fehlerfrei ein.")
= 8fcf22b1f8327e3a005f0cba48dd44c8</p></div><aside class="admonition incremental" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Die Verwendung von MD5 dient hier lediglich der Illustration. In realen Anwendung sollte MD5 nicht mehr verwendet werden, da es nachgewiesene Schwachstellen aufweist.</p></aside></ld-topic>
<ld-topic id="sicherheitsanforderungen-an-kryptografische-hashfunktion"><h2>Sicherheitsanforderungen an kryptografische Hashfunktion</h2><ld-story><dl class="incremental-list field-list"><dt>Variable Eingabegröße<span class="colon">:</span></dt><dd><p>H kann auf einen Block beliebiger Größe angewendet werden.</p></dd><dt>Pseudozufälligkeit<span class="colon">:</span></dt><dd><p>Die Ausgabe von H erfüllt die Standardtests für Pseudozufälligkeit.</p></dd><dt>Einwegeigenschaft<span class="colon">:</span></dt><dd><p>Es ist rechnerisch/praktisch nicht machbar für einen gegeben Hashwert h ein N zu finden so dass gilt: H(N) = h</p><p>(<span class="eng">preimage resistant; one-way property</span>)</p><ld-presenter-note encrypted="">MTAwMDAw:bhOZ7L846fWY81QOp3QTf7Ln+8RVOVahJ1MXAlEAhfw=:qhrDVG16bhm5Dyd6:BzU+OIwCEvd3+hw7RpgvoaFYge3xoQMGdXG1lgaBDfUzit5qRAE9OKi/EnQ2RzY97/GMJ6CgxrgPPUz0W2zEZg+9EtyY9GwSLESvSuJYBwl84i3J6XZJ2W1DGEkAbHW/rUWA2i8iIF3CJGZ+XaT1d/UU5kuUyw24VbfyJh3uXLchm47oQTLJtH2ZpmjZ4uF+0JSkxLJBZW7GGGGK+xz67M1PYbEYqbqD98rGq9haq+B1</ld-presenter-note></dd><dt>Schwache Kollisionsresistenz<span class="colon">:</span></dt><dd><p>Es ist rechnerisch nicht machbar für eine gegebene Nachricht M eine Nachricht N zu finden so dass gilt: M ≠ N mit H(M) = H(N)</p><p>(<span class="eng">second preimage resistant; weak collision resistant</span>)</p><ld-presenter-note encrypted="">MTAwMDAw:dOqKWrESqvv4iHhSTRh5EK/77fx8WGZwPZxYfa+ySfo=:3z65Ppm0kTADCg2q:1Dj4XiSu/SC8tSFLwoif9Xb6/5gi77e8Vh20jjRBUbRch2sj2IiylxCfB3KolCHRgCa5T8B5kOrpsmMsdZ1L37liCNBNUf42eMvVQzutuHvn19FH3cSHMB3OUxMk0+XYCZXJWHVtO2QRaTIFRhuZWE4vpM5cifsixE7o/Uqxk6cnpQhrC4xB9C8Z2fB/3WyHYHgQ2Twr0jx7EepHeOblnzeoh3SW</ld-presenter-note></dd><dt>Starke Kollisionsresistenz<span class="colon">:</span></dt><dd><p>Es ist rechnerisch unmöglich ein paar (N,M) zu finden so dass gilt: H(M) = H(N).</p><p>(<span class="eng">collision resistant; strong collision resistant</span>)</p><ld-presenter-note encrypted="">MTAwMDAw:xAmWTNts+xyBPHKkFaUJFz9FuNKC32gboX47y2TgOKo=:y1z6vZNmlxv1uplx:hMemvB7tLgRCJ1RaZ8hv1vLUvx79JDIqW0uhklaqaashWHouPhZr+KWhGdFkqy32Y7sZRzMBiTpsXwDh75O1LNR/O5RZenZzO47cA9a5IoJfzBwC1oTuEpB9FgLVKwcPDjshMOmSkZpsnkLaISEu+0wXM0l/dRzL92t+XZ2jW33rDknWpc3+FFhhyNyPepE6mYx0PTIBq9ftE5et+zJJEI54ae//pcTp2zA9oVTc9lJIwzbziCaExRFaPTzUlnkw/VaSrv36dEI8mF7pZBZacH5rjf5mwsMpmlRnrVoeJGlbNj6oc6BclcFjgFbKCq0UwObkSl4SYLEyBypeLNORdLh1ZvFE0qdpePTFMZ7TJ66HEC6Ouz4ea8BJ3IWHWTyeEtLJ/uyKYDq1cGQHYidKWkiFXrelbKcgmVWgJxDx//zNniH9Zs9lbnHKa8EGocUiTyFKIu3tQ+0f4nsqA2eLDiiSPz8=</ld-presenter-note></dd></dl></ld-story><ld-supplemental embed-in-document-flow=""><aside class="admonition" data-theme="background"><p class="admonition-title" data-theme="background-header"><span>Hintergrund</span></p><p>Im Deutschen wird auch von Urbildangriffen gesprochen. In dem Fall ist <em>preimage resistance</em> (d. h. die Einwegeigenschaft) gleichbedeutend damit, dass man nicht effektiv einen „Erstes-Urbild-Angriff“ durchführen kann. Hierbei ist das Urbild die ursprüngliche Nachricht M, die <em>gehasht</em> wurde.</p><p><em>Second preimage resistance</em> ist dann gleichbedeutend damit, dass man nicht effektiv einen „Zweites-Urbild-Angriff“ durchführen kann. Es ist nicht möglich, zu einer Nachricht M eine zweite Nachricht N (d. h. ein zweites Urbild) zu finden, die für eine gegebene Hashfunktion den gleichen Hash aufweist.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="beziehung-zwischen-den-sicherheitsanforderungen-an-hashfunktionen"><h2>Beziehung zwischen den Sicherheitsanforderungen an Hashfunktionen</h2><div class="margin-auto" style="width: 57ch; height: 38ch;"><svg viewBox="4 1 57 38"
        font-size="1"
        version="1.1"
        xmlns="http://www.w3.org/2000/svg">

        <!-- Schritt 1: Preimage resistant (sofort sichtbar, Anker) -->
        <g>
            <circle cx="23" cy="20" r="18"
                    fill="currentColor" fill-opacity="0.07"
                    stroke="currentColor" stroke-width="0.15" stroke-opacity="0.35"/>
            <text x="15" y="19" text-anchor="middle"
                font-size="2.4" fill="currentColor">
                <tspan x="15" dy="0">Preimage</tspan>
                <tspan x="15" dy="3">resistant</tspan>
            </text>
        </g>

        <!-- Schritt 2: Second preimage resistant -->
        <g class="incremental fade-in">
            <circle cx="42" cy="20" r="18"
                    fill="currentColor" fill-opacity="0.07"
                    stroke="currentColor" stroke-width="0.15" stroke-opacity="0.35"/>
            <text x="42" y="6.5" text-anchor="middle"
                font-size="2.4" fill="currentColor">
                <tspan x="42" dy="0">Second</tspan>
                <tspan x="42" dy="3">preimage resistant</tspan>
            </text>
        </g>

        <!-- Schritt 3: Collision resistant (Teilmenge der Zweite-Urbild-Resistenz) -->
        <g class="incremental fade-in">
            <circle cx="42" cy="20" r="9"
                    fill="currentColor" fill-opacity="0.07"
                    stroke="currentColor" stroke-width="0.15" stroke-opacity="0.35"/>
            <text x="42" y="19" text-anchor="middle"
                font-size="2.4" fill="currentColor">
                <tspan x="42" dy="0">Collision</tspan>
                <tspan x="42" dy="3">resistant</tspan>
            </text>
        </g>

    </svg>
</div><ld-supplemental embed-in-document-flow=""><p>Dass die <em>Collision Resistance</em> (<span class="ger">starke Kollisionsresistenz</span>) eine stärkere Anforderung ist als die <em>Second Preimage Resistance</em>, lässt sich wie folgt erklären: Bei <em>Second Preimage Resistance</em> geht es darum, dass zu einer gegebenen, fixen Nachricht ein Angreifer ggf. eine zweite Nachricht finden soll.</p><p>Bei <em>collision resistance</em> geht es darum, dass ein Angreifer „irgendwelche“ zwei beliebigen Nachrichten finden kann, die den gleichen Hashwert haben. Ein solcher Angriff hat nur einen Aufwand von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><msqrt><msup><mn>2</mn><mi>n</mi></msup></msqrt><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\sqrt{2^{n}})</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.1572em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord sqrt"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.9072em;"><span class="svg-align" style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord" style="padding-left:0.833em;"><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.5904em;"><span style="top:-2.989em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span></span></span><span style="top:-2.8672em;"><span class="pstrut" style="height:3em;"></span><span class="hide-tail" style="min-width:0.853em;height:1.08em;"><svg xmlns="http://www.w3.org/2000/svg" width="400em" height="1.08em" viewBox="0 0 400000 1080" preserveAspectRatio="xMinYMin slice"><path d="M95,702

<ld-topic id="nachrichtenauthentifizierung-vereinfacht"><h2>Nachrichtenauthentifizierung - vereinfacht</h2><ld-deck><ld-card><p>Nachrichten können auf verschiedene Weisen authentifiziert werden, so dass *Person-in-the-Middle-Angriffe*<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a> verhindert werden können.</p></ld-card><ld-card class="incremental"><ld-supplemental embed-in-document-flow=""><p>Im ersten Szenario wird der Hash an die Nachricht angehängt und als Ganzes verschlüsselt.</p></ld-supplemental><figure class="align-center"><object class="light-image" data="drawings/digests/all_encrypted.svg" type="image/svg+xml" role="img" aria-label="drawings/digests/all_encrypted.svg"></object><figcaption><p>Garantiert Vertraulichkeit - Authentizität ist im Allgemeinen nicht garantiert</p></figcaption></figure><ld-supplemental embed-in-document-flow=""><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung: Warum garantiert die Verwendung „nur von Verschlüsselung“ (Szenario 1) keine Authentizität?</span></p><p>Setzen Sie z. B. AES-CTR oder AES-OFB ein, so gilt c = (M ‖ H(M)) ⊕ Schlüsselstrombits. Wer M kennt oder errät, kann eine beliebige Zielnachricht M′ wählen und die Differenzen ΔM = M ⊕ M′ sowie ΔH = H(M) ⊕ H(M′) ohne Schlüssel berechnen – H ist ja öffentlich. XOR-t er diese Differenzen an den passenden Stellen in den Chiffretext, so entschlüsselt dieser beim Empfänger zu M′ ‖ H(M′): Der eingebettete Hash passt zur manipulierten Nachricht und die Integritätsprüfung schlägt nicht an. Der Angreifer muss dafür weder den Schlüsselstrom kennen noch selbst ver-/entschlüsseln.</p><p>Das zugrundeliegende Problem ist, dass Verschlüsselung allein keine Integrität garantiert: Die gängigen, nicht explizit authentisierten Verschlüsselungsmodi sind verformbar (malleable) – ein Angreifer kann den Chiffretext gezielt in einen verwandten Chiffretext überführen, ohne den Schlüssel zu kennen.</p></aside></ld-supplemental></ld-card><ld-card class="incremental"><ld-supplemental embed-in-document-flow=""><p>Im zweiten Szenario wird der Hash der Nachricht berechnet und dann verschlüsselt. Der Empfänger kann den Hash berechnen und mit dem entschlüsselten Hash vergleichen. Wir erhalten Authentizität, aber keine Vertraulichkeit.</p></ld-supplemental><figure class="align-center"><object class="light-image" data="drawings/digests/hash_encrypted.svg" type="image/svg+xml" role="img" aria-label="drawings/digests/hash_encrypted.svg"></object><figcaption><p>Garantiert Authentizität, benötigt aber sowohl Hashing als auch Verschlüsselung – ist potential anfällig gegen bestimmte Angriffe auf den verschlüsselten Hash</p></figcaption></figure></ld-card><ld-card class="incremental"><ld-supplemental embed-in-document-flow=""><p>Im dritten Szenario wird an die Nachricht ein geteiltes Secret angehängt und  alles zusammen gehasht. Die Nachricht wird dann mit dem Ergebnis der vorhergehenden Operation zusammen verschickt.</p></ld-supplemental><figure class="align-center"><object class="light-image" data="drawings/digests/secret_appended.svg" type="image/svg+xml" role="img" aria-label="drawings/digests/secret_appended.svg"></object><figcaption><p>Garantiert Authentizität und es wird nur ein Hashalgorithmus benötigt; anfällig für bestimmte Angriffe - insbesondere gegen Angriffe mit Längenerweiterung bei Hashverfahren basierend auf Merkle-Damgard Konstruktionen.</p></figcaption></figure></ld-card><ld-card class="incremental"><ld-supplemental embed-in-document-flow=""><p>Im letzten Szenario werden alle Ansätze kombiniert.</p></ld-supplemental><figure class="align-center"><object class="light-image" data="drawings/digests/secret_encrypted.svg" type="image/svg+xml" role="img" aria-label="drawings/digests/secret_encrypted.svg"></object><figcaption><p>Garantiert Authentizität und Vertraulichkeit.</p></figcaption></figure></ld-card></ld-deck><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p><em>Person-in-the-Middle</em> (in Standards auch <em>on-path attack</em>) ist die gender-neutrale Version von <em>Man-in-the-Middle</em>.</p></aside></aside><ld-supplemental><aside class="admonition dd-margin-left-2em" data-theme="legend"><p class="admonition-title" data-theme="legend-header"><span>Legende</span></p><dl class="field-list simple"><dt>M<span class="colon">:</span></dt><dd><p>die Nachricht</p></dd><dt>H<span class="colon">:</span></dt><dd><p>die Hashfunktion</p></dd><dt>E<span class="colon">:</span></dt><dd><p>der Verschlüsselungsalgorithmus</p></dd><dt>D<span class="colon">:</span></dt><dd><p>der Entschlüsselungsalgorithmus</p></dd><dt>K<span class="colon">:</span></dt><dd><p>ein geheimer Schlüssel</p></dd><dt>S<span class="colon">:</span></dt><dd><p>eine geheime Zeichenkette</p></dd><dt>||<span class="colon">:</span></dt><dd><p>die Konkatenation von zwei Werten (d. h. das Aneinanderhängen von zwei Werten)</p></dd></dl></aside><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Bei <em>Person-in-the-Middle-Angriffen</em> handelt es sich um einen Fachbegriff und häufig wird zum Beispiel Eve oder Mallory verwendet, um die Person zu bezeichnen, die den Angriff durchführt. Gelegentlich wird auch <em>Adversary-in-the-Middle</em> oder früher <em>Man-in-the-Middle</em> verwendet.</p></aside><p class="rubric">Hashes und Message-Digests</p><p>Im allgemeinen Sprachgebrauch wird auch von <span class="eng">Message Digests</span> gesprochen.</p></ld-supplemental></ld-topic>
<ld-topic id="digitale-signaturen-vereinfacht"><h2>Digitale Signaturen - vereinfacht</h2><ld-deck><ld-card><p>Digitale Signaturen dienen (auch) dem Nachweis der <span class="emph">Authentizität</span> und <span class="emph">Integrität</span> einer Nachricht. Darüber hinaus garantieren sie die <span class="emph">Nichtabstreitbarkeit</span>: Der Absender kann nicht bestreiten, der Urheber der Nachricht zu sein.</p><p>Jede Person, die den öffentlichen Schlüssel besitzt, kann die Signatur überprüfen. Nur der Inhaber des zugehörigen privaten Schlüssels ist jedoch in der Lage, die Signatur zu erzeugen.</p></ld-card><ld-card class="incremental"><figure class="align-center"><object class="light-image" data="drawings/signatures/just_authentication.svg" type="image/svg+xml" role="img" aria-label="drawings/signatures/just_authentication.svg"></object><figcaption><p>Authentizität und Nichtabstreitbarkeit</p></figcaption></figure></ld-card><ld-card class="incremental"><figure class="align-center"><object class="light-image" data="drawings/signatures/authentication_and_encryption.svg" type="image/svg+xml" role="img" aria-label="drawings/signatures/authentication_and_encryption.svg"></object><figcaption><p>Authentizität, Vertraulichkeit und Nichtabstreitbarkeit</p></figcaption></figure></ld-card></ld-deck><ld-supplemental><p><strong>Legende</strong></p><dl class="field-list simple"><dt>M<span class="colon">:</span></dt><dd><p>die Nachricht</p></dd><dt>H<span class="colon">:</span></dt><dd><p>die Hashfunktion</p></dd><dt>E<span class="colon">:</span></dt><dd><p>der Verschlüsselungsalgorithmus</p></dd><dt>D<span class="colon">:</span></dt><dd><p>der Entschlüsselungsalgorithmus</p></dd><dt>K<span class="colon">:</span></dt><dd><p>ein geheimer Schlüssel</p></dd><dt>PR<sub>a</sub><span class="colon">:</span></dt><dd><p>der private Schlüssel von a</p></dd><dt>PU<sub>a</sub><span class="colon">:</span></dt><dd><p>der öffentliche Schlüssel von a</p></dd><dt>||<span class="colon">:</span></dt><dd><p>die Konkatenation von zwei Werten (d. h. das Aneinanderhängen von zwei Werten)</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic id="anforderungen-an-die-resistenz-von-hashfunktionen"><h2>Anforderungen an die Resistenz von Hashfunktionen</h2><table class="table-body-header-align-left booktabs table-data-align-center highlight-row-on-hover incremental-table-rows"><colgroup><col style="width: 48.3%"><col style="width: 17.2%"><col style="width: 17.2%"><col style="width: 17.2%"></colgroup><thead><tr><th class="stub head"></th><th class="head"><p>Preimage Resistant</p></th><th class="head"><p>Second Preimage Resistant</p></th><th class="head"><p>Collision Resistant</p></th></tr></thead><tbody><tr><th class="stub"><p>Hash + Digitale Signaturen</p></th><td><p>✓</p></td><td><p>✓</p></td><td><p>✓</p></td></tr><tr><th class="stub"><p>Einbruchserkennung und Viruserkennung</p></th><td></td><td><p>✓</p></td><td></td></tr><tr><th class="stub"><p>Hash + Symmetrische Verschlüsselung</p></th><td></td><td></td><td></td></tr><tr><th class="stub"><p>Passwortspeicherung</p></th><td><p>✓</p></td><td></td><td></td></tr><tr><th class="stub"><p>MAC</p></th><td><p>✓</p></td><td><p>✓</p></td><td><p>✓</p></td></tr></tbody></table><ld-supplemental><p class="rubric">Einbruchserkennung und Viruserkennung - Hintergrund</p><p>Bei der Einbruchserkennung und Viruserkennung ist <em>second preimage</em> Resistenz erforderlich. Andernfalls könnte ein Angreifer seine Malware so schreiben, dass diese einen Hash wie eine vorhandene gutartige Software hat und so verhindern, dass die Malware auf eine schwarze Liste gesetzt werden kann, ohne den Kollateralschaden, dass auch die gutartige Software fälschlicherweise als Malware erkannt wird.</p><p class="rubric">Aufwand eines Kollisionsangriffs</p><p>Ein Kollisionsangriff erfordert weniger Aufwand als ein <em>preimage</em> oder ein <em>second preimage</em> Angriff.</p><p>Dies wird durch das Geburtstagsparadoxon erklärt. Wählt man Zufallsvariablen aus einer Gleichverteilung im Bereich von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn></mrow><annotation encoding="application/x-tex">0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span></span> bis <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">N-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span>, so übersteigt die Wahrscheinlichkeit, dass ein sich wiederholendes Element gefunden wird, nach <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msqrt><mi>N</mi></msqrt></mrow><annotation encoding="application/x-tex">\sqrt{N}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.04em;vertical-align:-0.1133em;"></span><span class="mord sqrt"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.9267em;"><span class="svg-align" style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord" style="padding-left:0.833em;"><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span><span style="top:-2.8867em;"><span class="pstrut" style="height:3em;"></span><span class="hide-tail" style="min-width:0.853em;height:1.08em;"><svg xmlns="http://www.w3.org/2000/svg" width="400em" height="1.08em" viewBox="0 0 400000 1080" preserveAspectRatio="xMinYMin slice"><path d="M95,702

<ld-topic id="effizienzanforderungen-an-kryptografische-hashfunktionen"><h2>Effizienzanforderungen an kryptografische Hashfunktionen</h2><dl class="field-list simple"><dt>Effizienz bei der Verwendung für Signaturen und zur Authentifizierung<span class="colon">:</span></dt><dd><p>Bei der Verwendung zur Nachrichtenauthentifizierung und für digitale Signaturen ist <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>H</mi><mo stretchy="false">(</mo><mi>N</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">H(N)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0813em;">H</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mclose">)</span></span></span></span></span> für jedes beliebige <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi></mrow><annotation encoding="application/x-tex">N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span></span> relativ einfach zu berechnen. Dies soll sowohl Hardware- als auch Softwareimplementierungen ermöglichen.</p></dd></dl><div class="incremental"><div class="text-align-center bold huge"><p>vs.</p></div><dl class="field-list simple"><dt>Brute-Force-Angriffe auf Passwörter erschweren<span class="colon">:</span></dt><dd><p>Bei der Verwendung für das Hashing von Passwörtern soll es schwierig sein den Hash effizient zu berechnen, selbst auf spezialisierter Hardware (GPUs, ASICs).</p></dd></dl></div></ld-topic>

<ld-topic id="struktur-eines-sicheren-hash-codes"><h2>Struktur eines sicheren Hash-Codes</h2><p>(Vorgeschlagen von Merkle.)</p><object class="light-image align-center" data="drawings/hash_functions/structure_of_secure_hash_codes.svg" type="image/svg+xml" role="img"></object><ul class="columns left-aligned dd-margin-left-3em"><li><dl class="field-list simple"><dt>IV<span class="colon">:</span></dt><dd><p>Initialer Wert (Algorithmus-abhängig)</p></dd><dt>CV<sub>i</sub><span class="colon">:</span></dt><dd><p>Verkettungsvariable</p></dd><dt>Y<sub>i</sub><span class="colon">:</span></dt><dd><p>i-er Eingabeblock</p></dd><dt>f<span class="colon">:</span></dt><dd><p>Kompressionsfunktion</p></dd></dl></li><li><dl class="field-list simple"><dt>n<span class="colon">:</span></dt><dd><p>Länge des Blocks</p></dd><dt>L<span class="colon">:</span></dt><dd><p>Anzahl der Eingabeblöcke</p></dd><dt>b<span class="colon">:</span></dt><dd><p>Länge des Eingabeblocks</p></dd></dl></li></ul><ld-supplemental><p>Diese Struktur liegt insbesondere den Hashfunktionen der SHA-2 Familie zugrunde.</p></ld-supplemental></ld-topic>
<ld-topic id="die-sha-familie-secure-hash-algorithms"><h2>Die SHA-Familie (Secure Hash Algorithms)</h2><ld-story><ul class="incremental-list simple"><li><p>eine Gruppe kryptographischer Hashfunktionen, die von der US-amerikanischen NIST standardisiert wurden.</p></li><li><p>Anwendungsziele:</p><ul class="simple"><li><p>Prüfsummenbildung (Integrität)</p></li><li><p>Digitale Signaturen</p></li><li><p>Basis für weitere kryptographische Konstrukte (z. B. HMAC)</p></li></ul></li><li><p>Mitglieder:</p><ul class="simple"><li><p>SHA-1 hat 160 Bit und wird seit 2004 nicht mehr als sicher betrachtet; praktikable Angriffe gibt es seit 2009</p></li><li><p>SHA-2 entwickelt im Jahr 2000 und umfasst 224, 256, 384 und 512 Bit Varianten</p></li><li><p>SHA-3 2015 spezifiziert und basiert auf Keccak</p></li></ul></li></ul><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="literal-block"><code>SHA-256("Hallo") →
         753692ec36adb4c794c973945eb2a99c1649703ea6f76bf259abb4fb838e013e</code></pre><ld-supplemental><p><strong>Berechnung des SHA-256</strong></p><p><em>Python</em></p><pre class="code python copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">from</span> hashlib <span class="keyword">import</span> sha256
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">from</span> binascii <span class="keyword">import</span> hexlify
</code><small class="ln">3</small><code data-lineno="3">hexlify<span class="punctuation">(</span>sha256<span class="punctuation">(</span><span class="name builtin">bytes</span><span class="punctuation">(</span><span class="literal string">"Hallo"</span><span class="punctuation">,</span><span class="literal string">"UTF-8"</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">.</span>digest<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span></code></pre><p><em>Shell/Console</em></p><pre class="code console copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">echo</span> <span class="name variable">-n</span> <span class="literal string">"Hallo"</span> <span class="operator">|</span>sha256sum</code></pre></ld-supplemental></aside><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Passwort-Hashing ist kein direktes Anwendungsziel!</p></aside></ld-story><ld-supplemental><p>SHA-2 ist momentan weit verbreitet und gilt als sicher, aber SHA-3 bietet ein alternatives Sicherheitsdesign mit dem Keccak-Ansatz.</p></ld-supplemental></ld-topic>
<ld-topic id="sha-512-ubersicht"><h2><a class="reference external" href="https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.180-4.pdf">SHA-512 - Übersicht</a></h2><ld-deck class="picture" data-theme="light"><ld-card><object class="align-center" data="drawings/sha512/sha512-main.svg" type="image/svg+xml" role="img" aria-label="Nachricht"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/sha512/sha512-blocks.svg" type="image/svg+xml" role="img" aria-label="Nachricht"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/sha512/sha512-nth-block.svg" type="image/svg+xml" role="img" aria-label="Nachricht"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/sha512/sha512-padding.svg" type="image/svg+xml" role="img" aria-label="Nachricht"></object></ld-card></ld-deck><ld-supplemental><ul><li><p>SHA-512 nimmt eine Nachricht beliebiger Größe und gibt einen 512-Bit-Hashwert zurück.</p></li><li><p>Der IV von SHA-512 besteht aus den folgenden acht 64-Bit-Zahlen mit Wortgröße:</p><pre class="literal-block"><code>6a09e667f3bcc908
bb67ae8584caa73b
3c6ef372fe94f82b
a54ff53a5f1d36f1
510e527fade682d1
9b05688c2b3e6c1f
1f83d9abfb41bd6b
5be0cd19137e2179</code></pre></li><li><p>Die Addition erfolgt wortweise modulo 2⁶⁴.</p></li><li><p>Die Nachricht wird in 1024-Bit-Blöcke unterteilt. Die Nachricht wird - unabhängig von der tatsächlichen Länge - <em>immer</em> aufgefüllt (<span class="eng">padded</span>) und auf eine Länge l ≡ 896 (mod 1024) Bits gebracht.</p></li><li><p>Das Padding besteht aus einem Bit mit Wert 1, gefolgt von der notwendigen Anzahl Nullen.</p></li><li><p>Am Ende wird die Länge der Nachricht als 128-Bit-Wert angehängt, um ein Vielfaches von 1024 zu erhalten.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="sha-512-verarbeitung-eines-1024-bit-blocks"><h2>SHA-512 - Verarbeitung eines 1024-Bit-Blocks</h2><ld-deck class="picture" data-theme="light"><ld-card><object class="align-center" data="drawings/sha512-processing_a_block/main.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/sha512-processing_a_block/main-pass-through.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/sha512-processing_a_block/block.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/sha512-processing_a_block/wi.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/sha512-processing_a_block/constants.svg" type="image/svg+xml" role="img"></object></ld-card></ld-deck><ld-supplemental embed-in-document-flow=""><p>Die Additionen erfolgen Modulo <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mn>64</mn></msup></mrow><annotation encoding="application/x-tex">2⁶⁴</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8141em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">64</span></span></span></span></span></span></span></span></span></span></span></span></span>.</p><h3>Berechnung der W<sub>i</sub></h3><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>W</mi><mn>0</mn></msub></mrow><annotation encoding="application/x-tex">W_0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">W</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> bis <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>W</mi><mn>15</mn></msub></mrow><annotation encoding="application/x-tex">W_{15}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">W</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">15</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> sind die ersten 16 Wörter des 1024-Bit-Blocks. Die restlichen 64 Wörter werden wie folgt berechnet.</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>w</mi><mi>t</mi></msub><mo>=</mo><msub><mi>σ</mi><mn>1</mn></msub><mo stretchy="false">(</mo><msub><mi>w</mi><mrow><mi>t</mi><mo>−</mo><mn>2</mn></mrow></msub><mo stretchy="false">)</mo><mo>+</mo><msub><mi>w</mi><mrow><mi>t</mi><mo>−</mo><mn>7</mn></mrow></msub><mo>+</mo><msub><mi>σ</mi><mn>0</mn></msub><mo stretchy="false">(</mo><msub><mi>w</mi><mrow><mi>t</mi><mo>−</mo><mn>15</mn></mrow></msub><mo stretchy="false">)</mo><mo>+</mo><msub><mi>w</mi><mrow><mi>t</mi><mo>−</mo><mn>16</mn></mrow></msub></mrow><annotation encoding="application/x-tex">w_t = \sigma_1(w_{t-2}) + w_{t-7} + \sigma_0(w_{t-15}) + w_{t-16}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.2806em;"><span style="top:-2.55em;margin-left:-0.0269em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">t</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0 ight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord mathnormal">x</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel amsrm">⋙</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⊕</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel amsrm">⋙</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">8</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⊕</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≫</span><span class="mspace" </code><small class="ln"> 5</small><code data-lineno=" 5"> <span class="operator">*</span> <span class="punctuation">@param</span> n the number <span class="keyword">for</span> which the cube root should be computed<span class="punctuation">.</span>
</code><small class="ln"> 6</small><code data-lineno=" 6"> <span class="operator">*</span> <span class="punctuation">@param</span> guess the current<span class="operator">/</span>initial <span class="name class"><span class="name namespace">guess<span class="punctuation">.</span></span> Can</span> be <span class="name class">BigDecimal</span><span class="punctuation">.</span><span class="name constant">ONE</span><span class="punctuation">.</span>
</code><small class="ln"> 7</small><code data-lineno=" 7"> <span class="operator">*</span> <span class="punctuation">@param</span> the number of steps <span class="keyword">to</span> <span class="name namespace">be</span> <span class="name class"><span class="name namespace">executed<span class="punctuation">.</span></span> The</span> algorithm is
</code><small class="ln"> 8</small><code data-lineno=" 8"> <span class="operator">*</span>        iterative and the number of steps determines the
</code><small class="ln"> 9</small><code data-lineno=" 9"> <span class="operator">*</span>        precision of the result<span class="punctuation">.</span>
</code><small class="ln">10</small><code data-lineno="10"> <span class="operator">*</span><span class="operator">/</span>
</code><small class="ln">11</small><code data-lineno="11"><span class="name class">BigDecimal</span> <span class="name function">cbrt</span><span class="punctuation">(</span><span class="name class">BigDecimal</span> n<span class="punctuation">,</span> <span class="name class">BigDecimal</span> guess<span class="punctuation">,</span>  <span class="keyword">int</span> steps<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">12</small><code data-lineno="12">    <span class="keyword">if</span> <span class="punctuation">(</span>steps <span class="operator">==</span> <span class="literal number integer">0</span><span class="punctuation">)</span> <span class="keyword">return</span> guess<span class="punctuation">;</span>
</code><small class="ln">13</small><code data-lineno="13">    <span class="keyword">final</span> <span class="keyword">var</span> newGuess <span class="operator">=</span>
</code><small class="ln">14</small><code data-lineno="14">        guess<span class="punctuation">.</span><span class="name function">add</span><span class="punctuation">(</span>
</code><small class="ln">15</small><code data-lineno="15">            guess<span class="punctuation">.</span><span class="name function">pow</span><span class="punctuation">(</span><span class="literal number integer">3</span><span class="punctuation">)</span><span class="punctuation">.</span><span class="name function">add</span><span class="punctuation">(</span>n<span class="punctuation">.</span><span class="name function">negate</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">.</span><span class="name function">divide</span><span class="punctuation">(</span>
</code><small class="ln">16</small><code data-lineno="16">                guess<span class="punctuation">.</span><span class="name function">pow</span><span class="punctuation">(</span><span class="literal number integer">2</span><span class="punctuation">)</span><span class="punctuation">.</span><span class="name function">multiply</span><span class="punctuation">(</span><span class="keyword">new</span> <span class="name class">BigDecimal</span><span class="punctuation">(</span><span class="literal number integer">3</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">,</span>
</code><small class="ln">17</small><code data-lineno="17">                <span class="name class">MathContext</span><span class="punctuation">.</span><span class="name constant">DECIMAL128</span>
</code><small class="ln">18</small><code data-lineno="18">            <span class="punctuation">)</span><span class="punctuation">.</span><span class="name function">negate</span><span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">19</small><code data-lineno="19">        <span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">20</small><code data-lineno="20">    <span class="keyword">return</span> <span class="name function">cbrt</span><span class="punctuation">(</span>n<span class="punctuation">,</span>newGuess<span class="punctuation">,</span>steps <span class="operator">-</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">21</small><code data-lineno="21"><span class="punctuation">}</span>
</code><small class="ln">22</small><code data-lineno="22"><span class="comment single">/**</span>
</code><small class="ln">23</small><code data-lineno="23"> <span class="operator">*</span> <span class="name class">Given</span> a prime number get the first <span class="literal number integer">64</span> bits of the fractional
</code><small class="ln">24</small><code data-lineno="24"> <span class="operator">*</span> part of the cube root<span class="punctuation">.</span>
</code><small class="ln">25</small><code data-lineno="25"> <span class="operator">*</span><span class="operator">/</span>
</code><small class="ln">26</small><code data-lineno="26"><span class="name class">String</span> <span class="name function">shaConstant</span><span class="punctuation">(</span><span class="keyword">int</span> prime<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">27</small><code data-lineno="27">    <span class="keyword">final</span> <span class="keyword">var</span> cubeRoot <span class="operator">=</span> <span class="name function">cbrt</span><span class="punctuation">(</span><span class="keyword">new</span> <span class="name class">BigDecimal</span><span class="punctuation">(</span>prime<span class="punctuation">)</span><span class="punctuation">,</span><span class="name class">BigDecimal</span><span class="punctuation">.</span><span class="name constant">ONE</span><span class="punctuation">,</span><span class="literal number integer">16</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">28</small><code data-lineno="28">    <span class="comment single">// "extract" the fractional by computing modulo 1</span>
</code><small class="ln">29</small><code data-lineno="29">    <span class="keyword">final</span> <span class="keyword">var</span> fractionalPart <span class="operator">=</span> cubeRoot<span class="punctuation">.</span><span class="name function">remainder</span><span class="punctuation">(</span><span class="name class">BigDecimal</span><span class="punctuation">.</span><span class="name constant">ONE</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">30</small><code data-lineno="30">    <span class="comment single">// To extract the first 64 bits we effectively do a shift-left</span>
</code><small class="ln">31</small><code data-lineno="31">    <span class="comment single">// by 64 which we simulate by multiplying with 2^64</span>
</code><small class="ln">32</small><code data-lineno="32">    <span class="keyword">final</span> <span class="keyword">var</span> bits <span class="operator">=</span> fractionalPart<span class="punctuation">.</span><span class="name function">multiply</span><span class="punctuation">(</span><span class="name class">BigDecimal</span><span class="punctuation">.</span><span class="name constant">TWO</span><span class="punctuation">.</span><span class="name function">pow</span><span class="punctuation">(</span><span class="literal number integer">64</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">33</small><code data-lineno="33">    <span class="comment single">// to get the HEX representation we use BigInteger's toString</span>
</code><small class="ln">34</small><code data-lineno="34">    <span class="comment single">// method as a convenience method</span>
</code><small class="ln">35</small><code data-lineno="35">    <span class="keyword">return</span> bits<span class="punctuation">.</span><span class="name function">toBigInteger</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">.</span><span class="name function">toString</span><span class="punctuation">(</span><span class="literal number integer">16</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">36</small><code data-lineno="36"><span class="punctuation">}</span></code></pre></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-move-left" id="message-authentication-codes-macs"><h2><em>Message Authentication Codes</em> (MACs)</h2><ld-supplemental><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p><em>Message Authentication Codes</em> könnte ins Deutsche mit
Nachrichtenauthentifizierungscodes übersetzt werden, dies ist aber nicht üblich.</p><p>Im allgemeinen (IT-)Sprachgebrauch wird von *MAC*s gesprochen.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="hmac-hash-based-message-authentication-code"><h2>HMAC (Hash-based Message Authentication Code)</h2><ul class="incremental-list"><li><p>Auch als <em>keyed-hash message authentication code</em> bezeichnet.</p></li><li><p>Konstruktion:</p><div class="accentuate"><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mtable rowspacing="0.16em" columnalign="right center left" columnspacing="1em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>H</mi><mi>M</mi><mi>A</mi><mi>C</mi><mo stretchy="false">(</mo><mi>K</mi><mo separator="true">,</mo><mi>m</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mo lspace="0em" rspace="0em">=</mo></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>H</mi><mo stretchy="false">(</mo><mo stretchy="false">(</mo><msup><mi>K</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo>⊕</mo><mi>o</mi><mi>p</mi><mi>a</mi><mi>d</mi><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mi mathvariant="normal">∣</mi><mi>H</mi><mo stretchy="false">(</mo><mo stretchy="false">(</mo><msup><mi>K</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo>⊕</mo><mi>i</mi><mi>p</mi><mi>a</mi><mi>d</mi><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mi mathvariant="normal">∣</mi><mi>m</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><msup><mi>K</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mo lspace="0em" rspace="0em">=</mo></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mo fence="true">{</mo><mtable rowspacing="0.36em" columnalign="left left" columnspacing="1em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>H</mi><mo stretchy="false">(</mo><mi>K</mi><mo stretchy="false">)</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mtext>falls K gr</mtext><mover accent="true"><mtext>o</mtext><mo>¨</mo></mover><mtext>ßer als die Blockgr</mtext><mover accent="true"><mtext>o</mtext><mo>¨</mo></mover><mtext>ße ist</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><mi>K</mi></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mtext>andernfalls</mtext></mstyle></mtd></mtr></mtable></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{array}{rcl}
HMAC(K,m) &amp; = &amp; H( (K&#x27; \oplus opad) || H( ( K&#x27; \oplus ipad) || m) ) \\
K&#x27; &amp; = &amp;\begin{cases}
        H(K) &amp; \text{falls K größer als die Blockgröße ist}\\
        K &amp; \text{andernfalls}
        \end{cases}
\end{array}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:4.2em;vertical-align:-1.85em;"></span><span class="mord"><span class="mtable"><span class="arraycolsep" style="width:0.5em;"></span><span class="col-align-r"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:2.35em;"><span style="top:-5.26em;"><span class="pstrut" style="height:3.75em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0813em;">H</span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mord mathnormal">A</span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">m</span><span class="mclose">)</span></span></span><span style="top:-3.15em;"><span class="pstrut" style="height:3.75em;"></span><span class="mord"><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7519em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">′</span></span></span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.85em;"><span></span></span></span></span></span><span class="arraycolsep" style="width:0.5em;"></span><span class="arraycolsep" style="width:0.5em;"></span><span class="col-align-c"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:2.35em;"><span style="top:-5.26em;"><span class="pstrut" style="height:3.75em;"></span><span class="mord"><span class="mrel">=</span></span></span><span style="top:-3.15em;"><span class="pstrut" style="height:3.75em;"></span><span class="mord"><span class="mrel">=</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.85em;"><span></span></span></span></span></span><span class="arraycolsep" style="width:0.5em;"></span><span class="arraycolsep" style="width:0.5em;"></span><span class="col-align-l"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:2.35em;"><span style="top:-5.26em;"><span class="pstrut" style="height:3.75em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0813em;">H</span><span class="mopen">((</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7519em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">′</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⊕</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord mathnormal">o</span><span class="mord mathnormal">p</span><span class="mord mathnormal">a</span><span class="mord mathnormal">d</span><span class="mclose">)</span><span class="mord">∣∣</span><span class="mord mathnormal" style="margin-right:0.0813em;">H</span><span class="mopen">((</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7519em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">′</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⊕</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord mathnormal">i</span><span class="mord mathnormal">p</span><span class="mord mathnormal">a</span><span class="mord mathnormal">d</span><span class="mclose">)</span><span class="mord">∣∣</span><span class="mord mathnormal">m</span><span class="mclose">))</span></span></span><span style="top:-3.15em;"><span class="pstrut" style="height:3.75em;"></span><span class="mord"><span class="minner"><span class="mopen delimcenter" style="top:0em;"><span class="delimsizing size4">{</span></span><span class="mord"><span class="mtable"><span class="col-align-l"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.69em;"><span style="top:-3.69em;"><span class="pstrut" style="height:3.008em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0813em;">H</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="mclose">)</span></span></span><span style="top:-2.25em;"><span class="pstrut" style="height:3.008em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.19em;"><span></span></span></span></span></span><span class="arraycolsep" style="width:1em;"></span><span class="col-align-l"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.69em;"><span style="top:-3.69em;"><span class="pstrut" style="height:3.008em;"></span><span class="mord"><span class="mord text"><span class="mord">falls K gr</span><span class="mord katex-accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6679em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord">o</span></span><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.25em;"><span class="mord">¨</span></span></span></span></span></span></span><span class="mord">ßer als die Blockgr</span><span class="mord katex-accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6679em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord">o</span></span><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.25em;"><span class="mord">¨</span></span></span></span></span></span></span><span class="mord">ße ist</span></span></span></span><span style="top:-2.25em;"><span class="pstrut" style="height:3.008em;"></span><span class="mord"><span class="mord text"><span class="mord">andernfalls</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.19em;"><span></span></span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.85em;"><span></span></span></span></span></span><span class="arraycolsep" style="width:0.5em;"></span></span></span></span></span></span></span></div></div></li><li><p>Standardisiert - sicher gegen Längenerweiterungsangriffe.</p></li></ul><ld-supplemental><aside class="admonition" data-theme="legend"><p class="admonition-title" data-theme="legend-header"><span>Legende</span></p><dl class="dd-margin-left-4em field-list simple"><dt>H<span class="colon">:</span></dt><dd><p>ist eine kryptografische Hashfunktion.</p></dd><dt>m<span class="colon">:</span></dt><dd><p>ist die Nachricht.</p></dd><dt>K<span class="colon">:</span></dt><dd><p>ist der geheime Schlüssel (<em>Secret Key</em>).</p></dd><dt>K'<span class="colon">:</span></dt><dd><p>ist vom Schlüssel K abgeleiteter Schlüssel mit Blockgröße (ggf. <em>padded</em> oder <em>gehasht</em>).</p></dd><dt>||<span class="colon">:</span></dt><dd><p>ist die Konkatenation.</p></dd><dt>⊕<span class="colon">:</span></dt><dd><p>ist die XOR Operation.</p></dd><dt>opad<span class="colon">:</span></dt><dd><p>ist das äußere Padding bestehend aus Wiederholungen von 0x5c in Blockgröße.</p></dd><dt>ipad<span class="colon">:</span></dt><dd><p>ist das innere Padding bestehend aus Wiederholungen von 0x36 in Blockgröße.</p></dd></dl></aside></ld-supplemental></ld-topic>
<ld-topic class="no-title" id="hmac-berechnung-visualisiert"><h2>HMAC Berechnung visualisiert</h2><object class="light-image align-left" data="drawings/hmac/hmac_i_o_key_derivation.svg" type="image/svg+xml" role="img" aria-label="Schlüsselableitung für den inneren und äußeren Schlüssel K&#x27;"></object><object class="light-image incremental align-right" data="drawings/hmac/hmac_message_hashing.svg" type="image/svg+xml" role="img" aria-label="Schlüsselableitung für den inneren und äußeren Schlüssel K&#x27;"></object><ld-supplemental><p><strong>Padding und Hashing</strong></p><p>Im Rahmen der Speicherung von Passwörtern und <em>Secret Keys</em> ist die Verwendung von Padding Operationen bzw. das Hashing von Passwörtern, um Eingaben in einer wohl-definierten Länge zu bekommen, üblich. Neben dem hier gesehenen Padding, bei dem 0x00 Werte angefügt werden, ist zum Beispiel auch das einfache Wiederholen des ursprünglichen Wertes, bis man auf die notwendige Länge kommt, ein Ansatz.</p><p>Diese Art Padding darf jedoch nicht verwechselt werden mit dem Padding, dass ggf. im Rahmen der Verschlüsselung von Nachrichten notwendig ist, um diese ggf. auf eine bestimmte Blockgröße zu bringen (zum Beispiel bei ECB bzw. CBC Block Mode Operations.)</p></ld-supplemental></ld-topic>
<ld-topic id="hmac-berechnung-in-python"><h2>HMAC Berechnung in Python</h2><p><strong>Implementierung</strong></p><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">import</span> hashlib
</code><small class="ln"> 2</small><code data-lineno=" 2">pwd <span class="operator">=</span> <span class="literal string">b"MyPassword"</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">stretched_pwd <span class="operator">=</span> pwd <span class="operator">+</span> <span class="punctuation">(</span><span class="literal number integer">64</span><span class="operator">-</span><span class="name builtin">len</span><span class="punctuation">(</span>pwd<span class="punctuation">)</span><span class="punctuation">)</span> <span class="operator">*</span> <span class="literal string">b"\x00"</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5">ikeypad <span class="operator">=</span> <span class="name builtin">bytes</span><span class="punctuation">(</span><span class="name builtin">map</span><span class="punctuation">(</span><span class="keyword">lambda</span> x <span class="punctuation">:</span> x <span class="operator">^</span> <span class="literal number integer">0x36</span> <span class="punctuation">,</span> stretched_pwd<span class="punctuation">)</span><span class="punctuation">)</span> <span class="comment single"># xor with ipad</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">okeypad <span class="operator">=</span> <span class="name builtin">bytes</span><span class="punctuation">(</span><span class="name builtin">map</span><span class="punctuation">(</span><span class="keyword">lambda</span> x <span class="punctuation">:</span> x <span class="operator">^</span> <span class="literal number integer">0x5c</span> <span class="punctuation">,</span> stretched_pwd<span class="punctuation">)</span><span class="punctuation">)</span> <span class="comment single"># xor with opad</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">
</code><small class="ln"> 8</small><code data-lineno=" 8">hash1 <span class="operator">=</span> hashlib<span class="punctuation">.</span>sha256<span class="punctuation">(</span>ikeypad<span class="operator">+</span><span class="literal string">b"JustAMessage"</span><span class="punctuation">)</span><span class="punctuation">.</span>digest<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">hmac  <span class="operator">=</span> hashlib<span class="punctuation">.</span>sha256<span class="punctuation">(</span>okeypad<span class="operator">+</span>hash1<span class="punctuation">)</span><span class="punctuation">.</span>digest<span class="punctuation">(</span><span class="punctuation">)</span>

</code><small class="ln">13</small><code data-lineno="13"><span class="comment single">#        \x8f\xa6\xd6L\x94\xab\x89\x9a\x89*\xc7\x0f_no\xc1\xdc6\xfc'</span></code></pre><ld-supplemental><p>HMAC ist auch direkt als Bibliotheksfunktion verfügbar.</p><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">import</span> hashlib
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">import</span> hmac

encoding="application/x-tex">a</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">a</span></span></span></span></span> mit 0</p></li><li><p>die Nachricht wird in Blöcke von 16 Byte aufgeteilt und als <em>little-endian</em> Zahl verarbeitet; d. h. ein Block hat 16 Oktette (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>16</mn><mo>×</mo><mn>8</mn></mrow><annotation encoding="application/x-tex">16 \times 8</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">16</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">8</span></span></span></span></span> Bit)</p></li><li><p>Füge dem Block <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span></span> ein Bit jenseits der Anzahl der Oktette des aktuellen Blocks hinzu <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>→</mo><msup><mi>n</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup></mrow><annotation encoding="application/x-tex">\rightarrow  n&#x27;</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.3669em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7519em;"></span><span class="mord"><span class="mord mathnormal">n</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7519em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">′</span></span></span></span></span></span></span></span></span></span></span></span></span></p><p>(D. h. im Falle eines 16-Byte-Blocks wird die Zahl <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mn>128</mn></msup></mrow><annotation encoding="application/x-tex">2¹²⁸</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8141em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">128</span></span></span></span></span></span></span></span></span></span></span></span></span> addiert und danach haben wir somit eine 17-Byte-Zahl.)</p></li><li><p>Addiere <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>n</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup></mrow><annotation encoding="application/x-tex">n&#x27;</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7519em;"></span><span class="mord"><span class="mord mathnormal">n</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7519em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">′</span></span></span></span></span></span></span></span></span></span></span></span></span> aus dem letzten Schritt zum Akkumulator <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">a</span></span></span></span></span> und multipliziere mit <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mtext>clamped r</mtext></mrow><annotation encoding="application/x-tex">\text{clamped r}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">clamped r</span></span></span></span></span></span></p></li><li><p>Aktualisiere den Akkumulator mit dem Ergebnis <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi><mi>o</mi><mi>d</mi><mi>u</mi><mi>l</mi><mi>o</mi><mi>P</mi></mrow><annotation encoding="application/x-tex">modulo P</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord mathnormal">m</span><span class="mord mathnormal">o</span><span class="mord mathnormal">d</span><span class="mord mathnormal">u</span><span class="mord mathnormal" style="margin-right:0.0197em;">l</span><span class="mord mathnormal">o</span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span></span></span></span></span> mit <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>P</mi><mo>=</mo><msup><mn>2</mn><mn>130</mn></msup><mo>−</mo><mn>5</mn></mrow><annotation encoding="application/x-tex">P = 2^{130} - 5</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8974em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">130</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">5</span></span></span></span></span>:
<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi><mo>=</mo><mo stretchy="false">(</mo><mo stretchy="false">(</mo><mi>a</mi><mo>+</mo><msup><mi>n</mi><mo mathvariant="normal" lspace="0em" rspace="0em">′</mo></msup><mo stretchy="false">)</mo><mo>×</mo><mtext>clamped r</mtext><mo stretchy="false">)</mo><mtext> </mtext><mo lspace="0.22em" rspace="0.22em"><mrow><mi mathvariant="normal">m</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">d</mi></mrow></mo><mtext> </mtext><mi>P</mi></mrow><annotation encoding="application/x-tex">a = ((a + n&#x27;) \times \text{clamped r})\bmod P</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">((</span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1.0019em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal">n</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7519em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">′</span></span></span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">clamped r</span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.0556em;"></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin"><span class="mord"><span class="mord mathrm">mod</span></span></span><span class="mspace" style="margin-right:0.0556em;"></span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span></span></span></span></span></p></li></ul></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code text literal-block"><code>0000  43 72 79 70 74 6f 67 72 61 70 68 69 63 20 46 6f  Cryptographic Fo

n copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1">octet_string <span class="operator">=</span> <span class="literal string">"21 9a d2 4f 89 d3"</span>
</code><small class="ln">2</small><code data-lineno="2">r <span class="operator">=</span> <span class="name builtin">hex</span><span class="punctuation">(</span><span class="name builtin">int</span><span class="punctuation">.</span>from_bytes<span class="punctuation">(</span><span class="name builtin">bytes</span><span class="punctuation">.</span>fromhex<span class="punctuation">(</span>octet_string<span class="punctuation">.</span>replace<span class="punctuation">(</span><span class="literal string">" "</span><span class="punctuation">,</span><span class="literal string">""</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">,</span><span class="literal string">"little"</span><span class="punctuation">)</span><span class="punctuation">)</span></code></pre><p>Um eine Zahl (z. B. <code class="python">t</code>) in Little-endian Hexdarstellung umzuwandeln, kann folgender Code verwendet werden:</p><pre class="code python copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">from</span> binascii <span class="keyword">import</span> hexlify
</code><small class="ln">2</small><code data-lineno="2">
</code><small class="ln">3</small><code data-lineno="3">t <span class="operator">=</span> <span class="literal number integer">0x2a927010caf8b2bc2c6365130c11d06a8</span>
</code><small class="ln">4</small><code data-lineno="4">hexlify<span class="punctuation">(</span>t<span class="punctuation">.</span>to_bytes<span class="punctuation">(</span><span class="literal number integer">17</span><span class="punctuation">,</span>byteorder<span class="operator">=</span><span class="literal string">"little"</span><span class="punctuation">)</span><span class="punctuation">[</span><span class="literal number integer">0</span><span class="punctuation">:</span><span class="literal number integer">16</span><span class="punctuation">]</span><span class="punctuation">)</span></code></pre></ld-supplemental></ld-topic>
<ld-topic class="summary" id="zusammenfassung"><h2>Zusammenfassung</h2><ul class="incremental-list"><li><p>Ein Hashwert dient der Integritätssicherung von Nachrichten.</p></li><li><p>Ein Mac dient der Authentifizierung von Nachrichten.</p></li><li><p>Ein Mac sichert auch immer die Integrität der Nachricht.</p><p><span class="peripheral">Es ist somit möglich die Integrität einer Nachricht zu sichern ohne Authentizität zu gewährleisten, aber nicht umgekehrt.</span></p></li><li><p>Ein Mac erlaubt es dem Empfänger eine gefälschte Nachricht zu erkennen aber ggf. auch zu erstellen (<span class="eng">to forge a message</span>).</p></li><li><p>Eine Signatur basiert auf einem Hashwert und einem <em>privaten</em> Schlüssel.</p><ul class="simple"><li><p>Der Empfänger kann bei einer signierten Nachricht, diese nicht verändern und als eine Nachricht des Senders ausgeben.</p></li><li><p>Nur für Nachrichten, die signiert sind, gilt somit die Nichtabstreitbarkeit (<span class="eng">non-repudation</span>).</p></li></ul></li></ul></ld-topic>
