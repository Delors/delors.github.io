@layer ld-svg {

    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,

        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies

    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,

    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a

}

<ld-topic class="exercises p-no-page-break" id="aufgabe-median-bestimmen-niveau-sehr-einfach"><h2>Aufgabe: Median bestimmen (Niveau: sehr einfach)</h2><p>Sie haben ein <em>sortiertes</em> Array von Double-Werten. Schreiben Sie eine Methode, die den Median des Arrays bestimmt.</p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Sollte die Anzahl der Werte gerade sein, so ist der Median der Durchschnitt der beiden mittleren Werte, ansonsten ist es der mittlere Wert.</p></aside></ld-topic>
<ld-topic class="exercises p-no-page-break" id="aufgabe-zwei-arrays-komponentenweise-aufsummieren-niveau-einfach"><h2>Aufgabe: Zwei Arrays komponentenweise aufsummieren (Niveau: einfach)</h2><p>Gegeben sind zwei Arrays von ganzen Zahlen (Typ <code class="java"><span class="keyword">long</span></code>). Schreiben Sie eine Methode (<code class="java">sumArrays</code>), die die beiden Arrays komponentenweise aufsummiert und das Ergebnis in einem neuen Array zurückgibt. Das Ergebnis-Array hat die Länge des kürzeren der beiden Arrays.</p></ld-topic>
<ld-topic class="exercises p-no-page-break" id="aufgabe-naive-textsuche-niveau-mittel"><h2>Aufgabe: Naive Textsuche (Niveau: mittel)</h2><p>Gegeben seien ein Array von Zeichen (<code class="java">text</code>) und ein Array von Zeichen (<code class="java">zuSuchen</code>),
die im Text(-Array) gesucht werden sollen. Zurückgegeben werden soll die
Startposition des zu suchenden Textes im Text(-Array) oder -1, wenn
der Text nicht vorkommt.</p><p>Schreiben Sie eine entsprechende Methode <code class="java"><span class="name function">suche</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code>.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java literal-block"><code><span class="keyword">char</span> text<span class="punctuation">[</span><span class="punctuation">]</span> <span class="operator">=</span> <span class="punctuation">{</span><span class="literal string char">'a'</span><span class="punctuation">,</span><span class="literal string char">'b'</span><span class="punctuation">,</span><span class="literal string char">'c'</span><span class="punctuation">,</span><span class="literal string char">'d'</span><span class="punctuation">,</span><span class="literal string char">'e'</span><span class="punctuation">,</span><span class="literal string char">'f'</span><span class="punctuation">,</span><span class="literal string char">'g'</span><span class="punctuation">,</span><span class="literal string char">'h'</span><span class="punctuation">,</span><span class="literal string char">'i'</span><span class="punctuation">,</span><span class="literal string char">'j'</span><span class="punctuation">,</span><span class="literal string char">'k'</span><span class="punctuation">,</span><span class="literal string char">'l'</span><span class="punctuation">,</span><span class="literal string char">'m'</span><span class="punctuation">,</span><span class="literal string char">'n'</span><span class="punctuation">,</span><span class="literal string char">'o'</span><span class="punctuation">,</span><span class="literal string char">'p'</span><span class="punctuation">}</span><span class="punctuation">;</span>
<span class="keyword">char</span> zuSuchen<span class="punctuation">[</span><span class="punctuation">]</span> <span class="operator">=</span> <span class="punctuation">{</span><span class="literal string char">'i'</span><span class="punctuation">,</span><span class="literal string char">'j'</span><span class="punctuation">,</span><span class="literal string char">'k'</span><span class="punctuation">,</span><span class="literal string char">'l'</span><span class="punctuation">}</span><span class="punctuation">;</span>

<span class="name constant">IO</span><span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="name function">suche</span><span class="punctuation">(</span>text<span class="punctuation">,</span> zuSuchen<span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// =&gt; 8</span></code></pre></aside></ld-topic>
<ld-topic class="exercises p-no-page-break" id="aufgabe-fullen-von-flachen-niveau-mittel-bis-hoch"><h2>Aufgabe: Füllen von Flächen (Niveau: mittel bis hoch)</h2><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Diese Aufgabe kann erst durchgeführt werden, nachdem wir auch über Klassen und Objekte gesprochen haben.</p></aside><p>Gegeben sei ein zweidimensionales Array von Farbwerten (Instanzen der Klasse <span class="docutils literal">Color</span>).</p><p>z. B. <code class="java"><span class="name class">Color</span><span class="punctuation">[</span><span class="punctuation">]</span><span class="punctuation">[</span><span class="punctuation">]</span> colors <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Color</span><span class="punctuation">[</span><span class="literal number integer">10</span><span class="punctuation">]</span><span class="punctuation">[</span><span class="literal number integer">10</span><span class="punctuation">]</span><span class="punctuation">;</span></code></p><p>Die Klasse <span class="docutils literal">Color</span> implementiert die Methode <code class="java"><span class="keyword">boolean</span> <span class="name function">equals</span><span class="punctuation">(</span><span class="name class">Object</span> o<span class="punctuation">)</span></code>, die zwei Farben auf Gleichheit überprüft. Legen Sie eine entsprechende Klasse an oder nutzen Sie eine vorhandene Implementierung (z. B. <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>awt<span class="punctuation">.</span></span>Color</span></code>).</p><p>Schreiben Sie eine Methode, die – gegeben eine bestimmte Position <span class="docutils literal">(x,y)</span> und eine Farbe <span class="docutils literal">c</span> –
das Feld selbst und auch alle benachbarten Felder, die die gleiche Farbe haben wie das ursprüngliche Feld, mit der Farbe <span class="docutils literal">c</span> füllt. Ein Feld
ist benachbart, wenn es sich in der gleichen Zeile oder Spalte befindet und eine Kante teilt.</p><ld-supplemental><p>Stellen Sie sich die folgenden Fragen:</p><ul class="simple"><li><p>Funktioniert Ihre Implementierung auch dann, wenn die Arrays in der zweiten Dimension unterschiedlich lang sind?</p></li><li><p>Wie verhält sich Ihre Implementierung, wenn die Farbe an der Position <span class="docutils literal">(x,y)</span> bereits die Farbe <span class="docutils literal">c</span> hat?</p></li><li><p>Dokumentieren Sie Ihre Implementierung. Achten Sie bei der Dokumentation darauf, die Sonderfälle zu berücksichtigen.</p></li></ul><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Es bietet sich an, eine rekursive Methode (<code class="java">fill</code>) zu implementieren.</p></aside></ld-supplemental></ld-topic>
<ld-topic class="exercises p-no-page-break" id="aufgabe-4-gewinnt-niveau-hoch"><h2>Aufgabe: 4-Gewinnt (Niveau: hoch)</h2><ld-scrollable><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1"><h3>Grundlagen</h3><p>Entwickeln Sie (im ersten Schritt) eine Implementierung von 4-Gewinnt, die die Konsole nutzt und es Ihnen ermöglicht, gegen eine zweite Person am Rechner zu spielen.</p><p><strong>Ziele</strong></p><p>Ziel dieser Aufgabe ist es, den Umgang mit Arrays weiter zu vertiefen. Darüber hinaus ist diese Aufgabe eine sehr gute Übung im Hinblick auf die Dekomposition eines Problems in kleinere und einfachere Teilprobleme.</p><p>Überlegen Sie sich im ersten Schritt, welche Datenstrukturen sich am besten eignen.</p><p>Im zweiten Schritt sollten Sie als Erstes eine Methode entwickeln, die das Spielbrett ausgibt – am besten mit Rahmenzeichen wie im folgenden Beispiel. Das erleichtert das Debugging erheblich.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel: Zeichen, um ein Spielbrett auf der Konsole zu zeichnen</span></p><pre class="code console line-height-100 copy-to-clipboard literal-block"><code>┌─┬─┐
│ │╳│
├─┼─┤
│●│╳│
└─┴─┘</code></pre></aside><h3>Erweiterung</h3><p>Erweitern Sie Ihr Spiel so, dass es möglich ist, gegen den Computer zu spielen. Gehen Sie auch hier systematisch vor. Bauen Sie als Erstes den Code so um, dass man prinzipiell gegen den Computer spielen kann – zunächst gegen einen Computer, der einfach einen zufälligen, gültigen Zug macht (<code class="java"><span class="name class">Math</span><span class="punctuation">.</span><span class="name function">random</span><span class="punctuation">(</span><span class="punctuation">)</span></code> kann dafür verwendet werden). Bauen Sie diesen Computergegner dann schrittweise aus. Zum Beispiel könnte er als Nächstes einen Gewinnzug immer machen, wenn es einen gibt. Danach könnte er zusätzlich versuchen, Züge zu vermeiden, nach denen der Gegner unmittelbar gewinnen kann. <em>Eine tiefergehende Spiellogik sollten Sie nicht implementieren: Dafür setzt man besser passende Algorithmen ein, und das Thema „Dekomposition von Problemen“ – auch unter dem Schlagwort „Teile und herrsche“ bekannt – sowie die Verwendung von Arrays haben Sie bis dahin ausreichend geübt. Die Implementierung eines starken Computergegners ist erst Thema des nächsten Semesters!</em></p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Diese Aufgabe kann von fortgeschrittenen Konzepten wie Enums oder Funktionen höherer Ordnung profitieren; eine Umsetzung mit den Mitteln, die Sie bereits kennengelernt haben, ist aber problemlos möglich. Es ist eine gute Übung, später zu dieser Aufgabe zurückzukommen und zu versuchen, den Code zu verbessern!</p></aside><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:dpXzRxD76OX5wo2SPfC+HejvRwDvMOKj+t4vftzjl/k=:BNPR/mfYU0/VRyeK:veTeW04Phbsj/seJR+lyYFnhkPj0hbYIFFIR6OqQrQsh2Q2azz1+QCohAmo5cJxww/qxpFHHurWwaWJ1aJX/B0ttVgJDllNuJh//Q4XWXa+Qa6gCD6yJCXMOs/t3WJVbrL1fhK7B3r76rzvLfnJ/gJVzSBWTYypYRA16a+udw7wcazYZ3TNUO7KKS8pwaGb3RuFM4ECADe6umI1p4CsBf7wMCWNnfqhqAIgyj
