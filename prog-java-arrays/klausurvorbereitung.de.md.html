<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic class="exercises" id="aufgabe-median-bestimmen-niveau-sehr-einfach"><h2>Aufgabe: Median bestimmen (Niveau: sehr einfach)</h2><p>Sie haben ein <em>sortiertes</em> Array von Double-Werten. Schreiben Sie eine Methode, die den Median des Arrays bestimmt.</p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Sollte die Anzahl der Werte gerade sein, so ist der Median der Durchschnitt der beiden mittleren Werte, ansonsten ist es der mittlere Wert.</p></aside></ld-topic>
<ld-topic class="exercises" id="aufgabe-zwei-arrays-komponentenweise-aufsummieren-niveau-einfach"><h2>Aufgabe: Zwei Arrays Komponentenweise aufsummieren (Niveau: einfach)</h2><p>Gegeben sind zwei Arrays von ganzen Zahlen (Typ <code class="java"><span class="keyword">long</span></code>). Schreiben Sie eine Methode (<code class="java">sumArrays</code>), die die beiden Arrays komponentenweise aufsummiert und das Ergebnis in einem neuen Array zurückgibt. Das Ergebnis-Array hat die Länge des kürzeren der beiden Arrays.</p></ld-topic>
<ld-topic class="exercises" id="aufgabe-naive-textsuche-niveau-mittel"><h2>Aufgabe: Naive Textsuche (Niveau: mittel)</h2><p>Gegeben sei ein Array von Zeichen (<code class="java">text</code>) und ein Array von Zeichen (<code class="java">zuSuchen</code>),
die im Text(-Array) gesucht werden sollen. Zurückgegeben werden soll die
Startposition des zu suchenden Textes im Text (Arrays) oder -1, wenn
der Text nicht vorkommt.</p><p>Schreiben Sie eine entsprechende Methode <code class="java"><span class="name function">suche</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code>.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java literal-block"><code><span class="keyword">char</span> text<span class="punctuation">[</span><span class="punctuation">]</span> <span class="operator">=</span> <span class="punctuation">{</span><span class="literal string char">'a'</span><span class="punctuation">,</span><span class="literal string char">'b'</span><span class="punctuation">,</span><span class="literal string char">'c'</span><span class="punctuation">,</span><span class="literal string char">'d'</span><span class="punctuation">,</span><span class="literal string char">'e'</span><span class="punctuation">,</span><span class="literal string char">'f'</span><span class="punctuation">,</span><span class="literal string char">'g'</span><span class="punctuation">,</span><span class="literal string char">'h'</span><span class="punctuation">,</span><span class="literal string char">'i'</span><span class="punctuation">,</span><span class="literal string char">'j'</span><span class="punctuation">,</span><span class="literal string char">'k'</span><span class="punctuation">,</span><span class="literal string char">'l'</span><span class="punctuation">,</span><span class="literal string char">'m'</span><span class="punctuation">,</span><span class="literal string char">'n'</span><span class="punctuation">,</span><span class="literal string char">'o'</span><span class="punctuation">,</span><span class="literal string char">'p'</span><span class="punctuation">}</span><span class="punctuation">;</span>
<span class="keyword">char</span> zuSuchen<span class="punctuation">[</span><span class="punctuation">]</span> <span class="operator">=</span> <span class="punctuation">{</span><span class="literal string char">'i'</span><span class="punctuation">,</span><span class="literal string char">'j'</span><span class="punctuation">,</span><span class="literal string char">'k'</span><span class="punctuation">,</span><span class="literal string char">'l'</span><span class="punctuation">}</span><span class="punctuation">;</span>

<span class="name constant">IO</span><span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="name function">suche</span><span class="punctuation">(</span>text<span class="punctuation">,</span> zuSuchen<span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// =&gt; 8</span></code></pre></aside></ld-topic>
<ld-topic class="exercises" id="aufgabe-fullen-von-flachen-niveau-mittel-bis-hoch"><h2>Aufgabe: Füllen von Flächen (Niveau: mittel bis hoch)</h2><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Diese  Aufgabe kann erst durchgeführt werden nachdem wir auch über Klassen und Objekte gesprochen haben.</p></aside><p>Gegeben sei ein zwei-dimensionales Array von Farbwerten (Instanzen der Klasse <span class="docutils literal">Color</span>).</p><p>z. B. <code class="java"><span class="name class">Color</span><span class="punctuation">[</span><span class="punctuation">]</span><span class="punctuation">[</span><span class="punctuation">]</span> colors <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Color</span><span class="punctuation">[</span><span class="literal number integer">10</span><span class="punctuation">]</span><span class="punctuation">[</span><span class="literal number integer">10</span><span class="punctuation">]</span><span class="punctuation">;</span></code></p><p>Die Klasse Color implementiert die Methode <code class="java"><span class="keyword">boolean</span> <span class="name function">equals</span><span class="punctuation">(</span><span class="name class">Object</span> o<span class="punctuation">)</span></code>, die zwei Farben auf Gleichheit überprüft. Legen Sie eine entsprechende Klasse an oder nutzen Sie eine vorhandene Implementierung (z. B. <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>awt<span class="punctuation">.</span></span>Color</span></code>).</p><p>Schreiben Sie eine Methode, die – gegeben eine bestimmte Position <span class="docutils literal">(x,y)</span> und eine Farbe <span class="docutils literal">c</span> –
das Feld selber und auch alle benachbarten Felder, die die gleiche Farbe haben wie das ursprüngliche Feld, mit der Farbe <span class="docutils literal">c</span> füllt. Ein Feld
ist benachbart, wenn es sich in der gleichen Zeile oder Spalte befindet und eine Kante teilt.</p><ld-supplemental><p>Stellen Sie sich die folgenden Fragen:</p><ul class="simple"><li><p>Funktioniert Ihre Implementierung auch dann, wenn die Arrays in der zweiten Dimension unterschiedlich lang sind?</p></li><li><p>Wie verhält sich Ihre Implementierung, wenn die Farbe an der Position <span class="docutils literal">(x,y)</span> bereits die Farbe <span class="docutils literal">c</span> hat?</p></li><li><p>Dokumentieren Sie Ihre Implementierung. Achten Sie bei der Dokumentation darauf die Sonderfälle zu berücksichtigen.</p></li></ul><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Es bietet sich ggf. an eine rekursive Methode (fill) zu implementieren.</p></aside></ld-supplemental></ld-topic>
