ass="punctuation">.</span>java</code> enden darf. Denken Sie auch daran, dass das Skript ausführbar sein muss (z. B. Rechte 755).</p><p>Alternativ schreiben Sie eine Java Datei mit der entsprechenden Logik und führen Sie diese mit <code class="java">java</code> aus.</p></aside><aside class="admonition" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>Die <em>erste Zeile</em> eines <em>echten</em> Java-Skripts:</p><pre class="code java literal-block"><code>#<span class="operator">!</span><span class="operator">/</span>usr<span class="operator">/</span>bin<span class="operator">/</span>env java <span class="operator">--</span>source <span class="literal number integer">25</span> <span class="operator">-</span>ea</code></pre></aside></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-move-to-top" id="varargs-methoden"><h2>Varargs-Methoden</h2></ld-topic>
<ld-topic id="methoden-mit-einer-variablen-anzahl-von-parametern-varargs"><h2>Methoden mit einer variablen Anzahl von Parametern (<code class="java">varargs</code>)</h2><ld-deck><ld-card><p class="rubric">Beispiel</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">void</span> <span class="name function">printAll</span><span class="punctuation">(</span><span class="name class">String</span> separator<span class="punctuation">,</span> <span class="name class">String</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> strings<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">for</span> <span class="punctuation">(</span><span class="keyword">int</span> i <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span> i <span class="operator">&lt;</span> strings<span class="punctuation">.</span>length<span class="punctuation">;</span> i<span class="operator">++</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">        <span class="name function">print</span><span class="punctuation">(</span>strings<span class="punctuation">[</span>i<span class="punctuation">]</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">        <span class="keyword">if</span> <span class="punctuation">(</span>i <span class="operator">&lt;</span> strings<span class="punctuation">.</span>length <span class="operator">-</span> <span class="literal number integer">1</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">            <span class="name function">print</span><span class="punctuation">(</span>separator<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="punctuation">}</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="punctuation">}</span>
</code><small class="ln"> 8</small><code data-lineno=" 8"><span class="punctuation">}</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">
</code><small class="ln">10</small><code data-lineno="10"><span class="name function">printAll</span><span class="punctuation">(</span><span class="literal string">" + "</span><span class="punctuation">,</span> <span class="literal string">"2"</span><span class="punctuation">,</span> <span class="literal string">"2"</span><span class="punctuation">,</span> <span class="literal string">"3"</span><span class="punctuation">)</span>
</code><small class="ln">11</small><code data-lineno="11"><span class="comment single">// ==&gt; 2 + 2 + 3</span></code></pre></ld-card><ld-card class="incremental"><ul><li><p>Pro Methode kann es nur einen <em>varargs</em> Parameter geben und dies muss der letzte Parameter sein.</p><dl class="field-list simple"><dt>Syntax für den letzten Methodenparameter<span class="colon">:</span></dt><dd><p><code class="java"><span class="punctuation">&lt;</span><span class="name class">Typ</span><span class="punctuation">&gt;</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">&lt;</span><span class="name class">Bezeichner</span><span class="punctuation">&gt;</span></code></p></dd></dl></li></ul><ul class="incremental list-with-explanations"><li><p>Der Compiler erzeugt ein Array, das die übergebenen Parameter enthält.</p><p><em>Best Practice: das varargs-Array sollte die Methode nicht verlassen</em>.</p></li></ul></ld-card><ld-card class="incremental"><ul><li><p>Die Methode verhält sich wie eine Methode mit einem Array als Parameter.</p><div class="incremental"><blockquote><p>⇒ <span class="peripheral">D. h. die Methoden können auch mit einem Array aufgerufen werden und sind bezüglich der Signatur nicht unterscheidbar. Demzufolge ist es auch nicht möglich zwei entsprechende Methoden zu definieren:</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">double</span> <span class="name function">sum</span><span class="punctuation">(</span><span class="keyword">double</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> values<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span></code></pre><pre class="code java obsolete literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">double</span> <span class="name function">sum</span><span class="punctuation">(</span><span class="keyword">double</span><span class="punctuation">[</span><span class="punctuation">]</span> values<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span> <span class="comment single">// nicht möglich</span></code></pre></blockquote><div class="incremental"><p>⇒ Die Methode kann mit <code class="java"><span class="keyword">null</span></code> als Wert aufgerufen werden. In diesem Fall wird kein Array erzeugt sondern <code class="java"><span class="keyword">null</span></code> übergeben.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name constant">IO</span><span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="name function">sum</span><span class="punctuation">(</span><span class="keyword">null</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// ==&gt; ???</span></code></pre></div></div></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic class="exercises transition-move-left" id="ubung-7"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-8" data-exercise-id="8" data-exercise-title="8 - varargs"><p class="ld-exercise-title rubric"><span>varargs</span></p><p>Schreiben Sie eine Methode <code class="java">join</code>, die eine beliebige Anzahl von <code class="java"><span class="keyword">int</span></code> Arrays (<code class="java"><span class="keyword">int</span><span class="punctuation">[</span><span class="punctuation">]</span></code>) entgegennimmt und daraus ein Array erzeugt.</p><p>Dokumentieren Sie die Methode ausführlich. Achten Sie darauf, alle Sonderfälle abzudecken.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1">jshell<span class="operator">&gt;</span> <span class="keyword">var</span> r <span class="operator">=</span> <span class="name function">join</span><span class="punctuation">(</span><span class="keyword">new</span> <span class="keyword">int</span><span class="punctuation">[</span><span class="punctuation">]</span><span class="punctuation">{</span><span class="literal number integer">1</span><span class="punctuation">,</span><span class="literal number integer">2</span><span class="punctuation">}</span><span class="punctuation">,</span> <span class="keyword">new</span> <span class="keyword">int</span><span class="punctuation">[</span><span class="punctuation">]</span><span class="punctuation">{</span><span class="literal number integer">3</span><span class="punctuation">,</span><span class="literal number integer">4</span><span class="punctuation">}</span><span class="punctuation">)</span>
</code><small class="ln">2</small><code data-lineno="2">r <span class="operator">==</span><span class="operator">&gt;</span> <span class="keyword">int</span><span class="punctuation">[</span><span class="literal number integer">4</span><span class="punctuation">]</span> <span class="punctuation">{</span> <span class="literal number integer">1</span><span class="punctuation">,</span> <span class="literal number integer">2</span><span class="punctuation">,</span> <span class="literal number integer">3</span><span class="punctuation">,</span> <span class="literal number integer">4</span> <span class="punctuation">}</span>
