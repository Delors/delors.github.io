</code><small class="ln">17</small><code data-lineno="17">                lower <span class="operator">:=</span> max<span class="punctuation">(</span>pos<span class="punctuation">,</span> lower<span class="operator">+</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">,</span> vL <span class="operator">:=</span> A<span class="punctuation">[</span>lower<span class="punctuation">]</span>
</code><small class="ln">18</small><code data-lineno="18">        <span class="keyword">else</span>    upper <span class="operator">:=</span> min<span class="punctuation">(</span>pos<span class="punctuation">,</span> upper<span class="operator">-</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">,</span> vU <span class="operator">:=</span> A<span class="punctuation">[</span>upper<span class="punctuation">]</span>
</code><small class="ln">19</small><code data-lineno="19">    return <span class="keyword">nil</span></code></pre><ld-supplemental embed-in-document-flow=""><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Die Korrektur von <code class="java">pos</code> in Zeile 11 (<code class="java">pos <span class="operator">:</span><span class="operator">=</span> <span class="name function">max</span><span class="punctuation">(</span>lower <span class="operator">+</span> <span class="literal number integer">1</span><span class="punctuation">,</span> <span class="name function">min</span><span class="punctuation">(</span>upper <span class="operator">-</span> <span class="literal number integer">1</span><span class="punctuation">,</span> pos<span class="punctuation">)</span><span class="punctuation">)</span></code>) stellt sicher, dass <code class="java">pos</code> immer zwischen <code class="java">lower</code> und <code class="java">upper</code> liegt. Dies ist insbesondere deswegen notwendig, weil die Interpolation nicht immer exakt ist. Stellen Sie sich zum Beispiel vor, dass die Daten polynomiell skaliert sind und sie (in Unkenntnis der echten Verteilung) die lineare Interpolationssuche verwenden. In diesem Fall kann es zu folgender Situation kommen:</p><p>Die Werte im Array seien: [0, 4, 16, 36, 64, 100, 144, 196] (zu Grunde liegt die Funktion <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>4</mn><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">4x^2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8141em;"></span><span class="mord">4</span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span></span>) und Sie suchen nach dem Wert 194.</p><p>Im ersten Schritt würde die lineare Interpolationssuche den Wert 194 auf Position 7 schätzen, was nutzlos wäre, aber erst einmal kein Problem verursachen würde. Da der Wert 194 aber nicht im Array enthalten ist, würde die Suche den Wert für die obere Grenze um eins korrigieren. Jetzt würde die lineare Interpolation aber mit den Werten des Arrays an Stelle 0 und 6 erfolgen (A[0]  = 0 und A[6] = 144). Das Ergebnis wäre die 2. Funktion (blau) und der Wert 194 würde auf Position 8 geschätzt, was außerhalb des Arrays liegt.</p><object class="light-image align-center" data="images/lagrange/expo-index_error_case.svg" type="image/svg+xml" role="img" width="1500px"></object><p>Folgen die Werte im Array einer logarithmisch Verteilung, dann würde die umgekehrte Situation eintreten, d. h. es könnte am unteren Ende des Arrays zu einem ähnlichen Problem kommen, da dann die Werte oberhalb der geraden liegen würden.</p><p>Wenn der berechnete Index außerhalb des Bereichs ist, dann kann der Algorithmus auch einfach <span class="docutils literal">nil</span> zurückgeben, da der Wert dann nicht im Array enthalten ist.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="exponentielle-suche-im-sortierten-unbeschrankten-array"><h2>Exponentielle Suche im sortierten (unbeschränkten) <em>Array</em></h2><pre class="code pascal copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="comment single">// A        zu durchsuchendes, 1-indiziertes, aufsteigend sortiertes Array</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="comment single">// needle   der Wert, der gesucht wird</span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">function</span> ExponentialSearch<span class="punctuation">(</span>A<span class="punctuation">,</span>needle<span class="punctuation">)</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    i <span class="operator">:=</span> <span class="literal number integer">1</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="keyword">while</span> i <span class="operator">&lt;=</span> length<span class="punctuation">(</span>A<span class="punctuation">)</span> <span class="operator">and</span> A<span class="punctuation">[</span>i<span class="punctuation">]</span> <span class="operator">&lt;</span> needle <span class="keyword">do</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        i <span class="operator">:=</span> i <span class="operator">*</span> <span class="literal number integer">2</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    return BinarySearch<span class="punctuation">(</span>A<span class="punctuation">,</span> floor<span class="punctuation">(</span>i<span class="operator">/</span><span class="literal number integer">2</span><span class="punctuation">)</span> <span class="operator">+</span> <span class="literal number integer">1</span><span class="punctuation">,</span> min<span class="punctuation">(</span>i<span class="punctuation">,</span> length<span class="punctuation">(</span>A<span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">,</span> needle<span class="punctuation">)</span></code></pre><ld-supplemental><p>Die Idee ist erst mit einer exponentiellen Schrittweite zu springen, um dann mit einer binären Suche den Wert zu finden. Die Laufzeit ist <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\log(i))</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mopen">(</span><span class="mord mathnormal">i</span><span class="mclose">))</span></span></span></span></span> wobei <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span></span></span></span></span> die Position des gesuchten Wertes ist. Die Laufzeit ist also <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>log</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\log(n))</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mclose">))</span></span></span></span></span>.</p></ld-supplemental></ld-topic>
<ld-topic class="exercises" id="ubung-1"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-3" data-exercise-id="3" data-exercise-title="3 - Wer sucht, der findet 5?"><p class="ld-exercise-title rubric"><span>Wer sucht, der findet 5?</span></p><p>Folgende Werte sind vom Array A bekannt:</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi><mo stretchy="false">[</mo><mn>1</mn><mo stretchy="false">]</mo><mo>=</mo><mo>−</mo><mn>27</mn><mo separator="true">,</mo><mtext>  </mtext><mi>A</mi><mo stretchy="false">[</mo><mn>15</mn><mo stretchy="false">]</mo><mo>=</mo><mn>13</mn><mo separator="true">,</mo><mtext>  </mtext><mi>A</mi><mo stretchy="false">[</mo><mn>29</mn><mo stretchy="false">]</mo><mo>=</mo><mn>29</mn></mrow><annotation encoding="application/x-tex">A[1] = -27,\; A[15] = 13,\; A[29] = 29</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">A</span><span class="mopen">[</span><span class="mord">1</span><span class="mclose">]</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">−</span><span class="mord">27</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">A</span><span class="mopen">[</span><span class="mord">15</span><span class="mclose">]</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">13</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">A</span><span class="mopen">[</span><span class="mord">29</span><span class="mclose">]</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">29</span></span></span></span></span></p><p>Gesucht wird der potentielle Index des Wertes <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>5</mn></mrow><annotation encoding="application/x-tex">5</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">5</span></span></span></span></span>. Welcher Index <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>i</mi></mrow><annotation encoding="application/x-tex">i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6595em;"></span><span class="mord mathnormal">i</span></span></span></span></span> sollte als nächstes untersucht werden bei binärer, linearer oder quadratisch interpolierender Suche?</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:jH+yAVnQ/CXUa0ISkzb07aBijGIe4BzcxvQUI+hxxlg=:YvN0fXRbpxcXX6ih:5FeLQbP37qgzY/sJ6BxgoA6LrQYK4dJXOWz0VVE68pg65COwvsFYWlNCmavbZ1CJZyXH5cxLWEApuiNzb4a1P0StMgxb3ZepXNkbf9xbSrVV/KMiEyi/HP+IickATbzeQqYA1qucXmkRk/s3qY/QbRZvh8bNy9rB5Or1+Z8EbVrb6tqV8lEVvPMuCFToO5hmF0oZSvsp+StCIOKB2LsmnUS+bmAHyz66sbk6W8azXIWRR <ld-topic class="exercises" id="ubung-2"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-5" data-exercise-id="5" data-exercise-title="5 - Lineare Interpolierende Suche"><p class="ld-exercise-title rubric"><span>Lineare Interpolierende Suche</span></p><p>Setzen Sie den Algorithmus für die lineare interpolierende Suche in einer Programmiersprache Ihrer Wahl um.</p><p>Testen Sie den Algorithmus mit folgenden Arrays:</p><pre class="code python copy-to-clipboard literal-block"><code>A <span class="operator">=</span> <span class="punctuation">[</span><span class="literal number integer">1</span><span class="punctuation">,</span> <span class="literal number integer">3</span><span class="punctuation">,</span> <span class="literal number integer">5</span><span class="punctuation">,</span> <span class="literal number integer">7</span><span class="punctuation">,</span> <span class="literal number integer">9</span><span class="punctuation">,</span> <span class="literal number integer">11</span><span class="punctuation">,</span> <span class="literal number integer">13</span><span class="punctuation">,</span> <span class="literal number integer">15</span><span class="punctuation">]</span>        <span class="comment single"># linear verteilt (2x-1)</span>

<ld-topic class="exercises" id="ubung-3"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-6" data-exercise-id="6" data-exercise-title="6 - Exponentiell Interpolierende Suche"><p class="ld-exercise-title rubric"><span>Exponentiell Interpolierende Suche</span></p><ol class="arabic"><li><p>Implementieren Sie den Algorithmus für die exponentiell interpolierende Suche in einer Programmiersprache Ihrer Wahl. (Ggf. müssen Sie noch die passende binäre Suche implementieren). Implementieren Sie die Suche basierend auf einer Funktion und nicht über einem Array. Die Funktion kann zum Beispiel eine mathematische Funktion sein, oder eine einfache Funktion die auf einem Array operiert.</p></li><li><p>Gegeben sei die folgende Funktion, die als Generator fungiert. (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">x</span></span></span></span></span> sei eine natürliche Zahl).</p><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mtext>round</mtext><mrow><mo fence="true">(</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>x</mi></mrow></msup></mrow></mfrac><mo>⋅</mo><mn>100</mn><mtext> </mtext><mn>000</mn><mtext> </mtext><mn>000</mn><mo fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">f(x) = \text{round}\left(\frac{1}{1+e^{-x}} \cdot 100\,000\,000 \right)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mopen">(</span><span class="mord mathnormal">x</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:2.4em;vertical-align:-0.95em;"></span><span class="mord text"><span class="mord">round</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="minner"><span class="mopen delimcenter" style="top:0em;"><span class="delimsizing size3">(</span></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3214em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord"><span class="mord mathnormal">e</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6973em;"><span style="top:-2.989em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mathnormal mtight">x</span></span></span></span></span></span></span></span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.7693em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord">100</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">000</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">000</span><span class="mclose delimcenter" style="top:0em;"><span class="delimsizing size3">)</span></span></span></span></span></span></span></div><p>Testen Sie ob <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>99999996</mn></mrow><annotation encoding="application/x-tex">99999996</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">99999996</span></span></span></span></span> ein Wert der Funktion ist und geben Sie den Index (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">x</span></span></span></span></span>) zurück.</p></li><li><p>Wann macht es Sinn die exponentiell interpolierende Suche zu verwenden?</p></li></ol><ld-supplemental><p class="rubric"><img class="icon" style="height:0.75em" src="/LectureDoc2/dist/ext/icons/duke.svg" alt="Java" /> Hinweise zur Implementierung</p><p>In Java kann die zu übergebene Funktion den Typ <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span>function<span class="punctuation">.</span></span>DoubleUnaryOperator</span></code> haben. Beim Aufruf kann man dann zum Beispiel eine entsprechende Lambda-Funktion angeben werden, die für einen double Wert einen anderen double Wert zurückgibt.</p><p>Es kann hilfreich sein alle statischen Methoden und Konstanten der <code class="java"><span class="name class">Math</span></code>-Klasse über einen static import zu verwenden.</p><p>Die exemplarische Verwendung ist wie folgt:</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">void</span> <span class="name function">main</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>

<ld-topic class="new-section transition-move-to-top" id="selbstanordnende-arrays"><h2>Selbstanordnende Arrays</h2></ld-topic>
<ld-topic id="suchen-auf-arrays-mit-spezieller-ordnung"><h2>Suchen auf Arrays mit spezieller Ordnung</h2><ul class="simple"><li><p>Sind die Daten nominal skaliert, oder sagt die Ordnung der Werte im Array nichts über die Zugriffshäufigkeit aus, so können Arrays auf Basis der Zugriffe sortiert werden.</p></li><li><p>Erfordert prinzipiell eine lineare Suche, die es gilt soweit möglich zu beschleunigen.</p></li></ul><ul class="incremental simple"><li><p>Anwendung(-sgebiete):</p><ul class="simple"><li><p>Cache-Zugriffe, Verwaltung von virtuellem Speicher</p></li><li><p>Wenn Werte häufiger verlangt werden als andere, so besitzen die Anfragen eine Wahrscheinlichkeitsverteilung.</p></li><li><p>Die Verteilung wird durch Abzählen angenähert, da sie nicht bekannt ist. Darauf basierend werden die Werte entsprechend sortiert.</p></li></ul></li></ul></ld-topic>
<ld-topic id="strategien-zur-anordnung"><h2>Strategien zur Anordnung</h2><ld-deck><ld-card><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: FC-Regel</span></p><p>Ein Array A ist gemäß <em>frequency count</em> (FC-Regel) sortiert, wenn für alle Werte gilt, dass <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi><mo stretchy="false">(</mo><mi>A</mi><mo stretchy="false">[</mo><mi>k</mi><mo stretchy="false">]</mo><mo stretchy="false">)</mo><mo>≥</mo><mi>c</mi><mo stretchy="false">(</mo><mi>A</mi><mo stretchy="false">[</mo><mi>j</mi><mo stretchy="false">]</mo><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">c(A[k]) \geq c(A[j])</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">c</span><span class="mopen">(</span><span class="mord mathnormal">A</span><span class="mopen">[</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mclose">])</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≥</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">c</span><span class="mopen">(</span><span class="mord mathnormal">A</span><span class="mopen">[</span><span class="mord mathnormal" style="margin-right:0.0572em;">j</span><span class="mclose">])</span></span></span></span></span> wenn <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi><mo>&lt;</mo><mi>j</mi></mrow><annotation encoding="application/x-tex">k &lt;j</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7335em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.854em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0572em;">j</span></span></span></span></span> und <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">c(x)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">c</span><span class="mopen">(</span><span class="mord mathnormal">x</span><span class="mclose">)</span></span></span></span></span> die realisierte Häufigkeit des Wertes <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">x</span></span></span></span></span> darstellt.</p></aside><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Es wird typischerweise lokal getauscht, um die Ordnung herzustellen.</p></aside></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: MF-Regel</span></p><p>Ein Array A ist gemäß <em>move to front</em> (MF-Regel) sortiert, wenn bei Auftritt eines Wertes <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi><mo stretchy="false">[</mo><mi>k</mi><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">A[k]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">A</span><span class="mopen">[</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mclose">]</span></span></span></span></span> in der Folge mit der ersten Position <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi><mo stretchy="false">[</mo><mn>1</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">A[1]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">A</span><span class="mopen">[</span><span class="mord">1</span><span class="mclose">]</span></span></span></span></span> oder <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi><mo stretchy="false">[</mo><mn>0</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">A[0]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">A</span><span class="mopen">[</span><span class="mord">0</span><span class="mclose">]</span></span></span></span></span> vertauscht wird, sollte der Wert noch nicht an der ersten Stelle stehen.</p></aside></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: T-Regel</span></p><p>Ein Array A ist gemäß <em>transpose</em> (T-Regel) sortiert, wenn bei Auftritt eines Wertes <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi><mo stretchy="false">[</mo><mi>k</mi><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">A[k]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">A</span><span class="mopen">[</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mclose">]</span></span></span></span></span> in der Folge mit der Position davor <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi><mo stretchy="false">[</mo><mi>k</mi><mo>−</mo><mn>1</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">A[k-1]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">A</span><span class="mopen">[</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">]</span></span></span></span></span> vertauscht wird, sollte der Wert noch nicht an der ersten Stelle stehen.</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="strategien-zur-anordnung-diskussion"><h2>Strategien zur Anordnung - Diskussion</h2><ul class="simple"><li><p>Die FC-Regel erfordert das Mitführen der Häufigkeit der Werte. Die MF-Regel und die T-Regel sind einfacher zu implementieren, da sie nur die Reihenfolge der Werte im Array verändern.</p></li><li><p>Für MF-Regel und T-Regel gibt es worst-case Aufrufsequenzen, die immer zu den schlechtesten Laufzeiten führen.</p></li><li><p>Die MF-Regel nimmt eher starke Änderungen vor und reagiert schnell.</p></li><li><p>Die T-Regel nimmt eher schwache Änderungen vor und ist stabiler.</p></li></ul><aside class="admonition incremental" data-theme="summary"><p class="admonition-title" data-theme="summary-header"><span>Zusammenfassung</span></p><p>Die Bewertung sollte an Hand der tatsächlichen Daten erfolgen:</p><ul class="simple"><li><p>Liegen Häufigkeitsinformationen vor, so ist die FC-Regel sinnvoll.</p></li><li><p>Die MF-Regel ist für sich ändernde Verteilungen sinnvoller, die T-Regel für stabilere Situationen.</p></li></ul></aside></ld-topic>

<ld-topic class="new-section transition-move-to-top" id="suche-nach-dem-n-ten-element"><h2>Suche nach dem n-ten Element</h2></ld-topic>
<ld-topic id="suche-nach-dem-n-ten-element-einfuhrung"><h2>Suche nach dem n-ten Element - Einführung</h2><ul class="incremental-list"><li><p>Ist das Array sortiert, so ist die Suche nach dem n-ten Element trivial und hat eine Laufzeit von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(1)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord">1</span><span class="mclose">)</span></span></span></span></span>.</p></li><li><p>Ist das Array nicht sortiert, so ist die Suche nach dem n-ten Element nicht trivial.</p><p>Wir unterscheiden:</p><ol class="arabic incremental-list simple"><li><p>wird das Array (im Folgenden) auch noch sortiert gebraucht, so ist es am effizientesten dieses erst zu sortieren, um dann das n-te Element auszulesen. Die Laufzeit beträgt dann - mit der Wahl eines geeigneten Sortierverfahrens - <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>n</mi><mi>log</mi><mo>⁡</mo><mi>n</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(n \log n)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">n</span><span class="mclose">)</span></span></span></span></span>.</p></li><li><p>Ist eine Sortierung nicht erforderlich/gewünscht, so können wir mit Hilfe von Teile-und-Herrsche-Verfahren das n-te Element auch effizienter bestimmen.</p></li></ol></li></ul></ld-topic>
<ld-topic id="suche-nach-dem-k-ten-element-mittels-quickselect"><h2>Suche nach dem k-ten Element mittels Quickselect</h2><pre class="code pascal literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="comment single">// A    ein 0-indiziertes Array</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="comment single">// k    das k-größte Element (0-indiziert)</span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">function</span> Quickselect<span class="punctuation">(</span>A<span class="punctuation">,</span>k<span class="punctuation">)</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="keyword">if</span> length<span class="punctuation">(</span>A<span class="punctuation">)</span> <span class="operator">=</span><span class="operator">=</span> <span class="literal number integer">1</span> <span class="keyword">then</span> return A<span class="punctuation">[</span><span class="literal number integer">0</span><span class="punctuation">]</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    pivot   <span class="operator">:=</span> A<span class="punctuation">[</span>length<span class="punctuation">(</span>A<span class="punctuation">)</span><span class="operator">-</span><span class="literal number integer">1</span><span class="punctuation">]</span> <span class="comment single">// ein bel. Element als Pivot (hier das letzte)</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    lows    <span class="operator">:=</span> <span class="punctuation">[</span><span class="punctuation">]</span>             <span class="comment single">// Elemente kleiner als Pivot</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    highs   <span class="operator">:=</span> <span class="punctuation">[</span><span class="punctuation">]</span>             <span class="comment single">// Elemente größer als Pivot</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    pivotsCount <span class="operator">:=</span> <span class="literal number integer">0</span>          <span class="comment single">// Anzahl der Pivot-Elemente</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="keyword">for</span> x <span class="operator">in</span> A <span class="keyword">do</span>             <span class="comment single">// Partitionierung ...</span>
</code><small class="ln">10</small><code data-lineno="10">        <span class="keyword">if</span> x <span class="operator">&lt;</span> pivot <span class="keyword">then</span> lows<span class="punctuation">.</span>append<span class="punctuation">(</span>x<span class="punctuation">)</span>
</code><small class="ln">11</small><code data-lineno="11">        <span class="keyword">else</span> <span class="keyword">if</span> x <span class="operator">&gt;</span> pivot <span class="keyword">then</span> highs<span class="punctuation">.</span>append<span class="punctuation">(</span>x<span class="punctuation">)</span>
</code><small class="ln">12</small><code data-lineno="12">        <span class="keyword">else</span> pivotsCount <span class="operator">:=</span> pivotsCount <span class="operator">+</span> <span class="literal number integer">1</span>
</code><small class="ln">13</small><code data-lineno="13">
</code><small class="ln">14</small><code data-lineno="14">    <span class="keyword">if</span> k <span class="operator">&lt;</span> length<span class="punctuation">(</span>lows<span class="punctuation">)</span> <span class="keyword">then</span>
</code><small class="ln">15</small><code data-lineno="15">        return Quickselect<span class="punctuation">(</span>lows<span class="punctuation">,</span> k<span class="punctuation">)</span>
</code><small class="ln">16</small><code data-lineno="16">    <span class="keyword">else</span> <span class="keyword">if</span> k <span class="operator">&lt;</span> length<span class="punctuation">(</span>lows<span class="punctuation">)</span> <span class="operator">+</span> pivotsCount <span class="keyword">then</span>
</code><small class="ln">17</small><code data-lineno="17">        return pivot          <span class="comment single">// das k-te Element ist ein Pivot-Element</span>
</code><small class="ln">18</small><code data-lineno="18">    <span class="keyword">else</span>
</code><small class="ln">19</small><code data-lineno="19">        return Quickselect<span class="punctuation">(</span>highs<span class="punctuation">,</span> k <span class="operator">-</span> length<span class="punctuation">(</span>lows<span class="punctuation">)</span> <span class="operator">-</span>  pivotsCount<span class="punctuation">)</span></code></pre><ld-supplemental><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>In einer realen Implementierung sollte das Pivot-Element zufällig gewählt werden, um - für den Fall, dass das Array sortiert ist - die Laufzeit zu verbessern.</p></aside><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Der Quickselect Algorithmus kann auch <em>in-place</em> implementiert werden, d. h. ohne zusätzlichen Speicherbedarf. Dies setzt voraus, das die ursprüngliche Reihenfolge der Elemente nicht erhalten bleiben muss.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="beispielanwendung-bestimmung-des-medians"><h2>Beispielanwendung: Bestimmung des Medians</h2><pre class="code pascal copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="comment single">// A    ein nicht sortiertes, 0-indiziertes Array</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">function</span> FindMedian<span class="punctuation">(</span>A<span class="punctuation">)</span>
</code><small class="ln">3</small><code data-lineno="3">    n <span class="operator">:=</span> length<span class="punctuation">(</span>A<span class="punctuation">)</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">if</span> n % <span class="literal number integer">2</span> <span class="operator">=</span><span class="operator">=</span> <span class="literal number integer">1</span> <span class="keyword">then</span> <span class="comment single">// d. h. wir haben eine ungerade Anzahl von Elementen in A</span>
</code><small class="ln">5</small><code data-lineno="5">        return Quickselect<span class="punctuation">(</span>A<span class="punctuation">,</span> floor<span class="punctuation">(</span>n <span class="operator">/</span> <span class="literal number integer">2</span><span class="punctuation">)</span><span class="punctuation">)</span>
</code><small class="ln">6</small><code data-lineno="6">    <span class="keyword">else</span> <span class="comment single">// gerade Anzahl von Elementen in A</span>
</code><small class="ln">7</small><code data-lineno="7">        left    <span class="operator">:=</span> Quickselect<span class="punctuation">(</span>A<span class="punctuation">,</span> floor<span class="punctuation">(</span>n <span class="operator">/</span> <span class="literal number integer">2</span><span class="punctuation">)</span> <span class="operator">-</span> <span class="literal number integer">1</span><span class="punctuation">)</span>
</code><small class="ln">8</small><code data-lineno="8">        right   <span class="operator">:=</span> Quickselect<span class="punctuation">(</span>A<span class="punctuation">,</span> floor<span class="punctuation">(</span>n <span class="operator">/</span> <span class="literal number integer">2</span><span class="punctuation">)</span><span class="punctuation">)</span>
</code><small class="ln">9</small><code data-lineno="9">        return <span class="punctuation">(</span>left <span class="operator">+</span> right<span class="punctuation">)</span> <span class="operator">/</span> <span class="literal number integer">2.0</span></code></pre></ld-topic>
