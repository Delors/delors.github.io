<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="allgemein-seminararbeiten"><h1 class="title">Vorträge: Hinweise und Bewertungskriterien</h1><dl class="docinfo"><dt class="dozent">Dozent<span class="colon">:</span></dt><dd class="dozent"><a class="reference external" href="../cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></dd><dt class="contact">Kontakt<span class="colon">:</span></dt><dd class="contact"><a class="reference external" href="mailto:michael.eichberg@dhbw.de">michael.eichberg@dhbw.de</a>
, Raum 149B</dd><dt class="version">Version<span class="colon">:</span></dt><dd class="version">2.4.0.1</dd></dl><ld-supplemental><dl class="field-list"><dt>Folien<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/allg-vortraege/folien.de.md.html">https://delors.github.io/allg-vortraege/folien.de.md.html</a></p><p><a class="reference external" href="https://delors.github.io/allg-vortraege/folien.de.md.html.pdf">https://delors.github.io/allg-vortraege/folien.de.md.html.pdf</a></p></dd><dt>Fehler melden<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://github.com/Delors/delors.github.io/issues">https://github.com/Delors/delors.github.io/issues</a></p></dd></dl><dl class="field-list simple"><dt>KI Verwendung<span class="colon">:</span></dt><dd><p>Bei der Erstellung der Unterlagen wurden KI Assistenten (insbesondere Claude
aber ggf. auch ChatGPT, Ollama mit Gemma/LLama/Qwen oder OpenCode mit
Kimi/Qwen/Deepseek...) unterstützend eingesetzt.
Dies erfolgte insbesondere zur Unterstützung bei der Generierung von Grafiken
(d. h. SVG Dateien), oder um sich Übersichtstabellen generieren zu lassen.
Weiterhin wurde KI zur allgemeinen Qualitätssicherung eingesetzt.
Inhalte, die ggf. von der KI vorgeschlagen wurden, wurden im Falle der
Übernahme explizit validiert und angepasst.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic class="center-content no-title" id="warnung"><h2>Warnung</h2><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Die hier angegebenen Informationen sind unverbindlich und insbesondere die
Benotung weicht ggf. in einer konkreten Lehrveranstaltung von der hier
dargestellten Aufteilung ab.</p><p><strong>Maßgeblich sind die Informationen, die Ihnen in der Vorlesung gegeben
werden.</strong></p></aside></ld-topic>
<ld-topic id="bewertungskriterien"><h2>Bewertungskriterien</h2><ld-story><ol class="arabic incremental-list highlight-list-item-on-hover list-with-explanations dhbw"><li><p>Inhaltliche Qualität (≥ 50% der Gesamtnote)</p><ul class="incremental-list list-with-explanations"><li><p>Ist die Auswahl der Inhalte sinnvoll?</p></li><li><p>Sind die Inhalte zielgruppenspezifisch aufbereitet?</p><p>D. h. die Inhalte sollten von Ihren Kommilitonen verstanden werden können.</p></li><li><p>Sind die Inhalte für das Publikum nachvollziehbar?</p><p>Häufig bietet es sich an vom Konkreten zum Abstrakten zu gehen. D. h. es ist
häufig besser zuerst ein Beispiel zu zeigen und dann die allgemeine Regel.</p></li><li><p>Ist die Evaluation/Zusammenfassung (falls für den Vortrag relevant)
nachvollziehbar und beantwortet die ursprüngliche Fragestellung?</p></li><li><p>Einhaltung formaler Kriterien:</p><ul class="simple"><li><p>Orthographie</p></li><li><p>konsistente Referenzen</p></li><li><p>Abbildungen und Tabellen haben ggf. passende Referenzen</p></li></ul></li></ul></li><li><p>Persönliches Auftreten (~ 20% der Gesamtnote)</p><ul><li><p>Wird Kontakt zum Publikum aufgebaut?</p><p>(Das Publikum besteht nicht nur aus dem Dozenten.)</p></li><li><p>Wiederholungen und Füllwörter vermeiden.</p></li><li><p>Klare und deutliche Aussprache.</p></li><li><p>Angemessene Sprechgeschwindigkeit.</p></li><li><p>Selbstsicheres Auftreten; d. h. zum Publikum gewandt stehen und nicht
dauerhaft auf den Bildschirm oder die Wand schauen.</p></li><li><p>Sicherer Umgang mit den Folien; d. h. nicht ablesen, sondern die Folien als
Stütze verwenden.</p></li><li><p>Sicherer Umgang mit den technischen Hilfsmitteln (Laptop, Beamer,
Fernbedienung, ggf. Mikrofon).</p></li></ul></li><li><p>Effektive Gestaltung der Präsentation (~ 30% der Gesamtnote)</p><p>Es kommt hierbei insbesondere darauf an, ob die Inhalte verständlich und
nachvollziehbar präsentiert werden. Insbesondere ob Tabellen und Grafiken
effektiv eingesetzt werden und „Textgräber“ vermieden werden.</p><p>Auch Animationen sollten kein Selbstzweck sein, sondern die Inhalte
unterstützen.</p><p>Details bzw. weitere Aspekte:</p><ul class="simple"><li><p>präzise Formulierungen</p></li><li><p>Alles Gesagte ist dem Ziel der Arbeit dienlich, keine inhaltlichen
Ausschweifungen zu Themen, die dem Ziel nicht dienlich sind, beziehungsweise
wo es nicht ersichtlich ist</p></li><li><p>Grafiken sind aussagekräftig, vollständig erklärt und visuell ansprechend</p></li><li><p>die gezeigten Codeabschnitte haben als Ganzes Relevanz; Unnötiges wurde
entfernt</p></li><li><p>gibt es ein Titelblatt auf dem der vollständige Name des Vortragenden, der
Titel des Vortrags, das Datum und ggf. der Anlass angegeben ist</p></li><li><p>Kurzvorträge sollten auf explizite Zusammenfassungen und
Inhaltsverzeichnisse verzichten</p></li></ul></li><li><p>Zeitmanagement</p><ul><li><p>Wird das vorgegebene Zeitfenster eingehalten?</p><p>Abweichungen von +/- 5% sind in der Regel akzeptabel. Bei Abweichungen
zwischen 5% und 10% kommt es auf den sonstigen Verlauf des Vortrags an.</p><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Bei Abweichungen von mehr als 10% wird die Note um 0,2 verschlechtert; bei
20% wird abgebrochen und die Note um 0,5 verschlechtert. Dieser Faktor wird
auf die Gesamtnote angewendet.</p></aside></li><li><p>Wird die Zeit sinnvoll auf die einzelnen Abschnitte verteilt?</p></li></ul></li><li><p>Fehlender oder falscher Einsatz von KI</p><p>Die Verfügbarkeit von KI-Werkzeugen (wie z. B. ChatGPT, Gemini, Claude oder
auch von lokalen Modellen) erlaubt es Ihnen schnell und einfach Folien und
Präsentationen zu erstellen. Deswegen kommt der inhaltlichen Qualität eine
besondere Bedeutung zu.</p><p>Es gilt, dass <span class="emph">Aussagen, die faktisch falsch, unsinnig oder überflüssig sind, zu einer Abwertung führen</span>.</p><p>Inhalte, die bereits <em>Bestandteil von Vorlesungen oder Allgemeinwissen sind, dürfen nicht wiederholt werden, sondern führen ebenfalls zu Punktabzug.</em> <em>Zusammenhangslose Aussagen, die nicht durch Quellen oder eigene Experimente belegt werden können, führen ebenfalls zu Abzügen</em></p><p>Qualifizierende Attribute („schneller“, „besser“, „schwerer“ ...) müssen durch
konkrete Metriken belegt bzw. definiert werden, ansonsten führen sie zu
Punktabzug.</p></li></ol></ld-story><ld-supplemental><aside class="admonition" data-theme="tip"><p class="admonition-title" data-theme="tip-header">Tipp</p><p class="rubric">Präsentation von Code</p><p>Sollten Sie Code demonstrieren, der UIs baut, dann ist es häufig sinnvoll, wenn
Sie erst kurz die Ziel UI zeigen und dann den Code, der diese UI erzeugt. Das
Publikum kann sich dann besser vorstellen, was der Code macht.</p><p>Das Gleiche gilt aber häufig auch für Algorithmen. Auch dort kann es hilfreich
sein, das Ergebnis des Algorithmus zu zeigen und dann den Algorithmus zu
erklären.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="haufige-fehler"><h2>Häufige Fehler</h2><ul class="incremental-list dhbw"><li><p><strong>Text zu klein</strong></p><p>Bitte bedenken Sie, dass erst ab einer Textgröße von 20 Punkten der Text für
die meisten Zuhörer gut lesbar ist.</p><p>Insbesondere bei Codebeispielen sieht man häufig Code mit deutlich weniger als
20 Punkten.</p></li><li><p><strong>Fehlender Kontrast</strong></p><p>Auf Monitoren mögen dunkle Vordergrundfarben auf dunklem Hintergrund gut
aussehen; auf Beamern ist dies für das Publikum häufig (sehr) schwer zu lesen.</p></li><li><p><strong>Kein Publikumskontakt</strong></p><p>Es ist wichtig, dass Sie Kontakt zum Publikum aufbauen, ihm zugewandt sind und
Blickkontakt herstellen.</p></li></ul></ld-topic>
<ld-topic id="zusammenfassung"><h2>Zusammenfassung</h2><ld-story><p class="rubric">Allgemeine Kriterien</p><dl class="incremental-list field-list"><dt>Struktur des Vortrags<span class="colon">:</span></dt><dd><p>War die Struktur einleuchtend und unter den gegebenen Umständen (Publikum,
etc.) angemessen? War „jederzeit” klar wie der Vortrag strukturiert ist und
in welchem Abschnitt man sich gerade befindet?</p></dd><dt>Logischer Aufbau<span class="colon">:</span></dt><dd><p>Haben die Folien logisch aufeinander aufgebaut oder gab es
„Vorwärtsverweise”, bzw. wurden inhaltliche Fragen, die für ein Verständnis
des Vortrags wichtig gewesen wären,  aufgeworfen und nicht beantwortet?</p></dd><dt>Aussagekraft<span class="colon">:</span></dt><dd><p>Hatte jede Folie eine wohldefinierte Botschaft?  War für jede Folie klar
welchen Beitrag diese Folie leistet bzw. welchen Beitrag die Inhalte auf der
Folie in Hinblick auf die Gesamtpräsentation leisten?</p></dd><dt>Präsentation des Inhalts<span class="colon">:</span></dt><dd><p>Wurden die geplanten Inhalte verständlich und ohne zusätzliche Fragen
aufzuwerfen dargestellt. Hat die Präsentation ein „rundes Bild” ergeben oder
wurden (mit Hinblick auf das Kernthema) irrelevante Inhalte vermittelt?</p></dd><dt>Verständlichkeit des Inhalts der Präsentation<span class="colon">:</span></dt><dd><p>War die Präsentation (jederzeit) für das Zielpublikum verständlich, d.h.
wurden keine unnötigen Fachbegriffe verwendet, wurden Begriffe / relevante
Konzepte hinreichend eingeführt?</p></dd><dt>Visualisierungen / Grafiken<span class="colon">:</span></dt><dd><p>Wurden aussagekräftige, dem Verständnis hilfreiche, Visualisierungen
verwendet?</p></dd><dt>Foliendesign<span class="colon">:</span></dt><dd><p>Wurden Animationen und ähnliche Effekte „sinnvoll” eingesetzt? Wurden Fonts
und Farben vernünftig verwendet.</p></dd><dt>Sorgfalt<span class="colon">:</span></dt><dd><p>War die Präsentation frei von Tippfehlern und waren Grafiken, Quelltext,
etc. konsistent formatiert?</p></dd><dt>Zusammenfassung<span class="colon">:</span></dt><dd><p>Gab es eine und hat diese kurz und prägnant die wichtigsten Aussagen
dargestellt?</p><p><span class="peripheral">(Hier ist nicht eine Zusammenfassung des Vortrags am Ende gemeint, sondern ggf. eine Zusammenfassung der wichtigsten Inhalte/Erkenntnisse am Ende eines Abschnitts.)</span></p></dd><dt>Relevante Literatur/Quellen<span class="colon">:</span></dt><dd><p>Wurde auf die verwendete / relevante / weiterführende Literatur hingewiesen?</p></dd></dl><p class="incremental rubric">Kriterien bzgl. des persönlichen Auftretens</p><dl class="incremental-list field-list simple"><dt>(Aus-)Sprache<span class="colon">:</span></dt><dd><p>Gab es keine „Ähms” und kein Räuspern? War die Sprechgeschwindigkeit
angemessen?</p></dd><dt>Redezeit<span class="colon">:</span></dt><dd><p>Wurde die vorgegebene Redezeit eingehalten bzw. musste die Präsentation
abgebrochen werden? (+/- 10% ist OK - danach Abzug)</p></dd><dt>Vortragsstil<span class="colon">:</span></dt><dd><p>Wurde der Vortrag flüssig vorgetragen oder kam der / die Vortragende ins
Stocken (d.h. er / sie kannte die Folien nicht)? Wurden Grafiken
vollumfänglich und auch verständlich erklärt oder wurden Teile einfach
unerklärt gelassen?</p></dd><dt>Auftreten<span class="colon">:</span></dt><dd><p>Kontakt zum Publikum hergestellt (nicht auf das Notebook geschaut, nicht auf
die Wand geschaut)?</p></dd><dt>Interaktion<span class="colon">:</span></dt><dd><p>War die Interaktion mit dem Fragenden freundlich und zuvorkommend - wurde
auf den Fragenden eingegangen.   Wurden Fragen inhaltlich korrekt und
umfassend beantwortet, oder wurden „andere” - d.h. nicht gestellte - Fragen
beantwortet.</p></dd><dt>Vertrautheit mit der Präsentation<span class="colon">:</span></dt><dd><p>Wurden alle Folien in der Vortragszeit hinreichend dargestellt oder mussten
Folien (z.B. aufgrund von Zeitmangel) übersprungen werden?</p></dd></dl></ld-story></ld-topic>

<ld-topic class="exercises" id="gestaltung-der-prasentation"><h2>Gestaltung der Präsentation</h2><ld-story><p class="rubric">Anforderungen an die Foliengestaltung/Formale Aspekte</p><table class="accentuated-header zebra invisible-margin sticky-header incremental-table-rows" style="width: 100%;"><colgroup><col style="width: 85.0%"><col style="width: 15.0%"></colgroup><thead><tr><th class="head"><p>Aspekt</p></th><th class="head"><p>Erledigt</p></th></tr></thead><tbody><tr><td><p>Ein Titelblatt ist vorhanden mit: Name(n), Titel, Datum.</p></td><td></td></tr><tr><td><p>Jede Folie hat eine Foliennummer.</p></td><td></td></tr><tr><td><p>Wird der Vortrag von mehreren Personen gehalten, sind die Namen aller Vortragenden auf dem Titelblatt angegeben und auf jeder Folie steht der Name der/des aktuell Vortragenden.</p></td><td></td></tr><tr><td><p>Ist die Standardfontgröße so gewählt, dass auf einer Folie max. 20 bis 24 Zeilen bei 1,5fachem Zeilenabstand Platz finden?</p></td><td></td></tr><tr><td><p>Die kleinste Fontgröße für regulären Text und Code ist so gewählt, dass maximal 32 Zeilen bei 1,25fachem Zeilenabstand Platz finden.</p></td><td></td></tr><tr><td><p>Die kleinste Fontgröße für Referenzen ist nicht kleiner als 60% der kleinsten Fontgröße für regulären Text und Code.</p></td><td></td></tr><tr><td><p>Die kleinste Fontgröße in einer Grafik ist nicht kleiner als 80% der kleinsten Fontgröße für regulären Text und Code.</p></td><td></td></tr><tr><td><p>Vordergrund- und Hintergrundfarben bieten <a class="reference external" href="https://webaim.org/resources/linkcontrastchecker/">ausreichend Kontrast</a> (vgl. <a class="reference external" href="https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum">WCAG</a>) und sind auch auf dem Beamer sichtbar.</p></td><td></td></tr><tr><td><p>Die Animationen und visuellen Effekte unterstützen den Inhalt (kein Selbstzweck). Dies gilt insbesondere für Folienübergänge.</p></td><td></td></tr><tr><td><p>Farben sind nicht der einzige Mechanismus, um eine Information zu transportieren (zusätzliche Symbole/Muster bei Diagrammen).</p></td><td></td></tr><tr><td><p>Codebeispiele, die mehr als drei Zeilen haben, sind nummeriert.</p></td><td></td></tr><tr><td><p>Code ist mit Syntax-Highlighting dargestellt.</p></td><td></td></tr><tr><td><p>Code wird als regulärer (skalierbarer) Text (kein Bild/Screenshot) dargestellt.</p></td><td></td></tr><tr><td><p>Grafiken und Tabellen basierend auf externen Quellen haben Nachweise und Copyrightangaben am Erscheinungsort (Verweis auf Quellenverzeichnis ist ggf. ausreichend).</p></td><td></td></tr><tr><td><p>Bei (wörtlichen) Zitaten ist die vollständige Quelle direkt auf der Folie angegeben (nicht nur im Literaturverzeichnis).</p></td><td></td></tr><tr><td><p>Es gibt keine Vorwärtsverweise, in Hinblick auf Informationen, die <em>jetzt</em> für das Verständnis notwendig sind.</p></td><td></td></tr></tbody></table><p class="incremental rubric">Inhaltliche Aspekte der Foliengestaltung</p><table class="accentuated-header zebra invisible-margin sticky-header incremental-table-rows" style="width: 100%;"><colgroup><col style="width: 85.0%"><col style="width: 15.0%"></colgroup><thead><tr><th class="head"><p>Aspekt</p></th><th class="head"><p>Erledigt</p></th></tr></thead><tbody><tr><td><p>Jede Folie hat eine Aussage/ein Kernthema.</p></td><td></td></tr><tr><td><p><em>Alle</em> Inhalte auf der Folie können von dem Vortragenden erklärt werden.</p></td><td></td></tr><tr><td><p>Alle Aussagen sind faktisch korrekt und sinnvoll.</p></td><td></td></tr><tr><td><p>Alle Aussagen sind belegt durch Quellen oder durch eigene, nachvollziehbare Ergebnisse.</p></td><td></td></tr><tr><td><p>Wann immer sinnvoll/möglich sollten Sie sich auf <em>aktuelle</em> Beispiele/Technologien/Referenzen beziehen. Technologien/Beispiele/etc., die bereits abgekündigt sind oder keine Praxisrelevanz haben und auch nicht mehr haben werden, sollte nur nach expliziter schriftlicher Nachfrage diskutiert werden.</p></td><td></td></tr><tr><td><p>Es gibt keine Präsentation von Inhalten, die im Rahmen der Vorlesung oder von vorhergehenden Vorlesungen in früheren Semestern behandelt wurden.</p></td><td></td></tr><tr><td><p>Es gibt keine Präsentation von Inhalten, die vorhergehende Vorträge behandelt haben; sprechen Sie sich ggf. bei Bedarf untereinander ab.</p></td><td></td></tr><tr><td><p>Es gibt keine überflüssigen oder redundanten Aussagen.</p></td><td></td></tr><tr><td><p><strong>Folien sollten primär Abbildungen/Visualisierungen/Tabellen enthalten</strong>. Bulletpoints sollten – wann immer möglich – vermieden werden.</p></td><td></td></tr><tr><td><p>Es gibt keine Grafiken/Bilder/Icons/Darstellungen, die nur der Optik dienen.</p></td><td></td></tr><tr><td><p>Grafiken bzw. Abbildungen sind aussagekräftig und werden im Rahmen des Vortrags <em>vollständig</em> erklärt.</p></td><td></td></tr><tr><td><p>Wenn die verwendete (Standard-)Notation nicht trivial erkennbar ist, dann wird kurz auf die Notation hingewiesen. Es gibt eine explizite Legende, wenn die Notation keine Standardnotation ist.</p></td><td></td></tr><tr><td><p>Grafiken werden schrittweise aufgebaut (sinnvolle Animationen), um den Zuschauer nicht zu erschlagen.</p></td><td></td></tr><tr><td><p>Alle verwendeten Symbole und Icons sind semantisch unmittelbar verständlich und unterstützen das Verständnis.</p></td><td></td></tr><tr><td><p>Codebeispiele sind auf <em>strikt</em> notwendige Abschnitte reduziert.</p></td><td></td></tr><tr><td><p>Das Design ist konsistent über alle Folien hinweg: Insbesondere werden gleiche Farben für gleiche Dinge verwendet, die Schriftarten sind konsistent, das Layout ist konsistent; Grafiken nutzen die gleiche visuelle Sprache.</p></td><td></td></tr><tr><td><p>Kurzvorträge (d. h. Vorträge unter ca. 20 Minuten) präsentieren keine Agenda bzw. ein Inhaltsverzeichnis; auch längere Vorträge, die dem zu erwartenden Ablauf folgen, sollten auf eine Agenda bzw. ein Inhaltsverzeichnis verzichten.</p></td><td></td></tr><tr><td><p>Kurzvorträge (d. h. Vorträge unter ca. 20 Minuten) haben nur dann eine Zusammenfassung, wenn diese neue Erkenntnisse bringt.</p></td><td></td></tr><tr><td><p>Die Präsentation wurde (mittels KI) auf Probleme mit der Rechtschreibung und dem Stil überprüft.</p></td><td></td></tr><tr><td><p>Die Präsentation wurde (mittels KI) auf Aussagen, die unnötig, faktisch falsch oder irreführend sind, überprüft.</p></td><td></td></tr></tbody></table><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Sollten Sie im Rahmen der Präsentation Code in einem Editor oder vergleichbarem
zeigen (z. B. Dev-Tools eines Browsers), dann sind die oben genannten
Anforderungen auch einzuhalten.</p></aside><ld-grid class="incremental margin-top-4em default-layout"><ld-cell class="width-40" style="align-self:auto;"><p>Verifiziert am: ______________________</p></ld-cell><ld-cell class="width-60" style="align-self:auto;"><p>Unterschrift: ___________________________________________</p></ld-cell></ld-grid></ld-story></ld-topic>
