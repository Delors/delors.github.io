<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>
<style>/* ---------------------------------------------------------------------------
   UML-spezifische Klassen für die Zeichnungen dieses Foliensatzes
   (ld.include-styles im Frontmatter). Alles andere kommt aus den gemeinsamen
   ld-Klassen (LectureDoc2Author/shared/ld/svgs/ld-svg.css).
   --------------------------------------------------------------------------- */

/* Deckt ab, was darunter liegt (z. B. eine Aggregationsraute, die in einem
   späteren Schritt wieder entfernt wird). Folgt dem Hintergrund der Folie -
   auch in Admonitions und im Dark Mode. */
svg .uml-cover {
    fill: var(--background-color);
}

/* Blendet alles darunter ab (wie die Klasse fade-out einer Karte): ein
   halbtransparenter Schleier in der Hintergrundfarbe. */
svg .uml-veil {
    fill: var(--background-color);
    fill-opacity: 0.4;
}
</style>
</head>
<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    UML-spezifische Marker für die Zeichnungen dieses Foliensatzes
    (ld.include-globals im Frontmatter). Pfeilspitzen für Kontrollfluss und
    Nachrichten kommen aus den gemeinsamen ld-Markern (ld-arrow, ld-arrow-open).

    Geometrie (Einheit = Strichbreite der Linie, markerUnits="strokeWidth"):
    Die Linie endet an der BASIS des Markers (hinterer Punkt), die Form ragt
    über das Linienende hinaus. Da die Linie nicht in die Form hineinreicht,
    brauchen die hohlen Formen keine Füllung mit der Hintergrundfarbe.

    - uml-triangle (Generalisierung): Spitze 8 × Strichbreite hinter dem
      Linienende, Breite 9 × Strichbreite.
    - uml-diamond / uml-diamond-filled (Aggregation / Komposition): Spitze
      10.5 × Strichbreite hinter dem Linienende, Breite 7 × Strichbreite.

    Damit die Spitze ein Ziel berührt, endet die Linie also 8 bzw. 10.5 ×
    Strichbreite vor dem Ziel. orient="auto-start-reverse": als marker-start
    zeigt die Form vom Linienanfang weg.
-->
<defs>

    <!-- Generalisierung: hohles Dreieck. -->
    <marker id="uml-triangle" viewBox="-1 -5 10 10" refX="0" refY="0"
            markerWidth="10" markerHeight="10" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M 0 -4 L 7.5 0 L 0 4 Z" fill="none" stroke="currentColor"
              stroke-width="1" stroke-linejoin="round" />
    </marker>

    <!-- Aggregation: hohle Raute. -->
    <marker id="uml-diamond" viewBox="-1 -4 12 8" refX="0" refY="0"
            markerWidth="12" markerHeight="8" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M 0 0 L 5 -3 L 10 0 L 5 3 Z" fill="none" stroke="currentColor"
              stroke-width="1" stroke-linejoin="round" />
    </marker>

    <!-- Komposition: gefüllte Raute. -->
    <marker id="uml-diamond-filled" viewBox="-1 -4 12 8" refX="0" refY="0"
            markerWidth="12" markerHeight="8" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M 0 0 L 5 -3 L 10 0 L 5 3 Z" fill="currentColor"
              stroke="currentColor" stroke-width="1" stroke-linejoin="round" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="uml-unified-modeling-language"><h2>UML (Unified Modeling Language)</h2><ul class="incremental-list list-with-explanations simple"><li><p>UML (Unified Modeling Language) ist eine standardisierte Modellierungssprache, die zur Beschreibung von Software-Systemen verwendet wird.</p></li><li><p>UML besteht aus verschiedenen Diagrammtypen, die unterschiedliche Aspekte eines Systems beschreiben.</p></li><li><p>UML wird in der Softwareentwicklung verwendet, um Konzepte und Entwürfe zu kommunizieren und zu besprechen. Eine detaillierte Modellierung ist nicht (mehr) das Ziel oder üblich.</p></li><li><p><span class="peripheral">Die Hoffnungen und Erwartungen, die an UML Anfang der 2000er gestellt wurden, wurden nicht erfüllt. Seit 2017 ist die Version 2.5.1 aktuell.</span></p></li></ul><aside class="admonition incremental" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>Wenn Sie UML verwenden, dann verwenden Sie die Notationen spezifikationskonform, da sonst der Sinn der Notation (vollständig) verloren geht oder es sogar zu Missverständnissen kommt.</p></aside><aside class="admonition incremental" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Im Folgenden verwenden wir UML 2 als Grundlage. Im Rahmen der Weiterentwicklung von UML wurden jedoch auch immer mal wieder Anpassungen vorgenommen. Die Diagramme entsprechen somit möglicherweise nicht dem letzten Stand der UML Spezifikation. Darüberhinaus haben auch Werkzeuge in dem Bereich nicht alle Teile der Spezifikation in gleicher Weise umgesetzt oder auch weitere Elemente hinzugefügt. Hier ist das Ziel lediglich Sie an die Modellierung eines Problems als ersten Schritt hin zu einer Implementierung heranzuführen.</p></aside><ld-supplemental embed-in-document-flow=""><p>Insbesondere im Bereich der Visualisierung von Architekturen haben sich auch andere Notationen etabliert, die die (anfänglichen) Unzulänglichkeiten von UML diesbezüglich nicht haben bzw. die relevanten Aspekte besser und direkter adressieren. Ein bekanntes Beispiel ist das <a class="reference external" href="https://c4model.com">C4 Model</a>.</p></ld-supplemental></ld-topic>

<ld-topic class="no-page-break" id="aktivitatsdiagramm-fur-die-abwicklung-einer-bestellung"><h2>Aktivitätsdiagramm für die Abwicklung einer Bestellung</h2><div class="margin-auto" style="width: 70ch; height: 22.8ch;" aria-label="Aktivitätsdiagramm für die Abwicklung einer Bestellung"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" font-size="16">
  <title>Aktivitätsdiagramm für die Abwicklung einer Bestellung</title>
  <!-- Raster: Hauptzeile y = 88 (Start, Bestellung entgegennehmen/abschließen, Ende);
       obere Zeile y = 30 (Rechnung, Zahlung); untere Zeile y = 182 (Ausliefern,
       Verzweigung, Zusammenführung); Liefertypen y = 125 und y = 248.
       Aktionen: 93 × 56, rx = 12. Pfeilspitzen (ld-arrow-open) berühren die
       Außenkante des Ziels. -->

  <!-- Schritt 0 (immer sichtbar): Startknoten -->
  <circle cx="18" cy="88" r="16" fill="currentColor" />
  <path class="ld-line" d="M 34 88 H 54.8" marker-end="url(#ld-arrow-open)" />

  <!-- Schritt 1: Bestellung entgegennehmen -->
  <g class="incremental">
    <rect class="ld-box" x="58" y="55" width="94" height="66" rx="12" />
    <text class="ld-label" text-anchor="middle"><tspan x="105" y="75.2">Bestellung</tspan><tspan x="105" dy="18.4">entgegen-</tspan><tspan x="105" dy="18.4">nehmen</tspan></text>
  </g>

  <!-- Schritt 2: Parallelisierung (Fork) in Rechnung und Auslieferung -->
  <g class="incremental">
    <path class="ld-line" d="M 152.8 88 H 171.6" marker-end="url(#ld-arrow-open)" />
    <rect x="174" y="16" width="6" height="180" fill="currentColor" />
    <path class="ld-line" d="M 180 30 H 202.8" marker-end="url(#ld-arrow-open)" />
    <path class="ld-line" d="M 180 182 H 202.8" marker-end="url(#ld-arrow-open)" />
    <rect class="ld-box" x="206" y="2" width="93" height="56" rx="12" />
    <text class="ld-label" text-anchor="middle"><tspan x="252.5" y="26.4">Rechnung</tspan><tspan x="252.5" dy="18.4">versenden</tspan></text>
    <rect class="ld-box" x="206" y="154" width="93" height="56" rx="12" />
    <text class="ld-label" text-anchor="middle"><tspan x="252.5" y="178.4">Bestellung</tspan><tspan x="252.5" dy="18.4">ausliefern</tspan></text>
  </g>

  <!-- Schritt 3: Wie wird ausgeliefert? (Verzweigung) -->
  <g class="incremental">
    <path class="ld-line" d="M 299.8 182 H 332.8" marker-end="url(#ld-arrow-open)" />
    <path class="ld-box" d="M 361 161 L 386 182 L 361 203 L 336 182 Z" />
  </g>

  <!-- Schritt 4: Liefertypen mit Bedingungen -->
  <g class="incremental">
    <path class="ld-line" d="M 361 160.2 V 125 H 428.8" marker-end="url(#ld-arrow-open)" />
    <path class="ld-line" d="M 361 203.8 V 248 H 428.8" marker-end="url(#ld-arrow-open)" />
    <rect class="ld-box" x="432" y="97" width="93" height="56" rx="12" />
    <text class="ld-label" text-anchor="middle"><tspan x="478.5" y="121.4">Übernacht-</tspan><tspan x="478.5" dy="18.4">lieferung</tspan></text>
    <rect class="ld-box" x="432" y="220" width="93" height="56" rx="12" />
    <text class="ld-label" text-anchor="middle"><tspan x="478.5" y="244.4">reguläre</tspan><tspan x="478.5" dy="18.4">Lieferung</tspan></text>
    <g class="ld-label" font-size="14">
      <text text-anchor="middle"><tspan x="392" y="97">[Prioritäts-</tspan><tspan x="392" dy="16.1">bestellung]</tspan></text>
      <text x="369" y="238">[else]</text>
    </g>
  </g>

  <!-- Schritt 5: Zahlung empfangen -->
  <g class="incremental">
    <path class="ld-line" d="M 299.8 30 H 404.8" marker-end="url(#ld-arrow-open)" />
    <rect class="ld-box" x="408" y="2" width="93" height="56" rx="12" />
    <text class="ld-label" text-anchor="middle"><tspan x="454.5" y="26.4">Zahlung</tspan><tspan x="454.5" dy="18.4">empfangen</tspan></text>
  </g>

  <!-- Schritt 6: Ausgeliefert (Zusammenführung) -->
  <g class="incremental">
    <path class="ld-line" d="M 525.8 125 H 591 V 157.8" marker-end="url(#ld-arrow-open)" />
    <path class="ld-line" d="M 525.8 248 H 591 V 206.2" marker-end="url(#ld-arrow-open)" />
    <path class="ld-box" d="M 591 161 L 616 182 L 591 203 L 566 182 Z" />
  </g>

  <!-- Schritt 7: Synchronisation (Join) -->
  <g class="incremental">
    <path class="ld-line" d="M 501.8 30 H 646.6" marker-end="url(#ld-arrow-open)" />
    <path class="ld-line" d="M 616.8 182 H 646.6" marker-end="url(#ld-arrow-open)" />
    <rect x="649" y="16" width="6" height="180" fill="currentColor" />
  </g>

  <!-- Schritt 8: Bestellung abschließen und Endknoten -->
  <g class="incremental">
    <path class="ld-line" d="M 655 88 H 681.8" marker-end="url(#ld-arrow-open)" />
    <rect class="ld-box" x="685" y="60" width="101" height="56" rx="12" />
    <text class="ld-label" text-anchor="middle"><tspan x="735.5" y="84.4">Bestellung</tspan><tspan x="735.5" dy="18.4">abschließen</tspan></text>
    <path class="ld-line" d="M 786.8 88 H 811.8" marker-end="url(#ld-arrow-open)" />
    <circle class="ld-box" cx="836" cy="88" r="21" />
    <circle cx="836" cy="88" r="15" fill="currentColor" />
  </g>
</svg>
</div><ld-supplemental embed-in-document-flow=""><p>Zentrale Elemente eines Aktivitätsdiagramms:</p><ul class="simple"><li><p>▢ die Aktionen (abgerundete Rechtecke) stehen für eine Operation, die im Rahmen des Ablaufs ausgeführt wird und in dem Kontext des Diagramms nicht weiter verfeinert wird.</p></li><li><p>⚫︎ der Startknoten (gefüllter Kreis); es kann mehrere Startknoten geben.</p></li><li><p>◉ der Endknoten (gefüllter Kreis mit einem Rand) beendet die Aktivität.</p></li><li><p>⟶ Kanten (gerichtete Linien) verbinden die Elemente (Aktionen) und beschreiben den Ablauf. Kanten können mit Bedingungen (in eckigen Klammern) versehen sein.</p></li><li><p>◊ Entscheidungen (Rauten) beschreiben, dass der Ablauf in Abhängigkeit von einer Bedingung unterschiedlich weitergeht.</p></li><li><p>◊ (einfache Rauten ohne Bedingungen) dienen dazu, mehrere alternative Pfade zusammenzuführen.</p></li><li><p>❙ Parallelisierungs- und Synchronisierungspunkte (<span class="eng">Fork</span> und <span class="eng">Join</span>) (schwarze Balken) beschreiben, dass der Ablauf an dieser Stelle in mehrere Pfade aufgeteilt und später wieder zusammengeführt wird.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-move-to-top" id="sequenzdiagramme"><h2>Sequenzdiagramme</h2></ld-topic>
<ld-topic class="no-page-break" id="beispiel-sequenzdiagramm-fur-ein-alarmsystem"><h2>Beispiel: Sequenzdiagramm für ein Alarmsystem</h2><div class="margin-auto" style="width: 62ch; height: 38.06ch;" aria-label="Sequenzdiagramm für ein Alarmsystem"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 606 372" font-size="14">
  <title>Sequenzdiagramm für ein Alarmsystem</title>
  <!-- Lebenslinien: Bewohner x = 68, Alarmsystem x = 234, Sensor x = 399,
       Alarm x = 555. Aktivierungsbalken 17 breit (deckt die Lebenslinie ab).
       Synchrone Nachricht: ld-arrow; asynchrone: ld-arrow-open;
       Antwort: gestrichelt mit ld-arrow-open. -->

  <!-- Schritt 0 (immer sichtbar): die Objekte und ihre Lebenslinien -->
  <path class="ld-line ld-dashed ld-muted" d="M 68 33 V 371" />
  <path class="ld-line ld-dashed ld-muted" d="M 234 33 V 371" />
  <path class="ld-line ld-dashed ld-muted" d="M 399 33 V 371" />

  <text class="ld-label" x="399" y="22.7" text-anchor="middle" font-size="16" font-weight="bold">: Sensor</text>

  <!-- Schritt 1: das System aktivieren -->
  <g class="incremental">
    <rect class="ld-box uml-cover" x="59.5" y="68" width="17" height="71" />
    <rect class="ld-box uml-cover" x="225.5" y="68" width="17" height="71" />
    <rect class="ld-box uml-cover" x="390.5" y="81" width="17" height="34" />
    <path class="ld-line" d="M 77.2 68 H 222.7" marker-end="url(#ld-arrow)" />
    <text class="ld-label" x="151" y="63" text-anchor="middle">aktivieren</text>
    <path class="ld-line" d="M 243.2 81 H 387.7" marker-end="url(#ld-arrow)" />
    <text class="ld-label" x="316.5" y="76" text-anchor="middle">aktivieren</text>

  </g>

  <!-- Schritt 2: der Sensor meldet eine Bewegung, das System löst Alarm aus -->
  <g class="incremental">
    <circle cx="287" cy="167" r="8" fill="currentColor" />
    <rect class="ld-box uml-cover" x="390.5" y="167" width="17" height="39" />

    <path class="ld-line" d="M 540.5 332.5 L 569.5 361.5 M 540.5 361.5 L 569.5 332.5" />

</div><ld-supplemental embed-in-document-flow=""><p>In Sequenzdiagrammen wird der zeitliche Ablauf von Interaktionen zwischen Objekten dargestellt.</p><ul class="list-with-explanations"><li><p>▯ Eine Ausführungssequenz wird durch ein vertikales Rechteck auf der Lebenslinie dargestellt.</p></li><li><p>➝ Bei einem synchronen Nachrichtenaustausch wartet der Sender, bis der Empfänger diese abgearbeitet hat. Er wird durch eine durchgezogene Linie mit einem gefüllten Dreieck dargestellt.</p></li><li><p>→ Bei einem asynchronen Nachrichtenaustausch wartet der Sender nicht auf eine Antwort des Empfängers. Er wird durch eine durchgezogene Linie mit einem offenen Pfeil dargestellt.</p></li><li><p>⤑ Eine Nachricht, die ein Objekt erzeugt, wird mit einer gestrichelten Linie dargestellt.</p></li><li><p>⤎ Eine Antwortnachricht wird durch eine gestrichelte Linie mit einem offenen Pfeil dargestellt.</p></li><li><p>➔⏺  Eine verlorene Nachricht; d. h. eine Nachricht an ein System, das (aktuell) außerhalb der Modellierung liegt.</p><p>In dem gezeigten Diagramm ist mit "Alarm ➔⏺" eine Benachrichtigung – zum Beispiel – einer Feuerwache oder Polizeistation gemeint und nicht der lokal erzeugte Alarm.</p></li></ul><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>In vielen Diagrammen wird auf die Feinheiten bzgl. der korrekten Darstellung der Nachrichten wenig Wert gelegt. Sollten Sie sich nicht sicher sein, dass der Ersteller bewusst synchrone und asynchrone Nachrichten unterschieden hat, dann sollten Sie davon ausgehen, dass es sich um synchrone Nachrichten handelt.</p></aside></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-move-to-top" id="zustandsautomaten"><h2>Zustandsautomaten</h2></ld-topic>
<ld-topic class="no-page-break" id="beispiel-zustandsautomat-fur-einen-partyteilnehmer"><h2>Beispiel: Zustandsautomat für einen Partyteilnehmer</h2><ld-deck><ld-card><p>Ein Partyteilnehmer kann in den Zuständen „eingeladen“, „wird begrüßt“, „feiert“ und „ist betrunken“ sein.</p><div class="incremental"><p>Gegenstände der Modellierung sind:</p><ul class="simple"><li><p>Zustände und Übergänge dazwischen</p></li><li><p>Ereignisse, die einen Übergang auslösen</p></li><li><p>Aktionen (<span class="docutils literal">entry</span>, <span class="docutils literal">exit</span>, <span class="docutils literal">do</span>), die ausgeführt werden</p></li><li><p>Entscheidungsknoten</p></li><li><p>Start- und Endzustände</p></li></ul></div></ld-card><ld-card class="incremental"><div class="margin-auto" style="width: 66ch; height: 38.1ch;" aria-label="Zustandsautomat für einen Partyteilnehmer"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 809 467" font-size="14">
  <title>Zustandsautomat für einen Partyteilnehmer</title>
  <!-- Zeilen: eingeladen / wird begrüßt y = 133; feiert / Verzweigung / betrunken
       y = 294. Zustände 64 hoch (eingeladen: 32), rx = 12; Name 19 unter der
       Oberkante, Trennlinie für die Aktivitäten 26 unter der Oberkante. -->

  <!-- Schritt 0 (immer sichtbar): Rahmen des Zustandsautomaten der Klasse -->
  <rect class="ld-box" x="1" y="1" width="806" height="464" />
  <path class="ld-line" d="M 1 35 H 171 L 185 21 V 1" />
  <text class="ld-label" x="7" y="23" font-size="16" font-weight="bold">class Partyteilnehmer</text>

  <!-- Schritt 1: die Zustände -->
  <g class="incremental">
    <rect class="ld-box" x="16" y="117" width="121" height="32" rx="12" />
    <text class="ld-label" x="76.5" y="136" text-anchor="middle" font-size="16" font-weight="bold">eingeladen</text>
    <rect class="ld-box" x="204" y="101" width="184" height="64" rx="12" />
    <text class="ld-label" x="296" y="120" text-anchor="middle" font-size="16" font-weight="bold">wird begrüßt</text>
    <rect class="ld-box" x="235" y="262" width="122" height="64" rx="12" />
    <text class="ld-label" x="296" y="281" text-anchor="middle" font-size="16" font-weight="bold">feiert</text>
    <rect class="ld-box" x="625" y="262" width="160" height="64" rx="12" />
    <text class="ld-label" x="705" y="281" text-anchor="middle" font-size="16" font-weight="bold">betrunken</text>
  </g>

  <!-- Schritt 2: der Startzustand -->
  <g class="incremental">
    <circle cx="76.5" cy="65" r="16" fill="currentColor" />
    <path class="ld-line" d="M 76.5 81 V 114.2" marker-end="url(#ld-arrow-open)" />
  </g>

  <!-- Schritt 3: Übergänge bis zu „feiert“ -->
  <g class="incremental">
    <path class="ld-line" d="M 137.7 133 H 201.2" marker-end="url(#ld-arrow-open)" />
    <path class="ld-line" d="M 296 165.7 V 259.2" marker-end="url(#ld-arrow-open)" />
    <text class="ld-label" x="303" y="218">ist begrüßt</text>
  </g>

  <!-- Schritt 4: nach 30 Minuten den Zustand prüfen -->
  <g class="incremental">
    <path class="ld-line" d="M 357.7 294 H 472.2" marker-end="url(#ld-arrow-open)" />
    <path class="ld-box" d="M 500 273 L 525 294 L 500 315 L 475 294 Z" />
    <path class="ld-line" d="M 525.7 294 H 622.2" marker-end="url(#ld-arrow-open)" />
    <path class="ld-line" d="M 500 315.7 V 371 H 296 V 328.8" marker-end="url(#ld-arrow-open)" />
    <g class="ld-label" text-anchor="middle">
      <text><tspan x="416" y="270">nach 30min/</tspan><tspan x="416" dy="16">Zustand prüfen</tspan></text>
      <text><tspan x="575" y="270">[ist</tspan><tspan x="575" dy="16">betrunken]</tspan></text>
      <text x="398" y="365">[nicht betrunken]</text>
    </g>
  </g>

  <!-- Schritt 5: Endzustände -->
  <g class="incremental">
    <path class="ld-line" d="M 234.3 294 H 86.1" marker-end="url(#ld-arrow-open)" />
    <text class="ld-label" x="160" y="288" text-anchor="middle">pöbelt herum</text>
    <path class="ld-line" d="M 62 279.5 L 91 308.5 M 62 308.5 L 91 279.5" />
    <path class="ld-line" d="M 705 326.7 V 376.2" marker-end="url(#ld-arrow-open)" />
    <circle class="ld-box" cx="705" cy="400" r="21" />
    <circle cx="705" cy="400" r="15" fill="currentColor" />
  </g>

  <!-- Schritt 6: Aktivitäten in den Zuständen -->
  <g class="incremental">
    <path class="ld-line" d="M 204 127 H 388" />
    <text class="ld-label" x="296" y="151" text-anchor="middle">entry/ Cocktail anbieten</text>
    <path class="ld-line" d="M 235 288 H 357" />
    <text class="ld-label" x="296" y="312" text-anchor="middle">do/ Spass haben</text>
    <path class="ld-line" d="M 625 288 H 785" />
    <text class="ld-label" x="705" y="312" text-anchor="middle">entry/ Taxi rufen</text>
  </g>
</svg>
</div></ld-card></ld-deck><ld-supplemental embed-in-document-flow=""><p>Ein Zustandsautomat beschreibt das Verhalten eines Objekts in Abhängigkeit von seinem Zustand. Ein Zustandsautomat besteht aus:</p><dl class="field-list"><dt>Startknoten (⬤)<span class="colon">:</span></dt><dd><p>Startpunkt des Zustandsautomaten. Er hat eine ausgehende Transition.</p></dd><dt>Endzustand (◉)<span class="colon">:</span></dt><dd><p>Endpunkt des Zustandsautomaten. Er hat keine ausgehenden Transitionen. Es kann mehrere Endzustände geben.</p></dd><dt>Entscheidung (◊)<span class="colon">:</span></dt><dd><p>In Abhängigkeit vom Ergebnis (Auswertung der Entscheidungsbedingung), d. h. der auf dem Weg zur Entscheidung getroffenen Aktionen, wird der Zustandsautomat in unterschiedliche Zustände überführt.</p><p>Es gibt mindestens zwei ausgehende Transitionen.</p></dd><dt>Terminator (X)<span class="colon">:</span></dt><dd><p>Beendet (auch) einen Zustandsautomaten.</p><p>Beendet die Lebensdauer des Zustandsautomaten. (In diesem Fall könnte man dies so interpretieren, dass der Partyteilnehmer die Party verlässt/rausgeworfen wird und wir uns auch nicht weiter für den Partyteilnehmer interessieren.)</p></dd><dt>Transitionen (Übergänge) (→)<span class="colon">:</span></dt><dd><p>Verbinden Zustände und Entscheidungen.</p><dl class="field-list simple"><dt>Syntax<span class="colon">:</span></dt><dd><p>Trigger [Guard] / Aktion</p></dd></dl><p>Der Trigger beschreibt das Ereignis, das den Übergang auslöst. Ein Guard (Wächter) beschreibt die Bedingung, die wahr sein muss. Die Aktion beschreibt das Verhalten, das ausgeführt wird beim Durchlaufen des Übergangs.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-move-to-top" id="klassendiagramme"><h2>Klassendiagramme</h2></ld-topic>
<ld-topic class="no-title center-content no-page-break" id="curtis-gesetz"><h2>Curtis Gesetz</h2><blockquote class="epigraph"><p>Curtis Gesetz: [...] Gute Entwürfe erfordern fundierte Anwendungskenntnisse.</p><p class="attribution">—<strong>Albert Endres and Dieter Rombach</strong>; <em>A Handbook of Software and Systems Engineering</em>; Addison Wesley 2003</p></blockquote></ld-topic>
<ld-topic id="klassen-und-objekte"><h2>Klassen und Objekte</h2><div class="accentuate margin-top-1em margin-bottom-1em"><p>Eine <strong>Klasse</strong> beschreibt <strong>Objekte</strong> mit:</p><ol class="arabic incremental simple"><li><p>derselben Semantik,</p></li><li><p>denselben Eigenschaften und</p></li><li><p>demselben Verhalten.</p></li></ol></div><div class="incremental"><p>D. h. eine Klasse definiert einen Typ.</p><p>Konkrete Ausprägungen dieses Typs sind die Objekte.</p></div></ld-topic>
<ld-topic id="modellierung-einer-party-klassen"><h2>Modellierung einer Party - Klassen <a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></h2><div class="margin-auto" style="width: 60ch; height: 38.83ch;" aria-label="Klassen"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 887 574" font-size="14">
  <title>Klassendiagramm einer Party: Klassen</title>
  <!-- Klassen: Namensfeld 32 hoch (Name fett, 16); Abschnitte für Attribute und
       Operationen darunter, Zeilenabstand 17, Text 5 rechts der linken Kante.
       Bartender, Cocktail und Zutat stehen auf der Achse x = 742.5;
       Partyteilnehmer und Gast auf x = 96. -->

  <!-- Die Klassen (nur Namensfelder) -->
  <rect class="ld-box" x="297" y="1" width="122" height="32" />
  <text class="ld-label" x="358" y="23" text-anchor="middle" font-size="16" font-weight="bold">Party</text>
  <rect class="ld-box" x="662.5" y="15" width="160" height="32" />
  <text class="ld-label" x="742.5" y="37" text-anchor="middle" font-size="16" font-weight="bold">Zutat</text>
  <rect class="ld-box" x="1" y="160" width="190" height="32" />
  <text class="ld-label" x="96" y="182" text-anchor="middle" font-size="16" font-weight="bold">Partyteilnehmer</text>
  <rect class="ld-box" x="661.5" y="266" width="162" height="32" />
  <text class="ld-label" x="742.5" y="288" text-anchor="middle" font-size="16" font-weight="bold">Cocktail</text>
  <rect class="ld-box" x="599.5" y="415" width="286" height="32" />
  <text class="ld-label" x="742.5" y="437" text-anchor="middle" font-size="16" font-weight="bold">Bartender</text>
  <rect class="ld-box" x="297" y="447" width="190" height="32" />
  <text class="ld-label" x="392" y="469" text-anchor="middle" font-size="16" font-weight="bold">Gastgeber</text>
  <rect class="ld-box" x="17" y="448" width="158" height="32" />
  <text class="ld-label" x="96" y="470" text-anchor="middle" font-size="16" font-weight="bold">Gast</text>
</svg>
</div><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Das Beispiel ist stark angelehnt an Abb. 6.1 aus UML2 Glasklar, Hanser Verlag</p></aside></aside><ld-supplemental embed-in-document-flow=""><p>Wir haben erst einmal nur die Klassen identifiziert/modelliert, die für Parties zentral sind.</p><p>Hierbei repräsentieren die Klassen verschiedene „Dinge“:</p><ul class="simple"><li><p>Eine Party als virtuelles Konstrukt, das eine bestimmte Anzahl von Partyteilnehmern hat.</p></li><li><p>Einen Gast, der an einer Party teilnimmt.</p></li><li><p>Ein Cocktail, welcher aus verschiedenen (konkreten) Zutaten besteht.</p></li><li><p>Ein Partyteilnehmer welcher eine Abstraktion für Gäste und Gastgeber darstellt.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="attribute"><h2>Attribute</h2><ul class="simple"><li><p>Attribute sind logische Datenwerte eines Objekts und haben immer einen Datentyp.</p></li></ul><ul class="list-with-explanations incremental"><li><p>Die Attribute in einem Modell sollten vorzugsweise „primitive“ Datentypen sein.</p></li><li><p>Häufig ist es sinnvoll, Mengen (x Liter, y Kilogramm, etc.) als Klassen zu modellieren, um Einheiten zuordnen zu können.</p><p>Z. B. sollte der Datentyp des Attributs „Betrag“ einer Zahlung die Währung angeben.</p></li></ul><ul class="incremental simple"><li><p>Attribute können weiterhin:</p><ul class="incremental simple"><li><p>abgeleitet sein und ggf.</p></li><li><p>Defaultwerte haben sowie</p></li><li><p>Sichtbarkeiten haben.</p></li></ul></li></ul><ld-supplemental embed-in-document-flow=""><p>Sehr häufig betrachten wir als primitive Datentypen: Boolesche Werte (Boolean), Datumsangaben (<span class="eng">Date</span>), Zahlen (<span class="eng">Number</span>), Zeichen (<span class="eng">Character</span>), Strings, Adressen, Farben, Telefonnummern,...</p><p>Bitte bedenken Sie, dass wir auf Modellierungsebene nicht an technische Details gebunden sind.</p></ld-supplemental></ld-topic>
<ld-topic class="transition-fade" id="modellierung-einer-party-attribute"><h2>Modellierung einer Party - Attribute</h2><div class="margin-auto" style="width: 60ch; height: 38.83ch;" aria-label="Klassendiagramm einer Party: Attribute"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 887 574" font-size="14">

</div><ld-supplemental embed-in-document-flow=""><p>Grundlegende Attributdeklarationen:</p><dl class="field-list simple"><dt>Syntax<span class="colon">:</span></dt><dd><p>[&#x3C;Sichtbarkeit>] [ <strong>/</strong> ] &#x3C;Attributname> [<strong>:</strong> &#x3C;Datentyp>] [ <strong>[</strong> &#x3C;Multiplizität> <strong>]</strong> ] [ <strong>=</strong> &#x3C;Defaultwert>]</p></dd></dl><div class="smaller line-above"><dl class="field-list simple"><dt>Sichtbarkeiten<span class="colon">:</span></dt><dd><ul class="simple"><li><p><strong>+</strong> : public; d. h. alle Instanzen dürfen auf das Attribut zugreifen.</p></li><li><p><strong>-</strong> : private; d. h. nur Instanzen der Klasse dürfen auf das Attribut zugreifen.</p></li><li><p><strong>#</strong> : protected; d. h. nur Instanzen der Klasse und von Subklassen dürfen auf das Attribut zugreifen.</p></li><li><p><strong>~</strong> : package; d. h. nur Instanzen der Klasse und von Klassen im selben Package dürfen auf das Attribut zugreifen.</p></li><li><p>Ist die Sichtbarkeit nicht explizit angegeben, so ist die typische Annahme <strong>private</strong>.</p></li></ul></dd><dt>/<span class="colon">:</span></dt><dd><p>Bedeutet, dass das Attribut abgeleitet ist. Es kann aus anderen vorliegenden Daten jederzeit berechnet werden.</p></dd><dt>Datentyp<span class="colon">:</span></dt><dd><p>Der Datentyp des Attributs. Es können primitive oder auch komplexe Datentypen sein.</p></dd><dt>Multiplizität<span class="colon">:</span></dt><dd><p>Die Anzahl der Instanzen, die das Attribut haben kann. Übliche Multiplizitäten sind 0..1 (d. h. optional), 1 (d. h. genau einmal), 0..* (d. h. beliebig oft), 1..* (d. h. mind. einmal), 2..*, etc..</p></dd></dl></div></ld-supplemental></ld-topic>

</div><ld-supplemental embed-in-document-flow=""><p>Methoden bzw. Operationen sind die Verhaltensbeschreibungen einer Klasse. Sie beschreiben, was ein Objekt einer Klasse tun kann.</p><p>Grundlegende Methodendeklarationen:</p><dl class="field-list simple"><dt>Syntax<span class="colon">:</span></dt><dd><p>[&#x3C;Sichtbarkeit>] &#x3C;Methodenname> [ <strong>(</strong> &#x3C;Parameterliste> <strong>)</strong> ] [ <strong>:</strong> &#x3C;Rückgabetyp>]</p></dd></dl><div><dl class="field-list"><dt>Sichtbarkeiten<span class="colon">:</span></dt><dd><p>(<em>wie bei Attributen</em>)</p></dd><dt>Parameterliste<span class="colon">:</span></dt><dd><p>Die Liste der Parameter, die die Methode erwartet.</p><dl class="field-list simple"><dt>Syntax<span class="colon">:</span></dt><dd><p>&#x3C;Übergaberichtung> &#x3C;Parametername> <strong>:</strong> &#x3C;Datentyp> [ <strong>[</strong> &#x3C;Multiplizität> <strong>]</strong> ] [ <strong>=</strong> &#x3C;Defaultwert>]</p></dd><dt>Übergaberichtung<span class="colon">:</span></dt><dd><p>Die Übergaberichtung gibt an, ob der Parameter nur gelesen (<strong>in</strong>), nur beschrieben (<strong>out</strong>) oder sowohl gelesen als auch beschrieben (<strong>inout</strong>) wird. Wird die Übergaberichtung nicht explizit angegeben, so wird <strong>in</strong> angenommen.</p></dd><dt>Multiplizität<span class="colon">:</span></dt><dd><p>(<em>wie bei Attributen</em>)</p></dd></dl></dd><dt>Rückgabetyp<span class="colon">:</span></dt><dd><p>Der Datentyp des Rückgabewertes der Methode. Es können primitive oder auch komplexe Datentypen sein.</p></dd></dl></div></ld-supplemental></ld-topic>

</div><ld-supplemental embed-in-document-flow=""><p>Um zu beschreiben, wie Instanzen der Klassen miteinander in Verbindung stehen, unterscheiden wir folgende grundlegende Beziehungen:</p><ul><li><p><strong>Assoziation</strong>: Eine Assoziation beschreibt eine Beziehung zwischen zwei Klassen. Sie kann eine Richtung haben und eine Multiplizität.</p><p>Zwischen zwei Klassen können mehrere Assoziationen bestehen.</p><p>Eine Assoziation kann zyklisch sein.</p><p>Am Ende einer Assoziation kann ein Name und eine Multiplizität stehen, die die Beziehung aus Sicht der Klasse am anderen Ende der Assoziation beschreiben.</p><p>Ein Pfeil gibt die Navigationsrichtung an.</p><p>Im Beispiel ist explizit modelliert, dass ein Cocktail immer genau von einem Bartender produziert wird. Ein Bartender kann aber mehrere Cocktails produzieren.</p><ul><li><p><strong>Aggregation</strong>: Eine Aggregation (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">◊</mi></mrow><annotation encoding="application/x-tex">\lozenge</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8034em;vertical-align:-0.1111em;"></span><span class="mord amsrm">◊</span></span></span></span></span> „am Anfang“) ist eine spezielle Form der Assoziation, bei der eine Klasse eine andere Klasse besitzt.</p><p>Im Allgemeinen sind die Unterschiede zwischen Aggregation und Assoziation nicht eindeutig bzw. ausreichend definiert, und es ist deswegen sinnvoll eine normale Assoziation zu wählen.</p><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Selbst einer der Autoren der UML Spezifikation hat bereits vor langer Zeit festgehalten:</p><blockquote><p>In spite of the few semantics attached to aggregation, everybody thinks it is necessary (for different reasons). Think of it as a modelling placebo.</p></blockquote></aside></li><li><p><strong>Komposition</strong>: Eine Komposition (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">⧫</mi></mrow><annotation encoding="application/x-tex">\blacklozenge</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8034em;vertical-align:-0.1111em;"></span><span class="mord amsrm">⧫</span></span></span></span></span> „am Anfang“) ist eine spezielle Form der Aggregation, bei der die Lebensdauer des Besitzers die Lebensdauer des Besitzten bestimmt.</p><p>Im Beispiel ist modelliert, dass ein Cocktail aus mehreren Zutaten besteht. Weiterhin gilt, dass nach dem Genuss des Cocktails die Zutaten nicht mehr existieren.</p></li></ul></li><li><p><strong>Spezialisierung und Generalisierung</strong>: Eine Klasse (<code class="java"><span class="name class">Sub</span></code>) kann von einer anderen Klasse (<code class="java"><span class="name class">Sup</span></code>) <em>erben</em> (<code class="java"><span class="name class">Sub</span></code> <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>▹</mo></mrow><annotation encoding="application/x-tex">\triangleright</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4653em;"></span><span class="mord">▹</span></span></span></span></span> <code class="java"><span class="name class">Sup</span></code>). Die abgeleitete Klasse ist eine Spezialisierung der Basisklasse, die alle Attribute und Methoden der Basisklasse übernimmt und ggf. erweitert.</p><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Technisch ist es in den meisten Programmiersprachen möglich bestehendes Verhalten ggf. so zu verändern, dass es nicht mehr kompatibel ist mit dem Verhalten der Basisklasse.</p><p><strong>Dies ist unter allen Umständen zu vermeiden, da es zu schwerwiegenden Fehlern führen kann.</strong></p><p>(Beispiele wären Methodenparameter oder Rückgabewerte, die auf einmal einen anderen Wertebereich haben. Oder, wenn andere Seiteneffekte auftreten.)</p></aside></li><li><p><strong>Assoziationsklasse</strong>: Eine Assoziationsklasse (eine Klasse verbunden mit einer Assoziation über eine gestrichelte Linie) beschreibt eine Assoziation zwischen zwei anderen Klassen detaillierter und wird insbesondere dann verwendet, wenn die Attribute und Operationen nicht sinnvoll den beteiligten Klassen zugeordnet werden können. Sie kann Attribute und Methoden haben, die die Beziehung zwischen den beiden Klassen beschreiben.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="modellierungsfehler"><h2>Modellierungsfehler</h2><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Ein falsches Verständnis — insbesondere von der <strong>Spezialisierung</strong> bzw. <strong>Generalisierung</strong> — kann zu schweren Fehlern in der Modellierung führen.</p></aside><div class="incremental margin-top-2em margin-auto" style="width: 39ch; height: 20.71ch;" aria-label="Quadrat erbt von Rechteck"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 273 145" font-size="12">
  <title>Quadrat erbt von Rechteck</title>
  <!-- Klassen 90 breit; Namensfeld 14, Operationen 30 hoch. -->
  <rect class="ld-box" x="8" y="12" width="90" height="36" />
  <text class="ld-label" x="53" y="34.2" text-anchor="middle" font-weight="bold">User</text>
  <rect class="ld-box" x="176" y="8" width="90" height="14" />
  <text class="ld-label" x="221" y="19" text-anchor="middle" font-weight="bold">Rectangle</text>
  <rect class="ld-box" x="176" y="22" width="90" height="30" />
  <text class="ld-label"><tspan x="181" y="33.5">+setWidth(…)</tspan><tspan x="181" dy="14">+setHeight(…)</tspan></text>
  <rect class="ld-box" x="176" y="92" width="90" height="14" />
  <text class="ld-label" x="221" y="103" text-anchor="middle" font-weight="bold">Square</text>
  <rect class="ld-box" x="176" y="106" width="90" height="30" />
  <text class="ld-label"><tspan x="181" y="117.5">+setWidth(…)</tspan><tspan x="181" dy="14">+setHeight(…)</tspan></text>
  <path class="ld-line" d="M 98.6 30 H 173.6" marker-end="url(#ld-arrow-open)" />

</svg>
</div><ld-supplemental embed-in-document-flow=""><p>Der schwerwiegende Modellierungsfehler, der in diesem Beispiel gemacht wurde, ist einfach. Es wurde bei der Modellierung vergessen, dass es bei der Programmierung ggf. nicht nur um mathematische Konzepte geht, sondern auch das Verhalten zu berücksichtigen ist.</p><p>In Hinblick auf das Verhalten ist es falsch, dass ein Quadrat von einem Rechteck erbt. Ein Quadrat ist ein Spezialfall eines Rechtecks, bei dem die Seitenlängen gleich sind. Würden wir in unserem Code glauben, dass wir - zum Beispiel - die Breite eines Rechtecks verändern, da der Datentyp <code class="java"><span class="name class">Rectangle</span></code> ist, sich hinter dem <code class="java"><span class="name class">Rectangle</span></code> ein Objekt vom Typ <code class="java"><span class="name class">Square</span></code> verbergen, dann würde sich auch die Höhe des <code class="java"><span class="name class">Rectangle</span></code> verändern. Das ist nicht das Verhalten, das wir als Nutzer einer Instanz der Klasse erwarten würden.</p></ld-supplemental></ld-topic>
<ld-topic class="exercises" id="klassenraumubung"><h2>Klassenraumübung</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Modellierung einer Reise"><p class="ld-exercise-title rubric"><span>Modellierung einer Reise</span></p><ul class="simple"><li><p>Eine Reise hat einen Start- und einen Zielort sowie ein Start- und ein Enddatum.</p></li><li><p>Eine Reise kann von mehreren Reisenden unternommen werden.</p></li><li><p>Eine Reise kann aus mehreren Teilreisen bestehen.</p></li><li><p>Eine Teilreise hat einen Start- und einen Zielort sowie ein Start- und ein Enddatum.</p></li><li><p>Eine Teilreise kann mit verschiedenen Verkehrsmitteln durchgeführt werden: Flugzeug, Zug, Auto oder Schiff.</p></li><li><p>Jedes Verkehrsmittel hat spezifische Eigenschaften (z. B. Flugnummer für Flugzeuge, Kennzeichen für Autos, etc.).</p></li></ul></div></ld-topic>
<ld-topic class="exercises" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Modellierung einer einfachen Bibliotheksverwaltung"><p class="ld-exercise-title rubric"><span>Modellierung einer einfachen Bibliotheksverwaltung</span></p><p>Modellieren Sie eine einfache Bibliotheksverwaltung mit Hilfe eines Klassendiagramms.</p><ul class="simple"><li><p>Es gibt Bücher, die von Autoren geschrieben werden.</p></li><li><p>Ein Buch kann in mehreren Exemplaren vorhanden sein.</p></li><li><p>Ein Buch hat einen Titel, einen Autor und eine ISBN-Nummer.</p></li><li><p>Ein Autor hat einen Namen und ein Geburtsdatum.</p></li><li><p>Ein Exemplar hat eine eindeutige Nummer.</p></li><li><p>Jedes Exemplar ist entweder ausgeliehen oder verfügbar.</p></li><li><p>Ein Ausleiher hat einen Namen und eine Adresse.</p></li></ul><p>Modellieren Sie auch explizit die Beziehungen zwischen den Klassen – inkl. Multiplizitäten.</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:Ze9duV59stS6sGZRB9afCa0j4UjS6ptdl6hYNOL112U=:SUNANo9/JC0BHAcH:iNTyHXKsqGw36kjWXFiKvA08Es5r/2wLQXL5ZwVZDsYPW3UvV7Qh2qAhOj9P5TYSn4UXsYdRCvnROPSlmAHKbPR28nvgkt4upRJ/5Jr8iZT7o4A3yoBqBjhoOvDb3i8WfPRDgov0LoQ5mnwwsSYPHAN1MzXLqNDbmx6Q7o5azzhX90Nmg9CS8XWiSGbeQiF7/tirSC892v35MObwyVglpwFtGq1uiMPdD83uH9S8MdaaAQ3RXLgW13gRZ4rQicjYlafl/iNPNrrBGbYT3VDX2fLlYHyb9iU1iuebKF0WCF04mkjDPryzfkHD2q1vetohzFQD/o7FjXGLUBrzAJsrrA1apDLoCUE64/7JEnyOV2DQKKmir5+PRXVTZYdIq4nWyXWQHYuK/ROXvUJFaWO1rs1kJWZrcvgV1YKdWXb6e6qQcgNcxK0ZXrJ8g+54DaztbvC56Rh7+07/QK3WlLPqEJZVmm6IDhh5E0zc5nAkTFq3DAcMO+fgl0Dhkq1mxWirAuUrvJB97vjfA/TrImDM8TE3D5XPoEI4mqedT06qsUqFaTZxMH+A4hHZiyhe11m2dX2ZZSEtE3PC2PPKWNBD3Jyj8ZrDmESfS+1j8jRcdhJ0e9F/G+2mvYqdaERxqhDFnRuf4yoo8QLNRWc4DCSn9KkpA5QX6C0FF0rtzrux2EmCCrxyJnq5uwjTtzUMPJQLpmEoKmlg9rhmXGE6uNXkJzFkl18nAhzHG6u261G0VajRFhiwagc4nu+3Pavjr0L6mh/Z6u8nklA+ckkxvKfitrFmeNfXKrc4Xac+Ukd7p2+iEwsgwZzNNUjU6VR+aqfDnuvgBmh+9oUZKoq1/shhvAfx6eMLzNZ266zWFWQioFGdVND9joNe2vvWJ80FkVZf7r <ld-topic class="exercises" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-3" data-exercise-id="3" data-exercise-title="3 - Darstellung von mathematischen Ausdrücken."><p class="ld-exercise-title rubric"><span>Darstellung von mathematischen Ausdrücken.</span></p><p>Ihre Aufgabe ist es, mathematische Ausdrücke mit Hilfe von Klassen und Objekten zu repräsentieren. Diesbezüglich erstellen Sie einen objektorientierten Entwurf mit Hile von UML. Zum Beispiel wollen Sie einen Ausdruck wie <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo stretchy="false">)</mo><mo>⋅</mo><mi>c</mi></mrow><annotation encoding="application/x-tex">(a + b) \cdot c</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">b</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">c</span></span></span></span></span> oder auch einen Ausdruck wie <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mfrac><mi>a</mi><mi>b</mi></mfrac></mrow><annotation encoding="application/x-tex">\frac{a}{b}</annotation></semantics></math></span><span class="katex-html" aria <ld-topic class="exercises" id="hausubung"><h2>Hausübung</h2><div class="ld-exercise" id="ld-exercise-4" data-exercise-id="4" data-exercise-title="4 - Modellierung eines einfachen Kursmanagementsystems für Universitäten"><p class="ld-exercise-title rubric"><span>Modellierung eines einfachen Kursmanagementsystems für Universitäten</span></p><p>Erstellen Sie ein passendes UML-Diagramm.</p><div class="smaller"><ul class="simple"><li><p>Eine Vorlesung hat immer einen Namen, eine Nummer und einen Raum.</p></li><li><p>Manchmal hat eine Vorlesung auch Teilnehmer.</p></li><li><p>Ein Dozent liest ggf. mehrere Vorlesungen.</p></li><li><p>Ein Student besucht in der Regel eine oder mehrere Vorlesungen.</p></li><li><p>Zu einer Vorlesung gibt es ggf. mehrere optionale Übungen.</p></li><li><p>Eine Prüfung kann entweder eine Klausur oder eine Portfolio-Prüfung sein. Letztere besteht aus einer Präsentation zu einem Thema und einer schriftlichen Ausarbeitung. Beide haben eine festgelegte Anzahl an Punkten. Die Endnote ergibt sich aus dem Durchschnitt der beiden Noten.</p></li><li><p>Hat die Veranstaltung eine Portfolio-Prüfung, dann ist jeder Studierende für das gesamte Semester einer bestimmten Studiengruppe zugeordnet.</p></li></ul></div></div></ld-topic>
