<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="lecture-ds-architectures"><h1 class="title">Architectures of Distributed Applications</h1><p>A first overview.</p><dl class="field-list simple"><dt>Lecturer<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></p></dd><dt>Contact<span class="colon">:</span></dt><dd><p><a class="reference external" href="mailto:michael.eichberg@dhbw.de">michael.eichberg@dhbw.de</a>, Raum 149B</p></dd><dt>Version<span class="colon">:</span></dt><dd><p>1.0.1.1</p></dd></dl><ld-supplemental><dl class="field-list"><dt>Slides<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/ds-architectures/folien.en.md.html">https://delors.github.io/ds-architectures/folien.en.md.html</a></p><p><a class="reference external" href="https://delors.github.io/ds-architectures/folien.en.md.html.pdf">https://delors.github.io/ds-architectures/folien.en.md.html.pdf</a></p></dd><dt>Reporting issues<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://github.com/Delors/delors.github.io/issues">https://github.com/Delors/delors.github.io/issues</a></p></dd></dl><dl class="field-list simple"><dt>AI Usage<span class="colon">:</span></dt><dd><p>AI assistants (in particular Claude, but also ChatGPT, Ollama with
Gemma/LLama/Qwen, OpenCode with Kimi, etc.) were used to assist in the
creation of the slides. This was done, for example, to efficiently generate
graphics (i.e. SVG files), or to generate summary tables. Furthermore, AI was
used for general quality assurance. Content that may have been suggested by
an AI was explicitly validated and adapted whenever it was incorporated.</p></dd></dl></ld-supplemental><div class="footer-left"><p>Selected slides are based on slides by Maarten van Steen (<em>Distributed Systems</em>)</p><p>All errors are my own.</p></div></ld-topic>
<ld-topic class="transition-fade new-section" id="basic-architectures"><h2>Basic architectures</h2></ld-topic>
<ld-topic id="architectural-styles"><h2>Architectural Styles</h2><p>An architectural style is formulated in the form of</p><ul class="incremental-list simple"><li><p>(interchangeable) components with clearly defined interfaces</p></li><li><p>the way in which the components are connected to each other</p></li><li><p>the data exchanged between the components</p></li><li><p>the way in which these components and connections are configured together to form a system System.</p></li></ul><ld-supplemental><p class="rubric">Connector</p><p>A mechanism that mediates communication, coordination or co-operation between components. Example: Facilities for (remote) procedure calls (RPC), message transmission or streaming.</p></ld-supplemental></ld-topic>
<ld-topic id="layered-architectures"><h2>Layered Architectures</h2><ul class="columns incremental-list"><li><object class="light-image align-center" data="drawings/common_application_architectures/n-layered_architectures.svg" type="image/svg+xml" role="img"></object></li><li><object class="light-image align-center" data="drawings/common_application_architectures/n-layered_architectures-jump_over_layers.svg" type="image/svg+xml" role="img"></object></li><li><object class="light-image align-center" data="drawings/common_application_architectures/n-layered_architectures-and-callbacks.svg" type="image/svg+xml" role="img"></object></li></ul></ld-topic>
<ld-topic id="example-of-a-3-tier-architecture"><h2>Example of a 3-tier Architecture</h2><object class="light-image align-center" data="drawings/common_application_architectures/3-layered-example.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="traditional-architectures"><h2>Traditional Architectures</h2><object class="light-image align-center" data="drawings/common_application_architectures/common_architectures.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p class="rubric">Traditional 3-tier Architecture</p><p>This architecture can be found in many distributed information systems with traditional database technology and associated applications.</p><ul class="simple"><li><p>The presentation layer represents the interface to users or external applications.</p></li><li><p>The processing layer implements the business logic.</p></li><li><p>The persistence/data layer is responsible for data storage.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="publish-and-subscribe-architectures"><h2><em>Publish and Subscribe</em> Architectures</h2><p>Dependencies between the components are realised using the <em>Publish and Subscribe</em> paradigm with the aim of loose coupling.</p><ld-deck class="incremental"><ld-card><p><strong>Taxonomy of coordination approaches with regard to communication and coordination:</strong></p><table class="highlight-row-on-hover"><colgroup><col style="width: 13.0%"><col style="width: 43.5%"><col style="width: 43.5%"></colgroup><thead><tr><th class="stub head"></th><th class="head"><p>Coupled in time</p></th><th class="head"><p>Decoupled in time</p></th></tr></thead><tbody><tr><th class="stub"><p>Referentially coupled</p></th><td><p>Direct Coordination</p></td><td><p>Mailbox Coordination</p></td></tr><tr><th class="stub"><p>Referentially decoupled</p></th><td><p>Event-based Coordination</p></td><td><p>Shared Data Space</p></td></tr></tbody></table></ld-card><ld-card class="incremental"><p class="rubric">Event-based Coordination</p><object class="light-image align-center" data="drawings/pubsub/event-based.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="incremental"><p class="rubric"><em>Shared Data Space</em></p><object class="light-image align-center" data="drawings/pubsub/shared-data-space.svg" type="image/svg+xml" role="img"></object></ld-card></ld-deck><div class="incremental"><p><em>Event-based coordination</em> in combination with <em>shared data space</em> is often used to realise publish and subscribe architectures.</p></div><ld-supplemental><p class="rubric">Direct coordination</p><p>A process interacts directly (⇒ temporal coupling) with exactly one other well-defined process (⇒ referential coupling).</p><p class="rubric">Mailbox coordination</p><p>The processes communicating with each other do not interact directly with each other, but via a unique mailbox (⇒ referential coupling). This means that the processes do not have to be available at the same time.</p><p class="rubric">Event-based coordination</p><p>A process triggers events to which <em>any</em> other process reacts directly. A process that is not available at the time the event occurs does not see the event.</p><p class="rubric">Shared data storage</p><p>Processes communicate via tuples that are stored in a shared data space. A process that is not available at the time of writing can read the tuple later. Processes define patterns with regard to the tuples they want to read.</p></ld-supplemental><!--TODO Expand the discussion of PubSub architectures.--></ld-topic>
<ld-topic id="structure-of-cloud-computing-applications"><h2>Structure of cloud computing applications</h2><object class="light-image align-center" data="drawings/cloud.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>A distinction can be made between four layers:</p><ul class="list-with-explanations"><li><p>Hardware: processors, routers, power supply and cooling systems.</p><p>Normally completely transparent for customers.</p></li><li><p>Infrastructure: Use of virtualization techniques for the purpose of allocating and managing virtual storage and virtual servers.</p></li><li><p>Platforms: Provides higher level abstractions for storage and the like.</p><p>Example: The Amazon S3 storage system provides an API for (locally created) files that can be organized and stored in so-called buckets.</p></li><li><p>Application: Actual applications, such as office suites (word processing programmes, spreadsheet programmes, presentation applications).</p><p>Comparable to the suite of applications that are delivered with operating systems.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-fade" id="microservices-newman2021"><h2>Microservices <a class="citation-reference" href="#newman2021" id="citation-reference-1" role="doc-biblioref">[Newman2021]</a></h2></ld-topic>
<ld-topic class="no-title" id="microservice-with-rest-interface"><h2>Microservice with REST Interface</h2><ul class="columns"><li><p class="rubric">Microservices</p><p>A simple microservice that offers a REST interface and emits events.</p><div class="incremental question"><p>Where are the challenges?</p></div></li><li><object class="light-image align-center" data="drawings/microservices/base_example.svg" type="image/svg+xml" role="img"></object></li></ul><ld-supplemental><p>A major challenge is the design of the interfaces. To achieve true independence, the interfaces must be very well defined. If the interfaces are not clearly defined or inadequate, this can lead to a lot of work and coordination between the teams, which is actually undesirable!</p></ld-supplemental></ld-topic>
<ld-topic id="key-concepts-of-microservices"><h2>Key Concepts of Microservices</h2><ul class="incremental-list list-with-explanations"><li><p>can be deployed independently/are independently deployable</p><p>(... and are developed independently.)</p></li><li><p>model a business domain</p><p>(Often along a bounded context or an aggregate determined using DDDs.)</p></li><li><p>manage their own state</p><p>(I.e. they have no shared database.)</p></li><li><p>are small</p><p>(Small enough to be developed by (max.) one team.)</p></li><li><p>flexible in terms of scalability, robustness and the used technologies</p></li><li><p>allow the architecture to be aligned with the organization (see Conway's Law)</p></li></ul></ld-topic>
<ld-topic id="microservices-and-conway-s-law"><h2>Microservices and Conway's Law</h2><ul class="columns incremental-list"><li><p class="rubric">Traditional Layered Architectures</p><object class="light-image align-center" data="drawings/microservices/traditional-architecture-scope-of-change.svg" type="image/svg+xml" role="img"></object></li><li><p class="rubric">Microservices Architectures</p><object class="light-image align-center" data="drawings/microservices/microservices-architecture-scope-of-change.svg" type="image/svg+xml" role="img"></object></li></ul></ld-topic>
<ld-topic id="microservices-and-usage-of-technologies"><h2>Microservices and Usage of Technologies</h2><p>Microservices are flexible with regard to the use of technology and enable the use of “the most suitable” technology.</p><object class="light-image align-center" data="drawings/microservices/technological-flexibility.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic class="vertical-title" id="aktuelle-standardtechnologien"><h2>Aktuelle Standardtechnologien</h2><ld-deck><ld-card><img class="screenshot align-center" src="screenshots/tiobe_2012-04.webp" height="969"><p>Quelle: TIOBE Programming Community Index - April 2012</p></ld-card><ld-card class="incremental"><img class="screenshot align-center" src="screenshots/tiobe_2024-02.webp" height="969"><p>Quelle: <a class="reference external" href="https://www.tiobe.com/tiobe-index/">TIOBE Programming Community Index - Feb. 2024</a></p></ld-card></ld-deck></ld-topic>
<ld-topic id="microservices-and-scalability"><h2>Microservices and Scalability</h2><p>Well designed microservices can also be scaled very well.</p><object class="light-image align-center" data="drawings/microservices/scalability.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="implementation-of-a-long-lived-transactions"><h2>Implementation of a long-lived transactions?</h2><object class="light-image align-center" data="drawings/sagas/transaction.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>The implementation of transactions is one of the biggest challenges in the development of microservices.</p></ld-supplemental></ld-topic>
<ld-topic id="using-sagas-for-long-lived-transactions"><h2>Using SAGAs for long-lived transactions</h2><object class="light-image align-center" data="drawings/sagas/transaction-using-saga.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>A <em>saga</em> is a sequence of actions that are executed to implement a long-lived transaction.</p><p>Sagas cannot guarantee atomicity. However, each system can guarantee atomicity (e.g. by using traditional database transactions).</p><p>If the transaction needs to be aborted, a traditional <em>rollback</em> cannot be performed. The saga must then carry out the corresponding compensating transactions, which undo all previously successful actions.</p></ld-supplemental></ld-topic>
<ld-topic id="minimize-the-probability-of-possible-rollbacks"><h2>Minimize the probability of possible <em>rollbacks</em></h2><object class="light-image align-center" data="drawings/sagas/transaction-using-saga-with-less-rollbacks.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>The processing sequence of the actions can be optimized to minimize the probability of <em>rollbacks</em>. In this case, the probability of a <em>rollback</em> occurring during the "package and send order” step is significantly higher than for the “award customer bonus” step.</p></ld-supplemental></ld-topic>
<ld-topic id="long-lived-transactions-with-orchestrated-sagas"><h2>Long-lived transactions with orchestrated sagas</h2><object class="light-image align-center" data="drawings/sagas/orchestrated-saga.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>The orchestrated saga is one way of implementing long-lived transactions.</p><ul class="positive-list simple"><li><p>Conceptually simple</p></li></ul><ul class="negative-list list-with-explanations"><li><p>High degree of <em>domain coupling</em></p><p>As this is essentially domain-driven coupling, this coupling is often acceptable. The coupling does not generate any technical debt.</p></li><li><p>High degree of <em>request-response</em> interactions</p></li><li><p>Risk that functionality that would be better accommodated in the individual services (or possibly new services) is moved to the ordering service.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="long-lived-transactions-with-choreographed-sagas"><h2>Long-lived transactions with choreographed sagas</h2><object class="light-image align-center" data="drawings/sagas/choreographed-saga.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>A major problem with choreographed sagas is keeping track of the current status. This problem can be alleviated by using a “correlation ID”.</p></ld-supplemental></ld-topic>
<ld-topic id="dual-write-problem"><h2><em>Dual-write Problem</em></h2><ld-deck><ld-card><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><object class="light-image align-center" data="drawings/dual-write/no-crash-no-problem.svg" type="image/svg+xml" role="img"></object></ld-cell><ld-cell style="align-self:auto;"><p>Where could there be a problem?</p><aside class="admonition incremental" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warning</p><p>Writing to two different systems (here: database and event-processing middleware) always requires a transactional context.</p><p>If this cannot be established, inconsistencies can occur (<em>dual-write problem</em>).</p></aside></ld-cell></ld-grid></ld-card><ld-card class="incremental"><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><object class="light-image align-center" data="drawings/dual-write/crash.svg" type="image/svg+xml" role="img"></object></ld-cell><ld-cell style="align-self:auto;"><p class="rubric">Solution Ideas</p><ul class="incremental-list negative-list simple"><li><p>2PC is not an option in the context of microservices (too slow, too complex)</p></li><li><p>Changing the order of actions (1st <em>publish</em> then 2nd <em>update</em>) still leads to inconsistencies</p></li><li><p>notifying the event processing middleware (synchronously) - i. e. as part of the database update - is also not an option:</p><ul class="negative-list simple"><li><p>What happens if the middleware cannot be reached?</p></li><li><p>What happens if the event cannot be processed?</p></li></ul></li></ul><div class="incremental assessment"><p>Strict consistency cannot be achieved.</p></div></ld-cell></ld-grid></ld-card></ld-deck></ld-topic>
<ld-topic id="dual-write-problem-outbox-pattern"><h2><em>Dual-write Problem</em> - Outbox Pattern</h2><object class="light-image align-center" data="drawings/dual-write/outbox-pattern.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p class="rubric"><em>(a) Solution: Outbox Pattern</em></p><ul class="simple"><li><p>The actions are (additionally) saved in an outbox table and then processed <strong>asynchronously</strong>.</p></li><li><p>This enables <em>eventual consistency</em> to be achieved.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic class="no-title center-content transition-fade" id="choosing-the-right-architecture-is-a-trade-off"><h2>Choosing the right architecture is a trade-off!</h2><div class="accentuate"><p>The choice of software architecture is always a consideration of many trade-offs!</p></div><ld-supplemental><p>Other aspects that can/must be considered:</p><ul class="simple"><li><p>Cloud (and possibly serverless)</p></li><li><p>Mechanical Sympathy</p></li><li><p>Testing and deployment of microservices (keyword: <em>Canary Releases</em>)</p></li><li><p>Monitoring and logging</p></li><li><p>Service meshes</p></li><li><p>...</p></li></ul></ld-supplemental></ld-topic>
