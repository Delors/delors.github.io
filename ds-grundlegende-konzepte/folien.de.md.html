<ld-topic class="center-content" id="section-1"><h2></h2><p>Die folgenden Konzepte sind für die Entwicklung verteilter Systeme von zentraler Bedeutung und sind in vielen aktuellen Middlewareprodukten umgesetzt.</p></ld-topic>
<ld-topic class="new-section transition-fade" id="zeit-in-verteilten-systemen"><h2>Zeit in verteilten Systemen</h2></ld-topic>
<ld-topic id="von-der-bedeutung-der-zeit-in-verteilten-systemen"><h2>Von der Bedeutung der Zeit in verteilten Systemen</h2><ul class="simple"><li><p>Updates, die über mehrere Systeme hinweg erfolgen, müssen in korrekter Reihenfolge erfolgen.</p></li><li><p>Log-Einträge sollen in korrekter Reihenfolge erfolgen.</p></li><li><p>Gültigkeit von Berechtigungen (z. B. Zertifikate)</p></li><li><p>geographische Positionsbestimmung (z. B. GPS)</p></li></ul></ld-topic>
<ld-topic id="probleme-wenn-die-zeit-nicht-korrekt-ist"><h2>Probleme, wenn die Zeit nicht korrekt ist</h2><blockquote class="epigraph"><p>A recent surge in GPS “spoofing”, a form of digital attack which can send commercial airliners off course, has entered an intriguing new dimension, according to cybersecurity researchers: The ability to hack time. [...]</p><p>“We think too much about GPS being a source of position, but it's actually a source of time,” [...]  “We're starting to see reports of the clocks on board airplanes during spoofing events start to do weird things."
In an interview with Reuters, Munro [at Defcon] cited a recent incident in which an aircraft operated by a major Western airline had its onboard clocks suddenly sent forward by years, causing the plane to lose access to its digitally-encrypted communication systems.</p><p class="attribution">—<a class="reference external" href="https://www.reuters.com/technology/cybersecurity/gps-spoofers-hack-time-commercial-airlines-researchers-say-2024-08-10/">11. August, 2024 - GPS spoofers 'hack time' on commercial airlines</a></p></blockquote></ld-topic>
<ld-topic class="transition-scale" id="verteilte-systeme-reale-vs-logische-zeit"><h2>Verteilte Systeme: Reale vs. logische Zeit</h2><ld-deck><ld-card><p class="rubric">Reale Zeit</p><dl class="field-list simple"><dt>Sonnensekunde<span class="colon">:</span></dt><dd><p>bezieht sich auf die Zeitspanne zwischen aufeinanderfolgenden Sonnenhöchstständen.</p></dd></dl><dl class="incremental field-list"><dt>Atomzeitsekunde<span class="colon">:</span></dt><dd><p>Bezugspunkt ist die Schwingungsdauer eines Cäsium-133-Atoms.</p><p>TAI (Temps Atomique International): Durchschnittszeit der Atomuhren von über 60 Instituten weltweit (z. B. Braunschweig), ermittelt vom BIH (Bureau International de l’Heure) in Paris.</p></dd></dl><dl class="incremental field-list simple"><dt>UTC (Universal Coordinated Time)<span class="colon">:</span></dt><dd><p>Basiert auf TAI; aktuell ist noch das Einfügen gelegentlicher Schaltsekunden zur Anpassung an den Sonnentag erforderlich. Ab 2035 wird die Schaltsekunde voraussichtlich abgeschafft.</p></dd></dl></ld-card><ld-card class="incremental"><p class="rubric">Logische Zeit</p><p>Die logische Zeit ermöglicht es uns, eine wohldefinierte Reihenfolge zwischen Ereignissen (vgl. <span class="eng">happened before</span> Relation) zu bestimmen. <em>Häufig</em> ist dies für verteilte Systeme ausreichend.</p></ld-card></ld-deck></ld-topic>
<ld-topic id="computeruhrzeit"><h2>Computeruhrzeit</h2><ul class="incremental-list list-with-explanations"><li><p>Real-time Clock (RTC): interne batteriegepufferte Uhr.</p><p>(Die Genauigkeit und Auflösung sind teilweise sehr grob.)</p></li><li><p>Funkuhr (DCF77 aus Mainflingen, ca. 2000 km Reichweite)</p></li><li><p>GPS-Signal (Global Positioning System) mit einer  Auflösung von ca. 100 ns</p></li><li><p>mittels Nachrichtenaustausch mit einem Zeitserver</p></li></ul></ld-topic>
<ld-topic id="uhrensynchronisation-nach-christian"><h2>Uhrensynchronisation nach Christian</h2><p><span class="peripheral">(Probabilistic Clock Synchronisation, 1989)</span></p><ul class="simple"><li><p>Voraussetzung: zentraler Zeitserver mit UTC.</p></li><li><p>Clients fragen periodisch nach und korrigieren um halbe Antwortzeit.</p></li><li><p>Client-Uhren werden niemals zurückgesetzt sondern ggf. nur verlangsamt bzw. beschleunigt.</p></li></ul></ld-topic>
<ld-topic id="network-time-protocol-ntp-rfc-5905"><h2>Network Time Protocol (NTP, RFC 5905)</h2><ul class="incremental-list list-with-explanations"><li><p>Synchronisierung auf UTC</p><ul class="simple"><li><p>im lokalen Netz mit einer Genauigkeit von bis zu 200 Mikrosekunden</p></li><li><p>im Internet mit einer Genauigkeit von 1-10 Millisekunden</p></li></ul></li><li><p>Hierarchie von Zeitservern</p><p>Stratum 0: Quelle - z. B. DCF77-Zeitzeichensender</p><p>Stratum 1: Primärserver</p><p>Stratum 2,...: Sekundär-/...server</p><p>Clients</p></li><li><p>Wechselseitiger Austausch von Zeitstempeln zwischen den Server-Rechnern wird unterstützt (NTP ist symmetrisch).</p></li></ul><ld-supplemental><p>Aktualisierung der Zeit eines NTP Servers erfolgt aber nur wenn der anfragende Server einen höheren <em>Stratum</em>wert hat (d. h. potentiell unpräziser ist) als der angefragte Server. Der anfragende Server erhält danach den Stratumwert des abgefragten Servers <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>+</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">+1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">+</span><span class="mord">1</span></span></span></span></span>.</p></ld-supplemental></ld-topic>

></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">4</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></div><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Eine exakte Uhrensynchronisation ist in einem asynchronem System nicht realisierbar!</p></aside><ld-supplemental><p>Es wird die Annahme getroffen, dass die Zeit auf beiden Rechnern quasi gleichschnell vergeht. Die Zeitdifferenz zwischen den beiden Rechnern ist also konstant.</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><msub><mi>T</mi><mn>3</mn></msub><mo>−</mo><msub><mi>T</mi><mn>2</mn></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(T_3 - T_2)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span> ist die Zeit, die der Server zum Bearbeiten benötigt.</p><p>Die Round-Trip-Time (RTT) ist die Zeit, die ein Signal benötigt, um von einem Rechner zum anderen und zurückzugelangen.</p><p>Der Gangunterschied ist die Differenz zwischen der Zeit auf dem Server und der Zeit auf dem Client.</p><p>Probleme bei der Uhrensynchronisation entstehen aufgrund ungewisser Latenzen:</p><ul class="simple"><li><p>Nachrichtenübertragungszeit (abhängig von Entfernung und Medium)</p></li><li><p>Zeitverzögerung in Routern bei Weitervermittling (lastabhängig)</p></li><li><p>Zeit bis zur Interrupt-Annahme im Betriebssystem (kontextabhängig)</p></li><li><p>Zeit zum Kopieren von Puffern (lastabhängig)</p></li></ul><p>Aufgrund der Probleme ist ein konsistenter, realistischer globaler Schnappschuss nicht realisierbar.</p></ld-supplemental></ld-topic>
<ld-topic id="beispiel-zur-berechnung-des-gangunterschieds"><h2>Beispiel zur Berechnung des Gangunterschieds</h2><div class="incremental"><p>Sei die Latenz 5 ms und die Bearbeitungszeit 2 ms.</p><p>Weiterhin sei <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mn>110</mn></mrow><annotation encoding="application/x-tex">T_1 = 110</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">110</span></span></span></span></span> und <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>100</mn></mrow><annotation encoding="application/x-tex">T_2 = 100</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">100</span></span></span></span></span>. D. h. der Client geht offensichtlich vor.</p></div><div class="incremental margin-top-2em"><p>Da die Bearbeitungszeit des Servers 2 ms beträgt, gilt für <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>3</mn></msub></mrow><annotation encoding="application/x-tex">T_3</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> und <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>4</mn></msub></mrow><annotation encoding="application/x-tex">T_4</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">4</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span>:</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>3</mn></msub><mo>=</mo><mn>102</mn></mrow><annotation encoding="application/x-tex">T_3 = 102</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">102</span></span></span></span></span> und</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>T</mi><mn>4</mn></msub><mo>=</mo><mn>110</mn><mo>+</mo><mo stretchy="false">(</mo><mn>2</mn><mo>×</mo><mn>5</mn><mo stretchy="false">)</mo><mo>+</mo><mn>2</mn><mo>=</mo><mn>122</mn></mrow><annotation encoding="application/x-tex">T_4 = 110+(2 \times 5) +2 = 122</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">4</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">110</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord">2</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">5</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">122</span></span></span></span></span>.</p></div><div class="incremental margin-top-2em"><p>Somit ergibt sich der Gangunterschied zu:</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>=</mo><mfrac><mrow><mo stretchy="false">(</mo><mn>100</mn><mo>−</mo><mn>110</mn><mo stretchy="false">)</mo><mo>−</mo><mo stretchy="false">(</mo><mn>122</mn><mo>−</mo><mn>102</mn><mo stretchy="false">)</mo></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mo stretchy="false">(</mo><mo>−</mo><mn>10</mn><mo>−</mo><mn>20</mn><mo stretchy="false">)</mo></mrow><mn>2</mn></mfrac><mo>=</mo><mo>−</mo><mn>15</mn></mrow><annotation encoding="application/x-tex">x = \frac{(100-110) - (122-102)}{2} = \frac{(-10 - 20)}{2} = -15</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1.355em;vertical-align:-0.345em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.01em;"><span style="top:-2.655em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">2</span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.485em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mopen mtight">(</span><span class="mord mtight">100</span><span class="mbin mtight">−</span><span class="mord mtight">110</span><span class="mclose mtight">)</span><span class="mbin mtight">−</span><span class="mopen mtight">(</span><span class="mord mtight">122</span><span class="mbin mtight">−</span><span class="mord mtight">102</span><span class="mclose mtight">)</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.345em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1.355em;vertical-align:-0.345em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.01em;"><span style="top:-2.655em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">2</span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.485em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mopen mtight">(</span><span class="mord mtight">−</span><span class="mord mtight">10</span><span class="mbin mtight">−</span><span class="mord mtight">20</span><span class="mclose mtight">)</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.345em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">−</span><span class="mord">15</span></span></span></span></span> ms.</p></div></ld-topic>
<ld-topic class="center-content" id="logische-zeit"><h2>Logische Zeit</h2><div class="assessment"><p>Für die konsistente Sicht von Ereignissen in einem verteilten System ist die reale Zeit in vielen Fällen nicht wichtig!</p><p>Wir benötigen nur eine global eindeutige Reihenfolge der Ereignisse; d. h. wir benötigten Zeitstempel.</p><p>Jedoch beeinflussen sich nicht alle Ereignisse untereinander; d. h. sind kausal unabhängig.</p></div><ld-supplemental><p>Es ist wichtig zu wissen, was vorher und was nachher passiert ist, aber es ist nicht wichtig, dass wir wissen wann genau (Uhrzeit) etwas passiert ist.</p></ld-supplemental></ld-topic>
<ld-topic id="lamport-uhren-logical-clocks"><h2>Lamport-Uhren (<em>logical clocks</em>)</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>Ein Ereignis (<em>write</em>, <em>send</em>, <em>receive</em>) ist eine Zustandsänderung in einem Prozess.</p></aside><p class="rubric">Vorgehensweise</p><dl class="field-list simple"><dt>vor <em>write</em> und <em>send</em><span class="colon">:</span></dt><dd><p>erhöhen der lokalen Zeit T<sub>local</sub> = T<sub>local</sub> + 1</p></dd><dt><em>send</em> immer inklusive Zeitstempel<span class="colon">:</span></dt><dd><p>T<sub>msg</sub> = T<sub>local</sub></p></dd><dt>vor <em>receive</em><span class="colon">:</span></dt><dd><p>T<sub>local</sub> = max(T<sub>local</sub>,T<sub>local</sub>) + 1</p></dd></dl><div class="incremental"><p>Ereignis <em>receive</em> ist zeitlich immer nach <em>send</em>.</p><p>Ereignisse werden eingeordnet nach der „happened-before“ Relation: <strong>a → b</strong></p><p>(a happened-before b)</p></div><div class="incremental"><p>Resultat: es ergibt sich eine partielle Ordnung (partial ordering) der Ereignisse.</p><p>Ein konsistenter Schnappschuss enthält zu jedem Empfangs- das entsprechende Sendeereignis.</p></div><ld-supplemental><p>Lamport Uhren sind eine Möglichkeit, um <em>Totally-ordered Multicasts</em> zu unterstützen, was insbesondere im Zusammenhang mit Replication von Nöten ist.</p></ld-supplemental></ld-topic>
<ld-topic class="exercises transition-scale" id="ubung"><h2>Übung</h2><ld-scrollable><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Lamport-Uhren"><p class="ld-exercise-title rubric"><span>Lamport-Uhren</span></p><p>Gegeben sei die nachfolgend dargestellte Situation mit drei Prozessen in einem verteilten System. Die Zeitstempel der Ereignisse werden mittels der Lamport'schen Uhren vergeben.
(Die Werte <strong>lc</strong> ganz links, geben den Stand der jeweiligen Uhren zu Beginn an.)</p><ol class="loweralpha simple"><li><p>Versehen Sie alle Ereignisse mit den korrekten Zeitstempeln.</p></li><li><p>Geben Sie einen konsistenten Sicherungspunkt an, der Ereignis r enthält.</p></li></ol><object class="light-image align-center" data="drawings/lamport-exercise/task.svg" type="image/svg+xml" role="img"></object><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:3tx4yoqxwdGB19ZIZDHDDcePbFI9/mW9ypzKSc/Y1/4=:jg81ynjZRvQ3Fuhc:HRQOoqY6H0KA2I1Bhy23HTiQZsXNBRKnl0SxgZSy6CsGJyHwIfEY0FvF17+/F4HrrwLTSi4eXYcP8p3/MzUInHalJkJCTFTMfmBZdRV5nxC5hsYVsn9LH7yHcxYwxy7Z4txtl2Jgp6LlZF7xSy3FA1DB+GNRw1NqrnkN0rqgZHdgQMhsmeJJ1uN2CcIe3wwxhVbw7LGDHcMc/490vrtSG6N9CtvoNw2PivAcowgcuPRtkfS7wdBZEMhJ9YoC3PMDb1ZJ7vyoSeDPIlMb2Fqoni6tEG4khc0imRun1JQLSAo7dGQuJQTzwWtA/e5nIyXgFlrWiGX5tlVKyZWnsK68LRqre/WApSP8G7MG39f42+cNCcx1zX806gN9NMuoKhwOE+G81sucwMj/8m9CtoIRZ1ESfbwn8fZeEf1tHUo2N425hfIyIHwc9SeNgEX/KX2FnYc9JhlA9w==</div></div></ld-scrollable></ld-topic>
<ld-topic class="new-section" id="verteilte-transaktionen"><h2>Verteilte Transaktionen</h2></ld-topic>
<ld-topic id="atomic-commit-protocol"><h2>„Atomic Commit Protocol“</h2><ul class="incremental-list"><li><p>Verteilte Transaktion erstrecken sich über mehrere Prozesse und meist auch über mehrere Knoten in einem verteilten System.</p></li><li><p>Mehr Fehlerfälle müssen berücksichtigt werden.</p><p>Ein Beispiel wäre die Überweisung eines Geldbetrags (konzeptionelles Beispiel):</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name function">send_money</span><span class="punctuation">(</span><span class="name class">A</span><span class="punctuation">,</span> <span class="name class">B</span><span class="punctuation">,</span> amount<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">  <span class="name class">Begin_Transaction</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">  <span class="keyword">if</span> <span class="punctuation">(</span><span class="name class">A</span><span class="punctuation">.</span>balance <span class="operator">-</span> amount <span class="operator">&gt;=</span> <span class="literal number integer">0</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="name class">A</span><span class="punctuation">.</span>balance <span class="operator">=</span> <span class="name class">A</span><span class="punctuation">.</span>balance <span class="operator">-</span> amount<span class="punctuation">;</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="name class">B</span><span class="punctuation">.</span>balance <span class="operator">=</span> <span class="name class">B</span><span class="punctuation">.</span>balance <span class="operator">+</span> amount<span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6">    <span class="name class">Commit_Transaction</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">7</small><code data-lineno="7">  <span class="punctuation">}</span> <span class="keyword">else</span> <span class="punctuation">{</span>
</code><small class="ln">8</small><code data-lineno="8">    <span class="name class">Abort_Transaction</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">9</small><code data-lineno="9"><span class="punctuation">}</span> <span class="punctuation">}</span></code></pre></li></ul><div class="accentuate incremental"><p>Wir brauchen ein <em>Atomic Commit Protocol</em>.</p></div><ld-supplemental><p class="rubric">Wiederholung: Transaktionen</p><p>Eine Transaktion stellt die zuverlässige Bearbeitung persistenter Daten sicher – auch in Fehlersituationen. Zentrales Merkmal ist die Garantie der ACID-Eigenschaften (Atomicity, Consistency, Isolation, Durability).</p><p>Am Ende einer Transaktion findet entweder ein commit oder abort / rollback statt.</p><p>Nach einem commit sind alle Änderungen dauerhaft.</p><p class="rubric">Fehlertoleranz</p><p>Das Ziel ist es zu ermöglichen, ein zuverlässiges System aus unzuverlässigen Komponenten aufzubauen.</p><p>Drei grundsätzliche Schritte:</p><ol class="arabic simple"><li><p>Erkennung von Fehlern: Erkennen des Vorhandenseins eines Fehlers in einem Datenwert oder einem Steuersignal</p></li><li><p>Fehlereingrenzung: Begrenzung der Fehlerausbreitung</p></li><li><p>Maskierung von Fehlern: Entwicklung von Mechanismen, die sicherstellen, dass ein System trotz eines Fehlers korrekt funktioniert (und möglicherweise einen Fehler korrigiert)</p></li></ol></ld-supplemental></ld-topic>
<ld-topic id="two-phase-commit-protocol-2pc"><h2>Two-Phase Commit Protocol - 2PC</h2><p>Teilnehmer sind (1) die Partizipanten (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>P</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">P_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span>), welche die verteilten Daten verwalten, und (2) ein Koordinator, (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi></mrow><annotation encoding="application/x-tex">K</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span></span></span></span></span>) der die Steuerung des Protokolls übernimmt. (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi></mrow><annotation encoding="application/x-tex">K</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><s height:0.3117em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span>.</p></li><li><p>Jeder <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>P</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">P_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> prüft für sich, ob die Transaktion lokal korrekt abgeschlossen werden kann.</p></li><li><p>Falls ja, sendet er READY, anderenfalls ABORT an <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi></mrow><annotation encoding="application/x-tex">K</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord <span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span></p></li><li><p>Falls die Entscheidung COMMIT war, machen alle <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>P</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">P_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> die Transaktion <em>stabil</em></p></li><li><p>Falls die Entscheidung ABORT war, setzen alle <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>P</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">P_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> die Transaktion zurück.</p></li><li><p>Alle <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>P</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">P_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> senden schließlich eine OK-Nachricht an <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi></mrow><annotation encoding="application/x-tex">K</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span></span></span></span></span></p></li></ul></li></ol><ld-supplemental><p>Das 2-PC Protokoll ist nicht Fehlerresistent. d. h. es kann Fehler erkennen, aber nicht zwangsläufig korrigieren. Um einige Fehlerszenarien zu behandeln, müssen Ergebnisse (insbesondere READY und COMMIT) in einem persistenten <em>write-ahead</em> Log-File festgehalten werden.</p></ld-supplemental></ld-topic>
<ld-topic id="cap-theorem"><h2>CAP Theorem<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></h2><p>In <strong>verteilten</strong> (<em>Datenbank-</em>)<em>Systemen</em> können nur zwei der drei folgenden Eigenschaften gleichzeitig garantiert werden:</p><ld-grid class="default-layout"><ld-cell class="incremental" style="align-self:auto;"><ul class="list-with-explanations"><li><p>Konsistenz (<span class="eng">Consistency</span>)</p><p>(Nach Abschluss einer Transaktion ist der Rückgabewert der nächsten Leseoperation das Ergebnis der letzten Schreiboperation oder ein Fehler.)</p></li><li><p>Verfügbarkeit (<span class="eng">Availability</span>)</p><p>(Jede Anfrage erhält eine Antwort in akzeptabler Zeit.)</p></li><li><p>Partitionstoleranz (<span class="eng">Partition Tolerance</span>)</p><p>(Das System funktioniert auch bei Netzwerkpartitionierungen; d.h. Knoten können nicht mehr miteinander kommunizieren.)</p></li></ul></ld-cell><ld-cell style="align-self:auto;"><object class="light-image align-center" data="drawings/cap.svg" type="image/svg+xml" role="img"></object></ld-cell></ld-grid><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>2000 Brewer(Vermutung), 2002 Gilbert und Lynch(Beweis)</p></aside></aside><ld-supplemental><p>Das CAP Theorem bezieht sich „nur“ auf verteilte Systeme. In solchen Systemen kann es immer zu Netzwerkpartitionierungen kommen. Deswegen ist Partitionstoleranz eine natürliche Eigenschaft und man kann häufig „nur“ zwischen Konsistenz und Verfügbarkeit wählen.</p><p>Welche Eigenschaften sind in welchen Szenarien wichtig?</p><dl class="field-list simple"><dt>DNS<span class="colon">:</span></dt><dd><p>Verfügbarkeit und Partitionstoleranz</p></dd><dt>Banking<span class="colon">:</span></dt><dd><p>Konsistenz und Partitionstoleranz</p></dd></dl></ld-supplemental><!--ideas: Leader Election Algo., Gossip Protocol, RAFT Protocol, Paxos, AMQP--></ld-topic>
