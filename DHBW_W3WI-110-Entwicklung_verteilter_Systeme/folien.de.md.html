<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="quiz-kurztest"><h2>Quiz/Kurztest</h2><dl class="dd-margin-left-4em field-list"><dt>Datum<span class="colon">:</span></dt><dd><p>14.12.</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>ca. 30 Minuten</p></dd><dt>Umfang und Bewertung<span class="colon">:</span></dt><dd><p>voraussichtlich zwischen 20 und 40 Fragen (mit einem Punkt oder 0,5 Punkten pro Frage)</p></dd><dt>Inhalt<span class="colon">:</span></dt><dd><p>Inhalte der ersten 4 Vorlesungen, d. h. insbesondere Arbeiten auf Servern, HTML, CSS, JavaScript und ggf. Buildprozesse</p><p><span class="peripheral">Der Schwerpunkt wird darauf liegen zu zeigen, dass man entsprechenden Code versteht und ggf. Probleme erkennen kann. Es werden – wenn überhaupt – nur ganz kurze Snippets selber zu schreiben sein.</span></p></dd></dl></ld-topic>
<ld-topic id="lab"><h2>Lab</h2><ld-scrollable class="dd-margin-left-4em"><dl class="field-list"><dt>Datum<span class="colon">:</span></dt><dd><p>14.12.</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Entwicklung: 5 Stunden (ca. 10:00 bis ca. 15:30 Uhr)</p></li><li><p>Präsentation und Testen der Ergebnisse: 10 bis max. 15 Minuten pro Team (ca. 15:30 bis 17:30)</p></li></ul></dd><dt>Inhalt<span class="colon">:</span></dt><dd><p>Die gezielte Entwicklung einer <em>verteilten</em> Webanwendung unter Zuhilfenahme von KI(-Agenten). (Im Vorfeld sollten Sie sich damit vertraut machen. Stellen Sie sicher, dass Sie sich einen Ubuntu-Server eingerichtet haben und auf diesem mind. Node.js installiert ist.)</p><p><span class="peripheral">Das Thema wird an dem Tag bekannt gegeben.</span></p></dd><dt>Abgabe<span class="colon">:</span></dt><dd><p>Alle Sourcen (inkl. Build-Skripte) sind als ZIP-Datei in Moodle hochzuladen.</p></dd><dt>Bewertung<span class="colon">:</span></dt><dd><ul class="simple"><li><p>[5 Punkte] Stabilität der Anwendung (Werden mind. 25 gleichzeitige Nutzer unterstützt?)</p></li><li><p>[5 Punkte] Funktionalität der Anwendung; insbesondere:</p><ul class="simple"><li><p>Funktioniert die Anwendung wie erwartet?</p></li><li><p>Was passiert bei einem kurzen Verbindungsabbruch?</p></li><li><p>Wie werden Nutzer authentifiziert? (Falls dies notwendig/sinnvoll ist.)</p></li></ul></li><li><p>[1 Punkt] Kreativität</p></li><li><p>[2 Punkte] Implementierung grundlegender Sicherheit (HTTPS)</p></li><li><p>[3 Punkte] Responsiveness im Hinblick auf Unterstützung von Smartphones, Tablets und Desktops</p></li><li><p>[2 Punkte] Theming (<em>light-dark</em> ist hierbei ausreichend)</p></li><li><p>[2 Punkte] (durchgehende) Internationalisierung (mind. Deutsch und Englisch)</p></li></ul></dd><dt>Team<span class="colon">:</span></dt><dd><p>3 Personen (mindestens eine Person sollte einen professionellen KI Zugang haben: z. B. Claude Code, Codex, <a class="reference external" href="https://opencode.ai/console/go">OpenCode Go</a>, <a class="reference external" href="https://education.github.com/pack">Github Copilot for Students</a> oder <a class="reference external" href="https://mistral.ai/pricing/">Mistral AI for Students</a>)</p></dd></dl></ld-scrollable></ld-topic>
<ld-topic id="prasentationen-und-interaktive-webseite"><h2>Präsentationen und interaktive Webseite</h2><ld-deck class="dd-margin-left-4em"><ld-card><p><strong>Allgemein</strong></p><dl class="field-list"><dt>Datum<span class="colon">:</span></dt><dd><p>15.01. (4 Präsentationen), 20.01 (4 Präsentationen), 22.01 (4 Präsentationen)</p><aside class="admonition" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>Die Präsentation und die Webseite sind bis 7:00 Uhr am Tag der Präsentation im Moodle hochzuladen.</p></aside></dd><dt>Dauer<span class="colon">:</span></dt><dd><ul class="simple"><li><p>30 Minuten pro Team: Präsentation</p></li><li><p>10 Minuten pro Team: Interaktion mit der Webseite</p></li></ul></dd><dt>Inhalt<span class="colon">:</span></dt><dd><p>Pro Team ein Thema</p></dd><dt>Bewertung<span class="colon">:</span></dt><dd><ul class="simple"><li><p>20 Punkte Vortrag</p></li><li><p>20 Punkte interaktive Webseite</p></li></ul></dd><dt>Team<span class="colon">:</span></dt><dd><p>2 Personen (in neuer Zusammensetzung)</p></dd></dl></ld-card><ld-card class="incremental"><p><strong>Präsentation</strong></p><aside class="admonition" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>Die Präsentationen sind <em>immer technisch konzeptionell</em> und nicht wirtschaftlich und oder produktorientiert auszurichten!</p></aside><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Die Folien und die Präsentation können auf Englisch sein!</p></aside><dl class="field-list simple"><dt>Bewertung<span class="colon">:</span></dt><dd><ul class="simple"><li><p><a class="reference external" href="https://delors.github.io/allg-vortraege/folien.de.md.html">Allgemeine Kriterien</a></p></li><li><p>Anforderungen:</p><ul class="simple"><li><p>Die Aufteilung muss genau 50:50 sein.</p></li><li><p>Während der Präsentation darf nicht mehr als dreimal gewechselt werden.</p></li></ul></li></ul></dd></dl></ld-card><ld-card class="incremental"><p><strong>Interaktive Webseite</strong></p><ld-deck><ld-card><p>Das Ziel der interaktiven Webseite ist es, die Lerninhalte aus der Präsentation noch einmal so aufzuarbeiten, dass sich jeder die Inhalte selber erarbeiten kann und auch seinen eigenen Wissensstand testen kann. Die Webseite darf die Präsentation einbauen bzw. erweitern. Auch das Einbetten von Videos etc. ist erlaubt, aber ein besonderer Schwerpunkt sollte auf Interaktivität gelegt werden.</p></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Sie können ggf. Ihre Präsentation auch unter Verwendung Ihrer Webseite halten, stellen Sie dann jedoch sicher, dass alle Inhalte auch hinreichend groß sind, damit diese lesbar sind.</p></aside></ld-card><ld-card class="incremental"><dl class="field-list"><dt>Bewertungskriterien<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Werden die Inhalte verständlich aufgearbeitet?</p></li><li><p>Gibt es (umfangreiche) Möglichkeiten mit der Webseite zu interagieren?</p></li><li><p>Gibt es eine Möglichkeit seinen Wissensstand zu testen?</p></li></ul><p>Anforderungen:</p><ul class="simple"><li><p>Die Webseite muss nur moderne Browser unterstützen.</p></li><li><p>Die Webseite muss sowohl auf Tablets als auch Desktops nutzbar sein; Smartphones müssen nicht unterstützt werden.</p></li><li><p>Die Webseite sollte (mindestens) auf Deutsch sein; weitere Sprachen dürfen unterstützt werden.</p></li></ul></dd></dl></ld-card><ld-card class="incremental"><dl class="field-list"><dt>Abgabe<span class="colon">:</span></dt><dd><p>Zip-Datei, die die Webseite und alle Ressourcen beinhaltet. Es muss sich um eine Webseite handeln, die keinen Webserver benötigt, um genutzt zu werden.</p><p>Die Zip-Datei muss auch eine <span class="docutils literal">Readme.md</span> enthalten mit einem Link auf Ihre Webseite.</p><p><em>Der Link und die Präsentation werden im Moodle allen Teilnehmern zur Verfügung gestellt.</em></p></dd></dl></ld-card></ld-deck></ld-card></ld-deck></ld-topic>

p>16:30</p></td></tr><tr><td><p>Philipp</p></td><td><p>Rehbein-Kaparos</p></td><td><p>16:45</p></td></tr><tr><td><p>Niklas</p></td><td><p>Rustler</p></td><td><p>17:00</p></td></tr><tr><td><p>Erik</p></td><td><p>Schaufler</p></td><td><p>17:15</p></td></tr><tr><td><p>David</p></td><td><p>Scherin</p></td><td><p>17:30</p></td></tr><tr><td><p>Philipp</p></td><td><p>Schroeer</p></td><td><p>17:45</p></td></tr></tbody></table></ld-supplemental></dd><dt>Raum<span class="colon">:</span></dt><dd><p>261C</p></dd><dt>Inhalt<span class="colon">:</span></dt><dd><p>Schwerpunkt sind Fragen zum Bereich <em>Verteilte Systeme</em>; dies umfasst insbesondere auch die Inhalte der studentischen Präsentation und die auf den erstellten Webseiten vermittelten Inhalte. Ggf. kann es auch Fragen zu Ihrer Webseite oder deren technische Details kommen.</p></dd></dl></ld-topic>
<ld-topic id="prasentation-interaktive-webseite-themen"><h2>Präsentation/interaktive Webseite - Themen</h2><p>(Alle Themen sind für 2 Personen und 30 Minuten Präsentationsdauer; eine Anpassung, Fokussierung bzw. Feinsteuerung der Inhalte kann nach Rücksprache ggf. jederzeit vorgenommen werden.)</p><ld-deck class="numbered"><ld-card><h3><em>Web Security: User Authentication and Authorization</em></h3><ul class="simple"><li><p><em>HTTP Basic Authentication</em></p></li><li><p>Sichere Authentifizierung (JWT vs. Sessions (HTTP-only) Cookies; CSRF-Schutz)</p></li><li><p>OAuth 2.0 + OpenID Connect</p></li></ul></ld-card><ld-card class="incremental"><h3><em>Web Security: Handling User Input</em></h3><ul class="simple"><li><p>Input Validation und Sanitization</p></li><li><p>XSS (Cross-Site Scripting) Prevention</p></li><li><p>Server-side request forgery (SSRF)</p></li></ul></ld-card><ld-card class="incremental"><h3><em>Web-App Security: Security Mechanisms</em></h3><ul class="simple"><li><p>SOP (Same-Origin Policy), CORS (Cross-Origin Resource Sharing) (Grundlagen)</p></li><li><p>CORP / COOP / COEP (Cross-Origin Resource/Opener/Embedder Policies) {peripheral}</p></li><li><p>CSP (Content Security Policy) und SRI (Subresource Integrity)</p></li></ul><p>Einführung und konkrete Beispiele, wie diese Mechanismen eingesetzt/spezifiziert werden und dabei helfen, Angriffe zu verhindern.</p></ld-card><ld-card class="incremental"><h3><em>Virtualization: Type 1 (bare-metal) vs. Type 2</em></h3><ul class="simple"><li><p>technische Grundlagen</p></li><li><p>Full Virtualization vs. Paravirtualization</p></li><li><p>Sicherheit</p></li><li><p>VM-Migration</p></li></ul></ld-card><ld-card class="incremental"><h3><em>Virtualization: Container</em></h3><ul class="simple"><li><p>technische Grundlagen; d. h. diskutieren Sie insbesondere auch <em>Namespaces</em>, <em>cgroups</em>, etc.</p></li><li><p>Unterschiede beim Einsatz auf Mac, Linux und Windows</p></li><li><p>Sicherheit</p></li></ul></ld-card><ld-card class="incremental"><h3><em>Leader Election</em></h3><ul class="simple"><li><p>Bully Algorithm und Ring Algorithm</p></li><li><p>gehen Sie insbesondere auch auf die Behandlung von Fehlersituationen ein: z. B. Erkennung von Fehlern, Behandlung von Netzwerkpartitionierung, etc.</p></li><li><p><span class="peripheral">Leader Election in der Praxis: ZooKeeper</span></p></li></ul></ld-card><ld-card class="incremental"><h3><em>Consensus Fundamentals &#x26; Problem Definition</em></h3><ul class="simple"><li><p>Was ist Consensus und warum ist er in verteilten Systemen schwierig?</p></li><li><p>Motivation: Replicated State Machines</p></li><li><p>Fehlermodelle: Crash Faults vs. Byzantine Faults</p></li><li><p>Quoren: 2f+1 (Crash) vs. 3f+1 (Byzantine)</p></li><li><p>Byzantine Fault Tolerance</p></li></ul></ld-card><ld-card class="incremental"><h3><em>Raft – Understandable Consensus</em></h3><ul><li><p>Motivation</p></li><li><p>Leader Election, Log Replication, Safety</p></li><li><p><span class="peripheral">Einsatz in realen Systemen</span></p><ld-presenter-note encrypted="">MTAwMDAw:6gPTvs9cfumCWe9MIm686h0e90DS3OWEuYeMQMrxX5Q=:xULqbBrV/Pa1WJtP:bAyUwHrcnZzMinaCEM8THBBbo+gaDrV+ybcC29+j3K73fYU1e6SeCnzyCqIoHtvh</ld-presenter-note></li></ul><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Auf <a class="reference external" href="https://raft.github.io">raft.github.io</a> gibt es eine erste interaktive Visualisierung; ein einfaches Einbinden in Ihre Webseite ist nicht ausreichend.</p><p>Stimmen Sie sich mit dem Team bzgl. <em>Leader Election</em> ab, um Duplikationen bei den Inhalten zu vermeiden.</p></aside></ld-card><ld-card class="incremental"><h3><em>Eventual Consistency</em></h3><ul class="simple"><li><p>Spektrum der Konsistenzmodelle: linearisierbar → kausal → eventual</p></li><li><p>PACELC</p></li><li><p><em>Gossip Protocol</em></p></li></ul></ld-card><ld-card class="incremental"><h3><em>Advanced Logical Clocks</em></h3><ul class="simple"><li><p>Vektoruhren</p></li><li><p>Hybrid Logical Clocks</p></li></ul></ld-card><ld-card class="incremental"><h3><em>CRDTs (Conflict-free Replicated Data Types)</em></h3><ul class="simple"><li><p>zustandsbasierte vs. operationsbasierte CRDTs</p></li><li><p>G-Counter, PN-Counter, OR-Set, LWW-Register</p></li><li><p>Anwendungsfall: kollaboratives Editieren</p></li></ul></ld-card><ld-card class="incremental"><h3><em>Distributed File Systems</em></h3><ul class="simple"><li><p>Metadatenverwaltung</p></li><li><p>Platzierung</p></li><li><p>Replikation</p></li><li><p>Architektur von Ceph vs. HDFS als Case Studies</p></li></ul></ld-card><ld-card class="incremental"><h3><em>Paxos Family</em> [Reserve]</h3><ul><li><p>Grundlegender Paxos-Algorithmus (konzeptioneller Überblick, Rollen: Proposers, Acceptors, Learners)</p></li><li><p>Warum Paxos korrekt, aber komplex ist</p></li><li><p>Multi-Paxos für praktische Systeme</p></li><li><p>Einsatz in realen Systemen</p><ld-presenter-note encrypted="">MTAwMDAw:VjF0+0alE1Dfrdgswre9qeuxQ0zF8VwAuyafHXbLCrU=:moXofhLqpwbVCG0p:l/k2TGyHN08X/EI3oQEDBSZIzkXPkHL2yyJPx1EZwsPDhdaty5Vsgwg0pTA8CrE=</ld-presenter-note></li></ul></ld-card></ld-deck></ld-topic>
