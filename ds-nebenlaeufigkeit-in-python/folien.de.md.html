<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic class="no-title center-child-elements transition-move-left" id="nebenlaufigkeit"><h2>Nebenläufigkeit</h2><aside class="admonition" data-theme="background"><p class="admonition-title" data-theme="background-header"><span>Hintergrund</span></p><p>Nebenläufigkeit ist notwendig, um:</p><ul class="simple"><li><p>die Reaktionsfähigkeit von Anwendungen zu verbessern</p></li><li><p>eine bessere Auslastung von (Mehrkern-)prozessoren zu erreichen</p></li></ul><div class="incremental"><p>Ein gutes Verständnis von nebenläufiger Programmierung ist für die Entwicklung von verteilten Anwendungen unerlässlich, da Server immer mehrere Anfragen gleichzeitig bearbeiten.</p></div></aside></ld-topic>
<ld-topic class="new-section transition-fade" id="nebenlaufigkeitsmodelle-in-python"><h2>Nebenläufigkeitsmodelle in Python</h2></ld-topic>
<ld-topic id="prozesse-vs-threads-vs-coroutines-in-python"><h2>Prozesse vs. Threads vs. Coroutines in Python</h2><ld-deck><ld-card><object class="align-center" data="drawings/threads/multiprocessing.svg" type="image/svg+xml" role="img" aria-label="Multiprocessing in Python"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/threads/threads_classical.svg" type="image/svg+xml" role="img" aria-label="Klassisches Threading in Python"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/threads/coroutines.svg" type="image/svg+xml" role="img" aria-label="Coroutines in Python"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/threads/threads_new.svg" type="image/svg+xml" role="img" aria-label="Neues Multithreading in Python"></object></ld-card></ld-deck><ld-supplemental><ul><li><p>Prozesse sind voneinander isoliert und können nur über explizite Mechanismen miteinander kommunizieren (z. B. <code>Pipe</code>s und <code>Queue</code>s); Prozesse teilen sich <em>nicht</em> denselben Adressraum.</p></li><li><p>Alle Threads eines Prozesses teilen sich denselben Adressraum. Python Threads sind vom Betriebssystem unterstützte Threads, die direkt vom Betriebssystem verwaltet werden. Python (d. h. der Standardinterpreter CPython bis (mind.) einschließlich Version 3.12) führt aber immer nur einen Thread aus aufgrund des <em>Global Interpreter Lock</em>s (GIL).</p><p>Der GIL existiert(e) insbesondere, da dadurch die Implementierung von Python einfacher wurde (z. B. kann problemlos <em>Reference Counting</em> verwendet werden und Probleme mit externen Bibliotheken sind auch minimiert.)</p><p>Andere Python-Implementierungen (wie Jython und IronPython) haben keinen GIL und können daher mehrere Threads (echt) parallel ausführen.</p></li><li><p><em>Coroutines</em> (auch <em>Fibres</em>) nutzen immer kooperatives Multitasking. D. h. ein Fibre gibt die Kontrolle an eine andere Fibre explizit ab. (Früher wurden <em>Fibres</em> auch als <em>Green Threads</em> bezeichnet.) Diese sind für das Betriebssystem unsichtbar.</p><p><em>Coroutines</em> erfordern explizite Unterstützung in den Bibliotheken. Alle auf Koroutinen basierenden Tasks werden in von der Event-Loop verwaltet und von einem einzigen Thread ausgeführt.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="nebenlaufigkeit-in-python-1"><h2>Nebenläufigkeit in Python</h2><ld-deck><ld-card><object class="align-center" data="drawings/threads/python-threads.svg" type="image/svg+xml" role="img" aria-label="threading.Thread"></object></ld-card><ld-card class="s-overlay center-content incremental"><aside class="admonition backdrop-blur" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Die <span class="docutils literal">Process</span> API bietet eine vergleichbare Schnittstelle.</p></aside></ld-card></ld-deck><ld-supplemental><ul><li><p>Threads werden in Python über die vordefinierte Klasse <span class="docutils literal">threading.Thread</span> bereitgestellt. <code class="python">target</code> ist hierbei die Referenz auf das Callable Objekt, dass ausgeführt wird als Reaktion auf ein <code class="python">start</code> Aufruf.</p></li><li><p>Alternativ kann ein <em>Callable</em> an ein Thread-Objekt übergeben werden.</p></li><li><p>Threads beginnen ihre Ausführung erst, wenn die <span class="docutils literal">start</span>-Methode in der Thread-Klasse aufgerufen wird. Die <span class="docutils literal">Thread.start</span>-Methode ruft die <span class="docutils literal">run</span>-Methode auf. Ein direkter Aufruf der <span class="docutils literal">run</span>-Methode führt nicht zu einer nebenläufigen Ausführung.</p></li><li><p>Der aktuelle Thread kann mittels der statischen Methode <span class="docutils literal">Thread.currentThread()</span> ermittelt werden.</p></li><li><p>Ein Thread wird beendet, wenn die Ausführung seiner <span class="docutils literal">run</span>-Methode entweder normal oder als Ergebnis einer unbehandelten Ausnahme endet.</p></li><li><p>Python unterscheidet <em>User</em>-Threads und <em>Daemon</em>-Threads.</p><p><em>Daemon-Threads</em> sind Threads, die allgemeine Dienste bereitstellen und normalerweise nie beendet werden. Jeder Thread, der eine Endlosschleife ausführt sollte als Daemon-Thread gekennzeichnet werden bei Erzeugung.</p><p>Wenn alle Benutzer-Threads beendet sind, werden die Daemon-Threads automatisch beendet, und das Hauptprogramm endet.</p><p>Der Thread kann beim Erzeugen als Daemon-Thread gekennzeichnet werden, indem der Parameter <span class="docutils literal">daemon</span> auf <span class="docutils literal">True</span> gesetzt wird.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="inter-thread-process-koordination"><h2>Inter-<span class="docutils literal">Thread</span>/<span class="docutils literal">Process</span>- Koordination</h2><ul class="simple"><li><p>Ein <span class="docutils literal">Thread</span>/<span class="docutils literal">Process</span> kann (mit oder ohne Zeitüberschreitung) auf die Beendigung eines anderen <span class="docutils literal">Thread</span>s/<span class="docutils literal">Process</span>es (des Ziels) warten, indem er die <span class="docutils literal">join</span>-Methode für das <span class="docutils literal">Thread</span>/<span class="docutils literal">Process</span>-Objekt des Ziels aufruft.</p></li></ul><ul class="incremental simple"><li><p>Mit der Methode <span class="docutils literal">is_alive</span> kann ein Thread feststellen, ob der Ziel-Thread beendet wurde.</p></li></ul></ld-topic>
<ld-topic id="python-thread-states"><h2>Python Thread States</h2><object class="align-center" data="drawings/threads/python-thread-states.svg" type="image/svg+xml" role="img" aria-label="Python Thread States"></object></ld-topic>
<ld-topic id="beispiel-multiprocessing-io-bound"><h2>Beispiel: Multiprocessing - „IO-Bound“</h2><ld-grid class="default-layout"><ld-cell class="width-60" style="align-self:auto;"><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">import</span> time
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">from</span> multiprocessing \
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">import</span> Process<span class="punctuation">,</span> current_process
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5"><span class="keyword">def</span> <span class="name function">busy_sleep</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    time<span class="punctuation">.</span>sleep<span class="punctuation">(</span><span class="literal number integer">10</span><span class="punctuation">)</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">
</code><small class="ln"> 8</small><code data-lineno=" 8"><span class="keyword">print</span><span class="punctuation">(</span>current_process<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">.</span>name<span class="punctuation">)</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">
</code><small class="ln">10</small><code data-lineno="10"><span class="keyword">if</span> __name__ <span class="operator">==</span> <span class="literal string">'__main__'</span><span class="punctuation">:</span>
</code><small class="ln">11</small><code data-lineno="11">    p1 <span class="operator">=</span> Process<span class="punctuation">(</span>target<span class="operator">=</span>busy_sleep<span class="punctuation">)</span>
</code><small class="ln">12</small><code data-lineno="12">    p2 <span class="operator">=</span> Process<span class="punctuation">(</span>target<span class="operator">=</span>busy_sleep<span class="punctuation">)</span>
</code><small class="ln">13</small><code data-lineno="13">    p1<span class="punctuation">.</span>start<span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">;</span> p2<span class="punctuation">.</span>start<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">14</small><code data-lineno="14">    p1<span class="punctuation">.</span>join<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">15</small><code data-lineno="15">    p2<span class="punctuation">.</span>join<span class="punctuation">(</span><span class="punctuation">)</span></code></pre></ld-cell><ld-cell class="incremental" style="align-self:auto;"><pre class="code bash literal-block"><code>$ <span class="name function">time</span> ./processes_sleep.py

</code><small class="ln"> 2</small><code data-lineno=" 2">
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">async</span> <span class="keyword">def</span> <span class="name function">busy_sleep</span><span class="punctuation">(</span><span class="name builtin">id</span><span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="keyword">print</span><span class="punctuation">(</span><span class="literal string">f"Task </span><span class="punctuation">{</span><span class="name builtin">id</span><span class="punctuation">}</span><span class="literal string"> started"</span><span class="punctuation">)</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="keyword">await</span> asyncio<span class="punctuation">.</span>sleep<span class="punctuation">(</span><span class="literal number integer">10</span><span class="punctuation">)</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">print</span><span class="punctuation">(</span><span class="literal string">f"Task </span><span class="punctuation">{</span><span class="name builtin">id</span><span class="punctuation">}</span><span class="literal string"> completed"</span><span class="punctuation">)</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">
</code><small class="ln"> 8</small><code data-lineno=" 8"><span class="keyword">async</span> <span class="keyword">def</span> <span class="name function">main</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    t1 <span class="operator">=</span> asyncio<span class="punctuation">.</span>create_task<span class="punctuation">(</span>busy_sleep<span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">)</span>

</code><small class="ln">13</small><code data-lineno="13">    <span class="keyword">await</span> t1

</code><small class="ln">16</small><code data-lineno="16">
</code><small class="ln">17</small><code data-lineno="17"><span class="keyword">if</span> __name__ <span class="operator">==</span> <span class="literal string">'__main__'</span><span class="punctuation">:</span>
</code><small class="ln">18</small><code data-lineno="18">    asyncio<span class="punctuation">.</span>run<span class="punctuation">(</span>main<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span></code></pre></ld-cell><ld-cell class="width-40 incremental" style="align-self:auto;"><pre class="code bash literal-block"><code>$ <span class="name function">time</span> ./async.py
Both initialized.

Task <span class="literal number integer">2</span> started

  <span class="literal number integer">0</span>.05s user
  <span class="literal number integer">0</span>.01s system
  <span class="literal number integer">0</span>% cpu
  <span class="literal number integer">10.063</span> total</code></pre></ld-cell></ld-grid><ld-supplemental><ul class="simple"><li><p>Beide <span class="docutils literal">Task</span>s werden von dem gleichen Thread ausgeführt. Der Thread gibt „die Kontrolle an die Event-Loop ab“, wenn er auf eine entsprechende blockierende Methode trifft. Die Event-Loop kann dann die Kontrolle an einen anderen Task übergeben.</p></li><li><p>Warten (<span class="docutils literal">await</span>) ist nur möglich in asynchronen Methoden (<span class="docutils literal">async def</span>).</p></li><li><p><span class="docutils literal">asyncio.run(&#x3C;fn>)</span> startet die Event-Loop und führt die übergebene asynchrone Methode aus.</p></li><li><p>Die Verwendung von Koroutinen erfordert explizite Unterstützung in den Bibliotheken.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-fade" id="sperren-und-bedingungsvariablen"><h2>Sperren und Bedingungsvariablen</h2></ld-topic>
<ld-topic id="synchronisation-mit-hilfe-von-sperren"><h2>Synchronisation mit Hilfe von <em>Sperren</em></h2><ul class="incremental list-with-explanations"><li><p>Zugriff auf gemeinsam genutzte Ressourcen muss synchronisiert werden, um <span class="eng">Race Conditions</span> (<span class="ger">Wettlaufsituationen</span>) zu vermeiden.</p><p>(Unabhängig davon ob Threads echt parallel oder nur scheinbar parallel ausgeführt werden.)</p></li><li><p>Eine <em>Sperre</em> (<span class="docutils literal">Lock</span>) ist ein Objekt, das es erlaubt Code im wechselseitigen Ausschluss (engl. <em>mutual exclusion</em>) auszuführen.</p><p>D. h. ein Thread blockiert, wenn er versucht eine Sperre zu erwerben, die bereits von einem anderen Thread gehalten wird.</p></li><li><p>Der Code, der von einer Sperre geschützt wird, wird als kritischer Abschnitt bezeichnet.</p></li></ul><ld-supplemental><p>Eine <em>Race Condition</em> liegt vor, wenn der Zustand eines (Software-)Systems von der Abfolge oder dem Zeitpunkt anderer unkontrollierbarer Ereignisse abhängt. Eine Race Condition führt ggf. zu unerwarteten oder inkonsistenten Ergebnissen.</p></ld-supplemental></ld-topic>
<ld-topic id="verwendung-von-sperren"><h2>Verwendung von <em>Sperren</em><a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></h2><ul class="simple"><li><p>Am Anfang des kritischen Abschnitts wird die Sperre angefordert mit <span class="docutils literal">&#x3C;Lock>.acquire()</span>.</p></li><li><p>Am Ende des kritischen Abschnitts wird die Sperre freigegeben mit <span class="docutils literal">&#x3C;Lock>.release()</span>.</p></li></ul><ul class="incremental"><li><p>Um sicherzustellen, dass eine gehaltene Sperre immer aufgehoben wird, sollte <span class="docutils literal">try-finally</span> oder ein passendes <span class="docutils literal">with</span>-Statement verwendet werden. (Lock implementiert z. B. das Protokoll von <em>Context-Managern</em>)</p><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><pre class="code python literal-block"><code>lock <span class="operator">=</span> Lock<span class="punctuation">(</span><span class="punctuation">)</span>
lock<span class="punctuation">.</span>acquire<span class="punctuation">(</span><span class="punctuation">)</span>
<span class="keyword">try</span><span class="punctuation">:</span>
  <span class="comment single"># critical section</span>
<span class="keyword">finally</span><span class="punctuation">:</span>
  lock<span class="punctuation">.</span>release<span class="punctuation">(</span><span class="punctuation">)</span></code></pre></ld-cell><ld-cell class="width-50 incremental" style="align-self:auto;"><pre class="code python literal-block"><code>lock <span class="operator">=</span> Lock<span class="punctuation">(</span><span class="punctuation">)</span>

<span class="keyword">with</span> lock<span class="punctuation">:</span>
  <span class="comment single"># critical section</span></code></pre></ld-cell></ld-grid></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Die APIs von <span class="docutils literal">threading</span> und <span class="docutils literal">multiprocessing</span> sind in weiten Teilen vergleichbar.</p></aside></aside></ld-topic>
<ld-topic id="beispiel-thread-safe-shared-counter"><h2>Beispiel: Thread-safe Shared Counter</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">from</span> threading <span class="keyword">import</span> Thread<span class="punctuation">,</span>Lock
</code><small class="ln"> 2</small><code data-lineno=" 2">
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">class</span> <span class="name class">SharedCounter</span><span class="punctuation">:</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="keyword">def</span> <span class="name function">__init__</span><span class="punctuation">(</span>self<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        self<span class="punctuation">.</span>_value <span class="operator">=</span> <span class="literal number integer">0</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">        self<span class="punctuation">.</span>lock <span class="operator">=</span> Lock<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="keyword">def</span> <span class="name function">value</span><span class="punctuation">(</span>self<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln">10</small><code data-lineno="10">        <span class="keyword">return</span> self<span class="punctuation">.</span>_value</code></pre></ld-cell><ld-cell class="width-50 incremental" style="align-self:auto;"><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="comment single"># Thread-sichere Implementierungen</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="comment single"># von increment und decrement</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5"><span class="keyword">def</span> <span class="name function">increment</span><span class="punctuation">(</span>self<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    self<span class="punctuation">.</span>lock<span class="punctuation">.</span>acquire<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="keyword">try</span><span class="punctuation">:</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">        self<span class="punctuation">.</span>_value <span class="operator">+=</span> <span class="literal number integer">1</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="keyword">finally</span><span class="punctuation">:</span>
</code><small class="ln">10</small><code data-lineno="10">        self<span class="punctuation">.</span>lock<span class="punctuation">.</span>release<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">11</small><code data-lineno="11">
</code><small class="ln">12</small><code data-lineno="12"><span class="keyword">def</span> <span class="name function">decrement</span><span class="punctuation">(</span>self<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln">13</small><code data-lineno="13">    <span class="keyword">with</span> self<span class="punctuation">.</span>lock<span class="punctuation">:</span>
</code><small class="ln">14</small><code data-lineno="14">        self<span class="punctuation">.</span>_value <span class="operator">-=</span> <span class="literal number integer">1</span></code></pre></ld-cell></ld-grid><ld-supplemental><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Code, der eine konkrete Sperre erzeugt, anfordert und freigibt, sollte immer lokal sein; d. h. nicht über die Codebasis verteilt sein. Auch wenn es möglich ist eine Instanz eines Locks weiterzureichen und Sperren in einer Methode anzufordern und in einer anderen Methode freizugeben, so ist dies eine schlechte Praxis, da es zu ((sehr,) sehr) schwer zu findenden Fehlern führen kann.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="sperren-und-komplexe-ruckgabewerte"><h2>Sperren und komplexe Rückgabewerte</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><pre class="code python copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">from</span> threading <span class="keyword">import</span> Thread<span class="punctuation">,</span>Lock
</code><small class="ln">2</small><code data-lineno="2">
</code><small class="ln">3</small><code data-lineno="3"><span class="keyword">class</span> <span class="name class">SharedCoordinate</span><span class="punctuation">:</span>
</code><small class="ln">4</small><code data-lineno="4">
</code><small class="ln">5</small><code data-lineno="5">    <span class="keyword">def</span> <span class="name function">__init__</span><span class="punctuation">(</span>self<span class="punctuation">,</span> x<span class="punctuation">,</span> y<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln">6</small><code data-lineno="6">        self<span class="punctuation">.</span>x <span class="operator">=</span> x
</code><small class="ln">7</small><code data-lineno="7">        self<span class="punctuation">.</span>y <span class="operator">=</span> y
</code><small class="ln">8</small><code data-lineno="8">        self<span class="punctuation">.</span>lock <span class="operator">=</span> Lock<span class="punctuation">(</span><span class="punctuation">)</span></code></pre></ld-cell><ld-cell class="width-50 incremental" style="align-self:auto;"><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">def</span> <span class="name function">update</span><span class="punctuation">(</span>self<span class="punctuation">,</span> x<span class="punctuation">,</span> y<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    self<span class="punctuation">.</span>lock<span class="punctuation">.</span>acquire<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">try</span><span class="punctuation">:</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">        self<span class="punctuation">.</span>x <span class="operator">=</span> x
</code><small class="ln"> 5</small><code data-lineno=" 5">        self<span class="punctuation">.</span>y <span class="operator">=</span> y
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">finally</span><span class="punctuation">:</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">        self<span class="punctuation">.</span>lock<span class="punctuation">.</span>release<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9"><span class="keyword">def</span> <span class="name function">value</span><span class="punctuation">(</span>self<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln">10</small><code data-lineno="10">    <span class="keyword">with</span> self<span class="punctuation">.</span>lock<span class="punctuation">:</span>
</code><small class="ln">11</small><code data-lineno="11">        <span class="keyword">return</span> <span class="punctuation">(</span>self<span class="punctuation">.</span>x<span class="punctuation">,</span> self<span class="punctuation">.</span>y<span class="punctuation">)</span></code></pre></ld-cell></ld-grid><ld-supplemental><p>Beide Methoden müssen synchronisiert werden, damit es nicht dazu kommen kann, dass man einen ungültigen Zustand beobachten kann. Ein ungültiger Zustand wäre ein paar Koordinaten, die nicht zusammengehören. Z. B. wenn der Wert x von einem Aufruf kommt (update(100,100)) und der Wert y von einem anderen (update(200,200)); d.h. der Wert, den <span class="docutils literal">value</span> zurückliefert: <span class="docutils literal">100, 200</span> wäre.</p></ld-supplemental></ld-topic>
<ld-topic class="new-subsection" id="bedingungsvariablen"><h2>Bedingungsvariablen</h2></ld-topic>
<ld-topic id="bedingte-synchronisation"><h2>Bedingte Synchronisation</h2><ul class="incremental-list"><li><p>drückt eine Bedingung für die Reihenfolge der Ausführung von Operationen aus.</p></li><li><p>z. B. können Daten erst dann aus einem Puffer entfernt werden, wenn Daten in den Puffer eingegeben wurden.</p></li><li><p>Python unterstützt optionale Bedingungs-Variablen (Instanzen von <span class="docutils literal">Condition</span>), mit den klassischen Methoden <span class="docutils literal">wait</span> und <span class="docutils literal">notify</span> bzw. <span class="docutils literal">notify_all</span>.</p><p>Diese Methoden erlauben es auf bestimmte Bedingungen zu warten und andere Threads zu benachrichtigen, wenn sich die Bedingung geändert hat.</p></li></ul></ld-topic>
<ld-topic id="programmierung-mit-conditions"><h2>Programmierung mit <span class="docutils literal">Condition</span>s</h2><ld-deck><ld-card><ul class="simple"><li><p>Die Methoden <span class="docutils literal">wait</span> und <span class="docutils literal">notify(_all)</span> können nur verwendet werden, wenn die Sperre gehalten wird; andernfalls wird eine <span class="docutils literal">RuntimeError</span> ausgelöst.</p></li></ul></ld-card><ld-card class="incremental"><ul class="simple"><li><p>Die <span class="docutils literal">wait</span>-Methode blockiert immer den aufrufenden Thread und gibt die mit dem Objekt verbundene Sperre frei.</p></li></ul></ld-card><ld-card class="incremental"><ul><li><p>Die <span class="docutils literal">notify(n=1)</span>-Methode weckt (mind.) <em>n</em> wartende Threads auf. Welcher Thread aufgeweckt wird, ist nicht spezifiziert.</p><p><span class="docutils literal">notify</span> gibt die Sperre nicht frei; daher muss der aufgeweckte Thread warten, bis er die Sperre erhalten kann, bevor er fortfahren kann.</p></li><li><p>Um alle wartenden Threads aufzuwecken, muss die Methode <span class="docutils literal">notify_all</span> verwendet werden.</p><p>Warten die Threads aufgrund unterschiedlicher Bedingungen, so ist immer <span class="docutils literal">notify_all</span> zu verwenden.</p></li><li><p>Wenn kein Thread wartet, dann haben <span class="docutils literal">notify</span> und <span class="docutils literal">notify_all</span> keine Wirkung.</p></li></ul></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Wenn ein Thread aufgeweckt wird, kann er nicht davon ausgehen, dass seine Bedingung erfüllt ist!</p><p>Die Bedingung ist immer in einer Schleife zu prüfen und der Thread muss ich ggf. wieder in den Wartezustand versetzen.</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="beispiel-implementation-eines-boundedbuffer"><h2>Beispiel: Implementation eines <em>BoundedBuffer</em></h2><ul><li><p>Ein <em>BoundedBuffer</em> hat (z. B.) traditionell zwei Bedingungsvariablen:</p><ul class="simple"><li><p><em>not_full</em> und</p></li><li><p><em>not_empty</em>.</p></li></ul><p>In diesem Fall würde gelten, dass, wenn ein Thread auf eine Bedingung wartet, kein anderer Thread auf die andere Bedingung warten kann, da sich die Bedingungen gegenseitig ausschließen.</p></li></ul></ld-topic>
<ld-topic id="beispiel-synchronisation-mit-bedingungsvariablen"><h2>Beispiel: Synchronisation mit Bedingungsvariablen</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">from</span> threading \
</code><small class="ln"> 2</small><code data-lineno=" 2">  <span class="keyword">import</span> Condition<span class="punctuation">,</span> Lock
</code><small class="ln"> 3</small><code data-lineno=" 3">
</code><small class="ln"> 4</small><code data-lineno=" 4"><span class="keyword">class</span> <span class="name class">BoundedBuffer</span><span class="punctuation">:</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">
</code><small class="ln"> 6</small><code data-lineno=" 6">  <span class="keyword">def</span> <span class="name function">__init__</span><span class="punctuation">(</span>self<span class="punctuation">,</span> capacity<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    self<span class="punctuation">.</span>capacity <span class="operator">=</span> capacity
</code><small class="ln"> 8</small><code data-lineno=" 8">    self<span class="punctuation">.</span><span class="name builtin">buffer</span> <span class="operator">=</span> <span class="punctuation">[</span><span class="punctuation">]</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    self<span class="punctuation">.</span>lock <span class="operator">=</span> Lock<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">10</small><code data-lineno="10">    self<span class="punctuation">.</span>not_empty <span class="operator">=</span> Condition<span class="punctuation">(</span>self<span class="punctuation">.</span>lock<span class="punctuation">)</span>
</code><small class="ln">11</small><code data-lineno="11">    self<span class="punctuation">.</span>not_full <span class="operator">=</span> Condition<span class="punctuation">(</span>self<span class="punctuation">.</span>lock<span class="punctuation">)</span></code></pre></ld-cell><ld-cell class="width-50 incremental" style="align-self:auto;"><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1">  <span class="keyword">def</span> <span class="name function">put</span><span class="punctuation">(</span>self<span class="punctuation">,</span> item<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">with</span> self<span class="punctuation">.</span>not_full<span class="punctuation">:</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">      <span class="keyword">while</span> <span class="name builtin">len</span><span class="punctuation">(</span>self<span class="punctuation">.</span><span class="name builtin">buffer</span><span class="punctuation">)</span> <span class="operator">==</span> \
</code><small class="ln"> 4</small><code data-lineno=" 4">            self<span class="punctuation">.</span>capacity<span class="punctuation">:</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">        self<span class="punctuation">.</span>not_full<span class="punctuation">.</span>wait<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">      self<span class="punctuation">.</span><span class="name builtin">buffer</span><span class="punctuation">.</span>append<span class="punctuation">(</span>item<span class="punctuation">)</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">      self<span class="punctuation">.</span>not_empty<span class="punctuation">.</span>notify<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9">  <span class="keyword">def</span> <span class="name function">get</span><span class="punctuation">(</span>self<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln">10</small><code data-lineno="10">    <span class="keyword">with</span> self<span class="punctuation">.</span>not_empty<span class="punctuation">:</span>
</code><small class="ln">11</small><code data-lineno="11">      <span class="keyword">while</span> <span class="name builtin">len</span><span class="punctuation">(</span>self<span class="punctuation">.</span><span class="name builtin">buffer</span><span class="punctuation">)</span> <span class="operator">==</span> <span class="literal number integer">0</span><span class="punctuation">:</span>
</code><small class="ln">12</small><code data-lineno="12">        self<span class="punctuation">.</span>not_empty<span class="punctuation">.</span>wait<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">13</small><code data-lineno="13">      item <span class="operator">=</span> self<span class="punctuation">.</span><span class="name builtin">buffer</span><span class="punctuation">.</span>pop<span class="punctuation">(</span><span class="literal number integer">0</span><span class="punctuation">)</span>
</code><small class="ln">14</small><code data-lineno="14">      self<span class="punctuation">.</span>not_full<span class="punctuation">.</span>notify<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">15</small><code data-lineno="15">      <span class="keyword">return</span> item</code></pre></ld-cell></ld-grid></ld-topic>
<ld-topic class="smaller" id="beispiel-synchronisation-mit-nur-einer-bedingung"><h2>Beispiel: Synchronisation mit nur einer Bedingung</h2><ld-deck><ld-card><div class="minor"><p>Im Folgenden sehen wir eine Implementierung mit nur einer Bedingungsvariablen, um bestimmte Synchronisationsfehler demonstrieren zu können.</p></div></ld-card><ld-card class="incremental"><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">from</span> threading <span class="keyword">import</span> Thread<span class="punctuation">,</span> Lock<span class="punctuation">,</span> Condition
</code><small class="ln"> 2</small><code data-lineno=" 2">
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">class</span> <span class="name class">BoundedBuffer</span><span class="punctuation">:</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5">  <span class="keyword">def</span> <span class="name function">__init__</span><span class="punctuation">(</span>self<span class="punctuation">,</span> capacity<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    self<span class="punctuation">.</span>capacity <span class="operator">=</span> capacity
</code><small class="ln"> 7</small><code data-lineno=" 7">    self<span class="punctuation">.</span><span class="name builtin">buffer</span> <span class="operator">=</span> <span class="punctuation">[</span><span class="punctuation">]</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    self<span class="punctuation">.</span>lock <span class="operator">=</span> Lock<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    self<span class="punctuation">.</span>not_used <span class="operator">=</span> Condition<span class="punctuation">(</span>self<span class="punctuation">.</span>lock<span class="punctuation">)</span>
</code><small class="ln">10</small><code data-lineno="10">
</code><small class="ln">11</small><code data-lineno="11"><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span></code></pre></ld-card><ld-card class="incremental"><pre class="code python copy-to-clipboard literal-block"><small class="ln">11</small><code data-lineno="11">  <span class="keyword">def</span> <span class="name function">put</span><span class="punctuation">(</span>self<span class="punctuation">,</span> item<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln">12</small><code data-lineno="12">    <span class="keyword">with</span> self<span class="punctuation">.</span>not_used<span class="punctuation">:</span>
</code><small class="ln">13</small><code data-lineno="13">      <span class="keyword">while</span> <span class="name builtin">len</span><span class="punctuation">(</span>self<span class="punctuation">.</span><span class="name builtin">buffer</span><span class="punctuation">)</span> <span class="operator">==</span> self<span class="punctuation">.</span>capacity<span class="punctuation">:</span>
</code><small class="ln">14</small><code data-lineno="14">        self<span class="punctuation">.</span>not_used<span class="punctuation">.</span>wait<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">15</small><code data-lineno="15">      self<span class="punctuation">.</span><span class="name builtin">buffer</span><span class="punctuation">.</span>append<span class="punctuation">(</span>item<span class="punctuation">)</span>
</code><small class="ln">16</small><code data-lineno="16">      self<span class="punctuation">.</span>not_used<span class="punctuation">.</span>notify_all<span class="punctuation">(</span><span class="punctuation">)</span> <span class="comment single"># notify_all() !</span></code></pre></ld-card><ld-card class="incremental"><pre class="code python copy-to-clipboard literal-block"><small class="ln">19</small><code data-lineno="19">  <span class="keyword">def</span> <span class="name function">get</span><span class="punctuation">(</span>self<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln">20</small><code data-lineno="20">    <span class="keyword">with</span> self<span class="punctuation">.</span>not_used<span class="punctuation">:</span>
</code><small class="ln">21</small><code data-lineno="21">      <span class="keyword">while</span> <span class="name builtin">len</span><span class="punctuation">(</span>self<span class="punctuation">.</span><span class="name builtin">buffer</span><span class="punctuation">)</span> <span class="operator">==</span> <span class="literal number integer">0</span><span class="punctuation">:</span>
</code><small class="ln">22</small><code data-lineno="22">        self<span class="punctuation">.</span>not_used<span class="punctuation">.</span>wait<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">23</small><code data-lineno="23">      item <span class="operator">=</span> self<span class="punctuation">.</span><span class="name builtin">buffer</span><span class="punctuation">.</span>pop<span class="punctuation">(</span><span class="literal number integer">0</span><span class="punctuation">)</span>
</code><small class="ln">24</small><code data-lineno="24">      self<span class="punctuation">.</span>not_used<span class="punctuation">.</span>notify_all<span class="punctuation">(</span><span class="punctuation">)</span> <span class="comment single"># notify_all() !</span>
</code><small class="ln">25</small><code data-lineno="25">      <span class="keyword">return</span> item</code></pre></ld-card><ld-card class="incremental"><div class="red"><p>Fehler, der bei der Verwendung von <span class="docutils literal">notify</span> (statt <span class="docutils literal">notify_all</span>) auftreten könnte.</p></div><pre class="code python copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1">bb <span class="operator">=</span> BoundedBuffer<span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2">p1 <span class="operator">=</span> Thread<span class="punctuation">(</span>target<span class="operator">=</span><span class="keyword">lambda</span><span class="punctuation">:</span> bb<span class="punctuation">.</span>put<span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span> p2 <span class="operator">=</span> Thread<span class="punctuation">(</span>target<span class="operator">=</span><span class="keyword">lambda</span><span class="punctuation">:</span> bb<span class="punctuation">.</span>put<span class="punctuation">(</span><span class="literal number integer">2</span><span class="punctuation">)</span><span class="punctuation">)</span>
</code><small class="ln">3</small><code data-lineno="3">c1 <span class="operator">=</span> Thread<span class="punctuation">(</span>target<span class="operator">=</span><span class="keyword">lambda</span><span class="punctuation">:</span> bb<span class="punctuation">.</span>get<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span> c2 <span class="operator">=</span> Thread<span class="punctuation">(</span>target<span class="operator">=</span><span class="keyword">lambda</span><span class="punctuation">:</span> bb<span class="punctuation">.</span>get<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span>
</code><small class="ln">4</small><code data-lineno="4">c1<span class="punctuation">.</span>start<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> c2<span class="punctuation">.</span>start<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> p1<span class="punctuation">.</span>start<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> p2<span class="punctuation">.</span>start<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre><table class="incremental-table-rows borderless compact highlight-cell-on-hover"><thead><tr><th class="head"></th><th class="head"><p>Aktionen</p></th><th class="head"><p>(Änderung des) Zustand(s) des Buffers</p></th><th class="head"><p>Auf die Sperre (<em>Lock</em>) wartend</p></th><th class="head"><p>An der Bedingung wartend</p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p><strong>c1:bb.get()</strong>, <br> c2:bb.get(), p1:bb.put(), p2:bb.put()</p></td><td><p>empty</p></td><td><p>{c2,p1,p2}</p></td><td><p>{c1}</p></td></tr><tr><td><p>2</p></td><td><p><strong>c2:bb.get()</strong></p></td><td><p>empty</p></td><td><p>{p1,p2}</p></td><td><p>{c1,c2}</p></td></tr><tr><td><p>3</p></td><td><p><strong>p1:bb.put(1)</strong></p></td><td><p>empty → not empty</p></td><td><p>{p2,c1}</p></td><td><p>{c2}</p></td></tr><tr><td><p>4</p></td><td><p><strong>p2:bb.put(2)</strong></p></td><td><p>not empty</p></td><td><p>{c1}</p></td><td><p>{c2,p2}</p></td></tr><tr><td><p>5</p></td><td><p><strong>c1:bb.get()</strong></p></td><td><p>not empty → empty</p></td><td><p>{c2}</p></td><td><p>{p2}</p></td></tr><tr><td><p>6</p></td><td><p><strong>c2:bb.get()</strong></p></td><td><p>empty</p></td><td><p>∅</p></td><td><p>{c2,p2}</p></td></tr></tbody></table></ld-card></ld-deck><ld-supplemental><p>In Schritt 5 wurde (z. B.)- aufgrund des Aufrufs von <span class="docutils literal">notify</span> durch <span class="docutils literal">c1</span> - der Thread <span class="docutils literal">c2</span> aufgeweckt - anstatt des Threads <span class="docutils literal">p2</span>. Der aufgeweckte Thread <span class="docutils literal">c2</span> prüft die Bedingung (Schritt 6) und stellt fest, dass der Puffer leer ist. Er geht wieder in den Wartezustand. Jetzt warten sowohl ein Thread, der ein Wert schreiben möchte, als auch ein Thread, der einen Wert lesen möchte.</p></ld-supplemental></ld-topic>
<ld-topic id="best-practices-in-hinblick-auf-synchronisation"><h2><em>Best Practices</em> in Hinblick auf Synchronisation</h2><ul class="incremental-list dhbw"><li><p>Code, der eine Sperre hält (<span class="eng">Lock</span>) sollte so kurz (zeitlich) wie möglich gehalten werden.</p><p>(D. h. der Code zwischen <span class="docutils literal">Lock.acquire()</span> und <span class="docutils literal">Lock.release()</span>)</p></li><li><p>Verschachtelte Anforderungen von Sperren sollten vermieden werden, da die äußere Sperre nicht freigegeben wird, wenn man an der Inneren wartet. Dies kann leicht zum Auftreten eines Deadlocks führen.</p></li></ul></ld-topic>
<ld-topic class="no-title center-content" id="ressourcen-immer-in-der-gleichen-reihenfolge-sperren"><h2>Ressourcen immer in der gleichen Reihenfolge sperren</h2><div class="accentuate"><p>Wenn zwei (oder mehr) Threads bzw. Prozesse auf die gleichen Ressourcen in unterschiedlicher Reihenfolge zugreifen und entsprechende Sperren halten bzw. anfordern, kann es zu einem Deadlock kommen.</p></div><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p><strong>Ressourcen immer in der gleichen Reihenfolge sperren</strong>, um Deadlocks zu vermeiden.</p></aside></ld-topic>
<ld-topic class="no-title center-child-elements transition-scale" id="alternative-synchronisationsmechanismen"><h2>Alternative Synchronisationsmechanismen</h2><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p><em>Sperren</em> (d. h. <span class="docutils literal">Lock</span>s) in Verbindung mit Bedigungsvariablen sind nur eine Möglichkeit, um die Synchronisation von Threads zu ermöglichen. Es ist jedoch ein sehr häufiges Modell. (Alternativen sind zum Beispiel: <em>Semaphoren</em>, <em>Nachrichtenübermittlung</em>)</p></aside></ld-topic>
<ld-topic class="new-section" id="ausgewahlte-aspekte-der-nebenlaufigkeit"><h2>Ausgewählte Aspekte der Nebenläufigkeit</h2></ld-topic>
<ld-topic id="thread-lokaler-speicher"><h2>Thread-lokaler Speicher</h2><p>Thread-lokaler Speicher (<span class="docutils literal">threading.local()</span>) ermöglicht es, dass jeder Thread eine lokale Kopie einer bestimmten Variable hat</p><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><pre class="code python copy-to-clipboard literal-block"><code><span class="keyword">import</span> time
<span class="keyword">import</span> threading

stop <span class="operator">=</span> <span class="keyword constant">False</span> <span class="comment single"># shared global variable</span>
local_data <span class="operator">=</span> threading<span class="punctuation">.</span>local<span class="punctuation">(</span><span class="punctuation">)</span>

<span class="keyword">def</span> <span class="name function">f</span><span class="punctuation">(</span>v<span class="punctuation">)</span><span class="punctuation">:</span>
    <span class="name builtin">setattr</span><span class="punctuation">(</span>local_data<span class="punctuation">,</span> <span class="literal string">"value"</span><span class="punctuation">,</span> <span class="literal number integer">0</span><span class="punctuation">)</span>
    <span class="keyword">while</span><span class="punctuation">(</span><span class="keyword">not</span> stop<span class="punctuation">)</span><span class="punctuation">:</span>
        <span class="keyword">print</span><span class="punctuation">(</span>local_data<span class="punctuation">.</span>value<span class="punctuation">)</span>
        local_data<span class="punctuation">.</span>value <span class="operator">+=</span> v
        time<span class="punctuation">.</span>sleep<span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">)</span></code></pre></ld-cell><ld-cell class="width-50 incremental" style="align-self:auto;"><pre class="code python copy-to-clipboard literal-block"><code><span class="comment single"># "main" thread</span>
t1 <span class="operator">=</span> threading<span class="punctuation">.</span>Thread<span class="punctuation">(</span>target<span class="operator">=</span>f<span class="punctuation">,</span> args<span class="operator">=</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">,</span><span class="punctuation">)</span><span class="punctuation">)</span>
t2 <span class="operator">=</span> threading<span class="punctuation">.</span>Thread<span class="punctuation">(</span>target<span class="operator">=</span>f<span class="punctuation">,</span> args<span class="operator">=</span><span class="punctuation">(</span><span class="operator">-</span><span class="literal number integer">1</span><span class="punctuation">,</span><span class="punctuation">)</span><span class="punctuation">)</span>
t1<span class="punctuation">.</span>start<span class="punctuation">(</span><span class="punctuation">)</span>
t2<span class="punctuation">.</span>start<span class="punctuation">(</span><span class="punctuation">)</span>
time<span class="punctuation">.</span>sleep<span class="punctuation">(</span><span class="literal number integer">3</span><span class="punctuation">)</span><span class="punctuation">;</span>
<span class="keyword">print</span><span class="punctuation">(</span><span class="literal string">"Attributes of local_data: "</span> <span class="operator">+</span> \
      <span class="name builtin">str</span><span class="punctuation">(</span>local_data<span class="punctuation">.</span>__dict__<span class="punctuation">.</span>keys<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">)</span>
stop <span class="operator">=</span> <span class="keyword constant">True</span>
<span class="keyword">print</span><span class="punctuation">(</span><span class="literal string">"Stop set to True."</span><span class="punctuation">)</span>
t1<span class="punctuation">.</span>join<span class="punctuation">(</span><span class="punctuation">)</span>
t2<span class="punctuation">.</span>join<span class="punctuation">(</span><span class="punctuation">)</span></code></pre></ld-cell></ld-grid><ld-supplemental><pre class="code bash literal-block"><code>$ ./ThreadLocal.py
<span class="literal number integer">0</span>
<span class="literal number integer">0</span>
<span class="name variable">-1</span>
<span class="literal number integer">1</span>
<span class="name variable">-2</span>
<span class="literal number integer">2</span>
Attributes of local_data: <span class="punctuation">[</span><span class="punctuation">]</span>
Stop <span class="name class">set</span> to True. Waiting <span class="keyword">for</span> threads to finish.</code></pre></ld-supplemental></ld-topic>
<ld-topic id="reentrant-locks"><h2>Reentrant Locks</h2><ul class="simple"><li><p><em>Reentrant Lock</em>s (<span class="docutils literal">RLock</span>) sind Sperren, die von demselben Thread mehrmals erworben werden können.</p></li><li><p>Implementierungen: <span class="docutils literal">threading.RLock</span> oder <span class="docutils literal">multiprocessing.RLock</span>.</p></li></ul></ld-topic>
<ld-topic id="thread-processpools"><h2>Thread-/ProcessPools</h2><ul><li><p><em>ThreadPools</em> und <em>ProcessPools</em> bieten eine höherwertige Abstraktion, um eine große Anzahl von Aufgaben nebenläufig zu verarbeiten.</p></li><li><p>Beide erben von <span class="docutils literal">concurrent.futures.Executor</span>; zentrale Methoden:</p><ul><li><p><span class="docutils literal">submit(fn, *args, **kwargs)</span>: Fügt eine Aufgabe hinzu und gibt ein <span class="docutils literal">Future</span>-Objekt zurück.</p><p>Auf Futures sind die Hauptfunktionen:</p><ul class="simple"><li><p><span class="docutils literal">done()</span>: Gibt zurück, ob die Aufgabe abgeschlossen ist.</p></li><li><p><span class="docutils literal">result(timeout=None)</span>: Gibt das Ergebnis zurück, wenn die Aufgabe abgeschlossen ist; blockiert ggf..</p></li></ul></li><li><p><span class="docutils literal">map(func, *iterables, timeout=None, chunksize=1)</span>: Führt die Funktion für jedes Element in <span class="docutils literal">iterables</span> aus und gibt die Ergebnisse in der Reihenfolge zurück, in der sie abgeschlossen wurden.</p></li></ul></li></ul></ld-topic>
<ld-topic class="new-subsection" id="nachrichtenaustausch"><h2>Nachrichtenaustausch</h2></ld-topic>
<ld-topic id="motivation-nachrichtenaustausch"><h2>Motivation: Nachrichtenaustausch</h2><ul class="incremental-list simple"><li><p>Locks haben das große Potential eigentlich nebenläufige Programme effektiv zu serialisieren (und zu verlangsamen).</p></li><li><p>Prozesse nutzen keinen gemeinsamen Adressraum.</p></li><li><p>Eine Möglichkeit auf Locks weitgehend zu verzichten ist der Nachrichtenaustausch.</p></li></ul><ld-supplemental><p>Generell ist der Austausch zwischen Prozessen über <span class="docutils literal">Queue</span>s, <span class="docutils literal">Pipe</span>s und (explizitem) <span class="docutils literal">SharedMemory</span> möglich; d. h. in diesen Fällen ist Inter-Prozess-Kommunikation (<em>Interprocess Communication (IPC)</em>) notwendig.</p></ld-supplemental></ld-topic>
<ld-topic id="queues"><h2><span class="docutils literal">Queue</span>s</h2><p class="rubric"><span class="docutils literal">queue.Queue</span> oder <span class="docutils literal">multiprocessing.JoinableQueue</span></p><p>Die grundlegenden Methoden von <span class="docutils literal">Queue</span>s sind:</p><ul class="list-with-explanations"><li><p><span class="docutils literal">Queue(maxsize=0)</span></p><p>Erzeugt eine neue Queue-Instanz welche <span class="docutils literal">maxsize</span>  Elemente speichern kann. 0 bedeutet, dass die Queue unendlich groß ist.</p><p>(Pythons <span class="docutils literal">Queue</span> realisiert einen <em>Bounded Buffer</em>.)</p></li></ul><ul class="incremental simple"><li><p><span class="docutils literal">put(item)</span>: Fügt ein Element in die Queue ein.</p></li><li><p><span class="docutils literal">get()</span>: Entfernt und gibt das erste Element aus der Queue zurück.</p></li></ul><ul class="incremental simple"><li><p><span class="docutils literal">task_done()</span>: Signalisiert, dass ein Element aus der Queue <em>abgearbeitet</em> wurde.</p></li><li><p><span class="docutils literal">join()</span>: Blockiert bis alle Elemente aus der Queue <em>abgearbeitet</em> wurde.</p></li></ul></ld-topic>
<ld-topic id="beispiel-verwendung-von-queues-fur-thread-sichere-konsolenausgabe"><h2>Beispiel - Verwendung von <span class="docutils literal">Queue</span>s für Thread-Sichere Konsolenausgabe</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">Setup</p><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">import</span> threading
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">from</span> queue <span class="keyword">import</span> Queue
</code><small class="ln"> 3</small><code data-lineno=" 3">
</code><small class="ln"> 4</small><code data-lineno=" 4">print_queue <span class="operator">=</span> Queue<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">
</code><small class="ln"> 6</small><code data-lineno=" 6"><span class="keyword">def</span> <span class="name function">ts_print</span><span class="punctuation">(</span>msg<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    print_queue<span class="punctuation">.</span>put<span class="punctuation">(</span>msg<span class="punctuation">)</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9"><span class="keyword">def</span> <span class="name function">print_handler</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln">10</small><code data-lineno="10">    <span class="keyword">while</span> <span class="keyword constant">True</span><span class="punctuation">:</span>
</code><small class="ln">11</small><code data-lineno="11">        msg <span class="operator">=</span> print_queue<span class="punctuation">.</span>get<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">12</small><code data-lineno="12">        <span class="comment single"># there will ever be only one thread</span>
</code><small class="ln">13</small><code data-lineno="13">        <span class="keyword">print</span><span class="punctuation">(</span>msg<span class="punctuation">)</span>
</code><small class="ln">14</small><code data-lineno="14">        print_queue<span class="punctuation">.</span>task_done<span class="punctuation">(</span><span class="punctuation">)</span></code></pre></ld-cell><ld-cell class="width-50 incremental" style="align-self:auto;"><p class="rubric">Verwendung</p><pre class="code python copy-to-clipboard literal-block"><code>Thread<span class="punctuation">(</span>target<span class="operator">=</span>print_handler<span class="punctuation">,</span>daemon<span class="operator">=</span><span class="keyword constant">True</span><span class="punctuation">)</span><span class="punctuation">.</span>\
  start<span class="punctuation">(</span><span class="punctuation">)</span>
⁞
<span class="comment single"># &lt;thread 1:&gt; ts_print("Hello")</span>
⁞
<span class="comment single"># &lt;thread 2:&gt; ts_print("World")</span>
⁞
print_queue<span class="punctuation">.</span>join<span class="punctuation">(</span><span class="punctuation">)</span></code></pre></ld-cell></ld-grid><ld-supplemental><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><ul class="simple"><li><p><strong>nur ein Thread darf die print_queue abarbeiten</strong></p></li><li><p><strong>wir müssen überall <span class="docutils literal">ts_print</span> verwenden</strong></p></li></ul></aside></ld-supplemental></ld-topic>
<ld-topic id="verwendung-von-queues-fur-die-kommunikation-zwischen-prozessen"><h2>Verwendung von <span class="docutils literal">Queue</span>s für die Kommunikation zwischen Prozessen</h2><ld-deck><ld-card><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">from</span> random <span class="keyword">import</span> randint
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">from</span> multiprocessing <span class="keyword">import</span> current_process<span class="punctuation">,</span> Process<span class="punctuation">,</span> JoinableQueue <span class="keyword">as</span> MPQueue
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">from</span> threading <span class="keyword">import</span> Thread
</code><small class="ln"> 4</small><code data-lineno=" 4"><span class="keyword">from</span> queue <span class="keyword">import</span> Queue <span class="keyword">as</span> TQueue
</code><small class="ln"> 5</small><code data-lineno=" 5"><span class="keyword">import</span> time
</code><small class="ln"> 6</small><code data-lineno=" 6">
</code><small class="ln"> 7</small><code data-lineno=" 7"><span class="keyword">def</span> <span class="name function">print_queue_handler</span><span class="punctuation">(</span>print_queue<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="keyword">while</span> <span class="keyword constant">True</span><span class="punctuation">:</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">        msg <span class="operator">=</span> print_queue<span class="punctuation">.</span>get<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">10</small><code data-lineno="10">        <span class="keyword">print</span><span class="punctuation">(</span>msg<span class="punctuation">)</span>
</code><small class="ln">11</small><code data-lineno="11">        print_queue<span class="punctuation">.</span>task_done<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">12</small><code data-lineno="12">
</code><small class="ln">13</small><code data-lineno="13"><span class="keyword">def</span> <span class="name function">read_from_ip_queue</span><span class="punctuation">(</span>ip_queue<span class="punctuation">,</span> print_queue<span class="punctuation">)</span><span class="punctuation">:</span> <span class="comment single"># ip =(here) interprocess</span>
</code><small class="ln">14</small><code data-lineno="14">    <span class="keyword">while</span> <span class="keyword constant">True</span><span class="punctuation">:</span>
</code><small class="ln">15</small><code data-lineno="15">        msg <span class="operator">=</span> ip_queue<span class="punctuation">.</span>get<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">16</small><code data-lineno="16">        print_queue<span class="punctuation">.</span>put<span class="punctuation">(</span>msg<span class="punctuation">)</span>
</code><small class="ln">17</small><code data-lineno="17">        ip_queue<span class="punctuation">.</span>task_done<span class="punctuation">(</span><span class="punctuation">)</span></code></pre></ld-card><ld-card class="incremental"><pre class="code python copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">def</span> <span class="name function">f</span><span class="punctuation">(</span>c_to_p_ip_queue<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln">2</small><code data-lineno="2">    time<span class="punctuation">.</span>sleep<span class="punctuation">(</span>randint<span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">,</span> <span class="literal number integer">3</span><span class="punctuation">)</span><span class="punctuation">)</span> <span class="comment single"># just some fuzzing</span>
</code><small class="ln">3</small><code data-lineno="3">
</code><small class="ln">4</small><code data-lineno="4">    c_to_p_ip_queue<span class="punctuation">.</span>put<span class="punctuation">(</span><span class="literal string">"I'm alive: "</span> <span class="operator">+</span> current_process<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">.</span>name<span class="punctuation">)</span>
</code><small class="ln">5</small><code data-lineno="5">
</code><small class="ln">6</small><code data-lineno="6">    time<span class="punctuation">.</span>sleep<span class="punctuation">(</span>randint<span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">,</span> <span class="literal number integer">3</span><span class="punctuation">)</span><span class="punctuation">)</span> <span class="comment single"># just some fuzzing</span>
</code><small class="ln">7</small><code data-lineno="7">
</code><small class="ln">8</small><code data-lineno="8">    c_to_p_ip_queue<span class="punctuation">.</span>put<span class="punctuation">(</span><span class="literal string">"Hell World from "</span> <span class="operator">+</span> current_process<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">.</span>name<span class="punctuation">)</span></code></pre></ld-card><ld-card class="incremental"><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">if</span> __name__ <span class="operator">==</span> <span class="literal string">"__main__"</span><span class="punctuation">:</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    print_queue <span class="operator">=</span> TQueue<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    c_to_p_ip_queue <span class="operator">=</span> MPQueue<span class="punctuation">(</span><span class="punctuation">)</span>
