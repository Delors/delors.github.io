<ld-topic class="new-subsection" id="thread-safety"><h2>Thread Safety</h2><div class="footer-left tiny minor"><p><span class="ger">Threadsicherheit</span></p></div></ld-topic>
<ld-topic class="smaller" id="thread-safety-voraussetzung"><h2>Thread Safety - Voraussetzung</h2><p>Damit eine Klasse thread-sicher ist, muss sie sich in einer single-threaded Umgebung korrekt verhalten.</p><ld-deck><ld-card><p>D. h. wenn eine Klasse korrekt implementiert ist, dann sollte keine Abfolge von Operationen (Lesen oder Schreiben von öffentlichen Feldern und Aufrufen von öffentlichen Methoden) auf Objekten dieser Klasse in der Lage sein:</p><blockquote><ul class="simple"><li><p>das Objekt in einen ungültigen Zustand versetzen,</p></li><li><p>das Objekt in einem ungültigen Zustand zu beobachten oder</p></li><li><p>eine der Invarianten, Vorbedingungen oder Nachbedingungen der Klasse verletzen.</p></li></ul></blockquote></ld-card><ld-card class="incremental"><p>Die Klasse muss das korrekte Verhalten auch dann aufweisen,
wenn auf sie von mehreren Threads aus zugegriffen wird.</p><ul class="simple"><li><p>Unabhängig vom <em>Scheduling</em> oder der Verschachtelung der Ausführung dieser Threads durch die Laufzeitumgebung,</p></li><li><p>Ohne zusätzliche Synchronisierung auf Seiten des aufrufenden Codes.</p></li></ul></ld-card></ld-deck><div class="accentuate"><p>Dies hat zur Folge, dass Operationen auf einem thread-sicheren Objekt für alle Threads so erscheinen als ob die Operationen in einer festen, global konsistenten Reihenfolge erfolgen würden.</p></div><ld-supplemental><p>Da sich Prozesse den Adressraum mit Threads nicht teilen, ist es nicht möglich, dass ein Prozess den Speicher eines anderen Prozesses direkt manipuliert. Dies bedeutet jedoch nicht, dass keine Inter-Prozess-Koordination notwendig ist. Insbesondere wenn auf auf gemeinsame Ressourcen - wie zum Beispiel die Konsole - zugegriffen wird, ist eine Koordination notwendig.</p></ld-supplemental></ld-topic>
<ld-topic id="thread-safety-level"><h2>Thread Safety Level</h2><dl class="incremental-list field-list simple"><dt>Immutable <span class="ger">Unveränderlich</span><span class="colon">:</span></dt><dd><p>Die Objekte sind konstant und können nicht geändert werden.</p></dd><dt>Thread-sicher<span class="colon">:</span></dt><dd><p>Die Objekte sind veränderbar, unterstützen aber nebenläufigen Zugriff, da die Methoden entsprechende Sperren und Bedingungen verwenden.</p></dd><dt>Bedingt Thread-sicher<span class="colon">:</span></dt><dd><p>All solche Objekte bei denen jede einzelne Operation thread-sicher ist, aber bestimmte Sequenzen von Operationen eine externe Synchronisierung erfordern können.</p></dd><dt>Thread-kompatibel<span class="colon">:</span></dt><dd><p>Alle Objekte die keinerlei Synchronisierung aufweisen. Der Aufrufer kann die Synchronisierung jedoch ggf. extern übernehmen.</p></dd><dt>Thread-hostile „Thread-schädlich“<span class="colon">:</span></dt><dd><p>Objekte, die nicht thread-sicher sind und auch nicht thread-sicher gemacht werden können, da sie zum Beispiel globalen Zustand manipulieren.</p></dd></dl><ld-supplemental><p>Ein Beispiel bzgl. <em>bedingt Thread-sicher</em> wäre die Verwendung eines Iterators, bei dem
die Methoden für sich genommen thread-sicher sind, aber die Iteration über die Elemente als ganzes zusätzliche Synchronisation erfordert, damit die Ergebnisse konsistent sind.</p><p>Ein Beispiel für eine <em>thread-schädliche</em> Klasse (Code) wäre eine Klasse, die auf eine globale Variable zugreift bzw. globalen Zustand ändert, der von mehreren Threads verwendet wird, ohne dass eine Synchronisierung stattfindet.</p></ld-supplemental></ld-topic>
<ld-topic class="no-title center-content transition-move-up" id="concurrency-done-wrong"><h2>Concurrency Done Wrong</h2><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Wenn Nebenläufigkeit nicht richtig umgesetzt wird, dann kann dies nicht nur zu schwer zu findenden Fehlern führen sondern auch <strong>zu langsam(er)en Programmen</strong>.</p><div class="incremental"><p>Im Allgemeinen sollte Parallelisierung auf <em>höchstmöglicher Ebene</em> erfolgen.</p></div></aside></ld-topic>
<ld-topic id="threads-und-prozesse-nicht-terminieren"><h2>Threads und Prozesse nicht terminieren</h2><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Auch wenn es technisch möglich ist Threads und Prozesse explizit zu terminieren (z. B. durch <span class="docutils literal">Process.terminate()</span>) so sollte man darauf verzichten.</p></aside><ld-supplemental><p>Das Hauptproblem sind nicht freigegebene Locks und Ressourcen, die sich in einem inkonsistenten Zustand befinden können.</p><p>Auch in anderen Programmiersprachen sollte man niemals Threads oder Prozesse explizit terminieren.</p></ld-supplemental></ld-topic>
<ld-topic class="no-title center-content transition-move-up" id="starte-immer-mit-einer-single-threaded-implementation"><h2>Starte immer mit einer <em>Single-threaded implementation</em></h2><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Nebenläufigkeit macht <em>nichts</em> einfacher! Entwickle und teste immer erst eine single-threaded Version des Programms.</p></aside></ld-topic>
<ld-topic class="exercises" id="ubung"><h2>Übung</h2><ld-story><p>Implementieren Sie einen einfachen <em>DelayedBuffer</em>, der es ermöglicht Aufgaben (d. h. Objekte vom Typ <span class="docutils literal">Callable</span>) erst nach einer bestimmten Zeit auszuführen. Die Klasse muss zwei Funktionen zur Verfügung stellen:</p><dl class="field-list simple"><dt><span class="docutils literal">submit(self, delay, fn, *args, **kwargs)</span><span class="colon">:</span></dt><dd><p>Die Funktion <span class="docutils literal">fn</span> wird nach <span class="docutils literal">delay</span> Sekunden ausgeführt wobei delay vom Typ Float ist. <span class="docutils literal">args</span> und <span class="docutils literal">kwargs</span> sind die Argumente, die an <span class="docutils literal">fn</span> übergeben werden.</p></dd><dt><span class="docutils literal">join(self)</span><span class="colon">:</span></dt><dd><p>Wartet bis alle Aufgaben abgearbeitet wurden.</p></dd></dl><div class="incremental"><p>Im Folgenden sehen Sie eine mögliche Verwendung des Puffers:</p><pre class="code python copy-to-clipboard literal-block"><code><span class="name builtin">buffer</span> <span class="operator">=</span> DelayedBuffer<span class="punctuation">(</span><span class="punctuation">)</span>
<span class="name builtin">buffer</span><span class="punctuation">.</span>submit<span class="punctuation">(</span><span class="literal number integer">100</span> <span class="operator">/</span> <span class="literal number integer">1000</span><span class="punctuation">,</span> ts_print<span class="punctuation">,</span> <span class="literal string">"Hello "</span><span class="punctuation">,</span> <span class="operator">**</span><span class="punctuation">{</span><span class="literal string">"end"</span><span class="punctuation">:</span> <span class="literal string">""</span><span class="punctuation">,</span> <span class="literal string">"flush"</span><span class="punctuation">:</span> <span class="keyword constant">True</span><span class="punctuation">}</span><span class="punctuation">)</span>
<span class="name builtin">buffer</span><span class="punctuation">.</span>submit<span class="punctuation">(</span><span class="literal number integer">1000</span> <span class="operator">/</span> <span class="literal number integer">1000</span><span class="punctuation">,</span> ts_print<span class="punctuation">,</span> <span class="literal string">"World!"</span><span class="punctuation">)</span>
<span class="name builtin">buffer</span><span class="punctuation">.</span>submit<span class="punctuation">(</span><span class="literal number integer">500</span> <span class="operator">/</span> <span class="literal number integer">1000</span><span class="punctuation">,</span> ts_print<span class="punctuation">,</span> <span class="literal string">"of the "</span><span class="punctuation">,</span> <span class="operator">**</span><span class="punctuation">{</span><span class="literal string">"end"</span><span class="punctuation">:</span> <span class="literal string">""</span><span class="punctuation">,</span> <span class="literal string">"flush"</span><span class="punctuation">:</span> <span class="keyword constant">True</span><span class="punctuation">}</span><span class="punctuation">)</span>
<span class="name builtin">buffer</span><span class="punctuation">.</span>submit<span class="punctuation">(</span><span class="literal number integer">200</span> <span class="operator">/</span> <span class="literal number integer">1000</span><span class="punctuation">,</span> ts_print<span class="punctuation">,</span> <span class="literal string">"from "</span><span class="punctuation">,</span> <span class="operator">**</span><span class="punctuation">{</span><span class="literal string">"end"</span><span class="punctuation">:</span> <span class="literal string">""</span><span class="punctuation">,</span> <span class="literal string">"flush"</span><span class="punctuation">:</span> <span class="keyword constant">True</span><span class="punctuation">}</span><span class="punctuation">)</span>
<span class="name builtin">buffer</span><span class="punctuation">.</span>submit<span class="punctuation">(</span><span class="literal number integer">300</span> <span class="operator">/</span> <span class="literal number integer">1000</span><span class="punctuation">,</span> ts_print<span class="punctuation">,</span> <span class="literal string">"the other side "</span><span class="punctuation">,</span> <span class="operator">**</span><span class="punctuation">{</span><span class="literal string">"end"</span><span class="punctuation">:</span> <span class="literal string">""</span><span class="punctuation">,</span> <span class="literal string">"flush"</span><span class="punctuation">:</span> <span class="keyword constant">True</span><span class="punctuation">}</span><span class="punctuation">)</span>
<span class="comment single"># ggf. await buffer.join() im Falle von Koroutinen</span>
<span class="name builtin">buffer</span><span class="punctuation">.</span>join<span class="punctuation">(</span><span class="punctuation">)</span>
