<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic class="new-section" id="grundlagen-der-modularisierung"><h2>Grundlagen der Modularisierung</h2></ld-topic>
<ld-topic id="modularisierung"><h2>Modularisierung<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p class="rubric">Modul</p><blockquote class="epigraph"><p>Ein Modul ist im Software Engineering ein Baustein eines Softwaresystems, der bei der Modularisierung entsteht, eine funktional geschlossene Einheit darstellt und einen bestimmten Dienst bereitstellt.</p><p class="attribution">—wikipedia.org <a class="reference external" href="https://de.wikipedia.org/wiki/Modul_(Software)">Modul (Software)</a></p></blockquote></aside><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Java unterstützt neben Klassen und Packages seit Java 9 auch Module als primäres Sprachkonstrukt. In dieser Vorlesung werden wir uns jedoch im Wesentlichen auf die grundlegende Modularisierung mit Hilfe von Klassen und Packages von Java Programmen beschränken.</p></aside></aside></ld-topic>
<ld-topic id="ziele-bei-der-modularisierung-von-code"><h2>Ziele bei der Modularisierung von Code</h2><dl class="incremental-list field-list simple"><dt>Wiederverwendbarkeit<span class="colon">:</span></dt><dd><p>Durch Modularisierung kann Code einfacher wiederverwendet werden.</p></dd><dt>Wartbarkeit<span class="colon">:</span></dt><dd><p>Modularer Code, bei dem einzelne Module eine kohärente Funktionalität anbieten, sind einfacher zu verstehen und zu warten. Fehler lassen sich leichter finden und beheben.</p></dd><dt>Erweiterbarkeit<span class="colon">:</span></dt><dd><p>Die Modularisierung von Code ermöglicht es, neue Funktionalitäten hinzuzufügen, ohne bestehenden Code zu verändern.</p></dd><dt>Kollaborative Entwicklung<span class="colon">:</span></dt><dd><p>Durch eine Modularisierung ist es möglich effektiv mit mehreren Personen an einem Projekt zu arbeiten. Jede Person kann an einem Modul arbeiten, ohne die anderen Module zu beeinflussen.</p></dd></dl><ld-supplemental><p>Im Prinzip haben wir bisher nur Methoden zur Strukturierung bzw. Modularisierung kennen gelernt.</p></ld-supplemental></ld-topic>
<ld-topic class="new-section" id="modularisierung-in-java"><h2>Modularisierung in Java</h2><div class="section-subtitle"><p>Einführung in Java: Imports, Packages und Sichtbarkeiten</p></div></ld-topic>
<ld-topic id="modularisierungsebenen-in-java"><h2>Modularisierungsebenen in Java</h2><object class="align-center" data="images/modularisierungsebenen.svg" type="image/svg+xml" role="img" aria-label="Modularisierungsebenen in Java" width="1800px"></object><ld-supplemental><p>Einzelnen Methoden erlauben zwar bereits eine Modularisierung des Codes, da diese aber für sich nicht wiederverwendbar sind (es ist nicht möglich eine Methode alleine in einer Datei zu speichern und in einem anderen Kontext zu nutzen), ist es notwendig, diese in Klassen zu organisieren. Klassen, welche in einzelnen Dateien gespeichert werden, erlauben dann eine Wiederverwendung des Codes.</p></ld-supplemental></ld-topic>
<ld-topic id="grundlegende-konzepte-und-mechanismen-zur-modularisierung-von-java-programmen"><h2>Grundlegende Konzepte und Mechanismen zur Modularisierung von Java Programmen</h2><dl class="incremental-list field-list simple"><dt>Klassen<span class="colon">:</span></dt><dd><p>Klassen sind die Bausteine von Java Programmen und alles - bis auf einfachste Programme - ist in Klassen organisiert.</p></dd><dt>Packages<span class="colon">:</span></dt><dd><p>Packages sind Sammlungen von verwandten Klassen und Schnittstellen.</p></dd><dt><code class="java"><span class="keyword">import</span></code>s<span class="colon">:</span></dt><dd><p>Imports ermöglichen den Zugriff auf Klassen aus anderen Packages, ohne deren vollständigen Namen zu schreiben.</p></dd><dt>Sichtbarkeiten<span class="colon">:</span></dt><dd><p>Sichtbarkeiten steuern den (erlaubten) Zugriff auf Klassen, Methoden und Variablen und helfen somit beim Verbergen von Implementierungsdetails.</p></dd></dl><ld-supplemental><p>Im Folgenden werden wir nur ein kohärentes Subset der Modularisierungsmöglichkeiten von Java Programmen betrachten. Insbesondere werden wir uns auf die wesentlichen Eigenschaften der genannten Konzepte und Mechanismen beschränken:</p></ld-supplemental></ld-topic>
<ld-topic id="klassen-in-java"><h2>Klassen in Java</h2><ld-deck><ld-card><ol class="arabic incremental-list simple"><li><p>Klassen sind die grundlegenden Bausteine von Java Programmen.</p></li><li><p>Eine Klasse wird mit dem Schlüsselwort <span class="docutils literal">class</span> deklariert.</p></li><li><p>Eine Klasse kann Felder (Variablen) und Methoden enthalten.</p></li><li><p>Eine Klasse wird in einer Datei mit dem Namen der Klasse (+<em>.java</em>) gespeichert.</p></li></ol></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Die Hauptfunktion einer Klasse in Java ist es als Schablone für Objekte zu dienen, die eine gemeinsame Struktur und Verhalten haben. Dies werden wir aber erst später in der Vorlesung besprechen. Für den Moment nutzen wir Klassen „nur“ zur Strukturierung bzw. Modularisierung des Codes.</p></aside></ld-card><ld-card class="incremental"><p>Im einfachsten Fall sind die Klassen eines Java Programms alle im selben Verzeichnis gespeichert.</p><p>Dies erlaubt eine <em>direkte</em> Verwendung der Methoden der anderen Klassen durch Angabe des Klassennamens und des Methodennamens.  (Vergleichbar mit der Verwendung von <code class="java"><span class="name class">Double</span><span class="punctuation">.</span>parseDouble</code> etc.)</p></ld-card><ld-card class="incremental"><p class="rubric">Datei: <em>MyMath.java</em></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">class</span> <span class="name class">MyMath</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">static</span> <span class="keyword">final</span> <span class="keyword">int</span> <span class="name constant">ANSWER_TO_EVERYTHING</span> <span class="operator">=</span> <span class="literal number integer">42</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">static</span> <span class="keyword">double</span> <span class="name function">fibonacci</span><span class="punctuation">(</span><span class="keyword">int</span> n<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">static</span> <span class="keyword">boolean</span> <span class="name function">isPrim</span><span class="punctuation">(</span><span class="keyword">int</span> n<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span></code></pre><p class="rubric">Datei: <em>Main.java</em></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">void</span> <span class="name function">main</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name constant">IO</span><span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="name class">MyMath</span><span class="punctuation">.</span><span class="name function">fibonacci</span><span class="punctuation">(</span><span class="literal number integer">10</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><dl class="field-list"><dt>Syntax<span class="colon">:</span></dt><dd><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">class</span> <span class="punctuation">&lt;</span><span class="name class">KlassenName</span><span class="punctuation">&gt;</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="operator">&lt;</span><span class="name class">Attribute</span> <span class="punctuation">(</span>gel<span class="punctuation">.</span> auch <span class="name class">Felder</span> genannt<span class="punctuation">)</span><span class="operator">&gt;</span><span class="operator">*</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="punctuation">&lt;</span><span class="name class">Methoden</span><span class="punctuation">&gt;</span><span class="operator">*</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="punctuation">}</span></code></pre></dd></dl><ul class="simple"><li><p>Der <span class="docutils literal">Klassenname</span> muss ein gültiger Bezeichner sein und mit dem Dateinamen (+ .java) übereinstimmen.</p></li><li><p>Klassennamen beginnen in Java - per Konvention - immer mit einem Großbuchstaben (<span class="eng">UpperCamelCase</span>).</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="interfaces-in-java"><h2>Interfaces in Java</h2><ul><li><p>Seit Java 8 (in Verbindung mit weiteren Ergänzungen in Java 9) können auch <code class="java"><span class="keyword">interface</span></code>s zum Organisieren von Code verwendet werden.</p></li><li><p>\</p><div><p>Beispiel:</p><p class="rubric">Datei: <em>MyMath.java</em></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">interface</span> <span class="name class">MyMath</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">static</span> <span class="keyword">final</span> <span class="keyword">int</span> <span class="name constant">ANSWER_TO_EVERYTHING</span> <span class="operator">=</span> <span class="literal number integer">42</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">static</span> <span class="keyword">double</span> <span class="name function">fibonacci</span><span class="punctuation">(</span><span class="keyword">int</span> n<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">static</span> <span class="keyword">boolean</span> <span class="name function">isPrim</span><span class="punctuation">(</span><span class="keyword">int</span> n<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span></code></pre><p class="rubric">Datei: <em>Main.java</em></p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">void</span> <span class="name function">main</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name constant">IO</span><span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="name class">MyMath</span><span class="punctuation">.</span><span class="name function">fibonacci</span><span class="punctuation">(</span><span class="literal number integer">10</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="punctuation">}</span></code></pre></div></li></ul><ld-supplemental><p>Die Verwendung von Interfaces zu <em>reinen Strukturierungszwecken</em> ist jedoch unüblich.</p><p>Wir werden uns Interfaces in einer späteren Vorlesung genauer ansehen, wenn wir objekt-orientierte Programmierung in Java detaillierter besprechen.</p></ld-supplemental></ld-topic>
<ld-topic id="statische-methoden-und-statische-attribute-von-klassen-und-interfaces"><h2>Statische Methoden und statische Attribute von Klassen und Interfaces</h2><ul class="simple"><li><p><strong>Statische Methoden</strong>  gehören zur Klasse/Interface als solches.</p></li><li><p><strong>Statische Attribute</strong> gehören zur Klasse/Interface als solches.</p></li></ul><dl class="incremental-list field-list"><dt>Syntax<span class="colon">:</span></dt><dd><p><code class="java"><span class="keyword">static</span> <span class="punctuation">&lt;</span>returnType<span class="punctuation">&gt;</span> <span class="punctuation">&lt;</span>methodName<span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">&lt;</span>parameters<span class="punctuation">&gt;</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">&lt;</span>body<span class="punctuation">&gt;</span> <span class="punctuation">}</span></code></p><p><code class="java"><span class="keyword">static</span> <span class="keyword">final</span> <span class="punctuation">&lt;</span>type<span class="punctuation">&gt;</span> <span class="punctuation">&lt;</span>name<span class="punctuation">&gt;</span> <span class="operator">=</span> <span class="punctuation">&lt;</span>value<span class="punctuation">&gt;</span><span class="punctuation">;</span></code></p></dd></dl><div class="incremental"><p>Das Java Development Kit (JDK) enthält viele Klassen – z. B. <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Math</span></code>, <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>System</span></code>, <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>io<span class="punctuation">.</span></span>File</span></code>, <code class="java">java<span class="punctuation">.</span>io<span class="punctuation">.</span><span class="name constant">IO</span></code>, <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Arrays</span></code> etc. – mit statischen Methoden - z. B. <code class="java"><span class="name function">parseDouble</span><span class="punctuation">(</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">)</span></code> – und Attributen.</p></div><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Wenn Sie das <code class="java"><span class="keyword">static</span></code> Schlüsselwort vergessen, dann haben Sie Instanzmethoden und Instanzattribute. Diese können Sie nur nutzen, nachdem Sie basierend auf der Klasse ein Objekt instantiiert haben.</p></aside></ld-topic>
<ld-topic class="exercises" id="ubung-erste-refaktorisierung-des-codes"><h2>Übung - Erste Refaktorisierung des Codes</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Aufteilung in Klassen"><p class="ld-exercise-title rubric"><span>Aufteilung in Klassen</span></p><div><p>Nehmen Sie Ihren Code (Berechnung der Fibonacci-Zahlen, Fakultät, Kubikwurzel und Primzahltest) und ordnen Sie diesen einer Klasse zu. Überlegen Sie sich einen geeigneten Namen für die Klasse und speichern Sie die Klasse in einer entsprechenden Datei. In einer zweiten Datei (<span class="docutils literal">Main.java</span>) schreiben Sie eine <code class="java">main</code>-Methode, die - basierenden auf Kommandozeilenparametern - die passenden Methoden der Klasse aufruft und die Ergebnisse auf der Konsole ausgibt. Die <code class="java">main</code> Methode soll dabei die grundlegende Fehlerbehandlung übernehmen, falls die Kommandozeilenargumente nicht passen.</p></div><ld-supplemental><p>Denken Sie daran, dass die Methoden und Attribute der Klasse statisch (<code class="java"><span class="keyword">static</span></code>) sein müssen, damit Sie diese ohne Instanziierung eines Objekts der Klasse aufrufen können.</p></ld-supplemental><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name function">java</span> Main.java cbrt <span class="literal number integer">1000</span> isPrim <span class="literal number integer">97</span> fibonacci <span class="literal number integer">30</span> ack <span class="literal number integer">1</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="literal number integer">1000.0</span>^⅓ <span class="operator">=</span> <span class="literal number integer">10.0</span>
</code><small class="ln">3</small><code data-lineno="3">isPrim<span class="punctuation">(</span><span class="literal number integer">97</span><span class="punctuation">)</span> <span class="operator">=</span> <span class="keyword constant">true</span>
</code><small class="ln">4</small><code data-lineno="4">fiboncci<span class="punctuation">(</span><span class="literal number integer">30</span><span class="punctuation">)</span> <span class="operator">=</span> <span class="literal number integer">832040</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">[</span>error<span class="punctuation">]</span> Ungültige Funktion: ack</code></pre></aside><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:DnXpYiaGqmbJAmCVFVfRyQ228xUNqmqfhzizbEDdx0Q=:wN0bqnsSv4C53mI7:gp79vb3p0fd6H4gq6TLmkTOTArluGoisEKsn+oRShbPDr7N979jNsbmeuiPao7oBDJe+z5SmQlrlABhOrEEle2WtZA5GoOYy6ftdpDBcwPRUGopnlFK0/qvzJ9A1JbxJX4K2wY8U6tVmwLAJ5GYVtoBEvXETADO8IUpSZnPJyXpHNVUAGtPIer4wj4JrYv//qP9QLlABht5//GVUhums9cQ3x8BM1bmoq6tAyOBsLD4Z44/+0uceKaRYav+O2XQtkVitnwweEfhbQku6i61i0iqz/17BPi78ssMMRNfYXU9YOAsGXY83suNVY0A6rTI9IZDL1u+TfGHJ/ql3Lf1IP9Ua9kBs8Z0q4DKjFbDTGCvNe97/jO+qvFJP3w3iM8fKga3XEJvZHZnuMhe0bMJ0txqcoYWbGylJmzguqEhorZ10UWBC8+k0VaAOlsq7N4bf0KTRrcDERj/7L9vuqncsLICpIhuXhlaSAeFnQJps6bM+vyspC8XbgIYdfLqFMdyMtbXOB4wFqBm9tc9kbGHPqh8kuaJXSo1vwHpfbng+GQJAC3Z758S2yTKZTsQsYY1JeYRzoQrQqYXkwMZgtHvFmgFWfFoXTAvTUZUk3jtDOWUubMHI2vReGAM0hXKXvbYNFhw+F2NgsZrH6EyXbOzSu0g0PVMcTCx/M7X+wr9FeLB5SB4TpL/eghWC0q1wHZVCpPxWS6OBbl6SgUx8IU4kSkrduN0odATxzRIl43JTZ810pW2cLb7ZXgvtykOBFqj7aQX4SfpIm0yJ/Zmh8Qr1KZLAVWPsaz0v+0URnqYj5obwCZHodOnDXv0OOt6i1UPeN15qXbnNnAz2UuCdixDVwMsSxMvG9GLvkbWg/VyA6UoMuInbNW4B5HMTzG6S0QM+5Ktz/WY+9oGo487hdbae/er5Let9qpqQC5GYkLlg4QGTofPVNTLA3kA5gH6IIoePwQrvudBGpFTMLojPvrfxR4QyI9MTIvQXRh0SsEG67eKjuiV5VNQAw8B/LWjCKZ/9AEwJaKvv1v5aT+539FRbOX0zJF3zb7BX+LaVYErx9MmOmlce4d4q6E+W+MZ1wpbwPnuJPo2RriKWT/uple7eS9CHHpiDEEzP+qlX6TstJsH0mF+G2agcnCNFNPrXFAia9sUlJfw4Ae3i0PamLjvequwpeeaY1bkBFeXE9lduwGOJDQJXFy8VPOk3s+BgUeAWk+xPCWHfSF8Ge4d1LI+7WoS5ePs7o0Bs7GX1ZLiCEdjiIHdtLCmmzxggQG677hQJOZOGJx4hwnhVYX4BIQojZ4ABqdAdkuNtdMypYyudEiKfAOzdqAqRpShuJtTpNKtM5FTbBFEG8RAJOK7LBlmsjuUk0WP5o/kP4MvprbszzfIfWIWdcuQ/VYCGaUylpfQz8XPlfAdhJe/K7/FaldiylLiNbLS6UzWRMdCQJSYELeNaJG6M7TSjuuS5UXKDG5REdVqPtNPZWeBFS5gB3TmwpOAKGFARMg+Iw4aJsCe7g6A4NP85/ijqzJ+6ZEvU1Jprff9NxkayJkJU7EupDfuOY8rfSIkwBRuWJ+NsJbI6KXjM9rxb2ecgOuzySCQzBQJptwrs9msxgL0OKY7NxnPfWizm5l1/luxz0HwMXgj2SUD41xUkfdFtMqxo1igr1bbsEqWdlo/Jo2giSxj4XX05ury7zl4Bv+jpV1i <ld-topic id="java-packages"><h2>Java Packages</h2><ul class="simple"><li><p><strong>Packages</strong> sind Sammlungen von <strong>verwandten Klassen</strong> und <strong>Schnittstellen</strong>.</p></li><li><p>Sie helfen, Code in <strong>logische Gruppen</strong> zu organisieren und <strong>Namenskonflikte</strong> zu vermeiden.</p></li><li><p>Vergleichbar mit <strong>Ordnern</strong> für Dateien in einem Dateisystem.</p></li></ul><dl class="field-list"><dt>Syntax &#x26; Semantik<span class="colon">:</span></dt><dd><p><code class="java"><span class="keyword">package</span> <span class="punctuation">&lt;</span>packageName<span class="punctuation">&gt;</span><span class="punctuation">;</span></code></p><ul class="simple"><li><p>Die Packagedeklaration steht am Anfang einer Java-Datei.</p></li><li><p>Per Konvention erfolgt die Benennung in umgekehrter Domain-Reihenfolge.</p></li><li><p>Der Packagename muss die Verzeichnisstruktur widerspiegeln.</p></li></ul></dd></dl><div><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">package</span> <span class="name namespace">de<span class="punctuation">.</span>dhbw<span class="punctuation">.</span>mannheim<span class="punctuation">.</span>vl<span class="punctuation">.</span>programmierung</span><span class="punctuation">;</span></code></pre><pre class="code java fade-out literal-block"><small class="ln">2</small><code data-lineno="2"><span class="keyword">class</span> <span class="name class">Klasse</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span></code></pre></aside></div></ld-topic>
<ld-topic id="imports-in-java"><h2>Imports in Java</h2><ld-deck><ld-card><dl class="field-list"><dt><code class="java"><span class="keyword">import</span></code>s<span class="colon">:</span></dt><dd><p>ermöglichen den Zugriff auf Klassen aus anderen Packages, ohne deren vollständigen Namen zu schreiben.</p><dl class="field-list simple"><dt>Syntax<span class="colon">:</span></dt><dd><p><code class="java"><span class="keyword">import</span> <span class="punctuation">&lt;</span>packageName<span class="punctuation">&gt;</span><span class="punctuation">.</span><span class="punctuation">&lt;</span>className<span class="punctuation">&gt;</span><span class="punctuation">;</span></code></p></dd></dl><ul class="simple"><li><p>Erleichtert das Lesen und Schreiben des Codes, da der vollständige Klassenname nicht jedes Mal geschrieben werden muss.</p></li><li><p>Das Package <code class="java">java<span class="punctuation">.</span>lang</code> wird immer automatisch importiert (enthält u. a. die Klassen <code class="java"><span class="name class">String</span></code>, <code class="java"><span class="name class">Math</span></code>, etc.)</p></li></ul><p>Java unterstützt auch ein Wildcard-Import, z. B. <code class="java"><span class="keyword">import</span> <span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span><span class="operator">*</span><span class="punctuation">;</span></code>. Dies sollte jedoch in nicht-trivialem Code vermieden werden, da es zu Konflikten führen kann.</p></dd></dl></ld-card><ld-card class="incremental"><dl class="field-list"><dt><code class="java"><span class="keyword">import</span> <span class="keyword">static</span></code><span class="colon">:</span></dt><dd><p>ermöglicht den Import von statischen Methoden und Attributen. Danach kann ohne Angabe des Klassennamens auf die Methode bzw. das Attribut zugegriffen werden.</p></dd><dt>Syntax<span class="colon">:</span></dt><dd><p><code class="java"><span class="keyword">import</span> <span class="keyword">static</span> <span class="punctuation">&lt;</span>packageName<span class="punctuation">&gt;</span><span class="punctuation">.</span><span class="punctuation">&lt;</span>className<span class="punctuation">&gt;</span><span class="punctuation">.</span><span class="punctuation">&lt;</span>methodName<span class="punctuation">&gt;</span><span class="punctuation">;</span></code></p><p><code class="java"><span class="keyword">import</span> <span class="keyword">static</span> <span class="punctuation">&lt;</span>packageName<span class="punctuation">&gt;</span><span class="punctuation">.</span><span class="punctuation">&lt;</span>className<span class="punctuation">&gt;</span><span class="punctuation">.</span><span class="punctuation">&lt;</span>attribute<span class="punctuation">&gt;</span><span class="punctuation">;</span></code></p></dd></dl></ld-card><ld-card class="incremental"><dl class="field-list simple"><dt><code class="java"><span class="keyword">import</span> <span class="keyword">module</span></code><span class="colon">:</span></dt><dd><p>(Seit Java 23) ermöglicht den Import aller Klassen eines Moduls.</p></dd><dt>Syntax<span class="colon">:</span></dt><dd><p><code class="java"><span class="keyword">import</span> <span class="name namespace">modul</span> <span class="punctuation">&lt;</span>moduleName<span class="punctuation">&gt;</span><span class="punctuation">;</span></code></p></dd></dl></ld-card></ld-deck></ld-topic>
<ld-topic id="beispiele-fur-imports"><h2>Beispiele für Imports</h2><ld-deck><ld-card><p>Spezifischer Import einer Klasse:</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">import</span> <span class="name namespace">java<span class="punctuation">.</span>math<span class="punctuation">.</span></span><span class="name class">BigDecimal</span><span class="punctuation">;</span></code></pre><pre class="code java fade-out literal-block"><small class="ln">2</small><code data-lineno="2"><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">var</span> one <span class="operator">=</span> <span class="name class">BigDecimal</span><span class="punctuation">.</span><span class="name constant">ONE</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p>Import aller Klassen (und Interfaces) des Packages:</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">import</span> <span class="name namespace">java<span class="punctuation">.</span>math<span class="punctuation">.</span></span><span class="operator">*</span><span class="punctuation">;</span></code></pre><pre class="code java fade-out literal-block"><small class="ln">2</small><code data-lineno="2"><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">var</span> one <span class="operator">=</span> <span class="name class">BigDecimal</span><span class="punctuation">.</span><span class="name constant">ONE</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p>Import einer Klassenmethode (statisch):</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">import</span> <span class="keyword">static</span> <span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span><span class="name class">Math</span><span class="punctuation">.</span>sqrt<span class="punctuation">;</span></code></pre><pre class="code java fade-out literal-block"><small class="ln">2</small><code data-lineno="2"><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">var</span> x <span class="operator">=</span> <span class="name function">sqrt</span><span class="punctuation">(</span><span class="literal number integer">2</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p>Import eines Klassenattributs (statisch):</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">import</span> <span class="keyword">static</span> <span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span><span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">;</span></code></pre><pre class="code java fade-out literal-block"><small class="ln">2</small><code data-lineno="2"><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">    out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="literal string">"Hello World!"</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p>Import eines Java Modules (ab Java 23):</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">import</span> <span class="keyword">module</span> <span class="name namespace">java<span class="punctuation">.</span>base</span><span class="punctuation">;</span></code></pre><pre class="code java fade-out literal-block"><small class="ln">2</small><code data-lineno="2"><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="name constant">IO</span><span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span><span class="name class">BigDecimal</span><span class="punctuation">.</span><span class="name constant">ONE</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Hinweis</p><p>Ein Java-Skript/die JShell importiert immer implizit:</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">import</span> <span class="keyword">module</span> <span class="name namespace">java<span class="punctuation">.</span>base</span><span class="punctuation">;</span></code></pre><p>Wenn Sie in der JShell also auch <code class="java">println</code> und <code class="java">readln</code> direkt verwenden wollen, dann müssen Sie lediglich <code class="java"><span class="keyword">import</span> <span class="keyword">static</span> <span class="name namespace">java<span class="punctuation">.</span>io<span class="punctuation">.</span></span><span class="name class">IO</span><span class="punctuation">.</span><span class="operator">*</span><span class="punctuation">;</span></code> hinzufügen.</p></ld-card></ld-deck></ld-topic>
<ld-topic id="sichtbarkeiten-access-modifiers"><h2>Sichtbarkeiten (Access Modifiers)</h2><p>Um festzulegen, wer auf Klassen, Methoden und Variablen zugreifen kann, verwendet Java <strong>Sichtbarkeiten</strong> (Access Modifiers). Dies ist ein Konzept aus dem Bereich <em>Programming-in-the-Large</em>. Für kleinere Projekte, bei denen alle Klassen im selben Package sind, ist dies nicht relevant.</p><p>Die vier Sichtbarkeiten in Java sind:</p><ol class="arabic incremental-list simple"><li><p><code class="java"><span class="keyword">public</span></code>: Zugriff von überall</p></li><li><p><code class="java"><span class="keyword">protected</span></code>: Zugriff innerhalb des gleichen Packages und von Subklassen</p></li><li><p><em><default> (package-private)</em>: Zugriff nur innerhalb des gleichen Packages</p></li><li><p><code class="java"><span class="keyword">private</span></code>: Zugriff nur innerhalb der gleichen Klasse</p></li></ol></ld-topic>
<ld-topic id="sichtbarkeiten-und-deren-verwendung"><h2>Sichtbarkeiten und deren Verwendung</h2><ld-deck><ld-card><p class="rubric">Abstraktes Beispiel:</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">public</span> <span class="keyword">class</span> <span class="name class">PublicClass</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">public</span> <span class="keyword">int</span> publicVar<span class="punctuation">;</span>        <span class="comment single">// Zugriff von überall</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">protected</span> <span class="keyword">int</span> protectedVar<span class="punctuation">;</span>  <span class="comment single">// Zugriff innerhalb des Packages und Subklassen</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">int</span> defaultVar<span class="punctuation">;</span>              <span class="comment single">// Zugriff nur im selben Package</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="keyword">private</span> <span class="keyword">int</span> privateVar<span class="punctuation">;</span>      <span class="comment single">// Zugriff nur innerhalb dieser Klasse</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Konkretes Beispiel:</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">public</span> <span class="keyword">class</span> <span class="name class">MyMath</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">public</span> <span class="keyword">static</span> <span class="keyword">int</span> <span class="name constant">THE_ANSWER</span> <span class="operator">=</span> <span class="literal number integer">42</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">private</span> <span class="keyword">static</span> <span class="keyword">double</span> <span class="name function">cbrt</span><span class="punctuation">(</span><span class="keyword">double</span> x<span class="punctuation">,</span><span class="keyword">double</span> guess<span class="punctuation">,</span> <span class="keyword">int</span> steps<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">public</span> <span class="keyword">static</span> <span class="keyword">double</span> <span class="name function">cbrt</span><span class="punctuation">(</span><span class="keyword">double</span> x<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="name function">cbrt</span><span class="punctuation">(</span>x<span class="punctuation">,</span><span class="literal number integer">1.0</span><span class="punctuation">,</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span></code></pre><pre class="code java incremental literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">public</span> <span class="keyword">interface</span> <span class="name class">MyMath</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">static</span> <span class="keyword">int</span> <span class="name constant">THE_ANSWER</span> <span class="operator">=</span> <span class="literal number integer">42</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">private</span> <span class="keyword">static</span> <span class="keyword">double</span> <span class="name function">cbrt</span><span class="punctuation">(</span><span class="keyword">double</span> x<span class="punctuation">,</span><span class="keyword">double</span> guess<span class="punctuation">,</span> <span class="keyword">int</span> steps<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="keyword">static</span> <span class="keyword">double</span> <span class="name function">cbrt</span><span class="punctuation">(</span><span class="keyword">double</span> x<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="name function">cbrt</span><span class="punctuation">(</span>x<span class="punctuation">,</span><span class="literal number integer">1.0</span><span class="punctuation">,</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span></code></pre><div class="incremental smaller margin-top-1em padding-0-5em box-shadow rounded-corners"><p>Java interfaces kennen nur die Sichtbarkeiten <code class="java"><span class="keyword">public</span></code> und <code class="java"><span class="keyword">private</span></code>. Wenn keine Sichtbarkeit angegeben wird, ist die Methode bzw. das Attribut implizit <code class="java"><span class="keyword">public</span></code>.</p></div></ld-card><ld-card class="incremental"><p class="rubric">Anwendung in der Praxis</p><ul class="simple"><li><p><code class="java"><span class="keyword">public</span></code>: Offene API, z. B. für Libraries.</p></li><li><p><code class="java"><span class="keyword">private</span></code>: dient der Kapselung z. B. interne Hilfsmethoden und interner Zustand.</p></li><li><p><code class="java"><span class="keyword">protected</span></code>: Ermöglicht Vererbung und Zugriff für verwandte Klassen.</p></li><li><p><span class="docutils literal">&#x3C;default bzw. keine explizite Angabe></span>: Für interne Logik innerhalb eines Packages.</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="beispiel-fur-die-konkrete-anwendung"><h2>Beispiel für die konkrete Anwendung</h2><p class="rubric">Verzeichnis mit der fachlichen Logik für mathematische Funktionen:</p><pre class="code java literal-block"><code><span class="keyword">package</span> <span class="name namespace">de<span class="punctuation">.</span>dhbw<span class="punctuation">.</span>mannheim<span class="punctuation">.</span>calculator<span class="punctuation">.</span>math</span><span class="punctuation">;</span>

<span class="keyword">public</span> <span class="keyword">class</span> <span class="name class">Functions</span> <span class="punctuation">{</span>
    <span class="keyword">public</span> <span class="keyword">static</span> <span class="keyword">double</span> <span class="name function">cbrt</span><span class="punctuation">(</span><span class="keyword">double</span> x<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span> <span class="punctuation">}</span>
<span class="punctuation">}</span></code></pre><p class="rubric">Code mit der Logik für die Interaktion mit dem Benutzer:</p><pre class="code java literal-block"><code><span class="keyword">package</span> <span class="name namespace">de<span class="punctuation">.</span>dhbw<span class="punctuation">.</span>mannheim<span class="punctuation">.</span>calculator</span><span class="punctuation">;</span>

<span class="keyword">import</span> <span class="name namespace">de<span class="punctuation">.</span>dhbw<span class="punctuation">.</span>mannheim<span class="punctuation">.</span>calculator<span class="punctuation">.</span>math<span class="punctuation">.</span></span><span class="name class">Functions</span><span class="punctuation">;</span>

<span class="keyword">public</span> <span class="keyword">class</span> <span class="name class">Main</span> <span class="punctuation">{</span>
    <span class="keyword">public</span> <span class="keyword">static</span> <span class="keyword">void</span> <span class="name function">main</span><span class="punctuation">(</span><span class="name class">String</span><span class="punctuation">[</span><span class="punctuation">]</span> args<span class="punctuation">)</span> <span class="punctuation">{</span>

<ld-topic id="best-practices-fur-packages-und-sichtbarkeiten"><h2>Best Practices für Packages und Sichtbarkeiten</h2><ul class="simple"><li><p>Organisiere Klassen logisch in Packages.</p></li><li><p>Die beiden bei weitem häufigsten Sichtbarkeiten sind <span class="docutils literal">public</span> und <span class="docutils literal">private</span>.</p></li><li><p>Nutze <span class="docutils literal">public</span> nur bei notwendigen Klassen und Methoden.</p></li><li><p>Halte Klassenvariablen <strong>privat</strong>, um Daten zu kapseln.</p></li><li><p>Methoden, die nur innerhalb einer Klasse verwendet werden, sollten <strong>private</strong> sein.</p></li><li><p>Vermeide übermäßige Imports (<span class="docutils literal">import java.util.\*;</span> kann zu Konflikten führen).</p></li></ul></ld-topic>
<ld-topic id="zusammenfassung"><h2>Zusammenfassung</h2><ul class="simple"><li><p><strong>Packages</strong> gruppieren verwandte Klassen und vermeiden Namenskonflikte.</p></li><li><p><strong>Imports</strong> erlauben das Verwenden von Klassen aus anderen Packages.</p></li><li><p><strong>Sichtbarkeiten</strong> steuern den Zugriff und helfen beim Schutz der Daten.</p></li></ul></ld-topic>
