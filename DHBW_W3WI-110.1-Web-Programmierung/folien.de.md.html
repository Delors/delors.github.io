<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="ausgewahlte-inhalte-gem-mhb"><h2>Ausgewählte Inhalte gem. MHB</h2><p class="rubric">Kerninhalte</p><ul class="simple"><li><p>HTML, CSS, JavaScript als clientseitige Web-Technologien und aktuelle APIs (z.B. HTML5 und verwandte Technologien)</p></li><li><p>Übertragungsprotokolle und APIs zwischen Client und Server (z.B. HTTP, HTTPS, WebSockets, XMLHttpRequest, Fetch API)</p></li><li><p>Kommunikation zwischen einzelnen Komponenten Web-basierter Anwendungen</p></li><li><p>Optimierung von Webseiten für verschiedene Zielsysteme</p></li></ul></ld-topic>
<ld-topic id="prufungsleistung-portfolio"><h2>Prüfungsleistung - Portfolio</h2><aside class="admonition admonition-hintergrund"><p class="admonition-title">Hintergrund</p><ul class="simple"><li><p>das Modul hat 55 VL</p></li><li><p>Web-Programmierung hat 33VL und geht mit <strong>70</strong> von 120 Modulpunkten ein</p></li></ul></aside></ld-topic>
<ld-topic id="portfolioaufgabe"><h2>Portfolioaufgabe</h2><p>Entwicklung eines kleinen <em>verteilten</em> zwei Personen Spiels mit HTML, CSS und JavaScript.</p><p>Der Einsatz von großen Frameworks ist nicht erlaubt. Der Einsatz von Socket.io und Express (auf Serverseite) ist erlaubt, um die Kommunikation zwischen den Clients zu vereinfachen. Der Einsatz weiterer Frameworks ist nur nach Absprache gestattet. Der Einsatz von Frameworks zum Testen (z. B., Jest) ist erlaubt.</p><div class="incremental"><p class="rubric">Mögliche Spiele</p><p>Jeder muss ein anderes Spiel wählen! Sprechen Sie sich untereinander ab.</p><ld-grid class="font-size-90 default-layout"><ld-cell style="align-self:auto;"><ul class="simple"><li><p>Kalaha</p></li><li><p>4 Gewinnt</p></li><li><p>Halma</p></li><li><p>Dame</p></li><li><p>Mühle</p></li><li><p>Schiffe versenken</p></li><li><p>Memory</p></li></ul></ld-cell><ld-cell style="align-self:auto;"><ul><li><p>Stadt-Land-Fluss</p></li><li><p>Reversi</p></li><li><p>Sprouts (Punkte mit Linien verbinden, ohne Überkreuzungen)</p></li><li><p>Hex (Sechseckflächen verbinden)</p></li><li><p><em>Ihre Spielidee</em></p><p>(Die Spielkomplexität darf weder zu hoch noch zu niedrig sein!)</p></li></ul></ld-cell></ld-grid></div></ld-topic>
<ld-topic id="spielablauf"><h2>Spielablauf</h2><ol class="arabic incremental-list list-with-explanations"><li><p>Ein Spieler geht auf eine Login-Seite, um sich beim Server anzumelden</p></li><li><p>Sobald sich ein weiterer Spieler anmeldet, werden diese beiden Spieler automatisch verbunden und ein Spiel wird gestartet</p></li><li><p>Die Spieler machen abwechselnd Ihre Züge</p><p>D.h. der Client sendet eine Nachricht an den Server, um seinen Zug zu machen, daraufhin wird der Server die Nachricht an den anderen Spieler weiterleiten.</p></li><li><p>Sobald ein Spieler gewonnen hat, wird dies beiden Spielern angezeigt und das Spiel beendet</p></li><li><p>Die Spieler können sich erneut anmelden</p></li></ol></ld-topic>
<ld-topic id="anforderungen-und-rahmenbedingungen"><h2>Anforderungen und Rahmenbedingungen</h2><ul class="incremental-list list-with-explanations"><li><p>Das Spiel muss auf Firefox, Safari und Chrome in der jeweils aktuellen Version lauffähig sein.</p></li><li><p>Das Spiel muss ab einer Auflösung von 1024x768 Pixeln (Desktop) spielbar sein.</p></li><li><p>Kommt es zu einem Fehler (z.B. Verbindungsabbruch), so wird das Spiel einfach terminiert; der Server darf nicht abstürzen.</p></li><li><p>Die Serveranwendung läuft auf dem bereitgestellten Server und alle können gleichzeitig spielen.</p></li><li><p>Die Abgabe erfolgt in Form eines GitHub Projekt.</p><p>(Sie können gerne ein privates Projekt anlegen und mich ggf. einladen, wenn Sie Ihr Projekt nicht öffentlich haben wollen!)</p></li><li><p>Das Projekt muss auf einem Ubuntu Rechner mit einer Node.js installation baubar und startbar sein. (Grobe Idee: <span class="docutils literal">npm install</span> + <span class="docutils literal">npm build</span> + <span class="docutils literal">npm run &#x3C;port></span>). Danach muss der Server laufen und alles muss spielbar sein. Der Server muss auch auf einem IPv4 Rechner laufen.</p></li></ul></ld-topic>
<ld-topic id="ablauf"><h2>Ablauf</h2><ld-story><dl class="incremental-list dd-margin-left-4em field-list"><dt>25.8.<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Vorlesung</p></li></ul></dd><dt>9.9.<span class="colon">:</span></dt><dd><ul><li><p>Abgabe und Präsentation der Spielidee (5 Minuten pro Person)</p><p>Die Präsentation (PDF) soll im Wesentlichen den Spielablauf erklären - vom Einloggen über das Spiel bis zum Spielende. Vergessen Sie nicht darzustellen wie Ihr Wartebildschirm aussieht.</p></li><li><p>Vorlesung</p></li></ul></dd><dt>16.9.<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Vorlesung</p></li></ul></dd><dt>30.9.<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Vorlesung</p></li><li><p>Individuelle Hilfe bei der Entwicklung</p></li></ul></dd><dt>7.10.<span class="colon">:</span></dt><dd><ol class="arabic list-with-explanations"><li><p>Einführung in Code Reviews</p></li><li><p>Kurze Präsentation des Standes des Spiels. (5 Minuten pro Person)</p><p>(Es wird erwartet, dass das Spiel zumindest rudimentär auf dem eigenen Notebook vorgeführt werden kann! Eine Demonstration eines echten Mehrspielerbetriebs auf dem Server wird nicht erwartet.)</p></li><li><p>Durchführen eines Code Reviews eines anderen Mitstreiters</p><div class="s-only"><p>(<em>Zuordnung ist im Anhang.</em>)</p></div><ld-supplemental embed-in-document-flow=""><table><thead><tr><th class="head"><p>Developer</p></th><th class="head"><p>Reviewer</p></th></tr></thead><tbody><tr><td><p>Mudaser Ahmad</p></td><td><p>Fabio Nowatschka</p></td></tr><tr><td><p>Nico Breull</p></td><td><p>Mudaser Ahmad</p></td></tr><tr><td><p>Woro Christantya</p></td><td><p>Leon-Marcel Hauck</p></td></tr><tr><td><p>Sven Frank</p></td><td><p>Florian Fries</p></td></tr><tr><td><p>Lion Friedrich</p></td><td><p>Nico Weis</p></td></tr><tr><td><p>Florian Fries</p></td><td><p>Yannic Pfanenstil</p></td></tr><tr><td><p>Quirin Gehrmann</p></td><td><p>Jens Gross</p></td></tr><tr><td><p>Jens Gross</p></td><td><p>Woro Christantya</p></td></tr><tr><td><p>Leon-Marcel Hauck</p></td><td><p>Kerem Kurtaran</p></td></tr><tr><td><p>Laurin Koch</p></td><td><p>Sven Frank</p></td></tr><tr><td><p>Kerem Kurtaran</p></td><td><p>Lion Friedrich</p></td></tr><tr><td><p>Louis Leich</p></td><td><p>Philipp Milosev</p></td></tr><tr><td><p>Philipp Milosev</p></td><td><p>Laurin Koch</p></td></tr><tr><td><p>Fabio Nowatschka</p></td><td><p>Quirin Gehrmann</p></td></tr><tr><td><p>Yannic Pfanenstil</p></td><td><p>Gursharan Sadwal</p></td></tr><tr><td><p>Gursharan Sadwal</p></td><td><p>Nico Breull</p></td></tr><tr><td><p>Nico Weis</p></td><td><p>Louis Leich</p></td></tr></tbody></table></ld-supplemental></li></ol></dd><dt>14.10.<span class="colon">:</span></dt><dd><ul><li><p>Abgabe der List der GitHub Issues, die Ihr Code Review ergeben hat</p></li><li><p>Präsentation der Ergebnisse des Code Reviews (10 Minuten pro Person):</p><p><em>Fokussieren Sie sich auf ausgewählte, spannend und relevante Bereiche!</em></p><ul class="simple"><li><p>Build-Process: Lässt sich das Projekt direkt nach dem Checkout baue?</p></li><li><p>HTML + CSS: Ist das CSS modularisiert, verständlich und wird modernes CSS genutzt? Ist das HTML modern und wird semantisches HTML sinnvoll genutzt? Wie ist das Layout auf der Webseite umgesetzt? Wie wird Animation eingesetzt?</p></li><li><p>JavaScript: Clientseitig + Serverseitig: Wie erfolgt die Kommunikation zwischen Client und Server - ist das angemessen. Ist der Server robust gegen Fehler/Cheating? Ist das JavaScript verständlich und nicht unnötig komplex?</p></li><li><p>generelle Architektur (ggf. mit Mermaid-Diagrammen)</p></li><li><p>Ablauf der Kommunikation (ggf. mit Mermaid-Diagrammen)</p></li></ul></li></ul><pre class="literal-block"><code></code></pre></dd><dt>27.10. - 8:00 Uhr<span class="colon">:</span></dt><dd><p><span class="emph">Abgabe der finalen Lösungen/Zip Ihres Projekts:</span> <span class="docutils literal">(git clone --depth 1)</span></p></dd><dt>28.10.<span class="colon">:</span></dt><dd><p><strong>Spielzeit</strong> - wir spielen alle Spiele an dem Tag.</p><p>Stellen Sie sicher, dass Ihr Spiel in dieser Zeit vollständig spielbar ist!</p></dd></dl></ld-story></ld-topic>
<ld-topic id="einsatz-von-ki"><h2>Einsatz von KI</h2><p>Der Einsatz von KI-Tools (z.B. ChatGPT, GitHub Copilot) ist erlaubt, solange die Spiele den Anforderungen entsprechen und <span class="emph">vollständig eigenständig</span> präsentiert werden können!</p></ld-topic>
<ld-topic id="bewertung-max-70-punkte"><h2>Bewertung (max. 70 Punkte)</h2><p><strong>Bestandteile</strong></p><dl class="dd-margin-left-15em list-with-explanations field-list"><dt>Spielidee präsentieren<span class="colon">:</span></dt><dd><p>10 Punkte (max.)</p><p>Bewertet wird, ob die Darstellung den Ablauf und die Interaktionen der Nutzer mit dem Spiel klar erkennen lässt. (Zum Beispiel wie man ein Schiff bei Schiffe versenken setzt, wie man eine Karte auswählt, ....)</p></dd><dt>Zwischenstand präsentieren<span class="colon">:</span></dt><dd><p>10 Punkte (max.)</p></dd><dt>Qualität des Code Reviews<span class="colon">:</span></dt><dd><p>20 Punkte (max.)</p><p>(Die Bewertung setzt sich aus der Qualität der GitHub Issues (5 Punkte) und Ihrer Präsentation (15 Punkte) zusammen.)</p></dd><dt>Qualität des finalen Codes<span class="colon">:</span></dt><dd><p>15 Punkte (max.)</p></dd><dt>Läuft das Spiel<span class="colon">:</span></dt><dd><p>15 Punkte (max.)</p></dd></dl><ld-supplemental><p><a class="reference external" href="../lab-codereviews/folien.de.md.html">Kriterien für die Bewertung des Codes</a></p></ld-supplemental></ld-topic>
