<ld-topic class="repetition" id="regulare-ausdrucke"><h2>Reguläre Ausdrücke</h2><ul class="incremental-list list-with-explanations simple"><li><p>Reguläre Ausdrücke (<span class="eng">regular expressions</span>) sind ein Standardwerkzeug zum Patternmatching auf Textdaten.</p><ul class="simple"><li><p>Wir verwenden diese z. B. zum Suchen und Ersetzen in Textdateien,</p></li><li><p>im Rahmen der Entwicklung von Lexern und Parsern,</p></li><li><p>um Eingaben zu überprüfen (Sanitizing) oder</p></li><li><p>um Wörterbücher, Leaks und weitere Kontextinformationen zu Passwortkandidaten zu verarbeiten.</p></li></ul></li><li><p>Reguläre Ausdrücke beschreiben reguläre Sprachen und können durch einen endlichen Automaten erkannt werden.</p></li><li><p>Reguläre Ausdrücke nehmen - im Normalfall - immer einen maximalen Musterabgleich vor (<span class="eng">greedy matching / eager matching</span>).</p></li></ul></ld-topic>
<ld-topic class="new-section" id="schreiben-von-regularen-ausdrucken"><h2>Schreiben von regulären Ausdrücken</h2><div class="section-subtitle"><p>Fokus ist hier auf grundlegende reguläre Ausdrücke.</p></div><ld-supplemental><p><span class="peripheral">Es gibt verschiedene Dialekte von regulären Ausdrücken. Hier wird der Dialekt verwendet, der von GNU grep mit der Option -E (Extended Regular Expressions) unterstützt wird. Einige Beispiele verwenden Perl-kompatible reguläre Ausdrücke (PCRE), die mit grep -P genutzt werden können.</span></p></ld-supplemental></ld-topic>
<ld-topic id="regulare-ausdrucke-zeichenklassen"><h2>Reguläre Ausdrücke - Zeichenklassen</h2><ld-deck><ld-card><p>Buchstaben und Zahlen können direkt in einem regulären Ausdruck verwenden, um entsprechenden Text zu finden. Zum Beispiel steht <span class="docutils literal">"a"</span> für das Zeichen <span class="docutils literal">a</span>.</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">echo</span> <span class="name variable">-n</span> <span class="literal string">"abc"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-E</span> <span class="literal string">"a"</span></code></pre><p>findet: <span class="docutils literal">a</span></p></ld-card><ld-card class="incremental"><p>Der Punkt repräsentiert ein beliebiges Zeichen - außer den Zeilenumbruch.</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">echo</span> <span class="name variable">-n</span> <span class="literal string">"abc"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-E</span> <span class="literal string">"a."</span></code></pre><p>findet: <span class="docutils literal">ab</span></p></ld-card><ld-card class="incremental"><p>Klassen von Zeichen können in eckigen Klammern angegeben werden "[]".</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">echo</span> <span class="name variable">-n</span> <span class="literal string">"abcdefg"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-E</span> <span class="literal string">"[acg]"</span></code></pre><p>findet: <span class="docutils literal">a</span>, <span class="docutils literal">c</span>, <span class="docutils literal">g</span></p><p>Klassen können auch durch Bereiche beschrieben werden (<span class="docutils literal">a-z</span>, <span class="docutils literal">A-Z</span>, <span class="docutils literal">0-9</span>):</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">echo</span> <span class="name variable">-n</span> <span class="literal string">"ab12xy"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"[a-z]"</span></code></pre><p>findet: <span class="docutils literal">a</span>, <span class="docutils literal">b</span>, <span class="docutils literal">x</span>, <span class="docutils literal">y</span></p></ld-card><ld-card class="incremental"><p>Welche Buchstaben genau durch eine Klasse repräsentiert werden hängt von den Spracheinstellungen ab!</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1">LANG<span class="operator">=</span>de_DE.UTF-8<span class="punctuation">;</span> <span class="name class">echo</span> <span class="literal string">"aä"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"[a-z]"</span></code></pre><p>findet: <span class="docutils literal">a</span>, <span class="docutils literal">ä</span></p><p>aber</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1">LANG<span class="operator">=</span>C<span class="punctuation">;</span> <span class="name class">echo</span> <span class="literal string">"aä"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"[a-z]"</span></code></pre><p>findet „nur“: <span class="docutils literal">a</span></p></ld-card><ld-card class="incremental"><p>Die Negation einer Klasse wird durch an ein <span class="docutils literal">^</span> direkt am Anfang der Klasse erzwungen.</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">echo</span> <span class="literal string">"abc123"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"[^a-z]"</span></code></pre><p>findet: <span class="docutils literal">1</span>, <span class="docutils literal">2</span>, <span class="docutils literal">3</span></p></ld-card></ld-deck></ld-topic>
<ld-topic id="regulare-ausdrucke-escapezeichen"><h2>Reguläre Ausdrücke - Escapezeichen</h2><p>Der Backslash <span class="docutils literal">\</span> dient als Escapezeichen für Sonderzeichen.</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">echo</span> <span class="literal string">"abc-123[a-z]"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"\[a-z\]"</span></code></pre><p>findet: <span class="docutils literal">[a-z]</span> <span class="peripheral">(aber nicht "abc")</span></p></ld-topic>
<ld-topic id="regulare-ausdrucke-anker"><h2>Reguläre Ausdrücke - Anker</h2><p><span class="docutils literal">^</span>: Steht für den Anfang einer Zeile.</p><p><span class="docutils literal">$</span>: steht für das Ende einer Zeile.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">"abcabcabc"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"abc"</span>
</code><small class="ln">2</small><code data-lineno="2">abc
</code><small class="ln">3</small><code data-lineno="3">abc
</code><small class="ln">4</small><code data-lineno="4">abc
</code><small class="ln">5</small><code data-lineno="5">$ <span class="name class">echo</span> <span class="literal string">"abcY_abcZ"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"^abc."</span>
</code><small class="ln">6</small><code data-lineno="6">abcY
</code><small class="ln">7</small><code data-lineno="7">$ <span class="name class">echo</span> <span class="literal string">"XbcYbc"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">".bc$"</span>
</code><small class="ln">8</small><code data-lineno="8">Ybc</code></pre></ld-topic>
<ld-topic id="regulare-ausdrucke-quantifizierung"><h2>Reguläre Ausdrücke - Quantifizierung</h2><ld-story><p><span class="docutils literal">*</span>: "null oder mehr" Vorkommen des vorherigen Zeichens oder Musters.</p><p><span class="docutils literal">+</span>: "ein oder mehr" Vorkommen des vorherigen Zeichens oder Musters.</p><p><span class="docutils literal">?</span>: "null oder ein" Vorkommen des vorherigen Zeichens oder Musters.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">"Sa--aa--aaaE"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"aa*"</span>
</code><small class="ln">2</small><code data-lineno="2">a, aa, aaa
</code><small class="ln">3</small><code data-lineno="3">$ <span class="name class">echo</span> <span class="literal string">"Sa--aa--aaaE"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"aa+"</span>
</code><small class="ln">4</small><code data-lineno="4">aa, aaa
</code><small class="ln">5</small><code data-lineno="5">$ <span class="name class">echo</span> <span class="literal string">"Sa--aa--aaaE"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"a?"</span>
</code><small class="ln">6</small><code data-lineno="6">a, a, a, a, a, a</code></pre><div class="incremental line-above"><p><span class="docutils literal">{X,Y}</span>: zwischen <span class="docutils literal">X</span> und <span class="docutils literal">Y</span> Vorkommen des vorherigen Zeichens oder Musters. Die obere Grenze ist optional, um zum Beispiel <span class="docutils literal">X</span> und mehr Vorkommen zu finden.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">"Sa--aa--aaaE"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"a{2,2}"</span>
</code><small class="ln">2</small><code data-lineno="2">aa
</code><small class="ln">3</small><code data-lineno="3">aa
</code><small class="ln">4</small><code data-lineno="4">$ <span class="name class">echo</span> <span class="literal string">"Sa--aa--aaaE"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"a{2,3}"</span>
</code><small class="ln">5</small><code data-lineno="5">aa
</code><small class="ln">6</small><code data-lineno="6">aaa</code></pre></div></ld-story></ld-topic>
<ld-topic id="regulare-ausdrucke-alternativen"><h2>Reguläre Ausdrücke - Alternativen</h2><p><span class="docutils literal">|</span> trennt  verschiedene Alternativen.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">"HundMausAffe"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"Hund|Affe"</span>
</code><small class="ln">2</small><code data-lineno="2">Hund
</code><small class="ln">3</small><code data-lineno="3">Affe</code></pre><p class="incremental">Aufgrund des „gierigem“ Musterabgleichs ist bei dem Abgleich von Alternativen im Allgemeinen darauf zu achten, dass zuerst auf längere bzw. spezifischere Muster geprüft wird. Die Regeln sind jedoch</p><pre class="code bash incremental literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">"Schifffahrt"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"Schiff|Schifffahrt"</span>
</code><small class="ln">2</small><code data-lineno="2">Schifffahrt
</code><small class="ln">3</small><code data-lineno="3">
</code><small class="ln">4</small><code data-lineno="4"><span class="comment single"># Perl compatible (requires GNU grep)</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="name class">echo</span> <span class="literal string">"Schifffahrt"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Po</span> <span class="literal string">"Schiff|Schifffahrt"</span>
</code><small class="ln">6</small><code data-lineno="6">Schiff</code></pre></ld-topic>
<ld-topic id="regulare-ausdrucke-klammern"><h2>Reguläre Ausdrücke - Klammern</h2><p><span class="docutils literal">()</span> dienen der Gruppierung von Teilausdrücken und der Referenzierbarkeit bzw. Rückreferenzen mittel <span class="docutils literal">$</span>&#x3C;NR> wobei NR die Nummer der Gruppe ist.</p><p>Beispiel: der folgende Ausdruck findet Zeichenketten, die mit dem Zeichen aufhören mit dem sie begonnen haben.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">"XaaaaX"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"^(.).*<span class="name entity">\1</span>$"</span>
</code><small class="ln">2</small><code data-lineno="2">XaaaaX
</code><small class="ln">3</small><code data-lineno="3">
</code><small class="ln">4</small><code data-lineno="4">$ <span class="name class">echo</span> <span class="literal string">"XaaaaY"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">"^(.).*<span class="name entity">\1</span>$"</span></code></pre></ld-topic>
<ld-topic id="regulare-ausdrucke-lookahead"><h2>Reguläre Ausdrücke - Lookahead</h2><p><span class="docutils literal">(?=...)</span>: ist ein positiver Lookahead und stellt sicher, dass ein bestimmtes Muster im Text folgt, ohne es selbst in das Ergebnis aufzunehmen.</p><p><span class="docutils literal">(?!...)</span>: ist ein negativer Lookahead und stellt sicher, dass ein bestimmtes Muster im Text <em>nicht</em> folgt.</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">"HundKatzeHundMaus"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Po</span> <span class="literal string">'Hund(?=Katze).{1,2}'</span>
</code><small class="ln">2</small><code data-lineno="2">HundKa
</code><small class="ln">3</small><code data-lineno="3">
</code><small class="ln">4</small><code data-lineno="4">$ <span class="name class">echo</span> <span class="literal string">"HundKatzeHundMaus"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Po</span> <span class="literal string">'Hund(?!Katze).{1,2}'</span>
</code><small class="ln">5</small><code data-lineno="5">HundMa</code></pre></ld-topic>
<ld-topic id="regulare-ausdrucke-non-capturing-groups"><h2>Reguläre Ausdrücke - <em>Non-capturing Groups</em></h2><p><span class="docutils literal">(?:...)</span>: definiert eine Gruppe, die nicht für Rückreferenzen verwendet wird. (Primär für Effizienz.)</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">"abcabc"</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Po</span> <span class="literal string">'(?:abc){2}'</span>
</code><small class="ln">2</small><code data-lineno="2">abcabc</code></pre></ld-topic>
<ld-topic id="regulare-ausdrucke-eager-vs-lazy-matching"><h2>Reguläre Ausdrücke - <em>Eager vs. Lazy Matching</em></h2><p><span class="docutils literal">*?</span>: match 0 oder mehr Vorkommen des vorherigen Zeichens oder Musters, aber so wenige wie möglich/nötig</p><p><span class="docutils literal">+?</span>: match 1 oder mehr Vorkommen des vorherigen Zeichens oder Musters, aber so wenige wie möglich/nötig</p><p><span class="docutils literal">(??)</span>: match 0 oder 1 Vorkommen des vorherigen Zeichens oder Musters, aber so wenige wie möglich/nötig</p><pre class="code bash literal-block"><small class="ln">1</small><code data-lineno="1">$ <span class="name class">echo</span> <span class="literal string">'&lt;div&gt;Hallo&lt;/div&gt;&lt;div&gt;Welt&lt;/div&gt;'</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">'&lt;.*?&gt;'</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="operator">&lt;</span>div<span class="operator">&gt;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="operator">&lt;</span>/div<span class="operator">&gt;</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="operator">&lt;</span>div<span class="operator">&gt;</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="operator">&lt;</span>/div<span class="operator">&gt;</span>
</code><small class="ln">6</small><code data-lineno="6">$ <span class="name class">echo</span> <span class="literal string">'&lt;div&gt;Hallo&lt;/div&gt;&lt;div&gt;Welt&lt;/div&gt;'</span> <span class="operator">|</span> <span class="name function">grep</span> <span class="name variable">-Eo</span> <span class="literal string">'&lt;.*&gt;'</span>
</code><small class="ln">7</small><code data-lineno="7"><span class="operator">&lt;</span>div<span class="operator">&gt;</span>Hallo<span class="operator">&lt;</span>/div<span class="operator">&gt;</span><span class="operator">&lt;</span>div<span class="operator">&gt;</span>Welt<span class="operator">&lt;</span>/div<span class="operator">&gt;</span></code></pre></ld-topic>
