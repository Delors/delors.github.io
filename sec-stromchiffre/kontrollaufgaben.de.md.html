<ld-topic class="exercises" id="fragen"><h2>Fragen</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Zufallszahlen"><p class="ld-exercise-title rubric"><span>Zufallszahlen</span></p><ol class="arabic incremental-list simple"><li><p>Wie unterscheidet sich ein TRNG von einem PRNG?</p></li><li><p>Welche Formen der Unvorhersagbarkeit gibt es?</p></li><li><p>Beschreiben Sie Maurer's Test auf Zufälligkeit.</p></li><li><p>Ist ein Lauflängentest besser geeignet als ein Häufigkeitstest, um die Zufälligkeit einer Bitfolge zu überprüfen?</p></li><li><p>Welche Anforderungen stellen wir an ein <em>Seed</em>?</p></li><li><p>Welche grundsätzlichen Möglichkeiten gibt es Pseudozufallszahlen zu erzeugen?</p></li><li><p>Welche Betriebsmodi für Blockchiffren sind geeignet für die Erzeugung von Pseudozufallszahlen.</p></li><li><p>Wenn man einen TRNG hat, der (leicht) verzerrt ist, wie kann dieser konditioniert werden?</p></li><li><p>Was besagt der Wert, der durch die Shannon-Entropie berechnet wird (nicht normalisiert)?</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:6nq1b7lYXGgtxHIrPYxhZbzGIWgoLJsmAZnEe3EJCS0=:rPTQW/cz3xXYMz7z:P1Uzvy0Ggdf/JNJrDn5rLynYFUupTutOKn2jkj+ci9piHKTbA+cidXy1NYKL8d6oYtxg0hk/YyMJyXp4REOXNKAOFjLl+8o6hnnHXWoUMkKU1MwlMdJN+0Vj80MfUTuESbs6akEUBJkChJeCaQjQxPiOcsCGciN55hzdq4OIaMXNIeFlxOWsSXOJ2NcJ/0+mCdvynfyoWBb0ewfAeg0jKJC9bA03bnLd7hDZqWziusJsGK9DIcgmZuOyLTBcXzWAq8G0tJzeNUSQ41VKie0jUCodH/A2ny9GMzcTrX6/rw9m8qPYKBUK5x8mouFDecvBVQNKflru9EhacGZmOT3lLx0QpXbm19wWv/pFs0vjlcsxhSBT9PMAbJnOyX4hC9AtL1MIG9vtslhc8v71XspP5LyeEccKrmoKoV7xvFDOAIoGBM/722XevRoA5UqtTGrcsVvlotU7AuH8uaGgjR6m7i2f0cXTyg6EY8ViC8BamXyA2KsirvZ/kgX8YV2F28UD+HikT6LIeiUsU1GpeNInZKeZQ67voIZwL+KaGrAWlDNJemV1R3xO4PME+5q8eL0s3uC30J2fstPtadKc3nxvuHSP+BBdcjX+XyFrw1kYNeWEuXJUvLm1CHXTi9rXtY7PsU4SHQPS13gkvDMjy5u/gfthnLVgQ+j/gN+be5NC34g+7G1B/re2BOoHLMVRKzJof4Pm/rZDmA5sxlNsfXF+77IUGpRFON047XI12p6G95KAN1Zr5pW7TrRH0D4l3bSQK8pwK+Th7IsOtqPygdv17i4yWcS1+W6PO
