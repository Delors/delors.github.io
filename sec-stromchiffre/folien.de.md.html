<style>/* ---------------------------------------------------------------------------

   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not

   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);

    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,

        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on

    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,

<ld-topic class="new-section" id="erzeugung-und-zufalligkeit-von-zufallszahlen"><h2>Erzeugung und Zufälligkeit von Zufallszahlen</h2></ld-topic>
<ld-topic id="zufallszahlen-verwendung-und-anforderungen"><h2>Zufallszahlen - Verwendung und Anforderungen</h2><ul class="simple"><li><p>Eine Reihe von Sicherheitsalgorithmen und -protokollen, die auf Kryptographie basieren, verwenden binäre Zufallszahlen:</p><ul class="simple"><li><p>Schlüsselverteilung und reziproke (<span class="ger">wechselseitige</span>) Authentifizierungsverfahren</p></li><li><p>Erzeugung von Sitzungsschlüsseln</p></li><li><p>Generierung von Schlüsseln für den RSA Public-Key-Verschlüsselungsalgorithmus</p></li><li><p>Generierung eines Bitstroms für die symmetrische Stromverschlüsselung</p></li></ul></li></ul><div class="incremental"><p>Es gibt zwei unterschiedliche Anforderungen an eine Folge von Zufallszahlen:</p><ol class="arabic incremental-list simple"><li><p>Zufälligkeit</p></li><li><p>Unvorhersehbarkeit</p></li></ol></div></ld-topic>
<ld-topic id="zufalligkeit"><h2>Zufälligkeit</h2><ul class="simple"><li><p>Die Erzeugung einer Folge von angeblich zufälligen Zahlen, die in einem genau definierten statistischen Sinne zufällig sind, war ein Problem.</p></li></ul><ul class="incremental"><li><p>Zwei Kriterien werden verwendet, um zu prüfen, ob eine Zahlenfolge zufällig ist:</p><dl class="dd-margin-left-4em field-list simple"><dt>Gleichmäßige Verteilung<span class="colon">:</span></dt><dd><p>Die Häufigkeit des Auftretens von Einsen und Nullen sollte ungefähr gleich sein.</p></dd><dt>Unabhängigkeit<span class="colon">:</span></dt><dd><p>Keine Teilsequenz der Folge kann von den anderen abgeleitet werden.</p></dd></dl></li></ul></ld-topic>
<ld-topic id="unvorhersehbarkeit"><h2>Unvorhersehbarkeit</h2><ul class="simple"><li><p>Die Anforderung ist nicht nur, dass die Zahlenfolge statistisch zufällig ist, sondern auch, dass die <em>aufeinanderfolgenden Glieder der Folge unvorhersehbar</em> sind.</p></li></ul><ul class="incremental simple"><li><p>Bei <em>echten</em> Zufallsfolgen ist jede Zahl statistisch unabhängig von den anderen Zahlen in der Folge und daher unvorhersehbar.</p><ul class="simple"><li><p>Echte Zufallszahlen(-generatoren) haben Grenzen; insbesondere die Ineffizienz selbiger ist eine Herausforderung, so dass oft Algorithmen implementiert werden, die scheinbar zufällige Zahlenfolgen erzeugen.</p></li><li><p>Es muss darauf geachtet werden, dass ein Gegner nicht in der Lage ist, zukünftige Elemente der Folge auf der Grundlage früherer Elemente vorherzusagen.</p></li></ul></li></ul><ld-supplemental><p>Einfache Zufallszahlengeneratoren erfüllen die Eigenschaft der Unvorhersehbarkeit oft nicht.</p></ld-supplemental></ld-topic>
<ld-topic id="visualisierung-von-zufallszahlengeneratoren"><h2>Visualisierung von Zufallszahlengeneratoren<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></h2><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Zufallszahlengenerator ≘ <span class="eng">Random Number Generator (RNG)</span></p></aside></aside><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p>Erwartete Verteilung von Zufallswerten im 3D-Raum.</p><object class="light-image align-center" data="drawings/stream_ciphers/distribution_3d_expected.svg" type="image/svg+xml" role="img" aria-label="Erwartete Verteilung der Werte im 3D-Raum"></object></ld-cell><ld-cell class="width-50 incremental" style="align-self:auto;"><p>Verteilung von „zufälligen“ Werten eines schlechten RNGs im 3D-Raum.</p><object class="light-image align-center" data="drawings/stream_ciphers/distribution_3d_bad_lcg.svg" type="image/svg+xml" role="img" aria-label="Schlechte Verteilung der Werte im 3D-Raum"></object></ld-cell></ld-grid><ld-supplemental embed-in-document-flow=""><p>Bei diesem Experiment werden immer drei nacheinander auftretende Werte als Koordinate im 3D-Raum interpretiert. Die erwartete Verteilung ist eine gleichmäßige Verteilung im Raum. Die Verteilung der Werte eines schlechten RNGs ist nicht gleichmäßig und zeigt eine klare Struktur.</p></ld-supplemental></ld-topic>
<ld-topic id="pseudozufallszahlen"><h2>Pseudozufallszahlen</h2><p>Bei kryptografischen Anwendungen werden in der Regel algorithmische Verfahren zur Erzeugung von Zufallszahlen verwendet.</p><ul class="incremental-list simple"><li><p>Diese Algorithmen sind deterministisch und erzeugen daher Zahlenfolgen, die nicht statistisch zufällig sind.</p></li><li><p>Wenn der Algorithmus gut ist, bestehen die resultierenden Sequenzen (viele) Tests auf Zufälligkeit und werden als Pseudozufallszahlen bezeichnet.</p></li></ul></ld-topic>
<ld-topic id="zufalls-und-pseudozufallszahlengeneratoren"><h2>Zufalls- und Pseudozufallszahlengeneratoren</h2><object class="light-image align-center" data="drawings/stream_ciphers/rng_and_prng.svg" type="image/svg+xml" role="img" aria-label="RNGs"></object><dl class="field-list simple"><dt>TRNG<span class="colon">:</span></dt><dd><p>Echter Zufallszahlengenerator (<span class="eng">True Random Number Generator</span>)</p></dd><dt>PRNG<span class="colon">:</span></dt><dd><p>Pseudozufallszahlengenerator (<span class="eng">Pseudorandom Number Generator</span>)</p></dd><dt>PRF<span class="colon">:</span></dt><dd><p>Pseudozufällige Funktion (<span class="eng">Pseudorandom Function</span>)</p></dd></dl></ld-topic>
<ld-topic id="echter-zufallszahlengenerator-trng"><h2>Echter Zufallszahlengenerator (TRNG)</h2><ul class="incremental-list simple"><li><p>Nimmt als Eingabe eine Quelle, die effektiv zufällig ist.</p></li><li><p>Die Quelle wird als Entropiequelle bezeichnet und stammt aus der physischen Umgebung des Computers:</p><ul class="simple"><li><p>Dazu gehören z. B. Zeitpunkte von Tastenanschlägen, elektrische Aktivität auf der Festplatte, Mausbewegungen und Momentanwerte der Systemuhr.</p></li><li><p>Die Quelle oder eine Kombination von Quellen dient als Eingabe für einen Algorithmus, der eine binäre Zufallsausgabe erzeugt.</p></li></ul></li><li><p>Der TRNG kann einfach die Umwandlung einer analogen Quelle in eine binäre Ausgabe beinhalten.</p></li><li><p>Der TRNG kann zusätzliche Verarbeitungsschritte durchführen, um etwaige Verzerrungen in der Quelle auszugleichen.</p></li></ul></ld-topic>
<ld-topic id="pseudozufallszahlengenerator-prng-und-pseudozufallsfunktion-prf"><h2>Pseudozufallszahlengenerator (PRNG) und Pseudozufallsfunktion (PRF)</h2><ld-deck><ld-card><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>Pseudozufallszahlengenerator</em></p><ul class="list-with-explanations incremental-list"><li><p>Ein Algorithmus, der zur Erzeugung einer nicht in der Länge beschränkten Bitfolge verwendet wird.</p></li><li><p>Die Eingabe ist ein fester Wert (<em>Seed</em>); mithilfe eines deterministischen Algorithmus wird eine Folge von Ausgabebits erzeugt.</p><p>Häufig wird der Seed von einem TRNG erzeugt.</p></li><li><p>Ein solcher Bitstrom kann als Eingabe für eine symmetrische Stromchiffre dienen.</p></li><li><p><span class="danger">Ein Angreifer, der den Algorithmus und den Seed kennt, kann den gesamten Bitstrom reproduzieren</span>.</p></li></ul></ld-cell><ld-cell class="width-50 incremental" style="align-self:auto;"><p><em>Pseudorandom function (PRF)</em></p><ul class="incremental-list"><li><p>Eine PRF ist formal eine Familie von Funktionen:</p><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mo stretchy="false">{</mo><msub><mi>F</mi><mi>k</mi></msub><mo>:</mo><mo stretchy="false">{</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><msup><mo stretchy="false">}</mo><mi>n</mi></msup><mo>→</mo><mo stretchy="false">{</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><msup><mo stretchy="false">}</mo><mi>m</mi></msup><msub><mo stretchy="false">}</mo><mrow><mi>k</mi><mo>∈</mo><mo stretchy="false">{</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><msup><mo stretchy="false">}</mo><mi>λ</mi></msup></mrow></msub></mrow><annotation encoding="application/x-tex">\{F_k:\{0,1\}^n\rightarrow \{0,1\}^m\}_{k\in \{0,1\}^λ}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">{</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">:</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">{</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">1</span><span class="mclose"><span class="mclose">}</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7144em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1.1276em;vertical-align:-0.3776em;"></span><span class="mopen">{</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">1</span><span class="mclose"><span class="mclose">}</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7144em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">m</span></span></span></span></span></span></span></span><span class="mclose"><span class="mclose">}</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3448em;"><span style="top:-2.4974em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span><span class="mrel mtight">∈</span><span class="mopen mtight">{</span><span class="mord mtight">0</span><span class="mpunct mtight">,</span><span class="mord mtight">1</span><span class="mclose mtight"><span class="mclose mtight">}</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.782em;"><span style="top:-2.786em;margin-right:0.0714em;"><span class="pstrut" style="height:2.5em;"></span><span class="katex-sizing reset-size3 size1 mtight"><span class="mord mathnormal mtight">λ</span></span></span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.3776em;"><span></span></span></span></span></span></span></span></span></span></span></div><p>Der Schlüssel <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span></span> wählt eine konkrete Funktion aus dieser Familie aus. <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\lambda</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord mathnormal">λ</span></span></span></span></span> bestimmt das Sicherheitsniveau; insbesondere die Länge des Schlüssels. In der Praxis häufig 128 Bit oder größer.</p></li><li><p>Wird verwendet, um eine pseudozufällige Bitfolge <em>mit einer bestimmten Länge</em> zu erzeugen.</p></li><li><p>PRFs dienen z. B. der Ableitung von symmetrischen Schlüsseln und Nonces.</p></li></ul><ld-supplemental><p>Eine konkrete PRF wäre zum Beispiel eine Blockchiffre wie AES.</p></ld-supplemental></ld-cell></ld-grid></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>PRF und PRNG sind unter gleichen kryptographischen Annahmen gleichwertig mächtig, unterscheiden sich aber bzgl. der  Anwendungsgebiete.</p></aside></ld-card></ld-deck><ld-supplemental><p><em>Nonce</em> (<em>Number used Once</em>) ist ein Wert, der nur einmal verwendet wird. In der Kryptographie werden Nonces häufig verwendet, um die Sicherheit von Verschlüsselungsalgorithmen zu erhöhen bzw. überhaupt erst zu erhalten.</p></ld-supplemental></ld-topic>
<ld-topic id="anforderungen-an-prfs-und-prngs"><h2>Anforderungen an PRFs und PRNGs</h2><ul class="incremental-list simple"><li><p>Die grundlegende Anforderung bei der Verwendung eines PRNG oder PRF für eine kryptografische Anwendung ist, dass <strong>ein Gegner, der den Seed/Schlüssel nicht kennt, nicht in der Lage ist, die pseudozufällige Bitfolge zu bestimmen</strong>.</p></li><li><p>Die Forderung nach Geheimhaltung der Ausgabe eines PRNG oder PRF führt zu spezifischen Anforderungen in den Bereichen:</p><ul class="simple"><li><p>Zufälligkeit</p></li><li><p>Unvorhersehbarkeit</p></li><li><p>Merkmale des Seeds/Schlüssels</p></li></ul></li></ul></ld-topic>
<ld-topic id="zufalligkeit-1"><h2>Zufälligkeit</h2><p>Der erzeugte Bitstrom muss zufällig erscheinen, obwohl er deterministisch ist:</p><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Es gibt keinen einzigen Test, mit dem „abschließend“ festgestellt werden kann, ob eine PRF/ein PRNG Zahlen erzeugt, die die Eigenschaft der Zufälligkeit aufweisen.</p></aside><div class="incremental"><p>Wenn der PRNG auf der Grundlage mehrerer Tests Zufälligkeit aufweist, kann davon ausgegangen werden, dass er die Anforderung der Zufälligkeit erfüllt.</p><div class="accentuate"><p><a class="reference external" href="https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-22r1a.pdf">NIST SP 800-22 Rev. 1a</a> legt fest, dass die Tests auf drei Merkmale ausgerichtet sein sollten:</p><ol class="arabic simple"><li><p>gleichmäßige Verteilung,</p></li><li><p>Skalierbarkeit,</p></li><li><p>Konsistenz</p></li></ol><ld-supplemental><p>Skalierbarkeit bedeutet hier, dass ein Test, der auf eine Folge angewandt werden kann, auch auf eine beliebige Teilfolgen anwendar ist.</p></ld-supplemental></div></div></ld-topic>
<ld-topic id="tests-auf-zufalligkeit"><h2>Tests auf Zufälligkeit</h2><p>SP 800-22 listet 15 verschiedene Zufallstests auf (Auszug):</p><ld-story><dl class="incremental-list field-list simple"><dt>Häufigkeitstest<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Der grundlegendste Test, der in jeder Testreihe enthalten sein muss.</p></li><li><p>Es soll festgestellt werden, ob die Anzahl der Einsen und Nullen in einer Sequenz annähernd derjenigen entspricht, die bei einer echten Zufallssequenz zu erwarten wäre.</p></li></ul></dd><dt>Lauflängentest<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Schwerpunkt dieses Tests ist die Zahl der Läufe (<span class="eng">runs</span>) in der Folge, wobei ein Lauf (<span class="eng">run</span>) eine ununterbrochene Folge identischer Bits ist, die vorher und nachher durch ein Bit des entgegengesetzten Werts begrenzt wird.</p></li><li><p>Es soll festgestellt werden, ob die Anzahl der Läufe von Einsen und Nullen verschiedener Länge den Erwartungen für eine Zufallsfolge entspricht.</p></li></ul></dd><dt>Maurers universeller statistischer Test<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Fokus ist die Anzahl der Bits zwischen übereinstimmenden Mustern.</p></li><li><p>Ziel ist es, festzustellen, ob die Sequenz ohne Informationsverlust erheblich komprimiert werden kann oder nicht. Eine signifikant komprimierbare Sequenz wird als nicht zufällig betrachtet.</p></li></ul></dd></dl></ld-story></ld-topic>
<ld-topic id="unvorhersehbarkeit-1"><h2>Unvorhersehbarkeit</h2><ld-deck><ld-card><p>Ein Strom von Pseudozufallszahlen sollte zwei Formen der Unvorhersehbarkeit aufweisen:</p><ol class="arabic dhbw highlight-list-item-on-hover incremental-list"><li><p><strong>Vorwärtsgerichtete Unvorhersehbarkeit</strong></p><p>Wenn der Seed unbekannt ist, sollte das nächste erzeugte Bit in der Sequenz trotz Kenntnis der vorherigen Bits in der Sequenz unvorhersehbar sein.</p></li><li><p><strong>Rückwärtsgerichtete Unvorhersehbarkeit</strong></p><ul class="simple"><li><p>Es sollte nicht möglich sein, den Seed aus der Kenntnis der erzeugten Werte zu bestimmen.</p></li><li><p>Es sollte keine Korrelation zwischen einem Seed und einem aus diesem Seed generierten Wert erkennbar sein.</p></li><li><p>Jedes Element der Sequenz sollte wie das Ergebnis eines unabhängigen Zufallsereignisses erscheinen, dessen Wahrscheinlichkeit ½ ist.</p></li></ul></li></ol></ld-card><ld-card class="center-child-elements incremental"><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Dieselbe Reihe von Tests für die Zufälligkeit liefert auch einen Test für die Unvorhersehbarkeit: Eine Zufallsfolge hat keine Korrelation mit einem festen Wert (dem Seed).</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="anforderungen-an-den-seed"><h2>Anforderungen an den Seed</h2><ul class="simple"><li><p>Der Seed, der als Eingabe für den PRNG dient, muss sicher und unvorhersehbar sein.</p></li><li><p>Der Seed selbst muss eine Zufalls- oder Pseudozufallszahl sein.</p></li><li><p>Normalerweise wird der Seed von einem TRNG erzeugt.</p></li></ul><object class="light-image align-center" data="drawings/stream_ciphers/generation_of_seed_input.svg" type="image/svg+xml" role="img" aria-label="Generierung von Seeds"></object></ld-topic>
<ld-topic id="algorithmus-entwurf"><h2>Algorithmus-Entwurf</h2><p>Algorithmen lassen sich in zwei Kategorien einteilen:</p><ol class="arabic incremental"><li><p><strong>Speziell entwickelte Verfahren</strong>.</p><p>Algorithmen, die speziell und ausschließlich für die Erzeugung pseudozufälliger Bitströme entwickelt wurden.</p></li><li><p><strong>Algorithmen, die auf bestehenden kryptographischen Algorithmen basieren</strong>.</p><p>Sie nutzen die kryptographischen Eigenschaften bestehender Algorithmen (Diffusion, Konfusion), um pseudozufällige Ausgaben zu erzeugen.</p><div class="incremental"><p>Kryptografische Algorithmen aus den folgenden drei Kategorien werden üblicherweise zur Erstellung von PRNGs verwendet:</p><ul class="simple"><li><p>Symmetrische Blockchiffren</p></li><li><p>Asymmetrische Verschlüsselungsalgorithmen</p></li><li><p>Hash-Funktionen und Nachrichtenauthentifizierungscodes</p></li></ul></div></li></ol></ld-topic>
<ld-topic id="einfache-nicht-kryptographische-zufallszahlengeneratoren-lineare-kongruenzgeneratoren"><h2>Einfache - <em>nicht-kryptographische</em> - Zufallszahlengeneratoren: Lineare Kongruenzgeneratoren</h2><p>Ein erstmals von Lehmer vorgeschlagener Algorithmus, der mit vier Zahlen parametrisiert ist:</p><table class="booktabs align-center"><tbody><tr><td><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span></span></p></td><td><p>der Modul</p></td><td><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">m &gt; 0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal">m</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span></span></p></td></tr><tr><td><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">a</span></span></span></span></span></p></td><td><p>der Multiplikator</p></td><td><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn><mo>&lt;</mo><mi>a</mi><mo>&lt;</mo><mi>m</mi></mrow><annotation encoding="application/x-tex">0 &lt; a&lt; m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6835em;vertical-align:-0.0391em;"></span><span class="mord">0</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span></span></p></td></tr><tr><td><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi></mrow><annotation encoding="application/x-tex">c</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">c</span></span></span></span></span></p></td><td><p>das Inkrement</p></td><td><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn><mo>≤</mo><mi>c</mi><mo>&lt;</mo><mi>m</mi></mrow><annotation encoding="application/x-tex">0\leq  c &lt; m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7804em;vertical-align:-0.136em;"></span><span class="mord">0</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal">c</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span></span></p></td></tr><tr><td><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>X</mi><mn>0</mn></msub></mrow><annotation encoding="application/x-tex">X_0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0785em;">X</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0785em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span></p></td><td><p>der Startwert, oder <em>Seed</em></p></td><td><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn><mo>≤</mo><msub><mi>X</mi><mn>0</mn></msub><mo>&lt;</mo><mi>m</mi></mrow><annotation encoding="application/x-tex">0 \leq  X_0 &lt; m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7804em;vertical-align:-0.136em;"></span><span class="mord">0</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0785em;">X</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0785em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span></span></p></td></tr></tbody></table><p>Die Folge von Zufallszahlen <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">{</mo><msub><mi>X</mi><mi>n</mi></msub><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\lbrace{X_n}\rbrace</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">{</span><span class="mord"><span class="mord"><span class="mord mathnormal" style="margin-right:0.0785em;">X</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0785em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span><span class="mclose">}</span></span></span></span></span> erhält man durch die folgende iterative Gleichung: <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>X</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><mo stretchy="false">(</mo><mi>a</mi><mo>⋅</mo><msub><mi>X</mi><mi>n</mi></msub><mo>+</mo><mi>c</mi><mo stretchy="false">)</mo><mtext> </mtext><mo lspace="0.22em" rspace="0.22em"><mrow><mi mathvariant="normal">m</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">d</mi></mrow></mo><mtext> </mtext><mi>m</mi></mrow><annotation encoding="application/x-tex">X_{n+1} = (a \cdot X_n + c)\bmod m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8917em;vertical-align:-0.2083em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0785em;">X</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0785em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span><span class="mbin mtight">+</span><span class="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2083em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0785em;">X</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0785em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">c</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.0556em;"></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin"><span class="mord"><span class="mord mathrm">mod</span></span></span><span class="mspace" style="margin-right:0.0556em;"></span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span></span></p><div class="incremental"><p>Wenn <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span></span> , <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">a</span></span></span></span></span> , <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi></mrow><annotation encoding="application/x-tex">c</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">c</span></span></span></span></span> und <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>X</mi><mn>0</mn></msub></mrow><annotation encoding="application/x-tex">X_0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0785em;">X</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0785em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> ganze Zahlen sind, dann erzeugt diese Technik eine Folge von ganzen Zahlen, wobei jede ganze Zahl im Bereich <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn><mo>≤</mo><msub><mi>X</mi><mi>n</mi></msub><mo>&lt;</mo><mi>m</mi></mrow><annotation encoding="application/x-tex">0 \leq X_n &lt; m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7804em;vertical-align:-0.136em;"></span><span class="mord">0</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0785em;">X</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0785em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&lt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span></span> liegt.</p><p>Die Auswahl der Werte für <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">a</span></span></span></span></span> , <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi></mrow><annotation encoding="application/x-tex">c</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">c</span></span></span></span></span> und <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span></span> ist entscheidend für die Entwicklung eines brauchbaren Zufallszahlengenerators.</p></div><ld-supplemental><p>Durch die richtige Wahl von m, a und c kann ggf. garantiert werden, dass die länge der Periode tatsächlich m ist; bei unvorsichtiger Wahl ist dies im Allgemeinen nicht der Fall.</p><p>Das Hull-Dobell-Theorem ist die Grundlage für die Wahl der richtigen Parameter. Es müssen alle folgenden Bedingungen gelten:</p><ol class="arabic simple"><li><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>g</mi><mi>c</mi><mi>d</mi><mo stretchy="false">(</mo><mi>c</mi><mo separator="true">,</mo><mi>m</mi><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">gcd(c,m)=1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="mord mathnormal">c</span><span class="mord mathnormal">d</span><span class="mopen">(</span><span class="mord mathnormal">c</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">m</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span>; d. h. <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi></mrow><annotation encoding="application/x-tex">c</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">c</span></span></span></span></span> und <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span></span> sind teilerfremd</p></li><li><p>Für jeden Primteiler <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span></span> von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span></span> gilt: <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi><mo>∣</mo><mo stretchy="false">(</mo><mi>a</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">p∣(a-1)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">p</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∣</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">)</span></span></span></span></span></p></li><li><p>Falls <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>4</mn><mo>∣</mo><mi>m</mi></mrow><annotation encoding="application/x-tex">4∣m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">4</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∣</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span></span>, dann auch <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>4</mn><mo>∣</mo><mo stretchy="false">(</mo><mi>a</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">4∣(a-1)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">4</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∣</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">)</span></span></span></span></span>.</p></li></ol><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Lineare Kongruenzgeneratoren sind nicht für kryptografische Anwendungen geeignet, da sie leicht vorhersagbar sind: Aus wenigen Ausgabewerten lassen sich die Parameter vollständig rekonstruieren.</p></aside><p>Im Bereich der Simulation können sie jedoch nützlich sein.</p></ld-supplemental></ld-topic>
<ld-topic id="blum-blum-shub-bbs-generator"><h2>Blum Blum Shub (BBS) Generator</h2><ul class="incremental-list"><li><p>Hat vermutlich den stärksten öffentlichen Beweis für seine kryptografische Stärke von allen speziell entwickelten Algorithmen.</p></li><li><p>Er wird als <em>kryptographisch sicherer Pseudozufallsbitgenerator (CSPRBG)</em> bezeichnet.</p><p>Ein CSPRBG ist definiert als ein Algorithmus, der den Next-Bit-Test besteht, wenn es keinen Polynomialzeit-Algorithmus gibt, der bei Eingabe der ersten <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span></span> Bits einer Ausgabesequenz das <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>k</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(k + 1)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">)</span></span></span></span></span>-te Bit mit einer Wahrscheinlichkeit deutlich größer als <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">1/2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1/2</span></span></span></span></span> vorhersagen kann.</p></li><li><p>Die Sicherheit von BBS beruht auf der Schwierigkeit der Faktorisierung von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span></span>, welche das Ergebnis der Multiplikation von zwei sehr großen Primzahlen ist.</p></li></ul></ld-topic>
<ld-topic id="blum-blum-shub-block-diagram"><h2>Blum Blum Shub Block Diagram</h2><object class="light-image align-center" data="drawings/stream_ciphers/blum_blum_shub.svg" type="image/svg+xml" role="img" aria-label="Blum Blum Shub Block Diagram"></object><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span></span> ist das Produkt von zwei (sehr großen) Primzahlen <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span></span> und <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>q</mi></mrow><annotation encoding="application/x-tex">q</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">q</span></span></span></span></span>: <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>=</mo><mi>p</mi><mo>×</mo><mi>q</mi></mrow><annotation encoding="application/x-tex">n = p \times q</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span cla span class="mord">3</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mopen">(</span><span class="mord mathnormal">m</span><span class="mord mathnormal">o</span><span class="mord mathnormal">d</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord">4</span><span class="mclose">)</span></span></span></span></span>.</p><p>Der Seed <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>s</mi></mrow><annotation encoding="application/x-tex">s</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">s</span></span></span></span></span> sollte eine ganze Zahl sein, die zu <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span></span> <em>coprime</em> ist (d. h. <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span></span> und <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>q</mi></mrow><annotation encoding="application/x-tex">q</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">q</span></span></span></span></span> sind keine Faktoren von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>s</mi></mrow><annotation encoding="application/x-tex">s</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">s</span></span></span></span></span>) und nicht <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn></mrow><annotation encoding="application/x-tex">1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span> oder <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn></mrow><annotation encoding="application/x-tex">0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span></span>.</p></ld-topic>

<ld-topic id="prng-mit-hilfe-der-betriebsmodi-fur-blockchiffren"><h2>PRNG mit Hilfe der Betriebsmodi für Blockchiffren</h2><p>Zwei Ansätze, die eine Blockchiffre zum Aufbau eines PNRG verwenden, haben weitgehend Akzeptanz erhalten:</p><ul class="incremental-list simple"><li><p>CTR Modus: Empfohlen in NIST SP 800-90, ANSI standard X.82, und RFC 4086</p></li><li><p>OFB Modus: Empfohlen in X9.82 und RFC 4086</p></li></ul><ld-grid class="default-layout"><ld-cell class="width-50 incremental" style="align-self:auto;"><object class="light-image align-center" data="drawings/stream_ciphers/prng-ctr-mode.svg" type="image/svg+xml" role="img" aria-label="PRNG CTR Mode"></object></ld-cell><ld-cell class="width-50 incremental" style="align-self:auto;"><object class="light-image align-center" data="drawings/stream_ciphers/prng-ofb-mode.svg" type="image/svg+xml" role="img" aria-label="PRNG OFB Mode"></object></ld-cell></ld-grid><ld-supplemental><p>Die initialen Werte für V und K basieren auf dem Seed, der von einem TRNG erzeugt wird/erzeugt werden sollte. Zum Beispiel kann von einem 256-Bit-Zufallswert die ersten 128 Bit für V und die nächsten 128 Bit für K verwendet werden.</p><p>Die Blockchiffre wird verwendet, um den Seed zu verschlüsseln und den Schlüsselstrom zu erzeugen. Im CTR Mode wird der initiale Wert für V inkrementiert.</p><p>Gründe für die Verwendung von Blockchiffren ist die Einfachheit der Implementierung und die Tatsache, dass Blockchiffren bereits in vielen Anwendungen vorhanden sind und die kryptografischen Eigenschaften von Blockchiffren gut verstanden sind.</p></ld-supplemental></ld-topic>
<ld-topic class="exercises" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Test auf Zufälligkeit"><p class="ld-exercise-title rubric"><span>Test auf Zufälligkeit</span></p><p>Test auf Zufälligkeit: Gegeben sei eine Bitfolge, die von einem RNG erzeugt wurde. Was ist das erwartete Ergebnis, wenn man gängige Komprimierungsprogramme (z. B. 7zip, gzip, rar, ...) verwendet, um die Datei zu komprimieren; d. h. welchen Kompressionsgrad erwarten Sie?</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:YB6CRXwjIO0x0JCSKMg74FT7zrAFaT6aOd8FQtv0VdM=:GG5ZT6K6yi1uEjy7:5DYcu49RpJJWQyztKAEa1yAGcc2c2i8cTepNxDM08qvXUdOOf/dni6P9ko+YWWw8ufjjYykde1lOixtk2+uXW+SCqC6UUVcbs/nSMM7J/RcB4ns1oti/Coz5DrYwgobDYkm6hb2dfJtP5ChWe+j67SeNtzE+e7DmJevCBts1MDuKtYjbCx8+HpGXKJqVxJAlAxRYGs6NAhVuIzmvEJliXo6okPtqbNe+lIrTEJfcSCGtscCsaN+cEfwnkFI37tPUj6dHk8D7iWAZ2WcQiTi5vmxTvk03lxtZi7Rqj5GbwlP1MXshm0rFkz3nKhKlWfdTADJzmcZsmUjmrciMfd/Ljxe3sbG3LSVoBFGlWjeuMOUA4Dz9tDkAb34Sv9+sUO4Li7Aw5ZDgLSd1aSVhD7mLh+1+gZUHq6bUWnPdXjMxa5gGmCCuK0RS77Dk9kiy7YO4cr6r3lQHDNt7pw==</div></div></ld-topic>
<ld-topic class="exercises" id="ubung-1"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Lineare Kongruenzgeneratoren"><p class="ld-exercise-title rubric"><span>Lineare Kongruenzgeneratoren</span></p><p>Implementieren Sie einen linearen Kongruenzgenerator, um zu untersuchen, wie er sich verhält, wenn sich die Zahlenwerte von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">a</span></span></span></span></span>, <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi></mrow><annotation encoding="application/x-tex">c</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">c</span></span></span></span></span> und <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>m</mi></mrow><annotation encoding="application/x-tex">m</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">m</span></span></span></span></span> ändern. Versuchen Sie Werte zu finden, die eine vermeintlich zufällige Folge ergeben.</p><p>Testen Sie Ihren Zufallszahlengenerator unter anderem mit den folgenden Werten:</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name function">lcg</span><span class="punctuation">(</span>seed<span class="punctuation">,</span>a<span class="punctuation">,</span>c<span class="punctuation">,</span>m<span class="punctuation">,</span>number_of_random_values_to_generate<span class="punctuation">)</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name function">lcg</span><span class="punctuation">(</span><span class="literal number integer">1234</span><span class="punctuation">,</span><span class="literal number integer">8</span><span class="punctuation">,</span><span class="literal number integer">8</span><span class="punctuation">,</span><span class="literal number integer">4096</span><span class="punctuation">,</span><span class="literal number integer">100</span><span class="punctuation">)</span>

<ld-topic class="new-section transition-scale" id="entropie"><h2>Entropie</h2></ld-topic>
<ld-topic id="quellen-der-entropie"><h2>Quellen der Entropie</h2><ld-deck><ld-card><ul class="simple"><li><p>Ein echter Zufallszahlengenerator (TRNG) verwendet eine nicht-deterministische Quelle zur Erzeugung von Zufälligkeit.</p></li><li><p>Die meisten funktionieren durch Messung unvorhersehbarer natürlicher Prozesse, wie z. B. Impulsdetektoren für ionisierende Strahlung, Gasentladungsröhren und undichte Kondensatoren.</p></li></ul></ld-card><ld-card class="incremental"><ul><li><p>Intel CPUs verwenden seit 2012 (Ivy Bridge) thermisches Rauschen als Quelle. Dies geschieht durch Verstärkung der an nicht angesteuerten Widerständen gemessenen Spannung.</p><p>Auslesen ist mit dem <code class="nasm">RDRAND</code> Befehl möglich bzw. (neuer) mit dem <code class="nasm">RDSEED</code> Befehl.</p></li><li><p>AMD und ARM CPUs bieten vergleichbare Funktionen. Auf aktuellen AMD CPUs dauert es ca. 2500 Clock Cycles für die Generierung eines 64 Bit Wertes.</p></li></ul><ld-supplemental><p>Die Befehle <code class="nasm">RDRAND</code> und <code class="nasm">RDSEED</code> erfüllen die Anforderungen von NIST SP 800-90A, FIPS 140-2, und ANSI X9.82.</p></ld-supplemental><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Es gibt <em>Vermutungen</em>, dass diese Funktionen absichtlich kompromitiert wurden.</p><p><a class="reference external" href="https://www.theregister.com/2013/12/09/freebsd_abandoning_hardware_randomness/">FreeBSD</a> hat 2013 die Verwendung wieder eingestellt. Linux nutzt diese nur ergänzend.</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="nist-and-partners-use-quantum-mechanics-to-make-a-factory-for-random-numbers"><h2>NIST and Partners Use Quantum Mechanics to Make a Factory for Random Numbers<a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a></h2><blockquote class="epigraph"><p><strong>NIST and its partners at the University of Colorado Boulder built the first random number generator that uses quantum entanglement to produce verifiable random numbers.</strong></p><p>Broadcast as a free public service, the Colorado University Randomness Beacon (CURBy) can be used anywhere an independent, public source of random numbers would be useful [...]</p><p>[...] Unlike dice or computer algorithms, quantum mechanics is inherently random. Carrying out a quantum experiment called a Bell test, Shalm and his team have transformed this source of true quantum randomness into a traceable and certifiable random-number service.[...]</p><p class="attribution">—<a class="reference external" href="https://www.nist.gov/news-events/news/2025/06/nist-and-partners-use-quantum-mechanics-make-factory-random-numbers">June 20205 -  NIST</a></p></blockquote><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-2" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-2">2</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://random.colorado.edu">https://random.colorado.edu</a></p></aside></aside></ld-topic>
<ld-topic id="vergleich-von-prngs-und-trngs"><h2>Vergleich von PRNGs und TRNGs</h2><table class="booktabs table-header-align-left highlight-on-hover" style="width: 100%;"><thead><tr><th class="stub head"></th><th class="head"><p>PRNGs</p></th><th class="head"><p>TRNGs</p></th></tr></thead><tbody><tr><th class="stub"><p>Effizienz</p></th><td><p>sehr effizient</p></td><td><p>im Allgemeinen ineffizient</p></td></tr><tr><th class="stub"><p>Determinismus</p></th><td><p>deterministisch</p></td><td><p>nicht deterministisch</p></td></tr><tr><th class="stub"><p>Periodizität</p></th><td><p>periodisch</p></td><td><p>aperiodisch</p></td></tr></tbody></table></ld-topic>
<ld-topic id="konditionierung"><h2>Konditionierung</h2><p>Ein TRNG kann eine Ausgabe erzeugen, die in irgendeiner Weise verzerrt ist (z. B. gibt es mehr Einsen als Nullen oder umgekehrt).</p><ld-deck class="incremental"><ld-card><dl class="field-list simple"><dt>Verzerrt<span class="colon">:</span></dt><dd><p>NIST SP 800-90B definiert einen Zufallsprozess als verzerrt in Bezug auf einen angenommenen diskreten Satz möglicher Ergebnisse, wenn einige dieser Ergebnisse eine größere Wahrscheinlichkeit des Auftretens haben als andere.</p></dd></dl><dl class="incremental field-list"><dt>Entropierate<span class="colon">:</span></dt><dd><p>NIST 800-90B definiert die Entropierate als die Rate, mit der eine digitalisierte Rauschquelle Entropie liefert.</p><ul class="simple"><li><p>Ist ein Maß für die Zufälligkeit oder Unvorhersehbarkeit einer Bitfolge.</p></li><li><p>Ein Wert zwischen 0 (keine Entropie) und 1 (volle Entropie).</p></li></ul></dd></dl></ld-card><ld-card class="incremental"><p><em>Konditionierungsalgorithmen/Entzerrungsalgorithmen</em>:</p><p>Verfahren zur Modifizierung eines Bitstroms zur weiteren Randomisierung der Bits.</p><ul class="simple"><li><p>Die Konditionierung erfolgt in der Regel durch die Verwendung eines kryptografischen Algorithmus zur Verschlüsselung der Zufallsbits, um Verzerrungen zu vermeiden und die Entropie zu erhöhen.</p></li><li><p>Die beiden gängigsten Ansätze sind die Verwendung einer Hash-Funktion oder einer symmetrischen Blockchiffre.</p></li></ul></ld-card></ld-deck><ld-presenter-note encrypted="">MTAwMDAw:Os4TEkIWmBohlALiMYlNNchwDdx0yBU9HOVXiS/O0BE=:KcMiElE/qLaiJaoJ:brE7/mMtB0RJl2H4Af40NkBZHwtqFWbAMJxQbzl09z9MyGMQcNbTVcIK7NGK1LYnbjrJ86U5XKFSl5vi+HqO72d9spnPTP4NgjSQYBkN8nGlcLqfAPPtLrSCLSdM3TDGjXcoIVVMkSjV1ktnBYfVHdBlMKidUKGnGk5KoCRg53lMNi2AxOqwYnX+vIHKAdqGr9kKFUG2pWWc9aGF+cOn7O1+jPaZSieU6E+wHZt35WO+/vOKq0lEpg+5syaYB1ykE8AaufwjSkYuGHriuSvTCp0cJEV3zEUsPs9mCw7B/yc0xIG523j5x9AoRrkHRo+rtysfGg4b1BU35lnLrhhLbeKKtbMJTiGHAwYGClqSuLVfWi28htSIR47 <ld-topic id="shannon-entropie"><h2>Shannon Entropie</h2><ul><li><p>die Shannon Entropie ist ein Maß für die Zufälligkeit oder Unvorhersehbarkeit einer Bitfolge.</p></li><li><p>Entropie:</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>H</mi><mo>=</mo><mo>−</mo><msubsup><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></msubsup><msub><mi>p</mi><mi>i</mi></msub><mo>⋅</mo><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msub><mo stretchy="false">(</mo><msub><mi>p</mi><mi>i</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">H = -\sum_{i=1}^{n} p_i \cdot \log_2(p_i)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0813em;">H</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1.104em;vertical-align:-0.2997em;"></span><span class="mord">−</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop"><span class="mop op-symbol small-op" style="position:relative;top:0em;">∑</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8043em;"><span style="top:-2.4003em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">i</span><span class="mrel mtight">=</span><span class="mord mtight">1</span></span></span></span><span style="top:-3.2029em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span clas
