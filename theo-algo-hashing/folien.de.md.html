<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"><defs>
<marker
id="arrow"
viewBox="0 0 2 2"
refX="1"
refY="1"
markerUnits="strokeWidth"
markerWidth="4"
markerHeight="4"
orient="auto-start-reverse">
    <path class="arrow-head" d="M 0 0 L 2 1 L 0 2 z" fill="gray"/><!-- We would like to use contextColor... but Safari doesn't support it :-( -->
</marker>
</defs></svg>
</ld-globals>

</svg>
</div>
</div><ld-deck><ld-card><ul class="incremental list-with-explanations"><li><p>Die Elemente werden <strong>über den Schlüssel indexiert</strong> in einer Tabelle <strong>gespeichert</strong>.</p><p>Der Index ist eine Funktion des Schlüssels.</p><ld-supplemental embed-in-document-flow=""><p>In dem Beispiel sind die Schlüssel die Worte: <span class="docutils literal">it</span> und <span class="docutils literal">times</span>.</p></ld-supplemental></li><li><p>Hash-Funktion<a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a>:  Methode zur Berechnung des Array-Index aus dem Schlüssel.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Herausforderungen</p><ol class="arabic incremental-list simple"><li><p>Berechnung der Hash-Funktion.</p></li><li><p>Gleichheitstest: Methode zur Überprüfung, ob zwei Schlüssel gleich sind.</p></li><li><p>Kollisionsauflösung: Algorithmus und Datenstruktur zur Behandlung von zwei Schlüsseln, die auf denselben Array-Index hindeuten.</p></li></ol></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p class="rubric">Klassischer Kompromiss zwischen Raum und Zeit!</p><dl class="dd-margin-left-15em field-list simple"><dt>Keine Platzbeschränkung<span class="colon">:</span></dt><dd><p>triviale Hash-Funktion mit Schlüssel als Index.</p></dd><dt>Keine Zeitbeschränkung<span class="colon">:</span></dt><dd><p>triviale Kollisionsauflösung mit sequentieller Suche.</p></dd><dt>Raum- und Zeitbeschränkung<span class="colon">:</span></dt><dd><p>Hashing (die reale Welt).</p></dd></dl></aside></ld-card></ld-deck><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-2" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-2">2</a><span class="fn-bracket">]</span></span><p>Nur im Zusammenhang mit Datenstrukturen! Kryptographische Hash-Funktionen haben bzw. erfüllen diesen Zweck nicht.</p></aside></aside></ld-topic>
<ld-topic id="berechnung-der-hash-funktion"><h2>Berechnung der Hash-Funktion</h2><dl class="field-list"><dt>Idealistisches Ziel<span class="colon">:</span></dt><dd><p>Die <em>Schlüssel gleichmäßig verwürfeln</em>, um einen Tabellenindex zu erzeugen.</p><ul class="simple"><li><p>Effizient berechenbar.</p></li><li><p>Jeder Tabellenindex ist für jeden Schlüssel gleich wahrscheinlich.</p></li></ul><ld-supplemental><p>Im allgemeinen gilt: Die Frage, wie man gute Schlüssel berechnet, ist ein gründlich erforschtes Problem, dass in der Praxis immer noch problematisch ist.</p></ld-supplemental></dd></dl><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel: Beispiel 1.  Telefonnummern.</span></p><dl class="field-list simple"><dt>Schlecht<span class="colon">:</span></dt><dd><p><span class="incremental">die ersten drei bis fünf Ziffern</span></p></dd><dt>Besser<span class="colon">:</span></dt><dd><p><span class="incremental">die letzten vier Ziffern</span></p></dd></dl></aside><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel: Beispiel 2.  Sozialversicherungsnummer</span></p><ld-supplemental embed-in-document-flow=""><p>Die ersten beiden Stellen bei der Sozialversicherungsnummer identifizieren den Rentenversicherungsträger.</p></ld-supplemental><dl class="field-list simple"><dt>Schlecht<span class="colon">:</span></dt><dd><p><span class="incremental">die ersten beiden Ziffern</span></p></dd><dt>Besser<span class="colon">:</span></dt><dd><p><span class="incremental">die letzten Ziffern</span></p></dd></dl></aside><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Praktische Herausforderung: für jeden Schlüsseltyp ist ein anderer Ansatz erforderlich.</p></aside></ld-topic>
<ld-topic class="new-section transition-move-to-top" id="hashfunktionen"><h2>Hashfunktionen</h2></ld-topic>
<ld-topic id="grundlagen"><h2>Grundlagen</h2><ld-deck><ld-card><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Hashfunktion</span></p><p>Eine Hashfunktion <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>h</mi><mo>:</mo><mi>M</mi><mo>→</mo><msub><mi mathvariant="double-struck">Z</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">h : M \rightarrow \mathbb{Z}_n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord mathnormal">h</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">:</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">→</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathbb">Z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> bildet eine Menge <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>M</mi></mrow><annotation encoding="application/x-tex">M</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span></span></span></span></span> mit <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi>M</mi><mi mathvariant="normal">∣</mi><mo>≥</mo><mi mathvariant="normal">∣</mi><msub><mi mathvariant="double-struck">Z</mi><mi>n</mi></msub><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">|M|\geq |\mathbb{Z}_n|</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">∣</span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mord">∣</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≥</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">∣</span><span class="mord"><span class="mord mathbb">Z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mord">∣</span></span></span></span></span> auf die Zahlen <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn><mo separator="true">,</mo><mi mathvariant="normal">.</mi><mi mathvariant="normal">.</mi><mi mathvariant="normal">.</mi><mo separator="true">,</mo><mi>n</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">0,...,n-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">...</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span> ab.</p><div class="compound incremental"><p>Eine Hashfunktion ist <em>surjektiv</em> wenn für jedes <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi><mo>∈</mo><msub><mi>Z</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">y \in  Z_n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7335em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">Z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> es ein <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>∈</mo><mi>M</mi></mrow><annotation encoding="application/x-tex">x \in  M</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span></span></span></span></span> mit <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>h</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mi>y</mi></mrow><annotation encoding="application/x-tex">h(x) = y</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">h</span><span class="mopen">(</span><span class="mord mathnormal">x</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span></span></span></span></span> gibt.</p><ld-presenter-note encrypted="">MTAwMDAw:0j0968xx72tAm9QMn5Wt/HzWxXxs+CAkuZg8GtpZ/Qc=:LBLaWNcpUSc95gGk:79l2mXJtc5aKFLmhpIwZx5I1le1zpr1htJihTikKD95CKbTAI906yRD9fDB9zAaUp3SlPYg+2yqwHgp7H2G7WI1DK6pq+I51avX/v7ZNTBteKuhILBkeuCwZgffrLI8np5d2G2Wnwv5shPvxbKG2QrfVVVBAN17ziTc7UeUlj18NmWXAiazYfuzW90YzAQ==</ld-presenter-note></div><div class="compound incremental"><p>Eine Hashfunktion ist <em>gleichverteilt</em>, wenn zwei Bilder <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi><mn>1</mn><mo separator="true">,</mo><mi>y</mi><mn>2</mn><mo>∈</mo><msub><mi mathvariant="double-struck">Z</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">y1,y2 \in  \mathbb{Z}_n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="mord">1</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="mord">2</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathbb">Z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> immer ungefähr gleich viele Urbilder haben <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><msup><mi>h</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo stretchy="false">(</mo><mrow><mi>y</mi><mn>1</mn></mrow><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mo>≈</mo><mi mathvariant="normal">∣</mi><msup><mi>h</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo stretchy="false">(</mo><mrow><mi>y</mi><mn>2</mn></mrow><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi></mrow><annotation encoding="application/x-tex">|h^{-1}({y1})|≈|h^{-1}({y2})|</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mord">∣</span><span class="mord"><span class="mord mathnormal">h</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mtight">1</span></span></span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="mord">1</span></span><span class="mclose">)</span><span class="mord">∣</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mord">∣</span><span class="mord"><span class="mord mathnormal">h</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mtight">1</span></span></span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="mord">2</span></span><span class="mclose">)</span><span class="mord">∣</span></span></span></span></span>.</p></div></aside><ld-supplemental embed-in-document-flow=""><p>In manchen Fällen ist der Nachweis der Surjektivität nicht möglich, aber es wird vermutet. In der Praxis können oft auch Hashfunktionen verwendet werden, die nicht-surjektiv sind. Dies hat jedoch signifikante Auswirkungen auf die Effizienz der Hashtabelle.</p><p>Die Gleichverteilung muss – für das korrekte Funktionieren von Datenstrukturen, die Hashfunktionen verwenden – häufig nicht eingehalten werden. Jedoch gilt auch hier, dass dies ggf. signifikante Auswirkungen auf die Effizienz der Hashtabelle hat. Darüber hinaus ist die Beschaffenheit der konkreten Daten, die durch die Hashfunktion in einem konkreten Szenariof verarbeitet werden, ggf. ebenfalls ein wichtiger Faktor bei der Wahl der Hashfunktion.</p></ld-supplemental></ld-card><ld-card class="incremental"><p class="rubric">Wichtige Anforderungen an Hashes für unterschiedliche Anwendungen</p><dl class="incremental-list dd-margin-left-2em field-list"><dt>Datenstrukturen<span class="colon">:</span></dt><dd><p>Die Hashfunktionen müssen sehr effizient sein.</p></dd><dt>Integritätsprüfung und Signaturen<span class="colon">:</span></dt><dd><p>Für die verwendeten Hashfunktionen muss gelten, dass es schwer ist:</p><ul class="simple"><li><p>ein Urbild zu finden (d. h. von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>Y</mi></mrow><annotation encoding="application/x-tex">Y</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.2222em;">Y</span></span></span></span></span> auf <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0785em;">X</span></span></span></span></span> zu schließen)</p></li><li><p>zwei kollidierende Werte zu finden.</p></li></ul><p>Eine effiziente Berechnung ist wünschenswert.</p><ld-supplemental embed-in-document-flow=""><p>Die Hashfunktion MD5 ist seit 2008 und SHA1 seit 2017 für praktische Anwendungen „geknackt“.</p></ld-supplemental></dd><dt>Passwortspeicherung<span class="colon">:</span></dt><dd><p><em>Hashfunktionen für Passwortspeicherung</em> sollten im Wesentlichen dieselben Anforderungen erfüllen wie Hashfunktionen für Integritätszwecke, <em>dürfen aber nicht effizient berechenbar sein</em>, um Brute-Force Angriffe zu verhindern.</p></dd></dl><aside class="admonition incremental" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>Im Folgenden konzentrieren wir uns auf Hashes für Datenstrukturen.</p></aside></ld-card><ld-card class="incremental"><p>Wenn das Ziel ist, Hash-Werte mit einer bestimmten Länge (zum Beispiel 32Bit) zu berechnen, dann wären folgende Hashfunktionen denkbar:</p><p class="rubric">Exemplarische Hashfunktionen</p><ld-deck><ld-card><p><strong>Ganze Zahlen</strong></p><pre class="code rust head no-margin literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name function">hash</span><span class="punctuation">(</span>x<span class="punctuation">:</span> <span class="keyword">u32</span><span class="punctuation">)</span> <span class="punctuation">:</span> <span class="keyword">u32</span> <span class="punctuation">{</span> <span class="comment single">// u32 == 32-Bit unsigned integer</span></code></pre><pre class="code rust tail incremental literal-block"><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">return</span> x<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p><strong>Gleitkommazahlen</strong></p><pre class="code rust head no-margin literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">fn</span> hash<span class="punctuation">(</span>x<span class="punctuation">:</span> <span class="keyword">f64</span><span class="punctuation">)</span> <span class="punctuation">:</span> <span class="keyword">u32</span> <span class="punctuation">{</span> <span class="comment single">// f64 == 64-Bit (IEEE) floating point number</span></code></pre><pre class="code rust snippet no-margin incremental literal-block"><small class="ln"> 2</small><code data-lineno=" 2">    bits <span class="punctuation">:</span> <span class="keyword">u64</span> <span class="operator">=</span> <span class="name function">f64ToBits</span><span class="punctuation">(</span>x<span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// u64 = 64-Bit (signed) integer</span></code></pre><pre class="code rust tail incremental literal-block"><small class="ln"> 2</small><code data-lineno=" 2">    <span class="comment single">// &gt;&gt;&gt; ist der *unsigned right shift* Operator.</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">return</span> <span class="punctuation">(</span><span class="keyword">u32</span><span class="punctuation">)</span> <span class="punctuation">(</span>bits <span class="operator">^</span> <span class="punctuation">(</span>bits <span class="operator">&gt;&gt;</span><span class="operator">&gt;</span> <span class="literal number integer">32</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>

<ld-topic class="exercises" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Zufall hashen"><p class="ld-exercise-title rubric"><span>Zufall hashen</span></p><p>Stellen Sie sich vor, Sie haben 512 Bits, die unabhängig und gleichverteilt („zufällig“) sind. Sie möchten mehrere Werte davon in einer Tabelle mit 256 Einträgen speichern. Wie könnte die Hashfunktion aussehen?</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:F3a7BO3Kp8EQAevSIv6uFyLs84muE6acTbvUumdUfVg=:lDziwqiN+UWCJcjj:WqORq4mnMHh8gEXQ2Brf8u4vfpH6V1OwCow+8d8TW/A67OumN/flTzdUNWUQGTuSY7oFVB3SQ7P4w72xj2PO9ykhkbyMVu+55pzOKkLlSXcJ2zkCHlZrjdBdMitn0eFVKRkcvLwtUzkAzWKWJuddQsOIBK/fd70tFf7GDzQ5SJIw3Tyq4oL5h79L1vuQ/zN+dh4s5rDCXpkPZg==</div></div><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - URLs hashen"><p class="ld-exercise-title rubric"><span>URLs hashen</span></p><p>Eine Logging-Anwendung speichert URLs in einer Hashtabelle. Praktisch alle URLs beginnen mit <span class="docutils literal">https://www.dhbw-mannheim.de/</span>. Tabellengröße: 4096.</p><p>Diskutieren Sie den folgenden Vorschlag: Nimm die ersten 8 Zeichen der URL und interpretiere sie als 64-Bit-Wert, dann modulo 4096.</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:vGRCRBv+QcL8s+GhSoAgcu8lQg+eWDVQwhwxA2dyI+A=:/+R4edO+wgXT3v3f:kueyfarfrVRvwGUwu+GFnDO6uZBmlbHfwcqpAYZE9UfxJJGT5FkOE9S32bRfbFjpJM+okhpxuqWmPzomYh5e7w8HFoipCWL4Ew6Q2NOFnaUjKhW8TuuYpnLe2dwoVXOm6PuqemxoRl/BjHrFO9fCn++UqOw9w1fltlYXpqMG14M/QULmD7Um26fCIDh4JimpZZT8Bp9llqPGF8HMdEiyV8slh+kyGFwHLS4nqOKtYHwuB1zWszGAMFejvfRGSE/D468X122RXXg6UbDaKKKHJmlOVxZlbLLmHK3NnJ0b8TizwPm358jQqvvhOoaytbtG4IxJuoMvGe3vTT7NJfzAr8Lpw++04j3xsXW/44nuaVx/5nVfXk2eH6DzkJmx/sKopAb2tUQlxRQKtMRkkNozTma6ZZi1x7CV2JvC1cIRJuFnqOvJ+zV+DEMjwQq8M9EXCK/cgSfF81O7Gq6fl73JzkhbtEaVPLtFINd+lx4Cu615I+cqHbiqSLdfXUobE0OjMVRyClGdW9ny6e0bVl7CtiaISdmuPfo29Mp3ophuU1DPSCoVW6OgZWm3Ixxa1t9q+2btjWEaDpMB5g9 <ld-topic class="new-section transition-move-to-top" id="hashing-in-programmiersprachen"><h2>Hashing in Programmiersprachen</h2><div class="section-subtitle"><p><a class="reference internal" href="#hashing-in-python">Hashing in Python</a></p><p><a class="reference internal" href="#hashing-in-java">Hashing in Java</a></p></div></ld-topic>
<ld-topic class="new-section transition-move-to-top" id="hashing-in-python"><h2>Hashing in Python</h2></ld-topic>
<ld-topic id="verwendung-von-hashes-in-python"><h2>Verwendung von Hashes in Python</h2><ld-deck><ld-card><ul class="incremental-list simple"><li><p>Bei der Speicherung von Objekten in Sets und Dictionaries verwendet Python Hashes.</p></li><li><p>Sobald ein Objekt in einem Set oder Dictionary gespeichert wird, darf der Objektzustand (zumindest im Hinblick auf die Hashfunktion) nicht mehr verändert werden!</p></li><li><p>Der Hashwert eines (nicht veränderlichen) Objekts kann mit der Funktion <span class="docutils literal">hash()</span> berechnet werden.</p></li><li><p>Eigene Objekte in Sets und Dictionaries speichern:</p><ul class="incremental-list simple"><li><p>Um benutzerdefinierte Objekte in einer Hashmap zu speichern, müssen wir die Methoden <code class="python">__hash__</code> und <code class="python">__eq__</code> implementieren.</p></li><li><p>Zu beachten:</p><ul class="simple"><li><p>Hashwerte <em>müssen für gleiche Objekte gleich sein</em>.</p></li><li><p>Hashwerte <em>für unterschiedliche Objekte sollten unterschiedlich sein</em>.</p></li></ul></li></ul></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Beispielklasse <code class="java"><span class="name class">Person</span></code></p><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">Person</span><span class="punctuation">:</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">def</span> <span class="name function">__init__</span><span class="punctuation">(</span>self<span class="punctuation">,</span> name<span class="punctuation">,</span> age<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">        self<span class="punctuation">.</span>name <span class="operator">=</span> name
</code><small class="ln"> 4</small><code data-lineno=" 4">        self<span class="punctuation">.</span>age <span class="operator">=</span> age
</code><small class="ln"> 5</small><code data-lineno=" 5">
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">def</span> <span class="name function">__eq__</span><span class="punctuation">(</span>self<span class="punctuation">,</span> other<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">        <span class="keyword">if</span> <span class="name builtin">isinstance</span><span class="punctuation">(</span>other<span class="punctuation">,</span> Person<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">            <span class="keyword">return</span>  self<span class="punctuation">.</span>name <span class="operator">==</span> other<span class="punctuation">.</span>name <span class="keyword">and</span> \
</code><small class="ln"> 9</small><code data-lineno=" 9">                    self<span class="punctuation">.</span>age <span class="operator">==</span> other<span class="punctuation">.</span>age
</code><small class="ln">10</small><code data-lineno="10">        <span class="keyword">return</span> <span class="keyword constant">False</span>
</code><small class="ln">11</small><code data-lineno="11">
</code><small class="ln">12</small><code data-lineno="12">    <span class="keyword">def</span> <span class="name function">__hash__</span><span class="punctuation">(</span>self<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln">13</small><code data-lineno="13">        <span class="keyword">return</span> <span class="name builtin">hash</span><span class="punctuation">(</span><span class="punctuation">(</span>self<span class="punctuation">.</span>name<span class="punctuation">,</span> self<span class="punctuation">.</span>age<span class="punctuation">)</span><span class="punctuation">)</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Verwendung der Klasse <code class="java"><span class="name class">Person</span></code></p><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1">person1 <span class="operator">=</span> Person<span class="punctuation">(</span><span class="literal string">"Alice"</span><span class="punctuation">,</span> <span class="literal number integer">30</span><span class="punctuation">)</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">person2 <span class="operator">=</span> Person<span class="punctuation">(</span><span class="literal string">"Bob"</span><span class="punctuation">,</span> <span class="literal number integer">25</span><span class="punctuation">)</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">person3 <span class="operator">=</span> Person<span class="punctuation">(</span><span class="literal string">"Alice"</span><span class="punctuation">,</span> <span class="literal number integer">30</span><span class="punctuation">)</span> <span class="comment single"># gleiche Werte wie "person1"</span></code></pre><p><strong>Beispielausgabe</strong></p><pre class="code python incremental literal-block"><code><span class="operator">&gt;&gt;</span><span class="operator">&gt;</span> person1

<span class="literal number integer">3529483511948588452</span></code></pre><ld-supplemental><p>In Python ist die Ausgabe der Funktion <span class="docutils literal">hash()</span> nach jedem Neustart der Pythonumgebung unterschiedlich, da die Hashfunktion einen Zufallswert enthält, der bei jedem Neustart neu generiert wird.</p></ld-supplemental></ld-card><ld-card class="incremental"><p class="rubric">Beispielklasse <code class="java"><span class="name class">Person</span></code> mit konstantem Hashwert</p><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">PersonWithBadHash</span><span class="punctuation">:</span>

</code><small class="ln"> 3</small><code data-lineno=" 3">        self<span class="punctuation">.</span>name <span class="operator">=</span> name

</code><small class="ln"> 7</small><code data-lineno=" 7">        <span class="keyword">if</span> <span class="name builtin">isinstance</span><span class="punctuation">(</span>other<span class="punctuation">,</span> Person<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">            <span class="keyword">return</span>  self<span class="punctuation">.</span>name <span class="operator">==</span> other<span class="punctuation">.</span>name <span class="keyword">and</span> \

</code><small class="ln">13</small><code data-lineno="13">        <span class="keyword">return</span> <span class="literal number integer">1</span> <span class="comment single"># immer der gleiche Hashwert</span></code></pre><ld-supplemental><p>Die Verwendung des Alters der Person als Hashwert wäre in den allermeisten Fällen auch keine gute Idee, da es (vermutlich) viele Hashkollisionen geben würde.</p></ld-supplemental></ld-card><ld-card class="incremental"><p class="rubric">Verwendung einer Klasse mit einer konstanten Hashfunktion</p><pre class="code python literal-block"><small class="ln"> 1</small><code data-lineno=" 1">person1 <span class="operator">=</span> Person<span class="punctuation">(</span><span class="literal string">"Alice"</span><span class="punctuation">,</span> <span class="literal number integer">30</span><span class="punctuation">)</span>

</code><small class="ln"> 4</small><code data-lineno=" 4">people <span class="operator">=</span> <span class="punctuation">{</span>person1<span class="punctuation">,</span> person2<span class="punctuation">,</span> person3<span class="punctuation">}</span>

</code><small class="ln"> 6</small><code data-lineno=" 6"><span class="keyword">print</span><span class="punctuation">(</span><span class="name builtin">hash</span><span class="punctuation">(</span>person2<span class="punctuation">)</span><span class="punctuation">)</span>

<ld-topic id="verwendung-von-hashes-in-java"><h2>Verwendung von Hashes in Java</h2><ld-deck><ld-card><ul class="incremental-list simple"><li><p>Bei der Speicherung von Objekten in <code class="java"><span class="name class">Set</span></code>s und <code class="java"><span class="name class">HashMap</span></code>s/<code class="java"><span class="name class">Hashtable</span></code>s verwendet Java die Hashwerte, die von der Methode <code class="java"><span class="name function">hashCode</span><span class="punctuation">(</span><span class="punctuation">)</span></code> zurückgegeben werden.</p></li><li><p>Sobald ein Objekt in einem <code class="java"><span class="name class">Set</span></code> oder einer <code class="java"><span class="name class">Map</span></code> gespeichert wird, darf der Objektzustand (zumindest im Hinblick auf die Hashfunktion) nicht mehr verändert werden!</p></li><li><p>Eigene Objekte in <code class="java"><span class="name class">Set</span></code>s und <code class="java"><span class="name class">Map</span></code>s speichern:</p><ul class="incremental-list simple"><li><p>Um benutzerdefinierte Objekte in einer <code class="java"><span class="name class">HashMap</span></code> zu speichern, müssen wir die Methoden <code class="java"><span class="keyword">boolean</span> <span class="name function">equals</span><span class="punctuation">(</span><span class="name class">Object</span> o<span class="punctuation">)</span></code> und <code class="python"><span class="name builtin">int</span> hashCode<span class="punctuation">(</span><span class="punctuation">)</span></code> implementieren.</p></li><li><p>Zu beachten:</p><ul class="simple"><li><p>Hashwerte <em>müssen für gleiche Objekte gleich sein</em>.</p></li><li><p>Hashwerte <em>für unterschiedliche Objekte sollten unterschiedlich sein</em>.</p></li></ul></li></ul></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Beispielklasse <code class="java"><span class="name class">Person</span></code></p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">Person</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="keyword">private</span> <span class="name class">String</span> name<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">private</span> <span class="keyword">int</span> age<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="name class">Person</span><span class="punctuation">(</span><span class="name class">String</span> name<span class="punctuation">,</span> <span class="keyword">int</span> age<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">this</span><span class="punctuation">.</span>name <span class="operator">=</span> name<span class="punctuation">;</span> <span class="keyword">this</span><span class="punctuation">.</span>age <span class="operator">=</span> age<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">public</span> <span class="keyword">boolean</span> <span class="name function">equals</span><span class="punctuation">(</span><span class="name class">Object</span> o<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">        <span class="keyword">if</span> <span class="punctuation">(</span>o <span class="keyword">instanceof</span> <span class="name class">Person</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="comment single">// Alt. compare class objects</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">            <span class="name class">Person</span> other <span class="operator">=</span> <span class="punctuation">(</span><span class="name class">Person</span><span class="punctuation">)</span> o<span class="punctuation">;</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">            <span class="keyword">return</span> <span class="keyword">this</span><span class="punctuation">.</span>name<span class="punctuation">.</span><span class="name function">equals</span><span class="punctuation">(</span>other<span class="punctuation">.</span>name<span class="punctuation">)</span> <span class="operator">&amp;&amp;</span> <span class="keyword">this</span><span class="punctuation">.</span>age <span class="operator">==</span> other<span class="punctuation">.</span>age<span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10">        <span class="punctuation">}</span>
</code><small class="ln">11</small><code data-lineno="11">        <span class="keyword">return</span> <span class="keyword constant">false</span><span class="punctuation">;</span>
</code><small class="ln">12</small><code data-lineno="12">    <span class="punctuation">}</span>
</code><small class="ln">13</small><code data-lineno="13">
</code><small class="ln">14</small><code data-lineno="14">    <span class="keyword">public</span> <span class="keyword">int</span> <span class="name function">hashCode</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">return</span> <span class="name class"><span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span>Objects</span><span class="punctuation">.</span><span class="name function">hash</span><span class="punctuation">(</span>name<span class="punctuation">,</span> age<span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">15</small><code data-lineno="15"><span class="punctuation">}</span></code></pre><ld-supplemental><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>In einem realen Project würden wir ein <code class="java"><span class="keyword">record</span></code> statt einer Klasse verwenden; die Implementierung wäre praktisch identisch und würde automatisch generiert werden.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">record</span> <span class="name class">Person</span><span class="punctuation">(</span><span class="name class">String</span> name<span class="punctuation">,</span> <span class="keyword">int</span> age<span class="punctuation">)</span> <span class="punctuation">{</span><span class="punctuation">}</span></code></pre></aside></ld-supplemental></ld-card><ld-card class="incremental"><p class="rubric">Verwendung der Klasse <code class="java"><span class="name class">Person</span></code></p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">var</span> person1 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Person</span><span class="punctuation">(</span><span class="literal string">"Alice"</span><span class="punctuation">,</span> <span class="literal number integer">30</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">var</span> person2 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Person</span><span class="punctuation">(</span><span class="literal string">"Bob"</span><span class="punctuation">,</span> <span class="literal number integer">25</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">var</span> person3 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Person</span><span class="punctuation">(</span><span class="literal string">"Alice"</span><span class="punctuation">,</span> <span class="literal number integer">30</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="comment single">// gleiche Werte wie "person1"</span></code></pre><p><strong>Beispielausgabe</strong></p><pre class="code console incremental literal-block"><small class="ln"> 1</small><code data-lineno=" 1">person1 <span class="operator">==</span><span class="operator">&gt;</span> Person@750e297f // the addresses are memory addresses
</code><small class="ln"> 2</small><code data-lineno=" 2">person2 <span class="operator">==</span><span class="operator">&gt;</span> Person@1fb0e5
</code><small class="ln"> 3</small><code data-lineno=" 3">person3 <span class="operator">==</span><span class="operator">&gt;</span> Person@650e893b</code></pre></ld-card><ld-card class="incremental"><p class="rubric">Speicherung von <code class="java"><span class="name class">Person</span></code>-Objekten in einem Set</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">var</span> set <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">HashSet</span><span class="punctuation">&lt;</span><span class="name class">Person</span><span class="punctuation">&gt;</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">set<span class="punctuation">.</span><span class="name function">add</span><span class="punctuation">(</span>person1<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">set<span class="punctuation">.</span><span class="name function">add</span><span class="punctuation">(</span>person2<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">set<span class="punctuation">.</span><span class="name function">add</span><span class="punctuation">(</span>person3<span class="punctuation">)</span><span class="punctuation">;</span></code></pre><pre class="code java copy-to-clipboard incremental literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="comment single">// throws IllegalArgumentException:</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">var</span> people <span class="operator">=</span> <span class="name class">Set</span><span class="punctuation">.</span><span class="name function">of</span><span class="punctuation">(</span>person1<span class="punctuation">,</span> person2<span class="punctuation">,</span> person3<span class="punctuation">)</span></code></pre><div class="incremental"><p class="rubric">Ausgabe des Sets</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">for</span> <span class="punctuation">(</span><span class="keyword">var</span> p <span class="operator">:</span> people<span class="punctuation">)</span> <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>p<span class="punctuation">.</span>name<span class="punctuation">)</span><span class="punctuation">;</span></code></pre></div><div class="incremental"><p><strong>Ausgabe</strong></p><pre class="code java literal-block"><code><span class="name class">Bob</span>
<span class="name class">Alice</span></code></pre></div></ld-card><ld-card class="incremental"><p class="rubric">Verwendung der <code class="java">hashCode</code>-Funktion</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>person1<span class="punctuation">.</span><span class="name function">hashCode</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>person2<span class="punctuation">.</span><span class="name function">hashCode</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>person3<span class="punctuation">.</span><span class="name function">hashCode</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre><p><strong>Beispielausgabe</strong></p><pre class="code python incremental literal-block"><code><span class="literal number integer">1963862399</span>
<span class="literal number integer">2076901</span>
<span class="literal number integer">1963862399</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Beispielklasse <code class="java"><span class="name class">Person</span></code> mit konstantem Hashwert</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">PersonWithBadHash</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="name class">String</span> name<span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">int</span> age<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="name class">PersonWithBadHash</span><span class="punctuation">(</span><span class="name class">String</span> name<span class="punctuation">,</span> <span class="keyword">int</span> age<span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">this</span><span class="punctuation">.</span>name <span class="operator">=</span> name<span class="punctuation">;</span> <span class="keyword">this</span><span class="punctuation">.</span>age <span class="operator">=</span> age<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">public</span> <span class="keyword">boolean</span> <span class="name function">equals</span><span class="punctuation">(</span><span class="name class">Object</span> o<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">        <span class="keyword">if</span> <span class="punctuation">(</span>o <span class="keyword">instanceof</span> <span class="name class">PersonWithBadHash</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">            <span class="name class">PersonWithBadHash</span> other <span class="operator">=</span> <span class="punctuation">(</span><span class="name class">PersonWithBadHash</span><span class="punctuation">)</span> o<span class="punctuation">;</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">            <span class="keyword">return</span> <span class="keyword">this</span><span class="punctuation">.</span>name<span class="punctuation">.</span><span class="name function">equals</span><span class="punctuation">(</span>other<span class="punctuation">.</span>name<span class="punctuation">)</span> <span class="operator">&amp;&amp;</span> <span class="keyword">this</span><span class="punctuation">.</span>age <span class="operator">==</span> other<span class="punctuation">.</span>age<span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10">        <span class="punctuation">}</span>
</code><small class="ln">11</small><code data-lineno="11">        <span class="keyword">return</span> <span class="keyword constant">false</span><span class="punctuation">;</span>
</code><small class="ln">12</small><code data-lineno="12">    <span class="punctuation">}</span>
</code><small class="ln">13</small><code data-lineno="13">
</code><small class="ln">14</small><code data-lineno="14">    <span class="keyword">public</span> <span class="keyword">int</span> <span class="name function">hashCode</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">return</span> <span class="literal number integer">1</span><span class="punctuation">;</span> <span class="comment single">/* immer der gleiche Hashwert */</span> <span class="punctuation">}</span>
</code><small class="ln">15</small><code data-lineno="15"><span class="punctuation">}</span></code></pre><ld-supplemental><p>Die Verwendung „nur“ des Alters der Person als Hashwert wäre in den allermeisten Fällen auch keine gute Idee, da es (vermutlich) viele Hashkollisionen geben würde.</p></ld-supplemental></ld-card><ld-card class="incremental"><p class="rubric">Verwendung einer Klasse mit einer konstanten Hashfunktion</p><pre class="code java literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">var</span> person1 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">PersonWithBadHash</span><span class="punctuation">(</span><span class="literal string">"Alice"</span><span class="punctuation">,</span> <span class="literal number integer">30</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">var</span> person2 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">PersonWithBadHash</span><span class="punctuation">(</span><span class="literal string">"Bob"</span><span class="punctuation">,</span> <span class="literal number integer">25</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>person1<span class="punctuation">.</span><span class="name function">hashCode</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4"><span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>person2<span class="punctuation">.</span><span class="name function">hashCode</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 5</small><code data-lineno=" 5"><span class="keyword">var</span> people <span class="operator">=</span> <span class="name class">Set</span><span class="punctuation">.</span><span class="name function">of</span><span class="punctuation">(</span>person1<span class="punctuation">,</span> person2<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">people<span class="punctuation">.</span><span class="name function">forEach</span><span class="punctuation">(</span>p <span class="operator">-&gt;</span> <span class="name class">System</span><span class="punctuation">.</span>out<span class="punctuation">.</span><span class="name function">println</span><span class="punctuation">(</span>p<span class="punctuation">.</span>name<span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre><p><strong>Beispielausgabe</strong></p><pre class="code java literal-block"><code><span class="literal number integer">1</span>
<span class="literal number integer">1</span>
<span class="literal number integer">1</span>
<span class="name class">Alice</span> <span class="name class">Bob</span></code></pre><ld-supplemental><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Die Verwendung einer konstanten Hashfunktion ist in der Regel keine gute Idee, da sie die Effizienz von Hashmaps ganz erheblich beeinträchtigen kann.</p></aside></ld-supplemental></ld-card></ld-deck></ld-topic>
<ld-topic class="exercises transition-fade" id="ubung-4"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-7" data-exercise-id="7" data-exercise-title="7 - Eine Klasse zur Repräsentation von Studierenden."><p class="ld-exercise-title rubric"><span>Eine Klasse zur Repräsentation von Studierenden.</span></p><p>Die Klasse <code class="java"><span class="name class">Student</span></code> (nutzen Sie <em>hier</em> kein <code class="java"><span class="keyword">record</span></code>) soll:</p><ul class="simple"><li><p>Die Attribute/Properties <code class="java">name</code> und <code class="java">matriculationNumber</code> haben.</p></li><li><p>Die Methoden <code class="java"><span class="name function">equals</span><span class="punctuation">(</span><span class="name class">Object</span><span class="punctuation">)</span></code> und <code class="java"><span class="name function">hashCode</span><span class="punctuation">(</span><span class="punctuation">)</span></code> sinnvoll/korrekt definieren.</p></li></ul><p>Aufgaben:</p><ol class="arabic"><li><p>Erzeugen Sie drei <code class="java"><span class="name class">Student</span></code>-Objekte und speichern Sie diese in einem Set.</p></li><li><p><em>Fragen Sie sich wie sie effizient den Hashwert berechnen können.</em></p></li><li><p>Geben Sie die Namen der Studierenden aus.</p></li><li><p>Was passiert, wenn Sie — <em>nachdem Sie ein</em> <code class="java"><span class="name class">Student</span></code> <em>Objekt einem</em> <code class="java"><span class="name class">HashSet</span></code> <em>hinzugefügt haben</em> — den Namen des Studenten ändern?</p><p>Schreiben Sie entsprechenden Code, um Ihre Annahme zu überprüfen!</p></li></ol><ld-supplemental><p class="rubric">Rumpfimplementierung</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">import</span> <span class="name namespace">java<span class="punctuation">.</span>util<span class="punctuation">.</span></span><span class="name class">HashSet</span><span class="punctuation">;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">class</span> <span class="name class">Student</span> <span class="punctuation">{</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="keyword">private</span> <span class="name class">String</span> name<span class="punctuation">;</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="keyword">private</span> <span class="keyword">int</span> matriculationNumber<span class="punctuation">;</span>
