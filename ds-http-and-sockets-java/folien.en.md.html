<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />

</defs>

<ld-topic class="repetition" id="ip"><h2>IP</h2><p>The network layer (Internet layer)</p><ul class="simple"><li><p>handles the routing</p></li><li><p>realizes end-to-end communication</p></li><li><p>transmits packets</p></li><li><p>is realized in the Internet through IP</p></li><li><p>solves the following problems:</p><ul class="simple"><li><p>Sender and receiver receive network-wide unique identifiers (⇒ IP addresses)</p></li><li><p>the packets are forwarded by special devices (⇒ routers)</p></li></ul></li></ul></ld-topic>
<ld-topic class="repetition" id="tcp-and-udp"><h2>TCP and UDP</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">Transmission Control Protocol (TCP), RFC 793</p><ul class="simple"><li><p>connection-orientated communication</p></li><li><p>also the concept of ports</p></li><li><p>Establishing a connection between two processes (triple handshake, full-duplex communication)</p><ul class="simple"><li><p>Ordered communication</p></li><li><p>reliable communication</p></li><li><p>Flow control</p></li><li><p>high overhead ⇒ rather slow</p></li><li><p>only unicasts</p></li></ul></li></ul></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">User Datagram Protocol (UDP), RFC 768</p><ul class="simple"><li><p>connectionless communication</p><ul class="simple"><li><p>unreliable (⇒ no error control)</p></li><li><p>unordered (⇒ arbitrary order)</p></li><li><p>little overhead (⇒ fast)</p></li></ul></li><li><p>Size of the user data is 65507 bytes</p><ul class="simple"><li><p>Apps with predominantly short messages (e.g. NTP, RPC, NIS)</p></li><li><p>Apps with high throughput that tolerate some errors (e.g. multimedia)</p></li><li><p>Multicasts and broadcasts</p></li></ul></li></ul></ld-cell></ld-grid><ld-supplemental><p>In practice datagrams (i. e. packages sent using UDP) are usually much smaller than 65507 bytes.</p></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-scale" id="hypertext-transfer-protocol-http"><h2>Hypertext Transfer Protocol (HTTP)</h2></ld-topic>
<ld-topic id="http"><h2>HTTP</h2><ul class="simple"><li><p><a class="reference external" href="http://www.ietf.org/rfc/rfc7230.txt">RFC 7230</a> – 7235: HTTP/1.1 (updated in 2014; orig. 1999 RFC 2626)</p></li><li><p>RFC 7540: HTTP/2 (standardized since May 2015)</p></li><li><p>Properties:</p><ul class="simple"><li><p>Client / server (browser / web server)</p></li><li><p>based on TCP, usually port 80</p></li><li><p>Server (mostly) stateless</p></li><li><p>since HTTP/1.1 also persistent connections and pipelining</p></li><li><p>Secure transmission (encryption) possible using Secure Socket Layer (SSL) or Transport Layer Security (TLS)</p></li></ul></li></ul></ld-topic>
<ld-topic id="conceptual-process"><h2>Conceptual process</h2><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><object class="align-center" data="drawings/http/http.svg" type="image/svg+xml" role="img"></object></ld-cell><ld-cell style="align-self:auto;"><p class="rubric">HTTP Commands</p><p>("Verbs")</p><ul class="simple"><li><p>HEAD</p></li><li><p>GET</p></li><li><p>POST</p></li><li><p>PUT</p></li><li><p>PATCH</p></li><li><p>DELETE</p></li><li><p>OPTIONS</p></li><li><p>TRACE</p></li><li><p>CONNECT</p></li><li><p>...</p></li></ul></ld-cell></ld-grid></ld-topic>
<ld-topic id="protocol-definition"><h2>Protocol definition</h2><p>Structure of document identifiers  <em>Uniform Resource Locator (URL)</em></p><div class="accentuate text-align-center"><p><span class="docutils literal">scheme://host[:port][abs_path[?query][#anchor]]</span></p></div><ld-deck><ld-card><dl class="field-list simple"><dt><span class="docutils literal">scheme</span><span class="colon">:</span></dt><dd><p>Protocol (case-insensitive) (e.g. <span class="docutils literal">http</span>, <span class="docutils literal">https</span> or <span class="docutils literal">ftp</span>)</p></dd><dt><span class="docutils literal">host</span><span class="colon">:</span></dt><dd><p>DNS-Name (or IP-address) of the server (case-insensitive)</p></dd><dt><span class="docutils literal">port</span><span class="colon">:</span></dt><dd><p>(optional) if empty, 80 in case of <span class="docutils literal">http</span> and 443 in case of <span class="docutils literal">https</span></p></dd><dt><span class="docutils literal">abs_path</span><span class="colon">:</span></dt><dd><p>(optional) path-expression relative to the server-root (case-sensitive)</p></dd><dt><span class="docutils literal">?query</span><span class="colon">:</span></dt><dd><p>(optional) direct parameter transfer (case-sensitive) (<span class="docutils literal">?from=…&#x26;to=…</span>)</p></dd><dt><span class="docutils literal">#anchor</span><span class="colon">:</span></dt><dd><p>(optional) jump label within the document</p></dd></dl></ld-card><ld-card class="incremental"><p>Uniform Resource Identifier (URI) are a generalization URLs.</p><ul><li><p>defined in RFC 1630 in 1994</p></li><li><p>either a URL (location) or a URN (name) (e. g. <span class="docutils literal">urn:isbn:1234567890</span>)</p></li><li><p>examples of URIs that are not URLs are <em>XML Namespace Identifiers</em></p><pre class="code XML literal-block"><code><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>svg</span> <span class="name attribute">version</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>1.1<span class="punctuation">"</span></span> <span class="name attribute">xmlns</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>http://www.w3.org/2000/svg<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>...<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>svg</span><span class="punctuation">&gt;</span></span></code></pre></li></ul></ld-card></ld-deck><ld-supplemental><p>Quite frequently URIs take the shape of URLs and hence are often referred to as URLs thought they do not primarily identify locations but rather names.</p></ld-supplemental></ld-topic>
<ld-topic id="the-get-command"><h2>The GET command</h2><ld-deck><ld-card><ul><li><p>Used to request HTML data from the server (request method).</p></li><li><p>Minimal request:</p><dl class="field-list"><dt>Request<span class="colon">:</span></dt><dd><pre class="code http literal-block"><small class="ln">1</small><code data-lineno="1">GET &lt;Path&gt; HTTP/1.1
</code><small class="ln">2</small><code data-lineno="2">Host<span class="punctuation">:</span> &lt;Hostname&gt;
</code><small class="ln">3</small><code data-lineno="3">Connection<span class="punctuation">:</span> close
</code><small class="ln">4</small><code data-lineno="4">&lt;Leerzeile (CRLF)&gt;</code></pre></dd><dt>Options<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Clients can also send additional information about the request and itself.</p></li><li><p>Servers send the status of the request as well as information about itself and, if applicable, the requested HTML file.</p></li></ul></dd></dl></li><li><p>Error messages may also be packaged by the server as HTML data and sent as a response.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Example request</p><pre class="code http literal-block"><small class="ln">1</small><code data-lineno="1">GET /web/web.php HTTP/1.1
</code><small class="ln">2</small><code data-lineno="2">Host<span class="punctuation">:</span> archive.org
</code><small class="ln">3</small><code data-lineno="3">**CRLF**</code></pre><p class="rubric">Example response</p><pre class="code http literal-block"><small class="ln"> 1</small><code data-lineno=" 1">HTTP/1.1 200 OK
</code><small class="ln"> 2</small><code data-lineno=" 2">Server<span class="punctuation">:</span> nginx/1.25.1
</code><small class="ln"> 3</small><code data-lineno=" 3">Date<span class="punctuation">:</span> Thu, 22 Feb 2024 19:47:11 GMT
</code><small class="ln"> 4</small><code data-lineno=" 4">Content-Type<span class="punctuation">:</span> text/html; charset=UTF-8
</code><small class="ln"> 5</small><code data-lineno=" 5">Transfer-Encoding<span class="punctuation">:</span> chunked
</code><small class="ln"> 6</small><code data-lineno=" 6">Connection<span class="punctuation">:</span> close
</code><small class="ln"> 7</small><code data-lineno=" 7">**CRLF**
</code><small class="ln"> 8</small><code data-lineno=" 8">&lt;!DOCTYPE html&gt;
</code><small class="ln"> 9</small><code data-lineno=" 9">…
</code><small class="ln">10</small><code data-lineno="10">&lt;/html&gt;**CRLF**</code></pre></ld-card></ld-deck></ld-topic>
<ld-topic class="new-section transition-scale" id="sockets"><h2>Sockets</h2></ld-topic>
<ld-topic id="sockets-in-java"><h2>Sockets in Java</h2><p><strong>Sockets are communication endpoints.</strong></p><ul><li><p>Sockets are addressed via the IP address (InetAddress object) and an internal port number (int value).</p></li><li><p>Sockets exist for TCP and also for UDP, but with different properties:</p><dl class="field-list simple"><dt>TCP<span class="colon">:</span></dt><dd><p>connection-orientated communication via <em>streams</em></p></dd><dt>UDP<span class="colon">:</span></dt><dd><p>connectionless communication via <em>datagrams</em></p></dd></dl></li><li><p>Receiving data is always blocking, i. e. the receiving thread or process waits if no data is available.</p></li></ul></ld-topic>
<ld-topic id="tcp-sockets"><h2>TCP Sockets</h2><object class="align-center" data="drawings/http/tcp_sockets.svg" type="image/svg+xml" role="img"></object><ld-supplemental><ol class="arabic simple"><li><p>The server process waits at the known server port.</p></li><li><p>The client process creates a private socket.</p></li><li><p>The socket establishes a connection to the server process - if the server accepts the connection.</p></li><li><p>Communication is stream-orientated: An input stream and an output stream are set up for both parties, via which data can now be exchanged.</p></li><li><p>When all data has been exchanged, both parties generally close the connection.</p></li></ol></ld-supplemental></ld-topic>
<ld-topic id="a-simple-portscanner-in-java"><h2>(A simple) Portscanner in Java</h2><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">import</span> <span class="name namespace">java<span class="punctuation">.</span>net<span class="punctuation">.</span></span><span class="operator">*</span><span class="punctuation">;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">import</span> <span class="name namespace">java<span class="punctuation">.</span>io<span class="punctuation">.</span></span><span class="operator">*</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">

<ld-topic id="exchange-of-data"><h2>Exchange of Data</h2><ul class="incremental-list simple"><li><p>Once the connection has been established, data can be exchanged between the client and server using the Socket-InputStream and Socket-OutputStream.</p></li><li><p>The best way to do this is to pass the raw data through suitable filter streams in order to achieve the highest possible semantic level.</p><ul class="simple"><li><p>Examples: <code class="java"><span class="name class">PrintWriter</span></code>, <code class="java"><span class="name class">BufferedReader</span></code>, <code class="java"><span class="name class">BufferedInputStream</span></code>, <code class="java"><span class="name class">BufferedOutputStream</span></code></p></li><li><p>Network communication can then be conveniently carried out via well-known and convenient input and output routines (e.g. <code class="java">readLine</code> or <code class="java">println</code>).</p></li><li><p>Filter streams are also used to access other devices and files.</p></li></ul></li></ul><ld-supplemental><p>By using the <em>decorator pattern</em>, the filter streams can be nested as required and used in a variety of ways. This makes application programming easier and allows, for example, the simple conversion of character strings, data compression, encryption, etc.</p></ld-supplemental></ld-topic>

<ld-topic id="udp-sockets"><h2>UDP Sockets</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">At the client side</p><ol class="arabic simple"><li><p>create <code class="java"><span class="name class">DatagramSocket</span></code></p></li><li><p>create <code class="java"><span class="name class">DatagramPacket</span></code></p></li><li><p>send <code class="java"><span class="name class">DatagramPacket</span></code></p></li><li><p>wait for response and process it, if needed</p></li></ol></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">At the server side</p><ol class="arabic simple"><li><p>create <code class="java"><span class="name class">DatagramSocket</span></code> with a fixed port</p></li><li><p>start endless loop</p></li><li><p>prepare <code class="java"><span class="name class">DatagramPacket</span></code></p></li><li><p>receive <code class="java"><span class="name class">DatagramPacket</span></code></p></li><li><p>process <code class="java"><span class="name class">DatagramPacket</span></code></p></li><li><p>create and send response if needed</p></li></ol></ld-cell></ld-grid></ld-topic>

<ld-topic class="exercises transition-fade" id="exercise"><h2>Exercise</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - A simple HTTP-Client"><p class="ld-exercise-title rubric"><span>A simple HTTP-Client</span></p><ol class="loweralpha list-with-explanations"><li><p>Write an HTTP client that contacts the server <span class="docutils literal">www.michael-eichberg.de</span>, requests the file <span class="docutils literal">/index.html</span> and displays the server response on the screen.</p><p>Use HTTP/1.1 and a structure similar to the echo client presented in the lecture.</p><p>Send the GET command, the host line and an empty line to the server as strings.</p></li><li><p>Modify your client so that a URL is accepted as a command line parameter.</p><p>Use the (existing) class URL to decompose the specified URL.</p></li><li><p>Modify your program so that the response from the server is saved in a local file. Load the file into a browser for display.</p><p>Use the class <code class="java"><span class="name class">FileOutputStream</span></code> or <code class="java"><span class="name class">FileWriter</span></code> to save the file.</p><p>Can your program also save image files (e.g. ‘/exercises/star.jpg’) correctly?</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:+xwkr9w0YZ8wtJVsDMK+bY/4BYE0spIDpfjXJUeY4cc=:h8E2UPlhtcSbkgvd:aXcKmdUuHS77nQXE+WnD69ZKy7Ea8s4vaBddkBLLivEXSHuvJF9V29dP9vukUSWCZ4NxJALt7lzwzhz5OjJG8xyIHKwpJgJsmMk5UPuY0npjXCqmXyANu5AUW/JYkPa92so+v3vQqoCO8w4XSzxErbigOiMSmNeHU7AKK4SjZPGM6Wu6Qpn6mI2EpW3nB3eWmiw9NDLiCcLC9bmgmGHfZHLpCaGYdYDIlImmLK6MVK6mzocRD+oaA2LttX5IdXQQRvGWrSCYpR4ofE28lLdFSpSb6n7uOnPj37DSLHKEg78yaI5aY1SKCK7a3/0pwhThbr5Ygu5urAoUrVrGvVlRWf4WzOhNrZxGb1svRAXEjWYxM33RH73AtA5zcAc+Qsp3Ou2X+lLhzNrCj/Pgj8+jiHvuqK6uGxu9oZjqXYJ9SNTQlf8JA2jZTCpR8RhC01pMg9dNpXPRLQrQbjEigGVtIofh8zKvuJhTIi34oUBotEhinafF1OdpSLJXEh41jSlWXWYlgCgq3yWrmwG2CTpXLrHgWak52ZouCaVP2RA7VFKCPHJt7k3L0d3n+oXxEtHl9KobEa
