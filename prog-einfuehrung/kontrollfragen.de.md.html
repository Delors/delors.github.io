aber ggf. auch ChatGPT, Ollama mit Gemma/LLama/Qwen oder OpenCode mit
Kimi/Qwen/Deepseek...) unterstützend eingesetzt.
Dies erfolgte insbesondere zur Unterstützung bei der Generierung von Grafiken
(d. h. SVG Dateien), oder um sich Übersichtstabellen generieren zu lassen.
Weiterhin wurde KI zur allgemeinen Qualitätssicherung eingesetzt.

<ld-topic class="new-section" id="extended-backus-naur-form-ebnf"><h2>Extended Backus-Naur Form (EBNF)</h2></ld-topic>
<ld-topic class="exercises" id="kontrollfragen-ebnf"><h2>Kontrollfragen - EBNF</h2><ld-deck><ld-card><div class="ld-exercise" id="ld-exercise-6" data-exercise-id="6" data-exercise-title="6 - EBNF verwenden"><p class="ld-exercise-title rubric"><span>EBNF verwenden</span></p><pre class="code ebnf literal-block"><small class="ln"> 1</small><code data-lineno=" 1">Datei          <span class="operator">=</span> <span class="punctuation">{</span> Eintrag <span class="punctuation">}</span> <span class="punctuation">;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">Eintrag        <span class="operator">=</span> SchluesselWert <span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">SchluesselWert <span class="operator">=</span> Schlüssel <span class="punctuation">,</span> <span class="literal string">":"</span> <span class="punctuation">,</span> Wert <span class="punctuation">,</span> <span class="literal string">";"</span> <span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">Schlüssel      <span class="operator">=</span> Buchstaben <span class="punctuation">,</span> <span class="punctuation">{</span> Buchstaben <span class="operator">|</span> Ziffern <span class="operator">|</span> <span class="literal string">"_"</span> <span class="punctuation">}</span> <span class="punctuation">;</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">Wert           <span class="operator">=</span> Zahl <span class="operator">|</span> String <span class="punctuation">;</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">Zahl           <span class="operator">=</span> Ziffern <span class="punctuation">,</span> <span class="punctuation">{</span> Ziffern <span class="punctuation">}</span> <span class="punctuation">;</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">String         <span class="operator">=</span> <span class="literal string">'"'</span> <span class="punctuation">,</span> <span class="punctuation">{</span> Zeichen <span class="punctuation">}</span> <span class="punctuation">,</span> <span class="literal string">'"'</span> <span class="punctuation">;</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">Buchstaben     <span class="operator">=</span> <span class="literal string">"a"</span> <span class="operator">|</span> <span class="literal string">"b"</span> <span class="operator">|</span> <span class="literal string">"c"</span> <span class="operator">|</span> <span class="literal string">"d"</span> <span class="operator">|</span> <span class="literal string">"e"</span> <span class="operator">|</span> <span class="literal string">"f"</span> <span class="operator">|</span> <span class="literal string">"g"</span> <span class="operator">|</span> <span class="literal string">"h"</span> <span class="operator">|</span> <span class="literal string">"i"</span> <span class="operator">|</span> <span class="literal string">"j"</span> <span class="operator">|</span> <span class="literal string">"k"</span> <span class="operator">|</span> <span class="literal string">"l"</span> <span class="operator">|</span>

</code><small class="ln">10</small><code data-lineno="10">                 <span class="literal string">"y"</span> <span class="operator">|</span> <span class="literal string">"z"</span> <span class="operator">|</span> <span class="literal string">"A"</span> <span class="operator">|</span> <span class="literal string">"B"</span> <span class="operator">|</span> <span class="literal string">"C"</span> <span class="operator">|</span> <span class="literal string">"D"</span> <span class="operator">|</span> <span class="literal string">"E"</span> <span class="operator">|</span> <span class="literal string">"F"</span> <span class="operator">|</span> <span class="literal string">"G"</span> <span class="operator">|</span> <span class="literal string">"H"</span> <span class="operator">|</span> <span class="literal string">"I"</span> <span class="operator">|</span> <span class="literal string">"J"</span> <span class="operator">|</span>
