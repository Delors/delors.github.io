<!-- SVG meant to be directly embedded in a LectureDoc Document. -->
<svg
  class="se-diagram"
  version="1.1"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 354 338"
  font-size="14"
>
  <title>Software-Inspektionen im Entwicklungsprozess</title>

  <!-- Die Technik selbst -->
  <rect class="artifact-accent" x="8" y="6" width="128" height="44" />
  <text class="label" x="72">
    <tspan y="23.5">Software</tspan>
    <tspan x="72" y="42.5">Inspektionen</tspan>
  </text>


  <!-- Statisch geprüfte Artefakte (linke Spalte) -->
  <g class="incremental">
    <path class="connector" d="M 30 50 V 84" />
    <g class="connector" marker-end="url(#se-arrow)" fill="none">
      <path d="M 30 84 H 52" />
    </g>

    <rect class="artifact" x="52" y="62" width="128" height="44" />
    <text class="label" x="116">
      <tspan y="79.5">Anforderungs-</tspan>
      <tspan x="116" y="98.5">spezifikation</tspan>
    </text>
  </g>


  <g class="incremental">
    <path class="connector" d="M 30 50 V 140" />
    <g class="connector" marker-end="url(#se-arrow)" fill="none">
      <path d="M 30 140 H 52" />
    </g>

    <rect class="artifact" x="52" y="118" width="128" height="44" />
    <text class="label" x="116" y="145">High-level Design</text>
  </g>

  <g class="incremental">
    <path class="connector" d="M 30 50 V 196" />
    <g class="connector" marker-end="url(#se-arrow)" fill="none">
      <path d="M 30 196 H 52" />
    </g>

    <rect class="artifact" x="52" y="174" width="128" height="44" />
    <text class="label" x="116">
      <tspan y="191.5">formale</tspan>
      <tspan x="116" y="210.5">Spezifikation</tspan>
    </text>
  </g>

  <g class="incremental">
    <path class="connector" d="M 30 50 V 252" />
    <g class="connector" marker-end="url(#se-arrow)" fill="none">
      <path d="M 30 252 H 52" />
    </g>

    <rect class="artifact" x="52" y="230" width="128" height="44" />
    <text class="label" x="116">
      <tspan y="247.5">detaillierter</tspan>
      <tspan x="116" y="266.5">Entwurf</tspan>
    </text>
  </g>

  <!-- Das Programm -->
  <g class="incremental">
    <path class="connector" d="M 30 50 V 308" />
    <g class="connector" marker-end="url(#se-arrow)" fill="none">
      <path d="M 30 308 H 52" />
    </g>

    <rect class="artifact" x="52" y="286" width="128" height="44" />
    <path class="artifact-mark" d="M 65 286 V 330 M 167 286 V 330" />
    <text class="label" x="116" y="313">Programm</text>
  </g>

  <!-- Prototyp: aus der Anforderungsspezifikation gebaut -->
  <g class="incremental">
    <rect class="artifact" x="218" y="62" width="128" height="44" />
    <path class="artifact-mark" d="M 231 62 V 106 M 333 62 V 106" />
    <text class="label" x="282" y="89">Prototyp</text>
    <path class="connector" d="M 180 84 H 218" marker-end="url(#se-arrow)" />
  </g>

  <!-- Programm-Testing: die dynamische Technik -->
  <g class="incremental">
    <rect class="artifact-accent" x="218" y="286" width="128" height="44" rx="22" ry="22" />
    <text class="label" x="282">
      <tspan y="303.5">Programm</tspan>
      <tspan x="282" y="322.5">Testing</tspan>
    </text>
    <path class="connector" d="M 218 308 H 180" marker-end="url(#se-arrow)" />
    <path class="connector" d="M 282 286 V 106" marker-end="url(#se-arrow)" />
  </g>

</svg>
