<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>
<style>/* ---------------------------------------------------------------------------
   Farbgebung der Diagramme dieses Foliensatzes (über ld.include-styles).

   Alle Flächen, Linien und Beschriftungen leiten sich von currentColor ab und
   folgen damit automatisch dem Light-/Dark-Theme und der umgebenden Admonition.
   `light-dark()` steht hier bewusst nicht: es hängt allein an
   prefers-color-scheme, während LectureDoc2 über [data-theme] schaltet.

   Voraussetzung: das SVG wird mit {include-svg} *inline* eingebunden. Bei
   {image} lädt der Browser es als eigenes Dokument; weder dieses Stylesheet
   noch currentColor erreichen es dann.

   Alle Regeln sind unter .se-diagram gescopt. Die Klassenselektoren
   unten gewinnen gegenüber Element-scoped Selektoren — deshalb trägt im Diagramm
   *jedes* sichtbare Element eine Klasse.
   --------------------------------------------------------------------------- */

.se-diagram {
    
    font-family: var(--default-font-family);

    /* Dokumente und Artefakte des Entwicklungsprozesses. */
    .artifact {
        fill: currentColor;
        fill-opacity: 0.08;
        stroke: currentColor;
        stroke-opacity: 0.8;
        stroke-width: 1;
    }

    /* Hervorgehobene Kästen: die Technik selbst („Software Inspektionen")
       und ihr dynamisches Gegenstück („Programm Testing"). */
    .artifact-accent {
        fill: currentColor;
        fill-opacity: 0.28;
        stroke: currentColor;
        stroke-opacity: 0.8;
        stroke-width: 1;
    }

    /* Die beiden senkrechten Striche der Komponenten-Kästen. */
    .artifact-mark {
        fill: none;
        stroke: currentColor;
        stroke-opacity: 0.8;
        stroke-width: 1;
    }

    /* Verbindungslinien; Pfeilspitze über marker-end="url(#se-arrow)". */
    .connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: butt;
        stroke-linejoin: miter;
    }

    .label {
        fill: currentColor;
        font-family: var(--default-font-family);
        text-anchor: middle;
    }
}

/* ---------------------------------------------------------------------------
   Pfeilspitze (definiert in se-defs.svg, eingehängt unter <ld-globals>).

   var(--color) und nicht currentColor: beides träfe hier dieselbe Farbe —
   <ld-globals> ist ein Kind von <body>, das [data-theme] und damit
   `color: var(--color)` trägt —, var(--color) benennt sie nur direkt.
   --------------------------------------------------------------------------- */

#se-arrow path {
    fill: var(--color);
    stroke: none;
}
</style>
<style>rect {
    fill: white;
    stroke: blue;
    stroke-width: 0.2;
}
text {
    fill: black;
    font-family: var(--code-font-family);
}
</style>
</head>
<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg">
<defs>

    <!-- Pfeilspitze für die Diagramme dieses Foliensatzes.

         Die Definition liegt hier und nicht im Diagramm selbst: {include-svg}
         kopiert jedes Diagramm in dasselbe Dokument, und gleichnamige
         <defs>-Ids würden sich gegenseitig verdrängen. Der Präfix "se-" hält
         sie von den Marker-Ids des LectureDoc2-Themes (FilledArrow_Marker …)
         und vom deckeigenen #arrow des Kontrollflussgraphen getrennt.

         refX="10" setzt den Bezugspunkt auf die Spitze — eine Linie endet
         damit genau dort, wo der Pfeil endet, ohne Korrekturrechnung.

         Die Farbe steht in se-diagrams.css als var(--color) und NICHT hier als
         Attribut: ein Marker wird im Kontext seiner *Definition* gemalt, und
         die liegt in <ld-globals> unterhalb von <body> mit [data-theme].
         `context-stroke` wäre semantisch richtig, fehlt in WebKit aber bis
         heute (Stand 2026); `light-dark()` hinge allein an prefers-color-scheme
         und ginge an der Theme-Wahl des Decks vorbei. Siehe LectureDoc2/SVGs.md. -->

    <marker id="se-arrow"
            viewBox="0 0 10 10"
            refX="10"
            refY="5"
            markerWidth="4"
            markerHeight="4"
            markerUnits="strokeWidth"
            orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 Z" />
    </marker>

</defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"><defs>
  <marker
  id="arrow"
  viewBox="0 0 10 10"
  refX="10"
  refY="5"
  markerWidth="4"
  markerHeight="4"
  orient="auto-start-reverse">
      <path class="arrow-head" d="M 0 0 L 10 5 L 0 10 z" />
  </marker>
</defs></svg>
</ld-globals>

<ld-topic class="new-section transition-scale" id="buildsysteme"><h2>Buildsysteme</h2></ld-topic>
<ld-topic id="buildsysteme"><h2>Buildsysteme</h2><ld-story><ul class="incremental-list list-with-explanations"><li><p>Buildsysteme automatisieren repetitive Aufgaben</p></li><li><p>Sie haben eingebaute Unterstützung oder Plugins für häufige Aufgaben:</p><table class="accentuated-header booktabs ultra-compact zebra sticky-header incremental-table-rows" style="width: 100%;"><thead><tr><th class="head"><p>Aufgabe</p></th><th class="head"><p>Befehl (am Beispiel von <code class="console">sbt</code>)</p></th></tr></thead><tbody><tr><td><p>Code zu einer ausführbaren Datei kompilieren</p></td><td><p><code class="console">sbt compile</code></p></td></tr><tr><td><p>Tests ausführen</p></td><td><p><code class="console">sbt <span class="name class">test</span></code></p></td></tr><tr><td><p>Start eines interaktiven Interpreters</p></td><td><p><code class="console">sbt console</code></p></td></tr><tr><td><p>Ausführen des Programms</p></td><td><p><code class="console">sbt run</code></p></td></tr><tr><td><p>Code formatieren, Code-Stil prüfen</p></td><td><p><code class="console">sbt scalafmt</code> und <code class="console">sbt scalastyle</code></p></td></tr><tr><td><p>Code-Dokumentation erzeugen (meist HTML)</p></td><td><p><code class="console">sbt doc</code></p></td></tr><tr><td><p>Kompilierte Dateien entfernen</p></td><td><p><code class="console">sbt clean</code></p></td></tr><tr><td><p>Ausführbare Datei (auf Server) publizieren</p></td><td><p><code class="console">sbt publish</code></p></td></tr><tr><td><p>...</p></td><td></td></tr></tbody></table></li><li><p>Buildsysteme werden mit Buildskripten konfiguriert</p></li><li><p>Buildsysteme verarbeiten meist nur geänderte und davon abhängige Dateien</p><p>(Inkrementalität)</p></li></ul></ld-story><ld-supplemental><p>Heutzutage bringen fast alle Programmiersprachen eigene Buildsysteme mit oder es gibt etablierte Buildsysteme.</p><dl class="field-list simple"><dt>C/C++<span class="colon">:</span></dt><dd><p><strong>Make</strong>, <strong>CMake</strong></p></dd><dt>Java<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://mill-build.org/mill/javalib/testing.html">mill</a>, <strong>Maven</strong>, Gradle, <s>Ant</s>, sbt</p></dd><dt>Scala<span class="colon">:</span></dt><dd><p><strong>sbt</strong></p></dd><dt>Rust<span class="colon">:</span></dt><dd><p><strong>Cargo</strong></p></dd><dt>JavaScript<span class="colon">:</span></dt><dd><p><strong>npm</strong>, <strong>pnpm</strong></p></dd><dt>...<span class="colon">:</span></dt><dd><p>...</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic id="minimale-anforderungen-an-ein-buildskript-fur-softwareprojekte"><h2>Minimale Anforderungen an ein Buildskript für Softwareprojekte</h2><ol class="arabic incremental-list simple"><li><p><strong>Kompilieren</strong> des Codes nach einem frischen Update (<span class="fail">bei Fehler Abbruch</span>)</p></li><li><p><strong>Testen</strong> des Codes:</p><ol class="arabic incremental-list simple"><li><p><strong>Unit-Tests</strong> (<span class="fail">bei Fehler Abbruch</span>)</p></li><li><p><strong>Integrationstests</strong> (<span class="fail">bei Fehler Abbruch</span>)</p></li><li><p>Systemtests/Abnahmetests (<span class="fail">bei Fehler Abbruch</span>)</p></li></ol></li><li><p><strong>Packaging</strong> des Projekts (<span class="fail">bei Fehler Abbruch</span>)</p></li><li><p><strong>Deployment</strong> (typischerweise in einer Testumgebung)</p></li></ol></ld-topic>
<ld-topic id="buildskripte-fur-gro-ere-softwareprojekte"><h2>Buildskripte für größere Softwareprojekte</h2><p>Insbesondere bei größeren Projekten kommen häufig noch viele weitere Schritte hinzu:</p><ul class="simple"><li><p>Code-Dokumentation erzeugen und veröffentlichen</p></li><li><p>verschiedene statische Analysen durchführen, um Fehler zu finden</p></li><li><p>zahlreiche Skripte, um zum Beispiel Datenbanken zu aktualisieren, Docker-Container zu bauen und zu starten...</p></li><li><p>...</p></li></ul></ld-topic>
<ld-topic class="new-section transition-fade" id="testen-von-software"><h2>Testen von Software</h2></ld-topic>
<ld-topic id="validierung-vs-verifikation-v-v"><h2>Validierung vs. Verifikation (V&#x26;V)</h2><ld-deck class="height-100"><ld-card><dl class="incremental-list field-list"><dt>Validierung<span class="colon">:</span></dt><dd><p>„Bauen wir das <em>richtige</em> Produkt?“</p><p><span class="peripheral">D. h. bauen wir das Produkt, das die Probleme löst?</span></p></dd><dt>Verifikation<span class="colon">:</span></dt><dd><p>„Bauen wir das Produkt <em>korrekt</em>?“</p><p><span class="peripheral">D. h. verhält sich das Produkt gem. der Spezifikation?</span></p></dd></dl></ld-card><ld-card class="incremental"><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><div style="width: 36ch; height: 37.7ch;"><!-- SVG meant to be directly embedded in a LectureDoc Document. -->

</div></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><strong>Man unterscheidet zwei komplementäre Ansätze für V&#x26;V:</strong></p><ol class="arabic list-with-explanations"><li><p>Software-Inspektionen oder Peer-Reviews (statische Technik)</p><p>Software-Inspektionen können in allen Phasen des Prozesses durchgeführt werden.</p></li></ol><div class="incremental-10"><ol class="arabic simple" start="2"><li><p>Software-Tests (dynamische Technik)</p></li></ol></div></ld-cell></ld-grid></ld-card></ld-deck></ld-topic>
<ld-topic id="software-inspektionen-uberprufen-die-ubereinstimmung-zwischen-einem-programm-und-seiner-spezifikation"><h2>Software-Inspektionen überprüfen die Übereinstimmung zwischen einem Programm und seiner Spezifikation.</h2><p>Ausgewählte Ansätze:</p><ld-story><div class="compound"><h3>Programminspektionen</h3><p>Ziel ist es, <em>Programmfehler, Verstöße gegen Standards und mangelhaften Code zu finden</em>, und nicht, allgemeinere Designfragen zu behandeln.</p><p>Programminspektionen werden in der Regel von einem Team durchgeführt, dessen Mitglieder den Code systematisch analysieren. Eine Inspektion wird in der Regel anhand von Checklisten durchgeführt.</p><ld-supplemental embed-in-document-flow=""><p>Studien aus dem Vor-KI-Zeitalter haben gezeigt, dass eine Inspektion von etwa 100 Lines of Code (LOC) einen Personentag an Aufwand erfordert.</p></ld-supplemental></div><div class="compound incremental"><h3>Automatisierte Quellcodeanalyse</h3><p>Diese umfasst u. a. Kontrollflussanalysen, Datenverwendungs-/flussanalyse, Informationsflussanalyse und Pfadanalyse.</p><p>Statische Analysen lenken die Aufmerksamkeit auf Anomalien.</p></div><div class="compound incremental"><h3>Formale Verifikation</h3><p>Die <strong>formale Verifikation kann das Nichtvorhandensein bestimmter Fehler garantieren</strong>. So kann z. B. garantiert werden, dass ein Programm keine Deadlocks, Race Conditions oder Pufferüberläufe enthält. Die Garantie gilt jedoch nur bezogen auf die Spezifikation und die getroffenen Annahmen.</p></div><aside class="admonition incremental" data-theme="summary"><p class="admonition-title" data-theme="summary-header"><span>Zusammenfassung</span></p><p>Software-Inspektionen zeigen nicht, dass die Software nützlich ist.</p></aside></ld-story></ld-topic>
<ld-topic id="ausgewahlte-testziele"><h2>Ausgewählte Testziele</h2><ul class="simple"><li><p>Test der Funktionalität</p></li><li><p>Test auf Robustheit</p></li><li><p>Test der Effizienz/Performance</p></li><li><p><span class="peripheral">Test auf Wartbarkeit</span></p></li><li><p>Test auf Nutzbarkeit</p></li></ul></ld-topic>
<ld-topic class="no-title center-content" id="testarten"><h2>Testarten</h2><ld-grid class="height-100 default-layout"><ld-cell class="width-50" style="align-self:auto;"><div class="compound padding-1em" data-theme="dark"><p><strong>Black-Box-Testen</strong></p><p>Wir wollen die Korrektheit zeigen.</p><p>Testdaten werden durch die Untersuchung der Domäne gewonnen. Was sind gültige bzw. ungültige Eingabewerte in der Domäne?</p><p>Der Test kann (und sollte!) ohne Betrachtung der konkreten Implementierung entwickelt werden.</p></div></ld-cell><ld-cell class="width-50" style="align-self:auto;"><div class="compound padding-1em" data-theme="light"><p><strong>White-Box-Testen</strong></p><p>Wie auch beim Black-Box-Test wollen wir die Korrektheit zeigen.</p><p>Testdaten werden durch die Inspektion des Programms gewonnen.</p><p>Das heißt im Umkehrschluss, dass wir den Quellcode des Programms benötigen.</p></div></ld-cell></ld-grid></ld-topic>
<ld-topic id="der-umfang-eines-tests-ist-die-sammlung-der-zu-prufenden-softwarekomponenten"><h2>Der Umfang eines Tests ist die Sammlung der zu prüfenden Softwarekomponenten.</h2><dl class="incremental-list field-list simple"><dt>Unit-Tests (Modultests)<span class="colon">:</span></dt><dd><p>Umfasst eine relativ kleine ausführbare Datei; z. B. ein einzelnes Objekt.</p></dd><dt>Integrationstest<span class="colon">:</span></dt><dd><p>Komplettes (Teil-)System. Schnittstellen zwischen den Einheiten werden getestet, um zu zeigen, dass die Einheiten gemeinsam funktionsfähig sind.</p></dd><dt>Systemtest<span class="colon">:</span></dt><dd><p>Eine vollständig integrierte Anwendung. Kategorisiert nach der Art der Konformität, die festgestellt werden soll: funktional, Leistung, Stress oder Belastung</p></dd><dt>Abnahmetests<span class="colon">:</span></dt><dd><p>Tests (durch den Kunden), um zu zeigen, dass das System die Anforderungen erfüllt.</p></dd></dl></ld-topic>
<ld-topic id="testplane"><h2>Testpläne</h2><p>Testpläne beschreiben, wie die Software getestet wird.</p><aside class="admonition incremental" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>Da die Anzahl der Tests praktisch unendlich ist, müssen wir (für praktische Zwecke) eine Annahme darüber treffen, wo Fehler wahrscheinlich zu finden sind; d. h. die Tests müssen auf einem Fehlermodell beruhen.</p></aside><div class="incremental"><p>Es gibt zwei allgemeine Fehlermodelle und entsprechende Prüfstrategien:</p><ol class="arabic simple"><li><p>konformitätsorientiertes Testen</p></li><li><p>fehlerorientiertes Testen</p></li></ol></div></ld-topic>
<ld-topic id="entwicklung-eines-testplans-beispiel"><h2>Entwicklung eines Testplans - Beispiel</h2><ld-deck><ld-card><p>Entwickeln Sie einen Testplan für ein Programm, das ...</p><ol class="arabic simple"><li><p>drei ganzzahlige Werte liest,</p></li><li><p>diese dann als die Längen der Seiten eines Dreiecks interpretiert</p></li><li><p>und danach ausgibt, ob das Dreieck...</p><ul class="simple"><li><p>gleichschenklig,</p></li><li><p>schief oder</p></li><li><p>gleichseitig ist.</p></li></ul></li></ol><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Ein gültiges Dreieck muss zwei Bedingungen erfüllen:</p><ul class="simple"><li><p>Keine Seite darf eine Länge von null haben.</p></li><li><p>Jede Seite muss kürzer sein als die Summe aller Seiten geteilt durch 2.</p></li></ul></aside></ld-card><ld-card class="incremental"><table class="accentuated-header booktabs incremental-table-rows table-header-align-left on-reveal-build-up-from-left"><colgroup><col style="width: 54.1%"><col style="width: 8.1%"><col style="width: 8.1%"><col style="width: 8.1%"><col style="width: 21.6%"></colgroup><thead><tr><th class="head"><p>Beschreibung</p></th><th class="head"><p>A</p></th><th class="head"><p>B</p></th><th class="head"><p>C</p></th><th class="head"><p>Erwartetes Ergebnis</p></th></tr></thead><tbody><tr><td><p>Gültiges schiefes Dreieck</p></td><td><p>5</p></td><td><p>3</p></td><td><p>4</p></td><td><p>Schief</p></td></tr><tr><td><p>Gültiges gleichschenkliges Dreieck</p></td><td><p>3</p></td><td><p>3</p></td><td><p>4</p></td><td><p>Gleichschenklig</p></td></tr><tr><td><p>Gültiges gleichseitiges Dreieck</p></td><td><p>3</p></td><td><p>3</p></td><td><p>3</p></td><td><p>Gleichseitig</p></td></tr><tr><td><p>Erste Permutation von zwei gleichen Seiten</p></td><td><p>50</p></td><td><p>50</p></td><td><p>25</p></td><td><p>Gleichschenklig</p></td></tr><tr><td><p>(Permutationen des vorherigen Testfalls)</p></td><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td><td><p>Gleichschenklig</p></td></tr><tr><td><p>Eine Seite ist null</p></td><td><p>1000</p></td><td><p>1000</p></td><td><p>0</p></td><td><p>Ungültig</p></td></tr><tr><td><p>Erste Permutation von zwei gleichen Seiten</p></td><td><p>10</p></td><td><p>5</p></td><td><p>5</p></td><td><p>Ungültig</p></td></tr><tr><td><p>Zweite Permutation von zwei gleichen Seiten</p></td><td><p>5</p></td><td><p>10</p></td><td><p>5</p></td><td><p>Ungültig</p></td></tr><tr><td><p>Dritte Permutation von zwei gleichen Seiten</p></td><td><p>5</p></td><td><p>5</p></td><td><p>10</p></td><td><p>Ungültig</p></td></tr><tr><td><p>Drei Seiten größer als null, Summe der zwei kleinsten ist kleiner als die größte</p></td><td><p>8</p></td><td><p>5</p></td><td><p>2</p></td><td><p>Ungültig</p></td></tr><tr><td><p>Drei Seiten mit maximaler Länge</p></td><td><p>MAX</p></td><td><p>MAX</p></td><td><p>MAX</p></td><td><p>Gleichseitig</p></td></tr><tr><td><p>Zwei Seiten mit maximaler Länge</p></td><td><p>MAX</p></td><td><p>MAX</p></td><td><p>1</p></td><td><p>Gleichschenklig</p></td></tr><tr><td><p>Eine Seite mit maximaler Länge</p></td><td><p>1</p></td><td><p>1</p></td><td><p>MAX</p></td><td><p>Ungültig</p></td></tr></tbody></table><ld-supplemental><p>Die Testfälle sind noch nicht vollständig (zum Beispiel wenn A, B und C alle 0 sind; oder wenn eine Seite gleich der Summe der Längen der anderen Seiten ist oder diese sogar überschreitet). Tests zum Beispiel in Hinblick auf objektorientierte Struktur, Fehlerbehandlung etc. fehlen.</p></ld-supplemental></ld-card></ld-deck></ld-topic>
<ld-topic id="test-uberdeckung-test-coverage"><h2>(Test-)Überdeckung (<span class="eng">(Test-)Coverage</span>)</h2><aside class="admonition" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Woher wissen wir aber, wie „gut“ unsere Tests sind?</p></aside><aside class="admonition incremental" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Testüberdeckung</span></p><p>Anteil des Programms, der durch die Tests geprüft wird.</p></aside><div class="incremental"><p>Hierbei gibt es verschiedene Überdeckungskriterien, die verschiedene Metriken für die Beschreibung der Testgüte nutzen.</p></div></ld-topic>
<ld-topic id="anweisungsuberdeckung-statement-coverage"><h2>Anweisungsüberdeckung (<span class="eng">Statement Coverage</span>)</h2><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><p>Zu testende Software:</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">public</span> <span class="keyword">double</span> <span class="name function">compute</span><span class="punctuation">(</span><span class="keyword">boolean</span> includeFactor<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">double</span> result <span class="operator">=</span> <span class="literal number integer">1.3</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="keyword">if</span> <span class="punctuation">(</span>includeFactor<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">4</small><code data-lineno="4">        result <span class="operator">*=</span> <span class="literal number integer">1.19</span><span class="punctuation">;</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="punctuation">}</span>
</code><small class="ln">6</small><code data-lineno="6">    <span class="keyword">return</span> result<span class="punctuation">;</span>
</code><small class="ln">7</small><code data-lineno="7"><span class="punctuation">}</span></code></pre><ld-supplemental embed-in-document-flow=""><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Oft wird auch von Zeilenüberdeckung oder <span class="eng">Line Coverage</span> gesprochen. Obwohl dies eigentlich zwei verschiedene Überdeckungsmaße beschreibt, ist die synonyme Verwendung – basierend auf der Beobachtung, dass häufig eine Zeile genau eine Anweisung hat – gängig. Eine Zeile wie:</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1">    <span class="keyword">if</span> <span class="punctuation">(</span>includeFactor<span class="punctuation">)</span> result <span class="operator">*=</span> <span class="literal number integer">1.19</span><span class="punctuation">;</span></code></pre><p>enthält jedoch bereits zwei Anweisungen!</p></aside></ld-supplemental></ld-cell><ld-cell class="incremental" style="align-self:auto;"><p>Testfälle:</p><pre class="code java literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name function">compute</span><span class="punctuation">(</span><span class="keyword constant">false</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name function">compute</span><span class="punctuation">(</span><span class="keyword constant">true</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre><aside class="admonition incremental" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Wie hoch ist die Anweisungsüberdeckung? Sind beide Testfälle notwendig?</p><ld-presenter-note encrypted="">MTAwMDAw:Bk6LFnV2HF1H2Inh0COuRouqwgqfpvz+CZ3m++LHxQY=:XNmEKaEP/7mg/TtS:oQw5ek3eLzaG4u5GPCpUFNkAN4+dr3MnzF68E+IhOWH2J6/OTU03S+PFrKQUujAE5zOp9qb3LeQxhwvP005/ot2qxLB98DdLC+zklX4zKXHsjpnkeMMQI4h7CpFikFNXk2wQpo4S9Hj5jA==</ld-presenter-note></aside></ld-cell></ld-grid><aside class="admonition margin-top-1em incremental" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mrow><mtext>Anweisungs</mtext><mover accent="true"><mtext>u</mtext><mo>¨</mo></mover><mtext>berdeckung</mtext></mrow><mo>=</mo><mfrac><mrow><mtext># ausgef</mtext><mover accent="true"><mtext>u</mtext><mo>¨</mo></mover><mtext>hrte Anweisungen</mtext></mrow><mtext># aller Anweisungen</mtext></mfrac><mo>⋅</mo><mn>100</mn><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">\text{Anweisungsüberdeckung} = \frac{\text{\# ausgeführte Anweisungen}}{\text{\# aller Anweisungen}} \cdot 100\%</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">Anweisungs</span><span class="mord katex-accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6679em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord">u</span></span><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.25em;"><span class="mord">¨</span></span></span></span></span></span></span><span class="mord">berdeckung</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:2.2519em;vertical-align:-0.8804em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3714em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord text"><span class="mord"># aller Anweisungen</span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord text"><span class="mord"># ausgef</span><span class="mord katex-accent"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6679em;"><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="mord">u</span></span><span style="top:-3em;"><span class="pstrut" style="height:3em;"></span><span class="accent-body" style="left:-0.25em;"><span class="mord">¨</span></span></span></span></span></span></span><span class="mord">hrte Anweisungen</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.8804em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8056em;vertical-align:-0.0556em;"></span><span class="mord">100%</span></span></span></span></span></div></aside></ld-topic>

<ld-topic id="weitere-uberdeckungskriterien"><h2>Weitere Überdeckungskriterien</h2><ul class="incremental-list list-with-explanations"><li><p>(einfache) Bedingungsüberdeckung (<span class="eng">(Simple) Condition Coverage</span>)</p></li><li><p>Eingangs-/Ausgangsüberdeckung (<span class="eng">Entry/Exit Coverage</span>)</p></li><li><p>Schleifenüberdeckung (<span class="eng">Loop Coverage</span>)</p></li><li><p>Zustandsüberdeckung (<span class="eng">State Coverage</span>)</p><p>(Erfordert ggf., dass ein endlicher Automat modelliert wird.)</p></li><li><p>Datenflussüberdeckung (<span class="eng">Data Flow Coverage</span>)</p></li></ul></ld-topic>
<ld-topic id="uberdeckungsziele"><h2>Überdeckungsziele</h2><ld-deck><ld-card><dl class="field-list"><dt>IEEE 29119 “Software Testing”<span class="colon">:</span></dt><dd><p>100 % Anweisungsüberdeckung</p><p>100 % Zweigüberdeckung für kritische Module</p></dd><dt>DO-178B “Software Considerations in Airborne Systems and Equipment Certification”<span class="colon">:</span></dt><dd><p>Abhängig von der Auswirkung von Systemfehlern.
Beispiel: 100 % Anweisungsüberdeckung bei Verletzungsgefahr von Passagieren.</p></dd><dt>IEC 61508 “Functional Safety of Electrical/Electronic/Programmable Electronic Safety-Related Systems”<span class="colon">:</span></dt><dd><p>100 % Anweisungs-/Zweig-/Bedingungsüberdeckung je nach Sicherheitsanforderung</p></dd><dt>ISO 26262 “Road vehicles - Functional safety”<span class="colon">:</span></dt><dd><p>Abhängig von der Kritikalität der Komponente</p></dd></dl></ld-card><ld-card class="s-overlay center-content height-100 incremental"><aside class="admonition backdrop-blur" data-theme="summary"><p class="admonition-title" data-theme="summary-header"><span>Zusammenfassung</span></p><p>Das Erreichen eines Überdeckungsziels erfordert Aufwand, der durch die Kritikalität möglicher Fehler motiviert sein muss.</p><p>In vielen Anwendersystemen ist eine hundertprozentige Testüberdeckung nicht notwendig. Testüberdeckung ist dennoch zu messen.</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic class="transition-flip no-title center-content" id="grenzen-des-testens"><h2>Grenzen des Testens</h2><blockquote class="epigraph"><p>Tests können nur das Vorhandensein von Fehlern zeigen, nicht deren Abwesenheit.</p><p class="attribution">—E. Dijkstra</p></blockquote></ld-topic>

<ld-topic id="behavior-driven-development"><h2>Behavior-Driven Development</h2><p>Das Ziel ist, dass die Entwickler die Verhaltensabsichten des Systems, das sie entwickeln, definieren.<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a> Hier mit Hilfe von <a class="reference external" href="https://www.scalatest.org/">ScalaTest</a>.</p><pre class="code scala literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">import</span> <span class="name namespace">org<span class="punctuation">.</span>scalatest<span class="punctuation">.</span></span>_

<ld-topic id="the-last-word"><h2>The Last Word</h2><blockquote class="epigraph"><p><strong>A Tester’s Courage</strong></p><p>The Director of a software company proudly announced that a flight software developed by the company was installed in an airplane and the airline was offering free first flights to the members of the company.</p><p><em>“Who are interested?”</em> the Director asked.</p><p>Nobody came forward. Finally, one person volunteered.</p><p>The brave Software Tester stated, <em>“I will do it. I know that the airplane will not be able to take off.”</em></p><p class="attribution">—Unknown Author @ <a class="reference external" href="http://www.softwaretestingfundamentals.com">http://www.softwaretestingfundamentals.com</a></p></blockquote></ld-topic>

<ld-topic class="transition-move-to-top new-section" id="metriken"><h2>Metriken</h2></ld-topic>
<ld-topic id="qualitatsmetriken"><h2>Qualitätsmetriken</h2><ld-deck><ld-card><h3>Warum?</h3><ul class="incremental-list simple"><li><p>Neue Features oder Code-Qualität erhöhen?</p></li><li><p>Kann ich Komponente C austauschen? Bzw. wie viel Aufwand ist das?</p></li><li><p>Haben die letzten Änderungen das System negativ beeinflusst?</p></li><li><p>Welche Systemteile sind besonders sicherheitskritisch?</p></li></ul></ld-card><ld-card class="incremental"><h3>Ziele</h3><ul class="incremental-list simple"><li><p>Mögliche Bugs frühzeitig erkennen</p></li><li><p>Systeme quantitativ miteinander vergleichen</p></li><li><p>Wartbarkeit einschätzen</p></li><li><p>Refactoring planen</p></li><li><p>Änderungen bewerten</p></li><li><p>Evolution des Systems überwachen bzw. verstehen</p></li></ul></ld-card><ld-card class="incremental"><h3>Verwendung</h3><ul class="incremental-list"><li><p>Als <em>Quality Gates</em> in Buildsystemen</p><p>z. B. Zeilen pro Methode &#x3C; 50</p></li><li><p>Zur Bewertung von Software</p></li></ul></ld-card><ld-card class="incremental"><h3>Einfache Metriken</h3><dl class="incremental-list field-list simple"><dt>Lines of Code (LOC)<span class="colon">:</span></dt><dd><p>Alle Zeilen zählen so, wie sie im Quellcode stehen</p></dd><dt>Source Lines of Code (SLOC)<span class="colon">:</span></dt><dd><p>Alle Zeilen ohne Leerzeilen oder Kommentare</p></dd><dt>Comment Lines of Code (CLOC)<span class="colon">:</span></dt><dd><p>Es zählen nur Zeilen mit Kommentaren; dies können ganze Zeilen sein oder einfach nur Inline-Kommentare; auskommentierter Code zählt ggf. auch</p></dd><dt>Non-Comment Lines of Code (NCLOC) / Effective Lines of Code (ELOC)<span class="colon">:</span></dt><dd><p>Codezeilen ohne Kommentarzeilen oder Zeilen, die nur Klammern enthalten, reine Import-Statements oder Methodendeklarationen</p></dd><dt>Logical Lines of Code (LLOC)<span class="colon">:</span></dt><dd><p>Zählt nur Anweisungen</p></dd></dl></ld-card><ld-card class="incremental"><h3>Fortgeschrittene Metriken</h3><dl class="incremental-list field-list"><dt>Zyklomatische Komplexität (McCabe)<span class="colon">:</span></dt><dd><p>Anzahl der linear unabhängigen Pfade durch den Code</p></dd><dt>Kopplung<span class="colon">:</span></dt><dd><p>Anzahl der Abhängigkeiten zwischen Komponenten</p></dd><dt><em>Cognitive Complexity</em><a class="citation-reference" href="#sonar23" id="citation-reference-1" role="doc-biblioref">[Sonar23]</a><span class="colon">:</span></dt><dd><p>Misst die relative Schwierigkeit Code zu verstehen und somit – zumindest indirekt – den Wartungs- und Weiterentwicklungsaufwand.</p><p><span class="peripheral">Entwickelt als Antwort auf die Schwächen von McCabe (definiert 1976) im Hinblick auf moderne Sprachkonstrukte, wie zum Beispiel <em>exception handling</em> mittels try-catch oder <em>lambdas</em>.</span></p></dd><dt>...<span class="colon">:</span></dt><dd><p>...</p></dd></dl></ld-card></ld-deck></ld-topic>
<ld-topic class="no-title center-content" id="es-gibt-keine-fixen-werte"><h2>Es gibt keine fixen Werte</h2><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Umfangreiche Forschung hat gezeigt, dass es keine fixen Werte gibt, die für alle Projekte gelten. Es hat sich weiterhin gezeigt, dass es keine einzige Metrik gibt, die alleine zur Bewertung der Qualität eines Systems ausreicht. Welche Metriken die Qualität des Systems am besten beschreiben, lässt sich immer nur ex post beantworten.</p><p>Metriken sind immer kontextabhängig zu bewerten.</p><p>Metriken eignen sich insbesondere, um Veränderungen zu bewerten und um die Entwicklung von Software zu überwachen.</p></aside></ld-topic>
<ld-topic class="transition-fade new-section" id="softwarequalitatssicherung"><h2>Softwarequalitätssicherung</h2><div class="section-subtitle"><p>Konstruktiv vs. Analytisch</p></div></ld-topic>
<ld-topic id="mechanismen-der-konstruktiven-softwarequalitatssicherung"><h2>Mechanismen der konstruktiven Softwarequalitätssicherung</h2><ul class="incremental-list simple"><li><p>Programmiersprachen (mit Typsystemen)</p></li><li><p>Softwareentwicklungsprozesse</p></li><li><p>Domain Specific Languages (DSLs)</p></li></ul></ld-topic>
<ld-topic id="ansatze-der-analytischen-softwarequalitatssicherung"><h2>Ansätze der analytischen Softwarequalitätssicherung</h2><table class="incremental-table-rows fade-in accentuated-header table-data-align-center"><thead><tr><th class="stub head"></th><th class="head"><p>Wiederverwend­barkeit</p></th><th class="head"><p>Wartbarkeit</p></th><th class="head"><p>Korrektheit</p></th><th class="head"><p>Aufwand</p></th></tr></thead><tbody><tr><th class="stub"><p>Leichtgewichtige statische Analysen</p></th><td></td><td><p>✓</p></td><td><p>✓</p></td><td><p>↓-○</p></td></tr><tr><th class="stub"><p>Semiformale Methoden</p></th><td></td><td></td><td><p>✓</p></td><td><p>↓</p></td></tr><tr><th class="stub"><p>Formale Methoden</p></th><td></td><td></td><td><p><span class="success">✓</span></p></td><td><p>↑</p></td></tr><tr><th class="stub"><p>Strukturanalysen</p></th><td><p>✓</p></td><td><p>✓</p></td><td></td><td><p>↓</p></td></tr><tr><th class="stub"><p>Stilüberprüfungen</p><p>(<span class="eng">Linting</span>)</p></th><td></td><td><p><span class="success">✓</span></p></td><td></td><td><p>↓</p></td></tr><tr><th class="stub"><p><span class="peripheral">KI-basierte Reviews</span></p></th><td><p><span class="peripheral">○</span></p></td><td><p><span class="peripheral">○</span></p></td><td><p><span class="peripheral">○</span></p></td><td><p><span class="peripheral">○</span></p></td></tr></tbody></table><ld-supplemental><p>Leichtgewichtige statische Analysen können zum Beispiel Code-Klone erkennen (Wartbarkeit) oder Verletzungen von empfohlenen Vorgehensweisen identifizieren und auf gängige Fehlermuster (<span class="eng">Bug Patterns</span>) hinweisen.</p><p>KI-basierte Reviews können helfen, Fehler und Probleme in allen Kategorien zu finden, es gibt jedoch <strong>keine</strong> Garantie, dass alle Probleme in einer bestimmten Kategorie gefunden werden. Weiterhin liegt die Bewertung von weichen Aspekten wie <em>Wiederverwendbarkeit</em> und <em>Wartbarkeit</em> häufig im Auge des Betrachters. Diesbezüglich kann es sehr schwierig sein, mittels Prompts das Ziel hinreichend präzise zu beschreiben.</p></ld-supplemental></ld-topic>
<ld-topic class="exercises" id="ubung"><h2>Übung</h2><ld-story><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Um einen Lernerfolg zu erhalten, sollten Sie die Schritte unten selber durchführen und nicht die ganze Aufgabenstellung als solche direkt an den KI-Assistenten Ihrer Wahl übergeben!</p></aside><aside class="admonition incremental" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Für die folgende Aufgabe sind Kenntnisse von HTML, JavaScript oder CSS hilfreich, aber nicht notwendig. Wenn es Probleme gibt, dann beschreiben Sie das Problem der KI und lassen Sie sich helfen!</p></aside><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Es kann sehr hilfreich sein, den Code häufig in ein Repository einzuchecken, da Sie bei Problemen somit immer auf einen vorherigen Stand zurückkehren können.</p></aside><div class="ld-exercise incremental" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Eine eigene Webanwendung bauen mittels Vibe-Coding"><p class="ld-exercise-title rubric"><span>Eine eigene Webanwendung bauen mittels Vibe-Coding</span></p><p class="incremental">Entwickeln Sie mittels Vibe-Coding eine einfache, aber vollständige Webanwendung (z. B. Tic-Tac-Toe oder 4-Gewinnt gegen den Computer), die nur Standard-JavaScript, CSS und HTML verwendet. Es sollen keine Frameworks oder externen Bibliotheken für die Ausführung der Anwendung notwendig sein.</p><ld-supplemental><p>Ein Beispiel für eine solche Anwendung wäre Tic-Tac-Toe oder Stein-Schere-Papier, welches Sie gegen den Computer spielen. Sie können selbstverständlich auch ein anderes kleines Spiel wählen, das keine komplexe Logik benötigt.</p></ld-supplemental><ol class="arabic incremental-list"><li><p>Erstellen Sie mit Hilfe eines <em>eigenen</em> Prompts die Anwendung. Dieser Prompt sollte die Anwendung und die zu verwendenden Technologien beschreiben. Fordern Sie ggf. explizit, dass Code und Styling in getrennten Dateien abgelegt werden sollen, falls nur eine Datei (<span class="docutils literal">index.html</span>?) zu finden ist.</p></li><li><p>Lassen Sie sich ein <strong>npm-Build-Skript</strong> generieren, das die nachfolgenden Schritte durchführt. D. h. es soll eine <span class="docutils literal">package.json</span>-Datei erzeugt werden, die <em>alle</em> notwendigen Abhängigkeiten und Skripte definiert. Es muss insbesondere möglich sein, <span class="docutils literal">npm run build</span> und <span class="docutils literal">npm run clean</span> auszuführen.</p><ol class="arabic simple"><li><p>Formatierung aller Dateien (.js, .html, .css)</p></li><li><p>Linting aller Dateien (.js, .html, .css)</p></li></ol><p>Validieren Sie, dass Ihr Build-Skript auch die neuesten Versionen der eingebundenen Tools verwendet. <em>Dies erfordert in der Regel eine Google-Suche nach den aktuellen Versionen.</em></p><ld-supplemental><p>Wenn Sie Node.js installieren, dann steht Ihnen auch npm zur Verfügung.</p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>KI-Codegeneratoren referenzieren häufig veraltete Tools und Bibliotheken. Ggf. müssen Sie danach auch die Konfigurationsskripte anpassen lassen.</p></aside></ld-supplemental></li><li><p>Führen Sie Ihr Build-Skript aus und beheben Sie alle gefundenen Probleme.</p></li><li><p>Finden Sie heraus, wie Sie Ihre Anwendung für den Einsatz optimieren könn(t)en, und erweitern Sie das Build-Skript entsprechend.</p><p>Ein Ziel könnte die Minimierung des Ressourcenverbrauchs sein.</p></li><li><p>Lassen Sie sich Testfälle generieren und führen Sie diese als Teil des Builds aus.</p><p>Beheben Sie ggf. gefundene Probleme.</p></li><li><p>Hinterfragen Sie den generierten, lauffähigen Code. Lassen Sie sich ggf. von der KI beim Verständnis helfen und stellen Sie kritische Fragen.</p></li><li><p>[Bonus] Lassen Sie sich die Testüberdeckung (Coverage) des JavaScript-Codes ermitteln und versuchen Sie eine möglichst hohe Überdeckung zu erreichen.</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:8KYNysm0qEg+pI9UV+Vr99GiIAk95ZCXgyUXINlX0Wk=:ZBSPx1+Yj4KhV5lu:pQ2/i+dOpkQGxRW64gyzqGon91bIG3OjmgPYp13HlMif1TCeBB6cdL42XbuilQ4/+HgD7ZECaR+PMbqdE9cax9mmL6bwarGLitajgt40ocvNYcTyVJc1trEh/Bckaec1d7Y69Asd3OkV2ztqZekb8i/7Mht0kA4uqGgoNo7qoU/l3k8KxY/xvdhkapSQ/ToVZAisPHLEkEJbD2YVskmuMjO3p1kIzSay8atCTiXL9ZHctiHHDly82nyqsq1oahi5Nsnk2nLIuISaOMUzmKkbXQBp/P1AesIG+kD9wmZxeJpKuKYOfBJrXruZxPFAWzUuOYuIo4lhXq4T313mhJ45qGcnpDx46DbA2engHpXxUMhjmDlCvsvuTBm60maKN2404TvTzEFd0nRv069+aHNNJYPl32EqLETg/c5GYuc0yMr8LKB//pGdAj0vgG1gJNyZUigP75XUh3aB1mtTxVShib9hcRV4vDpwbnzWO3ucjwDhnF7IktdIsRv552xR1fkl2kurHxI88cjY85YTNfa9WmmpDxFQ608FlB+iCnAprGhst0Gu0QoxHbOQ5lNCSiBOGsHqUbRnOTZTVOaJBz2c95ES7GQqjSV0sNQX6sJndcJP+XvPwJAVnEfIznwN07g8Td9b9s92NhNxVLKSrqkvTdUwpA4GyqloXYR6lS2Led4s9f9BG+Ut414yg8F95OLEgc9f4Nolo3nnhm0BWuPHHM2s+CqWnrDUDSLHncySk8DyDwS6QjORc5Ab56lXgNDeUkACGr1LylXlEkSSsH5jqHvUm7noNxHiG6D58a2W/VIUNmm+jLZ7lbxECqPPiRTvnQL3GGir0VZIvwweeXdZ9mdjEiS1rxZPyE+SDakjkLe5cRUWNsChWLXxbvT2+sUZirXtcuDeghu/0ALnJ8U/akpUF7rwSAPh138ifnelpe3KUE4AH/kmDSdZ/jSvT7Eo+bGUuE61muiVd54/mQQIjoF68ZWaUgjEqyuT/QHyftf9wRYhZdIqocWJdDWJOgGwndukCuF9NZHHgm0jQmaWVp/2DZZ7pVnY4Il0a58yW8mz+KfKJow/kdAIX1BgWUJ2kZW/oMgQ3HpeNDZkKS5cGIr3MChXiJAsUwJulHyX05op48ew1r7kO9L98xRNeYfbZkDpYeAymsw0iPg3n6COAVCqlx2fX9bm0NyDbpDr1hAHP6i8yfZCA+eXMVTSNHURnOhhNiX7gpOnLcpS3umZ9CGbSTEXqTCLjCfLUCsMaTXgwKtQHrUtUf7G+PeitFptk1C8qEfnyPoZteH/Kjxgq4Sy+eglAR7Fp4jiCEIoxEE7SFPPUXQICsBqFUwmmdVwwA34hUqxbokAGgWY8XzL1g8gLhdVdJUfOTdTp1pXmSAYT9zN+zQCwRYDiwAZzTocpOWhEap8KR2mKiecnakXOMqslZvY9ti9YoESU8fn6Zd/cfnv6tL1UCSHKxOWwMCDevj19lnIAThlKQ8D+joUrPTJ02AmbYvfqkJ1kJcW69k5eJLWt9PfDqvQPZFmoNIFec7nJdL+buDUPxgYBLNsPE5+GKU9HizvgLYJLrMUXQ2AHn8t7VxG2ay1fyYBojkq8X6GDgmZlIAja+MfFHxn3PRibDZvruCZavDp6BQf4PriUm8lpB4CMUrdzy+mR0UW28fp2ZP6iyxph1HVot0i5LRsC2DmCQ
