<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="backtracking"><h2>Backtracking</h2><ld-supplemental><p>Neben der dynamischen Programmierung ist das Backtrack-Prinzip ein weiteres grundlegendes Verfahren zur Lösung von Problemen.</p></ld-supplemental><ul class="simple"><li><p>Backtracking ist ein Verfahren, das in vielen Algorithmen zur Anwendung kommt. Insbesondere, wenn kein effizienterer Algorithmus bekannt ist, als <em>alle möglichen Lösungen auszuprobieren</em>.</p></li></ul><ul class="incremental-list list-with-explanations"><li><p>Backtracking ist eine systematische Methode, um alle möglichen Lösungen eines Problems zu finden. Es ist eine Art von rekursivem Durchsuchen, bei dem Teillösungen zu Gesamtlösungen erweitert werden.</p></li><li><p>Backtracking erlaubt ggf. Heuristiken, um die Suche zu beschleunigen.</p><p>Weder die Komplexitätsklasse noch die Korrektheit ändert sich dadurch.</p></li><li><p>Viele NP-harte Probleme werden mit Backtracking gelöst.<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></p></li></ul><ld-supplemental><p>Backtracking führt eine erschöpfende Suche durch, um eine Lösung zu finden. Kann aber auch direkt genutzt werden, um ggf. alle Lösungen zu finden.</p><p>Backtracking ist in Prolog inherent vorhanden, da Prolog auf dem Prinzip des Backtrackings basiert, weswegen Prolog für die Lösung solcher Probleme gut geeignet ist.</p></ld-supplemental><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>NP-harte und NP-vollständige Probleme sind solche Probleme, die schwierig sind zu lösen. Hier reicht es zu wissen, dass es Probleme gibt, die nicht in polynomieller („vernünftiger“) Zeit gelöst werden können.</p></aside></aside></ld-topic>
<ld-topic id="beispiel-das-4-damen-problem-konzeptuell"><h2>Beispiel: Das 4-Damen Problem (konzeptuell)</h2><ld-deck><ld-card><p>Ziel ist es vier Damen auf einem Schachbrett so zu platzieren, dass keine Dame eine andere Dame schlagen kann.</p><div class="compound incremental"><p class="rubric">Eine Lösung für ein 4x4 Schachbrett</p><table class="align-center"><thead><tr><th class="stub head"></th><th class="head"><p>1</p></th><th class="head"><p>2</p></th><th class="head"><p>3</p></th><th class="head"><p>4</p></th></tr></thead><tbody><tr><th class="stub"><p>1</p></th><td></td><td></td><td><p>D</p></td><td></td></tr><tr><th class="stub"><p>2</p></th><td><p>D</p></td><td></td><td></td><td></td></tr><tr><th class="stub"><p>3</p></th><td></td><td></td><td></td><td><p>D</p></td></tr><tr><th class="stub"><p>4</p></th><td></td><td><p>D</p></td><td></td><td></td></tr></tbody></table></div><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Es gibt eine geschlossene Lösung für das Problem. Backtracking wird hier nur als Beispiel für das Verfahren verwendet.</p></aside></ld-card><ld-card class="incremental"><pre class="code pascal copy-to-clipboard incremental-code literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">procedure</span> findeStellung<span class="punctuation">(</span>i <span class="punctuation">:</span> integer<span class="punctuation">)</span>  <span class="comment single">// i: Spalte</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    j <span class="operator">:=</span> <span class="literal number integer">0</span>                            <span class="comment single">// j: Zeile</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">repeat</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">        <span class="comment single">{ wähle nächste Zeile j }</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">        <span class="keyword">if</span>  Dame an Position i <span class="operator">/</span> j bedroht
</code><small class="ln"> 6</small><code data-lineno=" 6">            keine bisher platzierte Dame <span class="keyword">then</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">            <span class="comment single">{ platziere Dame in Feld i / j }</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">            <span class="keyword">if</span> i <span class="operator">=</span> <span class="literal number integer">4</span> <span class="keyword">then</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">                <span class="comment single">{ Lösung gefunden }</span>
</code><small class="ln">10</small><code data-lineno="10">                <span class="comment single">{ Ausgabe der Lösung }</span>
</code><small class="ln">11</small><code data-lineno="11">            <span class="keyword">else</span>
</code><small class="ln">12</small><code data-lineno="12">                findeStellung<span class="punctuation">(</span>i <span class="operator">+</span> <span class="literal number integer">1</span><span class="punctuation">)</span> <span class="comment single">// rek. Aufruf</span>
</code><small class="ln">13</small><code data-lineno="13">            <span class="comment single">{ entferne Dame aus Spalte i und Zeile j }</span> <span class="comment single">// zurücksetzen des Zustands</span>
</code><small class="ln">14</small><code data-lineno="14">    <span class="keyword">until</span> <span class="comment single">{ alle Zeilen j getestet }</span></code></pre></ld-card><ld-card class="s-overlay backdrop-blur center-content incremental"><p class="rubric">Wesentliche Elemente</p><ul class="incremental-list simple"><li><p>Die Lösung ist endlich.</p></li><li><p>Die Lösung wird iterativ aufgebaut. Es ist jederzeit möglich zu testen, ob die bisherige Lösung noch gültig ist (Zeile 5, 6).</p></li><li><p>Ist eine Lösung nicht mehr möglich, wird die Teillösung auch nicht weiter verfolgt.</p></li><li><p>Wurde eine Lösung gefunden, wird sie ausgegeben (Zeile 9, 10).</p></li><li><p>Die Methode wird rekursiv aufgerufen, um die Lösung zu vervollständigen (Zeile 12).</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="backtracking-allgemein"><h2>Backtracking - Allgemein</h2><ld-deck><ld-card><p class="rubric">Voraussetzungen für Backtracking</p><ol class="arabic incremental-list list-with-explanations"><li><p>Die Lösung ist als Vektor <code class="java">a<span class="punctuation">[</span><span class="literal number integer">1</span><span class="punctuation">]</span><span class="punctuation">,</span> a<span class="punctuation">[</span><span class="literal number integer">2</span><span class="punctuation">]</span><span class="punctuation">,</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span></code> endlicher Länge darstellbar.</p></li><li><p>Jedes Element <code class="java">a<span class="punctuation">[</span>i<span class="punctuation">]</span></code> hat eine endliche Anzahl von möglichen Werten <code class="java"><span class="name class">A</span><span class="punctuation">[</span>i<span class="punctuation">]</span></code>.</p><p>D. h. die Menge der möglichen Werte pro <code class="java">a<span class="punctuation">[</span>i<span class="punctuation">]</span></code> kann unterschiedlich sein.</p></li><li><p>Es gibt einen effizienten Test, ob eine Teillösung <code class="java">a<span class="punctuation">[</span><span class="literal number integer">1</span><span class="punctuation">]</span><span class="punctuation">,</span> a<span class="punctuation">[</span><span class="literal number integer">2</span><span class="punctuation">]</span><span class="punctuation">,</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">,</span> a<span class="punctuation">[</span>k<span class="punctuation">]</span></code> zu einer gültigen Lösung führen kann.</p></li></ol></ld-card><ld-card class="incremental"><p class="rubric">Verfahren</p><dl class="field-list"><dt>Start<span class="colon">:</span></dt><dd><p>Wähle eine Teillösung <code class="java">a<span class="punctuation">[</span><span class="literal number integer">1</span><span class="punctuation">]</span></code>.</p></dd><dt>Allgemein<span class="colon">:</span></dt><dd><p>Ist eine Teillösung basierend auf <code class="java">a<span class="punctuation">[</span><span class="literal number integer">1</span><span class="punctuation">]</span><span class="punctuation">,</span> a<span class="punctuation">[</span><span class="literal number integer">2</span><span class="punctuation">]</span><span class="punctuation">,</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">,</span> a<span class="punctuation">[</span>k<span class="operator">-</span><span class="literal number integer">1</span><span class="punctuation">]</span></code> noch keine Gesamtlösung, dann erweitere sie mit dem nächsten nicht ausgeschlossenen Wert <code class="java">a<span class="punctuation">[</span>k<span class="punctuation">]</span></code> aus <code class="java"><span class="name class">A</span><span class="punctuation">[</span>k<span class="punctuation">]</span></code> zur neuen Teillösung <code class="java">a<span class="punctuation">[</span><span class="literal number integer">1</span><span class="punctuation">]</span><span class="punctuation">,</span> a<span class="punctuation">[</span><span class="literal number integer">2</span><span class="punctuation">]</span><span class="punctuation">,</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">,</span> a<span class="punctuation">[</span>k<span class="punctuation">]</span></code>.</p><p>Falls noch nicht alle Elemente von <code class="java"><span class="name class">A</span><span class="punctuation">[</span><span class="name class">K</span><span class="punctuation">]</span></code>, die zu keiner inkonsistenten Lösungen führen, ausgeschöpft sind, dann gehe zurück (backtrack) und wähle <code class="java">a<span class="punctuation">[</span>k<span class="punctuation">]</span></code> neu. Ggf. gehe zu  <code class="java">a<span class="punctuation">[</span>k<span class="operator">-</span><span class="literal number integer">1</span><span class="punctuation">]</span></code> usw. zurück.</p></dd></dl></ld-card></ld-deck><ld-supplemental><p>Es wird hier nicht gefordert, dass alle Element den gleichen Wertebereich haben. Es ist auch möglich, dass die Werte unterschiedlich sind.</p></ld-supplemental></ld-topic>
<ld-topic class="exercises transition-scale" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Auswerten logischer Ausdrücke mittels Backtracking"><p class="ld-exercise-title rubric"><span>Auswerten logischer Ausdrücke mittels Backtracking</span></p><p>Bestimmen Sie für folgenden Ausdruck <span class="docutils literal">c</span> - mittels Backtracking - Wahrheitswerte für die Variablen, damit der Ausdruck als Ganzes wahr wird:</p><p><span class="docutils literal">c = (A ∨ ¬B) ∧ (¬A ∨ B) ∧ (¬A ∨ ¬C) ∧ (C ∨ D) ∧ (¬C ∨ ¬D)</span></p><p>Füllen Sie dazu die folgende Tabelle aus, um alle Lösungen zu finden. In der letzten Spalte geben Sie an, ob die Zeile eine Teillösung darstellt (nicht inkonsistent), keine Lösung ist bzw. sein kann, oder eine Gesamtlösung identifiziert wurde. Die Evaluation wie vieler vollständiger Belegungen wurde eingespart, wenn die Lösung gefunden wurde?</p><table class="align-center"><thead><tr><th class="head"></th><th class="head"><p>A</p></th><th class="head"><p>B</p></th><th class="head"><p>C</p></th><th class="head"><p>D</p></th><th class="head"><p>nicht inkonsistent (T), keine Lösung (K), vollständige Lösung (L)</p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p>w</p></td><td></td><td></td><td></td><td><p>T</p></td></tr><tr><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td></tr><tr><td><p>16</p></td><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td></tr></tbody></table><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:8cOTabOn9EVi+GylRSkFMDbNytwPzcJo1S5Diqcje3k=:KqaXZQt2DsPT28nV:L/kS5QAlvhCo9zLBPIr0/IExahkAqi/5qtNVUNwwF6ggRBoD1xGPmBOJFaECko22AnY9mm0Yt2ly/UO1BK60WvlG6idqL061Alfyd88RTWGekUVSpVUSnG0raFTHuQTmmvCyioOtT8qAHIg1pydFBlm+FXBMvrBSScBLwW0/5aQVwqYuJ/Kmyvcy94xITzKyGfuL7Gl3vrNsrjBQ3S32WW7RURzjU+2SO4FEEhgLUTzHDqXMR0lyWBeEn+zFtw/OqQvlVa/STP13wVvH0/ZFiN3 <ld-topic class="exercises" id="ubung-1"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Das Erfüllbarkeitsproblem"><p class="ld-exercise-title rubric"><span>Das Erfüllbarkeitsproblem</span></p><ld-supplemental><p class="rubric">Konjunktive Normalform (KNF)</p><p>Ein logischer Ausdruck ist in KNF, wenn der Ausdruck nur als Konjunktion (UND-Verknüpfung) von Disjunktionen (ODER-Verknüpfungen) dargestellt wird. Die Negation darf nur auf Variablen angewendet werden.</p><p>Beispiel: (A ∨ B ∨ C) ∧ (¬C ∨ D)</p></ld-supplemental><p>Entwickeln Sie ein Programm — in einer Programmiersprache Ihrer Wahl — das in der Lage ist eine Formel in konjunktiver Normalform (KNF) auf Erfüllbarkeit zu prüfen.</p><p>Prüfen Sie Ihr Programm anhand der vorhergehenden Aufgabe.</p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Sollten Sie das Programm in Python oder Java implementieren wollen, dann können sie den entsprechenden Code im Anhang als Grundlage verwenden. Sie müssen dann nur noch die Methode <span class="docutils literal">solve</span> implementieren. Der Code implementiert eine kleine Klassenhierarchie zur Repräsentation von logischen Ausdrücken und ermöglicht die Evaluation (<span class="docutils literal">is_solution</span> bzw. <span class="docutils literal">isSolution</span>) unter einer gegebenen Belegung.</p></aside><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:ldzCTnOsHclJ/wAWkab2eDfCAxX0qpvmKvhvFuHWJM4=:pyvPT+jzPEGX/v3u:7VW+y4NiJd3brC8pcf0d+OTrhyv2OtK3XNbgxPyk28GPKUyMIHNajEop/TLK7L1wBV7eCQXyEpz8NXrXdmfsT7YNKv+9z5kunmmCc+uja8BwIXePsFlzqDr7kxJOiPYRRzjb5Wj213MYP3mrVfF3A95E5GdpiM0kBqHivRKXxOO/T6OoQdmsaEJ5HJ84DiGRziQCXuHx1s9edjtMPHnC7QS43sHnRDYR2jWvQHcrxtKdPcUQuJPVmcRyeC/PYxU9ZMwhim2H8TNDzwGozQyQxmlUFYuaHjNbY7uZm+7L+TEknpb2j2hyy7/USRThj9HtUKxjYBxqYyXIBA8Li8sL1rVvIwwDKmY2x5r9AwwGlKJzpytvg8rtiTj3rXiG8vavL0b7mnYR73hpMpCPG6XmnLSxaFnjp8HQ9wk6hjied0E
