<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>
</head>
<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"><defs>
<marker
    id="phase-arrow"
    viewBox="0 0 2 2"
    refX="2"
    refY="1"
    markerUnits="strokeWidth"
    markerWidth="4"
    markerHeight="4"
    orient="auto">
    <path d="M 0 0 L 2 1 L 0 2 z" fill="context-stroke"/>
</marker>
</defs></svg>
</ld-globals>

<ld-topic class="new-section" id="java-projekte-bauen"><h2>Java Projekte bauen</h2></ld-topic>
<ld-topic id="ziele"><h2>Ziele</h2><ol class="arabic simple" start="0"><li><p><strong>Management der Projektabhängigkeiten</strong> (z. B. JUnit, Log4J, Hibernate, Spring, ....)</p></li></ol><ol class="arabic incremental-list simple"><li><p><strong>Kompilieren</strong> des Quellcodes</p></li><li><p><strong>Testen</strong> des Quellcodes</p></li><li><p><strong>Paketieren</strong> des Quellcodes (.jar oder .war Datei erzeugen inkl. <em>aller</em> Abhängigkeiten)</p></li><li><p><strong>Dokumentation</strong> erstellen</p></li><li><p><strong>Reports</strong> erstellen (z.B. Testabdeckung, Code-Qualität)</p></li><li><p>... und vieles mehr, dass dann aber häufig Projektabhängig ist.</p></li></ol><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Ein wichtiges Meta-Ziel ist es, das Bauen der Software zu automatisieren und zu vereinfachen und <em>stabile Builds zu gewährleisten</em>.</p><div class="peripheral"><p>D. h. zwei Entwickler, die das selbe Projekt auf unterschiedlichen Rechnern mit initial ggf. unterschiedlichen Versionen installierter Werkzeuge und Bibliotheken bauen, sollten dennoch das selbe Ergebnis erhalten.</p></div></aside></ld-topic>
<ld-topic id="etablierte-build-tools"><h2>Etablierte Build-Tools</h2><ul class="incremental-list simple"><li><p><span class="obsolete">Ant</span><a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></p></li><li><p><strong>Maven</strong></p></li><li><p>Gradle</p></li><li><p><span class="peripheral">sbt</span></p></li><li><p><span class="peripheral">make</span> (nicht spezifisch für Java)</p></li></ul><aside class="admonition incremental" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>IDEs wie IntelliJ IDEA, Eclipse, Visual Studio Code oder NetBeans bieten ebenfalls „Build-Unterstützung“. Diese ist aber bestenfalls für kleine Ein-Entwickler-Projekte geeignet.</p></aside><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Wurde in der Anfangsphase häufig verwendet. Heute nicht mehr.</p></aside></aside></ld-topic>
<ld-topic id="projektstruktur"><h2>Projektstruktur</h2><p>Konvention, die praktisch über alle Build-Tools und IDEs hinweg gilt<a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a>:</p><ul class="incremental-list simple"><li><p>Quellcode im Verzeichnis <span class="docutils literal">src/main/java</span></p></li><li><p>Testcode im Verzeichnis <span class="docutils literal">src/test/java</span></p></li><li><p>Ressourcen im Verzeichnis <span class="docutils literal">src/main/resources</span></p></li><li><p>Testressourcen im Verzeichnis <span class="docutils literal">src/test/resources</span></p></li><li><p>Konfigurationen und andere Ressourcen im Verzeichnis <span class="docutils literal">src/main/resources</span></p></li><li><p>gebaute Artefakte im Verzeichnis <span class="docutils literal">target</span></p></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-2" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-2">2</a><span class="fn-bracket">]</span></span><p>Andere Sprachen verwenden häufig ähnliche Strukturen. (Selbstverständlich, wird <span class="docutils literal">java</span>  dann durch den Namen der entsprechenden Sprache ersetzt.)</p></aside></aside></ld-topic>
<ld-topic class="new-section transition-move-to-top" id="grundlagen-des-testens-mit-junit-jupiter"><h2>Grundlagen des Testens mit JUnit (Jupiter)</h2></ld-topic>
<ld-topic id="junit-einfuhrung"><h2>JUnit - Einführung</h2><ul class="incremental-list simple"><li><p>JUnit ist das Standard-Test-Framework für Java.</p></li><li><p>Für das Schreiben von einfachen Tests ist das Modul <em>JUnit Jupiter</em> zu verwenden.</p></li><li><p>Tests liegen (per Konvention) in <span class="docutils literal">src/test/java</span> und werden <em>nicht</em> mit der Anwendung ausgeliefert.</p></li></ul></ld-topic>

</code><small class="ln">16</small><code data-lineno="16">        <span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">17</small><code data-lineno="17"><span class="punctuation">}</span>   <span class="punctuation">}</span></code></pre><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Testklassen, die mit dem Namen <span class="docutils literal">Test</span> enden, werden von Buildtools automatisch erkannt. Es handelt sich um eine fest etablierte und weit verbreitete Konvention.</p></aside></ld-story><ld-supplemental><ul class="simple"><li><p>Jede mit <code class="java"><span class="punctuation">@Test</span></code> annotierte Methode ist ein Testfall.</p></li><li><p>Testmethoden müssen <code class="java"><span class="keyword">void</span></code> zurückgeben und dürfen keine Parameter haben.</p></li><li><p>Es wird für <strong>jeden</strong> Testfall ein <strong>neues</strong> Objekt der Testklasse erzeugt; Tests sind daher voneinander isoliert.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="die-wichtigsten-assertions"><h2>Die wichtigsten Assertions</h2><p>Alle Methoden befinden sich in <code class="java"><span class="name class"><span class="name namespace">org<span class="punctuation">.</span>junit<span class="punctuation">.</span>jupiter<span class="punctuation">.</span>api<span class="punctuation">.</span></span>Assertions</span></code>:</p><table class="highlight-on-hover incremental-table-rows"><colgroup><col style="width: 45.0%"><col style="width: 55.0%"></colgroup><thead><tr><th class="head"><p>Methode</p></th><th class="head"><p>Prüft</p></th></tr></thead><tbody><tr><td><p><code class="java"><span class="name function">assertEquals</span><span class="punctuation">(</span>expected<span class="punctuation">,</span> actual<span class="punctuation">)</span></code></p></td><td><p><code class="java">expected<span class="punctuation">.</span><span class="name function">equals</span><span class="punctuation">(</span>actual<span class="punctuation">)</span></code></p></td></tr><tr><td><p><code class="java"><span class="name function">assertNotEquals</span><span class="punctuation">(</span>a<span class="punctuation">,</span> b<span class="punctuation">)</span></code></p></td><td><p><code class="java"><span class="operator">!</span>a<span class="punctuation">.</span><span class="name function">equals</span><span class="punctuation">(</span>b<span class="punctuation">)</span></code></p></td></tr><tr><td><p><code class="java"><span class="name function">assertTrue</span><span class="punctuation">(</span>condition<span class="punctuation">)</span></code></p></td><td><p><code class="java">condition <span class="operator">==</span> <span class="keyword constant">true</span></code></p></td></tr><tr><td><p><code class="java"><span class="name function">assertFalse</span><span class="punctuation">(</span>condition<span class="punctuation">)</span></code></p></td><td><p><code class="java">condition <span class="operator">==</span> <span class="keyword constant">false</span></code></p></td></tr><tr><td><p><code class="java"><span class="name function">assertNull</span><span class="punctuation">(</span>object<span class="punctuation">)</span></code></p></td><td><p><code class="java">object <span class="operator">==</span> <span class="keyword">null</span></code></p></td></tr><tr><td><p><code class="java"><span class="name function">assertNotNull</span><span class="punctuation">(</span>object<span class="punctuation">)</span></code></p></td><td><p><code class="java">object <span class="operator">!=</span> <span class="keyword">null</span></code></p></td></tr><tr><td><p><code class="java"><span class="name function">assertThrows</span><span class="punctuation">(</span><span class="name class">Exc</span><span class="punctuation">.</span><span class="keyword">class</span><span class="punctuation">,</span> <span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">-&gt;</span> …<span class="punctuation">)</span></code></p></td><td><p>Lambda wirft erwartete Exception</p></td></tr><tr><td><p><code class="java"><span class="name function">assertArrayEquals</span><span class="punctuation">(</span>exp<span class="punctuation">,</span> act<span class="punctuation">)</span></code></p></td><td><p>Arrays elementweise gleich</p></td></tr></tbody></table><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Jede Assertion akzeptiert als <em>letzten</em> Parameter eine optionale Fehlermeldung (<code class="java"><span class="name class">String</span></code>), die bei einem Fehlschlag ausgegeben wird:</p><pre class="code java copy-to-clipboard literal-block"><code><span class="name function">assertEquals</span><span class="punctuation">(</span><span class="literal number integer">5</span><span class="punctuation">,</span> r<span class="punctuation">.</span><span class="name function">addiere</span><span class="punctuation">(</span><span class="literal number integer">2</span><span class="punctuation">,</span> <span class="literal number integer">3</span><span class="punctuation">)</span><span class="punctuation">,</span> <span class="literal string">"2+3 sollte 5 sein"</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre></aside></ld-topic>
<ld-topic id="setup-und-teardown"><h2>Setup und Teardown</h2><pre class="code java literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">import</span> <span class="name namespace">org<span class="punctuation">.</span>junit<span class="punctuation">.</span>jupiter<span class="punctuation">.</span>api<span class="punctuation">.</span></span><span class="operator">*</span><span class="punctuation">;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">import</span> <span class="keyword">static</span> <span class="name namespace">org<span class="punctuation">.</span>junit<span class="punctuation">.</span>jupiter<span class="punctuation">.</span>api<span class="punctuation">.</span></span><span class="name class">Assertions</span><span class="punctuation">.</span><span class="operator">*</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">
</code><small class="ln"> 4</small><code data-lineno=" 4"><span class="keyword">class</span> <span class="name class">ListTest</span> <span class="punctuation">{</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">private</span> <span class="name class">List</span> list<span class="punctuation">;</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="punctuation">@BeforeEach</span>   <span class="comment single">// vor JEDEM einzelnen Test</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="keyword">void</span> <span class="name function">setUp</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>          list <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">List</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>                          <span class="punctuation">}</span>
</code><small class="ln">10</small><code data-lineno="10">
</code><small class="ln">11</small><code data-lineno="11">    <span class="punctuation">@AfterEach</span>    <span class="comment single">// nach JEDEM einzelnen Test</span>
</code><small class="ln">12</small><code data-lineno="12">    <span class="keyword">void</span> <span class="name function">tearDown</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>       <span class="comment single">/* z.B. Ressourcen freigeben */</span>             <span class="punctuation">}</span>
</code><small class="ln">13</small><code data-lineno="13">
</code><small class="ln">14</small><code data-lineno="14">    <span class="punctuation">@Test</span>
</code><small class="ln">15</small><code data-lineno="15">    <span class="keyword">void</span> <span class="name function">testIsEmpty</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>    <span class="name function">assertTrue</span><span class="punctuation">(</span>list<span class="punctuation">.</span><span class="name function">isEmpty</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span>                 <span class="punctuation">}</span>
</code><small class="ln">16</small><code data-lineno="16">
</code><small class="ln">17</small><code data-lineno="17">    <span class="punctuation">@Test</span>
</code><small class="ln">18</small><code data-lineno="18">    <span class="keyword">void</span> <span class="name function">testAddElement</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> list<span class="punctuation">.</span><span class="name function">add</span><span class="punctuation">(</span><span class="literal number integer">42</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="name function">assertEquals</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">,</span> list<span class="punctuation">.</span><span class="name function">size</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">19</small><code data-lineno="19"><span class="punctuation">}</span></code></pre><ld-supplemental><p><code class="java"><span class="punctuation">@BeforeEach</span></code> und <code class="java"><span class="punctuation">@AfterEach</span></code> werden vor bzw. nach <em>jedem</em> Testfall ausgeführt und eignen sich ideal, um einen definierten Ausgangszustand herzustellen.</p><p>Daneben gibt es <code class="java"><span class="punctuation">@BeforeAll</span></code> und <code class="java"><span class="punctuation">@AfterAll</span></code> (müssen <code class="java"><span class="keyword">static</span></code> sein), die nur <em>einmal</em> pro Testklasse aufgerufen werden.</p></ld-supplemental></ld-topic>
<ld-topic id="typische-vorgehensweise-beim-testen"><h2>Typische Vorgehensweise beim Testen</h2><div class="accentuate"><p class="rubric">Arrange – Act – Assert (AAA-Muster)</p><ol class="arabic incremental-list simple"><li><p><strong>Arrange</strong> – Testdaten und Objekte vorbereiten.</p></li><li><p><strong>Act</strong> – Die zu testende Methode aufrufen.</p></li><li><p><strong>Assert</strong> – Das Ergebnis mit dem erwarteten Wert vergleichen.</p></li></ol></div><pre class="code java incremental literal-block"><small class="ln">1</small><code data-lineno="1"><span class="punctuation">@Test</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">void</span> <span class="name function">testAbsoluterBetrag</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="comment single">/* Arrange:*/</span> <span class="keyword">int</span> eingabe <span class="operator">=</span> <span class="operator">-</span><span class="literal number integer">7</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="comment single">/* Act:    */</span> <span class="keyword">int</span> ergebnis <span class="operator">=</span> <span class="name class">Math</span><span class="punctuation">.</span><span class="name function">abs</span><span class="punctuation">(</span>eingabe<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="comment single">/* Assert: */</span> <span class="name function">assertEquals</span><span class="punctuation">(</span><span class="literal number integer">7</span><span class="punctuation">,</span> ergebnis<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="punctuation">}</span></code></pre><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p><strong>Ein</strong> Test sollte genau <strong>einen</strong> Aspekt prüfen. Besser mehrere kleine Tests als ein großer.</p></aside></ld-topic>
<ld-topic class="new-section transition-move-to-top" id="maven"><h2>Maven</h2><p class="section-subtitle"><a class="reference external" href="https://maven.apache.org">https://maven.apache.org</a></p></ld-topic>
<ld-topic id="aufsetzen-eines-projekts-mittels-scaffolding"><h2>Aufsetzen eines Projekts mittels <em>Scaffolding</em></h2><p>Maven ermöglicht es, den Rumpf für ein Java-Projekt mit einer einfachen Befehlszeile zu erstellen:</p><pre class="code console copy-to-clipboard literal-block"><code>mvn archetype:generate <span class="punctuation">\</span>
    <span class="name variable">-DgroupId</span><span class="operator">=</span>com.mycompany.app <span class="punctuation">\</span>
    <span class="name variable">-DartifactId</span><span class="operator">=</span>my-app <span class="punctuation">\</span>
    <span class="name variable">-DarchetypeArtifactId</span><span class="operator">=</span>maven-archetype-quickstart <span class="punctuation">\</span>
    <span class="name variable">-DarchetypeVersion</span><span class="operator">=</span><span class="literal number integer">1.5</span> <span class="punctuation">\</span>
    <span class="name variable">-DinteractiveMode</span><span class="operator">=</span>false</code></pre><p>Dies erzeugt eine initiale Build-Konfiguration für ein einfaches Java-Projekt und erzeugt die Projektstruktur.<a class="brackets" href="#footnote-3" id="footnote-reference-3" role="doc-noteref"><span class="fn-bracket">[</span>3<span class="fn-bracket">]</span></a></p><ld-supplemental><p>Die <span class="docutils literal">GroupId</span> folgt dabei den selben Konventionen wie Java-Packages. Die <span class="docutils literal">ArtifactId</span> ist der Name des Projekts.</p></ld-supplemental><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-3" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-3">3</a><span class="fn-bracket">]</span></span><p>Es gibt eine Vielzahl von Archetypen, die unterschiedliche Projektstrukturen erzeugen und für unterschiedliche Anwendungsfälle optimiert sind.</p></aside></aside></ld-topic>
<ld-topic id="maven-build-phasen"><h2>Maven - Build Phasen</h2><ld-deck><ld-card><ul class="incremental-list list-with-sublists simple"><li><p>Eine Phase ist ein Schritt im Build-Lebenszyklus. Die <em>ersten</em> Phasen des Standardlebenszyklus sind:</p><ol class="arabic incremental-list simple"><li><p><span class="docutils literal">validate</span></p></li><li><p><span class="docutils literal">generate-sources</span></p></li><li><p><span class="docutils literal">process-sources</span></p></li><li><p><span class="docutils literal">generate-resources</span></p></li><li><p><span class="docutils literal">process-resources</span></p></li><li><p><span class="docutils literal">compile</span></p></li></ol></li><li><p>Wenn eine Phase angegeben wird, dann werden alle vorherigen Phasen ausgeführt. Zum Beispiel führt <span class="docutils literal">mvn compile</span> alle genannten Phasen in obiger Reihenfolge aus.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">die wichtigsten Phasen des Standardlebenszyklus</p><dl class="field-list simple"><dt><span class="docutils literal">validate</span><span class="colon">:</span></dt><dd><p>überprüfen, ob das Projekt korrekt konfiguriert ist</p></dd><dt><span class="docutils literal">compile</span><span class="colon">:</span></dt><dd><p>kompilieren des Quellcodes des Projekts</p></dd><dt><span class="docutils literal">test</span><span class="colon">:</span></dt><dd><p>testet den kompilierten Quellcode mit einem geeigneten Unit-Testing-Framework.</p></dd><dt><span class="docutils literal">package</span><span class="colon">:</span></dt><dd><p>den kompilierten Code in ein verteilbares Format, z. B. ein JAR, verpacken.</p></dd><dt><span class="docutils literal">integration-test</span><span class="colon">:</span></dt><dd><p>Verarbeitet  das Paket und stellt es, wenn nötig, in einer Umgebung bereit, in der Integrationstests ausgeführt werden können.</p></dd><dt><span class="docutils literal">deploy</span><span class="colon">:</span></dt><dd><p>bereitstellen in einer Integrations- oder Release-Umgebung</p></dd></dl></ld-card><ld-card class="incremental"><p class="rubric">Spezialisierte Lebenszyklen (mit eigenen Phasen)</p><dl class="field-list"><dt><span class="docutils literal">clean</span><span class="colon">:</span></dt><dd><p>bereinigt Artefakte, die von früheren Builds erzeugt wurden.</p><p>Phasen: <span class="docutils literal">pre-clean</span>, <span class="docutils literal">clean</span>, <span class="docutils literal">post-clean</span></p></dd><dt><span class="docutils literal">site</span><span class="colon">:</span></dt><dd><p>generiert eine Site-Dokumentation für dieses Projekt</p><p>Phasen: <span class="docutils literal">pre-site</span>, <span class="docutils literal">site</span>, <span class="docutils literal">post-site</span>, <span class="docutils literal">site-deploy</span></p></dd></dl></ld-card></ld-deck></ld-topic>

<ld-topic id="projekt-bauen-und-ausfuhren"><h2>Projekt bauen und ausführen</h2><p class="rubric">Projekt bauen (inkl. <span class="docutils literal">compile</span> und <span class="docutils literal">test</span>)</p><pre class="code console copy-to-clipboard literal-block"><code>mvn package</code></pre><p class="rubric">Projekt ausführen</p><p><span class="peripheral">Die gebauten Artefakte befinden sich im Verzeichnis target.</span></p><pre class="code console copy-to-clipboard literal-block"><code><span class="name function">java</span> <span class="name variable">-jar</span> target/hello-1.0.jar <span class="operator">&lt;</span>Name<span class="operator">&gt;</span></code></pre></ld-topic>
<ld-topic class="exercises" id="ubung"><h2>Übung</h2><ld-scrollable><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Build-Konfiguration eines Java Projekts"><p class="ld-exercise-title rubric"><span>Build-Konfiguration eines Java Projekts</span></p><p class="rubric">Basisaufgaben</p><p>(Falls Maven (<span class="docutils literal">mvn</span>) noch nicht installiert ist, installieren Sie es.)</p><ul><li><p>entpacken Sie das Projekt <a class="reference external" href="code/newton/newton-1.0-sources.zip">newton-code.zip</a>.</p></li><li><p>legen Sie eine <span class="docutils literal">pom.xml</span> Datei an, um das Projekt zu bauen.</p></li><li><p>Konfigurieren Sie eine Abhängigkeit zu JUnit 5.14.3 und konfigurieren Sie das <span class="docutils literal">surefire</span> Plugin, um die Tests auszuführen.</p></li><li><p>Nutzen Sie <code class="console">mvn <span class="name class">test</span></code>, um die Tests auszuführen.</p></li><li><p>Konfigurieren Sie das <span class="docutils literal">maven-jar-plugin</span>, um ein ausführbares JAR zu erzeugen. Vergessen sie nicht die <span class="docutils literal">mainClass</span> zu konfigurieren.</p></li><li><p>Nutzen Sie <code class="console">mvn package</code>, um das Projekt zu bauen.</p></li><li><p>Nutzen Sie <code class="console">mvn site</code>, um eine Dokumentation des Projekts zu erstellen.</p></li><li><p>Schauen Sie sich die erzeugten Artefakte an.</p></li><li><p>Testen Sie ob Sie die Anwendung mit:</p><p><span class="docutils literal">java -jar target/newton-1.0-SNAPSHOT.jar</span></p><p>starten können.</p></li></ul><p class="rubric">Weiterführende Aufgaben</p><p>(In diesem Fall ist es Ihrer Aufgabe zu recherchieren wie die Einbindung/Konfiguration zu erfolgen hat. Stellen Sie sicher, dass Sie JUnit 5.14.3 nutzen; die Verwendung von KI Tools ist - außer für die Tests - gestattet.)</p><ul><li><p>Binden Sie Checkstyle in Ihre Projekt ein. D. h. wenn Sie die <code class="console">mvn site</code> ausführen, dann soll automatisch ein Report in Hinblick auf die Einhaltung der Checkstyle-Regeln erstellt werden.</p><p>Schauen Sie sich den Report an und versuchen Sie für die Klasse Liste eine besser Einhaltung der Checkstyle Regeln zu erreichen.</p></li><li><p>Binden Sie das Maven-Plugin JaCoCo ein, dass automatisch die Testabdeckung berechnet und in einem Report darstellt. Führen Sie danach <code class="console">mvn <span class="name class">test</span></code> aus (und ggf. mvn site) und schauen Sie sich den Report an.</p><p>Wie hoch ist bereits die Testabdeckung für die Klasse <code class="java"><span class="name class">List</span></code> obwohl diese gar nicht explizit getestet wurde?</p></li><li><p>Schreiben Sie sinnvolle Tests für die Klasse <code class="java"><span class="name class">List</span></code> und erhöhen Sie die Anweisungsüberdeckung auf 100% - abgesehen von den Zeilen, die nur Exceptions werfen. D. h. Sie brauchen sich in den Tests nicht um den Code kümmern, der Exceptions wirft; ignorieren Sie diesen Aspekt für den Moment.</p></li><li><p>Binden Sie ein Maven-Plugin ein, dass automatisch die JavaDoc erstellt und in einem Report darstellt.</p></li></ul><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:42rQGISlS09PDBOdRXagT99u8u1bRCwv2Jxwi2CBAbY=:dpTh4fgIuniUMwxS:3A1dw192gxxt1X9Wlb29qexFViG8vqejWoaEAs//Qj4DdpLJJw4v63NjL3joTtbAghr+r+hCzzG2iUk/H3/s5uQ2XFF2qrvJurkfG8HpXDBI9QzBzPbtluHC/F+l/G54N1a2DDbsLwWa70VsBuWn2sdldYWzyiup058cr7lBr/Ic7nPJDhxVzJzJK8YU4XCzww3pMybTDjj1LxLYPHK6LYnygt8lNnCYwxOcC31uWDmFYXK6xzsfcWnuaeJwT1zUD+5ZiQlzIsa43RpLuMmPA5GaMXomwCPrlpIukcdi6R5K0CG3lPrqCgtbgxza9sQ6GORMPKILVSlOlTaoAxYZExg+zcftZF73Esbtze9SExPG4hwMg4bwKhHJdQ72XtXt9YCrJYHwOhv0Rz2sDpSaknHgCyqwNRhAKqzJ7MjP37dUGAOy5XS2LieGvfmi/qCCaK8lKGMw+eadp0ZZ/Wg+zg3BKD7dOgUPYYcssC2TYNYT3gep51nzORS9hPi+ynu/oAaHHqVAEwF2+MA8WnQvMNmYBRjA9QD5wMNQMGDamEam548APCh4OXEHMeu1ofOoKc3Fv/l2FQzO1x4xRNONjmWZ5srjqut9BYHAfxDPAb+vcrTCZjP0shkf0Et255X9K+eOMcR7F94F7+tX1jL8yXB/
