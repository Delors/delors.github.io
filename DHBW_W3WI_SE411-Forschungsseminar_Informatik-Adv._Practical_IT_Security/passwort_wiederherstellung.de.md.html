<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="aufgabe-passwort_wiederherstellung"><h1 class="title">Übungsaufgaben - Passwortwiederherstellung</h1><div class="section-subtitle"><p><em>W3WI_SE411</em> - Forschungsseminar Informatik / Advanced Practical IT Security</p></div><dl class="field-list simple"><dt>Dozent<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></p></dd><dt>Kontakt<span class="colon">:</span></dt><dd><p><a class="reference external" href="mailto:michael.eichberg@dhbw-mannheim.de">michael.eichberg@dhbw-mannheim.de</a>, Raum 149B</p></dd><dt>Version<span class="colon">:</span></dt><dd><p>24SEA</p></dd></dl></ld-topic>
<ld-topic id="einfuhrung"><h2>Einführung</h2><ld-deck><ld-card><p>Diese Aufgaben sollen Sie auf das bewertet Lab vorbereiten. Diese Aufgaben sind dazu da, dass Sie die Wiederherstellung von Passwörtern üben können.</p><p>Die im Rahmen des Labs bewerteten Aufgaben werden strukturell sehr vergleichbar sein.</p></ld-card><ld-card class="incremental"><p>Der Einsatz von Kali Linux ist empfehlenswert, da dort sehr viele Tools (insbesondere Hashcat und John) schon installiert sind oder vgl. trivial nachinstalliert werden können. Unter Kali finden Sie interessante (Basis-)Wörterbücher an folgenden Stellen:</p><blockquote><pre class="literal-block"><code>/usr/share/dict/wordlist-probable.txt
/usr/share/dict/cracklib-small
/usr/share/wordlist/rockyou.txt
/usr/share/wordlists/metasploit/*.txt</code></pre></blockquote><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Auch in Kali Rolling sind nicht immer alle Tools auf dem allerneuesten Stand bzw. direkt verfügbar.</p><p>Es ist weiterhin möglich, dass die Verwendung von Hashcat und/oder John nicht (direkt) möglich ist und erst Vorverarbeitungsschritte durchgeführt werden müssen!</p></aside></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="danger"><p class="admonition-title" data-theme="danger-header">!GEFAHR!</p><p>Vor der Installation von <em>Hashcat</em> und <em>John the Ripper</em> auf dienstlichen Notebooks sollten/müssen Sie unter allen Umständen klären ob Ihre Unternehmensrichtlinien dies erlauben!</p><p>Es kam in der Vergangenheit praktisch jedes Semester dazu, dass Studierenden die dienstlichen Notebooks unmittelbar nach der Installation von Cybersicherheitstools direkt gesperrt und teilweise sogar unmittelbar vollständig gelöscht wurden!</p><p><strong>Dies gilt ganz insbesondere für Studierende der SAP.</strong></p></aside></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Im Rahmen der Passwortwiederherstellung kann es immer mal wieder vorkommen, dass Ihnen eine Aufgabe mehr oder weniger liegt. Sie sollten sich deswegen alle Aufgaben anschauen!</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="zu-entwickelnde-fahigkeiten"><h2>Zu entwickelnde Fähigkeiten</h2><ld-deck><ld-card><p class="rubric">Lösungswegbeschreibungen</p><ld-deck><ld-card><p>Für jede Aufgabe müssen Sie in der Lage sein Ihren Weg genau zu beschreiben, da dies essentieller Bestandteil der Prüfung ist.</p></ld-card><ld-card class="incremental"><p><strong>Vorbereitungsschritte</strong></p><ol class="arabic incremental-list list-with-explanations dhbw simple"><li><p>[ggf.] Schritte zur Extraktion des Hashes</p></li><li><p>[ggf.] Schritte, die zur Aufbereitung des Hashes unternommen wurden</p></li><li><p>[ggf.] verwendete Quellen für (externe) Wörterbürcher</p></li><li><p>[ggf.] Schritte, die zur Erstellung des zum Angriff benutzten Wörterbuchs unternommen wurden</p></li><li><p>[ggf.] Schritte, die notwendig waren, um das notwendige Tooling bereitzustellen</p></li></ol></ld-card><ld-card class="incremental"><p><strong>Eigentlicher Angriff</strong></p><ol class="arabic incremental-list list-with-explanations dhbw" start="6"><li><p>den oder die Schritte, die zum Angriff auf den oder die „Hashes“ durchgeführt wurden</p></li><li><p>das oder die wiederhergestellten Passworte</p></li><li><p>Dauer der Suche nach dem Passwort</p><p>(Dies ist die Zeit, die gebraucht wurde, um ihre Passwortkandidaten zu testen; d.h. die Zeit, die zum Beispiel Hashcat benötigt hat. Eine grobe Angabe in Minuten ist ausreichend.)</p></li></ol></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>Sie müssen in der Lage sein nachvollziehbar zu beschreiben wie Sie das Passwort ermittelt haben.</p></aside></ld-card></ld-deck></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Auch, wenn bei den folgenden Aufgaben immer das Endziel ist die Passwörter wieder herzustellen, so ist für die Bewertung der Weg der ausschlaggebende Aspekt. Sollten Sie einen sinnvollen und gut begründbaren Weg eingeschlagen haben, waren jedoch nicht erfolgreich, dann kann das Ziel im Hinblick auf das Lab erreicht sein.</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic class="exercises" id="numbers-x-datei"><h2>Numbers&#x3C;X> Datei</h2><p>Bzgl. des Passwortes und des Hintergrundes sind keine Informationen vorhanden. Es bleibt Ihnen nichts anderes übrig als allg. <em>Best Practices</em> anzuwenden. Sollten Sie das Passwort der <span class="docutils literal">Number&#x3C;X></span> nicht wieder herstellen können, dann können Sie sich auch an der Datei <span class="docutils literal">Poem.pages</span> versuchen.</p><aside class="admonition" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>Bearbeiten Sie „nur“ irgendeine <span class="docutils literal">Number&#x3C;X></span> Datei; die Komplexität ist bei allen gleich.</p></aside></ld-topic>
<ld-topic class="exercises" id="hurdle-jpg-7z"><h2>Hurdle.jpg.7z</h2><p>Ihnen liegt eine verschlüsselte, komprimierte Datei zur Entschlüsselung vor.
Glücklicherweise(?) konnten sie auf einem Datenträger eine gelöschte Datei wieder herstellen, die <span class="docutils literal">Passworte.txt</span> hieß und die folgenden Daten beinhaltet.</p><pre class="literal-block"><code>Der Lauf
Der Flug
Der Gesang
Der Fund
Der Stand</code></pre></ld-topic>
<ld-topic class="exercises" id="star-pdf"><h2>Star.pdf</h2><ld-scrollable><p>Ihnen liegt ein verschlüsseltes PDF vor. Aus anderen Fällen in dem Umkreis der Beschuldigten wissen Sie, dass diese eine starke Tendenz haben Passworte zu bauen, die aus großen deutschen Städten zusammengesetzt sind und ergänzt werden um Zeichen, die notwendig sind, um ggf. die Passwortpolicies Ihrer Standardapps zu erfüllen. In diesem Fall ist die Passwortpolicy der verwendeten App bekannt:</p><ul class="simple"><li><p>mind. 2 Großbuchstaben</p></li><li><p>mind. 2 Kleinbuchstaben</p></li><li><p>mind. 4 Ziffern</p></li><li><p>mind. 4 Sonderzeichen</p></li><li><p>mindestlänge: 16 Zeichen</p></li></ul><p>Sie wissen auch, dass die verwendeten Sonderzeichen praktisch immer: $, € oder ! sind und in den Passworten häufig einfach wiederholt werden. Weiterhin werden fast immer aktuelle Jahreszahlen verwendet (z. B. 2023 etc.) und der allgemeine Aufbau scheint:</p><pre class="literal-block"><code>&lt;Jahreszahl&gt;&lt;Stadt1&gt;&lt;Stadt2&gt;&lt;Sonderzeichen&gt;</code></pre><p>zu sein.</p></ld-scrollable></ld-topic>
<ld-topic class="exercises" id="mysheet"><h2>MySheet</h2><p>Basierend auf anderen Passworten, die sie in einem Notizbuch gefunden haben, gehen Sie davon aus, dass für das Passwort nur reguläre Buchstaben verwendet wurden und Worte mit der korrekten Groß-Kleinschreibung geschrieben werden (z. B. Frankfurt). Wörter scheint er ggf. zusammenzuziehen (z. B. HausMaus, AffeAffe, alleLieben). Darüber hinaus konnten Sie nur noch die Erkenntnisse gewinnen, dass alle Passworte mindestens 8 Buchstaben haben.</p></ld-topic>
<ld-topic class="exercises" id="java-hashcodes"><h2>Java Hashcodes</h2><p>In einer Software wurde fälschlicherweise Javas <code class="java"><span class="name function">hashcode</span><span class="punctuation">(</span><span class="punctuation">)</span></code> Funktion für das Hashen der Passworte verwendet. Aus der Datenbank konnte eine Liste von Hashes extrahiert werden. Diese Werte sind in der Datei <span class="docutils literal">JavaHashcodes</span> gespeichert.</p><p>Ihre Aufgabe ist die Wiederherstellung <em>aller</em> Passworte.</p></ld-topic>
<ld-topic class="exercises" id="max-mueller"><h2>Max Mueller</h2><p>Ihre Aufgabe ist das Passwort für die Datei <span class="docutils literal">Max Mueller.kdbx</span> wiederherzustellen.</p><p>Sie haben zur Unterstützung Ihrer Tätigkeit eine Profilbeschreibung erhalten: <span class="docutils literal">Max Mueller.md</span>.</p></ld-topic>
<ld-topic class="exercises" id="passwords-pages"><h2>Passwords.pages</h2><p>Ihnen liegt die vielversprechend klingende Datei <span class="docutils literal">Password.pages</span> vor.</p><p>Ihre Aufgabe ist die Wiederherstellung des Passwortes.</p></ld-topic>
<ld-topic class="exercises" id="personal-information"><h2>Personal Information</h2><p>Sie erhalten eine Datei (<span class="docutils literal">personal_information.aes256cbc_sha1.encrypted</span>), die verschlüsselt erscheint und auch eine Liste mit möglichen Passwortkandidaten:</p><p><span class="docutils literal">personal_information.aes256cbc_sha1.password_candidates.txt</span></p><p>Finden Sie heraus ob das Passwort dabei ist und entschlüsseln Sie ggf. die Datei. Ermitteln Sie als erstes welche Software wahrscheinlich verwendet wurde, um die Datei zu erzeugen.</p></ld-topic>
