<ld-topic id="lv-forschungsseminar_informatik-advanced_practical_it_security"><h1 class="title">W3WI_SE411 - Forschungsseminar Informatik / Advanced Practical IT Security</h1><dl class="docinfo"><dt class="dozent">Dozent<span class="colon">:</span></dt><dd class="dozent"><a class="reference external" href="https://delors.github.io/cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></dd><dt class="contact">Kontakt<span class="colon">:</span></dt><dd class="contact"><a class="reference external" href="mailto:michael.eichberg@dhbw-mannheim.de">michael.eichberg@dhbw-mannheim.de</a>
, Raum 149B</dd><dt class="unterlagen">Unterlagen<span class="colon">:</span></dt><dd class="unterlagen">Moodle</dd><dt class="version">Version<span class="colon">:</span></dt><dd class="version">24SEA - 2026-08-27</dd></dl></ld-topic>
<ld-topic id="teaser"><h2>Teaser</h2><ld-deck><ld-card><p>In dieser Veranstaltung werden wir uns mit den Grundlagen praktischer Angriffe und Verteidigungsmaßnahmen im Bereich IT Security auseinandersetzen. Wir werden uns der Frage widmen wie, wann und in welcher Form man - auf den ersten Blick abgesicherte Systeme/geschützte Daten - einerseits angreifen (<span class="eng">to exploit</span>) kann und wie man die Sicherheit weiter erhöhen kann.</p><p>Wir werden uns in diesem und dem nächsten Semester ausgewählten Themen widmen, die von der Sicherheit von Passwörtern und Angriffen auf selbige bis hin zu der Sicherheit von Netzwerken und Webanwendungen reichen.</p><p><span class="peripheral">Wir werden uns somit auf praktische Aspekte der IT Sicherheit fokussieren. Theoretische Grundlagen sind nur in so weit relevant, dass sie in der Praxis eine Relevanz haben.</span></p></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Für diese Veranstaltung sind Grundkenntnisse in Linux/Unix/MacOS hilfreich aber nicht notwendig. Notwendig ist aber Interesse an tiefer gehenden technischen Details.</p><p>Es wird  empfohlen sich eine virtuelle Maschine (z. B. mit VirtualBox oder UTM) aufzusetzen, auf der Sie Linux (ganz insbesondere z. B. Kali Linux) oder ggf. Mac OS installieren. Auf eigene Gefahr hin können Sie auch WSL2 unter Windows verwenden. Mac User können viele der Tools direkt installieren oder über Homebrew bzw. MacPorts beziehen.</p><p>Eine installation in einer VM ist aber immer empfohlen.</p></aside></ld-card></ld-deck></ld-topic>

<ld-topic id="inhalte"><h2>Inhalte</h2><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Diese Veranstaltung ist ergänzend zur Veranstaltung SE III IT-Sicherheit zu sehen. D. h. Inhalte, die dort vermittelt werden, werden hier nicht noch einmal behandelt, sind aber potentiell relevant.</p></aside></ld-topic>
<ld-topic id="notenzusammenstellung-1-semester-passwortwiederherstellung"><h2>Notenzusammenstellung - 1. Semester - Passwortwiederherstellung</h2><p>30 Punkte - Aufteilung:</p><dl class="field-list"><dt><strong>8 Punkte</strong><span class="colon">:</span></dt><dd><p>(ein bis zwei) Prüfungsgespräche zu Ihrem Vorgehen/Lösungsweg/Herausforderungen mit insgesamt ca. 8 Minuten daue.</p><p>Sie müssen zeigen, dass Sie verstehen was sie tun und warum Sie es tun. Sie müssen in der Lage sein zur argumentieren, wie sie verwandte Probleme angehen würden.</p></dd><dt><strong>22 Punkte</strong><span class="colon">:</span></dt><dd><p>Bearbeitung der Aufgaben. Zu den Aufgaben wird es Fragen geben. Am Ende des Tages können Sie diese dann einreichen.</p></dd></dl></ld-topic>

<ld-topic id="vortragsthemen-grundlagen"><h2>Vortragsthemen - Grundlagen</h2><p><strong>Dauer pro Person: 15 Minuten</strong></p><ld-story><ul class="list-with-explanations incremental-list"><li><p>[1 Person] Grenzen der Multi-Faktor-Authentifizierung</p><p>(MFA fatigue, <a class="reference external" href="https://www.heise.de/en/news/Microsoft-Authenticator-Critical-vulnerability-allows-token-theft-11296758.html">Token Theft</a>, ...)</p></li><li><p>[1 Person] <a class="reference external" href="https://www.shodan.io">Shodan</a> and OSINT im Pentesting</p></li><li><p>[1 Person] Server-Side Request Forgery (<a class="reference external" href="https://portswigger.net/web-security/ssrf">Portswigger - SSRF</a>)</p><p>(Ggf. inkl. Demonstration und Erklärung wie man sich schützt.)</p></li><li><p>[2 Personen] <a class="reference external" href="https://attack.mitre.org">MITRE ATT&#x26;CK</a></p><p>(Knowledge base of adversary tactics and techniques based on real-world observations.)</p><ol class="arabic simple"><li><p>Person - allgemeine Einführung</p></li><li><p>Person - Darstellung ausgewähter Themen</p></li></ol><p>(Bitte darauf achten, dass es mit den OWASP Vorträgen zu keinen relevanten Überschneidungen kommt.)</p></li><li><p>[1 Person] <a class="reference external" href="https://owasp.org/www-project-web-security-testing-guide/v42/">OWASP Web Security Testing Guide</a></p></li><li><p>[1 Person] <a class="reference external" href="https://owasp.org/www-project-mobile-app-security/">OWASP Mobile Application Security</a></p></li><li><p>[1 Person] Copy Fail (<a class="reference external" href="https://copy.fail">https://copy.fail</a>) (case study)</p><p>Als Case-study aufarbeiten und auch die Entstehungsgeschichte erklären. Bitte auch in Relation zu den entsprechenden klassischen Sicherheitsprinzipien von Saltzer und Schroeder (1975) setzen.</p></li><li><p>[1 Person] <a class="reference external" href="https://scapy.net/">Scapy</a></p><p>(Interactive packet manipulation library)</p><p>Eine Demo ist sehr wünschenswert.</p></li><li><p>[1 Person] <a class="reference external" href="https://greenbone.github.io/docs/latest/background.html#architecture">OpenVAS - Community Edition</a> (<a class="reference external" href="https://github.com/greenbone/openvas-scanner">Scanner</a>)</p><p>(Vulnerability Testing)</p><p><em>Achtung: bei der Community Edition handelt es sich wohl um ein „rohes Produkt“.</em></p></li><li><p>[2 Personen] <a class="reference external" href="https://owasp.org/Top10/2025/">OWASP Top Ten 2025</a> (z. B. 1. Person Lücke 1-5; 2. Person Lücke 6 - 10; die konkrete Einteilung ist aber freigestellt!)</p><p>Jeweils mit konkreten Beispielen in etablierten Sprachen/Frameworks.</p></li><li><p>[2 Personen] <a class="reference external" href="https://genai.owasp.org/resource/owasp-top-10-for-llm-applications-2025/">OWASP Top Ten for LLM Applications</a> (z. B. 1. Person Lücke 1-5; 2. Person Lücke 6 - 10; die konkrete Einteilung ist aber freigestellt!)</p></li><li><p>[1 Person] Wireshark für Pentester</p><p>Fokus auf: typische Filter, Credentials finden, verdächtige Muster</p></li><li><p>[1 Person] <a class="reference external" href="https://github.com/OJ/gobuster">Gobuster</a></p><p>(A directory/file, DNS and virtual host brute-forcing tool)</p></li></ul></ld-story><!--Vorträge auf Vorrat :
     - **Fingerprinting von Webanwendungen**
         - Frameworks, Server, CMS erkennen
         - Warum das für Angriffe relevant ist
     - - **Schwache Netzwerkdienste & Legacy-Protokolle**
         - FTP, Telnet, SMBv1
         - Warum sie heute noch existieren
     - **Kali Linux – Überblick über typische Pentest-Tools**
         - Tool-Kategorien statt Tool-Details
         - Warum Kali Standard ist--></ld-topic>
<ld-topic id="vortragsthemen-angewandt"><h2>Vortragsthemen - Angewandt</h2><p><strong>Dauer pro Person: 15 Minuten</strong></p><ld-story><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Niemand, der eines der folgenden Themen bearbeitet, darf mit jemand anderem aus dieser Gruppe bei der Bearbeitung der Portfolioaufgabe zusammenarbeiten.</p></aside><ul class="list-with-explanations incremental-list"><li><p>[1 Person] <a class="reference external" href="https://nmap.org/">Nmap (und ncat)</a></p><p>(Network discovery and security auditing.)</p></li><li><p>[2 Personen] <a class="reference external" href="https://www.zaproxy.org/">Zed Attack Proxy (ZAP)</a></p><p>(Wep App Scanner)</p><ol class="arabic simple"><li><p>Einführung (inkl. Marketplace)</p></li><li><p>Live Demo basierend auf einer Webanwendung (bitte erst in die Anwendung und die Lücken einführen und dann ZAP demonstrieren!)</p></li></ol></li><li><p>[2 Personen] <a class="reference external" href="https://portswigger.net/burp/communitydownload">Burp Suite</a></p><p>(Penetration testing toolkit.)</p><ol class="arabic simple"><li><p>Einführung (inkl. Marketplace)</p></li><li><p>Live Demo basierend auf einer Webanwendung (bitte erst in die Anwendung und die Lücken einführen und dann Burp Suite demonstrieren!)</p></li></ol></li><li><p>[2 Personen] <a class="reference external" href="https://www.metasploit.com/">Metasploit (Open Source)</a></p><p>(Penetration testing framework.)</p><ol class="arabic simple"><li><p>Einführung in Metasploit - d. h. Architektur und Aufbau von Metasploit</p></li><li><p>Live Demo (bitte erst in das Szenario einführen)</p></li></ol></li><li><p>[1 Person] <a class="reference external" href="https://cirt.net/nikto/">Nikto</a></p><p>(Open-source web server scanner checking for dangerous or interesting files and programs, identifying outdated versions of servers and components, detecting common server misconfigurations such as multiple index files, HTTP server options, and more.)</p></li></ul></ld-story></ld-topic>

ple" start="12"><li></li></ol></td><td><p>Wireshark</p></td><td><p>1</p></td><td></td><td></td></tr><tr><td><ol class="arabic simple" start="13"><li></li></ol></td><td><p>Copy Fail</p></td><td><p>1</p></td><td></td><td></td></tr><tr><td><ol class="arabic simple" start="14"><li></li></ol></td><td><p>Nmap</p></td><td><p>1</p></td><td></td><td></td></tr><tr><td><ol class="arabic simple" start="15"><li></li></ol></td><td><p>ZAP</p></td><td><p>2</p></td><td></td><td></td></tr><tr><td><ol class="arabic simple" start="16"><li></li></ol></td><td><p>Burp</p></td><td><p>2</p></td><td></td><td></td></tr><tr><td><ol class="arabic simple" start="17"><li></li></ol></td><td><p>Metasploit</p></td><td><p>2</p></td><td></td><td></td></tr><tr><td><ol class="arabic simple" start="18"><li></li></ol></td><td><p>Nikto</p></td><td><p>1</p></td><td></td><td></td></tr></tbody></table></ld-scrollable></ld-topic>
<ld-topic id="bewertungskriterien"><h2>Bewertungskriterien</h2><ld-deck><ld-card><p class="rubric">Für die Präsentation Ihres Fachvortrags</p><ul><li><p><a class="reference external" href="../allg-vortraege/folien.de.md.html">Hinweise für Präsentationen</a></p></li><li><p>Notenanteil: 25% von der Gesamtnote - d.h. 30 Punkte:</p><ul class="list-with-explanations"><li><p>29 Punkte für den Vortrag</p><p>Der Vortrag muss am Tag der Präsentation bis spätestens 7:00 Uhr hochgeladen sein.</p><p>Für die Teile, die sie demonstrieren, laden Sie bitte eine ausreichende Anzahl an Screenshots (in einem PDF) hoch, damit nachvollzogen werden kann, was demonstriert wurde; alternativ können Sie einen Screencast Ihrer Demo erstellen und diesen <em>direkt</em> nach Ihrem Vortrag hochladen.</p></li><li><p>1 Punkt für das Ausfüllen, Gegenzeichnen und zeitgerechte Hochladen der <a class="reference external" href="../allg-vortraege/folien.de.md.html#slide-7">Checkliste</a></p><p>Bei Gruppenarbeit hat dies jeder Studierende eigenständig zu machen; es erfolgt keine Abgabe der Checkliste für die Gruppe.</p></li></ul></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Für die mündliche Prüfung (X.Y.2027 - Raum 261C)</p><ld-deck><ld-card><ul><li><p>Anzahl und Art der gefundenen Schwachstellen</p><p>Fertigen Sie ein Dokument (.md, .pdf) an, dass Sie vorher (siehe Moodle) hochladen und in dem Sie die Lücken kurz dokumentieren. Pro Lücke dokumentieren Sie den Server + die Anwendung/den API Endpunkt/... der Vulnerabel ist und mit welchem CWE die Lücke verknüpft ist. Sollte Sie kein CWE finden, dann schreiben Sie ein/zwei Sätze, um die Lücke zu charakterisieren.</p><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Eine detaillierte Dokumentation is nicht erforderlich, da es sich im wesentlichen, um ein Prüfungsgespräch handelt.
Es geht hier ausschließlich um eine knappe Auflistung der Lücken! Eine Beschreibung der Lücken oder wie diese gefixt werden könnten ist nicht gewünscht.</p><p><span class="warning">Der Einsatz von KI zur Erstellung/Verbesserung der Liste ist strikt untersagt.</span></p></aside><p><strong>Wir werden diese Liste als Start für das Prüfungsgespräch verwenden.</strong></p></li></ul></ld-card><ld-card class="incremental"><ul><li><p>Demonstration der Schwachstellen</p><blockquote><p><strong>Bringen Sie (mind.) einen Rechner mit, auf dem Sie alle Tools etc. installiert haben, und mit dem Sie in der Lage sind die Lücke unmittelbar zu demonstrieren.</strong></p><p>Das Anlegen von (kleineren) Scripten ist ggf. empfohlen.</p></blockquote></li><li><p>Beantwortung von Fragen</p><p><strong>Jeder muss zu jeder Lücke sprechfähig sein.</strong></p></li><li><p>Notenanteil: 25% von der Gesamtnote - d. h. 30 Punkte:</p></li><li><p>Dauer: ca. 25 Minuten pro Gruppe</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Teilnahme am Pentest</p><p>Laden Sie bis zum X.Y.2027 7:00 Uhr, Ihre Bestätigung der Teilnahmebedingungen hoch.</p></ld-card></ld-deck></ld-card></ld-deck></ld-topic>
<ld-topic id="gruppenzuteilung-pentesting"><h2>Gruppenzuteilung Pentesting</h2><dl class="field-list simple"><dt>Datum<span class="colon">:</span></dt><dd><p>X.Y.2027</p></dd><dt>Ort<span class="colon">:</span></dt><dd><p>261 C</p></dd></dl><table class="accentuated-header booktabs table-header-align-left" style="width: 100%;"><colgroup><col style="width: 2.8%"><col style="width: 13.9%"><col style="width: 27.8%"><col style="width: 27.8%"><col style="width: 27.8%"></colgroup><thead><tr><th class="head"><p>#</p></th><th class="head"><p>Uhrzeit</p></th><th class="head"><ol class="arabic simple"><li><p>Stud.</p></li></ol></th><th class="head"><ol class="arabic simple" start="2"><li><p>Stud.</p></li></ol></th><th class="head"><ol class="arabic simple" start="3"><li><p>Stud.</p></li></ol></th></tr></thead><tbody><tr><td><p>1</p></td><td><p>8:30</p></td><td><p>X</p></td><td><p>Y</p></td><td><p>Z</p></td></tr><tr><td><p>2</p></td><td><p>9:10</p></td><td><p>X</p></td><td><p>Y</p></td><td><p>Z</p></td></tr><tr><td><p>3</p></td><td><p>9:50</p></td><td><p>X</p></td><td><p>Y</p></td><td><p>Z</p></td></tr><tr><td><p>4</p></td><td><p>10:30</p></td><td><p>X</p></td><td><p>Y</p></td><td><p>Z</p></td></tr><tr><td><p>5</p></td><td><p>11:10</p></td><td><p>X</p></td><td><p>Y</p></td><td><p>Z</p></td></tr><tr><td><p>6</p></td><td><p>13:30</p></td><td><p>X</p></td><td><p>Y</p></td><td><p>Z</p></td></tr><tr><td><p>7</p></td><td><p>14:10</p></td><td><p>X</p></td><td><p>Y</p></td><td><p>Z</p></td></tr><tr><td><p>8</p></td><td><p>14:50</p></td><td><p>X</p></td><td><p>Y</p></td><td><p>Z</p></td></tr></tbody></table></ld-topic>
<ld-topic class="hide" id="pentesting"><h2>Pentesting</h2><ld-story><p>Die folgenden Server dürfen Sie einem Pentest unterziehen:</p><table class="booktabs table-header-align-left" style="width: 100%;"><thead><tr><th class="head"><p>Server</p></th><th class="head"><p>Komplexität</p></th></tr></thead><tbody><tr><td><p>141.72.13.218</p></td><td><p><strong>*</strong></p></td></tr><tr><td><p>141.72.12.145</p></td><td><p><strong>**</strong></p></td></tr><tr><td><p>141.72.12.138</p><p><em>four-wins.michael-eichberg-at-dhbw-de.users.dhbw.site</em></p></td><td><p><strong>**</strong></p></td></tr><tr><td><p>141.72.176.151</p><p><strong>(ab 4. Juli)</strong></p></td><td><p><strong>* – **</strong></p></td></tr><tr><td><p>141.72.12.141</p><p><em>quizzy.michael-eichberg-at-dhbw-de.users.dhbw.site</em></p></td><td><p><strong>***</strong></p></td></tr></tbody></table><aside class="admonition" data-theme="legend"><p class="admonition-title" data-theme="legend-header"><span>Legende</span></p><p>* = einfach; *** = sehr schwer</p></aside><aside class="admonition incremental" data-theme="danger"><p class="admonition-title" data-theme="danger-header">!GEFAHR!</p><p>Unter keinen Umständen dürfen Sie andere als die hier gelisteten Server <em>angreifen</em>. Scans von Subdomänen (es gibt auch keine) oder anderen IP-Adressen sind untersagt.</p><p>Sie dürfen auch immer nur die hier beschriebenen Angriffe/Änderungen vornehmen. Jegliche darüber hinausgehenden Tätigkeiten sind untersagt.</p></aside><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Pentesting der VMs ist nur aus dem Netz der DHBW heraus möglich. D. h. nur wenn Sie eine IP-Adresse im Bereich 141.72.0.0/16 haben. Nutzen Sie eine VM auf OpenStack, dann stellen Sie sicher, dass diese VM keine Egress-Filterung vornimmt und im richtigen Netz ist (ggf. in den Security-Policies zu konfigurieren). Wenn Sie sich per VPN verbinden, dann sollte dies immer der Fall sein.</p></aside></ld-story></ld-topic>
<ld-topic id="pentesting-rahmenbedingungen"><h2>Pentesting - Rahmenbedingungen</h2><ld-story><p class="rubric">Was ist erlaubt/was nicht...</p><ul class="incremental-list simple"><li><p>Metasploit ist nicht zu verwenden, erfolgreiche Angriffe mit Metasploit werden nicht anerkannt.</p></li><li><p>Horizontale Privilegienerweiterungen, sind nicht prüfungsrelevant.</p></li><li><p>Alle Sicherheitslücken, die ggf. direkt auf die Verwendung von HTTP zurückzuführen sind, sind zu ignorieren!</p></li><li><p>Sollten Sie ggf. auf Informationen über Nutzeraccounts stoßen oder selbige angreifen wollen, dann <strong>nehmen Sie den Nutzeraccount/Gruppenaccount, der zu Ihrer Gruppennummer gehört</strong>.</p></li><li><p>Möchten Sie auf einem Server Daten ablegen, dann legen Sie diese auf jeden Fall <strong>nur</strong> in dem Verzeichnis ab, der zu Ihrer Gruppennummer passt! (/home/gruppe&#x3C;N>, /home/group&#x3C;N>, ...)</p></li><li><p>Sollten Sie Zugriff auf einen Server bekommen - sei es als normaler Nutzer oder als Root-Nutzer - dann dürfen Sie sich auf jeden Fall frei umsehen.</p></li><li><p>Die Server haben ggf. viele Schwachstellen; die aber bei Weitem nicht alle gleich einfach auszunutzen sind; suchen Sie die einfachste!</p></li><li><p>Bei den Webanwendungen sollten Sie versuchen, so viele verschiedene Schwachstellen wie möglich zu finden. Mappen Sie Ihre Schwachstelle auch immer auf eine CWE! Schwachstellen, den immer nur dieselbe CWE zugrunde liegt, wird nur als eine Schwachstelle gewertet.</p></li><li><p>Bei allen Aktionen bedenken Sie, dass auch andere Personen an dem Pentest teilnehmen und eine Einschränkung anderer Personen nicht gestattet ist.</p></li><li><p>Sie dürfen keine Maßnahmen durchführen, die die Verfügbarkeiten der Server dramatisch einschränken.</p></li><li><p>Sie dürfen unter keinen Umständen Veränderungen oder Aktualisierungen an den Servereinstellungen vornehmen, sollten Sie auf einem oder mehreren Servern Root-Access erlangen!</p></li><li><p>Die Struktur von Datenbanken (<code class="sql"><span class="keyword">alter</span> <span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span></code>) darf nicht verändert werden; semantisch sinnvolle Datensätze, um zum Beispiel die Privilegien eines Nutzer zu erweitern, dürfen hinzugefügt werden (<code class="sql"><span class="keyword">update</span><span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span></code>). Daten, die zur Anwendungslogik gehören, dürfen nicht gelöscht werden!</p></li><li><p>Untersagt sind darüber hinaus sämtliche Handlungen, die ein verständiger Teilnehmer bei objektiver Betrachtung als nicht vom Zweck der Veranstaltung gedeckt erkennen muss — unabhängig davon, ob sie in diesen Bedingungen ausdrücklich aufgeführt sind. Die vorstehenden Verbote sind beispielhaft, nicht abschließend zu verstehen.</p></li></ul><aside class="admonition incremental" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Sollten Sie auf Probleme stoßen, dann melden Sie sich bitte sowohl <strong>bei Herrn Rutesic</strong> als auch bei mir per Mail.</p></aside><aside class="admonition incremental" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Für eine Teilnahme an dem Pentest ist die Gegenzeichnung bis zum 3. Juli 2026 7:00 Uhr erforderlich und <em>persönlich</em> im Moodle hochzuladen.</p></aside><ld-grid class="incremental margin-top-4em default-layout"><ld-cell class="width-40" style="align-self:auto;"><p>Datum: ______________________</p></ld-cell><ld-cell class="width-60" style="align-self:auto;"><p>Unterschrift: ___________________________________________</p></ld-cell></ld-grid></ld-story></ld-topic>
