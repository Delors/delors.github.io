<ld-topic id="task-reverse-engineering"><h1 class="title">Aufgaben - Reverse Engineering</h1><dl class="field-list simple"><dt>Dozent<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></p></dd><dt>Kontakt<span class="colon">:</span></dt><dd><p><a class="reference external" href="mailto:michael.eichberg@dhbw-mannheim.de">michael.eichberg@dhbw-mannheim.de</a>, Raum 149B</p></dd><dt>Version<span class="colon">:</span></dt><dd><p>1.0.0</p></dd></dl></ld-topic>
<ld-topic id="einfuhrung"><h2>Einführung</h2><ld-deck><ld-card><p>Ziel dieser Aufgabe ist es einen ersten Einblick in den Bereich des Software Reverse Engineering zu bekommen. Da es beim Reverse Engineering auch darum gehen kann Schutzsysteme zu analysieren - z. B. durch das Aufdecken von Schwachstellen oder durch Brute-Force - ist dies auch in diesem Fall Ihre Aufgabe.</p></ld-card><ld-card class="incremental"><p>Für diese Aufgaben ist es ggf. notwendig (ein bisschen) Code zu schreiben.</p><p>Sie können diesen zum Beispiel in folgenden Sprachen schreiben: Java (ggf. als Skript), Python, Scala, C, C++, Rust, JavaScript, TypeScript, Prolog, Bash oder Zsh. Es ist oft der Fall, dass der Code, der im Rahmen des Reverse Engineering entwickelt wird, eine andere Sprache nutzt als der Originalcode.</p></ld-card><ld-card class="incremental"><p>Es ist im Rahmen des Reverse Engineering fast immer so, dass mehrere Wege zum Ziel führen. Sollte ein Weg nicht erfolgreich sein, dann probieren Sie einen anderen. Das Wichtigste ist Beharrlichkeit!</p><p>Es steht ihnen vollkommen frei welchen Weg sie gehen.</p><aside class="admonition incremental" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>KIs sind in der Zwischenzeit sehr mächtig und hilfreich!</p></aside><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Für die Analyse der nativen Binärdateien können Sie gerne Werkzeuge wie Ghidra, Radare2 oder ähnliche verwenden. Ggf. ist der Einsatz von Kali Linux hilfreich. Ghidra kann dort einfach mit <code class="console"><span class="name function">sudo</span> <span class="name function">apt</span> <span class="name function">install</span> ghidra</code> installiert werden. Die Binaries wurden alle in einer VM getestet und laufen dort problemlos. Ggf. ist die Emulation (!) von ARM64 oder x86_64 erforderlich.</p></aside></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Sollten Sie Probleme haben die nativen Binärdateien auszuführen, dann nutzen Sie ggf. das Tool <span class="docutils literal">file</span> um herauszufinden, für welche Architektur die entsprechende Binärdatei kompiliert wurde und welche Bibliotheken ggf. fehlen bzw. installiert werden müssen.</p><p><span class="meta">(Es gibt zum Beispiel verschiedene Implementationen der C Standardbibliothek. Diese können sich in Details unterscheiden, was dazu führen kann, dass eine Binärdatei nicht ausgeführt werden kann und es dann zu - teilweise sehr verwirrenden - Fehlermeldungen kommt.)</span></p></aside></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Die Analyse von Java Class Dateien kann zum Beispiel über FenFlower (eingebaut in IntelliJ IDEA; als Plug-in für VS Code verfügbar) oder CFR erfolgen.</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic class="exercises" id="encryptme"><h2>EncryptMe</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Mit EncryptMe verschlüsselte Datei entschlüsseln"><p class="ld-exercise-title rubric"><span>Mit EncryptMe verschlüsselte Datei entschlüsseln</span></p><p>Ziel dieser Aufgabe ist es die Datei zu entschlüsseln. Die Verschlüsselung ist mit der Software <span class="docutils literal">encryptme</span> durchgeführt worden.</p><p><a class="reference external" href="reverse_engineering-uebungsaufgaben/Encryptme.zip">Encryptme.zip</a></p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Die Software liegt sowohl als ARM als auch als x86_64 Version vor. Beide sind in der Lage die Datei zu entschlüsseln und funktional identisch. Sollten Sie also mit einer der Architekturen vertrauter sein, dann verwenden Sie diese.</p></aside></div></ld-topic>
<ld-topic class="exercises" id="encryptme2"><h2>EncryptMe2</h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Mit EncryptMe2 verschlüsselte Datei entschlüsseln"><p class="ld-exercise-title rubric"><span>Mit EncryptMe2 verschlüsselte Datei entschlüsseln</span></p><p>Ziel dieser Aufgabe ist es die Datei zu entschlüsseln. Die Verschlüsselung ist mit der Software <span class="docutils literal">encryptme2</span> durchgeführt worden.</p><p><a class="reference external" href="reverse_engineering-uebungsaufgaben/Encryptme2.zip">Encryptme2.zip</a></p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Die Software liegt sowohl als ARM als auch als x86_64 Version vor. Beide sind in der Lage die Datei zu entschlüsseln und funktional identisch. Sollten Sie also mit einer der Architekturen vertrauter sein, dann verwenden Sie diese.</p></aside></div></ld-topic>
<ld-topic class="exercises" id="secure24v1"><h2>Secure24v1</h2><p>Ihnen liegt eine verschlüsselte Datei vor: <span class="docutils literal">Message.odp.encrypted</span>, die mit dem Program <span class="docutils literal">Secure24v1</span> verschlüsselt wurde. Informationen zum verwendeten Passwort liegen nur begrenzt vor. Es ist davon auszugehen, dass das Passwort sicher ist. Es liegt Ihnen aber noch die Datei <span class="docutils literal">key</span> vor. Weiterhin ist davon auszugehen, dass die verschlüsselte Datei tatsächlich eine OpenOffice/LibreOffice Präsentation ist.</p><p>Analysieren Sie die Anwendung, um einen möglichen Ansatzpunkt zu finden, um die Datei erfolgreich zu entschlüsseln.</p><aside class="admonition" data-theme="background"><p class="admonition-title" data-theme="background-header"><span>Hintergrund</span></p><p>Informationen über den Aufbau von OpenOffice Dateien finden sich zum Beispiel hier:</p><blockquote><p><a class="reference external" href="http://docs.oasis-open.org/office/v1.0/OpenDocument-v1.0-os.pdf">http://docs.oasis-open.org/office/v1.0/OpenDocument-v1.0-os.pdf</a></p></blockquote><p>Insbesondere Abschnitt 17 enthält Informationen zum Aufbau von entsprechenden Dateien und wie diese erkannt werden können.</p></aside><p><a class="reference external" href="reverse_engineering-uebungsaufgaben/secure24v1.zip">Secure24v1.zip</a></p></ld-topic>
<ld-topic class="exercises" id="secure24v2"><h2>Secure24v2</h2><p>Neben dem Programm <span class="docutils literal">secure24v2</span> liegen die beiden Dateien: <span class="docutils literal">Text.encrypted</span> und <span class="docutils literal">key</span> vor.</p><p>In diesem Falle sind keinerlei Informationen über das Passwort bekannt. Beim Inhalt ist davon auszugehen, dass es sich um eine einfache Textdatei handelt.
Ziel ist die Entschlüsselung der Datei.</p><p><a class="reference external" href="reverse_engineering-uebungsaufgaben/secure24v2.zip">Secure24v2.zip</a></p></ld-topic>
