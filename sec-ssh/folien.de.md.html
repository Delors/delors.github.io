<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="secure-shell-ssh"><h2><a class="reference external" href="https://datatracker.ietf.org/doc/html/rfc4254">Secure Shell (SSH)</a></h2><p><strong>Verschlüsselte Verbindung</strong></p><p>SSH ermöglicht die sichere Fernanmeldung von einem Computer bei einem anderen (typischerweise über TCP über Port 22). Es bietet mehrere Optionen für eine starke Authentifizierung und schützt die Sicherheit und Integrität der Kommunikation durch starke Verschlüsselung.</p><div class="compound incremental"><p><strong>Ablauf</strong></p><ol class="arabic simple"><li><p>Authentisierung des Server-Rechners</p></li><li><p>Authentisierung des Benutzers (bzw. des Clients) mittels</p><ol class="loweralpha simple"><li><p>Passwort</p></li><li><p><span class="s">.rhosts-Eintrag</span></p></li><li><p>privatem <span class="peripheral">(RSA-)</span>Key (hauptsächlich verwendete Methode)</p></li></ol></li><li><p>Kommunikation über symmetrisch verschlüsselte Verbindung</p></li></ol></div><ld-supplemental><p>Die Authentifizierung mittels eines Schlüsselpaars dient primär der Automatisierung (dann wird auch keine „Schlüsselphrase“ zum Schutz des Passworts verwendet). Auf jeden Fall ist effektives Schlüsselmanagement erforderlich:</p><blockquote class="epigraph"><p>[...] In einigen Fällen haben wir mehrere Millionen SSH-Schlüssel gefunden, die den Zugang zu Produktionsservern in Kundenumgebungen autorisieren, wobei 90 % der Schlüssel tatsächlich ungenutzt sind und für einen Zugang stehen, der zwar bereitgestellt, aber nie gekündigt wurde.</p><p class="attribution">—<a class="reference external" href="https://www.ssh.com/academy/ssh/protocol">SSH.com (Dez. 2023)</a></p></blockquote></ld-supplemental></ld-topic>
<ld-topic id="secure-shell-ssh-protokoll"><h2>Secure Shell (SSH) - Protokoll</h2><ld-story><object class="light-image align-center" data="images/ssh/initiation.svg" type="image/svg+xml" role="img" aria-label="SSH Protokoll"></object><p>Beide Seiten haben einen Public-private Key Schlüsselpaar zur gegenseitigen Authentifizierung</p><dl class="incremental-list dd-margin-left-8em field-list simple"><dt>User Keys<span class="colon">:</span></dt><dd><ul class="simple"><li><p><span class="docutils literal">Authorized keys</span> - Serverseitige Datei mit den öffentlichen Schlüsseln der Nutzer</p></li><li><p><span class="docutils literal">Identity keys</span> - private Schlüssel der Nutzer</p></li></ul></dd><dt>Host keys<span class="colon">:</span></dt><dd><p>dienen der Authentifizierung von Servern (verhindern Person-in-the-Middle-Angriffe)</p></dd><dt>Session Keys<span class="colon">:</span></dt><dd><p>werden für die symmetrische Verschlüsselung der Daten in einer Verbindung verwendet. Session Keys (<span class="ger">Sitzungsschlüssel</span>) werden während des Verbindungsaufbaus ausgehandelt.</p></dd></dl></ld-story><ld-supplemental><p>Im Falle von SSH gibt es kein initiales Vertrauen zwischen Server und Client.</p></ld-supplemental></ld-topic>
<ld-topic id="secure-shell-ssh-authentifizierung-mittels-passwort"><h2>Secure Shell (SSH) - Authentifizierung mittels Passwort</h2><ld-scrollable><figure class="align-center"><object class="light-image" data="external/SSH-sequence-password.svg" type="image/svg+xml" role="img" aria-label="SSH Protokoll" width="1850px"></object><figcaption><p><a class="reference external" href="https://creativecommons.org/licenses/by/4.0/deed.en">CC 4.0</a> - <a class="reference external" href="https://commons.wikimedia.org/wiki/File:SSH-sequence-password.svg">Aleksey Valov - 29 February 2016</a></p><p>Der Font wurde zwecks besserer Einbettung in den Foliensatz auf <em>Noto Sans Display</em> geändert.</p></figcaption></figure></ld-scrollable></ld-topic>

<ld-topic id="secure-shell-unterstutzte-transport-verschlusselungsverfahren"><h2>Secure Shell - <a class="reference external" href="https://www.openssh.org/specs.html">Unterstützte Transport-Verschlüsselungsverfahren</a></h2><p><strong>OpenSSH_10.2p1</strong></p><ld-scrollable><table class="sticky-header"><thead><tr><th class="head"><p>Cipher Name</p></th><th class="head"><p>Status</p></th><th class="head"><p>Beschreibung</p></th></tr></thead><tbody><tr><td><p>3des-cbc</p></td><td><p>DEPRECATED</p></td><td><p>three-key 3DES in CBC mode</p></td></tr><tr><td><p>aes256-cbc</p></td><td><p>LEGACY</p></td><td><p>AES in CBC mode, with a 256-bit key</p></td></tr><tr><td><p>aes192-cbc</p></td><td><p>LEGACY</p></td><td><p>AES with a 192-bit key</p></td></tr><tr><td><p>aes128-cbc</p></td><td><p>LEGACY</p></td><td><p>AES with a 128-bit key</p></td></tr><tr><td><p>aes128-ctr</p></td><td><p>RECOMMENDED</p></td><td><p>AES in CTR mode with a 128-bit key</p></td></tr><tr><td><p>aes192-ctr</p></td><td><p>RECOMMENDED</p></td><td><p>AES in CTR mode with a 192-bit key</p></td></tr><tr><td><p>aes256-ctr</p></td><td><p>RECOMMENDED</p></td><td><p>AES in CTR mode with a 256-bit key</p></td></tr><tr><td><p>aes128-gcm@openssh.com</p></td><td><p>RECOMMENDED</p></td><td><p>AES in Galois/Counter Mode (GCM) with a 128-bit key</p></td></tr><tr><td><p>aes256-gcm@openssh.com</p></td><td><p>RECOMMENDED</p></td><td><p>AES in Galois/Counter Mode (GCM) with a 256-bit key</p></td></tr><tr><td><p>chacha20-poly1305@openssh.com</p></td><td><p>RECOMMENDED</p></td><td><p>ChaCha20 stream cipher with Poly1305 MAC</p></td></tr></tbody></table><div class="legend"><dl class="field-list simple"><dt>DEPRECATED<span class="colon">:</span></dt><dd><p>Unterstützt, aber standardmäßig deaktiviert.</p></dd><dt>LEGACY<span class="colon">:</span></dt><dd><p>Unterstützt für Rückwärtskompatibilität, aber nicht empfohlen.</p></dd><dt>RECOMMENDED<span class="colon">:</span></dt><dd><p>Empfohlen für den Einsatz.</p></dd></dl></div></ld-scrollable><ld-supplemental><p><strong>Anmerkung</strong></p><p>CBC-Modi sind anfällig für bestimmte Angriffe (z. B. Padding-Oracle-Angriffe) und werden insbesondere für Rückwärtskompatibilität unterstützt.</p><p><strong>Algorithmen unterstützt von älteren OpenSSH-Versionen</strong></p><ul class="simple"><li><p>blowfish-cbc , Blowfish in CBC mode</p></li><li><p>twofish256-cbc , Twofish in CBC mode,with a 256-bit key</p></li><li><p>serpent256-cbc   , Serpent in CBC mode, with a 256-bit key</p></li><li><p>arcfour          , the ARCFOUR stream cipher with a 128-bit key</p></li><li><p>idea-cbc         , IDEA in CBC mode</p></li><li><p>cast128-cbc      , CAST-128 in CBC mode</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="secure-shell-ssh-risiken-durch-mangelnde-schlusselverwaltung"><h2>Secure Shell (SSH) - Risiken durch mangelnde Schlüsselverwaltung</h2><ul class="incremental-list simple"><li><p>Schlüssel werden nicht regelmäßig ausgetauscht</p></li><li><p>Schlüssel werden nicht gelöscht, wenn sie nicht mehr benötigt werden</p></li><li><p>viele (die meisten) Schlüssel werden nicht verwendet</p></li><li><p>Es ist oft nicht bekannt, wer Zugriff auf welche Schlüssel hat(te)</p></li><li><p>Es ist nicht bekannt, welche Schlüssel auf welche Systeme Zugriff haben</p></li><li><p>Malware kann SSH-Schlüssel stehlen</p></li><li><p>SSH Keys können ggf. privilegierten Zugriff gewähren</p></li><li><p>SSH Keys können benutzt werden, um Backdoors zu verstecken</p></li><li><p>Server keys erlauben ggf. Person-in-the-Middle-Angriffe</p></li></ul></ld-topic>
<ld-topic id="ssh-tunneling"><h2>SSH Tunneling</h2><ul class="list-with-details"><li><p>ermöglicht die Übertragung beliebiger Netzwerkdaten über eine verschlüsselte SSH-Verbindung. z. B.</p><ul class="simple"><li><p>um ältere Anwendungen zu verschlüsseln.</p></li><li><p>um VPNs (Virtual Private Networks) zu implementieren.</p></li><li><p>um über Firewalls hinweg auf Intranetdienste zuzugreifen.</p></li></ul></li><li><p>ermöglicht auch Port-forwarding</p><p>(Lokale Ports werden auf entfernten Rechner weitergeleitet.)</p></li></ul><object class="light-image align-center" data="images/ssh/tunneling.svg" type="image/svg+xml" role="img" aria-label="SSH Protokoll"></object></ld-topic>
<ld-topic id="ssh-und-back-tunneling"><h2>SSH und „Back-tunneling“</h2><ul class="incremental-list simple"><li><p>Der Angreifer richtet einen Server außerhalb des Zielnetzwerks ein</p></li><li><p>Nach Infiltration des Zielsystems verbindet der Angreifer sich von innen mit dem externen SSH-Server.</p></li><li><p>Diese SSH-Verbindung wird so eingerichtet, dass eine TCP-Port-Weiterleitung von einem Port auf dem externen Server zu einem SSH-Port auf einem Server im internen Netzwerk möglich ist.</p></li><li><p>Die meisten Firewalls bieten wenig bis gar keinen Schutz dagegen.</p></li></ul><ld-supplemental><p>Es ist in diesem Fall besonders interessant für den Angreifer den SSH Server zum Beispiel bei einem Cloud-Anbieter zu betreiben, welcher von dem Unternehmen  standardmäßig verwendet wird (am Anfang steht immer die Aufklärung!). In diesem Fall wird die Firewall keine ausgehenden SSH-Verbindungen dorthin blockieren.</p></ld-supplemental></ld-topic>

It [The Terrapin attack] manipulates sequence numbers during the handshake process to compromise the integrity of the SSH channel, particularly when specific encryption modes like ChaCha20-Poly1305 or CBC with Encrypt-then-MAC are used.
[...]</p><p>By Bill Toulas</p><p class="attribution">—<a class="reference external" href="https://www.bleepingcomputer.com/news/security/nearly-11-million-ssh-servers-vulnerable-to-new-terrapin-attacks/">January 3, 2024 10:06 AM</a></p></blockquote></ld-topic>
