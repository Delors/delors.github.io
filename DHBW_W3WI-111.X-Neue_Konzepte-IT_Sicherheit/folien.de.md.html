, Raum 149B</dd><dt class="version">Version<span class="colon">:</span></dt><dd class="version">24EG/SC</dd></dl><ld-supplemental><dl class="field-list simple"><dt>KI Verwendung<span class="colon">:</span></dt><dd><p>Bei der Erstellung der Unterlagen wurden KI Assistenten (insbesondere Claude
aber ggf. auch ChatGPT, Ollama mit Gemma/LLama/Qwen oder OpenCode mit
Kimi/Qwen/Deepseek...) unterstützend eingesetzt.
Dies erfolgte insbesondere zur Unterstützung bei der Generierung von Grafiken
(d. h. SVG Dateien), oder um sich Übersichtstabellen generieren zu lassen.

Übernahme explizit validiert und angepasst.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic id="ausgewahlte-inhalte-gem-mhb"><h2>Ausgewählte Inhalte gem. MHB</h2><h3>Kerninhalte</h3><blockquote class="epigraph"><p>In diesem Modul sollen aktuelle Themen aus allen Bereichen der Wirtschaftsinformatik aufgegriffen und den Studierenden vermittelt werden.</p></blockquote><h3>ÜBERGREIFENDE HANDLUNGSKOMPETENZ</h3><blockquote class="epigraph"><p>Die Studierenden können ein aktuelles Thema in seiner jetzigen oder zukünftigen Relevanz für ihre Tätigkeit im Unternehmen beurteilen. Sie können die vermittelten neuen Konzepte im Rahmen von Fallstudien einsetzen und anwenden.</p></blockquote></ld-topic>
<ld-topic id="prufungsleistung-klausur"><h2>Prüfungsleistung - Klausur</h2><aside class="admonition" data-theme="background"><p class="admonition-title" data-theme="background-header"><span>Hintergrund</span></p><ul class="simple"><li><p>25VL (Modul: 50 VL)</p></li><li><p>Modul 5 ECTS</p></li><li><p>Klausuranteil: 60 Minuten (Modul: Klausur 120 Minuten)</p></li></ul></aside></ld-topic>
<ld-topic id="themen"><h2>Themen</h2><ul class="simple"><li><p>Siehe Moodle.</p></li><li><p>Wir werden die behandelten Themen an den Fortschritt anpassen und ggf. auch ergänzen. Prüfungsrelevant sind nur die in der Vorlesung behandelten Themen.</p></li></ul></ld-topic>
