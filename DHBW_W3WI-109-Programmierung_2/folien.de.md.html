<ld-topic id="inhalte-gem-mhb"><h2>Inhalte gem. MHB</h2><ld-deck><ld-card><p class="rubric">Weiter zu vertiefen</p><dl class="field-list"><dt>Klassenbibliotheken<span class="colon">:</span></dt><dd><p>API-Dokumentationen und ihre Nutzung.</p></dd><dt>Software Entwicklung<span class="colon">:</span></dt><dd><p>Aufsetzen eines Projekts, Versionsverwaltung und Testen</p><p><span class="peripheral">Beide Themen werden im Wesentlichen behandelt in der Veranstaltung: Methoden der Softwareentwicklung. Wir werden diese Themen hier nur insoweit behandeln, wie es für das Verständnis der Programmierung II notwendig ist.)</span></p></dd></dl></ld-card><ld-card class="incremental"><p class="rubric">Inhalte, auf die wir uns konzentrieren werden</p><dl class="dd-margin-left-9em field-list simple"><dt>Fortgeschrittene objektorientierte Konzepte<span class="colon">:</span></dt><dd><p>Generische Interfaces und Klassen. Ereignisbehandlung. Funktionale Programmierung</p></dd><dt>Fortgeschrittene Programmiermethodik<span class="colon">:</span></dt><dd><p>Ein- und Ausgabe über Streams. Funktionale Programmierkonzepte.</p></dd><dt>Algorithmen<span class="colon">:</span></dt><dd><p>Beschreibung und Analyse, Such- und Sortierverfahren, Teile-und-Herrsche-Paradigma</p></dd><dt>Datentypen<span class="colon">:</span></dt><dd><p>insb. objektorientierte und generische Datentypen.</p></dd><dt>Datenstrukturen<span class="colon">:</span></dt><dd><p>einfach und doppelt verkettete Listen, Bäume, Stapel und Schlangen mit ihren Grundoperationen</p></dd><dt>Abstrakte Datentypen<span class="colon">:</span></dt><dd><p><em>Collection</em>s und <em>Iterator</em>s.</p></dd></dl></ld-card><ld-card class="incremental"><p class="rubric">Inhalte, die wir erst später (in einem anderen Semester/Kurs) behandeln werden</p><dl class="dd-margin-left-9em field-list simple"><dt>Nebenläufigkeit<span class="colon">:</span></dt><dd><p>Grundlagen der nebenläufigen Programmierung, Synchronisation von Threads, Deadlocks</p></dd></dl><p class="rubric">Inhalte, die wir nicht behandeln werden, da diese überholt sind</p><dl class="dd-margin-left-9em field-list"><dt>GUI Programmierung<span class="colon">:</span></dt><dd><p>Entwicklung grafischer Benutzeroberflächen mit Java.</p><p><span class="peripheral">(Benutzeroberflächen werden bei modernen Anwendungen häufig mit Webtechnologien entwickelt; auch wenn diese dann am Ende auf Desktoprechnern oder mobilen Geräten laufen.)</span></p></dd></dl></ld-card></ld-deck></ld-topic>
