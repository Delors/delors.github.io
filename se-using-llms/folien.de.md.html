<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>
<style>.label { font-family: "Noto Sans Display"; font-weight: 400; fill: #111; }
.arrow { fill: none; stroke: darkgray; stroke-width: 6;  }
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
</marker>
</defs></svg>

<ld-topic class="transition-fade" id="was-ist-vibe-coding"><h2>Was ist <em>Vibe Coding</em>?</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Vibe Coding</span></p><blockquote class="epigraph"><p>Entwicklung einer Softwarelösung, für deren Softwarequalität ich - als Entwickler - keine Garantie übernehme.</p></blockquote><blockquote class="epigraph"><p>Entwicklung einer Software für ein einmaligen Anwendungszweck.</p></blockquote></aside><ld-deck><ld-card><aside class="admonition incremental" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Ist <em>Vibe Coding</em> Software Engineering?</p></aside><aside class="admonition incremental" data-theme="answer"><p class="admonition-title" data-theme="answer-header"><span>Antwort</span></p><p>Nein. Wenn ich Code Vibe Code und keinen systematischen Prozess durchlaufen habe, um die kurz- und auch langfristige Qualität zu sichern, dann kann dies nicht als Software Engineering bezeichnet werden.</p></aside></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Wann funktioniert Vibe Coding?</p></aside><aside class="admonition incremental" data-theme="answer"><p class="admonition-title" data-theme="answer-header"><span>Antwort</span></p><p>Wenn der Prompt sich auf die Dinge bezieht, die das LLM kennt. Beispiel: Erstelle mir eine Webapp zum Spielen von Schach. Wenn ich mir aber ein neues Spielkonzept überlegt habe, dass es so vorher noch nie gab, dann benötige ich eine Spezifikation und schon sind wir im Bereich Software Engineering.</p></aside></ld-card><ld-card class="incremental"><p>Empfohlener Podcast: <a class="reference external" href="https://se-radio.net/2026/03/se-radio-711-scott-hanselman-on-ai-assisted-development-tools/">https://se-radio.net/2026/03/se-radio-711-scott-hanselman-on-ai-assisted-development-tools/</a></p></ld-card></ld-deck></ld-topic>
<ld-topic id="llms-und-code-generierung"><h2>LLMs und Code-Generierung</h2><ld-grid class="default-layout"><ld-cell class="width-30" style="align-self:auto;"><p><strong>Normales LLM</strong></p><ul class="incremental-list simple"><li><p>Antwortet direkt: Eingabe → Ausgabe</p></li><li><p>Schnell, ausreichend für einfache Aufgaben</p></li><li><p>Risiko: unvollständiger oder fehlerhafter Code bei komplexeren Problemen</p></li><li><p>Beispiel: „Schreibe eine Python-Funktion für Fibonacci-Zahlen“ → sofortiger Code</p></li></ul></ld-cell><ld-cell class="width-70" style="align-self:auto;"><p><strong>Thinking-LLM</strong></p><div style="width: 15ch; height: 15ch;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="75 75 450 450" font-size="30">

    <!-- Circle center (300,300), radius 200 -->
    <!-- Labels -->
    <text class="label" x="300" y="140" text-anchor="middle">PERCEIVE</text>
    <text class="label incremental-1" x="420" y="310" text-anchor="middle">REASON</text>
    <text class="label incremental-2" x="300" y="480" text-anchor="middle">ACT</text>
    <text class="label incremental-3" x="180" y="310" text-anchor="middle">OBSERVE</text>

    <!-- Arcs with arrows (clockwise) -->
    <g transform="rotate(2.5,300,300)">
        <!-- PERCEIVE -> REASON -->
        <path class="arrow incremental-1" d="M 300 100 A 200 200 0 0 1 500 300" marker-end="url(#arrow)" />
        <!-- REASON -> ACT -->
        <path class="arrow incremental-2" d="M 500 300 A 200 200 0 0 1 300 500" marker-end="url(#arrow)" />
        <!-- ACT -> OBSERVE -->
        <path class="arrow incremental-3" d="M 300 500 A 200 200 0 0 1 100 300" marker-end="url(#arrow)" />
        <!-- OBSERVE -> PERCEIVE -->
        <path class="arrow incremental-4" d="M 100 300 A 200 200 0 0 1 300 100" marker-end="url(#arrow)"/>
    </g>
</svg>
</div><ul class="incremental-list simple"><li><p>Führt interne „Denk“-Schritte vor der Antwort aus</p></li><li><p>Reflektiert, prüft und verbessert den Code, bevor er ausgegeben wird</p></li><li><p>Langsamer, aber zuverlässiger bei komplexen Aufgaben</p></li><li><p>Beispiel: Überlegt Algorithmus-Varianten, Edge-Cases und Tests, bevor Code zurückkommt</p></li></ul></ld-cell></ld-grid><ld-supplemental><aside class="admonition incremental" data-theme="summary"><p class="admonition-title" data-theme="summary-header"><span>Zusammenfassung</span></p><p>Normale LLMs sind schnell für Routinetätigkeiten – Thinking-LLMs liefern bessere Ergebnisse bei schwierigen Programmieraufgaben.</p></aside></ld-supplemental></ld-topic>
<ld-topic class="transition-scale" id="prompting-strategien-fur-code-generierung-mit-llms"><h2>Prompting-Strategien für Code-Generierung mit LLMs</h2><ld-story><dl class="incremental-list field-list"><dt>Klare Aufgabenstellung<span class="colon">:</span></dt><dd><p>Programmiersprache und gewünschte Bibliotheken benennen.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Schreibe eine Funktion in <em>Python</em>, die … mit <em>NumPy</em> …</p></aside></dd><dt>Struktur vorgeben<span class="colon">:</span></dt><dd><p>Erwünschte Signatur oder Interfaces spezifizieren und dabei möglichst präzise sein.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Implementiere <code class="python"><span class="keyword">def</span> <span class="name function">sort_list</span><span class="punctuation">(</span>xs<span class="punctuation">:</span> <span class="name builtin">list</span><span class="punctuation">[</span><span class="name builtin">int</span><span class="punctuation">]</span><span class="punctuation">)</span> <span class="operator">-</span><span class="operator">&gt;</span> <span class="name builtin">list</span><span class="punctuation">[</span><span class="name builtin">int</span><span class="punctuation">]</span><span class="punctuation">:</span></code></p></aside></dd><dt>Schrittweise Anleitungen<span class="colon">:</span></dt><dd><p>Erst Algorithmus erklären lassen, dann den Code generieren.</p><p>Hilft bei komplexen Problemen (Divide &#x26; Conquer im Prompt).</p></dd><dt>Beispiele nutzen<span class="colon">:</span></dt><dd><p>„Few-Shot Prompting“ mit kleinen Code-Snippets als Vorlage.</p><p>Fördert Einhaltung von Stil, Syntax und Konventionen.</p></dd><dt>Fehlervermeidung<span class="colon">:</span></dt><dd><p>Auf Testfälle im Prompt hinweisen: „Der Code muss diese Tests bestehen …“</p></dd><dt>Iterative Verfeinerung<span class="colon">:</span></dt><dd><p>Erst groben Entwurf generieren, dann gezielt Verbesserungen anfordern</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>„Optimiere die Laufzeit“ oder „Füge Typannotationen hinzu“.</p></aside></dd></dl><!--auf Widersprüche hinweisen...--></ld-story></ld-topic>
<ld-topic id="typische-stolperfallen-beim-code-prompting"><h2>Typische Stolperfallen beim Code-Prompting</h2><ld-story><dl class="incremental-list field-list"><dt>Unpräzise Sprache<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Keine Programmiersprache/Technologien angegeben → Modell wählt zufällig.</p></li><li><p>Lösung: Sprache und Version im Prompt festlegen</p></li></ul></dd><dt>Fehlende Constraints<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Ohne Funktionssignatur oder Interfaces generiert LLM „freie“ Lösungen</p></li><li><p>Lösung: Signaturen, Klassen oder API-Vorgaben angeben</p></li></ul></dd><dt>Vermischte Anforderungen<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Prompt enthält Code + Prosa → Antwort enthält unnötige Erklärungen</p></li><li><p>Lösung: explizit nur <em>Codeblock</em> anfordern</p></li></ul></dd><dt>Zu komplex in einem Schritt<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Lange Prompts mit vielen Bedingungen führen zu Fehlern</p></li><li><p>Lösung: Problem in mehrere Teilaufgaben aufsplitten, dabei jedoch alle für einen Schritt relevanten Anforderungen benennen, um sich (viel) Nacharbeit zu sparen.</p></li></ul><ld-supplemental><p>Modernere LLMs können immer besser mit komplexen Prommpts umgehen und hier sind auch weitere Verbesserungen zu erwarten.</p></ld-supplemental></dd><dt>Keine Tests spezifiziert<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Modell weiß nicht, wann Lösung „korrekt“ ist</p></li><li><p>Lösung: Testfälle im Prompt beilegen oder explizit anfordern</p></li></ul></dd><dt>Übermäßiges Vertrauen<span class="colon">:</span></dt><dd><ul class="negative-list simple"><li><p>Generierter Code wird ohne Überprüfung übernommen!</p></li><li><p>Lösung: Immer Review, Linting und Tests durchführen. Insbesondere Versionen von externen Bibliotheken überprüfen, diese sind häufig nicht aktuell oder veraltet.</p></li></ul><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Beim Einbiden von Tools oder Bibliotheken ist die Zielbibliothek immer zu prüfen! Am Besten einen Dependency-Manager verwenden.</p></aside></dd></dl></ld-story></ld-topic>
<ld-topic id="mensch-vs-maschine"><h2>Mensch vs. Maschine</h2><blockquote class="epigraph"><p>[...] Hoher Komplexitätsgrad als Stolperstein</p><p>Viele KI-Tools sind mittlerweile so leistungsstark geworden, dass sie Developern einen echten Mehrwert bringen. Komplexe Coding-Aufgaben können sich für Kollege KI jedoch laut der Studie als Stolperstein herausstellen. Darunter fallen etwa Aspekte wie das Kontextverständnis für sehr umfangreiche Codebasen, höhere logische Komplexitätsgrade sowie die Fähigkeit, Codestrukturen so zu planen und umzusetzen, dass ihre Qualität auch langfristig auf dem gleichen Niveau bleibt. [...]</p><p class="attribution">—<a class="reference external" href="https://www.heise.de/news/Das-machen-Menschen-besser-Studie-zeigt-Grenzen-von-Coding-Agenten-10628483.html">2.9.2025 - Heise Online - Das machen Menschen besser: Studie zeigt Grenzen von Coding-Agenten</a></p></blockquote><ld-supplemental><p>Es ist davon auszugehen, dass sich diese Situation zeitnahe noch stärker verschieben wird, dadurch, dass die Modelle bei Unsicherheit nachfragen werden.</p></ld-supplemental></ld-topic>

<ld-topic id="beispielhafte-verwendung-von-gpt-4-1-1"><h2>Beispielhafte Verwendung von GPT-4.1</h2><p>Das Ziel ist die Generierung einer Kommandozeilenanwendung zur Berechnung der Quadratwurzel einer Zahl mit vorgegebener, aber beliebiger Genauigkeit.</p><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Der Chat bzw. die Ausgaben wurden teilweise reformatiert und gekürzt, um die Lesbarkeit zu verbessern. Der grundzätzliche Ablauf ist zu 100% erhalten, um die Herausforderungen zu verdeutlichen.</p></aside></ld-topic>
<ld-topic id="beispielhafte-verwendung-von-gpt-4-1-2"><h2>Beispielhafte Verwendung von GPT-4.1</h2><ld-scrollable class="llm-chat"><p class="rubric">1. Schritt: Grundlegende Methode implementieren lassen.</p><div class="compound llm-chat-user"><p>Bitte schreibe mir eine Methode in Java, die die Newton-Raphson-Methode

</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="comment single">/**</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="operator">*</span> <span class="name class">Berechnet</span> die <span class="name class">Quadratwurzel</span> einer <span class="name class">Zahl</span> mit <span class="name class">Newtons</span> <span class="name class">Verfahren</span><span class="punctuation">.</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="operator">*</span> <span class="punctuation">@param</span> n <span class="name class">Die</span> <span class="name class">Zahl</span><span class="punctuation">,</span> deren <span class="name class">Quadratwurzel</span> berechnet werden soll <span class="punctuation">(</span>n <span class="operator">&gt;=</span> <span class="literal number integer">0</span><span class="punctuation">)</span>

</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="operator">*</span> <span class="punctuation">@return</span> <span class="name class">Die</span> berechnete <span class="name class">Quadratwurzel</span> von n <span class="operator">*</span><span class="operator">/</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="keyword">public</span> <span class="keyword">static</span> <span class="keyword">double</span> <span class="name function">sqrt</span><span class="punctuation">(</span><span class="keyword">double</span> n<span class="punctuation">,</span> <span class="keyword">double</span> tolerance<span class="punctuation">)</span> <span class="punctuation">{</span>

<ld-topic id="beispielhafte-verwendung-von-gpt-4-1-3"><h2>Beispielhafte Verwendung von GPT-4.1</h2><ld-scrollable><p class="rubric">2. Schritt: Ermöglichen einer konfigurierbaren Anzahl Stellen.</p><div class="compound llm-chat-user"><p>Die Methode soll in der Lage sein eine - ggf. sehr große - Anzahl an

</code><small class="ln"> 8</small><code data-lineno=" 8">     <span class="operator">*</span> <span class="punctuation">@param</span> n <span class="name class">Die</span> <span class="name class">Zahl</span><span class="punctuation">,</span> deren <span class="name class">Quadratwurzel</span> berechnet werden soll <span class="punctuation">(</span>n <span class="operator">&gt;=</span> <span class="literal number integer">0</span><span class="punctuation">)</span>

<ld-topic id="beispielhafte-verwendung-von-gpt-4-1-9"><h2>Beispielhafte Verwendung von GPT-4.1</h2><ld-scrollable class="llm-chat"><p class="rubric">8. Schritt: Etwas Fordern, dass nicht bzw. nur begrenzt sinnvoll ist</p><div class="compound llm-chat-user"><p>Erzeuge mir ein einfaches npm Build-Script, dass Prettier verwendet, um den Code zu formatieren. Der Code soll eine maximale Breite von 70 Zeichen haben.</p></div><div class="compound llm-chat-agent incremental"><p>Hier ist ein einfaches npm Build-Script, das Prettier verwendet, um den Code zu formatieren. Die maximale Zeilenbreite ist auf 70 Zeichen gesetzt.</p><p><em>1. package.json</em></p><p>Das Format-Script und die Prettier-Dependency sind enthalten:</p><pre class="code json literal-block"><code><span class="punctuation">{</span>

<ld-topic class="new-subsection transition-move-to-top" id="beispielhafte-verwendung-von-claude-sonnet-4-thinking"><h2>Beispielhafte Verwendung von Claude Sonnet 4 Thinking</h2></ld-topic>
<ld-topic id="beispielhafte-verwendung-von-claude-sonnet-4-thinking-1"><h2>Beispielhafte Verwendung von Claude Sonnet 4 Thinking</h2><p>Das Ziel ist (auch hier) die Generierung einer Kommandozeilenanwendung zur Berechnung der Quadratwurzel einer Zahl mit vorgegebener, aber beliebiger Genauigkeit.</p><p>Der Unterschied ist jedoch, dass wir versuchen das ganze Projekt in einem Zug generieren zu lassen, in dem wir einen Prompt erstellen, der „alle“ Anforderungen des Projekts beschreibt.</p></ld-topic>
<ld-topic id="beispielhafte-verwendung-von-claude-sonnet-4-thinking-2"><h2>Beispielhafte Verwendung von Claude Sonnet 4 Thinking</h2><ld-scrollable class="llm-chat"><p class="rubric">Initialer Prompt</p><div class="compound llm-chat-user"><p>Bitte generiere mir ein Java-Kommandozeilenprogramm zur Berechung der Quadratwurzel unter Verwendung der Newton-Raphson-Methode. Die Anforderungen sind:</p><ul class="simple"><li><p>Es soll möglich sein die gewünschte Anzahl an Nachkommastellen anzugeben.</p></li><li><p>Die Methode zur Berechnung der Quadratwurzel soll auch aus anderem Code heraus aufrufbar sein.</p></li><li><p>Die Methode soll robust sein bei fehlerhaften Eingaben und ggf. aussagekräftige Ausnahmen werfen.</p></li><li><p>Die Methode zur Berechnung der Quadratwurzel soll über eine umfassende Dokumentation verfügen, die auch alle Sonderfälle und Ausnahmen dokumentiert.</p></li><li><p>Es soll nach Möglichkeit nur eine Datei generiert werden, um eine optionale Verwendung als Skript einfach zu ermöglichen.</p></li><li><p>Das Programm soll die neueste Version von Java verwenden.</p></li><li><p>Alle verwendeten Bibliotheken und Tools sollen auf dem neuesten Stand sein.</p></li><li><p>Es soll ein Build-Skript geben, dass den Code formatiert und testet. Bei der Codeformatierung soll insbesondere eine maximale Zeilenlänge von 70 Zeichen eingehalten werden. Die Tests sollen die Methode, die die Berechnung durchführt, umfassend testen; inkl. Sonderfälle. Es soll auch eine Codeabdeckung berechnet werden und nach Möglichkeit 100% Branch-Coverage erreicht werden.</p></li></ul></div></ld-scrollable></ld-topic>
<ld-topic id="beispielhafte-verwendung-von-claude-sonnet-4-thinking-3"><h2>Beispielhafte Verwendung von Claude Sonnet 4 Thinking</h2><ld-scrollable class="llm-chat"><p class="rubric">(<span class="eng">Thought Process</span>)</p><div class="compound llm-chat-agent"><p><code class="xml"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>think</span><span class="punctuation">&gt;</span></span></code></p><p>Das ist eine umfassende Anforderung für ein Java-Kommandozeilenprogramm. Lass mich die Anforderungen durchgehen:</p><ol class="arabic simple"><li><p>Java-Kommandozeilenprogramm zur Berechnung der Quadratwurzel mit Newton-Raphson-Methode</p></li><li><p>Anzahl der Nachkommastellen soll konfigurierbar sein</p></li><li><p>Methode soll aus anderem Code aufrufbar sein</p></li><li><p>Robust bei fehlerhaften Eingaben mit aussagekräftigen Ausnahmen</p></li><li><p>Umfassende Dokumentation inkl. Sonderfälle</p></li><li><p>Nur eine Datei wenn möglich (für Skript-Verwendung)</p></li><li><p>Neueste Java-Version</p></li><li><p>Neueste Bibliotheken</p></li><li><p>Build-Skript mit Formatierung (max 70 Zeichen Zeilenlänge) und Tests</p></li><li><p>Umfassende Tests inkl. Sonderfälle</p></li><li><p>100% Branch-Coverage angestrebt</p></li></ol><p>Ich sollte zuerst schauen, was im aktuellen Projektverzeichnis ist, und dann eine Struktur aufbauen.</p><p>Newton-Raphson für Quadratwurzel:

<ld-topic id="beispielhafte-verwendung-von-claude-sonnet-4-thinking-6"><h2>Beispielhafte Verwendung von Claude Sonnet 4 Thinking</h2><ld-story><p class="rubric">Zusammenfassung</p><ul class="incremental-list"><li><p>Aufwand: ca. 30 Minuten (ca. 15 Minuten für den Prompt und ca. 15 Minuten für Claude Sonnet).</p></li><li><p>Die Generierung musste explizit terminiert werden, da der Agent beim Ausführen der Anwendung nicht in der Lage war diese korrekt zu bedienen und in einer Endlos-Schleife hing.</p></li><li><p>Der Code verwendet eigene Exception für Standarfälle. Dies ist ungeschickt.</p></li><li><p>Projektstruktur und Tests entsprechen den Erwartungen.</p></li><li><p>Die verwendeten Libraries waren auf den Ständen, die bei GPT nach der Aktualisierung verwendet wurden. D. h. nicht aktuell.</p></li><li><p>Es wurden noch einige weitere Dateien generiert, die nicht gefordert wurden: README.md zum Beispiel mit Lizenzinformationen...</p></li><li><p>Anwendung funktioniert und (viele) Tests auch - wenn man diese manuell ausführt.</p><p>Achtung aufgrund des Testens der main Methode welche <code class="java"><span class="name class">System</span><span class="punctuation">.</span>exit</code> Aufrufe hat kommt es zu Fehlern!</p><p>Durch einen weiteren Prompt mit dem Fehler konnte dies behoben werden. Dabei wurde auch gleich ein Test fachlich korrigiert (Thinking Model). Leider wurde auch das Build-Skript abgeändert und (wieder) veraltete Versionen der Tools eingetragen.</p></li><li><p>Die Codeabdeckung ist gut, aber die meisten Sonderfälle werden nicht abgedeckt.</p></li><li><p>Das Build-Skript funktionierte erst nicht, da die Versionen nicht korrekt ermittelt wurden!</p></li><li><p>Der Code ist besser modularisiert in mehrere Methoden wodurch das Verständnis gefördert wird.</p></li><li><p>Es wurden Hilfsmethoden für anzunehmende gängige Fälle implementiert.</p></li></ul></ld-story></ld-topic>
<ld-topic id="sicherheit-und-generierter-code"><h2>Sicherheit und generierter Code</h2><blockquote class="epigraph"><p><strong>AI firm DeepSeek writes less-secure code for groups China disfavors</strong></p><p>The Chinese artificial intelligence engine DeepSeek often refuses to help programmers or gives them code with major security flaws when they say they are working for the banned spiritual movement Falun Gong or others considered sensitive by the Chinese government, new research shows.</p><p>The findings,[...], underscore how politics shapes artificial intelligence efforts during a geopolitical race for technology prowess and influence.</p><p class="attribution">—<a class="reference external" href="https://www.washingtonpost.com/technology/2025/09/16/deepseek-ai-security/">16.9.2025 - Washington Post</a></p></blockquote></ld-topic>
