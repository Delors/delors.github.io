<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}

<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"

    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"

    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"

<ld-topic class="new-section transition-fade" id="einfuhrung-in-virtualisierung-und-container"><h2>Einführung in Virtualisierung und Container</h2></ld-topic>
<ld-topic id="virtualisierung-allg-definition"><h2>Virtualisierung - allg. Definition</h2><blockquote class="epigraph"><p>Virtualisierung bezeichnet in der Informatik die <strong>Nachbildung eines Hard- oder Software-Objekts durch ein ähnliches Objekt vom selben Typ mit Hilfe einer Abstraktionsschicht</strong>.</p><p><span class="incremental">Dadurch lassen sich virtuelle (d. h. nicht-physische) Geräte oder Dienste wie emulierte Hardware, Betriebssysteme, Datenspeicher oder Netzwerkressourcen erzeugen.</span></p><p><span class="incremental">Dies erlaubt es etwa, Computer-Ressourcen (insbesondere im Server-Bereich) transparent zusammenzufassen oder aufzuteilen, oder ein Betriebssystem innerhalb eines anderen auszuführen. Dadurch können u. a. mehrere Betriebssysteme auf einem physischen Server oder „Host“ ausgeführt werden.</span></p><p class="attribution">—<a class="reference external" href="https://de.wikipedia.org/wiki/Virtualisierung_(Informatik)">Stand 5. Oktober 2025 - Wikipedia</a></p></blockquote></ld-topic>
<ld-topic id="motivation-warum-virtualisierung"><h2>Motivation - Warum Virtualisierung?</h2><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>Moderne Softwareentwicklung steht vor verschiedenen Herausforderungen:</p><ul class="incremental-list simple"><li><p><strong>Heterogene Umgebungen</strong>: Software muss auf verschiedenen Betriebssystemen und Hardware-Konfigurationen laufen.</p></li><li><p><strong>Skalierbarkeit</strong>: (Server-)Anwendungen müssen flexibel skalieren können.</p></li><li><p><strong>Isolation</strong>: Verschiedene (Server-)Anwendungen sollen sich nicht gegenseitig beeinträchtigen.</p></li><li><p><strong>Portabilität</strong>: Code soll einfach zwischen verschiedenen Umgebungen übertragbar sein.</p></li><li><p><strong>Ressourceneffizienz</strong>: Hardware soll optimal genutzt werden.</p></li></ul><div class="accentuate incremental"><p>Virtualisierung und Containerisierung bieten Lösungen für diese Herausforderungen.</p></div></aside></ld-topic>
<ld-topic id="was-ist-virtualisierung"><h2>Was ist Virtualisierung?</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p><strong>Virtualisierung</strong><a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a> ermöglicht es mehrere virtuelle Maschinen (VMs) oder Container auf einer physischen Hardware auszuführen.</p></aside><ld-deck class="incremental"><ld-card><p class="rubric">Ziel der Virtualisierung</p><ul class="incremental-list simple"><li><p>Abstraktion der Hardware</p></li><li><p>Isolation zwischen Anwendungen</p></li><li><p>Optimale Ressourcennutzung</p></li><li><p>Flexibilität bei der Bereitstellung</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Arten der Virtualisierung</p><ul class="incremental-list simple"><li><p><strong>Bare-Metal Virtualisierung</strong>: Virtualisierung direkt auf der Hardware</p></li><li><p><strong>Hosted Virtualisierung</strong>: Virtualisierung auf einem Host-Betriebssystem</p></li><li><p><strong>Containervirtualisierung</strong>: Virtualisierung von Systemressourcen eines Betriebssystems, teilt sich jedoch den Kernel mit dem Host-Betriebssytem.</p></li><li><p><strong>Anwendungsvirtualisierung</strong>: Ausführung einer Anwendung in einer exclusiven, teilweise oder vollständig isolierten virtuellen Umgebung.</p></li></ul></ld-card></ld-deck><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Im Folgenden konzentrieren wir uns auf Virtualisierung von serverseitigen Anwendungen und von Softwareentwicklung.</p></aside></aside></ld-topic>

</div></ld-topic>
<ld-topic id="bare-metal-virtualisierung"><h2>Bare-Metal Virtualisierung</h2><ld-deck><ld-card><p>Bei der <strong>Bare-Metal Virtualisierung</strong> (auch Type-1 Hypervisor) läuft die Virtualisierungsschicht direkt auf der Hardware, ohne ein Host-Betriebssystem.</p><ld-deck><ld-card><p class="rubric"><span class="success">Vorteile</span></p><ul class="incremental-list positive-list simple"><li><p><strong>Bessere Performance</strong>: Kein Overhead durch Host-OS</p></li><li><p><strong>Höhere Sicherheit</strong>: Weniger Angriffsfläche</p></li><li><p><strong>Direkter Hardware-Zugriff</strong>: Optimale Ressourcennutzung</p></li><li><p><strong>Enterprise-fähig</strong>: Für produktive Umgebungen geeignet</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric"><span class="fail">Nachteile</span></p><ul class="incremental-list negative-list simple"><li><p><strong>Komplexität</strong>: Schwerer zu installieren und zu verwalten</p></li><li><p><strong>Hardware-Abhängigkeit</strong>: Hardware-Unterstützung erforderlich</p></li><li><p><strong>Kosten</strong>: ggf. Lizenzkosten für Hypervisor-Software</p></li></ul></ld-card></ld-deck></ld-card><ld-card class="incremental"><p><strong>Beispiele für Bare-Metal Hypervisoren:</strong></p><ul class="simple"><li><p>Xen</p></li><li><p>VMware vSphere/ESXi</p></li><li><p>Microsoft Hyper-V (Server)</p></li><li><p>Citrix Hypervisor</p></li><li><p>...</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="hosted-virtualisierung"><h2>Hosted Virtualisierung</h2><ld-deck><ld-card><p>Bei der <strong>Hosted Virtualisierung</strong> (auch Type-2 Hypervisor) läuft die Virtualisierungsschicht als Anwendung auf einem Host-Betriebssystem.</p><ld-deck><ld-card><p class="rubric"><span class="success">Vorteile</span></p><ul class="incremental-list positive-list simple"><li><p><strong>Einfache Installation</strong>: Wie normale Software</p></li><li><p><strong>Flexibilität</strong>: Verschiedene Host-Betriebssysteme möglich (ggf. über Hardwarearchitekturgrenzen hinweg)</p></li><li><p><strong>Entwicklungsumgebung</strong>: Ideal für Tests und Entwicklung</p></li><li><p><strong>Benutzerfreundlich</strong>: Grafische Oberflächen verfügbar</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric"><span class="fail">Nachteile</span></p><ul class="incremental-list negative-list simple"><li><p><strong>Performance-Overhead</strong>: Host-OS verbraucht Ressourcen</p></li><li><p><strong>Sicherheitsrisiken</strong>: Host-OS als zusätzliche Angriffsfläche</p></li><li><p><strong>Begrenzte Skalierbarkeit</strong>: Weniger VMs pro Host möglich</p></li></ul></ld-card></ld-deck></ld-card><ld-card class="incremental"><p><strong>Beispiele für Hosted Hypervisoren:</strong></p><ul class="simple"><li><p>Qemu (Open Source - kann Virtualisierung und Emulation)<a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a></p></li><li><p>VMware Workstation</p></li><li><p>Oracle VirtualBox</p></li><li><p>Parallels Desktop</p></li><li><p>...</p></li></ul></ld-card></ld-deck><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-2" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-2">2</a><span class="fn-bracket">]</span></span><p>Qemu kann auch zusammen mit KVM betrieben werden.</p></aside></aside></ld-topic>
<ld-topic class="new-section transition-fade" id="container-technologien"><h2>Container-Technologien</h2></ld-topic>
<ld-topic id="was-sind-container"><h2>Was sind Container?</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p><strong>Container</strong> sind leichtgewichtige, portable Einheiten, die Anwendungen zusammen mit allen notwendigen Abhängigkeiten (Code, Runtime, Bibliotheken) verpacken. Sie teilen sich den Kernel des Host-Betriebssystems, bieten aber isolierte Prozess- und Nutzerbereiche, wodurch Anwendungen unabhängig voneinander laufen können.</p></aside><div class="incremental"><p><strong>Beispiele für die Isolierung (Linux)</strong></p><ul class="simple"><li><p><strong>Namespaces</strong>: Isolation von Nutzern, Prozessen, Netzwerk, Dateisystem</p></li><li><p><strong>Control Groups (cgroups)</strong>: Ressourcenbeschränkung (CPU, Speicher, ...)</p></li><li><p><strong>Union File Systems</strong>: Effiziente Speicherung von Layern</p></li></ul></div><ld-supplemental><p class="rubric">Beispiele für Container-Isolierung unter Linux</p><dl class="field-list simple"><dt>Namespaces<span class="colon">:</span></dt><dd><p>Isolieren unterschiedliche Systemressourcen, sodass Prozesse in einem Container „ihre eigene Welt“ sehen: Jeder Container hat seine eigenen Benutzer- und Gruppen und sieht nur seine eigenen Prozesse. Prozesse aus anderen Containern oder dem Host sind unsichtbar. Container haben eigene Netzwerkschnittstellen, IP-Adressen und Ports und können z. B. auf Port 80 lauschen, ohne Host oder andere Container zu stören. Weiterhin hat jeder Container eine eigene Sicht auf das Dateisystem. Ein Container kann sein Root-Dateisystem haben, ohne den Host oder andere Container zu verändern.</p></dd><dt>Control Groups (cgroups)<span class="colon">:</span></dt><dd><p>Regeln und beschränken Ressourcennutzung, um fairen Zugriff zu gewährleisten: Insbesondere CPU-Zeit, Speicherbenutzung und Netzwerk und I/O Limits.</p></dd><dt>Union File Systems (UnionFS / OverlayFS)<span class="colon">:</span></dt><dd><p>Ermöglichen effiziente, schichtweise Speicherung, da zum Beispiel das Basis-Image + Container-spezifische Änderungen als separate Layer gespeichert werden.</p></dd></dl></ld-supplemental></ld-topic>

<ld-topic id="vergleich-container-vs-vms"><h2>Vergleich: Container vs. VMs</h2><ld-grid class="dd-margin-left-2em default-layout"><ld-cell style="align-self:auto;"><p class="rubric">Virtual Machines</p><dl class="incremental-list field-list simple"><dt><span class="success">Vorteile</span><span class="colon">:</span></dt><dd><ul class="positive-list simple"><li><p>Vollständige Isolation</p></li><li><p>Verschiedene Betriebssysteme möglich</p></li><li><p>Hohe Sicherheit</p></li></ul></dd><dt><span class="fail">Nachteile</span><span class="colon">:</span></dt><dd><ul class="negative-list simple"><li><p>Hoher Ressourcenverbrauch</p></li><li><p>Langsame Startzeiten</p></li><li><p>Komplexe Verwaltung</p></li><li><p>Weniger portabel</p></li></ul></dd></dl></ld-cell><ld-cell style="align-self:auto;"><p class="rubric">Container</p><dl class="incremental-list field-list simple"><dt><span class="success">Vorteile</span><span class="colon">:</span></dt><dd><ul class="positive-list simple"><li><p>Schneller Start</p></li><li><p>Geringer Ressourcenverbrauch</p></li><li><p>Hohe Portabilität</p></li><li><p>Einfache Skalierung</p></li></ul></dd><dt><span class="fail">Nachteile</span><span class="colon">:</span></dt><dd><ul class="negative-list simple"><li><p>Weniger Isolation</p></li><li><p>Gleiches Betriebssystem erforderlich</p></li><li><p>Sicherheitsrisiken bei Root-Zugriff</p></li><li><p>Abhängigkeit vom Host-OS</p></li></ul></dd></dl></ld-cell></ld-grid></ld-topic>
<ld-topic class="new-section" id="containerisierung-mit-docker"><h2>Containerisierung mit Docker</h2></ld-topic>
<ld-topic id="docker-container-infrastruktur"><h2>Docker - Container-Infrastruktur</h2><p><strong>Docker</strong> ist eine Open-Source-Plattform zur Entwicklung, Bereitstellung und Verwaltung von containerisierten Anwendungen.</p><ld-deck><ld-card><p class="rubric">Docker-Komponenten</p><ul class="incremental-list simple"><li><p><strong>Docker Engine</strong>: Runtime für Container</p></li><li><p><strong>Docker Images</strong>: Vorlagen für Container</p></li><li><p><strong>Docker Containers</strong>: Laufende Instanzen</p></li><li><p><strong>Docker Registry</strong>: Repository für Images</p></li><li><p><strong>Docker Compose</strong>: Orchestrierung mehrerer Container</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Docker-Architektur</p><ul class="incremental-list simple"><li><p><strong>Docker Daemon</strong>: Hintergrundprozess der Images lädt sowie Container verwaltet und steuert</p></li><li><p><strong>Docker Client</strong>: Kommandozeilen-Tool zum Interagieren mit dem Daemon.</p></li><li><p><strong>Docker Registry</strong>: Speicher für Images</p></li><li><p><strong>Docker Hub</strong>: Öffentliche Registry</p></li></ul></ld-card></ld-deck></ld-topic>

<ld-topic id="docker-images-und-container"><h2>Docker-Images und Container</h2><p>Ein <strong>Docker-Image</strong> ist eine unveränderliche Vorlage, die alle notwendigen Komponenten für eine Anwendung enthält.</p><ld-deck><ld-card><p class="rubric">Image-Eigenschaften</p><ul class="incremental-list simple"><li><p><strong>Layered Architecture</strong>: Images bestehen aus mehreren Layern</p></li><li><p><strong>Immutable</strong>: Images können nicht verändert werden</p></li><li><p><strong>Portable</strong>: Funktionieren auf verschiedenen Systemen</p></li><li><p><strong>Versioned</strong>: Verschiedene Versionen eines Images möglich</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Container-Lifecycle</p><ul class="incremental-list simple"><li><p><strong>Create</strong>: Container aus Image erstellen</p></li><li><p><strong>Start</strong>: Container starten</p></li><li><p><strong>Run</strong>: Container ausführen</p></li><li><p><strong>Stop</strong>: Container stoppen</p></li><li><p><strong>Remove</strong>: Container löschen</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="docker-befehle"><h2>Docker-Befehle</h2><dl class="incremental-list field-list simple"><dt>Image-Verwaltung<span class="colon">:</span></dt><dd><ul class="simple"><li><p><code class="console"><span class="name function">docker</span> pull <span class="operator">&lt;</span>image<span class="operator">&gt;</span></code> - Image herunterladen</p></li><li><p><code class="console"><span class="name function">docker</span> images</code> - Alle Images anzeigen</p></li><li><p><code class="console"><span class="name function">docker</span> build <span class="name variable">-t</span> <span class="operator">&lt;</span>name<span class="operator">&gt;</span> <span class="name class">.</span></code> - Image erstellen</p></li><li><p><code class="console"><span class="name function">docker</span> rmi <span class="operator">&lt;</span>image<span class="operator">&gt;</span></code> - Image löschen</p></li></ul></dd><dt>Container-Verwaltung<span class="colon">:</span></dt><dd><ul class="simple"><li><p><code class="console"><span class="name function">docker</span> run <span class="operator">&lt;</span>image<span class="operator">&gt;</span></code> - Container starten</p></li><li><p><code class="console"><span class="name function">docker</span> <span class="name function">ps</span></code> - Laufende Container anzeigen</p></li><li><p><code class="console"><span class="name function">docker</span> stop <span class="operator">&lt;</span>container<span class="operator">&gt;</span></code> - Container stoppen</p></li><li><p><code class="console"><span class="name function">docker</span> <span class="name function">rm</span> <span class="operator">&lt;</span>container<span class="operator">&gt;</span></code> - Container löschen</p></li></ul></dd><dt>Informationen<span class="colon">:</span></dt><dd><ul class="simple"><li><p><code class="console"><span class="name function">docker</span> logs <span class="operator">&lt;</span>container<span class="operator">&gt;</span></code> - Container-Logs anzeigen</p></li><li><p><code class="console"><span class="name function">docker</span> <span class="name class">exec</span> <span class="name variable">-it</span> <span class="operator">&lt;</span>container<span class="operator">&gt;</span> /bin/bash</code> - In Container einloggen</p></li></ul></dd></dl></ld-topic>
<ld-topic class="new-section transition-fade" id="container-orchestrierung"><h2>Container Orchestrierung</h2></ld-topic>
<ld-topic id="was-ist-container-orchestrierung"><h2>Was ist Container Orchestrierung?</h2><p><strong>Container Orchestrierung</strong> ist die Automatisierung der Bereitstellung, Verwaltung, Skalierung und Vernetzung von Container-Anwendungen.</p><div class="accentuate incremental"><p>Gegenstand der Orchestrierung:</p><ul class="incremental-list simple"><li><p><strong>Deployment</strong>: Automatische Bereitstellung von Containern</p></li><li><p><strong>Scaling</strong>: Dynamische Skalierung basierend auf Last</p></li><li><p><strong>Load Balancing</strong>: Verteilung der Anfragen</p></li><li><p><strong>Service Discovery</strong>: Auffinden von Services</p></li><li><p><strong>Health Monitoring</strong>: Überwachung der Container-Gesundheit</p></li><li><p><strong>Rolling Updates</strong>: Updates ohne Downtime</p></li></ul></div></ld-topic>
<ld-topic id="container-orchestrierungs-tools"><h2>Container Orchestrierungs-Tools</h2><ld-grid class="default-layout"><ld-cell class="width-30" style="align-self:auto;"><p class="rubric">Kubernetes</p><ul class="incremental-list simple"><li><p><strong>Open Source</strong> von Google</p></li><li><p><strong>De-facto Standard</strong> für Container Orchestrierung</p></li><li><p><strong>Umfangreiche Features</strong></p></li><li><p><strong>Große Community</strong></p></li><li><p><strong>Komplexe Einrichtung</strong></p></li></ul></ld-cell><ld-cell class="width-30 incremental" style="align-self:auto;"><p class="rubric">Docker Swarm</p><ul class="incremental-list simple"><li><p><strong>Native Docker-Lösung</strong></p></li><li><p><strong>Einfache Einrichtung</strong></p></li><li><p><strong>Weniger Features</strong> als Kubernetes</p></li><li><p><strong>Gut für kleinere Projekte</strong></p></li><li><p><strong>Einfache Verwaltung</strong></p></li></ul></ld-cell><ld-cell class="width-30 incremental" style="align-self:auto;"><p class="rubric">Apache Mesos</p><ul class="incremental-list simple"><li><p><strong>Distributed Systems Kernel</strong></p></li><li><p><strong>Unterstützt verschiedene Frameworks</strong></p></li><li><p><strong>Hochskalierbar</strong></p></li><li><p><strong>Komplexe Architektur</strong></p></li><li><p><strong>Weniger verbreitet</strong></p></li></ul></ld-cell></ld-grid></ld-topic>
<ld-topic class="transition-fade" id="exemplarische-verwendung-von-docker"><h2>Exemplarische Verwendung von Docker</h2><ld-story><p class="rubric">Docker-basiertes Deployment einer Web-Anwendung</p><p>Entwicklung und Deployment einer einfachen Web-Anwendung mit Docker.</p><ol class="arabic incremental-list simple"><li><p><strong>Docker-Installation prüfen</strong></p></li><li><p><strong>Einfache Web-Anwendung erstellen</strong></p></li><li><p><strong>Dockerfile erstellen</strong></p></li><li><p><strong>Docker-Image bauen</strong></p></li><li><p><strong>Container starten und testen</strong></p></li><li><p>[<strong>Docker Compose für Multi-Container-Setup</strong>]</p></li></ol><div class="compound incremental"><p class="rubric">Schritt 1: Docker-Installation prüfen</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="comment single"># Docker-Version prüfen</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name function">docker</span> <span class="name variable">--version</span>
</code><small class="ln">3</small><code data-lineno="3">
</code><small class="ln">4</small><code data-lineno="4"><span class="comment single"># Docker-Status prüfen</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="name function">docker</span> info
</code><small class="ln">6</small><code data-lineno="6">
</code><small class="ln">7</small><code data-lineno="7"><span class="comment single"># Ersten Container testen</span>
</code><small class="ln">8</small><code data-lineno="8"><span class="name function">docker</span> run hello-world</code></pre></div><div class="compound incremental"><p class="rubric">Schritt 2: Web-Anwendung erstellen (<span class="docutils literal">index.html</span>)</p><pre class="code html copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="comment preproc"><span class="punctuation">&lt;!</span>DOCTYPE html<span class="punctuation">&gt;</span></span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>html</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>head</span><span class="punctuation">&gt;</span></span><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>title</span><span class="punctuation">&gt;</span></span>Docker Demo App<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>title</span><span class="punctuation">&gt;</span></span><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>head</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 4</small><code data-lineno=" 4"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>body</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h2</span><span class="punctuation">&gt;</span></span>Willkommen zur Docker-Demo!<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h2</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>Diese Anwendung läuft in einem Docker-Container.<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>Aktuelle-Zeit: <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>span</span> <span class="name attribute">id</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>time<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>span</span><span class="punctuation">&gt;</span></span><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>script</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 9</small><code data-lineno=" 9">        document.getElementById('time').textContent =
</code><small class="ln">10</small><code data-lineno="10">            new Date().toLocaleString();
</code><small class="ln">11</small><code data-lineno="11">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>script</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">12</small><code data-lineno="12"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>body</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">13</small><code data-lineno="13"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>html</span><span class="punctuation">&gt;</span></span></code></pre></div><div class="compound incremental"><p class="rubric">Schritt 3: <span class="docutils literal">Dockerfile</span> erstellen</p><pre class="code dockerfile copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"># Basis-Image verwenden (Alpine-Linux mit einem vorinstallierten nginx)
</code><small class="ln"> 2</small><code data-lineno=" 2">FROM nginx:alpine
</code><small class="ln"> 3</small><code data-lineno=" 3">
</code><small class="ln"> 4</small><code data-lineno=" 4"># Arbeitsverzeichnis setzen innerhalb des Containers
</code><small class="ln"> 5</small><code data-lineno=" 5">WORKDIR /usr/share/nginx/html
</code><small class="ln"> 6</small><code data-lineno=" 6">
</code><small class="ln"> 7</small><code data-lineno=" 7"># HTML-Datei kopieren (kopiert lokale Datei in den Container relativ zum WORKDIR)
</code><small class="ln"> 8</small><code data-lineno=" 8">COPY index.html .
</code><small class="ln"> 9</small><code data-lineno=" 9">
</code><small class="ln">10</small><code data-lineno="10"># Port 80 freigeben
</code><small class="ln">11</small><code data-lineno="11">EXPOSE 80
</code><small class="ln">12</small><code data-lineno="12">
</code><small class="ln">13</small><code data-lineno="13"># Nginx im Vordergrund starten (da sich sond der Docker-Container gleich beendet)
</code><small class="ln">14</small><code data-lineno="14">CMD ["nginx", "-g", "daemon off;"]</code></pre></div><div class="compound incremental"><p class="rubric">Schritt 4: Docker-Image bauen</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="comment single"># Image bauen mit dem Tag "webapp-demo"</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name function">docker</span> build <span class="name variable">-t</span> webapp-demo <span class="name class">.</span>
</code><small class="ln">3</small><code data-lineno="3">
</code><small class="ln">4</small><code data-lineno="4"><span class="comment single"># Images anzeigen</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="name function">docker</span> images
</code><small class="ln">6</small><code data-lineno="6">
</code><small class="ln">7</small><code data-lineno="7"><span class="comment single"># Image-Details anzeigen</span>
</code><small class="ln">8</small><code data-lineno="8"><span class="name function">docker</span> inspect webapp-demo</code></pre></div><div class="compound incremental"><p class="rubric">Schritt 5: Container starten und testen</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="comment single"># Container mit dem Namen "webapp-container" im Hintergrund (-d) starten</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="name function">docker</span> run <span class="name variable">-d</span> <span class="name variable">-p</span> <span class="literal number integer">8080</span>:80 <span class="name variable">--name</span> webapp-container webapp-demo
</code><small class="ln"> 3</small><code data-lineno=" 3">
</code><small class="ln"> 4</small><code data-lineno=" 4"><span class="comment single"># Container-Status prüfen</span>
</code><small class="ln"> 5</small><code data-lineno=" 5"><span class="name function">docker</span> <span class="name function">ps</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">
</code><small class="ln"> 7</small><code data-lineno=" 7"><span class="comment single"># In Browser testen: http://localhost:8080</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9"><span class="comment single"># Container-Logs anzeigen</span>
</code><small class="ln">10</small><code data-lineno="10"><span class="name function">docker</span> logs webapp-container
</code><small class="ln">11</small><code data-lineno="11">
</code><small class="ln">12</small><code data-lineno="12"><span class="comment single"># Container stoppen</span>
</code><small class="ln">13</small><code data-lineno="13"><span class="name function">docker</span> stop webapp-container
</code><small class="ln">14</small><code data-lineno="14">
</code><small class="ln">15</small><code data-lineno="15"><span class="comment single"># Container (nicht Container-Image) löschen</span>
</code><small class="ln">16</small><code data-lineno="16"><span class="name function">docker</span> <span class="name function">rm</span> webapp-container</code></pre></div><div class="compound incremental"><p class="rubric">Schritt 6: Docker Compose für Multi-Container (<span class="docutils literal">docker-compose.yml</span>)</p><pre class="code yaml copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1">version<span class="punctuation">:</span> <span class="literal string">'3.8'</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">services<span class="punctuation">:</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">web<span class="punctuation">:</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    build<span class="punctuation">:</span> .
</code><small class="ln"> 5</small><code data-lineno=" 5">    ports<span class="punctuation">:</span> <span class="punctuation">[</span><span class="literal string">"8080:80"</span><span class="punctuation">]</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    depends_on<span class="punctuation">:</span> <span class="punctuation">[</span>db<span class="punctuation">]</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    environment<span class="punctuation">:</span> <span class="punctuation">[</span>DB_HOST=db<span class="punctuation">]</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9">db<span class="punctuation">:</span>
</code><small class="ln">10</small><code data-lineno="10">    image<span class="punctuation">:</span> postgres<span class="punctuation">:</span><span class="literal number integer">13</span>
</code><small class="ln">11</small><code data-lineno="11">    environment<span class="punctuation">:</span> <span class="punctuation">[</span>POSTGRES_DB=demo<span class="punctuation">,</span> POSTGRES_USER=demo<span class="punctuation">,</span> POSTGRES_PASSWORD=demo123<span class="punctuation">]</span>
</code><small class="ln">12</small><code data-lineno="12">    volumes<span class="punctuation">:</span> <span class="punctuation">[</span>postgres_data<span class="punctuation">:</span>/var/lib/postgresql/data<span class="punctuation">]</span> <span class="comment single"># persistent</span>
</code><small class="ln">13</small><code data-lineno="13">
</code><small class="ln">14</small><code data-lineno="14">volumes<span class="punctuation">:</span> <span class="punctuation">{</span>postgres_data<span class="punctuation">:</span><span class="punctuation">}</span></code></pre></div><div class="compound incremental"><p class="rubric">Schritt 7: Anwendung (bestehend aus mehreren Containern) starten:</p><pre class="code bash copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="comment single"># Multi-Container-Setup starten</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="name function">docker-compose</span> up <span class="name variable">-d</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">
</code><small class="ln"> 4</small><code data-lineno=" 4"><span class="comment single"># Status prüfen</span>
</code><small class="ln"> 5</small><code data-lineno=" 5"><span class="name function">docker-compose</span> <span class="name function">ps</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">
</code><small class="ln"> 7</small><code data-lineno=" 7"><span class="comment single"># Logs anzeigen</span>
</code><small class="ln"> 8</small><code data-lineno=" 8"><span class="name function">docker-compose</span> logs
</code><small class="ln"> 9</small><code data-lineno=" 9">
</code><small class="ln">10</small><code data-lineno="10"><span class="comment single"># Setup stoppen</span>
</code><small class="ln">11</small><code data-lineno="11"><span class="name function">docker-compose</span> down</code></pre></div></ld-story></ld-topic>
<ld-topic class="new-section" id="zusammenfassung"><h2>Zusammenfassung</h2></ld-topic>
<ld-topic id="konzepte"><h2>Konzepte</h2><ul class="incremental-list simple"><li><p><strong>Virtualisierung</strong> ermöglicht effiziente Nutzung von Hardware-Ressourcen</p></li><li><p><strong>Container</strong> bieten leichtgewichtige Alternative zu VMs</p></li><li><p><strong>Docker</strong> ist der Standard für Container-Plattformen</p></li><li><p><strong>Orchestrierung</strong> automatisiert das Management von Container-Anwendungen</p></li><li><p><strong>Multi-Container-Setups</strong> ermöglichen komplexe Anwendungsarchitekturen</p></li></ul></ld-topic>
<ld-topic id="best-practices-fur-docker"><h2>Best Practices für Docker</h2><ld-deck><ld-card><p class="rubric">Image-Erstellung</p><ul class="incremental-list simple"><li><p><strong>Non-Root User</strong> für Sicherheit</p></li><li><p><strong>Layer-Caching</strong> optimieren</p></li><li><p><strong>Security Updates</strong> regelmäßig durchführen</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Container-Management</p><ul class="incremental-list simple"><li><p><strong>Health Checks</strong> implementieren</p></li><li><p><strong>Resource Limits</strong> setzen</p></li><li><p><strong>Logging</strong> konfigurieren</p></li><li><p><strong>Backup-Strategien</strong> für Volumes</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Sicherheit</p><ul class="incremental-list simple"><li><p><strong>Minimale Images</strong> verwenden</p></li><li><p><strong>Secrets</strong> nicht im Image speichern</p></li><li><p><strong>Network Policies</strong> definieren</p></li><li><p><strong>Regelmäßige Aktualisierungen</strong> durchführen</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="ausblick"><h2>Ausblick</h2><div class="accentuate"><p>Die Container-Technologie entwickelt sich weiter:</p><ul class="incremental-list simple"><li><p><strong>Serverless Container</strong> (AWS Fargate, Azure Container Instances)</p></li><li><p><strong>WebAssembly (WASM)</strong> als Alternative zu Container</p></li><li><p><strong>Edge Computing</strong> mit Container-Technologie</p></li><li><p><strong>GitOps</strong> für automatisiertes Deployment</p></li><li><p><strong>Service Mesh</strong> für Microservice-Kommunikation</p></li></ul></div><aside class="admonition incremental" data-theme="conclusion"><p class="admonition-title" data-theme="conclusion-header"><span>Schlussfolgerung</span></p><p>Container und Virtualisierung sind fundamentale Technologien für moderne Softwareentwicklung und -deployment. Die praktische Anwendung mit Docker bietet eine solide Grundlage für weiterführende Themen wie Kubernetes und Cloud-Native-Entwicklung.</p></aside></ld-topic>
<ld-topic class="exercises" id="ubung-erste-schritte"><h2>Übung: Erste Schritte</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Webserver im Docker Container"><p class="ld-exercise-title rubric"><span>Webserver im Docker Container</span></p><p><em>Loggen Sie sich auf dem Server ein</em> und versuchen Sie alle Schritte nachvollzuziehen, die notwendig sind, um einen Docker Image mit Nginx zu bauen und danach zu starten. Orientieren Sie sich an dem Beispiel aus den Vorlesungsfolien, aber nutzen Sie eine eigene <span class="docutils literal">index.html</span>.</p><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Spezifzieren Sie beim Start des Containers ein Portmapping (z.B. <span class="docutils literal">8100:80</span>) passend zu den Ihnen zugeteilten Ports!</p></aside><p>Stellen Sie sicher, dass Ihr Server läuft in dem Sie die Webseite aufrufen.</p><p>Verfolgen Sie das Log, um die Zugriffe auf Ihre Webseite zu sehen.</p></div></ld-topic>
<ld-topic class="exercises" id="ubung-node-js-im-container"><h2>Übung: Node.js im Container</h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Node.js Server im Container laufen lassen"><p class="ld-exercise-title rubric"><span>Node.js Server im Container laufen lassen</span></p><ol class="arabic"><li><p>Kopieren Sie die Ressourcen (<a class="reference external" href="code/nodejs-exercise/player.html">player.html</a>, <a class="reference external" href="code/nodejs-exercise/admin.html">admin.html</a>, <a class="reference external" href="code/nodejs-exercise/game.js">game.js</a>, <a class="reference external" href="code/nodejs-exercise/package.json">package.json</a>) auf Ihren Server in ein neu angelegtes Verzeichnis</p></li><li><p>Ihr Docker-Image soll <a class="reference external" href="https://github.com/nodejs/docker-node/blob/main/README.md">node.js</a> und alle Ressourcen enthalten.</p><ld-supplemental><p>D. h. Ihr <span class="docutils literal">Dockerfile</span> muss eine Referenz auf ein entsprechendes Image mit node.js enhalten und die Ressource in das Dockerfile kopieren.</p></ld-supplemental></li><li><p>Passen Sie das <span class="docutils literal">Dockerfile</span> so an, dass beim Bauen des Docker-Images die benötigten Bibliotheken mit installiert werden.
Sie müssen dafür den Befehl <span class="docutils literal">npm install --production</span> während des Bauens mit Hilfe von <span class="docutils literal">RUN</span> im <span class="docutils literal">Dockerfile</span> ausführen.</p></li><li><p>Passen Sie den Kommandozeilenbefehl (<span class="docutils literal">CMD</span>) im <span class="docutils literal">Dockerfile</span> so an, dass der Node Server passend gestartet wird.</p><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Die Anwendung läuft Standardmäßig auf Port 8800.</p></aside></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:2+8nQTUPvrLCunQ7D0xYX8qB5YWUXfLKDEipopdQnEQ=:R6tuM0oiXiDqZ+9o:tatdn2Iy4Ud7KP61TWFAAXaFVrKDdFjilYFDOoQ4a5o6cRPRI9hvHJDlnypjibguG39Y/+bZxpSwbe3ynfYmoBgUeHXEL81yxU2cKcw2W+bBpt6NOXqRo5mbaZ4CIibWWlQv2zfXybwGpZLW2MrBz5KwiJOcr41rrW1EPb8mkSak0DVF6K155AvZv8l9XfYjw1FESjz05xUIZ6aV+DHcCVMF8Rp5vUnH0vLLOHp7VZ33yZ2xPeiXXVhOLkNOzma6vKiVfuPu9tHniXnafCQu4X04l5kg7fS3qwRii9vj84nfJf1Y2APPRoJ2sVvW2qKKFIcJBI40Jx5em+wxsOlEr6EKg+fbkCZgGnxrPLZWC0CoVtAO45KdH8Usr6vHo/1HiLiF/tQVRHOh6Z3JElg6vvuaeldShYcmzIRaS14dYPKtzG69s5A+Yg8K8VdYES7W0LA/cKBvaFPS7lZPx/5x8jrDb7IzWQZImy5yLuPJaTT5CTiXgF8QBbwjZ5qDAGhW573gtDHYYxI7xTQGeo09B2zzeuKc/cF92N4y/KnfI8xgjF4eVuYtdBqHUDOZZ2GYNCoXjA0RD7f6DPDO1MPOLGSXPVjLwmbyK8FD1KIAVPpyEhT3ACnmQJ6MYIuDTbCGF3X8klrxbGSy6v4cTpvnwqiQMCdwem6T8Nta839Nazut0hfpaNca1Y/dactfSJPySndUhFf3uClFq4JD3QnIbTN6wggZ42OUldc3x3u9xU+TT6x6oy7Jhow0GnwcUBmHbXVTF1maPK662mxkx/xREfSAz6aoggyff38wjl4YZllJ7BAY6LeCgET33HzC9JGjGT7ic249ATl0lgBYLSkb/djKg21huExaP2Chgzl0D44tyKSG443hzuu0fID06GnXQb8sULLew29tLVroIwU3pAaU6j6yoZi8h+2BxecDtvCwBX7dpBndEIu2ijcgmksqy4OPJCGSYoFd1g0yNB1lQxYTguW8Fdu0yfs/AM1Iw3KMLDOGCaL7NJbiVLuDWfZ+XjefufQ3p/zJ1cafZpwPOAcj9gi7qF0uWidufNNdhx5wy2NSwK8n0YDhRLKxgwZN+ANXKoCPtEPOSUegdoAaz1GGu13x15VGd5Bo5bWtFfHTRWOQ6xt8/w9x+UfNA7MV16M3PRL9joUNzgRsJ/FLJ8/sEn8J9DUwVNbKTqWpKt0twlF3fKri+THjNv1HlAS8uT0Q4Ww/XT74zmgjVXCI0SbhByol26rLzv
