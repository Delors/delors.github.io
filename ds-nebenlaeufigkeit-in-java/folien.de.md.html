<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider

    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"

            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"

</defs>

<ld-topic class="no-title center-content" id="nebenlaufigkeit"><h2>Nebenläufigkeit</h2><div class="exclamation-mark"><p>Ein gutes Verständnis von nebenläufiger Programmierung ist für die Entwicklung von verteilten Anwendungen unerlässlich, da Server immer mehrere Anfragen gleichzeitig bearbeiten.</p></div></ld-topic>
<ld-topic id="prozesse-vs-threads"><h2>Prozesse vs. Threads</h2><ld-deck class="light-image"><ld-card><object class="align-center" data="drawings/threads/threads.svg" type="image/svg+xml" role="img" aria-label="Prozesse vs. Threads"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/threads/fibres.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/threads/virtual_threads.svg" type="image/svg+xml" role="img"></object></ld-card></ld-deck><ld-supplemental><ul class="simple"><li><p>Prozesse sind voneinander isoliert und können nur über explizite Mechanismen miteinander kommunizieren; Prozesse teilen sich nicht denselben Adressraum.</p></li><li><p>Alle Threads eines Prozesses teilen sich denselben Adressraum. <em>Native Threads</em> sind vom Betriebssystem unterstützte Threads, die direkt vom Betriebssystem verwaltet werden. Standard Java Threads sind <em>Native Threads</em>.</p></li><li><p><em>Fibres</em> (auch <em>Coroutines</em>) nutzen immer kooperatives Multitasking. D. h. ein Fibre gibt die Kontrolle an eine andere Fibre explizit ab. (Früher auch als <em>Green Threads</em> bezeichnet.) Diese sind für das Betriebssystem unsichtbar.</p></li><li><p>Ab Java 21 unterstützt Java nicht nur klassische (native) Threads sondern zusätzlich auf Virtual Threads. Letztere erlauben insbesondere eine sehr natürliche Programmierung von Middleware, die sich um die Parallelisierung/Nebenläufigkeit kümmert.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="kommunikation-und-synchronisation-mit-hilfe-von-monitoren"><h2>Kommunikation und Synchronisation mit Hilfe von <em>Monitoren</em></h2><p>Ein <em>Monitor</em> ist ein Objekt, bei dem die Methoden im wechselseitigen Ausschluss (engl. <em>mutual exclusion</em>) ausgeführt werden.</p><object class="light-image align-right" data="drawings/threads/monitor.svg" type="image/svg+xml" role="img" aria-label="Monitor"></object><p>Bedingungs-Synchronisation</p><ul class="simple"><li><p>drückt eine Bedingung für die Reihenfolge der Ausführung von Operationen aus.</p></li><li><p>z. B. können Daten erst dann aus einem Puffer entfernt werden, wenn Daten in den Puffer eingegeben wurden.</p></li><li><p>Java unterstützt pro Monitor nur eine (anonyme) Bedingungs-Variable, mit den klassischen Methoden <code class="java">wait</code> und <code class="java">notify</code> bzw. <code class="java">notifyAll</code>.</p></li></ul><ld-supplemental><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>In Java findet der wechselseitige Ausschluss nur zwischen solchen Methoden statt, die explizit als <code class="java"><span class="keyword">synchronized</span></code> deklariert wurden.</p></aside><p><em>Monitore</em> sind nur ein Modell (Alternativen: <em>Semaphores</em>, <em>Message Passing</em>), das die Kommunikation und Synchronisation von Threads ermöglicht. Es ist das Standardmodell in Java und wird von der Java Virtual Machine (JVM) unterstützt.</p></ld-supplemental></ld-topic>
<ld-topic id="kommunikation-zwischen-threads-mit-hilfe-von-monitoren"><h2>Kommunikation zwischen Threads mit Hilfe von Monitoren</h2><ul class="simple"><li><p>Durch Lesen und Schreiben von Daten, die in gemeinsamen Objekten gekapselt sind, die durch Monitore geschützt werden.</p></li><li><p>Jedes Objekt ist implizit von der Klasse <code class="java"><span class="name class">Object</span></code> abgeleitet, welche eine gegenseitige Ausschlusssperre definiert.</p></li><li><p>Methoden in einer Klasse können als <code class="java"><span class="keyword">synchronized</span></code> gekennzeichnet werden. Die Methode wird erst dann ausgeführt, wenn die Sperre vorliegt. Bis dahin wird gewartet. Dieser Prozess geschieht automatisch.</p></li><li><p>Die Sperre kann auch über eine <code class="java"><span class="keyword">synchronized</span></code> Anweisung erworben werden, die das Objekt benennt.</p></li><li><p>Ein Thread kann auf eine einzelne (anonyme) Bedingungsvariable warten und diese benachrichtigen.</p></li></ul></ld-topic>
<ld-topic id="nebenlaufigkeit-in-java-1"><h2>Nebenläufigkeit in Java</h2><object class="light-image align-center" data="drawings/threads/java-threads.svg" type="image/svg+xml" role="img" aria-label="java.lang.Thread"></object><ld-supplemental><ul><li><p>Threads werden in Java über die vordefinierte Klasse java.lang.Thread bereitgestellt.</p></li><li><p>Alternativ kann das Interface:</p><p><code class="java"><span class="keyword">public</span> <span class="keyword">interface</span> <span class="name class">Runnable</span> <span class="punctuation">{</span> <span class="keyword">void</span> <span class="name function">run</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span></code></p><p>implementiert werden und an ein Thread-Objekt übergeben werden.</p></li><li><p>Threads beginnen ihre Ausführung erst, wenn die <code class="java">start</code>-Methode in der Thread-Klasse aufgerufen wird. Die <code class="java"><span class="name class">Thread</span><span class="punctuation">.</span>start</code>-Methode ruft die <code class="java">run</code>-Methode auf. Ein Aufruf der <code class="java">run</code>-Methode direkt führt nicht zu einer parallelen Ausführung.</p></li><li><p>Der aktuelle Thread kann mittels der statischen Methode <code class="java"><span class="name class">Thread</span><span class="punctuation">.</span><span class="name function">currentThread</span><span class="punctuation">(</span><span class="punctuation">)</span></code> ermittelt werden.</p></li><li><p>Ein Thread wird beendet, wenn die Ausführung seiner Run-Methode entweder normal oder als Ergebnis einer unbehandelten Ausnahme endet.</p></li><li><p>Java unterscheidet <em>User</em>-Threads und <em>Daemon</em>-Threads.</p><p><em>Daemon-Threads</em> sind Threads, die allgemeine Dienste bereitstellen und normalerweise nie beendet werden.</p><p>Wenn alle Benutzer-Threads beendet sind, werden die Daemon-Threads von der JVM beendet, und das Hauptprogramm wird beendet.</p><p>Die Methode <code class="java">setDaemon</code> muss aufgerufen werden, bevor der Thread gestartet wird.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="inter-thread-kommunikation-bzw-koordination"><h2>Inter-Thread-Kommunikation bzw. Koordination</h2><ul class="simple"><li><p>Ein Thread kann (mit oder ohne Zeitüberschreitung) auf die Beendigung eines anderen Threads (des Ziels) warten, indem er die <code class="java">join</code>-Methode für das Thread-Objekt des Ziels aufruft.</p></li><li><p>Mit der Methode <code class="java">isAlive</code> kann ein Thread feststellen, ob der Ziel-Thread beendet wurde.</p></li></ul></ld-topic>
<ld-topic id="java-thread-states"><h2>Java Thread States</h2><object class="light-image align-center" data="drawings/threads/java-thread-states.svg" type="image/svg+xml" role="img" aria-label="Java Thread States"></object></ld-topic>
<ld-topic id="synchronized-methoden-und-synchronized-blocke"><h2><code class="java"><span class="keyword">synchronized</span></code>-Methoden und <code class="java"><span class="keyword">synchronized</span></code>-Blöcke</h2><ul class="simple"><li><p>Jedem Objekt ist eine gegenseitige Ausschlusssperre zugeordnet. Auf die Sperre kann von der Anwendung nicht explizit zugegriffen werden. Dies geschieht implizit, wenn:</p><ul class="simple"><li><p>eine Methode den Methodenmodifikator <code class="java"><span class="keyword">synchronized</span></code> verwendet</p></li><li><p>Blocksynchronisierung mit dem Schlüsselwort <code class="java"><span class="keyword">synchronized</span></code> verwendet wird</p></li></ul></li><li><p>Wenn eine Methode als synchronisiert gekennzeichnet ist, kann der Zugriff auf die Methode nur erfolgen, wenn das System die Sperre erhalten hat.</p></li><li><p>Daher haben synchronisierte Methoden einen sich gegenseitig ausschließenden Zugriff auf die vom Objekt gekapselten Daten, <span class="danger">wenn auf diese Daten nur von anderen synchronisierten Methoden zugegriffen wird</span>.</p></li><li><p>Nicht-synchronisierte Methoden benötigen keine Sperre und können daher <em>jederzeit</em> aufgerufen werden.</p></li></ul></ld-topic>
<ld-topic id="beispiel-synchronisierte-methode"><h2>Beispiel: Synchronisierte Methode</h2><ld-deck><ld-card><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">public</span> <span class="keyword">class</span> <span class="name class">SynchronizedCounter</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">
</code><small class="ln"> 3</small><code data-lineno=" 3">  <span class="keyword">private</span> <span class="keyword">int</span> count <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5">  <span class="keyword">public</span> <span class="keyword">synchronized</span> <span class="keyword">void</span> <span class="name function">increment</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    count<span class="operator">++</span><span class="punctuation">;</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">  <span class="punctuation">}</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9">  <span class="keyword">public</span> <span class="keyword">synchronized</span> <span class="keyword">int</span> <span class="name function">getCount</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">10</small><code data-lineno="10">    <span class="keyword">return</span> count<span class="punctuation">;</span>
</code><small class="ln">11</small><code data-lineno="11">  <span class="punctuation">}</span>

<ld-topic id="komplexe-ruckgabewerte"><h2>Komplexe Rückgabewerte</h2><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">public</span> <span class="keyword">class</span> <span class="name class">SharedCoordinate</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">
</code><small class="ln"> 3</small><code data-lineno=" 3">  <span class="keyword">private</span> <span class="keyword">int</span> x<span class="punctuation">,</span> y<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5">  <span class="keyword">public</span> <span class="name class">SharedCoordinate</span><span class="punctuation">(</span><span class="keyword">int</span> initX<span class="punctuation">,</span> <span class="keyword">int</span> initY<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">this</span><span class="punctuation">.</span>x <span class="operator">=</span> initX<span class="punctuation">;</span> <span class="keyword">this</span><span class="punctuation">.</span>y <span class="operator">=</span> initY<span class="punctuation">;</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">  <span class="punctuation">}</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9">  <span class="keyword">public</span> <span class="keyword">synchronized</span> <span class="keyword">void</span> <span class="name function">write</span><span class="punctuation">(</span><span class="keyword">int</span> newX<span class="punctuation">,</span> <span class="keyword">int</span> newY<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">10</small><code data-lineno="10">    <span class="keyword">this</span><span class="punctuation">.</span>x <span class="operator">=</span> newX<span class="punctuation">;</span> <span class="keyword">this</span><span class="punctuation">.</span>y <span class="operator">=</span> newY<span class="punctuation">;</span>
</code><small class="ln">11</small><code data-lineno="11">  <span class="punctuation">}</span>
</code><small class="ln">12</small><code data-lineno="12">
</code><small class="ln">13</small><code data-lineno="13">  <span class="comment single">/*⚠️*/</span> <span class="keyword">public</span> <span class="comment single">/* synchronized irrelevant */</span> <span class="keyword">int</span> <span class="name function">readX</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">return</span> x<span class="punctuation">;</span> <span class="punctuation">}</span> <span class="comment single">/*⚠️*/</span>
</code><small class="ln">14</small><code data-lineno="14">  <span class="comment single">/*⚠️*/</span> <span class="keyword">public</span> <span class="comment single">/* synchronized irrelevant */</span> <span class="keyword">int</span> <span class="name function">readY</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span> <span class="keyword">return</span> y<span class="punctuation">;</span> <span class="punctuation">}</span> <span class="comment single">/*⚠️*/</span>
</code><small class="ln">15</small><code data-lineno="15">
</code><small class="ln">16</small><code data-lineno="16">  <span class="keyword">public</span> <span class="keyword">synchronized</span> <span class="name class">SharedCoordinate</span> <span class="name function">read</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">17</small><code data-lineno="17">    <span class="keyword">return</span> <span class="keyword">new</span> <span class="name class">SharedCoordinate</span><span class="punctuation">(</span>x<span class="punctuation">,</span> y<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">18</small><code data-lineno="18"><span class="punctuation">}</span> <span class="punctuation">}</span></code></pre><ld-supplemental><p>Die beiden Methoden: <code class="java">readX</code> und <code class="java">readY</code> sind nicht synchronisiert, da das Lesen von <code class="java"><span class="keyword">int</span></code>-Werten atomar ist. Allerdings erlauben sie das Auslesen eines inkonsistenten Zustands! Es ist denkbar, dass direkt nach einem <code class="java">readX</code> der entsprechende Thread unterbrochen wird und ein anderer Thread die Werte von <code class="java">x</code> und <code class="java">y</code> verändert. Wird dann der ursprüngliche Thread fortgesetzt, und ruft <code class="java">readY</code> auf, so erhält er den neuen Wert von <code class="java">y</code> und hat somit ein paar <code class="java">x</code>, <code class="java">y</code> vorliegen, dass in dieser Form nie existiert hat.</p><p>Ein konsistenter Zustand kann nur durch die Methode <code class="java">read</code> ermittelt werden, die die Werte von <code class="java">x</code> und <code class="java">y</code> in einem Schritt ausliest und als Paar zurückgibt.</p><p>Kann sichergestellt werden, dass ein auslesender Thread die Instanz in einem <code class="java"><span class="keyword">synchronized</span></code> Block benennt, dann kann die Auslesung eines konsistenten Zustands auch bei mehreren Methodenaufrufen hintereinander sichergestellt werden.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">SharedCoordinate</span> point <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">SharedCoordinate</span><span class="punctuation">(</span><span class="literal number integer">0</span><span class="punctuation">,</span><span class="literal number integer">0</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">synchronized</span> <span class="punctuation">(</span>point1<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">  <span class="keyword">var</span> x <span class="operator">=</span> point1<span class="punctuation">.</span><span class="name function">readX</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">  <span class="keyword">var</span> y <span class="operator">=</span> point1<span class="punctuation">.</span><span class="name function">readY</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="comment single">// do something with x and y</span></code></pre><p>Diese „Lösung“ muss jedoch als sehr kritisch betrachtet werden, da die Wahrscheinlichkeit von Programmierfehlern <em>sehr hoch</em> ist und es dann entweder zur <em>Race Conditions</em> oder zu <em>Deadlocks</em> kommen kann.</p></ld-supplemental></ld-topic>
<ld-topic id="bedingte-synchronisation"><h2>Bedingte Synchronisation</h2><blockquote><p>Zum Zwecke der bedingten Synchronisation können in Java die Methoden <code class="java">wait</code>, <code class="java">notify</code> und <code class="java">notifyAll</code> verwendet werden.  Diese Methoden erlauben es auf bestimmte Bedingungen zu warten und andere Threads zu benachrichtigen, wenn sich die Bedingung geändert hat.</p></blockquote><ld-deck class="incremental"><ld-card><ul class="simple"><li><p>Diese Methoden können nur innerhalb von Methoden verwendet werden, die die Objektsperre halten; andernfalls wird eine <code class="java"><span class="name class">IllegalMonitorStateException</span></code> ausgelöst.</p></li></ul></ld-card><ld-card class="incremental"><ul class="simple"><li><p>Die <code class="java">wait</code>-Methode blockiert immer den aufrufenden Thread und gibt die mit dem Objekt verbundene Sperre frei.</p></li></ul></ld-card><ld-card class="incremental"><ul><li><p>Die <code class="java">notify</code>-Methode weckt <em>einen</em> wartenden Thread auf. Welcher Thread aufgeweckt wird, ist nicht spezifiziert.</p><p><code class="java">notify</code> gibt die Sperre nicht frei; daher muss der aufgeweckte Thread warten, bis er die Sperre erhalten kann, bevor er fortfahren kann.</p></li><li><p>Um alle wartenden Threads aufzuwecken, muss die Methode <code class="java">notifyAll</code> verwendet werden.</p><p>Warten die Threads aufgrund unterschiedlicher Bedingungen, so ist immer <code class="java">notifyAll</code> zu verwenden.</p></li><li><p>Wenn kein Thread wartet, dann haben <code class="java">notify</code> und <code class="java">notifyAll</code> keine Wirkung.</p></li></ul></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>Wenn ein Thread aufgeweckt wird, kann er nicht davon ausgehen, dass seine Bedingung erfüllt ist!</p><p>Die Bedingung ist immer in einer Schleife zu prüfen und der Thread muss ich ggf. wieder in den Wartezustand versetzen.</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="beispiel-synchronisation-mit-condition-variables"><h2>Beispiel: Synchronisation mit <em>Condition Variables</em></h2><ld-deck><ld-card><p>Wenn ein Thread auf eine Bedingung wartet, kann kein anderer Thread auf die andere Bedingung warten.</p><p><span class="peripheral">Mit den bisher vorgestellten Primitiven ist eine direkte Modellierung dieses Szenarios so nicht möglich. Stattdessen müssen immer alle Threads aufgeweckt werden, um sicherzustellen, dass auch der intendierte Thread aufgeweckt wird. Deswegen ist auch das Überprüfen der Bedingung in einer Schleife notwendig.</span></p></ld-card><ld-card class="incremental"><p>Ein <em>BoundedBuffer</em> hat z. B. traditionell zwei Bedingungsvariablen: <em>BufferNotFull</em> und <em>BufferNotEmpty</em>.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">public</span> <span class="keyword">class</span> <span class="name class">BoundedBuffer</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">  <span class="keyword">private</span> <span class="keyword">final</span> <span class="keyword">int</span> buffer<span class="punctuation">[</span><span class="punctuation">]</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">  <span class="keyword">private</span> <span class="keyword">int</span> first<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">  <span class="keyword">private</span> <span class="keyword">int</span> last<span class="punctuation">;</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">  <span class="keyword">private</span> <span class="keyword">int</span> numberInBuffer <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">  <span class="keyword">private</span> <span class="keyword">final</span> <span class="keyword">int</span> size<span class="punctuation">;</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">
</code><small class="ln"> 8</small><code data-lineno=" 8">  <span class="keyword">public</span> <span class="name class">BoundedBuffer</span><span class="punctuation">(</span><span class="keyword">int</span> length<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    size <span class="operator">=</span> length<span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10">    buffer <span class="operator">=</span> <span class="keyword">new</span> <span class="keyword">int</span><span class="punctuation">[</span>size<span class="punctuation">]</span><span class="punctuation">;</span>
</code><small class="ln">11</small><code data-lineno="11">    last <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span>
</code><small class="ln">12</small><code data-lineno="12">    first <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span>
</code><small class="ln">13</small><code data-lineno="13">  <span class="punctuation">}</span><span class="punctuation">;</span></code></pre></ld-card><ld-card class="incremental"><pre class="code java copy-to-clipboard literal-block"><small class="ln">14</small><code data-lineno="14">  <span class="keyword">public</span> <span class="keyword">synchronized</span> <span class="keyword">void</span> <span class="name function">put</span><span class="punctuation">(</span><span class="keyword">int</span> item<span class="punctuation">)</span> <span class="keyword">throws</span> <span class="name class">InterruptedException</span> <span class="punctuation">{</span>
</code><small class="ln">15</small><code data-lineno="15">    <span class="keyword">while</span> <span class="punctuation">(</span>numberInBuffer <span class="operator">==</span> size<span class="punctuation">)</span>
</code><small class="ln">16</small><code data-lineno="16">      <span class="name function">wait</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">17</small><code data-lineno="17">    last <span class="operator">=</span> <span class="punctuation">(</span>last <span class="operator">+</span> <span class="literal number integer">1</span><span class="punctuation">)</span> <span class="operator">%</span> size<span class="punctuation">;</span>
</code><small class="ln">18</small><code data-lineno="18">    numberInBuffer<span class="operator">++</span><span class="punctuation">;</span>
</code><small class="ln">19</small><code data-lineno="19">    buffer<span class="punctuation">[</span>last<span class="punctuation">]</span> <span class="operator">=</span> item<span class="punctuation">;</span>
</code><small class="ln">20</small><code data-lineno="20">    <span class="name function">notifyAll</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">21</small><code data-lineno="21">  <span class="punctuation">}</span><span class="punctuation">;</span></code></pre></ld-card><ld-card class="incremental"><pre class="code java copy-to-clipboard literal-block"><small class="ln">22</small><code data-lineno="22">  <span class="keyword">public</span> <span class="keyword">synchronized</span> <span class="keyword">int</span> <span class="name function">get</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="keyword">throws</span> <span class="name class">InterruptedException</span> <span class="punctuation">{</span>
</code><small class="ln">23</small><code data-lineno="23">    <span class="keyword">while</span> <span class="punctuation">(</span>numberInBuffer <span class="operator">==</span> <span class="literal number integer">0</span><span class="punctuation">)</span>
</code><small class="ln">24</small><code data-lineno="24">      <span class="name function">wait</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">25</small><code data-lineno="25">    first <span class="operator">=</span> <span class="punctuation">(</span>first <span class="operator">+</span> <span class="literal number integer">1</span><span class="punctuation">)</span> <span class="operator">%</span> size<span class="punctuation">;</span>
</code><small class="ln">26</small><code data-lineno="26">    numberInBuffer<span class="operator">--</span><span class="punctuation">;</span>
</code><small class="ln">27</small><code data-lineno="27">    <span class="name function">notifyAll</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">28</small><code data-lineno="28">    <span class="keyword">return</span> buffer<span class="punctuation">[</span>first<span class="punctuation">]</span><span class="punctuation">;</span>
</code><small class="ln">29</small><code data-lineno="29">  <span class="punctuation">}</span>
</code><small class="ln">30</small><code data-lineno="30"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p>Fehlersituation, die bei der Verwendung von <code class="java">notify</code> statt <code class="java">notifyAll</code> auftreten könnte:</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">BoundedBuffer</span> bb <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">BoundedBuffer</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name class">Thread</span> g1<span class="punctuation">,</span>g2 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Thread</span><span class="punctuation">(</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">=</span><span class="operator">&gt;</span> <span class="punctuation">{</span> bb<span class="punctuation">.</span><span class="name function">get</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="name class">Thread</span> p1<span class="punctuation">,</span>p2 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Thread</span><span class="punctuation">(</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">=</span><span class="operator">&gt;</span> <span class="punctuation">{</span> bb<span class="punctuation">.</span><span class="name function">put</span><span class="punctuation">(</span><span class="keyword">new</span> <span class="name class">Object</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">g1<span class="punctuation">.</span><span class="name function">start</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> g2<span class="punctuation">.</span><span class="name function">start</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> p1<span class="punctuation">.</span><span class="name function">start</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> p2<span class="punctuation">.</span><span class="name function">start</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre><table class="s-smaller incremental-table-rows"><colgroup><col style="width: 2.0%"><col style="width: 16.7%"><col style="width: 33.3%"><col style="width: 22.0%"><col style="width: 26.0%"></colgroup><thead><tr><th class="head"></th><th class="head"><p>Aktionen</p></th><th class="head"><p>(Änderung des) Zustand(s) des Buffers</p></th><th class="head"><p>Auf die Sperre (<em>Lock</em>) wartend</p></th><th class="head"><p>An der Bedingung wartend</p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p><strong>g1:bb.get()</strong> <br>
g2:bb.get(), p1:bb.put(), p2:bb.put()</p></td><td><p>empty</p></td><td><p>{g2,p1,p2}</p></td><td><p>{g1}</p></td></tr><tr><td><p>2</p></td><td><p><strong>g2:bb.get()</strong></p></td><td><p>empty</p></td><td><p>{p1,p2}</p></td><td><p>{g1,g2}</p></td></tr><tr><td><p>3</p></td><td><p><strong>p1:bb.put()</strong></p></td><td><p>empty → not empty</p></td><td><p>{p2,g1}</p></td><td><p>{g2}</p></td></tr><tr><td><p>4</p></td><td><p><strong>p2:bb.put()</strong></p></td><td><p>not empty</p></td><td><p>{g1}</p></td><td><p>{g2,p2}</p></td></tr><tr><td><p>5</p></td><td><p><strong>g1:bb.get()</strong></p></td><td><p>not empty → empty</p></td><td><p>{g2}</p></td><td><p>{p2}</p></td></tr><tr><td><p>6</p></td><td><p><strong>g2:bb.get()</strong></p></td><td><p>empty</p></td><td><p>∅</p></td><td><p>{g2,p2}</p></td></tr></tbody></table></ld-card></ld-deck><ld-supplemental><p>In Schritt 5 wurde von der VM - aufgrund des Aufrufs von <code class="java">notify</code> durch <code class="java">g1</code> - der Thread <code class="java">g2</code> aufgeweckt - anstatt des Threads <code class="java">p2</code>. Der aufgeweckte Thread <code class="java">g2</code> prüft die Bedingung (Schritt 6) und stellt fest, dass der Buffer leer ist. Er geht wieder in den Wartezustand. Jetzt warten sowohl ein Thread, der ein Wert schreiben möchte als auch ein Thread, der einen Wert lesen möchte.</p></ld-supplemental></ld-topic>
<ld-topic class="new-section" id="fortgeschrittene-synchronisationsmechanismen-primitive-und-konzepte"><h2>Fortgeschrittene Synchronisationsmechanismen, -primitive und -konzepte.</h2></ld-topic>
<ld-topic id="java-api-fur-nebenlaufige-programmierung"><h2>Java API für nebenläufige Programmierung</h2><dl class="field-list simple"><dt>java.util.concurrent<span class="colon">:</span></dt><dd><p>Bietet verschiedene Klassen zur Unterstützung gängiger nebenläufiger Programmierparadigmen, z. B. Unterstützung für <em>BoundedBuffers</em> oder Thread-Pools.</p></dd><dt>java.util.concurrent.atomic<span class="colon">:</span></dt><dd><p>Bietet Unterstützung für sperrfreie (<em>lock-free</em>), thread-sichere Programmierung auf einfachen Variablen — wie zum Beispiel atomaren Integern — an.</p></dd><dt>java.util.concurrent.locks<span class="colon">:</span></dt><dd><p>Bietet verschiedene Sperralgorithmen an, die die Java-Sprachmechanismen ergänzen, z. B. Schreib-Lese-Sperren und Bedingungsvariablen. Dies ermöglicht zum Beispiel: „Hand-over-Hand“ oder „Chain Locking“.</p></dd></dl></ld-topic>

<ld-topic id="thread-prioritaten"><h2>Thread Prioritäten</h2><ul class="incremental-list simple"><li><p>Obwohl den Java-Threads Prioritäten zugewiesen werden können (<code class="java">setPriority</code>), dienen sie dem zugrunde liegenden Scheduler nur als Richtschnur für die Ressourcenzuweisung.</p></li><li><p>Sobald ein Thread läuft, kann er die Prozessorressourcen explizit aufgeben, indem er die <code class="java"><span class="keyword">yield</span></code>-Methode aufruft.</p></li><li><p><code class="java"><span class="keyword">yield</span></code> setzt den Thread an das Ende der Warteschlange für seine Prioritätsstufe.</p></li><li><p>Die Scheduling- und Prioritätsmodelle von Java sind jedoch schwach:</p><ul class="simple"><li><p>Es gibt keine Garantie dafür, dass immer der Thread mit der höchsten Priorität ausgeführt wird, der lauffähig ist.</p></li><li><p>Threads mit gleicher Priorität können in Zeitscheiben unterteilt sein oder auch nicht.</p></li><li><p>Bei der Verwendung nativer Threads können unterschiedliche Java-Prioritäten auf dieselbe Betriebssystempriorität abgebildet werden.</p></li></ul></li></ul></ld-topic>
<ld-topic id="best-practices"><h2>Best Practices</h2><aside class="admonition" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><ul class="incremental-list simple"><li><p><code class="java"><span class="keyword">synchronized</span></code> Code sollte so kurz wie möglich gehalten werden.</p></li><li><p>Verschachtelte Monitoraufrufe sollten vermieden werden, da die äußere Sperre nicht freigegeben wird, wenn der innere Monitor wartet. Dies kann leicht zum Auftreten eines Deadlocks führen.</p></li></ul></aside></ld-topic>
<ld-topic class="no-title center-content" id="ressourcen-immer-in-der-gleichen-reihenfolge-sperren"><h2>Ressourcen immer in der gleichen Reihenfolge sperren</h2><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Wenn zwei (oder mehr) Threads auf die gleichen Ressourcen in unterschiedlicher Reihenfolge zugreifen, kann es zu einem Deadlock kommen.</p></aside><aside class="admonition incremental" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p><strong>Ressourcen sind immer in der gleichen Reihenfolge zu sperren</strong>, um Deadlocks zu vermeiden.</p></aside></ld-topic>
<ld-topic class="new-section" id="thread-safety"><h2>Thread Safety</h2><p><span class="ger">Threadsicherheit</span></p></ld-topic>
<ld-topic id="thread-safety-voraussetzung"><h2>Thread Safety - Voraussetzung</h2><p>Damit eine Klasse thread-sicher ist, muss sie sich in einer single-threaded Umgebung korrekt verhalten.</p><ld-deck><ld-card><p>D. h. wenn eine Klasse korrekt implementiert ist, dann sollte keine Abfolge von Operationen (Lesen oder Schreiben von öffentlichen Feldern und Aufrufen von öffentlichen Methoden) auf Objekten dieser Klasse in der Lage sein:</p><blockquote><ul class="simple"><li><p>das Objekt in einen ungültigen Zustand versetzen,</p></li><li><p>das Objekt in einem ungültigen Zustand zu beobachten oder</p></li><li><p>eine der Invarianten, Vorbedingungen oder Nachbedingungen der Klasse verletzen.</p></li></ul></blockquote></ld-card><ld-card class="incremental"><p>Die Klasse muss das korrekte Verhalten auch dann aufweisen,
wenn auf sie von mehreren Threads aus zugegriffen wird.</p><ul class="simple"><li><p>Unabhängig vom <em>Scheduling</em> oder der Verschachtelung der Ausführung dieser Threads durch die Laufzeitumgebung,</p></li><li><p>Ohne zusätzliche Synchronisierung auf Seiten des aufrufenden Codes.</p></li></ul><aside class="admonition incremental" data-theme="assessment"><p class="admonition-title" data-theme="assessment-header"><span>Bewertung</span></p><p>Dies hat zur Folge, dass Operationen auf einem thread-sicheren Objekt für alle Threads so erscheinen als ob die Operationen in einer festen, global konsistenten Reihenfolge erfolgen würden.</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="thread-safety-level"><h2>Thread Safety Level</h2><dl class="incremental-list field-list simple"><dt>Immutable <span class="ger">Unveränderlich</span><span class="colon">:</span></dt><dd><p>Die Objekte sind konstant und können nicht geändert werden.</p></dd><dt>Thread-sicher<span class="colon">:</span></dt><dd><p>Die Objekte sind veränderbar, unterstützen aber nebenläufigen Zugriff, da die Methoden entsprechend synchronisiert sind.</p></dd><dt>Bedingt Thread-sicher<span class="colon">:</span></dt><dd><p>All solche Objekte bei denen jede einzelne Operation thread-sicher ist, aber bestimmte Sequenzen von Operationen eine externe Synchronisierung erfordern können.</p></dd><dt>Thread-kompatibel<span class="colon">:</span></dt><dd><p>Alle Objekte die keinerlei Synchronisierung aufweisen. Der Aufrufer kann die Synchronisierung jedoch ggf. extern übernehmen.</p></dd><dt>Thread-hostile „Thread-schädlich“<span class="colon">:</span></dt><dd><p>Objekte, die nicht thread-sicher sind und auch nicht thread-sicher gemacht werden können, da sie zum Beispiel globalen Zustand manipulieren.</p></dd></dl></ld-topic>
<ld-topic class="exercises" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Virtueller Puffer"><p class="ld-exercise-title rubric"><span>Virtueller Puffer</span></p><p>Implementieren Sie einen virtuellen Puffer, der Tasks (Instanzen von <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Runable</span></code>) entgegennimmt und nach einer bestimmten Zeit ausführt. Der Puffer darf währenddessen nicht blockieren bzw. gesperrt sein.</p><p>Nutzen Sie ggf. virtuelle Threads, um auf ein explizites Puffern zu verzichten. Ein virtueller Thread kann zum Beispiel mit: <code class="java"><span class="name class">Thread</span><span class="punctuation">.</span><span class="name function">ofVirtual</span><span class="punctuation">(</span><span class="punctuation">)</span></code> erzeugt werden. Danach kann an die Methode <code class="java">start</code> ein <code class="java"><span class="name class">Runnable</span></code> Objekt übergeben werden.</p><p>Verzögern Sie die Ausführung (<code class="java"><span class="name class">Thread</span><span class="punctuation">.</span><span class="name function">sleep</span><span class="punctuation">(</span><span class="punctuation">)</span></code>) im Schnitt um 100ms mit einer Standardabweichung von 20ms. (Nutzen Sie <code class="java"><span class="name class">Random</span><span class="punctuation">.</span><span class="name function">nextGaussian</span><span class="punctuation">(</span>mean<span class="punctuation">,</span>stddev<span class="punctuation">)</span></code>)</p><p>Starten Sie 100 000 virtuelle Threads. Wie lange dauert die Ausführung? Wie lange dauert die Ausführung bei 100 000 platform (<em>native</em>) Threads.</p><p>Nutzen Sie ggf. die Vorlage.</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:mrREYJe8SLEdxiKHOMTE8fsa2aZCNBet1hEgPy/HJSI=:ML <ld-topic class="exercises" id="ubung-1"><h2>Übung</h2><ld-scrollable><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Thread-sichere Programmierung"><p class="ld-exercise-title rubric"><span>Thread-sichere Programmierung</span></p><p>Implementieren Sie eine Klasse <code class="java"><span class="name class">ThreadsafeArray</span></code> zum Speichern von nicht-<code class="java"><span class="keyword">null</span></code> Objekten (<code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Object</span></code>) an ausgewählten Indizes — vergleichbar mit einem normalen Array. Im Vergleich zu einem normalen Array sollen die Aufrufer jedoch ggf. blockiert werden, wenn die Zelle belegt ist. Die Klasse soll folgende Methoden bereitstellen:</p><dl class="field-list simple"><dt><code class="java"><span class="name function">get</span><span class="punctuation">(</span><span class="keyword">int</span> index<span class="punctuation">)</span></code><span class="colon">:</span></dt><dd><p>Liefert den Wert an der Position <code class="java">index</code> zurück. Der aufrufende Thread wird ggf. blockiert, bis ein Wert an der Position <code class="java">index</code> gespeichert wurde. (Die <code class="java">get</code>-Methode entfernt den Wert nicht aus dem Array.)</p></dd><dt><code class="java"><span class="name function">set</span><span class="punctuation">(</span><span class="keyword">int</span> index<span class="punctuation">,</span> <span class="name class">Object</span> value<span class="punctuation">)</span></code><span class="colon">:</span></dt><dd><p>Speichert den Wert <span class="docutils literal">value</span> an der Position <code class="java">index</code>. Falls an der Position <code class="java">index</code> bereits ein Wert gespeichert wurde, wird der aufrufende Thread blockiert, bis der Wert an der Position <code class="java">index</code> gelöscht wurde.</p></dd><dt><code class="java"><span class="name function">delete</span><span class="punctuation">(</span><span class="keyword">int</span> index<span class="punctuation">)</span></code><span class="colon">:</span></dt><dd><p>Löscht ggf. den Wert an der Position <code class="java">index</code> wenn ein Wert vorhanden ist. Andernfalls wird der Thread blockiert, bis es einen Wert gibt, der gelöscht werden kann.</p></dd></dl><ol class="loweralpha simple"><li><p>Implementieren Sie die Klasse <code class="java"><span class="name class">ThreadsafeArray</span></code> nur unter Verwendung der Standardprimitive: <code class="java"><span class="keyword">synchronized</span></code>, <code class="java">wait</code>, <code class="java">notify</code> und <code class="java">notifyAll</code>. Nutzen Sie die Vorlage.</p></li><li><p>Können Sie sowohl <code class="java">notify</code> als auch <code class="java">notifyAll</code> verwenden?</p></li><li><p>Implementieren Sie die Klasse <code class="java"><span class="name class">ThreadsafeArray</span></code> unter Verwendung von <code class="java"><span class="name class">ReentrantLock</span></code>s und <code class="java"><span class="name class">Condition</span></code>s. Nutzen Sie die Vorlage.</p></li><li><p>Welche Vorteile hat die Verwendung von <code class="java"><span class="name class">ReentrantLock</span></code>s?</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:/U4fV+08t/tPpGmOoaECB2ptE+/+foGTxozWbt5VMqw=:tItDzwsdvfs18V/B:Nv1K+bwKLzQffKDe+qoz19ImSQQ33xu6yMl5oZhvAztuzMMXM1BmLiV7b7zKTwY1a+oSAzDaCfwSsYm0+kZu4mImgfN1j4ppuMZ1mTfrThiHnW7MfwDpACk0cygyFClHCn/SF6rB5Xrx4j6QZSzYMfRchf27Xjdx6IrCb6xzpgIs7xWTCBP9Yf6GIvfkIMJJk1F0/e9EDlbbXmqoyQvT+/KAtwvvfyjkzC93mYob4PN055BVu8Y1Cap+IChO0GN+L7tKQTWg9+Jh75gGfUH9PqNVwJMdFhD4a65i/s4tAFHZzoIctgbguiOMedKk/gQAQVgNrMKlFTvQ3yFH6rPW2CHSG11Mf+v2rY+T6ukkAx5lJI6+mG37EshCE66LgQ6+Ixa58lcGzDpPiJstr1pqddpZgfBbUt+IaSA/d9n+NVLkmm+DegP5/wBTSkH6QPa2Hcm0nKhDx5sGA9Xpx
