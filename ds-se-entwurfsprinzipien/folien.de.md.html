<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>
</head>
<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="lecture-ds-entwurfsprinzipien"><h1 class="title">Entwurfsprinzipien für Moderne Verteilte Anwendungen</h1><p>(<span class="eng">Design Principles and Design Patterns for Distributed Applications</span>)</p><dl class="field-list simple"><dt>Dozent<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></p></dd><dt>Kontakt<span class="colon">:</span></dt><dd><p><a class="reference external" href="mailto:michael.eichberg@dhbw.de">michael.eichberg@dhbw.de</a></p></dd><dt>Version<span class="colon">:</span></dt><dd><p>1.0.1.1</p></dd></dl><ld-supplemental><dl class="field-list"><dt>Folien<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/ds-se-entwurfsprinzipien/folien.de.md.html">https://delors.github.io/ds-se-entwurfsprinzipien/folien.de.md.html</a></p><p><a class="reference external" href="https://delors.github.io/ds-se-entwurfsprinzipien/folien.de.md.html.pdf">https://delors.github.io/ds-se-entwurfsprinzipien/folien.de.md.html.pdf</a></p></dd><dt>Fehler melden<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://github.com/Delors/delors.github.io/issues">https://github.com/Delors/delors.github.io/issues</a></p></dd></dl><dl class="field-list simple"><dt>KI Verwendung<span class="colon">:</span></dt><dd><p>Bei der Erstellung der Unterlagen wurden KI Assistenten (insbesondere Claude
aber ggf. auch ChatGPT, Ollama mit Gemma/LLama/Qwen oder OpenCode mit
Kimi/Qwen/Deepseek...) unterstützend eingesetzt.
Dies erfolgte insbesondere zur Unterstützung bei der Generierung von Grafiken
(d. h. SVG Dateien), oder um sich Übersichtstabellen generieren zu lassen.
Weiterhin wurde KI zur allgemeinen Qualitätssicherung eingesetzt.
Inhalte, die ggf. von der KI vorgeschlagen wurden, wurden im Falle der
Übernahme explizit validiert und angepasst.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic class="new-section" id="entwurfsprinzipien"><h2>Entwurfsprinzipien</h2></ld-topic>
<ld-topic id="entwurfsziele"><h2>Entwurfsziele</h2><p>Die Entitäten (<span class="meta">Klassen</span>, <span class="muted">Module</span>, <span class="muted">Komponenten</span>, Services…) unseres Entwurfs können:</p><ul class="incremental-list list-with-explanations"><li><p>unabhängig von einander von einem “kleinen” Team iterativ entwickelt werden</p><p>Dies setzt die - unabhängige Testbarkeit - voraus.</p></li><li><p>unabhängig von einander bereitgestellt (<span class="eng">to deploy</span>) werden</p></li><li><p>unabhängig von einander gewartet und weiterentwickelt werden</p></li></ul><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Diese Kriterien erlauben es uns einen „fertigen“ Entwurf zu beurteilen ohne zu sagen, wie das Ziel erreicht werden kann.</p></aside><ld-supplemental><p>Die unabhängige Testbarkeit ersetzt aber nicht die Notwendigkeit von Integrationstests.</p></ld-supplemental></ld-topic>
<ld-topic class="center-content" id="design-needs-principles"><h2>Design needs Principles!</h2><div class="gray"><p>Oder welche Entität ist von wem, wann, warum und in welcher Weise abhängig?</p><p>Welche Entität soll mit welcher zusammen definiert werden?</p><p><a class="citation-reference" href="#martin2017" id="citation-reference-1" role="doc-biblioref">[Martin2017]</a></p></div><ld-supplemental><p>Es muss Leitlinien geben, die uns helfen einen guten Entwurf zu erstellen, der die genannten Ziele erreicht. Weiterhin muss klar sein wie dieser beurteilt werden kann. d. h. Code darf nicht beliebig „platziert“ werden; Schnittstellen sollten nicht aus dem Bauch heraus entworfen werden.</p><p>Die folgenden Prinzipien wurden (zumindest teilweise) im Kontext der objekt-orientierten Programmierung identifiziert und beschrieben; passen jedoch auf verschiedensten Abstraktionsgeraden, deswegen ist im Folgenden auch von Entitäten die Rede.</p></ld-supplemental></ld-topic>
<ld-topic id="kopplung-coupling"><h2>Kopplung (<span class="eng">coupling</span>)</h2><div class="accentuate"><p>Kopplung beschreibt die Stärke der Abhängigkeit zwischen verschiedenen Entitäten<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a>.</p></div><div class="incremental"><p>Eine Entität <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi><mn>1</mn></mrow><annotation encoding="application/x-tex">E1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mord">1</span></span></span></span></span> ist mit Entität <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">E2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mord">2</span></span></span></span></span> verbunden, wenn <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi><mn>1</mn></mrow><annotation encoding="application/x-tex">E1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mord">1</span></span></span></span></span> direkt oder indirekt <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">E2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mord">2</span></span></span></span></span> benötigt.</p><p><span class="incremental">Jedoch ist Kopplung nicht gleich Kopplung:</span></p><ul class="incremental-list simple"><li><p>statische und dynamische Kopplung</p></li><li><p>Code-basierte und Daten-basierte</p></li><li><p>...</p></li></ul></div><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Eine Entität kann z. B. eine Methode, Klasse, Modul, Package, Komponente oder Service sein.</p></aside></aside><ld-supplemental><p><em>Dynamische Kopplung</em> entsteht zur Laufzeit durch den Austausch von Nachrichten, statische Kopplung zur Compilezeit.</p><p>(<em>Temporale Kopplung</em> bezieht sich darauf, dass etwas gleichzeitig ausgeführt wird.)</p></ld-supplemental></ld-topic>
<ld-topic id="hohe-statische-kopplung-high-static-coupling"><h2>Hohe statische Kopplung (<span class="eng">high (static) coupling</span>)</h2><p>Eine Entität mit hoher Kopplung ist nicht wünschenswert:</p><ul class="simple"><li><p>Änderungen in verwendeten Entitäten erfordern (oft) lokale Anpassungen (mind. neues Testen)</p></li><li><p>sie sind schwerer zu verstehen</p></li><li><p>sie sind schwerer wiederzuverwenden, da die Verwendung auch aller weiteren Entitäten notwendig ist von denen die Entität abhängt</p></li></ul><ld-supplemental><p>Hohe Kopplung ist aber nicht per-se schlecht! Eine hohe Kopplung an Dinge, die extrem stabil sind, ist im Allgemeinen unkritisch.</p></ld-supplemental></ld-topic>
<ld-topic id="niedrige-statische-kopplung-low-static-coupling"><h2>Niedrige statische Kopplung (<span class="eng">low (static) coupling</span>)</h2><ul class="simple"><li><p>Eine niedrige Kopplung unterstützt den Entwurf von vergleichsweise unabhängigen und deswegen besser wiederverwendbaren Entitäten.</p></li><li><p>„generische“ Entitäten mit einer hohen Wiederverwendungswahrscheinlichkeit sollten eine geringe Kopplung aufweisen.</p></li></ul><object class="incremental align-center" data="drawings/coupling/applied-isp.svg" type="image/svg+xml" role="img" aria-label="The Interface Segregation Principle applied to a class diagram"></object><ld-supplemental><p>Keine Kopplung ist (auch) nicht wünschenswert, da dies zu Entitäten führt, die alle Arbeit durchführen; weiterhin führt dies auch dazu, dass sich ggf. die Arbeit sehr viel schlechter aufteilen lässt und dann eine agile Entwicklung mit einem kleinen Team nicht mehr möglich ist.</p><p>Relevante Frage: Wer ist/sollte der Eigentümer der Schnittstellen sein? D. h. aus welcher Perspektive sollte die Schnittstelle entworfen werden?</p></ld-supplemental></ld-topic>
<ld-topic id="niedrige-vs-hohe-dynamische-kopplung"><h2>Niedrige vs. hohe dynamische Kopplung</h2><ld-grid class="default-layout"><ld-cell class="width-70" style="align-self:auto;"><object class="align-left" data="drawings/coupling/message-based-coupling.svg" type="image/svg+xml" role="img"></object></ld-cell><ld-cell class="width-30" style="align-self:auto;"><p>Anforderung-Antwort (Synchron)</p><p>(<span class="eng">Request-response</span>)</p></ld-cell></ld-grid><ld-grid class="incremental default-layout"><ld-cell class="width-30" style="align-self:auto;"><p>PubSub (Asynchron)</p><p>(<span class="eng">Publisher-subscriber</span>)</p></ld-cell><ld-cell class="width-70" style="align-self:auto;"><object class="align-right" data="drawings/coupling/pub-sub-coupling.svg" type="image/svg+xml" role="img"></object></ld-cell></ld-grid><ld-supplemental><p class="rubric">Beobachtungen</p><p>Die Skalierbarkeit der ersten Lösung hängt direkt von der Performance von Zahlung und Inventarisierung ab. Für die Verfügbarkeit der Gesamtlösung gilt das Gleiche.</p><p>PubSub ist hier deutlich mächtiger; Nachteile von PubSub liegen im Bereich:</p><ul class="simple"><li><p>Indirektion</p></li><li><p>garantierter Nachrichtenverbleib bzw. garantierte Nachrichtenverarbeitung</p></li><li><p>verteilter Zustand bei Fehlern</p></li></ul><p>In diesem Fall führt lose Kopplung zu sehr viel höherer Komplexität bei der Fehlerbehandlung.</p></ld-supplemental></ld-topic>
<ld-topic id="zusammenhalt-kohasion-cohesion"><h2>Zusammenhalt / Kohäsion (<span class="eng">Cohesion</span>)</h2><div class="accentuate"><p>Der Zusammenhalt ist ein Maß der Stärke zwischen den Elementen einer Entität.</p></div><p>Ausgewählte Typen von Zusammenhalt:</p><ul class="list-with-explanations incremental-list"><li><p><span class="success">Funktionale Kohäsion</span></p><p>Die Elemente realisieren eine logische Funktion.</p></li><li><p>…</p></li><li><p><span class="warning">Logische bzw. technische Kohäsion</span></p><p>Die Elemente stehen aus technischer Sicht in enger Beziehung.</p></li><li><p><span class="danger">Zufällig</span></p><p>Es gibt keine relevante Beziehung zwischen den Elementen.</p></li></ul><ld-supplemental><p>Eine wesentliche Frage ist: „Worin besteht der abgeschlossene Kontext, um etwas auf einer entsprechenden Abstraktionsebene kohäsiv erscheinen zu lassen?“</p><p>Technische Kohäsion entsteht zum Beispiel an der Schnittstelle für den Zugriff auf die Datenbank.</p></ld-supplemental></ld-topic>
<ld-topic id="geringer-zusammenhalt-low-cohesion"><h2>Geringer Zusammenhalt (<span class="eng">Low Cohesion</span>)</h2><p>Entitäten mit geringem Zusammenhalt sind nicht wünschenswert!</p><p>Sie sind:</p><ul class="simple"><li><p>schwer zu verstehen</p></li><li><p>schwer wiederzuverwenden</p></li><li><p>schwer zu warten und oft von Änderungen betroffen</p></li></ul><ld-supplemental><p>Services mit einer geringen Kohäsion repräsentieren häufig Dinge auf sehr grober, abstrakter Ebene und haben Verantwortlichkeiten übernommen für Dinge, die sie bessere delegieren sollten.</p></ld-supplemental></ld-topic>
<ld-topic id="hoher-zusammenhalt-high-cohesion"><h2>Hoher Zusammenhalt (<span class="eng">High Cohesion</span>)</h2><p>Alle Funktionalität und alle Daten sollten „natürlich“ zum Konzept gehören, das von der Entität realisiert wird.</p></ld-topic>
<ld-topic class="no-title center-content" id="konflikt-niedrige-kopplung-hohe-kohasion"><h2>Konflikt: niedrige Kopplung ↔︎ hohe Kohäsion</h2><ul class="columns font-size-200 simple"><li><p><span class="success">niedrige Kopplung</span></p></li><li><p>↔︎</p></li><li><p><span class="success">hohe Kohäsion</span></p></li></ul><ld-supplemental><p>Eine sehr niedrige Kopplung führt zwangsweise dazu, das man zu viel Funktionalität in ein Modul/einen Service/eine Klasse/eine Funktion packt. Eine hohe Kohäsion führt zwangsweise dazu, dass man (sehr) viele Module/Services/Klassen/Funktionen benötigt, die häufig viele (starke) Kopplungen haben. Es gilt also die richtige Balance zu finden.</p></ld-supplemental></ld-topic>
<ld-topic class="no-title transition-fade center-content" id="zusammenfassung"><h2>Zusammenfassung</h2><aside class="admonition" data-theme="summary"><p class="admonition-title" data-theme="summary-header"><span>Zusammenfassung</span></p><p>Kopplung und Kohäsion erlauben es uns einen Entwurf auf allen (Abstraktions-)ebenen zu beurteilen.</p></aside></ld-topic>
<ld-topic id="von-verantwortung-und-zustandigkeit"><h2>Von Verantwortung und Zuständigkeit</h2><aside class="admonition width-30 float-right" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Wie verteilt man die Zuständigkeiten auf verschiedene Entitäten?</p></aside><ul class="simple"><li><p>Der Verteilung von Zuständigkeiten ist die zentrale Tätigkeit während des Entwurfs.</p></li><li><p>Entwurfsmuster, Idiome und Prinzipien helfen dabei die Zuständigkeiten zu verteilen.</p></li><li><p>Bei der Verteilung von Zuständigkeiten gibt es eine große Bandbreite:</p><ul class="incremental-list simple"><li><p>Deswegen gibt es gute und schlechte Entwürfe, schöne und hässliche, effiziente und ineffiziente.</p></li><li><p>Eine schlechte Wahl führt zu fragilen Systemen, welche schwer zu warten, zu verstehen, wiederzuverwenden oder zu erweitern sind.</p></li></ul></li></ul><ld-supplemental><p>Bei der Verteilung der Zuständigkeiten gibt es eine große Bandbreite in Hinblick darauf, wie die nicht-funktionalen - und die funktionalen Eigenschaften einer Software realisiert werden.</p></ld-supplemental></ld-topic>
<ld-topic class="center-content" id="leitgedanke-bzgl-funktionaler-kohasion"><h2>Leitgedanke bzgl. funktionaler Kohäsion</h2><div class="font-size-200"><p>Code, der sich gemeinsam ändert, bleibt zusammen.</p></div></ld-topic>
<ld-topic id="fasse-die-dinge-zusammen-die-sich-aus-dem-gleichen-grund-und-zur-selben-zeit-andern"><h2>Fasse die Dinge zusammen, die sich aus dem gleichen Grund und zur selben Zeit ändern.</h2><object class="align-center" data="drawings/ccp-and-srp.svg" type="image/svg+xml" role="img" aria-label="Anwendung des Common Closure Principle und des Single Responsibility Principle"></object><ld-supplemental><dl class="field-list simple"><dt>Single Responsibility Principle (SRP)<span class="colon">:</span></dt><dd><p>Ein Modul sollte nur einem einzigen Akteur gegenüber verantwortlich sein. D. h. es sollte nur eine wohldefinierte Gruppe von Akteuren geben, die eine Veränderung veranlassen/verlangen können. Code, von dem verschiedene Akteure abhängen, sollte aufgeteilt werden.</p></dd><dt>Common Closure Principle (CCP)<span class="colon">:</span></dt><dd><p>Fasse in Komponenten solche Klassen zusammen, die sich aus dem gleichen Grund und zur gleichen Zeit ändern. Z. B. weil sie die gleichen Stakeholder haben oder die gleichen rechtlichen Grundlagen haben.</p></dd></dl><p>Die beiden Prinzipien sind eng miteinander verwandt. Das CCP ist ein Prinzip, das auf allen Abstraktionsgeraden angewendet werden kann. Das SRP ist - zumindest ursprünglich - ein Prinzip, das nur auf der Ebene von Klassen und Modulen angewendet wurde.</p></ld-supplemental></ld-topic>
<ld-topic id="dependency-inversion-principle-dip"><h2>Dependency Inversion Principle (DIP)</h2><ld-deck><ld-card><blockquote class="epigraph"><p>…all well-structured [object-oriented] architectures have clearly defined layers, with each layer providing some coherent set of services through a well-defined and controlled interface…</p><p class="attribution">—Grady Booch</p></blockquote></ld-card><ld-card class="incremental"><blockquote class="epigraph"><p>High-Level-Module sollten nicht von Low-Level-Modulen abhängen. Beide sollten von Abstraktionen abhängen.</p><p>Abstraktionen sollten nicht von Details abhängen. Details sollten von Abstraktionen abhängen.</p><p class="attribution">—Agile Software Development; Robert C. Martin; Prentice Hall, 2003</p></blockquote></ld-card></ld-deck><ld-supplemental><p><strong>Mögliche Interpretation</strong></p><p>Je höher das Modul in einer Schichtenarchitektur positioniert ist, desto allgemeiner ist die Funktion, die es implementiert.</p><p>Je niedriger das Modul, desto detaillierter ist die Funktion, die es implementiert.</p><p><strong>Ein Klassendesign, dass das DIP verletzt:</strong></p><object class="align-center" data="drawings/dip-layers/traditionelle-schichtenabhaengigkeit.svg" type="image/svg+xml" role="img"></object><p><strong>Die Einhaltung des DIP sollte auf allen Ebenen der Architektur sichergestellt werden.</strong></p></ld-supplemental></ld-topic>
<ld-topic id="dependency-inversion-principle"><h2>Dependency Inversion Principle</h2><object class="align-center" data="drawings/dip-layers/dip-konforme-schichtenabhaengigkeit.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p class="rubric">Begründung</p><p>Gute Softwarekonzepte sind in Module gegliedert.</p><p>High-Level-Module enthalten die wichtigen politischen Entscheidungen und Geschäftsmodelle einer Anwendung. Sie definieren die Identität der Anwendung.</p><p>Low-Level-Module enthalten detaillierte Implementierungen einzelner Mechanismen, die zur Umsetzung der Richtlinie benötigt werden.</p></ld-supplemental></ld-topic>
<ld-topic id="open-closed-principle-ocp"><h2>Open-closed Principle (OCP)</h2><blockquote class="epigraph"><p>Ein Softwareartefakt sollte offen für Erweiterungen, aber abgeschlossen gegenüber Veränderungen sein.</p><p class="attribution">—Bertrand Meyer 1988, Robert C. Martin 1996</p></blockquote><ld-supplemental><p>D. h. es sollte möglich sein neue Erweiterungen zu realisieren ohne dass man die Software verändern, rekompilieren, neu bereitstellen (<span class="eng">to deploy</span>) oder vergleichbares muss. Klassisches Beispiel ist ein Texteditor wie VS Code, welcher durch <em>Extensions</em>/<em>Plug-Ins</em> erweitert werden kann; d. h. es die Software is erweiterbar ohne das man diese neu kompilieren muss.</p></ld-supplemental></ld-topic>
<ld-topic id="open-closed-principle-case-study"><h2>Open-closed Principle - Case Study<a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a></h2><object class="align-center" data="drawings/ocp-example/ocp-intended-subscriber_de.svg" type="image/svg+xml" role="img"></object><aside class="admonition incremental" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Ist dieses Design offen für Erweiterungen?</p></aside><ld-supplemental><p>In diesem Fall haben wir eine Architektur, die auf “Services” aufbaut welche lose gekoppelt sind und über Nachrichten kommunizieren.</p></ld-supplemental><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-2" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-2">2</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://dzone.com/articles/the-open-closed-principle-at-an-architectural-leve">Beispiel nach David Llobrega, 2019</a></p></aside></aside></ld-topic>
<ld-topic class="transition-scale" id="open-closed-principle-case-study-1"><h2>Open-closed Principle - Case Study</h2><object class="align-center" data="drawings/ocp-example/ocp-two-subscribers_de.svg" type="image/svg+xml" role="img"></object><aside class="admonition incremental" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Ist dieses Design <em>wirklich</em> offen für Erweiterungen?</p></aside><ld-supplemental><p>Das Problem ist, dass wir hier die Nachrichten - welche im Prinzip die Schnittstelle modellieren - relativ exakt an den Anforderungen des Services zur Bestimmung der Verfügbarkeit von Autos ausgerichtet haben.</p><p>Wie sähe in diesem Fall z. B. eine Erweiterung um einen Dienst für Kundenprämienberechnung aus?</p><p>Über die <span class="docutils literal">VereinbarungID</span> bekommen wir Zugriff auf die Daten des Kunden aber dies fordert dann mehr als einen <em>Lookup</em> in einer Datenbank und ggf. auch das Einbinden mehrerer Dienste, was es zu vermeiden gilt, da die Kopplung unnötig ansteigen würde.</p></ld-supplemental></ld-topic>
<ld-topic class="transition-scale" id="open-closed-principle-case-study-2"><h2>Open-closed Principle - Case Study</h2><ld-deck><ld-card><object class="align-center" data="drawings/ocp-example/ocp-multiple-subscribers_de.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay center-content incremental"><aside class="admonition width-75 backdrop-blur" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Wie stellen wir fest welche Informationen in eine Nachricht gehören, um offen für <em>relevante</em> Erweiterungen zu sein?</p></aside></ld-card></ld-deck><ld-supplemental><p>Eine Antwort darauf liefern ggf. <em>Bounded-Context</em> aus dem <em>Domain-driven Design</em></p><p>Ein <em>Bounded Context</em> ist ein Gültigkeitsbereich eines Domänenmodells, einer <a class="reference external" href="https://leanpub.com/ddd-referenz/read#ubiquitous-language">Ubiquitous Language</a> und die Basis für die Organisation des Projekts.[...]</p><blockquote><p><span class="warning">Eine Modellierung nach den Daten führt nicht zu sinnvollen Bounded Contexts, sondern eher zu komplexen Modellen. Wichtig ist, die Daten als Folge der Funktionalitäten zu modellieren.</span></p></blockquote><p>Domain-driven Design behandelt Beziehungen zwischen <em>Bounded Contexts</em> im sogenannten <em>Strategic Design</em>.</p><p><a class="reference external" href="https://www.heise.de/hintergrund/Domain-driven-Design-und-Bounded-Context-Eigentlich-ganz-einfach-oder-4634258.html?seite=all">https://www.heise.de/hintergrund/Domain-driven-Design-und-Bounded-Context-Eigentlich-ganz-einfach-oder-4634258.html?seite=all</a></p></ld-supplemental></ld-topic>
<ld-topic id="liskov-substitution-principle-lsp"><h2>Liskov Substitution Principle (LSP)</h2><ld-deck><ld-card><blockquote class="epigraph"><p>Subtypes must be substitutable for their base types.</p><p class="attribution">—Barbara Liskov, 1988</p></blockquote></ld-card><ld-card class="incremental"><p><strong>Moderne Interpretation</strong></p><p>Die Implementierungen von Schnittstellen müssen austauschbar sein.</p></ld-card></ld-deck><ld-supplemental><p>Im Original wird auf die Substituierbarkeit von Subtypen im Kontext der objekt-orientierten Programmierung eingegangen. Das Prinzip lässt sich aber auch auf andere Abstraktionsgeraden übertragen. Insbesondere auch auf die Ebene von Services deren Schnittstellen und Implementierungen.</p></ld-supplemental></ld-topic>
<ld-topic id="interface-segregation-principle-common-reuse-principle"><h2>Interface Segregation Principle &#x26; Common Reuse Principle</h2><ld-deck><ld-card><object class="align-center" data="drawings/segregation/no-segregation.svg" type="image/svg+xml" role="img"></object><p>(Ausgangszustand)</p></ld-card><ld-card class="incremental"><object class="align-center" data="drawings/segregation/no-segregation-2nd-service.svg" type="image/svg+xml" role="img"></object><p>(Geplante Erweiterung)</p></ld-card><ld-card class="incremental"><object class="align-center" data="drawings/segregation/effective-segregation.svg" type="image/svg+xml" role="img"></object><p>(Teilung der Schnittstelle)</p></ld-card></ld-deck><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Hänge nicht von Dingen ab, die du nicht benötigst.</p></aside><ld-supplemental><p>Segregation (<span class="ger">Abtrennung</span>) bezeichnet hier die Aufspaltung eines bestehenden Interfaces bei dem die Teile abgespalten werden, die logisch zu einer anderen Funktionalität gehören. d. h. die von der Schnittstelle zur Verfügung gestellte Funktionalität ist nicht homogen und wird deswegen in verschiedene Teile aufgeteilt.</p></ld-supplemental></ld-topic>
<ld-topic id="command-query-separation-cqs"><h2>Command-Query Separation (CQS)</h2><blockquote class="epigraph"><p>Methoden werden strikt aufgeteilt in:</p><p><strong>Abfragen</strong> (<span class="eng">Queries</span>), die keine Veränderung des Objektzustandes erlauben</p><p><strong>Kommandos</strong> (<span class="eng">Commands</span>), die den Zustand verändern, aber keine Werte zurückliefen</p><p class="attribution">—Bertrand Meyer, 1988</p></blockquote><aside class="admonition incremental" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Auf der Ebene von nachrichten- bzw. ereignisgetriebenen Systemen wird CQS zum CQRS erweitert (Command-Query Responsibility Segregation).</p></aside><ld-supplemental><p>Ein Java Iterator mit seiner „next“ Methode verletzt ganz klar dieses Prinzip!</p></ld-supplemental></ld-topic>
<ld-topic id="traditionelle-interaktion-mit-informationssystemen-crud"><h2>Traditionelle Interaktion mit Informationssystemen (CRUD)</h2><ld-grid class="default-layout"><ld-cell class="width-60" style="align-self:auto;"><object class="align-center" data="drawings/cqs_and_cqrs/crud.svg" type="image/svg+xml" role="img"></object><p>Darstellung nach <a class="reference external" href="https://martinfowler.com/bliki/CQRS.html">Martin Fowler</a>.</p></ld-cell><ld-cell class="width-40" style="align-self:auto;"><ol class="arabic simple"><li><p>Modell liest von DB</p></li><li><p>Service stellt Information für Präsentationsschicht bereit</p></li><li><p>Nutzer hat Änderung vorgenommen</p></li><li><p>Weiterleitung der Änderung</p></li><li><p>Modell validiert</p></li><li><p>Modell aktualisiert DB</p></li></ol></ld-cell></ld-grid><ld-supplemental><p>Darstellung einer Anwendung mit traditioneller Architektur.</p></ld-supplemental></ld-topic>
<ld-topic id="command-query-responsibility-segregation-principle"><h2>Command-Query Responsibility Segregation Principle</h2><ld-grid class="default-layout"><ld-cell class="width-60" style="align-self:auto;"><object class="align-center" data="drawings/cqs_and_cqrs/cqrs.svg" type="image/svg+xml" role="img"></object><p>Darstellung nach <a class="reference external" href="https://martinfowler.com/bliki/CQRS.html">Martin Fowler</a>.</p></ld-cell><ld-cell class="width-40" style="align-self:auto;"><ol class="arabic simple"><li><p>Abfrage-Modell liest von DB</p></li><li><p>Abfrage-Service stellt Information für Präsentations- schicht bereit</p></li><li><p>Nutzer hat Änderung vorgenommen</p></li><li><p>Weiterleitung der Änderung</p></li><li><p>Kommando-Modell validiert</p></li><li><p>Kommando-Modell aktualisiert DB</p></li></ol></ld-cell></ld-grid><ld-supplemental><p>Command-Query-Responsibility-Segregation (CQRS) wendet das CQS-Prinzip an, indem es separate Abfrage- und Befehlsnachrichten zum Abrufen bzw. Ändern von Daten verwendet.</p></ld-supplemental></ld-topic>
<ld-topic id="command-query-responsibility-segregation-principle-cqrs"><h2>Command-Query Responsibility Segregation Principle (CQRS)</h2><p class="rubric">Einsatzszenarien</p><ul class="incremental-list simple"><li><p>Die Anzahl an Schreibe- und Leseoperationen ist extrem unterschiedlich.</p></li><li><p>Die Datenmodelle bzgl. Abfragen und „Kommandos“ unterscheiden sich deutlich und es kommen ggf. mehrere Datenbanken zum Einsatz.</p></li><li><p>Die Validierung der Daten ist komplex.</p></li></ul><div class="incremental"><p class="rubric">Vorteile/Möglichkeiten</p><ul class="incremental-list list-with-explanations"><li><p>Die Modelle können von unterschiedlichen Teams entwickelt werden (im Rahmen einzelner Services).</p></li><li><p>Unterschiedliche Skalierung bzgl. Abfragen und Kommandos ist möglich.</p></li><li><p>Passt sehr gut zu ereignisgetriebenen Programmiermodellen/Architekturen.</p><p>Erlaubt sehr einfache Unterstützung von <em>Event Sourcing</em>.</p></li></ul></div></ld-topic>
<ld-topic class="new-section" id="moderne-architekturprinzipien-fur-verteilte-anwendungen"><h2>Moderne Architekturprinzipien für verteilte Anwendungen</h2></ld-topic>
<ld-topic id="gute-anwendungsarchitekturen"><h2>Gute Anwendungsarchitekturen</h2><div class="foundations"><p>Die (technischen) Ziele einer guten Anwendungsarchitektur <span class="incremental">sollten der Minimierung des Aufwands dienen, der notwendig ist, um das System zu entwickeln und zu warten bzw. weiterzuentwickeln.</span></p></div></ld-topic>

<ld-topic class="center-child-elements" id="section-1"><h2></h2><div class="foundations fade-out"><p>Die (technischen) Ziele einer guten Anwendungsarchitektur dienen der Minimierung des Aufwands, der notwendig ist, um das System zu entwickeln und zu warten bzw. weiterzuentwickeln.</p></div><div class="foundations incremental"><p>Eine gute Anwendungsarchitektur erlaubt es Entscheidungen, die sich <em>nicht</em> aus den Geschäftsanforderungen ergeben, zu verzögern bzw. „leicht“ anpassbar zu machen.</p></div><ld-supplemental><p>Entscheidungen, die nicht am Anfang final getroffen werden sollten, da sie ggf. die Architektur dominieren:</p><ul class="simple"><li><p>Frameworks</p></li><li><p>Datenbanken</p></li><li><p>Webserver</p></li><li><p>Kommunikationsprotokolle</p></li><li><p>...</p></li></ul><p>Im RESTful-Beispiel hatten wir einen technischen Service for Augen - er implementiert keine wesentliche Geschäftslogik!</p></ld-supplemental></ld-topic>
<ld-topic id="traditionelle-n-schichten-architektur-wiederholung"><h2>Traditionelle n-Schichten Architektur (Wiederholung)</h2><object class="align-center" data="drawings/n-layer-architecture.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>Codeabhängigkeiten ergeben sich zum Beispiel beim Verwenden eines Object-relational Mappers (ORM).</p><p>Solch eine Architektur war Ende der 90er/Anfang der 2000er Standard und ist für einfache Programme auch heute noch akzeptabel, da diese häufig sehr schnell zu entwickeln sind und viel Erfahrung mit dieser Architektur vorhanden ist. Besser ist es jedoch gleich eine der folgenden Architekturen anzuwenden, um ggf. vorbereitet zu sein, wenn das System wächst.</p></ld-supplemental></ld-topic>
<ld-topic id="hexagonal-architecture-ports-adapters"><h2>Hexagonal Architecture (Ports &#x26; Adapters) <a class="brackets" href="#footnote-4" id="footnote-reference-4" role="doc-noteref"><span class="fn-bracket">[</span>4<span class="fn-bracket">]</span></a></h2><ld-deck><ld-card><object class="align-center" data="drawings/hexagonal-architecture/overview.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/hexagonal-architecture/control-flow-overlay.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/hexagonal-architecture/code-dependency-overlay.svg" type="image/svg+xml" role="img"></object></ld-card></ld-deck><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-4" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-4">4</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://alistair.cockburn.us/hexagonal-architecture/">Alistair Cockburn, 2005</a></p></aside></aside><ld-supplemental><p>Ziel der hexagonalen Architektur ist es die Anwendungslogik unabhängig von der UI und den Datenbanken etc. zu machen. Die Anwendungslogik/die Anwendungskomponenten sollen lose gekoppelt sein und einfach mit Ihrer Umgebung verbunden werden können durch die Nutzung von <em>Ports &#x26; Adapters</em>.</p><p>Für die Implementierung von <em>Primary Ports</em> werden oft <em>Inversion of Control Frameworks</em> verwendet.
Die Implementierung von <em>Secondary Ports</em> erfordert üblicherweise den Einsatz von <em>Dependency Inversion</em>.</p><p>Im Allgemeinen ist es oft notwendig in den Adaptern Entity Klassen hin und zurück „zu Mappen“, um sicherzustellen, dass keine technischen Abhängigkeiten in den Kern einsickern.</p><p>Die hexagonale Architektur wird von einigen als Ausgangsarchitektur für <em>Microservices</em> gesehen, da häufig einzelne Services nach diesem Architekturmuster implementiert werden.</p><blockquote class="epigraph"><p>Meine Heransgehensweise für die Planung einer komplexen Geschäftsanwendung ist in der Regel eine Kombination aus Domain Driven Design, Microservices und hexagonaler Architektur: Einsatz von Strategic Design zur Planung von Core Domain, Sub Domains und Bounded Contexts. Aufteilung eines Bounded Contexts in einen oder mehrere Microservices. Ein Microservice kann ein oder mehrere Aggregates enthalten, aber auch den kompletten Bounded Context, sofern dieser nicht zu groß ist (und statt des gewünschten Microservices wieder ein Monolith entsteht).</p><p class="attribution">—<a class="reference external" href="https://www.happycoders.eu/de/software-craftsmanship/hexagonale-architektur/">https://www.happycoders.eu/de/software-craftsmanship/hexagonale-architektur/</a></p></blockquote></ld-supplemental></ld-topic>
<ld-topic id="onion-architecture"><h2><em>Onion Architecture</em> <a class="brackets" href="#footnote-5" id="footnote-reference-5" role="doc-noteref"><span class="fn-bracket">[</span>5<span class="fn-bracket">]</span></a></h2><ld-deck><ld-card><object class="align-center" data="drawings/onion-architecture/overview.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/onion-architecture/code-dependencies-overlay.svg" type="image/svg+xml" role="img"></object></ld-card></ld-deck><ld-supplemental><p>Schlüssellehren der <em>Onion Architecture</em> (Zwiebelarchitektur):</p><ul class="simple"><li><p>Die Anwendung ist rund um ein unabhängiges Objektmodel gebaut.</p></li><li><p>Innere Schichten definieren Schnittstellen.</p></li><li><p>Äußere Schichten implementieren Schnittstellen.</p></li><li><p>Die Richtung der Kopplung ist immer in Richtung zum Zentrum!</p></li><li><p>Der Anwendungskern (<em>Application Core</em>) kann immer ohne die Infrastruktur kompiliert und davon unabhängig ausgeführt werden.</p></li></ul></ld-supplemental><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-5" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-5">5</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://jeffreypalermo.com/2008/07/the-onion-architecture-part-1/">Jeffrey Palermo, 2008</a></p></aside></aside></ld-topic>
<ld-topic id="clean-architecture-martin2017"><h2><em>Clean Architecture</em> <a class="citation-reference" href="#martin2017" id="citation-reference-2" role="doc-biblioref">[Martin2017]</a></h2><ld-deck><ld-card><object class="align-center" data="drawings/clean-architecture/entities-ring.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/clean-architecture/use-cases-ring.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/clean-architecture/controllers-ring.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/clean-architecture/web-ring.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/clean-architecture/code-abhaengigkeiten.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/clean-architecture/legende.svg" type="image/svg+xml" role="img"></object></ld-card></ld-deck><ld-supplemental><p class="rubric">Entities</p><p>Entitäten (<span class="eng">Entities</span>) kapseln unternehmensweite kritische Geschäftsregeln.</p><ul class="simple"><li><p>Objekte mit Methoden</p></li><li><p>Datastrukturen</p></li><li><p>Funktionen</p></li><li><p>...</p></li></ul><p>Entitäten sind „Dinge“, die sich nicht aufgrund externer (technischer) Änderungen ändern sollten. Zum Beispiel aufgrund von geänderten Sicherheitsanforderungen oder der verwendeten Datenbank.</p><p class="rubric">Use Cases</p><p>Anwendungsspezifische Geschäftsregeln orchestrieren den Fluss der Daten von und zu den Entitäten; Änderungen an den Anwendungsfällen (<em>Use Cases</em>) sollten auf die Entitäten keinen Einfluss haben.</p><p class="rubric">Controllers, Gateways, Presenters</p><p>Die Aufgabe des Rings der Schnittstellen und Adapter ist die Konvertierung der Daten der Anwendungsfällen/Use Cases bzw. Entitäten und dem Format, dass für die externen Funktionalitäten sinnvoll ist.</p><p>In diesem Ring erfolgt zum Beispiel die Implementierung des MVC Patterns für eine GUI, oder das ORM Mapping.</p><p class="rubric">DBs, Web, Devices</p><p>In diesem Ring befinden sich die externen Details, in der Regel gibt es hier keinen oder nur minimalen <em>Glue Code</em>.</p><p class="rubric">Code Abhängigkeiten</p><p>Wie bei den anderen Architekturen auch, gehen auch hier die Abhängigkeiten immer von außen nach innen. D. h. die Entitäten sind von nichts abhängig, die Anwendungsfälle von den Entitäten, die Schnittstellen von den Anwendungsfällen und die externen Details von den Schnittstellen.</p></ld-supplemental></ld-topic>
<ld-topic id="clean-architecture-prototypische-implementierung"><h2><em>Clean Architecture</em> - Prototypische Implementierung</h2><ld-deck><ld-card><object class="align-center" data="drawings/clean-architecture/uml-overview.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="drawings/clean-architecture/uml-kontrollfluss.svg" type="image/svg+xml" role="img"></object></ld-card></ld-deck><ld-supplemental><p>Mit einer solchen Implementierung sind auch echte initiale Kosten verbunden - mehrere Interfaces müssen implementiert und gewartet werden. Partielle Lösungen sind denkbar, müssen aber wohl überlegt sein, um ungewünschte Abhängigkeiten zu vermeiden, die häufig zu einer schlechten Wartbarkeit und langfristigen bzw. verzögerten Kosten führen.</p></ld-supplemental></ld-topic>
<ld-topic id="gemeinsamkeiten-aktueller-architekturen"><h2>Gemeinsamkeiten aktueller Architekturen</h2><ul class="incremental-list simple"><li><p>Unabhängig von Frameworks</p></li><li><p>Testbar</p></li><li><p>Unabhängig von der Benutzerschnittstelle</p></li><li><p>Unabhängig von Datenbanken</p></li><li><p>Unabhängig von jeglichen externen Agenten/Systemen</p></li></ul></ld-topic>
