aber ggf. auch ChatGPT, Ollama mit Gemma/LLama/Qwen oder OpenCode mit
Kimi/Qwen/Deepseek...) unterstützend eingesetzt.
Dies erfolgte insbesondere zur Unterstützung bei der Generierung von Grafiken
(d. h. SVG Dateien), oder um sich Übersichtstabellen generieren zu lassen.
Weiterhin wurde KI zur allgemeinen Qualitätssicherung eingesetzt.
Inhalte, die ggf. von der KI vorgeschlagen wurden, wurden im Falle der
Übernahme explizit validiert und angepasst.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-move-to-top" id="passworter-verwendung-und-angriffe"><h2>Passwörter: Verwendung und Angriffe</h2></ld-topic>
<ld-topic id="verwendung-von-passworten"><h2>Verwendung von Passworten</h2><ld-story><ld-grid class="default-layout"><ld-cell class="width-40" style="align-self:auto;"><img class="incremental align-center" src="logos/android.webp" alt="Android Smartphone"></ld-cell><ld-cell class="width-20" style="align-self:auto;"><img class="incremental align-center" src="logos/cryptostick.jpg" alt="Cryptostick"><p class="text-align-center incremental font-size-300">🛜</p></ld-cell><ld-cell class="width-40" style="align-self:auto;"><img class="incremental align-center" src="logos/filevault.jpeg" alt="Filevault Logo"><img class="incremental align-center" src="logos/veracrypt.webp" alt="Veracrypt Logo"></ld-cell></ld-grid><aside class="admonition incremental" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Klassische Passwörter werden (noch immer) in zahlreichen Bereichen verwendet. Beispiele sind Smartphones, Cryptosticks, Logins für Computer und Serversysteme, verschlüsselte Dateien und Datenträger.</p></aside></ld-story><ld-supplemental><p class="rubric">Hintergrund</p><p>Obwohl an vielen Stellen versucht wird Passwörter aus vielen Gründen zurück zu drängen, so ist die Verwendung noch allgegenwärtig und in machen Bereichen ist auch nicht unmittelbar eine Ablösung zu erkennen.</p><p>Biometrie ist zum Beispiel in machen Bereichen kein Ersatz für Passwörter und wird - wenn überhaupt - nur ergänzend genommen. So ist es zum Beispiel im deutschen Recht erlaubt/möglich einem Beschuldigten sein Smartphone bei Bedarf vor das Gesicht zu halten, um es zu entsperren (Stand 2025). Je nach Qualität des Fingerabdrucksensors können ggf. auch genommene Fingerabdrücke verwendet werden. Möchte der Beschuldigte jedoch das Passwort nicht freiwillig nennen, dann besteht keine direkte weitere Handhabe.</p></ld-supplemental></ld-topic>
<ld-topic id="passwortbasierte-angriffe-auf-unternehmen"><h2>Passwortbasierte Angriffe auf Unternehmen</h2><blockquote class="epigraph"><p>Microsoft said hackers working for the Russian government breached its corporate networks recently and stole email from executives and some employees to find out what the company knew about them. The tech company said the breach was not due to any flaw in its software, but rather began with a “password spraying.” The technique worked on what Microsoft said was an old test account, and the hackers then used the account’s privileges to get access to multiple streams of email.</p><p class="attribution">—19. Januar 2024: The Washington Post; Joseph Menn</p></blockquote></ld-topic>
<ld-topic id="angriffe-auf-passworte"><h2>Angriffe auf Passworte</h2><blockquote class="epigraph"><p><strong>Researchers Uncover How Outlook Vulnerability Could Leak Your NTLM Passwords</strong></p><p>A now-patched security flaw in Microsoft Outlook could be exploited by threat actors to access NT LAN Manager (NTLM) v2 hashed passwords when opening a specially crafted file.</p><p>[...]
Varonis security researcher Dolev Taler, who has been credited with discovering and reporting the bug, said NTLM hashes could be leaked by leveraging Windows Performance Analyzer (WPA) and Windows File Explorer. These two attack methods, however, remain unpatched.</p><p>"What makes this interesting is that WPA attempts to authenticate using NTLM v2 over the open web," Taler said.</p><p class="attribution">—29. Januar 2024: <a class="reference external" href="https://thehackernews.com/2024/01/researchers-uncover-outlook.html">The Hacker News</a></p></blockquote></ld-topic>
<ld-topic id="ist-passwortwiederherstellung-nicht-trivial"><h2>Ist Passwortwiederherstellung nicht „trivial“?</h2><ld-deck><ld-card><blockquote class="epigraph"><p><strong>59 Prozent aller Passwörter in unter 60 Minuten knackbar</strong></p><p><em>Forscher haben per Brute-Force-Methode mit einer Nvidia Geforce RTX 4090 Millionen von Passwörtern aus dem Darknet geknackt</em>.</p><p>[...] Sicherheitsforscher von Kaspersky haben untersucht, wie schnell sich gängige Passwörter mit einer modernen GPU vom Typ Nvidia Geforce RTX 4090 knacken lassen. Durchgeführt wurde die Untersuchung anhand einer Datenbank mit 193 Millionen echten Nutzerpasswörtern, die die Forscher aus dem Darknet bezogen. Sämtliche Passwörter lagen dabei in Form von gesalzenen MD5-Hashes vor. [...]</p><p class="attribution">—21. Juni 2024: <a class="reference external" href="https://www.golem.de/news/forscher-machen-den-test-59-prozent-aller-passwoerter-in-unter-60-minuten-knackbar-2406-186329.html">golem.de</a></p></blockquote></ld-card><ld-card class="incremental"><blockquote class="epigraph"><p><strong>An AI just cracked your password.</strong></p><p>We used [...] PassGAN to run through a list of 15,680,000 passwords. [...]</p><p>Time It Takes Using AI to Crack Your Password</p><ld-deck class="incremental"><ld-card><table class="font-size-75 highlight-row-on-hover compact"><colgroup><col style="width: 4.5%"><col style="width: 13.6%"><col style="width: 13.6%"><col style="width: 22.7%"><col style="width: 22.7%"><col style="width: 22.7%"></colgroup><thead><tr><th class="head"><p># of Chars</p></th><th class="head"><p>Numbers Only</p></th><th class="head"><p>Lowercase Letters</p></th><th class="head"><p>Lower- &#x26; Uppercase Letters</p></th><th class="head"><p>Numbers, Upper- &#x26; Lowercase Letters</p></th><th class="head"><p>Numbers, Upper- &#x26; Lowercase Letters, Symbols</p></th></tr></thead><tbody><tr><td><p>4</p></td><td><p>Instantly</p></td><td><p>Instantly</p></td><td><p>Instantly</p></td><td><p>Instantly</p></td><td><p>Instantly</p></td></tr><tr><td><p>5</p></td><td><p>Instantly</p></td><td><p>Instantly</p></td><td><p>Instantly</p></td><td><p>Instantly</p></td><td><p>Instantly</p></td></tr><tr><td><p>6</p></td><td><p>Instantly</p></td><td><p>Instantly</p></td><td><p>Instantly</p></td><td><p>Instantly</p></td><td><p>4 Seconds</p></td></tr><tr><td><p>7</p></td><td><p>Instantly</p></td><td><p>Instantly</p></td><td><p>22 Seconds</p></td><td><p>42 Seconds</p></td><td><p>6 Minutes</p></td></tr><tr><td><p>8</p></td><td><p>Instantly</p></td><td><p>3 Seconds</p></td><td><p>19 Minutes</p></td><td><p>48 Minutes</p></td><td><p>7 Hours</p></td></tr><tr><td><p>9</p></td><td><p>Instantly</p></td><td><p>1 Minutes</p></td><td><p>11 Hours</p></td><td><p>2 Days</p></td><td><p>2 Weeks</p></td></tr><tr><td><p>10</p></td><td><p>Instantly</p></td><td><p>1 Hours</p></td><td><p>4 Weeks</p></td><td><p>6 Months</p></td><td><p>5 Years</p></td></tr><tr><td><p>11</p></td><td><p>Instantly</p></td><td><p>23 Hours</p></td><td><p>4 Years</p></td><td><p>38 Years</p></td><td><p>356 Years</p></td></tr><tr><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td></tr></tbody></table></ld-card><ld-card class="incremental"><table class="font-size-75 highlight-row-on-hover compact"><colgroup><col style="width: 4.5%"><col style="width: 13.6%"><col style="width: 13.6%"><col style="width: 22.7%"><col style="width: 22.7%"><col style="width: 22.7%"></colgroup><thead><tr><th class="head"><p># of Chars</p></th><th class="head"><p>Numbers Only</p></th><th class="head"><p>Lowercase Letters</p></th><th class="head"><p>Lower- &#x26; Uppercase Letters</p></th><th class="head"><p>Numbers, Upper- &#x26; Lowercase Letters</p></th><th class="head"><p>Numbers, Upper- &#x26; Lowercase Letters, Symbols</p></th></tr></thead><tbody><tr><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td><td><p>...</p></td></tr><tr><td><p>12</p></td><td><p>25 Seconds</p></td><td><p>3 Weeks</p></td><td><p>289 Years</p></td><td><p>2K Years</p></td><td><p>30K Years</p></td></tr><tr><td><p>13</p></td><td><p>3 Minutes</p></td><td><p>11 Months</p></td><td><p>16K Years</p></td><td><p>91K Years</p></td><td><p>2M Years</p></td></tr><tr><td><p>14</p></td><td><p>36 Minutes</p></td><td><p>49 Years</p></td><td><p>827K Years</p></td><td><p>9M Years</p></td><td><p>187M Years</p></td></tr><tr><td><p>15</p></td><td><p>5 Hours</p></td><td><p>890 Years</p></td><td><p>47M Years</p></td><td><p>613M Years</p></td><td><p>14Bn Years</p></td></tr><tr><td><p>16</p></td><td><p>2 Days</p></td><td><p>23K Years</p></td><td><p>2Bn Years</p></td><td><p>26Bn Years</p></td><td><p>1Tn Years</p></td></tr><tr><td><p>17</p></td><td><p>3 Weeks</p></td><td><p>812K Years</p></td><td><p>539.72M Years</p></td><td><p>2Tn Years</p></td><td><p>95Tn Years</p></td></tr><tr><td><p>18</p></td><td><p>10 Months</p></td><td><p>22M Years</p></td><td><p>7.23Bn Years</p></td><td><p>96Tn Years</p></td><td><p>6Qn Years</p></td></tr></tbody></table></ld-card></ld-deck><p class="attribution">—2023: <a class="reference external" href="https://www.securityhero.io/ai-password-cracking/">Home Security Heroes</a></p></blockquote></ld-card></ld-deck><ld-supplemental><p>Auf der Webseite <a class="reference external" href="https://www.securityhero.io/ai-password-cracking/">https://www.securityhero.io/ai-password-cracking/</a> wird ein Tool angeboten, das eine Schätzung vornimmt wie lange eine AI braucht, um das Passwort zu knacken.</p><p>Empfohlene Tests:</p><ul class="simple"><li><p>start</p></li><li><p>Start</p></li><li><p>StartStart</p></li><li><p>startstart!</p></li></ul><p>Wie bewerten Sie die Einschätzungen dieses Tools?</p></ld-supplemental></ld-topic>
<ld-topic id="passwort-leaks"><h2>Passwort Leaks</h2><blockquote class="epigraph"><p><strong>Check Your Accounts: 10 Billion Passwords Exposed in Largest Leak Ever</strong></p><p>The "RockYou2024" database includes almost 10 billion passwords pulled from <span class="info">a mix of old and new data breaches</span>. Here's how to check if yours are at risk.</p><p>[...]Researchers at Cybernews have uncovered a massive trove of nearly 10 billion passwords on a popular hacking forum in what they're calling "largest password compilation" ever.</p><p>The file, titled <span class="docutils literal">rockyou2024.txt</span>, was posted on July 4 by someone going by the name ObamaCare and contains a mind-boggling 9,948,575,739 unique plaintext passwords. The user only joined the forum in late May, but they've posted data from other breaches, too. [...]</p><p class="attribution">—6. Juli 2024: <a class="reference external" href="https://uk.pcmag.com/security/153138/check-your-accounts-10-billion-passwords-exposed-in-largest-leak-ever">PCMag</a></p></blockquote></ld-topic>
<ld-topic id="raum-der-passwortkandidaten"><h2>Raum der Passwortkandidaten</h2><dl class="incremental-list field-list"><dt>vierstellige PIN<span class="colon">:</span></dt><dd><div class="incremental"><p>10.000 Kombinationen</p></div><ld-supplemental embed-in-document-flow=""><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Eine vierstellige PIN kann niemals als sicher angesehen werden. Selbst wenn ein Bruteforce nur auf 4 oder 5 Versuche pro Stunde kommt, so ist es dennoch in wenigen Monaten möglich die PIN zu ermitteln.</p></aside></ld-supplemental></dd><dt>Passwort mit 8 Zeichen und 70 Zeichen im Zeichensatz (a-z, A-Z, 0-9 und ausgewählte Sonderzeichen)<span class="colon">:</span></dt><dd><div class="incremental"><p>70⁸ = 576.480.100.000.000 ≈ 5,7 × 10¹⁴ Kombinationen</p></div></dd><dt>Passphrase mit 6 Wörtern aus einem Wörterbuch mit 2.000 Wörtern<span class="colon">:</span></dt><dd><div class="incremental"><p>2.000⁶ = 6,4 × 10¹⁹ Kombinationen</p></div></dd><dt>Passphrase mit 4 Wörtern aus einem Wörterbuch mit 100.000 Wörtern<span class="colon">:</span></dt><dd><div class="incremental"><p>100.000⁴ = 1 × 10²⁰ Kombinationen</p></div></dd><dt>Passwort mit 16 Zeichen und 84 Zeichen im Zeichensatz (a-z, A-Z, 0-9 und die meisten Sonderzeichen)<span class="colon">:</span></dt><dd><div class="incremental"><p>84¹⁶ = 6,14 × 10³⁰ Kombinationen</p></div></dd></dl></ld-topic>
<ld-topic id="quellen-fur-passwortkandidaten"><h2>Quellen für Passwortkandidaten</h2><ul class="incremental-list"><li><p>Wörterbücher</p></li><li><p>Verzeichnisse (z. B. Postleitzahlen, Städte, Straßennamen)</p></li><li><p>Leaks</p><p><span class="peripheral">(Sammlungen von realen Passwörtern, die meist von Hackern veröffentlicht wurden.)</span></p><ul class="simple"><li><p>Rockyou</p></li><li><p>LinkedIn</p></li><li><p>Sony</p></li><li><p>etc.</p></li></ul></li></ul></ld-topic>
<ld-topic id="qualitat-von-passworten"><h2>Qualität von Passworten</h2><p>Wie ist die Qualität der folgenden Passwörter zu bewerten in Hinblick darauf, wie aufwändig es ist das Passwort ggf. wiederherzustellen:</p><ol class="arabic incremental-list simple"><li><p><span class="docutils literal">Donaudampfschifffahrt</span></p></li><li><p><span class="docutils literal">Passwort</span></p></li><li><p><span class="docutils literal">ME01703138541</span></p></li><li><p><span class="docutils literal">2wsx3edc4rfv</span></p></li><li><p><span class="docutils literal">Haus Maus</span></p></li><li><p><span class="docutils literal">iluvu</span></p></li><li><p><span class="docutils literal">Emily18</span></p></li><li><p><span class="docutils literal">MuenchenHamburg2023!!!!</span></p></li><li><p><span class="docutils literal">hjA223dn4fw"üäKßß k`≤-~ajsdk</span></p></li><li><p><span class="docutils literal">Baum Lampe Haus Steak Eis Berg</span></p></li></ol></ld-topic>
<ld-topic class="new-section transition-fade" id="kryptografische-hashfunktionen-und-passworter"><h2>Kryptografische Hashfunktionen und Passwörter</h2></ld-topic>
<ld-topic class="center-content no-title" id="passworter-nicht-im-klartext-speichern"><h2>Passwörter nicht im Klartext speichern</h2><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Passwörter sind niemals im Klartext zu speichern.</p></aside></ld-topic>
<ld-topic class="repetition" id="hashfunktionen"><h2>Hashfunktionen</h2><ul class="incremental-list simple"><li><p>Eine Hashfunktion <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>H</mi></mrow><annotation encoding="application/x-tex">H</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0813em;">H</span></span></span></span></span> akzeptiert eine beliebig lange Nachricht <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>M</mi></mrow><annotation encoding="application/x-tex">M</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span></span></span></span></span> als Eingabe und gibt einen Wert fixer Größe zurück: <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>h</mi><mo>=</mo><mi>H</mi><mo stretchy="false">(</mo><mi>M</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">h = H(M)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord mathnormal">h</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0813em;">H</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mclose">)</span></span></span></span></span>.</p></li><li><p>Eine Änderung eines beliebigen Bits in <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>M</mi></mrow><annotation encoding="application/x-tex">M</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span></span></span></span></span> sollte mit hoher Wahrscheinlichkeit zu einer Änderung des Hashes <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>h</mi></mrow><annotation encoding="application/x-tex">h</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord mathnormal">h</span></span></span></span></span> führen.</p></li><li><p>Kryptographische Hashfunktionen werden für die Speicherung von Passwörtern verwendet.</p></li></ul><ld-supplemental><p class="rubric">Kollisionen bei Hashes</p><p>Wenn ein Passwort „nur“ als Hash gespeichert wird, dann gibt es zwangsläufig Kollisionen und es kann theoretisch passieren, dass ein Angreifer (zufällig) ein völlig anderes Passwort findet, das bei der Überprüfung des Passworts akzeptiert wird. Die Konstruktion kryptografischer Hashfunktionen stellt jedoch sicher, dass dies in der Praxis nicht auftritt. Sollte jedoch eine „normale Hashfunktion“ genommen werden, dann ist dieses Szenario durchaus realistisch.</p></ld-supplemental></ld-topic>

<ld-topic id="brute-force-angriff-auf-lange-passworte"><h2>Brute-Force Angriff auf lange Passworte</h2><p>Zeit für vollständigen Brute-Force Angriff</p><object class="align-center" data="dgraphs/brute_force.svg" type="image/svg+xml" role="img" aria-label="Zeit, die für Angriffe auf lange Passwörter benötigt wird."></object></ld-topic>
<ld-topic id="kryptografische-hashfunktionen-fur-passworte"><h2>Kryptografische Hashfunktionen für Passworte</h2><aside class="admonition incremental" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Bekannte kryptografische Hash-Funktionen wie <span class="s">MD4</span>, <span class="s">MD5</span>, SHA-256, SHA-512 oder auch RIPE-MD sind für das Hashen von Passwörtern nicht geeignet.</p></aside><ul class="incremental-list list-with-explanations"><li><p>Zur Schlüsselableitung bzw. zum Hashen von Passwörtern wurden spezialisierte Funktionen entwickelt. Zum Beispiel: PBKDF2, Scrypt, Bcrypt und die Argon2 Familie. Diese wiederstehen gängigen Angriffen.</p><div><p>PBKDF2 verwendet zum Beispiel beim Hashing von Passwörtern klassische Basisalgorithmen (z. B. SHA-256) und wiederholt diese mehrfach (ggf. viele hunderttausend Male), um die Laufzeit zu verlängern und es für Angreifer schwieriger zu machen.</p></div></li><li><p>Diese Algorithmen sind parametrisierbar, um sie an verschiedene Zwecke anpassen zu können.  Je nach Parametrisierung sind diese so rechenintensiv, dass sie z. B. nicht für Webanwendungen mit vielen Nutzern geeignet sind.</p></li></ul><ld-supplemental><p>Parametrisierungen, die die Laufzeit und den Speicherbedarf so stark erhöhen, dass eine Verwendung in Webanwendungen nicht mehr sinnvoll ist, können z. B. ideal sein zum Schutz von Dateien, Containern oder lokaler Festplatten.</p></ld-supplemental></ld-topic>
<ld-topic id="vom-salzen-salt"><h2>Vom Salzen (<span class="eng">Salt</span>) ...</h2><ld-story><div class="compound"><p><strong>Beobachtung/Problem</strong></p><p>Werden Passwörter direkt mit Hilfe einer kryptografischen Hashfunktion gehasht, dann haben zwei Nutzer, die das gleiche Passwort verwenden, den gleichen Hash.</p><table class="highlight-row-on-hover booktabs compact"><thead><tr><th class="head"><p>User</p></th><th class="head"><p>Hash</p></th></tr></thead><tbody><tr><td><p>Alice</p></td><td><p>sha256_crypt.hash('<strong>DHBWMannheim</strong>',salt='',rounds=1000) =
<span class="docutils literal">$5$rounds=1000$$lb/CwYgN/xR9dqYuYxYVtWkxMEh.VK.QOC9IKmy9DP/</span></p></td></tr><tr><td><p>Bob</p></td><td><p>sha256_crypt.hash('<strong>DHBWMannheim</strong>',salt='',rounds=1000) =
<span class="docutils literal">$5$rounds=1000$$lb/CwYgN/xR9dqYuYxYVtWkxMEh.VK.QOC9IKmy9DP/</span></p></td></tr></tbody></table></div><div class="compound incremental"><p><strong>Lösung</strong></p><p>Passwörter sollten immer mit einem einzigartigen und zufälligen „Salt“ gespeichert werden, um Angriffe mittels Regenbogentabellen zu verhindern.</p><table class="highlight-row-on-hover booktabs compact"><thead><tr><th class="head"><p>User</p></th><th class="head"><p>Hash</p></th></tr></thead><tbody><tr><td><p>Alice</p></td><td><p>sha256_crypt.hash('<strong>DHBWMannheim</strong>',<span class="emph">salt='0123456'</span>,rounds=1000) =
<span class="docutils literal">$5$rounds=1000$0123456$66x8MB.qev25coq9OVrD1lr1ZGJJelAzOV...</span></p></td></tr><tr><td><p>Bob</p></td><td><p>sha256_crypt.hash('<strong>DHBWMannheim</strong>',<span class="emph">salt='1234567'</span>,rounds=1000) =
<span class="docutils literal">$5$rounds=1000$1234567$LxD/hg29N9KYpNdFMW69Kk65BLkVLlzlSE...</span></p></td></tr></tbody></table></div></ld-story><ld-supplemental><p class="rubric">Rainbow Tables</p><p>Eine <em>Rainbow Table</em> (<span class="ger">Regenbogentabelle</span> - Verwendung jedoch nicht gängig) bezeichnet eine vorberechnete Tabelle, die konzeptionell zum einem Hash ein jeweilig dazugehörendes  Passwort speichert und einen effizienten Lookup ermöglicht. Dies kann ggf. die Angriffsgeschwindigkeit sehr signifikant beschleunigen, auch wenn die Tabellen sehr groß sind und ggf. in die Terabytes gehen.</p><p>Aufgrund der allgemeinen Verwendung von Salts sind Angriffe mit Hilfe von Regenbogentabellen heute (fast nur noch) von historischer Bedeutung.</p></ld-supplemental></ld-topic>
<ld-topic id="vom-salzen-salt-1"><h2>Vom Salzen (<span class="eng">Salt</span>)...</h2><ul class="incremental-list simple"><li><p>Ein <em>Salt</em> sollte ausreichend lang sein (zum Beispiel mind. 16 Zeichen oder 16 Byte).</p></li><li><p>Ein <em>Salt</em> darf nicht wiederverwendet werden.</p></li><li><p>Ein <em>Salt</em> wird am Anfang oder am Ende an das Passwort angehängt bevor selbiges gehasht wird.</p></li><li><p>Ein <em>Salt</em> unterliegt (eigentlich) keinen Geheimhaltungsanforderungen.</p></li></ul><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Sollte es einem Angreifer gelingen in eine Datenbank einzubrechen und die Tabellen mit den Nutzerdaten abzufragen (zum Beispiel aufgrund einer erfolgreichen SQL Injection), dann ist es ihm danach direkt möglich zu versuchen Passworte wiederherzustellen.</p></aside><ld-supplemental><p><strong>Speicherung von Salts</strong></p><p>In Webanwendungen bzw. allgemein datenbankgestützten Anwendungen wird der <em>Salt</em> häufig in derselben Tabelle gespeichert in der auch der Hash des Passworts gespeichert wird. Im Falle von verschlüsselten Dateien wird der Salt (unverschlüsselt) mit in der Datei gespeichert.</p></ld-supplemental></ld-topic>
<ld-topic id="und-pfeffern-pepper-von-passwortern"><h2>... und Pfeffern (<span class="eng">Pepper</span>) von Passwörtern</h2><div><p>(In Normen bzw. in anderer Literatur wird häufig statt <em>Pepper</em> <em>Secret Key</em> verwendet.)</p></div><ul class="incremental-list"><li><p>Wie ein <em>Salt</em> geht auch der <em>Secret Key</em> in den Hashvorgang des Passworts ein.</p></li><li><p>Der <em>Secret Key</em> wird jedoch <strong>nicht</strong> mit den Hashwerten der Passworte gespeichert.</p><ul class="incremental-list simple"><li><p>Ein <em>Secret key</em> kann zum Beispiel in einem Hardwaresicherheitsmodul (z. B. Secure Element oder TPM Chip) gespeichert werden.</p></li><li><p>Gel. wird der <em>Secret Key</em> bzw. ein Teil davon auch im Code bzw. einer Konfigurationsdatei gespeichert.</p></li></ul></li><li><p>Der <em>Secret Key</em> sollte zufällig sein.</p></li><li><p>Wie ein Salt sollte auch auch <em>Secret Key</em> mind. 16 Byte lang sein.</p><p>Diese Länge ist erforderlich um einen Brute-Force Angriff auf den <em>Secret Key</em> zu verhindern, sollte dem Angreifer zu <em>einem Hash und Salt auch noch das Klartext Passwort bekannt sein</em>.</p></li><li><p>Der <em>Secret Key</em> sollte pro Instanziierung einer Anwendung einmalig sein.</p></li></ul></ld-topic>
<ld-topic id="verwendung-sicherer-hash-bzw-schlusselableitungsfunktionen-fur-passworte"><h2>Verwendung sicherer Hash- bzw. Schlüsselableitungsfunktionen für Passworte</h2><aside class="admonition width-30" data-theme="note"><p class="admonition-title" data-theme="note-header">Bemerkung</p><p>Häufig werden die „Hashwerte“ von Passwörtern in Datenbanken oder Dateien  als Base64 kodierter String gespeichert.</p></aside><dl class="incremental-list dd-margin-left-6em field-list simple"><dt>Argon2<span class="colon">:</span></dt><dd><p>z. B. verwendete von LUKS2</p></dd><dt>bcrypt<span class="colon">:</span></dt><dd><p>basierend auf Blowfish; z. B. verwendet in OpenBSD</p></dd><dt>scrypt<span class="colon">:</span></dt><dd><p>z. B. (ergänzend) verwendet für das Hashing von Passwörtern auf Smartphones</p></dd><dt>yescrypt<span class="colon">:</span></dt><dd><p>z. B. moderne Linux Distributionen</p></dd><dt>PBKDF2-HMAC-SHA256<span class="colon">:</span></dt><dd><p>Ethereum Wallets</p></dd></dl></ld-topic>
<ld-topic id="pbkdf2-password-based-key-derivation-function-2"><h2><a class="reference external" href="https://datatracker.ietf.org/doc/html/rfc2898.html#section-5.2">PBKDF2</a> (Password-Based Key Derivation Function 2)</h2><ul class="incremental-list"><li><p>Dient der Ableitung eines Schlüssels aus einem Passwort.</p></li><li><p>Das Ergebnis der Anwendung der PBKDF2 wird zusammen mit dem <em>Salt</em> und dem Iterationszähler für die anschließende Passwortverifizierung gespeichert.</p></li><li><p>die <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>P</mi><mi>B</mi><mi>K</mi><mi>D</mi><mi>F</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">PBKDF2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="mord mathnormal" style="margin-right:0.0278em;">D</span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mord">2</span></span></span></span></span> Schlüsselableitungsfunktion hat 5 Parameter</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>D</mi><mi>K</mi><mo>=</mo><mi>P</mi><mi>B</mi><mi>K</mi><mi>D</mi><mi>F</mi><mn>2</mn><mo stretchy="false">(</mo></mrow><annotation encoding="application/x-tex">DK = PBKDF2(</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">D</span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="mord mathnormal" style="margin-right:0.0278em;">D</span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mord">2</span><span class="mopen">(</span></span></span></span></span>PRF, Password, Salt, c, dkLen<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mclose">)</span></span></span></span></span>:</p><blockquote><div class="smaller"><dl class="field-list simple"><dt>PRF<span class="colon">:</span></dt><dd><p>eine Pseudozufallsfunktion; typischer Weise ein HMAC<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></p></dd><dt>Password<span class="colon">:</span></dt><dd><p>das Masterpasswort</p></dd><dt>Salt<span class="colon">:</span></dt><dd><p>der zu verwendende Salt</p></dd><dt>c<span class="colon">:</span></dt><dd><p>Zähler für die Anzahl an Runden</p></dd><dt>dkLen<span class="colon">:</span></dt><dd><p>die Bitlänge des abgeleiteten Schlüssels (<span class="eng">derived key length</span>)</p></dd></dl></div></blockquote></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Ein HMAC bietet sich an, da wir ein Passwort und ein Hash haben.</p></aside></aside><ld-supplemental><p>Die PBKDF2 ist nicht für das eigentliche Hashen zuständig sondern „nur“ für das Iterieren der Hashfuntion und das eigentliche Key-stretching.</p><p>Laut OWASP sollten zum Beispiel für PBKDF2-HMAC-SHA512 600.000 Iterationen verwendet werden.</p></ld-supplemental></ld-topic>
<ld-topic id="pbkdf2-hmac"><h2>PBKDF2-HMAC</h2><p>(HMAC = Hash-based Message Authentication Code)</p><p>Im Fall von PBKDF2 ist das Passwort der HMAC Schlüssel (<span class="eng">Key</span>) und das Salz die Nachricht <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>M</mi></mrow><annotation encoding="application/x-tex">M</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span></span></span></span></span>.</p><p><strong>Beispielcode</strong></p><pre class="code python copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">from</span> passlib<span class="punctuation">.</span>crypto<span class="punctuation">.</span>digest <span class="keyword">import</span> pbkdf2_hmac
</code><small class="ln">2</small><code data-lineno="2">pbkdf2_hmac<span class="punctuation">(</span><span class="literal string">"sha256"</span><span class="punctuation">,</span>
</code><small class="ln">3</small><code data-lineno="3">    secret<span class="operator">=</span><span class="literal string">b"MyPassword"</span><span class="punctuation">,</span>
</code><small class="ln">4</small><code data-lineno="4">    salt<span class="operator">=</span><span class="literal string">b"JustASalt"</span><span class="punctuation">,</span>
</code><small class="ln">5</small><code data-lineno="5">    rounds<span class="operator">=</span><span class="literal number integer">1</span><span class="punctuation">,</span>   <span class="comment single"># a real value should be &gt;&gt; 500.000</span>
</code><small class="ln">6</small><code data-lineno="6">    keylen<span class="operator">=</span><span class="literal number integer">32</span> <span class="punctuation">)</span></code></pre><ld-supplemental><p>In der konkreten Anwendung ist es ggf. möglich das <em>Secret</em> auch zu Salzen und den <em>Salt</em> aus einer anderen Quellen abzuleiten.</p></ld-supplemental></ld-topic>
<ld-topic id="berechnung-der-ersten-runde-des-pbkdf2-hmac"><h2>Berechnung der ersten Runde des PBKDF2-HMAC</h2><p>Bei einer Runde und passenden Blockgrößen ist das Ergebnis der PBKDF2 somit gleich mit der Berechnung des HMACs wenn der Salt um die Nummer des Blocks <span class="docutils literal">\x00\x00\x00\x01</span> ergänzt wurde.</p><ld-story><p class="rubric">Implementierung in Python</p><pre class="code python copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">import</span> hashlib
</code><small class="ln">2</small><code data-lineno="2">pwd <span class="operator">=</span> <span class="literal string">b"MyPassword"</span>
</code><small class="ln">3</small><code data-lineno="3">stretched_pwd <span class="operator">=</span> pwd <span class="operator">+</span> <span class="punctuation">(</span><span class="literal number integer">64</span><span class="operator">-</span><span class="name builtin">len</span><span class="punctuation">(</span>pwd<span class="punctuation">)</span><span class="punctuation">)</span> <span class="operator">*</span> <span class="literal string">b"\x00"</span>
</code><small class="ln">4</small><code data-lineno="4">ikeypad <span class="operator">=</span> <span class="name builtin">bytes</span><span class="punctuation">(</span><span class="name builtin">map</span><span class="punctuation">(</span><span class="keyword">lambda</span> x <span class="punctuation">:</span> x <span class="operator">^</span> <span class="literal number integer">0x36</span> <span class="punctuation">,</span> stretched_pwd<span class="punctuation">)</span><span class="punctuation">)</span> <span class="comment single"># xor with ipad</span>
</code><small class="ln">5</small><code data-lineno="5">okeypad <span class="operator">=</span> <span class="name builtin">bytes</span><span class="punctuation">(</span><span class="name builtin">map</span><span class="punctuation">(</span><span class="keyword">lambda</span> x <span class="punctuation">:</span> x <span class="operator">^</span> <span class="literal number integer">0x5c</span> <span class="punctuation">,</span> stretched_pwd<span class="punctuation">)</span><span class="punctuation">)</span> <span class="comment single"># xor with opad</span>
</code><small class="ln">6</small><code data-lineno="6">
</code><small class="ln">7</small><code data-lineno="7">hash1 <span class="operator">=</span> hashlib<span class="punctuation">.</span>sha256<span class="punctuation">(</span>ikeypad<span class="operator">+</span><span class="literal string">b"JustASalt"</span><span class="operator">+</span><span class="literal string">b"\x00\x00\x00\x01"</span><span class="punctuation">)</span><span class="punctuation">.</span>digest<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">8</small><code data-lineno="8">hmac  <span class="operator">=</span> hashlib<span class="punctuation">.</span>sha256<span class="punctuation">(</span>okeypad<span class="operator">+</span>hash1<span class="punctuation">)</span><span class="punctuation">.</span>digest<span class="punctuation">(</span><span class="punctuation">)</span></code></pre><div class="incremental"><p class="rubric">Ergebnis</p><pre class="code text literal-block"><small class="ln">1</small><code data-lineno="1">hmac = b'h\x88\xc2\xb6X\xb7\xcb\x9c\x90\xc2R\xf8\xb1\xf7\x10
</code><small class="ln">2</small><code data-lineno="2">        \xb2L\x8a\xba\xfb\x9e|\x16\x87\x87\x0e\xad\xa1\xe1:9\xca'</code></pre></div></ld-story><ld-supplemental><p>HMAC ist auch direkt als Bibliotheksfunktion verfügbar.</p><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">import</span> hashlib
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">import</span> hmac
</code><small class="ln"> 3</small><code data-lineno=" 3">
</code><small class="ln"> 4</small><code data-lineno=" 4">hash_hmac <span class="operator">=</span> hmac<span class="punctuation">.</span>new<span class="punctuation">(</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="literal string">b"MyPassword"</span><span class="punctuation">,</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="literal string">b"JustASalt"</span><span class="operator">+</span><span class="literal string">b"\x00\x00\x00\x01"</span><span class="punctuation">,</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    hashlib<span class="punctuation">.</span>sha256<span class="punctuation">)</span><span class="punctuation">.</span>digest<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9">hash_hmac <span class="operator">=</span>
</code><small class="ln">10</small><code data-lineno="10">    b'h\x88\xc2\xb6X\xb7\xcb\x9c\x90\xc2R<span class="punctuation">.</span><span class="punctuation">.</span><span class="punctuation">.</span>
</code><small class="ln">11</small><code data-lineno="11">      \x16\x87\x87\x0e\xad\xa1\xe1<span class="punctuation">:</span><span class="literal number integer">9</span>\xca'</code></pre><p>Der Wert:</p><pre class="code python literal-block"><code><span class="literal string">b"\x00\x00\x00\x01"</span></code></pre><p>ist die Blocknummer (hier: 1).</p></ld-supplemental></ld-topic>
<ld-topic id="linux-unified-key-setup-luks"><h2>Linux Unified Key Setup (LUKS)</h2><blockquote class="epigraph"><p>Angriff auf LUKS2 mit Argon2</p><p>[…] The choice of Argon2 as a KDF makes GPU acceleration impossible. As a result, you’ll be restricted to CPU-only attacks, which may be very slow or extremely slow depending on your CPU. To give an idea, you can try 2 (that’s right, two) passwords per second on a single Intel(R) Core(TM) i7-9700K CPU @ 3.60GHz. Modern CPUs will deliver a slightly better performance, but don’t expect a miracle: LUKS2 default KDF is deliberately made to resist attacks. […]</p><p class="attribution">—Elcomsoft <a class="reference external" href="https://blog.elcomsoft.com/2022/08/probing-linux-disk-encryption-luks2-argon-2-and-gpu-acceleration">LUKS2 with Argon2</a></p></blockquote></ld-topic>
<ld-topic id="effizienz-eines-brute-force-angriffs-auf-luks2"><h2>Effizienz eines Brute-Force Angriffs auf LUKS2</h2><object class="align-center" data="dgraphs/brute_force-luks2.svg" type="image/svg+xml" role="img" aria-label="Zeit die für einen Angriff auf LUKS2 benötigt wird."></object></ld-topic>
<ld-topic class="transition-move-left exercises" id="ubung"><h2>Übung</h2><ld-story><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Schwachstellenbewertung"><p class="ld-exercise-title rubric"><span>Schwachstellenbewertung</span></p><p>Ihnen liegt eine externer Festplatte/SSD mit USB Anschluss vor, die die folgenden Eigenschaften hat:</p><ul class="incremental-list simple"><li><p>Die Daten auf der SSD/FP sind hardwareverschlüsselt.</p></li><li><p>Die Verschlüsselung erfolgt mit XTS-AES 256.</p></li><li><p>Es gibt eine spezielle Software, die der Kunde installieren muss, um das Passwort zu setzen. Erst danach wird die Festplatte „freigeschaltet“ und kann in das Betriebssystem eingebunden werden. Davor erscheint die SSD/FP wie ein CD Laufwerk auf dem die Software liegt.</p></li><li><p>Die SSD/FP ist FIPS zertifiziert und gegen Hardwaremanipulation geschützt; zum Beispiel eingegossen mit Epoxidharz.</p></li><li><p>Das Passwort wird von der Software gehasht und dann als Hash an den Controller der externen FP/SSD übertragen.</p></li><li><p>Im Controller wird der übermittelte Hash direkt zur Autorisierung des Nutzers verwendet. Dazu wird der Hash mit dem im EPROM hinterlegten verglichen.</p></li></ul><p class="incremental">Diskutieren Sie die Sicherheit der Passwortvalidierung und wie diese ggf. zu verbessern wäre.</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:iNEh6luaFjtA2b+nq8ZCco1k4CeYtmvqIlCODI/4tC8=:0zPWdf81Yj9ZJRd3:tCfRlrSsQcKSnKKFBh3gwZTBSaCRJnhYFkbd3ZQxIAi2Vvel3lPu1KCaw4WeEP5wmbKvSBDIInBCZOSs8NO6x240JCmXRxr70T/yqhGuwRGFGi8ujTSUOm7XazHT75zirgjrYe4fe78/MKjz0j7eUe94FGsryxwQ/kyl0nOLs3rSuYUoTWdhwTQvtWhA6PT0UgIIDgeuGqIDtGWBecsTJW9sgo/6pfyGBkhkyt+OcRX6xo7zB3/eGpXjcnov2+Hpuwg3VOjqbiZtIHe2DTsQ3vQPw/6PobVisa0d0xhSYih+s7gCmHV8SMboUQBpbTM5kaIN8Nvx6PLFzsHB65vK2amNExn99EK3lrD0CN3uYVWyTxp9gcMuHRiVpkR+C+s93tLwrW8YZxYC4s1oz3/R9O22FMBPLKfYJFNDYskvn0odqt2Dfmswo9uamnc4sLMR3nPbuecx5jvtabEZnbIhvbRCxhTpqttLNQEoNBl4gDo75U92S <ld-topic class="new-section transition-scale" id="passworte-verstehen"><h2>Passworte Verstehen</h2></ld-topic>
<ld-topic id="aufbau-von-passworten"><h2>Aufbau von Passworten</h2><p>Von Menschen vergebene Passwörter basieren häufig auf Kombinationen von Wörtern aus den folgenden Kategorien:</p><ul class="incremental-list simple"><li><p>Pins: <span class="docutils literal">1111</span>, <span class="docutils literal">1234</span>, <span class="docutils literal">123456</span>, …</p></li><li><p>Tastaturwanderungen (<span class="eng">keyboard walks</span>): <span class="docutils literal">asdfg</span>, <span class="docutils literal">q2w3e4r5t</span>, …</p></li><li><p>Patterns: <span class="docutils literal">aaaaa</span>, <span class="docutils literal">ababab</span>, <span class="docutils literal">abcabcabc</span>, …</p></li><li><p>Reguläre Wörter aus Wörterbüchern: Duden, Webster, …</p></li><li><p>Kontextinformationen:</p><ul class="simple"><li><p>szenetypisch:  <span class="docutils literal">acab</span>, <span class="docutils literal">1888</span>, <span class="docutils literal">1488</span><a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a>, oder bestimmte Marken (z. B. Gucci, Ferrari), …</p></li><li><p>privates Umfeld: Namen von Kindern, Eltern, Hunden, Geburtsort, Adresse, …</p></li></ul></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-2" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-2">2</a><span class="fn-bracket">]</span></span><p><span class="docutils literal">14</span> oder <span class="docutils literal">1488</span> ist ein numerischer Code für die vierzehn Worte des David Eden Lane.
(Er war ein Mitbegründer der Terrororganisation <em>The Order</em>, die für die Vorherrschaft der weißen Rasse in den USA kämpfte.)</p></aside></aside></ld-topic>
<ld-topic id="haufige-passworte"><h2>Häufige Passworte</h2><p>Eine gute Quelle für das Studium von Passwörtern sind sogenannte <em>Leaks</em> oder auch Listen mit gängigen Passwörtern. Zum Beispiel <a class="reference external" href="https://www.beckershospitalreview.com/cybersecurity/30-most-common-passwords-of-2023.html">Becker's Health IT 2023</a>:</p><ld-grid class="monospaced default-layout"><ld-cell class="width-33 text-align-center" style="align-self:auto;"><p>123456</p><p>password</p><p>123456789</p><p>12345</p><p>12345678</p><p>qwerty</p><p>1234567</p><p>111111</p><p>1234567890</p></ld-cell><ld-cell class="width-33 text-align-center" style="align-self:auto;"><p>123123</p><p>abc123</p><p>1234</p><p>password1</p><p>iloveyou</p><p>1q2w3e4r</p><p>000000</p><p>qwerty123</p><p>zaq12wsx</p></ld-cell><ld-cell class="width-33 text-align-center" style="align-self:auto;"><p>dragon</p><p>sunshine</p><p>princess</p><p>letmein</p><p>654321</p><p>monkey</p><p>27653</p><p>1qaz2wsx</p><p>123321</p></ld-cell></ld-grid><ld-supplemental><p><strong>Hinweise</strong></p><ul class="simple"><li><p>Die Listen ändern sich in der Regel von Jahr zu Jahr nicht wesentlich.</p></li><li><p>Die konkrete Methodik ist oft fragwürdig; in der Gesamtheit aber dennoch aussagekräftig.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="die-struktur-von-passwortern-verstehen"><h2>Die Struktur von Passwörtern verstehen</h2><div><p>Analyse auf Grundlage des „berühmten“ Rockyou-Lecks.</p><p>Hier haben wir alle Kleinbuchstaben auf l, Großbuchstaben auf u, Ziffern auf d und Sonderzeichen auf s abgebildet.</p></div><table class="compact monospaced font-size-70 highlight-cell-on-hover" style="width: 100%;"><tbody><tr><td><p>llllllll</p></td><td><p>4,8037%</p></td><td><p>lllllllldd</p></td><td><p>1,4869%</p></td><td><p>dddddddddddd</p></td><td><p>0,2683%</p></td><td><p>ddddddll</p></td><td><p>0,1631%</p></td></tr><tr><td><p>llllll</p></td><td><p>4,1978%</p></td><td><p>lllllld</p></td><td><p>1,3474%</p></td><td><p>lllddddd</p></td><td><p>0,2625%</p></td><td><p>lllllls</p></td><td><p>0,1615%</p></td></tr><tr><td><p>lllllll</p></td><td><p>4,0849%</p></td><td><p>llllllld</p></td><td><p>1,3246%</p></td><td><p>lllllllllldd</p></td><td><p>0,2511%</p></td><td><p>ddddlll</p></td><td><p>0,1613%</p></td></tr><tr><td><p>lllllllll</p></td><td><p>3,6086%</p></td><td><p>llllllllllll</p></td><td><p>1,3223%</p></td><td><p>llllllllllllllll</p></td><td><p>0,2340%</p></td><td><p>dlllllll</p></td><td><p>0,1583%</p></td></tr><tr><td><p>ddddddd</p></td><td><p>3,4003%</p></td><td><p>llldddd</p></td><td><p>1,2439%</p></td><td><p>lllldddddd</p></td><td><p>0,2322%</p></td><td><p>dllllll</p></td><td><p>0,1575%</p></td></tr><tr><td><p>dddddddddd</p></td><td><p>3,3359%</p></td><td><p>llllldddd</p></td><td><p>1,2109%</p></td><td><p>llddddd</p></td><td><p>0,2270%</p></td><td><p>llllddddd</p></td><td><p>0,1560%</p></td></tr><tr><td><p>dddddddd</p></td><td><p>2,9878%</p></td><td><p>lllllldddd</p></td><td><p>1,1204%</p></td><td><p>uuuuuudd</p></td><td><p>0,2189%</p></td><td><p>dddddddl</p></td><td><p>0,1557%</p></td></tr><tr><td><p>lllllldd</p></td><td><p>2,9326%</p></td><td><p>lllllllld</p></td><td><p>1,1168%</p></td><td><p>ddddll</p></td><td><p>0,2169%</p></td><td><p>uuuudd</p></td><td><p>0,1551%</p></td></tr><tr><td><p>llllllllll</p></td><td><p>2,9110%</p></td><td><p>lllllddd</p></td><td><p>1,0633%</p></td><td><p>lddddddd</p></td><td><p>0,2064%</p></td><td><p>lllllddddd</p></td><td><p>0,1395%</p></td></tr><tr><td><p>dddddd</p></td><td><p>2,7243%</p></td><td><p>llllllddd</p></td><td><p>0,9225%</p></td><td><p>ddddddddddddd</p></td><td><p>0,2017%</p></td><td><p>ddllllll</p></td><td><p>0,1391%</p></td></tr><tr><td><p>ddddddddd</p></td><td><p>2,1453%</p></td><td><p>llllllllld</p></td><td><p>0,9059%</p></td><td><p>ullllldd</p></td><td><p>0,1930%</p></td><td><p>ulllll</p></td><td><p>0,1379%</p></td></tr><tr><td><p>llllldd</p></td><td><p>2,0395%</p></td><td><p>lllll</p></td><td><p>0,8793%</p></td><td><p>ddddllll</p></td><td><p>0,1905%</p></td><td><p>uuuuuuuuuu</p></td><td><p>0,1378%</p></td></tr><tr><td><p>llllllldd</p></td><td><p>1,9092%</p></td><td><p>lllllllllllll</p></td><td><p>0,8334%</p></td><td><p>uuuuuuuuu</p></td><td><p>0,1886%</p></td><td><p>llllllls</p></td><td><p>0,1374%</p></td></tr><tr><td><p>lllllllllll</p></td><td><p>1,8697%</p></td><td><p>llllld</p></td><td><p>0,8005%</p></td><td><p>uuuuudd</p></td><td><p>0,1815%</p></td><td><p>lllllllllld</p></td><td><p>0,1345%</p></td></tr><tr><td><p>lllldddd</p></td><td><p>1,6420%</p></td><td><p>llllddd</p></td><td><p>0,7759%</p></td><td><p>lllllllllddd</p></td><td><p>0,1808%</p></td><td><p>llllllllllldd</p></td><td><p>0,1344%</p></td></tr><tr><td><p>lllldd</p></td><td><p>1,5009%</p></td><td><p>ddddddddddd</p></td><td><p>0,7524%</p></td><td><p>llllllllldddd</p></td><td><p>0,1725%</p></td><td><p>…</p></td><td><p>…</p></td></tr></tbody></table></ld-topic>

<ld-topic class="transition-move-left exercises" id="gedankenexperiment-1"><h2>Gedankenexperiment</h2><div class="ld-exercise" id="ld-exercise-3" data-exercise-id="3" data-exercise-title="3 - Verstehen des Suchraums"><p class="ld-exercise-title rubric"><span>Verstehen des Suchraums</span></p><p>Sie haben „ganz viele“ Grafikkarten und einen sehr schnellen Hash. Sie kommen auf eine Hashrate von 1 THash/Sekunde (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mo>×</mo><msup><mn>10</mn><mn>12</mn></msup></mrow><annotation encoding="application/x-tex">1 \times 10^{12}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">12</span></span></span></span></span></span></span></span></span></span></span></span></span>). Sie haben einen Monat Zeit für das Knacken des Passworts.
Gehen Sie vereinfacht davon aus, dass Ihr Zeichensatz 100 Zeichen umfasst.</p><p>Berechnen Sie den Anteil des Suchraums, den Sie abgesucht haben, wenn das Passwort 32 Zeichen lang sein sollte und Sie dies wissen. Drücken Sie den Anteil des abgesuchten Raums in Relation zu der Anzahl der Sandkörner der Sahara aus. Gehen Sie davon aus, dass die Sahara ca. 70 Trilliarden (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>70</mn><mo>×</mo><msup><mn>10</mn><mn>21</mn></msup></mrow><annotation encoding="application/x-tex">70 \times 10^{21}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">70</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">21</span></span></span></span></span></span></span></span></span></span></span></span></span>) Sandkörner hat.<a class="brackets" href="#footnote-3" id="footnote-reference-3" role="doc-noteref"><span class="fn-bracket">[</span>3<span class="fn-bracket">]</span></a></p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:EAaNu4vCqaWrP1LoaLCHXQzzCSYgqSz2TF2I81Tm/2E=:gjEb+JRw9WhcmfoS:Kql999YlAb7QVf0Lg8B2H9UNteL+WHieosQNp6/cvprv9xSnJA8TNa4Z2n2vghmoRqDxqrWsWaFfWuxHk8EVyYZENWa0gpirYl67RDxTc6dvclitgYtYbseVMnQprFVGXbO0Hx8NLv1 <ld-topic id="effekte-von-passwortrichtlinien"><h2>Effekte von Passwortrichtlinien</h2><p>Moderne Passwortrichtlinien (<span class="eng">Password Policies</span>) machen es unmöglich, ältere Leaks <em>direkt</em> zu nutzen.</p><p><em>Beispiele:</em></p><ul class="incremental-list simple"><li><p>Mindestanzahl von Zeichen (maximale Anzahl von Zeichen)</p></li><li><p>Anforderungen an die Anzahl der Ziffern, Sonderzeichen, Groß- und Kleinbuchstaben</p></li><li><p>Anforderungen an die Vielfalt der verwendeten Zeichen</p></li><li><p>einige Passwörter (z. B. aus bekannten Leaks und Wörterbüchern) sind verboten</p></li><li><p>...</p></li></ul><ld-supplemental><p>Passwortrichtlinien extrem: <a class="reference external" href="https://neal.fun/password-game/">Password Game</a></p><p>Die wichtigsten <a class="reference external" href="https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-63b.pdf">NIST-Richtlinien</a> für Passwörter:</p><ul class="simple"><li><p>Mindestlänge von 8 Zeichen.</p></li><li><p>Keine Komplexitätsanforderung. Benutzer sollten auch die Möglichkeit haben, Leerzeichen einzufügen, um die Verwendung von Phrasen zu ermöglichen. Für die Benutzerfreundlichkeit [...] kann es von Vorteil sein, wiederholte Leerzeichen in getippten Passwörtern vor der Überprüfung zu entfernen.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="der-effekt-von-passwortrichtlinien-auf-passworter"><h2>Der Effekt von Passwortrichtlinien auf Passwörter</h2><p>Reale Passwortrichtlinie eines speziellen Messengers:</p><blockquote><p>Nutze 1 Großbuchstabe, 1 Kleinbuchstabe, 2 Symbole, 2 Ziffern, 4 Buchstaben, 4 Nicht-Buchstaben</p></blockquote><div class="incremental"><p>Exemplarisch beobachteter Effekt, wenn die Passwörter vorher einfacher waren und der Benutzer gezwungen wurde diese zu erweitern:</p><blockquote><p>Password11##</p><p>Password12!!</p></blockquote><p>d. h. die Passworte werden mit möglichst geringem Aufwand erweitert.</p></div></ld-topic>
<ld-topic id="aufbau-von-passwortern-zusammenfassung"><h2>Aufbau von Passwörtern - Zusammenfassung</h2><ul class="simple"><li><p>Passwörter, die häufig eingegeben werden müssen, <em>basieren</em> in vielen Fällen auf „echten“ Wörtern.</p></li><li><p>Echte Wörter werden oft nicht unverändert verwendet, sondern nach einfachen Regeln umgewandelt, z. B. durch Anhängen einer Zahl oder eines Sonderzeichens, Veränderung der Groß-/Kleinschreibung, etc.</p></li></ul><aside class="admonition incremental" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Wie können wir gute Passwortkandidaten identifizieren/generieren, wenn ein <em>Leak</em> nicht ausreicht oder nur eine kleine Anzahl von Passwörtern getestet werden kann?</p><div class="incremental"><p>Zum Beispiel dauert das Testen aller Passwörter von Rockyou...:</p><p>~13.000.000 Passworte / 5 Hashes/Sekunde ≈ 1 Monat</p><p>~13.000.000 Passworte / 5 Hashes/Stunde ≈ ~297 Jahre</p></div></aside></ld-topic>
<ld-topic class="new-section" id="das-vorgehen-von-angreifern-verstehen"><h2>Das Vorgehen von Angreifern verstehen</h2></ld-topic>
<ld-topic id="vorgehensweise-beim-testen-generieren-von-passwortern"><h2>Vorgehensweise beim Testen/Generieren von Passwörtern</h2><p>Aufgrund der „Unmöglichkeit“ eines Brute-Force-Angriffs ist Folgendes zu beachten:</p><ul class="incremental-list simple"><li><p>Verfügbare <em>Kontextinformationen sollten in die Auswahl/Generierung einfließen</em>.</p></li><li><p>Es sollten nur <em>technisch sinnvolle</em> Passwörter getestet/generiert werden.</p></li><li><p>Es sollten <em>keine Duplikate</em> getestet werden.</p></li><li><p>Auswahl/Generierung von <em>Passwörten in absteigender Wahrscheinlichkeit</em>.</p></li><li><p><span class="peripheral">Die Auswahl/Generierung sollte effizient sein.</span></p></li></ul><ld-supplemental><p>Technisch sinnvolle Passwörter sind solche, die die zu Grunde liegenden Passwortrichtlinien und auch weiteren technischen Anforderungen erfüllen. Zum Beispiel den von der Software verwendeten Zeichensatz (UTF-8, ASCII, ...) oder im Falle eines Smartphones/Kryptosticks die eingebbaren Zeichen.</p><blockquote><p>Auf einer deutschen Standardtastatur für Macs können in Kombination mit „Shift“, „Alt“ und „Alt+Shift“ zum Beispiel 192 verschiedene Zeichen eingegeben werden – ohne auf Unicode oder Zeichentabellen zurückgreifen zu müssen.</p></blockquote><p>Sollte der Algorithmus zum Generieren der Passwörter langsamer sein als die Zeit, die benötigt wird, um ein Passwort zu falsifizieren, dann beschränkt nicht mehr länger nur die Hashrate den Suchraum.</p></ld-supplemental></ld-topic>
<ld-topic id="ansatze-und-werkzeuge-zum-generieren-von-passwortlisten"><h2>Ansätze und Werkzeuge zum Generieren von Passwortlisten</h2><ul class="simple"><li><p>Grundlegende Werkzeuge zum „Vermischen von Wörtern“ (<span class="eng">word mangling</span>)</p><ul class="simple"><li><p>Prince</p></li><li><p>Markov-Modelle (OMEN)</p></li><li><p>Hashcat</p></li><li><p>...</p></li></ul></li></ul><div class="incremental"><p>Um vorhandene Kontextinformationen zu erweitern, können ggf. (frei) verfügbare Wordembeddings verwendet werden.</p><ul class="simple"><li><p><a class="reference external" href="https://relatedwords.org/relatedto/Ferrari">RelatedWords.org</a> setzt (unter anderem) auf ConceptNet und WordEmbeddings.</p></li><li><p><a class="reference external" href="https://reversedictionary.org/wordsfor/Manhattan">Reversedictionary.org</a> setzt auf WordNet und liefert ergänzende Ergebnisse.</p></li></ul></div></ld-topic>
<ld-topic id="markov-ketten"><h2>Markov-Ketten</h2><div class="encapsulate-floats"><aside class="admonition width-40" data-theme="note"><p class="admonition-title" data-theme="note-header">Bemerkung</p><p>Eine Markov-Kette beschreibt eine Sequenz möglicher Ereignisse in welcher die Wahrscheinlichkeit des nächsten Ereignisses nur vom Zustand des vorherigen Ereignis abhängt.</p></aside><p>OMEN lernt - zum Beispiel basierend auf Leaks - die Wahrscheinlichkeiten für das Aufeinanderfolgen von Bigrammen und Trigrammen und nutzt diese, um neue Passwortkandidaten zu generieren.</p></div><aside class="admonition incremental clear"><p class="admonition-title">Grundlegende Idee</p><p>Gegeben: <span class="docutils literal">lachen, sachen, last, muster</span></p><p>Bigramme: <span class="docutils literal">2*la, 2*ch, 2*en, sa, 2*st, mu, er</span></p><p>Auf ein <span class="docutils literal">st</span> folgt entweder ein <span class="docutils literal">er</span> oder <span class="docutils literal">&#x3C;Wortende></span>; demzufolge ist <span class="docutils literal">laster</span> ein Kandidat, aber auch <span class="docutils literal">must</span>.</p></aside></ld-topic>
<ld-topic id="password-cracking-using-probabilistic-context-free-grammars-pcfg"><h2>Password Cracking Using Probabilistic Context-Free Grammars <a class="citation-reference" href="#pcfg" id="citation-reference-1">[PCFG]</a></h2><ul class="incremental-list"><li><p>Lernt die Muster, Worte, Ziffern und verwendeten Sonderzeichen basierend auf der Auswertung von realen Leaks. Die gelernte Grammatik wird als Schablone verwendet und aus „Wörterbüchern“ befüllt. (Zum Beispiel: <span class="docutils literal">S → D1L3S2 → 1L3!! → 1luv!!</span> )</p></li><li><p>Generiert Passwortkandidaten mit absteigender Wahrscheinlichkeit.</p></li><li><p>Prozeß:</p><ol class="arabic simple"><li><p>Vorverarbeitung, um die Basisstrukturen und deren Wahrscheinlichkeiten zu identifizieren (z. B. zwei Ziffern gefolgt von einem Sonderzeichen und 8 Buchstaben.)</p></li><li><p>Passwortkandidatengenerierung unter Beachtung der Wahrscheinlichkeiten der Basisstrukturen und der Wahrscheinlichkeiten der Worte, Ziffern und Sonderzeichen.</p></li></ol><p><span class="peripheral">(In der Originalversion wurden die Wahrscheinlichkeiten von Worten nicht beachtet; die auf GitHub verfügbare Version enthält jedoch zahlreiche Verbesserungen.)</span></p></li></ul></ld-topic>
<ld-topic id="pcfg-analyse-beispiel"><h2>PCFG - Analyse - Beispiel</h2><ld-story><p>Im ersten Schritt werden die Produktionswahrscheinlichkeiten von Basisstrukturen, Ziffernfolgen, Sonderzeichenfolgen und Alpha-Zeichenfolgen ermittelt. (Z. Bsp.:
<span class="docutils literal">!cat123</span> <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>⇒</mo></mrow><annotation encoding="application/x-tex">\Rightarrow</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.3669em;"></span><span class="mrel">⇒</span></span></span></span></span> S<sub>1</sub>L<sub>3</sub>D<sub>3</sub>)</p><table class="incremental highlight-line-on-hover"><colgroup><col style="width: 25.0%"><col style="width: 25.0%"><col style="width: 50.0%"></colgroup><thead><tr><th class="head"><p>Basis Struktur</p></th><th class="head"><p>Häufigkeit</p></th><th class="head"><p>Wahrscheinlichkeit der Produktion</p></th></tr></thead><tbody><tr><td><p>L3S1D3</p></td><td><p>12788</p></td><td><p>0.75</p></td></tr><tr><td><p>S1L3D3</p></td><td><p>2789</p></td><td><p>0.35</p></td></tr></tbody></table><table class="incremental highlight-line-on-hover"><colgroup><col style="width: 25.0%"><col style="width: 25.0%"><col style="width: 50.0%"></colgroup><thead><tr><th class="head"><p>S1</p></th><th class="head"><p>Häufigkeit</p></th><th class="head"><p>Wahrscheinlichkeit der Produktion</p></th></tr></thead><tbody><tr><td><p>!</p></td><td><p>12788</p></td><td><p>0.50</p></td></tr><tr><td><p>.</p></td><td><p>2789</p></td><td><p>0.30</p></td></tr><tr><td><p>@</p></td><td><p>1708</p></td><td><p>0.20</p></td></tr></tbody></table><table class="incremental highlight-line-on-hover"><colgroup><col style="width: 25.0%"><col style="width: 25.0%"><col style="width: 50.0%"></colgroup><thead><tr><th class="head"><p>L3</p></th><th class="head"><p>Häufigkeit</p></th><th class="head"><p>Wahrscheinlichkeit der Produktion</p></th></tr></thead><tbody><tr><td><p>cat</p></td><td><p>12298</p></td><td><p>0.85</p></td></tr><tr><td><p>dog</p></td><td><p>2890</p></td><td><p>0.15</p></td></tr></tbody></table><table class="incremental highlight-line-on-hover"><colgroup><col style="width: 25.0%"><col style="width: 25.0%"><col style="width: 50.0%"></colgroup><thead><tr><th class="head"><p>D3</p></th><th class="head"><p>Häufigkeit</p></th><th class="head"><p>Wahrscheinlichkeit der Produktion</p></th></tr></thead><tbody><tr><td><p>123</p></td><td><p>10788</p></td><td><p>0.60</p></td></tr><tr><td><p>321</p></td><td><p>5789</p></td><td><p>0.35</p></td></tr><tr><td><p>654</p></td><td><p>4708</p></td><td><p>0.25</p></td></tr></tbody></table></ld-story></ld-topic>
<ld-topic id="pcfg-generierung-beispiel"><h2>PCFG - Generierung - Beispiel</h2><div><p><strong>Ergebnis der Analyse</strong>:</p><aside class="admonition width-30" data-theme="note"><p class="admonition-title" data-theme="note-header">Bemerkung</p><p>Nicht-Terminale = <span class="docutils literal">[S,T]</span></p><p>Terminale = <span class="docutils literal">[a, b, c, d, e, …, z, 0, …, 9]</span></p></aside><table class="highlight-row-on-hover"><thead><tr><th class="head"><p>Nich-Terminale</p></th><th class="head"><p>Produktion</p></th><th class="head"><p>Wahrscheinlichkeit der Produktion</p></th></tr></thead><tbody><tr><td><p>S</p></td><td><p><span class="docutils literal">password</span>T</p></td><td><p>0.7</p></td></tr><tr><td><p>S</p></td><td><p><span class="docutils literal">secure</span>T</p></td><td><p>0.3</p></td></tr><tr><td><p>T</p></td><td><p><span class="docutils literal">123</span></p></td><td><p>0.6</p></td></tr><tr><td><p>T</p></td><td><p><span class="docutils literal">111</span></p></td><td><p>0.4</p></td></tr></tbody></table></div><div class="incremental"><p><strong>Ableitung</strong>:</p><ol class="arabic simple"><li><p>S <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>⇒</mo></mrow><annotation encoding="application/x-tex">\Rightarrow</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.3669em;"></span><span class="mrel">⇒</span></span></span></span></span> <span class="docutils literal">password</span>T <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>⇒</mo></mrow><annotation encoding="application/x-tex">\Rightarrow</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.3669em;"></span><span class="mrel">⇒</span></span></span></span></span> <span class="docutils literal">password123</span></p></li><li><p>S <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>⇒</mo></mrow><annotation encoding="application/x-tex">\Rightarrow</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.3669em;"></span><span class="mrel">⇒</span></span></span></span></span> <span class="docutils literal">password</span>T <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>⇒</mo></mrow><annotation encoding="application/x-tex">\Rightarrow</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.3669em;"></span><span class="mrel">⇒</span></span></span></span></span> <span class="docutils literal">password111</span></p></li><li><p>S <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>⇒</mo></mrow><annotation encoding="application/x-tex">\Rightarrow</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.3669em;"></span><span class="mrel">⇒</span></span></span></span></span> <span class="docutils literal">secure</span>T <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>⇒</mo></mrow><annotation encoding="application/x-tex">\Rightarrow</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.3669em;"></span><span class="mrel">⇒</span></span></span></span></span> <span class="docutils literal">secure123</span></p></li><li><p>S <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>⇒</mo></mrow><annotation encoding="application/x-tex">\Rightarrow</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.3669em;"></span><span class="mrel">⇒</span></span></span></span></span> <span class="docutils literal">secure</span>T <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>⇒</mo></mrow><annotation encoding="application/x-tex">\Rightarrow</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.3669em;"></span><span class="mrel">⇒</span></span></span></span></span> <span class="docutils literal">secure111</span></p></li></ol></div></ld-topic>
<ld-topic id="pcfg"><h2>PCFG+</h2><dl class="incremental-list dd-margin-left-6em field-list simple"><dt>Next Gen PCFG Password Cracking <a class="citation-reference" href="#ngpcfg" id="citation-reference-2">[NGPCFG]</a><span class="colon">:</span></dt><dd><p>Unterstützt Tastaturwanderungen (zum Beispiel <span class="docutils literal">asdf</span> oder <span class="docutils literal">qwerty12345</span>) und Passworte bestehend aus mehrerern Worten und wiederholten Worten (zum Beispiel <span class="docutils literal">qpqpqpq</span>).</p></dd><dt>On Practical Aspects of PCFG Password Cracking <a class="citation-reference" href="#paofpcfg" id="citation-reference-3">[PAofPCFG]</a><span class="colon">:</span></dt><dd><p>Im Wesentlichen Performanceoptimierungen, um PCFG schneller zu machen.</p></dd><dt>Using personal information in targeted grammar-based probabilistic password attacks <a class="citation-reference" href="#piandpcfg" id="citation-reference-4">[PIandPCFG]</a><span class="colon">:</span></dt><dd><p>Im Wesentlichen werden zwei PCFGs gewichtet zusammengeführt (0 &#x3C; alpha &#x3C; 1).</p></dd></dl></ld-topic>
<ld-topic id="sepass-semantic-password-guessing-using-k-nn-similarity-search-in-word-embeddings-sepass"><h2>SePass: Semantic Password Guessing Using k-nn Similarity Search in Word Embeddings <a class="citation-reference" href="#sepass" id="citation-reference-5">[SePass]</a></h2><p>Zusätzliche Wortkandidaten werden mithilfe von <em>Worteinbettungen</em> identifiziert. Ermöglicht es verwandte Wörter automatisch zu finden.</p><p><strong>Example</strong></p><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p>Gegeben sein die folgenden „echten“ Passwörter:</p><blockquote><p><span class="success">Ferrari</span>01</p><p>!<span class="success">Audi</span>!</p><p><span class="success">Mercedes</span>88</p><p><span class="success">Bugatti</span> 666</p></blockquote></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p>„Offensichtliche“ Kandidaten für Basiswörter:</p><blockquote><div class="incremental"><p>Porsche</p><p>Mclaren</p><p>Lamborghini</p><p>Aston Martin</p></div></blockquote></ld-cell></ld-grid></ld-topic>
<ld-topic id="sepass-semantic-password-guessing-using-k-nn-similarity-search-in-word-embeddings"><h2>SePass: Semantic Password Guessing Using k-nn Similarity Search in Word Embeddings</h2><p>Vermeidet menschliche Voreingenommenheit.</p><p><strong>Example</strong></p><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p>Gegeben sein die folgenden „echten“ Passwörter:</p><blockquote><p><span class="success">Luke</span>2017</p><p><span class="success">John</span>1976</p><p>01<span class="success">Mark</span>!</p></blockquote></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p>„Offensichtliche“ Kandidaten für Basiswörter:</p><blockquote><div class="incremental"><p>Matthew</p><p>Bible</p><p>Gospel</p></div></blockquote></ld-cell></ld-grid></ld-topic>
<ld-topic id="sepass-semantic-password-guessing-using-k-nn-similarity-search-in-word-embeddings-1"><h2>SePass: Semantic Password Guessing Using k-nn Similarity Search in Word Embeddings</h2><p>Vermeidet menschliche Voreingenommenheit.</p><p><strong>Example</strong></p><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p>Gegeben sein die folgenden „echten“ Passwörter:</p><blockquote><p><span class="success">Luke</span>2017</p><p><span class="success">John</span>1976</p><p>01<span class="success">Mark</span>!</p></blockquote></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p>„Offensichtliche“ Kandidaten für Basiswörter:</p><blockquote><div class="incremental"><p>Leia</p><p>Darth Vader</p><p>Palpatine</p></div></blockquote></ld-cell></ld-grid></ld-topic>
<ld-topic id="bewertung-von-passworten"><h2>Bewertung von Passworten</h2><ld-story><ul class="incremental-list simple"><li><p><strong>Donaudampfschifffahrt</strong>: Ist weder in Rockyou noch im Duden und auch nicht in den Corpora von Twitter und Facebook von 2022 zu finden.</p></li><li><p><strong>Passwort</strong>: Nr. 93968 in Rockyou.</p></li><li><p><strong>password123</strong>: Nr. 1348 in Rockyou.</p></li><li><p><strong>2wsx3edc4rfv</strong>: So nicht in Rockyou, aber 1qaz<em>2wsx3edc4rfv</em> ist Nr. 143611 in Rockyou.</p></li><li><p><strong>Haus Maus</strong>: In Rockyou ist lediglich hausmaus zu finden.</p></li><li><p><strong>iluvu</strong>: Nr. 1472 in Rockyou.</p></li><li><p><strong>Emily060218</strong>: Emily ist Nr. 35567 in Rockyou. Die Zahl ist ganz offensichtlich ein Datum: 6. Feb. 2018 und könnte ein Geburtsdatum, Hochzeitsdatum, oder ein für die Person vergleichbar bedeutends Datum sein.</p></li><li><p><strong>MuenchenHamburg2023!!!!*</strong>: Das Passwort ist zwar sehr lang aber es handelt sich vermutlich um zwei - für die entsprechende Person - bedeutende Orte. Die Zahl und die Sonderzeichen sind vermutlich auf eine Passwortrichtlinie zurückzuführen.</p></li><li><p><strong>hjA223dn4fw"üäKßß k`≤-~ajsdk</strong>: 28 Stellen basierend auf einem Zeichensatz, der vermutlich ca. 192 Zeichen pro Stelle umfasst.</p></li><li><p><strong>Baum Lampe Haus Steak Eis Berg</strong>: Es handelt sich um ein Passwort mit 30 Stellen, das vermutlich mit Hilfe von Diceware generiert wurde und 6 Worte umfasst.</p></li><li><p><strong>ME01703138541</strong>: Namenskürzel und Telefonnummer.</p></li></ul></ld-story><ld-supplemental><p class="rubric">Diceware</p><p>Auch wenn dem Angreifer</p><ol class="loweralpha simple"><li><p>bekannt ist, dass das Passwort mit Hilfe von Diceware generiert wurde,</p></li><li><p>die zugrundeliegende Wortliste vorliegt und</p></li><li><p>auch die Länge (hier 6 Worte) bekannt sein sollte,</p></li></ol><p>dann umfasst der Suchraum: <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><msup><mn>6</mn><mn>5</mn></msup><msup><mo stretchy="false">)</mo><mn>6</mn></msup><mo>≈</mo><mn>2</mn><mo separator="true">,</mo><mn>21</mn><mo>×</mo><msup><mn>10</mn><mn>23</mn></msup></mrow><annotation encoding="application/x-tex">(6^5)^6 \approx 2,21\times 10^{23}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord"><span class="mord">6</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">5</span></span></span></span></span></span></span></span><span class="mclose"><span class="mclose">)</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">6</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">2</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">21</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8141em;"></span><span class="mord">1</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">23</span></span></span></span></span></span></span></span></span></span></span></span></span> Passwortkandidaten. Sollte man also mit einer Geschwindigkeit von 1 Billion Hashes pro Sekunde angreifen können, dann brauch man noch immer über 7000  Jahre für das Absuchen des vollständigen Suchraums.</p><p>Beim klassischen Dicewareansatz umfasst das Wörterbuch <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>6</mn><mn>5</mn></msup></mrow><annotation encoding="application/x-tex">6^5</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8141em;"></span><span class="mord"><span class="mord">6</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">5</span></span></span></span></span></span></span></span></span></span></span></span> Worte, da man mit einem normalen Würfel fünfmal Würfelt und dann das entsprechende Wort nachschlägt. Würde man zum Beispiel die folgenden Zahlen würfeln: 1,4,2,5,2. Dann würde man das Wort zur Zahl: 14252 nachschlagen.</p></ld-supplemental></ld-topic>
<ld-topic id="worterbuchgenerierung-evaluation-von-werkzeugen"><h2>Wörterbuchgenerierung - Evaluation von Werkzeugen</h2><img class="align-center" src="passwortwiederherstellung-evaluation.webp" alt="Evaluation verschiedener Ansätze für die Passwortevaluation" height="1000"></ld-topic>
<ld-topic class="exercises transition-move-to-top" id="ubung-wiederherstellung-eines-passworts"><h2>Übung - Wiederherstellung eines Passworts</h2><div class="ld-exercise" id="ld-exercise-4" data-exercise-id="4" data-exercise-title="4 - Gegeben sei ein MD5 Hash"><p class="ld-exercise-title rubric"><span>Gegeben sei ein MD5 Hash</span></p><pre class="code text copy-to-clipboard literal-block"><code>81dc9bdb52d04dc20036dbd8313ed055</code></pre><p>Hinweise: Das Passwort ist kurz, besteht nur aus Ziffern und ist sehr häufig.</p><p>Wenn Sie Python verwenden wollen, dann können Sie den folgenden Code als Ausgangspunkt
verwenden:</p><pre class="code python copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">import</span> hashlib
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">import</span> binascii
</code><small class="ln">3</small><code data-lineno="3">

<ld-topic id="sichere-passworter"><h2>Sichere Passwörter</h2><ul class="simple"><li><p>Nehmen Sie kein Passwort, dass 1:1 in einem Wörterbuch, Verzeichnis oder Leak (vgl. <a class="reference external" href="https://haveibeenpwned.com">https://haveibeenpwned.com</a>) vorkommt.</p></li><li><p>Nehmen Sie keine Szenepasswörter (zum Beispiel: admin, root, acab, 1312, 88, ...).</p></li><li><p>Je länger desto besser, aber keine trivialen Sätze.</p></li><li><p>Wählen Sie ein Passwort, dass Sie sich merken können. Kombinieren Sie z. B. Dinge aus Ihrem privaten Umfeld, die aber niemand direkt mit Ihnen in Verbindung bringen kann. (D. h. die Namen Ihrer Kinder, Haustiere, etc. sind keine gute Wahl, aber ggf. das Modell Ihres Fernsehers in Kombination mit einer Pin und dem Namen Ihres ersten Smartphones getrennt durch ein paar Sonderzeichen).</p></li><li><p>Verwenden Sie sichere Passwortmanager.</p></li></ul></ld-topic>
<ld-topic id="schwachstellen-in-passwort-managern"><h2>Schwachstellen in Passwort-Managern</h2><blockquote class="epigraph"><p>Das Bundesamt für Informationssicherheit (BSI) hat zusammen mit der Münchner Firma MGM Security Partners zwei Passwort-Manager im Rahmen des Projekts zur Codeanalyse von Open-Source-Software (Caos 3.0) auf mögliche Mängel überprüft. Die Tester wurden dabei vor allem bei Vaultwarden fündig.</p><p>[...] "Vaultwarden sieht keinen Offboarding-Prozess für Mitglieder vor" [...] "Das bedeutet, dass die für den Datenzugriff notwendigen Master-Schlüssel in diesem Fall nicht ausgetauscht werden." Folglich besitze die ausscheidende Person, der eigentlich der Zugang entzogen werden sollte, weiterhin den kryptografischen Schlüssel zu den Daten der Organisation. [...]</p><p>"Das Admin-Dashboard ist anfällig für HTML-Injection-Angriffe", haben die Prüfer zudem entdeckt (CVE-2024-39926, Risiko mittel).[...]</p><p class="attribution">—15.10.2024 - Heise.de <a class="reference external" href="https://www.heise.de/news/Passwort-Manager-BSI-berichtet-ueber-kritische-Schwachstellen-in-Vaultwarden-9982427.html">BSI: Forscher finden Schwachstellen in Passwort-Managern</a></p></blockquote></ld-topic>
