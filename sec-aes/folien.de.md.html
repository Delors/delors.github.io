<style>/* ---------------------------------------------------------------------------
   Farbgebung der AES-Diagramme (eingebunden über ld.include-styles).

   Alle Flächen und Linien leiten sich von currentColor ab und folgen damit
   automatisch dem Light-/Dark-Theme. `light-dark()` funktioniert nur in CSS,
   nicht in SVG-Präsentationsattributen (fill="…", stroke="…") — deshalb steht
   hier das gesamte Farbschema und im SVG nur noch die Klasse.

   Voraussetzung: das SVG wird mit {include-svg} *inline* eingebunden. Bei
   {image} lädt der Browser es als eigenes Dokument; weder dieses Stylesheet
   noch currentColor erreichen es dann.
   --------------------------------------------------------------------------- */

/* ---------------------------------------------------------------------------
   Hexwerte in Diagrammen — dieselbe Schrift wie $\mathtt{…}$ im Fließtext.

   KaTeX_Typewriter wird von shared/ext/katex/katex.min.css per @font-face
   deklariert. @font-face gilt dokumentweit, und die Diagramme liegen dank
   {include-svg} inline — die Familie ist hier also ohne Zutun verfügbar.
   Der Fallback greift, falls ein Deck das SVG ohne KaTeX verwendet.

   Bewusst *außerhalb* von .aes-diagram, damit auch die handgeschriebenen
   Diagramme (mix-column.svg, inv-mix-column.svg) die Klasse nutzen können.

   Achtung bei der Größe: KaTeX_Typewriter hat 0,525 em Vorschub und 0,631 em
   Ziffernhöhe. Gegenüber "Monospace" (0,600 / 0,565) ist es schmaler und
   höher, gegenüber "Noto Sans Display" (0,537 / 0,735) schmaler und
   niedriger. Die font-size der betroffenen Elemente ist deshalb so gesetzt,
   dass die *Ziffernhöhe* gleich bleibt.

   Die Klasse setzt bewusst KEIN text-anchor: auf einem <tspan> mitten in
   einer Zeile würde "middle" den Textabschnitt an seiner eigenen Position
   neu ausrichten und die Zeile zerreißen. Zentriert wird am <text> bzw. am
   umgebenden <g>.
   --------------------------------------------------------------------------- */

/* ---------------------------------------------------------------------------
   Raster-Instanzen (<use href="#aes-matrix-…">).

   Die Regel steht am <use>; die Formen im Symbol erben fill, fill-opacity,
   stroke und stroke-width daraus. Ein Selektor wie ".matrix rect" wuerde
   nicht greifen - der Symbolinhalt liegt im Shadow-Tree des <use>.

   Die Werte entsprechen .cell (Flaeche) und dem frueheren .grid (Linien).
   --------------------------------------------------------------------------- */

.matrix {
    fill: currentColor;
    fill-opacity: 0.3;
    stroke: currentColor;
    stroke-width: 1;
    /* Quadratische Enden schliessen die Ecken des Rasters so, wie es bei
       gestrichenen Rechtecken die Gehrung tat. */
    stroke-linecap: square;
}

/* ---------------------------------------------------------------------------
   Ein- und Ausgabe des Verschlüsselungsprozesses (encryption_process.svg).

   Die beiden Töne werden direkt gesetzt und nicht aus currentColor abgeleitet:
   sie tragen Bedeutung (Klartext / Geheimtext) und sind hell genug für einen
   dunklen und gesättigt genug für einen hellen Grund.
   --------------------------------------------------------------------------- */

.matrix.plaintext  { fill: #80ff80; fill-opacity: 1; }
.matrix.ciphertext { fill: #ff8080; fill-opacity: 1; }

.hex {
    font-family: KaTeX_Typewriter, var(--monospaced-font-family);
}

.aes-diagram {
    /* Strukturflächen */
    .panel          { fill: currentColor; fill-opacity: 0.1; }
    .cell           { fill: currentColor; fill-opacity: 0.3; }
    .cell-highlight { fill: currentColor; fill-opacity: 0.65; }

    /* Linien */
    .connector { fill: none; stroke: currentColor; stroke-width: 2; }

    /* Eckige Klammern um eine Matrix */
    .bracket   { fill: none; stroke: currentColor; stroke-width: 2;
                 stroke-linecap: square; stroke-linejoin: miter; }

    /* Beschriftungen */
    .label { fill: currentColor; }

    /* Die abgerundeten Marken („Variabler Input" / „Konstanter Input"):
       Fläche aus currentColor, Schrift in der Folienhintergrundfarbe. */
    .badge       { fill: currentColor; fill-opacity: 0.55; }
    .badge-label { fill: var(--background-color, light-dark(white, black)); }
}

/* ---------------------------------------------------------------------------
   Pfeilspitze (definiert in aes-defs.svg, eingehängt unter <ld-globals>).

   Hier steht bewusst var(--color) und nicht light-dark(…):

   * LectureDoc2 schaltet Hell/Dunkel über [data-theme] und die davon
     abgeleiteten Custom Properties --color / --background-color
     (theme.css). light-dark() dagegen hängt ausschließlich an
     prefers-color-scheme, also an der Einstellung des Betriebssystems —
     es liefe an jeder expliziten Theme-Wahl im Deck vorbei.
   * <ld-globals> ist ein Kind von <body> und erbt --color von dort.
   --------------------------------------------------------------------------- */

#aes-arrow path {
    fill: var(--color);
    stroke: var(--color);
}

/* ---------------------------------------------------------------------------
   Ver-/Entschlüsselungsprozess (encryption_and_decryption_process.svg).

   Die beiden Spaltenhintergründe tragen Bedeutung (Verschlüsselung /
   Entschlüsselung) und müssen auf einem Beamer erkennbar bleiben. Eine reine
   Fläche leistet das nicht: bei hellem Grund verschluckt sie ein schwacher
   Projektor, bei dunklem Grund verschwindet sie ganz. Deshalb trägt jede
   Spalte zusätzlich eine deutlich sichtbare Kontur in derselben Farbe — die
   Kontur hält die Struktur, die Fläche ist die Zugabe.

   Die Farben sind bewusst fest und nicht aus currentColor abgeleitet: sie
   sind mittelhell genug, um über Schwarz wie über Weiß zu bestehen.
   --------------------------------------------------------------------------- */

.aes-diagram {
    .panel-enc {
        fill: #e2574c; fill-opacity: 0.16;
        stroke: #e2574c; stroke-opacity: 0.85; stroke-width: 2;
    }
    .panel-dec {
        fill: #2fa360; fill-opacity: 0.16;
        stroke: #2fa360; stroke-opacity: 0.85; stroke-width: 2;
    }

    /* Rundenkasten und Transformationsblock. Der Block liegt im Kasten, die
       Deckkraft addiert sich also — 0.13 + 0.30 ergibt die Abstufung
       „Runde“ / „Transformation“ ohne einen dritten Grauwert. */
    .round-group { fill: currentColor; fill-opacity: 0.13; }
    .flow-step   { fill: currentColor; fill-opacity: 0.30; }

    /* Wörter des expandierten Schlüssels: Daten, keine Operation — deshalb
       eckig statt Pille und heller als ein Transformationsblock. */
    .key-word {
        fill: currentColor; fill-opacity: 0.16;
        stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1;
    }

    .divider {
        fill: none; stroke: currentColor; stroke-width: 2;
        stroke-dasharray: 12 8; stroke-opacity: 0.65;
    }
}
</style>
</head>
<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg">
<defs>

    <!-- Pfeilspitze für die AES-Diagramme.

         Die Definition liegt bewusst hier und nicht im Diagramm selbst: bei
         {include-svg} landen alle Diagramme im selben Dokument, und gleich
         benannte <defs>-Ids würden sich gegenseitig verdrängen. Der Präfix
         "aes-" hält sie zudem von den Marker-Ids des LectureDoc2-Themes
         (FilledArrow_Marker …) getrennt.

         Die Farbe wird in aes-diagrams.css gesetzt (var(--color)) und NICHT
         hier als Attribut:

         * `light-dark()` waere falsch: es haengt allein an
           prefers-color-scheme, waehrend LectureDoc2 ueber [data-theme] und
           --color / --background-color schaltet. Siehe LectureDoc2/SVGs.md.
         * `context-stroke` waere semantisch das Richtige (Strichfarbe der
           Linie, an der die Spitze sitzt), ist in WebKit/Safari aber - Stand
           2026 - nicht implementiert; die Spitzen bleiben dort unsichtbar.
           Firefox 111+ und Chromium 124+ koennen es.

         `currentColor` taete es hier ebenfalls: <ld-globals> ist ein Kind von
         <body>, und body traegt [data-theme], was `color: var(--color)`
         setzt. var(--color) benennt dieselbe Farbe nur direkt. -->

    <marker id="aes-arrow"
            orient="auto"
            overflow="visible"
            markerUnits="strokeWidth"
            viewBox="-1 -3 7 6"
            markerWidth="7"
            markerHeight="6"
            stroke-linejoin="miter"
            stroke-miterlimit="10">
        <path d="M 4.8 0 L 0 -1.8 L 0 1.8 Z" stroke-width="1" />
    </marker>

    <!-- Quadratische Raster fuer Zustands- und S-Box-Darstellungen: ein
         gefuellter Block plus die Gitterlinien, statt eines Rechtecks je Zelle.

         Fuellung, Deckkraft und Strichfarbe erbt jede Instanz von ihrem
         <use>-Element (Klasse .matrix in aes-diagrams.css): CSS-Selektoren
         greifen nicht in den Shadow-Tree eines <use> hinein, vererbte
         Eigenschaften dagegen schon. Die Formen tragen deshalb nur
         fill="none" bzw. stroke="none", um die jeweils andere Angabe
         abzuschalten.

         overflow="visible" ist noetig: ein <symbol> spannt einen eigenen
         Viewport auf und wuerde sonst die aeussere Haelfte des Randstrichs
         abschneiden.

         Die inneren Linien werden ZWEIMAL gezeichnet. Das ist kein Versehen:
         in der urspruenglichen Zeichnung lag auf jeder inneren Kante der
         Strich zweier benachbarter Rechtecke, und zwei deckende Striche
         ueberlagern sich im Antialiasing zu 1-(1-a)^2 - die inneren Linien
         wirken dadurch kraeftiger als die aeusseren. Ohne die Wiederholung
         wuerde das Raster sichtbar leichter.

         Die viewBox ist in Zieleinheiten angegeben; wird das Symbol mit genau
         dieser width/height instanziiert, ist der Massstab 1 und die geerbte
         stroke-width bleibt 1. -->

    <symbol id="aes-matrix-4x4" overflow="visible" viewBox="0 0 40 40">
        <rect width="40" height="40" stroke="none" />
        <path fill="none" d="M0 0V40M10 0V40M20 0V40M30 0V40M40 0V40M0 0H40M0 10H40M0 20H40M0 30H40M0 40H40" />
        <path fill="none" d="M10 0V40M20 0V40M30 0V40M0 10H40M0 20H40M0 30H40" />
    </symbol>

vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span></p></td></tr><tr><td><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn mathvariant="monospace">0</mn><mi mathvariant="monospace">E</mi></mrow><annotation encoding="application/x-tex">\mathtt{0E}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6111em;"></span><span class="mord"><span class="mord mathtt">0E</span></span></span></span></span></span></p></td><td><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mn>1110</mn><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">1110_2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7944em;vertical-align:-0.15em;"></span><span class="mord">111</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span></p></td></tr><tr><td><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn mathvariant="monospace">0</mn><mi mathvariant="monospace">F</mi></mrow><annotation encoding="application/x-tex">\mathtt{0F}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6111em;"></span><span class="mord"><span class="mord mathtt">0F</span></span></span></span></span></span></p></td><td><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mn>1111</mn><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">1111_2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7944em;vertical-align:-0.15em;"></span><span class="mord">111</span><span class="mord"><span class="mord">1</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span></p></td></tr></tbody></table></ld-global-information></ld-topic>
<ld-topic class="repetition" id="arithmetik-endlicher-korper"><h2>Arithmetik endlicher Körper</h2><ul class="incremental-list simple"><li><p>Ein Körper ist eine Menge, in der wir Addition, Subtraktion, Multiplikation und Division durchführen können, ohne die Menge zu verlassen.</p></li><li><p>Die Division ist mit der folgenden Regel definiert: <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi><mi mathvariant="normal">/</mi><mi>b</mi><mo>=</mo><mi>a</mi><mo>∙</mo><msup><mi>b</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow><annotation encoding="application/x-tex">a/b = a ∙ b^{-1}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">a</span><span class="mord">/</span><span class="mord mathnormal">b</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.4445em;"></span><span class="mord mathnormal">a</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">∙</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8141em;"></span><span class="mord"><span class="mord mathnormal">b</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mtight">1</span></span></span></span></span></span></span></span></span></span></span></span></span>.</p></li></ul><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Ein endlicher Körper (mit einer endlichen Anzahl von Elementen) ist die Menge <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi mathvariant="double-struck">Z</mi><mi>p</mi></msub></mrow><annotation encoding="application/x-tex">\mathbb{Z}_p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.975em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathbb">Z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">p</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span></span>, die aus allen ganzen Zahlen <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">{</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><mi>p</mi><mo>−</mo><mn>1</mn><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\lbrace 0,1,\ldots,p-1 \rbrace</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">{</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">1</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="minner">…</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">p</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">}</span></span></span></span></span> besteht, wobei <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span></span> eine Primzahl ist und in dem modulo <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span></span> gerechnet wird. Dieser Körper wird auch <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi><mi>F</mi><mo stretchy="false">(</mo><mi>p</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">GF(p)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">GF</span><span class="mopen">(</span><span class="mord mathnormal">p</span><span class="mclose">)</span></span></span></span></span> geschrieben.</p></aside></ld-topic>
<ld-topic class="repetition" id="arithmetik-endlicher-korper-1"><h2>Arithmetik endlicher Körper</h2><ul class="list-with-explanations incremental-list"><li><p>Der Einfachheit halber — und aus Gründen der Implementierungseffizienz — möchten wir mit ganzen Zahlen arbeiten, die genau in eine bestimmte Anzahl von Bits passen, ohne dass Bitmuster verschwendet werden.</p><p>Ganze Zahlen im Bereich <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn></mrow><annotation encoding="application/x-tex">0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span></span> bis <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mi>n</mi></msup><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">2ⁿ-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7477em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6644em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span>, die in ein n-Bit-Wort passen.</p></li><li><p>Wenn eine Operation des verwendeten Algorithmus die Division ist, dann müssen wir Arithmetik anwenden, die über einem (ggf. endlichen) Körper definiert ist.</p><p>Division erfordert, dass jedes nicht-null-Element ein multiplikatives Inverses hat.</p></li><li><p>Wenn wir modulare Arithmetik auf die Menge der ganzen Zahlen <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi mathvariant="double-struck">Z</mi><msup><mn>2</mn><mi>n</mi></msup></msub></mrow><annotation encoding="application/x-tex">\mathbb{Z}_{2ⁿ}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathbb">Z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mtight">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.5935em;"><span style="top:-2.786em;margin-right:0.0714em;"><span class="pstrut" style="height:2.5em;"></span><span class="katex-sizing reset-size3 size1 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> (mit <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">n &gt; 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span>) anwenden, dann erhalten wir <span class="warning">keinen</span> Körper!</p><p>Zum Beispiel hat die ganze Zahl <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn></mrow><annotation encoding="application/x-tex">2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">2</span></span></span></span></span> keine multiplikative Inverse in <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi mathvariant="double-struck">Z</mi><msup><mn>2</mn><mi>n</mi></msup></msub></mrow><annotation encoding="application/x-tex">\mathbb{Z}_{2ⁿ}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathbb">Z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mtight">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.5935em;"><span style="top:-2.786em;margin-right:0.0714em;"><span class="pstrut" style="height:2.5em;"></span><span class="katex-sizing reset-size3 size1 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> (mit <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">n &gt; 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span>), d. h. es gibt keine ganze Zahl <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord mathnormal">b</span></span></span></span></span>, so dass <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>b</mi><mtext> </mtext> ia-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6644em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6644em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span></span></span></span></span> Elemente enthält, wird als <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi><mi>F</mi><mo stretchy="false">(</mo><msup><mn>2</mn><mi>n</mi></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">GF(2ⁿ)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">GF</span><span class="mopen">(</span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6644em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span> bezeichnet.</p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Jedes Polynom in <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi><mi>F</mi><mo stretchy="false">(</mo><msup><mn>2</mn><mi>n <ld-topic id="arithmetik-endlicher-korper-in-hinblick-auf-aes"><h2>Arithmetik endlicher Körper in Hinblick auf AES</h2><ul class="simple"><li><p>Beim <em>Advanced Encryption Standard</em> (AES) werden alle Operationen mit 8-Bit-Bytes durchgeführt</p></li><li><p>Die arithmetischen Operationen: Addition, Multiplikation und Division werden über den endlichen Körper <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi><mi>F</mi><mo stretchy="false">(</mo><msup><mn>2</mn><mn>8</mn></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">GF(2⁸)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">GF</span><span class="mopen">(</span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">8</span></span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span> durchgeführt.</p></li></ul><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>AES verwendet das irreduzible Polynom:</p><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>m</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>x</mi><mn>8</mn></msup><mo>+</mo><msup><mi>x</mi><mn>4</mn></msup><mo>+</mo><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mi>x</mi><mo>+</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">m(x) = x⁸ + x⁴ + x³ + x + 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">m</span><span class="mopen">(</span><span class="mord mathnormal">x</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.9474em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">8</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.9474em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">4</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="kat <ld-topic id="aes-detaillierter-aufbau-1"><h2>AES Detaillierter Aufbau</h2><ld-story><ul class="incremental-list"><li><p>Verarbeitet in jeder Runde den gesamten Datenblock als eine einzige Matrix unter Verwendung von Substitutionen und Permutationen.</p></li><li><p>Der als Eingabe bereitgestellte Schlüssel - bei 128 Bit Schlüsselgröße -  wird in ein Array von vierundvierzig 32-Bit-Wörtern expandiert (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo stretchy="false">[</mo><mi>i</mi><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">w[i]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord mathnormal">i</span><span class="mclose">]</span></span></span></span></span>). (D. h. bei 10 Runden.)</p></li><li><p>Die Chiffre beginnt und endet mit der <em>AddRoundKey</em>-Operation.</p></li><li><p>Man kann sich die Chiffre als abwechselnde Operationen zwischen</p><p>(a) der XOR-Verschlüsselung (<em>AddRoundKey</em>) eines Blocks vorstellen, gefolgt von
(b) der Verwürfelung des Blocks (die anderen drei Stufen), gefolgt von
(c) der XOR-Verschlüsselung, und so weiter.</p></li><li><p>Jede Stufe ist leicht umkehrbar.</p></li><li><p>Der Entschlüsselungsalgorithmus verwendet den expandierten Schlüssel in umgekehrter Reihenfolge, wobei der Entschlüsselungsalgorithmus nicht mit dem Verschlüsselungsalgorithmus identisch ist.</p></li><li><p>Der Zustand (<em>State</em>) ist sowohl bei der Verschlüsselung als auch bei der Entschlüsselung derselbe.</p></li><li><p>Die letzte Runde sowohl der Verschlüsselung als auch der Entschlüsselung besteht aus nur drei Stufen.</p></li></ul></ld-story></ld-topic>
<ld-topic id="aes-verwendet-vier-verschiedene-stufen"><h2>AES verwendet vier verschiedene Stufen</h2><dl class="field-list simple"><dt><em>SubBytes</em><span class="colon">:</span></dt><dd><p>verwendet eine S-Box, um eine byteweise Ersetzung des Blocks vorzunehmen</p></dd><dt><em>ShiftRows</em><span class="colon">:</span></dt><dd><p>ist eine einfache Permutation</p></dd><dt><em>MixColumns</em><span class="colon">:</span></dt><dd><p>ist eine Substitution, mit Hilfe von Polynomarithmetik über <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi><mi>F</mi><mo stretchy="false">(</mo><msup><mn>2</mn><mn>8</mn></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">GF(2⁸)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">GF</span><span class="mopen">(</span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">8</span></span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span></p></dd><dt><em>AddRoundKey</em><span class="colon">:</span></dt><dd><p>ist ein einfaches bitweises XOR des aktuellen Blocks mit einem Teil des expandierten Schlüssels</p></dd></dl></ld-topic>

semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6111em;"></span><span class="mord"><span class="mord mathtt">0A</span></span></span></span></span></span> abgebildet.</p><p>Die inverse S-Box bildet den Wert <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn mathvariant="monospace">0</mn><mi mathvariant="monospace">A</mi></mrow><annotation encoding="application/x-tex">\mathtt{0A}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6111em;"></span><span class="mord"><span class="mord mathtt">0A</span></span></span></span></span></span> (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>=</mo><mn mathvariant="monospace">0</mn></mrow><annotation encoding="application/x-tex">x=\mathtt{0}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6111em;"></span><span class="mord mathtt">0</span></span></span></span></span> und <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>y</mi><mo>=</mo><mi mathvariant="monospace">A</mi></mrow><annotation encoding="application/x-tex">y=\mathtt{A}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6111em;"></span><span class="mord mathtt">A</span></span></span></span></span>) wieder auf den ursprünglichen Wert ab.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="s-box-designgrundlagen"><h2>S-Box - Designgrundlagen</h2><ul class="simple"><li><p>Die S-Box ist so konzipiert, dass sie gegen bekannte kryptoanalytische Angriffe resistent ist.</p></li><li><p>Die Rijndael-Entwickler suchten nach einem Design, das eine geringe Korrelation zwischen Eingabe- und Ausgabebits aufweist und die Eigenschaft hat, dass die Ausgabe keine lineare mathematische Funktion der Eingabe ist.</p></li><li><p>Die Nichtlinearität ist auf die Verwendung der multiplikativen Inversen bei der Konstruktion der S-Box zurückzuführen.</p></li></ul></ld-topic>
<ld-topic id="shiftrows-transformation"><h2><em>ShiftRows</em>-Transformation</h2><object class="light-image align-center" data="drawings/aes/shift_row_transformation.svg" type="image/svg+xml" role="img" aria-label="ShiftRows-Transformation"></object></ld-topic>
<ld-topic id="shiftrows-transformation-begrundung"><h2><em>ShiftRows</em>-Transformation - Begründung</h2><ul class="simple"><li><p>Wesentlicher als es auf den ersten Blick scheint!</p></li></ul><ul class="incremental-list simple"><li><p>Der Zustand (<em>State</em>) wird ebenso wie die Chiffrierein- und -ausgabe als Array aus vier 4-Byte-Spalten behandelt.</p></li><li><p>Bei der Verschlüsselung werden die ersten 4 Bytes des Klartextes in die erste Spalte vom Zustands (<em>State</em>) kopiert, und so weiter.</p></li><li><p>Der Rundenschlüssel wird spaltenweise auf den Zustand (<em>State</em>) angewendet.</p></li><li><p>Bei einer Zeilenverschiebung wird also ein einzelnes Byte von einer Spalte in eine andere verschoben, was einem linearen Abstand von einem Vielfachen von 4 Byte entspricht.</p></li><li><p>Die Transformation sorgt dafür, dass die 4 Bytes einer Spalte auf vier verschiedene Spalten verteilt werden.</p></li></ul></ld-topic>

<ld-topic id="mixcolumns-transformation-begrundung"><h2><em>MixColumns</em>-Transformation - Begründung</h2><ul class="simple"><li><p>Die Koeffizienten einer Matrix, die auf einem linearen Code mit maximalem Abstand zwischen den Codewörtern basiert, gewährleisten eine gute Mischung zwischen den Bytes jeder Spalte.</p></li><li><p>Die <em>MixColumns</em>-Transformation (~ <span class="ger">Vermischung der Spalten</span>) - kombiniert mit der <em>ShiftRows</em>-Transformation (<span class="ger">Zeilenverschiebung</span>) - stellt sicher, dass nach einigen Runden alle Ausgangsbits von allen Eingangsbits abhängen.</p></li></ul></ld-topic>
<ld-topic id="addroundkey-transformation"><h2><em>AddRoundKey</em>-Transformation</h2><ul class="simple"><li><p>Die 128 Bits des Zustands (<em>State</em>) werden bitweise mit den 128 Bits des Rundenschlüssels XOR-verknüpft.</p></li></ul><ul class="incremental-list simple"><li><p>Die Operation wird als spaltenweise Operation zwischen den 4 Bytes einer Spalte des Zustands (<em>State</em>) und einem Wort des Rundenschlüssels betrachtet.</p></li><li><p><em>Kann auch als eine Operation auf Byte-Ebene betrachtet werden</em>.</p></li></ul><aside class="admonition incremental"><p class="admonition-title">Designbegründung</p><ul class="simple"><li><p>Die <em>AddRoundKey</em>-Transformation ist so einfach wie möglich und betrifft jedes Bit des Zustands.</p></li><li><p>Die Komplexität der Schlüsselexpansion plus die Komplexität der anderen Stufen von AES sorgen für Sicherheit!</p></li></ul></aside></ld-topic>

<ld-topic id="aes-schlusselexpansion"><h2>AES Schlüsselexpansion</h2><ul class="simple"><li><p>Nimmt als Eingabe einen (hier: 128-Bit) Schlüssel mit vier Wörtern (16 Byte) und erzeugt ein lineares Array mit 44 Wörtern (176 Byte).</p></li><li><p>Dies liefert einen vier Worte umfassenden Rundenschlüssel für die initiale <em>AddRoundKey</em>-Stufe sowie für jede der folgenden 10 Runden der Chiffre.</p></li><li><p>Der Schlüssel wird in die ersten vier Wörter des erweiterten Schlüssels kopiert.</p></li><li><p>Der Rest des expandierten Schlüssels wird in Blöcken von jeweils vier Wörtern aufgefüllt.</p></li><li><p>Jedes hinzugefügte Wort <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo stretchy="false">[</mo><mi>i</mi><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">w[i]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord mathnormal">i</span><span class="mclose">]</span></span></span></span></span> hängt vom unmittelbar vorangehenden Wort <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo stretchy="false">[</mo><mi>i</mi><mo>−</mo><mn>1</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">w[i - 1]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord mathnormal">i</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">]</span></span></span></span></span> und dem vier Positionen zurückliegenden Wort <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo stretchy="false">[</mo><mi>i</mi><mo>−</mo><mn>4</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">w[i - 4]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord mathnormal">i</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">4</span><span class="mclose">]</span></span></span></span></span> ab.</p></li><li><p>In drei von vier Fällen wird ein einfaches XOR verwendet.</p></li><li><p>Für ein Wort dessen Position im Array <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi></mrow><annotation encoding="application/x-tex">w</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span></span></span></span></span> ein Vielfaches von 4 ist, wird die komplexere Funktion <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>g</mi></mrow><annotation encoding="application/x-tex">g</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span></span></span></span></span> angewandt.</p></li></ul></ld-topic>
<ld-topic id="aes-schlusselexpansion-visualisiert"><h2>AES Schlüsselexpansion - Visualisiert</h2><object class="light-image align-center" data="drawings/aes/key_expansion.svg" type="image/svg+xml" role="img" aria-label="AES Schlüsselexpansion"></object><ld-supplemental><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung: <em>KeyExpansion</em> bei größeren Schlüssellängen</span></p><p>(Nicht prüfungsrelevant!)</p><p>Die <em>KeyExpansion</em> bei längeren Schlüsseln ist konzeptionell vergleichbar, aber nicht identisch. Zum Beispiel arbeitet die <em>KeyExpansion</em> bei einem 256-Bit-Schlüssel vereinfacht wie folgt:</p><p>Die 256 Bit des Schlüssels bilden direkt die Grundlage für die ersten beiden Rundenschlüssel. Der dritte Rundenschlüssel wird anschließend ausgehend vom ersten Rundenschlüssel und einer Transformation des zweiten berechnet; entsprechend wird der vierte ausgehend vom zweiten und einer Transformation des dritten Rundenschlüssels berechnet.</p><p>Dritter Rundenschlüssel:</p><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mtable rowspacing="0.16em" columnalign="right center left" columnspacing="1em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>w</mi><mo stretchy="false">[</mo><mn>8</mn><mo stretchy="false">]</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mo lspace="0em" rspace="0em">=</mo></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>w</mi><mo stretchy="false">[</mo><mn>0</mn><mo stretchy="false">]</mo><mo>⊕</mo><mi>g</mi><mo stretchy="false">(</mo><mi>w</mi><mo stretchy="false">[</mo><mn>7</mn><mo stretchy="false">]</mo><mo stretchy="false">)</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>w</mi><mo stretchy="false">[</mo><mn>9</mn><mo stretchy="false">]</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mo lspace="0em" rspace="0em">=</mo></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>w</mi><mo stretchy="false">[</mo><mn>1</mn><mo stretchy="false">]</mo><mo>⊕</mo><mi>w</mi><mo stretchy="false">[</mo><mn>8</mn><mo stretchy="false">]</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>w</mi><mo stretchy="false">[</mo><mn>10</mn><mo stretchy="false">]</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mo lspace="0em" rspace="0em">=</mo></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>w</mi><mo stretchy="false">[</mo><mn>2</mn><mo stretchy="false">]</mo><mo>⊕</mo><mi>w</mi><mo stretchy="false">[</mo><mn>9</mn><mo stretchy="false">]</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>w</mi><mo stretchy="false">[</mo><mn>11</mn><mo stretchy="false">]</mo></mrow></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mo lspace="0em" rspace="0em">=</mo></mstyle></mtd><mtd><mstyle scriptlevel="0" displaystyle="false"><mrow><mi>w</mi><mo stretchy="false">[</mo><mn>3</mn><mo stretchy="false">]</mo><mo>⊕</mo><mi>w</mi><mo stretchy="false">[</mo><mn>10</mn><mo stretchy="false">]</mo></mrow></mstyle></mtd></mtr></mtable><annotation encoding="application/x-tex">\begin{array}{rcl}
w[8]  &amp; = &amp; w[0] ⊕ g(w[7]) \\
w[9]  &amp; = &amp; w[1] ⊕ w[8] \\
w[10] &amp; = &amp; w[2] ⊕ w[9] \\
w[11] &amp; = &amp; w[3] ⊕ w[10]

hlüssel ist: <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo stretchy="false">[</mo><mn>4</mn><mo stretchy="false">]</mo><mtext> </mtext><mi mathvariant="normal">∣</mi><mi mathvariant="normal">∣</mi><mtext> </mtext><mi>w</mi><mo stretchy="false">[</mo><mn>5</mn><mo stretchy="false">]</mo><mtext> </mtext><mi mathvariant="normal">∣</mi><mi mathvariant="normal">∣</mi><mtext> </mtext><mi>w</mi><mo stretchy="false">[</mo><mn>6</mn><mo stretchy="false">]</mo><mtext> </mtext><mi mathvariant="normal">∣</mi><mi mathvariant="normal">∣</mi><mtext> </mtext><mi>w</mi><mo stretchy="false">[</mo><mn>7</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">w[4]\,||\,w[5]\,||\,w[6]\,||\,w[7]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord">4</span><span class="mclose">]</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">∣∣</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord">5</span><span class="mclose">]</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">∣∣</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord">6</span><span class="mclose">]</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">∣∣</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord">7</span><span class="mclose">]</span></span></span></span></span></p></li></ul></ld-story></ld-topic>
<ld-topic id="aes-schlusselexpansion-begrundung"><h2>AES Schlüsselexpansion - Begründung</h2><aside class="admonition width-50 float-right incremental font-size-85"><p class="admonition-title">Designziele</p><ul class="simple"><li><p>Kenntnis eines Teils des Chiffrierschlüssels oder des Rundenschlüssels ermöglicht nicht die Berechnung vieler anderer Bits des Rundenschlüssels</p></li><li><p>Eine invertierbare Transformation</p></li><li><p>Performance auf einer breiten Palette von CPUs</p></li><li><p>Verwendung von Rundenkonstanten zur Beseitigung von Symmetrien</p></li><li><p>Diffusion der Chiffrierschlüsselunterschiede in die Rundenschlüssel</p></li><li><p>Ausreichende Nichtlinearität, um die vollständige Bestimmung von Rundenschlüsselunterschieden nur aus Chiffrierschlüsselunterschieden zu verhindern</p></li><li><p>Einfachheit der Beschreibung</p></li></ul></aside><ul class="simple"><li><p>Die Rijndael-Entwickler haben den Expansionsschlüssel-Algorithmus so konzipiert, dass er gegen bekannte kryptoanalytische Angriffe resistent ist.</p></li><li><p>Die Einbeziehung einer rundenabhängigen Rundenkonstante beseitigt die Symmetrie, die sonst bei der Erzeugung der Rundenschlüssel in den verschiedenen Runden entstehen würde.</p></li></ul></ld-topic>

<ld-topic id="aquivalente-inverse-chiffre"><h2>Äquivalente inverse Chiffre</h2><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>AES-Entschlüsselung ist nicht identisch mit der Verschlüsselung.</p><ul class="simple"><li><p>Die Abfolge der Umwandlungen ist unterschiedlich, obwohl die Schlüsselableitung die gleiche ist.</p></li><li><p>Dies hat den Nachteil, dass für Anwendungen, die sowohl Verschlüsselung als auch Entschlüsselung erfordern, zwei separate Software- oder Firmware-Module benötigt werden.</p></li></ul></aside><p class="incremental">Zwei unabhängige, separate Änderungen sind erforderlich, um die Entschlüsselungsstruktur mit der Verschlüsselungsstruktur in Einklang zu bringen:</p><ol class="arabic incremental simple"><li><p>Die ersten beiden Stufen der Entschlüsselungsrunde müssen vertauscht werden.</p></li><li><p>Die zweiten beiden Stufen der Entschlüsselungsrunde müssen vertauscht werden.</p></li></ol></ld-topic>
<ld-topic id="vertausch-von-invshiftrows-und-invsubbytes"><h2>Vertausch von <em>InvShiftRows</em> und <em>InvSubBytes</em></h2><dl class="field-list simple"><dt><em>InvShiftRows</em><span class="colon">:</span></dt><dd><p><span class="info">beeinflusst die Reihenfolge</span> der Bytes im Zustand (<em>State</em>), ändert aber nicht den Inhalt der Bytes und ist nicht vom Inhalt der Bytes abhängig, um seine Transformation durchzuführen.</p></dd><dt><em>InvSubBytes</em><span class="colon">:</span></dt><dd><p><span class="info">beeinflusst den Inhalt</span> von Bytes im Zustand (<em>State</em>), ändert aber nicht die Byte-Reihenfolge und hängt nicht von der Byte-Reihenfolge ab, um seine Transformation durchzuführen.</p></dd></dl><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>Diese beiden Operationen sind kommutativ und somit vertauschbar.</p></aside></ld-topic>
<ld-topic id="vertausch-von-addroundkey-und-invmixcolumns"><h2>Vertausch von <em>AddRoundKey</em> und <em>InvMixColumns</em></h2><ul><li><p>Die Transformationen <em>AddRoundKey</em> und <em>InvMixColumns</em> ändern die Reihenfolge der Bytes im Zustand (<em>State</em>) nicht.</p></li><li><p>Betrachtet man den Schlüssel als eine Folge von Wörtern, so wirken sowohl <em>AddRoundKey</em> als auch <em>InvMixColumns</em> jeweils nur auf eine Spalte des Zustands (<em>State</em>).</p></li><li><p>Diese beiden Operationen sind linear in Bezug auf die gegebene Spalte.</p><p>Das heißt, für einen bestimmten Zustand <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi></mrow><annotation encoding="application/x-tex">S</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span></span></span></span></span> und ein bestimmtes Rundenschlüsselwort <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo stretchy="false">[</mo><mi>i</mi><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">w[i]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord mathnormal">i</span><span class="mclose">]</span></span></span></span></span>:</p><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mrow><mi mathvariant="normal">I</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">v</mi><mi mathvariant="normal">M</mi><mi mathvariant="normal">i</mi><mi mathvariant="normal">x</mi><mi mathvariant="normal">C</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">l</mi><mi mathvariant="normal">u</mi><mi mathvariant="normal">m</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">s</mi></mrow><mo stretchy="false">(</mo><mi>S</mi><mo>⊕</mo><mi>w</mi><mo stretchy="false">[</mo><mi>i</mi><mo stretchy="false">]</mo><mo stretchy="false">)</mo><mo>=</mo><mspace linebreak="newline"></mspace><mrow><mi mathvariant="normal">I</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">v</mi><mi mathvariant="normal">M</mi><mi mathvariant="normal">i</mi><mi mathvariant="normal">x</mi><mi mathvariant="normal">C</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">l</mi><mi mathvariant="normal">u</mi><mi mathvariant="normal">m</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">s</mi></mrow><mo stretchy="false">(</mo><mi>S</mi><mo stretchy="false">)</mo><mo>⊕</mo><mrow><mi mathvariant="normal">I</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">v</mi><mi mathvariant="normal">M</mi><mi mathvariant="normal">i</mi><mi mathvariant="normal">x</mi><mi mathvariant="normal">C</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">l</mi><mi mathvariant="normal">u</mi><mi mathvariant="normal">m</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">s</mi></mrow><mo stretchy="false">(</mo><mi>w</mi><mo stretchy="false">[</mo><mi>i</mi><mo stretchy="false">]</mo><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathrm{InvMixColumns}(S ⊕ w[i]) = \newline
    \mathrm{InvMixColumns}(S) ⊕ \mathrm{InvMixColumns}(w[i])</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathrm">InvMixColumns</span></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⊕</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord mathnormal">i</span><span class="mclose">])</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span></span><span class="mspace katex-newline"></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathrm">InvMixColumns</span></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⊕</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathrm">InvMixColumns</span></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord mathnormal">i</span><span class="mclose">])</span></span></span></span></span></div></li></ul></ld-topic>
<ld-topic class="s-vertical-title" id="aquivalente-inverse-chiffre-1"><h2>Äquivalente inverse Chiffre</h2><object class="light-image align-center" data="drawings/aes/equivalent_inverse_cipher.svg" type="image/svg+xml" role="img"></object><!--Aspekte der Umsetzung auf 8-bit Prozessoren
 ----------------------------------------------
 AES kann sehr effizient auf einem 8-Bit-Prozessor implementiert werden:
 :AddRoundKey: ist eine byteweise XOR-Operation.
 :ShiftRows: ist eine einfache Byte-Verschiebeoperation.
 :SubBytes: arbeitet auf Byte-Ebene und benötigt nur eine Tabelle von 256 Bytes.
 :MixColumns: erfordert eine Matrixmultiplikation im Körper :math:`GF(2⁸)`, was bedeutet, dass alle Operationen mit Bytes durchgeführt werden.
 Aspekte der Umsetzung auf 32-bit Prozessoren
 ------------------------------------------------
 AES kann effizient auf einem 32-Bit-Prozessor implementiert werden:
 - Die einzelnen Schritte können so umdefiniert werden, dass sie 32-Bit-Wörter verwenden.
 - Es ist möglich 4 Tabellen für die *MixColumns*-Transformation mit je 256 Wörtern vorzuberechnen.
 - Dann kann jede Spalte in jeder Runde mit 4 Tabellen-Lookups + 4 XORs berechnet werden.
 - Die Kosten für die Speicherung der Tabellen belaufen sich auf „4Kb“.
 - Die Entwickler glauben, dass die Möglichkeit einer effizienten Implementierung ein Schlüsselfaktor für die Wahl der AES-Chiffre zum neuen Standard war.
