en KI Assistenten (insbesondere Claude
aber ggf. auch ChatGPT, Ollama mit Gemma/LLama/Qwen oder OpenCode mit
Kimi/Qwen/Deepseek...) unterstützend eingesetzt.
Dies erfolgte insbesondere zur Unterstützung bei der Generierung von Grafiken
(d. h. SVG Dateien), oder um sich Übersichtstabellen generieren zu lassen.

<ld-topic class="repetition" id="arithmetik-endlicher-korper"><h2>Arithmetik endlicher Körper</h2><ul class="incremental-list simple"><li><p>Ein Körper ist eine Menge, in der wir Addition, Subtraktion, Multiplikation und Division durchführen können, ohne die Menge zu verlassen.</p></li><li><p>Die Division ist mit der folgenden Regel definiert: <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi><mi mathvariant="normal">/</mi><mi>b</mi><mo>=</mo><mi>a</mi><mo stretchy="false">(</mo><msup><mi>b</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">a/b = a(b^{-1})</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">a</span><span class="mord">/</span><span class="mord mathnormal">b</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mord mathnormal">a</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">b</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mtight">1</span></span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span>.</p></li></ul><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Ein endlicher Körper (mit einer endlichen Anzahl von Elementen) ist die Menge <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>Z</mi><mi>p</mi></msub></mrow><annotation encoding="application/x-tex">Z_p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.9694em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">Z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">p</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span></span>, die aus allen ganzen Zahlen <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">{</mo><mn>0</mn><mo separator="true">,</mo><mn>1</mn><mo separator="true">,</mo><mi mathvariant="normal">.</mi><mi mathvariant="normal">.</mi><mi mathvariant="normal">.</mi><mi mathvariant="normal">.</mi><mo separator="true">,</mo><mi>p</mi><mo>−</mo><mn>1</mn><mo stretchy="false">}</mo></mrow><annotation encoding="application/x-tex">\lbrace 0,1,....,p-1 \rbrace</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">{</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">1</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">....</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">p</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">}</span></span></span></span></span> besteht, wobei <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span></span> eine Primzahl ist und in dem modulo <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>p</mi></mrow><annotation encoding="application/x-tex">p</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">p</span></span></span></span></span> gerechnet wird.</p></aside></ld-topic>
<ld-topic class="repetition" id="arithmetik-endlicher-korper"><h2>Arithmetik endlicher Körper</h2><ul class="list-with-explanations incremental-list"><li><p>Der Einfachheit halber — und aus Gründen der Implementierungseffizienz — möchten wir mit ganzen Zahlen arbeiten, die genau in eine bestimmte Anzahl von Bits passen, ohne dass Bitmuster verschwendet werden.</p><p>Ganze Zahlen im Bereich <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn></mrow><annotation encoding="application/x-tex">0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span></span> bis <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mi>n</mi></msup><mo>−</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">2ⁿ-1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7477em;vertical-align:-0.0833em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6644em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span>, die in ein n-Bit-Wort passen.</p></li><li><p>Wenn eine Operation des verwendeten Algorithmus die Division ist, dann müssen wir Arithmetik anwenden, die über einem (ggf. endlichen) Körper definiert ist.</p><p>Division erfordert, dass jedes nicht-null-Element ein multiplikatives Inverses hat.</p></li><li><p>Wenn wir modulare Arithmetik auf die Menge der ganzen Zahlen <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>Z</mi><msup><mn>2</mn><mi>n</mi></msup></msub></mrow><annotation encoding="application/x-tex">Z_{2ⁿ}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">Z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mtight">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.5935em;"><span style="top:-2.786em;margin-right:0.0714em;"><span class="pstrut" style="height:2.5em;"></span><span class="katex-sizing reset-size3 size1 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> (mit <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">n &gt; 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span>) anwenden, dann erhalten wir <span class="warning">keinen</span> Körper!</p><p>Zum Beispiel hat die ganze Zahl <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn></mrow><annotation encoding="application/x-tex">2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">2</span></span></span></span></span> keine multiplikative Inverse in <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>Z</mi><msup><mn>2</mn><mi>n</mi></msup></msub></mrow><annotation encoding="application/x-tex">Z_{2ⁿ}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">Z</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mtight">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.5935em;"><span style="top:-2.786em;margin-right:0.0714em;"><span class="pstrut" style="height:2.5em;"></span><span class="katex-sizing reset-size3 size1 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> (mit <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">n &gt; 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span>), d. h. es gibt keine ganze Zahl <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>b</mi></mrow><annotation encoding="application/x-tex">b</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord mathnormal">b</span></span></span></span></span>, so dass <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mi>b</mi><mtext> </mtext><mo lspace="0.22em" rspace="0.22em"><mrow><mi mathvariant="normal">m</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">d</mi></mrow></mo><mtext> </mtext><msup><mn>2</mn><mi>n</mi></msup><mo>=</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">2b \bmod 2ⁿ = 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord">2</span><span class="mord mathnormal">b</span><span class="mspace" style="margin-right:0.0556em;"></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin"><span class="mord"><span class="mord mathrm">mod</span></span></span><span class="mspace" style="margin-right:0.0556em;"></span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6644em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6644em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span>.</p></li></ul><ul class="incremental"><li><p>Ein endlicher Körper der <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mi>n</mi></msup></mrow><annotation encoding="application/x-tex">2ⁿ</annotation></semantics></math></span><span class="katex-ht <ld-topic id="arithmetik-endlicher-korper-in-hinblick-auf-aes"><h2>Arithmetik endlicher Körper in Hinblick auf AES</h2><ul class="simple"><li><p>Beim <em>Advanced Encryption Standard</em> (AES) werden alle Operationen mit 8-Bit-Bytes durchgeführt</p></li><li><p>Die arithmetischen Operationen: Addition, Multiplikation und Division werden über den endlichen Körper <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi><mi>F</mi><mo stretchy="false">(</mo><msup><mn>2</mn><mn>8</mn></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">GF(2^8)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">GF</span><span class="mopen">(</span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">8</span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span> durchgeführt.</p></li></ul><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>AES verwendet das irreduzible Polynom:</p><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>m</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>x</mi><mn>8</mn></msup><mo>+</mo><msup><mi>x</mi><mn>4</mn></msup><mo>+</mo><msup><mi>x</mi><mn>3</mn></msup><mo>+</mo><mi>x</mi> <ld-topic class="s-vertical-title" id="aes-ver-entschlusselungsprozess-key-size-128bits-10-runden"><h2>AES - Ver-/Entschlüsselungsprozess (Key Size 128bits ⇒ 10 Runden)</h2><object class="light-image align-center" data="drawings/aes/encryption_and_decryption_process.svg" type="image/svg+xml" role="img" aria-label="AES Encryption and Decryption Process"></object></ld-topic>
<ld-topic id="aes-detaillierter-aufbau"><h2>AES Detaillierter Aufbau</h2><ld-story><ul class="incremental-list"><li><p>Verarbeitet in jeder Runde den gesamten Datenblock als eine einzige Matrix unter Verwendung von Substitutionen und Permutationen.</p></li><li><p>Der als Eingabe bereitgestellte Schlüssel - bei 128 Bit Schlüsselgröße -  wird in ein Array von vierundvierzig 32-Bit-Wörtern expandiert (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo stretchy="false">[</mo><mi>i</mi><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">w[i]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord mathnormal">i</span><span class="mclose">]</span></span></span></span></span>). (D. h. bei 10 Runden.)</p></li><li><p>Die Chiffre beginnt und endet mit der <em>AddRoundKey</em>-Operation.</p></li><li><p>Man kann sich die Chiffre als abwechselnde Operationen zwischen</p><p>(a) der XOR-Verschlüsselung (<em>AddRoundKey</em>) eines Blocks vorstellen, gefolgt von
(b) der Verwürfelung des Blocks (die anderen drei Stufen), gefolgt von
(c) der XOR-Verschlüsselung, und so weiter.</p></li><li><p>Jede Stufe ist leicht umkehrbar.</p></li><li><p>Der Entschlüsselungsalgorithmus verwendet den expandierten Schlüssel in umgekehrter Reihenfolge, wobei der Entschlüsselungsalgorithmus nicht mit dem Verschlüsselungsalgorithmus identisch ist.</p></li><li><p>Der Zustand (<em>State</em>) ist sowohl bei der Verschlüsselung als auch bei der Entschlüsselung derselbe.</p></li><li><p>Die letzte Runde sowohl der Verschlüsselung als auch der Entschlüsselung besteht aus nur drei Stufen.</p></li></ul></ld-story></ld-topic>
<ld-topic id="aes-verwendet-vier-verschiedene-stufen"><h2>AES verwendet vier verschiedene Stufen</h2><dl class="field-list simple"><dt><em>Substitute Bytes</em><span class="colon">:</span></dt><dd><p>verwendet eine S-Box, um eine byteweise Ersetzung des Blocks vorzunehmen</p></dd><dt><em>ShiftRows</em><span class="colon">:</span></dt><dd><p>ist eine einfache Permutation</p></dd><dt><em>MixColumns</em><span class="colon">:</span></dt><dd><p>ist eine Substitution, mit Hilfe von Polynomarithmetik über <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi><mi>F</mi><mo stretchy="false">(</mo><msup><mn>2</mn><mn>8</mn></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">GF(2^8)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">GF</span><span class="mopen">(</span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">8</span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span></p></dd><dt><em>AddRoundKey</em><span class="colon">:</span></dt><dd><p>ist ein einfaches bitweises XOR des aktuellen Blocks mit einem Teil des expandierten Schlüssels</p></dd></dl></ld-topic>

 literal">y=A</span>) wieder auf den ursprünglichen Wert ab.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="s-box-design-grundlagen"><h2>S-Box Design Grundlagen</h2><ul class="simple"><li><p>Die S-Box ist so konzipiert, dass sie gegen bekannte kryptoanalytische Angriffe resistent ist.</p></li><li><p>Die Rijndael-Entwickler suchten nach einem Design, das eine geringe Korrelation zwischen Eingabe- und Ausgabebits aufweist und die Eigenschaft hat, dass die Ausgabe keine lineare mathematische Funktion der Eingabe ist.</p></li><li><p>Die Nichtlinearität ist auf die Verwendung der multiplikativen Inversen bei der Konstruktion der S-Box zurückzuführen.</p></li></ul></ld-topic>
<ld-topic id="shift-row-transformation"><h2><em>Shift Row</em> Transformation</h2><object class="light-image align-center" data="drawings/aes/shift_row_transformation.svg" type="image/svg+xml" role="img" aria-label="Shift Row Transformation"></object></ld-topic>
<ld-topic id="shift-row-transformation-begrundung"><h2><em>Shift Row</em> Transformation - Begründung</h2><ul class="simple"><li><p>Wesentlicher als es auf den ersten Blick scheint!</p></li></ul><ul class="incremental-list simple"><li><p>Der Zustand (<em>State</em>) wird ebenso wie die Chiffrierein- und -ausgabe als Array aus vier 4-Byte-Spalten behandelt.</p></li><li><p>Bei der Verschlüsselung werden die ersten 4 Bytes des Klartextes in die erste Spalte vom Zustands (<em>State</em>) kopiert, und so weiter.</p></li><li><p>Der Rundenschlüssel wird spaltenweise auf den Zustand (<em>State</em>) angewendet.</p></li><li><p>Bei einer Zeilenverschiebung wird also ein einzelnes Byte von einer Spalte in eine andere verschoben, was einem linearen Abstand von einem Vielfachen von 4 Byte entspricht.</p></li><li><p>Die Transformation sorgt dafür, dass die 4 Bytes einer Spalte auf vier verschiedene Spalten verteilt werden.</p></li></ul></ld-topic>

">02</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">6</span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mclose">)</span></span></span></span></span> und <strong>ist nicht</strong> <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>6</mn><mi>E</mi><mo>⊕</mo><mn>6</mn><mi>E</mi><mo>⊕</mo><mn>6</mn><mi>E</mi></mrow><annotation encoding="application/x-tex">6E \oplus 6E \oplus 6E</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord">6</span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⊕</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord">6</span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⊕</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord">6</span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span></span></span></span></span>, da wir hier Polynomarithmetik in <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi><mi>F</mi><mo stretchy="false">(</mo><msup><mn>2</mn><mn>8</mn></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">GF(2^8)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1.0641em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">GF</span><span class="mopen">(</span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">8</span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span> nutzen und <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>03</mn></mrow><annotation encoding="application/x-tex">03</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">03</span></span></span></span></span> dem Polynom: <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>+</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">x+1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span> entspricht.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="mixcolumn-transformation-begrundung"><h2><em>MixColumn</em> Transformation - Begründung</h2><ul class="simple"><li><p>Die Koeffizienten einer Matrix, die auf einem linearen Code mit maximalem Abstand zwischen den Codewörtern basiert, gewährleisten eine gute Mischung zwischen den Bytes jeder Spalte.</p></li><li><p>Die <em>MixColumn Transformation</em> (~ <span class="ger">Vermischung der Spalten</span>) - kombiniert mit der <em>Shift Row Transformation</em> (<span class="ger">Zeilenverschiebung</span>) - stellt sicher, dass nach einigen Runden alle Ausgangsbits von allen Eingangsbits abhängen.</p></li></ul></ld-topic>
<ld-topic id="addroundkey-transformation"><h2><em>AddRoundKey</em> Transformation</h2><ul class="simple"><li><p>Die 128 Bits des Zustands (<em>State</em>) werden bitweise mit den 128 Bits des Rundenschlüssels XOR-verknüpft.</p></li></ul><ul class="incremental-list simple"><li><p>Die Operation wird als spaltenweise Operation zwischen den 4 Bytes einer Spalte des Zustands (<em>State</em>) und einem Wort des runden Schlüssels betrachtet.</p></li><li><p><em>Kann auch als eine Operation auf Byte-Ebene betrachtet werden</em>.</p></li></ul><aside class="admonition incremental"><p class="admonition-title">Designbegründung</p><ul class="simple"><li><p>Die <em>AddRoundKey</em> Transformation ist so einfach wie möglich und betrifft jedes Bit des Zustands.</p></li><li><p>Die Komplexität der runden Schlüsselexpansion plus die Komplexität der anderen Stufen von AES sorgen für Sicherheit!</p></li></ul></aside></ld-topic>
<ld-topic class="s-vertical-title" id="eingabe-fur-eine-einzelne-aes-verschlusselungsrunde"><h2>Eingabe für eine einzelne AES-Verschlüsselungsrunde</h2><object class="light-image align-center" data="drawings/aes/input_for_a_single_aes_round.svg" type="image/svg+xml" role="img" aria-label="Eingabe für eine einzelne AES-Verschlüsselungsrunde"></object></ld-topic>
<ld-topic id="aes-schlusselexpansion"><h2>AES Schlüsselexpansion</h2><ul class="simple"><li><p>Nimmt als Eingabe einen (hier: 128-Bit) Schlüssel mit vier Wörtern (16 Byte) und erzeugt ein lineares Array mit 44 Wörtern (176 Byte).</p></li><li><p>Dies liefert einen vier Worte umfassenden Rundenschlüssel für die initiale <em>AddRoundKey</em>-Stufe sowie für jede der folgenden 10 Runden der Chiffre.</p></li><li><p>Der Schlüssel wird in die ersten vier Wörter des erweiterten Schlüssels kopiert.</p></li><li><p>Der Rest des expandierten Schlüssels wird in Blöcken von jeweils vier Wörtern aufgefüllt.</p></li><li><p>Jedes hinzugefügte Wort <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo stretchy="false">[</mo><mi>i</mi><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">w[i]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord mathnormal">i</span><span class="mclose">]</span></span></span></span></span> hängt vom unmittelbar vorangehenden Wort <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo stretchy="false">[</mo><mi>i</mi><mo>−</mo><mn>1</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">w[i - 1]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord mathnormal">i</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">]</span></span></span></span></span> und dem vier Positionen zurückliegenden Wort <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi><mo stretchy="false">[</mo><mi>i</mi><mo>−</mo><mn>4</mn><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">w[i - 4]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mopen">[</span><span class="mord mathnormal">i</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">4</span><span class="mclose">]</span></span></span></span></span> ab.</p></li><li><p>In drei von vier Fällen wird ein einfaches XOR verwendet.</p></li><li><p>Für ein Wort dessen Position im Array <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi></mrow><annotation encoding="application/x-tex">w</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span></span></span></span></span> ein Vielfaches von 4 ist, wird die komplexere Funktion <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>g</mi></mrow><annotation encoding="application/x-tex">g</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span></span></span></span></span> angewandt.</p></li></ul></ld-topic>
<ld-topic id="aes-schlusselexpansion-visualisiert"><h2>AES Schlüsselexpansion - Visualisiert</h2><object class="light-image align-center" data="drawings/aes/key_expansion.svg" type="image/svg+xml" role="img" aria-label="AES Schlüsselexpansion"></object><ld-supplemental><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung: <em>KeyExpansion</em> bei größeren  Schlüssellängen</span></p><p>(Nicht prüfungsrelevant!)</p><p>Die <em>KeyExpansion</em> bei längeren Schlüsseln ist konzeptionell vergleichbar, aber nicht identisch. Zum Beispiel arbeitet die <em>KeyExpansion</em> bei einem 256-Bit-Schlüssel vereinfacht wie folgt:</p><p>Die 256 Bit des Schlüssels bilden direkt die Grundlage für die ersten beiden Rundenschlüssel. Der dritte Rundenschlüssel wird anschließend ausgehend vom ersten Rundenschlüssel und einer Transformation des zweiten berechnet; entsprechend wird der vierte ausgehend vom zweiten und einer Transformation des dritten Rundenschlüssels berechnet.</p><div class="monospaced"><p><em>RoundKey 3</em></p><p>w8  = w0  XOR g(w7)</p><p>w9  = w1  XOR w8</p><p>w10 = w2  XOR w9</p><p>w11 = w3  XOR w10</p><p><em>RoundKey 4</em></p><p>w12 = w4  XOR SubWord(w11)</p><p>w13 = w5  XOR w12</p><p>w14 = w6  XOR w13</p><p>w15 = w7  XOR w14</p></div><p>Dabei ist <em>SubWord</em> lediglich die byteweise Anwendung der AES-S-Box.</p></aside></ld-supplemental></ld-topic>

<ld-topic id="aes-schlusselexpansion-begrundung"><h2>AES Schlüsselexpansion - Begründung</h2><aside class="admonition width-50 float-right incremental font-size-85"><p class="admonition-title">Designziele</p><ul class="simple"><li><p>Kenntnis eines Teils des Chiffrierschlüssels oder des Rundenschlüssels ermöglicht nicht die Berechnung vieler anderer Bits des Rundenschlüssels</p></li><li><p>Eine invertierbare Transformation</p></li><li><p>Performance auf einer breiten Palette von CPUs</p></li><li><p>Verwendung von Rundenkonstanten zur Beseitigung von Symmetrien</p></li><li><p>Diffusion der Chiffrierschlüsselunterschiede in die Rundenschlüssel</p></li><li><p>Ausreichende Nichtlinearität, um die vollständige Bestimmung von Rundenschlüsselunterschieden nur aus Chiffrierschlüsselunterschieden zu verhindern</p></li><li><p>Einfachheit der Beschreibung</p></li></ul></aside><ul class="simple"><li><p>Die Rijndael-Entwickler haben den Expansionsschlüssel-Algorithmus so konzipiert, dass er gegen bekannte kryptoanalytische Angriffe resistent ist.</p></li><li><p>Die Einbeziehung einer rundenabhängigen Rundenkonstante beseitigt die Symmetrie, die sonst bei der Erzeugung der Rundenschlüssel in den verschiedenen Runden entstehen würde.</p></li></ul></ld-topic>

<ld-topic id="aquivalente-inverse-chiffre"><h2>Äquivalente inverse Chiffre</h2><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>AES-Entschlüsselung ist nicht identisch mit der Verschlüsselung.</p><ul class="simple"><li><p>Die Abfolge der Umwandlungen ist unterschiedlich, obwohl die Schlüsselableitung die gleiche ist.</p></li><li><p>Dies hat den Nachteil, dass für Anwendungen, die sowohl Verschlüsselung als auch Entschlüsselung erfordern, zwei separate Software- oder Firmware-Module benötigt werden.</p></li></ul></aside><p class="incremental">Zwei unabhängige, separate Änderungen sind erforderlich, um die Entschlüsselungsstruktur mit der Verschlüsselungsstruktur in Einklang zu bringen:</p><ol class="arabic incremental simple"><li><p>Die ersten beiden Stufen der Entschlüsselungsrunde müssen vertauscht werden.</p></li><li><p>Die zweiten beiden Stufen der Entschlüsselungsrunde müssen vertauscht werden.</p></li></ol></ld-topic>
<ld-topic id="vertausch-von-invshiftrows-und-invsubbytes"><h2>Vertausch von <span class="docutils literal">InvShiftRows</span> und <span class="docutils literal">InvSubBytes</span></h2><dl class="field-list simple"><dt><em>InvShiftRows</em><span class="colon">:</span></dt><dd><p><span class="info">beeinflusst die Reihenfolge</span> der Bytes im Zustand (<em>State</em>), ändert aber nicht den Inhalt der Bytes und ist nicht vom Inhalt der Bytes abhängig, um seine Transformation durchzuführen.</p></dd><dt><em>InvSubBytes</em><span class="colon">:</span></dt><dd><p><span class="info">beeinflusst den Inhalt</span> von Bytes im Zustand (<em>State</em>), ändert aber nicht die Byte-Reihenfolge und hängt nicht von der Byte-Reihenfolge ab, um seine Transformation durchzuführen.</p></dd></dl><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>Diese beiden Operationen sind kommutativ und somit vertauschbar.</p></aside></ld-topic>
<ld-topic id="vertausch-von-addroundkey-und-invmixcolumns"><h2>Vertausch von <em>AddRoundKey</em> und <em>InvMixColumns</em></h2><ul><li><p>Die Transformationen <em>AddRoundKey</em> und <em>InvMixColumns</em> ändern die Reihenfolge der Bytes im Zustand (<em>State</em>) nicht.</p></li><li><p>Betrachtet man den Schlüssel als eine Folge von Wörtern, so wirken sowohl <em>AddRoundKey</em> als auch <em>InvMixColumns</em> jeweils nur auf eine Spalte des Zustands (<em>State</em>).</p></li><li><p>Diese beiden Operationen sind linear in Bezug auf die gegebene Spalte.</p><p>Das heißt, für einen bestimmten Zustand <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>S</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">S_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0576em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> und einen bestimmten Rundenschlüssel <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>w</mi><mi>j</mi></msub></mrow><annotation encoding="application/x-tex">w_j</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7167em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0269em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">j</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span></span>:</p><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>I</mi><mi>n</mi><mi>v</mi><mi>M</mi><mi>i</mi><mi>x</mi><mi>C</mi><mi>o</mi><mi>l</mi><mi>u</mi><mi>m</mi><mi>n</mi><mi>s</mi><mo stretchy="false">(</mo><msub><mi>S</mi><mi>i</mi></msub><mo>⊕</mo><msub><mi>w</mi><mi>j</mi></msub><mo stretchy="false">)</mo><mo>=</mo><mspace linebreak="newline"></mspace><mi>I</mi><mi>n</mi><mi>v</mi><mi>M</mi><mi>i</mi><mi>x</mi><mi>C</mi><mi>o</mi><mi>l</mi><mi>u</mi><mi>m</mi><mi>n</mi><mi>s</mi><mo stretchy="false">(</mo><msub><mi>S</mi><mi>i</mi></msub><mo stretchy="false">)</mo><mo>⊕</mo><mi>I</mi><mi>n</mi><mi>v</mi><mi>M</mi><mi>i</mi><mi>x</mi><mi>C</mi><mi>o</mi><mi>l</mi><mi>u</mi><mi>m</mi><mi>n</mi><mi>s</mi><mo stretchy="false">(</mo><msub><mi>w</mi><mi>j</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">InvMixColumns(S_i \oplus w_j) = \newline

<ld-topic class="s-vertical-title" id="aquivalente-inverse-chiffre"><h2>Äquivalente Inverse Chiffre</h2><object class="light-image align-center" data="drawings/aes/equivalent_inverse_cipher.svg" type="image/svg+xml" role="img"></object><!--Aspekte der Umsetzung auf 8-bit Prozessoren
 ----------------------------------------------
 AES kann sehr effizient auf einem 8-Bit-Prozessor implementiert werden:
 :AddRoundKey: ist eine byteweise XOR-Operation.
 :ShiftRows: ist eine einfache Byte-Verschiebeoperation.
 :SubBytes: arbeitet auf Byte-Ebene und benötigt nur eine Tabelle von 256 Bytes.
 :MixColumns: erfordert eine Matrixmultiplikation im Körper :math:`GF(2^8)`, was bedeutet, dass alle Operationen mit Bytes durchgeführt werden.
 Aspekte der Umsetzung auf 32-bit Prozessoren
 ------------------------------------------------
 AES kann effizient auf einem 32-Bit-Prozessor implementiert werden:
 - Die einzelnen Schritte können so umdefiniert werden, dass sie 32-Bit-Wörter verwenden.
 - Es ist möglich 4 Tabellen für die *MixColumns* Transformation mit je 256 Wörtern vorzuberechnen.
 - Dann kann jede Spalte in jeder Runde mit 4 Tabellen-Lookups + 4 XORs berechnet werden.
 - Die Kosten für die Speicherung der Tabellen belaufen sich auf „4Kb“.
 - Die Entwickler glauben, dass die Möglichkeit einer effizienten Implementierung ein Schlüsselfaktor für die Wahl der AES-Chiffre zum neuen Standard war.
