<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}

<ld-topic class="no-title center-content" id="concurrency"><h2>Concurrency</h2><div class="exclamation-mark"><p>A good understanding of concurrent programming is essential for the development of distributed applications, as servers always process several requests simultaneously.</p></div></ld-topic>
<ld-topic id="processes-vs-threads"><h2>Processes vs. threads</h2><ld-deck class="light-image"><ld-card><object class="align-center" data="images/threads/threads.svg" type="image/svg+xml" role="img" aria-label="Prozesse vs. Threads"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="images/threads/fibres.svg" type="image/svg+xml" role="img"></object></ld-card><ld-card class="overlay incremental"><object class="align-center" data="images/threads/virtual_threads.svg" type="image/svg+xml" role="img"></object></ld-card></ld-deck><ld-supplemental><ul class="simple"><li><p>Processes are isolated from each other and can only communicate with each other via explicit mechanisms; processes do not share the same address space.</p></li><li><p>All threads of a process share the same address space. <em>Native threads</em> are threads supported by the operating system that are managed directly by the operating system. Standard Java threads are <em>native threads</em>.</p></li><li><p>Fibres* (also <em>coroutines</em>) always use cooperative multitasking. This means that a fibre explicitly passes control to another fibre. (Formerly also referred to as <em>green threads</em>.) These are invisible to the operating system.</p></li><li><p>As of Java 21, Java not only supports classic (native) threads but also virtual threads (which are "somewhere" between green threads and native threads. The latter in particular allow very natural programming of middleware that takes care of parallelization/concurrency.</p></li></ul></ld-supplemental></ld-topic>

<ld-topic class="repetition" id="fundamental-problems-in-concurrent-programming"><h2>Fundamental Problems in Concurrent Programming</h2><p>Concurrent access to shared mutable state introduces three classes of problems:</p><dl class="incremental-list field-list simple"><dt>Race Condition<span class="colon">:</span></dt><dd><p><em>Read / modify / write</em> of a variable is non-atomic.</p></dd><dt>Visibility<span class="colon">:</span></dt><dd><p>Reading of <em>stale values across threads</em>.</p></dd><dt>Ordering<span class="colon">:</span></dt><dd><p><em>Instructions do not execute in source order</em>.</p></dd></dl><aside class="admonition incremental" data-theme="summary"><p class="admonition-title" data-theme="summary-header"><span>Summary</span></p><p>All three problems share the same root cause:</p><p><strong>Unsynchronised access to shared mutable state</strong>.</p></aside><ld-supplemental><p>A <strong>Race Condition</strong> can happen, because a compound operation such as <code class="java">counter<span class="operator">++</span></code> consists of three separate steps (read, increment, write). When the scheduler preempts a thread between any two of these steps, another thread can operate on a stale value — an increment is silently lost.</p><p>Reading of <em>stale values across threads</em> is likely because modern CPUs (since the 1990s) cache values in registers or L1/L2 caches. A write by thread A may never reach main memory before thread B reads the same variable — thread B therefore operates on an arbitrarily old value.</p><p>Both the compiler (in case of Java the Just-In-Time Compiler not the frontend compiler) and the CPU may reorder instructions for optimisation. What <em>looks sequential in source code may execute in a completely different order at runtime</em>. This can make partially constructed objects visible to other threads.</p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hint</p><p>A <strong>monitor</strong> eliminates all three — mutual exclusion prevents races, and the <em>happens-before</em> guarantee provided by Java's memory model ensures both visibility and ordering, as we will discuss next.</p><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Remark</span></p><p>In Java "happens-before" does not mean "immediately visible across all cores at the instant of the write". It means: <strong>if you observe the write, you observe everything that preceded it.</strong></p></aside></aside></ld-supplemental></ld-topic>
<ld-topic class="exercises" id="review-question"><h2>Review Question</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1"><p>Would it make a difference if we only loop at most 60 times and the type of the variable is the primitive type <code class="java"><span class="keyword">byte</span></code>?</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">byte</span> counter <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span> 
</code><small class="ln"> 2</small><code data-lineno=" 2">

<ld-topic id="communication-and-synchronization-with-the-help-of-monitors"><h2>Communication and synchronization with the help of <em>monitors</em></h2><p>A <em>monitor</em> is an object in which the methods are executed in <em>mutual exclusion</em>.</p><object class="light-image align-right" data="images/threads/monitor.svg" type="image/svg+xml" role="img" aria-label="Monitor"></object><p class="rubric">Condition synchronization</p><ul class="simple"><li><p>expresses a condition on the order in which operations are executed.</p></li><li><p>For example, data can only be removed from a buffer once data has been entered into the buffer.</p></li><li><p>Java only supports one (anonymous) condition variable per monitor, with the classic methods <code class="java">wait</code> and <code class="java">notify</code> or <code class="java">notifyAll</code>.</p></li></ul><ld-supplemental><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warning</p><p>In Java, mutual exclusion only takes place between methods that have been explicitly declared as <code class="java"><span class="keyword">synchronized</span></code>.</p></aside><p><em>Monitors</em> are just one model (alternatives: <em>Semaphores</em>, <em>Message Passing</em>) that enables the communication and synchronization of threads. It is the standard model in Java and is directly supported by the Java Virtual Machine (JVM).</p></ld-supplemental></ld-topic>
<ld-topic id="communication-between-threads-with-the-help-of-monitors"><h2>Communication between threads with the help of monitors</h2><ul class="simple"><li><p>By reading and writing data encapsulated in shared objects that are protected by monitors.</p></li><li><p>Each object is implicitly derived from the class <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Object</span></code>, which defines a mutual exclusion lock.</p></li><li><p>Methods in a class can be marked as <code class="java"><span class="keyword">synchronized</span></code>. The method is only executed when the lock is present. It waits until then. This process happens automatically.</p></li><li><p>The lock can also be acquired via a <code class="java"><span class="keyword">synchronized</span></code> statement that names the object.</p></li><li><p>A thread can wait for a single (anonymous) condition variable and notify it.</p></li></ul></ld-topic>
<ld-topic id="concurrency-in-java-1"><h2>Concurrency in Java</h2><object class="light-image align-center" data="images/threads/java-threads.svg" type="image/svg+xml" role="img" aria-label="java.lang.Thread"></object><ld-supplemental><ul><li><p>Threads are provided in Java via the predefined class <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Thread</span></code>.</p></li><li><p>Alternatively, the interface:</p><p><code class="java"><span class="keyword">public</span> <span class="keyword">interface</span> <span class="name class">Runnable</span> <span class="punctuation">{</span> <span class="keyword">void</span> <span class="name function">run</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span></code></p><p>can be implemented and an instance can then be passed to a Thread-Objekt.</p></li><li><p>Threads only start their execution when the <code class="java">start</code> method is called in the thread class. The <code class="java">thread<span class="punctuation">.</span>start</code> method calls the <code class="java">run</code> method. Calling the <code class="java">run</code> method directly does not lead to parallel execution.</p></li><li><p>The current thread can be determined using the static method <code class="java"><span class="name class">Thread</span><span class="punctuation">.</span><span class="name function">currentThread</span><span class="punctuation">(</span><span class="punctuation">)</span></code>.</p></li><li><p>A thread is terminated when the execution of its run method ends either normally or as the result of an unhandled exception.</p></li><li><p>Java distinguishes between <em>user</em> threads and <em>daemon</em> threads.</p><p><em>Daemon threads</em> are threads that provide general services and are normally never terminated.</p><p>When all user threads are terminated, the daemon threads are terminated by the JVM and the main programme is terminated.</p><p>The method <code class="java">setDaemon</code> must be called before the thread is started.</p></li><li><p>The <code class="java"><span class="name class">Thread</span><span class="punctuation">.</span><span class="name function">stop</span><span class="punctuation">(</span><span class="punctuation">)</span></code> method was removed in Java 26, after being deprecated in Java 1.2 (December 1998).</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="inter-thread-communication-and-coordination"><h2>Inter-thread communication and coordination</h2><ul class="simple"><li><p>A thread can wait (with or without a timeout) for another thread (the target) to finish, by calling the <code class="java">join</code> method of the target thread.</p></li><li><p>A thread can use the <code class="java">isAlive</code> method to determine whether the target thread has ended.</p></li></ul></ld-topic>
<ld-topic id="java-thread-states"><h2>Java Thread States</h2><object class="light-image align-center" data="images/threads/java-thread-states.svg" type="image/svg+xml" role="img" aria-label="Java Thread States"></object></ld-topic>
<ld-topic id="synchronized-methods-and-synchronized-blocks"><h2><code class="java"><span class="keyword">synchronized</span></code>-Methods and <code class="java"><span class="keyword">synchronized</span></code>-Blocks</h2><ul class="simple"><li><p>A mutual exclusion lock is assigned to each object. The lock cannot be accessed explicitly by the application. This happens implicitly if:</p><ul class="simple"><li><p>a method uses the method modifier <code class="java"><span class="keyword">synchronized</span></code></p></li><li><p>block synchronization with the keyword <code class="java"><span class="keyword">synchronized</span></code> is used</p></li></ul></li><li><p>If a method is marked as <code class="java"><span class="keyword">synchronized</span></code>, the method can only be accessed if the system has received the lock.</p></li><li><p>Therefore, <code class="java"><span class="keyword">synchronized</span></code> methods have mutually exclusive access to the data encapsulated by the object, <span class="danger">if this data is only accessed in other synchronized contexts</span>.</p></li><li><p>Non-<code class="java"><span class="keyword">synchronized</span></code> methods do not require a lock and can therefore be called <em>at any time</em>.</p></li></ul></ld-topic>

</code><small class="ln">16</small><code data-lineno="16">  <span class="keyword">public</span> <span class="keyword">synchronized</span> <span class="name class">SharedCoordinate</span> <span class="name function">read</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">17</small><code data-lineno="17">    <span class="keyword">return</span> <span class="keyword">new</span> <span class="name class">SharedCoordinate</span><span class="punctuation">(</span>x<span class="punctuation">,</span> y<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">18</small><code data-lineno="18"><span class="punctuation">}</span> <span class="punctuation">}</span></code></pre><ld-supplemental><p>The two methods: <code class="java">readX</code> and <code class="java">readY</code> are not synchronized, as reading <code class="java"><span class="keyword">int</span></code> values is atomic. However, they do allow an inconsistent state to be read! It is conceivable that the corresponding thread is interrupted directly after a <code class="java">readX</code> and another thread changes the values of <code class="java">x</code> and <code class="java">y</code>. If the original thread is then continued and calls <code class="java">readY</code>, it receives the new value of <code class="java">y</code> and thus has a pair of <code class="java">x</code>, <code class="java">y</code> that never existed in this form.</p><p>A consistent state can only be determined by the method <code class="java">read</code>, which reads the values of <code class="java">x</code> and <code class="java">y</code> in one step and returns them as a pair.</p><p>If it can be ensured that a reading thread names the instance in a <code class="java"><span class="keyword">synchronized</span></code> block, then the reading of a consistent state can also be ensured for several consecutive method calls.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">SharedCoordinate</span> point <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">SharedCoordinate</span><span class="punctuation">(</span><span class="literal number integer">0</span><span class="punctuation">,</span><span class="literal number integer">0</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="keyword">synchronized</span> <span class="punctuation">(</span>point1<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">  <span class="keyword">var</span> x <span class="operator">=</span> point1<span class="punctuation">.</span><span class="name function">readX</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">  <span class="keyword">var</span> y <span class="operator">=</span> point1<span class="punctuation">.</span><span class="name function">readY</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="comment single">// do something with x and y</span></code></pre><p>However, this "solution" is very dangerous, as the probability of programming errors is <em>very high</em> and this can lead to either <em>race conditions</em> (here) or <em>deadlocks</em> (in general).</p></ld-supplemental></ld-topic>
<ld-topic id="conditional-synchronization"><h2>Conditional synchronization</h2><p>For the purpose of conditional synchronisation, the methods <code class="java">wait</code>, <code class="java">notify</code> and <code class="java">notifyAll</code> can be used in Java.  These methods allow you to wait for certain conditions and notify other threads when the condition has changed.</p><ld-deck class="incremental"><ld-card><ul class="simple"><li><p>These methods can only be used within methods that hold the object lock; otherwise a <code class="java"><span class="name class">IllegalMonitorStateException</span></code> is thrown.</p></li></ul></ld-card><ld-card class="incremental"><ul class="simple"><li><p>The <code class="java">wait</code> method always blocks the calling thread and releases the lock associated with the object.</p></li></ul></ld-card><ld-card class="incremental"><ul><li><p>The <code class="java">notify</code> method wakes up <em>a</em> waiting thread. Which thread is woken up is not specified.</p><p><code class="java">notify</code> does not release the lock; therefore, the awakened thread must wait until it can receive the lock before it can continue.</p></li><li><p>Use <code class="java">notifyAll</code> to wake up all waiting threads.</p><p>If the threads are waiting due to different conditions, <code class="java">notifyAll</code> must always be used.</p></li><li><p>If no thread is waiting, then <code class="java">notify</code> and <code class="java">notifyAll</code> have no effect.</p></li></ul></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="important"><p class="admonition-title" data-theme="important-header">Important</p><p>When a thread is woken up, it cannot assume that its condition has been fulfilled!</p><p>The condition must always be checked in a loop and the thread may have to be put back into the wait state.</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="example-synchronisation-with-condition-variables"><h2>Example: Synchronisation with <em>condition variables</em></h2><ld-deck><ld-card><p>If a thread is waiting for a condition, no other thread can wait for the other condition.</p><p><span class="peripheral">With the primitives presented so far, direct modelling of this scenario is not possible. Instead, all threads must always be woken up to ensure that the intended thread is also woken up. This is why it is also necessary to check the condition in a loop.</span></p></ld-card><ld-card class="incremental"><p>A <em>BoundedBuffer</em> traditionally uses two condition variables: <em>BufferNotFull</em> und <em>BufferNotEmpty</em>.</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">public</span> <span class="keyword">class</span> <span class="name class">BoundedBuffer</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">  <span class="keyword">private</span> <span class="keyword">final</span> <span class="keyword">int</span> buffer<span class="punctuation">[</span><span class="punctuation">]</span><span class="punctuation">;</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">  <span class="keyword">private</span> <span class="keyword">int</span> first<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">  <span class="keyword">private</span> <span class="keyword">int</span> last<span class="punctuation">;</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">  <span class="keyword">private</span> <span class="keyword">int</span> numberInBuffer <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">  <span class="keyword">private</span> <span class="keyword">final</span> <span class="keyword">int</span> size<span class="punctuation">;</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">
</code><small class="ln"> 8</small><code data-lineno=" 8">  <span class="keyword">public</span> <span class="name class">BoundedBuffer</span><span class="punctuation">(</span><span class="keyword">int</span> length<span class="punctuation">)</span> <span class="punctuation">{</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    size <span class="operator">=</span> length<span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10">    buffer <span class="operator">=</span> <span class="keyword">new</span> <span class="keyword">int</span><span class="punctuation">[</span>size<span class="punctuation">]</span><span class="punctuation">;</span>
</code><small class="ln">11</small><code data-lineno="11">    last <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span>
</code><small class="ln">12</small><code data-lineno="12">    first <span class="operator">=</span> <span class="literal number integer">0</span><span class="punctuation">;</span>
</code><small class="ln">13</small><code data-lineno="13">  <span class="punctuation">}</span><span class="punctuation">;</span></code></pre></ld-card><ld-card class="incremental"><pre class="code java copy-to-clipboard literal-block"><small class="ln">14</small><code data-lineno="14">  <span class="keyword">public</span> <span class="keyword">synchronized</span> <span class="keyword">void</span> <span class="name function">put</span><span class="punctuation">(</span><span class="keyword">int</span> item<span class="punctuation">)</span> <span class="keyword">throws</span> <span class="name class">InterruptedException</span> <span class="punctuation">{</span>
</code><small class="ln">15</small><code data-lineno="15">    <span class="keyword">while</span> <span class="punctuation">(</span>numberInBuffer <span class="operator">==</span> size<span class="punctuation">)</span>
</code><small class="ln">16</small><code data-lineno="16">      <span class="name function">wait</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">17</small><code data-lineno="17">    last <span class="operator">=</span> <span class="punctuation">(</span>last <span class="operator">+</span> <span class="literal number integer">1</span><span class="punctuation">)</span> <span class="operator">%</span> size<span class="punctuation">;</span>
</code><small class="ln">18</small><code data-lineno="18">    numberInBuffer<span class="operator">++</span><span class="punctuation">;</span>
</code><small class="ln">19</small><code data-lineno="19">    buffer<span class="punctuation">[</span>last<span class="punctuation">]</span> <span class="operator">=</span> item<span class="punctuation">;</span>
</code><small class="ln">20</small><code data-lineno="20">    <span class="name function">notifyAll</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">21</small><code data-lineno="21">  <span class="punctuation">}</span><span class="punctuation">;</span></code></pre></ld-card><ld-card class="incremental"><pre class="code java copy-to-clipboard literal-block"><small class="ln">22</small><code data-lineno="22">  <span class="keyword">public</span> <span class="keyword">synchronized</span> <span class="keyword">int</span> <span class="name function">get</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="keyword">throws</span> <span class="name class">InterruptedException</span> <span class="punctuation">{</span>
</code><small class="ln">23</small><code data-lineno="23">    <span class="keyword">while</span> <span class="punctuation">(</span>numberInBuffer <span class="operator">==</span> <span class="literal number integer">0</span><span class="punctuation">)</span>
</code><small class="ln">24</small><code data-lineno="24">      <span class="name function">wait</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">25</small><code data-lineno="25">    first <span class="operator">=</span> <span class="punctuation">(</span>first <span class="operator">+</span> <span class="literal number integer">1</span><span class="punctuation">)</span> <span class="operator">%</span> size<span class="punctuation">;</span>
</code><small class="ln">26</small><code data-lineno="26">    numberInBuffer<span class="operator">--</span><span class="punctuation">;</span>
</code><small class="ln">27</small><code data-lineno="27">    <span class="name function">notifyAll</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">28</small><code data-lineno="28">    <span class="keyword">return</span> buffer<span class="punctuation">[</span>first<span class="punctuation">]</span><span class="punctuation">;</span>
</code><small class="ln">29</small><code data-lineno="29">  <span class="punctuation">}</span>
</code><small class="ln">30</small><code data-lineno="30"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p>Error situation that could occur when using <code class="java">notify</code> instead of <code class="java">notifyAll</code>:</p><pre class="code java copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name class">BoundedBuffer</span> bb <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">BoundedBuffer</span><span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name class">Thread</span> g1<span class="punctuation">,</span>g2 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Thread</span><span class="punctuation">(</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">=</span><span class="operator">&gt;</span> <span class="punctuation">{</span> bb<span class="punctuation">.</span><span class="name function">get</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="name class">Thread</span> p1<span class="punctuation">,</span>p2 <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Thread</span><span class="punctuation">(</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">=</span><span class="operator">&gt;</span> <span class="punctuation">{</span> bb<span class="punctuation">.</span><span class="name function">put</span><span class="punctuation">(</span><span class="keyword">new</span> <span class="name class">Object</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">g1<span class="punctuation">.</span><span class="name function">start</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> g2<span class="punctuation">.</span><span class="name function">start</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> p1<span class="punctuation">.</span><span class="name function">start</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span> p2<span class="punctuation">.</span><span class="name function">start</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span></code></pre><table class="s-font-size-90 incremental-table-rows"><colgroup><col style="width: 2.0%"><col style="width: 16.7%"><col style="width: 33.3%"><col style="width: 22.0%"><col style="width: 26.0%"></colgroup><thead><tr><th class="head"></th><th class="head"><p>Operation</p></th><th class="head"><p>Change of State of the Buffer</p></th><th class="head"><p>Waiting for the lock</p></th><th class="head"><p>Waiting for the condition</p></th></tr></thead><tbody><tr><td><p>1</p></td><td><p><strong>g1:bb.get()</strong> <br>
g2:bb.get(), p1:bb.put(), p2:bb.put()</p></td><td><p>empty</p></td><td><p>{g2,p1,p2}</p></td><td><p>{g1}</p></td></tr><tr><td><p>2</p></td><td><p><strong>g2:bb.get()</strong></p></td><td><p>empty</p></td><td><p>{p1,p2}</p></td><td><p>{g1,g2}</p></td></tr><tr><td><p>3</p></td><td><p><strong>p1:bb.put()</strong></p></td><td><p>empty → not empty</p></td><td><p>{p2,g1}</p></td><td><p>{g2}</p></td></tr><tr><td><p>4</p></td><td><p><strong>p2:bb.put()</strong></p></td><td><p>not empty</p></td><td><p>{g1}</p></td><td><p>{g2,p2}</p></td></tr><tr><td><p>5</p></td><td><p><strong>g1:bb.get()</strong></p></td><td><p>not empty → empty</p></td><td><p>{g2}</p></td><td><p>{p2}</p></td></tr><tr><td><p>6</p></td><td><p><strong>g2:bb.get()</strong></p></td><td><p>empty</p></td><td><p>∅</p></td><td><p>{g2,p2}</p></td></tr></tbody></table></ld-card></ld-deck><ld-supplemental><p>In step 5, the VM woke up the <code class="java">g2</code> thread - instead of the <code class="java">p2</code> thread - due to the call of <code class="java">notify</code> by <code class="java">g1</code>. The awakened thread <code class="java">g2</code> checks the condition (step 6) and realises that the buffer is empty. It goes back to the wait state. Now both a thread that wants to write a value and a thread that wants to read a value are waiting.</p></ld-supplemental></ld-topic>
<ld-topic id="java-s-volatile-keyword-lightweight-visibility-guarantee"><h2>Java's <code class="java"><span class="keyword">volatile</span></code> Keyword — Lightweight Visibility Guarantee</h2><ld-deck><ld-card><ul class="incremental-list simple"><li><p>Declaring a field <code class="java"><span class="keyword">volatile</span></code> guarantees <em>visibility</em>: every write is immediately flushed to main memory; every read fetches the current value from main memory.</p></li><li><p>It also guarantees <em>ordering</em>: a write <em>happens-before</em> every subsequent read of the same variable.</p></li></ul><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Attention!</p><p>Usage of <code class="java"><span class="keyword">volatile</span></code> does <strong>not</strong> guarantee <strong>atomicity</strong>: compound operations such as <code class="java">counter<span class="operator">++</span></code> (read / modify / write) are still unsafe.</p></aside><ld-supplemental><p>Behind the scenes, <code class="java"><span class="keyword">volatile</span></code> inserts <em>memory barriers</em> that prevent both the Just-In-Time-Compiler (JIT Compiler) and the CPU from reordering instructions across the barrier.</p><p>Hence, <code class="java"><span class="keyword">volatile</span></code> eliminates only two of the three fundamental problems: visibility and ordering. To eliminate all three a <em>monitor</em> (<code class="java"><span class="keyword">synchronized</span></code>) or an atomic type (e.g. <code class="java"><span class="name class">AtomicInteger</span></code>) is required.</p></ld-supplemental></ld-card><ld-card class="incremental"><p class="rubric">Rule of thumb</p><div class="accentuate"><p><code class="java"><span class="keyword">volatile</span></code> is sufficient when <em>exactly one thread writes</em> and one or more threads only read — with no read/modify/write involved.</p></div></ld-card><ld-card class="incremental"><p class="rubric">Using <code class="java"><span class="keyword">volatile</span></code> — the Stop-Flag Pattern</p><ld-deck><ld-card><p class="rubric"><em>Insufficiently</em> Synchronized Example</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">boolean</span> running <span class="operator">=</span> <span class="keyword constant">true</span><span class="punctuation">;</span>             <span class="comment single">// shared variable</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">void</span> <span class="name function">main</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="keyword">throws</span> <span class="name class">InterruptedException</span> <span class="punctuation">{</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="keyword">var</span> worker <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Thread</span><span class="punctuation">(</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">-&gt;</span> <span class="punctuation">{</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">        <span class="keyword">while</span> <span class="punctuation">(</span>running<span class="punctuation">)</span> <span class="punctuation">{</span>           <span class="comment single">// read</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="punctuation">}</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="punctuation">}</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    worker<span class="punctuation">.</span><span class="name function">start</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="name class">Thread</span><span class="punctuation">.</span><span class="name function">sleep</span><span class="punctuation">(</span><span class="literal number integer">1000</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10">    running <span class="operator">=</span> <span class="keyword constant">false</span><span class="punctuation">;</span>                 <span class="comment single">// write</span>
</code><small class="ln">11</small><code data-lineno="11"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Correctly Synchronized Example</p><pre class="code java copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">volatile</span> <span class="keyword">boolean</span> running <span class="operator">=</span> <span class="keyword constant">true</span><span class="punctuation">;</span>    <span class="comment single">// evey read/write hits main memory</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">void</span> <span class="name function">main</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="keyword">throws</span> <span class="name class">InterruptedException</span> <span class="punctuation">{</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="keyword">var</span> worker <span class="operator">=</span> <span class="keyword">new</span> <span class="name class">Thread</span><span class="punctuation">(</span><span class="punctuation">(</span><span class="punctuation">)</span> <span class="operator">-&gt;</span> <span class="punctuation">{</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">        <span class="keyword">while</span> <span class="punctuation">(</span>running<span class="punctuation">)</span> <span class="punctuation">{</span>           <span class="comment single">// read from main memory</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="punctuation">}</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="punctuation">}</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    worker<span class="punctuation">.</span><span class="name function">start</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="name class">Thread</span><span class="punctuation">.</span><span class="name function">sleep</span><span class="punctuation">(</span><span class="literal number integer">1000</span><span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10">    running <span class="operator">=</span> <span class="keyword constant">false</span><span class="punctuation">;</span>                <span class="comment single">// write to main memory</span>
</code><small class="ln">11</small><code data-lineno="11"><span class="punctuation">}</span></code></pre><aside class="admonition incremental" data-theme="summary"><p class="admonition-title" data-theme="summary-header"><span>Summary</span></p><p><code class="java"><span class="keyword">volatile</span></code> is correct here because only the <em>main thread writes</em> and only the <em>worker thread reads</em> — no compound operation is involved.</p></aside><ld-supplemental><p>Without <code class="java"><span class="keyword">volatile</span></code>, the JIT compiler is free to hoist the <code class="java">running</code>
read out of the loop — it has no evidence that another thread will ever
change it.  The worker may therefore spin forever even after the flag is set
to <code class="java"><span class="keyword constant">false</span></code>.</p><p>Note that <span class="docutils literal">volatile</span> does <em>not</em> guarantee <em>when</em> the worker reacts to the flag change — it only guarantees
that the write will eventually (and typically immediately) be seen.</p></ld-supplemental></ld-card></ld-deck></ld-card></ld-deck></ld-topic>

<ld-topic id="java-api-for-concurrent-programming"><h2>Java API for concurrent programming</h2><dl class="incremental-list field-list simple"><dt>java.util.concurrent<span class="colon">:</span></dt><dd><p>Provides various classes to support common concurrent programming paradigms, e.g. support for <em>BoundedBuffers</em> or thread pools.</p></dd><dt>java.util.concurrent.atomic<span class="colon">:</span></dt><dd><p>Provides support for <em>lock-free</em>, thread-safe programming on simple variables - such as atomic integers.</p></dd><dt>java.util.concurrent.locks<span class="colon">:</span></dt><dd><p>Provides various lock algorithms that complement the Java language mechanisms, e.g. read-write locks and conditional variables. This enables, for example: "Hand-over-Hand" or "Chain Locking".</p></dd></dl></ld-topic>

<ld-topic id="thread-priorities"><h2>Thread Priorities</h2><ul class="incremental-list simple"><li><p>Although priorities can be assigned to the Java threads (<code class="java">setPriority</code>), they only serve the underlying scheduler as a guideline for resource allocation.</p></li><li><p>A thread can explicitly give up the processor resources by calling the <code class="java"><span class="keyword">yield</span></code> method.</p></li><li><p><code class="java"><span class="keyword">yield</span></code> places the thread at the end of the queue for its priority level.</p></li><li><p>However, Java's scheduling and priority models are weak:</p><ul class="simple"><li><p>There is no guarantee that the thread with the highest priority that can run will always be executed.</p></li><li><p>Threads with the same priority may or may not be divided into time slices.</p></li><li><p>When using native threads, different Java priorities can be mapped to the same operating system priority.</p></li></ul></li></ul></ld-topic>
<ld-topic id="best-practices"><h2>Best Practices</h2><aside class="admonition" data-theme="important"><p class="admonition-title" data-theme="important-header">Important</p><ul class="incremental-list simple"><li><p><code class="java"><span class="keyword">synchronized</span></code> code should be kept as short as possible.</p></li><li><p>Nested monitor calls should be avoided as the outer lock is not released when the inner monitor is waiting. This can easily lead to a deadlock occurring.</p></li></ul></aside></ld-topic>
<ld-topic class="no-title center-content" id="always-lock-resources-in-the-same-order"><h2>Always lock resources in the same order</h2><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warning</p><p>If two (or more) threads access the same resources in a different order, a deadlock can occur.</p></aside><aside class="admonition incremental width-100" data-theme="important"><p class="admonition-title" data-theme="important-header">Important</p><p><strong>Resources must always be locked in the same order</strong> to avoid deadlocks.</p></aside></ld-topic>
<ld-topic class="new-section" id="thread-safety"><h2>Thread Safety</h2></ld-topic>
<ld-topic id="thread-safety-prerequisites"><h2>Thread Safety - Prerequisites</h2><p>For a class to be thread-safe, it must behave correctly in a single-threaded environment.</p><ld-deck><ld-card><p>I.e. if a class is implemented correctly, then no sequence of operations (reading or writing public fields and calling public methods) on objects of this class should be able to</p><ul class="simple"><li><p>set the object to an invalid state,</p></li><li><p>observe the object in an invalid state, or</p></li><li><p>violate one of the invariants, preconditions or postconditions of the class.</p></li></ul></ld-card><ld-card class="incremental"><p>The class must also behave correctly when accessed by multiple threads.</p><ul class="simple"><li><p>Independent of <em>scheduling</em> or the interleaving of the execution of these threads by the runtime environment,</p></li><li><p>Without additional synchronisation on the part of the calling code.</p></li></ul><aside class="admonition incremental" data-theme="assessment"><p class="admonition-title" data-theme="assessment-header"><span>Assessment</span></p><p>As a result, operations on a thread-safe object appear to all threads as if the operations were performed in a fixed, globally consistent order.</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="thread-safety-level"><h2>Thread Safety Level</h2><dl class="incremental-list field-list simple"><dt>Immutable<span class="colon">:</span></dt><dd><p>The objects are constant and cannot be changed.</p></dd><dt>Thread-safe<span class="colon">:</span></dt><dd><p>The objects can be changed, but support concurrent access as the methods are synchronized accordingly.</p></dd><dt>Conditionally thread-safe<span class="colon">:</span></dt><dd><p>All objects where each individual operation is thread-safe, but certain sequences of operations may require external synchronization.</p></dd><dt>Thread-compatible<span class="colon">:</span></dt><dd><p>All objects that have no synchronization at all. However, the caller can take over the synchronization externally if necessary.</p></dd><dt>Thread-hostile<span class="colon">:</span></dt><dd><p>Objects that are not thread-safe and cannot be made thread-safe as they manipulate global status, for example.</p></dd></dl></ld-topic>
<ld-topic class="exercises" id="exercise"><h2>Exercise</h2><div class="ld-exercise" id="ld-exercise-4" data-exercise-id="4" data-exercise-title="4 - Delayed Execution"><p class="ld-exercise-title rubric"><span>Delayed Execution</span></p><p>Implement a class (<code class="java"><span class="name class">DelayingExecutor</span></code>) that accepts tasks (instances of <code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Runable</span></code>) and executes them after a certain time. The class must not block or be locked during this time.</p><p>Consider using virtual threads. A virtual thread can be created using the method: <code class="java"><span class="name class">Thread</span><span class="punctuation">.</span><span class="name function">ofVirtual</span><span class="punctuation">(</span><span class="punctuation">)</span></code>. A <code class="java"><span class="name class">Runnable</span></code> object can then be passed to the <code class="java">start</code> method.</p><p>Delay the execution (<code class="java"><span class="name class">Thread</span><span class="punctuation">.</span><span class="name function">sleep</span><span class="punctuation">(</span><span class="punctuation">)</span></code>) by an average of 100ms with a standard deviation of 20ms. (Use <code class="java"><span class="name class">Random</span><span class="punctuation">.</span><span class="name function">nextGaussian</span><span class="punctuation">(</span>mean<span class="punctuation">,</span>stddev<span class="punctuation">)</span></code>)</p><p>Start 100 000 virtual threads. How long does the execution take? How long does the execution take with 100 000 platform (<em>native</em>) threads?</p><p>It is recommended to use the template.</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:mrREYJe8SLEdxiKHOMTE8fsa2aZCNBet1hEgPy/HJSI=:MLXiKOcsDn7MW5cN:f9SClJVGDORlKyGt8vaKjB1eiRIg0 <ld-topic class="exercises" id="exercise-1"><h2>Exercise</h2><ld-scrollable><div class="ld-exercise" id="ld-exercise-5" data-exercise-id="5" data-exercise-title="5 - Thread-safe programming"><p class="ld-exercise-title rubric"><span>Thread-safe programming</span></p><p>Implement a class <code class="java"><span class="name class">ThreadsafeArray</span></code> to store non-<code class="java"><span class="keyword">null</span></code> objects (<code class="java"><span class="name class"><span class="name namespace">java<span class="punctuation">.</span>lang<span class="punctuation">.</span></span>Object</span></code>) at selected indices - comparable to a normal array. Compared to a normal array, however, a thread which wants to read a value should be blocked if the cell is occupied. The class should provide the following methods:</p><dl class="field-list simple"><dt><code class="java"><span class="name function">get</span><span class="punctuation">(</span><span class="keyword">int</span> index<span class="punctuation">)</span></code><span class="colon">:</span></dt><dd><p>Returns the value at the position <code class="java">index</code>. The calling thread may be blocked until a value has been saved at the <code class="java">index</code> position. (The <code class="java">get</code> method does not remove the value from the array).</p></dd><dt><code class="java"><span class="name function">set</span><span class="punctuation">(</span><span class="keyword">int</span> index<span class="punctuation">,</span> <span class="name class">Object</span> value<span class="punctuation">)</span></code><span class="colon">:</span></dt><dd><p>Stores the value <code class="java">value</code> at the position <code class="java">index</code>. If a value has already been saved at the position <code class="java">index</code>, the calling thread is blocked until the value at the position <code class="java">index</code> has been deleted.</p></dd><dt><code class="java"><span class="name function">delete</span><span class="punctuation">(</span><span class="keyword">int</span> index<span class="punctuation">)</span></code><span class="colon">:</span></dt><dd><p>Deletes the value at position <code class="java">index</code> if a value exists. Otherwise, the thread is blocked until there is a value that can be deleted.</p></dd></dl><ol class="loweralpha simple"><li><p>Implement the <code class="java"><span class="name class">ThreadsafeArray</span></code> class using only the standard primitives: <code class="java"><span class="keyword">synchronized</span></code>, <code class="java">wait</code>, <code class="java">notify</code> and <code class="java">notifyAll</code>. Use the template.</p></li><li><p>Can you use both <code class="java">notify</code> and <code class="java">notifyAll</code>?</p></li><li><p>Implement the <code class="java"><span class="name class">ThreadsafeArray</span></code> class using <code class="java"><span class="name class">ReentrantLock</span></code>s and <code class="java"><span class="name class">Condition</span></code>s. Use the template.</p></li><li><p>What are the advantages of using <code class="java"><span class="name class">ReentrantLock</span></code>s?</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:BJujcHhxqlqm+TSVnAzlBcQkH0tQ3ztKkWvQ9zPizb0=:4i5tvHOsFYcndesb:4B4LCULjo9evWXnvH2/ZBxNKi89llZPyBGWsWC1Dk0DDYRD/w9dpXk4R9NnkcO6jfkbortLd0AHWV+KclLVekLmkHg2P/YNp6P1AKmi1e2IhHPhifqh6bvhFFW2RVXNdqNQXsKgWl3NXJ9xaPHJHZVZ85KKd/VvdiDXcd8oqYUcqNkUzFoHQph+8a/smHbGveCZ+AQQHJyH7os7lWn1ot5CTjAsXCh7rToMoQuYgLo4Zw8ItE8vU4f9Vl+MJ4TnoS4wBYIdcyOgkEPzVe1Co7QId4CxSQO91M7yuVNXCWv5/VvE1Vs40yucUo5pyzvwhzpqjqqt9Hmmz/FJgb3Nd8Mb/uXt0c2N0Wc+6ZAYy1TO39pBtGfWYI7PCW0SOpSYSSOK6I3Nsxy6bP250l643oYKkyYml1sS/5caNhNOn2lERFV6XhPjgCz/I10rr9IeiVuwzOOHjyxO/AtQ2raNe4Ypuw77eU0cKIqrTBpxYlNHG481u9WA7wcWDV1pxwr33fHQBj54z/pjYBJ/sE8lb+mc1jIuELjs0CskMj5qcgveTbUSvPM6yNh9hKPHwNFFBgIaImfF1OkoUD0jSqjAZ9JVjQM/W/b167jO7DCVV9wxxySG0Opd7AJSAWYxxlBQIOqukfWqmRDtT
