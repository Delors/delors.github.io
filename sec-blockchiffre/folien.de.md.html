<ld-topic id="stromchiffre-vs-blockchiffre"><h2>Stromchiffre vs. Blockchiffre</h2><object class="light-image align-left" data="drawings/chiffren/stromchiffre.svg" type="image/svg+xml" role="img"></object><object class="light-image incremental align-right" data="drawings/chiffren/blockchiffre.svg" type="image/svg+xml" role="img"></object><ld-presenter-note encrypted="">MTAwMDAw:OzpEJzDJo2D0jkOKIZmYIhT0SZJcxLqyiV2u3a9nl80=:mUb6tWAMJChonb9B:T+4NR78AedbBD8J+5NmSpViT2d9X621Sq3M4ITBUe9jusnJr0jdMdrw+PmX9w4REt0pM2Jd9B7YuXLVSJXMigPAGLC7VQMKTOKhOP6S7YP+6PZ3Ad5KxjhQlw12+yHX38fw40mcfgYN08K+P865kBPXjkFgBmHNp2nhmd9Gm/aBaNymc</ld-presenter-note></ld-topic>
<ld-topic id="blockchiffre"><h2>Blockchiffre</h2><ul class="incremental-list simple"><li><p>Ein Klartextblock wird als Ganzes behandelt und verwendet, um einen gleich langen Chiffretextblock zu erzeugen.</p></li><li><p>In der Regel wird eine Blockgröße von 64 (8 Byte) oder 128 Bit (16 Byte) verwendet.</p></li><li><p>Wie bei einer Stromchiffre <em>teilen sich die beiden Benutzer einen symmetrischen Chiffrierschlüssel</em>.</p></li><li><p>Viele netzbasierte als auch klassische Anwendungen (z. B. Verschlüsselung von Dateien oder ganzen Partitionen), die auf symmetrische Verschlüsselung setzen, verwenden Blockchiffren.</p></li></ul><ld-supplemental><aside class="admonition" data-theme="important"><p class="admonition-title" data-theme="important-header">Wichtig</p><p>Im Rahmen der Verschlüsselung von Daten, die über ein Netzwerk übertragen werden, kommt es häufig sowohl zum Einsatz von asymmetrischer Verschlüsselung als auch von symmetrischer Verschlüsselung, wobei die symmetrische Verschlüsselung für die eigentliche Kommunikation verwendet wird und die asymmetrische Verschlüsselung nur während des Verbindungsaufbaus – zum Aushandeln eines gemeinsamen Schlüssels für die symmetrische Verschlüsselung – zum Einsatz kommt.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="allgemeine-n-bit-n-bit-blocksubstitution-n-4"><h2>Allgemeine n-Bit-n-Bit-Blocksubstitution (n = 4)</h2><object class="light-image align-center" data="drawings/chiffren/4-bit_block_substitution.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>Mittels 4 Bit können 16 verschiedene Werte dargestellt werden ([0,15]). Je nach Wert der Eingabe wird ein anderer Wert ausgegeben. Die Zuordnung ist der Grafik zu entnehmen.</p></ld-supplemental></ld-topic>
<ld-topic id="verschlusselungs-und-entschlusselungstabelle-fur-eine-substitutions-chiffre"><h2>Verschlüsselungs- und Entschlüsselungstabelle für eine Substitutions-Chiffre</h2><p><strong>Verschlüsselungstabelle</strong></p><table class="font-size-65 highlight-identical-cells-on-hover align-center"><tbody><tr><th class="stub"><p>Klartext</p></th><td><p>0000</p></td><td><p>0001</p></td><td><p>0010</p></td><td><p>0011</p></td><td><p>0100</p></td><td><p>0101</p></td><td><p>0110</p></td><td><p>0111</p></td><td><p>1000</p></td><td><p>1001</p></td><td><p>1010</p></td><td><p>1011</p></td><td><p>1100</p></td><td><p>1101</p></td><td><p>1110</p></td><td><p>1111</p></td></tr><tr><th class="stub"><p>Geheimtext</p></th><td><p>1110</p></td><td><p>0100</p></td><td><p>1101</p></td><td><p>0001</p></td><td><p>0010</p></td><td><p>1111</p></td><td><p>1011</p></td><td><p>1000</p></td><td><p>0011</p></td><td><p>1010</p></td><td><p>0110</p></td><td><p>1100</p></td><td><p>0101</p></td><td><p>1001</p></td><td><p>0000</p></td><td><p>0111</p></td></tr></tbody></table><p><strong>Entschlüsselungstabelle</strong></p><table class="incremental font-size-65 highlight-identical-cells-on-hover align-center"><tbody><tr><td><p>Geheimtext</p></td><td><p>0000</p></td><td><p>0001</p></td><td><p>0010</p></td><td><p>0011</p></td><td><p>0100</p></td><td><p>0101</p></td><td><p>0110</p></td><td><p>0111</p></td><td><p>1000</p></td><td><p>1001</p></td><td><p>1010</p></td><td><p>1011</p></td><td><p>1100</p></td><td><p>1101</p></td><td><p>1110</p></td><td><p>1111</p></td></tr><tr><td><p>Klartext</p></td><td><p>1110</p></td><td><p>0011</p></td><td><p>0100</p></td><td><p>1000</p></td><td><p>0001</p></td><td><p>1100</p></td><td><p>1010</p></td><td><p>1111</p></td><td><p>0111</p></td><td><p>1101</p></td><td><p>1001</p></td><td><p>0110</p></td><td><p>1011</p></td><td><p>0010</p></td><td><p>0000</p></td><td><p>0101</p></td></tr></tbody></table></ld-topic>
<ld-topic id="feistel-chiffre"><h2>Feistel-Chiffre</h2><p>Feistel schlug die Verwendung einer Chiffre vor, bei der sich Substitutionen und Permutationen abwechseln.</p><aside class="admonition incremental" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Substitutionen</span></p><p>Jedes Klartextelement oder jede Gruppe von Elementen wird eindeutig durch ein entsprechendes Chiffretextelement oder eine entsprechende Gruppe von Elementen ersetzt.</p></aside><aside class="admonition incremental" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Permutation</span></p><p>Bei einer Permutation werden keine Elemente hinzugefügt, gelöscht oder ersetzt, sondern die Reihenfolge, in der die Elemente in einer Folge erscheinen, wird geändert.</p></aside></ld-topic>
<ld-topic id="feistel-chiffre-hintergrund"><h2>Feistel-Chiffre - Hintergrund</h2><ul><li><p>Hierbei handelt es sich um eine praktische Anwendung eines Vorschlags von Claude Shannon zur Entwicklung einer Chiffre, bei der sich <em>Konfusions- und Diffusionsfunktionen</em> abwechseln.</p></li><li><p>Dieser Aufbau wird von vielen bedeutenden (Twofish, Blowfish, Mars) symmetrischen Blockchiffren – die in spezifischen Anwendungsfällen noch anzutreffen sind – verwendet.</p></li><li><p>Mars und Twofish wurden Finalisten für die Auswahl des Advanced Encryption Standard (AES) ausgewählt und vom NIST als hoch-sicher eingestuft.</p><ld-supplemental><p>Der ausgewählte Algorithmus für AES ist jedoch Rijndael. Dieser wurde „nur“ als hinreichend sicher eingestuft.</p></ld-supplemental></li></ul><div class="incremental"><p><strong>Diffusion und Konfusion</strong></p><ul class="simple"><li><p>Begriffe, die von Claude Shannon eingeführt wurden, um die beiden grundlegenden Bausteine für jedes kryptografische System zu erfassen.</p></li><li><p>Shannons Anliegen war es, die auf statistischer Analyse beruhende Kryptoanalyse zu vereiteln.</p></li></ul></div><ld-supplemental><p>Blowfish ist zum Beispiel die Basis für das Hashingverfahren <span class="docutils literal">bcrypt</span>, welches für Passworthashing verwendet wird.</p></ld-supplemental></ld-topic>
<ld-topic id="diffusion"><h2>Diffusion</h2><ul class="simple"><li><p>Die statistische Struktur des Klartextes wird in weitreichende Statistiken des Chiffretextes überführt, d. h. die <strong>statistische Beziehung zwischen Klartext und Chiffretext wird so komplex wie möglich</strong>.</p></li></ul><ul class="incremental list-with-explanations"><li><p>Dies wird dadurch erreicht, dass jede Klartextziffer(bzw. -zeichen) den Wert vieler Chiffretextziffern (bzw. -zeichen) beeinflusst.</p><p>(„Lawineneffekt“)</p></li><li><p>Die Diffusion kann z. B. durch <em>Permutationen</em> erreicht werden.</p></li></ul></ld-topic>
<ld-topic id="konfusion"><h2>Konfusion</h2><ul class="simple"><li><p>Versucht, <strong>die Beziehung zwischen den Statistiken des Chiffriertextes und dem Wert des Chiffrierschlüssels so komplex wie möglich zu gestalten</strong>, d. h. eine einzige Änderung des Chiffrierschlüssels sollte viele Bits des Chiffriertextes beeinflussen.</p></li></ul><ul class="incremental simple"><li><p>Selbst wenn der Angreifer die Statistik des Chiffretextes einigermaßen in den Griff bekommt, ist die Art und Weise, wie der Schlüssel verwendet wurde, um diesen Chiffretext zu erzeugen, so komplex, dass es schwierig ist, den Schlüssel abzuleiten.</p></li><li><p>Die Verwirrung kann z. B. durch <em>Substitutionen</em> realisiert werden.</p></li></ul></ld-topic>
<ld-topic class="no-title" id="feistel-chiffre-verschlusselung-und-entschlusselung"><h2>Feistel-Chiffre - Verschlüsselung und Entschlüsselung</h2><ld-grid class="default-layout"><ld-cell class="width-40" style="align-self:auto;"><p class="rubric">Feistel-Chiffre</p><p>Verschlüsselung und Entschlüsselung</p><aside class="admonition width-100" data-theme="legend"><p class="admonition-title" data-theme="legend-header"><span>Legende</span></p><p>K<sub>x</sub> - Schlüssel der x-ten Runde</p><p>L<sub>x-1</sub> - linke Hälfte des Eingabeblocks der x-ten Runde</p><p>R<sub>x-1</sub> - rechte Hälfte des Eingabeblocks der x-ten Runde</p><p>F - Rundenfunktion</p><p>⨁ - XOR-Operation</p></aside></ld-cell><ld-cell class="width-60" style="align-self:auto;"><object class="light-image align-center" data="drawings/feistel/design.svg" type="image/svg+xml" role="img"></object></ld-cell></ld-grid><ld-supplemental><p class="rubric">Notwendigkeit der <em>Swap</em> Operation</p><p>Die Verwendung des <em>Swap</em>s am Ende ist notwendig, damit die Verschlüsselung und Entschlüsselung identisch sind; d. h. derselbe Algorithmus verwendet werden kann.</p><p>Zum besseren Verständnis gehen wir im Folgenden davon aus, dass wir nur eine Runde hätten:</p><object class="light-image align-center" data="drawings/feistel/one_round_and_swap.svg" type="image/svg+xml" role="img"></object><p>Wird der Swap am Ende nicht durchgeführt, würde die Entschlüsselung nicht funktionieren, wie am folgenden Beispiel mit nur einer Runde zu sehen ist:</p><object class="light-image align-center" data="drawings/feistel/one_round_no_swap.svg" type="image/svg+xml" role="img"></object><p>Ein alternatives Design wäre es, beim Verschlüsseln auf den finalen Tausch zu verzichten und stattdessen beim Entschlüsseln initial einen Tausch durchzuführen — zusätzlich zum finalen Tausch. Dieses Design wird jedoch nicht verwendet, da es die Implementierung komplizierter macht.</p></ld-supplemental></ld-topic>
<ld-topic id="feistel-chiffre-beispiel"><h2>Feistel Chiffre - Beispiel</h2><object class="light-image align-center" data="drawings/feistel/example.svg" type="image/svg+xml" role="img"></object><aside class="admonition" data-theme="remember"><p class="admonition-title" data-theme="remember-header"><span>Zur Erinnerung</span></p><pre class="literal-block"><code>[F(03A6,12DE52) ⊕ DE7F] ⊕ F(03A6,12DE52) =
 F(03A6,12DE52) ⊕ F(03A6,12DE52) ⊕ DE7F  = DE7F</code></pre></aside></ld-topic>
<ld-topic id="feistel-chiffre-eigenschaften"><h2>Feistel Chiffre - Eigenschaften</h2><ld-story><dl class="incremental-list dd-margin-left-2em field-list simple"><dt><strong>Rundenfunktion F</strong><span class="colon">:</span></dt><dd><p>Größere Komplexität bedeutet in der Regel größere Resistenz gegen Kryptoanalyse.</p></dd><dt><strong>Schnelle Ver-/Entschlüsselung in Software</strong><span class="colon">:</span></dt><dd><p>Wenn die Verschlüsselung so in Anwendungen oder Dienstprogramme eingebettet ist, dass eine Hardwareimplementierung nicht möglich ist, dann ist die Geschwindigkeit des Algorithmus relevant.</p></dd><dt><strong>Einfachheit der Analyse</strong><span class="colon">:</span></dt><dd><p>Wenn der Algorithmus kurz und klar erklärt werden kann, ist es einfacher den Algorithmus auf kryptoanalytische Schwachstellen hin zu analysieren und somit ein höheres Maß an Sicherheit in Bezug auf seine Stärke zu entwickeln.</p></dd><dt><strong>Algorithmus für die Ableitung der (Unter-)Schlüssel</strong><span class="colon">:</span></dt><dd><p>Eine höhere Komplexität dieses Algorithmus sollte zu einer größeren Schwierigkeit der Kryptoanalyse führen.</p></dd><dt><strong>Blockgröße</strong><span class="colon">:</span></dt><dd><p>Größere Blockgrößen bedeuten mehr Sicherheit, aber eine geringere Verschlüsselungs-/Entschlüsselungsgeschwindigkeit für einen bestimmten Algorithmus.</p></dd><dt><strong>Schlüsselgröße</strong><span class="colon">:</span></dt><dd><p>Ein größerer Schlüssel bedeutet mehr Sicherheit, kann aber die Verschlüsselungs-/Entschlüsselungsgeschwindigkeit verringern.</p></dd><dt><strong>Anzahl der Runden</strong><span class="colon">:</span></dt><dd><p>Das Wesen der Feistel-Chiffre besteht darin, dass eine einzige Runde unzureichende Sicherheit bietet, während mehrere Runden zunehmende Sicherheit bieten.</p></dd></dl></ld-story></ld-topic>
<ld-topic id="data-encryption-standard-des"><h2>Data Encryption Standard (DES)</h2><ul class="simple"><li><p>Wurde 1977 vom National Bureau of Standards (heute NIST) als Federal Information Processing Standard 46 herausgegeben.</p></li><li><p>War das am häufigsten verwendete Verschlüsselungsverfahren bis zur Einführung des Advanced Encryption Standard (AES) im Jahr 2001.</p></li><li><p>Der Algorithmus selbst wird als Data Encryption Algorithm (DEA) bezeichnet.</p></li></ul><aside class="admonition incremental"><p class="admonition-title">Eigenschaften</p><ul class="simple"><li><p>Die Daten werden in 64-Bit-Blöcken mit einem 56-Bit-Schlüssel verschlüsselt.</p></li><li><p>Der Algorithmus wandelt die 64-Bit-Eingabe in einer Reihe von Schritten in eine 64-Bit-Ausgabe um.</p></li><li><p>Dieselben Schritte werden mit demselben Schlüssel verwendet, um die Verschlüsselung rückgängig zu machen.</p></li></ul></aside><ld-supplemental><p>Bei DES enthält ein 64 Bit langer Schlüssel 8 Paritätsbits, die zur Überprüfung der Schlüsselübertragung verwendet werden.</p><p>Die 8 Paritätsbits werden dann aus dem 64-Bit-Schlüssel entfernt. Somit ist die effektive Schlüssellänge 56 Bit. Diese Operation wurde oft als explizite Schwächung des Algorithmus kritisiert, da die Sinnhaftigkeit der Paritätsbits in Frage gestellt wurde.</p><p>Diese Verkürzung hat dazu geführt, dass bereits im Jahre 1998 die <a class="reference external" href="https://de.wikipedia.org/wiki/Electronic_Frontier_Foundation">EFF</a> einen DES-Schlüssel in weniger als 3 Tagen durch einfachen <em>Brute Force</em> ermitteln konnte. D. h. der Algorithmus an sich wurde nicht gebrochen!</p></ld-supplemental></ld-topic>

Schlüssel</p></th><th class="head"><p>Zeit benötigt bei 10⁹ Entschlüsselungen/s</p></th><th class="head"><p>Zeit benötigt bei 10¹³ Entschlüsselungen/s</p></th></tr></thead><tbody><tr><td><p>56</p></td><td><p>DES</p></td><td><p>2⁵⁶ ≈ 7.2 ⨉ 10¹⁶</p></td><td><p>1.125 Jahre</p></td><td><p>1 Stunde</p></td></tr><tr><td><p>128</p></td><td><p>AES</p></td><td><p>2¹²⁸ ≈ 3.4 ⨉ 10³⁸</p></td><td><p>5.3 ⨉ 10²¹ Jahre</p></td><td><p>5.3 ⨉ 10¹⁷ Jahre</p></td></tr><tr><td><p>168</p></td><td><p>Triple DES</p></td><td><p>2¹⁶⁸ ≈ 3.7 ⨉ 10⁵⁰</p></td><td><p>5.8 ⨉ 10³³ Jahre</p></td><td><p>5.8 × 10²⁹ Jahre</p></td></tr><tr><td><p>192</p></td><td><p>AES</p></td><td><p>2¹⁹² ≈ 6.3 ⨉ 10⁵⁷</p></td><td><p>2¹⁹¹ ns = 9.8 ⨉ 10⁴⁰ Jahre</p></td><td><p>9.8 ⨉ 10³⁶ Jahre</p></td></tr><tr><td><p>256</p></td><td><p>AES</p></td><td><p>2²⁵⁶ ≈ 1.2 ⨉ 10⁷⁷</p></td><td><p>2²⁵⁵ ns = 1.8 ⨉ 10⁶⁰ Jahre</p></td><td><p>1.8 ⨉ 10⁵⁶ Jahre</p></td></tr><tr><td><p>26 Zeichen (Permutation)</p></td><td><p>Mono-alphabetisch</p></td><td><p>26! = 4 ⨉ 10²⁶</p></td><td><p>6.3 ⨉ 10⁹ Jahre</p></td><td><p>6.3 × 10⁶ Jahre</p></td></tr></tbody></table></ld-topic>
<ld-topic id="starke-von-des-timing-angriffe"><h2>Stärke von DES - Timing-Angriffe</h2><ul class="incremental-list simple"><li><p>Ein Verfahren, bei dem Informationen über den Schlüssel oder den Klartext gewonnen werden, indem beobachtet wird, wie lange eine bestimmte Implementierung für die Entschlüsselung verschiedener Chiffretexte benötigt.</p></li><li><p>Dabei wird die Tatsache ausgenutzt, dass ein Verschlüsselungs- oder Entschlüsselungsalgorithmus für verschiedene Eingaben oft leicht unterschiedliche Zeit benötigt.</p></li><li><p>Bislang scheint es unwahrscheinlich, dass diese Technik jemals gegen DES oder leistungsfähigere symmetrische Chiffren wie Triple DES und AES erfolgreich sein wird.</p></li></ul></ld-topic>
<ld-topic id="entwurfsprinzipien-fur-blockchiffren-anzahl-der-runden"><h2>Entwurfsprinzipien für Blockchiffren - Anzahl der Runden</h2><ul class="incremental-list simple"><li><p>Je größer die Anzahl der Runden ist, desto schwieriger ist es, eine Kryptoanalyse durchzuführen.</p></li><li><p>Im Allgemeinen sollte das Kriterium sein, dass die Anzahl der Runden so gewählt wird, dass bekannte kryptoanalytische Bemühungen mehr Aufwand erfordern als ein einfacher Brute-Force-Schlüsselsuchangriff.</p></li><li><p>Hätte DES 15 oder weniger Runden, würde die differentielle Kryptoanalyse weniger Aufwand erfordern als eine Brute-Force-Schlüsselsuche.</p></li></ul></ld-topic>
<ld-topic id="entwurfsprinzipien-fur-blockchiffren-funktion-f"><h2>Entwurfsprinzipien für Blockchiffren - Funktion F</h2><ul class="incremental-list simple"><li><p>Das Herzstück einer Feistel-Blockchiffre ist die Funktion F.</p></li><li><p>Je nichtlinearer F ist, desto schwieriger wird jede Art von Kryptoanalyse sein.</p></li><li><p>Der Algorithmus sollte einen großen Lawineneffekt (<span class="eng">Avalanche-Property</span>) haben.</p></li></ul><aside class="admonition incremental" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Strict Avalanche Criterion (SAC)</span></p><p>Besagt, dass sich jedes Ausgangsbit j einer S-Box mit der Wahrscheinlichkeit 1/2 ändern sollte, wenn ein einzelnes Eingangsbit i invertiert wird und dies für alle Paare i, j gelten muss.</p></aside><aside class="admonition incremental" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Bit Independence Criterion (BIC)</span></p><p>Besagt, dass sich die Ausgangsbits j und k unabhängig voneinander ändern sollten, wenn ein einzelnes Eingangsbit i invertiert wird und dies für alle i, j und k gelten muss.</p></aside><ul class="incremental simple"><li><p>Das Einhalten der SAC- und BIC-Kriterien scheint die Wirksamkeit der Verwirrungsfunktion zu stärken.</p></li></ul></ld-topic>
<ld-topic id="entwurfsprinzipien-fur-blockchiffre-schlusselableitung"><h2>Entwurfsprinzipien für Blockchiffre - Schlüsselableitung</h2><ul class="incremental-list simple"><li><p>Bei jeder Feistel-Blockchiffre wird der Hauptschlüssel verwendet, um einen Unterschlüssel für jede Runde zu erzeugen.</p></li><li><p>Im Allgemeinen möchten wir die Unterschlüssel so wählen, dass die Schwierigkeit, einzelne Unterschlüssel abzuleiten, und die Schwierigkeit, den Hauptschlüssel wieder zurückzuerhalten, maximiert werden.</p></li><li><p>Es wird vorgeschlagen, dass die Schlüsselableitungsfunktion für die Unterschlüssel (<span class="eng">Key Schedule</span>) zumindest das <strong>Strenge Lawinenkriterium</strong> und das <strong>Bit-Unabhängigkeitskriterium</strong> für Schlüssel/Ciphertext garantieren sollte.</p></li></ul></ld-topic>

<ld-topic id="meet-in-the-middle-angriff"><h2><em>Meet-in-the-Middle</em>-Angriff</h2><ld-deck><ld-card><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi><mo stretchy="false">(</mo><msub><mi>K</mi><mn>2</mn></msub><mo separator="true">,</mo><mi>E</mi><mo stretchy="false">(</mo><msub><mi>K</mi><mn>1</mn></msub><mo separator="true">,</mo><mi>P</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo><mo>=</mo><mi>E</mi><mo stretchy="false">(</mo><msub><mi>K</mi><mn>3</mn></msub><mo separator="true">,</mo><mi>P</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">E(K_2,E(K_1,P)) = E(K_3,P)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mclose">))</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mclose">)</span></span></span></span></span> ist nicht gültig.</p><p>D. h. die zweifache Anwendung von DES führt zu einer Abbildung, die im Allgemeinen nicht äquivalent zu einer einfachen DES-Verschlüsselung ist.</p><ld-supplemental><p>D. h. für ein Paar <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>K</mi><mn>1</mn></msub><mo separator="true">,</mo><msub><mi>K</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">K_1, K_2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8778em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> existiert nicht notwendigerweise ein <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi></mrow><annotation encoding="application/x-tex">K</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span></span></span></span></span>, sodass <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>D</mi><mi>E</mi><msub><mi>S</mi><mi>K</mi></msub><mo>=</mo><mi>D</mi><mi>E</mi><msub><mi>S</mi><msub><mi>K</mi><mn>1</mn></msub></msub><mo>∘</mo><mi>D</mi><mi>E</mi><msub><mi>S</mi><msub><mi>K</mi><mn>2</mn></msub></msub></mrow><annotation encoding="application/x-tex">DES_{K} = DES_{K_1} \circ DES_{K_2}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">D</span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0576em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0715em;">K</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.9334em;vertical-align:-0.2501em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">D</span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0576em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3173em;"><span style="top:-2.357em;margin-left:-0.0715em;margin-right:0.0714em;"><span class="pstrut" style="height:2.5em;"></span><span class="katex-sizing reset-size3 size1 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.143em;"><span></span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2501em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">∘</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.9334em;vertical-align:-0.2501em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">D</span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0576em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3173em;"><span style="top:-2.357em;margin-left:-0.0715em;margin-right:0.0714em;"><span class="pstrut" style="height:2.5em;"></span><span class="katex-sizing reset-size3 size1 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.143em;"><span></span></span></span></span></span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2501em;"><span></span></span></span></span></span></span></span></span></span></span> gilt. Die Teilmenge der durch DES erzeugbaren Permutationen ist verschwindend klein (aufgrund der Schlüsselgröße nur <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mn>56</mn></msup></mrow><annotation encoding="application/x-tex">2^{56}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8141em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">56</span></span></span></span></span></span></span></span></span></span></span></span></span> von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>64</mn><mo stretchy="false">!</mo></mrow><annotation encoding="application/x-tex">64!</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord">64</span><span class="mclose">!</span></span></span></span></span> möglichen) und nicht abgeschlossen unter Komposition.</p></ld-supplemental></aside></ld-card><ld-card class="incremental"><p>Der Meet-in-the-Middle-Algorithmus greift dieses Verfahren an. Er hängt nicht von einer bestimmten Eigenschaft von DES ab, sondern funktioniert gegen jede Blockchiffre.</p><ul class="incremental"><li><p>Möglicher Known-Plaintext-Angriff:</p><ol class="arabic incremental-list simple"><li><p>Man berechnet <em>für alle Schlüssel</em> <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>K</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">K_1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> die Chiffretexte <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>E</mi><mo stretchy="false">(</mo><msub><mi>K</mi><mn>1</mn></msub><mo separator="true">,</mo><mi>P</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">E(K_1,P)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mclose">)</span></span></span></span></span> und speichert diese.</p></li><li><p>Man berechnet <em>für alle Schlüssel</em> <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>K</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">K_2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> die Klartexte <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>D</mi><mo stretchy="false">(</mo><msub><mi>K</mi><mn>2</mn></msub><mo separator="true">,</mo><mi>C</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">D(K_2,C)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">D</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mclose">)</span></span></span></span></span> .</p></li><li><p>Man vergleicht die beiden Ergebnisse und prüft, ob es Übereinstimmungen gibt.</p></li></ol><div class="incremental"><p>Dieser Aufwand ist lediglich doppelt so hoch wie der Aufwand bei einer einfachen Verschlüsselung.</p></div></li></ul></ld-card><ld-card class="incremental"><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Die zweifache Anwendung einer Blockchiffre ist nicht sinnvoll!</p><p>Das Ergebnis ist, dass ein bekannter Klartextangriff gegen Doppel-DES mit einem Aufwand in der Größenordnung von 2⁵⁶ <em>im Durchschnitt</em> erfolgreich ist, verglichen mit <em>durchschnittlich</em> 2⁵⁵ für einen einfachen DES.</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="dreifache-verschlusselung"><h2>Dreifache Verschlüsselung</h2><p><strong>(Z. B. Triple-DES (3DES) mit drei Schlüsseln)</strong></p><object class="light-image align-center" data="drawings/multiple_encryption/triple_encryption.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="triple-des-mit-zwei-schlusseln"><h2>Triple-DES mit zwei Schlüsseln</h2><p>Die offensichtliche Antwort auf den <em>Meet-in-the-middle</em>-Angriff ist die dreifache Verschlüsselung mit drei verschiedenen Schlüsseln.</p><ul class="simple"><li><p>Dies erhöht die Kosten des <em>Meet-in-the-Middle</em>-Angriffs auf 2¹¹², was jenseits dessen liegt, was praktikabel ist.</p></li><li><p>Das hat den Nachteil, dass eine Schlüssellänge von 56 bits ⨉ 3 = 168 bits erforderlich ist, was etwas unhandlich sein kann.</p></li><li><p>Als Alternative schlug Tuchman eine dreifache Verschlüsselungsmethode vor, die nur zwei Schlüssel verwendet.</p></li><li><p>3DES mit zwei Schlüsseln war eine Alternative zu DES und wurde in die Schlüsselverwaltungsstandards ANSI X9.17 und ISO 8732 aufgenommen.</p></li></ul></ld-topic>
<ld-topic id="triple-des-mit-drei-schlusseln"><h2>Triple-DES mit drei Schlüsseln</h2><ul><li><p>Es wurden mehrere Angriffe gegen 3DES mit 2 Schlüsseln entwickelt, die jedoch (noch) nicht praktikabel sind.</p></li><li><p>Viele Forscher sind inzwischen der Meinung, dass 3DES mit drei Schlüsseln die bevorzugte Alternative ist.</p></li><li><p>3DES mit drei Schlüsseln hat eine effektive Schlüssellänge von 168 Bit und ist definiert als:</p><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>C</mi><mo>=</mo><mi>E</mi><mo stretchy="false">(</mo><msub><mi>K</mi><mn>3</mn></msub><mo separator="true">,</mo><mi>D</mi><mo stretchy="false">(</mo><msub><mi>K</mi><mn>2</mn></msub><mo separator="true">,</mo><mi>E</mi><mo stretchy="false">(</mo><msub><mi>K</mi><mn>1</mn></msub><mo separator="true">,</mo><mi>P</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">C=E(K_3,D(K_2,E(K_1, P)))</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">D</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">E</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mclose">)))</span></span></span></span></span></div></li><li><p>Rückwärtskompatibilität mit DES ist gegeben, wenn man <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>K</mi><mn>3</mn></msub><mo>=</mo><msub><mi>K</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">K_3 = K_2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">3</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> oder <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>K</mi><mn>1</mn></msub><mo>=</mo><msub><mi>K</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">K_1 = K_2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0715em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></span> einsetzt.</p></li></ul></ld-topic>
<ld-topic class="exercises transition-scale" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Feistelchiffre Implementieren"><p class="ld-exercise-title rubric"><span>Feistelchiffre Implementieren</span></p><p>Implementieren Sie eine Feistel Chiffre in einer Programmiersprache Ihrer Wahl (z. B. Java, Scala, Python, C, JavaScript ...), die es Ihnen ermöglicht:</p><ul class="simple"><li><p>Nachrichten zu ver- und entschlüsseln</p></li><li><p>Blöcke von 128 Bit zu verschlüsseln</p></li><li><p>die Funktion <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi></mrow><annotation encoding="application/x-tex">f</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span></span></span></span></span> einfach auszutauschen, um die Wirkung von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi></mrow><annotation encoding="application/x-tex">f</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span></span></span></span></span> zu testen</p></li><li><p>Für die Ableitung der Rundenschlüssel können Sie eine Funktion verwenden, die eine Rotation des Schlüssels durchführt (z. B. <a class="reference external" href="https://docs.oracle.com/javase%2F7%2Fdocs%2Fapi%2F%2F/java/lang/Integer.html#rotateLeft(int,%20int))">Integer.rotateLeft</a>).</p></li></ul><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:kILPpE0N6DTn1KxmSB22IQPWD4l2eONFwci/eWXG8r8=:6o01vI3ZgCzir4US:8OaU2PX/C6frp+ocvBg6oUXSKzQQmsdntGUH+SbkakNcCTgj8sqTVOGwZs6vvCuKcSfYRa29GgbX71nT85pNREARlPYtqST8XMyKIOJV+9x9z5IzrdngPu0+lmvIlF7n1xbI9mA1l6raT9DScAmzKm3KssMEViD8h8dY0csv/Nk/wkMRKmPD8gpE8wcxcZ7EVDhFFUFkE3aJYjhOiqx4+bjvOj32pWChjzCedg60Jnz1UWM5TTOZ</div></div><ld-supplemental><p><strong>Hinweise</strong></p><p>Kümmern Sie sich nicht um Nachrichten, die größer oder kleiner als die Blockgröße sind. Dies ist nicht notwendig, um die Auswirkungen von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi></mrow><annotation encoding="application/x-tex">f</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span></span></span></span></span> oder der Verwendung eines Rundenschlüssels zu verstehen. Kümmern Sie sich nicht um einen Schlüssel, der nicht die richtige Größe hat. D. h. verwenden Sie eine Nachricht und einen Schlüssel mit der entsprechenden Größe.</p><p>Um die Austauschbarkeit der Funktion f zu erreichen, können Sie je nach Sprache z. B. native Funktionen höherer Ordnung, einen Funktionszeiger oder ein Interface verwenden.</p></ld-supplemental></ld-topic>
<ld-topic class="exercises" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Feistelchiffre Evaluieren"><p class="ld-exercise-title rubric"><span>Feistelchiffre Evaluieren</span></p><ol class="arabic simple"><li><p>Was passiert, wenn f nur 0x00-Werte zurückgibt (unabhängig vom Rundenschlüssel)?</p></li><li><p>Was passiert, wenn f nur 0x01-Werte zurückgibt (unabhängig vom Rundenschlüssel)?</p></li><li><p>Was passiert, wenn f einfach ein <em>xor</em> der entsprechende Hälfte mit dem Ergebnis der Verschiebung des Schlüssels durchführt?</p></li><li><p>Was passiert, wenn man eine Nachricht ändert? Testen Sie insbesondere, was passiert wenn die Nachricht nur aus 0x00 besteht (und Sie eine „vernünftigere“ f-Funktion verwenden.)</p></li><li><p>Was passiert, wenn man den Schlüssel ändert? Was passiert in extremen Fällen (z. B. wenn das Passwort nur aus "0" besteht)?</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:Wk3X+ywW8DxMU31ojdpLFJ4is4RI/UVBqexv45pPWz0=:GRDBW9kZJXSSEUQD:qsaGHdlY17lDWo8jqhbBV476edDH9qXXArI8U6CWJVeCxmGpS4PlgxhRjxfqa0raY4PHfsU+5xanUatc71M2mvwsdquN5mCkOjTH+cQqGPr/wbr+6OZk2GSMtMDcAx+OsVcQlVxwmqeCB50dDY8Ab1PZBz+Nm7/pFbo+uPoSaIEXT3BAAy8TcFfh3DnmiJ8h/YAtQc36Oda3gMwd3qBDi4ZbYrinWl+JOuOZAWjsszxUOLPj5kQHDDOglFBh4vMgi5qnqv+b4CFw5hGrsoF2Jdaud+eYZTSP/MY0ILrTgIpSQ+0cIZU4jpAnq9cooRQ7+XV7GeuJzcVVc1Nv97wrJQqyL+NAF+X9brAtPJXiWH9XqeViH9hM/ClPCWt/BgW9c/4lgyrj1VUIXs9CkWphxZXdKOOyzqUWGeUDOtNAG7IYdFLij7Kx1558QZd3UQuIZOJoASahKUazt28Kast+hmi/7evHe8ONcn5JzVfBdU5wK+uaKAbXuHdThfWEQ5VMH3z6o51A0ucG23hWL2NadTCrSceV0Iu1MTOWel36lQaio7DcKrLwshcrGm7gH1pILp+nDmpZRv/kioCTOKcCGF1oNm8Yi44dv831Eg7qBS1DIY7I/GY/aFR7VNouXd7Pge911ZNg9vQ96JXncNDQWpIxarYBr3fOIOMLbOEIEUMXdEzcX7DvvOreGi6bGfU5DqmqggkZUXZ5nwly6Fv1tTG5TJLQfP3EeCaS4NJNPhKgCUep8TN/1/sh7t/p0bPSwXByEGewH2hX9YLZodMUp7PAk9G2DyJ2xcrAtY8tfSHksd20uscYWqLaZFlmO28Ej9fOIJ2DpbqzRMoiJk6KEl2jQTwFV7UFhbLgxCOOotyCIDcxHS4jolc4h0ZZFAYODj1reRP+EG2lcCApceZ5vJALTohu
