<ld-topic class="repetition" id="ip"><h2>IP</h2><p>Die Vermittlungsschicht (Internet Layer)</p><ul class="simple"><li><p>übernimmt das Routing</p></li><li><p>realisiert Ende-zu-Ende-Kommunikation</p></li><li><p>überträgt Pakete</p></li><li><p>ist im Internet durch IP realisiert</p></li><li><p>löst folgende Probleme:</p><ul class="simple"><li><p>Sender und Empfänger erhalten netzweit eindeutige Bezeichner (⇒ IP-Adressen)</p></li><li><p>die Pakete werden durch spezielle Geräte (⇒ Router) weitergeleitet</p></li></ul></li></ul></ld-topic>
<ld-topic class="repetition" id="tcp-und-udp"><h2>TCP und UDP</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">Transmission Control Protocol (TCP), RFC 793</p><ul class="simple"><li><p>verbindungsorientierte Kommunikation</p></li><li><p>ebenfalls Konzept der Ports</p></li><li><p>Verbindungsaufbau zwischen zwei Prozessen (Dreifacher Handshake, Full-Duplex-Kommunikation)</p><ul class="simple"><li><p>geordnete Kommunikation</p></li><li><p>zuverlässige Kommunikation</p></li><li><p>Flusskontrolle</p></li><li><p>hoher Overhead ⇒ eher langsam</p></li><li><p>nur Unicasts</p></li></ul></li></ul></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">User Datagram Protocol (UDP), RFC 768</p><ul class="simple"><li><p>verbindungslose Kommunikation</p><ul class="simple"><li><p>unzuverlässig ⇒ keine Fehlerkontrolle</p></li><li><p>ungeordnet ⇒ beliebige Reihenfolge</p></li><li><p>wenig Overhead ⇒ schnell</p></li></ul></li><li><p>Größe der Nutzdaten ist 65507 Byte</p></li><li><p>Anwendungsfelder:</p><ul class="simple"><li><p>Anw. mit vorwiegend kurzen Nachrichten (z. B. NTP, RPC, NIS)</p></li><li><p>Anw. mit hohem Durchsatz, die gel. Fehler tolerieren (z. B. Multimedia)</p></li><li><p>Multicasts sowie Broadcasts</p></li></ul></li></ul></ld-cell></ld-grid><ld-supplemental><p>UDP nutzt für die Kommunikation "Datagramme" (Pakete). In der Praxis sin die Nutzdaten meist deutlich kleiner und orientieren sich an der Größe für IP-Pakete.</p></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-scale" id="hypertext-transfer-protocol-http"><h2>Hypertext Transfer Protocol (HTTP)</h2></ld-topic>
<ld-topic id="http"><h2>HTTP</h2><ul class="simple"><li><p><a class="reference external" href="http://www.ietf.org/rfc/rfc7230.txt">RFC 7230</a> – 7235: HTTP/1.1 (redigiert im Jahr 2014; urspr. 1999 RFC 2626)</p></li><li><p>RFC 7540: HTTP/2 (seit Mai 2015 standardisiert)</p></li><li><p>Eigenschaften:</p><ul class="simple"><li><p>Client / Server (Browser / Web-Server)</p></li><li><p>basierend auf TCP, i. d. R. Port 80</p></li><li><p>Server (meist) zustandslos</p></li><li><p>seit HTTP/1.1 auch persistente Verbindungen und Pipelining</p></li><li><p>abgesicherte Übertragung (Verschlüsselung) möglich mittels Secure Socket Layer (SSL) bzw. Transport Layer Security (TLS)</p></li></ul></li></ul></ld-topic>
<ld-topic id="konzeptioneller-ablauf"><h2>Konzeptioneller Ablauf</h2><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><object class="align-center" data="images/http/http.svg" type="image/svg+xml" role="img"></object></ld-cell><ld-cell style="align-self:auto;"><p class="rubric">HTTP-Kommandos</p><p>(„Verben“)</p><ul class="simple"><li><p>HEAD</p></li><li><p>GET</p></li><li><p>POST</p></li><li><p>PUT</p></li><li><p>PATCH</p></li><li><p>DELETE</p></li><li><p>OPTIONS</p></li><li><p>TRACE</p></li><li><p>CONNECT</p></li><li><p>...</p></li></ul></ld-cell></ld-grid></ld-topic>
<ld-topic id="protokolldefinition"><h2>Protokolldefinition</h2><p>Aufbau der Dokumentenbezeichner <em>Uniform Resource Locator (URL)</em></p><div class="accentuate"><p><span class="docutils literal">scheme://host[:port][abs_path[?query][#anchor]]</span></p></div><ld-deck><ld-card><dl class="field-list simple"><dt><span class="docutils literal">scheme</span><span class="colon">:</span></dt><dd><p>Protokoll (case-insensitive) (z. B. <span class="docutils literal">http</span>, <span class="docutils literal">https</span> oder <span class="docutils literal">ftp</span>)</p></dd><dt><span class="docutils literal">host</span><span class="colon">:</span></dt><dd><p>DNS-Name (oder IP-Adresse) des Servers (case-insensitive)</p></dd><dt><span class="docutils literal">port</span><span class="colon">:</span></dt><dd><p>(optional) falls leer, 80 bei <span class="docutils literal">http</span> und 443 bei <span class="docutils literal">https</span></p></dd><dt><span class="docutils literal">abs_path</span><span class="colon">:</span></dt><dd><p>(optional) Pfadausdruck relativ zum Server-Root (case-sensitive)</p></dd><dt><span class="docutils literal">?query</span><span class="colon">:</span></dt><dd><p>(optional) direkte Parameterübergabe (case-sensitive) (<span class="docutils literal">?from=…&#x26;to=…</span>)</p></dd><dt><span class="docutils literal">#anchor</span><span class="colon">:</span></dt><dd><p>(optional) Sprungmarke innerhalb des Dokuments</p></dd></dl></ld-card><ld-card class="incremental"><p>Uniform Resource Identifier (URI) sind eine Verallgemeinerung von URLs.</p><ul><li><p>definiert in RFC 1630 (im Jahr 1994)</p></li><li><p>entweder URL (Location) oder URN (Name) (z. B. <span class="docutils literal">urn:isbn:1234567890</span>)</p></li><li><p>Beispiele von URIs, die keine URL sind, sind <em>XML Namespace Iidentifiers</em></p><pre class="code XML literal-block"><code><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>svg</span> <span class="name attribute">version</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>1.1<span class="punctuation">"</span></span> <span class="name attribute">xmlns</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>http://www.w3.org/2000/svg<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>...<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>svg</span><span class="punctuation">&gt;</span></span></code></pre></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="das-get-kommando"><h2>Das GET Kommando</h2><ld-deck><ld-card><ul><li><p>Dient dem Anfordern von HTML-Daten vom Server (Request-Methode).</p></li><li><p>Minimale Anfrage:</p><dl class="field-list"><dt>Anfrage<span class="colon">:</span></dt><dd><pre class="code http literal-block"><small class="ln">1</small><code data-lineno="1">GET &lt;Path&gt; HTTP/1.1
</code><small class="ln">2</small><code data-lineno="2">Host<span class="punctuation">:</span> &lt;Hostname&gt;
</code><small class="ln">3</small><code data-lineno="3">Connection<span class="punctuation">:</span> close
</code><small class="ln">4</small><code data-lineno="4">&lt;Leerzeile (CRLF)&gt;</code></pre></dd><dt>Optionen<span class="colon">:</span></dt><dd><ul class="simple"><li><p>Client kann zusätzlich weitere Infos über die Anfrage sowie sich selbst senden.</p></li><li><p>Server sendet Status der Anfrage sowie Infos über sich selbst und ggf. die angeforderte HTML-Datei.</p></li></ul></dd></dl></li><li><p>Fehlermeldungen werden ggf. vom Server ebenfalls als HTML-Daten verpackt und als Antwort gesendet.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Beispiel Anfrage des Clients</p><pre class="code http literal-block"><small class="ln">1</small><code data-lineno="1">GET /web/web.php HTTP/1.1
</code><small class="ln">2</small><code data-lineno="2">Host<span class="punctuation">:</span> archive.org
</code><small class="ln">3</small><code data-lineno="3">**CRLF**</code></pre><p class="rubric">Beispiel Antwort des Servers</p><pre class="code http literal-block"><small class="ln"> 1</small><code data-lineno=" 1">HTTP/1.1 200 OK
</code><small class="ln"> 2</small><code data-lineno=" 2">Server<span class="punctuation">:</span> nginx/1.25.1
</code><small class="ln"> 3</small><code data-lineno=" 3">Date<span class="punctuation">:</span> Thu, 22 Feb 2024 19:47:11 GMT
</code><small class="ln"> 4</small><code data-lineno=" 4">Content-Type<span class="punctuation">:</span> text/html; charset=UTF-8
</code><small class="ln"> 5</small><code data-lineno=" 5">Transfer-Encoding<span class="punctuation">:</span> chunked
</code><small class="ln"> 6</small><code data-lineno=" 6">Connection<span class="punctuation">:</span> close
</code><small class="ln"> 7</small><code data-lineno=" 7">**CRLF**
</code><small class="ln"> 8</small><code data-lineno=" 8">&lt;!DOCTYPE html&gt;
</code><small class="ln"> 9</small><code data-lineno=" 9">…
</code><small class="ln">10</small><code data-lineno="10">&lt;/html&gt;**CRLF**</code></pre></ld-card></ld-deck></ld-topic>
<ld-topic class="new-section transition-scale" id="sockets"><h2>Sockets</h2></ld-topic>
<ld-topic id="sockets-in-python"><h2>Sockets in Python</h2><p><strong>Sockets sind Kommunikationsendpunkte.</strong></p><ul><li><p>Sockets werden adressiert über die IP-Adresse (InetAddress-Objekt) und eine interne Port-Nummer (int-Wert).</p></li><li><p>Sockets gibt es bei TCP und auch bei UDP, allerdings mit unterschiedlichen Eigenschaften:</p><dl class="field-list simple"><dt>TCP<span class="colon">:</span></dt><dd><p>verbindungsorientierte Kommunikation über <em>Streams</em></p></dd><dt>UDP<span class="colon">:</span></dt><dd><p>verbindungslose Kommunikation mittels <em>Datagrams</em></p></dd></dl></li><li><p>Das Empfangen von Daten ist in jedem Fall blockierend, d. h. der empfangende Thread bzw. Prozess wartet, falls keine Daten vorliegen.</p></li></ul></ld-topic>
<ld-topic id="tcp-sockets"><h2>TCP Sockets</h2><object class="align-center" data="images/http/tcp_sockets.svg" type="image/svg+xml" role="img"></object><ld-supplemental><ol class="arabic simple"><li><p>Der Server-Prozess wartet an dem bekannten Server-Port.</p></li><li><p>Der Client-Prozess erzeugt einen privaten Socket.</p></li><li><p>Der Socket baut zum Server-Prozess eine Verbindung auf – falls der Server die Verbindung akzeptiert.</p></li><li><p>Die Kommunikation erfolgt Strom-orientiert: Für beide Parteien wird je ein Eingabestrom und ein Ausgabestrom eingerichtet, über den nun Daten ausgetauscht werden können.</p></li><li><p>Wenn alle Daten ausgetauscht wurden, schließen im Allg. beide Parteien die Verbindung.</p></li></ol></ld-supplemental></ld-topic>

</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">import</span> socket
</code><small class="ln"> 3</small><code data-lineno=" 3">

</code><small class="ln"> 5</small><code data-lineno=" 5">  <span class="keyword">try</span><span class="punctuation">:</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="keyword">with</span> socket<span class="punctuation">.</span>socket<span class="punctuation">(</span>socket<span class="punctuation">.</span>AF_INET<span class="punctuation">,</span> socket<span class="punctuation">.</span>SOCK_STREAM<span class="punctuation">)</span> <span class="keyword">as</span> s<span class="punctuation">:</span>

</code><small class="ln">14</small><code data-lineno="14">  host <span class="operator">=</span> <span class="literal string">"localhost"</span>

<ld-topic id="austausch-von-daten"><h2>Austausch von Daten</h2><ul class="simple"><li><p>Nach erfolgtem Verbindungsaufbau können zwischen Client und Server mittels <code class="python">sendall</code> und <code class="python">recv</code> Daten ausgetauscht werden.</p></li></ul><ul class="incremental list-with-explanations"><li><p>Wir können blockierend auf Daten warten bzw. blockierend schreiben, indem wir <code class="python">recv</code> bzw. <code class="python">sendall</code> aufrufen. (Siehe nächstes Beispiel.)</p><p>Sollte die Verbindung abbrechen oder die Gegenseite nicht antworten, kann es „relativ lange dauern“, bis dieser Fehler erkannt bzw. gemeldet wird.</p></li><li><p>Wir können den Socket auch in den nicht-blockierenden Modus versetzen, indem wir <code class="python">setblocking<span class="punctuation">(</span><span class="keyword constant">False</span><span class="punctuation">)</span></code> aufrufen (ggf. sinnvoll).</p></li></ul></ld-topic>
<ld-topic id="ein-einfacher-echo-dienst"><h2>Ein einfacher Echo-Dienst</h2><ld-deck><ld-card><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="comment single"># Client</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">import</span> socket
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">def</span> <span class="name function">receive_all</span><span class="punctuation">(</span>conn<span class="punctuation">,</span> chunk_size<span class="operator">=</span><span class="literal number integer">1024</span><span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    data <span class="operator">=</span> <span class="literal string">b''</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="keyword">while</span> <span class="keyword constant">True</span><span class="punctuation">:</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        part <span class="operator">=</span> conn<span class="punctuation">.</span>recv<span class="punctuation">(</span>chunk_size<span class="punctuation">)</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">        data <span class="operator">+=</span> part
</code><small class="ln"> 8</small><code data-lineno=" 8">        <span class="keyword">if</span> <span class="name builtin">len</span><span class="punctuation">(</span>part<span class="punctuation">)</span> <span class="operator">==</span> <span class="literal number integer">0</span><span class="punctuation">:</span> <span class="keyword">break</span> <span class="comment single"># no more data</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="keyword">return</span> data
</code><small class="ln">10</small><code data-lineno="10">
</code><small class="ln">11</small><code data-lineno="11"><span class="keyword">while</span> <span class="keyword constant">True</span><span class="punctuation">:</span>
</code><small class="ln">12</small><code data-lineno="12">    the_line <span class="operator">=</span> <span class="name builtin">input</span><span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">13</small><code data-lineno="13">    <span class="keyword">if</span> the_line <span class="operator">==</span> <span class="literal string">"."</span><span class="punctuation">:</span> <span class="keyword">break</span>
</code><small class="ln">14</small><code data-lineno="14">    <span class="keyword">with</span> socket<span class="punctuation">.</span>socket<span class="punctuation">(</span>socket<span class="punctuation">.</span>AF_INET<span class="punctuation">,</span> socket<span class="punctuation">.</span>SOCK_STREAM<span class="punctuation">)</span> <span class="keyword">as</span> s<span class="punctuation">:</span>
</code><small class="ln">15</small><code data-lineno="15">        s<span class="punctuation">.</span>connect<span class="punctuation">(</span><span class="punctuation">(</span><span class="literal string">"localhost"</span><span class="punctuation">,</span> <span class="literal number integer">5678</span><span class="punctuation">)</span><span class="punctuation">)</span>  <span class="comment single"># Connect to localhost on port 5678</span>
</code><small class="ln">16</small><code data-lineno="16">        s<span class="punctuation">.</span>sendall<span class="punctuation">(</span>the_line<span class="punctuation">.</span>encode<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span>
</code><small class="ln">17</small><code data-lineno="17">        data <span class="operator">=</span> receive_all<span class="punctuation">(</span>s<span class="punctuation">)</span>
</code><small class="ln">18</small><code data-lineno="18">    <span class="keyword">print</span><span class="punctuation">(</span>data<span class="punctuation">.</span>decode<span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">)</span></code></pre></ld-card><ld-card class="incremental"><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="comment single"># Server</span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="keyword">import</span> socket
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="keyword">def</span> <span class="name function">receive_all</span><span class="punctuation">(</span>conn<span class="punctuation">,</span> chunk_size<span class="operator">=</span><span class="literal number integer">1024</span><span class="punctuation">)</span><span class="punctuation">:</span> <span class="comment single"># see previous example</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5"><span class="keyword">with</span> socket<span class="punctuation">.</span>socket<span class="punctuation">(</span>socket<span class="punctuation">.</span>AF_INET<span class="punctuation">,</span> socket<span class="punctuation">.</span>SOCK_STREAM<span class="punctuation">)</span> <span class="keyword">as</span> server<span class="punctuation">:</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">  server<span class="punctuation">.</span>bind<span class="punctuation">(</span><span class="punctuation">(</span><span class="literal string">"localhost"</span><span class="punctuation">,</span> <span class="literal number integer">5678</span><span class="punctuation">)</span><span class="punctuation">)</span> <span class="comment single"># Bind to localhost on port 5678</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">  server<span class="punctuation">.</span>listen<span class="punctuation">(</span><span class="literal number integer">1</span><span class="punctuation">)</span> <span class="comment single"># queue at most one connection at a time</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">  <span class="keyword">while</span> <span class="keyword constant">True</span><span class="punctuation">:</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">      conn<span class="punctuation">,</span> addr <span class="operator">=</span> server<span class="punctuation">.</span>accept<span class="punctuation">(</span><span class="punctuation">)</span>
</code><small class="ln">10</small><code data-lineno="10">      <span class="keyword">with</span> conn<span class="punctuation">:</span>
</code><small class="ln">11</small><code data-lineno="11">          <span class="keyword">print</span><span class="punctuation">(</span><span class="literal string">f"Connection from </span><span class="punctuation">{</span>addr<span class="punctuation">}</span><span class="literal string">."</span><span class="punctuation">)</span>
</code><small class="ln">12</small><code data-lineno="12">          data <span class="operator">=</span> receive_all<span class="punctuation">(</span>conn<span class="punctuation">,</span> <span class="literal number integer">1024</span><span class="punctuation">)</span>
</code><small class="ln">13</small><code data-lineno="13">          <span class="keyword">print</span><span class="punctuation">(</span><span class="literal string">f"Received </span><span class="punctuation">{</span>data<span class="punctuation">}</span><span class="literal string">."</span><span class="punctuation">)</span>
</code><small class="ln">14</small><code data-lineno="14">          <span class="keyword">if</span> data<span class="punctuation">:</span>
</code><small class="ln">15</small><code data-lineno="15">              conn<span class="punctuation">.</span>sendall<span class="punctuation">(</span>data<span class="punctuation">)</span></code></pre></ld-card><ld-card class="incremental"><ul><li><p>Python erlaubt es Sockets zu Wrappen, um sie wie Dateien behandeln zu können.</p><p><code class="python"><span class="operator">&lt;</span>Socket<span class="operator">&gt;</span><span class="punctuation">.</span>makefile<span class="punctuation">(</span>mode<span class="operator">=</span><span class="literal string">"r?w?b?"</span> <span class="punctuation">[</span><span class="punctuation">,</span> encoding<span class="operator">=</span><span class="literal string">"utf-8"</span><span class="punctuation">]</span><span class="punctuation">)</span></code> erzeugt ein Dateiobjekt, das (insbesondere) <span class="docutils literal">readline()</span> und <span class="docutils literal">write()</span> unterstützt. Dies kann insbesondere bei zeilenorientierter Kommunikation hilfreich sein.</p></li><li><p>Es können auch ganze Dateien über Sockets basierend  übertragen werden (<code class="python"><span class="operator">&lt;</span>Socket<span class="operator">&gt;</span><span class="punctuation">.</span>sendfile<span class="punctuation">(</span><span class="operator">&lt;</span>File<span class="operator">&gt;</span><span class="punctuation">)</span></code>).</p></li></ul><aside class="admonition incremental" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Einige Methoden sind nur auf spezifischen Betriebssystemen (meist Unix) verfügbar.</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="udp-sockets"><h2>UDP Sockets</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">Clientseitig</p><ol class="arabic simple"><li><p><em>Datagram-Socket</em> erzeugen und an Zieladresse binden</p></li><li><p>Nachricht erzeugen (ggf. vorher maximale Länge prüfen)</p></li><li><p><em>Datagram</em> absenden</p></li><li><p>ggf. Antwort empfangen und verarbeiten</p></li></ol></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">Serverseitig</p><ol class="arabic list-with-explanations"><li><p><em>Datagram-Socket</em> auf festem Port erzeugen</p><p>(Die Hostangabe bestimmt wer sich mit dem Socket verbinden darf; <span class="docutils literal">localhost</span> bedeutet nur lokale Verbindungen sind erlaubt.)</p></li><li><p>Endlosschleife beginnen</p></li><li><p><em>Datagram</em> empfangen (und verarbeiten)</p></li><li><p>ggf. Antwort erstellen und absenden</p></li></ol></ld-cell></ld-grid></ld-topic>
<ld-topic id="udp-basierter-echo-server"><h2>UDP basierter Echo Server</h2><pre class="code python copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">import</span> socket
</code><small class="ln"> 2</small><code data-lineno=" 2">
</code><small class="ln"> 3</small><code data-lineno=" 3">HOST <span class="operator">=</span> <span class="literal string">"localhost"</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">PORT <span class="operator">=</span> <span class="literal number integer">5678</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">
</code><small class="ln"> 6</small><code data-lineno=" 6"><span class="keyword">with</span> socket<span class="punctuation">.</span>socket<span class="punctuation">(</span>socket<span class="punctuation">.</span>AF_INET<span class="punctuation">,</span> socket<span class="punctuation">.</span>SOCK_DGRAM<span class="punctuation">)</span> <span class="keyword">as</span> server<span class="punctuation">:</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    server<span class="punctuation">.</span>bind<span class="punctuation">(</span><span class="punctuation">(</span>HOST<span class="punctuation">,</span> PORT<span class="punctuation">)</span><span class="punctuation">)</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="keyword">while</span> <span class="keyword constant">True</span><span class="punctuation">:</span>
</code><small class="ln">10</small><code data-lineno="10">        data<span class="punctuation">,</span> addr <span class="operator">=</span> server<span class="punctuation">.</span>recvfrom<span class="punctuation">(</span><span class="literal number integer">65507</span><span class="punctuation">)</span>  <span class="comment single"># buffer size is 65507 bytes</span>
</code><small class="ln">11</small><code data-lineno="11">        <span class="keyword">print</span><span class="punctuation">(</span><span class="literal string">f"received message: </span><span class="punctuation">{</span>data<span class="punctuation">}</span><span class="literal string"> from: </span><span class="punctuation">{</span>addr<span class="punctuation">}</span><span class="literal string">"</span><span class="punctuation">)</span>
</code><small class="ln">12</small><code data-lineno="12">        server<span class="punctuation">.</span>sendto<span class="punctuation">(</span>data<span class="punctuation">,</span> addr<span class="punctuation">)</span></code></pre></ld-topic>
<ld-topic class="exercises transition-fade" id="ubung"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Ein einfacher HTTP-Client"><p class="ld-exercise-title rubric"><span>Ein einfacher HTTP-Client</span></p><ol class="loweralpha list-with-explanations smaller"><li><p>Schreiben Sie einen HTTP-Client, der den Server <span class="docutils literal">www.michael-eichberg.de</span> kontaktiert, die Datei <span class="docutils literal">/index.html</span> anfordert und die Antwort des Servers auf dem Bildschirm ausgibt.</p><p>Verwenden Sie HTTP/1.1 und eine Struktur ähnlich dem in der Vorlesung vorgestellten Echo-Client.</p><p>Senden Sie das GET-Kommando, die Host-Zeile sowie eine Leerzeile als Strings an den Server.</p></li><li><p>Erweitern Sie Ihren Client um die Fähigkeit URLs auf der Kommandozeile anzugeben.</p><p>Verwenden Sie existierende Funktionalität, um die angegebene URL zu zerlegen (<span class="docutils literal">urlparse von urllib.parse</span>).</p></li><li><p>Speichern Sie die Antwort des Servers in einer lokalen Datei. Prüfen Sie, dass die Datei in einem Browser korrekt angezeigt wird.</p><p>Kann Ihr Programm auch Bilddateien (z. B. "<a class="reference external" href="http://www.michael-eichberg.de/acm.svg">http://www.michael-eichberg.de/acm.svg</a>") korrekt speichern? Falls nicht, prüfen Sie ob Sie Antwort des Servers richtig verarbeiten; analysieren Sie ggf. den Header und passen Sie Ihr Programm entsprechend an.</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:9lvYunP27juX+yzKwCwt67wXSKduV97ucerkYYIkdGs=:qZDSB1PeEzi5/tqx:OTtYTMQdxMyRbfVLddp7sWYHFrq20KRxH1/pfRDo867igsAdwfmnhn9NZdLrd1pwjp9Vr/bGC9JHYD5HheyWnOoHFa1XOO8+yxWJ/lDb80Df5CBXY9+75ZNWaUwIM9gFEOrL239CgmMhZ0p1jh+LpBr9osEWk+wp1WGy3NUO557+4zVdHzauF/HdzJbz9vKJ8cs3BksVNuSKpmRGnpfeGjU5KnFBtjufZTbelnWfHSx/6K8ILiCibT9N+87AWpbBbHKM/ESr4KvqmK6ur4Ky71iwVxb/YZOMutCVImP4u6MvxVZxGlC4hM94VitSGK1IRd3qaoVkIi+EkXIMTXWreLMKkymO1vguzyG <ld-topic class="exercises" id="ubung-1"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Protokollaggregation"><p class="ld-exercise-title rubric"><span>Protokollaggregation</span></p><p>Schreiben Sie einen Python basierten Server und Client, mit dem sich Protokoll-Meldungen auf einem Server zentral anzeigen lassen. Das Programm soll mehrere Clients unterstützen und UDP verwenden. Jeder Client liest von der Tastatur eine Eingabezeile in Form eines Strings ein, validiert die Eingabe und sendet diese dann ggf. sofort zum Server. Der Server wartet auf Port 5678 und empfängt die Meldungen beliebiger Clients, die er dann unmittelbar ausgibt.</p><p>Stellen Sie sicher, dass Fehler adäquat behandelt werden.</p><p>Sie können den UDP basierten Echo Server als Vorlage für Ihren Server verwenden.</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:G7+Kx2rRUE8UpDHZiMfklO7XAZd+bqEt40h4Is1abGw=:5mTGwqn5e+SVjPl8:8Jt7ceeQ3ofKsw4jq+abZtvEKpg1zbNRAlEW/C5hKbK8Bb4zOlCSjTjzjaycO/qnOyL9TR0rNHeLyZzv4QmGo29ePORZCvDLhTsLi51PGwLQ8hcEAtL/MJwLGJlce+7Bc7zHsXphXMkWnxnCZu5J7ILlX+LsapjYhHeto8BxRPW+xpBIOA51vkNgrwegibKPMaucPxOcHTyu/hspXTK7ESHF/VhiSMgg9E0P0Tex83/wpwcfkWVeiaOCoyhGZ3H717t211bP5tYOsE08jOqRctHdVAULt+SH8j1Fkcd2zsuQG+wINLyU8SNLvumIHA3hLkmHq8O1v3yh5j4Gtn4jR5LmfDaOggl7bHiYbcinhIx/BnBjzXzzD4cNb87Yi3Wl2qKiEpe+DDFqGG+WWRwD30zksvyq8ZyMWXEn9pDprCtPKoeOokZZHODD25fQeTrnxFbGEFZpW01BOH9uSMMdnq2cThO44szip/QMpF0RekF1c5s2sC5oVl5XTYQcHSbmYpyGSUx/Os3BReq5DK7rcjTEivWQ882bH/d8uElC5/a9JzQWE/2jHpPBBRdrALRmQ4V7nKV0IsHXre/+4ULMA3laf2RZDAKi9rnhLevhAjrT1JUGwaKnwWGdwTAECPmDLBcTKzNBXsRYUjT8uQ+Jd0sC6ph2YcBeg+VAF6YHTaD7uCb3Z5xU4F5CA0jL6ntOY3J1/L0zI9/1cKkrxF90yMI6UrlHLzRciiNzPY3hOmiRxb74wvhWopALocFVmAZQmaadrOjvrvWFiAKZ5NIOeKi5Q7MNVeyZ804KXl6pN+wfhXMpbYTnzyEQqB4q9Ihi/IbPF7+Gc5usN9F5tv8gY/TgIvDym2wbxkM8SzOe8e/l0PZXv+8WI5pMrS+Pd3QqLWyQv9aURrsHnFCQAIqi+1WZjbW15T72DK5jH5/ZDJiB0St9Ilx6hXjtKsaF1wa4J5gE+2GASwjSiREsuIh0bJV6NasAhI2OWq85aiVFKCsiuhz82ZtqtpCBMD
