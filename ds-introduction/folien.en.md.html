<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>

<ld-topic class="new-section transition-fade" id="distributed-systems-definition-and-properties"><h2>Distributed Systems - Definition and Properties</h2></ld-topic>
<ld-topic id="distributed-vs-decentralized"><h2>Distributed vs. Decentralized</h2><object class="light-image align-center" data="drawings/distributed-vs-decentralized.svg" type="image/svg+xml" role="img" width="100%"></object><ld-supplemental><aside class="admonition admonition-two-views-on-the-implementation-of-distributed-systems"><p class="admonition-title">Two views on the implementation of distributed systems</p><ul class="simple"><li><p><strong>Integrative view</strong>: Connection of existing (locally) networked computer systems to form a larger system.</p></li><li><p><strong>Expansive view</strong>: an existing networked computer system is expanded to include additional computers.</p></li></ul></aside><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><ul class="simple"><li><p>A <strong>decentralised system</strong> is a networked computer system in which processes and resources are <em>necessarily</em> distributed across multiple computers.</p></li><li><p>A <strong>distributed system</strong> is a networked computer system in which processes and resources are <em>sufficiently</em> distributed across several computers.</p></li></ul></aside></ld-supplemental></ld-topic>
<ld-topic id="distributed-systems-definition"><h2>Distributed Systems - Definition</h2><blockquote class="epigraph"><p>A distributed system is one in which the failure of a computer
you didn't even know existed can render your own computer
unusable.</p><p class="attribution">—<a class="reference external" href="https://lamport.azurewebsites.net/pubs/distributed-system.txt">May 28, 1987 - Leslie Lamport</a></p></blockquote></ld-topic>
<ld-topic id="common-misunderstandings-regarding-centralised-systems"><h2>Common misunderstandings regarding centralised systems</h2><ol class="arabic incremental-list"><li><p><strong>Centralized solutions do not scale</strong></p><p>A distinction must be made between logical and physical centralization.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Example</span></p><p>The <em>Domain Name System (DNS)</em>:</p><ul class="columns simple"><li><ul class="simple"><li><p>logisch zentralisiert</p></li><li><p>physisch (massiv) verteilt</p></li></ul></li><li><ul class="simple"><li><p>dezentralisiert über mehrere Organisationen</p></li></ul></li></ul></aside></li><li><p><strong>Centralized solutions have a single point of failure</strong></p><p>Generally not true (e.g. DNS).</p><p>A single possible source of error is often...</p><ul class="columns simple"><li><ul class="simple"><li><p>easier to manage</p></li></ul></li><li><ul class="simple"><li><p>easier to make more robust</p></li></ul></li></ul></li></ol><ld-supplemental><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warning</p><p>There are many, poorly founded misconceptions about, for example, scalability, fault tolerance or security. We need to develop skills that make it easy to understand distributed systems in order to avoid such misunderstandings.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="perspectives-on-distributed-systems"><h2>Perspectives on Distributed Systems</h2><p><strong>Distributes systems are complex.</strong></p><dl class="incremental-list field-list simple"><dt>Architectures<span class="colon">:</span></dt><dd><p>What architectures and "architectural styles" are there?</p></dd><dt>Processes<span class="colon">:</span></dt><dd><p>What kind of processes are there and what are their relationships?</p></dd><dt>Communication<span class="colon">:</span></dt><dd><p>What options are there for exchanging data?</p></dd><dt>Coordination<span class="colon">:</span></dt><dd><p>How are the involved systems coordinated?</p></dd><dt>Naming<span class="colon">:</span></dt><dd><p>How do you identify resources?</p></dd><dt>Consistency and replication<span class="colon">:</span></dt><dd><p>What trade-offs need to be made in terms of data consistency, replication and performance?</p></dd><dt>Fault tolerance<span class="colon">:</span></dt><dd><p>How can operations be maintained even in the event of partial failures?</p></dd><dt>Security<span class="colon">:</span></dt><dd><p>How can authorized access to resources be guaranteed?</p></dd></dl></ld-topic>

<ld-topic class="new-subsection transition-fade" id="distribution-transparency"><h2>Distribution Transparency</h2></ld-topic>
<ld-topic id="definition"><h2>Definition</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p class="rubric">Distribution Transparency</p><p>Transparency describes the property that a distributed system attempts to hide the fact that its processes and resources are physically distributed across multiple computers that may be separated by large(r) distances.</p></aside><div class="incremental margin-top-2em"><p>The distribution transparency is realized by many different techniques of the so-called <em>middleware</em> - a layer between applications and operating systems.</p></div></ld-topic>
<ld-topic id="aspects-of-distribution-transparency"><h2>Aspects of Distribution Transparency</h2><table class="booktabs incremental-table-rows"><tbody><tr><th class="stub"><p>Data access</p></th><td><p>hide differences in data representation and the type of access to a local or remote object</p></td></tr><tr><th class="stub"><p>Location of data storage</p></th><td><p>hide where an object is located</p></td></tr><tr><th class="stub"><p>Relocation</p></th><td><p>hide that an object may be moved to another location while in use</p></td></tr><tr><th class="stub"><p>Migration</p></th><td><p>hide that an object may be moved to another location</p></td></tr><tr><th class="stub"><p>Replication</p></th><td><p>hide that an object is replicated</p></td></tr><tr><th class="stub"><p>Concurrency</p></th><td><p>hide that an object may be shared by several independent users</p></td></tr><tr><th class="stub"><p>Fault transparency</p></th><td><p>hide the failure and recovery of an object</p></td></tr></tbody></table><ld-supplemental><p>Representation of Information: Big-Endian vs. Little-Endian; ASCII vs. Iso-Latin 8859-1 vs. UTF-8</p></ld-supplemental></ld-topic>
<ld-topic id="degree-of-achievable-distribution-transparency"><h2>Degree of achievable Distribution Transparency</h2><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Observation</span></p><p>Complete distribution transparency cannot be achieved.</p></aside><div class="incremental"><p>However, a high level of distribution transparency can result in high costs.</p></div><ul class="incremental-list simple"><li><p>There are communication latencies that cannot be hidden.</p></li><li><p>It is (theoretically and practically) impossible to completely hide network and node failures.</p></li><li><p>You cannot distinguish a slow computer from a failed computer.</p></li><li><p>You can never be sure that a server was actually performing an operation before it crashed.</p></li><li><p>"Complete transparency" costs performance and exposes the distribution of the system.</p><ul class="simple"><li><p>Keeping the replicas exactly on the same level as the master takes time</p></li><li><p>Write operations are immediately transferred to the hard drive for fault tolerance</p></li></ul></li></ul></ld-topic>
<ld-topic id="disclosing-distribution-can-bring-advantages"><h2>Disclosing Distribution can bring Advantages</h2><ul class="incremental-list list-with-explanations"><li><p>Use of location-based services
(E. g. to enable finding friends nearby.)</p></li><li><p>When dealing with users in different time zones</p></li><li><p>When it is easier for a user to understand what is going on</p><p>(E.g. if a server does not respond for a long time, it can be reported as down).</p></li></ul><aside class="admonition incremental" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Observation</span></p><p>Distribution transparency is a noble goal, but often difficult to achieve and frequently not worth striving for.</p></aside></ld-topic>
<ld-topic class="new-subsection transition-fade" id="open-distributed-systems"><h2>Open Distributed Systems</h2></ld-topic>
<ld-topic id="open-distributed-systems-foundations"><h2>Open Distributed Systems - Foundations</h2><!--_openness:--><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>An open distributed system offers components that can easily be used by other systems or integrated into other systems.</p><p>An open distributed system itself often consists of components that originate from elsewhere.</p></aside><div class="incremental"><p>Open distributed systems must be able to interact with services of other (open) systems, regardless of the underlying environment:</p><ul class="incremental-list simple"><li><p>they should implement well-defined interfaces correctly</p></li><li><p>they should be able to interact easily with other systems</p></li><li><p>they should support the portability of applications</p></li><li><p>they should be easily extensible</p></li></ul></div><ld-supplemental><p>Authentication services are one example. They can be used by many different applications.</p></ld-supplemental></ld-topic>
<ld-topic id="policies-vs-mechanisms"><h2>Policies vs. Mechanisms</h2><ld-supplemental><p><span class="eng">Policies vs. Mechanisms</span> ≘ <span class="ger">Vorgaben/Richtlinien vs. Umsetzungen</span></p></ld-supplemental><p class="rubric">Policies when implementing openness</p><ul class="incremental-list simple"><li><p>What level of consistency do we need for data in the client cache?</p></li><li><p>What operations do we allow downloaded code to perform?</p></li><li><p>Which QoS requirements do we adapt in the presence of fluctuating bandwidths?</p></li><li><p>What level of secrecy do we need for communication?</p></li></ul><p class="incremental rubric">Mechanisms to support openness</p><ul class="incremental-list simple"><li><p>Enabling the (dynamic) setting of caching policies</p></li><li><p>Support of different trust levels for mobile code</p></li><li><p>Provisioning of adjustable QoS parameters per data stream</p></li><li><p>Provisioning of various encryption algorithms</p></li></ul><ld-supplemental><p>The hard coding of policies often simplifies administration and reduces the complexity of the system. However, it comes at the price of less flexibility.</p></ld-supplemental></ld-topic>
<ld-topic id="security-in-distributed-systems-security-objectives"><h2>Security in Distributed Systems - Security Objectives</h2><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Observation</span></p><p>A distributed system that is not secure is not reliable.</p></aside><div class="incremental"><p class="rubric">Foundational security objectives</p><dl class="field-list simple"><dt><strong>Confidentiality</strong><span class="colon">:</span></dt><dd><p>Information is only passed on to authorized parties.</p></dd><dt><strong>Integrity</strong><span class="colon">:</span></dt><dd><p>Changes to the values of a system may only be made in an authorized manner.</p></dd></dl></div><ld-supplemental><p>Together with the third security objective: <strong>availability</strong>, these three protection objectives form the CIA triad of information security: Confidentiality, Integrity, and Availability.</p></ld-supplemental></ld-topic>
<ld-topic id="security-in-distributed-systems-authorization-authentication-trust"><h2>Security in Distributed Systems - Authorization, Authentication, Trust</h2><dl class="incremental-list field-list simple"><dt>Authentication<span class="colon">:</span></dt><dd><p>Process for verifying the correctness of a claimed identity.</p></dd><dt>Authorization<span class="colon">:</span></dt><dd><p>Does an identified unit have the correct access rights?</p></dd><dt>Trust<span class="colon">:</span></dt><dd><p>A component can be certain that another component will perform certain actions in accordance with expectations.</p></dd></dl></ld-topic>
<ld-topic id="security-encryption-and-signatures"><h2>Security - Encryption and Signatures</h2><p>It is essentially about encrypting and decrypting data (X) with the help of keys.</p><ld-deck><ld-card><p>E(K,X) means that we <strong>e</strong>ncrypt the message X with the key K.</p><p>D(K,X) denotes the inverse function that <strong>d</strong>ecrypts the data.</p></ld-card><ld-card class="incremental"><p class="rubric">Symmetric Encryption</p><p>The encryption key is identical to the decryption key; the same key K is used for both operations.</p><blockquote><p>X = D(K,E(K,X))</p></blockquote></ld-card><ld-card class="incremental"><p class="rubric">Asymmetric Encryption</p><p>We distinguish between private (PR) and public keys (PU) (PU ≠ PR). A private and a public key always form a pair. The private key must always be kept secret.</p><ld-deck class="incremental"><ld-card><p><strong>Encrypting Messages</strong></p><p>Alice sends a message to Bob using Bob's public key.</p><blockquote><p>Y = E(PU<sub>Bob</sub>,X)</p><p>X = D(PR<sub>Bob</sub>,Y)</p></blockquote></ld-card><ld-card class="incremental"><p><strong>Signing Messages</strong></p><p>Alice signs (S) a message with her private key.</p><blockquote><p>Y = E(PR<sub>Alice</sub>,X)</p><p>X = D(PU<sub>Alice</sub>,Y)</p></blockquote></ld-card></ld-deck></ld-card></ld-deck></ld-topic>
<ld-topic id="security-secure-hashing"><h2>Security - Secure Hashing</h2><p>A secure hash function Digest(X) returns a character string of fixed length (H).</p><ul class="simple"><li><p>Any change – no matter how small – to the input data results in a completely different character string.</p></li><li><p>With a hash value, it is mathematically impossible to find the original message X based on Digest(X).</p></li></ul><div class="incremental"><p class="rubric">Signing Messages</p><ul class="columns incremental-list"><li><p>Alice signs a message X with her private key.</p><blockquote><p>Alice: [E(PR<sub>Alice</sub>,H=Digest(X)), X]</p></blockquote></li><li><p>Bob checks the message X for authenticity:</p><blockquote><p>Bob: D(PU<sub>Alice</sub>,H) ≟ Digest(X)</p></blockquote></li></ul></div><ld-supplemental><p><span class="ger">Sicheres Hashing</span> ≘ <span class="eng">Secure Hashing</span></p></ld-supplemental></ld-topic>

<ld-topic class="new-subsection transition-fade" id="scalability"><h2>Scalability</h2></ld-topic>
<ld-topic id="scalability-in-distributed-systems"><h2>Scalability in Distributed Systems</h2><p>We can distinguish at least three types of scalability:</p><ul class="incremental-list simple"><li><p>Number of users or processes (size scalability)</p></li><li><p>Maximum distance between nodes (geographical scalability)</p></li><li><p>Number of administrative domains (administrative scalability)</p></li></ul><ld-supplemental><p>Scalability in terms of size can often be achieved by using more and more powerful servers that are operated in parallel.</p><p>Geographical and administrative scalability is often a greater challenge.</p></ld-supplemental></ld-topic>
<ld-topic id="analysis-of-the-scalability-of-centralized-systems"><h2>Analysis of the Scalability of Centralized Systems</h2><ld-deck><ld-card><p>A centralized service can be modelled as a simple queuing system:</p><object class="light-image align-center" data="drawings/queuing-system.svg" type="image/svg+xml" role="img"></object><p class="rubric">Assumptions</p><p>The queue has an infinite capacity, i.e. the arrival rate of requests is not influenced by the current length of the queue or by what is currently being processed.</p></ld-card><ld-card class="incremental"><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><ul><li><p>Arrival rate of requests:</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\lambda</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord mathnormal">λ</span></span></span></span></span> <em>(requests per second)</em></p></li><li><p>Processing capacity of the service:</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">μ</span></span></span></span></span> <em>(requests per second)</em></p><p>Proportion of time with <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">x</span></span></span></span></span> requests in the system:</p><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>p</mi><mi>x</mi></msub><mo>=</mo><mo fence="true" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mn>1</mn><mo>−</mo><mfrac><mi>λ</mi><mi>μ</mi></mfrac><mo fence="true" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mo fence="true" stretchy="true" minsize="1.2em" maxsize="1.2em">(</mo><mfrac><mi>λ</mi><mi>μ</mi></mfrac><msup><mo fence="true" stretchy="true" minsize="1.2em" maxsize="1.2em">)</mo><mi>x</mi></msup></mrow><annotation encoding="application/x-tex">p_x  = \bigl(1 - \frac{\lambda}{\mu}\bigr)\bigl(\frac{\lambda}{\mu}\bigr)^x</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">x</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1.2em;vertical-align:-0.35em;"></span><span class="mopen"><span class="delimsizing size1">(</span></span><span class="mord">1</span><s ><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.4033em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.0735em;"><span></span></span></span></span></span></span></span></span></span></span></span></div><p>with <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo>=</mo><mfrac><mn>1</mn><mi>μ</mi></mfrac></mrow><annotation encoding="application/x-tex">S = \frac{1}{\mu}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1.3262em;vertical-align:-0.4811em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8451em;"><span style="top:-2.655em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">μ</span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.394em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.4811em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span> for the average service time.</p></li><li><object class="light-image align-center" data="drawings/response_time.svg" type="image/svg+xml" role="img" aria-label="Response Time w.r.t. Utilization"></object></li></ul><ul class="incremental-list simple"><li><p>If <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>U</mi></mrow><annotation encoding="application/x-tex">U</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">U</span></span></span></span></span> is small, the response time is close to <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn></mrow><annotation encoding="application/x-tex">1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span>, i.e. a request is processed immediately.</p></li><li><p>If <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>U</mi></mrow><annotation encoding="application/x-tex">U</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">U</span></span></span></span></span> increases to <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn></mrow><annotation encoding="application/x-tex">1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span>, the system comes to a standstill.</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="problems-of-geographical-scalability"><h2>Problems of Geographical Scalability</h2><ul class="simple"><li><p>Many distributed systems assume synchronous client-server interactions and this prevents a transition from LAN to WAN. Latency times can be prohibitive if the client has to wait a long time for a request.</p></li></ul><ul class="incremental simple"><li><p>WAN connections are often unreliable by nature.</p></li></ul></ld-topic>
<ld-topic id="problems-of-administrative-scalability"><h2>Problems of Administrative Scalability</h2><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Observation</span></p><p>Conflicting guidelines in terms of usage (and therefore payment), administration and security.</p></aside><ld-deck class="incremental"><ld-card><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Example</span></p><ul class="simple"><li><p>Grid computing: shared use of expensive resources across different domains.</p></li><li><p>Shared devices: How to control, manage and utilize a shared radio telescope designed as a large-scale shared sensor network?</p></li></ul></aside></ld-card><ld-card class="incremental"><p class="rubric">Exception</p><p>Various peer-to-peer networks <a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a> where end users collaborate rather than administrative units:</p><ul class="simple"><li><p>File sharing systems (e.g. based on BitTorrent)</p></li><li><p>Peer-to-peer telephony (early versions of Skype)</p></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Here, "peer" is to be understood as a network of equal computers.</p></aside></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="approaches-to-achieve-scaling"><h2>Approaches to achieve Scaling</h2><ld-deck><ld-card><p><strong>Hiding communication latencies</strong> through:</p><ul class="simple"><li><p>Use of asynchronous communication</p></li><li><p>Use of separate <em>handlers</em> for incoming responses</p></li></ul><ld-presenter-note encrypted="">MTAwMDAw:XZPeCZqW6H0N1tPnbWgm5K8xj9uGC/q1j60nnsRer50=:QglQYkra61+sYhx5:fJFN09i0Pv5eRf2ibZlaK8Hkp5MJ344sjNkvnT7JV9hhhQjIhGDeLYZtxfV6rWzgVT4Lvr3/HmtySaULlkaWsjaaY1X0CHNaO/4DHgrDJHEvI+55XjzYbw2HXMYkCbivniM+mIrfiggeABxl/TBCz6Qyr7GGZL4agK4pkF6xcmL8XPWiobnQkvLuX7XJFH68vJr3ghnU/xKq5ZY/44e9WEV74kgn7oSAbRdjzD4vP8v3Rsw=</ld-presenter-note><aside class="admonition incremental" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Observation</span></p><p>However, this model is not always applicable.</p></aside></ld-card><ld-card class="incremental"><p><strong>Partitioning of data and calculations across multiple computers.</strong></p><ul class="simple"><li><p>Relocation of calculations to clients</p></li><li><p>Decentralized naming services (e.g. DNS)</p></li><li><p>Decentralized information systems (e.g. WWW)</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="shifting-calculations-to-clients"><h2>Shifting Calculations to Clients</h2><object class="light-image align-center" data="drawings/moving-computations.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="scaling-via-replication-and-caching"><h2>Scaling via Replication and Caching</h2><p><strong>Use of replication and caching to make copies of data available on different computers.</strong></p><ul class="incremental-list simple"><li><p>replicated file servers and databases</p></li><li><p>mirrored websites</p></li><li><p>Web caches (in browsers and proxies)</p></li><li><p>File caching (on server and client)</p></li></ul></ld-topic>
<ld-topic id="challenges-of-replication"><h2>Challenges of Replication</h2><ul class="incremental-list"><li><p>Multiple copies (cached or replicated) inevitably lead to inconsistencies. Changing one copy means that this copy differs from the others.</p></li><li><p>To achieve consistency, global synchronization is required for every change.</p><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Attention!</p><p>Global synchronization rules out solutions on a large scale.</p></aside></li></ul><ld-supplemental><p>The extent to which inconsistencies can be tolerated is application-specific. However, if these can be tolerated, then the need for global synchronization can be reduced.</p></ld-supplemental></ld-topic>
<ld-topic id="parallel-computing"><h2>Parallel Computing</h2><ul class="columns"><li><p>Multiprocessor</p><object class="light-image align-center" data="drawings/multiprocessor-vs-multicomputer/multiprocessor.svg" type="image/svg+xml" role="img"></object></li><li><p>Multicomputer</p><object class="light-image align-center" data="drawings/multiprocessor-vs-multicomputer/multicomputer.svg" type="image/svg+xml" role="img"></object></li></ul><ld-supplemental><p>Distributed high-performance computing began with parallel computing.</p><p><strong>Distributed systems with shared memory</strong> (i. e. multi-computers with shared memory) as an alternative architecture did not fulfil the expectations and are therefore no longer relevant.</p></ld-supplemental></ld-topic>
<ld-topic id="amdahl-s-law-limits-to-scalability"><h2>Amdahl's law - Limits to Scalability</h2><ld-deck><ld-card><ul class="list-with-explanations"><li><p>Solving <strong>fixed problems</strong> in the shortest possible time</p><p>Example: Booting a computer. To what extent can more CPUs/cores shorten the time?</p></li><li><p>It models the expected acceleration (<em>speedup</em>) of a partially parallelized/parallelizable program relative to the non-parallelized variant.</p></li></ul><aside class="admonition encapsulate-floats" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><aside class="admonition" data-theme="note"><p class="admonition-title" data-theme="note-header">Note</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi></mrow><annotation encoding="application/x-tex">C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span></span></span></span> = Number of CPUs</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>P</mi></mrow><annotation encoding="application/x-tex">P</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span></span></span></span></span> = Degree of parallelization in percent</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi></mrow><annotation encoding="application/x-tex">S</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span></span></span></span></span> = Speedup</p></aside><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo stretchy="false">(</mo><mi>C</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>P</mi><mo stretchy="false">)</mo><mo>+</mo><mfrac><mi>P</mi><mi>C</mi></mfrac></mrow></mfrac></mrow><annotation encoding="application/x-tex">S(C) = \frac{1}{(1-P) + \frac{P}{C}}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1.5064em;vertical-align:-0.6613em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8451em;"><span style="top:-2.5795em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mopen mtight">(</span><span class="mord mtight">1</span><span class="mbin mtight">−</span><span class="mord mathnormal mtight" style="margin-right:0.1389em;">P</span><span class="mclose mtight">)</span><span class="mbin mtight">+</span><span class="mord mtight"><span class="mopen nulldelimiter katex-sizing reset-size3 size6"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8721em;"><span style="top:-2.656em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size3 size1 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0715em;">C</span></span></span></span><span style="top:-3.2255em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line mtight" style="border-bottom-width:0.049em;"></span></span><span style="top:-3.384em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size3 size1 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.1389em;">P</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.344em;"><span></span></span></span></span></span><span class="mclose nulldelimiter katex-sizing reset-size3 size6"></span></span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.394em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.6613em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p></aside></ld-card><ld-card class="incremental"><object class="light-image align-center" data="drawings/amdahl.svg" type="image/svg+xml" role="img" aria-label="Amdahls Law visualized"></object></ld-card></ld-deck></ld-topic>
<ld-topic id="gustafson-s-law-limits-to-scalability"><h2>Gustafson's Law - Limits to Scalability</h2><ld-deck><ld-card><ul class="list-with-explanations"><li><p>Solving problems with (very) large, structurally repetitive data sets in <strong>fixed time</strong>; the serial part of the programme is assumed to be constant.</p><aside class="admonition margin-top-1em" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Example</span></p><p>Create the weather forecast for the day after tomorrow within the next 24 hours. To what extent can the precision of the forecast be improved by using more CPUs/computers?</p></aside></li></ul></ld-card><ld-card class="incremental"><div class="encapsulate-floats"><aside class="admonition width-50 dd-margin-left-2em" data-theme="note"><p class="admonition-title" data-theme="note-header">Note</p><dl class="field-list simple"><dt><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi></mrow><annotation encoding="application/x-tex">C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span></span></span></span><span class="colon">:</span></dt><dd><p>Number of CPUs</p></dd><dt><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>P</mi></mrow><annotation encoding="application/x-tex">P</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span></span></span></span></span><span class="colon">:</span></dt><dd><p>Degree of parallelisation as a function of the problem size <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span></span></p></dd><dt><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi></mrow><annotation encoding="application/x-tex">S</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span></span></span></span></span><span class="colon">:</span></dt><dd><p>Speedup</p></dd></dl></aside><ul><li><p>Beschleunigung (Speedup) eines parallelisierten Programms relativ zu der nicht-parallelisierten Variante:</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo stretchy="false">(</mo><mi>C</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">S(C)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mclose">)</span></span></span></span></span> <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>=</mo><mn>1</mn><mo>+</mo></mrow><annotation encoding="application/x-tex">= 1 +</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.3669em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">1</span><span class="mord">+</span></span></span></span></span> <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo><mo>⋅</mo><mo stretchy="false">(</mo><mi>C</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">P(n) \cdot  (C-1)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">)</span></span></span></span></span></p></li></ul></div><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Example</span></p><p>Let the degree of parallelization for a relevant problem size <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span></span> be <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>80</mn></mrow><annotation encoding="application/x-tex">80 %</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">80</span></span></span></span></span>. This results in a speedup of <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mn>0.8</mn><mo>⋅</mo><mn>3</mn><mo stretchy="false">)</mo><mo>=</mo><mn>3.4</mn></mrow><annotation encoding="application/x-tex">(1 + 0.8 \cdot  3) = 3.4</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">0.8</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">3</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">3.4</span></span></span></span></span> for <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>4</mn></mrow><annotation encoding="application/x-tex">4</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">4</span></span></span></span></span> CPUs, a speedup of <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>6.6</mn></mrow><annotation encoding="application/x-tex">6.6</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">6.6</span></span></span></span></span> for <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>8</mn></mrow><annotation encoding="application/x-tex">8</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">8</span></span></span></span></span> CPUs and a speedup of <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>13</mn></mrow><annotation encoding="application/x-tex">13</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">13 <ld-topic class="exercises" id="exercise"><h2>Exercise</h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Compute Speedup"><p class="ld-exercise-title rubric"><span>Compute Speedup</span></p><p>You are a pentester and you try to penetrate a system by attacking the passwords of the administrators. At the moment, you are using 2 graphics cards with 2048 compute units each. The serial part of the attack is 10 %. How high is the speedup you can expect, if you add two more comparable graphics cards with another 2048 compute units per GPU?</p><aside class="admonition" data-theme="background"><p class="admonition-title" data-theme="background-header"><span>Background</span></p><p>The attacks are highly parallelizable and effectively depend on the number of CUs. The graphics cards are able to accelerate the attacks effectively.</p></aside><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:aRiEXZhx/a5OidOjkEZAcROq3Fu5VPbKHq0XABDPeK0=:M3kVsgLJ5aidThiB:WPuMnFzjX5n8oxyAEPIwxDeQ97xwbSuUuyGsYmaS1UwmBVYb5e/HoXu1BAd2iQGLaXz8yMe1vuH25ayEr0hTkF+yS7mySAzz4zd60G5bwAiZGhQpaUuVxcQgiuRK95CWPk8A59A9eCFP/IMvM0SQfABF7zgGh3UDOekmRdSsA6rC5dBsb3VUDQTGr2MPPV91RVAzaFWQKi75wzpS3T2giRipvDf0d+tpAmYy9WVARm7UMJXPpsMTBUl2n/Z0AfMPhOB+WZBBlo2umNj4JxZEb0qI+zGRkCxn3h4fPcV6CNuzS1wRWd7peipZSb48zdh0VY2B8oFEdrZOdYYw7rMLBGzdfgd1/qVAH7aXhZGjM5EeHrNXeayJ82q45oXRgIIwfU28QmoiJCllNeFQSBfZ9RZkfx7C2Uo3T3Y4iWDvLFnbwP7Fjuq9N4tIycFgRAc+GRTsrDLHCoGgH9MqSCObVrRs/DiDSq7mi0DIDTLreV6bxbzLQGPUQiv1S9h+8212SmxBVqBXJlvtHM4EGJxNrd3pGg4NghRvJMrnmQ4CpfhXEk5YETqXT1IPKoRbIiiY0ahYOmQwOIvVqUx/5CHcxSG+e/EuEO886au9ZVdrlwk18AzbCW8SFpNYS1YmQpnXQdAmAIVSMIC++I2eX2T5EQXEgn9gsdq8rf+uoDknnc17f5yiikw8Suq8MEsM9UezmxNE8/TZFmhc+SsesJP31z2ONtxiRkNuCTylIH3QWsBUMBT/ODiWj4PENNbmnMYbMUf9glz/LTtCMy/uqZu0r0YuJxp7rXjLgERW8jmUgzp9V94IVFTvgmR3XyW0um4npACFrQAW4VTtmMtjUTTabATUKP2AICXBS6c85uBHXEKqaTZr23MSsnfQcBbtSlVK6x/ui+RV2BzCCsVvSzs34bhz2YszNtHSs7Z4tHVrNpkhc+Xq7sKKQ++gwzZ5F75xNNt6BOl/4eXejn/p4xQtpoT/ieT <ld-topic class="new-section transition-fade" id="requirements-on-distributed-systems"><h2>Requirements on Distributed Systems</h2></ld-topic>
<ld-topic id="dependability-of-distributed-systems"><h2>Dependability of Distributed Systems</h2><aside class="admonition admonition-dependencies"><p class="admonition-title">Dependencies</p><p>A <strong>component</strong><a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a> provides <strong>services</strong> to its <strong>clients</strong>. For that, the component may in turn require services from other components and therefore the component is dependent on another component.</p></aside><aside class="admonition admonition-correctnes-and-dependencies"><p class="admonition-title">Correctnes and Dependencies</p><p>A component C depends on C<sup>*</sup> if the correctness of the behavior of C depends on the correctness of the behavior of C<sup>*</sup>.</p></aside><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-2" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-2">2</a><span class="fn-bracket">]</span></span><p>Components are processes or channels.</p></aside></aside><ld-supplemental><p><span class="eng">Dependability</span> ≘ <span class="ger">Verlässlichkeit</span></p></ld-supplemental></ld-topic>
<ld-topic id="requirements-on-the-reliability-of-distributed-systems"><h2>Requirements on the Reliability of Distributed Systems</h2><table class="booktabs incremental-table-rows align-center"><thead><tr><th class="head"><p>Requirement</p></th><th class="head"><p>Description</p></th></tr></thead><tbody><tr><td><p>Availability</p></td><td><p>The system is usable.</p></td></tr><tr><td><p>Reliability</p></td><td><p>Continuity of correct service provision.</p></td></tr><tr><td><p>Safety</p></td><td><p>Low probability of a catastrophic event.</p></td></tr><tr><td><p>Maintainability</p></td><td><p>How easily can a failed system be recovered?</p></td></tr></tbody></table><ld-supplemental><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Attention!</p><p><span class="eng">Security</span> ≘ <span class="ger">Sicherheit</span></p><p><span class="eng">Safety</span> ≘ <span class="ger">Sicherheit</span></p><p>Safety refers to the safety of people and property, while security refers to the security of data and information.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="reliability-vs-availability-in-distributed-systems"><h2>Reliability vs. Availability in Distributed Systems</h2><p class="rubric">Reliability R(t) of the component C</p><p>Conditional probability that C worked correctly during [0,t) if C worked correctly at time T = 0.</p><div class="compound incremental"><p class="rubric">Traditional Metrics</p><ul class="incremental-list"><li><p>Mean Time to Failure (MTTF):</p><p>The average time to failure of a component.</p></li><li><p>Mean Time to Repair (MTTR):</p><p>The average time it takes to repair a component.</p></li><li><p>Mean Time between Failures (MTBF):</p><p>MTTF + MTTR = MTBF.</p></li></ul></div><ld-supplemental embed-in-document-flow=""><dl class="field-list simple"><dt>Reliability<span class="colon">:</span></dt><dd><p>How likely is it that a system will work <em>correctly</em>?</p></dd><dt>Availability<span class="colon">:</span></dt><dd><p>How likely is it that a system will be available at a given time?</p></dd></dl><p class="rubric">MTBF vs. MTTR</p><p>If the MTTF of a component is 100 hours and the MTTR is 10 hours, then the MTBF is: MTTF + MTTR = 100 + 10 = 110 hours (MTBF).</p></ld-supplemental></ld-topic>
<ld-topic id="mapreduce-programming-model-and-middleware-for-parallel-computing"><h2>MapReduce - Programming model and Middleware for Parallel Computing</h2><ul class="incremental-list list-with-explanations"><li><p>MapReduce is a programming model and a corresponding implementation (a framework originally developed by Google) for processing very large amounts of data (possibly TBytes).</p></li><li><p>Programs implemented with the help of MapReduce are automatically parallelized and executed on a large cluster of commodity hardware.</p><p>Responsibility of the runtime environment:</p><ul class="simple"><li><p>Partitioning the input data and distributing it to the computers in the cluster.</p></li><li><p>Scheduling and execution of the <span class="docutils literal">Map</span> and <span class="docutils literal">Reduce</span> functions on the computers of the cluster.</p></li><li><p>Error handling and communication between the computers.</p></li></ul></li></ul><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hint</p><p>Not all kinds of computations can be performed with the help of MapReduce.</p></aside><!--MapReduce - Visualization of an Example [removed March 2 2026]

         :width: 100%
         :align: center

         Here it is the calculation of the frequency of words in a very large data set.

         Another canonical example is the calculation of an inverted index. I. e., the mapping of words to the documents/webpages in which they occur.--></ld-topic>

<ld-topic class="new-section transition-fade" id="classification-of-distributed-systems"><h2>Classification of Distributed Systems</h2></ld-topic>
<ld-topic id="cluster-computing"><h2>Cluster Computing</h2><p>A group of high-end systems connected via a LAN.</p><object class="light-image align-center" data="drawings/cluster-computing.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>The individual computers/compute nodes are often identical (hardware and software) and are managed by a management node (<span class="eng">management node</span>).</p></ld-supplemental></ld-topic>
<ld-topic id="grid-computing"><h2>Grid Computing</h2><p>Continuation of cluster computing.</p><ul class="simple"><li><p>Many heterogeneous nodes scattered over a wide area and across several organizations.</p></li><li><p>The nodes are connected via the WAN.</p></li><li><p>Collaboration takes place within the framework of a virtual organization.</p></li></ul><ld-supplemental><p>(Volunteer) Grid Computing - Examples:</p><p><a class="reference external" href="https://scienceunited.org">https://scienceunited.org</a></p><p><a class="reference external" href="https://einsteinathome.org">https://einsteinathome.org</a></p></ld-supplemental></ld-topic>
<ld-topic id="basic-architecture-for-grid-computing"><h2>Basic Architecture for Grid Computing</h2><ul class="columns dd-margin-left-2em"><li><object class="light-image align-center" data="drawings/architecture-for-grid-computing.svg" type="image/svg+xml" role="img"></object></li><li><dl class="no-margin field-list simple"><dt>Fabric layer<span class="colon">:</span></dt><dd><p>Provides interfaces to local resources (for querying status and capabilities, locking, etc.)</p></dd><dt>Connectivity layer<span class="colon">:</span></dt><dd><p>Communication / transaction / authentication protocols, e.g. for transferring data between resources.</p></dd><dt>Resource layer<span class="colon">:</span></dt><dd><p>Manages a single resource, e.g. creating processes or reading data.</p></dd></dl></li></ul><dl class="no-margin field-list simple"><dt>Collective Layer<span class="colon">:</span></dt><dd><p>Manages access to multiple resources: discovery, scheduling and replication.</p></dd><dt>Applications<span class="colon">:</span></dt><dd><p>Contains actual grid applications in a single organisation.</p></dd></dl><ld-supplemental><p><span class="ger">Auffindung</span> ≘ <span class="eng">Discovery</span></p><p><span class="ger">Einplanung</span> ≘ <span class="eng">Scheduling</span></p></ld-supplemental></ld-topic>
<ld-topic id="peer-to-peer-systems"><h2>Peer-to-Peer-Systems</h2><dl class="field-list"><dt>Vision<span class="colon">:</span></dt><dd><p>"The network is the computer." There is a database that is always accessible worldwide.</p></dd><dt>Idea<span class="colon">:</span></dt><dd><p>No dedicated clients and servers, each participant (peer) is both provider and customer.</p><p>Self-organising, without a central infrastructure (coordinator, database, directory of participants).</p><p>Each peer is autonomous and can be offline at any time, network addresses can change at will.</p></dd><dt>Main Application<span class="colon">:</span></dt><dd><p>File-Sharing-Systems (in particular BitTorrent)</p></dd></dl><ld-supplemental><p>The peak of classic peer-to-peer systems was in the 2000s.</p><ul class="positive-list simple"><li><p>Advantages of P2P systems are: cheap, fault-tolerant, dynamic, self-configuring, immensely high storage capacity, high data access speed.</p></li></ul><ul class="negative-list simple"><li><p>Problems of P2P systems are: start-up, poorly connected, low performance peers; <em>free riders</em>; copyright problems.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="cloud-computing"><h2>Cloud-Computing</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><p>Cloud computing refers to the provision of computing power, storage and applications as a service. It is the continuation of grid computing.</p></aside><ld-deck><ld-card><p class="rubric">Variants</p><ul class="list-with-explanations"><li><p>Public Cloud (z. B. Amazon EC2, Google Apps, Microsoft Azure, …)</p></li><li><p>Private Cloud</p></li><li><p>Hybrid Cloud</p><p>(The private cloud is supplemented by a public cloud if required).</p></li><li><p>Virtual Private Cloud</p></li></ul></ld-card><ld-card class="incremental"><ul class="positive-list simple"><li><p>Advantages of cloud computing:</p><ul class="simple"><li><p>costs,</p></li><li><p>up-to-dateness of data and services,</p></li><li><p>no in-house infrastructure required,</p></li><li><p>support for mobile participants</p></li></ul></li></ul><ul class="negative-list simple"><li><p>Problems of cloud computing:</p><ul class="simple"><li><p><strong>security and trust</strong>,</p></li><li><p>loss of in-house expertise,</p></li><li><p><em>handling of classified data</em>.</p></li></ul></li></ul></ld-card><ld-card class="incremental"><p>One way to solve the trust problem could be <a class="reference external" href="https://de.wikipedia.org/wiki/Homomorphe_Verschl%C3%BCsselung">homomorphic encryption</a>, which makes it possible to perform calculations on encrypted data.</p><blockquote class="epigraph incremental"><p>[<strong>Fully homomorphic encryption</strong>, or FHE] can take thousands—even tens of thousands—of times longer to compute on today’s CPUs and GPUs than simply working with the decrypted data. [...]  Intel demonstrated [...] Heracles, which sped up FHE computing tasks as much as 5,000-fold compared to a top-of the-line Intel server CPU.</p><p class="attribution">—<a class="reference external" href="https://spectrum.ieee.org/fhe-intel">March 10, 2026, Samuel K. Moore, Intel Demos Chip to Compute With Encrypted Data, IEEE</a></p></blockquote></ld-card></ld-deck></ld-topic>
<ld-topic id="serverless-computing"><h2><em>Serverless Computing</em></h2><p><em>Serverless Computing</em> enables developers to create applications faster, as they no longer have to worry about managing the Infrastructure.</p><ul class="positive-list incremental simple"><li><p>The cloud service provider automatically provides, scales and manages the infrastructure required to run the code.</p></li></ul><ul class="negative-list incremental list-with-explanations"><li><p>Vendor-Lock-In</p></li><li><p>Cold-boot latency</p><p>Time until the first code is executed can be longer, as the serverless functions are only instantiated when required.</p></li><li><p>Debugging and Monitoring</p><p>Traditional tools and methods can no longer be used.</p></li><li><p>Cost-transparency/-management</p><p>The costs of serverless computing are difficult to predict and control.</p></li></ul></ld-topic>
<ld-topic class="new-section transition-fade" id="challenges-in-developing-distributed-systems"><h2>Challenges in Developing Distributed Systems</h2></ld-topic>
<ld-topic id="application-integration"><h2>Application Integration</h2><div class="assessment"><p>Typical enterprise applications in companies are networked applications and establishing interoperability between these applications is a major challenge.</p></div><div class="incremental margin-top-1em"><p class="rubric">Basic Approach</p><p><em>Clients</em> combine requests for (different) applications, send them, collect the responses and present a coherent result to the user.</p></div><div class="incremental margin-top-1em"><p class="rubric">Modern Approach</p><p>Direct communication between applications leads to the integration of enterprise applications  (Enterprise Application Integration (EAI)).</p></div><ld-supplemental><p>A networked application is an application that runs on a server and makes its services available to remote clients.</p></ld-supplemental></ld-topic>
<ld-topic id="transactions-at-business-process-level"><h2>Transactions at Business Process Level</h2><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><object class="light-image align-center" data="drawings/transactions/transaction.svg" type="image/svg+xml" role="img"></object><div class="text-align-center margin-top-1em"><p><strong>„All or nothing.“</strong></p></div></ld-cell><ld-cell class="width-60" style="align-self:auto;"><ld-deck><ld-card><table><thead><tr><th class="head"><p>Primitive</p></th><th class="head"><p>Description</p></th></tr></thead><tbody><tr><td><p>BEGIN OF TRANSACTION</p></td><td><p>Indicates the start of a transaction.</p></td></tr><tr><td><p>END OF TRANSACTION</p></td><td><p>Completes the transaction with an attempt to COMMIT.</p></td></tr><tr><td><p>ROLLBACK OF TRANSACTION</p></td><td><p>terminate the transaction and restore the old status.</p></td></tr><tr><td><p>READ</p></td><td><p>Reading data from (e. g.) a file or a table.</p></td></tr><tr><td><p>WRITE</p></td><td><p>Writing data (e. g.) to a file or a table.</p></td></tr></tbody></table></ld-card><ld-card class="incremental"><p class="rubric">ACID-Properties:</p><dl class="field-list simple"><dt>Atomic<span class="colon">:</span></dt><dd><p>happens inseparably (seemingly)</p></dd><dt>Consistent<span class="colon">:</span></dt><dd><p>no violation of system invariants</p></dd><dt>Isolated<span class="colon">:</span></dt><dd><p>no mutual influence</p></dd><dt>Durable<span class="colon">:</span></dt><dd><p>after a commit, the changes are permanent</p></dd></dl></ld-card></ld-deck></ld-cell></ld-grid></ld-topic>
<ld-topic id="transaction-processing-monitor-tpm"><h2><em>Transaction Processing Monitor (TPM)</em></h2><object class="light-image align-center" data="drawings/transactions/tpm.svg" type="image/svg+xml" role="img"></object><ld-supplemental><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Observation</span></p><p>The data required for a transaction is often distributed across several servers.</p><p>A TPM is responsible for coordinating the execution of a transaction.</p></aside></ld-supplemental><ld-supplemental><p>When you implement microservices, the use of TPMs and 2PC for the purpose of coordinating business processes is often not the first choice.</p><p>Nevertheless, distributed transactions are an important part of distributed systems and Google, for example, has developed Spanner, a solution that enables transactions on a global scale (<em>Global Consistency</em>). (<a class="reference external" href="https://cloud.google.com/spanner?hl=en">https://cloud.google.com/spanner?hl=en</a> and <a class="reference external" href="https://www.youtube.com/watch?v=iKQhPwbzzxU">https://www.youtube.com/watch?v=iKQhPwbzzxU</a>).</p></ld-supplemental></ld-topic>
<ld-topic id="middleware-and-enterprise-application-integration-eai"><h2><em>Middleware</em> and <em>Enterprise Application Integration (EAI)</em></h2><p>Middleware enables communication between applications.</p><object class="light-image align-center" data="drawings/middleware.svg" type="image/svg+xml" role="img"></object><ld-supplemental><dl class="field-list simple"><dt>Remote Procedure Call (RPC)<span class="colon">:</span></dt><dd><p>Requests are sent via a local procedure call, packaged as a message, processed, answered by a message and the result is then the return value of the procedure call.</p></dd><dt>Message Oriented Middleware (MOM)<span class="colon">:</span></dt><dd><p>Messages are sent (i. e. published) to a logical contact point (i. e. message broker) and forwarded to applications that subscribe to these messages.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic id="how-can-application-integration-be-achieved"><h2>How can application integration be achieved?</h2><dl class="incremental-list dd-margin-left-2em field-list"><dt>File transfer<span class="colon">:</span></dt><dd><p>Technically simple, but not flexible:</p><ul class="simple"><li><p>Determine the file format and layout</p></li><li><p>Regulate file management</p></li><li><p>Passing on updates and update notifications</p></li></ul></dd><dt>Shared database<span class="colon">:</span></dt><dd><p>Way more flexible, but still requires a common data schema in addition to the risk of a bottleneck.</p></dd><dt>Remote Procedure Call (RPC)<span class="colon">:</span></dt><dd><p>Effective when execution of a series of actions is required.</p></dd><dt>Messaging<span class="colon">:</span></dt><dd><p>Enables temporal and spatial decoupling compared to RPCs.</p></dd></dl></ld-topic>
<ld-topic class="new-section transition-fade" id="modern-distributed-systems"><h2>Modern Distributed Systems</h2></ld-topic>
<ld-topic id="distributed-pervasive-ubiquitous-systems"><h2><em>Distributed Pervasive/Ubiquitous Systems</em></h2><ld-supplemental><p><span class="eng">Distributed Pervasive/Ubiquitous Systems</span> ≘ <span class="ger">verteilte, allgegenwärtige/alles durchdringende Systeme</span></p></ld-supplemental><div class="margin-bottom-1em"><p>Modern distributed systems are characterised by the fact that the nodes are small, mobile and often embedded in a larger system. The system embeds itself naturally in the user's environment. Networking is wireless.</p></div><div class="incremental margin-top-1em"><p class="rubric">Three (overlapping) subtypes</p><dl class="field-list simple"><dt>Ubiquitous computing<span class="colon">:</span></dt><dd><p><em>ubiquitous and always present</em>; i. e. there is constant interaction between the system and the user.</p></dd><dt>Mobile computing<span class="colon">:</span></dt><dd><p><em>ubiquitous</em>; the focus is on the fact that devices are inherently mobile.</p></dd><dt>Sensor/Actuator Networks<span class="colon">:</span></dt><dd><p><em>ubiquitous</em>; focus is on actual (collaborative) sensing and actuation.</p></dd></dl></div></ld-topic>
<ld-topic id="ubiquitous-systems-key-elements"><h2><em>Ubiquitous Systems</em> - Key Elements</h2><dl class="incremental-list field-list simple"><dt>Distribution<span class="colon">:</span></dt><dd><p>The devices are networked, distributed and accessible without barriers.</p></dd><dt>Interaction<span class="colon">:</span></dt><dd><p>The interaction between users and devices is highly unobtrusive.</p></dd><dt>Context awareness<span class="colon">:</span></dt><dd><p>the system knows the user's context in order to optimize the interaction.</p></dd><dt>Autonomy<span class="colon">:</span></dt><dd><p>The devices work autonomously, without human intervention, and manage themselves independently to a high degree.</p></dd><dt>Intelligence<span class="colon">:</span></dt><dd><p>The system as a whole can handle a wide range of dynamic actions and interactions.</p></dd></dl></ld-topic>
<ld-topic id="mobile-computing-characterizing-features"><h2><em>Mobile Computing</em> - Characterizing features</h2><ul class="incremental-list simple"><li><p>A variety of different mobile devices (smartphones, tablets, GPS devices, remote controls, active ID cards).</p></li><li><p>Mobile means that the location of a device can change over time. This can, e. g., have an impact on local services or accessibility.</p></li><li><p>Maintaining stable communication can lead to serious problems.</p></li></ul><aside class="admonition incremental margin-top-1em" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Observation</span></p><p>The current status is that mobile devices establish connections to stationary servers, making them in principle <em>clients</em> of cloud-based services.</p></aside></ld-topic>

<ld-topic id="sensor-networks"><h2><em>Sensor Networks</em></h2><p>The nodes to which sensors are attached:</p><ul class="simple"><li><p>"many"</p></li><li><p>simple (low memory / computing / communication capacity)</p></li><li><p>often battery-operated (or even battery-free)</p></li></ul><object class="light-image align-center" data="drawings/sensor_networks/operator_stores_and_processes_data.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="sensor-networks-as-distributed-databases"><h2><em>Sensor Networks</em> as Distributed Databases</h2><object class="light-image align-center" data="drawings/sensor_networks/nodes_store_and_process_data.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="the-cloud-edge-continuum"><h2>The <em>Cloud-Edge Continuum</em></h2><object class="light-image align-center" data="drawings/cloud_edge_continuum.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="pitfalls-in-developing-distributed-systems"><h2>Pitfalls in Developing Distributed Systems</h2><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Observation</span></p><p>Many distributed systems are unnecessarily complex due to incorrect assumptions and architectural and design errors that have to be rectified later.</p></aside><div class="incremental"><p class="rubric">Incorrect (and often hidden) assumptions</p><ul class="incremental-list simple"><li><p>The network is reliable</p></li><li><p>The network is secure</p></li><li><p>The network is homogeneous</p></li><li><p>The topology does not change</p></li><li><p>The latency is zero</p></li><li><p>The bandwidth is infinite</p></li><li><p>The transport costs are zero</p></li><li><p>There is only one administrator</p></li></ul></div></ld-topic>
