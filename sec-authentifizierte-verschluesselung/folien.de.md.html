<ld-topic class="s-vertical-title" id="drei-ansatze-in-hinblick-auf-authenticated-encryption"><h2>Drei Ansätze in Hinblick auf <em>Authenticated Encryption</em></h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><div class="compound"><p><strong>Encrypt-then-MAC</strong></p><object class="light-image align-center" data="drawings/authentifizierte-verschluesselung/encrypt_then_mac.svg" type="image/svg+xml" role="img"></object></div><div class="compound incremental"><p><strong>Encrypt-and-MAC</strong></p><object class="light-image align-center" data="drawings/authentifizierte-verschluesselung/encrypt_and_mac.svg" type="image/svg+xml" role="img"></object></div></ld-cell><ld-cell class="width-50 incremental fade-out" style="align-self:auto;"><p><span class="s">MAC-then-Encrypt</span></p><object class="light-image align-center" data="drawings/authentifizierte-verschluesselung/mac_then_encrypt.svg" type="image/svg+xml" role="img"></object></ld-cell></ld-grid><ld-supplemental><p class="rubric">Modi</p><dl class="dd-margin-left-2em field-list"><dt><strong>Encrypt-then-MAC</strong><span class="colon">:</span></dt><dd><p>Der Klartext wird verschlüsselt und dann wird ein MAC über den Chiffretext berechnet. Dieser Ansatz wird von IPSec und TLS 1.3 verwendet.</p></dd><dt><strong>Encrypt-and-MAC</strong><span class="colon">:</span></dt><dd><p>Der Klartext wird verschlüsselt und ein MAC über den Klartext berechnet. Beides wird versendet. Dieser Ansatz wird von SSH verwendet. Es wurde gezeigt, dass kleinere Änderungen die Sicherheit weiter verbessern können.</p></dd><dt><strong>MAC-then-Encrypt</strong><span class="colon">:</span></dt><dd><p>Ein MAC wird über den Klartext berechnet und dann wird der Klartext und der MAC verschlüsselt. Dies war bis TLS 1.2 der Standard. Aufgrund von erfolgreichen Angriffen - insbesondere gegen das Padding bei Verwendung des CBC Modus (siehe <a class="reference external" href="https://en.wikipedia.org/wiki/Padding_oracle_attack">Padding-Oracle Attacks</a>) - wird dieser Ansatz nicht mehr verwendet.</p><p>Das grundlegende Problem entsteht dann, wenn der Angreifer bei einer Manipulation der Nachricht (am Ende) nicht nur eine generische Fehlermeldung erhält (Decryption failed) sondern ggf. die Information, dass ein Padding-Fehler vorliegt. Er kann diese Information nutzen, um  schrittweise eine Entschlüsselung vorzunehmen. Alternativ können ggf. Timing-Unterschiede im Verhalten verwendet werden.</p></dd></dl><p class="rubric">Integrität und Authentizität</p><p>Es ist möglich Integrität ohne Authentizität zu gewährleisten. Durch einen einfachen Hash kann gewährleistet werden, dass die Daten während der Übertragung nicht verändert wurden (insbesondere durch einen Fehler). Wenn ich jedoch Authentizität gewährleisten möchte, dann muss ich einen MAC verwenden, der auf einem Schlüssel basiert, der nur dem Sender und dem Empfänger bekannt ist. Dies verhindert, dass ein Angreifer einfach die Daten verändert und den MAC neu berechnet.</p><p>Authentizität ohne Integrität ist nicht sinnvoll. Der Nutzen zu wissen, dass eine Nachricht von einer bestimmten Person kam, aber nicht zu wissen, ob die Nachricht verändert wurde, ist sehr gering.</p></ld-supplemental></ld-topic>
<ld-topic class="s-vertical-title" id="aes-gcm-modus-galois-counter-mode"><h2>AES-GCM Modus (Galois/Counter Mode)</h2><figure class="align-center"><object class="light-image" data="drawings/authentifizierte-verschluesselung/aes_gcm.svg" type="image/svg+xml" role="img" aria-label="drawings/authentifizierte-verschluesselung/aes_gcm.svg"></object><figcaption><p>Authenticated Encryption with Additional Data (AEAD)</p></figcaption></figure><ld-supplemental><ul class="simple"><li><p>Standardisiert durch NIST in SP 800-38D.</p></li><li><p>Es handelt sich um eine Verknüpfung des CTR-Modus und des Galois-Modus. Ziel ist eine hohe Parallelisierung und Effizienz.</p></li><li><p>Der Algorithmus ist in der Lage, Authentizität (+ Integrität) und Vertraulichkeit zu gewährleisten.</p></li><li><p>Die Eingabe in den Algorithmus ist der Klartext (<span class="eng">Plaintext</span>), der Schlüssel, ein Initialisierungsvektor (IV) und zusätzliche (optionale) authentifizierte Daten A.</p></li><li><p>Das Authentication Tag wird mittels Arithmetik über dem Körper GF(2¹²⁸) berechnet und wird am Ende des Chiffretextes angehängt. Es wird das  Polynom: x¹²⁸ + x⁷ + x² + x + 1 verwendet.</p></li><li><p>Die Blockgröße ist 128Bit (d. h. die AES-Blockgröße).</p></li><li><p>H ist der Hash Key:  H = E(K,0¹²⁸) (wobei E die AES-Verschlüsselung ist).</p></li><li><p>mult ist Multiplikation im Körper GF(2¹²⁸).</p></li><li><p>Die optionalen authentifizierten Daten A werden zum Beispiel benötigt, um den Kontext einer Nachricht zu erfassen (und zum Beispiel Replay-Attacken vorzubeugen). Ein konkretes Beispiel könnte die Ziel-IP-Adresse sein, wenn die Nachricht über das Internet übertragen wird.</p></li></ul><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Die Visualisierung stellt nur zwei Schritte dar; eine Erweiterung auf n-Blöcke ist jedoch offensichtlich.</p></aside></ld-supplemental></ld-topic>
