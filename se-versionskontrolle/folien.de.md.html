<ld-topic id="lecture-se-versionskontrolle"><h1 class="title">Software Engineering - Versionskontrolle (mit Git)</h1><p>Eine allererste Einführung</p><dl class="field-list simple"><dt>Dozent<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></p></dd><dt>Kontakt<span class="colon">:</span></dt><dd><p><a class="reference external" href="mailto:michael.eichberg@dhbw.de">michael.eichberg@dhbw.de</a></p></dd><dt>Version<span class="colon">:</span></dt><dd><p>1.0.0.1</p></dd></dl><p>Die Folien basieren in Teilen auf Folien von Dr. Helm und Prof. Dr. Hermann.</p><p>Alle Fehler sind meine eigenen.</p><ld-supplemental><dl class="field-list"><dt>Folien<span class="colon">:</span></dt><dd><p>[HTML] <a class="reference external" href="https://delors.github.io/se-versionskontrolle/folien.de.md.html">https://delors.github.io/se-versionskontrolle/folien.de.md.html</a></p><p>[PDF] <a class="reference external" href="https://delors.github.io/se-versionskontrolle/folien.de.md.html.pdf">https://delors.github.io/se-versionskontrolle/folien.de.md.html.pdf</a></p></dd><dt>Fehler melden<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://github.com/Delors/delors.github.io/issues">https://github.com/Delors/delors.github.io/issues</a></p></dd><dt>Kontrollfragen<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/se-versionskontrolle/kontrollfragen.de.md.html">https://delors.github.io/se-versionskontrolle/kontrollfragen.de.md.html</a></p></dd></dl><dl class="field-list simple"><dt>KI Verwendung<span class="colon">:</span></dt><dd><p>Bei der Erstellung der Unterlagen wurden KI Assistenten (insbesondere Claude
aber ggf. auch ChatGPT, Ollama mit Gemma/LLama/Qwen oder OpenCode mit
Kimi/Qwen/Deepseek...) unterstützend eingesetzt.
Dies erfolgte insbesondere zur Unterstützung bei der Generierung von Grafiken
(d. h. SVG Dateien), oder um sich Übersichtstabellen generieren zu lassen.
Weiterhin wurde KI zur allgemeinen Qualitätssicherung eingesetzt.
Inhalte, die ggf. von der KI vorgeschlagen wurden, wurden im Falle der
Übernahme explizit validiert und angepasst.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-fade" id="versionsmanagement-und-versionskontrollsysteme"><h2>Versionsmanagement und Versionskontrollsysteme</h2></ld-topic>
<ld-topic id="aspekte-der-softwareentwicklung"><h2>Aspekte der Softwareentwicklung</h2><ld-deck><ld-card><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><ld-deck class="numbered"><ld-card><ul class="incremental-list simple"><li><p>Softwareentwicklung ist Teamarbeit</p></li><li><p>Viel (indirekte) Kommunikation nötig</p></li><li><p>Entwicklungswissen muss dokumentiert werden</p></li><li><p>Software besteht aus vielen Dokumenten:</p><ul class="simple"><li><p>Lastenheft</p></li><li><p>Pflichtenheft</p></li><li><p>Analyse- und Designdokument</p></li><li><p>Programmcode (Quellcode, Skripte, Konfigurationsdateien, ...)</p></li><li><p>Testdokumentation</p></li><li><p>Codedokumentation</p></li></ul></li></ul></ld-card><ld-card class="incremental"><ul class="simple"><li><p>Verschiedene Personen greifen (gleichzeitig) auf Dokumente zu</p></li><li><p>Oft bearbeiten verschiedene Personen gleichzeitig (unabhängig voneinander) das selbe Dokument</p></li></ul></ld-card></ld-deck></aside></ld-card><ld-card class="incremental"><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">Versionsmanagement</p><ul class="incremental-list list-with-explanations"><li><p>Wo ist die aktuelle Version?</p></li><li><p>Was ist die zuletzt lauffähige Version?</p></li><li><p>Wo ist die Implementierungsversion vom 01. April 2016?</p><p>Und welche Dokumente beziehen sich auf diese Version?</p></li><li><p>Welche Version wurde dem Kunden präsentiert?</p></li></ul></ld-cell><ld-cell class="incremental" style="align-self:auto;"><p class="rubric">Änderungsmanagement</p><ul class="incremental-list simple"><li><p>Was hat sich seit letzter Woche geändert?</p></li><li><p>Wer hat diese Änderung gemacht?</p></li><li><p>Warum wurde diese Änderung gemacht?</p></li></ul></ld-cell></ld-grid></ld-card><ld-card class="incremental"><p>Einfache „<em>ad-hoc Lösungen</em>“ bei der Entwicklung von Softwareprojekten</p><ul class="simple"><li><p>Austausch der Dokumente via USB-Stick / Festplatte</p></li><li><p>Austausch der Dokumente via Mail</p></li><li><p>Austausch über Netzwerkfestplatte</p></li></ul><p>Zusätzlich müssen dann noch Konventionen und Regeln im Team definiert werden.</p><aside class="admonition incremental" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Just, don't do it!</p></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="unterstutztes-versionsmanagement-motivation"><h2>Unterstütztes Versionsmanagement - Motivation</h2><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><ul class="simple"><li><p>„Einfache Lösungen“ um Versionen zu verwalten erzeugen neue Probleme</p></li><li><p>Konventionen und Regeln werden nicht eingehalten</p></li><li><p>Koordination ist aufwendig und führt zu Verzögerungen</p></li><li><p>Varianten und Konfigurationen werden von Hand verwaltet</p></li><li><p>Versions- und Änderungsfragen nicht bzw. nur schwer beantwortbar</p></li><li><p>Geistige Kapazität wird mit „Kleinkram“ verschwendet</p></li></ul></aside><aside class="admonition incremental" data-theme="conclusion"><p class="admonition-title" data-theme="conclusion-header"><span>Schlussfolgerung</span></p><p>Konventionen müssen technisch erzwungen werden!</p></aside></ld-topic>
<ld-topic id="versionskontrollsysteme-vcs-uberblick"><h2>Versionskontrollsysteme (VCS) - Überblick</h2><ld-deck><ld-card><p class="rubric">Zweck</p><p>Versionskontrollsysteme verwalten mehrere Versionen des Codes.</p><ul class="simple"><li><p>Erlauben es mehreren Personen gleichzeitig am selben Projekt zu arbeiten</p></li><li><p>Änderungen unterschiedlicher Personen werden teil-automatisch integriert</p></li><li><p>Erhält Historie von Änderungen</p></li></ul></ld-card><ld-card class="dd-margin-left-6em incremental"><p class="rubric">Arten</p><dl class="incremental-list field-list"><dt>Zentralisierte VCS<span class="colon">:</span></dt><dd><p>synchronisieren alle Änderungen in einem zentralen Repository (Subversion, ... )</p><aside class="admonition incremental" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Es ist keine Offline-Nutzung möglich.</p></aside></dd><dt>Dezentralisierte VCS<span class="colon">:</span></dt><dd><p>können mehrere, unabhängige Repositories haben (Git, Mercurial, ... )</p><aside class="admonition incremental" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Dezentralisierte VCS (insbesondere Git) sind heute am weitesten verbreitet.</p></aside></dd></dl></ld-card><ld-card class="dd-margin-left-2em incremental"><p class="rubric">Konsistenzmechanismen</p><dl class="field-list simple"><dt>Optimistische Mechanismen<span class="colon">:</span></dt><dd><ul class="simple"><li><p>System erlaubt gleichzeitiges Bearbeiten des Dokuments durch verschiedene Personen</p></li><li><p>System erkennt und integriert die Änderungen (Merging)</p></li><li><p>Evtl. funktioniert das nicht automatisch; dann muss der Konflikt manuell beseitigt werden</p></li></ul></dd><dt>Pessimistische Mechanismen<span class="colon">:</span></dt><dd><ul class="simple"><li><p>System verbietet gleichzeitiges Bearbeiten des Dokuments durch verschiedene Personen (Sperrprotokolle)</p></li></ul></dd></dl><p>Beide Mechanismen haben Vor- und Nachteile</p><ul class="positive-list simple"><li><p>Sperren serialisiert die Arbeit</p></li></ul><ul class="negative-list simple"><li><p>Mergen kann <em>in seltenen Fällen</em> komplex werden und zu Fehlern führen</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic class="new-section transition-fade" id="versionskontrolle-mit-git"><h2>Versionskontrolle mit Git</h2></ld-topic>
<ld-topic id="vcs-git-einfache-verwendung"><h2>VCS - Git - einfache Verwendung</h2><ld-story><div class="compound accentuate"><p class="rubric">Repository auf Server einrichten</p><ol class="arabic simple"><li><p>Git repository einrichten (Beispielsweise über Web-Frontend wie <a class="reference external" href="https://github.com">https://github.com</a>)</p></li><li><p>Lokale Kopie des Remote-repositories „Klonen”: <code class="console"><span class="name function">git</span> clone <span class="operator">&lt;</span>repo-URL<span class="operator">&gt;</span> <span class="punctuation">[</span>lokales Verzeichnis<span class="punctuation">]</span></code></p></li></ol><p class="rubric">Repository lokal anlegen</p><p>In einem beliebigen Verzeichnis: <code class="console"><span class="name function">git</span> init</code></p></div><div class="compound accentuate incremental"><p class="rubric">Datei neu versionieren</p><ol class="arabic"><li><p>Dateien dem Repository hinzufügen</p><p><code class="console"><span class="name function">git</span> <span class="name function">add</span> <span class="operator">&lt;</span>Dateipfade<span class="operator">&gt;</span></code></p><p>Dateien landen dann in der sogenannten „Staging Area“.</p><ld-supplemental><p>Die Staging Area (oder Index) hält alle Änderungen, Hinzufügungen und Löschungen von Dateien, die Teil des nächsten Commits werden sollen.</p></ld-supplemental></li><li><p>gestagete Änderungen committen</p><p><code class="console"><span class="name function">git</span> ci</code></p><p>Dies fügt die Änderungen dem lokalen Repository hinzu.</p></li></ol></div></ld-story></ld-topic>

<ld-topic id="vcs-git-commits"><h2>VCS - Git - Commits</h2><p class="rubric">Commits beschreiben eine atomare Änderung des Codes</p><ul class="simple"><li><p>Hashcode, um den Commit zu identifizieren</p></li><li><p>Autor und Zeit des Commits</p></li><li><p>Beschreibung der Änderung</p></li><li><p>Änderung als Diff: Hinzugefügte und entferne Zeilen je Datei</p></li></ul></ld-topic>
<ld-topic id="vcs-git-hilfreiches"><h2>VCS - Git - Hilfreiches</h2><ld-deck><ld-card><p class="rubric">Zwischenspeichern von Änderungen</p><p>Aktuelle Änderungen zwischenspeichern und Working Copy resetten:</p><p><code class="console"><span class="name function">git</span> stash</code></p><p>Hilfreich z. B. wenn man vergessen hat, Änderungen von <em>Remote</em> zu pullen.
Ein pull könnte lokale Änderungen überschreiben, mit <code class="console"><span class="name function">git</span> stash</code> werden diese Änderungen aber zunächst sicher beiseite gelegt.</p><p>Änderungen vom <em>Stash</em> in <em>Working Copy</em> zurückspielen:</p><p><code class="console"><span class="name function">git</span> stash pop</code></p></ld-card><ld-card class="incremental"><p class="rubric">Änderungen in der Working Copy zurücksetzen</p><p><code class="console"><span class="name function">git</span> reset <span class="name variable">--hard</span></code></p><p>Setzt alle Änderungen in der Working Copy auf den letzten Commit zurück (z. B. nach einem „Fehlversuch“).</p></ld-card><ld-card class="incremental"><p class="rubric">Metadaten setzen</p><p>Username und Emailadresse als Metadaten für Commits setzen:</p><p><code class="console"><span class="name function">git</span> config user.name <span class="operator">&lt;</span>name<span class="operator">&gt;</span></code></p><p><code class="console"><span class="name function">git</span> config user.email <span class="operator">&lt;</span>e-mail<span class="operator">&gt;</span></code></p></ld-card></ld-deck></ld-topic>

<ld-topic id="git-flow"><h2>Git-Flow</h2><p>Git-Flow ist eine Konvention zur Nutzung von Branches in einer sinnvollen Art und Weise.<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></p><p>Mindestens fünf Arten von Branches:</p><dl class="incremental-list field-list simple"><dt>main<span class="colon">:</span></dt><dd><p>enthält stets die zuletzt veröffentlichte Version</p></dd><dt>develop<span class="colon">:</span></dt><dd><p>enthält aktuelle Entwicklungsversion</p></dd><dt>feature/topic branches<span class="colon">:</span></dt><dd><p>zur Entwicklung individueller Features</p></dd><dt>hotfix branches<span class="colon">:</span></dt><dd><p>zur Implementierung dringender Bugfixes</p></dd><dt>release branches<span class="colon">:</span></dt><dd><p>zum Vorbereiten eines Releases</p></dd></dl><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Erstmals dokumentiert durch Vincent Driessen <a class="reference external" href="http://nvie.com/posts/a-successful-git-branching-model/">http://nvie.com/posts/a-successful-git-branching-model/</a></p></aside></aside></ld-topic>

<ld-topic id="git-befehle"><h2>GIT Befehle</h2><ul class="incremental-list simple"><li><p>Erstellen eines neuen lokalen Repositories: <code class="console"><span class="name function">git</span> init</code></p></li><li><p>Lokalen Klon von entferntem Repositories anlegen: <code class="console"><span class="name function">git</span> clone <span class="operator">&lt;</span>Repository-URL<span class="operator">&gt;</span></code></p></li><li><p>Geänderte Dateien anzeigen: <code class="console"><span class="name function">git</span> status</code></p></li><li><p>Zeilenweise Änderungen anzeigen: <code class="console"><span class="name function">git</span> <span class="name function">diff</span> <span class="punctuation">(</span><span class="operator">&lt;</span>Datei-Pfad<span class="operator">&gt;</span><span class="punctuation">)</span></code></p></li><li><p>Änderungshistorie ansehen: <code class="console"><span class="name function">git</span> log</code></p></li><li><p>Commit ansehen: <code class="console"><span class="name function">git</span> show <span class="operator">&lt;</span>Commit-Hash<span class="operator">&gt;</span></code></p></li><li><p>Dateien dem nächsten Commit hinzufügen: <code class="console"><span class="name function">git</span> <span class="name function">add</span> <span class="punctuation">(</span>--all<span class="operator">|</span><span class="operator">&lt;</span>Datei-Pfad<span class="operator">&gt;</span><span class="punctuation">)</span></code></p></li><li><p>Commit anlegen: <code class="console"><span class="name function">git</span> commit <span class="punctuation">(</span>-m <span class="literal string">" &lt;Beschreibung&gt;"</span><span class="punctuation">)</span></code></p></li><li><p>Neuen Branch anlegen: <code class="console"><span class="name function">git</span> checkout <span class="name variable">-b</span> <span class="operator">&lt;</span>Branch-Name<span class="operator">&gt;</span></code></p></li><li><p>Aktuellen Branch wechseln: <code class="console"><span class="name function">git</span> checkout <span class="operator">&lt;</span>Branch-Name<span class="operator">&gt;</span></code></p></li><li><p>Commits eines anderen in den aktuellen ziehen: <code class="console"><span class="name function">git</span> merge <span class="operator">&lt;</span>Branch-Name<span class="operator">&gt;</span></code></p></li><li><p>Commits vom entfernten zum lokalen Repository holen: <code class="console"><span class="name function">git</span> fetch</code></p></li><li><p>Commits vom lokalen zum entfernten Repository schieben: <code class="console"><span class="name function">git</span> push</code></p></li><li><p>Kombination von <code class="console"><span class="name function">git</span> fetch</code> und <code class="console"><span class="name function">git</span> merge</code>: <code class="console"><span class="name function">git</span> pull</code></p></li></ul></ld-topic>
<ld-topic id="gitignore"><h2><a class="reference external" href="https://git-scm.com/docs/gitignore">.gitignore</a></h2><p>Die Datei .gitignore listet alle Arten von Dateien und Verzeichnissen auf, die von Git ignoriert werden sollen. Dies sind typischerweise alle Artefakte, die automatische generiert werden als Teil des Entwicklungsprozesses.</p><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><ul class="incremental-list simple"><li><p>Kommentare beginnen mit #</p></li><li><p>Leerzeilen sind erlaubt</p></li><li><p>jede nicht-leere Zeile, die kein Kommentar ist, beschreibt ein Muster</p></li><li><p>Wildcards (*) sind erlaubt</p></li><li><p>! am Anfang negiert ein Muster</p></li><li><p>"/" separiert Verzeichnisse</p></li></ul></ld-cell><ld-cell class="incremental" style="align-self:auto;"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code unixconfig literal-block"><small class="ln">1</small><code data-lineno="1">*.bak
</code><small class="ln">2</small><code data-lineno="2">*.class
</code><small class="ln">3</small><code data-lineno="3">*.jar
</code><small class="ln">4</small><code data-lineno="4">target/
</code><small class="ln">5</small><code data-lineno="5">
</code><small class="ln">6</small><code data-lineno="6"># "Editors"
</code><small class="ln">7</small><code data-lineno="7">.vscode/

<ld-topic class="exercises" id="ubung"><h2>Übung</h2><ld-story><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Eine erste Übung mit GIT"><p class="ld-exercise-title rubric"><span>Eine erste Übung mit GIT</span></p><p>Installieren Sie Git auf Ihrem System, falls es nicht verfügbar sein sollte.</p><ol class="arabic incremental-list list-with-explanations simple"><li><p>Erstellen Sie ein neues Verzeichnis und legen Sie darin ein neues lokales Repository mit Hilfe von <code class="console"><span class="name function">git</span> init</code> an.</p></li><li><p>Entpacken Sie die Datei <a class="reference external" href="https://delors.github.io/se-versionskontrolle/exercise/RPN.zip">https://delors.github.io/se-versionskontrolle/exercise/RPN.zip</a> in dem Verzeichnis.</p></li><li><p>Führen Sie einen initialen Commit durch mit Hilfe von <code class="console"><span class="name function">git</span> <span class="name function">add</span></code> und <code class="console"><span class="name function">git</span> commit</code>.</p></li><li><p>Compilieren Sie die Sourcen mit <code class="console">javac</code>.</p></li><li><p>Legen Sie eine <span class="docutils literal">.gitignore</span> Datei an, um sicherzustellen, dass die Binärdateien nicht in das Repository gelangen.</p></li><li><p>Nutzen Sie <code class="console"><span class="name function">git</span> status</code>, um sich zu vergewissern, dass die Binärdateien ignoriert werden.</p></li><li><p>fügen Sie die <span class="docutils literal">.gitignore</span> Datei Ihrem Repository hinzu.</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:SQlFV3FXbLroiI4LWscEhRoIE2/7bcG8VIBZ9weLIU4=:912LgmkPKvcbSKmO:j74eMNdCjl62K1vzOQ8d3Nbn+8bU0LSSyeUCMySc/NpEWGbF4yA8D0F9UcGCggj8IhJzwkisPnyZfOhCofV/35TZkfoPYN6GlwmN4TpWavIjSZZQZ5TXKfasABg9NZe77PUqM/xGXevqIFuuewnm5S2/i49HpoWtCgmsA6WN++SewsmxfwvGnIW8oZIQ2zOa3gIxfwFZzvjp6ajE+owcDQ6yACevGFwoxWSyKj847F74GaSJK4ZHMZpPmvfP83fCj8QnAE2WUME <ld-topic class="exercises" id="ubung-1"><h2>Übung</h2><ld-story><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Branching mit GIT"><p class="ld-exercise-title rubric"><span>Branching mit GIT</span></p><ol class="arabic"><li><p>Erstellen Sie einen neuen Branch mit dem Namen <span class="docutils literal">feature/bugfix</span> und wechseln Sie auf den neuen Branch.</p><p>(Nutzen Sie <span class="docutils literal">git status</span>, um zu verifizieren, dass Sie auf dem neuen Branch sind)</p></li><li><p>Ändern Sie die Datei <span class="docutils literal">RPN.java</span>, um den Bug im Switch statement (<code class="java"><span class="keyword">case</span> <span class="literal string">"* "</span></code> => <code class="java"><span class="keyword">case</span> <span class="literal string">"*"</span></code>) zu beheben.</p></li><li><p>Committen Sie die Änderungen.</p></li><li><p>Wechseln Sie zurück auf den <span class="docutils literal">main</span> Branch.</p></li><li><p>Mergen Sie den Branch <span class="docutils literal">feature/bugfix</span> in den <span class="docutils literal">main</span> Branch mit Hilfe von <code class="console"><span class="name function">git</span> merge</code>.</p></li><li><p>Löschen Sie den Branch <span class="docutils literal">feature/bugfix</span> mit Hilfe von <code class="console"><span class="name function">git</span> branch <span class="name variable">-d</span></code>.</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:yINwMWwDZXBNYpWgULcabGwFAAwFhz61/9rQPfQKO28=:sqIyVGszVoDd7GpL:qr9SmM3n87oqs4TuGHoKy1kt59DlYFMTg3Ah8l9A/2MAq+oUCE/02fX0Ho3qmplg6ZVs7RiyGD+IDJ4OcTR0Anqcurffr46bxsZBRAAnFlFNUezNuV10WJz+pfcub+MvUMmT9cxoXnEKWC9oVNelYujYwAm9K8ATKMzPiL1I8/o5jrpX6TpDbYu0hpy1V6wU3JRoeIi/EZXu5K5pJXtmbE4YM8vDvBP3TmK7bm+x/yVb8j42HohGJY8k549uqqfh0IvBJaKVKj1G4f/8iqA8uHzR6zOzroachcUVjYb0fLnY6H/P5ZM3Si7N8UKDhiw=</div></div></ld-story></ld-topic>
<ld-topic class="exercises" id="ubung-2"><h2>Übung</h2><ld-story><div class="ld-exercise" id="ld-exercise-3" data-exercise-id="3" data-exercise-title="3 - Merging mit GIT"><p class="ld-exercise-title rubric"><span>Merging mit GIT</span></p><ol class="arabic"><li><p>Erstellen Sie einen neuen Branch develop und wechseln Sie auf diesen Branch.</p></li><li><p>Ändern Sie die Reihenfolge der Methoden <code class="java">pop</code> und <code class="java">peek</code> in der Klasse <code class="java"><span class="name class">Stack</span></code>.</p></li><li><p>Committen Sie die Änderungen.</p></li><li><p>Wechseln Sie zurück auf den <span class="docutils literal">main</span> Branch.</p><p><em>(Führen Sie noch keinen Merge durch!)</em></p></li><li><p>Entfernen Sie die <span class="docutils literal">{}</span> Klammern um die <code class="java"><span class="keyword">throw</span> <span class="keyword">new</span> <span class="name class">NoSuchElementException</span><span class="punctuation">(</span><span class="punctuation">)</span></code> Anweisungen.</p></li><li><p>Committen Sie die Änderungen.</p></li><li><p>Führen Sie einen Merge von <span class="docutils literal">develop</span> in <span class="docutils literal">main</span> durch.</p></li><li><p>Öffnen Sie die Datei <span class="docutils literal">ds/Stack.java</span> und beheben Sie den Merge-Konflikt.</p></li><li><p>Committen Sie die Änderungen.</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:MyppeYFvLI5IE0JQxmJVyXnt9sWUJW4TwmL7/dfTksw=:tGOCswPbSCOLvzcW:NoWOHWLqjwPWOjzzPO1p5/pfWrnDVq8v5Yb7Cs9OS8tZdmSwBcYslTPU9pDmpoTgZVmbC0nEvilgv7YTZvPL98zyOkZ5e9EU8w3u/moMPY7RO7XP34Dgwryes7udPNfXErHycYV8tNVBUGiaZci2hFOt8gqQGMZALBjwaVarq9G5fp2yTwI9w6geUwA3T1a8XKD+ZDf5sYkIkaONj669xe8EARbc42nINMpuzx6KY6FpU+cqIw5VyOLyPDdMEGbeLC3BRgQik3W4XXt46pHArJ2k1tAgLSBd1Boo4VBjcwJjOM+H+feo3mwzcTTpVecdvV1T3yJDY1fLdzjoNxaBEKWd0rczhlUG/oKViclUkBWllkiGuyD9m/rqbabNyZEROtyGm5xovX9gwFVlyL0TocqOgVsLAtgzVqIkSJ03FYuGac/ULel8TlpszWIw7QHqsfw
