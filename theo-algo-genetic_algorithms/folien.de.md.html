<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>

<ld-topic class="new-section transition-move-to-top" id="einfuhrung"><h2>Einführung</h2></ld-topic>
<ld-topic id="genetische-algorithmen-1"><h2>Genetische Algorithmen</h2><ul class="incremental-list list-with-explanations"><li><p>werden eingesetzt, wenn traditionelle Algorithmen nicht geeignet sind oder keine offensichtlichen Algorithmen existieren</p><p>Z. B. im Bereich des Wirkstoffdesigns oder der Optimierung von Produktionsprozessen.</p></li><li><p>benötigen im Prinzip nur eine Definition des Aufgabenziels</p></li><li><p><span class="peripheral">(Implementierungen)</span> sind in der Regel hochgradig spezialisiert; hier diskutieren wir eine allgemeine/generische Implementierung</p></li></ul></ld-topic>
<ld-topic id="biologische-grundlagen"><h2>(Biologische) Grundlagen</h2><ul class="incremental-list"><li><p>Genetische Algorithmen basieren auf der Evolutionstheorie:</p><dl class="dd-margin-left-10em field-list simple"><dt>Selektion<span class="colon">:</span></dt><dd><p>die besten Individuen überleben</p></dd><dt>Mutation<span class="colon">:</span></dt><dd><p>zufällige Veränderungen</p></dd><dt>Rekombination<span class="colon">:</span></dt><dd><p>Kreuzung von Individuen</p></dd></dl></li><li><p>Terminologie:</p><dl class="dd-margin-left-10em field-list simple"><dt>Population<span class="colon">:</span></dt><dd><p>Menge von Individuen, die auch Chromosomen genannt werden und Lösungskandidaten repräsentieren</p></dd><dt>Chromosomen<span class="colon">:</span></dt><dd><p>Lösungskandidaten oder auch Individuen, die aus Genen bestehen</p></dd><dt><span class="peripheral">Gene</span><span class="colon">:</span></dt><dd><p><span class="peripheral">Eigenschaften eines Lösungskandidaten</span></p></dd><dt>Fitness(-Funktion)<span class="colon">:</span></dt><dd><p>Bewertung eines Chromosoms ( Lösungskandidaten)</p></dd></dl></li></ul><ld-supplemental><p>D. h. auf der natürlichen Auslese und der Vererbung von Eigenschaften. Ein Individuum, das besser an die Umwelt angepasst ist, hat eine höhere Wahrscheinlichkeit, sich fortzupflanzen und seine Gene weiterzugeben. Schlechter angepasste Individuen sterben aus.</p><p>Klassisches Beispiel ist die Entwicklung von Resistenzen gegen Antibiotika bei Bakterien.</p></ld-supplemental></ld-topic>
<ld-topic id="grundidee"><h2>Grundidee</h2><ul class="incremental-list simple"><li><p>ein genetischer Algorithmus durchläuft Generationen</p></li><li><p>In jeder Generation werden die Individuen/Chromosomen bewertet und die besser angepassten Individuen (solche die <em>fitter</em> sind) mit einer höheren Wahrscheinlichkeit zum Überleben und zur Fortpflanzung ausgewählt</p></li><li><p>in jeder Generation werden die Individuen mit gewissen Wahrscheinlichkeiten:</p><ol class="arabic simple"><li><p>rekombiniert (<code class="java">crossover</code> von zwei Chromosomen) und</p></li><li><p>mutiert (<code class="java">mutate</code>)</p></li></ol></li></ul><aside class="admonition incremental margin-top-1em" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Genetische Algorithmen sind somit stochastische Algorithmen, d. h. sie liefern nicht immer das gleiche Ergebnis in der gleichen Zeitspanne und es gibt keine Garantie, dass sie das beste Ergebnis finden.</p></aside><ld-supplemental><p>Genetische Algorithmen sind eine gute Wahl, wenn es keinen schnellen deterministischen Algorithmus gibt.</p></ld-supplemental></ld-topic>
<ld-topic class="new-section transition-move-to-top" id="grundlegendes-framework-in-python"><h2>Grundlegendes Framework in Python</h2></ld-topic>
<ld-topic id="basisklasse-fur-chromosomen"><h2>Basisklasse für Chromosomen</h2><pre class="code python literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">class</span> <span class="name class">Chromosome</span><span class="punctuation">(</span>ABC<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="name decorator">@abstractmethod</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="keyword">def</span> <span class="name function">fitness</span><span class="punctuation">(</span>self<span class="punctuation">)</span> <span class="operator">-</span><span class="operator">&gt;</span> <span class="name builtin">float</span><span class="punctuation">:</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">        <span class="keyword">raise</span> NotImplementedError
</code><small class="ln"> 5</small><code data-lineno=" 5">
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="name decorator">@classmethod</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="name decorator">@abstractmethod</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="keyword">def</span> <span class="name function">random_instance</span><span class="punctuation">(</span>cls<span class="punctuation">:</span> Type<span class="punctuation">[</span>T<span class="punctuation">]</span><span class="punctuation">)</span> <span class="operator">-</span><span class="operator">&gt;</span> T<span class="punctuation">:</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">        <span class="keyword">raise</span> NotImplementedError
</code><small class="ln">10</small><code data-lineno="10">
</code><small class="ln">11</small><code data-lineno="11">    <span class="name decorator">@abstractmethod</span>
</code><small class="ln">12</small><code data-lineno="12">    <span class="keyword">def</span> <span class="name function">crossover</span><span class="punctuation">(</span>self<span class="punctuation">:</span> T<span class="punctuation">,</span> other<span class="punctuation">:</span> T<span class="punctuation">)</span> <span class="operator">-</span><span class="operator">&gt;</span> <span class="name builtin">tuple</span><span class="punctuation">[</span>T<span class="punctuation">,</span> T<span class="punctuation">]</span><span class="punctuation">:</span>
</code><small class="ln">13</small><code data-lineno="13">        <span class="keyword">raise</span> NotImplementedError
</code><small class="ln">14</small><code data-lineno="14">

</code><small class="ln">16</small><code data-lineno="16">    <span class="keyword">def</span> <span class="name function">mutate</span><span class="punctuation">(</span>self<span class="punctuation">)</span> <span class="operator">-</span><span class="operator">&gt;</span> <span class="keyword constant">None</span><span class="punctuation">:</span>
</code><small class="ln">17</small><code data-lineno="17">        <span class="keyword">raise</span> NotImplementedError</code></pre><ld-supplemental><p>Die Basisklasse für Chromosomen (<a class="reference external" href="https://delors.github.io/theo-algo-genetic_algorithms/code/lib/chromosome.py">https://delors.github.io/theo-algo-genetic_algorithms/code/lib/chromosome.py</a>) definiert die Methoden, die jedes Chromosom implementieren muss: Eine Klassenmethode zum Erzeugen einer zufälligen Instanz (<code class="python">random_instance</code>), und Instanzmethoden zum Mutieren einer Instanz (<code class="python">mutate</code>), zum Kreuzen einer Instanz mit einer anderen (<code class="python">crossover</code>) und schließlich zur Bewertung eines Chromosoms (<code class="python">fitness</code>).</p><dl class="field-list simple"><dt><code class="python">mutate</code><span class="colon">:</span></dt><dd><p>führt eine kleine zufällige Änderung (an den Genen) durch</p></dd><dt><code class="python">crossover</code><span class="colon">:</span></dt><dd><p>kombiniert zwei Chromosomen zu einem neuen Chromosom; d. h. mischt zwei Lösungen</p></dd><dt><code class="python">fitness</code><span class="colon">:</span></dt><dd><p>bewertet die eigene Fitness</p></dd><dt><code class="python">random_instance</code><span class="colon">:</span></dt><dd><p>erzeugt eine zufällige Instanz; wird nur einmal am Anfang benötigt, um die Population zu initialisieren</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic id="ablauf-von-genetischen-algorithmen"><h2>Ablauf von genetischen Algorithmen</h2><ol class="arabic simple"><li><p>Erzeugen einer zufälligen Population</p></li></ol><ol class="arabic incremental-list simple" start="2"><li><p>Miss die <em>Fitness</em> der Individuen, wenn einer den Zielwert erreicht, beende den Algorithmus und gib das Individuum zurück</p></li><li><p>Wähle einige Individuen aus, die sich fortpflanzen - bevorzuge die Fitteren mit einer höheren Wahrscheinlichkeit</p></li><li><p>Kombiniere die ausgewählten Individuen, um neue Individuen zu erzeugen</p></li><li><p>Mutiere einige Individuen, um die neue Generation zu vervollständigen</p></li></ol><ol class="arabic incremental-list simple" start="6"><li><p>Wiederhole die Schritte 2-5 für eine bestimmte Anzahl von Generationen</p></li></ol></ld-topic>
<ld-topic id="parameter-von-genetischen-algorithmen"><h2>Parameter von genetischen Algorithmen</h2><ul class="incremental-list simple"><li><p>Größe der Population</p></li><li><p>Design der ersten Population (rein zufällig oder basierend auf einer Heuristik)</p></li><li><p>Wahl des Schwellenwertes, der angibt, wann der Algorithmus beendet wird</p></li><li><p>Auswahl der Chromosomen, die sich fortpflanzen</p></li><li><p>Wie und mit welcher Wahrscheinlichkeit die Rekombination erfolgt (<code class="java">crossover</code>)</p></li><li><p>Wie und mit welcher Wahrscheinlichkeit eine Mutation erfolgt (<code class="java">mutate</code>)</p></li><li><p>Wie viele Generationen max. durchlaufen werden</p></li></ul><ld-supplemental><p>Es gibt zwei typische Strategien zur Auswahl der Chromosomen, die sich fortpflanzen: die <em>Tournament Selection</em> und die <em>Roulette Wheel Selection</em>.</p></ld-supplemental></ld-topic>
<ld-topic id="selektionsstrategien-von-chromosomen"><h2>Selektionsstrategien von Chromosomen</h2><p class="rubric">Bestimmung der Chromosomen, die überleben und sich ggf. fortpflanzen.</p><ld-story><p class="rubric">Auswahlstrategien</p><dl class="incremental-list dd-margin-left-4em field-list"><dt><em>Tournament Selection</em><span class="colon">:</span></dt><dd><p>Wähle zufällig einige Chromosomen aus und wähle das beste(/die besten) Chromosom(en) aus dieser Gruppe:</p><pre class="code python literal-block"><small class="ln">1</small><code data-lineno="1">    <span class="keyword">def</span> <span class="name function">_pick_tournament</span><span class="punctuation">(</span>

</code><small class="ln">82</small><code data-lineno="82">                    self<span class="punctuation">.</span>_pick_tournament<span class="punctuation">(</span><span class="name builtin">len</span><span class="punctuation">(</span>self<span class="punctuation">.</span>_population<span class="punctuation">)</span> <span class="operator">//</span> <span class="literal number integer">2</span><span class="punctuation">)</span></code></pre></ld-card></ld-deck></ld-topic>
<ld-topic id="herausforderungen-bei-der-entwicklung-genetischer-algorithmen"><h2>Herausforderungen bei der Entwicklung genetischer Algorithmen</h2><ol class="arabic incremental-list dhbw simple"><li><p>eine passende Formulierung für das Problem zu entwickeln und</p></li><li><p>danach die Parameter so zu wählen, dass der Algorithmus in einer akzeptablen Zeit eine gute Lösung findet.</p></li></ol></ld-topic>
<ld-topic class="new-section transition-move-to-top" id="beispiel-send-more-money"><h2>Beispiel: SEND + MORE = MONEY</h2></ld-topic>
<ld-topic id="send-more-money"><h2>SEND+MORE=MONEY<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></h2><ul><li><p>Klassisches Problem der Kryptographie</p></li><li><p>Jeder Buchstabe repräsentiert eine Ziffer von 0 bis 9</p></li><li><p>Keine Ziffer darf doppelt vorkommen</p><pre class="literal-block"><code>  S E N D
+ M O R E
---------
M O N E Y</code></pre></li><li><p>Welcher Buchstabe steht für welchen Wert?</p></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>Wir verwenden hier das Beispiel lediglich zur Demonstration der Technik. Das Problem kann auch anders gelöst werden!</p></aside></aside></ld-topic>
<ld-topic id="send-more-money-umsetzung"><h2>SEND+MORE=MONEY - Umsetzung</h2><ld-deck><ld-card><p class="rubric">Chromosomen ermöglichen Zuordnung von Buchstaben zu Ziffern</p><p><strong>Idee</strong>: Verwendung von Listenindizes zur Repräsentation der Ziffern: [0,...,9]. Die Werte in der Liste entsprechen den Buchstaben; Beispiel:</p><p><em>Zuordnung von Ziffern zu Buchstaben:</em></p><table class="monospaced align-center" style="width: 100%;"><colgroup><col style="width: 20.0%"><col style="width: 8.0%"><col style="width: 8.0%"><col style="width: 8.0%"><col style="width: 8.0%"><col style="width: 8.0%"><col style="width: 8.0%"><col style="width: 8.0%"><col style="width: 8.0%"><col style="width: 8.0%"><col style="width: 8.0%"></colgroup><thead><tr><th class="stub head"><p>Index:</p></th><th class="head"><p>0</p></th><th class="head"><p>1</p></th><th class="head"><p>2</p></th><th class="head"><p>3</p></th><th class="head"><p>4</p></th><th class="head"><p>5</p></th><th class="head"><p>6</p></th><th class="head"><p>7</p></th><th class="head"><p>8</p></th><th class="head"><p>9</p></th></tr></thead><tbody><tr><th class="stub"><p>letters</p></th><td><p>O</p></td><td><p>M</p></td><td><p>Y</p></td><td><p>␣</p></td><td><p>␣</p></td><td><p>E</p></td><td><p>N</p></td><td><p>D</p></td><td><p>R</p></td><td><p>S</p></td></tr></tbody></table><div class="minor smaller line-above"><p><em>Für die Lösung würde sich ergeben:</em></p><table class="no-table-borders"><colgroup><col style="width: 10.0%"><col style="width: 10.0%"><col style="width: 10.0%"><col style="width: 10.0%"><col style="width: 10.0%"><col style="width: 10.0%"><col style="width: 10.0%"><col style="width: 10.0%"><col style="width: 10.0%"><col style="width: 10.0%"></colgroup><thead><tr><th class="head"><p>S</p></th><th class="head"><p>E</p></th><th class="head"><p>N</p></th><th class="head"><p>D</p></th><th class="head"><p>M</p></th><th class="head"><p>O</p></th><th class="head"><p>R</p></th><th class="head"><p>Y</p></th><th class="head"><p>␣</p></th><th class="head"><p>␣</p></th></tr></thead><tbody><tr><td><p>9</p></td><td><p>5</p></td><td><p>6</p></td><td><p>7</p></td><td><p>1</p></td><td><p>0</p></td><td><p>8</p></td><td><p>2</p></td><td><p>3</p></td><td><p>4</p></td></tr></tbody></table></div><div class="incremental"><p>Somit kann durch die Verschiebung der Buchstaben in der Liste der assoziierte Wert geändert werden.</p></div></ld-card><ld-card class="incremental"><p class="rubric">Klasse für Chromosomen</p><pre class="code python literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">class</span> <span class="name class">SendMoreMoney</span><span class="punctuation">(</span>Chromosome<span class="punctuation">)</span><span class="punctuation">:</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="keyword">def</span> <span class="name function">__init__</span><span class="punctuation">(</span>self<span class="punctuation">,</span> letters<span class="punctuation">:</span> <span class="name builtin">list</span><span class="punctuation">[</span><span class="name builtin">str</span><span class="punctuation">]</span><span class="punctuation">)</span> <span class="operator">-</span><span class="operator">&gt;</span> <span class="keyword constant">None</span><span class="punctuation">:</span>
</code><small class="ln">3</small><code data-lineno="3">        self<span class="punctuation">.</span>letters<span class="punctuation">:</span> <span class="name builtin">list</span><span class="punctuation">[</span><span class="name builtin">str</span><span class="punctuation">]</span> <span class="operator">=</span> letters
</code><small class="ln">4</small><code data-lineno="4"></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Erzeugen von Individuen bzw. Chromosomen</p><p><strong>Idee</strong>: beliebige Verwürfelung der Buchstaben in der Liste.</p><pre class="code python literal-block"><small class="ln">1</small><code data-lineno="1">    <span class="keyword">def</span> <span class="name function">random_instance</span><span class="punctuation">(</span>cls<span class="punctuation">)</span> <span class="operator">-</span><span class="operator">&gt;</span> Self<span class="punctuation">:</span>
</code><small class="ln">2</small><code data-lineno="2">        letters <span class="operator">=</span> <span class="punctuation">[</span> 
</code><small class="ln">3</small><code data-lineno="3">            <span class="literal string">"S"</span><span class="punctuation">,</span> <span class="literal string">"E"</span><span class="punctuation">,</span> <span class="literal string">"N"</span><span class="punctuation">,</span> <span class="literal string">"D"</span><span class="punctuation">,</span> <span class="literal string">"M"</span><span class="punctuation">,</span> <span class="literal string">"O"</span><span class="punctuation">,</span> <span class="literal string">"R"</span><span class="punctuation">,</span> <span class="literal string">"Y"</span><span class="punctuation">,</span> 
</code><small class="ln">4</small><code data-lineno="4">            <span class="literal string">" "</span><span class="punctuation">,</span> <span class="literal string">" "</span><span class="punctuation">]</span>
</code><small class="ln">5</small><code data-lineno="5">        shuffle<span class="punctuation">(</span>letters<span class="punctuation">)</span>
</code><small class="ln">6</small><code data-lineno="6">        <span class="keyword">return</span> SendMoreMoney<span class="punctuation">(</span>letters<span class="punctuation">)</span>
</code><small class="ln">7</small><code data-lineno="7"></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Mutation eines Chromosoms</p><p><strong>Idee</strong>: zufälliger paarweiser Austausch von zwei Buchstaben in der Liste.</p><pre class="code python literal-block"><small class="ln">1</small><code data-lineno="1">    <span class="keyword">def</span> <span class="name function">mutate</span><span class="punctuation">(</span>self<span class="punctuation">)</span> <span class="operator">-</span><span class="operator">&gt;</span> <span class="keyword constant">None</span><span class="punctuation">:</span> <span class="comment single"># swap two letters' locations</span>
</code><small class="ln">2</small><code data-lineno="2">        idx1<span class="punctuation">,</span> idx2 <span class="operator">=</span> sample<span class="punctuation">(</span><span class="name builtin">range</span><span class="punctuation">(</span><span class="name builtin">len</span><span class="punctuation">(</span>self<span class="punctuation">.</span>letters<span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">,</span> k<span class="operator">=</span><span class="literal number integer">2</span><span class="punctuation">)</span>
</code><small class="ln">3</small><code data-lineno="3">        self<span class="punctuation">.</span>letters<span class="punctuation">[</span>idx1<span class="punctuation">]</span><span class="punctuation">,</span> self<span class="punctuation">.</span>letters<span class="punctuation">[</span>idx2<span class="punctuation">]</span> <span class="operator">=</span> \
</code><small class="ln">4</small><code data-lineno="4">            self<span class="punctuation">.</span>letters<span class="punctuation">[</span>idx2<span class="punctuation">]</span><span class="punctuation">,</span> self<span class="punctuation">.</span>letters<span class="punctuation">[</span>idx1<span class="punctuation">]</span>
</code><small class="ln">5</small><code data-lineno="5"></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Vererbung</p><p><strong>Idee</strong>: pro Nachkommen sicherstellen, dass einige Buchstaben Indizes (d. h. Wertzuordnungen) von einem Elternteil und einige vom anderen Elternteil stammen.</p><div><p><strong>Beispiel</strong> (verkürzt):</p><pre class="literal-block"><code>Elternteil 1 = [a,b,c,d,e]  # d.h. ein Chromosom
Elternteil 2 = [c,a,b,e,d]  # d.h. ein Chromosom</code></pre><p>gewählte Indizes seien: 0 und 2</p><div><pre class="literal-block"><code>Nachkomme 1 = [a,c,b,d,e]  # im Wesentlichen Elternteil 1,
                             aber Position von "b" vom 2ten übernommen
                             (dadurch Anpassung der Pos. von "c" notw.)
Nachkomme 2 = [a,c,b,e,d]  # im Wesentlichen Elternteil 2,
                             aber Position von "a" vom 1ten übernommen
                             (dadurch Anpassung der Pos. von "c" notw.)</code></pre></div></div></ld-card><ld-card class="incremental"><p class="rubric">Vererbung - Implementierung</p><pre class="code python literal-block"><small class="ln"> 1</small><code data-lineno=" 1">    <span class="keyword">def</span> <span class="name function">crossover</span><span class="punctuation">(</span>self<span class="punctuation">,</span> other<span class="punctuation">:</span> Self<span class="punctuation">)</span> <span class="operator">-</span><span class="operator">&gt;</span> <span class="name builtin">tuple</span><span class="punctuation">[</span>Self<span class="punctuation">,</span> Self<span class="punctuation">]</span><span class="punctuation">:</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">        child1<span class="punctuation">:</span> SendMoreMoney <span class="operator">=</span> deepcopy<span class="punctuation">(</span>self<span class="punctuation">)</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">        child2<span class="punctuation">:</span> SendMoreMoney <span class="operator">=</span> deepcopy<span class="punctuation">(</span>other<span class="punctuation">)</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">        idx1<span class="punctuation">,</span> idx2 <span class="operator">=</span> sample<span class="punctuation">(</span><span class="name builtin">range</span><span class="punctuation">(</span><span class="name builtin">len</span><span class="punctuation">(</span>self<span class="punctuation">.</span>letters<span class="punctuation">)</span><span class="punctuation">)</span><span class="punctuation">,</span> k<span class="operator">=</span><span class="literal number integer">2</span><span class="punctuation">)</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">        l1<span class="punctuation">,</span> l2 <span class="operator">=</span> child1<span class="punctuation">.</span>letters<span class="punctuation">[</span>idx1<span class="punctuation">]</span><span class="punctuation">,</span> child2<span class="punctuation">.</span>letters<span class="punctuation">[</span>idx2<span class="punctuation">]</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        child1<span class="punctuation">.</span>letters<span class="punctuation">[</span>child1<span class="punctuation">.</span>letters<span class="punctuation">.</span>index<span class="punctuation">(</span>l2<span class="punctuation">)</span><span class="punctuation">]</span><span class="punctuation">,</span> \
</code><small class="ln"> 7</small><code data-lineno=" 7">        child1<span class="punctuation">.</span>letters<span class="punctuation">[</span>idx2<span class="punctuation">]</span> <span class="operator">=</span> \
</code><small class="ln"> 8</small><code data-lineno=" 8">            child1<span class="punctuation">.</span>letters<span class="punctuation">[</span>idx2<span class="punctuation">]</span><span class="punctuation">,</span> l2
</code><small class="ln"> 9</small><code data-lineno=" 9">        
</code><small class="ln">10</small><code data-lineno="10">        child2<span class="punctuation">.</span>letters<span class="punctuation">[</span>child2<span class="punctuation">.</span>letters<span class="punctuation">.</span>index<span class="punctuation">(</span>l1<span class="punctuation">)</span><span class="punctuation">]</span><span class="punctuation">,</span> \
</code><small class="ln">11</small><code data-lineno="11">        child2<span class="punctuation">.</span>letters<span class="punctuation">[</span>idx1<span class="punctuation">]</span> <span class="operator">=</span> \
</code><small class="ln">12</small><code data-lineno="12">            child2<span class="punctuation">.</span>letters<span class="punctuation">[</span>idx1<span class="punctuation">]</span><span class="punctuation">,</span> l1
</code><small class="ln">13</small><code data-lineno="13">        
</code><small class="ln">14</small><code data-lineno="14">        <span class="keyword">return</span> child1<span class="punctuation">,</span> child2
</code><small class="ln">15</small><code data-lineno="15"></code></pre></ld-card><ld-card class="incremental"><p class="rubric">Fitness-Funktion</p><p><strong>Idee</strong>: Eine Lösung ist besser, je näher die Summe der Ziffern von SEND und MORE an MONEY ist. D. h.:</p><div class="incremental"><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>minimiere</mtext><mo stretchy="false">(</mo><mi mathvariant="normal">∣</mi><mi>m</mi><mi>o</mi><mi>n</mi><mi>e</mi><mi>y</mi><mo>−</mo><mo stretchy="false">(</mo><mi>s</mi><mi>e</mi><mi>n</mi><mi>d</mi><mo>+</mo><mi>m</mi><mi>o</mi><mi>r</mi><mi>e</mi><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\text{minimiere}(|money - (send + more)|)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">minimiere</span></span><span class="mopen">(</span><span class="mord">∣</span><span class="mord mathnormal">m</span><span class="mord mathnormal">o</span><span class="mord mathnormal">n</span><span class="mord mathnormal" style="margin-right:0.0359em;">ey</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal">se</span><span class="mord mathnormal">n</span><span class="mord mathnormal">d</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal">m</span><span class="mord mathnormal" style="margin-right:0.0278em;">or</span><span class="mord mathnormal">e</span><span class="mclose">)</span><span class="mord">∣</span><span class="mclose">)</span></span></span></span></span></div></div><div class="incremental"><p><strong>Feststellung</strong>: Das Ziel des generischen genetischen Algorithmus ist es, die Fitness-Funktion zu maximieren. Wir müssen somit unser Minimierungsproblem in ein Maximierungsproblem umwandeln:</p><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>maximiere</mtext><mrow><mo fence="true">(</mo><mfrac><mn>1</mn><mrow><mi mathvariant="normal">∣</mi><mi>m</mi><mi>o</mi><mi>n</mi><mi>e</mi><mi>y</mi><mo>−</mo><mo stretchy="false">(</mo><mi>s</mi><mi>e</mi><mi>n</mi><mi>d</mi><mo>+</mo><mi>m</mi><mi>o</mi><mi>r</mi><mi>e</mi><mo stretchy="false">)</mo><mi mathvariant="normal">∣</mi><mo>+</mo><mn>1</mn></mrow></mfrac><mo fence="true">)</mo></mrow><mspace linebreak="newline"></mspace></mrow><annotation encoding="application/x-tex">\text{maximiere}\left(\frac{1} { |money - (send + more)| + 1 }\right)\\</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:2.4em;vertical-align:-0.95em;"></span><span class="mord text"><span class="mord">maximiere</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="minner"><span class="mopen delimcenter" style="top:0em;"><span class="delimsizing size3">(</span></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3214em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">∣</span><span class="mord mathnormal">m</span><span class="mord mathnormal">o</span><span class="mord mathnormal">n</span><span class="mord mathnormal" style="margin-right:0.0359em;">ey</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mopen">(</span><span class="mord mathnormal">se</span><span class="mord mathnormal">n</span><span class="mord mathnormal">d</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord mathnormal">m</span><span class="mord mathnormal" style="margin-right:0.0278em;">or</span><span class="mord mathnormal">e</span><span class="mclose">)</span><span class="mord">∣</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord">1</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.936em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mclose delimcenter" style="top:0em;"><span class="delimsizing size3">)</span></span></span></span><span class="mspace katex-newline"></span></span></span></span></div></div><div class="incremental"><p>Beispiel: Sei die Differenz <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn></mrow><annotation encoding="application/x-tex">1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span>, dann ist die Fitness <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mn>2</mn></mrow><annotation encoding="application/x-tex">1/2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1/2</span></span></span></span></span>; bei einer Differenz von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>0</mn></mrow><annotation encoding="application/x-tex">0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span></span> ist die Fitness <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn></mrow><annotation encoding="application/x-tex">1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span> und somit maximal.</p></div></ld-card><ld-card class="incremental"><p class="rubric">Fitness-Funktion - Implementierung</p><pre class="code python literal-block"><small class="ln"> 1</small><code data-lineno=" 1">    <span class="keyword">def</span> <span class="name function">fitness</span><span class="punctuation">(</span>self<span class="punctuation">)</span> <span class="operator">-</span><span class="operator">&gt;</span> <span class="name builtin">float</span><span class="punctuation">:</span>

<ld-topic class="exercises transition-move-to-top" id="ubung"><h2>Übung</h2><ld-scrollable><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Belegungsplan für den Sportunterricht"><p class="ld-exercise-title rubric"><span>Belegungsplan für den Sportunterricht</span></p><p>Eine Grundschule muss den wöchentlichen Sportunterricht planen. Für jede Klasse ist festzulegen, <em>wann</em> (Tag und Slot), in <em>welcher Halle</em> und unter Aufsicht <em>welcher Lehrkraft</em> der Unterricht stattfindet. Entwickeln Sie eine <strong>Formulierung</strong> dieses Problems für einen genetischen Algorithmus — der Schwerpunkt liegt ausschließlich auf der <em>Modellierung</em>, nicht auf der Implementierung.</p><p class="rubric">Rahmenbedingungen</p><ul class="simple"><li><p>Es gibt die Jahrgangsstufen 1 bis 4 mit je 6 Klassen, also <strong>24 Klassen</strong>.</p></li><li><p>Es gibt <strong>zwei Turnhallen</strong>: eine <em>nahe</em> und eine <em>entfernte</em>.</p></li><li><p>Eine Halle wird stets für 2 Stunden am Stück belegt. Pro Tag gibt es <strong>3 Slots</strong>, die Schulwoche hat <strong>5 Tage</strong> <span class="peripheral">(d. h. 15 Zeitfenster je Halle, 30 Hallen-Slots insgesamt)</span>.</p></li><li><p>Es gibt <strong>6 Lehrkräfte</strong>.</p></li><li><p>Jede Klasse erhält genau einen wöchentlichen Termin <span class="peripheral">(Halle, Tag, Slot und beaufsichtigende Lehrkraft)</span>.</p></li></ul><p class="rubric">Harte Nebenbedingungen <span class="peripheral">(müssen stets erfüllt sein)</span></p><ol class="arabic simple"><li><p>Eine Halle ist je Zeitfenster nur von einer Klasse belegt.</p></li><li><p>Jede Klasse erhält genau einen Slot.</p></li><li><p>Eine Lehrkraft beaufsichtigt zu einem Zeitpunkt höchstens eine Klasse.</p></li><li><p>Jede Lehrkraft beaufsichtigt pro Woche mindestens 3 und höchstens 6 Klassen.</p></li><li><p>Eine Lehrkraft beaufsichtigt nicht zwei direkt aufeinanderfolgende Klassen, die beide in der entfernten Halle liegen.</p></li></ol><p class="rubric">Weiche Nebenbedingungen <span class="peripheral">(sollen möglichst erfüllt werden)</span></p><ol class="arabic simple"><li><p>Der Sportunterricht sollte im 2. oder 3. Slot stattfinden.</p></li><li><p>Möglichst alle sollten die nahe Halle bekommen; die Jahrgangsstufen 1 und 2 haben Priorität.</p></li><li><p>Eine Lehrkraft sollte mindestens 3 und höchstens 5 Klassen beaufsichtigen.</p></li><li><p>Eine Lehrkraft sollte pro Tag höchstens 1 Klasse beaufsichtigen.</p></li><li><p>Eine Lehrkraft sollte nicht zwei direkt aufeinanderfolgende Klassen beaufsichtigen.</p></li></ol><p class="rubric">Ihre Aufgabe</p><p>Beschreiben bzw. skizzieren Sie eine Formulierung im Rahmen der in der Vorlesung vorgestellten <code class="python">Chromosome</code>-Basisklasse:</p><ol class="loweralpha list-with-explanations simple"><li><p>die <strong>Repräsentation</strong> eines Chromosoms (<span class="peripheral">Genom</span>),</p></li><li><p>wie eine zufällige Instanz erzeugt wird (<code class="python">random_instance</code>),</p></li><li><p>die <strong>Fitness-Funktion</strong> — insbesondere, wie Sie harte und weiche Nebenbedingungen unterscheiden und gewichten,</p></li><li><p>eine geeignete <strong>Mutation</strong> (<code class="python">mutate</code>),</p></li><li><p>eine geeignete <strong>Rekombination</strong> (<code class="python">crossover</code>),</p></li><li><p>sinnvolle Strategien für die <strong>Parameter</strong>, insbesondere für das <strong>Abbruchkriterium</strong>.</p></li></ol><p>Begründen Sie Ihre Entscheidungen jeweils kurz.</p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Diese Aufgabe ist als reine <em>Formulierungsaufgabe</em> gedacht: Stellen Sie sich zum Beispiel der Frage, welche harten Nebenbedingungen man besser über die <em>Repräsentation</em> ausschließt, welche man über <em>Strafterme</em> in der Fitness behandelt und welche man durch einen <e <ld-topic class="exercises transition-move-to-top" id="ubung-1"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-2" data-exercise-id="2" data-exercise-title="2 - Gruppenzuteilung"><p class="ld-exercise-title rubric"><span>Gruppenzuteilung</span></p><p>Entwickeln Sie einen genetischen Algorithmus, der eine sehr gute Aufteilung von Personen (Studierenden) auf eine feste Anzahl an Gruppen findet, basierend auf den Präferenzen der Personen.</p><p>Im Template ist eine initiale Aufgabenstellung hinterlegt, die es zu lösen gilt: Verteilung von 16 Studierenden auf 4 Gruppen inkl. Bewertungsmatrix <span class="peripheral">(jeder Studierende hat jeden anderen mit Werten von 1 bis 10 bewertet)</span>.</p><div><p class="rubric">Basis (Achten Sie auf die Verzeichnisse)</p><p><a class="reference external" href="https://delors.github.io/theo-algo-genetic_algorithms/code/lib/chromosome.py">https://delors.github.io/theo-algo-genetic_algorithms/code/lib/chromosome.py</a></p><p><a class="reference external" href="https://delors.github.io/theo-algo-genetic_algorithms/code/lib/genetic_algorithm.py">https://delors.github.io/theo-algo-genetic_algorithms/code/lib/genetic_algorithm.py</a></p><p><a class="reference external" href="https://delors.github.io/theo-algo-genetic_algorithms/code/group_assignment_template.py">https://delors.github.io/theo-algo-genetic_algorithms/code/group_assignment_template.py</a></p></div><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:ghL6PlLfo4uHDRTtuiY1zHvwLS0ifKcl6xQbWy/ea4g=:C26WhWqZnjtzTe1k:cj9x+VkYimMZGQ8nocTi0s9WoQv3fJ4AaPYrdqCvQcR+uOqezDjwPAXhBRySIF9znTJJ4y9Vsee8U7Vdf46KwH6Tkp/PDoRYtn6z9hUldw8B92S5s+3/5F+hruF1b/dMQ8ftFiZOOPXGaz7kR+06uoRsC4HEF81NEaYgOXvl9SmkbUt+GzmTIjeDSeMWSIIWr3FKlFIYT3lSPlEJtovsT5pk1krSsLmvILpdc9i2EbpoUC4/Jjj56vKukUmCveI6eD/jfCo43gCUMRxnIkZGyLylvw5YJCgtP0PHofyLy8e1Ik3TGDiCtIISMdbWpUAJPqz/GuzwBQaeQaTZx2PC9MtZLwFRkGQA8xOJOQv3ioZpLFsZAgRf48YxmKQX0QGqi4k//b/gOn4OWnb+oROrPC/g15cUP2+K/cd2EYJEuFSaDeJ/7abSmlxQ9cXJMhyM3Ogt <ld-topic class="exercises transition-move-to-top" id="ubung-2"><h2>Übung</h2><div class="ld-exercise" id="ld-exercise-3" data-exercise-id="3" data-exercise-title="3 - Ausgeglichene Gruppenzuteilung"><p class="ld-exercise-title rubric"><span>Ausgeglichene Gruppenzuteilung</span></p><p>Passen Sie Ihren genetischen Algorithmus aus der vorherigen Übung so an, dass die Gruppen alle in etwa die gleiche Glücklichkeit aufweisen. D. h. eine Zuteilung, bei der die  Gruppenglücklichkeiten z. B. 92 + 91 + 73 + 89 = 345 sind, die aber größere Unterschiede zwischen den Gruppen hat, sollte vermieden werden. Eine Verteilung z. B. mit den Gruppenglücklichkeiten: 80, 84, 80, 80 = 324 sollte bevorzugt werden.</p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Sie können den bisher errechneten Wert zum Beispiel dadurch anpassen, dass Sie von dem Wert die Summe der absoluten Abweichungen vom Durchschnitt abziehen. Ggf. ist es erforderlich den Wert auch noch zu skalieren, damit steigende Abweichungen stärker ins Gewicht fallen.</p><p>Bedenken sie, dass sie ggf. den Threshold anpassen müssen.</p></aside><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:ZyHaicLSKO83nAp26eFOnuebzILwp/TYm0VlTdL05e4=:US+stcJXcbDcp6JG:HIDQ5RmeVdkuqw9kd/XVWnSD302uio9GIjdqI0CP/uYO09+kZpaEjMwV8bO/h6RARaiy0gwBqq1M+Ib1F9zUst5OTiAgE+H5h0RS8yCxln1uhNQoPNEFie0CBg+rt73cmupgwh0FGD98ojsvJ9ZStyF1beQvGjrtxXIN6pltCUTCRcBu9w7RrUAwgRBNnTgxSDb5EJFaXSBmiv+tAzXL7mQcJKLscSYBBiAOKj+6jxbWwd6Mz0O07rhTMqW0jpCgws7v5zCA8M1xPozVocJWkEdQda5fbDZ6bMe9s9vQr05+tGYml6I1QPt484zSfTDb7tqFwZzrY1bVwDYuu/M1v9oahPXVakZL6ZsiAcp4pEl6QEsUgkV6Jd+1DnaJx0nM0yyv0ziCbBVd4LEFSavBY2MdDlBiudQDbm2cFgulAVfl2kXCSAKtsBir4Y87PJNdedtFV08wId3DlaZZ/n9uaW8URCwckpVRX4V/ZjMXJeEhv4omr4RH7LxQwnQbqim93D1URy0O4/IeHz+jXQ24dzSvZrvDqbcel42zaXwsqsa9n4McC2X1GksEPCYerv4+iN1Hxh5DeljoIHlAzqTX+Ln4KCFA4mzUpLRqlapLHGfxCLGYkTWO8iPO3YhH6ypqiN6rmMyIzGIS346QCCvHvs3Ol+hq83neYsdx+Ef9k9TOVRG6cqarw5pgPnUOAGifXmbd4D9
