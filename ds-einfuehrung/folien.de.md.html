<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="verteilt-vs-dezentralisiert"><h2>Verteilt vs. Dezentralisiert</h2><object class="light-image align-center" data="drawings/distributed-vs-decentralized.svg" type="image/svg+xml" role="img" width="100%"></object><ld-supplemental><p><span class="ger">Verteilt vs. Dezentralisiert</span> ≘ <span class="eng">Distributed vs. Decentralized</span></p><aside class="admonition admonition-zwei-ansichten-zur-realisierung-verteilter-systeme"><p class="admonition-title">Zwei Ansichten zur Realisierung verteilter Systeme</p><ul class="simple"><li><p><strong>Integrative Sichtweise</strong>: Verbindung bestehender (lokal) vernetzter Computersysteme zu einem größeren System.</p></li><li><p><strong>Expansive Sichtweise</strong>: ein bestehendes vernetztes Computersystem wird um zusätzliche Computer erweitert.</p></li></ul></aside><aside class="admonition admonition-zwei-definitionen"><p class="admonition-title">Zwei Definitionen</p><ul class="simple"><li><p>Ein <strong>dezentrales System</strong> ist ein vernetztes Computersystem, in dem Prozesse und Ressourcen <em>notwendigerweise</em> über mehrere Computer verteilt sind.</p></li><li><p>Ein <strong>verteiltes System</strong> ist ein vernetztes Computersystem, bei dem Prozesse und Ressourcen <em>hinreichend</em> über mehrere Computer verteilt sind.</p></li></ul></aside></ld-supplemental></ld-topic>
<ld-topic id="haufige-missverstandnisse-bzgl-zentralisierter-systeme"><h2>Häufige Missverständnisse bzgl. zentralisierter Systeme</h2><ol class="arabic incremental-list"><li><p><strong>Zentralisierte Lösungen lassen sich nicht skalieren</strong></p><p>Es gilt zwischen logischer und physischer Zentralisierung zu unterscheiden. Zum Beispiel ist das <em>Domain Name System</em>:</p><ul class="simple"><li><p>logisch zentralisiert</p></li><li><p>physisch (massiv) verteilt</p></li><li><p>dezentralisiert über mehrere Organisationen</p></li></ul></li><li><p><strong>Zentralisierte Lösungen haben einen Single Point of Failure</strong></p><p>Im Allgemeinen nicht zutreffend (z. B. DNS).</p><p>Ein einzelne mögliche Fehlerquelle ist weiterhin oft:</p><ul class="simple"><li><p>leichter zu verwalten</p></li><li><p>einfacher robuster zu machen</p></li></ul></li></ol><ld-supplemental><aside class="admonition" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Es gibt viele, schlecht begründete Missverständnisse in Bezug auf, z. B. Skalierbarkeit, Fehlertoleranz oder Sicherheit. Wir müssen Fähigkeiten entwickeln, mit denen verteilte Systeme leicht verstanden werden können, um solche Missverständnisse zu vermeiden.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="sichtweisen-auf-verteilte-systeme"><h2>Sichtweisen auf verteilte Systeme</h2><p><strong>Verteilte Systeme sind komplex.</strong></p><ul class="incremental-list simple"><li><p>Welche Architekturen und „Architekturellen Stile“ (<span class="eng">architectural styles</span>) gibt es?</p></li><li><p>Prozesse: Welche Art von Prozessen gibt es und wie sind deren Beziehungen?</p></li><li><p>Kommunikation: Welche Möglichkeiten zum Austausch von Daten gibt es?</p></li><li><p>Koordinierung: Wie erfolgt die Koordinierung der beteiligten Systeme?</p></li><li><p>Benennung: Wie identifiziert man Ressourcen?</p></li><li><p>Konsistenz und Replikation: Welche Tradeoffs müssen in Hinblick auf die Konsistenz der Daten, der Replikation derselben und der Performance getroffen werden?</p></li><li><p>Fehlertoleranz: Wie kann eine Aufrechterhaltung des Betriebs auch bei Teilausfällen gewährleistet werden?</p></li><li><p>Sicherheit: Wie kann der autorisierte Zugriff auf Ressourcen gewährleistet werden?</p></li></ul></ld-topic>

<ld-topic class="new-subsection transition-fade" id="verteilungstransparenz"><h2>Verteilungstransparenz</h2><p>(<span class="eng">Distribution Transparency</span>)</p></ld-topic>
<ld-topic id="definition"><h2>Definition</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Verteilungstransparenz</span></p><p>Transparenz beschreibt die Eigenschaft, dass ein verteiltes System versucht, die Tatsache zu verbergen, dass seine Prozesse und Ressourcen physisch auf mehrere Computer verteilt sind, die möglicherweise durch große Entfernungen voneinander getrennt sind.</p></aside><div class="compound incremental"><p>Die Verteilungstransparenz wird durch viele verschiedene Techniken von der so genannten <em>Middleware</em> realisiert - einer Schicht zwischen Anwendungen und Betriebssystemen.</p></div></ld-topic>
<ld-topic id="aspekte-der-verteilungstransparenz"><h2>Aspekte der Verteilungstransparenz</h2><table class="booktabs incremental-table-rows"><tbody><tr><th class="stub"><p>Datenzugriff</p></th><td><p>Verbergen von Unterschieden in der Datendarstellung und der Art des Zugriffs auf ein lokales bzw. entferntes Objekt</p></td></tr><tr><th class="stub"><p>Ort der Datenhaltung</p></th><td><p>Verbergen, wo sich ein Objekt befindet</p></td></tr><tr><th class="stub"><p>Verschieben</p></th><td><p>Verbergen, dass ein Objekt während der Verwendung an einen anderen Ort verschoben werden kann</p></td></tr><tr><th class="stub"><p>Migration</p></th><td><p>Verbergen, dass ein Objekt an einen anderen Ort verschoben werden kann</p></td></tr><tr><th class="stub"><p>Replikation</p></th><td><p>Verbergen, dass ein Objekt repliziert wird</p></td></tr><tr><th class="stub"><p>Nebenläufigkeit</p></th><td><p>Verbergen, dass ein Objekt von mehreren unabhängigen Benutzern gemeinsam genutzt werden kann</p></td></tr><tr><th class="stub"><p>Fehlertransparenz</p></th><td><p>Verbergen des Ausfalls und der Wiederherstellung eines Objekts</p></td></tr></tbody></table><ld-supplemental><p>Datendarstellung: Big-Endian vs. Little-Endian; ASCII vs. Iso-Latin 8859-1 vs. UTF-8</p></ld-supplemental></ld-topic>
<ld-topic id="grad-der-erreichbaren-verteilungstransparenz"><h2>Grad der erreichbaren Verteilungstransparenz</h2><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>Eine vollständige Verteilungstransparenz ist nicht erreichbar.</p></aside><div class="incremental"><p>Jedoch kann auch eine sehr hohe Verteilungstransparenz bereits hohe Kosten nach sich ziehen.</p></div><ul class="incremental-list simple"><li><p>Es gibt Kommunikationslatenzen, die nicht verborgen werden können.</p></li><li><p>Es ist (theoretisch und praktisch) unmöglich, Ausfälle von Netzen und Knoten vollständig zu verbergen.</p></li><li><p>Man kann einen langsamen Computer nicht von einem ausgefallenen Computer unterscheiden.</p></li><li><p>Man kann nie sicher sein, dass ein Server tatsächlich eine Operation durchgeführt hat, bevor er abgestürzt ist.</p></li><li><p>Vollständige Transparenz kostet Performance und legt die Verteilung des Systems offen.</p><ul class="simple"><li><p>Die Replikate exakt auf dem Stand des Masters zu halten, kostet Zeit</p></li><li><p>Schreibvorgänge werden zur Fehlertoleranz sofort auf die Festplatte übertragen</p></li></ul></li></ul></ld-topic>
<ld-topic id="die-verteilung-offen-zu-legen-kann-vorteile-bringen"><h2>Die Verteilung offen zu legen, kann Vorteile bringen</h2><ul class="incremental-list simple"><li><p>Nutzung von standortbezogenen Diensten (Auffinden von Freunden in der Nähe)</p></li><li><p>Beim Umgang mit Benutzern in verschiedenen Zeitzonen</p></li><li><p>Wenn es für einen Benutzer einfacher ist, zu verstehen, was vor sich geht (wenn z. B. ein Server lange Zeit nicht antwortet, kann er als ausgefallen gemeldet werden).</p></li></ul><aside class="admonition incremental" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>Verteilungstransparenz ist ein hehres Ziel, aber oft schwer zu erreichen, und häufig auch nicht erstrebenswert.</p></aside></ld-topic>
<ld-topic class="new-subsection transition-fade" id="offene-verteilte-systeme"><h2>Offene verteilte Systeme</h2><!--_offenheit:--><p id="offenheit"></p></ld-topic>
<ld-topic id="offene-verteilte-systeme-1"><h2>Offene verteilte Systeme</h2><div class="accentuate"><p>Ein offenes verteiltes System bietet Komponenten an, die leicht von anderen Systemen verwendet oder in andere Systeme integriert werden können.</p><p>Ein offenes verteiltes System besteht selbst oft aus Komponenten, die von woanders stammen.</p></div><div class="incremental"><p>Offene verteilte Systeme müssen in der Lage sein, mit Diensten anderer (offener) Systeme zu interagieren, unabhängig von der zugrunde liegenden Umgebung:</p><ul class="incremental-list simple"><li><p>Sie sollten wohl-definierte Schnittstellen korrekt realisieren</p></li><li><p>Sie sollten leicht mit anderen Systemen interagieren können</p></li><li><p>Sie sollten die Portabilität von Anwendungen unterstützen</p></li><li><p>Sie sollten leicht erweiterbar sein</p></li></ul></div><ld-supplemental><p>Ein Beispiel sind Authentifizierungsdienste, die von vielen verschiedenen Anwendungen genutzt werden können.</p></ld-supplemental></ld-topic>
<ld-topic id="vorgaben-richtlinien-vs-umsetzungen"><h2>Vorgaben/Richtlinien vs. Umsetzungen</h2><ld-supplemental><p><span class="eng">Policies vs. Mechanisms</span> ≘ <span class="ger">Vorgaben/Richtlinien vs. Umsetzungen</span></p></ld-supplemental><p class="rubric">Richtlinien für die Umsetzung von Offenheit</p><ul class="incremental-list simple"><li><p>Welchen Grad an Konsistenz benötigen wir für Daten im Client-Cache?</p></li><li><p>Welche Operationen erlauben wir heruntergeladenem Code?</p></li><li><p>Welche QoS-Anforderungen passen wir angesichts schwankender Bandbreiten an?</p></li><li><p>Welchen Grad an Geheimhaltung benötigen wir für die Kommunikation?</p></li></ul><p class="incremental rubric">Mechanismen bzgl. der Umsetzung von Offenheit</p><ul class="incremental-list simple"><li><p>Ermöglichung der (dynamischen) Einstellung von Caching-Richtlinien</p></li><li><p>Unterstützung verschiedener Vertrauensstufen für mobilen Code</p></li><li><p>Bereitstellung einstellbarer QoS-Parameter pro Datenstrom</p></li><li><p>Angebot verschiedener Verschlüsselungsalgorithmen</p></li></ul><ld-supplemental><p>Die harte Kodierung von Richtlinien vereinfacht oft die Verwaltung und reduziert die Komplexität des Systems. Hat jedoch den Preis geringerer Flexibilität.</p></ld-supplemental></ld-topic>
<ld-topic id="sicherheit-in-verteilten-systemen-schutzziele"><h2>Sicherheit in verteilten Systemen - Schutzziele</h2><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>Ein verteiltes System, das nicht sicher ist, ist nicht verlässlich.</p></aside><div class="incremental"><p class="rubric">Grundlegende Schutzziele</p><dl class="field-list simple"><dt>Vertraulichkeit<span class="colon">:</span></dt><dd><p>Informationen werden nur an autorisierte Parteien weitergegeben.</p></dd><dt>Integrität<span class="colon">:</span></dt><dd><p>Änderungen an den Werten eines Systems dürfen nur auf autorisierte Weise vorgenommen werden können.</p></dd></dl></div><ld-supplemental><p>Zusammen mit dem dritten Schutzziel: Verfügbarkeit, bilden diese drei Schutzziele die CIA-Triade der Informationssicherheit (<span class="eng">Confidentiality, Integrity, and Availability</span>).</p></ld-supplemental></ld-topic>
<ld-topic id="sicherheit-in-verteilten-systemen-autorisierung-authentifizierung-vertrauen"><h2>Sicherheit in verteilten Systemen - Autorisierung, Authentifizierung, Vertrauen</h2><dl class="incremental-list field-list simple"><dt>Authentifizierung <span class="eng">Authentication</span><span class="colon">:</span></dt><dd><p>Prozess zur Überprüfung der Korrektheit einer behaupteten Identität.</p></dd><dt>Autorisierung <span class="eng">Authorization</span><span class="colon">:</span></dt><dd><p>Verfügt eine identifizierte Einheit über die richtigen Zugriffsrechte?</p></dd><dt>Vertrauen <span class="eng">Trust</span><span class="colon">:</span></dt><dd><p>Eine Komponente kann sich sicher sein, dass eine andere Komponente bestimmte Handlungen gemäß den Erwartungen ausführt.</p></dd></dl></ld-topic>
<ld-topic id="sicherheit-verschlusselung-und-signaturen"><h2>Sicherheit - Verschlüsselung und Signaturen</h2><p>Es geht im Wesentlichen um das Ver- und Entschlüsseln von Daten (X) mit Hilfe von Schlüsseln.</p><ld-deck><ld-card><p>E(K,X) bedeutet, dass wir die Nachricht X mit dem Schlüssel K  verschlüsseln (<span class="eng">encryption</span>).</p><p>D(K,X) bezeichnet die Umkehrfunktion, die die Daten wieder entschlüsselt (<span class="eng">decryption</span>).</p></ld-card><ld-card class="incremental"><p class="rubric">Symmetrische Verschlüsselung</p><p>Der Schlüssel zur Verschlüsselung ist identisch mit dem Schlüssel zur Entschlüsselung (<span class="eng">decryption</span> (D)).</p><p>X = D(K,E(K,X))</p></ld-card><ld-card class="incremental"><p class="rubric">Asymmetrische Verschlüsselung</p><p>Wir unterscheiden zwischen privaten (PR) und öffentlichen Schlüsseln (PU) (PU ≠ PR). Ein privater und ein öffentlicher Schlüssel bilden immer ein Paar. Der private Schlüssel ist immer geheim zu halten.</p><ld-deck class="incremental"><ld-card><p><strong>Verschlüsselung von Nachrichten</strong></p><p>Alice sendet eine Nachricht an Bob mit Hilfe des öffentlichen Schlüssels von Bob.</p><p>Y = E(PU<sub>Bob</sub>,X)</p><p>X = D(PR<sub>Bob</sub>,Y)</p></ld-card><ld-card class="incremental"><p><strong>Signierung von Nachrichten</strong></p><p>Alice „signiert“ (S`) eine Nachricht mit ihrem privaten Schlüssel.</p><p>Y = E(PR<sub>Alice</sub>,X)</p><p>X = D(PU<sub>Alice</sub>,Y)</p></ld-card></ld-deck></ld-card></ld-deck></ld-topic>
<ld-topic id="sicherheit-sicheres-hashing"><h2>Sicherheit - Sicheres Hashing</h2><p>Eine sichere Hash-Funktion Digest(X) gibt eine Zeichenkette fester Länge (H) zurück.</p><ul class="simple"><li><p>Jede Änderung - noch so klein - der Eingabedaten führt zu einer völlig anderen Zeichenkette.</p></li><li><p>Bei einem Hash-Wert ist es rechnerisch unmöglich die ursprüngliche Nachricht X basierend auf Digest(X) zu finden.</p></li></ul><div class="incremental"><p class="rubric">Signieren von Nachrichten</p><p>Alice signiert eine Nachricht X mit ihrem privaten Schlüssel.</p><p>Alice: [E(PR<sub>Alice</sub>,H=Digest(X)),X]</p><p>Bob prüft die Nachricht X auf Authentizität:</p><p>Bob: D(PU<sub>Alice</sub>,H) ≟ Digest(X)</p></div><ld-supplemental><p><span class="ger">Sicheres Hashing</span> ≘ <span class="eng">Secure Hashing</span></p></ld-supplemental></ld-topic>
<ld-topic class="exercises" id="zwischenfrage"><h2>Zwischenfrage</h2><div class="ld-exercise" id="ld-exercise-1" data-exercise-id="1" data-exercise-title="1 - Verschlüsselung mit Public-Private-Key Verfahren"><p class="ld-exercise-title rubric"><span>Verschlüsselung mit Public-Private-Key Verfahren</span></p><p>Wenn Alice eine mit Bobs öffentlichen Schlüssel verschlüsselte Nachricht an Ihn schickt, welches Sicherheitsproblem kann dann aufkommen?</p><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:OcFAmsSYmsk4R0uvFqZTgFldZfZmL1KOSomNNrBOsiE=:xTEWz5TimvCEuptk:kIFBjbfZdOSk7uUfo8jS+REZ+vukvPiB3JnBzcK078IyXK2ksnaRfywwESEfqgOPhpcPeLY/kBogfcU7MukGKpR4P5aNmkufVI8RSVNQLyhS6L7Gzys52BRjIQAAGQkl1KNkQPB6wu+vxTnMxUVVyIq1FXDGYoN3YwDzGjlX6HcJebNAaQfns37Jr10r9Dswvx3T/sSoYO7eLOQIzEOLxE0z9TniQfqoO1hEFqSDVLyzFMhOZOIvuRKIupnVI8oHRYbtM1D4LAkVsoTqYwbEaPMV2v1d344tH9ciaMCPMnw0jsMrL4FH8slYHHJHWhPxHxGd0aDJqx6Udjn4jClyzsUPEftYMU3yzRALH+qIUZ82TdhpKlytpH4jbXVRdrV9Z2yBdZ9tvO8xBpen3Fpfdxg9BCpRe4SzdceqZ19snihaRVBg+SI3Im9RqPPARGtwARwJ8P2lSRgaWma47zpBwpXF3gPZO90Mb5KU3lH65uQXVHxNMa4AkGBvnOI2ZGN1Q+Ihp3i/6glO+fJSv8Y7gM4FHVlI2ZnIcywn2+iP+xUcav9xdA==</div></div></ld-topic>
<ld-topic class="new-subsection transition-fade" id="skalierbarkeit"><h2>Skalierbarkeit</h2></ld-topic>
<ld-topic id="skalierbarkeit-in-verteilten-systemen"><h2>Skalierbarkeit in verteilten Systemen</h2><p>Wir können mind. drei Arten von Skalierbarkeit unterscheiden:</p><ul class="incremental-list simple"><li><p>Anzahl der Benutzer oder Prozesse (Skalierbarkeit der Größe)</p></li><li><p>Maximale Entfernung zwischen den Knoten (geografische Skalierbarkeit)</p></li><li><p>Anzahl der administrativen Domänen (administrative Skalierbarkeit)</p></li></ul></ld-topic>
<ld-topic id="ursachen-fur-skalierbarkeitsprobleme-bei-zentralisierten-losungen"><h2>Ursachen für Skalierbarkeitsprobleme bei zentralisierten Lösungen:</h2><ul class="simple"><li><p>Die Rechenkapazität, da diese begrenzt ist durch die Anzahl CPUs</p></li><li><p>Die Speicherkapazität, einschließlich der Übertragungsrate zwischen CPUs und Festplatten</p></li><li><p>Das Netzwerk zwischen dem Benutzer und dem zentralisierten Dienst</p></li></ul><ld-supplemental><p>Die Skalierbarkeit bzgl. der Größe kann oft durch den Einsatz von mehr und leistungsstärkeren Servern, die parallel betrieben werden, erreicht werden.</p><p>Die geografische und administrative Skalierbarkeit ist häufig eine größere Herausforderung.</p></ld-supplemental></ld-topic>
<ld-topic id="formale-analyse-der-skalierbarkeit-zentralisierter-systeme"><h2>Formale Analyse der Skalierbarkeit zentralisierter Systeme</h2><p>Ein zentralisierter Dienst kann als einfaches Warteschlangensystem modelliert werden:</p><object class="light-image align-center" data="drawings/queuing-system.svg" type="image/svg+xml" role="img"></object><p class="rubric">Annahmen</p><p>Die Warteschlange hat eine unendliche Kapazität; d. h. die Ankunftsrate der Anfragen wird nicht durch die aktuelle Länge der Warteschlange oder durch das, was gerade bearbeitet wird, beeinflusst.</p></ld-topic>
<ld-topic id="formale-analyse-der-skalierbarkeit-zentralisierter-systeme-1"><h2>Formale Analyse der Skalierbarkeit zentralisierter Systeme</h2><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><ul><li><p>Ankunftsrate der Anfragen:</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>λ</mi></mrow><annotation encoding="application/x-tex">\lambda</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord mathnormal">λ</span></span></span></span></span> <em>(Anfragen pro Sekunde)</em></p></li><li><p>Verarbeitungskapazität des Services:</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>μ</mi></mrow><annotation encoding="application/x-tex">\mu</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">μ</span></span></span></span></span> <em>(Anfragen pro Sekunde)</em></p><p>Anteil der Zeit mit <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">x</span></span></span></span></span> Anfragen im System:</p><div class="math"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>p</mi><mi>x</mi></msub><mo>=</mo><mo fence="true" stretchy="true" minsize="1.2em" maxsi /mo><msub><mi>p</mi><mi>x</mi></msub><mo>=</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>U</mi><mo stretchy="false">)</mo><msup><mi>U</mi><mi>x</mi></msup></mrow><annotation encoding="application/x-tex">U = \sum_{x &gt; 0} p_x = 1 - p_0 = \frac{\lambda}{\mu} \Rightarrow p_x = (1-U) U^x</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">U</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:2.3445em;vertical-align:-1.2945em;"></span><span class="mop op-limits"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.05em;"><span style="top:-1.8829em;margin-left:0em;"><span class="pstrut" style="height:3.05em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">x</span><span class="mrel mtight">&gt;</span><span class="mord mtight">0</span></span></span></span><span style="top:-3.05em;"><span class="pstrut" style="height:3.05em;"></span><span><span class="mop op-symbol large-op">∑</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:1.2945em;"><span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">x</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal">p</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:2.2519em;vertical-align:-0.8804em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3714em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal">μ</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span cla = \sum_{x \geq 0} x \cdot (1-U)U^x

span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.394em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.4811em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span> für die durchschnittliche Servicezeit.</p></li><li><object class="light-image align-center" data="drawings/response_time.svg" type="image/svg+xml" role="img" aria-label="Antwortszeit in Abhängigkeit der Auslastung"></object></li></ul><ul class="incremental-list simple"><li><p>Wenn <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>U</mi></mrow><annotation encoding="application/x-tex">U</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">U</span></span></span></span></span> klein ist, liegt die Antwortzeit nahe bei 1; d. h.eine Anfrage wird sofort bearbeitet.</p></li><li><p>Wenn <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>U</mi></mrow><annotation encoding="application/x-tex">U</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">U</span></span></span></span></span> auf 1 ansteigt, kommt das System zum Stillstand.</p></li></ul></ld-topic>
<ld-topic id="probleme-der-geografischen-skalierbarkeit"><h2>Probleme der geografischen Skalierbarkeit</h2><ul class="simple"><li><p>Viele verteilte Systeme gehen von synchronen Client-Server-Interaktionen aus und dies verhindert einen Übergang vom LAN zum WAN. Die Latenzzeiten können prohibitiv sein, wenn der Client auf eine Anfrage lange warten muss.</p></li></ul><ul class="incremental-list simple"><li><p>WAN-Verbindungen sind oft von Natur aus unzuverlässig.</p></li></ul></ld-topic>
<ld-topic id="probleme-der-administrativen-skalierbarkeit"><h2>Probleme der administrativen Skalierbarkeit</h2><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>Widersprüchliche Richtlinien in Bezug auf Nutzung (und damit Bezahlung), Verwaltung und Sicherheit</p></aside><ld-deck class="incremental"><ld-card><p class="rubric">Beispiele</p><ul class="simple"><li><p>Grid Computing: gemeinsame Nutzung teurer Ressourcen über verschiedene Domänen hinweg.</p></li><li><p>Gemeinsam genutzte Geräte: Wie kontrolliert, verwaltet und nutzt man ein gemeinsam genutztes Radioteleskop, das als groß angelegtes gemeinsames Sensornetz konstruiert wurde?</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Ausnahme</p><p>Verschiedene Peer-to-Peer-Netze <a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a> bei denen Endnutzer zusammenarbeiten und nicht Verwaltungseinheiten:</p><ul class="simple"><li><p>File-Sharing-Systeme (z. B. auf der Grundlage von BitTorrent)</p></li><li><p>Peer-to-Peer-Telefonie (frühe Versionen von Skype)</p></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p><span class="eng">Peer</span> ist im hier im Sinne von „Gleichgestellter“ zu verstehen. D. h. wir haben ein Netz von gleichgestellten Rechnern.</p></aside></aside></ld-card></ld-deck></ld-topic>
<ld-topic id="ansatze-um-skalierung-zu-erreichen"><h2>Ansätze, um Skalierung zu erreichen</h2><ld-deck><ld-card><p><strong>Verbergen von Kommunikationslatenzen</strong> durch:</p><ul class="simple"><li><p>Nutzung asynchroner Kommunikation</p></li><li><p>Verwendung separater <em>Handler</em> für eingehende Antworten</p></li></ul><aside class="admonition incremental" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>Dieses Modell ist jedoch nicht immer anwendbar.</p></aside></ld-card><ld-card class="incremental"><p><strong>Partitionierung von Daten und Berechnungen über mehrere Rechner.</strong></p><ul class="simple"><li><p>Verlagerung von Berechnungen auf Clients</p></li><li><p>Dezentrale Namensgebungsdienste (DNS)</p></li><li><p>Dezentralisierte Informationssysteme (WWW)</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="verlagerung-von-berechnungen-auf-clients"><h2>Verlagerung von Berechnungen auf Clients</h2><object class="light-image align-center" data="drawings/moving-computations.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="ansatze-um-skalierung-zu-erreichen-1"><h2>Ansätze, um Skalierung zu erreichen</h2><p><strong>Einsatz von Replikation und Caching, um Kopien von Daten auf verschiedenen Rechnern verfügbar zu machen.</strong></p><ul class="incremental-list simple"><li><p>replizierte Dateiserver und Datenbanken</p></li><li><p>gespiegelte Websites</p></li><li><p>Web-Caches (in Browsern und Proxies)</p></li><li><p>Datei-Caching (auf Server und Client)</p></li></ul></ld-topic>
<ld-topic id="herausforderungen-bei-der-replikation"><h2>Herausforderungen bei der Replikation</h2><ul class="incremental-list simple"><li><p>Mehrere Kopien (zwischengespeichert (<span class="eng">cached</span>) oder repliziert) führen zwangsläufig zu Inkonsistenzen. Die Änderung einer Kopie führt dazu, dass sich diese Kopie von den anderen unterscheidet.</p></li><li><p>Zur Erreichung von Konsistenz ist bei jeder Änderung eine globale Synchronisierung erforderlich.</p></li><li><p>Die globale Synchronisierung schließt Lösungen im großen Maßstab aus.</p></li></ul><ld-supplemental><p>Inwieweit Inkonsistenzen toleriert werden können, ist anwendungsspezifisch. Können diese jedoch toleriert werden, dann kann der Bedarf an globaler Synchronisation verringert werden.</p></ld-supplemental></ld-topic>
<ld-topic id="paralleles-rechnen-parallel-computing"><h2>Paralleles Rechnen (<span class="eng">Parallel Computing</span>)</h2><ul class="columns"><li><p>Multiprozessor</p><object class="light-image align-center" data="drawings/multiprocessor-vs-multicomputer/multiprocessor.svg" type="image/svg+xml" role="img"></object></li><li><p>Multicomputer</p><object class="light-image align-center" data="drawings/multiprocessor-vs-multicomputer/multicomputer.svg" type="image/svg+xml" role="img"></object></li></ul><ld-supplemental><p>Das verteilte Hochleistungsrechnen begann mit dem parallelen Rechnen.</p><p><strong>Verteilte Systeme mit gemeinsamem Speicher</strong> (<span class="eng">Multicomputer with shared memory</span>) als alternative Architektur haben die Erwartungen nicht erfüllt und sind daher nicht mehr relevant.</p></ld-supplemental></ld-topic>
<ld-topic id="amdahls-gesetz-grenzen-der-skalierbarkeit"><h2>Amdahls Gesetz - Grenzen der Skalierbarkeit</h2><ld-deck><ld-card><ul class="list-with-explanations"><li><p>Lösen von <strong>fixen Problemen</strong> in möglichst kurzer Zeit</p><blockquote><p>(Beispiel: Hochfahren (<span class="eng">Booten</span>) eines Rechners. Inwieweit lässt sich durch mehr CPUs/Kerne die Zeit verkürzen?)</p></blockquote></li><li><p>Es modelliert die erwartete Beschleunigung (<em>Speedup</em>) eines zum Teil parallelisierten/parallelisierbaren Programms relativ zu der nicht-parallelisierten Variante</p></li></ul><aside class="admonition encapsulate-floats" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition</span></p><aside class="admonition" data-theme="note"><p class="admonition-title" data-theme="note-header">Bemerkung</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi></mrow><annotation encoding="application/x-tex">C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span></span></span></span> = Anzahl CPUs</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>P</mi></mrow><annotation encoding="application/x-tex">P</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span></span></span></span></span> = Parallelisierungsgrad in Prozent</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi></mrow><annotation encoding="application/x-tex">S</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span></span></span></span></span> = Speedup</p></aside><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo stretchy="false">(</mo><mi>C</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>P</mi><mo stretchy="false">)</mo><mo>+</mo><mfrac><mi>P</mi><mi>C</mi></mfrac></mrow></mfrac></mrow><annotation encoding="application/x-tex">S(C) = \frac{1}{(1-P) + \frac{P}{C}}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1.5064em;vertical-align:-0.6613em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8451em;"><span style="top:-2.5795em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mopen mtight">(</span><span class="mord mtight">1</span><span class="mbin mtight">−</span><span class="mord mathnormal mtight" style="margin-right:0.1389em;">P</span><span class="mclose mtight">)</span><span class="mbin mtight">+</span><span class="mord mtight"><span class="mopen nulldelimiter katex-sizing reset-size3 size6"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.8721em;"><span style="top:-2.656em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size3 size1 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0715em;">C</span></span></span></span><span style="top:-3.2255em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line mtight" style="border-bottom-width:0.049em;"></span></span><span style="top:-3.384em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size3 size1 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.1389em;">P</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.344em;"><span></span></span></span></span></span><span class="mclose nulldelimiter katex-sizing reset-size3 size6"></span></span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.394em;"><span class="pstrut" style="height:3em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.6613em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span></span></p></aside></ld-card><ld-card class="incremental"><object class="light-image align-center" data="drawings/amdahl.svg" type="image/svg+xml" role="img" aria-label="Amdahls Gesetz visualisiert"></object></ld-card></ld-deck></ld-topic>
<ld-topic id="gustafsons-gesetz-grenzen-der-skalierbarkeit"><h2>Gustafsons Gesetz - Grenzen der Skalierbarkeit</h2><ul class="list-with-explanations"><li><p>Lösen von Problemen mit (sehr) großen, sich strukturell wiederholenden Datensätzen in <strong>fixer Zeit</strong>; der serielle Anteil des Programms wird als  konstant angenommen.</p><p>(Beispiel: Erstelle innerhalb der nächsten 24 Stunden die Wettervorhersage für übermorgen. Inwieweit lässt sich durch mehr CPUs/Rechner die Präzision der Vorhersage verbessern?)</p></li></ul><div class="encapsulate-floats incremental"><aside class="admonition width-60 dd-margin-left-2em" data-theme="note"><p class="admonition-title" data-theme="note-header">Bemerkung</p><dl class="field-list simple"><dt><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi></mrow><annotation encoding="application/x-tex">C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span></span></span></span><span class="colon">:</span></dt><dd><p>Anzahl CPUs</p></dd><dt><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>P</mi></mrow><annotation encoding="application/x-tex">P</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span></span></span></span></span><span class="colon">:</span></dt><dd><p>Parallelisierungsgrad in Abhängigkeit von der Problemgröße n</p></dd><dt><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi></mrow><annotation encoding="application/x-tex">S</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span></span></span></span></span><span class="colon">:</span></dt><dd><p>Speedup</p></dd></dl></aside><p>Beschleunigung (Speedup) eines parallelisierten Programms relativ zu der nicht-parallelisierten Variante: <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi><mo stretchy="false">(</mo><mi>C</mi><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>+</mo><mi>P</mi><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo><mo>⋅</mo><mo stretchy="false">(</mo><mi>C</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">S(C) = 1 + P(n) \cdot (C-1)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">P</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">)</span></span></span></span></span></p></div><div class="incremental"><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><p>Sei der Parallelisierungsgrad ab einer relevanten Problemgröße <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi></mrow><annotation encoding="application/x-tex">n</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span></span></span></span></span> 80 %. Dann ergibt sich für 4 CPUs ein Speedup von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mn>0.8</mn><mo>∗</mo><mn>3</mn><mo stretchy="false">)</mo><mo>=</mo><mn>3.4</mn></mrow><annotation encoding="application/x-tex">(1+0.8*3) = 3.4</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">0.8</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">∗</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">3</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">3.4</span></span></span></span></span>, für 8 CPUs ein Speedup von 6.6 und für 16 CPUs ein Speedup von 13.</p></aside></div></ld-topic>

<ld-topic class="new-section transition-fade" id="anforderungen-an-verteilter-systeme"><h2>Anforderungen an verteilter Systeme</h2></ld-topic>
<ld-topic id="verlasslichkeit-verteilter-systeme"><h2>Verlässlichkeit verteilter Systeme</h2><div class="peripheral"><p>(<span class="eng">Dependability</span>)</p></div><aside class="admonition admonition-abhangigkeiten"><p class="admonition-title">Abhängigkeiten</p><p>Eine <strong>Komponente</strong><a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a> stellt ihren <strong>Clients</strong> <strong>Dienste</strong> zur Verfügung. Dafür kann die Komponente jedoch wiederum Dienste von anderen Komponenten benötigen und somit ist eine Komponente  von einer anderen Komponente abhängig (<span class="eng">depend</span>).</p></aside><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Abhängigkeit von Komponenten</span></p><p>Eine Komponente <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi></mrow><annotation encoding="application/x-tex">C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span></span></span></span> hängt von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>C</mi><mo>∗</mo></msup></mrow><annotation encoding="application/x-tex">C^*</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6887em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6887em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mbin mtight">∗</span></span></span></span></span></span></span></span></span></span></span></span> ab, wenn die Korrektheit des Verhaltens von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi></mrow><annotation encoding="application/x-tex">C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span></span></span></span> von der Korrektheit des Verhaltens von <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>C</mi><mo>∗</mo></msup></mrow><annotation encoding="application/x-tex">C^*</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6887em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6887em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mbin mtight">∗</span></span></span></span></span></span></span></span></span></span></span></span> abhängt.</p></aside><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-2" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-2">2</a><span class="fn-bracket">]</span></span><p>Komponenten seien Prozesse oder Kanäle.</p></aside></aside></ld-topic>
<ld-topic id="anforderungen-an-die-verlasslichkeit-verteilter-systeme"><h2>Anforderungen an die Verlässlichkeit verteilter Systeme</h2><table class="booktabs incremental-table-rows"><thead><tr><th class="head"><p>Anforderung</p></th><th class="head"><p>Beschreibung</p></th></tr></thead><tbody><tr><td><p>Verfügbarkeit</p></td><td><p>Das System ist nutzbar.</p></td></tr><tr><td><p>Zuverlässigkeit</p></td><td><p>Kontinuität der korrekten Leistungserbringung.</p></td></tr><tr><td><p>Sicherheit
(<span class="eng">Safety</span><a class="brackets" href="#footnote-3" id="footnote-reference-3" role="doc-noteref"><span class="fn-bracket">[</span>3<span class="fn-bracket">]</span></a>)</p></td><td><p>Niedrige Wahrscheinlichkeit für ein katastrophales Ereignis.</p></td></tr><tr><td><p>Wartbarkeit</p></td><td><p>Wie leicht kann ein fehlgeschlagenes System wiederhergestellt werden?</p></td></tr></tbody></table><aside class="footnote-list brackets">
<aside class="footnote brackets" id="footnote-3" role="doc-footnote">
<span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-3">3</a><span class="fn-bracket">]</span></span>
<p><span class="eng">Safety</span> und <span class="eng">Security</span> werden beide im Deutschen gleich mit Sicherheit übersetzt und sind daher leicht zu verwechseln. <span class="eng">Safety</span> bezieht sich auf die Sicherheit von Personen und Sachen, während <span class="eng">Security</span> sich auf die Sicherheit von Daten und Informationen bezieht.</p>
</aside>

<ld-topic id="zuverlassigkeit-reliability-vs-verfugbarkeit-availability-in-verteilten-systemen"><h2>Zuverlässigkeit (<span class="eng">Reliability</span>) vs. Verfügbarkeit (<span class="eng">Availability</span>) in verteilten Systemen</h2><p class="rubric">Verlässlichkeit <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">R(t)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mopen">(</span><span class="mord mathnormal">t</span><span class="mclose">)</span></span></span></span></span> der Komponente <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi></mrow><annotation encoding="application/x-tex">C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span></span></span></span></p><p>Bedingte Wahrscheinlichkeit, dass <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi></mrow><annotation encoding="application/x-tex">C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span></span></span></span> während <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">[</mo><mn>0</mn><mo separator="true">,</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">[0,t)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">t</span><span class="mclose">)</span></span></span></span></span> korrekt funktioniert hat, wenn <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>C</mi></mrow><annotation encoding="application/x-tex">C</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span></span></span></span></span> zum Zeitpunkt <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>T</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">T = 0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span></span> korrekt funktionierte.</p><div class="compound incremental"><p class="rubric">Traditionelle Metriken</p><ul class="incremental-list"><li><p>Mittlere Zeit bis zum Versagen (<span class="eng">Mean Time to Failure</span> (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>M</mi><mi>T</mi><mi>T</mi><mi>F</mi></mrow><annotation encoding="application/x-tex">MTTF</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span></span></span></span></span>)):</p><p>Die durchschnittliche Zeit bis zum Ausfall einer Komponente.</p></li><li><p>Mittlere Zeit bis zur Reparatur (<span class="eng">Mean Time to Repair</span> (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>M</mi><mi>T</mi><mi>T</mi><mi>R</mi></mrow><annotation encoding="application/x-tex">MTTR</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span></span></span></span></span>)):</p><p>Die durchschnittliche Zeit, die für die Reparatur einer Komponente benötigt wird.</p></li><li><p>Mittlere Zeit zwischen Ausfällen (<span class="eng">Mean Time Between Failures</span> (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>M</mi><mi>T</mi><mi>B</mi><mi>F</mi></mrow><annotation encoding="application/x-tex">MTBF</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span></span></span></span></span>)):</p><p><span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>M</mi><mi>T</mi><mi>T</mi><mi>F</mi><mo>+</mo><mi>M</mi><mi>T</mi><mi>T</mi><mi>R</mi><mo>=</mo><mi>M</mi><mi>T</mi><mi>B</mi><mi>F</mi></mrow><annotation encoding="application/x-tex">MTTF + MTTR = MTBF</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span></span></span></span></span>.</p></li></ul></div><ld-supplemental><ul class="simple"><li><p>Zuverlässigkeit: Wie wahrscheinlich ist es, dass ein System <em>korrekt</em> arbeitet?</p></li><li><p>Verfügbarkeit: Wie wahrscheinlich ist es, dass ein System zu einem bestimmten Zeitpunkt verfügbar ist?</p></li></ul><p class="rubric">MTBF vs. MTTR</p><p>Wenn die MTTF einer Komponente 100 Stunden beträgt und die MTTR 10 Stunden beträgt, dann ist die MTBF <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>=</mo><mi>M</mi><mi>T</mi><mi>T</mi><mi>F</mi><mo>+</mo><mi>M</mi><mi>T</mi><mi>T</mi><mi>R</mi><mo>=</mo><mn>100</mn><mo>+</mo><mn>10</mn><mo>=</mo><mn>110</mn></mrow><annotation encoding="application/x-tex">= MTTF + MTTR = 100 + 10 = 110</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.3669em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">100</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">10</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">110</span></span></span></span></span> Stunden.</p></ld-supplemental></ld-topic>
<ld-topic id="mapreduce-programmiermodell-und-middleware-fur-paralleles-rechnen"><h2>MapReduce - Programmiermodell und Middleware für paralleles Rechnen</h2><ul class="incremental-list list-with-explanations"><li><p>MapReduce ist ein Programmiermodel und eine entsprechende Implementierung (ein Framework ursprünglich entwickelt von Google) zur Verarbeitung sehr großer Datenmengen (ggf. TBytes).</p></li><li><p>Programme, die mit Hilfe von MapReduce implementiert werden, werden automatisch parallelisiert und auf einem großen Cluster von handelsüblichen Rechnern ausgeführt.</p><p>Die Laufzeitumgebung übernimmt:</p><ul class="simple"><li><p>Partitionierung der Eingabedaten und Verteilung selbiger auf die Rechner des Clusters</p></li><li><p>Einplanung und Ausführung der “Map”- und “Reduce”- Funktionen auf den Rechnern des Clusters</p></li><li><p>Behandlung von Fehlern und die Kommunikation zwischen den Rechnern</p></li></ul></li><li><p>Ein kanonisches Beispiel ist die Berechnung eines invertierten Indexes.</p></li></ul><aside class="admonition incremental" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Nicht alle Arten von Berechnungen können mit Hilfe von MapReduce durchgeführt werden.</p></aside><!--MapReduce - Visualisierung und Beispiel
     ----------------------------------------------------------
     .. image:: drawings/mapreduce.svg
         :width: 100%
         :align: center

     .. supplemental::

         Hier ist es die Berechnung der Häufigkeit von Wörtern in einem sehr großen Datensatz.

         Ein weiteres kanonisches Beispiel ist die Berechnung eines invertierten Indexes.--></ld-topic>
<ld-topic class="exercises" id="ubung-verfugbarkeit-und-ausfallwahrscheinlichkeit"><h2>Übung: Verfügbarkeit und Ausfallwahrscheinlichkeit</h2><div class="ld-exercise" id="ld-exercise-3" data-exercise-id="3" data-exercise-title="3 - Ausfallwahrscheinlichkeit"><p class="ld-exercise-title rubric"><span>Ausfallwahrscheinlichkeit</span></p><p>Gegeben sei ein größeres verteiltes System bestehend aus 500 unabhängigen Rechnern, die auch unabhängig voneinander ausfallen. Im Mittel ist jeder Rechner innerhalb von zwei Tagen zwölf Stunden lang nicht erreichbar.</p><ol class="loweralpha simple"><li><p>Bestimmen Sie die Intaktwahrscheinlichkeit eines einzelnen Rechners.</p></li><li><p>Ein Datensatz ist aus Gründen der Fehlertoleranz auf drei Rechnern identisch repliziert gespeichert. Wie hoch ist seine mittlere Zugriffsverfügbarkeit beim Lesen?</p></li><li><p>Auf wie vielen Rechnern müssen Sie identische Kopien dieses Datensatzes speichern, damit die mittlere Zugriffsverfügbarkeit beim Lesen bei 99,999 % liegt</p></li><li><p>Für wie viele Minuten im Jahr (mit 365 Tagen) ist im Mittel bei einer Verfügbarkeit von 99,999 % <em>kein Lesen des Datensatzes</em> möglich?</p></li></ol><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:l60ws2Vm/YexhxxXI5Vq8BNZ+gFVOkuEYx5/QjStNbU=:ZQt7uejWWO9BgmmC:/OtVe1ZS0OuqV1QwnlRbViAwV7x5UtUfv+kHaDKBciOCBeWSUAKJzeFf1sKwQl8m8cMrjP6xRXeih7+ExRw1/d7VlWxxHNYrjDEYoqaxfXaqqob10me6hk6iXe0dPvB1Jok390Xqw+WMJqE8bU2TblTkwC29R0l8S/NYrUvGT5LlcB9yGLvVauzoU00+IyMKsnQAJQXunBbTvNYdATie2jNMnn8CpIGmvIjjIQkJsazDi9ONU9wjc2jImIyfESGhASyqRnG6m3S8mP4xf9tLEAq5dMpF5iK895pipyQ9rj15jWPQ/e/duuZQ/Dev2pJzuYkAkuJrLz9bGpH6f++NlY2DMXd19ouZzPEwzH9MBvGEa2+yVcMXYE3UHzE+37ToxG+4uAal57zXQiWO/Tqo4QhzKfAcYFDsaID1+DCgZxRfZpPVHgeZGmm56gywl6RXWlJnYOCTIYt89cD8qBRCWgdCKKanocD7Hk2OkTUJwYqKHf398HxA32+AkEY6P3WuQjvp/dEzoR9VIao4gc8z7AE0uwlHt91oMgKFazc6mw1BdFA76LzKeG7a3smS2awwh3ae//Oavr36VLTH1o8em5+F6wgVoGYane/JvFC31g3WWK2xZ2j/+nxo4L5Si4ipOzxX4ZeKbA1LRrKhPHNFFtnpkd8KkVOiogTbp3DL++b/3lVsev
