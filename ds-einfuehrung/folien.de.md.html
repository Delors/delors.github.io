<ld-topic class="new-section transition-fade" id="klassifikation-verteilte-systeme"><h2>Klassifikation Verteilte Systeme</h2></ld-topic>
<ld-topic id="cluster-computing"><h2>Cluster Computing</h2><p>Eine Gruppe von „High-End-Systemen“, die über ein LAN verbunden sind.</p><object class="light-image align-center" data="drawings/cluster-computing.svg" type="image/svg+xml" role="img"></object><ld-supplemental><p>Die einzelnen Rechner/Compute Nodes sind oft identisch (Hardware und Software) und werden von einem Verwaltungsknotenpunkt (<span class="eng">management node</span>) verwaltet.</p></ld-supplemental></ld-topic>
<ld-topic id="grid-computing"><h2>Grid Computing</h2><p>Weiterführung des Cluster Computing.</p><ul class="simple"><li><p>Viele heterogene, weit und über mehrere Organisationen verstreute Knotenpunkte.</p></li><li><p>Die Knotenpunkte sind über das WAN verbunden.</p></li><li><p>Die Zusammenarbeit erfolgt im Rahmen einer virtuellen Organisation.</p></li></ul><ld-supplemental><p>(Volunteer) Grid Computing - Beispiel:</p><p><a class="reference external" href="https://scienceunited.org">https://scienceunited.org</a></p><p><a class="reference external" href="https://einsteinathome.org">https://einsteinathome.org</a></p></ld-supplemental></ld-topic>
<ld-topic class="dd-margin-left-2em" id="grundlegende-architektur-fur-grid-computing"><h2>Grundlegende Architektur für Grid-Computing</h2><object class="light-image float-right align-center" data="drawings/architecture-for-grid-computing.svg" type="image/svg+xml" role="img"></object><dl class="field-list simple"><dt>Anwendungen<span class="colon">:</span></dt><dd><p>Enthält tatsächliche Grid-Anwendungen in einer einzelnen Organisation.</p></dd><dt>Collective Layer<span class="colon">:</span></dt><dd><p>Verwaltet den Zugriff auf mehrere Ressourcen: Auffindung, Einplanung und Replikation.</p></dd><dt>Konnektivitätsschicht<span class="colon">:</span></dt><dd><p>Kommunikations- / Transaktions- /Authentifizierungsprotokolle, z. B. für die Übertragung von Daten zwischen Ressourcen.</p></dd><dt>Ressourcenschicht<span class="colon">:</span></dt><dd><p>Verwaltet eine Ressource, z. B. Erstellen von Prozessen oder Lesen von Daten.</p></dd><dt>Fabric Layer<span class="colon">:</span></dt><dd><p>Bietet Schnittstellen zu lokalen Ressourcen (zur Abfrage von Status und Fähigkeiten, Sperren usw.)</p></dd></dl><ld-supplemental><p>Auffindung (<span class="eng">Discovery</span>), Einplanung (<span class="eng">Scheduling</span>)</p></ld-supplemental></ld-topic>
<ld-topic id="peer-to-peer-systeme"><h2>Peer-to-Peer-Systeme</h2><dl class="field-list"><dt>Vision<span class="colon">:</span></dt><dd><p>„Das Netzwerk ist der Computer.“ Es gibt einen Datenbestand, der immer weltweit erreichbar ist.</p></dd><dt>Idee<span class="colon">:</span></dt><dd><p>Keine dedizierten Clients und Server, jeder Teilnehmer (Peer) ist gleichzeitig Anbieter und Kunde.</p><p>Selbstorganisierend, ohne zentrale Infrastruktur (Koordinator, Datenbestand, Teilnehmerverzeichnis).</p><p>Jeder Peer ist autonom und kann jederzeit offline sein, Netzwerkadressen können sich beliebig ändern.</p></dd><dt>Hauptanwendung<span class="colon">:</span></dt><dd><p>File-Sharing-Systeme (insbesondere BitTorrent)</p></dd></dl><ld-supplemental><p>Die große Zeit der klassischen Peer-to-Peer-Systeme war in den 2000er Jahren.</p><ul class="positive-list simple"><li><p>Vorteile von P2P Systemen sind: billig, fehlertolerant, dynamisch, selbstkonfigurierend, immens hohe Speicherkapazität, hohe Datenzugriffsgeschwindigkeit.</p></li></ul><ul class="negative-list simple"><li><p>Probleme von P2P Systemen sind: Start-Up, schlecht angebundene, leistungsschwache Peers; <em>Free-Riders</em>; Copyright-Probleme.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="cloud-computing"><h2>Cloud-Computing</h2><aside class="admonition" data-theme="definition"><p class="admonition-title" data-theme="definition-header"><span>Definition: Cloud-Computing</span></p><p>Die Bereitstellung von Rechenleistung, Speicher und Anwendungen als Dienstleistung. Es ist die  Weiterentwicklung des Grid-Computing.</p></aside><div class="incremental"><p class="rubric">Varianten</p><ul class="list-with-explanations"><li><p>Public Cloud (z. B. Amazon EC2, Google Apps, Microsoft Azure, …)</p></li><li><p>Private Cloud</p></li><li><p>Hybrid Cloud</p><p>(Private Cloud wird bei Bedarf durch Public Cloud ergänzt.)</p></li><li><p>Virtual Private Cloud</p></li></ul></div><ld-supplemental><ul class="positive-list simple"><li><p>Vorteile des Cloud-Computings: Kosten, Aktualität von Daten und Diensten, keine eigene Infrastruktur notwendig, Unterstützung von mobilen Teilnehmern</p></li></ul><ul class="negative-list"><li><p>Probleme des Cloud-Computings: Sicherheit und Vertrauen, Verlust von eigenem Know-How, Umgang mit klassifizierten Daten.</p><p>Ein Ausweg könnte <a class="reference external" href="https://de.wikipedia.org/wiki/Homomorphe_Verschl%C3%BCsselung">Hommomorphe Verschlüsselung</a> sein, die es ermöglicht, Berechnungen auf verschlüsselten Daten durchzuführen.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="serverless-computing"><h2><em>Serverless Computing</em></h2><p><em>Serverless Computing</em> ermöglicht es Entwicklern Anwendungen schneller zu erstellen, da sie sich nicht mehr um die Verwaltung der Infrastruktur kümmern müssen.</p><ul class="positive-list incremental simple"><li><p>Der Cloud-Service-Anbieter stellt die für die Ausführung des Codes erforderliche Infrastruktur automatisch bereit, skaliert und verwaltet sie.</p></li></ul><ul class="negative-list incremental list-with-explanations"><li><p>Vendor-Lock-In</p></li><li><p>Kaltstart-Latenz</p><p>Zeit bis der erste Code ausgeführt wird kann höher sein, da die Instanziierung der Serverless-Funktionen erst bei Bedarf erfolgt.</p></li><li><p>Debugging und Monitoring</p><p>Klassische Tools und Methoden sind nicht mehr anwendbar.</p></li><li><p>Kostentransparenz/-management</p><p>Die Kosten für Serverless-Computing sind schwer vorherzusagen und zu kontrollieren.</p></li></ul></ld-topic>
<ld-topic class="new-section transition-fade" id="herausforderungen-bei-der-entwicklung-verteilter-systeme"><h2>Herausforderungen bei der Entwicklung verteilter Systeme</h2></ld-topic>
<ld-topic id="integration-von-anwendungen"><h2>Integration von Anwendungen</h2><div class="assessment"><p>Die Standardanwendungen in Unternehmen sind vernetzte Anwendungen und die Herstellung der Interoperabilität zwischen diesen Anwendungen ist eine große Herausforderung.</p></div><div class="incremental margin-top-1em"><p class="rubric">Grundlegender Ansatz</p><p><em>Clients</em> kombinieren Anfragen für (verschiedene) Anwendungen, senden diese, sammeln die Antworten und präsentieren dem Benutzer ein kohärentes Ergebnis.</p></div><div class="incremental margin-top-1em"><p class="rubric">Weiterentwicklung</p><p>Die direkte Kommunikation zwischen den Anwendungen führt zur Integration von Unternehmensanwendungen (<span class="eng">Enterprise Application Integration (EAI)</span>).</p></div><ld-supplemental><p>Eine vernetzte Anwendung ist eine Anwendung, die auf einem Server läuft und ihre Dienste für entfernte Clients verfügbar macht.</p></ld-supplemental></ld-topic>
<ld-topic id="transaktionen-auf-geschaftsprozessebene"><h2>Transaktionen auf Geschäftsprozessebene</h2><ld-grid class="default-layout"><ld-cell style="align-self:auto;"><object class="light-image align-center" data="drawings/transactions/transaction.svg" type="image/svg+xml" role="img"></object><div class="text-align-center margin-top-1em"><p><strong>„Alles oder nichts.“</strong></p></div></ld-cell><ld-cell class="width-60" style="align-self:auto;"><ld-deck><ld-card><table><colgroup><col style="width: 40.0%"><col style="width: 60.0%"></colgroup><thead><tr><th class="head"><p>Primitiv</p></th><th class="head"><p>Beschreibung</p></th></tr></thead><tbody><tr><td><p>BEGINN DER TRANSAKTION</p></td><td><p>Zeigt den Beginn einer Transaktion an.</p></td></tr><tr><td><p>ENDE DER TRANSAKTION</p></td><td><p>Beendigung der Transaktion mit dem Versuch eines COMMIT.</p></td></tr><tr><td><p>ABBRUCH DER TRANSAKTION</p></td><td><p>Beenden der Transaktion und Wiederherstellung des alten Zustands.</p></td></tr><tr><td><p>LESEN</p></td><td><p>Lesen von Daten aus (z. B.) einer Datei oder einer Tabelle.</p></td></tr><tr><td><p>SCHREIBEN</p></td><td><p>Schreiben von Daten (z. B.) in eine Datei oder eine Tabelle.</p></td></tr></tbody></table></ld-card><ld-card class="incremental"><dl class="field-list simple"><dt>Atomar <span class="eng">Atomic</span><span class="colon">:</span></dt><dd><p>geschieht untrennbar (scheinbar)</p></dd><dt>Konsistent <span class="eng">Consistent</span><span class="colon">:</span></dt><dd><p>keine Verletzung von Systeminvarianten</p></dd><dt>Isoliert <span class="eng">Isolated</span><span class="colon">:</span></dt><dd><p>keine gegenseitige Beeinflussung</p></dd><dt>Dauerhaft <span class="eng">Durable</span><span class="colon">:</span></dt><dd><p>Nach einem Commit sind die Änderungen dauerhaft</p></dd></dl><p>≙ <span class="eng">ACID</span>-Eigenschaften</p></ld-card></ld-deck></ld-cell></ld-grid></ld-topic>
<ld-topic id="transaction-processing-monitor-tpm"><h2><em>Transaction Processing Monitor (TPM)</em></h2><div class="assessment"><p>Die für eine Transaktion benötigten Daten, sind oft verteilt über mehrere Server.</p></div><object class="light-image incremental align-center" data="drawings/transactions/tpm.svg" type="image/svg+xml" role="img"></object><div class="incremental smaller"><p>Ein TPM ist für die Koordination der Ausführung einer Transaktion verantwortlich.</p></div><ld-supplemental><p>Insbesondere im Zusammenhang mit Microservices ist der Einsatz von TPMs und 2PC zum Zwecke der Koordination von Geschäftsprozessen häufig nicht die 1. Wahl.</p><p>Nichtsdestotrotz sind verteilte Transaktionen ein wichtiger Bestandteil von verteilten Systemen und Google hat z. B. mit Spanner eine Lösung entwickelt, die Transaktionen im globalen Maßstab ermöglicht  (<em>Global Consistency</em>). (<a class="reference external" href="https://cloud.google.com/spanner?hl=en">https://cloud.google.com/spanner?hl=en</a> und <a class="reference external" href="https://www.youtube.com/watch?v=iKQhPwbzzxU">https://www.youtube.com/watch?v=iKQhPwbzzxU</a>).</p></ld-supplemental></ld-topic>
<ld-topic id="middleware-und-enterprise-application-integration-eai"><h2><em>Middleware</em> und <em>Enterprise Application Integration (EAI)</em></h2><p>Middleware ermöglicht Kommunikation zwischen den Anwendungen.</p><object class="light-image align-center" data="drawings/middleware.svg" type="image/svg+xml" role="img"></object><ld-supplemental><dl class="field-list simple"><dt>Remote Procedure Call (RPC)<span class="colon">:</span></dt><dd><p>Anfragen werden über einen lokalen Prozeduraufruf gesendet, als Nachricht verpackt, verarbeitet, von einer Nachricht beantwortet und das Ergebnis ist dann der Rückgabewert des Prozeduraufrufs.</p></dd><dt>Nachrichtenorientierte Middleware <span class="eng">Message Oriented Middleware (MOM)</span><span class="colon">:</span></dt><dd><p>Nachrichten werden an einen logischen Kontaktpunkt gesendet (d. h.veröffentlicht) und Anwendungen weitergeleitet, die diese Nachrichten abonnieren.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic class="smaller" id="wie-kann-die-anwendungsintegration-erreicht-werden"><h2>Wie kann die Anwendungsintegration erreicht werden?</h2><dl class="incremental-list dd-margin-left-2em field-list"><dt>Dateiübertragung<span class="colon">:</span></dt><dd><p>Technisch einfach, aber nicht flexibel:</p><ul class="simple"><li><p>Dateiformat und Layout herausfinden</p></li><li><p>Dateiverwaltung regeln</p></li><li><p>Weitergabe von Aktualisierungen und Aktualisierungsbenachrichtigungen</p></li></ul></dd><dt>Gemeinsame Datenbank<span class="colon">:</span></dt><dd><p>Sehr viel flexibler, erfordert aber immer noch ein gemeinsames Datenschema neben dem Risiko eines Engpasses.</p></dd><dt>Entfernter Prozeduraufruf <span class="eng">Remote Procedure Call (RPC)</span><span class="colon">:</span></dt><dd><p>Wirksam, wenn die Ausführung einer Reihe von Aktionen erforderlich ist.</p></dd><dt>Nachrichtenübermittlung <span class="eng">Messaging</span><span class="colon">:</span></dt><dd><p>Ermöglicht eine zeitliche und räumliche Entkopplung im Vergleich zu RPCs.</p></dd></dl></ld-topic>
<ld-topic class="new-section transition-fade" id="moderne-verteilte-systeme"><h2>Moderne verteilte Systeme</h2></ld-topic>
<ld-topic id="distributed-pervasive-ubiquitous-systems"><h2><em>Distributed Pervasive/Ubiquitous Systems</em></h2><div class="minor"><p>(<span class="ger">verteilte, allgegenwärtige/alles durchdringende Systeme</span>)</p></div><div class="assessment"><p>Moderne verteilte Systeme zeichnen sich dadurch aus, dass die Knoten klein, mobil und oft in ein größeres System eingebettet sind. Das System bettet sich auf natürliche Weise in die Umgebung des Benutzers ein. Die Vernetzung ist drahtlos.</p></div><div class="incremental footnotesize"><p>Drei (sich überschneidende) Untertypen</p><dl class="field-list simple"><dt>Ubiquitous Computing<span class="colon">:</span></dt><dd><p><em>allgegenwärtig und ständig präsent</em>; d. h., es besteht eine ständige Interaktion zwischen System und Benutzer.</p></dd><dt>Mobile Computing<span class="colon">:</span></dt><dd><p><em>allgegenwärtig</em>; der Schwerpunkt liegt auf der Tatsache, dass Geräte von Natur aus mobil sind.</p></dd><dt>Sensor-/Actuator Networks<span class="colon">:</span></dt><dd><p><em>allgegenwärtig</em>; Schwerpunkt liegt auf der tatsächlichen (kollaborativen) Erfassung (<span class="eng">sensing</span>) und Betätigung (<span class="eng">actuation</span>).</p></dd></dl></div></ld-topic>
<ld-topic id="ubiquitous-systems-kernbestandteile"><h2><em>Ubiquitous Systems</em> - Kernbestandteile</h2><ol class="arabic incremental-list simple"><li><p><span class="eng">Distribution</span>: Die Geräte sind vernetzt, verteilt und ohne Hürde zugänglich.</p></li><li><p><span class="eng">Interaction</span>: Die Interaktion zwischen Benutzern und Geräten ist in hohem Maße unaufdringlich.</p></li><li><p><span class="eng">Context Awareness</span>: Das System kennt den Kontext eines Benutzers, um die Interaktion zu optimieren.</p></li><li><p><span class="eng">Autonomy</span>: Die Geräte arbeiten autonom, ohne menschliches Eingreifen, und verwalten sich in hohem Maße eigenständig.</p></li><li><p><span class="eng">Intelligence</span>: Das System als Ganzes kann ein breites Spektrum dynamischer Aktionen und Interaktionen bewältigen.</p></li></ol></ld-topic>
<ld-topic id="mobile-computing-auszeichnende-merkmale"><h2><em>Mobile Computing</em> - Auszeichnende Merkmale</h2><ul class="incremental-list simple"><li><p>Eine Vielzahl unterschiedlicher mobiler Geräte (Smartphones, Tablets, GPS-Geräte, Fernbedienungen, aktive Ausweise).</p></li><li><p>Mobil bedeutet, dass sich der Standort eines Geräts im Laufe der Zeit ändern kann. Dies kann z. B. Auswirkung haben auf die lokalen Dienste oder die Erreichbarkeit.</p></li><li><p>Die Aufrechterhaltung einer stabilen Kommunikation kann zu ernsthaften Problemen führen.</p></li></ul><aside class="admonition incremental margin-top-1em" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>Aktueller Stand ist, dass mobile Geräte Verbindungen zu stationären Servern herstellen, wodurch diese im Prinzip <em>Clients</em> von Cloud-basierten Diensten sind.</p></aside></ld-topic>
<ld-topic id="mobile-cloud-computing"><h2><em>Mobile Cloud Computing</em></h2><object class="light-image align-center" data="drawings/mobile_computing/mobile_cloud_computing.svg" type="image/svg+xml" role="img"></object></ld-topic>

<ld-topic id="sensor-networks"><h2><em>Sensor Networks</em></h2><p>Die Knoten, an denen Sensoren angebracht sind:</p><ul class="simple"><li><p>„viele“</p></li><li><p>einfach (geringe Speicher- / Rechen- / Kommunikationskapazität)</p></li><li><p>oft batteriebetrieben (oder sogar batterielos)</p></li></ul><object class="light-image align-center" data="drawings/sensor_networks/operator_stores_and_processes_data.svg" type="image/svg+xml" role="img"></object></ld-topic>
<ld-topic id="sensor-networks-als-verteilte-datenbanken"><h2><em>Sensor Networks</em> als verteilte Datenbanken</h2><object class="light-image align-center" data="drawings/sensor_networks/nodes_store_and_process_data.svg" type="image/svg+xml" role="img"></object></ld-topic>

<ld-topic id="fallstricke-bei-der-entwicklung-verteilter-systeme"><h2>Fallstricke bei der Entwicklung verteilter Systeme</h2><aside class="admonition" data-theme="observation"><p class="admonition-title" data-theme="observation-header"><span>Beobachtung</span></p><p>Viele verteilte Systeme sind unnötig komplex aufgrund fehlerhafter Annahmen sowie von Architektur- und Designfehlern, die später nachgebessert werden müssen.</p></aside><div class="incremental"><p class="rubric">Falsche (und oft versteckte) Annahmen</p><ul class="incremental-list simple"><li><p>Das Netzwerk ist zuverlässig</p></li><li><p>Das Netzwerk ist sicher</p></li><li><p>Das Netz ist homogen</p></li><li><p>Die Topologie ändert sich nicht</p></li><li><p>Die Latenz ist gleich null</p></li><li><p>Die Bandbreite ist unendlich</p></li><li><p>Die Transportkosten sind gleich null</p></li><li><p>Es gibt nur einen Administrator</p></li></ul></div></ld-topic>
