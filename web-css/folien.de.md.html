<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>
</head>
<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="css-cascading-style-sheets"><h2>CSS - Cascading Style Sheets</h2><p>CSS (Cascading Style Sheets) ist eine Stylesheet-Sprache, die verwendet wird, um das Aussehen von Dokumenten zu gestalten.</p><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">HTML</p><pre class="code html copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>section</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>1. Absatz<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>2. Absatz<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>3. Absatz<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">5</small><code data-lineno="5"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>section</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">CSS und Resultat</p><ld-module name="embedded-iframe" scope="all">&#x3C;iframe
        width="100%"
        srcdoc='
    &#x3C;html>
        &#x3C;head>
            {{ld-embedded-iframe.head.frag.html}}
            {{ld-embedded-iframe.editable-styles.frag.html}}
            &#x3C;style>
            p {margin: 0; padding:0;}
            &#x3C;/style>
        &#x3C;/head>
        &#x3C;body>
            &#x3C;style spellcheck="false" contenteditable >p { color: red; }
p ~ p { color: blue; }
p:nth-child(3) { color: green; }&#x3C;/style>
            &#x3C;hr>
            &#x3C;section>
                &#x3C;p>1. Absatz&#x3C;/p>
                &#x3C;p>2. Absatz&#x3C;/p>
                &#x3C;p>3. Absatz&#x3C;/p>
            &#x3C;/section>
        &#x3C;/body>
    &#x3C;/html>' >

<ld-topic id="css-historie"><h2>CSS - Historie</h2><ul class="incremental-list simple"><li><p>Entwicklung begann 1994; CSS 1 wurde 1996 veröffentlicht und war erst einmal ein Fehlschlag</p></li><li><p>CSS 2 wurde 1998 veröffentlicht</p></li><li><p>CSS 3 wurde modularisiert, um die Entwicklung zu beschleunigen</p><ul class="incremental just-a-bit-smaller simple"><li><p>CSS Color Level 3 (2012)</p></li><li><p>CSS Namespaces Level 3 (2012)</p></li><li><p>CSS Selectors Level 3 (2012)</p></li><li><p>...</p></li><li><p>CSS Flexbox Level 1 (2018) (<a class="reference external" href="https://www.w3.org/standards/history/css-flexbox-1/">nach 9 Jahren Entwicklungszeit</a>)</p></li><li><p>CSS Selectors Level 4 (<a class="reference external" href="https://www.w3.org/TR/selectors-4/">2024 noch Draft Status</a>; insbesondere  <code class="css"><span class="punctuation">:</span><span class="name function">has</span><span class="punctuation">(</span><span class="punctuation">)</span></code>  hat <a class="reference external" href="https://caniuse.com/css-has">breite Unterstützung</a>)</p></li><li><p>CSS Nesting (<a class="reference external" href="https://drafts.csswg.org/css-nesting/">2024 noch Draft Status</a>; <a class="reference external" href="https://caniuse.com/css-nesting">dennoch bereits seit 2024 weit verfügbar</a>)</p></li></ul></li></ul></ld-topic>
<ld-topic id="grundlagen"><h2>Grundlagen</h2><p>Eine CSS-Datei besteht aus Regeln, die aus einem Selektor und einer oder mehreren Deklarationen bestehen:</p><object class="align-center" data="drawings/css.svg" type="image/svg+xml" role="img" aria-label="Aufbau von CSS-Regeln"></object><ld-grid class="incremental default-layout"><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">CSS</p><pre class="code css copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag">h1</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">  <span class="name attribute">color</span><span class="punctuation">:</span> blue<span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">  <span class="name attribute">font-size</span><span class="punctuation">:</span> larger<span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="name tag">body</span> <span class="punctuation">{</span> <span class="comment single">/* the boss said so... */</span>
</code><small class="ln">6</small><code data-lineno="6">  <span class="name attribute">background-color</span><span class="punctuation">:</span>
</code><small class="ln">7</small><code data-lineno="7">    lightblue<span class="punctuation">;</span>
</code><small class="ln">8</small><code data-lineno="8"><span class="punctuation">}</span></code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">Resultat</p><ld-module name="embedded-iframe" scope="all">&#x3C;iframe width="100%"
        srcdoc='
    &#x3C;html>
        &#x3C;head>{{ld-embedded-iframe.head.frag.html}}&#x3C;/head>
    &#x3C;body>
        &#x3C;style>
            html { font-face: Helvetica, sans-serif; }
            h1 {
                color: blue;
                font-size: larger;
            }
            body {
                background-color: lightblue;
            }
        &#x3C;/style>
        &#x3C;h1>Überschrift&#x3C;/h1>
        &#x3C;p contenteditable>Paragraph&#x3C;strong> in sehr wichtig!&#x3C;/strong>.&#x3C;/p>
    &#x3C;/body>
'>
    iframes are not supported
&#x3C;/iframe></ld-module></ld-cell></ld-grid><ld-supplemental><p>CSS ist im wesentlichen <em>Whitespace insensitive</em>, d. h. Leerzeichen, Zeilenumbrüche und Tabulatoren werden ignoriert.</p><p>Kommentare werden in <code class="css"><span class="comment single">/* ... */</span></code> geschrieben.</p></ld-supplemental></ld-topic>
<ld-topic id="verknupfung-von-css-und-html"><h2>Verknüpfung von CSS und HTML</h2><ul class="incremental-list"><li><p>Inline CSS: <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span> <span class="name attribute">style</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span><span class="name attribute">color</span><span class="punctuation">:</span> red<span class="punctuation">;</span><span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span></code></p></li><li><p>Externe CSS-Datei:</p><ul class="list-with-explanations incremental-list"><li><p>über Link: <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>link</span> <span class="name attribute">rel</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>stylesheet<span class="punctuation">"</span></span> <span class="name attribute">media</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>screen, print<span class="punctuation">"</span></span> <span class="name attribute">href</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>style.css<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span></code></p><p>(Normalerweise im <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>head</span><span class="punctuation">&gt;</span></span></code> deklariert.)</p></li><li><p>mittels <code class="javascript"><span class="keyword">import</span></code> Direktive<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a>: <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>style</span><span class="punctuation">&gt;</span></span><span class="keyword">@import <span class="literal string"><span class="name function">url</span><span class="punctuation">(</span>style2.css<span class="punctuation">)</span></span><span class="punctuation">;</span></span><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>style</span><span class="punctuation">&gt;</span></span></code></p></li></ul></li></ul><ul class="list-with-explanations incremental-list"><li><p>im <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>style</span><span class="punctuation">&gt;</span></span></code> Element: <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>style</span><span class="punctuation">&gt;</span></span> <span class="name tag">h1</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> blue<span class="punctuation">;</span> <span class="punctuation">}</span> <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>style</span><span class="punctuation">&gt;</span></span></code></p><p>(Normalerweise im <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>head</span><span class="punctuation">&gt;</span></span></code> deklariert.)</p></li><li><p>Das Verwenden beliebig vieler CSS-Dateien und <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>style</span><span class="punctuation">&gt;</span></span></code> Elemente ist möglich.</p></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://developer.mozilla.org/en-US/docs/Web/CSS/@import">Siehe "@import" auf developer.mozilla.org</a></p></aside></aside></ld-topic>
<ld-topic class="new-section transition-fade" id="selektoren"><h2>Selektoren</h2></ld-topic>
<ld-topic id="ubersicht-uber-selektoren"><h2>Übersicht über Selektoren</h2><ld-story><aside class="admonition" data-theme="remember"><p class="admonition-title" data-theme="remember-header"><span>Zur Erinnerung</span></p><p>Im folgenden Beispiel ist <code class="css">h1</code> der Selektor:</p><pre class="code css literal-block"><code><span class="name tag">h1</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> blue<span class="punctuation">;</span> <span class="name attribute">font-size</span><span class="punctuation">:</span> larger<span class="punctuation">;</span> <span class="punctuation">}</span></code></pre><p>Der Selektor bestimmt, auf welche HTML Elemente die Regel angewendet werden soll.</p></aside><dl class="incremental-list field-list simple"><dt><em>Typ</em><span class="colon">:</span></dt><dd><p>Selektoren basierend auf dem Typ des auszuwählenden Elements (z. B. <code class="html">h1</code>, <code class="html">div</code>, <code class="html">span</code>, ...); meistens von HTML Elementen.</p></dd><dt><em>IDs</em><span class="colon">:</span></dt><dd><p>Selektoren basierend auf den Werten der (einmaligen) <span class="docutils literal">id</span> Attribute (z. B. <span class="docutils literal">#core</span>, <span class="docutils literal">#impressum</span>, ...).</p></dd><dt><em>Klassen</em><span class="colon">:</span></dt><dd><p>Selektoren, die auf den Werten der <span class="docutils literal">class</span> Attribute basieren (z. B. <span class="docutils literal">.important</span>, <span class="docutils literal">.highlight</span>, ...).</p></dd><dt><em>Attributwerte</em><span class="colon">:</span></dt><dd><p>Selektoren, die auf einem Attribut bzw. dem Wert eines Attributs als solches basieren (z. B. <span class="docutils literal">[href]</span>, <span class="docutils literal">[type='text']</span>, ...).</p></dd><dt><em>Pseudoklassen</em><span class="colon">:</span></dt><dd><p>Selektoren in Hinblick auf den Zustand eines Elements (z. B. <span class="docutils literal">:hover</span>, <span class="docutils literal">:active</span>, ...).</p></dd><dt><em>Pseudoelemente</em><span class="colon">:</span></dt><dd><p>Selektoren, die sich auf einen Teil eines Elements beziehen (z. B. <span class="docutils literal">::first-line</span>, <span class="docutils literal">::first-letter</span>, ...).</p></dd></dl><p><span class="peripheral">Beachte, dass bei Pseudoelementen am Anfang des Selektors zwei "::" verwendet werden.</span></p><dl class="field-list simple"><dt><em>Gruppierung</em><span class="colon">:</span></dt><dd><p>Gruppierungen von durch Kommas getrennten Selektoren für die dieselben Regeln angewandt werden sollen (z. B. <span class="docutils literal">h1, h2, h3 { ... }</span>).</p></dd><dt><em>Kombinatoren</em><span class="colon">:</span></dt><dd><p>Selektoren, die auf der Beziehung zwischen zwei Elementen basieren (z. B. <span class="docutils literal">div p { ... }</span>).</p></dd></dl></ld-story></ld-topic>
<ld-topic id="class-selectors-beispiel"><h2><span class="eng">Class-Selectors</span> - Beispiel<a class="brackets" href="#footnote-2" id="footnote-reference-2" role="doc-noteref"><span class="fn-bracket">[</span>2<span class="fn-bracket">]</span></a></h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span><span class="punctuation">&gt;</span></span>Die Bedeutung des Seins<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h1</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>wip<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">3</small><code data-lineno="3">    Die Bedeutung des Nicht-Seins
</code><small class="ln">4</small><code data-lineno="4"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h1</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">5</small><code data-lineno="5"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>todo future<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">6</small><code data-lineno="6">    Das Sein und das Nicht-Sein
</code><small class="ln">7</small><code data-lineno="7"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h1</span><span class="punctuation">&gt;</span></span></code></pre><p><em>CSS</em></p><pre class="code css copy-to-clipboard incremental-code literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag">h1</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> black <span class="punctuation">}</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name tag">h1.wip</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> green<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="name tag">*.todo</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> red<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="name tag">.future</span> <span class="punctuation">{</span> <span class="name attribute">text-decoration</span><span class="punctuation">:</span> underline<span class="punctuation">;</span><span class="punctuation">}</span></code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><em>Resultat</em></p><ld-module name="embedded-iframe" scope="all">&#x3C;iframe width="100%"
        srcdoc='
    &#x3C;html>&#x3C;head>{{ld-embedded-iframe.head.frag.html}}&#x3C;/head>
    &#x3C;body>
        &#x3C;style>
            h1 { color: black }
            h1.wip { color: green; }
            *.todo { color: red; }
            .future { text-decoration: underline;}
        &#x3C;/style>
        &#x3C;h1>Die Bedeutung des Seins&#x3C;/h1>
        &#x3C;h1 class="wip">Die Bedeutung des Nicht-Seins&#x3C;/h1>
        &#x3C;h1 class="todo future">Das Sein und das Nicht-Sein&#x3C;/h1>
    &#x3C;/body>' >
    iframes are not supported.
&#x3C;/iframe></ld-module></ld-cell></ld-grid><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-2" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-2">2</a><span class="fn-bracket">]</span></span><p>ID basierte Selektoren funktionieren vergleichbar, jedoch wird ein "<span class="docutils literal">#</span>" anstatt eines "<span class="docutils literal">.</span>" verwendet. (In CSS müssen IDs nicht eindeutig sein; dies ist aber eine Verletzung von HTML und eindeutige IDs sind eine <em>Best Practice</em>.)</p></aside></aside></ld-topic>
<ld-topic id="attribute-selectors"><h2><span class="eng">Attribute-Selectors</span><a class="brackets" href="#footnote-3" id="footnote-reference-3" role="doc-noteref"><span class="fn-bracket">[</span>3<span class="fn-bracket">]</span></a></h2><ul class="incremental-list simple"><li><p>basierend auf der Existenz eines Attributs: <code class="css"><span class="name tag">h1[lang]</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> red<span class="punctuation">;</span> <span class="punctuation">}</span></code></p></li><li><p>basierend auf dem <em>exakten</em> Wert eines Attributs: <code class="css"><span class="name tag">h1[lang="de-DE"]</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> red<span class="punctuation">;</span> <span class="punctuation">}</span></code></p></li><li><p>basierend auf einem partiellen Match:</p><ul class="incremental-list simple"><li><p>enthält als eigenständiges <span class="docutils literal">de</span>: <code class="css"><span class="name tag">h1[lang~="de"]</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> red<span class="punctuation">;</span> <span class="punctuation">}</span></code></p></li><li><p>beginnt mit <span class="docutils literal">de</span>: <code class="css"><span class="name tag">h1[lang^="de"]</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> red<span class="punctuation">;</span> <span class="punctuation">}</span></code></p></li><li><p>substring <span class="docutils literal">de</span>: <code class="css"><span class="name tag">h1[lang*="de"]</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> red<span class="punctuation">;</span> <span class="punctuation">}</span></code></p></li><li><p>endet mit <span class="docutils literal">de</span> : <code class="css"><span class="name tag">h1[lang$="de"]</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> red<span class="punctuation">;</span> <span class="punctuation">}</span></code></p></li><li><p>beginnt mit <span class="docutils literal">de</span> und wird dann gefolgt von einem Bindestrich oder steht alleine: <code class="css"><span class="name tag">h1[lang|="de"]</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> red<span class="punctuation">;</span> <span class="punctuation">}</span></code></p></li></ul></li><li><p>durch ein <span class="docutils literal">i</span> am Ende wird der <strong>Selektor für den Wert</strong> <em>case-insensitive</em>: <code class="css"><span class="name tag">h1[lang="de-de" i]</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> red<span class="punctuation">;</span> <span class="punctuation">}</span></code></p></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-3" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-3">3</a><span class="fn-bracket">]</span></span><p>Im Allgemeinen sind Attribut-basierte Selektoren vergleichsweise fragil und werden deswegen nur spärlich eingesetzt. Im Zusammenhang mit <code class="css">data-*</code> Attributen ist dies jedoch eine sehr mächtige Technik.</p></aside></aside></ld-topic>
<ld-topic id="attribute-selectors-beispiel"><h2><span class="eng">Attribute-Selectors</span> - Beispiel</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span> <span class="name attribute">lang</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>de-DE<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">2</small><code data-lineno="2">    Die Bedeutung des Seins.<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h1</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">3</small><code data-lineno="3"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span> <span class="name attribute">lang</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>en-GB<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">4</small><code data-lineno="4">    To Be Or Not To Be<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h1</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">5</small><code data-lineno="5"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span> <span class="name attribute">lang</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>en-US<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">6</small><code data-lineno="6">    Play to win!<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h1</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">7</small><code data-lineno="7"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span> <span class="name attribute">lang</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>de-AT<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">8</small><code data-lineno="8">    Ich brauch ne Jause<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h1</span><span class="punctuation">&gt;</span></span></code></pre><p><em>CSS</em></p><pre class="code css copy-to-clipboard incremental-code literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag">[lang]</span> <span class="punctuation">{</span> <span class="name attribute">text-decoration</span><span class="punctuation">:</span> underline<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name tag">[lang$='US']</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> orange<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="name tag">[lang|='en']</span> <span class="punctuation">{</span> <span class="name attribute">font-style</span><span class="punctuation">:</span> italic<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="name tag">[lang="de-at" i]</span> <span class="punctuation">{</span> <span class="name attribute">text-transform</span><span class="punctuation">:</span> uppercase<span class="punctuation">;</span> <span class="punctuation">}</span></code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><em>Resultat</em></p><ld-module name="embedded-iframe" scope="all">&#x3C;iframe width="100%"
        srcdoc='
    &#x3C;html>
        &#x3C;head>{{ld-embedded-iframe.head.frag.html}}&#x3C;/head>
        &#x3C;body>
            &#x3C;style>
                [lang] { text-decoration: underline; }
                [lang$="US"] { color: orange; }
                [lang|="en"] { font-style: italic; }
                [lang="de-at" i] { text-transform: uppercase; }
            &#x3C;/style>
            &#x3C;h1 lang="de-DE">Die Bedeutung des Seins.&#x3C;/h1>
            &#x3C;h1 lang="en-GB">To Be Or Not To Be&#x3C;/h1>
            &#x3C;h1 lang="en-US">Play to win!&#x3C;/h1>
            &#x3C;h1 lang="de-AT">Ich brauch ne Jause&#x3C;/h1>
        &#x3C;/body>' >
    iframes are not supported.
&#x3C;/iframe></ld-module></ld-cell></ld-grid></ld-topic>
<ld-topic id="kombinatoren"><h2>Kombinatoren</h2><ld-story><table class="booktabs incremental" style="width: 100%;"><caption>Nachfahren (bzgl. Dokumentenstruktur) (<span class="eng">Descendant Selector</span>)</caption><colgroup><col style="width: 27.3%"><col style="width: 72.7%"></colgroup><tbody><tr><td><p><code class="css">div p</code></p></td><td><p>alle <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span></code> Nachfahren von <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span><span class="punctuation">&gt;</span></span></code> Elementen</p></td></tr><tr><td><p><code class="css">.important p</code></p></td><td><p>alle <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span></code> Nachfahren von <span class="docutils literal">.important</span> Elementen</p></td></tr></tbody></table><table class="booktabs incremental" style="width: 100%;"><caption>Alle direkten Kinder (<span class="eng">Child Selector</span>)</caption><colgroup><col style="width: 27.3%"><col style="width: 72.7%"></colgroup><tbody><tr><td><p><code class="css">div &gt; p</code></p></td><td><p>alle <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span></code> Kinder von <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span><span class="punctuation">&gt;</span></span></code> Elementen</p></td></tr></tbody></table><table class="booktabs incremental" style="width: 100%;"><caption>Benachbarte Geschwister (<span class="eng">Adjacent Sibling Selector</span>)</caption><colgroup><col style="width: 27.3%"><col style="width: 72.7%"></colgroup><tbody><tr><td><p><code class="css">h1 + p</code></p></td><td><p>alle <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span></code> Elemente, die <em>direkt</em> auf ein <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span><span class="punctuation">&gt;</span></span></code> Element folgen und sich das gleiche Eltern-Element teilen</p></td></tr></tbody></table><table class="booktabs incremental" style="width: 100%;"><caption>Allgemeiner Geschwister Selektor (<span class="eng">General Sibling Selector</span>)</caption><colgroup><col style="width: 27.3%"><col style="width: 72.7%"></colgroup><tbody><tr><td><p><code class="css">h1 ~ p</code></p></td><td><p>alle <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span></code> Elemente, die auf ein <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span><span class="punctuation">&gt;</span></span></code> Element folgen und sich das gleiche Eltern-Element teilen</p></td></tr></tbody></table></ld-story></ld-topic>
<ld-topic id="kombinatoren-beispiele"><h2>Kombinatoren - Beispiele</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span><span class="punctuation">&gt;</span></span>Ü1<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h1</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 2</small><code data-lineno=" 2">Text
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>P1<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>

</code><small class="ln"> 6</small><code data-lineno=" 6"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>P3<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 7</small><code data-lineno=" 7">
</code><small class="ln"> 8</small><code data-lineno=" 8"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span><span class="punctuation">&gt;</span></span>Ü2<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h1</span><span class="punctuation">&gt;</span></span>

</code><small class="ln">12</small><code data-lineno="12">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span><span class="punctuation">&gt;</span></span>D1.2<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">13</small><code data-lineno="13"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">14</small><code data-lineno="14"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span><span class="punctuation">&gt;</span></span>D2<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">15</small><code data-lineno="15"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span><span class="punctuation">&gt;</span></span>D3<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><em>Spielwiese</em></p><ld-module name="embedded-iframe" scope="all">&#x3C;iframe width="100%"

<ld-topic id="pseudo-class-selektors"><h2><em>Pseudo-class Selektors</em></h2><ul class="incremental-list simple"><li><p>erlauben das Selektieren von Elementen basierend auf ihrem Zustand</p></li><li><p>können beliebig kombiniert werden: <code class="css"><span class="name tag">a:link:hover</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> red<span class="punctuation">;</span> <span class="punctuation">}</span></code> selektiert alle nicht-besuchten Links über denen sich die Maus befindet</p></li><li><p>Ausgewählte Beispiele:</p><ul class="incremental-list simple"><li><p>Bzgl. der Struktur: <code class="css"><span class="punctuation">:</span>first-child</code>, <code class="css"><span class="punctuation">:</span>last-child</code>, <code class="css"><span class="punctuation">:</span><span class="name function">nth-child</span><span class="punctuation">(</span>n<span class="punctuation">)</span></code>, <code class="css"><span class="punctuation">:</span><span class="name function">nth-of-type</span><span class="punctuation">(</span>n<span class="punctuation">)</span></code>, <code class="css"><span class="punctuation">:</span>root</code>, <code class="css"><span class="punctuation">:</span>only-child</code>, <code class="css"><span class="punctuation">:</span>only-of-type</code>, <code class="css"><span class="punctuation">:</span>link</code>, <code class="css"><span class="punctuation">:</span>visited</code></p></li><li><p>Basierend auf Nutzerinteraktionen: <code class="css"><span class="punctuation">:</span>hover</code>, <code class="css"><span class="punctuation">:</span>active</code>, <code class="css"><span class="punctuation">:</span>focus</code></p></li><li><p>Zustand des Elements: <code class="css"><span class="punctuation">:</span>enabled</code>, <code class="css"><span class="punctuation">:</span>disabled</code>, <code class="css"><span class="punctuation">:</span>checked</code>, <code class="css"><span class="punctuation">:</span>valid</code>, <code class="css"><span class="punctuation">:</span>invalid</code></p></li><li><p>Sprache und Lokalisierung: <code class="css"><span class="punctuation">:</span><span class="name function">lang</span><span class="punctuation">(</span>de<span class="punctuation">)</span></code>, <code class="css"><span class="punctuation">:</span><span class="name function">dir</span><span class="punctuation">(</span>ltr<span class="punctuation">)</span></code></p></li><li><p>Logische Selektoren: <code class="css"><span class="punctuation">:</span><span class="name function">not</span><span class="punctuation">(</span>selector<span class="punctuation">)</span></code>, <code class="css"><span class="punctuation">:</span><span class="name function">is</span><span class="punctuation">(</span>selector<span class="punctuation">)</span></code>, <code class="css"><span class="punctuation">:</span><span class="name function">where</span><span class="punctuation">(</span>selector<span class="punctuation">)</span></code>, <code class="css"><span class="punctuation">:</span><span class="name function">has</span><span class="punctuation">(</span>selector<span class="punctuation">)</span></code></p></li></ul></li><li><p>Pseudo-class Selektoren beziehen sich immer auf das aktuelle Element.</p></li></ul><ld-supplemental><ul class="simple"><li><p>Bei <code class="css"><span class="name function">nth-child</span><span class="punctuation">(</span>n<span class="punctuation">)</span></code> und <code class="css"><span class="name function">nth-of-type</span><span class="punctuation">(</span>n<span class="punctuation">)</span></code> ist n eine Zahl oder ein Ausdruck (<span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>α</mi><mtext> </mtext><mi>n</mi><mo>+</mo><mi>b</mi></mrow><annotation encoding="application/x-tex">\alpha\,n+b</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0037em;">α</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6944em;"></span><span class="mord mathnormal">b</span></span></span></span></span>), der eine Zahl ergibt (z. B. <span class="docutils literal">2n+1</span> oder aber <span class="docutils literal">even</span>). Das Zählen der Elemente beginnt bei 1.</p></li><li><p><code class="css"><span class="punctuation">:</span>root</code> selektiert das Wurzelelement des Dokuments, also das <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>html</span><span class="punctuation">&gt;</span></span></code> Element bei HTML Dokumenten oder das <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>svg</span><span class="punctuation">&gt;</span></span></code> Element bei SVG Dokumenten. <span class="docutils literal">:root</span> wird insbesondere zur Definition von CSS Variablen verwendet!</p></li><li><p><code class="css"><span class="punctuation">:</span>only-child</code> und <code class="css"><span class="punctuation">:</span>only-of-type</code> selektiert ein Element, das das einzige entsprechende Kind seines Eltern-Elements ist.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="pseudo-class-selektors-beispiel"><h2><em>Pseudo-class Selektors</em> - Beispiel</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><strong>HTML</strong></p><pre class="code html copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>oma<span class="punctuation">"</span></span> <span class="name attribute">id</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>Maria<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>papa<span class="punctuation">"</span></span> <span class="name attribute">id</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>Fritz<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 3</small><code data-lineno=" 3">        Vater 1
</code><small class="ln"> 4</small><code data-lineno=" 4">        <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>kind<span class="punctuation">"</span></span> <span class="name attribute">id</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>Elias<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 5</small><code data-lineno=" 5">            Kind 1
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>papa<span class="punctuation">"</span></span> <span class="name attribute">id</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>Hans<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 9</small><code data-lineno=" 9">        Vater 2
</code><small class="ln">10</small><code data-lineno="10">        <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>kind<span class="punctuation">"</span></span> <span class="name attribute">id</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>Tobias<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">11</small><code data-lineno="11">            Kind 2
</code><small class="ln">12</small><code data-lineno="12">        <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">13</small><code data-lineno="13">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">14</small><code data-lineno="14"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><strong>CSS</strong></p><pre class="code css copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag">.papa:first-child</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> red<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name tag">.kind:first-child</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> green<span class="punctuation">;</span> <span class="punctuation">}</span></code></pre><aside class="admonition" data-theme="question"><p class="admonition-title" data-theme="question-header"><span>Frage</span></p><p>Welcher Selektor selektiert welches Element?</p><div class="peripheral"><p>Zur Erinnerung: Pseudo-class Selektoren selektieren ein Element dann, wenn die Bedingung auf das Element zutrifft.</p></div></aside><ld-module class="incremental-1" name="embedded-iframe" scope="all">&#x3C;iframe
        width="100%"
        srcdoc='
    &#x3C;html>
    &#x3C;head>
        {{ld-embedded-iframe.head.frag.html}}
    &#x3C;/head>
    &#x3C;body>
        &#x3C;style>
            .papa:first-child { color: red; }
            .kind:first-child { color: green; }
        &#x3C;/style>
        &#x3C;div class="oma" id="Maria">
            &#x3C;div class="papa" id="Fritz">
                Vater 1
                &#x3C;div class="kind" id="Elias">
                    Kind 1
                &#x3C;/div>
            &#x3C;/div>
            &#x3C;div class="papa" id="Hans">
                Vater 2
                &#x3C;div class="kind" id="Tobias">
                    Kind 2
                &#x3C;/div>
            &#x3C;/div>
        &#x3C;/div>' >
    iframes are not supported
&#x3C;/iframe></ld-module></ld-cell></ld-grid><div class="incremental-1"><p>Selektiert wird ein Element mit der Klasse <span class="docutils literal">papa</span>, wenn es das erste Kind seines Eltern-Elements ist. Es wird <em>nicht das erste Kind des Elements selektiert</em>.</p></div></ld-topic>
<ld-topic id="pseudo-class-selektors-bzgl-inputvalidierung"><h2><em>Pseudo-class Selektors</em> bzgl. Inputvalidierung</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>input</span> <span class="name attribute">type</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>email<span class="punctuation">"</span></span></span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name tag">       <span class="name attribute">placeholder</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>your email<span class="punctuation">"</span></span></span>
</code><small class="ln">3</small><code data-lineno="3"><span class="name tag">       <span class="name attribute">required</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">4</small><code data-lineno="4"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>input</span> <span class="name attribute">type</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>email<span class="punctuation">"</span></span></span>
</code><small class="ln">5</small><code data-lineno="5"><span class="name tag">       <span class="name attribute">placeholder</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>your friend's email<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><em>Spielwiese</em></p><ld-module name="embedded-iframe" scope="all">&#x3C;iframe width="100%"
        srcdoc='
    &#x3C;html>
        &#x3C;head>
            {{ld-embedded-iframe.head.frag.html}}
            {{ld-embedded-iframe.editable-styles.frag.html}}
            &#x3C;style>
                input {
                    font-size: smaller;
                    padding: 0.5em;
                    display: block;
                    margin: 0.5em;
                    border: 6px solid lightgray;
                }
            &#x3C;/style>
        &#x3C;/head>
        &#x3C;body>
            &#x3C;style spellcheck="false" contenteditable>input[type="email"]:valid {
    color: green;
    border: 6px solid green;
}
/*input[type="email"]:invalid {
    color: red;
    border: 6px solid red;
}*/&#x3C;/style>
            &#x3C;hr>
            &#x3C;input type="email" placeholder="your email"  required>
            &#x3C;input type="email" placeholder="your friend`s email">
        &#x3C;/body>'>
    iframes are not supported
&#x3C;/iframe></ld-module></ld-cell></ld-grid><ld-supplemental><p>Da das zweite Eingabefeld nicht als <span class="docutils literal">required</span> markiert ist, wird es auch dann als <span class="docutils literal">:valid</span> betrachtet, wenn es leer ist.</p></ld-supplemental></ld-topic>

</code><small class="ln"> 7</small><code data-lineno=" 7">      <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>li</span><span class="punctuation">&gt;</span></span>What is CSS?<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>li</span><span class="punctuation">&gt;</span></span>

</code><small class="ln">13</small><code data-lineno="13">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>ol</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">14</small><code data-lineno="14">  <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>aside</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">15</small><code data-lineno="15"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-55" style="align-self:auto;"><p><strong>Aufgaben</strong></p><ol class="arabic simple"><li><p>Schreiben Sie einen CSS Selektor, um den ersten Buchstaben des ersten Wortes eines jeden Listenelements (<code class="css"><span class="punctuation">:</span>first-letter</code>) in Kleinbuchstaben darzustellen mit <code class="css"><span class="name attribute">text-transform</span><span class="punctuation">:</span> lowercase</code>.</p></li><li><p>Schreiben Sie einen CSS Selektor, um jeder zweiten Zeile der Liste eine andere Hintergrundfarbe zu geben mit <code class="css"><span class="name attribute">background-color</span><span class="punctuation">:</span> plum</code>.</p></li><li><p>Selektieren Sie die Überschrift eines Blocks (<code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span><span class="punctuation">&gt;</span></span></code>s) mit der Klasse <code class="html">slide</code> wenn diese das erste Kind ist und geben Sie ihr die Schriftfarbe rot mit <code class="css"><span class="name attribute">color</span><span class="punctuation">:</span> red</code>.</p></li></ol></ld-cell><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:ChWAp67E3NID9RnaTX2S8hzbCsfqZxuPsMsa6DRAtww=:9rzPBvgoYD6NGUUQ:CvTegFxZ24YrIzIEToaOtecBylwY5enB2Iq+0J80PVNLoDvlTKz05kNKEwrLI00oorPf9IpUklWBhPfVkMuq3KfSxDwNLmYc7IVmDWeWuWrmDvNYITTYJKhu/PLnJH/2jyx2FJn0SGaGnZbtFj8kEGggMATLhijNsD58qO8UyS4E1hL/sqZRjdXoyx+i2JUeF5zOePbqQ3Pd+4GmYaxcqy9ymwZoeckb+bS8ch4JtuEH/HPYLGXDQy9sqW50tJvCCz+cEYwUD6WDQ/txba1nDZ+/pWepcKaxqgQl4REdy1I0bFJpvEZNNQNLSKWvc0ZGWrCWMqCW9qvbJfN3iHs6d+9fC7f3sZD9oVz8j9CIx/leoxKqQoxCNMxFITx9A0U7SuJ9Ve2yxsTcYIRxswpQ8FtD0FvxA/Tto2mUsBkJVejxeUywQhZ/BP4cGmU2NR1GYrI/fYaJkpP84ZCIv40pfLpjWmDF+9dwQ+uZd
