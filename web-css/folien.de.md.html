<ld-topic id="flexbox"><h2>Flexbox</h2><ld-deck><ld-card><p>Layout-Modell, das es ermöglicht Elemente einfach innerhalb eines Containers anzuordnen.</p><p>(Aktiviert mit <code class="css"><span class="name attribute">display</span><span class="punctuation">:</span> flex<span class="punctuation">;</span></code> oder <code class="css"><span class="name attribute">display</span><span class="punctuation">:</span> inline-flex</code>.)</p></ld-card><ld-card class="incremental"><ld-grid class="default-layout"><ld-cell class="width-40" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><code><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span> <span class="name attribute">id</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>main<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
  <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>flex-container<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>flex-item<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>1<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>
    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>flex-item<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>2<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>
    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>flex-item<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>3<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>
  <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>
<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-60" style="align-self:auto;"><p><em>Spielwiese</em></p><ld-module class="one-column-iframe with-editable-content" name="embedded-iframe" scope="all">&#x3C;iframe width="100%" srcdoc='

<ld-topic class="new-section transition-fade" id="responsive-design"><h2>Responsive Design</h2></ld-topic>

    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>
        Demokratie ist ein Begriff für
        Formen der Herrschaftsorgani-
        sation auf der Grundlage der
        Partizipation aller.
    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>
<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>section</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><pre class="code html copy-to-clipboard literal-block"><code><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>style</span><span class="punctuation">&gt;</span></span>
    <span class="name tag">section</span> <span class="punctuation">{</span>
        <span class="name attribute">display</span><span class="punctuation">:</span> flex<span class="punctuation">;</span>
        <span class="name attribute">flex-direction</span><span class="punctuation">:</span> row<span class="punctuation">;</span>
        <span class="name attribute">flex-wrap</span><span class="punctuation">:</span> wrap<span class="punctuation">;</span>
        <span class="name attribute">gap</span><span class="punctuation">:</span> 1em<span class="punctuation">;</span>
    <span class="punctuation">}</span>

    <span class="name tag">section p</span> <span class="punctuation">{</span>
        <span class="name attribute">flex-basis</span><span class="punctuation">:</span>
            <span class="name function">calc</span><span class="punctuation">(</span>900px * 999 - 100% * 999<span class="punctuation">)</span><span class="punctuation">;</span>
        <span class="name attribute">flex-grow</span><span class="punctuation">:</span> 1<span class="punctuation">;</span>
        <span class="name attribute">flex-shrink</span><span class="punctuation">:</span> 1<span class="punctuation">;</span>
        <span class="name attribute">background-color</span><span class="punctuation">:</span> whitesmoke<span class="punctuation">;</span>
        <span class="name attribute">padding</span><span class="punctuation">:</span> 1em<span class="punctuation">;</span>
        <span class="name attribute">margin</span><span class="punctuation">:</span> 0<span class="punctuation">;</span>
    <span class="punctuation">}</span>
<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>style</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell></ld-grid><ld-supplemental><p>Der „Trick“ ist, dass die Berechnung für  <code class="css">flex-basis</code> so gewählt ist, dass ab einer bestimmten Größe der Wert für flex-basis entweder sehr groß ist (und damit nur noch ein Element in die Zeile passt oder eben sehr klein ist und damit alle Elemente in eine Zeile passen.)</p><p>Ist der Viewport kleiner als 900px - also zum Beispiel 800px, dann ist der Wert für <code class="css">flex-basis</code> <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>900</mn><mtext> </mtext><mtext>px</mtext><mo>⋅</mo><mn>999</mn><mo>−</mo><mn>800</mn><mtext> </mtext><mtext>px</mtext><mo>⋅</mo><mn>999</mn><mo>=</mo><mn>99.900</mn></mrow><annotation encoding="application/x-tex">900\,\text{px} \cdot 999 - 800\,\text{px} \cdot 999 = 99.900</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">900</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord text"><span class="mord">px</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">999</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">800</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord text"><span class="mord">px</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">999</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">99.900</span></span></span></span></span> und somit extrem groß. Damit wird der Wert von <code class="css">flex-basis</code> „ignoriert“ und jedes Element wird in einer Zeile dargestellt. Ist der Viewport zum Beispiel 1000px, dann ist der Wert für <code class="css">flex-basis</code> <span class="math"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>900</mn><mtext> </mtext><mtext>px</mtext><mo>⋅</mo><mn>999</mn><mo>−</mo><mn>1000</mn><mtext> </mtext><mtext>px</mtext><mo>⋅</mo><mn>999</mn><mo>=</mo><mo>−</mo><mn>99.000</mn></mrow><annotation encoding="application/x-tex">900\,\text{px} \cdot 999 - 1000\,\text{px} \cdot 999 = -99.000</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">900</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord text"><span class="mord">px</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">999</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">1000</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord text"><span class="mord">px</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">999</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">−</span><span class="mord">99.000</span></span></span></span></span> und damit negativ. Somit wird der Wert von <code class="css">flex-basis</code> wieder „ignoriert“ und alle Elemente werden nebeneinander in einer Zeile dargestellt.</p></ld-supplemental></ld-topic>
<ld-topic id="dark-and-light-mode"><h2>Dark and Light Mode</h2><ld-deck><ld-card><ul class="simple"><li><p>Die Unterstützung sowohl von Dark und Light-Mode ist mittlerweile Standard.</p></li><li><p>Der aktuelle Modus kann mittels  <code class="css">prefers-color-scheme</code>  abgefragt werden:</p><ul class="simple"><li><p><code class="css"><span class="keyword">@media <span class="punctuation">(</span> <span class="name attribute">prefers-color-scheme</span><span class="punctuation">:</span> dark <span class="punctuation">)</span></span> <span class="punctuation">{</span> ... <span class="punctuation">}</span></code></p></li><li><p><code class="css"><span class="keyword">@media <span class="punctuation">(</span> <span class="name attribute">prefers-color-scheme</span><span class="punctuation">:</span> light <span class="punctuation">)</span></span> <span class="punctuation">{</span> ... <span class="punctuation">}</span></code></p></li></ul></li></ul></ld-card><ld-card class="incremental"><p>Für einfaches Theming kann auch die CSS-Funktion <code class="css"><span class="name function">light-dark</span><span class="punctuation">(</span><span class="punctuation">)</span></code> verwendet werden. Dies erfordert, dass das <code class="css">color-scheme</code> explizit angegeben wird.</p><p>Zum Beispiel:</p><pre class="code css literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag">:root</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name attribute">color-scheme</span><span class="punctuation">:</span> light dark<span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="punctuation">}</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="name tag">body</span> <span class="punctuation">{</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="name attribute">background-color</span><span class="punctuation">:</span> <span class="name function">light-dark</span><span class="punctuation">(</span>white<span class="punctuation">,</span> black<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6">    <span class="name attribute">color</span><span class="punctuation">:</span> <span class="name function">light-dark</span><span class="punctuation">(</span>black<span class="punctuation">,</span> white<span class="punctuation">)</span><span class="punctuation">;</span>
</code><small class="ln">7</small><code data-lineno="7"><span class="punctuation">}</span></code></pre></ld-card><ld-card class="incremental"><p>(Eine) Vorgehensweise: Definition des Farbschemas über <em>Custom Properties</em></p><pre class="code css literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name tag">:root</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="comment single">/* Here, the default theme is the "light theme". */</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">    <span class="name attribute">--background-color</span><span class="punctuation">:</span> white<span class="punctuation">;</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="name attribute">--text-color</span><span class="punctuation">:</span> black<span class="punctuation">;</span>
</code><small class="ln"> 5</small><code data-lineno=" 5"><span class="punctuation">}</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">
</code><small class="ln"> 7</small><code data-lineno=" 7"><span class="keyword">@media <span class="punctuation">(</span> <span class="name attribute">prefers-color-scheme</span><span class="punctuation">:</span> dark <span class="punctuation">)</span></span> <span class="punctuation">{</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="name tag">:root</span> <span class="punctuation">{</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">        <span class="name attribute">--background-color</span><span class="punctuation">:</span> black<span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10">        <span class="name attribute">--text-color</span><span class="punctuation">:</span> white<span class="punctuation">;</span>
</code><small class="ln">11</small><code data-lineno="11">    <span class="punctuation">}</span>
</code><small class="ln">12</small><code data-lineno="12">    <span class="name tag">a:link</span> <span class="punctuation">{</span>
</code><small class="ln">13</small><code data-lineno="13">        <span class="name attribute">color</span><span class="punctuation">:</span> lightcoral<span class="punctuation">;</span>
</code><small class="ln">14</small><code data-lineno="14">    <span class="punctuation">}</span>
</code><small class="ln">15</small><code data-lineno="15"><span class="punctuation">}</span></code></pre></ld-card></ld-deck></ld-topic>

</code><small class="ln">33</small><code data-lineno="33">            <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">34</small><code data-lineno="34">                Demokratie (von altgriechisch δημοκρατία dēmokratía
</code><small class="ln">35</small><code data-lineno="35">                Volksherrschaft) ist ein Begriff für Formen der
</code><small class="ln">36</small><code data-lineno="36">                Herrschaftsorganisation auf der Grundlage der
</code><small class="ln">37</small><code data-lineno="37">                Partizipation bzw. Teilhabe aller an der politischen
</code><small class="ln">38</small><code data-lineno="38">                Willensbildung. Es handelt sich um einen zentralen
</code><small class="ln">39</small><code data-lineno="39">                Begriff der Politikwissenschaft, der ursprünglich aus
</code><small class="ln">40</small><code data-lineno="40">                der Staatsformenlehre stammt und in der
</code><small class="ln">41</small><code data-lineno="41">                Demokratietheorie erörtert wird. Die erste begriffliche
</code><small class="ln">42</small><code data-lineno="42">                Erwähnung findet sich bezogen auf die Attische
</code><small class="ln">43</small><code data-lineno="43">                Demokratie bei Herodot. Ideengeschichtlich wegweisend
</code><small class="ln">44</small><code data-lineno="44">                für den Begriff war
</code><small class="ln">45</small><code data-lineno="45">                die
</code><small class="ln">46</small><code data-lineno="46">                Definition der Politie bei Aristoteles. Eine
</code><small class="ln">47</small><code data-lineno="47">                schlagwortartige Beschreibung aus der Moderne liefert
</code><small class="ln">48</small><code data-lineno="48">                Abraham
</code><small class="ln">49</small><code data-lineno="49">                Lincolns Gettysburg-Formel von 1863: „Regierung des
</code><small class="ln">50</small><code data-lineno="50">                Volkes, durch das Volk, für das Volk“.
</code><small class="ln">51</small><code data-lineno="51">            <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">52</small><code data-lineno="52">
</code><small class="ln">53</small><code data-lineno="53">            <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span> <span class="name attribute">id</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>lib_demokratie<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>Liberale Demokratie<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h1</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">54</small><code data-lineno="54">            <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">55</small><code data-lineno="55">                Zur liberalen Demokratie, wie sie sich nach westlichen
</code><small class="ln">56</small><code data-lineno="56">                Mustern herausgebildet hat, gehören allgemeine,
</code><small class="ln">57</small><code data-lineno="57">                freie
</code><small class="ln">58</small><code data-lineno="58">                und geheime Wahlen, die Aufteilung der Staatsgewalt bei
</code><small class="ln">59</small><code data-lineno="59">                Gesetzgebung, Regierung und Rechtsprechung auf
</code><small class="ln">60</small><code data-lineno="60">                voneinander unabhängige Organe (Gewaltenteilung) sowie
</code><small class="ln">61</small><code data-lineno="61">                die Garantie der Grundrechte.

</code><small class="ln">64</small><code data-lineno="64">            <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span> <span class="name attribute">id</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>rep_demokratie<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>Repräsentative Demokratie<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h1</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">65</small><code data-lineno="65">            <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">66</small><code data-lineno="66">                In einer repräsentativen Demokratie, in der gewählte
</code><small class="ln">67</small><code data-lineno="67">                Repräsentanten zentrale politische Entscheidungen
</code><small class="ln">68</small><code data-lineno="68">                treffen, haben oft Parteien maßgeblichen Anteil an der
</code><small class="ln">69</small><code data-lineno="69">                politischen Willensbildung und an der durch
</code><small class="ln">70</small><code data-lineno="70">                Wahlen
</code><small class="ln">71</small><code data-lineno="71">                legitimierten Regierung. Die Opposition ist fester
</code><small class="ln">72</small><code data-lineno="72">                Bestandteil eines solchen demokratischen Systems, zu
</code><small class="ln">73</small><code data-lineno="73">                dem
</code><small class="ln">74</small><code data-lineno="74">                auch die freie Meinungsäußerung samt Pressefreiheit, die
</code><small class="ln">75</small><code data-lineno="75">                Möglichkeit friedlicher Regierungswechsel und
</code><small class="ln">76</small><code data-lineno="76">                der
</code><small class="ln">77</small><code data-lineno="77">                Minderheitenschutz gehören.
</code><small class="ln">78</small><code data-lineno="78">            <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>

<ld-topic class="new-section transition-fade" id="css-layers"><h2>CSS-Layers</h2></ld-topic>
<ld-topic id="css-layers-1"><h2>CSS-Layers</h2><ul class="incremental-list"><li><p>CSS Layers sind insbesondere in komplexen Projekten hilfreich, um die Kaskadierung von CSS-Regeln zu steuern und sicherzustellen, dass bestimmte Regeln Vorrang haben.</p></li><li><p><code class="css">@layer</code> ermöglicht das deklarative Festlegen einer expliziten Kaskaden-Reihenfolge:</p></li><li><p>Eine <em>später</em> deklarierte Schicht überschreibt frühere Schichten unabhängig von der Spezifität der Selektoren.</p></li><li><p>Beim Import von CSS-Dateien kann die Schicht ebenfalls angegeben werden:</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code css copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="keyword">@layer basis<span class="punctuation">,</span> overrides<span class="punctuation">,</span> theme<span class="punctuation">;</span></span>
</code><small class="ln">2</small><code data-lineno="2">
</code><small class="ln">3</small><code data-lineno="3"><span class="keyword">@import <span class="literal string"><span class="name function">url</span><span class="punctuation">(</span><span class="literal string">"modularization/basis.css"</span><span class="punctuation">)</span></span> <span class="name function">layer</span><span class="punctuation">(</span>basis<span class="punctuation">)</span><span class="punctuation">;</span></span>
</code><small class="ln">4</small><code data-lineno="4"><span class="keyword">@import <span class="literal string"><span class="name function">url</span><span class="punctuation">(</span><span class="literal string">"modularization/overrides.css"</span><span class="punctuation">)</span></span> <span class="name function">layer</span><span class="punctuation">(</span>overrides<span class="punctuation">)</span><span class="punctuation">;</span></span>
</code><small class="ln">5</small><code data-lineno="5"><span class="keyword">@import <span class="literal string"><span class="name function">url</span><span class="punctuation">(</span><span class="literal string">"modularization/theme.css"</span><span class="punctuation">)</span></span> <span class="name function">layer</span><span class="punctuation">(</span>theme<span class="punctuation">)</span><span class="punctuation">;</span></span></code></pre></aside></li><li><p>Importiert/deklariert eine CSS Datei, die bereits einer Schicht zugeordnet ist, weitere Schichten so bilden diese automatisch eine Hierarchie.</p></li></ul><ld-supplemental><p>Insbesondere in großen Projekten sind CSS Layers wichtig, um einen Kampf um die höchste Spezifität zu vermeiden. Weiterhin erlaubt es die problemlose Nutzung von CSS-Frameworks, die in eigenen Schichten organisiert sind. Ggf. kann auch ein Import in eine Schicht erfolgen, um die Kaskadierung zu steuern.</p></ld-supplemental></ld-topic>
<ld-topic id="css-layers-beispiel"><h2>CSS-Layers - Beispiel</h2><ld-grid class="default-layout"><ld-cell class="width-40" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span> <span class="name attribute">id</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>the-one<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">2</small><code data-lineno="2">    Dies ist ein Absatz.
</code><small class="ln">3</small><code data-lineno="3"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-60" style="align-self:auto;"><p><em>Spielwiese</em></p><ld-module name="lightweight-css-editor" scope="all">&#x3C;config>
&#x3C;height>8lh&#x3C;/height>
&#x3C;style>/* @layer overrides; */
@layer basis {
    p#the-one{color:green;}
}
@layer overrides {
    p{color:red;}
}
/* @layer basis{p#the-one{color:blue;}} */'&#x3C;/style>
&#x3C;body>&#x26;lt;p id="the-one"&#x26;gt;Dies ist ein Absatz.&#x26;lt;/p&#x26;gt;&#x3C;/body>
&#x3C;/config></ld-module></ld-cell></ld-grid></ld-topic>
<ld-topic id="verschachtelte-css-layers"><h2>Verschachtelte CSS-Layers</h2><ul class="incremental-list"><li><p><code class="css">@layer</code> können beliebig tief verschachtelt werden.</p></li><li><p>Deklarationen, die direkt in der Elternschicht stehen (hier: <span class="docutils literal">base</span>), haben Vorrang vor Deklarationen ihrer Unterschichten (hier: <span class="docutils literal">base.components</span>). Bei !important ist es umgekehrt.</p><aside class="admonition" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><pre class="code css copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="keyword">@layer base</span> <span class="punctuation">{</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">    <span class="name tag">h1</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> navy<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 3</small><code data-lineno=" 3">
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="keyword">@layer components</span> <span class="punctuation">{</span>
</code><small class="ln"> 5</small><code data-lineno=" 5">
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="name tag">h1</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> red<span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">
</code><small class="ln"> 8</small><code data-lineno=" 8">        <span class="name tag">.highlight</span> <span class="punctuation">{</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">            <span class="name attribute">background-color</span><span class="punctuation">:</span> yellow<span class="punctuation">;</span>
</code><small class="ln">10</small><code data-lineno="10">        <span class="punctuation">}</span>
</code><small class="ln">11</small><code data-lineno="11">    <span class="punctuation">}</span>

<ld-topic class="new-section transition-fade" id="web-komponenten-shadow-dom-und-css"><h2>Web Komponenten (Shadow DOM und CSS)<a class="brackets" href="#footnote-9" id="footnote-reference-9" role="doc-noteref"><span class="fn-bracket">[</span>9<span class="fn-bracket">]</span></a></h2><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-9" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-9">9</a><span class="fn-bracket">]</span></span><p>JavaScript spezifische Funktionalitäten von Web Komponenten werden hier nicht behandelt.</p></aside></aside></ld-topic>
<ld-topic id="shadow-dom-und-light-dom"><h2>Shadow DOM und Light DOM</h2><ld-story><ul class="incremental-list"><li><p>Web Komponenten ermöglichen die Kapselung von HTML, CSS (und JavaScript) in einem eigenen Kontext, dem Shadow DOM.</p></li><li><p>Der Shadow DOM ermöglicht eine klare Trennung von Stilen und Verhalten der Komponente von dem umgebenden Dokument.</p></li><li><p><em>normale</em> Kindelemente des Shadow Host bilden den Light DOM und können aus dem Shadow DOM via <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>slot</span><span class="punctuation">&gt;</span></span></code> referenziert werden.</p></li><li><p>Struktur:</p><div><template shadowrootmode="open">
    <style>
    </style>
    <div style="background-color: orange; padding: 1em">
        Shadow Host Element (typischerweise/häufig ein DIV oder <i>custom</i> Element)
        <div width=30ch height=5lh style="background-color: darkgreen; color: white; padding: 1em; margin-bottom: 1em">
        Light DOM
        </div>
        <div width=30ch height=5lh style="background-color: darkred; color: white; padding: 1em;">
            #Shadow Root
            <div width=30ch height=5lh style="background-color: darkblue; color: white; padding: 1em; padding-left: 0em;">
            Content (Shadow DOM)
            </div>
        </div>
    </div>
</template></div></li></ul></ld-story><ld-supplemental><p>Der Light DOM sind die Kindelemente des <em>Shadow Host</em>. Diese werden nicht gerendert.</p></ld-supplemental></ld-topic>
<ld-topic id="declarative-shadow-light-dom-anwendungsbeispiel"><h2>(Declarative) Shadow/Light DOM  - Anwendungsbeispiel</h2><ld-grid class="default-layout"><ld-cell class="width-60" style="align-self:auto;"><p class="rubric">Code</p><pre class="code html copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span><span class="punctuation">&gt;</span></span>   <span class="comment single">&lt;!-- Das h2 Element wird "slotted"! --&gt;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">        <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h2</span> <span class="name attribute">style</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span><span class="name attribute">color</span><span class="punctuation">:</span> <span class="name function">var</span><span class="punctuation">(</span>--c<span class="punctuation">)</span><span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>Demo<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h2</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 3</small><code data-lineno=" 3">  <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>template</span> <span class="name attribute">shadowrootmode</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>open<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>style</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 5</small><code data-lineno=" 5">      <span class="name tag">style[contenteditable]</span> <span class="punctuation">{</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">        <span class="name attribute">display</span><span class="punctuation">:</span> block<span class="punctuation">;</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">        <span class="name attribute">font-family</span><span class="punctuation">:</span> <span class="name function">var</span><span class="punctuation">(</span>--code-font-family<span class="punctuation">)</span><span class="punctuation">;</span> <span class="punctuation">}</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>style</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>style</span> <span class="name attribute">contenteditable</span></span>
</code><small class="ln">10</small><code data-lineno="10"><span class="name tag">           <span class="name attribute">onkeydown</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>event<span class="punctuation">.</span><span class="name function">stopPropagation</span><span class="punctuation">(</span><span class="punctuation">)</span><span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">11</small><code data-lineno="11">       <span class="comment single">/* :host { --code-font-family: Serif; }*/</span>
</code><small class="ln">12</small><code data-lineno="12">       <span class="name tag">p#the-one</span><span class="punctuation">{</span><span class="name attribute">color</span><span class="punctuation">:</span>green<span class="punctuation">;</span><span class="punctuation">}</span><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>style</span><span class="punctuation">&gt;</span></span>

</code><small class="ln">15</small><code data-lineno="15">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span> <span class="name attribute">id</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>the-one<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>Dies ist ein Absatz.<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">16</small><code data-lineno="16">  <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>template</span><span class="punctuation">&gt;</span></span><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-40" style="align-self:auto;"><p class="rubric">Eingebettet</p><div><div>
<h2 style="color: var(--c)">Demo</h2>
<template shadowrootmode="open">
    <style>
        style[contenteditable] {
            display: block;
            position: relative;

            height: 8lh;
            overflow: scroll;
            border: thin solid black;
            padding: 0.25em;

            font-family: var(--code-font-family);
            font-size: smaller;
            white-space: pre;

            &::before {
                content: "🖊️";
                position: absolute;
                top: 0.1em;
                right: 0.1em;
            }

            &::after {
                position: absolute;
                content: "⚠️keine Spiegelung";
                font-size: 0.6em;
                background-color: rgba(255,200,200,0.5);
                bottom: 0;
                left: 0;
                width: 100%;
                padding: 0.15em;
                text-align: center;
            }
        }
    </style>
    <style contenteditable onkeydown="event.stopPropagation()">/*:host {
     --code-font-family: Serif;
}*/
/*:host { --c: red; }*/
p#the-one{color:green;}
    </style>
    <slot></slot>
    <p>Dies ist der erste Absatz.</>
    <p id="the-one">Dies ist ein Absatz.</p>
</template>
</div></div></ld-cell></ld-grid><ld-supplemental><p>Slotted Elemente befinden sich im Light DOM, werden aber visuell im Shadow DOM über <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>slot</span><span class="punctuation">&gt;</span></span></code> angezeigt.
Ihr Layout kann nicht direkt vom Shadow DOM beeinflusst werden.</p><p>CSS-Variablen (<code class="css">--var</code>) hingegen können vom Shadow DOM nach außen vererbt und vom Light DOM genutzt werden.</p><p>Für ein slotted Element gilt grundsätzlich das CSS des Light DOMs, außer es wird über <code class="css"><span class="punctuation">:</span><span class="punctuation">:</span><span class="name function">slotted</span><span class="punctuation">(</span>...<span class="punctuation">)</span></code> gestylt.</p><p>Wenn ein <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>template</span><span class="punctuation">&gt;</span></span></code>-Element das Attribut <code class="html">shadowrootmode="open"</code> hat, erzeugt der Browser beim Parsen automatisch einen Shadow Root für das direkt übergeordnete Element.
Der Inhalt des <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>template</span><span class="punctuation">&gt;</span></span></code> wird in diesen Shadow Root übernommen und automatisch gerendert, sofern der Browser deklarative Shadow DOMs unterstützt.</p></ld-supplemental></ld-topic>
