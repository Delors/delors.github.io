<ld-topic id="spezifitat-von-selektoren"><h2>Spezifität von Selektoren</h2><ld-deck><ld-card><ul><li><p>Die Spezifität eines Selektors bestimmt, welcher Stil auf ein Element angewendet wird, wenn mehrere Regeln auf ein Element zutreffen und diese bzgl. der gleichen Eigenschaften in Konflikt stehen.</p><p>Die Spezifität wird durch einen Vektor <span class="docutils literal">(a, b, c)</span> dargestellt:</p><ul class="simple"><li><p><span class="docutils literal">a</span>: Anzahl der ID Selektoren</p></li><li><p><span class="docutils literal">b</span>: Anzahl der Klassen-, Attribut- und Pseudo-Klassen Selektoren</p></li><li><p><span class="docutils literal">c</span>: Anzahl der Element- und Pseudo-Element Selektoren</p></li></ul><p>Die Spezifität wird in der Reihenfolge <span class="docutils literal">a</span>, <span class="docutils literal">b</span>, <span class="docutils literal">c</span> verglichen.</p></li></ul><ul class="incremental simple"><li><p>Konzeptionell wird die Spezifität pro Deklaration betrachtet.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Beispiele</p><table class="incremental-table-rows booktabs" style="width: 100%;"><colgroup><col style="width: 50.0%"><col style="width: 50.0%"></colgroup><thead><tr><th class="head"><p>Selektor</p></th><th class="head"><p>Spezifität</p></th></tr></thead><tbody><tr><td><p><code class="css"><span class="name tag">p</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> black<span class="punctuation">;</span> <span class="punctuation">}</span></code></p></td><td><p>0, 0, 1</p></td></tr><tr><td><p><code class="css"><span class="name tag">section p</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> orange<span class="punctuation">;</span> <span class="punctuation">}</span></code></p></td><td><p>0, 0, 2</p></td></tr><tr><td><p><code class="css"><span class="name tag">section &gt; p</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> orange<span class="punctuation">;</span> <span class="punctuation">}</span></code></p></td><td><p>0, 0, 2</p></td></tr><tr><td><p><code class="css"><span class="name tag">p.warning</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> red<span class="punctuation">;</span> <span class="punctuation">}</span></code></p></td><td><p>0, 1, 1</p></td></tr><tr><td><p><code class="css"><span class="name tag">p[id*='this']</span> <span class="punctuation">{</span><span class="name attribute">color</span><span class="punctuation">:</span> green<span class="punctuation">;</span> <span class="punctuation">}</span></code></p></td><td><p>0, 1, 1</p></td></tr><tr><td><p><code class="css"><span class="name tag">#main</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> yellow<span class="punctuation">;</span> <span class="punctuation">}</span></code></p></td><td><p>1, 0, 0</p></td></tr><tr><td><p><code class="css"><span class="name tag">*</span> <span class="punctuation">{</span> <span class="name attribute">color</span><span class="punctuation">:</span> yellow <span class="keyword">!important</span><span class="punctuation">;</span> <span class="punctuation">}</span></code></p></td><td><p>0, 0, 0 (Important)</p></td></tr></tbody></table></ld-card><ld-card class="incremental"><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>section</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span> <span class="name attribute">id</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">'</span>this-is-it<span class="punctuation">'</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">3</small><code data-lineno="3">        Der erste Abschnitt!
</code><small class="ln">4</small><code data-lineno="4">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">'</span>obsolete<span class="punctuation">'</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">6</small><code data-lineno="6">        Ein alter Abschnitt.
</code><small class="ln">7</small><code data-lineno="7">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">8</small><code data-lineno="8"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>section</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">9</small><code data-lineno="9"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>Der letzte Abschnitt.<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><em>Spielwiese</em></p><ld-module name="embedded-iframe" scope="all">&#x3C;iframe width=100%
        srcdoc='
    &#x3C;html>
        &#x3C;head>
            {{ld-embedded-iframe.head.frag.html}}
            {{ld-embedded-iframe.editable-styles.frag.html}}
            &#x3C;style>
                p {margin: 0; padding:0;}
            &#x3C;/style>
        &#x3C;/head>
        &#x3C;body>
            &#x3C;style spellcheck="false" contenteditable>/*p[id*="this"] {color: green; }*/
/*section p { color: red; }*/
/*p { color: orange; }*/
/*p ~ p { color: aliceblue; }*/
            &#x3C;/style>
            &#x3C;hr>
            &#x3C;section>
                &#x3C;p id="this-is-it">Der erste Abschnitt!&#x3C;/p>
                &#x3C;p class="obsolete">Ein alter Abschnitt.&#x3C;/p>
            &#x3C;/section>
            &#x3C;p>Der letzte Abschnitt.&#x3C;/p>
        &#x3C;/body>' >
    iframes are not supported
&#x3C;/iframe></ld-module></ld-cell></ld-grid></ld-card></ld-deck><ld-supplemental><ul class="simple"><li><p>Kombinatoren haben keine Spezifität.</p></li><li><p><code class="css">*</code>  hat die Spezifität (0,0,0)</p></li><li><p>eine Deklaration mit  <code class="css"><span class="keyword">!important</span></code>  hat eine höhere Spezifität als jede Deklaration ohne  <code class="css"><span class="keyword">!important</span></code> . Im Prinzip definiert  <code class="css"><span class="keyword">!important</span></code>  eine eigene Menge von Regeln und innerhalb dieser wird die Kaskadierung invertiert. Innerhalb eines Layers werden alle als  <code class="css"><span class="keyword">!important</span></code>  markierten Deklarationen nach den beschriebenen Regeln ausgewertet.</p></li></ul></ld-supplemental></ld-topic>
<ld-topic id="probleme-bei-der-verwendung-von-important"><h2>(Probleme bei der) Verwendung von <code class="css"><span class="keyword">!important</span></code><a class="brackets" href="#footnote-4" id="footnote-reference-4" role="doc-noteref"><span class="fn-bracket">[</span>4<span class="fn-bracket">]</span></a></h2><ld-deck><ld-card><p>Mit Stand Mai 2025 setzen alle drei großen Browser (Chrome, Firefox und Safari) <em>CSS Layers</em> und  <code class="css"><span class="keyword">!important</span></code>  beim Rendering korrekt um, aber nur Firefox zeigt es auch in den Developer Tools korrekt an!</p></ld-card><ld-card class="incremental"><pre class="code html copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>head</span><span class="punctuation">&gt;</span></span><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>style</span><span class="punctuation">&gt;</span></span>   <span class="keyword">@layer low<span class="punctuation">;</span></span>      <span class="comment single">/* lowest priority */</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">                <span class="keyword">@layer medium<span class="punctuation">;</span></span>
</code><small class="ln"> 3</small><code data-lineno=" 3">                <span class="keyword">@layer high<span class="punctuation">;</span></span>     <span class="comment single">/* highest priority */</span>
</code><small class="ln"> 4</small><code data-lineno=" 4">
</code><small class="ln"> 5</small><code data-lineno=" 5">                <span class="keyword">@layer high</span> <span class="punctuation">{</span> <span class="name tag">p.error</span> <span class="punctuation">{</span>
</code><small class="ln"> 6</small><code data-lineno=" 6">                        <span class="name attribute">background-color</span><span class="punctuation">:</span> yellow<span class="punctuation">;</span>
</code><small class="ln"> 7</small><code data-lineno=" 7">                        <span class="name attribute">color</span><span class="punctuation">:</span> blue <span class="keyword">!important</span><span class="punctuation">;</span>
</code><small class="ln"> 8</small><code data-lineno=" 8">                <span class="punctuation">}</span>   <span class="punctuation">}</span>
</code><small class="ln"> 9</small><code data-lineno=" 9">                <span class="keyword">@layer low</span> <span class="punctuation">{</span> <span class="name tag">p.error</span> <span class="punctuation">{</span>
</code><small class="ln">10</small><code data-lineno="10">                        <span class="name attribute">background-color</span><span class="punctuation">:</span> lightblue <span class="keyword">!important</span><span class="punctuation">;</span>
</code><small class="ln">11</small><code data-lineno="11">                        <span class="name attribute">color</span><span class="punctuation">:</span> red <span class="keyword">!important</span><span class="punctuation">;</span>
</code><small class="ln">12</small><code data-lineno="12">                <span class="punctuation">}</span>   <span class="punctuation">}</span>
</code><small class="ln">13</small><code data-lineno="13">                <span class="keyword">@layer medium</span> <span class="punctuation">{</span> <span class="name tag">p.error</span> <span class="punctuation">{</span>
</code><small class="ln">14</small><code data-lineno="14">                        <span class="name attribute">background-color</span><span class="punctuation">:</span> cornsilk<span class="punctuation">;</span>
</code><small class="ln">15</small><code data-lineno="15">                        <span class="name attribute">color</span><span class="punctuation">:</span> darkgreen <span class="keyword">!important</span><span class="punctuation">;</span>
</code><small class="ln">16</small><code data-lineno="16">                <span class="punctuation">}</span>   <span class="punctuation">}</span> <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>style</span><span class="punctuation">&gt;</span></span><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>head</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">17</small><code data-lineno="17"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>body</span><span class="punctuation">&gt;</span></span>          <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>error<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>This is an error message.<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>        <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>body</span><span class="punctuation">&gt;</span></span></code></pre></ld-card><ld-card class="incremental"><p><strong>Chrome 135</strong> - falsche Darstellung in den Entwicklertools - Farbe von "<em>error message</em>" ist im Browser rot, wird in den Entwicklertools aber als blau angezeigt.</p><img class="screenshot align-center" src="screenshots/important-chrome-135.webp"></ld-card><ld-card class="incremental"><p><strong>Firefox 138</strong> - korrekte Darstellung in den Entwicklertools - Farbe von "<em>error message</em>" ist im Browser rot und wird in den Entwicklertools auch als rot angezeigt.</p><img class="screenshot align-center" src="screenshots/important-firefox-138.webp"></ld-card><ld-card class="incremental"><ld-deck><ld-card><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Die Verwendung von KI Assistenten im Zusammenhang mit neueren CSS Features ist sehr problematisch, da diese ggf. noch nicht genug neuen Code gesehen haben und dann schlicht falsche Aussagen treffen!</p></aside></ld-card><ld-card class="incremental"><p><strong>Unsinnige Antwort von ChatGPT</strong> auf einen Prompt bzgl. <code class="css"><span class="keyword">!important</span></code> und <em>CSS Layers</em>:</p><blockquote class="epigraph"><p class="rubric">📌 The Role of !important with Cascade Layers</p><p>🔥 Key Rule:</p><p>!important breaks out of layer ordering and competes only with other !important rules — regardless of layer. [...]</p><p>✅ That also means:</p><p>If multiple !important rules exist, specificity and layer order determine the winner — but only within the !important set.</p><p class="attribution">—ChatGPT 5. Mai 2025</p></blockquote><p class="incremental">Hier gilt, dass „<em>regardless of layer</em>“ nicht korrekt ist und auf die Inversion der Layer wird gar nicht eingegangen!</p></ld-card></ld-deck></ld-card></ld-deck><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-4" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-4">4</a><span class="fn-bracket">]</span></span><p>Stand Mai 2025</p></aside></aside><ld-supplemental><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p>Eine Verwendung von <code class="css"><span class="keyword">!important</span></code> ist ein Zeichen dafür, dass die CSS Regeln nicht gut strukturiert sind!</p></aside><p class="rubric">Vollständiges Beispiel bzgl. <code class="css"><span class="keyword">!important</span></code></p><pre class="code html copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="comment preproc"><span class="punctuation">&lt;!</span>DOCTYPE html<span class="punctuation">&gt;</span></span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>html</span> <span class="name attribute">lang</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>en<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>head</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 4</small><code data-lineno=" 4">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>meta</span> <span class="name attribute">charset</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>UTF-8<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 5</small><code data-lineno=" 5">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>meta</span> <span class="name attribute">name</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>viewport<span class="punctuation">"</span></span> <span class="name attribute">content</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>width=device-width, initial-scale=1.0<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 6</small><code data-lineno=" 6">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>title</span><span class="punctuation">&gt;</span></span>Important<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>title</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 7</small><code data-lineno=" 7">
</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>style</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 9</small><code data-lineno=" 9">        <span class="keyword">@layer low<span class="punctuation">;</span></span>
</code><small class="ln">10</small><code data-lineno="10">        <span class="keyword">@layer medium<span class="punctuation">;</span></span>
</code><small class="ln">11</small><code data-lineno="11">        <span class="keyword">@layer high<span class="punctuation">;</span></span> 
</code><small class="ln">12</small><code data-lineno="12">
</code><small class="ln">13</small><code data-lineno="13">        <span class="comment single">/* The order is determined by the above declaration order! */</span> 
</code><small class="ln">14</small><code data-lineno="14">        <span class="keyword">@layer high</span> <span class="punctuation">{</span>
</code><small class="ln">15</small><code data-lineno="15">            <span class="name tag">p.important</span> <span class="punctuation">{</span>
</code><small class="ln">16</small><code data-lineno="16">                <span class="name attribute">background-color</span><span class="punctuation">:</span> yellow<span class="punctuation">;</span>
</code><small class="ln">17</small><code data-lineno="17">                <span class="name attribute">color</span><span class="punctuation">:</span> blue<span class="punctuation">;</span>

<ld-topic id="elemente"><h2>Elemente</h2><ul class="simple"><li><p>Wir unterscheiden zwischen <em>replaced elements</em> bei denen der Inhalt nicht Teil des Dokumentes ist (zum Beispiel <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>img</span><span class="punctuation">&gt;</span></span></code>) und <em>non-replaced elements</em> (zum Beispiel <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span></code> und <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span><span class="punctuation">&gt;</span></span></code>; d. h. die meisten HTML Elemente).</p></li></ul><ul class="incremental-list"><li><p>Grundlegende Formatierungskontexte<a class="brackets" href="#footnote-5" id="footnote-reference-5" role="doc-noteref"><span class="fn-bracket">[</span>5<span class="fn-bracket">]</span></a>: <em>block</em> (z. B. der Standard von <span class="docutils literal">h1</span>, <span class="docutils literal">p</span>, <span class="docutils literal">div</span>, ...) und <em>inline</em> (z. B. der Standard von <span class="docutils literal">strong</span>, <span class="docutils literal">span</span>,...).</p><ul class="list-with-explanations"><li><p>Block-Elemente generieren eine Box, welche den Inhaltsbereich des <em>Parent-Elements</em> ausfüllt.</p><p>(<em>Replaced elements</em> können, müssen aber nicht Block-Elemente sein.)</p></li><li><p>Inline-Elemente generieren eine Box innerhalb einer Zeile und unterbrechen den Fluss der Zeile nicht.</p></li><li><p>Mittels CSS kann der Formatierungskontext geändert werden.</p></li></ul></li></ul><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-5" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-5">5</a><span class="fn-bracket">]</span></span><p>Es gibt noch „viel mehr“ Kontexte für spezielle Anwendungsfälle.</p></aside></aside></ld-topic>
<ld-topic id="block-und-inline-elemente-beispiel"><h2>Block und Inline Elemente - Beispiel</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">Code</p><pre class="code css copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag">h1</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name attribute">display</span><span class="punctuation">:</span> inline<span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="punctuation">}</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="name tag">strong</span> <span class="punctuation">{</span>
</code><small class="ln">5</small><code data-lineno="5">    <span class="name attribute">display</span><span class="punctuation">:</span> block<span class="punctuation">;</span>
</code><small class="ln">6</small><code data-lineno="6"><span class="punctuation">}</span></code></pre><p>Folgendes Beispiel dient nur der Veranschaulichung:</p><pre class="code html literal-block"><code>Dies ist eine <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>strong</span><span class="punctuation">&gt;</span></span><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span><span class="punctuation">&gt;</span></span>Überschrift<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h1</span><span class="punctuation">&gt;</span></span>
in sehr wichtig<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>strong</span><span class="punctuation">&gt;</span></span>; wirklich!</code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p class="rubric">Visualisierung</p><ld-module name="embedded-iframe" scope="all">&#x3C;iframe width="100%"
        srcdoc='
    &#x3C;html>
        &#x3C;head>{{ld-embedded-iframe.head.frag.html}}&#x3C;/head>
        &#x3C;body>
            &#x3C;style>
                h1 {
                    display: inline;
                }
                strong {
                    display: block;
                }
            &#x3C;/style>
            Dies ist eine &#x3C;strong>&#x3C;h1>Überschrift&#x3C;/h1> in sehr wichtig&#x3C;/strong>; wirklich!
        &#x3C;/body>'>
    iframes are not supported.
&#x3C;/iframe></ld-module></ld-cell></ld-grid><aside class="admonition incremental" data-theme="warning"><p class="admonition-title" data-theme="warning-header">Warnung</p><p>Dies ist kein gültiges HTML!</p></aside></ld-topic>
<ld-topic id="vererbung-von-css-eigenschaften"><h2>Vererbung von CSS Eigenschaften</h2><ul class="simple"><li><p>die meisten Eigenschaften (wie zum Beispiel  <code class="css">color</code> ) werden vererbt</p></li></ul><ul class="incremental-list list-with-explanations"><li><p>Eigenschaften, die nicht vererbt werden, sind insbesondere:  <code class="css">border</code> ,  <code class="css">margin</code> ,  <code class="css">padding</code>  und  <code class="css">background</code></p></li><li><p>vererbte Eigenschaften haben <strong>keine Spezifität</strong></p><p>(D. h. ein <code class="css"><span class="punctuation">:</span><span class="name function">where</span><span class="punctuation">(</span><span class="punctuation">)</span></code> Selektor oder der Universal-Selektor <code class="css">*</code> gewinnen.)</p></li></ul></ld-topic>
<ld-topic id="kaskadierung"><h2>Kaskadierung</h2><p>Die Entscheidung welche Regeln bzw. Deklarationen Anwendung finden, wird durch die Kaskadierung bestimmt:</p><ol class="arabic incremental-list simple"><li><p>Bestimme alle Regeln, die auf ein Element zutreffen.</p></li><li><p>Sortiere die Regeln nach Gewicht des Selektors (d.h.  <code class="css"><span class="keyword">!important</span></code>  oder <em>normal</em>)</p></li><li><p>Sortiere alle Deklarationen basierend auf der Quelle:</p><ul class="simple"><li><p>Autor (höchste Priorität)</p></li><li><p>Benutzer (mittlere Priorität; z. B. <em>User-Stylesheets</em>)</p></li><li><p><em>User Agent</em> (niedrigste Priorität; z. B. Browser Standard Styles)</p></li></ul></li><li><p>Sortiere nach <em>Encapsulation Context</em> (cf. Shadow-DOM)</p></li><li><p>Sortiere danach ob die Deklarationen <em>Element Attached</em> sind (d. h. mittels <span class="docutils literal">style</span> Attribut)</p></li><li><p>Sortiere nach <em>Cascade Layer</em></p></li><li><p>Sortiere nach Spezifität</p></li><li><p>Sortiere nach Reihenfolge der Deklarationen</p></li></ol><ld-supplemental><aside class="admonition" data-theme="remark"><p class="admonition-title" data-theme="remark-header"><span>Bemerkung</span></p><p>Benutzer-Stylesheets spielen heutzutage fast keine Rolle mehr. In den Anfangstagen war es möglich ein eigenes CSS zu definieren und dem Browser zu sagen, dass dieses angewendet werden soll.</p></aside><p>Der Shadow-Dom kapselt CSS und JavaScript bzgl. eines Elements. Dies ist insbesondere für Web-Komponenten relevant.</p></ld-supplemental></ld-topic>
<ld-topic class="transition-fade" id="css-und-nicht-unterstutzte-eigenschaften"><h2>CSS und nicht-unterstützte Eigenschaften</h2><p>Sollte eine Deklaration möglicherweise nicht unterstützt werden, es jedoch einen vernünftigen Fallback geben, dann ist es möglich, die Deklarationen untereinander zu schreiben. Der Browser wird die unterstützte Deklaration verwenden und die anderen ignorieren.</p><div class="incremental"><p>Beispiel:</p><pre class="code css copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag">div</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name attribute">height</span><span class="punctuation">:</span> 100vh<span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="name attribute">height</span><span class="punctuation">:</span> 100svh<span class="punctuation">;</span> <span class="comment single">/* Kennt der Browser (zum Beispiel) "svh" nicht,</span>
</code><small class="ln">4</small><code data-lineno="4"><span class="comment single">                       dann wird die vorhergehende gültige Definition verwendet. */</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span></code></pre></div><ld-supplemental><dl class="field-list simple"><dt><span class="docutils literal">vh</span> (Viewport Height)<span class="colon">:</span></dt><dd><p>1% der Höhe des Viewports</p></dd><dt><span class="docutils literal">svh</span> (Small Viewport Height)<span class="colon">:</span></dt><dd><p>1% der Höhe des <em>effektiven</em> Viewports. Dies ist insbesondere für Mobilgeräte relevant, da hier die Adresszeile und die Navigationsleiste nicht immer sichtbar sind.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic id="not-beispiel"><h2><code class="css"><span class="punctuation">:</span><span class="name function">not</span><span class="punctuation">(</span><span class="punctuation">)</span></code> - Beispiel</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>hr</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>new<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">3</small><code data-lineno="3">    Neuer Absatz
</code><small class="ln">4</small><code data-lineno="4"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">5</small><code data-lineno="5"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>new<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">6</small><code data-lineno="6">    Noch ein neuer Absatz
</code><small class="ln">7</small><code data-lineno="7"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">8</small><code data-lineno="8"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>Alter Text.<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><em>Spielwiese</em></p><ld-module name="embedded-iframe" scope="all">&#x3C;iframe width="100%" srcdoc='
    &#x3C;html>
        &#x3C;head>
            {{ld-embedded-iframe.head.frag.html}}
            {{ld-embedded-iframe.editable-styles.frag.html}}
            &#x3C;style>
                p {margin: 0; padding:0;}
            &#x3C;/style>
        &#x3C;/head>
        &#x3C;body>
            &#x3C;style spellcheck="false" contenteditable>p:not(.new) {
    text-decoration: line-through;
}
/*hr ~ *:not([class]) {
    font-size: smaller;
    color: red;
}*/&#x3C;/style>
            &#x3C;hr>
            &#x3C;p class="new">Neuer Absatz&#x3C;/p>
            &#x3C;p class="new">Noch ein neuer Absatz&#x3C;/p>
            &#x3C;p>Alter text.&#x3C;/p>
        &#x3C;/body>' >
    iframes are not supported
&#x3C;/iframe></ld-module></ld-cell></ld-grid><div class="incremental"><ul><li><p><code class="css"><span class="punctuation">:</span><span class="name function">not</span><span class="punctuation">(</span>&lt;list of selectors&gt;<span class="punctuation">)</span></code> erlaubt die logische Und-Verknüpfung:</p><p><code class="css"><span class="punctuation">:</span><span class="name function">not</span><span class="punctuation">(</span>&lt;selector_a&gt;<span class="punctuation">,</span> &lt;selector_b&gt;<span class="punctuation">)</span></code> ≘ nicht <span class="docutils literal">selector_a</span> und nicht <span class="docutils literal">selector_b</span>.</p></li><li><p>die Spezifität ergibt sich aus der Spezifität des spezifischsten Selektors</p></li></ul></div></ld-topic>
<ld-topic id="is-und-where-beispiel"><h2><code class="css"><span class="punctuation">:</span><span class="name function">is</span><span class="punctuation">(</span><span class="punctuation">)</span></code> und <code class="css"><span class="punctuation">:</span><span class="name function">where</span><span class="punctuation">(</span><span class="punctuation">)</span></code> - Beispiel</h2><p>Erlauben das Gruppieren von Selektoren innerhalb eines (komplexen) Selektors.</p><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>hr</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">2</small><code data-lineno="2"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>ol</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">3</small><code data-lineno="3">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>li</span><span class="punctuation">&gt;</span></span>Aufgezählt<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>li</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">4</small><code data-lineno="4"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>ol</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">5</small><code data-lineno="5"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>ul</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">6</small><code data-lineno="6">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>li</span><span class="punctuation">&gt;</span></span>Ein Punkt<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>li</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">7</small><code data-lineno="7"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>ul</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><em>Spielwiese</em></p><ld-module class="one-column-iframe with-editable-content" name="embedded-iframe" scope="all">&#x3C;iframe width="100%" srcdoc='
    &#x3C;html>
        &#x3C;head>
            {{ld-embedded-iframe.head.frag.html}}
            {{ld-embedded-iframe.editable-styles.frag.html}}
        &#x3C;/head>
        &#x3C;body>
            &#x3C;style spellcheck="false" contenteditable>:is(ol, ul) li {
    font-style: italic;
}
/* :where(ol, ul) li {
    font-weight: bold;
    font-style: normal;
}*/&#x3C;/style>
            &#x3C;hr>
            &#x3C;ol>
                &#x3C;li>Aufgezählt&#x3C;/li>
            &#x3C;/ol>
            &#x3C;ul>
                &#x3C;li>Ein Punkt&#x3C;/li>
            &#x3C;/ul>
            &#x3C;/body>' >
    iframes are not supported
&#x3C;/iframe></ld-module></ld-cell></ld-grid><div class="incremental"><p><code class="css"><span class="punctuation">:</span><span class="name function">is</span><span class="punctuation">(</span><span class="punctuation">)</span></code> und <code class="css"><span class="punctuation">:</span><span class="name function">where</span><span class="punctuation">(</span><span class="punctuation">)</span></code> unterscheiden sich nur in der Spezifität. Die Spezifität ist bei <code class="css"><span class="punctuation">:</span><span class="name function">where</span><span class="punctuation">(</span><span class="punctuation">)</span></code> immer 0 und bei <code class="css"><span class="punctuation">:</span><span class="name function">is</span><span class="punctuation">(</span><span class="punctuation">)</span></code> gleich der Spezifität des spezifischsten Selektors.</p></div></ld-topic>
<ld-topic id="has-beispiel"><h2><code class="css"><span class="punctuation">:</span><span class="name function">has</span><span class="punctuation">(</span><span class="punctuation">)</span></code> - Beispiel</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>ol</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 2</small><code data-lineno=" 2">  <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>li</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>important<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>Aufgezählt<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>li</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 3</small><code data-lineno=" 3">  <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>li</span><span class="punctuation">&gt;</span></span>Aufgezählt<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>li</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 4</small><code data-lineno=" 4"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>ol</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 5</small><code data-lineno=" 5"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>ul</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 6</small><code data-lineno=" 6">  <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>li</span><span class="punctuation">&gt;</span></span>Ein
</code><small class="ln"> 7</small><code data-lineno=" 7">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>span</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">'</span>important<span class="punctuation">'</span></span><span class="punctuation">&gt;</span></span>Punkt<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>span</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 8</small><code data-lineno=" 8">  <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>li</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 9</small><code data-lineno=" 9">  <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>li</span><span class="punctuation">&gt;</span></span>Semikolon<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>li</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">10</small><code data-lineno="10"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>ul</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><em>Spielwiese</em></p><ld-module name="embedded-iframe" scope="all">&#x3C;iframe width="100%" srcdoc='
    &#x3C;html>
        &#x3C;head>
            {{ld-embedded-iframe.head.frag.html}}
            {{ld-embedded-iframe.editable-styles.frag.html}}
        &#x3C;/head>
        &#x3C;body>
            &#x3C;style spellcheck="false" contenteditable>:is(ol, ul):has(>.important) li {
    font-style: italic;
    color: red;
}&#x3C;/style>
            &#x3C;hr>
            &#x3C;ol>
                &#x3C;li class="important">Aufgezählt&#x3C;/li>
                &#x3C;li>Aufgezählt&#x3C;/li>
            &#x3C;/ol>
            &#x3C;ul>
                &#x3C;li>Ein
                    &#x3C;span class="important">Punkt&#x3C;/span>
                &#x3C;/li>
                &#x3C;li>Semikolon&#x3C;/li>
            &#x3C;/ul>
        &#x3C;/body>' >
    iframes are not supported
&#x3C;/iframe></ld-module></ld-cell></ld-grid><div class="incremental"><ul><li><p>bei <code class="css"><span class="punctuation">:</span><span class="name function">has</span><span class="punctuation">(</span><span class="punctuation">)</span></code> werden die Selektoren relativ zum Element ausgewählt, welche den Anker für <code class="css"><span class="punctuation">:</span><span class="name function">has</span><span class="punctuation">(</span><span class="punctuation">)</span></code> bilden</p></li><li><p><code class="css"><span class="punctuation">:</span><span class="name function">has</span><span class="punctuation">(</span>&lt;list of selectors&gt;<span class="punctuation">)</span></code> verknüpft die Selektoren mittels logischem Oder.</p><p><code class="css"><span class="punctuation">:</span><span class="name function">has</span><span class="punctuation">(</span>&lt;selector_a&gt;<span class="punctuation">,</span> &lt;selector_b&gt;<span class="punctuation">)</span></code> ≘ <span class="docutils literal">selector_a</span> oder <span class="docutils literal">selector_b</span> passt.</p></li><li><p>die Spezifität ergibt sich aus der Spezifität des spezifischsten Selektors</p></li></ul></div><ld-supplemental><p>Mittels <code class="css"><span class="punctuation">:</span>has</code> können wir (hier) eine Liste als ganzes selektieren, wenn ein Element in der Liste eine bestimmte Klasse hat (z. B. <code class="css">important</code>).</p></ld-supplemental></ld-topic>

</code><small class="ln">15</small><code data-lineno="15"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-60" style="align-self:auto;"><p><strong>Aufgaben</strong></p><ol class="arabic simple"><li><p>Selektieren Sie <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span><span class="punctuation">&gt;</span></span></code> Elemente mit Klassen.</p></li><li><p>Selektieren Sie alle <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span><span class="punctuation">&gt;</span></span></code> Elemente, die eine Klasse haben und ein <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span><span class="punctuation">&gt;</span></span></code> Element enthalten.</p></li><li><p>Selektieren Sie <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>li</span><span class="punctuation">&gt;</span></span></code> Elemente die die Klasse <code class="html">todo</code> haben oder auf ein <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>li</span><span class="punctuation">&gt;</span></span></code> folgen, das die Klasse <code class="html">todo</code> hat.</p></li><li><p>Selektieren Sie die Liste mit der id <code class="html">topics</code>.</p></li><li><p>Selektieren Sie ein <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span><span class="punctuation">&gt;</span></span></code> Element, wenn es ein direktes Geschwister-Element hat, dass die Klasse <code class="html">version</code> hat.</p></li><li><p>Selektieren Sie <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>li</span><span class="punctuation">&gt;</span></span></code> Elemente, die keine Klassen haben.</p></li></ol></ld-cell></ld-grid><ld-supplemental><p>Kopieren Sie den HTML Code in eine Datei und fügen Sie ein <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>style</span><span class="punctuation">&gt;</span></span></code>-Element hinzu. Testen Sie Ihre Selektoren zum Beispiel durch das Setzen der Farbe des Textes oder des Hintergrunds (background-color). Insbesondere für den Hintergrund bietet es sich ggf. an eine Frage zu verwenden, die einen Alpha Kanal hat (z. B. <code class="css"><span class="name attribute">background-color</span><span class="punctuation">:</span> <span class="name function">rgba</span><span class="punctuation">(</span>255<span class="punctuation">,</span> 155<span class="punctuation">,</span> 0<span class="punctuation">,</span> 0.6<span class="punctuation">)</span><span class="punctuation">;</span></code>).</p></ld-supplemental><div class="ld-exercise-solution" data-encrypted="true">MTAwMDAw:NlXSr5i9bSYydZiFV4oQPLpBH8d7+7W/q79pnZR0J4k=:X/RxYAxQmRyON6Ub:0nMgu95XowRfUyDnOxEDy7e85kh+pOOeu1beIoDB2rFhuinrJOvDGbcBvi2gaJJP8dqDYGVU1x2WXndjdwCM2aTsPTBU3D7UxLDIHEi81lJO81oPC/ZEeBABd13KmMXin7J42QvlCA9KpJEZfjdEGTKarZpgI+v2Z8EN2Uc26fN3xVqYjggckpV3UZIeMk+PIuHX/mgqiks+yHCbWjWnYDyEZFLDBaIWCnfK0nMhtdXMhO5Ifo7lxN1k5kfHVCQoixLeKbhMp2WkeWGlqEOwUV/ZCqXcsR4CSRCFywwq7s62+npaUpdD0CxmYjPX12859T+e3OH+a8mpwhCkuc07lCqQQT/hv8+TjW/KMbTuSCUlD1EMxgDnmaaHHxzu7DWSOOG4qTsZbiunsa31CadNxwsOuatdbpetXB+xBEeZrq9JEPOYFxbLrt23avGRFxcBE+lmueHOZti3T2xmWJzXuqa44vpiInY0+gpubkeYYuHVz612RLkytlx40U2SjxC+TnzlvZSIenMYAZwxGIBzZzA6lxv6k+8XH5q5cdu6LJtSmLjeDOJYl2aKNZTPEsWRUDfD/SPvP8wSHGl2tzRCqdTZi3qPyPi+0aHq3k7Ze4/cdwkP3N7f0hMAfBkp+xMkX/jJbfHxEMZ2j1MhTsSBnN4IItEHKCNk3Rk5juLJNPNyQL0IP+AkasZq6rrqSmoyHjfYw5g85B38XrT5pE9tbtb6OeMMEDQwSoijqx0hh0VWl0DMWK2Gifhq8H+cNmopqw+3F7T39kknxT3rgzpfnNwaaMHuLj7ZO9lztyDPPHglq+Y1al82F3GYUPoT0IU7EtrGFVA9JQ+4YKEbcB1KEMxKKXlgg3iueq5P7Dd1B1IHihczpc <ld-topic id="nesting"><h2>Nesting</h2><ul class="simple"><li><p>CSS Nesting ist erst seit 2024 breit verfügbar.</p></li><li><p>Nesting findet bzgl. der Selektoren statt. Häufig(er) in Kombination mit <em>At-Regeln</em> (<span class="eng">at-rules</span>; z. B. <code>@media</code>) verwendet.</p></li></ul></ld-topic>
<ld-topic id="nesting-operator"><h2>Nesting - <span class="docutils literal">&#x26;</span> Operator</h2><p>Der <span class="docutils literal">&#x26;</span> Operator kann immer verwendet werden, ist aber oft optional.</p><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><pre class="code css copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag">p</span>  <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name tag">.obsolete</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">        <span class="name attribute">text-decoration</span><span class="punctuation">:</span> line-through<span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span></code></pre><p>ist äquivalent zu:</p><pre class="code css copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag">p .obsolete</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name attribute">text-decoration</span><span class="punctuation">:</span> line-through<span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="punctuation">}</span></code></pre></ld-cell><ld-cell class="width-50 border-left padding-left-1em incremental" style="align-self:auto;"><pre class="code css copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag">p</span>  <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name tag">&amp;.obsolete</span> <span class="punctuation">{</span>
</code><small class="ln">3</small><code data-lineno="3">        <span class="name attribute">text-decoration</span><span class="punctuation">:</span> line-through<span class="punctuation">;</span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="punctuation">}</span>
</code><small class="ln">5</small><code data-lineno="5"><span class="punctuation">}</span></code></pre><p>ist äquivalent zu:</p><pre class="code css copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag">p.obsolete</span> <span class="punctuation">{</span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name attribute">text-decoration</span><span class="punctuation">:</span> line-through<span class="punctuation">;</span>
</code><small class="ln">3</small><code data-lineno="3"><span class="punctuation">}</span></code></pre></ld-cell></ld-grid><ld-supplemental><p>D. h. sollten nur solche Paragraphen durchgestrichen werden, die als <em>obsolete</em> markiert sind (d. h. <code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">'</span>obsolete<span class="punctuation">'</span></span><span class="punctuation">&gt;</span></span></code>) und nicht alle darunter liegenden Elemente, dann muss der <span class="docutils literal">&#x26;</span> Operator verwendet werden (<span class="docutils literal">&#x26;</span> ist dann nicht optional).</p></ld-supplemental></ld-topic>
<ld-topic id="nesting-beispiel"><h2>Nesting - Beispiel</h2><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h1</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>obsolete<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>1. Überschrift<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h1</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">2</small><code data-lineno="2">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>Ein alter Absatz<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">3</small><code data-lineno="3"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>h2</span><span class="punctuation">&gt;</span></span>2. Überschrift<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>h2</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">4</small><code data-lineno="4">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>p</span><span class="punctuation">&gt;</span></span>Ein neuer, besserer Absatz<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>p</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><em>Spielwiese</em></p><ld-module class="one-column-iframe with-editable-content" name="embedded-iframe" scope="all">&#x3C;iframe width="100%" srcdoc='
    &#x3C;html>
        &#x3C;head>
            {{ld-embedded-iframe.head.frag.html}}
            {{ld-embedded-iframe.editable-styles.frag.html}}
            &#x3C;style>
                h1 {margin:0; padding:0;}
                p {margin: 0; padding:0;}
            &#x3C;/style>
        &#x3C;/head>
        &#x3C;body>
            &#x3C;style spellcheck="false" contenteditable>h1.obsolete {
    color: red;
    text-decoration: line-through;
    background-color: lightgray;

    &#x26; + p {
        color: green;
    }
}&#x3C;/style>
            &#x3C;hr>
            &#x3C;h1 class="obsolete">1. Überschrift&#x3C;/h1>
                &#x3C;p>Ein alter Absatz&#x3C;/p>
            &#x3C;h2>2. Überschrift&#x3C;/h2>
                &#x3C;p>Ein neuer, besserer Absatz&#x3C;/p>
        &#x3C;/body>' >
    iframes are not supported
&#x3C;/iframe></ld-module></ld-cell></ld-grid></ld-topic>
<ld-topic class="exercises" id="ubung-einbinden-von-css-in-html"><h2>Übung - Einbinden von CSS in HTML</h2><div class="ld-exercise" id="ld-exercise-5" data-exercise-id="5" data-exercise-title="5 - Einbinden von CSS"><p class="ld-exercise-title rubric"><span>Einbinden von CSS</span></p><ld-deck><ld-card><p>Gegeben sei die folgende (unformatierte) Webseite:</p><div class="center-content"><img class="screenshot align-center" src="code/1st-exercise/screenshot-ausgangssituation.webp"></div><dl class="field-list simple"><dt>Code (HTML)<span class="colon">:</span></dt><dd><p><a class="reference external" href="code/1st-exercise/exercise-template.html">exercise-template.html</a></p></dd><dt>Hintergrundbild<span class="colon">:</span></dt><dd><p><a class="reference external" href="code/1st-exercise/image.webp">image.webp</a></p></dd></dl></ld-card><ld-card class="incremental"><ol class="arabic simple"><li><p>Binden Sie den angehängten CSS Code ein, um grundlegend das folgende Layout zu erhalten.</p></li></ol></ld-card><ld-card class="incremental"><div class="center-content"><img class="screenshot align-center" src="code/1st-exercise/screenshot-final.webp"></div></ld-card><ld-card class="incremental"><ol class="arabic" start="2"><li><p>Erweitern Sie den CSS Code, um das finale Layout zu erhalten. Dazu müssen sie die folgenden CSS Eigenschaften passend „einfügen“.</p><ld-grid class="default-layout"><ld-cell class="width-40" style="align-self:auto;"><pre class="code css copy-to-clipboard literal-block"><code><span class="name attribute">text-align</span><span class="punctuation">:</span> center<span class="punctuation">;</span>
<span class="name attribute">text-align</span><span class="punctuation">:</span> right<span class="punctuation">;</span>

<span class="name attribute">font-family</span><span class="punctuation">:</span> sans-serif<span class="punctuation">;</span>
<span class="name attribute">font-size</span><span class="punctuation">:</span> smaller<span class="punctuation">;</span>
<span class="name attribute">font-size</span><span class="punctuation">:</span> 0.5em<span class="punctuation">;</span>
<span class="name attribute">font-size</span><span class="punctuation">:</span> 25px<span class="punctuation">;</span>
<span class="name attribute">text-shadow</span><span class="punctuation">:</span> 2px 2px 4px white<span class="punctuation">;</span></code></pre></ld-cell><ld-cell class="width-60" style="align-self:auto;"><pre class="code css copy-to-clipboard literal-block"><code><span class="name attribute">color</span><span class="punctuation">:</span> #999<span class="punctuation">;</span> <span class="comment single">/* defines the font color */</span>
<span class="name attribute">color</span><span class="punctuation">:</span> #ccc<span class="punctuation">;</span>

<span class="name attribute">background-color</span><span class="punctuation">:</span> <span class="name function">rgba</span><span class="punctuation">(</span>0<span class="punctuation">,</span> 0<span class="punctuation">,</span> 0<span class="punctuation">,</span> 0.3<span class="punctuation">)</span><span class="punctuation">;</span>

<ld-topic class="new-section transition-fade" id="werte-und-einheiten"><h2>Werte und Einheiten</h2></ld-topic>
<ld-topic id="grundlagen-1"><h2>Grundlagen</h2><ld-story><p class="rubric">Schlüsselworte und einfache Werte</p><ul class="incremental-list simple"><li><p>Einige Eigenschaften haben Schlüsselworte, die spezielle Werte repräsentieren (z. B. <code class="css">none</code> bei <code class="css">text-decoration</code>)</p></li><li><p>Das gleiche Schlüsselwort kann verschiedene Bedeutungen haben (z. B.  <code class="css">normal</code>  bei  <code class="css">letter-spacing</code>  und  <code class="css">font-style</code> )</p></li><li><p>Es gibt fünf globale Schlüsselworte, die immer verwendet werden können:  <code class="css">inherit</code> ,  <code class="css">initial</code> ,  <code class="css">unset</code> ,  <code class="css">revert</code> , und  <code class="css">revert-layer</code> .</p></li><li><p>Strings können in <span class="docutils literal">'</span> oder <span class="docutils literal">"</span> eingeschlossen werden</p></li><li><p>Identifikatoren (z. B.  <code class="css">checked</code> )</p></li><li><p>URLs werden mittels  <code class="css"><span class="literal string"><span class="name function">url</span><span class="punctuation">(</span>...<span class="punctuation">)</span></span></code>  angegeben</p></li><li><p>Ganzzahlen, Fließkommazahlen und Prozente</p></li><li><p>Farben werden spezifiziert mittels Schlüsselworte: (<code class="css">red</code> ,  <code class="css">green</code> , etc.), RGB-Werte:  <code class="css"><span class="name function">rgb</span><span class="punctuation">(</span>&lt;red&gt;<span class="punctuation">,</span>&lt;green&gt;<span class="punctuation">,</span>&lt;blue&gt;<span class="punctuation">)</span></code>  oder  <code class="css"><span class="name function">rgb</span><span class="punctuation">(</span>&lt;red&gt; &lt;green&gt; &lt;blue&gt; [/ &lt;alpha&gt;]<span class="punctuation">)</span></code> ; oder ...</p></li><li><p>Zeitangaben: <span class="docutils literal">s</span> und <span class="docutils literal">ms</span></p></li><li><p>Verhältnisse: <span class="docutils literal">&#x3C;number> / &#x3C;number></span> (z. B. <span class="docutils literal">16/9</span>)</p></li><li><p>Funktionswerte:  <code class="css"><span class="name function">calc</span><span class="punctuation">(</span><span class="punctuation">)</span></code> ,  <code class="css"><span class="name function">min</span><span class="punctuation">(</span><span class="punctuation">)</span></code> ,  <code class="css"><span class="name function">max</span><span class="punctuation">(</span><span class="punctuation">)</span></code> ,  <code class="css"><span class="name function">clamp</span><span class="punctuation">(</span>&lt;min_value&gt;<span class="punctuation">,</span>&lt;preferred_value&gt;<span class="punctuation">,</span>&lt;max_value&gt;<span class="punctuation">)</span></code> ,  <code class="css">attr</code>  und über 90 weitere Funktionen</p></li></ul><p class="incremental rubric">Ausgewählte Distanzen</p><ul class="incremental-list simple"><li><p>Absolute Längen: <span class="docutils literal">cm</span>, <span class="docutils literal">mm</span>, <span class="docutils literal">in</span>, <span class="docutils literal">pt</span>, <span class="docutils literal">pc</span>, <span class="docutils literal">px</span></p></li><li><p>Relative Längen:</p><ul class="simple"><li><p>Charakter bezogene Längen: <span class="docutils literal">em</span>, <span class="docutils literal">ex</span>, <span class="docutils literal">lh</span>, <span class="docutils literal">ch</span></p></li><li><p>Root bezogene Längen: <span class="docutils literal">rem</span> (<em>root-em</em>)</p></li><li><p>Relation: <span class="docutils literal">fr</span> (Anteil vom Leerraum)</p></li></ul></li><li><p>Viewport bezogene Längen: <span class="docutils literal">vw</span> (viewport width), <span class="docutils literal">vh</span> (viewport height), <span class="docutils literal">dvh</span> (dynamic viewport height), <span class="docutils literal">dvw</span> (dynamic viewport width), <span class="docutils literal">svh</span> (small viewport height), <span class="docutils literal">svw</span> (small viewport width)</p></li><li><p>Container bezogene Größen: cqw (container query width)</p></li></ul><p class="incremental rubric">Benutzerdefinierte Eigenschaften (<em>CSS Variables</em>)</p><aside class="admonition incremental" data-theme="example"><p class="admonition-title" data-theme="example-header"><span>Beispiel</span></p><ol class="arabic"><li><p>Deklaration</p><p><code class="css"><span class="name tag">html</span> <span class="punctuation">{</span> <span class="name attribute">--main-color</span><span class="punctuation">:</span> red<span class="punctuation">;</span><span class="punctuation">}</span></code></p><p>(Häufig <code class="css"><span class="name tag">:root</span> <span class="punctuation">{</span>...<span class="punctuation">}</span></code> statt <code class="css"><span class="name tag">html</span> <span class="punctuation">{</span> ... <span class="punctuation">}</span></code>.)</p></li><li><p>Verwendung inkl. Fallback-Wert:</p><p><code class="css"><span class="name tag">p</span> <span class="punctuation">{</span><span class="name attribute">color</span><span class="punctuation">:</span> <span class="name function">var</span><span class="punctuation">(</span>--main-color<span class="punctuation">,</span> black<span class="punctuation">)</span><span class="punctuation">}</span></code></p></li></ol><p>Der Scope ergibt sich aus dem Element, in dem die Variable definiert wurde.</p><div class="warning"><p>Bei Verwendung findet einfaches (textuelles) Ersetzen statt.</p></div></aside></ld-story><ld-supplemental><dl class="field-list simple"><dt><span class="docutils literal">px</span><span class="colon">:</span></dt><dd><p>ein Pixel ist die Größe, die man benötigt, wenn man 96 Pixel pro Zoll hat; <span class="docutils literal">px</span> ist die Einzige absolute Längeneinheit, die von Webseiten typischerweise verwendet wird. Ein Pixel ist somit unabhängig von der Größe eines Pixels auf dem Bildschirm!</p></dd><dt><span class="docutils literal">em</span><span class="colon">:</span></dt><dd><p>der Wert der Font-Größe des aktuellen Fonts.</p></dd><dt><span class="docutils literal">ex</span><span class="colon">:</span></dt><dd><p>ist die Größe eines kleinen <span class="docutils literal">x</span> im aktuellen Font</p></dd><dt><span class="docutils literal">lh</span><span class="colon">:</span></dt><dd><p>computed line-height</p></dd><dt><span class="docutils literal">ch</span><span class="colon">:</span></dt><dd><p>Breite des Zeichens „0“ (ZERO, U+0030) (Ein Wert von 60ch entspricht bei vielen Fonts einer effektiven Breite von ca. 80 Zeichen im Durchschnitt.)</p></dd><dt><span class="docutils literal">calc</span><span class="colon">:</span></dt><dd><p>erlaubt verschiedene Berechnungen ist aber an einigen Stellen <em>Whitespace-sensitive</em> und unterliegt bestimmten Einschränkungen welche Arten von Werten verrechnet werden können. (+ und - müssen immer mit Leerraum umgeben sein.)</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic id="initial-vs-inherit-vs-unset-vs-revert"><h2><code class="css">initial</code> vs. <code class="css">inherit</code> vs. <code class="css">unset</code> vs. <code class="css">revert</code><a class="brackets" href="#footnote-6" id="footnote-reference-6" role="doc-noteref"><span class="fn-bracket">[</span>6<span class="fn-bracket">]</span></a></h2><dl class="incremental-list field-list simple"><dt><code class="css">initial</code><span class="colon">:</span></dt><dd><p>setzt den Wert auf den Standardwert der CSS Spezifikation</p></dd><dt><code class="css">inherit</code><span class="colon">:</span></dt><dd><p>setzt den Wert auf den Wert des Elternelements</p></dd><dt><code class="css">unset</code><span class="colon">:</span></dt><dd><p>setzt den Wert auf den Standardwert der CSS Spezifikation, wenn die Eigenschaft nicht vererbt wird (vgl. <code class="css">initial</code>), ansonsten auf den Wert des Elternelements (<code class="css">inherit</code>)</p></dd><dt><code class="css">revert</code><span class="colon">:</span></dt><dd><p>setzt den Wert auf den Wert, der durch die frühere Kaskade bestimmt wird (Typischerweise der Wert der sich aus der dem User-Agent ergibt, wenn keine anderen Regeln zutreffen.)</p></dd><dt><code class="css">revert-layer</code><span class="colon">:</span></dt><dd><p>setzt den Wert auf den Wert, der durch die frühere Kaskade bestimmt wird, aber nur für die Layer, die vor dem aktuellen Layer liegen. (Siehe auch <code class="css">@layer</code>.)</p></dd></dl><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-6" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-6">6</a><span class="fn-bracket">]</span></span><p><a class="reference external" href="https://www.w3.org/Style/CSS/all-properties.en.html">https://www.w3.org/Style/CSS/all-properties.en.html</a> bzw. <a class="reference external" href="https://www.w3.org/TR/CSS2/propidx.html">https://www.w3.org/TR/CSS2/propidx.html</a></p></aside></aside></ld-topic>
<ld-topic id="css-berechnung-von-werten"><h2>CSS - Berechnung von Werten</h2><p>Der Wert einer CSS Eigenschaft wird wie folgt bestimmt:</p><ol class="arabic incremental-list list-with-explanations"><li><p>der spezifizierte Wert wird basierend auf der Auswertung der Kaskadierung bestimmt</p></li><li><p>der berechnete Wert (<span class="eng">computed value</span>) wird bestimmt basierend auf der CSS Spezifikation</p><p>(Dieser Wert lässt sich mittels JavaScript abfragen.)</p></li><li><p>der verwendete Wert (<span class="eng">used value</span>) wird bestimmt basierend auf dem berechneten Wert und den Eigenschaften des Ausgabemediums</p><p>(Größen sind zum Beispiel in Pixel.)</p></li><li><p>der tatsächliche Wert (<span class="eng">actual value</span>) wird bestimmt basierend auf dem verwendeten Wert (z. B. durch Rundung auf ganze Zahlen)</p></li></ol></ld-topic>
<ld-topic class="new-section transition-fade" id="grundlegende-formatierung"><h2>Grundlegende Formatierung</h2></ld-topic>
<ld-topic id="box-modell-einfuhrung"><h2>Box-Modell - Einführung</h2><ul class="simple"><li><p>jedes Element erzeugt in der Regel eine Box (<em>Element Box</em>):</p><ul class="simple"><li><p>entweder eine <em>Block Box</em></p></li><li><p>oder eine <em>Inline Box</em></p></li></ul></li></ul><ld-story class="incremental"><ul><li><p>Es ist möglich, den Typ der Box zu ändern.</p></li><li><p>Es ist möglich, die Größe der Box zu ändern.</p><ul class="incremental-list list-with-sublists"><li><p>Basierend auf der Größe des Inhalts: <code class="css">max-content</code>, <code class="css">min-content</code>, <code class="css">fit-content</code></p><p>(Insbesondere - aber nicht ausschließlich - genutzt bei Grid-Layouts.)</p></li><li><p>Explizite Angabe der Größe: <code class="css">width</code>, <code class="css">height</code>, <code class="css">min-width</code>, <code class="css">max-width</code>, <code class="css">min-height</code>, <code class="css">max-height</code></p><ul class="simple"><li><p>absolute Werte: insbesondere <code class="css">px</code></p></li><li><p>relative Werte: <code class="css"><span class="name attribute">width</span><span class="punctuation">:</span> x%</code> setzt die Breite auf <code class="css">x%</code> der Breite des <em>Containing Block</em>. <code class="css"><span class="name attribute">height</span><span class="punctuation">:</span> y%</code>  setzt die Höhe auf <code class="css">y%</code> der Größe des <em>Containing Block</em> - wenn dieser eine definite Höhe hat!</p></li><li><p><code class="css">auto</code> ist der Standardwert für <code class="css">width</code>, <code class="css">height</code>, <code class="css">min-width</code> und <code class="css">min-height</code></p></li><li><p><code class="css">none</code> ist der Standardwert für <code class="css">max-width</code> und  <code class="css">max-height</code></p></li></ul></li><li><p>Die Größe wird bei <em>Non-Replaced Inline Elements</em> ignoriert.</p><!--container : : hint
   ``content`` ist die einzige Eigenschaft, die nicht verändert werden kann.--></li></ul></li><li><p>Die Größe der Box berechnet sich „nur“ aus der Größe des Inhalts (d. h. der <span class="docutils literal">content</span> Bereich); dies kann geändert werden durch:  <code class="css"><span class="name attribute">box-sizing</span><span class="punctuation">:</span> border-box<span class="punctuation">;</span></code></p><p>Standardmäßig beziehen sich <code class="css">width</code>/<code class="css">height</code> nur auf den Content-Bereich; Padding und Border kommen hinzu. Mit <code class="css"><span class="name attribute">box-sizing</span><span class="punctuation">:</span> border-box<span class="punctuation">;</span></code> umfassen <code class="css">width</code>/<code class="css">height</code> auch Padding und Border (Initialwert: <code class="css">content-box</code>, was dem Box-Modell von CSS 2.1 entspricht).</p></li></ul></ld-story></ld-topic>
<ld-topic id="darstellung-des-box-modells"><h2>Darstellung des Box-Modells</h2><p>Im Zentrum ist der Content-Bereich (<em>Content Area</em>)</p><div class="center-content"><style> <!-- TODO move to header/its own file.-->
    div.web-css-box-model {
        position:relative;

        margin:0;
        border: 0;
        padding:1em;

        display: flex;
        justify-content: center;
        align-items: center;

        background: white;
        color: white;

        > span {
            position: absolute;
            top: 0.5em;
            left: 0.5em;
        }
    }
</style>
<div    class="web-css-box-model"
        style="width:36em; height:15em; border: 1px solid black;">
    <span style="color: gray;">Margin</span>
    <div    class="web-css-box-model"
            style="width:32em; height:11em; background:darkgray;">
        <span>Border</span>
        <div    class="web-css-box-model"
                style="width:28em; height:7em; background:lightblue;">
            <span style="color:black;">Padding</span>
            <div    class="web-css-box-model"
                    style="width:24em; height:3em; background:blue;">
                Content Area
            </div>
        </div>
    </div>
</div></div><ul class="simple"><li><p>Das Layout erfolgt relativ zum <em>Containing Block</em>.</p></li></ul><ld-supplemental><p>Eine Block Box generiert vor und nach ihrer Box einen Leerraum entlang des normalen Flusses des Dokuments. Eine Inline Box, die länger als eine Zeile ist, wird in mehrere Zeilen umgebrochen - außer bei <em>Replaced Elements</em>.</p><p>Padding und Border können nicht negativ sein. Margin kann negativ sein.</p><aside class="admonition" data-theme="hint"><p class="admonition-title" data-theme="hint-header">Hinweis</p><p><span class="docutils literal">outlines</span> belegen keinen Platz und sind nicht Teil des Box-Modells.</p></aside></ld-supplemental></ld-topic>
<ld-topic id="anzeige-des-inhalts-der-nicht-in-die-umgebende-box-passt-kontrollieren"><h2>Anzeige des Inhalts, der nicht in die umgebende Box passt, kontrollieren</h2><ld-grid class="default-layout"><ld-cell class="width-40" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>container<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>

</code><small class="ln">7</small><code data-lineno="7">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span><span class="punctuation">&gt;</span></span>3<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>

<ld-topic id="floating"><h2>Floating</h2><p>Elemente können mit  <code class="css">float</code>  aus dem normalen Fluss genommen werden:</p><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span><span class="punctuation">&gt;</span></span><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>aside</span> <span class="name attribute">style</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">'</span></span></span>
</code><small class="ln"> 2</small><code data-lineno=" 2"><span class="name tag"><span class="literal string">            height: 4lh; padding: 1em;</span></span>
</code><small class="ln"> 3</small><code data-lineno=" 3"><span class="name tag"><span class="literal string">            background-color: black;</span></span>
</code><small class="ln"> 4</small><code data-lineno=" 4"><span class="name tag"><span class="literal string">            color: white<span class="punctuation">'</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 5</small><code data-lineno=" 5">        Rechtspopulismus<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>aside</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 6</small><code data-lineno=" 6">  [...] Dabei verhält sich der Rechts-
</code><small class="ln"> 7</small><code data-lineno=" 7">  populismus durchaus ambivalent:
</code><small class="ln"> 8</small><code data-lineno=" 8">  Während er in einigen Bereichen der
</code><small class="ln"> 9</small><code data-lineno=" 9">  Politik [...] einen starken Staat
</code><small class="ln">10</small><code data-lineno="10">  fordert, lehnt er ihn in anderen
</code><small class="ln">11</small><code data-lineno="11">  Bereichen ab [...] weil er dem reprä-
</code><small class="ln">12</small><code data-lineno="12">  sentativen Charakter von Parlamenten
</code><small class="ln">13</small><code data-lineno="13">  misstraut. [...]
</code><small class="ln">14</small><code data-lineno="14">  <span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>cite</span><span class="punctuation">&gt;</span></span>Wikipedia: Rechtspopulismus<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>cite</span><span class="punctuation">&gt;</span></span>
</code><small class="ln">15</small><code data-lineno="15"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span></code></pre></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><em>Spielwiese</em></p><ld-module name="embedded-iframe" scope="all">&#x3C;iframe width="100%" srcdoc='

        &#x3C;/head>
        &#x3C;body>
            &#x3C;style spellcheck="false" contenteditable>aside {
    /*display: inline;*/
    float: right;

cite { display: block;}&#x3C;/style>
            &#x3C;hr>
            &#x3C;div lang="de">
                &#x3C;aside style="height: 4lh; background-color: black; color: white">Rechtspopulismus&#x3C;/aside>

                [...] Dabei verhält sich der Rechtspopulismus durchaus ambivalent: Während er in einigen Bereichen der Politik, wie der Kriminalitätsbekämpfung, einen starken Staat fordert, lehnt er ihn in anderen Bereichen ab und fordert stattdessen Volksabstimmungen, weil er dem repräsentativen Charakter von Parlamenten misstraut und durch sie den Volkswillen verfälscht sieht. [...]

<ld-topic id="positioning-relative-und-absolute"><h2>Positioning -  <code class="css">relative</code>  und  <code class="css">absolute</code></h2><ld-grid class="default-layout"><ld-cell class="width-40" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><small class="ln">1</small><code data-lineno="1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>page<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>
</code><small class="ln">2</small><code data-lineno="2">    Ein erster Text.
</code><small class="ln">3</small><code data-lineno="3"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>

<ld-topic id="positioning-fixed-und-sticky"><h2>Positioning -  <code class="css">fixed</code>  und  <code class="css">sticky</code></h2><dl class="field-list simple"><dt>fixed<span class="colon">:</span></dt><dd><p>Das Element wird relativ zum Viewport positioniert.</p></dd><dt>sticky<span class="colon">:</span></dt><dd><p>Das Element bleibt im normalen Fluss, bis der Zeitpunkt erreicht ist, an dem es fixiert wird (d. h. absolut positioniert wird).</p></dd></dl><ld-grid class="smaller default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>HTML</em></p><pre class="code html copy-to-clipboard literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>div</span> <span class="name attribute">class</span><span class="literal string"><span class="punctuation">=</span><span class="punctuation">"</span>fixed<span class="punctuation">"</span></span><span class="punctuation">&gt;</span></span>😅<span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>div</span><span class="punctuation">&gt;</span></span>

            &#x3C;p>Währungen der Welt&#x3C;/p>
            &#x3C;h1>Euro&#x3C;/h1>
            &#x3C;p>The euro (symbol: €; currency code: EUR) is the official currency of 20 of the 27 member states of the European Union. This group of states is officially known as the euro area or, more commonly, the eurozone. The euro is divided into 100 euro cents.&#x3C;/p>
            &#x3C;p>The currency is also used officially by the institutions of the European Union, by four European microstates that are not EU members, the British Overseas Territory of Akrotiri and Dhekelia, as well as unilaterally by Montenegro and Kosovo. Outside Europe, a number of special territories of EU members also use the euro as their currency.&#x3C;/p>
            &#x3C;p>
            The euro is used by 350 million people in Europe and additionally, over 200 million people worldwide use currencies pegged to the euro. It is the second-largest reserve currency as well as the second-most traded currency in the world after the United States dollar. As of December 2019, with more than €1.3 trillion in circulation, the euro has one of the highest combined values of banknotes and coins in circulation in the world.&#x3C;/p>

            .fixed {
                position: fixed;
                top: 0;
                right: 0;

            h1 {
                position: sticky;
                top: 0;
