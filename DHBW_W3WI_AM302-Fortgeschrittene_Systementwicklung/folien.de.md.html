<ld-topic id="prufungsleistung"><h2>Prüfungsleistung</h2><aside class="admonition admonition-hintergrund"><p class="admonition-title">Hintergrund</p><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><ul class="simple"><li><p>Modul: 55 VL</p></li></ul></ld-cell><ld-cell class="width-50" style="align-self:auto;"><ul class="simple"><li><p>Modul 5 ECTS</p></li></ul></ld-cell></ld-grid></aside><p>Prüfungsleistung: Portfolio (insgesamt 120 Punkte)</p><dl class="field-list"><dt>1. Semester<span class="colon">:</span></dt><dd><p>Kurztest mit 20 Minuten mit 20 Punkten</p></dd><dt>2. Semester<span class="colon">:</span></dt><dd>Auswahl aus: Vorträgen, Code Reviews, Ausarbeitungen, Projekt, Prüfungsgespräche **mit 100 Punkten**</dd></dl></ld-topic>

<ld-topic class="fade-out" id="aufgabenstellung-2-semester"><h2>Aufgabenstellung 2. Semester</h2><p>Gegenstand der Portfolioaufgabe ist die Entwicklung eines verteilten Web-Spiels für mehrere Spieler.</p><p>Folgende Anforderungen sind zu erfüllen:</p><ld-story><ul class="incremental-list"><li><p>Ihr Projekt muss am Ende spielbar sein in dem Sinne, dass alle Kursteilnehmer die Möglichkeit haben gleichzeitig zu spielen; ggf. in mehreren Kleingruppen.</p></li><li><p>Das Spiel muss rundenbasiert sein.</p><ld-supplemental embed-in-document-flow=""><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Echtzeitspiele sind aufgrund der damit verbundenen Komplexität ausgeschlossen.</p></aside></ld-supplemental></li><li><p>Sie können sich - müssen aber nicht - von klassischen Brettspielen oder Kartenspielen inspirieren lassen. Es können aber auch neue Spiele entwickelt werden.</p><p>D. h. Die Wahl des Spieles ist weitgehend frei. <span class="emph">Poker und Uno sind jedoch ausgeschlossen</span>; triviale Spiele (z. B. Hangman oder Tic-Tac-Toe) sind auch ausgeschlossen. Darüber hinaus darf kein Spiel zweimal entwickelt werden.</p><p><span class="emph">Sprechen Sie sich frühzeitig mit Ihren Kommilitonen ab, um Überschneidungen zu vermeiden.</span></p></li><li><p>Die Entwicklung erfolgt in Gruppen von 3 Personen und muss immer einen Webclient und eine Serverkomponente umfassen.</p></li><li><p>Die eingesetzten Technologien sind auf JavaScript, CSS und HTML sowie ggf. Python oder Java für die Serverseite beschränkt. Ich empfehle einen JavaScript/TypeScript Einsatz auf beiden Seiten. Frameworks (z. B. Express.js und Socket.IO), um ggf. die Kommunikation zwischen Web-Client und Server zu vereinfachen, dürfen eingesetzt werden.</p></li><li><p>Die Webanwendung muss responsive sein und braucht nur auf den neuesten Browsern laufen: Safari, Chrome und Firefox. Die neuesten Web-Technologien sollen verwendet werden. Responsive bedeutet hier, dass die Anwendung mindestens auf Tablets und Desktop-Computern spielbar sein muss.</p></li><li><p>Das Spiel sollte Cheat-Prevention Mechanismen enthalten, damit es nicht möglich ist, durch Manipulation der Webanwendung zu betrügen.</p></li><li><p>Ein komplexes Rollen-/Sicherheitsmodell ist nicht erforderlich. Es muss jedoch möglich sein, dass Spieler sich mit einem Benutzernamen anmelden und dass die Spieler während des Spiels identifizierbar sind.</p></li><li><p>Bewertet wird die Qualität der Software, die Qualität der Dokumentation, die Qualität der Präsentationen und die Einhaltung der Anforderungen.</p></li></ul></ld-story></ld-topic>
<ld-topic class="fade-out" id="projektergebnisse-grobubersicht"><h2>Projektergebnisse (Grobübersicht)</h2><ol class="arabic"><li><p>Die gehaltenen Präsentationen (sowohl bzgl. des Projekts als auch die fachlichen Präsentationen) inkl. unterschriebener und abgearbeiteter Checkliste</p></li><li><p>Die Code Reviews</p></li><li><p>Code und Anwendung</p><ul class="simple"><li><p>Lauffähige Webanwendung mit allen Kernfunktionen</p></li><li><p>README mit Bau- und Installationsanleitung</p></li><li><p>API-Spezifikation bzw. Dokumentation der Schnittstellen zwischen Client und Server</p></li></ul></li><li><p>Dokument, das dokumentiert welche Team-Mitglieder welche Teile bearbeitet haben und mit welchem Anteil.</p><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Wenn Sie als Team bewertet werden möchten, dann teilen Sie mir dies bitte mit und vermerken es explizit in dem Dokument.</p></aside></li><li><p>Dokument bzgl. KI-Einsatz: Wo wurde welche KI wie eingesetzt. Wie war Ihre Erfahrung.</p></li></ol></ld-topic>
<ld-topic class="fade-out" id="zur-verfugung-gestellt-wird"><h2>Zur Verfügung gestellt wird</h2><p>Zugriff auf einem Server, der aus dem UNI Netz (ggf. mittels VPN) erreichbar ist. Gruppenzugänge werden noch eingerichtet.</p></ld-topic>
<ld-topic class="fade-out" id="vortragsthemen"><h2>Vortragsthemen</h2><ul class="incremental-list"><li><p>Alle Vorträge behandeln Themen, die für das Projekt direkt relevant sind.</p></li><li><p>Die Vorschläge zu den konkreten Inhalten der Vorträge sind als Anregung zu verstehen und kleinere Abweichungen sind ggf. möglich.</p></li><li><p>Führen Sie immer in das Thema ein und geben Sie auch praktische Beispiele, damit die Relevanz für die Projektarbeit klar wird. D. h. die Vorträge sollen einen hohen „Hands-on“-Anteil haben.</p></li><li><p><span class="emph">Sprechen Sie sich ggf. untereinander ab, damit die Vorträge nicht inhaltlich überlappen.</span></p></li><li><p>Beachten Sie die Hinweise zur <a class="reference external" href="https://delors.github.io/allg-vortraege/folien.de.md.html#slide-1">Vortragsgestaltung</a>.</p></li><li><p>Bitte beachten Sie die Zeitvorgaben.</p></li><li><aside class="admonition" data-theme="attention"><p class="admonition-title" data-theme="attention-header">Achtung!</p><p>Vorträge sind bis 6 Uhr Morgens am jeweiligen Vortragstag als PDF-Datei in Moodle hochzuladen.</p></aside></li></ul></ld-topic>
<ld-topic class="fade-out" id="vortragsthemen-frontend-entwicklung"><h2>Vortragsthemen - Frontend-Entwicklung</h2><ld-deck><ld-card><p><strong>CSS Grid Layout für Spieloberflächen</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>1 Person</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>10 Minuten</p></dd></dl><p><em>Inhalte:</em></p><ul class="simple"><li><p>CSS Grid Grundlagen und Terminologie</p></li><li><p>Responsive Spielfelder mit Grid</p></li><li><p>Praktische Beispiele: Kartenspiele, Brettspiele</p></li><li><p>Grid vs. Flexbox: Wann was verwenden?</p></li></ul></ld-card><ld-card class="incremental"><p><strong>CSS Animationen und Transitionen für Spiele</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>2 Personen</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>20 Minuten</p></dd></dl><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>CSS Transitions:</em></p><ul class="simple"><li><p>Grundlagen von Transitions</p></li><li><p>Animierte Spielelemente (Kartenbewegungen, Figurenbewegungen)</p></li><li><p>Performance-Aspekte</p></li><li><p>Best Practices für flüssige Animationen</p></li></ul></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><em>CSS Keyframe Animations:</em></p><ul class="simple"><li><p>@keyframes Syntax</p></li><li><p>Animation Timing Functions</p></li><li><p>Komplexe Animationsabläufe</p></li><li><p>Beispiele: Würfelwurf, Kartenausteilen</p></li></ul></ld-cell></ld-grid></ld-card><ld-card class="incremental"><p><strong>CSS Custom Properties und Design Systems</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>1 Person</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>10 Minuten</p></dd></dl><p><em>Inhalte:</em></p><ul class="simple"><li><p>CSS Variablen und CSS Properties (<code class="css">@property</code>) Grundlagen</p></li><li><p>Scope und Vererbung</p></li><li><p>Performance-Überlegungen</p></li><li><p>Design Tokens und konsistente Gestaltung</p></li></ul></ld-card><ld-card class="incremental"><p><strong>Responsive Design für Spiele</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>1 Person</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>10 Minuten</p></dd></dl><p><em>Inhalte:</em></p><ul class="simple"><li><p>Mobile-First vs. Desktop-First</p></li><li><p>Media Queries für verschiedene Geräte</p></li><li><p>Viewport-Units und Container Queries</p></li><li><p>Touch vs. Maus-Interaktion</p></li><li><p>Responsive Spielfelder und UI-Elemente</p></li></ul></ld-card><ld-card class="incremental"><p><strong>CSS Theming und Farbsysteme</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>1-2 Personen</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>10-20 Minuten</p></dd></dl><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>Moderne Color Spaces:</em></p><ul class="simple"><li><p>sRGB, Display P3, Lab, LCH</p></li><li><p>color-mix() Funktion</p></li><li><p>color-contrast() / contrast-color()</p></li><li><p>Barrierefreiheit bei Farbwahl</p></li></ul></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><em>Light/Dark Themes:</em></p><ul class="simple"><li><p>light-dark() Funktion</p></li><li><p>color-scheme Property</p></li><li><p>Theme-Switcher implementieren</p></li><li><p>CSS Custom Properties für Themes</p></li></ul></ld-cell></ld-grid></ld-card><ld-card class="incremental"><p><strong>Moderne UI-Komponenten mit HTML/CSS</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>1 Person</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>10 Minuten</p></dd></dl><p><em>Inhalte:</em></p><ul class="simple"><li><p>Dialog/Modal für Spielregeln und Einstellungen</p></li><li><p><em>Custom Buttons</em> und <em>Controls</em> (<code class="html"><span class="name tag"><span class="name tag"><span class="punctuation">&lt;</span>button</span><span class="punctuation">&gt;</span></span></code>, etc.)</p></li><li><p>Tooltips und <em>Notifications</em> (<code class="html">popover</code>, etc.)</p></li><li><p><em>Loading States</em> und <em>Progress Bars</em></p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic class="fade-out" id="vortragsthemen-javascript-fur-interaktive-spiele"><h2>Vortragsthemen - JavaScript für interaktive Spiele</h2><ld-deck><ld-card><p><strong>Grundlagen von modernem JavaScript (ES6+)</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>2 Personen</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>20 Minuten</p></dd></dl><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>ES6+ Grundlegende Features:</em></p><ul class="simple"><li><p>Arrow Functions</p></li><li><p>Destructuring</p></li><li><p>Spread/Rest Operator</p></li><li><p>Default Parameters</p></li></ul></ld-cell><ld-cell class="width-50" style="align-self:auto;"><p><em>ES6+Erweiterte Features:</em></p><ul class="simple"><li><p>Template Literals</p></li><li><p>Promises und async/await</p></li><li><p>Modules (import/export)</p></li><li><p>Array-Methoden (map, filter, reduce)</p></li></ul></ld-cell></ld-grid></ld-card><ld-card class="incremental"><p><strong>JavaScript Event Handling für Spiele</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>1 Person</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>10 Minuten</p></dd></dl><p><em>Inhalte:</em></p><ul class="simple"><li><p>Event Delegation</p></li><li><p>Keyboard Events für Spiele</p></li><li><p>Touch Events für Mobile</p></li><li><p>Event-Loop und Performance</p></li></ul></ld-card><ld-card class="incremental"><p><strong>DOM-Manipulation und Virtual DOM Konzepte</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>1 Person</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>10 Minuten</p></dd></dl><p><em>Inhalte:</em></p><ul class="simple"><li><p>Effiziente DOM-Updates</p></li><li><p>DocumentFragment</p></li><li><p>Template-Element</p></li><li><p>Shadow DOM Grundlagen</p></li><li><p>Performance-Best-Practices</p></li></ul></ld-card><ld-card class="incremental"><p><strong>JavaScript State Management</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>1 Person</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>10 Minuten</p></dd></dl><p><em>Inhalte:</em></p><ul class="simple"><li><p>Lokales State Management</p></li><li><p>State-Patterns für Spiele</p></li><li><p>Immutability</p></li><li><p>State Synchronisation Client/Server</p></li><li><p>Observer Pattern</p></li></ul></ld-card><ld-card class="incremental"><p><strong>JavaScript Error Handling und Debugging</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>1 Person</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>10 Minuten</p></dd></dl><p><em>Inhalte:</em></p><ul class="simple"><li><p>try/catch Best Practices</p></li><li><p>Browser DevTools für Debugging</p></li><li><p>Error Boundaries</p></li><li><p>Logging-Strategien</p></li></ul></ld-card><ld-card class="incremental"><p><strong>Browser Storage APIs</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>1 Person</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>10 Minuten</p></dd></dl><p><em>Inhalte:</em></p><ul class="simple"><li><p>LocalStorage vs. SessionStorage</p></li><li><p>[IndexedDB Grundlagen]</p></li><li><p>Speichern von Spielständen</p></li><li><p>Cache API</p></li><li><p>Privacy-Aspekte</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic class="fade-out" id="vortragsthemen-client-server-kommunikation"><h2>Vortragsthemen - Client-Server-Kommunikation</h2><ld-deck><ld-card><p><strong>API Design</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>1 Person</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>10 Minuten</p></dd></dl><p><em>Inhalte:</em></p><ul class="simple"><li><p>HTTP Methoden (GET, POST)</p></li><li><p>Status Codes</p></li><li><p>URL-Design für Spiel-APIs</p></li><li><p>Request/Response Format (JSON)</p></li><li><p>API-Dokumentation</p></li></ul></ld-card><ld-card class="incremental"><p><strong>Fetch API und AJAX</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>1 Person</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>10 Minuten</p></dd></dl><p><em>Inhalte:</em></p><ul class="simple"><li><p>Fetch API Grundlagen</p></li><li><p>Promises und async/await mit Fetch</p></li><li><p>Request/Response Handling</p></li><li><p>Error Handling</p></li><li><p>CORS-Problematik</p></li></ul></ld-card><ld-card class="incremental"><p><strong>WebSockets Grundlagen</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>1 Person</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>10 Minuten</p></dd></dl><p><em>Inhalte:</em></p><ul class="simple"><li><p>WebSocket Protokoll</p></li><li><p>Native WebSocket API</p></li><li><p>Connection Lifecycle</p></li><li><p>Heartbeats und Reconnection</p></li><li><p>Wann WebSockets vs. HTTP</p></li></ul></ld-card><ld-card class="incremental"><p><strong>Socket.IO für Bidirektionale Echtzeitkommunikation</strong></p><dl class="field-list simple"><dt>Personen<span class="colon">:</span></dt><dd><p>2 Personen</p></dd><dt>Dauer<span class="colon">:</span></dt><dd><p>20 Minuten</p></dd></dl><ld-grid class="default-layout"><ld-cell class="width-50" style="align-self:auto;"><p><em>Socket.IO Basics</em></p><ul class="simple"><li><p
