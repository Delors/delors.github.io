<style>/* ---------------------------------------------------------------------------
   Shared classes for the SVG drawings of LectureDoc2 decks.

   Include with `ld.include-styles` (in a project: in `myst.yml`, together with
   `ld-svg-defs.svg` in `ld.include-globals`). Documentation:
   LectureDoc2Author/docs-svgs.md; the colour model: LectureDoc2/SVGs.md.

   - Opt-in only: every rule needs an `ld-` class and matches only inside an
     <svg>. Nothing here styles `line`, `path` or `text` as such, so drawings
     that do not use the classes are unaffected.
   - Everything paints with `currentColor`. The colour modifiers (`ld-muted`,
     `ld-accent`, ...) only set `color`, so they work on a single element as
     well as on a <g> or the root <svg>, and they follow the surrounding
     [data-theme] (admonitions!).
   - Lengths are in `em`, i.e. relative to the drawing's font-size. A drawing
     that sets the size of a normal label as `font-size` on its root gets
     stroke widths and dash patterns that match every other drawing.
   - All rules sit in the cascade layer `ld-svg`. A deck's own CSS is not
     layered and therefore always wins, whatever its specificity.
   --------------------------------------------------------------------------- */

@layer ld-svg {
    /* ---- colour modifiers ------------------------------------------------ */

    svg.ld-muted,
    svg .ld-muted {
        color: var(--muted-color);
    }
    svg.ld-accent,
    svg .ld-accent {
        color: var(--accent-color);
    }
    svg.ld-danger,
    svg .ld-danger {
        color: var(--danger-color);
    }
    svg.ld-success,
    svg .ld-success {
        color: var(--success-color);
    }
    svg.ld-info,
    svg .ld-info {
        color: var(--info-color);
    }
    svg.ld-warning,
    svg .ld-warning {
        color: var(--warning-color);
    }

    /* ---- lines ----------------------------------------------------------- */

    svg .ld-line,
    svg .ld-connector {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }

    /* A line with an arrowhead (ld-svg-defs.svg). The tip lies
       1.5 x stroke-width beyond the line's end point. */
    svg .ld-connector {
        marker-end: url(#ld-arrow);
    }

    /* A marker is coloured where it is defined, not where it is used; the
       modifiers therefore also have to switch the marker. Put the modifier on
       the connector itself or on its closest group. */
    :is(svg.ld-muted, svg .ld-muted) .ld-connector,
    svg .ld-connector.ld-muted {
        marker-end: url(#ld-arrow-muted);
    }
    :is(svg.ld-accent, svg .ld-accent) .ld-connector,
    svg .ld-connector.ld-accent {
        marker-end: url(#ld-arrow-accent);
    }
    :is(svg.ld-danger, svg .ld-danger) .ld-connector,
    svg .ld-connector.ld-danger {
        marker-end: url(#ld-arrow-danger);
    }
    :is(svg.ld-success, svg .ld-success) .ld-connector,
    svg .ld-connector.ld-success {
        marker-end: url(#ld-arrow-success);
    }
    :is(svg.ld-info, svg .ld-info) .ld-connector,
    svg .ld-connector.ld-info {
        marker-end: url(#ld-arrow-info);
    }
    :is(svg.ld-warning, svg .ld-warning) .ld-connector,
    svg .ld-connector.ld-warning {
        marker-end: url(#ld-arrow-warning);
    }

    svg .ld-dashed {
        stroke-dasharray: 0.4em 0.25em;
    }
    svg .ld-dotted {
        stroke-dasharray: 0 0.25em;
        stroke-linecap: round;
    }

    /* ---- shapes ---------------------------------------------------------- */

    svg .ld-box {
        fill: none;
        stroke: currentColor;
        stroke-width: 0.1em;
    }
    /* Three fill levels of the current colour: background region, element,
       emphasised element. They stack: a cell on a panel is darker still. */
    svg .ld-panel {
        fill: currentColor;
        fill-opacity: 0.1;
    }
    svg .ld-cell {
        fill: currentColor;
        fill-opacity: 0.3;
    }
    svg .ld-highlight {
        fill: currentColor;
        fill-opacity: 0.65;
    }

    /* ---- text ------------------------------------------------------------ */

    svg .ld-label {
        fill: currentColor;
    }
    /* Text on a filled shape (e.g. on an ld-highlight). */
    svg .ld-label-on-fill {
        fill: var(--background-color);
    }
    /* Deliberately no `text-anchor` here: on a <tspan> in the middle of a
       line it would re-anchor that chunk. Centre on the <text> or the <g>. */
    svg .ld-mono {
        font-family: var(--monospaced-font-family);
    }
}
</style>

<body data-theme="<light-dark>">
<ld-globals><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<!--
    Shared definitions for the SVG drawings of LectureDoc2 decks.

    Include this file ONCE per document with `ld.include-globals` (in a project:
    in `myst.yml`, together with `ld-svg.css` in `ld.include-styles`). It is put
    verbatim into <ld-globals>; every drawing inlined with {include-svg} can
    then use the markers with `marker-end="url(#ld-arrow)"`.

    Documentation: LectureDoc2Author/docs-svgs.md (catalog and usage) and
    LectureDoc2/SVGs.md (why shared definitions live in <ld-globals>).

    All markers follow the same rules:

    - markerUnits="strokeWidth": a marker scales with the line it sits on.
    - orient="auto-start-reverse": used as `marker-start`, an arrowhead points
      backwards - one marker also draws a double-headed arrow.
    - The outermost painted point lies exactly 1.5 x stroke-width beyond the
      end point of the line. To let a tip touch a target, end the line
      1.5 x stroke-width before it. The line's own (butt) end is hidden under
      the head: 1.5 x stroke-width before the tip the head is already wider
      than the line.
    - Colour: `currentColor`, resolved at the DEFINITION site. <ld-globals> is
      a child of <body>, which carries [data-theme] and therefore
      `color: var(--color)` - so the plain markers have the deck's foreground
      colour. The coloured variants set `color` to a theme variable on the
      <marker> itself. Neither `light-dark()` (follows the OS only) nor
      `context-stroke` (not implemented in WebKit) is used; see SVGs.md.
    - A marker takes the colour of <body>, not of the admonition a drawing
      sits in. Inside an admonition with its own theme, prefer a variant.
-->
<defs>

    <!-- Filled arrowhead: 6 long, 5 wide; tip at +1.5, back at -4.5. -->
    <marker id="ld-arrow" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- The same arrowhead in the theme's semantic colours. -->
    <marker id="ld-arrow-muted" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--muted-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-accent" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--accent-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-danger" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--danger-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-success" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--success-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-info" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--info-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>
    <marker id="ld-arrow-warning" viewBox="-4.5 -2.5 6 5" refX="0" refY="0"
            markerWidth="6" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" style="color: var(--warning-color)">
        <path d="M -4.5 -2.5 L 1.5 0 L -4.5 2.5 Z" fill="currentColor" />
    </marker>

    <!-- Open arrowhead (chevron), same opening angle as ld-arrow. The mitred
         vertex sits at +0.2; the mitre reaches +1.5. -->
    <marker id="ld-arrow-open" viewBox="-5 -2.5 6.5 5" refX="0" refY="0"
            markerWidth="6.5" markerHeight="5" markerUnits="strokeWidth"
            orient="auto-start-reverse" overflow="visible">
        <path d="M -4.3 -1.875 L 0.2 0 L -4.3 1.875" fill="none"
              stroke="currentColor" stroke-width="1"
              stroke-linejoin="miter" stroke-miterlimit="4" />
    </marker>

    <!-- Dot, centred on the end point (e.g. the start of a flow). -->
    <marker id="ld-dot" viewBox="-1.5 -1.5 3 3" refX="0" refY="0"
            markerWidth="3" markerHeight="3" markerUnits="strokeWidth">
        <circle r="1.5" fill="currentColor" />
    </marker>

</defs>
</svg>
</ld-globals>

<ld-topic id="lecture-ds-introduction_to_rest"><h1 class="title">RESTful Web Services</h1><p>A brief introduction.</p><dl class="field-list simple"><dt>Dozent<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/cv/folien.de.md.html">Prof. Dr. Michael Eichberg</a></p></dd><dt>Kontakt<span class="colon">:</span></dt><dd><p><a class="reference external" href="mailto:michael.eichberg@dhbw.de">michael.eichberg@dhbw.de</a></p></dd><dt>Version<span class="colon">:</span></dt><dd><p>1.0.0.1</p></dd><dt>Quelle<span class="colon">:</span></dt><dd><p>RESTful Web Services; Leonard Richardson &#x26; Sam Ruby; O'Reilly</p></dd></dl><ld-supplemental><dl class="field-list"><dt>Slides/Script<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://delors.github.io/ds-introduction_to_rest/folien.en.md.html">https://delors.github.io/ds-introduction_to_rest/folien.en.md.html</a></p><p><a class="reference external" href="https://delors.github.io/ds-introduction_to_rest/folien.en.md.html.pdf">https://delors.github.io/ds-introduction_to_rest/folien.en.md.html.pdf</a></p></dd><dt>Reporting errors<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://github.com/Delors/delors.github.io/issues">https://github.com/Delors/delors.github.io/issues</a></p></dd></dl><dl class="field-list simple"><dt>AI Usage<span class="colon">:</span></dt><dd><p>AI assistants (in particular Claude, but also ChatGPT, Ollama with
Gemma/LLama/Qwen, OpenCode with Kimi, etc.) were used to assist in the
creation of the slides. This was done, for example, to efficiently generate
graphics (i.e. SVG files), or to generate summary tables. Furthermore, AI was
used for general quality assurance. Content that may have been suggested by
an AI was explicitly validated and adapted whenever it was incorporated.</p></dd></dl></ld-supplemental></ld-topic>
<ld-topic id="what-is-a-web-service-in-the-context-of-restful-web-services"><h2>What is a <em>Web Service</em> in the context of RESTful Web Services?</h2><p class="rubric">Traditional view</p><p>A <em>Web Service</em> is simply a web page that can be requested and processed by a computer.</p><div class="incremental"><p>A <em>Web Service</em> is a "web page" that is to be consumed by an <em>autonomous programme</em> - as opposed to a web browser or similar UI tool.</p></div><ld-supplemental><img class="box-shadow align-center" src="book-restful_web_services.webp" alt="RESTful Web Services"></ld-supplemental></ld-topic>
<ld-topic id="rest"><h2>REST<a class="brackets" href="#footnote-1" id="footnote-reference-1" role="doc-noteref"><span class="fn-bracket">[</span>1<span class="fn-bracket">]</span></a></h2><ul><li><p>REST = Representational State Transfer</p><p>(Essentially a set of design principles for judging architecture; <strong>an architectural style</strong>).</p></li><li><p>Resources are identified by uniform resource identifiers (URIs)</p></li><li><p>Resources are manipulated by their representations</p></li><li><p>Messages are self-describing and stateless</p></li></ul><div class="peripheral incremental"><p>Of secondary importance:</p><ul class="simple"><li><p>Multiple representations are accepted or sent</p></li><li><p>"Hypertext" represents the application state</p></li></ul></div><aside class="footnote-list brackets"><aside class="footnote brackets" id="footnote-1" role="doc-footnote"><span class="label"><span class="fn-bracket">[</span><a role="doc-backlink" href="#footnote-reference-1">1</a><span class="fn-bracket">]</span></span><p>REST was described by Roy Fielding in his dissertation.</p></aside></aside></ld-topic>
<ld-topic id="a-possible-architecture-for-restful-web-services"><h2>A possible architecture for RESTful web services</h2><div class="foundations"><p><strong>Resource-oriented Architecture (ROA)</strong></p><ul><li><p>Information about the method is included in the HTTP method.</p></li><li><p>Scoping information is included in the URI.</p><p>(I. e. which data is affected.)</p></li></ul></div><p class="rubric">REST-Style</p><ul class="simple"><li><p>Client-server</p></li><li><p>stateless</p></li><li><p><span class="peripheral">Cached</span></p></li><li><p>Uniform Interface (HTTP Methods)</p></li><li><p>Multi-layered system</p></li></ul></ld-topic>
<ld-topic id="restful-web-services-foundations"><h2>RESTful Web Services - Foundations</h2><dl class="incremental-list field-list"><dt>HTTP<span class="colon">:</span></dt><dd><p>the underlying stateless transport protocol:</p><p>Essential methods:</p><dl class="field-list simple"><dt>GET<span class="colon">:</span></dt><dd><p>sideeffect-free requests for information</p></dd><dt>POST<span class="colon">:</span></dt><dd><p>adding new information (without specifying the target URI)</p></dd><dt>PUT<span class="colon">:</span></dt><dd><p>idempotent update or creation of new information at the given URI</p></dd><dt>DELETE<span class="colon">:</span></dt><dd><p>idempotent deletion of information</p></dd></dl></dd><dt>URI<span class="colon">:</span></dt><dd><p>used to find resources</p></dd><dt>Representation<span class="colon">:</span></dt><dd><p><strong>JSON</strong>, XML, SVG, WebP, XML, ...</p></dd></dl></ld-topic>
<ld-topic id="two-types-of-state"><h2>Two Types of State</h2><ld-deck class="numbered"><ld-card><p class="rubric">Application State / Session State</p><ul><li><p>"State" refers to Application-/Session State</p><p>The application state is the information necessary to understand the context of an interaction</p></li></ul><p><span class="peripheral">Authorization and authentication information are examples of application state.</span></p><ul class="simple"><li><p>Maintained as part of the content transmitted from the client to the server and back to the client. I. e. the client manages the application state.</p></li><li><p>Thus, any server can potentially resume the transaction at the point where it was interrupted.</p></li></ul></ld-card><ld-card class="incremental"><p class="rubric">Resource State</p><ul class="simple"><li><p>The resource state is the type of state that the <em>S</em> in <em>REST</em> refers to.</p></li><li><p>The <em>stateless</em> restriction means that all messages must contain the entire application state (i. e. we effectively have no sessions).</p></li></ul></ld-card></ld-deck></ld-topic>
<ld-topic id="multiple-representations"><h2>Multiple representations</h2><ul><li><p>Most resources only have a single representation.</p></li><li><p>REST can support any media type; JSON is the standard.</p><p>(HTTP supports content negotiation.)</p></li><li><p><span class="peripheral">Links can be embedded and reflect the structure with which a user can navigate through an application.</span></p></li></ul></ld-topic>
<ld-topic id="simple-first-tests-for-restfulness"><h2>Simple/first tests for RESTfulness</h2><ul class="simple"><li><p>Can I use a GET to retrieve the URLs I have POSTed to?</p></li><li><p>Would the client notice if the server...</p><ul class="simple"><li><p>is restarted at any point between requests</p></li><li><p>is reinitialized when the client makes the next request.</p></li></ul></li></ul></ld-topic>
<ld-topic id="resource-modelling"><h2>Resource modelling</h2><ul class="simple"><li><p>organize the application into URI-addressable resources (discrete resources should have their own stable URIs).</p></li><li><p>use only the standard HTTP messages - GET, PUT, POST, DELETE and <span class="peripheral">PATCH</span> - to provide the full capabilities of the application</p></li></ul><ld-supplemental><p class="rubric">HTTP methods</p><p><strong>GET</strong> is used to query resources.</p><p><strong>PUT</strong> is used to create a resource or update it if you know the URI.</p><p><strong>POST</strong> is used to create a new resource. The response should then contain the URI of the created resource.</p><p><strong>DELETE</strong> deletes the specified resource.</p><p>The difference between <strong>PUT</strong> and <strong>POST</strong> is that <strong>PUT</strong> is idempotent: a single or repeated calls have the same effect (i. e. a repeated call has no side effect), while successive identical <strong>POST</strong> calls can have additional effects, such as the repeated transfer of an order/the repeated creation of a message.</p><p>A <strong>PATCH</strong> request is regarded as a set of instructions for changing a resource. In contrast, a PUT request is a complete representation of a resource.</p></ld-supplemental></ld-topic>
<ld-topic id="example-application-del-icio-us"><h2>Example Application del.icio.us</h2><ld-supplemental><dl class="field-list simple"><dt>Quelle<span class="colon">:</span></dt><dd><p><a class="reference external" href="https://www.peej.co.uk/articles/restfully-delicious.html">https://www.peej.co.uk/articles/restfully-delicious.html</a></p></dd></dl></ld-supplemental><p><strong>del.icio.us enables us:</strong></p><ul class="simple"><li><p>to get a list of all our bookmarks and filter this list by tags or date and to limit the number of retrieved bookmarks</p></li><li><p>to retrieve the number of bookmarks created on different days</p></li><li><p>to retrieve when we last updated our bookmarks</p></li><li><p>to retrieve a list of all our markers</p></li><li><p>to add a bookmark</p></li><li><p>to edit a bookmark</p></li><li><p>to delete a bookmark</p></li><li><p>to rename a bookmark</p></li></ul></ld-topic>
<ld-topic id="example-application-del-icio-us-resources"><h2>Example Application del.icio.us: Resources</h2><dl class="field-list simple"><dt>Bookmarks<span class="colon">:</span></dt><dd><p><span class="docutils literal">http://del.icio.us/api/[username]/bookmarks</span></p></dd><dt>Tags<span class="colon">:</span></dt><dd><p><span class="docutils literal">http://del.icio.us/api/[username]/tags</span></p></dd><dt>[username]<span class="colon">:</span></dt><dd><p>is the username of the user whose bookmarks we are interested in</p></dd></dl></ld-topic>
<ld-topic id="example-application-del-icio-us-reprasentation-von-ressourcen"><h2>Example Application del.icio.us: Repräsentation von Ressourcen</h2><p>We define (in this example) some XML document formats and media types to identify them:</p><table class="highlight-line-on-hover"><thead><tr><th class="head"><p>Mediatype</p></th><th class="head"><p>Description</p></th></tr></thead><tbody><tr><td><p>delicious/bookmarks+xml</p></td><td><p>list of bookmarks</p></td></tr><tr><td><p>delicious/bookmark+xml</p></td><td><p>one bookmark</p></td></tr><tr><td><p>delicious/bookmarkcount+xml</p></td><td><p>number of bookmarks per tag</p></td></tr><tr><td><p>delicious/update+xml</p></td><td><p>time at which the bookmarks were last updated</p></td></tr><tr><td><p>delicious/tags+xml</p></td><td><p>list of tags</p></td></tr><tr><td><p>delicious/tag+xml</p></td><td><p>a tag</p></td></tr></tbody></table></ld-topic>
<ld-topic id="example-application-del-icio-us-query-bookmarks"><h2>Example Application del.icio.us: Query Bookmarks</h2><dl class="field-list"><dt>URL<span class="colon">:</span></dt><dd><p><span class="docutils literal">http://del.icio.us/api/[username]/bookmarks/</span></p></dd><dt>Method<span class="colon">:</span></dt><dd><p>GET</p></dd><dt>Querystring<span class="colon">:</span></dt><dd><p>tag =	Filter by tag</p><p>dt =	Filter by date</p><p>start =	The number of the first returned bookmark</p><p>end =	The number of the last returned bookmark</p></dd><dt>Return value<span class="colon">:</span></dt><dd><p>200 OK &#x26; XML (delicious/bookmarks+xml)</p><p>401 Unauthorized</p><p>404 Not Found</p></dd></dl></ld-topic>
<ld-topic id="example-application-del-icio-us-query-bookmarks-example-response"><h2>Example application del.icio.us: Query bookmarks - example response</h2><p><span class="docutils literal">GET http://del.icio.us/api/peej/bookmarks/?start=1&#x26;end=2</span></p><pre class="code xml literal-block"><small class="ln"> 1</small><code data-lineno=" 1"><span class="comment preproc">&lt;?xml version="1.0"?&gt;</span>
</code><small class="ln"> 2</small><code data-lineno=" 2">&lt;bookmarks start="1" end="2"

</code><small class="ln"> 4</small><code data-lineno=" 4">    &lt;bookmark url="http://www.example.org/one" tags="example,test"
</code><small class="ln"> 5</small><code data-lineno=" 5">        href="http://del.icio.us/api/peej/bookmarks/a211528fb5108cddaa4b0d3aeccdbdcf"

</code><small class="ln"> 8</small><code data-lineno=" 8">    <span class="name tag"><span class="name tag"><span class="punctuation">&lt;/</span>bookmark</span><span class="punctuation">&gt;</span></span>
</code><small class="ln"> 9</small><code data-lineno=" 9">    &lt;bookmark url="http://www.example.org/two" tags="example,test"
</code><small class="ln">10</small><code data-lineno="10">        href="http://del.icio.us/api/peej/bookmarks/e47d06a59309774edab56813438bd3ce"
</code><small class="ln">11</small><code data-lineno="11">        time="2005-10-21T19:34:16Z"&gt;
</code><small class="ln">12</small><code data-lineno="12">        Another example of a Delicious bookmark
